rolą masy.<\/p>\n<\/section>\n<section id=\"doswiadczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">21<\/span> Doświadczenia modelowe <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-error\">\n<span class=\"card-label\">BHP — czego nie robić w domu<\/span>\n<p>Równań z tej lekcji <strong>nie traktuj jako instrukcji domowych<\/strong>. Nie ogrzewaj HgO, nie otrzymuj CO, SO₂ ani NO₂, nie wykonuj termitu i nie pracuj z P₄O₁₀ bez laboratorium i nadzoru nauczyciela.<\/p>\n<p>Reakcja żelaza z parą wodną wymaga wysokiej temperatury, a wydzielający się wodór jest palny.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Format stały<\/span>\n<p>Problem → Hipoteza → Sprzęt → Przebieg → <strong>Obserwacja<\/strong> → <strong>Wniosek<\/strong> → Równanie → BHP<\/p>\n<p class=\"mini-note\">Obserwacja = to, co rejestrują zmysły; wniosek = interpretacja (nazwa produktu, typ reakcji). Tabela różnic — na końcu sekcji.<\/p>\n<\/div>\n<h3>Doświadczenie 1: Spalanie magnezu<\/h3>\n<div class=\"card\">\n<p><strong>Problem:<\/strong> Czy magnez reaguje z tlenem?<\/p>\n<p><strong>Hipoteza:<\/strong> Powstanie biały proszek — tlenek magnezu.<\/p>\n<p><strong>Sprzęt:<\/strong> wstążka magnezowa, szczypce, palnik.<\/p>\n<p><strong>Przebieg:<\/strong> wstążkę magnezu trzymaną w szczypcach zapal w płomieniu palnika i trzymaj nad płytką ceramiczną.<\/p>\n<p><strong>Obserwacja:<\/strong> oślepiający biały płomień; biały proszek.<\/p>\n<p><strong>Wniosek:<\/strong> Magnez spala się w tlenie, tworząc MgO.<\/p>\n<p><strong>Równanie:<\/strong> <span class=\"formula\" data-rx=\"mgO2\">2 Mg + O₂ → 2 MgO<\/span><\/p>\n<p><strong>BHP:<\/strong> nie patrzeć bezpośrednio na płomień; okulary.<\/p>\n<button class=\"che-prac-go\" data-k=\"mgO2\" data-prac=\"n01-spalanie-v01\" type=\"button\">Zobacz w modelu spalania (GFX)<\/button><\/div>\n<h3>Doświadczenie 2: CaO + H₂O (gaszenie wapna)<\/h3>\n<div class=\"card\">\n<p><strong>Problem:<\/strong> Czy CaO reaguje z wodą?<\/p>\n<p><strong>Hipoteza:<\/strong> Powstanie Ca(OH)₂; roztwór zasadowy.<\/p>\n<p><strong>Sprzęt:<\/strong> CaO, woda, papierek uniwersalny, fenoloftaleina.<\/p>\n<p><strong>Przebieg:<\/strong> do parownicy z kilkoma grudkami CaO wkraplaj wodę; po reakcji dolej wody, wymieszaj, zbadaj papierkiem uniwersalnym i fenoloftaleiną.<\/p>\n<p><strong>Obserwacja:<\/strong> silne rozgrzanie, syczenie; papierek niebieski; fenoloftaleina malinowa.<\/p>\n<p><strong>Wniosek:<\/strong> CaO reaguje z wodą; powstaje Ca(OH)₂.<\/p>\n<p><strong>Równanie:<\/strong> <span class=\"formula\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/span><\/p>\n<p><strong>BHP:<\/strong> nie dotykać CaO mokrymi rękami; okulary; reakcja egzotermiczna.<\/p>\n<button class=\"che-prac-go\" data-k=\"caoH2o\" data-prac=\"n01-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<h3>Doświadczenie 3: Woda wapienna + CO₂<\/h3>\n<div class=\"card\">\n<p><strong>Problem:<\/strong> Jak wykryć CO₂?<\/p>\n<p><strong>Hipoteza:<\/strong> CO₂ mętni wodę wapienną.<\/p>\n<p><strong>Sprzęt:<\/strong> woda wapienna Ca(OH)₂, rurka, probówka.<\/p>\n<p><strong>Przebieg:<\/strong> przez rurkę wprowadzaj badany gaz (np. wydychane powietrze albo gaz z reakcji węglanu z kwasem) do probówki z klarowną wodą wapienną.<\/p>\n<p><strong>Obserwacja:<\/strong> mętnienie wody wapiennej (biały osad).<\/p>\n<p><strong>Wniosek:<\/strong> CO₂ reaguje z Ca(OH)₂ → CaCO₃.<\/p>\n<p><strong>Równanie:<\/strong> <span class=\"formula\" data-rx=\"caoh2Co2\">CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O<\/span>. Osad CaCO₃ jest biały i praktycznie nierozpuszczalny w wodzie. Przy <strong>dużym nadmiarze CO₂<\/strong> osad może zniknąć: CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂ (roztwór klarowny).<\/p>\n<p><strong>BHP:<\/strong> nie wciągać wody wapiennej do ust.<\/p>\n<button class=\"che-prac-go\" data-k=\"caoh2Co2\" data-prac=\"n01-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<h3>Doświadczenie 4: CuO + H₂SO₄ <span class=\"level-badge level-basic\">E8<\/span><\/h3>\n<div class=\"card\">\n<p><strong>Problem:<\/strong> Czy CuO reaguje z kwasem?<\/p>\n<p><strong>Hipoteza:<\/strong> Powstanie niebieski roztwór CuSO₄.<\/p>\n<p><strong>Sprzęt:<\/strong> CuO (czarny), H₂SO₄ (rozcieńczony), probówka.<\/p>\n<p><strong>Przebieg:<\/strong> do probówki z odrobiną czarnego CuO dodaj rozcieńczony H₂SO₄ i lekko ogrzej (uchwyt, wylot probówki skierowany od siebie i od innych).<\/p>\n<p><strong>Obserwacja:<\/strong> czarny CuO znika; powstaje niebieski roztwór.<\/p>\n<p><strong>Wniosek:<\/strong> CuO (tlenek zasadowy) reaguje z kwasem; powstaje sól — siarczan(VI) miedzi(II) — i woda; niebieską barwę nadają jony Cu²⁺.<\/p>\n<p><strong>Równanie:<\/strong> <span class=\"formula\" data-rx=\"cuoH2so4\">CuO + H₂SO₄ → CuSO₄ + H₂O<\/span><\/p>\n<p><strong>BHP:<\/strong> okulary; H₂SO₄ żrący.<\/p>\n<button class=\"che-prac-go\" data-k=\"cuoH2so4\" data-prac=\"n01-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n01-doswiadczenia-v01\"><button data-che-open-viz=\"n01-doswiadczenia-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n01-doswiadczenia-v01',lessonId:'N01'},'*')\" type=\"button\"><b>Pracownia: doświadczenia z tlenkami — zlewka, równania, obserwacje, BHP<\/b><span>GFX.rx · CHE.REACTION · CHE.IONIC · 22 doświadczenia<\/span><\/button><\/div><div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-carbonate\"><button data-che-open-viz=\"gfx-scene-carbonate\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-carbonate',lessonId:'N01'},'*')\" type=\"button\"><b>Wykrywanie CO₂: węglan + kwas → gaz → woda wapienna mętnieje<\/b><span>Scena GFX<\/span><\/button><\/div>\n<h3>Obserwacja ≠ wniosek<\/h3>\n<div class=\"card card-error\">\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Obserwacja (zmysły)<\/th><th>Wniosek (interpretacja)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Roztwór mętnieje<\/td><td>Powstaje osad CaCO₃; obecny CO₂<\/td><\/tr>\n<tr><td>Naczynie jest gorące<\/td><td>Reakcja egzotermiczna<\/td><\/tr>\n<tr><td>Pojawiają się pęcherzyki<\/td><td>Wydziela się gaz<\/td><\/tr>\n<tr><td>Roztwór zmienia barwę na niebieską<\/td><td>Powstał jon Cu²⁺ (np. CuSO₄)<\/td><\/tr>\n<tr><td>Czarny osad znika<\/td><td>CuO przereagował; powstał CuSO₄<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p><strong>Nie pisz w obserwacji:<\/strong> „powstał CaCO₃”, „zachodzi redoks”, „wydziela się H₂” — to wnioski, dopóki nie zidentyfikujesz substancji.<\/p>\n<\/div>\n<\/section>\n<section id=\"klinika\">\n<div class=\"part-heading\"><span class=\"part-num\">22<\/span> Klinika błędów<\/div>\n<div class=\"table-wrap\">\n<table class=\"klinika-table\">\n<thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">FeO₃<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">Fe₂O₃ — tlenek żelaza(III)<\/td><td data-label=\"Dlaczego\">Dla Fe(III) i O(II) W–K–S–K daje Fe₂O₃. W typowych zadaniach szkolnych żelazo występuje głównie na +II i +III.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„tlenek żelaza” bez cyfry<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">tlenek żelaza(II) lub (III)<\/td><td data-label=\"Dlaczego\">Fe ma zmienną wartościowość.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Ca₂O₂<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">CaO<\/td><td data-label=\"Dlaczego\">Skróć do najprostszego stosunku.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">SO₃ + H₂O → H₂SO₃<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">SO₃ + H₂O → H₂SO₄<\/td><td data-label=\"Dlaczego\">SO₃ to tlenek siarki(VI).<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">CO₂ zasadowy<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">CO₂ kwasowy<\/td><td data-label=\"Dlaczego\">Niemetal → zwykle kwasowy.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">MgO + H₂O „łatwo”<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">praktycznie nie<\/td><td data-label=\"Dlaczego\">Nie mylić z CaO.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Al₂O₃ tylko zasadowy<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">amfoteryczny<\/td><td data-label=\"Dlaczego\">Reaguje z kwasem i zasadą.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Mn₂O₇ zasadowy<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">kwasowy<\/td><td data-label=\"Dlaczego\">Wysoki stopień utlenienia metalu.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Każdy tlenek metalu reaguje z wodą”<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">tylko niektóre tlenki zasadowe<\/td><td data-label=\"Dlaczego\">CuO, Fe₂O₃, Al₂O₃ praktycznie nie.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„OF₂ to tlenek”<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">fluorek tlenu<\/td><td data-label=\"Dlaczego\">Fluor elektroujemniejszy niż tlen.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„H₂O₂ — tlen na −II”<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">tlen na −I<\/td><td data-label=\"Dlaczego\">Nadtlenek — wiązanie O–O.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Fe₃O₄ — Fe na +II”<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">tlenek mieszany Fe(II,III)<\/td><td data-label=\"Dlaczego\">Średni stopień +8/3.<\/td><\/tr>\n\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">CO — tlenek kwasowy jak CO₂<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">obojętny (szkolnie)<\/td><td data-label=\"Dlaczego\">Nie tworzy kwasu z wodą ani soli z zasadą w warunkach szkolnych.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">SiO₂ + H₂O → H₂SiO₃ (jak SO₃)<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">SiO₂ z wodą praktycznie nie reaguje<\/td><td data-label=\"Dlaczego\">Sieć kowalencyjna; reaguje z mocną zasadą po ogrzaniu.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">CO₂ + NaOH zawsze → Na₂CO₃<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">przy nadmiarze CO₂ → NaHCO₃<\/td><td data-label=\"Dlaczego\">Produkt zależy od stosunku molowego substratów.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">P₂O₅ i P₄O₁₀ to różne substancje<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">ta sama substancja<\/td><td data-label=\"Dlaczego\">Wzór empiryczny vs wzór cząsteczkowy.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Obserwacja: „powstał CaCO₃”<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">Obserwacja: woda wapienna mętnieje<\/td><td data-label=\"Dlaczego\">Nazwa produktu to wniosek, nie obserwacja.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/section>\n<section id=\"cwiczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">23<\/span> Ćwiczenia<\/div>\n<details class=\"answer interleaving\">\n<summary>Trening mieszany (3 min) — tlenki + fundamenty<\/summary>\n<ol>\n<li>Ile elektronów walencyjnych ma O? <em>(F01–F09 (fundamenty))<\/em><\/li>\n<li>Jaki charakter ma zwykle SO₂? <em>(N01)<\/em><\/li>\n<li>Zapisz wzór tlenku glinu (W–K–S–K). <em>(N01)<\/em><\/li>\n<li>CaO + H₂O → ? <em>(most N02)<\/em><\/li>\n<li>Czy MgO silnie reaguje z wodą jak CaO? <em>(N01)<\/em><\/li>\n<\/ol>\n<p class=\"mini-note\">Sprawdź w sekcjach wyżej / F01–F09 — nie kasuj odpowiedzi w głowie, wróć do karty.<\/p>\n<\/details>\n<h3>Poziom A — podstawa <span class=\"level-badge level-basic\">E8<\/span><\/h3>\n<div class=\"card\">\n<ol>\n<li>Ułóż wzory: tlenek magnezu, tlenek glinu, tlenek siarki(IV), tlenek azotu(V).<\/li>\n<li>Nazwij: Fe₂O₃, CuO, N₂O₅, P₂O₅.<\/li>\n<li>Podaj charakter: Na₂O, SO₃, CO, CO₂.<\/li>\n<li>Dokończ: Na₂O + H₂O → … ; SO₃ + H₂O → …<\/li>\n<li>Zbilansuj: Al + O₂ → Al₂O₃.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>MgO; Al₂O₃; SO₂; N₂O₅.<\/li>\n<li>tlenek żelaza(III); tlenek miedzi(II); tlenek azotu(V); tlenek fosforu(V).<\/li>\n<li>Na₂O — zasadowy; SO₃ — kwasowy; CO — obojętny; CO₂ — kwasowy.<\/li>\n<li>2 NaOH; H₂SO₄.<\/li>\n<li>4 Al + 3 O₂ → 2 Al₂O₃.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom B — trening <span class=\"level-badge level-exam\">EGZAMIN<\/span><\/h3>\n<div class=\"card\">\n<ol start=\"6\">\n<li>Równania: a) spalanie siarki, b) CaO + HCl, c) CO₂ + NaOH (nadmiar zasady).<\/li>\n<li>Dlaczego CO jest obojętny, a CO₂ kwasowy (szkolnie)?<\/li>\n<li>Popraw: FeO₃; „tlenek miedzi”; Ca₂O₂.<\/li>\n<li>SO₂ + H₂O; N₂O₅ + H₂O; K₂O + H₂O.<\/li>\n<li>CaO + H₂SO₄ → ? ; SO₃ + 2 NaOH → ?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"6\">\n<li>a) S + O₂ → SO₂; b) CaO + 2 HCl → CaCl₂ + H₂O; c) CO₂ + 2 NaOH → Na₂CO₃ + H₂O.<\/li>\n<li>CO nie tworzy kwasu z wodą (szkolnie); CO₂ daje H₂CO₃.<\/li>\n<li>Fe₂O₃; tlenek miedzi(II) [lub (I)]; CaO.<\/li>\n<li>H₂SO₃; 2 HNO₃; 2 KOH.<\/li>\n<li>CaSO₄ + H₂O; Na₂SO₄ + H₂O.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom C — ambitny <span class=\"level-badge level-extra\">AMBITNE<\/span><\/h3>\n<div class=\"card card-extra\">\n<ol start=\"11\">\n<li>Al₂O₃ + HCl i Al₂O₃ + NaOH — co to mówi o charakterze?<\/li>\n<li>P₂O₅ vs P₄O₁₀ — kiedy który zapis?<\/li>\n<li>Dlaczego MgO praktycznie nie reaguje z wodą jak CaO?<\/li>\n<li>Charakter Mn₂O₇ i CrO₃ — uzasadnij.<\/li>\n<li>Trend w okresie: Na₂O → Cl₂O₇.<\/li>\n<li>Wskaż kolory: CuO, Fe₂O₃, ZnO, PbO.<\/li>\n<li>Dlaczego Fe₃O₄ to tlenek mieszany?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"11\">\n<li>Amfoteryczny — reaguje z kwasami i zasadami; produkty zależą od środowiska.<\/li>\n<li>Szkolny empiryczny P₂O₅; cząsteczkowy P₄O₁₀.<\/li>\n<li>MgO ma bardzo trwałą sieć jonową (mały jon Mg²⁺ — duża energia sieciowa), a powstający Mg(OH)₂ jest praktycznie nierozpuszczalny i pokrywa ziarna tlenku — reakcja biegnie bardzo wolno. CaO ma słabszą sieć, a Ca(OH)₂ jest tylko trudno rozpuszczalny — reakcja jest szybka i silnie egzotermiczna.<\/li>\n<li>Kwasowe — wysoki stopień utlenienia, aniony tlenowe (MnO₄⁻, CrO₄²⁻).<\/li>\n<li>Zasadowy → amfoteryczny → kwasowy (coraz silniejszy w prawo okresu).<\/li>\n<li>CuO — czarny; Fe₂O₃ — rdzawy; ZnO — biały; PbO — żółty (litargit).<\/li>\n<li>Fe₃O₄ = FeO·Fe₂O₃ — zawiera Fe na dwóch stopniach utlenienia (+II i +III).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom D — zaawansowany <span class=\"level-badge level-extra\">ZAAWANSOWANE<\/span><\/h3>\n<div class=\"card card-extra\">\n<ol start=\"18\">\n<li>Porównaj budowę elektronową SO₂ (VSEPR) — dlaczego jest kątowa?<\/li>\n<li>Wyjaśnij, dlaczego SiO₂ ma wysoką temperaturę topnienia mimo prostego wzoru.<\/li>\n<li>Napisz równanie reakcji P₄O₁₀ z wodą (produkt: H₃PO₄).<\/li>\n<li>Dlaczego OF₂ nie jest tlenkiem, a fluorkiem tlenu?<\/li>\n<li>Napisz równanie redukcji Fe₂O₃ węglem.<\/li>\n<li>Napisz równanie termicznego rozkładu HgO.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"18\">\n<li>SO₂ — AX₂E (2 ligandy + 1 wolna para) → geometria kątowa.<\/li>\n<li>SiO₂ tworzy sieć kowalencyjną (każdy atom Si połączony z 4 atomami O).<\/li>\n<li>P₄O₁₀ + 6 H₂O → 4 H₃PO₄.<\/li>\n<li>W OF₂ fluor jest bardziej elektroujemny niż tlen; tlen ma +II.<\/li>\n<li>2 Fe₂O₃ + 3 C → 4 Fe + 3 CO₂.<\/li>\n<li>2 HgO →(Δ) 2 Hg + O₂.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"typologia-e8\">\n<div class=\"part-heading\"><span class=\"part-num\">24<\/span> Typologia zadań E8 <span class=\"level-badge level-exam\">EGZAMIN<\/span><\/div>\n<p>Wzorce zadań z arkuszy egzaminacyjnych. Każdy typ z przykładem i rozwiązaniem (przykłady inne niż w ćwiczeniach i teście).<\/p>\n<div class=\"card card-exam\">\n<h5>Typ 1: Ułóż wzór tlenku na podstawie nazwy<\/h5>\n<p><strong>Przykład:<\/strong> Ułóż wzór tlenku chromu(III).<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary><p>Cr(III) + O(II) → W–K–S–K → Cr₂O₃ (kontrola: 2·(+3) + 3·(−2) = 0).<\/p><\/details>\n<\/div>\n<div class=\"card card-exam\">\n<h5>Typ 2: Nazwij tlenek na podstawie wzoru<\/h5>\n<p><strong>Przykład:<\/strong> Podaj nazwę PbO₂.<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary><p>Ołów ma wartościowość IV (1·x = 2·2 → x = 4) → tlenek ołowiu(IV).<\/p><\/details>\n<\/div>\n<div class=\"card card-exam\">\n<h5>Typ 3: Określ charakter tlenku<\/h5>\n<p><strong>Przykład:<\/strong> Określ charakter: K₂O, N₂O₅, NO, ZnO.<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary><p>K₂O — zasadowy; N₂O₅ — kwasowy; NO — obojętny; ZnO — amfoteryczny.<\/p><\/details>\n<\/div>\n<div class=\"card card-exam\">\n<h5>Typ 4: Napisz równanie reakcji<\/h5>\n<p><strong>Przykład:<\/strong> Napisz równanie reakcji tlenku baru z wodą.<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary><p>BaO + H₂O → Ba(OH)₂.<\/p><\/details>\n<\/div>\n<div class=\"card card-exam\">\n<h5>Typ 5: Dokończ równanie<\/h5>\n<p><strong>Przykład:<\/strong> SO₂ + 2 KOH → ?<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary><p>K₂SO₃ + H₂O (siarczan(IV) potasu i woda; nadmiar zasady).<\/p><\/details>\n<\/div>\n<div class=\"card card-exam\">\n<h5>Typ 6: Wskaż obserwację i wniosek<\/h5>\n<p><strong>Przykład:<\/strong> Podczas doświadczenia woda wapienna zmętniała. Podaj obserwację i wniosek.<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary><p><strong>Obserwacja:<\/strong> woda wapienna zmętniała, powstał biały osad. <strong>Wniosek:<\/strong> obecny CO₂ — powstał CaCO₃.<\/p><\/details>\n<\/div>\n<div class=\"card card-exam\">\n<h5>Typ 7: Zaprojektuj doświadczenie<\/h5>\n<p><strong>Przykład:<\/strong> Zaprojektuj doświadczenie wykrywające CO₂.<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary>\n<p>Problem → Hipoteza → Sprzęt (woda wapienna, rurka) → Przebieg → Obserwacja (mętnienie) → Wniosek → Równanie → BHP.<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<h5>Typ 8: Wyjaśnij związek między budową a właściwościami <span class=\"level-badge level-extra\">AMBITNE<\/span><\/h5>\n<p><strong>Przykład:<\/strong> Wyjaśnij, dlaczego tlenek sodu tworzy z wodą zasadę, a tlenek siarki(VI) — kwas.<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary><p>Na₂O jest związkiem jonowym: jon O²⁻ reaguje z wodą (O²⁻ + H₂O → 2 OH⁻) → NaOH. SO₃ jest związkiem kowalencyjnym: przyłącza cząsteczkę wody, tworząc kwas tlenowy H₂SO₄, który w wodzie oddaje jony H⁺.<\/p><\/details>\n<\/div>\n<div class=\"card card-exam\">\n<h5>Typ 9: Wskaż zastosowanie tlenku<\/h5>\n<p><strong>Przykład:<\/strong> Podaj dwa zastosowania tlenku wapnia.<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary><p>Cement, budownictwo, wapno palone do gaszenia, produkcja zaprawy.<\/p><\/details>\n<\/div>\n<\/section>\n<section id=\"test\">\n<div class=\"part-heading\"><span class=\"part-num\">25<\/span> Sprawdź się: test, test adaptacyjny, quiz<\/div>\n<div class=\"card\">\n<ol>\n<li>Wzory: tlenek wapnia, tlenek żelaza(III), tlenek siarki(VI).<\/li>\n<li>Nazwy: Al₂O₃, N₂O₅, CuO, SO₂.<\/li>\n<li>Charakter: MgO, CO₂, NO, Al₂O₃.<\/li>\n<li>Równania: CaO + H₂O; SO₃ + H₂O; CuO + H₂SO₄.<\/li>\n<li>Popraw: AlO; SO₂ + H₂O → H₂SO₄; „tlenek ołowiu” dla PbO₂.<\/li>\n<li>Zbilansuj: P + O₂ → P₂O₅.<\/li>\n<li>(extra) Co oznacza amfoteryczność Al₂O₃?<\/li>\n<li>(extra) Dlaczego Mn₂O₇ jest kwasowy, mimo że to tlenek metalu?<\/li>\n<li>(extra) Napisz równanie P₄O₁₀ + H₂O → H₃PO₄.<\/li>\n<li>(extra) Porównaj CO₂ i SiO₂ — dlaczego jeden reaguje z wodą, a drugi nie?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>CaO; Fe₂O₃; SO₃.<\/li>\n<li>tlenek glinu; tlenek azotu(V); tlenek miedzi(II); tlenek siarki(IV).<\/li>\n<li>MgO — zasadowy; CO₂ — kwasowy; NO — obojętny; Al₂O₃ — amfoteryczny.<\/li>\n<li>Ca(OH)₂; H₂SO₄; CuSO₄ + H₂O.<\/li>\n<li>Al₂O₃; SO₂ + H₂O → H₂SO₃ (siarka(IV) daje kwas siarkowy(IV)); tlenek ołowiu(IV).<\/li>\n<li>4 P + 5 O₂ → 2 P₂O₅.<\/li>\n<li>Reaguje z kwasami i zasadami; produkty zależą od środowiska.<\/li>\n<li>Wysoki stopień Mn(+VII) — zachowanie kwasowe (MnO₄⁻).<\/li>\n<li>P₄O₁₀ + 6 H₂O → 4 H₃PO₄.<\/li>\n<li>CO₂ to mała cząsteczka (reaguje); SiO₂ to sieć kowalencyjna (praktycznie nie reaguje z wodą).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3 class=\"merge-h\">Test adaptacyjny (poziomy A, B, C)<\/h3>\n<p>Wybierz poziom — 5 pytań dopasowanych do twojej wiedzy.<\/p>\n<div class=\"widget\">\n<h4>Test adaptacyjny<\/h4>\n<p class=\"widget-hint\">Kliknij poziom A (podstawa), B (trening), C (ambitny).<\/p>\n<div class=\"bld-pool\" id=\"adaptPool\">\n<button class=\"active\" data-lvl=\"A\" type=\"button\">Poziom A — podstawa<\/button>\n<button data-lvl=\"B\" type=\"button\">Poziom B — trening<\/button>\n<button data-lvl=\"C\" type=\"button\">Poziom C — ambitny<\/button>\n<\/div>\n<div id=\"adaptQuiz\"><\/div>\n<\/div>\n<h3 class=\"merge-h\">Quiz klikany<\/h3>\n<div id=\"quizWrap\"><\/div>\n<div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section id=\"karta\">\n<div class=\"part-heading\"><span class=\"part-num\">26<\/span> Karta szybkiego powtórzenia <span class=\"level-badge level-exam\">DO WYDRUKU<\/span><\/div>\n<p>Jednostronicowa ściąga. Wciśnij <strong>Ctrl+P<\/strong> (drukuj) — karta jest zoptymalizowana do wydruku.<\/p>\n<div class=\"print-card\">\n<h4>Tlenki — ściąga E8<\/h4>\n<div class=\"pc-grid\">\n<div class=\"pc-box\">\n<b>Definicja<\/b>\n          Tlenek = związek tlenu z innym pierwiastkiem (EₓOᵧ). O zwykle −II · OF₂ = fluorek, nie tlenek · H₂O₂ — nadtlenek, tlen na −I.\n        <\/div>\n<div class=\"pc-box\">\n<b>Wzory — W–K–S–K<\/b>\n          krzyż wartościowości + kontrola ładunku: Fe(III) + O(II) → Fe₂O₃ · Cu(II) + O(II) → CuO · S(VI) + O(II) → SO₃.\n        <\/div>\n<div class=\"pc-box\">\n<b>Charakter<\/b>\n          Metale 1–2 zwykle zasadowe (wyjątki osobno) · Niemetal → kwasowy · CO, NO, N₂O → obojętny · Al₂O₃, ZnO → amfoteryczny. Charakter ≠ woda ≠ rozpuszczalność.\n        <\/div>\n<div class=\"pc-box\">\n<b>Przykłady i wyjątki<\/b>\n          Zasadowe: Na₂O, CaO (+ woda → OH) · MgO słabo. Kwasowe: SO₂, SO₃, CO₂, P₂O₅/P₄O₁₀ · SiO₂ sieć · Mn₂O₇, CrO₃. Amfoteryczne: Al₂O₃, ZnO · z kwasem i zasadą. Obojętne: CO, NO, N₂O — brak typowej reakcji kwas–zasada.\n        <\/div>\n<div class=\"pc-box\">\n<b>Tlenek + woda<\/b>\n          Na₂O + H₂O → 2 NaOH · CaO + H₂O → Ca(OH)₂ · SO₃ + H₂O → H₂SO₄ · CO₂ + H₂O → H₂CO₃.\n        <\/div>\n<div class=\"pc-box\">\n<b>Tlenek + kwas<\/b>\n          CaO + 2 HCl → CaCl₂ + H₂O · CuO + H₂SO₄ → CuSO₄ + H₂O.\n        <\/div>\n<div class=\"pc-box\">\n<b>Tlenek + zasada<\/b>\n          CO₂ + 2 NaOH → Na₂CO₃ + H₂O · SO₃ + 2 NaOH → Na₂SO₄ + H₂O.\n        <\/div>\n<div class=\"pc-box\">\n<b>Pułapki<\/b>\n          FeO₃ → Fe₂O₃ · Ca₂O₂ → CaO · MgO + H₂O praktycznie nie · OF₂ to fluorek tlenu · H₂O₂ — tlen na −I.\n        <\/div>\n<div class=\"pc-box\">\n<b>Kolory<\/b>\n          CuO — czarny · Fe₂O₃ — rdzawy · ZnO — biały · PbO — żółty · Cr₂O₃ — zielony.\n        <\/div>\n<div class=\"pc-box\">\n<b>Obserwacja ≠ wniosek<\/b>\n          Obserwacja: woda wapienna mętnieje. Wniosek: obecny CO₂ — powstał CaCO₃.\n        <\/div>\n<div class=\"pc-box\">\n<b>BHP i środowisko<\/b>\n          CO — czad, czujnik CO · CaO — żrący, egzotermiczny z wodą · SO₂, NO₂ → kwaśne deszcze · CO₂, N₂O → efekt cieplarniany.\n        <\/div>\n<div class=\"pc-box\">\n<b>Most<\/b>\n          Tlenek zasadowy → wodorotlenek (N02). Tlenek kwasowy → kwas (N03). Tlenek + kwas/zasada → sól (N04).\n        <\/div>\n<\/div>\n<\/div>\n<\/section>\n<section id=\"fiszki\">\n<div class=\"part-heading\"><span class=\"part-num\">27<\/span> Fiszki<\/div>\n<div class=\"flashcard-grid\" id=\"flashGrid\">\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Co to tlenek?<\/span><span class=\"back\"><strong>Związek tlenu z innym pierwiastkiem<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Na₂O + H₂O → ?<\/span><span class=\"back\"><strong>2 NaOH<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">CaO + H₂O → ?<\/span><span class=\"back\"><strong>Ca(OH)₂<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">SO₃ + H₂O → ?<\/span><span class=\"back\"><strong>H₂SO₄<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">SO₂ + H₂O → ?<\/span><span class=\"back\"><strong>H₂SO₃<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">CO₂ + H₂O → ?<\/span><span class=\"back\"><strong>H₂CO₃ (słaby)<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">N₂O₅ + H₂O → ?<\/span><span class=\"back\"><strong>2 HNO₃<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Charakter Na₂O<\/span><span class=\"back\"><strong>zasadowy<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Charakter SO₂<\/span><span class=\"back\"><strong>kwasowy<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Charakter CO<\/span><span class=\"back\"><strong>obojętny (szkolnie)<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Charakter Al₂O₃<\/span><span class=\"back\"><strong>amfoteryczny<\/strong><\/span><span class=\"card-tag tag-extra\">ambitny<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Fe₂O₃ — nazwa<\/span><span class=\"back\"><strong>tlenek żelaza(III)<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Cu₂O — nazwa<\/span><span class=\"back\"><strong>tlenek miedzi(I)<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Dlaczego nie FeO₃?<\/span><span class=\"back\"><strong>W–K–S–K: 2·III = 3·II → Fe₂O₃<\/strong><\/span><span class=\"card-tag tag-error\">pułapka<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">P₂O₅ a P₄O₁₀<\/span><span class=\"back\"><strong>szkolny zapis vs cząsteczka<\/strong><\/span><span class=\"card-tag tag-extra\">ambitny<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Tlenek zasadowy + kwas →<\/span><span class=\"back\"><strong>sól + woda<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Tlenek kwasowy + zasada →<\/span><span class=\"back\"><strong>sól + woda<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Tlenki obojętne<\/span><span class=\"back\"><strong>CO, NO, N₂O<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">MgO + H₂O?<\/span><span class=\"back\"><strong>praktycznie nie (szkolnie)<\/strong><\/span><span class=\"card-tag tag-error\">pułapka<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">CO₂ + 2 NaOH →<\/span><span class=\"back\"><strong>Na₂CO₃ + H₂O<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Wykrywanie CO₂<\/span><span class=\"back\"><strong>woda wapienna (mętnienie)<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Mn₂O₇ — charakter<\/span><span class=\"back\"><strong>kwasowy (wyjątek!)<\/strong><\/span><span class=\"card-tag tag-extra\">ambitny<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">CaO — potocznie<\/span><span class=\"back\"><strong>wapno palone<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">4 Al + 3 O₂ →<\/span><span class=\"back\"><strong>2 Al₂O₃<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Kolor CuO<\/span><span class=\"back\"><strong>czarny<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Kolor Fe₂O₃<\/span><span class=\"back\"><strong>rdzawy (czerwono-brunatny)<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Kolor ZnO<\/span><span class=\"back\"><strong>biały<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Redukcja Fe₂O₃ węglem<\/span><span class=\"back\"><strong>2 Fe₂O₃ + 3 C → 4 Fe + 3 CO₂<\/strong><\/span><span class=\"card-tag tag-extra\">zaawansowane<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Rozkład HgO<\/span><span class=\"back\"><strong>2 HgO → 2 Hg + O₂ (Δ)<\/strong><\/span><span class=\"card-tag tag-extra\">zaawansowane<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Czad — wzór<\/span><span class=\"back\"><strong>CO — bezbarwny, bezwonny, śmiertelny<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Fe₃O₄ — typ<\/span><span class=\"back\"><strong>tlenek mieszany Fe(II,III)<\/strong><\/span><span class=\"card-tag tag-extra\">zaawansowane<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">OF₂ — nazwa<\/span><span class=\"back\"><strong>fluorek tlenu (nie tlenek!)<\/strong><\/span><span class=\"card-tag tag-error\">pułapka<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Trend w okresie<\/span><span class=\"back\"><strong>zasadowy → amfoteryczny → kwasowy<\/strong><\/span><span class=\"card-tag tag-extra\">ambitny<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">VSEPR CO₂<\/span><span class=\"back\"><strong>AX₂, liniowa, 180°<\/strong><\/span><span class=\"card-tag tag-extra\">ambitny<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">VSEPR SO₂<\/span><span class=\"back\"><strong>AX₂E, kątowa, ~119°<\/strong><\/span><span class=\"card-tag tag-extra\">ambitny<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">Charakter tlenku ≠ ?<\/span><span class=\"back\"><strong>≠ reakcja z wodą ≠ rozpuszczalność (np. CuO)<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">SiO₂ + H₂O?<\/span><span class=\"back\"><strong>praktycznie nie (sieć kowalencyjna); z NaOH po ogrzaniu tak<\/strong><\/span><span class=\"card-tag tag-error\">pułapka<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">CO₂ + NaOH (nadmiar CO₂) →<\/span><span class=\"back\"><strong>NaHCO₃<\/strong><\/span><span class=\"card-tag tag-extra\">ambitny<\/span><\/button>\n<button class=\"flashcard\" type=\"button\"><span class=\"front\">KO₂ w aparatach tlenowych<\/span><span class=\"back\"><strong>4 KO₂ + 2 CO₂ → 2 K₂CO₃ + 3 O₂<\/strong><\/span><span class=\"card-tag tag-extra\">zaawansowane<\/span><\/button>\n<\/div>\n<\/section>\n<section id=\"mapa\">\n<div class=\"part-heading\"><span class=\"part-num\">28<\/span> Mapa myśli<\/div>\n<div class=\"card map-card\">\n<div class=\"mm\"><div class=\"mm-root\">TLENEK<\/div><div class=\"mm-formula\">Wzór EₓOᵧ — W–K–S–K, O najczęściej II<br/>nazwa: Fe/Cu/Sn/Pb/Mn/Cr → cyfra rzymska<\/div><div class=\"mm-grid\">\n<a class=\"mm-box\" href=\"#definicja\" style=\"--mm:#0d6868\"><b>DEFINICJA I WZÓR<\/b><ul><li>tlen na −II, drugi pierwiastek dowolny<\/li><li>W–K–S–K + kontrola sumy stopni = 0<\/li><li>nie tlenki: H₂O₂, Na₂O₂ (−I), KO₂, OF₂ (+II)<\/li><li>P₂O₅ (empiryczny) = P₄O₁₀ (cząsteczka)<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#charakter\" style=\"--mm:#2e7d4f\"><b>CHARAKTER<\/b><ul><li>zasadowy (metal 1–2)<\/li><li>kwasowy (niemetal)<\/li><li>obojętny (CO, NO, N₂O)<\/li><li>amfoteryczny (Al₂O₃, ZnO)<\/li><li>wyjątki: Mn₂O₇, CrO₃ (kwasowe)<\/li><li>trend: zasadowy → kwasowy w prawo<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#oxide-decision-model\" style=\"--mm:#2e7d4f\"><b>TRZY PYTANIA<\/b><ul><li>charakter ≠ reakcja z wodą ≠ rozpuszczalność<\/li><li>CuO: zasadowy, z wodą nie<\/li><li>SiO₂: kwasowy, z wodą nie<\/li><li>MgO: z wodą bardzo słabo<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#kolory\" style=\"--mm:#b06f1c\"><b>WŁAŚCIWOŚCI<\/b><ul><li>tlenki metali: ciała stałe, wysoka t. topnienia<\/li><li>tlenki niemetali: często gazy (CO₂, SO₂)<\/li><li>barwy: CuO czarny, Fe₂O₃ rdzawy, Cr₂O₃ zielony<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#otrzymywanie\" style=\"--mm:#2b5e9c\"><b>OTRZYMYWANIE<\/b><ul><li>pierwiastek + O₂<\/li><li>spalanie związków; niecałkowite → CO, sadza<\/li><li>rozkład węglanów<\/li><li>rozkład wodorotlenków<\/li><li>utlenianie niższych tlenków<\/li><li>metoda przemysłowa: SO₂ + O₂ → SO₃<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#reakcje\" style=\"--mm:#6b3fa0\"><b>REAKCJE<\/b><ul><li>+ H₂O → wodorotlenek / kwas<\/li><li>+ kwas → sól + woda<\/li><li>+ zasada → sól + woda<\/li><li>+ tlenek → sól<\/li><li>+ H₂ / C → metal (redukcja)<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#oxide-decision-model\" style=\"--mm:#b06f1c\"><b>PRZYKŁADY<\/b><ul><li>Na₂O, CaO — zasadowy<\/li><li>CO₂, SO₃ — kwasowy<\/li><li>Al₂O₃, ZnO — amfoteryczny<\/li><li>CO, NO, N₂O — obojętny<\/li><li>Fe₂O₃, CuO — z kwasami tak<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#n01-why-sio2-mgo\" style=\"--mm:#2b5e9c\"><b>DLACZEGO?<\/b><ul><li>jonowy: O²⁻ + H₂O → 2 OH⁻ (zasadowy)<\/li><li>kowalencyjny + H₂O → kwas tlenowy<\/li><li>wyższy stopień utlenienia → bardziej kwasowy<\/li><li>sieć SiO₂, energia sieci MgO<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#bezpieczenstwo\" style=\"--mm:#b83a45\"><b>BHP I ŚRODOWISKO<\/b><ul><li>CO — czad, czujnik CO<\/li><li>CaO — żrący, egzotermiczny z wodą<\/li><li>SO₂, NO₂ → kwaśne deszcze<\/li><li>CO₂, N₂O → efekt cieplarniany<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#klinika\" style=\"--mm:#b83a45\"><b>PUŁAPKI<\/b><ul><li>FeO₃ → Fe₂O₃<\/li><li>MgO + H₂O praktycznie nie<\/li><li>SO₃ + H₂O → H₂SO₄<\/li><li>obserwacja ≠ wniosek<\/li><li>OF₂ ≠ tlenek · H₂O₂ tlen na −I<\/li><\/ul><\/a>\n<a class=\"mm-box\" href=\"#dod-h\" style=\"--mm:#6b3fa0\"><b>MOSTY<\/b><ul><li>F01–F09 — W–K–S–K<\/li><li>N02 — wodorotlenki<\/li><li>N03 — kwasy<\/li><li>N04 — sole<\/li><li>R05–R08 — stechiometria · X01–X10 — redoks<\/li><\/ul><\/a>\n<\/div><a class=\"mm-foot\" href=\"#zastosowania\" style=\"text-decoration:none\">Zastosowania: CaO, SiO₂, Fe₂O₃, CO₂, TiO₂, ZnO, Al₂O₃<\/a><\/div>\n<\/div>\n<\/section>\n<section id=\"slownik\">\n<div class=\"part-heading\"><span class=\"part-num\">29<\/span> Słownik<\/div>\n<div class=\"card\">\n<dl class=\"def-list\">\n<div class=\"def-item\"><dt>Tlenek<\/dt><dd>Związek tlenu z innym pierwiastkiem.<\/dd><\/div>\n<div class=\"def-item\"><dt>Tlenek zasadowy<\/dt><dd>Tlenek metalu reagujący z kwasem, tworzący z wodą wodorotlenek.<\/dd><\/div>\n<div class=\"def-item\"><dt>Tlenek kwasowy<\/dt><dd>Tlenek niemetalu reagujący z zasadą, tworzący z wodą kwas.<\/dd><\/div>\n<div class=\"def-item\"><dt>Tlenek obojętny<\/dt><dd>Nie tworzy kwasu ani zasady z wodą (w warunkach szkolnych).<\/dd><\/div>\n<div class=\"def-item\"><dt>Tlenek amfoteryczny<\/dt><dd>Reaguje zarówno z kwasami, jak i z zasadami.<\/dd><\/div>\n<div class=\"def-item\"><dt>Tlenek mieszany<\/dt><dd>Zawiera ten sam metal na dwóch stopniach utlenienia, np. Fe₃O₄ = FeO·Fe₂O₃.<\/dd><\/div>\n<div class=\"def-item\"><dt>Nadtlenek<\/dt><dd>Związek z wiązaniem O–O; tlen na −I (H₂O₂, Na₂O₂).<\/dd><\/div>\n<div class=\"def-item\"><dt>Woda wapienna<\/dt><dd>Roztwór Ca(OH)₂ — służy do wykrywania CO₂.<\/dd><\/div>\n<div class=\"def-item\"><dt>Wapno palone<\/dt><dd>CaO.<\/dd><\/div>\n<div class=\"def-item\"><dt>Wapno gaszone<\/dt><dd>Ca(OH)₂.<\/dd><\/div>\n<div class=\"def-item\"><dt>P₂O₅<\/dt><dd>Zapis empiryczny tlenku fosforu(V).<\/dd><\/div>\n<div class=\"def-item\"><dt>P₄O₁₀<\/dt><dd>Rzeczywista cząsteczka tlenku fosforu(V).<\/dd><\/div>\n<div class=\"def-item\"><dt>OF₂<\/dt><dd>Fluorek tlenu (nie tlenek).<\/dd><\/div>\n<div class=\"def-item\"><dt>VSEPR<\/dt><dd>Teoria odpychania par elektronowych — przewiduje kształt cząsteczki.<\/dd><\/div>\n<div class=\"def-item\"><dt>Reakcja charakterystyczna<\/dt><dd>Reakcja pozwalająca wykryć substancję.<\/dd><\/div>\n<div class=\"def-item\"><dt>Katalizator<\/dt><dd>Substancja zwiększająca szybkość reakcji, niezużywająca się.<\/dd><\/div>\n<div class=\"def-item\"><dt>Termit<\/dt><dd>Mieszanina tlenku metalu i aluminium — silnie egzotermiczna redukcja.<\/dd><\/div>\n<div class=\"def-item\"><dt>Charakter chemiczny tlenku<\/dt><dd>Typowe zachowanie kwasowo-zasadowe tlenku (zasadowy, kwasowy, obojętny, amfoteryczny) — to nie to samo co reakcja z wodą ani rozpuszczalność.<\/dd><\/div>\n<div class=\"def-item\"><dt>Ponadtlenek<\/dt><dd>Związek z anionem O₂⁻; tlen na −½ (KO₂).<\/dd><\/div>\n<div class=\"def-item\"><dt>Wzór empiryczny<\/dt><dd>Najprostszy stosunek liczby atomów w związku (P₂O₅); wzór cząsteczkowy podaje rzeczywisty skład cząsteczki (P₄O₁₀).<\/dd><\/div>\n<div class=\"def-item\"><dt>Redukcja tlenku<\/dt><dd>Odebranie tlenu tlenkowi (np. przez H₂, C, CO) — stopień utlenienia metalu maleje.<\/dd><\/div>\n<div class=\"def-item\"><dt>Korozja<\/dt><dd>Niszczenie metalu w wyniku reakcji chemicznych z otoczeniem (np. rdzewienie żelaza).<\/dd><\/div>\n<div class=\"def-item\"><dt>Pasywacja<\/dt><dd>Powstanie szczelnej warstwy tlenku chroniącej metal przed dalszą korozją (Al₂O₃ na aluminium).<\/dd><\/div>\n<\/dl>\n<\/div>\n<\/section>\n<section id=\"checklista\">\n<div class=\"part-heading\"><span class=\"part-num\">30<\/span> Checklista<\/div>\n<div class=\"checklist\">\n<h4>Sprawdź, czy umiesz:<\/h4>\n<ul>\n<li>Zapisać wzór tlenku na podstawie nazwy i wartościowości.<\/li>\n<li>Nazwać tlenek (z cyfrą rzymską dla Fe, Cu, Sn, Pb, Mn, Cr).<\/li>\n<li>Określić charakter tlenku (zasadowy / kwasowy / obojętny / amfoteryczny).<\/li>\n<li>Zapisać reakcję tlenku z wodą (dla tlenków aktywnych).<\/li>\n<li>Zapisać reakcję tlenku z kwasem i zasadą.<\/li>\n<li>Rozróżnić obserwację od wniosku.<\/li>\n<li>Podzielić tlenki na rozpuszczalne i nierozpuszczalne w wodzie.<\/li>\n<li>Wykryć CO₂ wodą wapienną.<\/li>\n<li>Odróżnić charakter tlenku od reakcji z wodą i rozpuszczalności (CuO, SiO₂, MgO).<\/li>\n<li>Wskazać zagrożenia (CO, CaO, SO₂) i wpływ tlenków na środowisko.<\/li>\n<li>(ambitnie) Wyjaśnić amfoteryczność Al₂O₃ i ZnO.<\/li>\n<li>(ambitnie) Wyjaśnić P₂O₅ vs P₄O₁₀.<\/li>\n<li>(ambitnie) Rozpoznać tlenki mieszane (Fe₃O₄).<\/li>\n<li>(ambitnie) Wyjaśnić geometrię cząsteczek (VSEPR).<\/li>\n<li>(zaawansowanie) Rozwiązać zadanie stechiometryczne z tlenkiem.<\/li>\n<li>(zaawansowanie) Wyjaśnić korozję i pasywację.<\/li>\n<li>(zaawansowanie) Zapisać reakcję redukcji tlenku wodorem / węglem.<\/li>\n<li>(zaawansowanie) Znać rolę tlenków w organizmach (CO, CO₂, NO).<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"organizmy\">\n<div class=\"part-heading\"><span class=\"part-num\">A<\/span> Dodatek A — tlenki w organizmach <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<h3>CO₂ — dwutlenek węgla<\/h3>\n<ul>\n<li>Produkt oddychania komórkowego: C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O.<\/li>\n<li>Transport w krwi głównie jako jon HCO₃⁻ (wodorowęglan).<\/li>\n<li>Reguluje pH krwi — układ buforowy H₂CO₃/HCO₃⁻.<\/li>\n<\/ul>\n<h3>H₂O — woda<\/h3>\n<ul>\n<li>Produkt oddychania komórkowego.<\/li>\n<li>Substrat fotosyntezy: 6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂.<\/li>\n<\/ul>\n<h3>CO — tlenek węgla(II) — trucizna<\/h3><p>Trucizna wiążąca hemoglobinę — źródła, objawy, profilaktyka i pierwsza pomoc w <a href=\"#bezpieczenstwo\">§12<\/a>.<\/p>\n\n<h3>NO — tlenek azotu(II) — sygnał biologiczny<\/h3>\n<ul>\n<li><strong>Biologiczny czynnik sygnałowy<\/strong> — bierze udział m.in. w rozszerzaniu naczyń krwionośnych. W szkolnym uproszczeniu bywa nazywany neuroprzekaźnikiem.<\/li>\n<li>Nitrogliceryna działa przez uwolnienie NO.<\/li>\n<li>W 1998 r. Nagroda Nobla za odkrycie roli NO w organizmie.<\/li>\n<\/ul>\n<h3>N₂O — tlenek azotu(I)<\/h3>\n<ul>\n<li>„Gaz rozweselający” — stosowany w znieczuleniu.<\/li>\n<li>Silny gaz cieplarniany — <a href=\"#bezpieczenstwo\">§12<\/a>.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"dod-f\">\n<div class=\"part-heading\"><span class=\"part-num\">B<\/span> Dodatek B — korozja i pasywacja <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<h3>Korozja żelaza <span class=\"level-badge level-basic\">E8<\/span><\/h3>\n<p><strong>Korozja<\/strong> — niszczenie metalu w wyniku reakcji chemicznych z otoczeniem.<\/p>\n<p><strong>Rdza (przybliżenie):<\/strong><\/p>\n<div class=\"formula-lg\">4 Fe + 3 O₂ + n H₂O → 2 Fe₂O₃·nH₂O<\/div>\n<p class=\"mini-note\"><strong>Ograniczenie modelu:<\/strong> rdza nie ma jednego, ściśle określonego wzoru; powyższy zapis jest jedynie przybliżeniem jednego z możliwych składników produktów korozji.<\/p>\n<p class=\"mini-note\">Rdza <strong>nie jest czystym Fe₂O₃<\/strong> — mieszanina uwodnionych tlenków i wodorotlenków żelaza.<\/p>\n<p><strong>Czynniki przyspieszające korozję:<\/strong> wilgoć, tlen, sole (np. sól drogowa), kwasy.<\/p>\n<p class=\"mini-note\">Rdza jest porowata i odpada płatami, więc nie chroni żelaza — korozja postępuje w głąb metalu.<\/p>\n<h3>Pasywacja<\/h3>\n<p><strong>Pasywacja<\/strong> — tworzenie się szczelnej warstwy tlenku chroniącej metal przed dalszą korozją. Cienka, szczelna warstwa tlenku chroni metal:<\/p>\n<ul>\n<li>Al₂O₃ na powierzchni aluminium,<\/li>\n<li>na cynku: mieszanina produktów korozji, m.in. ZnO, Zn(OH)₂ i zasadowych węglanów cynku — nie sam „czysty ZnO”,<\/li>\n<li>patyna na miedzi (Cu₂(OH)₂CO₃).<\/li>\n<\/ul>\n<p><strong>Metale pasywujące się:<\/strong> Al, Zn, Cr, Ti.<\/p>\n<h3>Ochrona przed korozją<\/h3>\n<ul>\n<li>powłoki malarskie,<\/li>\n<li>powłoki metaliczne (cynkowanie, chromowanie),<\/li>\n<li>inhibitory korozji,<\/li>\n<li>ochrona katodowa.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"historia\">\n<div class=\"part-heading\"><span class=\"part-num\">C<\/span> Dodatek C — historia odkrycia tlenków <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-understand\">\n<div style=\"display:grid;gap:10px;\">\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\"><strong>1772 — Carl Wilhelm Scheele<\/strong><br/>Otrzymuje tlen („ogień powietrzny”) przez prażenie HgO (oraz m.in. KNO₃ i MnO₂ z kwasem siarkowym).<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\"><strong>1774 — Joseph Priestley<\/strong><br/>Niezależnie otrzymuje tlen przez rozkład HgO.<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\"><strong>1777 — Antoine Lavoisier<\/strong><br/>Teoria spalania: substancje łączą się z tlenem, tworząc tlenki. Obala teorię flogistonu.<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\"><strong>1787 — Guyton de Morveau, Lavoisier i współpracownicy<\/strong><br/>Systematyczne nazewnictwo chemiczne — wprowadzenie nazwy „tlenek” (fr. <em>oxyde<\/em>) dla związków pierwiastków z tlenem.<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\"><strong>1811 — Amedeo Avogadro<\/strong><br/>Teoria cząsteczek — wyjaśnia wzory tlenków (H₂O, CO₂).<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\"><strong>1813 — Jöns Jacob Berzelius<\/strong><br/>Nowoczesne symbole pierwiastków i zapis wzorów (także tlenków metali i niemetali).<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\"><strong>XIX w.<\/strong><br/>Metalurgia: tlenki jako rudy metali (hematyt, magnetyt).<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\"><strong>XX w.<\/strong><br/>Tlenki w technologii: TiO₂ (pigment), ZnO (elektronika), Al₂O₃ (aluminium).<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\"><strong>XXI w.<\/strong><br/>Tlenki w nanotechnologii, fotokatalizie, ogniwach paliwowych.<\/div>\n<\/div>\n<\/div>\n<\/section>\n<section id=\"dod-i\">\n<div class=\"part-heading\"><span class=\"part-num\">D<\/span> Dodatek D — tlenki w technologii XXI w. <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<details class=\"adv\"><summary>Tlenki w technologii XXI w. — fotokataliza, elektronika, nadprzewodniki, ogniwa SOFC, nanocząstki <span class=\"adv-tag\">poza programem szkoły — ciekawostka akademicka<\/span><\/summary><div class=\"adv-body\">\n<div class=\"card card-extra\">\n<h3>TiO₂ — fotokataliza<\/h3>\n<p>Dwutlenek tytanu pod wpływem światła UV rozkłada zanieczyszczenia organiczne. Stosowany w samoczyszczących się powierzchniach, farbach, cementach.<\/p>\n<h3>ZnO — elektronika<\/h3>\n<p>Półprzewodnik szerokopasmowy — stosowany w diodach, sensorach gazów, przezroczystych elektrodach.<\/p>\n<h3>Al₂O₃ — ceramika techniczna<\/h3>\n<p>Aluminium, ścierniwo, ceramika ogniotrwała, podłoża układów scalonych.<\/p>\n<h3>YBa₂Cu₃O₇ — nadprzewodnik wysokotemperaturowy<\/h3>\n<p>Tlenek itru, baru i miedzi — pierwszy nadprzewodnik powyżej temperatury wrzenia ciekłego azotu (77 K) — odkryty w 1987 r. Nagrodę Nobla 1987 otrzymali Bednorz i Müller za odkrycie nadprzewodnictwa w ceramice tlenkowej La–Ba–Cu–O (1986).<\/p>\n<h3>Ogniwa paliwowe<\/h3>\n<p>Tlenki ceramiczne (np. ZrO₂ domieszkowany Y₂O₃) jako elektrolity w ogniwach paliwowych SOFC.<\/p>\n<h3>Tlenki w nanotechnologii<\/h3>\n<p>Nanocząstki tlenków (TiO₂, ZnO, SiO₂) — katalizatory, sensory, nośniki leków.<\/p>\n<\/div>\n<\/div><\/details>\n<\/section>\n<section id=\"dod-h\">\n<div class=\"part-heading\"><span class=\"part-num\">E<\/span> Dodatek E — mosty do kolejnych lekcji<\/div>\n<div class=\"card card-understand\">\n<p class=\"mini-note\">Wiadomości wcześniejsze (F01–F09) — <a href=\"#kompas\">§3<\/a>.<\/p>\n<h3>N02 — wodorotlenki<\/h3>\n<ul>\n<li>CaO + H₂O → Ca(OH)₂.<\/li>\n<li>Tlenki zasadowe + H₂O → wodorotlenki.<\/li>\n<li>Amfoteryczne wodorotlenki Al(OH)₃, Zn(OH)₂ — jak Al₂O₃ i ZnO.<\/li>\n<\/ul>\n<h3>N03 — kwasy<\/h3>\n<ul>\n<li>SO₃ + H₂O → H₂SO₄.<\/li>\n<li>Tlenki kwasowe + H₂O → kwasy.<\/li>\n<li>Zobojętnianie kwasu zasadą (H⁺ + OH⁻ → H₂O).<\/li>\n<\/ul>\n<h3>N04 — sole<\/h3>\n<ul>\n<li>Tlenek + kwas → sól + woda.<\/li>\n<li>Tlenek + zasada → sól + woda.<\/li>\n<li>Tlenek zasadowy + tlenek kwasowy → sól.<\/li>\n<\/ul>\n<h3>R05–R08 — stechiometria<\/h3>\n<ul>\n<li>Obliczenia z równań reakcji tlenków (<a href=\"#stechio\">§20<\/a>).<\/li>\n<\/ul>\n<h3>X01–X10 — redoks<\/h3>\n<ul>\n<li>Utlenianie tlenków (2 SO₂ + O₂ → 2 SO₃).<\/li>\n<li>Redukcja tlenków (CuO + H₂ → Cu + H₂O).<\/li>\n<li>Stopnie utlenienia w tlenkach (<a href=\"#builder\">§5<\/a>); redoks z udziałem tlenków (<a href=\"#redukcja\">§19<\/a>).<\/li>\n<\/ul>\n<h3>L013 — zaawansowana<\/h3>\n<ul>\n<li>VSEPR pełne, hybrydyzacja sp/sp²/sp³.<\/li>\n<\/ul>\n<p class=\"mini-note\">Lekcje N03 Kwasy i N04 Sole są w panelu Lekcje → Chemia.<\/p>\n<\/div>\n<\/section>\n<section id=\"wiz-reg-l002\">\n<div class=\"part-heading\"><span class=\"part-num\">↻<\/span> Modele silnika w tej lekcji<\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>Sekcja<\/th><th>Model<\/th><th>Co pokazuje<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#charakter\">§6<\/a><\/td><td><code>n01-tlenki-v01<\/code><\/td><td>trzy pytania o tlenek, zlewka ze wskaźnikiem<\/td><\/tr><tr><td><a href=\"#charakter\">§6<\/a><\/td><td><code>periodic-54<\/code><\/td><td>pierwiastek → tlenek → charakter<\/td><\/tr><tr><td><a href=\"#builder\">§5<\/a><\/td><td><code>n01-konstruktor-v01<\/code><\/td><td>W–K–S–K, stopnie utlenienia, sprawdzanie wzoru<\/td><\/tr><tr><td><a href=\"#otrzymywanie\">§9<\/a><\/td><td><code>n01-spalanie-v01<\/code><\/td><td>spalanie całkowite i niecałkowite<\/td><\/tr><tr><td><a href=\"#reakcje\">§10<\/a><\/td><td><code>n01-reaktor-v01<\/code><\/td><td>przewidywanie produktów<\/td><\/tr><tr><td><a href=\"#reakcje\">§10<\/a><\/td><td><code>chain-scn<\/code><\/td><td>łańcuchy przemian<\/td><\/tr><tr><td><a href=\"#trend\">§14<\/a><\/td><td><code>n01-trend-v01<\/code><\/td><td>trend charakteru (okres, stopień utlenienia)<\/td><\/tr><tr><td><a href=\"#vsepr\">§18<\/a><\/td><td><code>molecule3d-merged<\/code><\/td><td>geometria cząsteczek (VSEPR)<\/td><\/tr><tr><td><a href=\"#stechio\">§20<\/a><\/td><td><code>stech-kalkulator-v01<\/code><\/td><td>obliczenia stechiometryczne<\/td><\/tr><tr><td><a href=\"#doswiadczenia\">§21<\/a><\/td><td><code>n01-doswiadczenia-v01<\/code><\/td><td>pracownia doświadczeń<\/td><\/tr><tr><td><a href=\"#doswiadczenia\">§21<\/a><\/td><td><code>gfx-scene-carbonate<\/code><\/td><td>wykrywanie CO₂<\/td><\/tr><\/tbody><\/table><\/div><p class=\"mini-note\">Stare widgety wbudowane w HTML (Detektor, Konstruktor, VSEPR, mini-układ, symulatory, galeria, kalkulatory) zastąpiono modelami silnika — jedno źródło danych dla lekcji, Atlasu i katalogu wizualizacji.<\/p>\n<\/section>\n<section id=\"audyt\">\n<div class=\"part-heading\"><span class=\"part-num\">✓<\/span> Audyt jakości <span class=\"level-badge level-exam\">KONTROLA<\/span><\/div>\n<div class=\"card card-new\"><span class=\"card-label\">v6.0 CHE (2026-10) — integracja z silnikiem<\/span><ul><li>Widgety → modele silnika (tabela powyżej); galeria barw z CHE.DATA.OXIDES (audyt LES-N01).<\/li><li>Poprawki: nazwa P₄O₁₀ (dekatlenek tetrafosforu), MgO vs CaO (energia sieci, warstwa Mg(OH)₂), model wiązania w dodatku A, ZnO + NaOH w roztworze → Na₂[Zn(OH)₄], Nobel 1987 (La–Ba–Cu–O), eskolait, kody lekcji (N01, N02, N03, N04).<\/li><li>Korekta MASTER v5.9 włączona jako §4c (po modelu decyzyjnym).<\/li><li>v6.2 (2026-10-07) — redakcja wg STANDARD_LEKCJI: kolejność rdzeń → rozumienie/ambitne → praktyka → powtórka → dodatki; scalone powtórzenia (trzy pytania, tabele charakteru i wody, MgO/SiO₂, CO/CO₂, BHP/czad, smog, kwaśne deszcze, korozja, nadtlenki, P₄O₁₀, amfoteryczność, obserwacja/wniosek, karty powtórzeniowe); zastosowania przeniesione do rdzenia; uzupełnienia (stan skupienia, trend w grupie i wg stopnia utlenienia, przebieg doświadczeń, ograniczanie emisji, przykład stechiometrii spalania); poprawki (odwołania §, poziom doświadczenia 4, Berzelius/1787).<\/li><\/ul><\/div>\n<details><summary>Wcześniejsze wersje i audyty (dla autora)<\/summary>\n<div class=\"audit-panel\">\n<h4>Audyt merytoryczny i funkcjonalny v5.9 MASTER LAB<\/h4>\n<div class=\"audit-grid\">\n<div class=\"audit-item\"><strong>Spójność z N02:<\/strong> ten sam layout, te same karty (basic / understand / warning / error / extra / new / exam), te same oznaczenia warstw, ta sama nawigacja (TOC, FAB, bottom-nav), te same fiszki i quiz.<\/div>\n<div class=\"audit-item\"><strong>Widgety:<\/strong> Konstruktor wzorów tlenków, Detektor charakteru (18 tlenków), Miniaturowy układ okresowy, Modele VSEPR (6 cząsteczek), Symulator spalania (3 paliwa), Reaktor reakcji (~35 par), Mapa reakcji (3 ścieżki), Animacja „Tlenek w wodzie” (4 tryby), Wykrywacz CO₂, Wykres trendu charakteru, Kalkulator stopni utlenienia, Kalkulator stechiometrii, Stechiometria spalania, Test adaptacyjny.<\/div>\n<div class=\"audit-item\"><strong>Mosty dwukierunkowe:<\/strong> linki do Konstruktora Uniwersalnego, F01–F09 (fundamenty), N02. Bridge sekcja w treści.<\/div>\n<div class=\"audit-item\"><strong>Dodatki A–I:<\/strong> konfiguracje elektronowe, trend w okresie, przemysł, BHP, stechiometria, korozja, środowisko, mosty, technologia XXI wieku.<\/div>\n<div class=\"audit-item\"><strong>Sekcje nowe v4.0:<\/strong> VSEPR, Miniaturowy układ okresowy, Mapa reakcji, Trend charakteru, Kolory i nazwy zwyczajowe, Tlenki mieszane, Stopnie utlenienia, Tlenki w organizmach, Bezpieczeństwo, Historia, Redukcja tlenków, Termiczny rozkład, Typologia zadań E8, Test adaptacyjny, Karta szybkiego powtórzenia.<\/div>\n<div class=\"audit-item\"><strong>Tryb ciemny:<\/strong> przycisk w nagłówku, localStorage. <strong>Skip link, ARIA, focus states, print CSS.<\/strong><\/div>\n<div class=\"audit-item\"><strong>v5.7 — korekta modelu:<\/strong> uszczelniono rozróżnienie charakteru tlenku, reakcji z wodą i rozpuszczalności oraz złagodzono skrót „metal = jonowy / niemetal = kowalencyjny”.<\/div>\n<div class=\"audit-item\"><strong>v5.7 — procedura:<\/strong> dodano model decyzyjny i mikrokroki W–K–S–K: dane → stopień utlenienia → O²⁻ → indeksy → skrócenie → kontrola ładunku → kontrola chemiczna.<\/div>\n<div class=\"audit-item\"><strong>v5.7 — struktura:<\/strong> naprawiono uszkodzone znaczniki sekcji/div z wcześniejszych przebiegów bez usuwania treści merytorycznej.<\/div>\n<div class=\"audit-item\"><strong>v5.7 — reuse:<\/strong> dodano trwały rejestr istniejących wizualizacji, animacji i kalkulatorów z ID, funkcją, poziomem i oceną ponownego użycia.<\/div>\n<div class=\"audit-item\"><strong>v5.9 — N01 korekta:<\/strong> doprecyzowano nadtlenki, ponadtlenki, P₂O₅/P₄O₁₀, SiO₂, MgO, ograniczenia VSEPR, NO₂, Al₂O₃ w roztworze oraz model CO/CO₂.<\/div>\n<div class=\"audit-item\"><strong>v5.9 — LAB:<\/strong> dodano interaktywny komponent <code>obsInferenceLab<\/code> do rozdzielania obserwacji, wniosku i równania.<\/div>\n<\/div>\n<p style=\"margin-top:14px;\"><strong>Zachowana cała treść merytoryczna v3.3 + 15 nowych sekcji merytorycznych + 6 nowych widgetów.<\/strong><\/p>\n<p><strong>Numer:<\/strong> to jest <strong>N01<\/strong> (tlenki). Następna: N02 Wodorotlenki i zasady.<\/p>\n<\/div>\n<\/details>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA N01 v6.2 MASTER LAB<\/strong> · Tlenki · 2026<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<script>\ndocument.querySelectorAll('.flashcard').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('flipped')));\n\n<\/script>\n<script>\n(function(){\n  const pool=document.getElementById('adaptPool'),wrap=document.getElementById('adaptQuiz');\n  const BANKS={\n    A:[\n      {q:'Wzór tlenku sodu?',opts:['NaO','Na₂O','NaO₂','Na₂O₂'],ok:1,fb:'Na(I) + O(II) → Na₂O.'},\n      {q:'CaO + H₂O → ?',opts:['CaO₂','Ca(OH)₂','CaH₂','Ca + H₂O₂'],ok:1,fb:'Tlenek zasadowy + woda → wodorotlenek.'},\n      {q:'Charakter CO₂?',opts:['zasadowy','kwasowy','obojętny','amfoteryczny'],ok:1,fb:'Niemetal → kwasowy.'},\n      {q:'Nazwa Fe₂O₃?',opts:['tlenek żelaza','tlenek żelaza(II)','tlenek żelaza(III)','tlenek żelazowy'],ok:2,fb:'Fe na +III.'},\n      {q:'Wykrywanie CO₂?',opts:['woda bromowa','woda wapienna','fenolof torAll('.quiz-opt').forEach((x,j)=>{x.disabled=true;if(j===item.ok)x.classList.add('correct');});\n          const fb=document.getElementById('aq'+lvl+qi);\n          if(oi===item.ok){correct++;b.classList.add('correct');fb.className='quiz-fb show ok';fb.textContent='✓ '+item.fb;}\n          else{b.classList.add('wrong');fb.className='quiz-fb show bad';fb.textContent='✕ '+item.fb;}\n          if(answered===qs.length){\n            const sc=document.createElement('div');sc.style='text-align:center;padding:14px;background:var(--surface-soft);border-radius:var(--r-md);margin-top:12px;font-weight:800;color:var(--accent);';\n            sc.textContent='Wynik poziomu '+lvl+': '+correct+' / '+qs.length+' ('+Math.round(100*correct/qs.length)+'%)';\n            wrap.appendChild(sc);\n          }\n        });\n        opts.appendChild(b);\n      });\n      wrap.appendChild(d);\n    });\n  }\n  pool.querySelectorAll('button').forEach(b=>{\n    b.addEventListener('click',()=>{\n      pool.querySelectorAll('button').forEach(x=>x.classList.remove('active'));\n      b.classList.add('active');renderBank(b.dataset.lvl);\n    });\n  });\n  renderBank('A');\n})();\n\n<\/script>\n<script>\n(function(){\n  const wrap=document.getElementById('quizWrap'),scoreEl=document.getElementById('quizScore');\n  const Q=[\n    {q:'Wzór tlenku żelaza(III)?',opts:['FeO₃','Fe₂O₃','FeO','Fe₃O₂'],ok:1,fb:'W–K–S–K: Fe(III), O(II) → Fe₂O₃.'},\n    {q:'Charakter CO₂?',opts:['zasadowy','kwasowy','obojętny','amfoteryczny'],ok:1,fb:'Niemetal → kwasowy.'},\n    {q:'CaO + H₂O → ?',opts:['CaO₂','Ca(OH)₂','2 CaOH','Ca + H₂O₂'],ok:1,fb:'Tlenek zasadowy + woda → wodorotlenek.'},\n    {q:'CO (szkolnie) to tlenek:',opts:['zasadowy','kwasowy','obojętny','amfoteryczny'],ok:2,fb:'CO, NO, N₂O — obojętne.'},\n    {q:'SO₃ + H₂O → ?',opts:['H₂SO₃','H₂SO₄','SO₂ + H₂','H₂S'],ok:1,fb:'SO₃ to S(VI) → H₂SO₄.'},\n    {q:'MgO + H₂O w szkole:',opts:['gwałtownie jak CaO','praktycznie nie','daje MgO₂','wybucha'],ok:1,fb:'MgO reaguje z wodą bardzo słabo.'},\n    {q:'Nazwa Cu₂O?',opts:['tlenek miedzi','tlenek miedzi(II)','tlenek miedzi(I)','tlenek dwumiedzi'],ok:2,fb:'Cyfra rzymska obowiązkowa.'},\n    {q:'Al₂O₃ reaguje z HCl i NaOH. Charakter?',opts:['zasadowy','kwasowy','obojętny','amfoteryczny'],ok:3,fb:'Amfoteryczny.'},\n    {q:'Mn₂O₇ — charakter?',opts:['zasadowy','kwasowy','obojętny','amfoteryczny'],ok:1,fb:'Wyjątek: metal na +VII → kwasowy.'},\n    {q:'P₂O₅ — rzeczywista cząsteczka?',opts:['PO₂','P₂O₃','P₄O₁₀','P₄O₆'],ok:2,fb:'P₂O₅ empiryczny; P₄O₁₀ cząsteczka.'},\n    {q:'Wykrywanie CO₂?',opts:['woda bromowa','woda wapienna (mętnienie)','papierek uniwersalny','fenoloftaleina'],ok:1,fb:'CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O.'},\n    {q:'CO₂ + NaOH (nadmiar zasady) → ?',opts:['NaHCO₃','Na₂CO₃ + H₂O','Na₂O + C','CO + NaOH'],ok:1,fb:'Nadmiar zasady → węglan.'},\n    {q:'Kolor Fe₂O₃?',opts:['biały','czarny','rdzawy','zielony'],ok:2,fb:'Rdzawy (czerwono-brunatny).'},\n    {q:'OF₂ — to:',opts:['tlenek','fluorek tlenu','wodorek','nadtlenek'],ok:1,fb:'Fluor elektroujemniejszy niż tlen.'},\n    {q:'Redukcja CuO wodorem?',opts:['CuO + H₂ → Cu + H₂O','CuO + H₂ → CuH₂ + O','CuO + H₂ → Cu₂O','nie zachodzi'],ok:0,fb:'Klasyczna redukcja wodorem.'}\n  ];\n  let answered=0,correct=0;\n  Q.forEach((item,qi)=>{\n    const d=document.createElement('div');d.className='quiz-q';\n    d.innerHTML='<h5>'+(qi+1)+'. '+item.q+'<\/h5><div class=\"quiz-opts\"><\/div><div class=\"quiz-fb\" id=\"qfb'+qi+'\"><\/div>';\n    const opts=d.querySelector('.quiz-opts');\n    item.opts.forEach((o,oi)=>{\n      const b=document.createElement('button');b.type='button';b.className='quiz-opt';b.textContent=o;\n      b.addEventListener('click',()=>{\n        if(d.dataset.done)return;d.dataset.done='1';answered++;\n        opts.querySelectorAll('.quiz-opt').forEach((x,j)=>{x.disabled=true;if(j===item.ok)x.classList.add('correct');});\n        const fb=document.getElementById('qfb'+qi);\n        if(oi===item.ok){correct++;b.classList.add('correct');fb.className='quiz-fb show ok';fb.textContent='✓ '+item.fb;}\n        else{b.classList.add('wrong');fb.className='quiz-fb show bad';fb.textContent='✕ '+item.fb;}\n        if(answered===Q.length){scoreEl.className='quiz-score show';scoreEl.textContent='Wynik: '+correct+' / '+Q.length+' ('+Math.round(100*correct/Q.length)+'%).';}\n      });\n      opts.appendChild(b);\n    });\n    wrap.appendChild(d);\n  });\n})();\n\n<\/script>\n<script>(function(){var b=document.getElementById(\"advToggle\");if(!b)return;var all=function(){return document.querySelectorAll(\"details.adv\")};var n=all().length;b.textContent=\"Pokaż treści akademickie (\"+n+\")\";b.addEventListener(\"click\",function(){var on=b.getAttribute(\"aria-pressed\")!==\"true\";all().forEach(function(d){d.open=on});b.setAttribute(\"aria-pressed\",on?\"true\":\"false\");b.textContent=(on?\"Ukryj\":\"Pokaż\")+\" treści akademickie (\"+n+\")\"});window.addEventListener(\"beforeprint\",function(){all().forEach(function(d){d.open=true})});})();<\/script>\n<\/body>\n<\/html>\n"</script>
