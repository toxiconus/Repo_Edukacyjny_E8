nt-confuse h4{margin:0 0 10px}.confuse-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.confuse-grid>div{border:1px solid #dbe3ec;border-radius:10px;padding:10px;background:#fff}.confuse-grid p{margin:5px 0 0;font-size:.92em}.rxn-cond{font-weight:800;padding:0 3px}.mm{font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px}.mm-root{background:#0d6868;color:#fff;font-weight:800;border-radius:12px;padding:10px 28px;letter-spacing:.06em}.mm-formula{font-family:inherit;border:2px solid #b06f1c;background:#fcf4e6;color:#7a4510;border-radius:10px;padding:8px 16px;text-align:center;font-weight:700;font-size:13px}.mm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;width:100%}.mm-box{display:block;text-align:left;font-family:inherit;border:2px solid var(--mm);border-radius:10px;padding:8px 12px;text-decoration:none;color:inherit;background:#fff}.mm-box:hover{background:#f8fafc}.mm-box b{color:var(--mm);font-size:12px;letter-spacing:.08em}.mm-box ul{margin:6px 0 0 16px;padding:0;font-size:13px}.mm-foot{font-family:inherit;background:#1a2332;color:#fff;border-radius:10px;padding:8px 16px;font-size:13px}.merge-h{margin:18px 0 8px}.che-prac-go{margin-top:8px;border:1px solid #0d6868;color:#0d6868;background:#fff;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}.che-prac-go:hover{background:#0d6868;color:#fff}.ox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}.ox-tile{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--border,#e5e9ee);border-radius:10px;background:var(--surface,#fff)}.ox-tile b{font:800 15px/1.2 inherit}.ox-tile small{color:var(--text-soft,#4a5568);font-size:12px}.ox-sw{display:block;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.15);margin-bottom:4px}<\/style><\/head>\n<body>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">N01 · CHEMIA · MASTER LAB v6.2<\/div><h1>Tlenki<\/h1><p class=\"lead\">Definicja i nazewnictwo, W–K–S–K, charakter (zasadowy, kwasowy, obojętny, amfoteryczny) ≠ reakcja z wodą ≠ rozpuszczalność, reakcje z wodą, kwasami i zasadami, otrzymywanie, redukcja, trendy, barwy, BHP i środowisko. Modele i dane z silnika CHE.OXIDES.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-extra\">AMBITNIE / LO<\/span><\/div><button aria-pressed=\"false\" class=\"adv-toggle\" id=\"advToggle\" type=\"button\">Pokaż treści akademickie<\/button><\/section>\n<div class=\"minimum-card\" id=\"minimum\">\n<h3>Muszę umieć na E8 — 7 kluczowych faktów<\/h3>\n<ol>\n<li><strong>Tlenek<\/strong> = związek tlenu z innym pierwiastkiem (metalem lub niemetalem). Wzór ogólny: EₓOᵧ.<\/li>\n<li><strong>Nazwa ↔ wzór ↔ wartościowość<\/strong> (W–K–S–K): np. Fe(III) + O(II) → Fe₂O₃.<\/li>\n<li><strong>Charakter:<\/strong> aktywny metal 1–2 → często <span class=\"hl\">zasadowy<\/span>; niemetal → często <span class=\"hl\">kwasowy<\/span>; CO, NO, N₂O → <span class=\"hl\">obojętny (szkolnie)<\/span>; Al₂O₃, ZnO → <span class=\"hl\">amfoteryczny<\/span>. To heurystyka — sprawdź konkretny tlenek i wyjątki.<\/li>\n<li><strong>Tlenek zasadowy + H₂O<\/strong> → wodorotlenek (np. CaO + H₂O → Ca(OH)₂). <strong>MgO + H₂O<\/strong> praktycznie nie zachodzi.<\/li>\n<li><strong>Tlenek kwasowy + H₂O<\/strong> → kwas (SO₃ → H₂SO₄; CO₂ → H₂CO₃).<\/li>\n<li><strong>Tlenek + kwas / zasada<\/strong> → sól + woda (gdy charakter pasuje).<\/li>\n<li><strong>Obserwacja ≠ wniosek<\/strong> (mętnienie wody wapiennej ≠ „powstał CaCO₃” w zapisie obserwacji).<\/li>\n<\/ol>\n<\/div><details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#jak-pracowac\">1. Jak pracować z lekcją<\/a><a class=\"toc-link\" href=\"#cele\">2. Cele lekcji i pytanie przewodnie<\/a><a class=\"toc-link\" href=\"#kompas\">3. Kompas — co trzeba wiedzieć wcześniej<\/a><a class=\"toc-link\" href=\"#definicja\">4. Definicja i nazewnictwo<\/a><a class=\"toc-link\" href=\"#builder\">5. Wzór tlenku: W–K–S–K i stopnie utlenienia<\/a><a class=\"toc-link\" href=\"#charakter\">6. Charakter tlenków<\/a><a class=\"toc-link\" href=\"#oxide-decision-model\">7. Trzy pytania o tlenek: charakter ≠ reakcja z wodą ≠ rozpuszczalność<\/a><a class=\"toc-link\" href=\"#kolory\">8. Właściwości fizyczne: stan skupienia, barwy, nazwy zwyczajowe<\/a><a class=\"toc-link\" href=\"#otrzymywanie\">9. Otrzymywanie tlenków<\/a><a class=\"toc-link\" href=\"#reakcje\">10. Reakcje tlenków<\/a><a class=\"toc-link\" href=\"#zastosowania\">11. Zastosowania tlenków<\/a><a class=\"toc-link\" href=\"#bezpieczenstwo\">12. Bezpieczeństwo, zdrowie i środowisko<\/a><a class=\"toc-link\" href=\"#n01-why-sio2-mgo\">13. Wyjaśnienia „dlaczego”: budowa a charakter i reakcja z wodą<\/a><a class=\"toc-link\" href=\"#trend\">14. Trend charakteru tlenków: okres, grupa, stopień utlenienia<\/a><a class=\"toc-link\" href=\"#amfoterycznosc\">15. Amfoteryczność<\/a><a class=\"toc-link\" href=\"#p4o10\">16. P₂O₅ i P₄O₁₀ — wzór empiryczny a cząsteczka<\/a><a class=\"toc-link\" href=\"#mieszane\">17. Tlenki mieszane i nietypowe związki tlenu<\/a><a class=\"toc-link\" href=\"#vsepr\">18. Budowa przestrzenna cząsteczek tlenków (VSEPR)<\/a><a class=\"toc-link\" href=\"#redukcja\">19. Tlenki w reakcjach redoks: redukcja (metalurgia), utlenianie, rozkład<\/a><a class=\"toc-link\" href=\"#stechio\">20. Stechiometria tlenków i spalania<\/a><a class=\"toc-link\" href=\"#doswiadczenia\">21. Doświadczenia modelowe<\/a><a class=\"toc-link\" href=\"#klinika\">22. Klinika błędów<\/a><a class=\"toc-link\" href=\"#cwiczenia\">23. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#typologia-e8\">24. Typologia zadań E8<\/a><a class=\"toc-link\" href=\"#test\">25. Sprawdź się: test, test adaptacyjny, quiz<\/a><a class=\"toc-link\" href=\"#karta\">26. Karta szybkiego powtórzenia<\/a><a class=\"toc-link\" href=\"#fiszki\">27. Fiszki<\/a><a class=\"toc-link\" href=\"#mapa\">28. Mapa myśli<\/a><a class=\"toc-link\" href=\"#slownik\">29. Słownik<\/a><a class=\"toc-link\" href=\"#checklista\">30. Checklista<\/a><a class=\"toc-link\" href=\"#organizmy\">A. Dodatek A — tlenki w organizmach<\/a><a class=\"toc-link\" href=\"#dod-f\">B. Dodatek B — korozja i pasywacja<\/a><a class=\"toc-link\" href=\"#historia\">C. Dodatek C — historia odkrycia tlenków<\/a><a class=\"toc-link\" href=\"#dod-i\">D. Dodatek D — tlenki w technologii XXI w.<\/a><a class=\"toc-link\" href=\"#dod-h\">E. Dodatek E — mosty do kolejnych lekcji<\/a><a class=\"toc-link\" href=\"#wiz-reg-l002\">↻. Modele silnika w tej lekcji<\/a><a class=\"toc-link\" href=\"#audyt\">✓. Audyt jakości<\/a><\/nav><\/details>\n\n<div class=\"layer-legend\">\n<div class=\"layer-row\"><span class=\"dot e8\"><\/span><span><b>E8:<\/b> nazewnictwo, charakter, reakcje z wodą, kwasami, zasadami; otrzymywanie, zastosowania, BHP i środowisko<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot understand\"><\/span><span><b>Rozumienie:<\/b> skąd charakter, dlaczego nie każdy tlenek reaguje z wodą<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot extra\"><\/span><span><b>Ambitne (LO):<\/b> amfoteryczność, P₄O₁₀, trendy w układzie okresowym, VSEPR, tlenki nietypowe, redoks i metalurgia, stechiometria (mole), korozja<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot contest\"><\/span><span><b>Ponad LO:<\/b> rozwijane bloki „treści akademickie” — przycisk w nagłówku lekcji<\/span><\/div>\n<\/div>\n<div class=\"core-path\" id=\"rdzen\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to (ok. 30 min)<\/div>\n<ol>\n<li><strong>Sekcje <a href=\"#definicja\">§4<\/a>–<a href=\"#oxide-decision-model\">§7<\/a><\/strong> — definicja, nazewnictwo, wzory, charakter, trzy pytania o tlenek.<\/li>\n<li><strong>Konstruktor wzorów tlenków<\/strong> (<a href=\"#builder\">§5<\/a>) — zbuduj Fe₂O₃, Al₂O₃, N₂O₅.<\/li>\n<li><strong>Detektor charakteru<\/strong> (<a href=\"#charakter\">§6<\/a>) — sprawdź Na₂O, SO₂, CO, Al₂O₃.<\/li>\n<li><strong>Reaktor reakcji<\/strong> (<a href=\"#reakcje\">§10<\/a>) — CaO+H₂O, SO₃+H₂O, CuO+HCl, CO₂+NaOH.<\/li>\n<li><strong>Reakcje kluczowe + Klinika błędów<\/strong>.<\/li>\n<li><strong>Ćwiczenia + Fiszki + Quiz<\/strong>.<\/li>\n<\/ol>\n<p class=\"mini-note\">Modele silnika stoją przy sekcjach, których dotyczą (wzór tlenku i stopnie utlenienia — <a href=\"#builder\">§5<\/a>, trzy pytania o tlenek — <a href=\"#charakter\">§6<\/a>, reakcje — <a href=\"#reakcje\">§10<\/a>, doświadczenia — <a href=\"#doswiadczenia\">§21<\/a>); pełna lista: <a href=\"#wiz-reg-l002\">Modele silnika w tej lekcji<\/a>. Następna lekcja: <strong>N02 Wodorotlenki i zasady<\/strong> (Lekcje → Chemia).<\/p>\n<\/div>\n<section id=\"jak-pracowac\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Jak pracować z lekcją<\/div>\n<div class=\"card card-understand\">\n<ol>\n<li><strong>Nie czytaj biernie.<\/strong> Po każdym akapicie: „Co ja z tego zapamiętam?”.<\/li>\n<li><strong>Najpierw próbuj, potem patrz na odpowiedź.<\/strong><\/li>\n<li><strong>Powtarzaj w odstępach:<\/strong> dziś → jutro → za 3 dni → za tydzień.<\/li>\n<li><strong>Mów na głos.<\/strong> Czytaj wzory: „Al-dwa-O-trzy”.<\/li>\n<li><strong>Rysuj.<\/strong> Krzyżowanie, tabele, mapy myśli.<\/li>\n<li><strong>Łap moment „aha!”.<\/strong><\/li>\n<\/ol>\n<p class=\"mini-note\">Zasada 80/20: nazewnictwo, charakter tlenku, reakcja z wodą.<\/p>\n<\/div>\n<div class=\"mnemonic\">\n<b>Mnemotechniki rdzeniowe:<\/b>\n<ol>\n<li>O najczęściej II — w modelu szkolnym.<\/li>\n<li>Metal → zasadowy, niemetal → kwasowy.<\/li>\n<li>Tlenek + woda → wodorotlenek (metal) / kwas (niemetal).<\/li>\n<li>Tlenek zasadowy + kwas → sól + woda.<\/li>\n<li>Tlenek kwasowy + zasada → sól + woda.<\/li>\n<\/ol>\n<\/div>\n<\/section>\n<section id=\"cele\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Cele lekcji i pytanie przewodnie <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Po tej lekcji uczeń<\/span>\n<ul>\n<li>definiuje tlenek i ustala <strong>nazwę ↔ wzór ↔ wartościowość<\/strong>,<\/li>\n<li>klasyfikuje charakter: zasadowy / kwasowy / obojętny / amfoteryczny,<\/li>\n<li>zapisuje równania: pierwiastek + O₂; tlenek + H₂O; tlenek + kwas / zasada,<\/li>\n<li>rozróżnia obserwację i wniosek (woda wapienna + CO₂),<\/li>\n<li>podaje zastosowania: CaO, SiO₂, Fe₂O₃, CO₂,<\/li>\n<li>(ambitnie) wyjaśnia amfoteryczność i trendy w układzie okresowym,<\/li>\n<li>(ambitnie) rozpoznaje tlenki mieszane i nietypowe,<\/li>\n<li>(zaawansowanie) zna most do redoks, stechiometrii i metalurgii.<\/li>\n<\/ul>\n<\/div>\n\n<div class=\"card card-exam\">\n<span class=\"card-label\">Pytanie przewodnie<\/span>\n<p>Do jednej zlewki z wodą wsypujemy biały CaO, do drugiej czarny CuO, a do trzeciej wprowadzamy CO₂. W pierwszej woda się rozgrzewa, a fenoloftaleina barwi się na malinowo; w drugiej proszek leży na dnie bez zmian; w trzeciej wskaźnik uniwersalny zmienia barwę na żółtopomarańczową (odczyn lekko kwasowy). <strong>Dlaczego trzy tlenki zachowują się tak różnie?<\/strong><\/p>\n<p class=\"mini-note\">Odpowiedź budujesz w <a href=\"#charakter\">§6<\/a> (charakter), <a href=\"#oxide-decision-model\">§7<\/a> (trzy pytania o tlenek) i <a href=\"#n01-why-sio2-mgo\">§13<\/a> (wyjaśnienia „dlaczego”).<\/p>\n<\/div>\n<\/section>\n<section id=\"kompas\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Kompas — co trzeba wiedzieć wcześniej<\/div>\n<div class=\"card card-understand\">\n<ul>\n<li>wartościowość (H–I, O–II, Al–III, C–IV…),<\/li>\n<li><strong>W–K–S–K<\/strong> (wartościowość → krzyżuj → skróć → kontrola),<\/li>\n<li>współczynniki tak, indeksy nie,<\/li>\n<li>bilans atomów w równaniu,<\/li>\n<li>elektroujemność i rodzaj wiązania (jonowe / kowalencyjne) — potrzebne w <a href=\"#n01-why-sio2-mgo\">§13<\/a>,<\/li>\n<li>odczyn roztworu i wskaźniki (fenoloftaleina, wskaźnik uniwersalny) — potrzebne w doświadczeniach <a href=\"#doswiadczenia\">§21<\/a>.<\/li>\n<\/ul>\n<p class=\"mini-note\">Lekcje fundamentów F01–F09 (fundamenty): wartościowość, W–K–S–K, bilans. Bez tego konstruktor wzorów tlenków będzie loterią.<\/p>\n<\/div>\n<\/section>\n<section id=\"definicja\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Definicja i nazewnictwo <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Definicja<\/span>\n<p><strong>Tlenek<\/strong> to związek chemiczny tlenu z innym pierwiastkiem, w którym tlen występuje na stopniu utlenienia −II i nie tworzy charakterystycznej grupy nadtlenkowej O₂²⁻ ani ponadtlenkowej O₂⁻. W szkolnych zadaniach najczęściej rozpatrujemy zwykłe tlenki, np. MgO, CO₂, Fe₂O₃. <strong>H₂O₂ i Na₂O₂ są nadtlenkami, a OF₂ jest fluorkiem tlenu, nie tlenkiem.<\/strong><\/p>\n<p class=\"mini-note\"><strong>Dlaczego:<\/strong> w nadtlenkach (H₂O₂, Na₂O₂) tlen ma stopień utlenienia <strong>−I<\/strong> (wiązanie O–O), a w OF₂ — <strong>+II<\/strong>, bo fluor jest bardziej elektroujemny niż tlen, więc to tlen „oddaje” elektrony. Tabela wszystkich typów związków tlenu — <a href=\"#mieszane\">§17<\/a>.<\/p>\n<p class=\"mini-note\"><strong>Wzór schematyczny:<\/strong> w wielu prostych zadaniach tlenek zapisujemy jako EₓOᵧ, ale nie jest to uniwersalny wzór wszystkich tlenków.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Uwaga szkolna<\/span>\n<p><strong>Rozdziel dwa modele:<\/strong> w tlenkach jonowych, np. Na₂O i CaO, można opisywać tlen jako jon tlenkowy O²⁻. W tlenkach kowalencyjnych, np. CO₂, SO₂ i SiO₂, nie należy wyobrażać sobie swobodnych jonów O²⁻ — używamy przede wszystkim pojęcia <strong>stopnia utlenienia tlenu −II<\/strong>.<\/p>\n<\/div>\n<h3>Reguła nazewnictwa<\/h3>\n<div class=\"card card-basic\">\n<ul>\n<li>„tlenek” + nazwa pierwiastka,<\/li>\n<li>jeśli pierwiastek może tworzyć <strong>kilka tlenków<\/strong>, stopień utlenienia podaje się cyfrą rzymską (np. tlenek żelaza(II)/(III)). Na E8 stosuj systematyczne nazwy z cyfrą, gdy trzeba jednoznacznie wskazać wzór,<\/li>\n<li>np. Fe₂O₃ = tlenek żelaza(III), CuO = tlenek miedzi(II),<\/li>\n<li>pierwiastki o jednej wartościowości w tlenkach (np. Na, K, Ca, Mg, Al, Zn) — cyfry nie podajemy: tlenek sodu, tlenek glinu,<\/li>\n<li>nazwy z przedrostkami liczebnikowymi (dwutlenek węgla, trójtlenek siarki, pięciotlenek fosforu) są potoczne; w zadaniach używaj nazw z cyfrą rzymską.<\/li>\n<\/ul>\n<\/div>\n<div class=\"table-wrap\">\n<table class=\"mobile-stack\">\n<thead><tr><th>Wzór<\/th><th>Nazwa<\/th><th>Uwaga<\/th><\/tr><\/thead>\n<tbody>\n<tr><td data-label=\"Wzór\"><code>Na₂O<\/code><\/td><td data-label=\"Nazwa\">tlenek sodu<\/td><td data-label=\"Uwaga\">metal grupy 1<\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>K₂O<\/code><\/td><td data-label=\"Nazwa\">tlenek potasu<\/td><td data-label=\"Uwaga\"><\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>CaO<\/code><\/td><td data-label=\"Nazwa\">tlenek wapnia<\/td><td data-label=\"Uwaga\">wapno palone<\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>MgO<\/code><\/td><td data-label=\"Nazwa\">tlenek magnezu<\/td><td data-label=\"Uwaga\"><\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>Al₂O₃<\/code><\/td><td data-label=\"Nazwa\">tlenek glinu<\/td><td data-label=\"Uwaga\"><\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>FeO<\/code><\/td><td data-label=\"Nazwa\">tlenek żelaza(II)<\/td><td data-label=\"Uwaga\">cyfra obowiązkowa<\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>Fe₂O₃<\/code><\/td><td data-label=\"Nazwa\">tlenek żelaza(III)<\/td><td data-label=\"Uwaga\">cyfra obowiązkowa<\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>Cu₂O<\/code><\/td><td data-label=\"Nazwa\">tlenek miedzi(I)<\/td><td data-label=\"Uwaga\">cyfra obowiązkowa<\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>CuO<\/code><\/td><td data-label=\"Nazwa\">tlenek miedzi(II)<\/td><td data-label=\"Uwaga\">cyfra obowiązkowa<\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>CO<\/code><\/td><td data-label=\"Nazwa\">tlenek węgla(II) / czad<\/td><td data-label=\"Uwaga\"><\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>CO₂<\/code><\/td><td data-label=\"Nazwa\">tlenek węgla(IV)<\/td><td data-label=\"Uwaga\">potocznie: dwutlenek węgla<\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>SO₂<\/code><\/td><td data-label=\"Nazwa\">tlenek siarki(IV)<\/td><td data-label=\"Uwaga\"><\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>SO₃<\/code><\/td><td data-label=\"Nazwa\">tlenek siarki(VI)<\/td><td data-label=\"Uwaga\"><\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>N₂O₅<\/code><\/td><td data-label=\"Nazwa\">tlenek azotu(V)<\/td><td data-label=\"Uwaga\"><\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>P₂O₅<\/code><\/td><td data-label=\"Nazwa\">tlenek fosforu(V)<\/td><td data-label=\"Uwaga\">Wzór empiryczny: P₂O₅; wzór cząsteczkowy: P₄O₁₀ (zapis szkolny vs cząsteczka) — <a href=\"#p4o10\">§16<\/a><\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>SiO₂<\/code><\/td><td data-label=\"Nazwa\">tlenek krzemu(IV)<\/td><td data-label=\"Uwaga\">krzemionka; kwasowy, ale z wodą praktycznie nie reaguje — <a href=\"#n01-why-sio2-mgo\">§13<\/a><\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>Cr₂O₃<\/code><\/td><td data-label=\"Nazwa\">tlenek chromu(III)<\/td><td data-label=\"Uwaga\">zielony<\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>MnO₂<\/code><\/td><td data-label=\"Nazwa\">tlenek manganu(IV)<\/td><td data-label=\"Uwaga\">czarny; piroluzyt<\/td><\/tr>\n<tr><td data-label=\"Wzór\"><code>PbO<\/code><\/td><td data-label=\"Nazwa\">tlenek ołowiu(II)<\/td><td data-label=\"Uwaga\">żółty; litargit<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/section>\n<section id=\"builder\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Wzór tlenku: W–K–S–K i stopnie utlenienia <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<p>Wybierz pierwiastek i jego <strong>stopień utlenienia / wartościowość używaną w tym zadaniu<\/strong>, następnie dobierz tlen (II). Algorytm <strong>W–K–S–K<\/strong>.<\/p>\n<div class=\"card card-understand\" style=\"margin:10px 0\">\n<span class=\"card-label\">Mikrokroki — zanim klikniesz „Zbuduj”<\/span>\n<p style=\"margin-bottom:6px\"><strong>1.<\/strong> nazwij stopień utlenienia → <strong>2.<\/strong> zapisz O²⁻ → <strong>3.<\/strong> dobierz najmniejsze indeksy dające sumę ładunków 0 → <strong>4.<\/strong> skróć wspólny dzielnik → <strong>5.<\/strong> sprawdź ładunek całkowity.<\/p>\n<p class=\"mini-note\" style=\"margin-bottom:0\">W–K–S–K jest procedurą zapisu wzoru, nie dowodem, że każdy taki zapis odpowiada stabilnemu związkowi.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n01-konstruktor-v01\"><button data-che-open-viz=\"n01-konstruktor-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n01-konstruktor-v01',lessonId:'N01'},'*')\" type=\"button\"><b>Konstruktor wzoru tlenku (W–K–S–K) i sprawdzanie wzoru — stopnie utlenienia, nadtlenki, OF₂<\/b><span>CHE.OXIDES.build / oxState<\/span><\/button><\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Przykład W–K–S–K<\/span><p>Fe(III) + O(II) → Fe₂O₃: wartościowości 3 i 2 → krzyżujemy → Fe₂O₃ → kontrola: 2·(+3) + 3·(−2) = 0.<\/p><p>Drugi przykład: S(VI) + O(II) → SO₃ (kontrola: +6 + 3·(−2) = 0).<\/p><p class=\"mini-note\">W–K–S–K nie zastępuje kontroli chemicznej. Po skrzyżowaniu sprawdź: (1) skrócenie indeksów, (2) bilans atomów, (3) suma stopni utlenienia = 0, (4) czy wzór jest znanym/możliwym związkiem.<\/p>\n<p class=\"mini-note\">Jak dobrać liczbę jonów O²⁻ do kationu (Na⁺ → Na₂O, Ca²⁺ → CaO, Al³⁺ → Al₂O₃) — w modelu konstruktora powyżej. Przykład: Na⁺ (+1) — dwa kationy na jeden O²⁻ (−2) → Na₂O; kontrola: 2·(+1) + 1·(−2) = 0.<\/p><\/div>\n<h3 class=\"merge-h\">Stopnie utlenienia w tlenkach<\/h3>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Zasada<\/span>\n<ul>\n<li>Tlen w tlenkach = <strong>−II<\/strong>.<\/li>\n<li>Suma stopni utlenienia w cząsteczce = 0.<\/li>\n<li>Wyznaczasz stopień utlenienia drugiego pierwiastka z równania.<\/li>\n<li>Wartościowość zapisujemy bez znaku (Fe — III), stopień utlenienia ze znakiem (Fe: +III); w zwykłych tlenkach mają tę samą wartość liczbową.<\/li>\n<\/ul>\n<p><strong>Przykład:<\/strong> Fe₂O₃ → 2·x + 3·(−2) = 0 → 2x = +6 → x = +III. Przykład mieszany: Fe₃O₄ można opisać jako FeO·Fe₂O₃ (1×Fe²⁺ + 2×Fe³⁺ + 4×O²⁻) — średni stopień Fe = +8/3 (tlenki mieszane — <a href=\"#mieszane\">§17<\/a>).<\/p>\n<p class=\"mini-note\">Kalkulator stopni utlenienia (także nadtlenki, OF₂, tlenki mieszane) — pole „Sprawdź wzór” w modelu konstruktora na początku tej sekcji. Tlenki jako utleniacze i reduktory — <a href=\"#redukcja\">§19<\/a>.<\/p>\n<\/div>\n<\/section>\n<section id=\"charakter\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Charakter tlenków <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-understand\" style=\"text-align:center\">\n<span class=\"card-label\">Trend (nie algorytm)<\/span>\n<p style=\"font-size:13px;margin:0 0 6px\">bardziej metaliczny charakter<\/p>\n<p style=\"font-family:'JetBrains Mono',monospace;font-weight:800;margin:0;letter-spacing:0.5px\">zasadowy ← amfoteryczny ← kwasowy<\/p>\n<p style=\"font-size:13px;margin:6px 0 0\">mniej metaliczny charakter · <em>ogólny trend, nie reguła dla każdego tlenku<\/em> · wyjaśnienie trendu — <a href=\"#trend\">§14<\/a><\/p>\n<\/div>\n<div class=\"char-type-grid\" id=\"charCards\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0\">\n<button class=\"char-type-card\" data-ch=\"zas\" style=\"text-align:left;padding:12px;border-radius:12px;border:2px solid #86efac;background:#f0fdf4;cursor:pointer;font:inherit\" type=\"button\">\n<strong style=\"color:#166534\">Zasadowy<\/strong>\n<div style=\"font-size:12px;margin-top:4px\">Na₂O, CaO, MgO*<\/div>\n<\/button>\n<button class=\"char-type-card\" data-ch=\"kwas\" style=\"text-align:left;padding:12px;border-radius:12px;border:2px solid #93c5fd;background:#eff6ff;cursor:pointer;font:inherit\" type=\"button\">\n<strong style=\"color:#1e40af\">Kwasowy<\/strong>\n<div style=\"font-size:12px;margin-top:4px\">CO₂, SO₂, SO₃, P₂O₅<\/div>\n<\/button>\n<button class=\"char-type-card\" data-ch=\"oboj\" style=\"text-align:left;padding:12px;border-radius:12px;border:2px solid #cbd5e1;background:#f8fafc;cursor:pointer;font:inherit\" type=\"button\">\n<strong style=\"color:#475569\">Obojętny<\/strong>\n<div style=\"font-size:12px;margin-top:4px\">CO, NO, N₂O<\/div>\n<\/button>\n<button class=\"char-type-card\" data-ch=\"amph\" style=\"text-align:left;padding:12px;border-radius:12px;border:2px solid #c4b5fd;background:#f5f3ff;cursor:pointer;font:inherit\" type=\"button\">\n<strong style=\"color:#5b21b6\">Amfoteryczny<\/strong>\n<div style=\"font-size:12px;margin-top:4px\">Al₂O₃, ZnO<\/div>\n<\/button>\n<\/div>\n<div aria-live=\"polite\" class=\"stage-box\" id=\"charCardStage\" style=\"margin-bottom:12px\">Szczegóły każdego tlenku (charakter, reakcja z wodą, z kwasem i z zasadą) — model „Tlenek — trzy pytania” poniżej.<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">4 typy<\/span>\n<div class=\"table-wrap\" style=\"margin-top:8px\">\n<table class=\"mobile-stack\">\n<thead><tr><th>Charakter<\/th><th>Typowo<\/th><th>Z wodą<\/th><th>Z kwasem<\/th><th>Z zasadą<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"ok-row\"><td data-label=\"Charakter\"><strong>Zasadowy<\/strong><\/td><td data-label=\"Typowo\">często aktywne metale<\/td><td data-label=\"Z wodą\">czasem → wodorotlenek*<\/td><td data-label=\"Z kwasem\">typowo → sól + H₂O<\/td><td data-label=\"Z zasadą\">brak typowej reakcji kwas–zasada w modelu E8<\/td><\/tr>\n<tr class=\"ok-row\"><td data-label=\"Charakter\"><strong>Kwasowy<\/strong><\/td><td data-label=\"Typowo\">często niemetale<\/td><td data-label=\"Z wodą\">czasem → kwas*<\/td><td data-label=\"Z kwasem\">brak typowej reakcji kwas–zasada w modelu E8<\/td><td data-label=\"Z zasadą\">typowo → sól + H₂O<\/td><\/tr>\n<tr><td data-label=\"Charakter\"><strong>Obojętny<\/strong><\/td><td data-label=\"Typowo\">CO, NO, N₂O<\/td><td data-label=\"Z wodą\">brak typowej reakcji kwas–zasada<\/td><td data-label=\"Z kwasem\">brak typowej reakcji kwas–zasada<\/td><td data-label=\"Z zasadą\">brak typowej reakcji kwas–zasada<\/td><\/tr>\n<tr><td data-label=\"Charakter\"><strong>Amfoteryczny<\/strong><\/td><td data-label=\"Typowo\">Al₂O₃, ZnO, BeO<\/td><td data-label=\"Z wodą\">zwykle nie<\/td><td data-label=\"Z kwasem\">tak<\/td><td data-label=\"Z zasadą\">tak<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\">*jeśli tlenek jest wystarczająco reaktywny / rozpuszczalny. SiO₂ praktycznie nie reaguje z wodą; MgO z wodą — bardzo słabo. Tabela „tlenek → woda” — <a href=\"#oxide-decision-model\">§7<\/a>.<\/p>\n<p class=\"mini-note\"><strong>„Obojętny”<\/strong> = klasyfikacja kwasowo-zasadowa w warunkach szkolnych (brak typowego tworzenia kwasu/zasady z wodą). <em>Nie oznacza<\/em>, że substancja nie uczestniczy w żadnej reakcji chemicznej.<\/p>\n<\/div>\n<h3>Jak rozpoznać w 10 sekund<\/h3>\n<div class=\"card card-core\">\n<p>Tlenki <strong>aktywnych metali<\/strong> mają zwykle charakter zasadowy, tlenki <strong>niemetali<\/strong> — zwykle kwasowy. <em>Nie bez wyjątków:<\/em> CrO₃, Mn₂O₇ — kwasowe; Al₂O₃, ZnO, BeO — amfoteryczne. Dlatego najpierw sprawdzaj wyjątki, potem regułę ogólną:<\/p>\n<ol>\n<li>Czy to w ogóle zwykły tlenek? H₂O₂, Na₂O₂, KO₂ → nadtlenki/ponadtlenki; OF₂ → fluorek tlenu (<a href=\"#definicja\">§4<\/a>).<\/li>\n<li>CO, NO, N₂O? → <strong>obojętny<\/strong> (szkolnie).<\/li>\n<li>Al, Zn, Be (a także Cr(III), Pb(II), Sn(II))? → <strong>amfoteryczny<\/strong>.<\/li>\n<li>Mn₂O₇, CrO₃? → <strong>kwasowy<\/strong> mimo że metal (wysoki stopień utlenienia — <a href=\"#trend\">§14<\/a>).<\/li>\n<li>Pozostałe tlenki metali (zwłaszcza grup 1–2) → <strong>zasadowy<\/strong>. MgO zasadowy, ale z wodą bardzo słabo (nie mylić z CaO).<\/li>\n<li>Niemetal? → zwykle <strong>kwasowy<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<h3 class=\"merge-h\">Sprawdź w układzie okresowym<\/h3>\n<p>Kliknij pierwiastek — zobacz typową wartościowość, wzór tlenku i charakter.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"periodic-54\"><button data-che-open-viz=\"periodic-54\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'periodic-54',lessonId:'N01'},'*')\" type=\"button\"><b>Układ okresowy 1–54 — pierwiastek, wartościowość, tlenek i jego charakter<\/b><span>CHE.DATA.ELEMENTS + CHE.OXIDES<\/span><\/button><\/div><div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n01-tlenki-v01\"><button data-che-open-viz=\"n01-tlenki-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n01-tlenki-v01',lessonId:'N01'},'*')\" type=\"button\"><b>Tlenek — trzy pytania: charakter, woda, kwas / zasada (detektor charakteru)<\/b><span>CHE.OXIDES · 39 tlenków · zlewka z wskaźnikiem uniwersalnym<\/span><\/button><\/div>\n<p class=\"mini-note\">CO jest tlenkiem obojętnym, a CO₂ kwasowym, choć oba to tlenki węgla — dlaczego, wyjaśnia <a href=\"#n01-why-sio2-mgo\">§13<\/a>.<\/p>\n<\/section>\n<section id=\"oxide-decision-model\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Trzy pytania o tlenek: charakter ≠ reakcja z wodą ≠ rozpuszczalność <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">E8 — najważniejsze rozróżnienie<\/span>\n<p><strong>Charakter tlenku ≠ reakcja z wodą ≠ rozpuszczalność.<\/strong> Charakter opisuje typowe zachowanie kwasowo-zasadowe, reakcja z wodą mówi, czy i pod jakimi warunkami zachodzi przemiana z wodą, a rozpuszczalność mówi, ile substancji przechodzi do roztworu.<\/p>\n<p>CuO jest zasadowy, ale nie reaguje z wodą; SiO₂ jest kwasowy, ale z wodą praktycznie nie reaguje; MgO jest zasadowy, ale z wodą reaguje bardzo słabo.<\/p>\n<\/div><div class=\"dont-confuse\">\n<h4>Nie myl tych pojęć<\/h4>\n<div class=\"confuse-grid\">\n<div><strong>Charakter tlenku<\/strong><p>zasadowy, kwasowy, obojętny lub amfoteryczny<\/p><\/div>\n<div><strong>Reakcja z wodą<\/strong><p>czy i jak przebiega przemiana z wodą w danych warunkach<\/p><\/div>\n<div><strong>Rozpuszczalność<\/strong><p>ile substancji przechodzi do roztworu<\/p><\/div>\n<\/div>\n<\/div>\n<div class=\"table-wrap\"><table class=\"mobile-stack\"><thead><tr><th>Pytanie<\/th><th>Nie myl z<\/th><th>Przykład<\/th><\/tr><\/thead><tbody>\n<tr><td data-label=\"Pytanie\">Jaki charakter?<\/td><td data-label=\"Nie myl z\">czy reaguje z wodą<\/td><td data-label=\"Przykład\">CuO — zasadowy, ale bez reakcji z wodą<\/td><\/tr>\n<tr><td data-label=\"Pytanie\">Czy reaguje z wodą?<\/td><td data-label=\"Nie myl z\">czy jest rozpuszczalny<\/td><td data-label=\"Przykład\">CaO reaguje; SiO₂ praktycznie nie<\/td><\/tr>\n<tr><td data-label=\"Pytanie\">Jaki typ wiązania?<\/td><td data-label=\"Nie myl z\">czy tlenek jest „metalowy”<\/td><td data-label=\"Przykład\">charakter wiązania jest ciągły, nie binarny<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Co widzę → jaki model → jaka reguła → jak sprawdzę<\/span>\n<ol>\n<li><strong>Rozpoznaj wzór:<\/strong> dwa różne pierwiastki, z których jednym jest O. Sprawdź, czy nie jest to nadtlenek/ponadtlenek ani OF₂.<\/li>\n<li><strong>Ustal zapis:<\/strong> w zwykłym tlenku szkolnym przyjmij O na −II i policz stopień utlenienia drugiego pierwiastka.<\/li>\n<li><strong>Nie wyciągaj charakteru tylko z układu okresowego:<\/strong> użyj trendu jako hipotezy, a następnie sprawdź reakcje.<\/li>\n<li><strong>Oddziel trzy pytania:<\/strong> charakter kwasowo-zasadowy, reakcja z wodą i rozpuszczalność.<\/li>\n<li><strong>Jeżeli zachodzi reakcja:<\/strong> zapisz produkty → zbilansuj współczynniki → sprawdź atomy → sprawdź sens chemiczny.<\/li>\n<\/ol>\n<div class=\"microsteps\"><strong>1.<\/strong> Jaki charakter? → <strong>2.<\/strong> Czy reaguje z wodą? → <strong>3.<\/strong> Czy reaguje z kwasem lub zasadą?<\/div>\n<div class=\"mini-note\"><strong>Mini-przykład:<\/strong> CuO → O(−II), więc Cu(+II). Tlenek jest zasadowy, ale <strong>nie reaguje z wodą<\/strong>; z HCl reaguje: CuO + 2 HCl → CuCl₂ + H₂O.<\/div>\n<div class=\"microsteps\"><strong>SiO₂:<\/strong> kwasowy → z wodą praktycznie nie → z mocną zasadą, zwykle po ogrzaniu, tak.<\/div>\n<\/div>\n<div class=\"card card-basic\" id=\"solOxides\">\n<span class=\"card-label\">Tlenki a woda — tabela (charakter ≠ rozpuszczalność)<\/span>\n<div class=\"table-wrap table-compact\">\n<table class=\"char-table\">\n<thead><tr><th>Tlenek<\/th><th>Charakter<\/th><th>Z wodą (szkolnie)<\/th><th>Przykład / uwaga<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"ok-row sol-good\"><td>Na₂O, K₂O, Li₂O<\/td><td>zasadowy<\/td><td><strong>tak<\/strong> — reagują z wodą<\/td><td>Na₂O + H₂O → 2 NaOH<\/td><\/tr>\n<tr class=\"ok-row sol-good\"><td>CaO, BaO, SrO<\/td><td>zasadowy<\/td><td><strong>tak<\/strong> — reagują z wodą<\/td><td>CaO + H₂O → Ca(OH)₂ (egzo)<\/td><\/tr>\n<tr><td>MgO<\/td><td>zasadowy<\/td><td><strong>bardzo słabo<\/strong> reaguje z wodą<\/td><td>szkolnie: praktycznie nie — dlaczego: <a href=\"#n01-why-sio2-mgo\">§13<\/a><\/td><\/tr>\n<tr><td>CuO, FeO, Fe₂O₃<\/td><td>zasadowy<\/td><td><strong>nie<\/strong><\/td><td>nie reagują z wodą; z kwasami tak<\/td><\/tr>\n<tr><td>Al₂O₃, ZnO, BeO<\/td><td>amfoteryczny<\/td><td>zwykle nie<\/td><td>z kwasem i zasadą<\/td><\/tr>\n<tr class=\"ok-row sol-good\"><td>SO₂, SO₃<\/td><td>kwasowy<\/td><td><strong>tak<\/strong> — reagują z wodą<\/td><td>→ kwas: H₂SO₃, H₂SO₄<\/td><\/tr>\n<tr class=\"ok-row sol-good\"><td>N₂O₅, P₂O₅<\/td><td>kwasowy<\/td><td><strong>tak<\/strong> — reagują z wodą<\/td><td>→ kwas: HNO₃, H₃PO₄<\/td><\/tr>\n<tr><td>CO₂<\/td><td>kwasowy<\/td><td>częściowo (⇌)<\/td><td>CO₂ + H₂O ⇌ H₂CO₃<\/td><\/tr>\n<tr><td>SiO₂<\/td><td>kwasowy<\/td><td><strong>nie<\/strong><\/td><td>praktycznie nie reaguje z wodą; z mocnymi zasadami tak (sieć; z mocną zasadą (Δ))<\/td><\/tr>\n<tr class=\"ok-row sol-good\"><td>Cl₂O₇, Mn₂O₇, CrO₃<\/td><td>kwasowy<\/td><td><strong>tak<\/strong><\/td><td>metal na wysokim stopniu utlenienia (Mn, Cr) — mimo to tlenek kwasowy<\/td><\/tr>\n<tr class=\"error-row\"><td>CO, NO, N₂O<\/td><td>obojętny (szkolnie)<\/td><td>nie<\/td><td>brak typowej reakcji kwas–zasada w modelu szkolnym; nie oznacza to chemicznej bierności<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\">To samo tło kolorystyczne co N02 (rozpuszczalność OH): zielony ≈ wyraźna reakcja z wodą.<\/p>\n<\/div>\n<p>Zobacz, co dzieje się z tlenkiem zasadowym i kwasowym w wodzie.<\/p>\n<p class=\"mini-note\">Co dzieje się z CaO, SO₃, CO₂ i CuO w wodzie — przycisk „Do wody” w modelu z <a href=\"#charakter\">§6<\/a> (zlewka ze wskaźnikiem) oraz pracownia doświadczeń w <a href=\"#doswiadczenia\">§21<\/a>.<\/p>\n<\/section>\n<section id=\"kolory\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Właściwości fizyczne: stan skupienia, barwy, nazwy zwyczajowe <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Stan skupienia i temperatura topnienia<\/span>\n<p>Tlenki metali są w warunkach pokojowych <strong>ciałami stałymi o wysokich temperaturach topnienia<\/strong> (MgO ok. 2850 °C, CaO ok. 2600 °C, Al₂O₃ ok. 2050 °C), bo tworzą sieci jonowe lub jonowo-kowalencyjne. Tlenki niemetali zbudowane z małych cząsteczek są często <strong>gazami<\/strong> (CO, CO₂, SO₂, NO, NO₂, N₂O), cieczami (H₂O, Mn₂O₇ — oleista ciecz) lub łatwo topliwymi ciałami stałymi (SO₃, P₄O₁₀).<\/p>\n<p class=\"mini-note\">Wyjątek: SiO₂ to niemetal, ale tworzy sieć kowalencyjną — ciało stałe o temperaturze topnienia ok. 1700 °C (<a href=\"#n01-why-sio2-mgo\">§13<\/a>).<\/p>\n<\/div>\n<h3 class=\"merge-h\">Barwy i nazwy zwyczajowe<\/h3>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Wzór<\/th><th>Kolor<\/th><th>Nazwa zwyczajowa<\/th><th>Występowanie<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><code>CuO<\/code><\/td><td>czarny<\/td><td>—<\/td><td>produkt utleniania miedzi<\/td><\/tr>\n<tr><td><code>Cu₂O<\/code><\/td><td>czerwony<\/td><td>kupryt<\/td><td>ruda miedzi<\/td><\/tr>\n<tr><td><code>Fe₂O₃<\/code><\/td><td>rdzawy (czerwono-brunatny)<\/td><td>hematyt<\/td><td>hematyt; składnik produktów korozji; pigment<\/td><\/tr>\n<tr><td><code>Fe₃O₄<\/code><\/td><td>czarny<\/td><td>magnetyt<\/td><td>ruda żelaza, magnetyt<\/td><\/tr>\n<tr><td><code>PbO<\/code><\/td><td>żółty<\/td><td>litargit<\/td><td>pigment, szkło ołowiowe<\/td><\/tr>\n<tr><td><code>Pb₃O₄<\/code><\/td><td>czerwony<\/td><td>minia<\/td><td>pigment, dawne farby<\/td><\/tr>\n<tr><td><code>ZnO<\/code><\/td><td>biały<\/td><td>—<\/td><td>maści, guma, pigment<\/td><\/tr>\n<tr><td><code>Al₂O₃<\/code><\/td><td>biały<\/td><td>korund<\/td><td>z domieszkami: rubin, szafir<\/td><\/tr>\n<tr><td><code>TiO₂<\/code><\/td><td>biały<\/td><td>rutyl<\/td><td>pigment, filtry UV<\/td><\/tr>\n<tr><td><code>Cr₂O₃<\/code><\/td><td>zielony<\/td><td>eskolait (minerał)<\/td><td>pigment<\/td><\/tr>\n<tr><td><code>MnO₂<\/code><\/td><td>czarny<\/td><td>piroluzyt<\/td><td>ruda manganu<\/td><\/tr>\n<tr><td><code>HgO<\/code><\/td><td>czerwony / żółty<\/td><td>—<\/td><td>historyczna metoda otrzymywania O₂<\/td><\/tr>\n<tr><td><code>Ag₂O<\/code><\/td><td>brunatny / czarny<\/td><td>—<\/td><td>rozkład<\/td><\/tr>\n<tr><td><code>SiO₂<\/code><\/td><td>bezbarwny<\/td><td>kwarc, krzemionka<\/td><td>piasek, szkło<\/td><\/tr>\n<\/tbody>\n<\/table><h4 style=\"margin:14px 0 6px\">Barwy tlenków — dane silnika<\/h4><div class=\"ox-grid\"><div class=\"ox-tile\" data-ox=\"Li2O\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>Li₂O<\/b><small>biały · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"Na2O\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>Na₂O<\/b><small>biały · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"K2O\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>K₂O<\/b><small>biały / jasnożółty · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"MgO\" data-ox-col=\"#f1f5f9\"><span class=\"ox-sw\" style=\"background:#f1f5f9\"><\/span><b>MgO<\/b><small>biały · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"CaO\" data-ox-col=\"#e2e8f0\"><span class=\"ox-sw\" style=\"background:#e2e8f0\"><\/span><b>CaO<\/b><small>biały · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"BeO\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>BeO<\/b><small>biały · amfoteryczny<\/small><\/div><div class=\"ox-tile\" data-ox=\"Al2O3\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>Al₂O₃<\/b><small>biały · amfoteryczny<\/small><\/div><div class=\"ox-tile\" data-ox=\"ZnO\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>ZnO<\/b><small>biały (na gorąco żółty) · amfoteryczny<\/small><\/div><div class=\"ox-tile\" data-ox=\"FeO\" data-ox-col=\"#1f2937\"><span class=\"ox-sw\" style=\"background:#1f2937\"><\/span><b>FeO<\/b><small>czarny · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"Fe2O3\" data-ox-col=\"#9a3412\"><span class=\"ox-sw\" style=\"background:#9a3412\"><\/span><b>Fe₂O₃<\/b><small>czerwonobrunatny (hematyt) · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"Cu2O\" data-ox-col=\"#b91c1c\"><span class=\"ox-sw\" style=\"background:#b91c1c\"><\/span><b>Cu₂O<\/b><small>czerwony (kupryt) · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"CuO\" data-ox-col=\"#1e293b\"><span class=\"ox-sw\" style=\"background:#1e293b\"><\/span><b>CuO<\/b><small>czarny · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"HgO\" data-ox-col=\"#dc2626\"><span class=\"ox-sw\" style=\"background:#dc2626\"><\/span><b>HgO<\/b><small>czerwony lub żółty (zależnie od otrzymywania) · zasadowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"MnO2\" data-ox-col=\"#3f3f46\"><span class=\"ox-sw\" style=\"background:#3f3f46\"><\/span><b>MnO₂<\/b><small>brunatnoczarny · amfoteryczny<\/small><\/div><div class=\"ox-tile\" data-ox=\"CrO3\" data-ox-col=\"#b91c1c\"><span class=\"ox-sw\" style=\"background:#b91c1c\"><\/span><b>CrO₃<\/b><small>ciemnoczerwony · kwasowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"Mn2O7\" data-ox-col=\"#4c1d95\"><span class=\"ox-sw\" style=\"background:#4c1d95\"><\/span><b>Mn₂O₇<\/b><small>ciemnozielona oleista ciecz · kwasowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"B2O3\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>B₂O₃<\/b><small>bezbarwny / biały · kwasowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"SiO2\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>SiO₂<\/b><small>bezbarwny (kwarc), biały (piasek) · kwasowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"NO2\" data-ox-col=\"#b45309\"><span class=\"ox-sw\" style=\"background:#b45309\"><\/span><b>NO₂<\/b><small>brunatny gaz · kwasowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"N2O5\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>N₂O₅<\/b><small>bezbarwne kryształy · kwasowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"P2O5\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>P₂O₅<\/b><small>biały · kwasowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"P4O10\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>P₄O₁₀<\/b><small>biały · kwasowy<\/small><\/div><div class=\"ox-tile\" data-ox=\"SO3\" data-ox-col=\"#f8fafc\"><span class=\"ox-sw\" style=\"background:#f8fafc\"><\/span><b>SO₃<\/b><small>biały (ciało stałe) / bezbarwna ciecz · kwasowy<\/small><\/div><\/div><p class=\"mini-note\">Kolor próbki ≈ barwa substancji (poglądowo), z CHE.DATA.OXIDES — ten sam rekord czytają Atlas i modele. Rdza nie jest czystym Fe₂O₃ — to mieszanina uwodnionych tlenków i wodorotlenków żelaza (przybliżenie Fe₂O₃·nH₂O).<\/p>\n<\/div>\n<p class=\"mini-note\">Znajomość kolorów pomaga rozpoznawać tlenki w doświadczeniach i identyfikować osady.<\/p>\n<\/section>\n<section id=\"otrzymywanie\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Otrzymywanie tlenków <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3>9.1 Najczęstsza metoda E8<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Pierwiastek + tlen<\/span>\n<div class=\"formula-lg\" data-rx=\"mgO2\">2 Mg + O₂ → 2 MgO<\/div>\n<div class=\"formula-lg\" data-rx=\"sO2\">S + O₂ → SO₂<\/div>\n<div class=\"formula-lg\" data-rx=\"alO2\">4 Al + 3 O₂ → 2 Al₂O₃<\/div>\n<div class=\"formula-lg\" data-rx=\"cO2\">C + O₂ → CO₂ (nadmiar O₂)<\/div>\n<div class=\"formula-lg\" data-rx=\"pO2\">4 P + 5 O₂ → 2 P₂O₅ (zapis szkolny; rzeczywisty produkt: P₄O₁₀)<\/div>\n<p class=\"mini-note\">Typ reakcji: synteza (łączenie).<\/p>\n<p><strong>Równanie krok po kroku — 2 Mg + O₂:<\/strong> (1) zapisz substraty i produkt: Mg + O₂ → MgO; (2) tlenu po lewej 2 atomy, po prawej 1 → przed MgO wpisz 2; (3) teraz magnezu po prawej 2 → przed Mg wpisz 2; (4) kontrola.<\/p>\n<p class=\"mini-note\">Bilans: Mg 2 = 2 ✓ · O 2 = 2 ✓. Synteza tlenku; MgO z wodą reaguje bardzo słabo (≠ CaO) — most do N02.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Spalanie związków chemicznych<\/span>\n<p>Tlenki powstają też przy spalaniu związków — każdy pierwiastek (poza tlenem) przechodzi w swój tlenek: CH₄ + 2 O₂ → CO₂ + 2 H₂O; 2 H₂S + 3 O₂ → 2 SO₂ + 2 H₂O.<\/p>\n<\/div>\n<h3>9.2 Inne drogi <span class=\"level-badge level-extra\">AMBITNE<\/span><\/h3>\n<div class=\"card card-extra\">\n<ul>\n<li><strong>Rozkład węglanów:<\/strong> CaCO₃ →(Δ) CaO + CO₂↑<\/li>\n<li><strong>Rozkład wodorotlenków:<\/strong> Cu(OH)₂ →(Δ) CuO + H₂O<\/li>\n<li><strong>Utlenianie niższych tlenków:<\/strong> 2 SO₂ + O₂ →(kat.) 2 SO₃<\/li>\n<li><strong>Reakcja metalu z parą wodną:<\/strong> 3 Fe + 4 H₂O →(Δ) Fe₃O₄ + 4 H₂ <span class=\"mini-note\">(Fe₃O₄ = tlenek mieszany Fe(II,III) — magnetyt)<\/span><\/li>\n<\/ul>\n<p class=\"mini-note\">Katalizator to substancja zwiększająca szybkość reakcji, ale niezużywająca się w niej.<\/p>\n<\/div>\n<h3>9.3 Spalanie całkowite i niecałkowite<\/h3>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n01-spalanie-v01\"><button data-che-open-viz=\"n01-spalanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n01-spalanie-v01',lessonId:'N01'},'*')\" type=\"button\"><b>Otrzymywanie tlenków: spalanie pierwiastków i paliw — dopływ O₂ → CO₂ / CO / sadza<\/b><span>CHE.REACTION (spalanie całkowite i niecałkowite)<\/span><\/button><\/div>\n<div class=\"card card-warning\"><span class=\"card-label\">Spalanie niecałkowite<\/span><p>Przy niedoborze tlenu zamiast CO₂ powstaje CO (tlenek węgla(II)) lub sadza (C). CO jest bezbarwny, bezwonny i silnie toksyczny — stąd zagrożenie czadem w zamkniętych pomieszczeniach.<\/p>\n<p>Przykłady: 2 C + O₂ → 2 CO; 2 CH₄ + 3 O₂ → 2 CO + 4 H₂O; CH₄ + O₂ → C + 2 H₂O (sadza). Działanie czadu i profilaktyka — <a href=\"#bezpieczenstwo\">§12<\/a>.<\/p><\/div>\n<\/section>\n<section id=\"reakcje\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Reakcje tlenków <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3>10.1 Tlenek zasadowy + woda<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"na2oH2o\">Na₂O + H₂O → 2 NaOH<\/div>\n<div class=\"formula-lg\" data-rx=\"k2oH2o\">K₂O + H₂O → 2 KOH<\/div>\n<div class=\"formula-lg\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/div>\n<div class=\"formula-lg\" data-rx=\"baoH2o\">BaO + H₂O → Ba(OH)₂<\/div>\n<\/div>\n<div class=\"card card-error\">\n<span class=\"card-label\">Pułapka: MgO<\/span>\n<p>MgO reaguje z wodą bardzo powoli i w niewielkim stopniu (szkolnie: praktycznie nie). Nie traktuj jak CaO. Dlaczego — <a href=\"#n01-why-sio2-mgo\">§13<\/a>.<\/p>\n<\/div>\n<h3>10.2 Tlenek kwasowy + woda<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"so3H2o\">SO₃ + H₂O → H₂SO₄<\/div>\n<div class=\"formula-lg\" data-rx=\"so2H2o\">SO₂ + H₂O → H₂SO₃<\/div>\n<div class=\"formula-lg\">CO₂ + H₂O ⇌ H₂CO₃<\/div>\n<div class=\"formula-lg\" data-rx=\"n2o5H2o\">N₂O₅ + H₂O → 2 HNO₃<\/div>\n<div class=\"formula-lg\" data-rx=\"p2o5H2o\">P₂O₅ + 3 H₂O → 2 H₃PO₄ (zapis szkolny)<\/div>\n<p class=\"mini-note\">CO₂ + H₂O — reakcja odwracalna (szkolnie czasem zapis →); H₂CO₃ jest kwasem słabym i nietrwałym, w roztworze przeważa rozpuszczony CO₂. Zapis cząsteczkowy dla fosforu (P₄O₁₀ + 6 H₂O → 4 H₃PO₄) — <a href=\"#p4o10\">§16<\/a>. Nie każdy tlenek kwasowy reaguje z wodą: SiO₂ praktycznie nie (<a href=\"#n01-why-sio2-mgo\">§13<\/a>).<\/p>\n<\/div>\n<h3>10.3 Tlenek + kwas lub zasada → sól + woda<\/h3>\n<p>Tlenek zasadowy reaguje z kwasem, tlenek kwasowy — z zasadą; w obu przypadkach powstaje sól i woda. Amfoteryczny reaguje z obydwoma (E8: rozumieć, że reaguje też z zasadą) — <a href=\"#amfoterycznosc\">§15<\/a>.<\/p>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Tlenek zasadowy + kwas<\/span>\n<div class=\"formula-lg\" data-rx=\"caoHcl\">CaO + 2 HCl → CaCl₂ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"cuoH2so4\">CuO + H₂SO₄ → CuSO₄ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"fe2o3Hcl\">Fe₂O₃ + 6 HCl → 2 FeCl₃ + 3 H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"na2oHno3\">Na₂O + 2 HNO₃ → 2 NaNO₃ + H₂O<\/div>\n<p class=\"mini-note\"><strong>Dlaczego sól + woda:<\/strong> tlen tlenku zasadowego (O²⁻) wiąże dwa jony H⁺ kwasu w cząsteczkę H₂O, a kation metalu i reszta kwasowa tworzą sól. Liczba cząsteczek H₂O = liczba atomów O w tlenku (Fe₂O₃ → 3 H₂O).<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Tlenek kwasowy + zasada<\/span>\n<div class=\"formula-lg\" data-rx=\"naohCo2\">CO₂ + 2 NaOH → Na₂CO₃ + H₂O<\/div>\n<div class=\"formula-lg\">SO₂ + 2 KOH → K₂SO₃ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"so3Naoh\">SO₃ + 2 NaOH → Na₂SO₄ + H₂O<\/div>\n<p class=\"mini-note\">Reszta kwasowa soli pochodzi od kwasu, który tworzy dany tlenek z wodą: CO₂ → H₂CO₃ → węglan; SO₂ → H₂SO₃ → siarczan(IV); SO₃ → H₂SO₄ → siarczan(VI).<\/p>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">CO₂ + NaOH — dwa przypadki<\/span>\n<p>Produkty zależą od <strong>stosunku molowego<\/strong> substratów (nie tylko od tego, „którego więcej wlać”).<\/p>\n<p><strong>Nadmiar zasady / niedobór CO₂:<\/strong> CO₂ + 2 NaOH → Na₂CO₃ + H₂O (węglan sodu).<\/p>\n<p><strong>Nadmiar CO₂:<\/strong> CO₂ + NaOH → NaHCO₃ (wodorowęglan sodu).<\/p>\n<\/div>\n<h3>10.4 Tlenek + tlenek → sól (rozszerzenie) <span class=\"level-badge level-extra\">AMBITNE<\/span><\/h3>\n<div class=\"card card-extra\">\n<div class=\"formula-lg\" data-rx=\"caoCo2\">CaO + CO₂ → CaCO₃<\/div>\n<div class=\"formula-lg\">Na₂O + SO₃ → Na₂SO₄ <span class=\"mini-note\">(synteza soli bez wody: tlenek zasadowy + tlenek kwasowy)<\/span><\/div>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n01-reaktor-v01\"><button data-che-open-viz=\"n01-reaktor-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n01-reaktor-v01',lessonId:'N01'},'*')\" type=\"button\"><b>Co powstanie? Tlenek + woda / kwas / zasada — przewiduj, potem sprawdź<\/b><span>CHE.OXIDES.predict · procedura 7 kroków<\/span><\/button><\/div>\n<h3>10.5 Mapa reakcji — łańcuch przemian<\/h3>\n<p>Kliknij węzeł — zobacz ścieżkę: pierwiastek → tlenek → wodorotlenek/kwas → sól. Most do N02, N03, N04.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"chain-scn\"><button data-che-open-viz=\"chain-scn\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'chain-scn',lessonId:'N01'},'*')\" type=\"button\"><b>Łańcuch przemian: pierwiastek → tlenek → wodorotlenek / kwas → sól<\/b><span>Na → Na₂O → NaOH → NaCl · S → SO₃ → H₂SO₄ → Na₂SO₄ · C → CO₂ → H₂CO₃ → Na₂CO₃<\/span><\/button><\/div>\n<\/section>\n<section id=\"zastosowania\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Zastosowania tlenków <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Tlenek<\/th><th>Zastosowanie<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>CaO<\/td><td>wapno palone, cement, budownictwo (zaprawa murarska)<\/td><\/tr>\n<tr><td>SiO₂<\/td><td>szkło, piasek, kwarc, elektronika<\/td><\/tr>\n<tr><td>Al₂O₃<\/td><td>aluminium, ścierniwo, korund<\/td><\/tr>\n<tr><td>Fe₂O₃<\/td><td>ruda żelaza, pigment (hematyt)<\/td><\/tr>\n<tr><td>Fe₃O₄<\/td><td>magnetyt (ruda żelaza)<\/td><\/tr>\n<tr><td>CO₂<\/td><td>napoje gazowane, suchy lód, gaśnice<\/td><\/tr>\n<tr><td>SO₂<\/td><td>produkcja H₂SO₄, konserwant (wino)<\/td><\/tr>\n<tr><td>SO₃<\/td><td>produkcja H₂SO₄<\/td><\/tr>\n<tr><td>P₄O₁₀<\/td><td>środek suszący, produkcja H₃PO₄<\/td><\/tr>\n<tr><td>TiO₂<\/td><td>pigment (farba biała), filtry UV, fotokataliza<\/td><\/tr>\n<tr><td>ZnO<\/td><td>maści, guma, pigment, elektronika<\/td><\/tr>\n<tr><td>MgO<\/td><td>materiały ogniotrwałe; leki zobojętniające nadmiar kwasu w żołądku<\/td><\/tr>\n<tr><td>CuO<\/td><td>pigment ceramiczny, ogniwa<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\">Wiele zastosowań wynika wprost z właściwości: CaO wiąże wodę i reaguje z nią egzotermicznie, SiO₂ jest twardy i odporny chemicznie, Fe₂O₃ i TiO₂ są trwałymi barwnikami, P₄O₁₀ silnie pochłania wodę. Wpływ tlenków na środowisko — <a href=\"#bezpieczenstwo\">§12<\/a>.<\/p>\n<\/div>\n<\/section>\n<section id=\"bezpieczenstwo\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Bezpieczeństwo, zdrowie i środowisko <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-error\">\n<h3>Czad (CO) — bezbarwny, bezwonny, śmiertelny<\/h3>\n<ul>\n<li>Bezbarwny, bezwonny — nazywany „cichym zabójcą”. Powstaje przy spalaniu niecałkowitym (<a href=\"#otrzymywanie\">§9<\/a>).<\/li>\n<li>Źródła: wadliwe piece gazowe, kotły, kominki, spaliny samochodowe.<\/li>\n<li><strong>Działanie:<\/strong> łączy się z hemoglobiną znacznie silniej niż O₂; często podaje się około 200–250× w określonych warunkach. Utrudnia transport tlenu.<\/li>\n<li><strong>Objawy zatrucia:<\/strong> ból głowy, nudności, senność, utrata przytomności.<\/li>\n<li><strong>Profilaktyka:<\/strong> czujnik CO w każdym domu z piecem gazowym, regularne przeglądy, wentylacja.<\/li>\n<li><strong>Pierwsza pomoc:<\/strong> wyprowadzić poszkodowanego na świeże powietrze, otworzyć okna, wezwać pomoc (112) — nie wchodzić samemu do zadymionego pomieszczenia.<\/li>\n<\/ul>\n<\/div>\n<h3 class=\"merge-h\">Tabela BHP tlenków<\/h3>\n<div class=\"card card-error\">\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Tlenek<\/th><th>Zagrożenie<\/th><th>Środki ostrożności<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>CaO (wapno palone)<\/td><td>żrący, egzotermiczny z wodą. Nie dotykać mokrymi rękami — silne oparzenia (reakcja egzotermiczna).<\/td><td>okulary, nie dotykać mokrymi rękami<\/td><\/tr>\n<tr><td>CO₂ (suchy lód)<\/td><td>Temperatura sublimacji: −78,5 °C. W zamkniętym pomieszczeniu gromadzi się przy podłodze (cięższy od powietrza).<\/td><td>Nie dotykać gołymi rękami (odmrożenia). Używać w wentylowanym pomieszczeniu (sublimacja uwalnia CO₂).<\/td><\/tr>\n<tr><td>SO₂ (konserwant E220)<\/td><td>drażniący, toksyczny. Drażni drogi oddechowe. Stosowany w winie, suszonych owocach. U osób wrażliwych może wywołać reakcję alergiczną.<\/td><td>okap, nie wdychać<\/td><\/tr>\n<tr><td>SO₃<\/td><td>silnie żrący<\/td><td>okap, okulary<\/td><\/tr>\n<tr><td>P₄O₁₀<\/td><td>silnie higroskopijny, żrący<\/td><td>rękawice, okulary, szczelne naczynie<\/td><\/tr>\n<tr><td>NO₂<\/td><td>toksyczny, brązowy gaz<\/td><td>okap, nie wdychać<\/td><\/tr>\n<tr><td>CO<\/td><td>silnie toksyczny, bezbarwny, bezwonny<\/td><td>wentylacja, czujnik CO<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<h3 class=\"merge-h\">Środowisko: smog, kwaśne deszcze, efekt cieplarniany<\/h3>\n<div class=\"card card-basic\">\n<h3>Smog<\/h3>\n<p><strong>Smog<\/strong> — zanieczyszczenie powietrza powstałe z mieszaniny spalin, pyłów i tlenków.<\/p>\n<ul>\n<li>Mieszanina SO₂, NO₂, pyłów zawieszonych (PM2.5, PM10).<\/li>\n<li>Szczególnie groźny zimą w miastach — efekt „niskiej emisji”.<\/li>\n<\/ul>\n<p><strong>Typowe składniki / zanieczyszczenia związane ze smogiem:<\/strong> pyły zawieszone, tlenki azotu, CO, SO₂ oraz — w smogu fotochemicznym — ozon i inne produkty reakcji atmosferycznych. SO₃ występuje zwykle w znacznie mniejszych ilościach niż SO₂. CO₂ jest przede wszystkim gazem cieplarnianym, a nie typowym składnikiem smogu odpowiedzialnym za jego lokalne toksyczne działanie.<\/p>\n<h3>Kwaśne deszcze<\/h3>\n<ul>\n<li>Źródła: SO₂ i NO₂ z fabryk, elektrowni, samochodów.<\/li>\n<li>Skutki: zakwaszenie gleb i wód, uszkodzenie lasów, korozja budynków.<\/li>\n<\/ul>\n<ul>\n<li>SO₂ + H₂O ⇌ H₂SO₃ (zapis uproszczony; w atmosferze istotne są też kolejne procesy utleniania)<\/li>\n<li>2 SO₂ + O₂ → 2 SO₃<\/li>\n<li>SO₃ + H₂O → H₂SO₄<\/li>\n<li>3 NO₂ + H₂O → 2 HNO₃ + NO<\/li>\n<\/ul>\n<h3>Efekt cieplarniany<\/h3>\n<p><strong>Gazy cieplarniane:<\/strong> CO₂, CH₄, N₂O, para wodna.<\/p>\n<p class=\"mini-note\">N₂O — silny gaz cieplarniany; porównania rzędu 270–300× wpływu CO₂ na jednostkę masy zależą od przyjętego horyzontu czasowego i źródła danych.<\/p>\n<h3>Jak ograniczać emisję<\/h3>\n<ul>\n<li><strong>Odsiarczanie spalin<\/strong> w elektrowniach: SO₂ wiąże się tlenkiem lub węglanem wapnia (np. CaO + SO₂ → CaSO₃), a produkt utlenia się do gipsu.<\/li>\n<li><strong>Katalizator samochodowy<\/strong> przekształca CO i NO w mniej szkodliwe gazy: 2 CO + 2 NO → 2 CO₂ + N₂.<\/li>\n<li>Oszczędzanie energii, odnawialne źródła energii, wymiana starych pieców (mniej „niskiej emisji”).<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"n01-why-sio2-mgo\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Wyjaśnienia „dlaczego”: budowa a charakter i reakcja z wodą <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<h3 class=\"merge-h\">Metal → zasadowy, niemetal → kwasowy: skąd ta reguła<\/h3>\n<div class=\"card card-understand\">\n<p>Dla zrozumienia, dlaczego tlenki metali grup 1–2 są zasadowe.<\/p>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Pierwiastek<\/th><th>Z<\/th><th>Konfiguracja<\/th><th>Elektrony walencyjne<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Na<\/td><td>11<\/td><td>[Ne] 3s¹<\/td><td>1<\/td><\/tr>\n<tr><td>Mg<\/td><td>12<\/td><td>[Ne] 3s²<\/td><td>2<\/td><\/tr>\n<tr><td>Ca<\/td><td>20<\/td><td>[Ar] 4s²<\/td><td>2<\/td><\/tr>\n<tr><td>Al<\/td><td>13<\/td><td>[Ne] 3s² 3p¹<\/td><td>3<\/td><\/tr>\n<tr><td>C<\/td><td>6<\/td><td>[He] 2s² 2p²<\/td><td>4<\/td><\/tr>\n<tr><td>S<\/td><td>16<\/td><td>[Ne] 3s² 3p⁴<\/td><td>6<\/td><\/tr>\n<tr><td>P<\/td><td>15<\/td><td>[Ne] 3s² 3p³<\/td><td>5<\/td><\/tr>\n<tr><td>Cl<\/td><td>17<\/td><td>[Ne] 3s² 3p⁵<\/td><td>7<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\">Metale łatwo oddają elektrony → w tlenkach występują jako kationy, a jon O²⁻ z wodą daje OH⁻ → tlenki zasadowe. Niemetale tworzą z tlenem wiązania kowalencyjne; ich tlenki z wodą dają kwasy tlenowe (H⁺ + aniony reszt kwasowych) → tlenki kwasowe.<\/p>\n<div class=\"formula-lg\">O²⁻ + H₂O → 2 OH⁻ &nbsp;·&nbsp; SO₃ + H₂O → H₂SO₄ → 2 H⁺ + SO₄²⁻<\/div>\n<p><strong>Model wiązania:<\/strong> wiele tlenków metali ma znaczny udział charakteru jonowego, a wiele tlenków niemetali ma charakter kowalencyjny; to trend, nie absolutny podział. Im mniejsza różnica elektroujemności i im wyższy stopień utlenienia pierwiastka, tym bardziej kowalencyjne wiązanie E–O i tym bardziej kwasowy tlenek — stąd amfoteryczny Al₂O₃ i kwasowy Mn₂O₇ (<a href=\"#trend\">§14<\/a>).<\/p>\n<\/div>\n<h3 class=\"merge-h\">CO a CO₂ — dlaczego klasyfikujemy je inaczej<\/h3>\n<div class=\"card card-understand\">\n<p><strong>CO<\/strong> jest w szkolnym modelu tlenkiem obojętnym: z wodą nie tworzy typowego kwasu ani zasady.<\/p>\n<p><strong>CO₂<\/strong> jest tlenkiem kwasowym: w wodzie tworzy układ równowagowy związany z H₂CO₃, a z zasadami reaguje z wytworzeniem węglanów lub wodorowęglanów zależnie od warunków.<\/p>\n<p class=\"mini-note\">Różnicy nie należy tłumaczyć wyłącznie „liczbą wiązań C=O”. Znaczenie mają budowa, stopień utlenienia węgla i całkowita reaktywność układu.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<h3>SiO₂ — kwasowy, ale praktycznie nie reaguje z wodą<\/h3>\n<p><strong>Co widzę:<\/strong> SiO₂ klasyfikujemy jako tlenek kwasowy, ale zwykła woda nie daje z nim reakcji analogicznej do SO₃ + H₂O.<\/p>\n<p><strong>Model:<\/strong> krzemionka ma rozległą, trwałą sieć kowalencyjną. W warunkach szkolnych jej reaktywność z wodą jest bardzo mała.<\/p>\n<p><strong>Kontrola:<\/strong> z mocną zasadą SiO₂ może reagować, zwykle po ogrzaniu:<\/p>\n<div class=\"formula-lg\">SiO₂ + 2 NaOH →<span class=\"rxn-cond\">Δ<\/span> Na₂SiO₃ + H₂O<\/div>\n<p class=\"mini-note\">Nie traktuj zapisu „SiO₂ + H₂O → H₂SiO₃” jako zwykłej reakcji przebiegającej w wodzie. To nadmierne uproszczenie szkolnego modelu.<\/p>\n<p class=\"mini-note\">Ta sama sieć (każdy atom Si połączony z 4 atomami O) tłumaczy wysoką temperaturę topnienia SiO₂ (ok. 1700 °C), podczas gdy CO₂ — zbudowany z małych cząsteczek — jest gazem.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<h3>MgO — zasadowy, ale z wodą bardzo słabo<\/h3>\n<p>MgO ma trwałą sieć jonową i małą rozpuszczalność w wodzie. W rezultacie ilość substancji przechodzącej do roztworu jest ograniczona, więc reakcja z wodą jest bardzo słaba.<\/p>\n<p><strong>Dokładniej (porównanie z CaO):<\/strong> mały jon Mg²⁺ silnie przyciąga O²⁻, więc energia sieciowa MgO jest duża. Powstający Mg(OH)₂ jest praktycznie nierozpuszczalny i pokrywa ziarna tlenku, co dodatkowo hamuje reakcję. Większy jon Ca²⁺ tworzy słabszą sieć, a Ca(OH)₂ jest tylko trudno rozpuszczalny — dlatego gaszenie wapna jest szybkie i silnie egzotermiczne.<\/p>\n<p class=\"mini-note\">Ślad reakcji można jednak wykryć: zawiesina MgO w wodzie z fenoloftaleiną barwi się słabo na różowo.<\/p>\n<p><strong>Wniosek:<\/strong> charakter tlenku, jego rozpuszczalność i szybkość reakcji z wodą to trzy różne informacje.<\/p>\n<p class=\"mini-note\">Dlatego nie stosuj automatu „tlenek zasadowy → zawsze reaguje z wodą”.<\/p>\n<\/div>\n<\/section>\n<section id=\"trend\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Trend charakteru tlenków: okres, grupa, stopień utlenienia <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<p>W okresie (od lewej do prawej) charakter tlenków zmienia się od zasadowego, przez amfoteryczny, do kwasowego.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n01-trend-v01\"><button data-che-open-viz=\"n01-trend-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n01-trend-v01',lessonId:'N01'},'*')\" type=\"button\"><b>Trend charakteru tlenków: w okresie i według stopnia utlenienia (Cr, Mn)<\/b><span>CHE.OXIDES.trend<\/span><\/button><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">2. i 3. okres — porównanie<\/span>\n<div class=\"formula-lg\">Li₂O → BeO → B₂O₃ → CO₂ → N₂O₅<\/div>\n<p><strong>Li₂O<\/strong> — zasadowy; <strong>BeO<\/strong> — amfoteryczny; <strong>B₂O₃, CO₂, N₂O₅<\/strong> — kwasowe. To ogólny trend, a nie algorytm bez wyjątków.<\/p><p class=\"mini-note\">Fluor pomijamy w szeregu tlenków: OF₂ to <strong>fluorek tlenu<\/strong>, nie tlenek fluoru.<\/p>\n<p><strong>Trend w 3. okresie:<\/strong><\/p>\n<div class=\"formula-lg\">Na₂O → MgO → Al₂O₃ → SiO₂ → P₄O₁₀ → SO₃ → Cl₂O₇<\/div>\n<div class=\"formula-lg\">zasadowy → zasadowy → amfoteryczny → kwasowy → kwasowy → kwasowy → kwasowy<\/div>\n<p><strong>Wyjaśnienie:<\/strong> w okresie zwykle rośnie elektroujemność i maleje metaliczność, dlatego charakter tlenków często przesuwa się od zasadowego przez amfoteryczny do kwasowego. To <strong>trend, nie algorytm<\/strong>; wpływają też stopień utlenienia, budowa, rodzaj wiązań i trwałość struktury. W 3. okresie rośnie przy tym stopień utlenienia pierwiastka w najwyższym tlenku: od +I (Na) do +VII (Cl).<\/p>\n<\/div>\n<h3 class=\"merge-h\">Trend w grupie<\/h3>\n<div class=\"card card-extra\">\n<p>W grupie (w dół) rośnie metaliczność, więc rośnie charakter zasadowy tlenków: BeO (amfoteryczny) → MgO → CaO → SrO → BaO (coraz silniej zasadowe). W grupie 15: N₂O₅ i P₄O₁₀ kwasowe, As₄O₆ amfoteryczny, Bi₂O₃ zasadowy.<\/p>\n<\/div>\n<h3 class=\"merge-h\">Ten sam pierwiastek, różne stopnie utlenienia — metale przejściowe<\/h3>\n<div class=\"card card-extra\">\n<p>Wyższy stopień utlenienia → silniejszy charakter kwasowy.<\/p>\n<div class=\"table-wrap\"><table class=\"mobile-stack\"><thead><tr><th>Pierwiastek<\/th><th>Niski stopień<\/th><th>Pośredni<\/th><th>Wysoki stopień<\/th><\/tr><\/thead><tbody>\n<tr><td data-label=\"Pierwiastek\">Cr<\/td><td data-label=\"Niski\">CrO (+II) — zasadowy<\/td><td data-label=\"Pośredni\">Cr₂O₃ (+III) — amfoteryczny<\/td><td data-label=\"Wysoki\">CrO₃ (+VI) — kwasowy<\/td><\/tr>\n<tr><td data-label=\"Pierwiastek\">Mn<\/td><td data-label=\"Niski\">MnO (+II) — zasadowy<\/td><td data-label=\"Pośredni\">MnO₂ (+IV) — amfoteryczny<\/td><td data-label=\"Wysoki\">Mn₂O₇ (+VII) — kwasowy<\/td><\/tr>\n<tr><td data-label=\"Pierwiastek\">S<\/td><td data-label=\"Niski\">—<\/td><td data-label=\"Pośredni\">SO₂ (+IV) — kwasowy (H₂SO₃, słaby)<\/td><td data-label=\"Wysoki\">SO₃ (+VI) — kwasowy (H₂SO₄, mocny)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Dla metali przejściowych:<\/strong> Mn₂O₇ (Mn +VII), CrO₃ (Cr +VI) — kwasowe, mimo że to metale.<\/p>\n<p class=\"mini-note\"><strong>Dlaczego:<\/strong> atom na wysokim stopniu utlenienia silnie przyciąga elektrony tlenu, wiązania E–O stają się kowalencyjne, a tlenek z wodą tworzy kwas tlenowy z anionem reszty kwasowej (Mn₂O₇ → HMnO₄, MnO₄⁻; CrO₃ → H₂CrO₄, CrO₄²⁻).<\/p>\n<\/div>\n<\/section>\n<section id=\"amfoterycznosc\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> Amfoteryczność <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Definicja i drabina poziomów<\/span>\n<p><strong>Tlenek amfoteryczny<\/strong> — reaguje zarówno z kwasami (jak zasadowy), jak i z zasadami (jak kwasowy).<\/p>\n<p><strong>Przykłady:<\/strong> Al₂O₃, ZnO, BeO, PbO, SnO (a także Cr₂O₃, MnO₂ — <a href=\"#trend\">§14<\/a>).<\/p>\n<p><strong>E8:<\/strong> Al₂O₃ reaguje z kwasem i z mocną zasadą.<\/p>\n<p class=\"mini-note\"><strong>Na E8:<\/strong> wystarczy wiedzieć, że Al₂O₃ i ZnO reagują <strong>i z kwasami, i z zasadami<\/strong>. Równania z jonami kompleksowymi są rozszerzeniem.<\/p>\n<p><strong>Wyjaśnienie:<\/strong> zachowuje się jak tlenek zasadowy wobec kwasu i jak kwasowy wobec mocnej zasady.<\/p>\n<p class=\"mini-note\">Wiązanie Al–O i Zn–O jest pośrednie między jonowym a kowalencyjnym — stąd „podwójna” natura. Amfoteryczne są też odpowiednie wodorotlenki Al(OH)₃ i Zn(OH)₂ — most do N02.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Równania (rozszerzenie)<\/span>\n<div class=\"formula-lg\" data-rx=\"al2o3Hcl\">Al₂O₃ + 6 HCl → 2 AlCl₃ + 3 H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"al2o3NaohMelt\">Al₂O₃ + 2 NaOH →(stapianie) 2 NaAlO₂ + H₂O<\/div>\n<p class=\"mini-note\">Reakcja w stopionej zasadzie (warunki bezwodne).<\/p>\n<div class=\"formula-lg\">Al₂O₃ + 2 NaOH + 3 H₂O → 2 Na[Al(OH)₄] <span class=\"mini-note\">(roztwór wodny)<\/span><\/div>\n<p class=\"mini-note\">Jonowo w roztworze: Al₂O₃ + 2 OH⁻ + 3 H₂O → 2 [Al(OH)₄]⁻. Zapis NaAlO₂ zostawiamy jako model dla warunków bezwodnych / stopionej zasady.<\/p>\n<div class=\"formula-lg\" data-rx=\"znoHcl\">ZnO + 2 HCl → ZnCl₂ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"znoNaoh\">ZnO + 2 NaOH → Na₂ZnO₂ + H₂O<\/div><p class=\"mini-note\">Na₂ZnO₂ — zapis dla stopu / warunków bezwodnych; w roztworze wodnym: ZnO + 2 NaOH + H₂O → Na₂[Zn(OH)₄].<\/p>\n<\/div>\n<\/section>\n<section id=\"p4o10\">\n<div class=\"part-heading\"><span class=\"part-num\">16<\/span> P₂O₅ i P₄O₁₀ — wzór empiryczny a cząsteczka <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<ul>\n<li><strong>P₂O₅<\/strong> — wzór empiryczny (najprostszy stosunek P : O = 2 : 5).<\/li>\n<li><strong>P₄O₁₀<\/strong> — wzór rzeczywistej cząsteczki (dekatlenek tetrafosforu).<\/li>\n<\/ul>\n<p><strong>W szkole stosujemy P₂O₅<\/strong> jako zapis empiryczny i wygodny zapis stechiometryczny.<\/p>\n<p class=\"mini-note\">P₄O₁₀ nie oznacza innej substancji: opisuje rzeczywistą cząsteczkę, natomiast P₂O₅ podaje najprostszy stosunek P:O = 2:5.<\/p>\n<div class=\"microsteps\"><strong>Mikrokroki:<\/strong> 4:10 → skróć przez 2 → 2:5 → wzór empiryczny P₂O₅.<\/div>\n<p class=\"mini-note\">Budowa: cztery atomy P w narożach czworościanu połączone mostkami tlenowymi, do każdego P dołączony jeszcze jeden atom O. P₄O₁₀ silnie pochłania wodę — stąd zastosowanie jako środek suszący.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">P₂O₅ ↔ P₄O₁₀ w równaniach<\/span>\n<p>Szkolny zapis:<\/p>\n<div class=\"formula-lg\" data-rx=\"p2o5H2o\">P₂O₅ + 3 H₂O → 2 H₃PO₄<\/div>\n<p>Dokładniejszy zapis cząsteczkowy:<\/p>\n<div class=\"formula-lg\" data-rx=\"p4o10H2o\">P₄O₁₀ + 6 H₂O → 4 H₃PO₄<\/div>\n<p class=\"mini-note\">Analogicznie spalanie fosforu: 4 P + 5 O₂ → 2 P₂O₅ (szkolnie) lub 4 P + 5 O₂ → P₄O₁₀ (cząsteczkowo).<\/p>\n<\/div>\n<\/section>\n<section id=\"mieszane\">\n<div class=\"part-heading\"><span class=\"part-num\">17<\/span> Tlenki mieszane i nietypowe związki tlenu <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Związki tlenu — przegląd<\/span>\n<div class=\"table-wrap\"><table class=\"mobile-stack\"><thead><tr><th>Typ<\/th><th>Jon / grupa<\/th><th>Stopień utlenienia O<\/th><th>Przykłady<\/th><\/tr><\/thead><tbody>\n<tr><td data-label=\"Typ\">tlenek (zwykły)<\/td><td data-label=\"Jon\">O²⁻ / O w wiązaniu kowalencyjnym<\/td><td data-label=\"Stopień O\">−II<\/td><td data-label=\"Przykłady\">CaO, CO₂, Fe₂O₃<\/td><\/tr>\n<tr><td data-label=\"Typ\">nadtlenek<\/td><td data-label=\"Jon\">O₂²⁻ (wiązanie O–O)<\/td><td data-label=\"Stopień O\">−I<\/td><td data-label=\"Przykłady\">H₂O₂, Na₂O₂, BaO₂<\/td><\/tr>\n<tr><td data-label=\"Typ\">ponadtlenek<\/td><td data-label=\"Jon\">O₂⁻<\/td><td data-label=\"Stopień O\">−½<\/td><td data-label=\"Przykłady\">KO₂, RbO₂<\/td><\/tr>\n<tr><td data-label=\"Typ\">fluorek tlenu<\/td><td data-label=\"Jon\">—<\/td><td data-label=\"Stopień O\">+II<\/td><td data-label=\"Przykłady\">OF₂<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/div>\n<div class=\"card card-extra\">\n<h3>Tlenki mieszane<\/h3>\n<p>Zawierają ten sam metal na dwóch różnych stopniach utlenienia.<\/p>\n<ul>\n<li><strong>Fe₃O₄<\/strong> (magnetyt) = FeO·Fe₂O₃ — tlenek żelaza(II,III).<\/li>\n<li><strong>Pb₃O₄<\/strong> (minia) = 2 PbO·PbO₂ — tlenek ołowiu(II,IV).<\/li>\n<li><strong>Mn₃O₄<\/strong> = MnO·Mn₂O₃.<\/li>\n<\/ul>\n<p class=\"mini-note\">Średni stopień utlenienia Fe w Fe₃O₄ = +8/3 — obliczenie w <a href=\"#builder\">§5<\/a>.<\/p>\n<h3>Nadtlenki<\/h3>\n<p>Zawierają wiązanie O–O; tlen na <strong>−I<\/strong>.<\/p>\n<p>Grupa nadtlenkowa (grupa O₂²⁻) — to nie „zwykły” tlenek O²⁻.<\/p>\n<ul>\n<li><strong>H₂O₂<\/strong> — woda utleniona; rozkłada się (katalizator MnO₂): 2 H₂O₂ → 2 H₂O + O₂.<\/li>\n<li><strong>Na₂O₂<\/strong>, <strong>BaO₂<\/strong> — nadtlenki metali; z wodą wydzielają tlen: 2 Na₂O₂ + 2 H₂O → 4 NaOH + O₂.<\/li>\n<\/ul>\n<h3>Ponadtlenki<\/h3>\n<p>Anion O₂⁻; tlen na <strong>−½<\/strong>.<\/p>\n<ul>\n<li><strong>KO₂<\/strong>, <strong>RbO₂<\/strong> — stosowane w aparatach tlenowych (okręty podwodne, stacje kosmiczne) — KO₂ reaguje z CO₂ i H₂O, uwalniając O₂ (systemy podtrzymywania życia).<\/li>\n<\/ul>\n<div class=\"formula-lg\">4 KO₂ + 2 CO₂ → 2 K₂CO₃ + 3 O₂<\/div>\n<details class=\"adv\"><summary>Ozonki <span class=\"adv-tag\">poza programem LO<\/span><\/summary><div class=\"adv-body\">\n<p>Anion O₃⁻; np. <strong>KO₃<\/strong>.<\/p>\n<\/div><\/details>\n<h3>OF₂ — fluorek tlenu<\/h3>\n<p>Tlen na <strong>+II<\/strong> — to nie tlenek, a fluorek (fluor elektroujemniejszy).<\/p>\n<p class=\"mini-note\">Na E8 wystarczy rozróżnić „zwykły” tlenek (−II) od wzmianki o wyjątkach.<\/p>\n<\/div>\n<\/section>\n<section id=\"vsepr\">\n<div class=\"part-heading\"><span class=\"part-num\">18<\/span> Budowa przestrzenna cząsteczek tlenków (VSEPR) <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<p>Kształt <strong>cząsteczki<\/strong> zależy od liczby chmur elektronowych wokół atomu centralnego. VSEPR stosujemy przede wszystkim do cząsteczek/układów molekularnych; nie opisuje bezpośrednio całej sieci jonowej, np. kryształu CaO.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Reguła VSEPR<\/span>\n<p>Pary elektronowe (wiążące i wolne) odpychają się. Pary wolne zajmują więcej miejsca niż pary wiążące — zmniejszają kąty.<\/p>\n<div class=\"table-wrap\" style=\"margin-top:10px\">\n<table>\n<thead><tr><th>Cząsteczka<\/th><th>Typ<\/th><th>Geometria<\/th><th>Kąt<\/th><th>Hybrydyzacja<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>CO₂<\/td><td>AX₂<\/td><td>liniowa<\/td><td>180°<\/td><td>sp<\/td><\/tr>\n<tr><td>SO₂<\/td><td>AX₂E<\/td><td>kątowa<\/td><td>~119°<\/td><td>sp²<\/td><\/tr>\n<tr><td>SO₃<\/td><td>AX₃<\/td><td>trygonalna płaska<\/td><td>120°<\/td><td>sp²<\/td><\/tr>\n<tr><td>H₂O<\/td><td>AX₂E₂<\/td><td>kątowa<\/td><td>104,5°<\/td><td>sp³<\/td><\/tr>\n<tr><td>N₂O<\/td><td>AX₂<\/td><td>liniowa<\/td><td>180°<\/td><td>sp<\/td><\/tr>\n<tr><td>NO₂<\/td><td>AX₂E<\/td><td>kątowa<\/td><td>~134° (wartość przybliżona; zależy od warunków)<\/td><td>sp²<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div><div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"molecule3d-merged\"><button data-che-open-viz=\"molecule3d-merged\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'molecule3d-merged',lessonId:'N01'},'*')\" type=\"button\"><b>Model 3D cząsteczek — CO₂, SO₂, SO₃, H₂O: geometria i kąty<\/b><span>CHE.MOLECULE · VSEPR<\/span><\/button><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Dlaczego H₂O i SO₂ są kątowe, a CO₂ liniowa?<\/span>\n<p>Tlen w H₂O ma 2 wiązania i <strong>2 wolne pary<\/strong>. Wolne pary odpychają się silniej niż pary wiążące i „ściskają” kąt H–O–H do 104,5°. W CO₂ węgiel ma tylko 2 wiązania i 0 wolnych par — cząsteczka jest liniowa.<\/p>\n<p>W CO₂ węgiel nie ma wolnych par elektronowych, więc odpychanie jest symetryczne → kąt 180°. W SO₂ siarka ma 2 wiązania i 1 wolną parę (AX₂E) → cząsteczka kątowa (~119°).<\/p>\n<p class=\"mini-note\">Most do L013 (VSEPR pełne, hybrydyzacja sp/sp²/sp³).<\/p>\n<\/div>\n<p class=\"mini-note\"><strong>Ograniczenie:<\/strong> VSEPR opisuje geometrię cząsteczek / lokalnych układów elektronowych. Nie jest modelem całej sieci krystalicznej Na₂O, CaO ani SiO₂. Dla NO₂, który ma niesparowany elektron, standardowy model zamkniętopowłokowy jest tylko przybliżeniem.<\/p>\n<details class=\"answer step-by-step\" id=\"vsepr-steps\">\n<summary>VSEPR krok po kroku (wzorzec szkolny)<\/summary>\n<p><strong>Cel:<\/strong> przewidzieć kształt z liczby chmur elektronowych wokół atomu centralnego.<\/p>\n<ol>\n<li><strong>Policz elektrony walencyjne<\/strong> atomu centralnego i ligandów (szkolnie: z grupy / wzoru).<\/li>\n<li><strong>Ułóż strukturę<\/strong> (wiązania + wolne pary na centralnym).<\/li>\n<li><strong>Policz chmury:<\/strong> każde wiązanie (pojedyncze/podwójne/potrójne = 1 chmura) + każda wolna para = 1 chmura.<\/li>\n<li><strong>Geometria chmur<\/strong> (2 liniowa, 3 trójkąt, 4 tetraedr…).<\/li>\n<li><strong>Odetnij wolne pary wzrokiem<\/strong> → geometria cząsteczki (np. H₂O: 4 chmury, 2 wolne pary → kątowa).<\/li>\n<\/ol>\n<p><strong>Przykłady E8:<\/strong> CO₂ — 2 chmury, liniowa · H₂O — kątowa · SO₂ — kątowa · CH₄ — tetraedryczna.<\/p>\n<p class=\"mini-note\">Model uproszczony. Struktura kroków inspirowana Khan Academy (VSEPR); przykłady i poziom — pakiet E8. Amb: 6 chmur (np. SF₆) → poza typowym E8.<\/p>\n<\/details><div class=\"card card-understand\"><span class=\"card-label\">Zadanie z modelem 3D<\/span><p>W modelu „Model 3D cząsteczek” (przycisk wyżej w tej sekcji) obejrzyj CO₂, H₂O, SO₂ i CH₄ (tetraedr) <span>(CO₂ liniowa, H₂O kątowa, SO₂ kątowa).<\/span><\/p><p><b>Pytanie:<\/b> <span>Dlaczego H₂O i SO₂ są kątowe, a CO₂ liniowa?<\/span><\/p><p>Most: kształty H₂O wrócą przy wodorotlenkach — N02 VSEPR.<\/p><p class=\"mini-note\">Model uproszczony; kroki VSEPR jak wyżej. Wcześniej to zadanie wymagało zewnętrznej symulacji (PhET Molecule Shapes) — zastąpione modelem silnika CHE.MOLECULE.<\/p><\/div>\n<\/section>\n<section id=\"redukcja\">\n<div class=\"part-heading\"><span class=\"part-num\">19<\/span> Tlenki w reakcjach redoks: redukcja (metalurgia), utlenianie, rozkład <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Pojęcia<\/span>\n<p><strong>Redukcja tlenku<\/strong> = odebranie mu tlenu; stopień utlenienia metalu maleje (np. Cu: +II → 0). Substancja odbierająca tlen to <strong>reduktor<\/strong> (H₂, C, CO, aktywny metal — np. Al); sama ulega utlenieniu. <strong>Utlenianie<\/strong> = przyłączenie tlenu lub wzrost stopnia utlenienia.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<p>W metalurgii tlenki metali redukuje się, aby otrzymać metal.<\/p>\n<h3>Redukcja wodorem<\/h3>\n<div class=\"formula-lg\" data-rx=\"cuoH2\">CuO + H₂ →(Δ) Cu + H₂O<\/div>\n<div class=\"formula-lg\">Fe₂O₃ + 3 H₂ →(Δ) 2 Fe + 3 H₂O<\/div>\n<div class=\"formula-lg\">WO₃ + 3 H₂ →(Δ) W + 3 H₂O<\/div>\n<h3>Redukcja węglem<\/h3>\n<div class=\"formula-lg\" data-rx=\"cuoC\">2 CuO + C → 2 Cu + CO₂<\/div>\n<div class=\"formula-lg\">Fe₂O₃ + 3 C → 2 Fe + 3 CO <span class=\"mini-note\">(uproszczenie; w wielkim piecu głównym reduktorem jest CO z C + O₂/CO₂)<\/span><\/div>\n<h3>Redukcja tlenkiem węgla(II) — wielki piec<\/h3>\n<div class=\"formula-lg\" data-rx=\"fe2o3Co\">Fe₂O₃ + 3 CO →(Δ) 2 Fe + 3 CO₂<\/div>\n<p class=\"mini-note\">Zapis z CO₂: 2 Fe₂O₃ + 3 C → 4 Fe + 3 CO₂ — oba zapisy są poprawnie zbilansowane; w wysokiej temperaturze, przy nadmiarze węgla, powstaje głównie CO.<\/p>\n<p class=\"mini-note\">W wielkim piecu tlenek węgla(II) redukuje tlenek żelaza(III) do żelaza metalicznego. Klasyczny proces metalurgiczny.<\/p>\n<h3>Termit (redukcja aluminium)<\/h3>\n<div class=\"formula-lg\" data-rx=\"termit\">Fe₂O₃ + 2 Al → 2 Fe + Al₂O₃<\/div>\n<p class=\"mini-note\">Reakcja silnie egzotermiczna. Lokalna temperatura może osiągać około 2500°C lub więcej, zależnie od warunków i miejsca pomiaru. Stosowana m.in. w spawaniu szyn kolejowych.<\/p>\n<div class=\"card card-error\">\n<span class=\"card-label\">BHP — termit<\/span>\n<p><strong>Nie wykonuj tej reakcji samodzielnie.<\/strong> Termit osiąga bardzo wysoką temperaturę, może stopić metal, spowodować pożar i oparzenia. W lekcji analizujemy wyłącznie równanie i zastosowanie przemysłowe.<\/p>\n<\/div>\n<\/div>\n<h3 class=\"merge-h\">Tlenki jako utleniacze i reduktory<\/h3>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Tlenki jako utleniacze / reduktory<\/span>\n<p><strong>SO₂ może być reduktorem:<\/strong> 2 SO₂ + O₂ → 2 SO₃ (S: +IV → +VI).<\/p>\n<p><strong>SO₂ może być utleniaczem:<\/strong> SO₂ + 2 H₂S → 3 S + 2 H₂O (S: +IV → 0 i −II → 0).<\/p>\n<p class=\"mini-note\">Most do X01–X10 (redoks).<\/p>\n<\/div>\n<h3 class=\"merge-h\">Termiczny rozkład tlenków<\/h3>\n<div class=\"card card-extra\">\n<p>Niektóre mało trwałe tlenki rozkładają się pod wpływem temperatury. Nie należy zapamiętywać reguły „każdy tlenek metalu szlachetnego rozkłada się podczas ogrzewania” — zachowanie zależy od konkretnego związku i warunków.<\/p>\n<div class=\"formula-lg\" data-rx=\"hgoDecomp\">2 HgO →(Δ) 2 Hg + O₂<\/div>\n<div class=\"formula-lg\" data-rx=\"pbo2Decomp\">2 PbO₂ →(Δ) 2 PbO + O₂<\/div>\n<div class=\"formula-lg\" data-rx=\"ag2oDecomp\">2 Ag₂O →(Δ) 4 Ag + O₂<\/div>\n<p class=\"mini-note\">Tlenki metali aktywnych (Na₂O, CaO) są trwałe termicznie.<\/p>\n<p class=\"mini-note\">Dawna metoda otrzymywania tlenu: prażenie HgO (Scheele, Priestley, XVIII w.) — <a href=\"#historia\">§C<\/a>.<\/p>\n<\/div>\n<\/section>\n<section id=\"stechio\">\n<div class=\"part-heading\"><span class=\"part-num\">20<\/span> Stechiometria tlenków i spalania <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Przypomnienie z R05–R08 (stechiometria)<\/span>\n<p><strong>n = m / M<\/strong> · <strong>V = n × 22,4 dm³<\/strong> (warunki normalne) · stosunek molowy z współczynników równania.<\/p>\n<p class=\"mini-note\">Na E8 obliczenia prowadzi się na masach (stosunek mas z mas cząsteczkowych, prawo zachowania masy), bez moli — tak rozwiązany jest przykład 2.<\/p>\n<\/div>\n<div class=\"card\">\n<p><strong>Przykład 1:<\/strong> Ile gramów MgO powstanie ze spalenia 4,8 g Mg?<\/p>\n<details class=\"answer\"><summary>Pokaż rozwiązanie<\/summary>\n<p>Równanie: 2 Mg + O₂ → 2 MgO<\/p>\n<ul>\n<li>M(Mg) = 24 g/mol<\/li>\n<li>n(Mg) = 4,8 / 24 = 0,2 mol<\/li>\n<li>Stosunek: 2 Mg → 2 MgO (1:1)<\/li>\n<li>n(MgO) = 0,2 mol; M(MgO) = 40 g/mol<\/li>\n<li>m(MgO) = 0,2 × 40 = <strong>8 g<\/strong><\/li>\n<\/ul>\n<\/details>\n<\/div><div class=\"card\">\n<p><strong>Przykład 2:<\/strong> Ile gramów CuO potrzeba do otrzymania 150 g CuSO₄?<\/p>\n<details class=\"answer\"><summary>Pokaż rozwiązanie<\/summary>\n<p>Równanie: CuO + H₂SO₄ → CuSO₄ + H₂O<\/p>\n<ul>\n<li>M(CuO) = 80 g/mol, M(CuSO₄) = 160 g/mol<\/li>\n<li>Z 80 g CuO powstaje 160 g CuSO₄<\/li>\n<li>x g CuO → 150 g CuSO₄ → x = (80 × 150) / 160 = <strong>75 g<\/strong><\/li>\n<\/ul>\n<\/details>\n<\/div><div class=\"card\">\n<p><strong>Przykład 3:<\/strong> Ile dm³ CO₂ (warunki normalne) powstanie z rozkładu 50 g CaCO₃?<\/p>\n<details class=\"answer\"><summary>Pokaż rozwiązanie<\/summary>\n<p>Równanie: CaCO₃ → CaO + CO₂<\/p>\n<ul>\n<li>M(CaCO₃) = 100 g/mol → n = 0,5 mol<\/li>\n<li>Stosunek 1:1 → n(CO₂) = 0,5 mol<\/li>\n<li>V = 0,5 × 22,4 = <strong>11,2 dm³<\/strong><\/li>\n<\/ul>\n<\/details>\n<\/div>\n<div class=\"card\">\n<p><strong>Przykład 4 (stechiometria spalania):<\/strong> Ile CO₂ powstanie ze spalenia 1 kg węgla? Ile tlenu potrzeba? To typowe zadanie egzaminacyjne.<\/p>\n<details class=\"answer\"><summary>Pokaż rozwiązanie<\/summary>\n<p>Równanie: C + O₂ → CO₂ (stosunek 1 : 1 : 1)<\/p>\n<ul>\n<li>n(C) = 1000 g / 12 g/mol ≈ 83,3 mol<\/li>\n<li>m(CO₂) = 83,3 mol × 44 g/mol ≈ <strong>3,67 kg<\/strong><\/li>\n<li>m(O₂) = 83,3 mol × 32 g/mol ≈ <strong>2,67 kg<\/strong><\/li>\n<li>Kontrola masy: 1 kg + 2,67 kg = 3,67 kg ✓ (bez moli: 12 g C → 44 g CO₂, więc 1000 g → 1000·44/12 g)<\/li>\n<\/ul>\n<\/details>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"stech-kalkulator-v01\"><button data-che-open-viz=\"stech-kalkulator-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'stech-kalkulator-v01',lessonId:'N01'},'*')\" type=\"button\"><b>Kalkulator stechiometryczny — masa, mole, objętość gazu, odczynnik limitujący<\/b><span>CHE.STECH na reakcjach silnika (spalanie, rozkład CaCO₃, CuO + H₂SO₄…)<\/span><\/button><\/div>\n<p class=\"mini-note\">Spalanie paliw (C, CH₄, C₃H₈, C₈H₁₈) liczysz w tym samym kalkulatorze stechiometrycznym (powyżej): wybierz reakcję spalania, wpisz masę paliwa — dostajesz masy CO₂, H₂O i O₂ z kont
