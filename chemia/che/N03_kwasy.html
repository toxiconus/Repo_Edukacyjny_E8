racji<\/span>\n<p>Dla reakcji HCl + NaOH → NaCl + H₂O stosunek molowy 1:1:<\/p>\n<div class=\"formula-lg\">n(HCl) = n(NaOH)<\/div>\n<div class=\"formula-lg\">c(HCl) × V(HCl) = c(NaOH) × V(NaOH)<\/div>\n<p><strong>Przykład:<\/strong> Na zmiareczkowanie 25 cm³ HCl zużyto 20 cm³ NaOH o stężeniu 0,1 M. Oblicz stężenie HCl.<\/p>\n<details class=\"answer\"><summary>Rozwiązanie<\/summary>\n<p>c(HCl) × 25 cm³ = 0,1 M × 20 cm³<\/p>\n<p>c(HCl) = (0,1 × 20) / 25 = 0,08 M<\/p>\n<\/details>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-titration\"><button data-che-open-viz=\"gfx-scene-titration\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-titration',lessonId:'N03'},'*')\" type=\"button\"><b>Miareczkowanie: biureta, kolba, wskaźnik<\/b><span>Scena GFX · pH z bilansu, barwa fenoloftaleiny z silnika<\/span><\/button><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"titration-merged\"><button data-che-open-viz=\"titration-merged\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'titration-merged',lessonId:'N03'},'*')\" type=\"button\"><b>Krzywa miareczkowania: mocny/słaby kwas<\/b><span>pH(V) z silnika · punkt równoważnikowy<\/span><\/button><\/div>\n<\/section>\n<section id=\"bufory\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> Bufory — model jakościowy <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Definicja<\/span>\n<p><strong>Bufor<\/strong> to układ (mieszanina), który <strong>ogranicza zmianę pH<\/strong> po dodaniu do niego niewielkiej ilości kwasu lub zasady, lub po rozcieńczeniu.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Skład buforu<\/span>\n<ul>\n<li>Mieszanina <strong>słabego kwasu i jego soli z mocną zasadą<\/strong> — np. CH₃COOH + CH₃COONa.<\/li>\n<li>Lub mieszanina <strong>słabej zasady i jej soli z mocnym kwasem<\/strong> — np. NH₃ + NH₄Cl.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Jak działa bufor?<\/span>\n<p>Bufor octanowy (CH₃COOH + CH₃COO⁻):<\/p>\n<ul>\n<li>Dodajesz H⁺ → reaguje z CH₃COO⁻ → powstaje CH₃COOH (pH prawie nie zmienia się).<\/li>\n<li>Dodajesz OH⁻ → reaguje z CH₃COOH → powstaje CH₃COO⁻ (pH prawie nie zmienia się).<\/li>\n<\/ul>\n<p><strong>Pojemność buforowa<\/strong> — ograniczona. Po dodaniu zbyt dużej ilości kwasu/zasady bufor przestaje działać.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Wzór Hendersona–Hasselbalcha (rozszerzenie)<\/span>\n<div class=\"formula-lg\">pH = pKa + log([A⁻]/[HA])<\/div>\n<p>gdzie pKa = −log Ka (stała dysocjacji słabego kwasu), [A⁻] — stężenie sprzężonej zasady, [HA] — stężenie kwasu.<\/p>\n<p><strong>Optymalny zakres buforowania:<\/strong> pH ≈ pKa ± 1.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Przykłady biologiczne<\/span>\n<ul>\n<li><strong>Krew:<\/strong> bufor węglanowy H₂CO₃/HCO₃⁻ — utrzymuje pH ~7,4. Bufor wodorowęglanowy krwi: CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻ (pierwszy etap przyspiesza enzym anhydraza węglanowa). pH krwi 7,35–7,45; spadek = kwasica, wzrost = zasadowica.<\/li>\n<li><strong>Żołądek<\/strong> (dla porównania — to <em>nie<\/em> jest bufor): HCl — pH ~1,5–2 (trawienie pokarmu, aktywacja pepsyny, ochrona przed bakteriami).<\/li>\n<li><strong>Ślina:<\/strong> głównie bufor wodorowęglanowy, a także fosforanowy H₂PO₄⁻/HPO₄²⁻ — pH ~6,5–7,0.<\/li>\n<\/ul>\n<\/div>\n<details class=\"adv\"><summary>Bufor krwi w liczbach (Henderson–Hasselbalch) <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>pK<sub>a<\/sub>′ układu CO₂/HCO₃⁻ w osoczu ≈ 6,1, a stosunek [HCO₃⁻] : [CO₂(aq)] ≈ 20 : 1, więc pH = 6,1 + log 20 ≈ 7,4. Bufor jest skuteczny mimo pH daleko od pK<sub>a<\/sub>, bo jest to <strong>układ otwarty<\/strong>: płuca usuwają CO₂ (regulacja oddechowa w minutach), a nerki wydalają H⁺ i odzyskują HCO₃⁻ (regulacja metaboliczna w godzinach–dniach).<\/p><\/div><\/details>\n<details class=\"adv\"><summary>Bufor ilościowo: pojemność buforowa i wybór buforu <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>Pojemność buforowa β = dn/dpH jest największa, gdy [HA] = [A⁻] (pH = pK<sub>a<\/sub>) i rośnie z całkowitym stężeniem buforu. Dlatego bufor wybiera się tak, by pK<sub>a<\/sub> leżało blisko żądanego pH (np. fosforanowy H₂PO₄⁻/HPO₄²⁻, pK<sub>a<\/sub> 7,2 — w biologii komórki; TRIS, HEPES — w laboratoriach biochemicznych).<\/p><\/div><\/details>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-bufor-v01\"><button data-che-open-viz=\"kw-bufor-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-bufor-v01',lessonId:'N03'},'*')\" type=\"button\"><b>Bufor octanowy kontra woda — dodawaj HCl i NaOH<\/b><span>pH-metry, wskaźnik uniwersalny, wykres · pKa z silnika · wyczerpanie pojemności<\/span><\/button><\/div>\n<\/section>\n<section id=\"doswiadczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">16<\/span> Doświadczenia<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-doswiadczenia-v01\"><button data-che-open-viz=\"kw-doswiadczenia-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-doswiadczenia-v01',lessonId:'N03'},'*')\" type=\"button\"><b>Pracownia: wszystkie doświadczenia z kwasami (GFX)<\/b><span>Zestawy, reakcje i pokazy w jednym oknie · silnik GFX<\/span><\/button><\/div>\n<div class=\"card card-error\">\n<span class=\"card-label\">BHP — zasady pracy<\/span>\n<p>Doświadczenia z kwasami wykonuj <strong>tylko pod nadzorem nauczyciela<\/strong> i w wyznaczonym do tego miejscu. Nigdy nie eksperymentuj samodzielnie z kwasami stężonymi.<\/p>\n<\/div>\n<div class=\"exp-card\">\n<h5>Doświadczenie 1 — Odczyn kwasu chlorowodorowego<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Jaki odczyn ma roztwór HCl?<\/span>\n<b>Hipoteza<\/b><span>Kwasowy — papierek uniwersalny czerwony, oranż metylowy czerwony.<\/span>\n<b>Sprzęt<\/b><span>HCl (rozcieńczony), papierek uniwersalny, oranż metylowy, fenoloftaleina, dwie probówki.<\/span>\n<b>Przebieg<\/b><span>Zanurzamy papierek uniwersalny w roztworze HCl; dodajemy kroplę oranżu metylowego do probówki z HCl.<\/span>\n<b>Obserwacja<\/b><span>Papierek uniwersalny czerwony; oranż metylowy czerwony; fenoloftaleina bezbarwna.<\/span>\n<b>Wniosek<\/b><span>Roztwór HCl ma odczyn kwasowy (pH &lt; 7).<\/span>\n<b>Równanie<\/b><span class=\"formula\">HCl → H⁺ + Cl⁻<\/span>\n<b>BHP<\/b><span>HCl żrący — okulary, rękawice; nie pipetować ustami.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"indicator\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n<div class=\"exp-card\">\n<h5>Doświadczenie 2 — Kwas + metal (Zn + HCl)<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Czy cynk reaguje z kwasem solnym?<\/span>\n<b>Hipoteza<\/b><span>Wydzieli się wodór.<\/span>\n<b>Sprzęt<\/b><span>Zn (granulki), HCl (rozcieńczony), probówka, zapałka.<\/span>\n<b>Przebieg<\/b><span>Do probówki z HCl wrzucamy granulkę Zn. Po chwili zbliżamy zapaloną zapałkę do wylotu probówki.<\/span>\n<b>Obserwacja<\/b><span>Pęcherzyki gazu; po zbliżeniu zapałki — charakterystyczny „szczek” (spalanie wodoru).<\/span>\n<b>Wniosek<\/b><span>Cynk reaguje z HCl, wydzielając wodór.<\/span>\n<b>Równanie<\/b><span class=\"formula\">Zn + 2 HCl → ZnCl₂ + H₂↑<\/span>\n<b>BHP<\/b><span>Okulary; wodór z powietrzem tworzy mieszaninę wybuchową — próbę „pyk” robimy tylko z małą ilością gazu zebraną w probówce (wylotem od siebie i innych), nigdy przy dużej aparaturze, w której gaz się wydziela.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"acidMetal\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n<div class=\"exp-card\">\n<h5>Doświadczenie 3 — Kwas + węglan (otrzymywanie CO₂)<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Jak otrzymać CO₂ z węglanu?<\/span>\n<b>Hipoteza<\/b><span>Powstanie CO₂ (gaz).<\/span>\n<b>Sprzęt<\/b><span>CaCO₃ (kreda), HCl, probówka, rurka, woda wapienna.<\/span>\n<b>Przebieg<\/b><span>Do probówki z CaCO₃ dodajemy HCl; gaz przepuszczamy przez rurkę do wody wapiennej.<\/span>\n<b>Obserwacja<\/b><span>Pęcherzyki gazu; woda wapienna mętnieje.<\/span>\n<b>Wniosek<\/b><span>CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑; CO₂ mętni wodę wapienną.<\/span>\n<b>Równanie<\/b><span class=\"formula\">CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑<\/span>\n<b>BHP<\/b><span>Okulary; nie wciągać wody wapiennej do ust.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"carbonate\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n<div class=\"exp-card\">\n<h5>Doświadczenie 4 — Kwas + wodorotlenek (zobojętnianie)<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Co się dzieje, gdy do zasady dodajemy kwas?<\/span>\n<b>Hipoteza<\/b><span>Powstaje sól i woda; odczyn zmienia się.<\/span>\n<b>Sprzęt<\/b><span>NaOH, HCl, fenoloftaleina, probówka.<\/span>\n<b>Przebieg<\/b><span>Do probówki z NaOH dodajemy kroplę fenoloftaleiny (róż/malinowy), następnie kroplami HCl, mieszając.<\/span>\n<b>Obserwacja<\/b><span>Malinowa barwa fenoloftaleiny zanika w miarę dodawania HCl.<\/span>\n<b>Wniosek<\/b><span>NaOH + HCl → NaCl + H₂O.<\/span>\n<b>Równanie<\/b><span class=\"formula\">NaOH + HCl → NaCl + H₂O<\/span>\n<b>BHP<\/b><span>Okulary, rękawice — NaOH i HCl żrące.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"hclNaOH+php\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n<div class=\"exp-card\">\n<h5>Doświadczenie 5 — Kwas + tlenek metalu<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Czy CuO reaguje z H₂SO₄?<\/span>\n<b>Hipoteza<\/b><span>Powstanie niebieski roztwór CuSO₄.<\/span>\n<b>Sprzęt<\/b><span>CuO (czarny proszek), H₂SO₄ (rozcieńczony), probówka.<\/span>\n<b>Przebieg<\/b><span>Do probówki z rozcieńczonym H₂SO₄ dodajemy szczyptę CuO; mieszamy; lekko podgrzewamy.<\/span>\n<b>Obserwacja<\/b><span>Czarny CuO znika; powstaje niebieski roztwór.<\/span>\n<b>Wniosek<\/b><span>CuO reaguje z kwasem; powstaje Cu²⁺ (niebieski kolor).<\/span>\n<b>Równanie<\/b><span class=\"formula\">CuO + H₂SO₄ → CuSO₄ + H₂O<\/span>\n<b>BHP<\/b><span>Okulary; H₂SO₄ żrący.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"cuoH2so4\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n<div class=\"exp-card\">\n<h5>Doświadczenie 6 — Przewodzenie prądu przez roztwory kwasów<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Czy roztwory kwasów przewodzą prąd? Czy wszystkie jednakowo?<\/span>\n<b>Hipoteza<\/b><span>Przewodzą, bo zawierają jony; mocny kwas przewodzi lepiej niż słaby o tym samym stężeniu.<\/span>\n<b>Sprzęt<\/b><span>Tester przewodnictwa (elektrody, żarówka/dioda, bateria), zlewki: HCl 0,1 M, CH₃COOH 0,1 M, woda destylowana, roztwór cukru.<\/span>\n<b>Przebieg<\/b><span>Zanurzamy elektrody kolejno w roztworach, płucząc je wodą destylowaną między pomiarami.<\/span>\n<b>Obserwacja<\/b><span>HCl — żarówka świeci jasno, po chwili drobne pęcherzyki gazu na obu elektrodach (H₂ na katodzie, Cl₂ — zapach chloru — na anodzie); CH₃COOH — świeci słabo, gazu bardzo mało; woda i cukier — nie świeci, brak pęcherzyków.<\/span>\n<b>Wniosek<\/b><span>Kwasy są elektrolitami; HCl — mocny (prawie pełna dysocjacja), CH₃COOH — słaby.<\/span>\n<b>Równanie<\/b><span class=\"formula\">HCl + H₂O → H₃O⁺ + Cl⁻;  CH₃COOH + H₂O ⇌ H₃O⁺ + CH₃COO⁻<\/span>\n<b>BHP<\/b><span>Niskie napięcie (bateria); okulary; nie dotykać elektrod mokrymi rękami.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"conductivity\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n\n<div class=\"exp-card\">\n<h5>Doświadczenie 7 — Aktywność metali wobec kwasu solnego<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Które metale wypierają wodór z HCl i jak szybko?<\/span>\n<b>Hipoteza<\/b><span>Reagują metale stojące przed wodorem; najszybciej najaktywniejszy.<\/span>\n<b>Sprzęt<\/b><span>4 probówki z HCl (ok. 2 mol/dm³), wiórki Mg, granulki Zn, opiłki Fe, blaszka Cu.<\/span>\n<b>Przebieg<\/b><span>Do każdej probówki wrzucamy inny metal; porównujemy intensywność wydzielania gazu.<\/span>\n<b>Obserwacja<\/b><span>Mg — gwałtowne pienienie, probówka się ogrzewa; Zn — wyraźne pęcherzyki; Fe — nieliczne pęcherzyki, roztwór bladozielony; Cu — brak zmian.<\/span>\n<b>Wniosek<\/b><span>Aktywność: Mg &gt; Zn &gt; Fe &gt; (H) &gt; Cu.<\/span>\n<b>Równanie<\/b><span class=\"formula\">Mg + 2 HCl → MgCl₂ + H₂↑;  Fe + 2 HCl → FeCl₂ + H₂↑;  Cu + HCl → brak reakcji<\/span>\n<b>BHP<\/b><span>Okulary; wodór łatwopalny — z dala od ognia.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"szereg\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n\n<div class=\"exp-card\">\n<h5>Doświadczenie 8 — Działanie stężonego H₂SO₄ na cukier (pokaz nauczyciela)<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Jak stężony kwas siarkowy(VI) działa na substancje organiczne?<\/span>\n<b>Hipoteza<\/b><span>Odbierze wodę — substancja ulegnie zwęgleniu.<\/span>\n<b>Sprzęt<\/b><span>Zlewka, cukier (sacharoza), stężony H₂SO₄, bagietka; dygestorium.<\/span>\n<b>Przebieg<\/b><span>Do cukru w zlewce nauczyciel wlewa niewielką ilość stężonego H₂SO₄ i miesza.<\/span>\n<b>Obserwacja<\/b><span>Cukier żółknie, brunatnieje i czernieje; czarna porowata masa „rośnie”; zlewka bardzo gorąca, wydziela się para i ostry zapach.<\/span>\n<b>Wniosek<\/b><span>Stężony H₂SO₄ ma właściwości higroskopijne i odwadniające — zwęgla związki organiczne.<\/span>\n<b>Równanie<\/b><span class=\"formula\">C₁₂H₂₂O₁₁ →(H₂SO₄ stęż.) 12 C + 11 H₂O<\/span>\n<b>BHP<\/b><span>Tylko pokaz pod dygestorium; okulary, rękawice; SO₂ drażni drogi oddechowe.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"wlasciwosci\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n<div class=\"exp-card\">\n<h5>Doświadczenie 9 — Kwas azotowy(V) i białko (pokaz nauczyciela)<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Jak HNO₃ działa na białko?<\/span>\n<b>Hipoteza<\/b><span>Białko ulegnie ścięciu i zmieni barwę.<\/span>\n<b>Sprzęt<\/b><span>Probówka z roztworem białka jaja kurzego, stężony HNO₃.<\/span>\n<b>Przebieg<\/b><span>Do roztworu białka nauczyciel dodaje kilka kropel stężonego HNO₃ (można lekko ogrzać).<\/span>\n<b>Obserwacja<\/b><span>Wytrąca się biały osad, który <strong>żółknie<\/strong>; po dodaniu zasady (np. NH₃(aq)) barwa przechodzi w pomarańczową.<\/span>\n<b>Wniosek<\/b><span>HNO₃ denaturuje białko i nitruje pierścienie aromatyczne aminokwasów — reakcja ksantoproteinowa (wykrywanie białek). Dlatego HNO₃ barwi skórę na żółto.<\/span>\n<b>Równanie<\/b><span class=\"formula\">białko (reszty aromatyczne) + HNO₃ → żółte nitrozwiązki<\/span>\n<b>BHP<\/b><span>Stężony HNO₃ — silnie żrący i utleniający; tylko pokaz.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"wlasciwosci\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n\n<div class=\"exp-card\">\n<h5>Doświadczenie 10 — Odróżnianie HCl od CH₃COOH<\/h5>\n<div class=\"exp-grid\">\n<b>Problem<\/b><span>Jak odróżnić roztwory mocnego i słabego kwasu o tym samym stężeniu (0,1 mol/dm³)?<\/span>\n<b>Hipoteza<\/b><span>Mocny kwas ma niższe pH, lepiej przewodzi prąd i szybciej reaguje z magnezem.<\/span>\n<b>Sprzęt<\/b><span>pH-metr lub papierek uniwersalny, tester przewodnictwa, wiórki Mg, dwie probówki.<\/span>\n<b>Przebieg<\/b><span>Mierzymy pH obu roztworów, sprawdzamy przewodnictwo, dodajemy do każdego po kawałku Mg.<\/span>\n<b>Obserwacja<\/b><span>HCl: pH ≈ 1, żarówka świeci jasno, pęcherzyki wydzielają się szybko. CH₃COOH: pH ≈ 2,9, słabe świecenie, pęcherzyki wolniej.<\/span>\n<b>Wniosek<\/b><span>HCl jest kwasem mocnym (pełna dysocjacja), CH₃COOH — słabym (ok. 1,3%). Fenoloftaleina tych roztworów nie odróżni (w obu bezbarwna).<\/span>\n<b>Równanie<\/b><span class=\"formula\">Mg + 2 H₃O⁺ → Mg²⁺ + H₂↑ + 2 H₂O<\/span>\n<b>BHP<\/b><span>Okulary.<\/span>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"conductivity\" data-prac=\"kw-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Obserwacja ≠ wniosek<\/span>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Obserwacja (zmysły)<\/th><th>Wniosek (interpretacja)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Pojawiają się pęcherzyki<\/td><td>Wydziela się gaz (jakiego? — trzeba potwierdzić doświadczeniem)<\/td><\/tr>\n<tr><td>Roztwór zmętniał<\/td><td>Powstał osad (jaki? — np. CaCO₃)<\/td><\/tr>\n<tr><td>Roztwór zmienił barwę na niebieską<\/td><td>Powstał jon Cu²⁺<\/td><\/tr>\n<tr><td>Naczynie się ogrzewa<\/td><td>Reakcja egzotermiczna<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p><strong>Nie pisz w obserwacji:<\/strong> „wydziela się H₂” — dopóki nie zidentyfikujesz gazu (np. przez „szczek” spalania).<\/p>\n<\/div>\n<\/section>\n<section id=\"klinika\">\n<div class=\"part-heading\"><span class=\"part-num\">17<\/span> Klinika błędów<\/div>\n<div class=\"table-wrap\">\n<table class=\"klinika-table\">\n<thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">H₂Cl<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">HCl<\/td>\n<td data-label=\"Dlaczego\">W–K–S–K: H(I), Cl(I) → stosunek 1:1 → HCl.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">HSO₄<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">H₂SO₄<\/td>\n<td data-label=\"Dlaczego\">Reszta SO₄²⁻ ma ładunek −2, więc potrzebujemy 2 atomów H.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„wszystkie kwasy są mocne”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">Mocne: HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄. Słabe: HF, H₂CO₃, CH₃COOH, H₃PO₄.<\/td>\n<td data-label=\"Dlaczego\">Moc zależy od stopnia dysocjacji α. Nie każdy kwas dysocjuje całkowicie.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">Cu + HCl → CuCl₂ + H₂↑<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">Reakcja nie zachodzi (Cu za H w szeregu aktywności).<\/td>\n<td data-label=\"Dlaczego\">Miedź nie wypiera wodoru z rozcieńczonego HCl. Szereg: K &gt; Ca &gt; Na &gt; Mg &gt; Al &gt; Zn &gt; Fe &gt; Sn &gt; Pb &gt; H &gt; Cu &gt; Ag &gt; Au.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">NaOH + HCl → NaCl<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">NaOH + HCl → NaCl + H₂O<\/td>\n<td data-label=\"Dlaczego\">Zobojętnianie daje sól <strong>i wodę<\/strong>. Woda jest produktem i nie może być pominięta.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„fenoloftaleina w kwasie jest czerwona”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">Fenoloftaleina w kwasie jest <strong>bezbarwna<\/strong>.<\/td>\n<td data-label=\"Dlaczego\">Fenoloftaleina zmienia barwę dopiero przy pH &gt; 8,2 (malinowa w zasadzie). W kwasie pozostaje bezbarwna.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„pH 7 to kwas”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">pH 7 = odczyn <strong>obojętny<\/strong>.<\/td>\n<td data-label=\"Dlaczego\">pH &lt; 7 kwasowy, pH = 7 obojętny, pH &gt; 7 zasadowy.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„wodę wlewamy do stężonego kwasu”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">Kwas wlewamy do wody.<\/td>\n<td data-label=\"Dlaczego\">Rozcieńczanie kwasu wydziela dużo ciepła; woda do kwasu może gwałtownie się zagotować i rozpryskać kwas (niebezpieczeństwo oparzeń).<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„kwas chlorowodorowy = HClO”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">HCl = kwas chlorowodorowy; HClO = kwas chlorowy(I).<\/td>\n<td data-label=\"Dlaczego\">Różne kwasy, różne wzory. HCl beztlenowy, HClO tlenowy.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„moc = stężenie”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">Moc to stopień dysocjacji, stężenie to ilość moli w objętości.<\/td>\n<td data-label=\"Dlaczego\">Rozcieńczony HCl (mocny kwas) ma mniejsze stężenie niż stężony CH₃COOH (słaby kwas). To różne parametry.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„H⁺ w wodzie istnieje samodzielnie”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">H⁺ + H₂O → H₃O⁺ (jon hydroniowy).<\/td>\n<td data-label=\"Dlaczego\">Proton H⁺ nie istnieje samodzielnie w wodzie; łączy się z H₂O, tworząc H₃O⁺.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„H₂SO₄ ma 2 protony, więc w II stopniu też mocny”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">H₂SO₄ jest mocny tylko w I stopniu. HSO₄⁻ ⇌ H⁺ + SO₄²⁻ — słaby.<\/td>\n<td data-label=\"Dlaczego\">I stopień praktycznie całkowity (H₂SO₄ → H⁺ + HSO₄⁻), II stopień słaby (HSO₄⁻ to słaby kwas).<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„HCl(g) i HCl(aq) to to samo”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">HCl(g) to gaz chlorowodór; HCl(aq) to roztwór kwasu chlorowodorowego.<\/td>\n<td data-label=\"Dlaczego\">Gaz nie przewodzi prądu (brak jonów); roztwór wodny dysocjuje na jony, przewodzi prąd i ma odczyn kwasowy.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">Fe + 2 HCl → FeCl₃ + H₂<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">Fe + 2 HCl → FeCl₂ + H₂↑<\/td>\n<td data-label=\"Dlaczego\">Jony H⁺ utleniają żelazo tylko do Fe²⁺ (bladozielony roztwór).<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„oranż metylowy w wodzie jest pomarańczowy”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">w wodzie (pH 7) jest żółty<\/td>\n<td data-label=\"Dlaczego\">Zmienia barwę w zakresie pH 3,1–4,4; powyżej jest żółty — nie odróżni wody od zasady.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„H₂SO₄ wypiera HCl z NaCl, bo jest mocniejszy”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">bo jest mniej lotny<\/td>\n<td data-label=\"Dlaczego\">HCl jest mocniejszy, ale jako gaz ulatnia się z układu.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„oparzenie kwasem — posyp sodą”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">płucz wodą ok. 15 min<\/td>\n<td data-label=\"Dlaczego\">Zobojętnianie na skórze wydziela ciepło i opóźnia płukanie.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„rozcieńczony słaby kwas jest bardziej kwaśny, bo α rośnie”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">pH rośnie — roztwór mniej kwaśny<\/td>\n<td data-label=\"Dlaczego\">[H₃O⁺] ≈ α·c maleje, bo c spada szybciej, niż rośnie α.<\/td>\n<\/tr>\n<tr class=\"error-row\">\n<td class=\"col-blad\" data-label=\"Błąd\">„CH₃COOH jest czteroprotonowy (4 atomy H)”<\/td>\n<td class=\"col-ok\" data-label=\"Poprawa\">jednoprotonowy<\/td>\n<td data-label=\"Dlaczego\">Kwasowy jest tylko H z grupy –COOH; H przy węglu nie dysocjują.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie kliniczne 1<\/span>\n<p>Uczeń twierdzi: „0,1 M HF jest słabszy od 0,001 M HCl, więc ma mniej kwaśny charakter”. Wskaż dwa różne parametry i wyjaśnij, dlaczego samo porównanie stężeń nie rozstrzyga o mocy kwasu.<\/p>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p><strong>Parametry:<\/strong> moc kwasu (stopień dysocjacji α) i stężenie (mol/dm³).<\/p>\n<p><strong>Wyjaśnienie:<\/strong> 0,1 M HF jest roztworem o <strong>wyższym stężeniu<\/strong>, ale HF jest <strong>słabym kwasem<\/strong> (α ≈ 0,08), więc tylko część cząsteczek dysocjuje — daje mało H₃O⁺. 0,001 M HCl jest kwasem mocnym (α ≈ 1), więc wszystkie cząsteczki dysocjują — daje dużo H₃O⁺ mimo niższego stężenia. Wynik może zaskoczyć: liczymy pH obu roztworów. HCl 0,001 mol/dm³ → [H₃O⁺] = 10⁻³ → <strong>pH = 3<\/strong>. HF 0,1 mol/dm³ (K<sub>a<\/sub> ≈ 6,3·10⁻⁴) → [H₃O⁺] ≈ 7,6·10⁻³ → <strong>pH ≈ 2,1<\/strong>. Roztwór słabego, ale stukrotnie bardziej stężonego HF jest więc <strong>bardziej kwaśny<\/strong>. Wniosek: o mocy kwasu świadczy α (K<sub>a<\/sub>), a o kwasowości roztworu — [H₃O⁺], które zależy od mocy <em>i<\/em> stężenia.<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie kliniczne 2<\/span>\n<p>Popraw równanie: Cu + HCl → CuCl₂ + H₂↑. Wyjaśnij, dlaczego reakcja nie zachodzi.<\/p>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p><strong>Poprawnie:<\/strong> Reakcja nie zachodzi.<\/p>\n<p><strong>Dlaczego:<\/strong> Miedź jest w szeregu aktywności <strong>za wodorem<\/strong>: K &gt; Ca &gt; Na &gt; Mg &gt; Al &gt; Zn &gt; Fe &gt; Sn &gt; Pb &gt; H &gt; Cu &gt; Ag &gt; Au. Metale za wodorem nie wypierają wodoru z rozcieńczonych kwasów nieutleniających. Reakcja Cu + HCl nie jest możliwa. (Uwaga: HNO₃ reaguje z Cu jako kwas utleniający, ale nie wydziela H₂.)<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"cwiczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">18<\/span> Ćwiczenia<\/div>\n<h3>Poziom A — podstawa<\/h3>\n<div class=\"card\">\n<ol>\n<li>Wzory: kwas chlorowodorowy, kwas siarkowy(VI), kwas azotowy(V), kwas węglowy.<\/li>\n<li>Nazwy: HCl, H₂SO₃, HNO₂, H₃PO₄.<\/li>\n<li>Zapisz dysocjację: HCl, HNO₃, H₂SO₄.<\/li>\n<li>Podaj resztę kwasową: HCl, H₂SO₄, HNO₃, H₃PO₄.<\/li>\n<li>Co powstaje z: HCl + NaOH? H₂SO₄ + KOH?<\/li>\n<li>Jakie pH ma kwas? Zasada? Woda?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>HCl, H₂SO₄, HNO₃, H₂CO₃.<\/li>\n<li>kwas chlorowodorowy, kwas siarkowy(IV), kwas azotowy(III), kwas fosforowy(V).<\/li>\n<li>HCl → H⁺ + Cl⁻; HNO₃ → H⁺ + NO₃⁻; H₂SO₄ → 2H⁺ + SO₄²⁻.<\/li>\n<li>Cl⁻, SO₄²⁻, NO₃⁻, PO₄³⁻.<\/li>\n<li>NaCl + H₂O; K₂SO₄ + 2H₂O.<\/li>\n<li>Kwas: &lt; 7; zasada: &gt; 7; woda: 7.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom B — trening<\/h3>\n<div class=\"card\">\n<ol start=\"7\">\n<li>Zapisz reakcje: HCl + Mg; H₂SO₄ + CaO; HNO₃ + NaOH; HCl + CaCO₃.<\/li>\n<li>Popraw: H₂Cl; HSO₄; „wszystkie kwasy mocne\".<\/li>\n<li>Dlaczego Cu nie reaguje z rozcieńczonym HCl?<\/li>\n<li>Które kwasy są mocne, a które słabe: HF, HNO₃, CH₃COOH, H₂SO₄?<\/li>\n<li>Uzupełnij: Zn + 2HCl → ? ; CaO + 2HNO₃ → ?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"7\">\n<li>Mg + 2HCl → MgCl₂ + H₂↑; CaO + H₂SO₄ → CaSO₄ + H₂O; HNO₃ + NaOH → NaNO₃ + H₂O; CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂↑.<\/li>\n<li>HCl; H₂SO₄; kwasy mają różną moc.<\/li>\n<li>Cu jest poniżej H w szeregu aktywności.<\/li>\n<li>Mocne: HNO₃, H₂SO₄. Słabe: HF, CH₃COOH.<\/li>\n<li>ZnCl₂ + H₂↑; Ca(NO₃)₂ + H₂O.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom C — ambitny<\/h3>\n<div class=\"card card-extra\">\n<ol start=\"12\">\n<li>Zapisz dwustopniową dysocjację H₂SO₄.<\/li>\n<li>Wyjaśnij, dlaczego H⁺ w wodzie tworzy H₃O⁺.<\/li>\n<li>Dlaczego H₃PO₄ jest słaby, mimo że ma 3 atomy wodoru?<\/li>\n<li>Zaprojektuj doświadczenie: odczyn roztworu HCl (format DOŚWIADCZENIE).<\/li>\n<li>Wyjaśnij, dlaczego reakcja HCl + CaCO₃ daje CO₂.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"12\">\n<li>H₂SO₄ → H⁺ + HSO₄⁻; HSO₄⁻ ⇌ H⁺ + SO₄²⁻.<\/li>\n<li>H⁺ jest protonem; w wodzie łączy się z H₂O → H₃O⁺.<\/li>\n<li>Stopień dysocjacji H₃PO₄ jest niski — dysocjuje częściowo na każdym etapie.<\/li>\n<li>Problem → Hipoteza → Sprzęt → Obserwacja → Wniosek → Równanie → BHP.<\/li>\n<li>H₂CO₃ jest nietrwały → rozkłada się na H₂O + CO₂.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom D — zaawansowany<\/h3>\n<div class=\"card card-extra\">\n<ol start=\"17\">\n<li>Oblicz pH roztworu o [H⁺] = 10⁻³ mol/dm³.<\/li>\n<li>Oblicz [H⁺] w roztworze o pH = 2.<\/li>\n<li>Wyjaśnij różnicę między stopniem dysocjacji a stałą dysocjacji.<\/li>\n<li>Porównaj moc kwasów: HCl, HF, CH₃COOH. Uzasadnij różnice.<\/li>\n<li>Zaprojektuj doświadczenie: odróżnienie HCl od CH₃COOH.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"17\">\n<li>pH = −log(10⁻³) = 3.<\/li>\n<li>[H⁺] = 10⁻² = 0,01 mol/dm³.<\/li>\n<li>Stopień dysocjacji α — ułamek cząsteczek zdysocjowanych (zależy od stężenia); stała dysocjacji Ka — stała równowagi (nie zależy od stężenia, zależy od temperatury).<\/li>\n<li>HCl mocny (α ≈ 1); HF słaby (α ≈ 0,08); CH₃COOH słaby (α ≈ 0,01). Różnice wynikają z energii wiązania H–X i stabilności anionu.<\/li>\n<li>Dodać kroplę fenoloftaleiny — bezbarwna w obu (nie odróżni); wskaźnik uniwersalny — oba kwaśne; zbadać pH-metrem roztwory o <strong>tym samym stężeniu<\/strong> — HCl ma niższe pH; porównać przewodnictwo — HCl wyższe; dodać Mg — w HCl pęcherzyki wydzielają się szybciej (doświadczenie 10, <a href=\"#doswiadczenia\">§16<\/a>).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Interleaving — mieszanie tematów<\/span>\n<ol>\n<li>Jaki charakter ma SO₃? (z N01)<\/li>\n<li>Zapisz wzór wodorotlenku wapnia. (z N02)<\/li>\n<li>Zapisz wzór kwasu siarkowego(VI). (z N03)<\/li>\n<li>Zbilansuj: Al + O₂ → Al₂O₃. (z F05/F06 + N01)<\/li>\n<li>Ca(OH)₂ + 2HCl → ? (z N02 + N03)<\/li>\n<li>Ile elektronów ma jon Cl⁻? (z F05/F06)<\/li>\n<li>SO₂ + H₂O → ? (z N01 + N03)<\/li>\n<li>Fe(OH)₃ + 3HNO₃ → ? (z N02 + N03)<\/li>\n<\/ol>\n<\/div>\n<h3>Poziom B+/C+ — stężenia, pH, rozpoznawanie roztworów<\/h3>\n<div class=\"card\">\n<ol start=\"31\">\n<li>Oblicz masę HCl w 250 g roztworu 10%.<\/li>\n<li>Ile gramów wody trzeba dodać do 100 g 96% H₂SO₄, aby otrzymać roztwór 20%? Jak bezpiecznie to wykonać?<\/li>\n<li>(LO) Oblicz stężenie molowe 36% kwasu solnego o gęstości 1,18 g/cm³.<\/li>\n<li>(LO) Oblicz pH i α roztworu CH₃COOH o stężeniu 0,1 mol/dm³ (K<sub>a<\/sub> = 1,75·10⁻⁵).<\/li>\n<li>Masz trzy nieopisane probówki: HCl, NaOH i wodę destylowaną — oraz tylko fenoloftaleinę. Jak je rozpoznać?<\/li>\n<li>Uszereguj Mg, Cu, Fe, Zn według szybkości wydzielania wodoru w HCl. Zapisz równania.<\/li>\n<li>Dlaczego stężony HNO₃ przechowuje się w ciemnych butelkach? Zapisz równanie.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"31\">\n<li>m<sub>s<\/sub> = 10% · 250 g / 100% = 25 g.<\/li>\n<li>m<sub>s<\/sub> = 96 g; m<sub>r<\/sub>(20%) = 96 / 0,20 = 480 g → wody 380 g. Kwas wlewamy powoli do wody, mieszając i chłodząc.<\/li>\n<li>c<sub>m<\/sub> = 36 · 1,18 · 10 / 36,46 ≈ 11,7 mol/dm³.<\/li>\n<li>[H₃O⁺] ≈ √(1,75·10⁻⁵ · 0,1) ≈ 1,32·10⁻³ mol/dm³ → pH ≈ 2,88; α ≈ 1,32·10⁻³ / 0,1 ≈ 1,3%.<\/li>\n<li>Fenoloftaleina zabarwi się na malinowo tylko w NaOH. Malinowy roztwór dolewamy do pozostałych dwóch: w probówce z HCl barwa zniknie (zobojętnienie), w wodzie zostanie (tylko się rozcieńczy).<\/li>\n<li>Mg &gt; Zn &gt; Fe, Cu nie reaguje. Mg + 2 HCl → MgCl₂ + H₂↑; Zn + 2 HCl → ZnCl₂ + H₂↑; Fe + 2 HCl → FeCl₂ + H₂↑.<\/li>\n<li>Na świetle rozkłada się: 4 HNO₃ → 4 NO₂ + O₂ + 2 H₂O (brunatny NO₂ barwi kwas na żółto).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"test\">\n<div class=\"part-heading\"><span class=\"part-num\">19<\/span> Test końcowy<\/div>\n<div id=\"quizWrap\"><\/div>\n<div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<div class=\"card card-understand\" style=\"margin-top:18px;\">\n<span class=\"card-label\">Ćwiczenie — współczynniki<\/span>\n<p>Uzupełnij i sprawdź w odpowiedzi poniżej.<\/p>\n<pre class=\"step-flow\">___ HCl + ___ Ca(OH)₂ → ___ CaCl₂ + ___ H₂O\n___ H₂SO₄ + ___ NaOH → ___ Na₂SO₄ + ___ H₂O\n___ Al(OH)₃ + ___ HCl → ___ AlCl₃ + ___ H₂O<\/pre>\n<details class=\"answer\"><summary>Pokaż współczynniki<\/summary>\n<p>2 HCl + 1 Ca(OH)₂ → 1 CaCl₂ + 2 H₂O<\/p>\n<p>1 H₂SO₄ + 2 NaOH → 1 Na₂SO₄ + 2 H₂O<\/p>\n<p>1 Al(OH)₃ + 3 HCl → 1 AlCl₃ + 3 H₂O<\/p>\n<p class=\"mini-note\">Liczba grup OH⁻ z wodorotlenku = liczba atomów H z kwasu.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"powtorka\">\n<div class=\"part-heading\"><span class=\"part-num\">20<\/span> Karta szybkiego powtórzenia i mapa myśli<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Karta szybkiego powtórzenia (do druku)<\/span>\n<p class=\"mini-note\">Zasada 80/20: wzory kwasów · dysocjacja · reakcje z metalami i wodorotlenkami · pH.<\/p>\n<div class=\"mnemonic\">\n<b>Mnemotechniki rdzeniowe<\/b>\n<ol>\n<li>Kwasy beztlenowe: HCl, HBr, HI, H₂S, HF.<\/li>\n<li>Kwasy tlenowe: H + reszta kwasowa (np. HNO₃, H₂SO₄, H₃PO₄, H₂CO₃).<\/li>\n<li>Kwas = H⁺ + reszta kwasowa.<\/li>\n<li>Kwas + metal → sól + H₂ (metale aktywne).<\/li>\n<li>Kwas + wodorotlenek → sól + H₂O.<\/li>\n<li>Kwas + tlenek metalu → sól + H₂O.<\/li>\n<li>Kwas + sól → nowy kwas + nowa sól (jeśli powstaje osad / gaz / słaby elektrolit).<\/li>\n<\/ol>\n<\/div>\n<\/div>\n\n\n<div class=\"mnemonic\"><b>Mapa myśli w pigułce<\/b><ol><li><strong>Kwas = H⁺ + reszta kwasowa<\/strong> (HₙR → n H⁺ + Rⁿ⁻); w wodzie H₃O⁺.<\/li><li><strong>MTWS<\/strong> – co robi kwas: <strong>M<\/strong>etal → sól + H₂ (tylko przed H) · <strong>T<\/strong>lenek metalu → sól + H₂O · <strong>W<\/strong>odorotlenek → sól + H₂O · <strong>S<\/strong>ól (węglan) → sól + H₂O + CO₂↑.<\/li><li>Zawsze powstaje <strong>sól<\/strong>; dodatek: H₂ / H₂O / CO₂.<\/li><li><strong>Moc<\/strong> = α (nie stężenie). Mocne: HCl, HBr, HI, HNO₃, H₂SO₄ (I st.), HClO₄.<\/li><li><strong>pH<\/strong> &lt; 7 kwas · = 7 obojętny · &gt; 7 zasada; pH = −log[H₃O⁺].<\/li><li><strong>TNS<\/strong> – otrzymywanie: Tlenek + woda · Niemetal + wodór · Sól + mocniejszy kwas.<\/li><li><strong>BHP<\/strong>: kwas do wody, okulary, nie pipetować ustami.<\/li><\/ol><p class=\"mini-note\">Szereg aktywności: K &gt; Ca &gt; Na &gt; Mg &gt; Al &gt; Zn &gt; Fe &gt; Sn &gt; Pb &gt; <strong>H<\/strong> &gt; Cu &gt; Ag &gt; Au (z kwasem reagują metale przed H).<\/p><\/div>\n<\/section>\n<section id=\"fiszki\">\n<div class=\"part-heading\"><span class=\"part-num\">21<\/span> Fiszki<\/div>\n<div class=\"flashcard-grid\" id=\"flashcards\"><\/div>\n<\/section>\n<section id=\"slownik\">\n<div class=\"part-heading\"><span class=\"part-num\">22<\/span> Słownik<\/div>\n<div class=\"card\">\n<dl class=\"def-list\">\n<div class=\"def-item\"><dt>Kwas<\/dt><dd>Związek chemiczny, który w wodzie oddaje proton H⁺ (def. Brønsteda) lub dysocjuje na H⁺ i resztę kwasową (def. Arrheniusa).<\/dd><\/div>\n<div class=\"def-item\"><dt>Reszta kwasowa<\/dt><dd>Anion powstający po formalnym oddzieleniu protonów z kwasu; ma ładunek ujemny równy liczbie atomów H.<\/dd><\/div>\n<div class=\"def-item\"><dt>Dysocjacja elektrolityczna<\/dt><dd>Rozpad związku chemicznego na jony w roztworze wodnym.<\/dd><\/div>\n<div class=\"def-item\"><dt>Jonizacja<\/dt><dd>Powstawanie jonów w wyniku reakcji cząsteczki z rozpuszczalnikiem (HCl + H₂O → H₃O⁺ + Cl⁻).<\/dd><\/div>\n<div class=\"def-item\"><dt>Jon hydroniowy H₃O⁺<\/dt><dd>Kation powstający z protonu H⁺ i cząsteczki wody; faktyczna forma H⁺ w wodzie.<\/dd><\/div>\n<div class=\"def-item\"><dt>Stopień dysocjacji α<\/dt><dd>Ułamek cząsteczek, które uległy dysocjacji. α = 1 dla kwasów mocnych, α &lt; 1 dla słabych.<\/dd><\/div>\n<div class=\"def-item\"><dt>pH<\/dt><dd>Ujemny logarytm dziesiętny stężenia (aktywności) jonów hydroniowych H₃O⁺: pH = −log[H₃O⁺].<\/dd><\/div>\n<div class=\"def-item\"><dt>Wskaźnik kwasowo-zasadowy<\/dt><dd>Substancja zmieniająca barwę w zależności od pH roztworu (fenoloftaleina, oranż metylowy).<\/dd><\/div>\n<div class=\"def-item\"><dt>Zobojętnianie<\/dt><dd>Reakcja kwasu z zasadą → sól + woda. Jonowo: H⁺ + OH⁻ → H₂O.<\/dd><\/div>\n<div class=\"def-item\"><dt>Szereg aktywności metali<\/dt><dd>Uporządkowanie metali wg aktywności chemicznej: K &gt; Ca &gt; Na &gt; Mg &gt; Al &gt; Zn &gt; Fe &gt; Sn &gt; Pb &gt; H &gt; Cu &gt; Ag &gt; Au.<\/dd><\/div>\n<div class=\"def-item\"><dt>Kwas mocny<\/dt><dd>Kwas, który w wodzie dysocjuje praktycznie całkowicie (α ≈ 1): HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄.<\/dd><\/div>\n<div class=\"def-item\"><dt>Kwas słaby<\/dt><dd>Kwas, który w wodzie dysocjuje tylko częściowo (α &lt; 1): HF, H₂CO₃, H₂S, H₂SO₃, HNO₂, H₃PO₄, CH₃COOH.<\/dd><\/div>\n<div class=\"def-item\"><dt>Kwas organiczny<\/dt><dd>Kwas zawierający grupę karboksylową –COOH (R–COOH); np. HCOOH, CH₃COOH.<\/dd><\/div>\n<div class=\"def-item\"><dt>Stała dysocjacji K<sub>a<\/sub><\/dt><dd>Stała równowagi dysocjacji słabego kwasu: K<sub>a<\/sub> = [H₃O⁺][A⁻]/[HA]; zależy od temperatury, nie od stężenia. pK<sub>a<\/sub> = −log K<sub>a<\/sub>.<\/dd><\/div>\n<div class=\"def-item\"><dt>Elektrolit<\/dt><dd>Substancja, której roztwór (lub stop) przewodzi prąd dzięki jonom; mocny — dysocjuje prawie całkowicie, słaby — częściowo.<\/dd><\/div>\n<div class=\"def-item\"><dt>Pasywacja<\/dt><dd>Pokrycie metalu cienką, szczelną warstwą tlenku (np. Fe, Al w stęż. HNO₃), która zatrzymuje dalszą reakcję.<\/dd><\/div>\n<div class=\"def-item\"><dt>Titracja (miareczkowanie)<\/dt><dd>Metoda analizy ilościowej — stopniowe dodawanie titranta do analitu do osiągnięcia punktu równoważnikowego.<\/dd><\/div>\n<div class=\"def-item\"><dt>Bufor<\/dt><dd>Układ (mieszanina słabego kwasu i jego soli lub słabej zasady i jej soli) ograniczający zmianę pH.<\/dd><\/div>\n<div class=\"def-item\"><dt>Kwaśne deszcze<\/dt><dd>Opady o pH &lt; 5,6, powstające z SO₂ i NO₂ w atmosferze.<\/dd><\/div>\n<div class=\"def-item\"><dt>Punkt równoważnikowy<\/dt><dd>Moment, w którym liczba moli titranta = liczba moli analitu (stechiometrycznie).<\/dd><\/div>\n<div class=\"def-item\"><dt>Punkt końcowy<\/dt><dd>Moment, w którym wskaźnik zmienia barwę; obserwowany, może różnić się od równoważnikowego.<\/dd><\/div>\n<\/dl>\n<\/div>\n<\/section>\n<section id=\"checklista\">\n<div class=\"part-heading\"><span class=\"part-num\">23<\/span> Checklista<\/div>\n<div class=\"checklist\">\n<h4>Sprawdź, czy umiesz:<\/h4>\n<ul>\n<li>Zdefiniować kwas (Arrhenius, Brønsted).<\/li>\n<li>Zapisać wzór kwasu beztlenowego i tlenowego.<\/li>\n<li>Nazwać kwas (beztlenowy, tlenowy z cyfrą rzymską).<\/li>\n<li>Odczytać resztę kwasową z kwasu.<\/li>\n<li>Zapisać równanie dysocjacji kwasu.<\/li>\n<li>Rozróżnić kwasy mocne od słabych (tabela).<\/li>\n<li>Wyjaśnić, dlaczego moc ≠ stężenie.<\/li>\n<li>Obliczyć pH z [H₃O⁺] i odwrotnie.<\/li>\n<li>Zastosować wskaźniki (fenoloftaleina, oranż, papierek).<\/li>\n<li>Opisać właściwości HCl, H₂SO₄, HNO₃ (dymienie, higroskopijność, zwęglanie, reakcja ksantoproteinowa).<\/li>\n<li>Wyjaśnić, dlaczego roztwory kwasów przewodzą prąd.<\/li>\n<li>Obliczyć stężenie procentowe i rozcieńczenie roztworu kwasu.<\/li>\n<li>(LO) Posługiwać się K<sub>a<\/sub>/pK<sub>a<\/sub> i obliczyć pH słabego kwasu.<\/li>\n<li>Zapisać reakcje kwasów: metal, tlenek, wodorotlenek, sól.<\/li>\n<li>Znać szereg aktywności metali i wiedzieć, dlaczego Cu nie reaguje z HCl.<\/li>\n<li>Opisać powstawanie kwaśnych deszczy (SO₂, NO₂ → kwasy).<\/li>\n<li>Stosować BHP (kwas do wody, okulary, nie pipetować ustami).<\/li>\n<li>(ambitnie) Znać kwasy organiczne (HCOOH, CH₃COOH).<\/li>\n<li>(ambitnie) Wyjaśnić titrację — punkt równoważnikowy ≠ punkt końcowy.<\/li>\n<li>(ambitnie) Wyjaśnić działanie buforu.<\/li>\n<li>(zaawansowanie) Znać historię: Arrhenius, Brønsted, Lewis.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"historia\">\n<div class=\"part-heading\"><span class=\"part-num\">A<\/span> Dodatek A — historia pojęcia kwasu i teorie kwasów i zasad <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-understand\">\n<p class=\"mini-note\">Definicje używane w lekcji: Arrhenius i Brønsted — <a href=\"#definicja\">§1<\/a>.<\/p>\n<div style=\"display:grid;gap:12px;\">\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\">\n<strong>1887 — Svante Arrhenius (szwedzki chemik)<\/strong>\n<p>Teoria dysocjacji elektrolitycznej: <strong>kwas<\/strong> to substancja, która w wodzie daje jony H⁺; <strong>zasada<\/strong> — substancja, która w wodzie daje jony OH⁻.<\/p>\n<p>Nagroda Nobla w 1903 r.<\/p>\n<p><strong>Ograniczenie:<\/strong> nie wyjaśnia, dlaczego NH₃ (bez OH⁻ w cząsteczce) daje odczyn zasadowy.<\/p>\n<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\">\n<strong>1923 — Johannes Brønsted (duński) i Thomas Lowry (angielski)<\/strong>\n<p>Niezależnie zaproponowali teorię protonową:<\/p>\n<ul>\n<li><strong>Kwas<\/strong> = donor protonu H⁺<\/li>\n<li><strong>Zasada<\/strong> = akceptor protonu H⁺<\/li>\n<\/ul>\n<p>Przykład: NH₃ + H₂O ⇌ NH₄⁺ + OH⁻. NH₃ przyjmuje proton od H₂O → NH₃ jest zasadą, a H₂O kwasem.<\/p>\n<p><strong>Pary sprzężone<\/strong> (zapis: kwas/sprzężona zasada): HCl/Cl⁻, H₃O⁺/H₂O, NH₄⁺/NH₃, H₂O/OH⁻. Woda jest <strong>amfiprotyczna<\/strong> — raz kwasem, raz zasadą.<\/p>\n<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\">\n<strong>1923 — Gilbert Lewis (amerykański)<\/strong>\n<p>Teoria elektronowa:<\/p>\n<ul>\n<li><strong>Kwas<\/strong> = akceptor pary elektronowej<\/li>\n<li><strong>Zasada<\/strong> = donor pary elektronowej<\/li>\n<\/ul>\n<p>Najszersza teoria — obejmuje reakcje bez protonu (np. BF₃ + NH₃ → F₃B←NH₃).<\/p>\n<p>Używana głównie w chemii koordynacyjnej i organicznej.<\/p>\n<\/div>\n<div style=\"border-left:3px solid var(--accent);padding-left:14px;\">\n<strong>XX wiek — rozwój<\/strong>\n<p>Dalsze teorie (Pearson — HSAB, Usanowicz) są poza programem szkolnym — rozwiń ramkę poniżej.<\/p>\n<details class=\"adv\"><summary>Teoria HSAB Pearsona i teoria Usanowicza <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>Teoria Pearsona (HSAB — twarde/miękkie kwasy i zasady), teoria Usanovicha (najszersza), rozwój chemii supramolekularnej.<\/p><p><strong>HSAB<\/strong> (1963): kwasy i zasady Lewisa dzieli się na „twarde” (małe, mało polaryzowalne: H⁺, Na⁺, Al³⁺, F⁻, OH⁻) i „miękkie” (duże, polaryzowalne: Ag⁺, Hg²⁺, I⁻, S²⁻). Trwałe połączenia tworzą pary twardy–twardy i miękki–miękki — tłumaczy to np. występowanie Hg i Pb w przyrodzie jako siarczków, a Al i Mg jako tlenków. <strong>Usanowicz<\/strong> (1939): kwas to substancja oddająca kation lub przyjmująca anion/elektrony — obejmuje też reakcje redoks.<\/p><\/div><\/details>\n<p>Na poziomie E8 wystarczy znać Arrheniusa i (ambitnie) Brønsteda.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n<section id=\"mosty\">\n<div class=\"part-heading\"><span class=\"part-num\">B<\/span> Dodatek B — mosty do innych lekcji<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Powiązania<\/span>\n<ul>\n<li><strong>N01 — Tlenki:<\/strong> tlenki kwasowe (SO₂, SO₃, CO₂, P₂O₅, N₂O₅) + woda → kwasy.<\/li>\n<li><strong>N02 — Wodorotlenki:<\/strong> kwas + wodorotlenek → sól + woda (zobojętnianie).<\/li>\n<li><strong>N04 — Sole:<\/strong> każda reakcja kwasu z wodorotlenkiem lub tlenkiem metalu daje sól.<\/li>\n<li><strong>X01–X10 — Redoks:<\/strong> HCl + Zn → ZnCl₂ + H₂ to reakcja redoks (Zn utlenia się, H⁺ redukuje się).<\/li>\n<li><strong>Most do Konstruktora Uniwersalnego<\/strong> (aplikacja CHE): pełna analiza wzoru, bilans ładunków, jony, rozpuszczalność, równania jonowe, stopnie utlenienia.<\/li>\n<li><strong>LO rozszerzone:<\/strong> Ka, pKa, pH, pOH, hydroliza soli, bufory (Henderson–Hasselbalch).<\/li>\n<\/ul>\n<p class=\"mini-note\">Wiadomości wcześniejsze — <a href=\"#kompas\">§0.3<\/a>.<\/p>\n<\/div>\n<\/section>\n<section id=\"modele\">\n<div class=\"part-heading\"><span class=\"part-num\">↻<\/span> Modele silnika w tej lekcji<\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>Sekcja<\/th><th>Model<\/th><th>Co pokazuje<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#reszty\">§3<\/a><\/td><td><code>kw-reszty-v01<\/code><\/td><td>kwas → reszta → sole (13 metali)<\/td><\/tr><tr><td><a href=\"#wlasciwosci\">§4<\/a><\/td><td><code>kw-wlasciwosci-v01<\/code><\/td><td>pokazy: cukier + H₂SO₄, białko + HNO₃, HCl dymi<\/td><\/tr><tr><td><a href=\"#dysocjacja\">§5<\/a><\/td><td><code>kw-dysocjacja-v01<\/code><\/td><td>dysocjacja krok po kroku, α i pH z Ka, wykres α(c)<\/td><\/tr><tr><td><a href=\"#dysocjacja\">§5<\/a><\/td><td><code>gfx-scene-conductivity<\/code><\/td><td>tester przewodnictwa<\/td><\/tr><tr><td><a href=\"#ph\">§7<\/a><\/td><td><code>ph-indicators-v03<\/code><\/td><td>skala pH, barwy wskaźników, drabinka kwasów i zasad<\/td><\/tr><tr><td><a href=\"#ph\">§7<\/a><\/td><td><code>gfx-scene-indicatorRack<\/code><\/td><td>wskaźnik w siedmiu roztworach<\/td><\/tr><tr><td><a href=\"#reakcje\">§9<\/a><\/td><td><code>kw-szereg-metali-v01<\/code><\/td><td>szereg aktywności: Mg, Zn, Fe, Cu w HCl<\/td><\/tr><tr><td><a href=\"#reakcje\">§9<\/a><\/td><td><code>gfx-scene-acidMetal<\/code><\/td><td>metal + HCl, próba „pyk!”<\/td><\/tr><tr><td><a href=\"#reakcje\">§9<\/a><\/td><td><code>rownania-jonowe-v01<\/code><\/td><td>równania jonowe pełne i skrócone<\/td><\/tr><tr><td><a href=\"#reakcje\">§9<\/a><\/td><td><code>tabela-rozpuszczalnosci-v01<\/code><\/td><td>tabela rozpuszczalności, nazwy soli<\/td><\/tr><tr><td><a href=\"#reakcje\">§9<\/a><\/td><td><code>reakcje-kwasu-v03<\/code><\/td><td>przewidź i sprawdź<\/td><\/tr><tr><td><a href=\"#deszcze\">§10<\/a><\/td><td><code>acid-rain-v01<\/code><\/td><td>obieg kwaśnych deszczy<\/td><\/tr><tr><td><a href=\"#bhp\">§12<\/a><\/td><td><code>gfx-scene-dilution<\/code><\/td><td>„kwas do wody” — poprawnie i błędnie<\/td><\/tr><tr><td><a href=\"#miareczkowanie\">§14<\/a><\/td><td><code>gfx-scene-titration<\/code><\/td><td>biureta, kolba, fenoloftaleina<\/td><\/tr><tr><td><a href=\"#miareczkowanie\">§14<\/a><\/td><td><code>titration-merged<\/code><\/td><td>krzywa miareczkowania<\/td><\/tr><tr><td><a href=\"#bufory\">§15<\/a><\/td><td><code>kw-bufor-v01<\/code><\/td><td>bufor octanowy kontra woda<\/td><\/tr><tr><td><a href=\"#doswiadczenia\">§16<\/a><\/td><td><code>kw-doswiadczenia-v01<\/code><\/td><td>pracownia doświadczeń (przyciski „Zobacz w zlewce”)<\/td><\/tr><\/tbody><\/table><\/div><p class=\"mini-note\">Każdy model występuje w lekcji raz; liczby, barwy i równania pochodzą z silnika CHE.<\/p>\n<\/section>\n<section id=\"audit\">\n<div class=\"part-heading\"><span class=\"part-num\">✓<\/span> Audyt jakości <span class=\"level-badge level-exam\">KONTROLA<\/span><\/div>\n<div class=\"audit-panel\">\n<h4>Audyt merytoryczny i funkcjonalny v1.2<\/h4>\n<div class=\"audit-grid\">\n<div class=\"audit-item\"><strong>Usunięcie duplikatów:<\/strong> wersja v1.2 usuwa duplikację treści L004 (legacy-migration) i scalają ją z sekcjami N03. Jedna wersja dla każdego tematu.<\/div>\n<div class=\"audit-item\"><strong>Struktura:<\/strong> sekcje uporządkowane zgodnie z docelowym porządkiem (0–24 + audyt).<\/div>\n<div class=\"audit-item\"><strong>P1 (krytyczne E8) — dodane:<\/strong> szereg aktywności metali, otrzymywanie kwasów beztlenowych, reakcje z solami, przykłady pH, tabela wskaźników, zasady BHP, tabela mocy kwasów.<\/div>\n<div class=\"audit-item\"><strong>P2 (rozumienie) — dodane:<\/strong> HCl(g) vs HCl(aq), kwas + metal (warunek), kwaśne deszcze (chemizm), kwasy organiczne (tabela), zastosowania (konkretne).<\/div>\n<div class=\"audit-item\"><strong>P3 (rozszerzenie) — dodane:<\/strong> historia (Arrhenius, Brønsted, Lewis), titracja (punkt równoważnikowy vs końcowy), bufory (Henderson–Hasselbalch).<\/div>\n<div class=\"audit-item\"><strong>Widgety:<\/strong> reszta-converter, ionization-anim, phWskazniki (interaktywna skala), ind-lab, acid-reactor, titration-curve, buffer-widget.<\/div>\n<div class=\"audit-item\"><strong>Spójność:<\/strong> ten sam layout co N01/N02, te same klasy (card-basic, card-understand, card-warning, card-error, card-extra, card-exam, card-new, card-core).<\/div>\n<div class=\"audit-item\"><strong>Nawigacja:<\/strong> TOC (details/summary), FAB (lewy/prawy), bottom-nav, resume, anchor-links.<\/div>\n<div class=\"audit-item\"><strong>Dostępność:<\/strong> skip-link, aria-label, focus-visible, prefers-reduced-motion, print CSS.<\/div>\n<div class=\"audit-item\"><strong>Mosty:<\/strong> linki do Konstruktora, N01, N02, N04. Bridge sekcja w treści.<\/div>\n<\/div>\n<p style=\"margin-top:14px;\"><strong>Zachowana cała treść merytoryczna N03 v1.1 + dodane wszystkie P1/P2/P3 + usunięte duplikaty.<\/strong><\/p>\n<p><strong>Numer:<\/strong> N03 (kwasy). Poprzednia: N02 Wodorotlenki i zasady. Następna: N04 Sole.<\/p>\n<\/div>\n<div class=\"card card-new\">\n<span class=\"card-label\">v1.5 — korekta merytoryczna i uzupełnienia (2026-10)<\/span>\n<p><strong>Poprawione błędy:<\/strong> barwa oranżu metylowego i papierka uniwersalnego w roztworze obojętnym; ocet w złym przedziale pH; kwas Brønsteda „bez wodoru”; H₃PO₃ jako kwas trójprotonowy; warunki H₂ + Cl₂ / I₂; α H₃PO₄, HF, CH₃COOH z podanym stężeniem; błędna odpowiedź w zadaniu klinicznym HF/HCl (0,1 M HF ma pH ≈ 2,1 &lt; 3); uzasadnienie NaCl + H₂SO₄ (lotność, nie moc); para sprzężona H₃O⁺/H₂O; „szkło wodne” to Na₂SiO₃, nie H₂SiO₃; żołądek nie jest buforem, ślina — głównie bufor wodorowęglanowy; BHP przy rozlaniu kwasu i przy próbie wodoru; zdanie o rozcieńczaniu (α↑, [H₃O⁺]↓, pH↑).<\/p>\n<p><strong>Dodane:<\/strong> 4.5 właściwości kwasów (E8), 5.6 przewodzenie prądu, 6.5 stężenia C<sub>p<\/sub> i c<sub>m<\/sub>, 6.6 K<sub>a<\/sub>/pK<sub>a<\/sub> i pH słabego kwasu, pOH i K<sub>w<\/sub>, szczegóły reakcji metal + kwas (Fe → Fe²⁺, Al, Pb, redoks), kwasy utleniające i pasywacja, tlenki amfoteryczne, wywar z kapusty, kwasy tłuszczowe, 10.1 kwasy w organizmie (biol-chem), doświadczenia 6–10, 6 błędów w klinice, 7 zadań, 10 fiszek, 7 pytań testowych, przyciski do doświadczeń w silniku GFX.<\/p>\n<p><strong>Ukryte (nie usunięte):<\/strong> treści ponad maturę rozszerzoną w ramkach „poziom akademicki” — reguła Paulinga, termodynamika HF, efekt wyrównujący i superkwasy, aktywności, pH obojętne w innej temperaturze, wskaźnik jako słaby kwas, potencjał a energia jonizacji, woda królewska, HSAB/Usanowicz (oryginalne zdanie zachowane w ramce), pojemność buforowa, bufor krwi ilościowo.<\/p>\n<\/div>\n<div class=\"card card-understand\"><span class=\"card-label\">v1.9 — redakcja wg STANDARD_LEKCJI (2026-10-07)<\/span><ul><li>Kolejność: start (minimum, spis, cele, kompas) → rdzeń E8 → rozumienie/ambitne → praktyka → powtórka → dodatki; plakietki E8 / ROZUMIENIE / AMBITNE przy sekcjach i podsekcjach ponad E8.<\/li><li>Scalone powtórzenia: „sól + kwas” (otrzymywanie ↔ reakcje), mgła HCl, CH₃COOH jednoprotonowy, bufor krwi (zastosowania ↔ bufory), notki o oranżu metylowym, „mocny ≠ stężony”, „kwas do wody”.<\/li><li>Jeden model = jedno miejsce: usunięte dublujące przyciski (dysocjacja ×3, panel pH ×2, tabela rozpuszczalności ×2, przewodzenie, szereg aktywności, pokazy); doświadczenia otwierają pracownię przyciskiem „Zobacz w zlewce”.<\/li><li>Poprawki: α(HF) ≈ 0,08 (nie 0,1) w klinice i ćwiczeniach; kody lekcji w mostach (N04, X01–X10).<\/li><li>Notki o poprawkach z v1.5 przeniesione z treści do audytu:<\/li><\/ul><p class=\"mini-note\"> Poprawka: wcześniej napisano, że kwasem Brønsteda może być substancja „bez wodoru” — to nieprawda; dotyczy to kwasów Lewisa.<\/p><p class=\"mini-note\"> Poprawka: wcześniej uzasadniano reakcję NaCl + H₂SO₄ tym, że H₂SO₄ jest „mocniejszy” — o przebiegu decyduje lotność HCl.<\/p><p class=\"mini-note\"> Poprawka: poprzednia odpowiedź sugerowała, że rozcieńczony HCl ma niższe pH — dla podanych stężeń jest odwrotnie.<\/p><\/div>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA N03 v1.9 MASTER LAB<\/strong> · Kwasy · 2026<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n\n<script>\n\n(function(){\n  var sel=document.getElementById('acidSelect');\n  var out=document.getElementById('resztaResult');\n  if(!sel||!out)return;\n  function render(){\n    var v=sel.value.split('|');\n    out.innerHTML='<b>'+v[0]+'<\/b> → <b>'+v[1]+'<\/b> → przykładowa sól: <b>'+v[2]+'<\/b>';\n  }\n  sel.addEventListener('change',render);\n  render();\n})();\n\n\n(function(){\n  var r=document.getElementById('phRange');\n  var v=document.getElementById('phValue');\n  var t=document.getElementById('phType');\n  var ind=document.getElementById('phIndicator');\n  if(!r)return;\n  function render(){\n    var p=parseFloat(r.value);\n    v.textContent=p.toFixed(1);\n    t.textContent=p<7?'kwasowy':p>7?'zasadowy':'obojętny';\n    var s;\n    if(p<3.1)s='oranż: czerwony';\n    else if(p<4.4)s='oranż: pomarańczowy';\n    else if(p<7)s='oranż: żółty';\n    else if(p<8.2)s='fenoloftaleina: bezbarwna';\n    else if(p<10)s='fenoloftaleina: różowa';\n    else s='fenoloftaleina: malinowa';\n    ind.textContent=s;\n  }\n  r.addEventListener('input',render);\n  document.querySelectorAll('[data-ph]').forEach(function(b){\n    b.addEventListener('click',function(){r.value=b.dataset.ph;render();});\n  });\n  render();\n})();\n\n(function(){\n  var sel=document.getElementById('samplePh');\n  var out=document.getElementById('indResult');\n  if(!sel||!out)return;\n  function render(){\n    var p=parseFloat(sel.value);\n    var b=p<3.1?'czerwony':p<4.4?'pomarańczowy':p<7?'żółty':p<8.2?'zielony':p<10?'różowy':'malinowy';\n    out.innerHTML='<b>Obserwacja:<\/b> barwa '+b+'.<br><b>Wniosek:<\/b> pH ≈ '+p+', odczyn '+(p<7?'kwasowy':p>7?'zasadowy':'obojętny')+'.';\n  }\n  sel.addEventListener('change',render);\n  render();\n})();\n\n(function(){\n  var data={\n    'metal':'<b>Kwas + metal aktywny → sól + wodór<\/b><br>Zn + 2 HCl → ZnCl₂ + H₂↑<br><small>Metal musi być aktywniejszy od wodoru (przed H w szeregu).<\/small>',\n    'oxide':'<b>Kwas + tlenek metalu → sól + woda<\/b><br>CuO + 2 HCl → CuCl₂ + H₂O<br><small>Tlenek nie musi reagować z wodą — z kwasem reaguje.<\/small>',\n    'base':'<b>Kwas + wodorotlenek → sól + woda<\/b><br>NaOH + HCl → NaCl + H₂O<br><small>Zobojętnianie. Jonowo: H⁺ + OH⁻ → H₂O.<\/small>',\n    'carbonate':'<b>Kwas + węglan → sól + woda + CO₂↑<\/b><br>CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑<br><small>H₂CO₃ rozkłada się na H₂O + CO₂↑ — ulatniający się gaz sprawia, że reakcja biegnie do końca.<\/small>',\n    'silverNitrate':'<b>Kwas + sól (strącenie)<\/b><br>AgNO₃ + HCl → AgCl↓ + HNO₃<br><small>Biały osad AgCl.<\/small>',\n    'copperNitric':'<b>HNO₃ jest kwasem utleniającym — nie stosuj schematu „metal + kwas → H₂”.<\/b><br>Cu + 4 HNO₃ (stęż.) → Cu(NO₃)₂ + 2 NO₂↑ + 2 H₂O<br><small>Tylko pokaz nauczycielski.<\/small>'\n  };\n  document.querySelectorAll('#acidReactor [data-r]').forEach(function(b){\n    b.addEventListener('click',function(){\n      document.getElementById('reactorResult').innerHTML=data[b.dataset.r];\n    });\n  });\n})();\n\n\n\n(function(){\n  var cards=[\n    ['Co to jest kwas?','Związek oddający H⁺ w wodzie'],\n    ['HCl — nazwa','kwas chlorowodorowy'],\n    ['H₂SO₄ — nazwa','kwas siarkowy(VI)'],\n    ['HNO₃ — nazwa','kwas azotowy(V)'],\n    ['H₂CO₃ — nazwa','kwas węglowy'],\n    ['H₃PO₄ — nazwa','kwas fosforowy(V)'],\n    ['HCl — dysocjacja','H⁺ + Cl⁻'],\n    ['H₂SO₄ — dysocjacja','2 H⁺ + SO₄²⁻'],\n    ['HNO₃ — dysocjacja','H⁺ + NO₃⁻'],\n    ['Kwasy mocne','HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄'],\n    ['Kwasy słabe','HF, H₂S, H₂CO₃, H₂SO₃, HNO₂, H₃PO₄, CH₃COOH'],\n    ['Kwas + metal aktywny →','sól + H₂ (metale przed H w szeregu)'],\n    ['Kwas + tlenek metalu →','sól + woda'],\n    ['Kwas + wodorotlenek →','sól + woda'],\n    ['Kwas + węglan →','sól + woda + CO₂'],\n    ['pH < 7','kwasowy'],\n    ['pH = 7','obojętny'],\n    ['pH > 7','zasadowy'],\n    ['Fenoloftaleina w kwasie','bezbarwna'],\n    ['Oranż metyl 'Tylko w 25°C'],1],\n    ['Co powstaje z kwasu i węglanu?',['H₂','CO₂','O₂'],1],\n    ['Który metal reaguje z HCl w szkolnym modelu?',['Cu','Zn','Ag'],1],\n    ['pH = 3 oznacza odczyn...',['kwasowy','obojętny','zasadowy'],0],\n    ['H₂SO₄ ma formalnie ile protonów kwasowych (szkolnie)?',['1','2','4'],1],\n    ['Poprawny schemat BHP przy rozcieńczaniu?',['woda do kwasu','kwas do wody','obojętnie'],1],\n    ['Co to punkt równoważnikowy?',['wynika ze stechiometrii','zawsze pH 7','zmiana barwy wskaźnika'],0],\n    ['Co robi bufor?',['gwałtownie zmienia pH','ogranicza zmianę pH','usuwa wodę'],1],\n    ['CuO + HCl daje...',['CuCl₂ + H₂O','Cu + H₂','CO₂'],0],\n    ['Reszta HNO₃ to...',['NO₂⁻','NO₃⁻','NH₄⁺'],1],\n    ['H⁺ w wodzie jest najlepiej modelowany jako...',['H₂','H₃O⁺','OH⁻'],1],\n    ['Które stwierdzenie o pKa jest poprawne?',['pKa 2 = słabszy niż pKa 5','pKa 2 = mocniejszy niż pKa 5','pKa nie ma związku z Ka'],1],\n    ['Który kwas jest słaby?',['HCl','CH₃COOH','HBr'],1],\n    ['Reakcja HCl + Zn to typ...',['strącenie','redoks','zobojętnianie'],1],\n    ['Mleko wapienne to...',['roztwór','zawiesina','osad suchy'],1],\n    ['Co tworzy się, gdy Cu reaguje ze stęż. HNO₃?',['H₂','NO₂','O₂'],1],\n    ['W jakim zakresie pH zmienia barwę fenoloftaleina?',['3,1–4,4','8,2–10,0','5,0–8,0'],1],\n    ['Barwa oranżu metylowego w wodzie destylowanej (pH 7)?',['czerwona','pomarańczowa','żółta'],2],\n    ['Który kwas żółknie na świetle?',['H₂SO₄','HNO₃','HCl'],1],\n    ['Ile gramów kwasu jest w 200 g roztworu 15%?',['15 g','30 g','185 g'],1],\n    ['Co powstaje w reakcji Fe z rozcieńczonym HCl?',['FeCl₃ + H₂','FeCl₂ + H₂','Fe₂O₃ + H₂O'],1],\n    ['Dlaczego NaCl + stęż. H₂SO₄ daje HCl?',['H₂SO₄ jest mocniejszy od HCl','HCl jest lotny i ulatnia się','powstaje osad'],1],\n    ['Który roztwór 0,1 M najsłabiej przewodzi prąd?',['HCl','HNO₃','CH₃COOH'],2],\n    ['pH 0,1 M HF (Ka ≈ 6,3·10⁻⁴) jest…',['niższe niż pH 0,001 M HCl','wyższe niż pH 0,001 M HCl','równe 7'],0]\n  ];\n  var wrap=document.getElementById('quizWrap');\n  var score=document.getElementById('quizScore');\n  if(!wrap)return;\n  var answered=0,correct=0;\n  qs.forEach(function(q,i){\n    var d=document.createElement('div');\n    d.className='quiz-q';\n    var html='<h5>'+(i+1)+'. '+q[0]+'<\/h5><div class=\"quiz-opts\">';\n    q[1].forEach(function(o,j){\n      html+='<button type=\"button\" class=\"quiz-opt\" data-q=\"'+i+'\" data-a=\"'+j+'\">'+o+'<\/button>';\n    });\n    html+='<\/div><div class=\"quiz-fb\" id=\"qf'+i+'\"><\/div>';\n    d.innerHTML=html;\n    wrap.appendChild(d);\n  });\n  wrap.querySelectorAll('.quiz-opt').forEach(function(b){\n    b.addEventListener('click',function(){\n      var qi=+b.dataset.q;var ai=+b.dataset.a;\n      var q=qs[qi];\n      var parent=b.parentElement;\n      if(parent.dataset.done)return;\n      parent.dataset.done='1';\n      answered++;\n      parent.querySelectorAll('.quiz-opt').forEach(function(x){\n        x.disabled=true;\n        if(+x.dataset.a===q[2])x.classList.add('correct');\n      });\n      var fb=document.getElementById('qf'+qi);\n      if(ai===q[2]){\n        correct++;b.classList.add('correct');\n        fb.className='quiz-fb show ok';\n        fb.textContent='✓ Poprawnie.';\n      }else{\n        b.classList.add('wrong');\n        fb.className='quiz-fb show bad';\n        fb.textContent='✕ Sprawdź w sekcji powyżej.';\n      }\n      if(answered===qs.length){\n        score.className='quiz-score show';\n        score.textContent='Wynik: '+correct+' / '+qs.length+' ('+Math.round(100*correct/qs.length)+'%).';\n      }\n    });\n  });\n})();\n\n(function(){\n  var btn=document.getElementById('mapExpand');\n  var overlay=document.getElementById('mapOverlay');\n  var canvas=document.getElementById('mapCanvas');\n  var src=document.getElementById('mapSvg');\n  if(!btn||!overlay||!canvas||!src)return;\n  var scale=1,ox=0,oy=0,drag=false,sx=0,sy=0,sox=0,soy=0,cl=null;\n  function apply(){if(cl)cl.style.transform='translate('+ox+'p
