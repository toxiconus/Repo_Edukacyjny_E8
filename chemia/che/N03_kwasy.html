<script type="application/json" id="che-kw-src">"<!DOCTYPE html>\n<html lang=\"pl\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width,initial-scale=1.0\" name=\"viewport\"/>\n<title>Chemia N03 — Kwasy (v1.9 MASTER LAB)<\/title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap\" rel=\"stylesheet\"/>\n\n<style id=\"che-lesson-viz-ref-style\">.che-lesson-viz-ref{margin:14px 0}.che-lesson-viz-ref button{display:flex;flex-direction:column;gap:4px;width:100%;padding:12px 14px;text-align:left;border:1px solid #cfd8e3;border-radius:12px;background:#f7f9fc;color:#182231;cursor:pointer}.che-lesson-viz-ref button:hover{border-color:#6b86a5;box-shadow:0 3px 12px rgba(20,40,70,.08)}.che-lesson-viz-ref b{font-size:14px}.che-lesson-viz-ref span{font-size:12px;color:#5b6675}<\/style><style id=\"kw-v15-style\">details.adv{border:1px dashed var(--c-warn-line,#eed8a8);border-radius:10px;background:var(--surface-soft,#f6f8fa);margin:10px 0;padding:0 12px}details.adv>summary{cursor:pointer;font-weight:700;color:var(--c-warn,#b06f1c);padding:9px 0;list-style:none}details.adv>summary::-webkit-details-marker{display:none}details.adv>summary::before{content:\"▸ \"}details.adv[open]>summary::before{content:\"▾ \"}.adv-tag{font-weight:600;font-size:11px;opacity:.75;margin-left:6px}.adv-body{padding:0 0 10px;font-size:13.5px;line-height:1.6}.adv-body table{font-size:12.5px}.adv-toggle{margin-top:10px;border:1px solid var(--c-warn-line,#eed8a8);background:var(--c-warn-bg,#fcf4e6);color:var(--c-warn,#b06f1c);border-radius:999px;padding:6px 12px;font:700 12px Inter,system-ui,sans-serif;cursor:pointer}.bio-tag{display:inline-block;font:800 10px Inter,system-ui;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:rgba(46,125,79,.12);color:#2e7d4f;margin-left:6px;vertical-align:middle}.v15{display:inline-block;font:800 9.5px Inter,system-ui;padding:1px 6px;border-radius:99px;background:rgba(13,125,125,.12);color:#0d7d7d;margin-left:6px;vertical-align:middle}@media print{details.adv{display:block}details.adv>.adv-body{display:block}}<\/style><style id=\"che-prac-go-style\">.che-prac-go{margin-top:8px;border:1px solid #0d6868;color:#0d6868;background:#fff;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}.che-prac-go:hover{background:#0d6868;color:#fff}<\/style><\/head>\n<body>\n\n<a href=\"#minimum\" class=\"skip-link\">Przejdź do treści<\/a>\n\n\n\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\">\n<div class=\"hero-kicker\">N03 · MASTER LAB v1.9<\/div>\n<h1>Kwasy<\/h1>\n<p class=\"lead\">Samodzielna lekcja MASTER: definicja, nazewnictwo, dysocjacja, moc, pH, reakcje, kwaśne deszcze, zastosowania, bezpieczeństwo, historia i rozszerzenia (titracja, bufory, kwasy organiczne).<\/p>\n<div class=\"tag-row\">\n<span class=\"level-badge level-basic\">E8<\/span>\n<span class=\"level-badge level-understand\">ROZUMIENIE<\/span>\n<span class=\"level-badge level-extra\">AMBITNE (LO)<\/span>\n<\/div>\n<button aria-pressed=\"false\" class=\"adv-toggle\" id=\"advToggle\" type=\"button\">Pokaż treści akademickie (ukryte)<\/button><p class=\"mini-note\">Treści ponad poziom matury rozszerzonej (biol-chem) są zwinięte w ramkach „poziom akademicki” — nic nie zostało usunięte. Przycisk rozwija lub zwija wszystkie naraz.<\/p>\n<\/section>\n<section class=\"minimum-card\" id=\"minimum\">\n<h3>Muszę umieć na E8 — 10 faktów<\/h3>\n<ol>\n<li><strong>Definicja kwasu (szkolna, Arrheniusa):<\/strong> związek, który w wodzie dysocjuje na kationy wodoru H⁺ (dokładniej H₃O⁺) i aniony reszty kwasowej. Rozszerzona (Brønsteda): donor protonu H⁺.<\/li>\n<li><strong>Wzór ogólny:<\/strong> HₙR, gdzie R = reszta kwasowa, n = wartościowość reszty.<\/li>\n<li><strong>Podział:<\/strong> beztlenowe (HCl, HBr, HI, HF, H₂S, HCN) vs tlenowe (HNO₃, H₂SO₄, H₂CO₃, H₃PO₄, HClO₄) — oraz mocne (HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄) vs słabe (HF, H₂S, H₂CO₃, H₂SO₃, HNO₂, H₃PO₄, CH₃COOH).<\/li>\n<li><strong>Dysocjacja:<\/strong> HCl → H⁺ + Cl⁻; H₂SO₄ → 2H⁺ + SO₄²⁻; H₃PO₄ → 3H⁺ + PO₄³⁻. Dokładniej: H⁺ jest w wodzie jako jon hydroniowy H₃O⁺.<\/li>\n<li><strong>pH:<\/strong> poniżej 7 kwasowy, 7 obojętny, powyżej 7 zasadowy. pH = −log₁₀[H₃O⁺].<\/li>\n<li><strong>Wskaźniki:<\/strong> fenoloftaleina (bezbarwna w kwasie, malinowa w zasadzie); oranż metylowy (czerwony w kwasie, żółty w zasadzie); papierek uniwersalny (czerwony w kwasie, niebieski w zasadzie).<\/li>\n<li><strong>Reakcje kwasów:<\/strong> + metal → sól + H₂ (tylko metale aktywniejsze od wodoru); + tlenek metalu → sól + H₂O; + wodorotlenek → sól + H₂O (zobojętnianie); + sól (węglan) → sól + H₂O + CO₂.<\/li>\n<li><strong>BHP:<\/strong> kwas do wody, nigdy odwrotnie (reakcja egzotermiczna). Okulary, rękawice, nie pipetować ustami, nie wąchać bezpośrednio.<\/li>\n<li><strong>Właściwości:<\/strong> stężony HCl „dymi” i ma ostry zapach; stężony H₂SO₄ jest oleisty, higroskopijny i <em>zwęgla<\/em> cukier, papier, drewno; HNO₃ żółknie na świetle, a z białkiem daje <em>żółte<\/em> zabarwienie (reakcja ksantoproteinowa).<\/li>\n<li><strong>Roztwory kwasów przewodzą prąd<\/strong> — są elektrolitami, bo zawierają jony (H₃O⁺ i aniony reszty). Stężenie procentowe: C<sub>p<\/sub> = m<sub>s<\/sub>/m<sub>r<\/sub> · 100%.<\/li>\n<\/ol>\n<\/section><details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#jak-pracowac\">0.1. Jak pracować z lekcją<\/a><a class=\"toc-link\" href=\"#cele\">0.2. Cele lekcji i pytanie przewodnie<\/a><a class=\"toc-link\" href=\"#kompas\">0.3. Kompas — co trzeba wiedzieć wcześniej<\/a><a class=\"toc-link\" href=\"#definicja\">1. Definicja kwasu<\/a><a class=\"toc-link\" href=\"#nazewnictwo\">2. Nazewnictwo i podział kwasów<\/a><a class=\"toc-link\" href=\"#reszty\">3. Reszty kwasowe<\/a><a class=\"toc-link\" href=\"#wlasciwosci\">4. Właściwości kwasów<\/a><a class=\"toc-link\" href=\"#dysocjacja\">5. Dysocjacja jonowa kwasów<\/a><a class=\"toc-link\" href=\"#moc\">6. Moc kwasów<\/a><a class=\"toc-link\" href=\"#ph\">7. pH i wskaźniki kwasowo-zasadowe<\/a><a class=\"toc-link\" href=\"#otrzymywanie\">8. Otrzymywanie kwasów<\/a><a class=\"toc-link\" href=\"#reakcje\">9. Reakcje kwasów<\/a><a class=\"toc-link\" href=\"#deszcze\">10. Kwaśne deszcze<\/a><a class=\"toc-link\" href=\"#zastosowania\">11. Zastosowania kwasów<\/a><a class=\"toc-link\" href=\"#bhp\">12. Bezpieczeństwo (BHP)<\/a><a class=\"toc-link\" href=\"#organiczne\">13. Kwasy organiczne (karboksylowe)<\/a><a class=\"toc-link\" href=\"#miareczkowanie\">14. Miareczkowanie (titracja)<\/a><a class=\"toc-link\" href=\"#bufory\">15. Bufory — model jakościowy<\/a><a class=\"toc-link\" href=\"#doswiadczenia\">16. Doświadczenia<\/a><a class=\"toc-link\" href=\"#klinika\">17. Klinika błędów<\/a><a class=\"toc-link\" href=\"#cwiczenia\">18. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#test\">19. Test końcowy<\/a><a class=\"toc-link\" href=\"#powtorka\">20. Karta szybkiego powtórzenia i mapa myśli<\/a><a class=\"toc-link\" href=\"#fiszki\">21. Fiszki<\/a><a class=\"toc-link\" href=\"#slownik\">22. Słownik<\/a><a class=\"toc-link\" href=\"#checklista\">23. Checklista<\/a><a class=\"toc-link\" href=\"#historia\">A. Dodatek A — historia pojęcia kwasu i teorie kwasów i zasad<\/a><a class=\"toc-link\" href=\"#mosty\">B. Dodatek B — mosty do innych lekcji<\/a><a class=\"toc-link\" href=\"#modele\">↻. Modele silnika w tej lekcji<\/a><a class=\"toc-link\" href=\"#audit\">✓. Audyt jakości<\/a><\/nav><\/details>\n\n<div class=\"layer-legend\">\n<div class=\"layer-row\"><span class=\"dot e8\"><\/span><span><b>E8:<\/b> definicja, nazwy i wzory, reszty kwasowe, właściwości, dysocjacja, moc, pH i wskaźniki, otrzymywanie, reakcje, kwaśne deszcze, zastosowania, BHP<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot understand\"><\/span><span><b>Rozumienie:<\/b> Brønsted, H₃O⁺, dysocjacja stopniowa, jonizacja a dysocjacja, paradoks HF, rozcieńczanie a α i pH<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot extra\"><\/span><span><b>Ambitne (LO):<\/b> K<sub>a<\/sub>/pK<sub>a<\/sub>, stężenie molowe, pOH i K<sub>w<\/sub>, kwasy utleniające, kwasy organiczne, miareczkowanie, bufory, kwasy w organizmie<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot contest\"><\/span><span><b>Ponad LO:<\/b> rozwijane bloki „poziom akademicki” — przycisk w nagłówku lekcji<\/span><\/div>\n<\/div>\n<div class=\"core-path\" id=\"rdzen\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to (ok. 30 min)<\/div>\n<ol>\n<li><strong><a href=\"#definicja\">§1<\/a>–<a href=\"#reszty\">§3<\/a><\/strong> — definicja, nazwy i wzory kwasów, reszty kwasowe i ich ładunek.<\/li>\n<li><strong><a href=\"#dysocjacja\">§5<\/a><\/strong> — równania dysocjacji, przewodzenie prądu; <strong><a href=\"#moc\">§6<\/a><\/strong> (6.1–6.2) — kwasy mocne i słabe.<\/li>\n<li><strong><a href=\"#ph\">§7<\/a><\/strong> (7.1, 7.3) — skala pH i wskaźniki.<\/li>\n<li><strong><a href=\"#otrzymywanie\">§8<\/a>–<a href=\"#reakcje\">§9<\/a><\/strong> — trzy drogi otrzymywania i cztery typy reakcji; model „przewidź i sprawdź” (9.5).<\/li>\n<li><strong><a href=\"#deszcze\">§10<\/a>, <a href=\"#bhp\">§12<\/a><\/strong> — kwaśne deszcze i bezpieczeństwo.<\/li>\n<li><strong><a href=\"#klinika\">§17<\/a>, <a href=\"#cwiczenia\">§18<\/a> (A–B), <a href=\"#fiszki\">§21<\/a>, <a href=\"#test\">§19<\/a><\/strong>.<\/li>\n<\/ol>\n<p class=\"mini-note\">Modele silnika stoją przy sekcjach, których dotyczą; doświadczenia — w <a href=\"#doswiadczenia\">§16<\/a> (przycisk „Zobacz w zlewce” otwiera pracownię na danym doświadczeniu). Spis modeli: <a href=\"#modele\">§↻<\/a>.<\/p>\n<\/div>\n<section id=\"jak-pracowac\">\n<div class=\"part-heading\"><span class=\"part-num\">0.1<\/span> Jak pracować z lekcją<\/div>\n<div class=\"card card-understand\">\n<ol>\n<li><strong>Nie czytaj biernie.<\/strong> Po każdym akapicie: „Co ja z tego zapamiętam?”.<\/li>\n<li><strong>Najpierw próbuj, potem patrz na odpowiedź.<\/strong><\/li>\n<li><strong>Powtarzaj w odstępach:<\/strong> dziś → jutro → za 3 dni → za tydzień.<\/li>\n<li><strong>Mów na głos.<\/strong> Czytaj wzory: „H-dwa-S-O-cztery”.<\/li>\n<li><strong>Rysuj.<\/strong> Dysocjacja, strzałki, wskaźniki.<\/li>\n<li><strong>Łap moment „aha!”.<\/strong><\/li>\n<\/ol>\n\n<\/div>\n<\/section>\n<section id=\"cele\">\n<div class=\"part-heading\"><span class=\"part-num\">0.2<\/span> Cele lekcji i pytanie przewodnie <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Po tej lekcji potrafisz<\/span>\n<ul>\n<li>zdefiniować kwas (Arrhenius; ambitnie — Brønsted) i zapisać wzór ogólny HₙR (<a href=\"#definicja\">§1<\/a>),<\/li>\n<li>nazwać kwasy beztlenowe i tlenowe, odczytać resztę kwasową i jej ładunek (<a href=\"#nazewnictwo\">§2<\/a>, <a href=\"#reszty\">§3<\/a>),<\/li>\n<li>opisać właściwości HCl, H₂SO₄, HNO₃, H₃PO₄, H₂CO₃ i H₂S (<a href=\"#wlasciwosci\">§4<\/a>),<\/li>\n<li>zapisać dysocjację kwasów i wyjaśnić, dlaczego ich roztwory przewodzą prąd (<a href=\"#dysocjacja\">§5<\/a>),<\/li>\n<li>odróżnić moc kwasu od stężenia roztworu, posługiwać się skalą pH i wskaźnikami (<a href=\"#moc\">§6<\/a>, <a href=\"#ph\">§7<\/a>),<\/li>\n<li>zapisać trzy metody otrzymywania kwasów i cztery typy ich reakcji (<a href=\"#otrzymywanie\">§8<\/a>, <a href=\"#reakcje\">§9<\/a>),<\/li>\n<li>wyjaśnić powstawanie kwaśnych deszczy i stosować zasady BHP (<a href=\"#deszcze\">§10<\/a>, <a href=\"#bhp\">§12<\/a>).<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Pytanie przewodnie<\/span>\n<p>Mamy dwa roztwory o tym samym stężeniu 0,1 mol/dm³: kwas solny HCl i kwas octowy CH₃COOH. W obu fenoloftaleina pozostaje bezbarwna i oba są „kwaśne”. Dlaczego w kwasie solnym żarówka testera świeci jasno, magnez rozpuszcza się szybko, a pH wynosi ok. 1 — w occie zaś żarówka ledwo świeci, magnez reaguje wolno, a pH wynosi ok. 2,9?<\/p>\n<p class=\"mini-note\">Odpowiedź budujesz w <a href=\"#dysocjacja\">§5<\/a> (jony w roztworze), <a href=\"#moc\">§6<\/a> (stopień dysocjacji α) i <a href=\"#ph\">§7<\/a> (skala pH); sprawdzasz ją w doświadczeniu 10 (<a href=\"#doswiadczenia\">§16<\/a>).<\/p>\n<\/div>\n<\/section>\n<section id=\"kompas\">\n<div class=\"part-heading\"><span class=\"part-num\">0.3<\/span> Kompas — co trzeba wiedzieć wcześniej<\/div>\n<div class=\"card card-understand\">\n<ul>\n<li>wartościowość (H–I, O–II, Cl–I, S–II/IV/VI, N–III/V, P–III/V, C–IV),<\/li>\n<li><strong>W–K–S–K<\/strong> (wartościowość → krzyżuj → skróć → kontrola),<\/li>\n<li>grupy atomów: NO₃⁻, SO₄²⁻, CO₃²⁻, PO₄³⁻, Cl⁻, Br⁻, I⁻, S²⁻, F⁻,<\/li>\n<li>tlenki kwasowe (SO₂, SO₃, CO₂, P₂O₅, N₂O₅) — reagują z wodą → kwasy (N01),<\/li>\n<li>zobojętnianie kwasu z wodorotlenkiem → sól + woda (N02),<\/li>\n<li>wskaźniki kwasowo-zasadowe (fenoloftaleina, oranż metylowy, papierek uniwersalny).<\/li>\n<\/ul>\n<p class=\"mini-note\">Wartościowość, W–K–S–K i bilans — fundamenty F01–F09; tlenki kwasowe — N01 Tlenki; wodorotlenki i zobojętnianie — N02 Wodorotlenki; wskaźniki — szczegóły w <a href=\"#ph\">§7<\/a>.<\/p>\n<\/div>\n<\/section>\n<section id=\"definicja\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Definicja kwasu <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3>1.1 Definicja szkolna (Arrheniusa)<\/h3>\n<div class=\"card card-core\">\n<span class=\"card-label\">Kwas — definicja Arrheniusa<\/span>\n<p><strong>Kwas<\/strong> to związek chemiczny, który w wodzie dysocjuje na <strong>kationy wodoru H⁺<\/strong> (dokładniej — jony hydroniowe H₃O⁺) i <strong>aniony reszty kwasowej<\/strong>.<\/p>\n<div class=\"formula-lg\">HₙR → n H⁺ + Rⁿ⁻<\/div>\n<p class=\"mini-note\">Wzór ogólny: HₙR. Przykłady: HCl, HNO₃, H₂SO₄, H₃PO₄, CH₃COOH.<\/p>\n<\/div>\n<h3>1.2 Definicja rozszerzona (Brønsteda) <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h3>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Kwas — definicja Brønsteda<\/span>\n<p><strong>Kwas<\/strong> to <strong>donor protonu H⁺<\/strong> — substancja, która oddaje proton innemu związkowi.<\/p>\n<p><strong>Zasada<\/strong> to <strong>akceptor protonu H⁺<\/strong> — substancja, która przyjmuje proton.<\/p>\n<div class=\"formula-lg\">HA + H₂O ⇌ H₃O⁺ + A⁻<\/div>\n<p>W tym ujęciu <strong>każdy kwas Arrheniusa jest też kwasem Brønsteda<\/strong>, ale nie odwrotnie. Kwasem Brønsteda może być także <strong>jon<\/strong> (np. NH₄⁺, HSO₄⁻, H₃O⁺, H₂PO₄⁻) albo cząsteczka, która oddaje proton innej substancji poza wodą (np. HCl wobec NH₃: HCl + NH₃ → NH₄Cl). Każdy kwas Brønsteda <strong>musi mieć atom wodoru<\/strong>, który może odłączyć jako proton. Substancje kwasowe <em>bez wodoru<\/em> (np. BF₃, AlCl₃, CO₂ wobec OH⁻) opisuje dopiero teoria <strong>Lewisa<\/strong> (<a href=\"#historia\">§A<\/a>).<\/p>\n\n<\/div>\n<\/section>\n<section id=\"nazewnictwo\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Nazewnictwo i podział kwasów <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"mnemonic\"><b>Mnemonik: jak nazwać kwas<\/b><ol><li><strong>Bez tlenu<\/strong> → kwas + pierwiastek + <strong>„-owodorowy”<\/strong> (HCl – chlorowodorowy).<\/li><li><strong>Z tlenem<\/strong> → policz wartościowość: <strong>W = 2·O − H<\/strong>.<\/li><li>H₂SO₄: 2·4 − 2 = 6 → siarkowy(VI) · HNO₂: 2·2 − 1 = 3 → azotowy(III) · HClO₄: 2·4 − 1 = 7 → chlorowy(VII).<\/li><li>Wyjątek: H₂CO₃ – kwas węglowy (bez cyfry). HCl(aq) = kwas solny, HCl(g) = chlorowodór.<\/li><\/ol><\/div>\n<h3>2.1 Kwasy beztlenowe<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Reguła: kwas + nazwa pierwiastka + „-owodorowy”<\/span>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Wzór<\/th><th>Nazwa<\/th><th>Uwaga<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>HF<\/td><td>kwas fluorowodorowy<\/td><td>słaby, żrący<\/td><\/tr>\n<tr><td>HCl<\/td><td>kwas chlorowodorowy (solny)<\/td><td>mocny, żrący<\/td><\/tr>\n<tr><td>HBr<\/td><td>kwas bromowodorowy<\/td><td>mocny<\/td><\/tr>\n<tr><td>HI<\/td><td>kwas jodowodorowy<\/td><td>mocny<\/td><\/tr>\n<tr><td>H₂S<\/td><td>kwas siarkowodorowy<\/td><td>słaby, toksyczny gaz<\/td><\/tr>\n<tr><td>HCN<\/td><td>kwas cyjanowodorowy<\/td><td>silnie toksyczny<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<h3>2.2 Kwasy tlenowe<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Reguła: kwas + nazwa pierwiastka + (wartościowość rzymska)<\/span>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Wzór<\/th><th>Nazwa<\/th><th>Reszta kwasowa<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>HNO₂<\/td><td>kwas azotowy(III)<\/td><td>NO₂⁻<\/td><\/tr>\n<tr><td>HNO₃<\/td><td>kwas azotowy(V)<\/td><td>NO₃⁻<\/td><\/tr>\n<tr><td>H₂SO₃<\/td><td>kwas siarkowy(IV)<\/td><td>SO₃²⁻<\/td><\/tr>\n<tr><td>H₂SO₄<\/td><td>kwas siarkowy(VI)<\/td><td>SO₄²⁻<\/td><\/tr>\n<tr><td>H₂CO₃<\/td><td>kwas węglowy<\/td><td>CO₃²⁻<\/td><\/tr>\n<tr><td>H₃PO₃<\/td><td>kwas fosforowy(III)<\/td><td>PO₃³⁻ <small>(szkolny zapis formalny; w rzeczywistości HPO₃²⁻ — zob. <a href=\"#nazewnictwo\">§2<\/a>.3)<\/small><\/td><\/tr>\n<tr><td>H₃PO₄<\/td><td>kwas fosforowy(V)<\/td><td>PO₄³⁻<\/td><\/tr>\n<tr><td>HClO<\/td><td>kwas chlorowy(I)<\/td><td>ClO⁻<\/td><\/tr>\n<tr><td>HClO₂<\/td><td>kwas chlorowy(III)<\/td><td>ClO₂⁻<\/td><\/tr>\n<tr><td>HClO₃<\/td><td>kwas chlorowy(V)<\/td><td>ClO₃⁻<\/td><\/tr>\n<tr><td>HClO₄<\/td><td>kwas chlorowy(VII)<\/td><td>ClO₄⁻<\/td><\/tr>\n<tr><td>H₂SiO₃<\/td><td>kwas krzemowy<\/td><td>SiO₃²⁻<\/td><\/tr>\n<tr><td>HMnO₄<\/td><td>kwas manganowy(VII)<\/td><td>MnO₄⁻<\/td><\/tr>\n<tr><td>H₂CrO₄<\/td><td>kwas chromowy(VI)<\/td><td>CrO₄²⁻<\/td><\/tr>\n<tr><td>H₂Cr₂O₇<\/td><td>kwas dichromowy(VI)<\/td><td>Cr₂O₇²⁻<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\"><strong>H₂CO₃<\/strong> — jedyny tlenowy bez cyfry rzymskiej w nazwie szkolnej.<\/p>\n<\/div>\n<h3>2.3 Podział ze względu na liczbę atomów wodoru<\/h3>\n<div class=\"card card-understand\">\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Typ<\/th><th>Definicja<\/th><th>Przykłady<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Jednoprotonowy<\/td><td>1 atom H<\/td><td>HCl, HBr, HI, HF, HNO₃, HNO₂, HClO, HClO₄, CH₃COOH<\/td><\/tr>\n<tr><td>Dwuprotonowy<\/td><td>2 atomy H<\/td><td>H₂SO₄, H₂SO₃, H₂CO₃, H₂S, H₂SiO₃<\/td><\/tr>\n<tr><td>Trójprotonowy<\/td><td>3 atomy H<\/td><td>H₃PO₄ (H₃PO₃ — tylko formalnie, zob. uwagę)<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\"><strong>Uwaga:<\/strong> nie każdy atom H w kwasie jest protonem kwasowym. W CH₃COOH tylko H z grupy –COOH jest protonem kwasowym — pozostałe 3 atomy H są związane z węglem i nie dysocjują. Dlatego CH₃COOH jest kwasem jednoprotonowym, mimo że ma 4 atomy H.<\/p>\n<p class=\"mini-note\"><strong>Uwaga 2:<\/strong> H₃PO₃ ma 3 atomy H, ale jeden jest związany bezpośrednio z fosforem, więc kwas jest w praktyce <strong>dwuprotonowy<\/strong> (sole: Na₂HPO₃). W tabelach szkolnych zapisuje się go formalnie jako trójprotonowy — na E8 wystarczy wzór i nazwa.<\/p>\n<details class=\"adv\"><summary>Budowa kwasów tlenowych i „ile protonów naprawdę jest kwasowych” <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>Kwasowe są tylko atomy H związane z <strong>tlenem<\/strong> (grupy –O–H). W H₃PO₃ struktura to HP(O)(OH)₂ (kwas fosfonowy), a w H₃PO₂ — H₂P(O)OH (kwas fosfinowy, jednoprotonowy). Moc kwasów tlenowych rośnie z liczbą „wolnych” atomów O przy atomie centralnym (reguła Paulinga: HClO pKa ≈ 7,5; HClO₂ ≈ 2; HClO₃ ≈ −1; HClO₄ ≈ −10) — każdy dodatkowy atom O stabilizuje ładunek anionu (rezonans).<\/p><\/div><\/details>\n<\/div>\n<\/section>\n<section id=\"reszty\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Reszty kwasowe <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Definicja<\/span>\n<p><strong>Reszta kwasowa<\/strong> to anion powstający po formalnym odjęciu protonów H⁺ z cząsteczki kwasu. Ładunek reszty = −n, gdzie n = liczba atomów wodoru w kwasie.<\/p>\n<\/div>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Kwas<\/th><th>Reszta kwasowa<\/th><th>Ładunek<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>HCl<\/td><td>Cl⁻<\/td><td>−1<\/td><\/tr>\n<tr><td>HBr<\/td><td>Br⁻<\/td><td>−1<\/td><\/tr>\n<tr><td>HI<\/td><td>I⁻<\/td><td>−1<\/td><\/tr>\n<tr><td>HF<\/td><td>F⁻<\/td><td>−1<\/td><\/tr>\n<tr><td>H₂S<\/td><td>S²⁻<\/td><td>−2<\/td><\/tr>\n<tr><td>HCN<\/td><td>CN⁻<\/td><td>−1<\/td><\/tr>\n<tr><td>HNO₃<\/td><td>NO₃⁻<\/td><td>−1<\/td><\/tr>\n<tr><td>HNO₂<\/td><td>NO₂⁻<\/td><td>−1<\/td><\/tr>\n<tr><td>H₂SO₄<\/td><td>SO₄²⁻<\/td><td>−2<\/td><\/tr>\n<tr><td>H₂SO₃<\/td><td>SO₃²⁻<\/td><td>−2<\/td><\/tr>\n<tr><td>H₂CO₃<\/td><td>CO₃²⁻<\/td><td>−2<\/td><\/tr>\n<tr><td>H₃PO₄<\/td><td>PO₄³⁻<\/td><td>−3<\/td><\/tr>\n<tr><td>H₂SiO₃<\/td><td>SiO₃²⁻<\/td><td>−2<\/td><\/tr>\n<tr><td>HClO<\/td><td>ClO⁻<\/td><td>−1<\/td><\/tr>\n<tr><td>HClO₄<\/td><td>ClO₄⁻<\/td><td>−1<\/td><\/tr>\n<tr><td>CH₃COOH<\/td><td>CH₃COO⁻<\/td><td>−1<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"rule-box\">\n<b>Kontrola ładunku:<\/b> liczba atomów H w cząsteczce kwasu musi odpowiadać ładunkowi reszty. HCl (1 H) → Cl⁻ (−1). H₂SO₄ (2 H) → SO₄²⁻ (−2). H₃PO₄ (3 H) → PO₄³⁻ (−3).\n<\/div>\n<h3>3.1 Nazywanie soli z reszt kwasowych<\/h3>\n<p class=\"mini-note\">Wzór i nazwę każdej soli podaje też tabela rozpuszczalności — przycisk modelu w <a href=\"#reakcje\">§9<\/a>.4.<\/p>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Przykłady<\/span>\n<ul>\n<li>NaCl → chlorek sodu (od HCl)<\/li>\n<li>NaNO₃ → azotan(V) sodu (od HNO₃)<\/li>\n<li>Na₂SO₄ → siarczan(VI) sodu (od H₂SO₄)<\/li>\n<li>Na₂CO₃ → węglan sodu (od H₂CO₃)<\/li>\n<li>Na₃PO₄ → fosforan(V) sodu (od H₃PO₄)<\/li>\n<\/ul>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-reszty-v01\"><button data-che-open-viz=\"kw-reszty-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-reszty-v01',lessonId:'N03'},'*')\" type=\"button\"><b>Kwas → reszta kwasowa → sole (13 metali)<\/b><span>Dysocjacja, ładunek reszty, wzory i nazwy soli, rozpuszczalność · CHE.IONIC<\/span><\/button><\/div>\n<\/section>\n<section id=\"wlasciwosci\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Właściwości kwasów <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3>4.1 Właściwości wybranych kwasów<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">E8 — właściwości fizyczne i charakterystyczne reakcje<\/span>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Kwas<\/th><th>Wygląd, zapach<\/th><th>Stężony (handlowy)<\/th><th>Cechy szczególne<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>HCl(aq) — solny<\/td><td>bezbarwna ciecz (techniczny — żółtawy od Fe³⁺), ostry, duszący zapach<\/td><td>36–38%, d ≈ 1,18 g/cm³<\/td><td><strong>„dymi”<\/strong> na powietrzu: ulatniający się HCl tworzy z parą wodną białą mgiełkę — drobne kropelki kwaśnego roztworu, nie „biały gaz”; lotny<\/td><\/tr>\n<tr><td>H₂SO₄ — siarkowy(VI)<\/td><td>bezbarwna, <strong>oleista<\/strong>, bezwonna ciecz<\/td><td>96–98%, d ≈ 1,84 g/cm³, wrze ok. 337 °C<\/td><td><strong>higroskopijny<\/strong> (pochłania wodę — osuszacz), <strong>odwadnia i zwęgla<\/strong> cukier, papier, drewno, tkanki; rozcieńczanie silnie egzotermiczne; prawie nielotny<\/td><\/tr>\n<tr><td>HNO₃ — azotowy(V)<\/td><td>bezbarwna ciecz, ostry zapach<\/td><td>65–68%, d ≈ 1,40 g/cm³<\/td><td>na świetle <strong>żółknie<\/strong>: 4 HNO₃ → 4 NO₂ + O₂ + 2 H₂O (przechowujemy w ciemnych butelkach); z białkiem — <strong>żółte zabarwienie<\/strong> (reakcja ksantoproteinowa); silny utleniacz<\/td><\/tr>\n<tr><td>H₃PO₄ — fosforowy(V)<\/td><td>bezbarwna, syropowata ciecz (czysty — kryształy, topi się ok. 42 °C), bezwonna<\/td><td>ok. 85%<\/td><td>nie utlenia, mało lotny; w małych ilościach dodatek do żywności (E338)<\/td><\/tr>\n<tr><td>H₂CO₃ — węglowy<\/td><td>istnieje tylko w roztworze (woda gazowana)<\/td><td>—<\/td><td><strong>nietrwały<\/strong>: H₂CO₃ ⇌ H₂O + CO₂ (dlatego „gazowanie” uchodzi po otwarciu butelki)<\/td><\/tr>\n<tr><td>H₂S(aq) — siarkowodorowy<\/td><td>bezbarwny roztwór, zapach zgniłych jaj<\/td><td>—<\/td><td>H₂S jest silnie <strong>trujący<\/strong>; wody siarczkowe; czernieje papierek z octanem ołowiu(II)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"mini-note\">Wspólne dla wszystkich roztworów kwasów: kwaśny smak (NIE sprawdzamy w laboratorium!), zmiana barwy wskaźników, przewodzenie prądu, reakcje z metalami aktywnymi, tlenkami metali, wodorotlenkami i węglanami.<\/p>\n<\/div>\n<h3>4.2 Dlaczego stężony H₂SO₄ zwęgla cukier? <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h3>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Odwadnianie<\/span>\n<p>H₂SO₄ ma ogromne powinowactwo do wody — odbiera z cząsteczek cukru atomy H i O w stosunku 2:1 (jak w wodzie). Zostaje czarny węgiel:<\/p>\n<div class=\"formula-lg\" data-rx=\"sugarH2so4\">C₁₂H₂₂O₁₁ →(stęż. H₂SO₄) 12 C + 11 H₂O<\/div>\n<p class=\"mini-note\">Wydziela się dużo ciepła — woda paruje, porowata masa węgla „rośnie”; część węgla utlenia się do CO₂ i SO₂ (ostry zapach). To <strong>pokaz nauczyciela<\/strong> pod dygestorium (doświadczenie 8 w <a href=\"#doswiadczenia\">§16<\/a>).<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-wlasciwosci-v01\"><button data-che-open-viz=\"kw-wlasciwosci-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-wlasciwosci-v01',lessonId:'N03'},'*')\" type=\"button\"><b>Właściwości stężonych kwasów — pokazy<\/b><span>Cukier + H₂SO₄ · białko + HNO₃ · HCl dymi · silnik GFX, otwiera się w oknie<\/span><\/button><\/div>\n<\/section>\n<section id=\"dysocjacja\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Dysocjacja jonowa kwasów <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3>5.1 Definicja<\/h3>\n<div class=\"card card-core\">\n<span class=\"card-label\">Dysocjacja elektrolityczna<\/span>\n<p><strong>Dysocjacja<\/strong> to rozpad związku chemicznego na jony w wodzie (w roztworze wodnym).<\/p>\n<p>Kwasy dysocjują na kation wodoru H⁺ i anion reszty kwasowej (definicja — <a href=\"#definicja\">§1<\/a>); w wodzie H⁺ występuje jako jon hydroniowy H₃O⁺ (<a href=\"#dysocjacja\">§5<\/a>.4).<\/p>\n<\/div>\n<h3>5.2 Równania dysocjacji<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\">HCl → H⁺ + Cl⁻<\/div>\n<div class=\"formula-lg\">HNO₃ → H⁺ + NO₃⁻<\/div>\n<div class=\"formula-lg\">H₂SO₄ → 2 H⁺ + SO₄²⁻<\/div>\n<div class=\"formula-lg\">H₃PO₄ → 3 H⁺ + PO₄³⁻<\/div>\n<div class=\"formula-lg\">CH₃COOH ⇌ H⁺ + CH₃COO⁻ (dysocjacja częściowa — kwas słaby)<\/div>\n<\/div>\n<h3>5.3 Trzy poziomy zapisu dysocjacji <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h3><div class=\"card card-understand\"><div class=\"table-wrap\"><table><thead><tr><th>Kwas<\/th><th>Szkolnie<\/th><th>Dokładniej (z wodą)<\/th><th>α<\/th><\/tr><\/thead><tbody><tr><td>HCl (mocny)<\/td><td>HCl → H⁺ + Cl⁻<\/td><td>HCl + H₂O → H₃O⁺ + Cl⁻<\/td><td>≈ 1<\/td><\/tr><tr><td>H₂SO₄ (mocny w I st.)<\/td><td>H₂SO₄ → 2 H⁺ + SO₄²⁻<\/td><td>H₂SO₄ + 2 H₂O → 2 H₃O⁺ + SO₄²⁻ (stopniowo: I →, II ⇌)<\/td><td>α₁ ≈ 1, α₂ &lt; 1<\/td><\/tr><tr><td>CH₃COOH (słaby)<\/td><td>CH₃COOH ⇌ H⁺ + CH₃COO⁻<\/td><td>CH₃COOH + H₂O ⇌ H₃O⁺ + CH₃COO⁻<\/td><td>≈ 0,013 (dla c = 0,1 mol/dm³)<\/td><\/tr><\/tbody><\/table><\/div><p class=\"mini-note\">→ = dysocjacja praktycznie całkowita (mocny), ⇌ = równowaga (słaby).<\/p><\/div>\n<h3>5.4 Jon hydroniowy H₃O⁺ — dokładniejszy model <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h3>\n<div class=\"card card-understand\">\n<p>W wodzie kation H⁺ (proton) nie istnieje samodzielnie — natychmiast łączy się z cząsteczką wody, tworząc <strong>jon hydroniowy H₃O⁺<\/strong>:<\/p>\n<div class=\"formula-lg\">H⁺ + H₂O → H₃O⁺<\/div>\n<p>W szkole często piszemy w skrócie H⁺, ale <strong>poprawnie w wodzie mamy H₃O⁺<\/strong>. W zadaniach o pH chodzi o stężenie H₃O⁺, nie „wolnego H⁺”.<\/p>\n<\/div>\n<h3>5.5 Dysocjacja stopniowa kwasów wieloprotonowych <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h3>\n<div class=\"card card-extra\">\n<span class=\"card-label\">H₂SO₄ — dwa etapy<\/span>\n<div class=\"formula-lg\">H₂SO₄ → H⁺ + HSO₄⁻ (I stopień — praktycznie całkowity)<\/div>\n<div class=\"formula-lg\">HSO₄⁻ ⇌ H⁺ + SO₄²⁻ (II stopień — częściowy)<\/div>\n<p>Dlatego mówimy, że <strong>H₂SO₄ jest mocnym kwasem tylko w I stopniu<\/strong>. W II stopniu jest słaby (HSO₄⁻ jest słabym kwasem).<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">H₃PO₄ — trzy etapy<\/span>\n<div class=\"formula-lg\">H₃PO₄ ⇌ H⁺ + H₂PO₄⁻<\/div>\n<div class=\"formula-lg\">H₂PO₄⁻ ⇌ H⁺ + HPO₄²⁻<\/div>\n<div class=\"formula-lg\">HPO₄²⁻ ⇌ H⁺ + PO₄³⁻<\/div>\n<p>Wszystkie etapy są słabe — H₃PO₄ jest słabym kwasem trójprotonowym.<\/p>\n<\/div>\n<h3>5.6 Jonizacja a dysocjacja — różnica <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h3>\n<div class=\"card card-warning\">\n<p><strong>Jonizacja<\/strong> — powstawanie jonów w wyniku reakcji cząsteczki z rozpuszczalnikiem (np. HCl + H₂O → H₃O⁺ + Cl⁻). Cząsteczka HCl była kowalencyjna, po reakcji z wodą powstają jony.<\/p>\n<p><strong>Dysocjacja<\/strong> — rozpad istniejącej substancji jonowej na jony (np. NaCl → Na⁺ + Cl⁻). Substancja była już jonowa (kryształ jonowy), w wodzie rozpada się na jony.<\/p>\n<p>W szkole często używa się obu terminów zamiennie, ale dokładnie to różne procesy.<\/p>\n<\/div>\n<div class=\"card card-understand\"><span class=\"card-label\">Jonizacja a dysocjacja – efekt w roztworze<\/span><div class=\"table-wrap\"><table><thead><tr><th><\/th><th>HCl (jonizacja)<\/th><th>NaCl (dysocjacja)<\/th><\/tr><\/thead><tbody><tr><td>Zapis<\/td><td>HCl + H₂O → H₃O⁺ + Cl⁻<\/td><td>NaCl(s) → Na⁺ + Cl⁻<\/td><\/tr><tr><td>Skąd jony<\/td><td>powstają: proton przechodzi na wodę<\/td><td>istniały już w krysztale<\/td><\/tr><tr><td>Roztwór<\/td><td>H₃O⁺ + Cl⁻, pH &lt; 7<\/td><td>Na⁺ + Cl⁻, pH ≈ 7<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-dysocjacja-v01\"><button data-che-open-viz=\"kw-dysocjacja-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-dysocjacja-v01',lessonId:'N03'},'*')\" type=\"button\"><b>Dysocjacja kwasów mocnych i słabych na żywo: H⁺ przeskakuje na wodę (tryb „krok po kroku”), cząsteczki, α, pH<\/b><span>HCl, HNO₃, H₂SO₄, HF, CH₃COOH, H₃PO₄ · α i pH z Ka silnika · porównanie α(c) wszystkich kwasów<\/span><\/button><\/div>\n\n<h3>5.7 Przewodzenie prądu — dowód na jony <span class=\"level-badge level-basic\">E8<\/span><\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">E8 — elektrolity<\/span>\n<p>Prąd w roztworze przenoszą <strong>jony<\/strong>. Tester (dwie elektrody + żarówka/dioda) pokazuje, czy w roztworze są jony i jak dużo.<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Badana substancja<\/th><th>Żarówka<\/th><th>Wniosek<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>HCl(aq), 0,1 mol/dm³<\/td><td>świeci jasno<\/td><td>mocny elektrolit — prawie wszystkie cząsteczki dały jony<\/td><\/tr>\n<tr><td>CH₃COOH(aq), 0,1 mol/dm³<\/td><td>świeci słabo<\/td><td>słaby elektrolit — zjonizowało się ok. 1% cząsteczek<\/td><\/tr>\n<tr><td>woda destylowana<\/td><td>nie świeci<\/td><td>bardzo mało jonów (autodysocjacja wody)<\/td><\/tr>\n<tr><td>roztwór cukru<\/td><td>nie świeci<\/td><td>nieelektrolit — cząsteczki nie rozpadają się na jony<\/td><\/tr>\n<tr><td>HCl(g), bezwodny kwas octowy<\/td><td>nie świeci / bardzo słabo<\/td><td>bez wody nie ma jonizacji — jonów brak<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"mini-note\">To samo stężenie, różne świecenie → różna <strong>moc<\/strong> kwasu (<a href=\"#moc\">§6<\/a>). Elektroda ujemna (katoda) przyciąga kationy H₃O⁺, dodatnia (anoda) — aniony reszty kwasowej.<\/p>\n<p class=\"mini-note\"> Przy prądzie stałym na elektrodach zachodzi <strong>elektroliza<\/strong> — po chwili widać drobne pęcherzyki gazu: na <strong>katodzie (−)<\/strong> zawsze <strong>wodór<\/strong> (2 H⁺ + 2 e⁻ → H₂), na <strong>anodzie (+)<\/strong> — <strong>chlor<\/strong> z kwasu solnego (2 Cl⁻ → Cl₂ + 2 e⁻) albo <strong>tlen<\/strong> z H₂SO₄ i roztworów zasad (utlenia się woda / OH⁻). Przy baterii 4,5 V gazu jest niewiele.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-conductivity\"><button data-che-open-viz=\"gfx-scene-conductivity\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-conductivity',lessonId:'N03'},'*')\" type=\"button\"><b>Przewodzenie prądu: tester z żarówką i model jonów<\/b><span>Doświadczenie w silniku GFX · otwiera się w oknie<\/span><\/button><\/div>\n<\/section>\n<section id=\"moc\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Moc kwasów <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3>6.1 Definicja mocy<\/h3>\n<div class=\"card card-core\">\n<span class=\"card-label\">Moc kwasu<\/span>\n<p><strong>Moc kwasu<\/strong> to zdolność do oddawania protonów H⁺ w wodzie. Mierzy się ją <strong>stopniem dysocjacji α<\/strong> (ułamek cząsteczek, które uległy dysocjacji).<\/p>\n<ul>\n<li><strong>Kwas mocny:<\/strong> α ≈ 1 (dysocjuje praktycznie całkowicie).<\/li>\n<li><strong>Kwas słaby:<\/strong> α &lt;&lt; 1 (dysocjuje tylko częściowo).<\/li>\n<\/ul>\n<p class=\"mini-note\"><strong>Moc ≠ stężenie.<\/strong> Mocny kwas może być bardzo rozcieńczony (małe stężenie), a słaby może być bardzo stężony. To dwa różne parametry: stężony kwas octowy (lodowaty, ~17 mol/dm³) nadal jest kwasem słabym (stężenia — <a href=\"#moc\">§6<\/a>.5).<\/p>\n<\/div>\n<h3>6.2 Tabela mocy kwasów<\/h3>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Kwas<\/th><th>Moc<\/th><th>α (stopień dysocjacji)<\/th><th>Zapis dysocjacji<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"ok-row\"><td>HCl<\/td><td>mocny<\/td><td>α ≈ 1 (100%)<\/td><td>→ H⁺ + Cl⁻<\/td><\/tr>\n<tr class=\"ok-row\"><td>HBr<\/td><td>mocny<\/td><td>α ≈ 1<\/td><td>→ H⁺ + Br⁻<\/td><\/tr>\n<tr class=\"ok-row\"><td>HI<\/td><td>mocny<\/td><td>α ≈ 1<\/td><td>→ H⁺ + I⁻<\/td><\/tr>\n<tr class=\"ok-row\"><td>HNO₃<\/td><td>mocny<\/td><td>α ≈ 1<\/td><td>→ H⁺ + NO₃⁻<\/td><\/tr>\n<tr class=\"ok-row\"><td>H₂SO₄<\/td><td>mocny (tylko I stopień)<\/td><td>α₁ ≈ 1, α₂ &lt; 1<\/td><td>→ H⁺ + HSO₄⁻ (I); HSO₄⁻ ⇌ H⁺ + SO₄²⁻ (II)<\/td><\/tr>\n<tr class=\"ok-row\"><td>HClO₄<\/td><td>mocny<\/td><td>α ≈ 1<\/td><td>→ H⁺ + ClO₄⁻<\/td><\/tr>\n<tr><td>H₂SO₃<\/td><td>słaby (średniej mocy)<\/td><td>α₁ ≈ 0,3 (c = 0,1 mol/dm³)<\/td><td>⇌ H⁺ + HSO₃⁻<\/td><\/tr>\n<tr><td>H₃PO₄<\/td><td>słaby (średniej mocy)<\/td><td>α₁ ≈ 0,23 (c = 0,1 mol/dm³)<\/td><td>⇌ H⁺ + H₂PO₄⁻<\/td><\/tr>\n<tr><td>HF<\/td><td>słaby<\/td><td>α ≈ 0,08 (c = 0,1 mol/dm³)<\/td><td>⇌ H⁺ + F⁻<\/td><\/tr>\n<tr><td>CH₃COOH<\/td><td>słaby<\/td><td>α ≈ 0,013 (c = 0,1 mol/dm³)<\/td><td>⇌ H⁺ + CH₃COO⁻<\/td><\/tr>\n<tr><td>H₂CO₃<\/td><td>słaby<\/td><td>α &lt;&lt; 1<\/td><td>⇌ H⁺ + HCO₃⁻<\/td><\/tr>\n<tr><td>H₂S<\/td><td>słaby<\/td><td>α &lt;&lt; 1<\/td><td>⇌ H⁺ + HS⁻<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\"> Stopień dysocjacji słabego kwasu <strong>zależy od stężenia<\/strong> (i temperatury) — liczby podano dla 0,1 mol/dm³ i 25 °C. Stałą cechą kwasu jest <strong>Ka<\/strong> (<a href=\"#moc\">§6<\/a>.6). H₃PO₄ i H₂SO₃ nazywa się czasem kwasami „średniej mocy”.<\/p>\n<h3>6.3 Paradoks HF — dlaczego fluorowodorowy jest słaby? <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h3>\n<div class=\"card card-extra\">\n<p>Fluor jest najbardziej elektroujemnym pierwiastkiem. Intuicja podpowiada, że HF powinien być mocnym kwasem. A jednak <strong>HF jest słabym kwasem w wodzie<\/strong>.<\/p>\n<p><strong>Wyjaśnienie:<\/strong> wiązanie H–F jest bardzo <strong>krótkie i mocne<\/strong> (565 kJ/mol; H–Cl 431, H–Br 366, H–I 299 kJ/mol) — proton trudno oderwać. Dodatkowo mały jon F⁻ i H₃O⁺ wiążą się silnymi wiązaniami wodorowymi w <strong>pary jonowe<\/strong> (H₃O⁺···F⁻), które nie dają „wolnych” jonów H₃O⁺. W szeregu <strong>HF &lt; HCl &lt; HBr &lt; HI<\/strong> moc rośnie, bo wraz ze wzrostem promienia atomu fluorowca wiązanie H–X słabnie — ważniejsza jest długość/energia wiązania niż sama elektroujemność.<\/p>\n<details class=\"adv\"><summary>Termodynamika paradoksu HF <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>Dla HX(aq) → H⁺(aq) + X⁻(aq) bilans energii obejmuje: zerwanie wiązania H–X, jonizację H, powinowactwo elektronowe X i hydratację obu jonów. Silna hydratacja małego F⁻ nie rekompensuje dużej energii wiązania, a dodatkowo uporządkowanie wody wokół F⁻ daje silnie ujemną entropię (ΔS°), więc ΔG° &gt; 0 (pKa ≈ 3,2). W stężonym HF kwasowość <em>rośnie<\/em> dzięki homokoniugacji: HF + F⁻ ⇌ HF₂⁻ (jon wodorodifluorkowy), co wiąże F⁻ i przesuwa równowagę.<\/p><\/div><\/details>\n<p class=\"mini-note\">Na poziomie E8 wystarczy zapamiętać: <strong>HF jest słabym kwasem, mimo że fluor jest bardzo elektroujemny<\/strong>. Pełne wyjaśnienie wymaga analizy energii wiązania i entalpii hydratacji.<\/p>\n<\/div>\n<h3>6.4 Wpływ rozcieńczenia na stopień dysocjacji <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h3>\n<div class=\"card card-understand\">\n<p><strong>Prawo rozcieńczeń Ostwalda:<\/strong> im bardziej rozcieńczony roztwór słabego kwasu, tym większy stopień dysocjacji α.<\/p>\n<p><strong>Ale pH zależy też od stężenia:<\/strong> bardziej rozcieńczony kwas słaby ma wyższe pH (mniej kwaśny roztwór), mimo że α rośnie.<\/p>\n<p>Nie mylić: przy rozcieńczaniu <strong>α rośnie<\/strong>, ale <strong>[H₃O⁺] maleje<\/strong> (kwasu jest mniej w tej samej objętości), więc <strong>pH rośnie<\/strong> — roztwór jest mniej kwaśny, chociaż „procentowo” zdysocjowanych cząsteczek jest więcej.<\/p><p>Przykład (CH₃COOH): c = 0,1 mol/dm³ → α ≈ 1,3%, pH ≈ 2,9; c = 0,001 mol/dm³ → α ≈ 12%, pH ≈ 3,9.<\/p><p class=\"mini-note\">LO rozszerzone — prawo rozcieńczeń Ostwalda: K<sub>a<\/sub> = α²·c / (1 − α); dla α &lt; 5%: K<sub>a<\/sub> ≈ α²·c, czyli α ≈ √(K<sub>a<\/sub>/c).<\/p>\n<\/div>\n<p class=\"mini-note\">Wykres α(c) dla wszystkich kwasów — model dysocjacji w <a href=\"#dysocjacja\">§5<\/a>.<\/p>\n<h3>6.5 Stężenie roztworu kwasu — procentowe i molowe <span class=\"level-badge level-basic\">E8<\/span><\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">E8 — stężenie procentowe<\/span>\n<div class=\"formula-lg\">C<sub>p<\/sub> = m<sub>s<\/sub> / m<sub>r<\/sub> · 100%<\/div><div class=\"formula-lg\">m<sub>r<\/sub> = m<sub>s<\/sub> + m<sub>wody<\/sub><\/div>\n<p><strong>Przykład 1.<\/strong> Ile gramów HCl jest w 200 g roztworu 15%? m<sub>s<\/sub> = 15% · 200 g / 100% = <strong>30 g<\/strong>.<\/p>\n<p><strong>Przykład 2 (rozcieńczanie).<\/strong> Do 50 g 36% kwasu solnego dodano 130 g wody. m<sub>s<\/sub> = 18 g, m<sub>r<\/sub> = 180 g → C<sub>p<\/sub> = <strong>10%<\/strong>. Masa substancji rozpuszczonej się nie zmienia — rośnie tylko masa roztworu.<\/p>\n<p class=\"mini-note\">Rozcieńczając, wlewamy <strong>kwas do wody<\/strong> — zasady i uzasadnienie w <a href=\"#bhp\">§12<\/a>.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">LO rozszerzone — stężenie molowe i przeliczanie<\/span>\n<div class=\"formula-lg\">c<sub>m<\/sub> = n / V   [mol/dm³]<\/div><div class=\"formula-lg\">c<sub>m<\/sub> = C<sub>p<\/sub> · d · 10 / M<\/div><p class=\"mini-note\">d w g/cm³, C<sub>p<\/sub> w %, M w g/mol.<\/p>\n<p>Stężony HCl (36%, d = 1,18 g/cm³): c<sub>m<\/sub> = 36 · 1,18 · 10 / 36,46 ≈ <strong>11,7 mol/dm³<\/strong>.<\/p>\n<p>Stężony H₂SO₄ (96%, d = 1,84 g/cm³): c<sub>m<\/sub> = 96 · 1,84 · 10 / 98,08 ≈ <strong>18,0 mol/dm³<\/strong>.<\/p>\n\n<\/div>\n<h3>6.6 Stała dysocjacji K<sub>a<\/sub> i pK<sub>a<\/sub> <span class=\"level-badge level-extra\">AMBITNE<\/span><\/h3>\n<div class=\"card card-extra\">\n<span class=\"card-label\">LO rozszerzone (biol-chem)<\/span>\n<div class=\"formula-lg\">HA + H₂O ⇌ H₃O⁺ + A⁻<\/div><div class=\"formula-lg\">K<sub>a<\/sub> = [H₃O⁺]·[A⁻] / [HA]<\/div><div class=\"formula-lg\">pK<sub>a<\/sub> = −log K<sub>a<\/sub><\/div>\n<p><strong>Im mniejsze pK<sub>a<\/sub> (większe K<sub>a<\/sub>), tym mocniejszy kwas.<\/strong> K<sub>a<\/sub> zależy tylko od temperatury — nie od stężenia (w przeciwieństwie do α).<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Kwas (25 °C)<\/th><th>pK<sub>a<\/sub><\/th><th>Kwas<\/th><th>pK<sub>a<\/sub><\/th><\/tr><\/thead>\n<tbody>\n<tr><td>HSO₄⁻<\/td><td>1,99<\/td><td>CH₃COOH<\/td><td>4,76<\/td><\/tr>\n<tr><td>H₂SO₃<\/td><td>1,85 (I)<\/td><td>H₂CO₃ (CO₂ aq)<\/td><td>6,35 (I) · 10,33 (II)<\/td><\/tr>\n<tr><td>H₃PO₄<\/td><td>2,16 · 7,21 · 12,32<\/td><td>H₂S<\/td><td>7,0 (I)<\/td><\/tr>\n<tr><td>HF<\/td><td>3,20<\/td><td>HCN<\/td><td>9,2<\/td><\/tr>\n<tr><td>HNO₂<\/td><td>3,35<\/td><td>NH₄⁺<\/td><td>9,25<\/td><\/tr>\n<tr><td>HCOOH<\/td><td>3,75<\/td><td>kwas mlekowy<\/td><td>3,86<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>pH słabego kwasu<\/strong> (gdy α &lt; 5%): [H₃O⁺] ≈ √(K<sub>a<\/sub>·c). Przykład: CH₃COOH 0,1 mol/dm³ → [H₃O⁺] ≈ √(1,75·10⁻⁵ · 0,1) ≈ 1,32·10⁻³ → <strong>pH ≈ 2,88<\/strong>.<\/p>\n<p class=\"mini-note\">Wartości pK<sub>a<\/sub> pochodzą z tej samej tabeli silnika (CHE.DATA.ACID_SYSTEMS), z której korzystają wizualizacje i Atlas (25 °C, CRC/IUPAC; CH₃COOH 4,756 — rekord zweryfikowany).<\/p>\n<p class=\"mini-note\">Kolejne stopnie dysocjacji są coraz słabsze (pK<sub>a1<\/sub> &lt; pK<sub>a2<\/sub> &lt; pK<sub>a3<\/sub>) — trudniej oderwać proton od jonu, który już ma ładunek ujemny.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Mocne kwasy w wodzie: efekt wyrównujący, pK<sub>a<\/sub> ujemne, dokładne obliczenia <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>W wodzie najmocniejszym kwasem, jaki może istnieć, jest H₃O⁺ — wszystkie kwasy mocniejsze (HCl, HBr, HI, HClO₄, HNO₃) oddają proton całkowicie i wyglądają „tak samo mocno” (<strong>efekt wyrównujący wody<\/strong>). Ich pK<sub>a<\/sub> (HCl ≈ −6, HBr ≈ −9, HI ≈ −10, HClO₄ ≈ −10, HNO₃ ≈ −1,4) wyznacza się pośrednio, w innych rozpuszczalnikach (np. kwasie octowym). Mieszaniny typu HSO₃F·SbF₅ to <strong>superkwasy<\/strong> (mocniejsze od 100% H₂SO₄).<\/p><p>Dokładnie pH słabego kwasu liczy się z równania kwadratowego x² + K<sub>a<\/sub>x − K<sub>a<\/sub>c = 0 (dla bardzo rozcieńczonych roztworów trzeba uwzględnić też autodysocjację wody), a w stężonych roztworach zamiast stężeń stosuje się <strong>aktywności<\/strong> a = γ·c (współczynniki aktywności z teorii Debye’a–Hückla).<\/p><\/div><\/details>\n<\/section>\n<section id=\"ph\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> pH i wskaźniki kwasowo-zasadowe <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3>7.1 Skala pH<\/h3>\n<div class=\"card card-core\">\n<span class=\"card-label\">Definicja pH<\/span>\n<p><strong>pH<\/strong> to ujemny logarytm dziesiętny ze stężenia jonów hydroniowych H₃O⁺ (w przybliżeniu szkolnym — stężenia, dokładniej aktywności):<\/p>\n<div class=\"formula-lg\">pH = −log₁₀[H₃O⁺]<\/div>\n<p>Odwrotnie:<\/p>\n<div class=\"formula-lg\">[H₃O⁺] = 10^(−pH)<\/div>\n<\/div>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>pH<\/th><th>Odczyn<\/th><th>Przykład<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>0–3<\/td><td>silnie kwasowy<\/td><td>HCl 1 M (pH 0), sok żołądkowy (pH ≈ 1,5–2), HCl 0,01 M (pH 2), sok z cytryny (pH ≈ 2,3), ocet (pH ≈ 2,5–3)<\/td><\/tr>\n<tr><td>4–6<\/td><td>słabo kwasowy<\/td><td>kawa (pH ≈ 5), czysty deszcz (pH ≈ 5,6 — rozpuszczony CO₂), mleko (pH ≈ 6,6)<\/td><\/tr>\n<tr><td>7<\/td><td>obojętny<\/td><td>woda destylowana<\/td><\/tr>\n<tr><td>8–10<\/td><td>słabo zasadowy<\/td><td>mydło (pH 9), mleko magnezji (pH 10)<\/td><\/tr>\n<tr><td>11–14<\/td><td>silnie zasadowy<\/td><td>woda wapienna (pH 12), NaOH (pH 13)<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<h3>7.2 Przykłady obliczeń pH<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Od stężenia do pH<\/span>\n<p>Kwas mocny — dysocjuje całkowicie, więc [H₃O⁺] ≈ stężenie kwasu:<\/p>\n<div class=\"formula-lg\">HCl 0,1 M → [H₃O⁺] = 0,1 M → pH = −log(0,1) = 1<\/div>\n<div class=\"formula-lg\">HCl 0,01 M → [H₃O⁺] = 0,01 M → pH = −log(0,01) = 2<\/div>\n<div class=\"formula-lg\">HCl 0,001 M → [H₃O⁺] = 0,001 M → pH = 3<\/div>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Od pH do stężenia<\/span>\n<div class=\"formula-lg\">pH = 2 → [H₃O⁺] = 10⁻² = 0,01 mol/dm³<\/div>\n<div class=\"formula-lg\">pH = 3 → [H₃O⁺] = 10⁻³ = 0,001 mol/dm³<\/div>\n<div class=\"formula-lg\">pH = 7 → [H₃O⁺] = 10⁻⁷ = 0,0000001 mol/dm³<\/div>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Skala logarytmiczna<\/span>\n<p>pH jest skalą <strong>logarytmiczną<\/strong>. Różnica 1 jednostki pH = 10× różnica stężenia H₃O⁺.<\/p>\n<p>pH 2 ma 10× więcej H₃O⁺ niż pH 3 i 100× więcej niż pH 4.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">LO rozszerzone — pOH i iloczyn jonowy wody<\/span><div class=\"formula-lg\">K<sub>w<\/sub> = [H₃O⁺]·[OH⁻] = 1,0·10⁻¹⁴ (25 °C)<\/div><div class=\"formula-lg\">pH + pOH = 14<\/div><p>Przykład: NaOH 0,01 mol/dm³ → [OH⁻] = 10⁻² → pOH = 2 → pH = 12.<\/p><p class=\"mini-note\">Woda destylowana stojąca na powietrzu ma pH ≈ 5,6–6 (pochłania CO₂). Krew: pH 7,35–7,45 (lekko zasadowy).<\/p><\/div>\n<details class=\"adv\"><summary>Dlaczego „pH 7 = obojętny” jest prawdą tylko w 25 °C <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>K<sub>w<\/sub> rośnie z temperaturą (autodysocjacja wody jest endotermiczna): w 37 °C pK<sub>w<\/sub> ≈ 13,6, więc roztwór obojętny ma pH ≈ 6,8; w 100 °C pK<sub>w<\/sub> ≈ 12,3 i obojętne pH ≈ 6,1. Obojętny oznacza [H₃O⁺] = [OH⁻], a nie „pH = 7”. Skala pH nie kończy się na 0 i 14: stężony HCl może mieć pH &lt; 0, a stężony NaOH pH &gt; 14 (formalnie pH = −log a<sub>H₃O⁺<\/sub>).<\/p><\/div><\/details>\n<h3>7.3 Wskaźniki kwasowo-zasadowe<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Wskaźnik reaguje na pH, nie na „nazwę” substancji<\/span>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Wskaźnik<\/th><th>Kwas<\/th><th>Obojętny<\/th><th>Zasada<\/th><th>Zakres zmiany (pH)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Fenoloftaleina<\/td><td>bezbarwna<\/td><td>bezbarwna<\/td><td>malinowa<\/td><td>8,2–10,0<\/td><\/tr>\n<tr><td>Oranż metylowy<\/td><td>czerwony (pH &lt; 3,1)<\/td><td>żółty<\/td><td>żółty<\/td><td>3,1–4,4 (pomarańczowy)<\/td><\/tr>\n<tr><td>Papierek uniwersalny<\/td><td>czerwony / pomarańczowy<\/td><td>zielony (żółtozielony)<\/td><td>niebieski / granatowy<\/td><td>pełna skala<\/td><\/tr>\n<tr><td>Wywar z czerwonej kapusty (naturalny)<\/td><td>czerwony / różowy<\/td><td>fioletowy<\/td><td>niebieski → zielony → żółty<\/td><td>szeroki (antocyjany)<\/td><\/tr>\n<tr><td>Papierek lakmusowy<\/td><td>czerwony<\/td><td>fioletowy<\/td><td>niebieski<\/td><td>ok. 4,5–8,3<\/td><\/tr>\n<tr><td>Błękit bromotymolowy<\/td><td>żółty<\/td><td>zielony<\/td><td>niebieski<\/td><td>6,0–7,6<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\"><strong>Zapamiętaj:<\/strong> fenoloftaleina jest <strong>bezbarwna<\/strong> w kwasie i obojętnym, <strong>malinowa<\/strong> w zasadzie. Oranż metylowy jest czerwony w kwasie, żółty w zasadzie — pomarańczowy tylko w wąskim zakresie pH 3,1–4,4; w wodzie (pH 7) jest już <strong>żółty<\/strong>, więc nie odróżni roztworu obojętnego od zasadowego. Do tego służy fenoloftaleina lub papierek uniwersalny.<\/p>\n<details class=\"adv\"><summary>Wskaźnik jako słaby kwas <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>Wskaźnik to słaby kwas HInd, którego forma kwasowa i zasadowa mają różne barwy: HInd ⇌ H⁺ + Ind⁻. Barwa przejściowa pojawia się przy pH ≈ pK<sub>Ind<\/sub> ± 1. Fenoloftaleina w bardzo silnie zasadowym środowisku (pH &gt; 12–13) powoli się odbarwia (powstaje bezbarwna forma karbinolowa), a w stężonym H₂SO₄ jest pomarańczowa.<\/p><\/div><\/details>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"ph-indicators-v03\"><button data-che-open-viz=\"ph-indicators-v03\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'ph-indicators-v03',lessonId:'N03'},'*')\" type=\"button\"><b>Panel pH: skala, wskaźniki i barwy, drabinka kwasów i zasad<\/b><span>Barwy wskaźników z CHE.COLORS · roztwór × wskaźnik dla wybranego stężenia · silnik CHE<\/span><\/button><\/div>\n<h3>7.4 Laboratorium wskaźników<\/h3><div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-indicatorRack\"><button data-che-open-viz=\"gfx-scene-indicatorRack\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-indicatorRack',lessonId:'N03'},'*')\" type=\"button\"><b>Wskaźnik w siedmiu roztworach (statyw probówek)<\/b><span>Doświadczenie w silniku GFX · otwiera się w oknie<\/span><\/button><\/div>\n<div class=\"card card-basic\"><p>Jeden wskaźnik w siedmiu roztworach — statyw probówek poniżej; roztwór × wskaźnik i drabinka pH kwasów i zasad dla wybranego stężenia — panel pH w <a href=\"#ph\">§7<\/a>.3.<\/p><\/div>\n<\/section>\n<section id=\"otrzymywanie\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Otrzymywanie kwasów <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"mnemonic\"><b>Mnemonik: TNS – trzy drogi do kwasu<\/b><ol><li><strong>T<\/strong>lenek kwasowy + woda → kwas tlenowy (SO₃ + H₂O → H₂SO₄).<\/li><li><strong>N<\/strong>iemetal + wodór → kwas beztlenowy (H₂ + Cl₂ → 2 HCl; dopiero w wodzie powstaje kwas).<\/li><li><strong>S<\/strong>ól + mocniejszy (lub mniej lotny) kwas → nowy kwas (NaCl + H₂SO₄ → NaHSO₄ + HCl↑).<\/li><\/ol><\/div>\n<h3>8.1 Tlenek kwasowy + woda → kwas<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Metoda E8<\/span>\n<div class=\"formula-lg\" data-rx=\"so3H2o\">SO₃ + H₂O → H₂SO₄<\/div>\n<div class=\"formula-lg\" data-rx=\"so2H2o\">SO₂ + H₂O → H₂SO₃<\/div>\n<div class=\"formula-lg\">CO₂ + H₂O ⇌ H₂CO₃ (słaby)<\/div>\n<div class=\"formula-lg\">P₂O₅ + 3 H₂O → 2 H₃PO₄<\/div>\n<div class=\"formula-lg\" data-rx=\"n2o5H2o\">N₂O₅ + H₂O → 2 HNO₃<\/div>\n<div class=\"formula-lg\" data-rx=\"n2o3H2o\">N₂O₃ + H₂O → 2 HNO₂<\/div>\n<p class=\"mini-note\">Typ reakcji: synteza (łączenie). Zachodzi dla tlenków kwasowych — z wyjątkiem SiO₂, który z wodą nie reaguje (H₂SiO₃ otrzymuje się z soli — <a href=\"#otrzymywanie\">§8<\/a>.3). Zapis P₂O₅ jest uproszczony: rzeczywista cząsteczka to P₄O₁₀ (P₄O₁₀ + 6 H₂O → 4 H₃PO₄). NO₂ nie jest tlenkiem jednego kwasu: z wodą daje HNO₃ i HNO₂ (2 NO₂ + H₂O → HNO₃ + HNO₂).<\/p>\n<\/div>\n<h3>8.2 Niemetal + wodór → kwas beztlenowy<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\">H₂ + Cl₂ →(światło lub T) 2 HCl<\/div>\n<div class=\"formula-lg\" data-rx=\"h2Br2\">H₂ + Br₂ → 2 HBr<\/div>\n<div class=\"formula-lg\">H₂ + I₂ ⇌ 2 HI (T, katalizator Pt — reakcja odwracalna)<\/div>\n<div class=\"formula-lg\">H₂ + S → H₂S (nad kat., podgrzewanie)<\/div>\n<p class=\"mini-note\">Reakcje wymagają zapoczątkowania: mieszanina H₂ + Cl₂ <strong>wybucha na świetle<\/strong> (reakcja łańcuchowa), z Br₂ i S wodór reaguje po ogrzaniu, z I₂ — tylko częściowo (równowaga). Powstają <strong>gazy<\/strong> (HCl, HBr, HI, H₂S) — kwasy dają dopiero po rozpuszczeniu w wodzie. W laboratorium otrzymuje się je najczęściej przez reakcję soli z kwasem mniej lotnym lub mocniejszym (metoda <a href=\"#otrzymywanie\">§8<\/a>.3).<\/p>\n<\/div>\n<h3>8.3 Sól + kwas mocniejszy lub mniej lotny → nowy kwas<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"naclH2so4\">NaCl + H₂SO₄ →(Δ) NaHSO₄ + HCl↑<\/div>\n<div class=\"formula-lg\">Na₂SiO₃ + 2 HCl → H₂SiO₃↓ + 2 NaCl<\/div>\n<p class=\"mini-note\">Tak otrzymuje się kwasy lotne (HCl) i kwasy nierozpuszczalne (H₂SiO₃ — SiO₂ z wodą nie reaguje). To reakcja kwas + sól: zachodzi, gdy powstaje <strong>gaz<\/strong> (HCl, CO₂, SO₂, H₂S) lub <strong>osad<\/strong> — warunki, reguły i dalsze przykłady (CaCO₃, Na₂SO₃, Na₂S) w <a href=\"#reakcje\">§9<\/a>.4. Doświadczenie z NaCl + H₂SO₄ to <strong>wyłącznie pokaz nauczycielski pod dygestorium<\/strong> — HCl gazowy jest drażniący.<\/p>\n<\/div>\n<h3>8.4 Otrzymywanie HCl(aq) — etapy<\/h3>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Od NaCl do kwasu solnego<\/span>\n<ol>\n<li>Do NaCl dodajemy stężonego H₂SO₄ (pod dygestorium): NaCl + H₂SO₄ → NaHSO₄ + HCl↑.<\/li>\n<li>Gazowy HCl (bezbarwny, drażniący) przepuszczamy przez wodę.<\/li>\n<li>Otrzymujemy roztwór HCl(aq) — kwas chlorowodorowy.<\/li>\n<\/ol>\n<p class=\"mini-note\">W wilgotnym powietrzu HCl(g) „dymi” — białą mgłę opisuje <a href=\"#wlasciwosci\">§4<\/a>.1.<\/p>\n<\/div>\n<\/section>\n<section id=\"reakcje\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Reakcje kwasów <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Cztery główne schematy reakcji kwasów<\/span>\n<ol>\n<li><strong>Kwas + metal aktywny → sól + wodór↑<\/strong><\/li>\n<li><strong>Kwas + tlenek metalu (zasadowy) → sól + woda<\/strong><\/li>\n<li><strong>Kwas + wodorotlenek (zasada) → sól + woda<\/strong> (zobojętnianie)<\/li>\n<li><strong>Kwas + sól (węglan) → sól + woda + CO₂↑<\/strong> (dla węglanów)<\/li>\n<\/ol>\n<\/div>\n<h3 id=\"rx-metal\">9.1 Kwas + metal → sól + wodór<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Warunek: metal musi być aktywniejszy od wodoru<\/span>\n<div class=\"formula-lg\" data-rx=\"znHcl\">Zn + 2 HCl → ZnCl₂ + H₂↑<\/div>\n<div class=\"formula-lg\" data-rx=\"mgHcl\">Mg + 2 HCl → MgCl₂ + H₂↑<\/div>\n<div class=\"formula-lg\" data-rx=\"feHcl\">Fe + 2 HCl → FeCl₂ + H₂↑<\/div>\n<div class=\"formula-lg\" data-rx=\"alHcl\">2 Al + 6 HCl → 2 AlCl₃ + 3 H₂↑<\/div>\n<div class=\"formula-lg\">Zn + H₂SO₄ (rozc.) → ZnSO₄ + H₂↑<\/div>\n<\/div>\n<div class=\"card card-error\">\n<span class=\"card-label\">Kontrprzykłady — metale za wodorem<\/span>\n<p><strong>Cu + HCl → brak reakcji<\/strong> (miedź poniżej wodoru)<\/p>\n<p><strong>Ag + HCl → brak reakcji<\/strong> (srebro poniżej wodoru)<\/p>\n<p><strong>Au + HCl → brak reakcji<\/strong> (złoto poniżej wodoru)<\/p>\n<p class=\"mini-note\">Reguła i uzasadnienie — <a href=\"#reakcje\">§9<\/a>.1.1; wyjątek HNO₃ — <a href=\"#reakcje\">§9<\/a>.1.2.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Szybkość i szczegóły reakcji metal + kwas<\/span>\n<ul>\n<li><strong>Szybkość<\/strong> wydzielania H₂ w tym samym kwasie: Mg (gwałtownie, roztwór się ogrzewa) &gt; Zn &gt; Fe (powoli); Cu — brak reakcji. Rośnie ze stężeniem kwasu, temperaturą i rozdrobnieniem metalu.<\/li>\n<li><strong>Fe + 2 HCl → FeCl₂ + H₂↑<\/strong> — powstaje sól żelaza(II) (bladozielony roztwór), <em>nie<\/em> FeCl₃: jony H⁺ są zbyt słabym utleniaczem, by utlenić Fe do +III.<\/li>\n<li><strong>Al<\/strong> reaguje z opóźnieniem — najpierw kwas musi rozpuścić ochronną warstwę Al₂O₃.<\/li>\n<li><strong>Pb<\/strong> stoi przed H, ale z HCl i H₂SO₄ reaguje bardzo słabo — na powierzchni powstaje trudno rozpuszczalny PbCl₂ / PbSO₄, który hamuje reakcję.<\/li>\n<li>To reakcja <strong>redoks<\/strong>: Zn⁰ → Zn²⁺ + 2e⁻ (utlenianie), 2 H⁺ + 2e⁻ → H₂⁰ (redukcja). Jonowo: Zn + 2 H⁺ → Zn²⁺ + H₂↑.<\/li>\n<\/ul>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-szereg-metali-v01\"><button data-che-open-viz=\"kw-szereg-metali-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-szereg-metali-v01',lessonId:'N03'},'*')\" type=\"button\"><b>Szereg aktywności na żywo: Mg, Zn, Fe, Cu w HCl<\/b><span>Cztery probówki obok siebie · silnik GFX · otwiera się w oknie<\/span><\/button><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-acidMetal\"><button data-che-open-viz=\"gfx-scene-acidMetal\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-acidMetal',lessonId:'N03'},'*')\" type=\"button\"><b>Metal + kwas solny → wodór i próba „pyk!”<\/b><span>Doświadczenie w silniku GFX · otwiera się w oknie<\/span><\/button><\/div>\n<h3>9.1.1 Szereg aktywności metali — pełna tabela<\/h3>\n<div class=\"card card-core\">\n<span class=\"card-label\">Szereg aktywności (od najbardziej aktywnego)<\/span>\n<style>.sr{margin:6px 0 10px}.sr-row{display:flex;flex-wrap:wrap;gap:6px}.sr-c{min-width:44px;padding:8px 6px;border-radius:10px;border:2px solid;text-align:center;font:800 17px/1.1 inherit;display:flex;flex-direction:column;align-items:center;gap:2px}.sr-c small{font:600 9.5px/1 inherit;opacity:.85}.sr-a{background:var(--accent-soft,#e6f2f1);border-color:var(--accent,#0d6868);color:var(--accent,#0d6868)}.sr-h{background:var(--c-warn-bg,#fcf4e6);border-color:var(--c-warn,#b06f1c);color:var(--c-warn,#b06f1c)}.sr-n{background:var(--c-err-bg,#fbeced);border-color:var(--c-err,#b83a45);color:var(--c-err,#b83a45)}.sr-leg{margin-top:8px;font-size:13px;line-height:1.5}.sr-leg b{font-weight:800}<\/style><div aria-label=\"Szereg aktywności metali: K, Ca, Na, Mg, Al, Zn, Fe, Sn, Pb, H, Cu, Ag, Au\" class=\"sr\" role=\"img\"><div class=\"sr-row\"><span class=\"sr-c sr-a\">K<small>+ woda<\/small><\/span><span class=\"sr-c sr-a\">Ca<small>+ woda<\/small><\/span><span class=\"sr-c sr-a\">Na<small>+ woda<\/small><\/span><span class=\"sr-c sr-a\">Mg<\/span><span class=\"sr-c sr-a\">Al<\/span><span class=\"sr-c sr-a\">Zn<\/span><span class=\"sr-c sr-a\">Fe<\/span><span class=\"sr-c sr-a\">Sn<\/span><span class=\"sr-c sr-a\">Pb<\/span><span class=\"sr-c sr-h\">H<\/span><span class=\"sr-c sr-n\">Cu<\/span><span class=\"sr-c sr-n\">Ag<\/span><span class=\"sr-c sr-n\">Au<\/span><\/div><div class=\"sr-leg\"><b style=\"color:var(--accent,#0d6868)\">Zielone<\/b> (przed H): wypierają H₂ z kwasów nieutleniających. <b style=\"color:var(--c-warn,#b06f1c)\">H<\/b> – granica. <b style=\"color:var(--c-err,#b83a45)\">Czerwone<\/b> (za H): brak reakcji z HCl. Aktywność maleje od lewej do prawej.<\/div><\/div>\n<p><strong>Reguła E8:<\/strong> kwas + metal → sól + H₂ <strong>tylko dla metali przed H w szeregu<\/strong>. Metale za H (Cu, Ag, Au) nie reagują z rozcieńczonymi kwasami nieutleniającymi.<\/p>\n<p class=\"mini-note\"><strong>Uzasadnienie:<\/strong> metale aktywne łatwo oddają elektrony i tworzą kationy trwałe w wodzie — oddają elektrony jonom H₃O⁺, które redukują się do H₂. Metale szlachetne (Cu, Ag, Au) trudno się utleniają — jony H⁺ są dla nich zbyt słabym utleniaczem. Ilościowo decyduje <strong>potencjał standardowy E°<\/strong> (szereg napięciowy, LO rozszerzone): metal wypiera wodór, gdy E°(Mⁿ⁺/M) &lt; 0 V (np. Zn −0,76 V, Fe −0,44 V, Cu +0,34 V).<\/p>\n<details class=\"adv\"><summary>Dlaczego nie wystarczy energia jonizacji <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>E° wynika z całego cyklu: atomizacja metalu + jonizacja + <strong>hydratacja kationu<\/strong>. Lit ma większą energię jonizacji niż cez, a mimo to najbardziej ujemny potencjał (−3,04 V), bo mały jon Li⁺ jest bardzo silnie hydratowany. Dlatego szereg aktywności „w wodzie” nie pokrywa się dokładnie z szeregiem energii jonizacji ani elektroujemności.<\/p><\/div><\/details>\n<\/div>\n<h3>9.1.2 Wyjątek: HNO₃ jako kwas utleniający <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h3>\n<div class=\"card card-extra\">\n<p>HNO₃ reaguje z miedzią, ale <strong>NIE wydziela wodoru<\/strong> — jest kwasem utleniającym.<\/p>\n<div class=\"formula-lg\">Cu + 4 HNO₃ (stężony) → Cu(NO₃)₂ + 2 NO₂↑ + 2 H₂O<\/div>\n<div class=\"formula-lg\">3 Cu + 8 HNO₃ (rozcieńczony) → 3 Cu(NO₃)₂ + 2 NO↑ + 4 H₂O<\/div>\n<p class=\"mini-note\">Produkt zależy od stężenia i temperatury. Na E8 wystarczy wiedzieć, że <strong>nie stosuje się schematu „metal + kwas → H₂”<\/strong> dla HNO₃. Doświadczenie z HNO₃ wykonuje wyłącznie nauczyciel (toksyczne gazy NO₂, NO).<\/p>\n<div class=\"card card-extra\">\n<span class=\"card-label\">LO rozszerzone — kwasy utleniające i pasywacja<\/span>\n<p><strong>Gorący stężony H₂SO₄<\/strong> też jest utleniaczem: Cu + 2 H₂SO₄(stęż.) →(T) CuSO₄ + SO₂↑ + 2 H₂O.<\/p>\n<p><strong>Pasywacja:<\/strong> stężony HNO₃ i stężony H₂SO₄ na zimno pokrywają Fe, Al i Cr cienką, szczelną warstwą tlenku — reakcja ustaje. Dlatego stężony H₂SO₄ można przewozić w stalowych cysternach (rozcieńczony kwas żelazo rozpuszcza — w szkole kwasów nie przechowuje się w metalu).<\/p>\n<\/div>\n<details class=\"adv\"><summary>Woda królewska — jak rozpuścić złoto <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>Mieszanina stęż. HNO₃ i HCl (1:3) rozpuszcza Au i Pt: HNO₃ utlenia metal, a jony Cl⁻ wiążą powstały kation w trwały kompleks, co przesuwa równowagę: Au + HNO₃ + 4 HCl → H[AuCl₄] + NO↑ + 2 H₂O.<\/p><\/div><\/details>\n<\/div>\n<h3 id=\"rx-tlenek\">9.2 Kwas + tlenek metalu → sól + woda<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Przykłady<\/span>\n<div class=\"formula-lg\" data-rx=\"caoHcl\">CaO + 2 HCl → CaCl₂ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"cuoH2so4\">CuO + H₂SO₄ → CuSO₄ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"fe2o3Hcl\">Fe₂O₃ + 6 HCl → 2 FeCl₃ + 3 H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"na2oHno3\">Na₂O + 2 HNO₃ → 2 NaNO₃ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"mgoHcl\">MgO + 2 HCl → MgCl₂ + H₂O<\/div>\n<p class=\"mini-note\">Reakcja zachodzi nawet dla tlenków, które nie reagują z wodą (np. CuO, Fe₂O₃). To ważne — charakter zasadowy nie wymaga reakcji z wodą. Tlenki <strong>amfoteryczne<\/strong> (ZnO, Al₂O₃) reagują i z kwasami, i z zasadami: ZnO + 2 HCl → ZnCl₂ + H₂O.<\/p>\n<\/div>\n<h3 id=\"rx-zasada\">9.3 Kwas + wodorotlenek → sól + woda (zobojętnianie)<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Zobojętnianie<\/span>\n<div class=\"formula-lg\" data-rx=\"hclNaOH\">HCl + NaOH → NaCl + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"h2so4Koh\">H₂SO₄ + 2 KOH → K₂SO₄ + 2 H₂O<\/div>\n<div class=\"formula-lg\">2 HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + 2 H₂O<\/div>\n<div class=\"formula-lg\">3 HCl + Al(OH)₃ → AlCl₃ + 3 H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"h3po4Caoh2\">2 H₃PO₄ + 3 Ca(OH)₂ → Ca₃(PO₄)₂ + 6 H₂O<\/div>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Kontrola współczynników<\/span>\n<p>Liczba grup OH⁻ z wodorotlenku musi zrównoważyć liczbę atomów H z kwasu.<\/p>\n<p>H₂SO₄ (2 H) + 2 KOH (2 OH) → K₂SO₄ + 2 H₂O. ✓<\/p>\n<p>H₃PO₄ (3 H) + 3 NaOH (3 OH) → Na₃PO₄ + 3 H₂O. ✓<\/p>\n<\/div>\n<h3>9.3.1 Równania jonowe zobojętniania<\/h3>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"rownania-jonowe-v01\"><button data-che-open-viz=\"rownania-jonowe-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'rownania-jonowe-v01',lessonId:'N03'},'*')\" type=\"button\"><b>Równania jonowe dla wszystkich reakcji z lekcji (generowane przez silnik)<\/b><span>Cząsteczkowe → jonowe pełne → skrócone · jony obserwatory · CHE.IONIC<\/span><\/button><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">NaOH + HCl — trzy poziomy zapisu<\/span>\n<div class=\"formula-lg\">Cząsteczkowe: NaOH(aq) + HCl(aq) → NaCl(aq) + H₂O(l)<\/div>\n<div class=\"formula-lg\">Jonowe pełne: Na⁺ + OH⁻ + H⁺ + Cl⁻ → Na⁺ + Cl⁻ + H₂O<\/div>\n<div class=\"formula-lg\">Jonowe skrócone: H⁺ + OH⁻ → H₂O<\/div>\n<p class=\"mini-note\">Jony Na⁺ i Cl⁻ są <strong>jonami widzowymi<\/strong> — nie zmieniają się w reakcji, można je pominąć.<\/p>\n<\/div>\n<h3 id=\"rx-sol\">9.4 Kwas + sól → nowy kwas + nowa sól<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Warunki zachodzenia reakcji<\/span>\n<p>Reakcja zachodzi, gdy powstaje <strong>osad<\/strong>, <strong>gaz<\/strong> lub <strong>słaby elektrolit (np. woda)<\/strong>.<\/p><p class=\"mini-note\"> Czy powstanie osad, sprawdzasz w <strong>tabeli rozpuszczalności<\/strong>: produkt oznaczony N (nierozpuszczalny) lub T (trudno rozpuszczalny) wytrąca się — np. AgCl (N), BaSO₄ (N). Jeśli wszystkie produkty są rozpuszczalne (R) i nie powstaje gaz ani słaby elektrolit — reakcja nie zachodzi (same jony obserwatory).<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"tabela-rozpuszczalnosci-v01\"><button data-che-open-viz=\"tabela-rozpuszczalnosci-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'tabela-rozpuszczalnosci-v01',lessonId:'N03'},'*')\" type=\"button\"><b>Tabela rozpuszczalności (20 °C) — kliknij komórkę<\/b><span>Wzór i nazwa soli, R / T / N, barwa osadu · CHE.DATA.SOLUBILITY_TABLE<\/span><\/button><\/div>\n<div class=\"formula-lg\">2 HCl + CaCO₃ → CaCl₂ + H₂O + CO₂↑ (gaz)<\/div>\n<div class=\"formula-lg\">HCl + AgNO₃ → AgCl↓ + HNO₃ (osad)<\/div>\n<div class=\"formula-lg\">H₂SO₄ + BaCl₂ → BaSO₄↓ + 2 HCl (osad)<\/div>\n<div class=\"formula-lg\">2 HCl + Na₂S → 2 NaCl + H₂S↑ (gaz)<\/div>\n<div class=\"formula-lg\">2 HCl + Na₂SO₃ → 2 NaCl + H₂O + SO₂↑ (gaz)<\/div>\n<div class=\"formula-lg\">NaCl + H₂SO₄ →(Δ) NaHSO₄ + HCl↑ (gaz)<\/div>\n<p class=\"mini-note\">Doświadczenie z NaCl + H₂SO₄ to wyłącznie pokaz nauczycielski pod dygestorium — <a href=\"#otrzymywanie\">§8<\/a>.3.<\/p>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Reguła „mocniejszy wypiera słabszy”<\/span>\n<p>Kwas mocniejszy wypiera kwas słabszy z jego soli. HCl (mocny) wypiera H₂CO₃ (słaby) z CaCO₃ → H₂CO₃ rozkłada się na CO₂↑ + H₂O.<\/p>\n<p><strong>Kwas mniej lotny wypiera kwas bardziej lotny:<\/strong> stężony H₂SO₄ (prawie nielotny, wrze ok. 337 °C) wypiera gazowy HCl z NaCl, choć HCl jest kwasem <em>mocniejszym<\/em> — HCl ulatnia się, więc reakcja biegnie do końca.<\/p><p><strong>Osad „wygrywa” z mocą:<\/strong> HCl + AgNO₃ → AgCl↓ + HNO₃ zachodzi, choć powstaje kwas równie mocny — o kierunku decyduje nierozpuszczalny osad.<\/p>\n<\/div>\n<h3>9.5 Przewidź i sprawdź<\/h3><div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"reakcje-kwasu-v03\"><button data-che-open-viz=\"reakcje-kwasu-v03\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'reakcje-kwasu-v03',lessonId:'N03'},'*')\" type=\"button\"><b>Reakcje kwasów: przewidź i sprawdź<\/b><span>Metal, tlenek, węglan, sól, zobojętnianie · najpierw predykcja, potem zlewka<\/span><\/button><\/div>\n<\/section>\n<section id=\"deszcze\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Kwaśne deszcze <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Chemizm powstawania<\/span>\n<p><strong>Tlenki siarki:<\/strong><\/p>\n<div class=\"formula-lg\">S + O₂ → SO₂ (spalanie paliw z siarką)<\/div>\n<div class=\"formula-lg\">2 SO₂ + O₂ → 2 SO₃ (utlenianie w atmosferze)<\/div>\n<div class=\"formula-lg\">SO₃ + H₂O → H₂SO₄ (kwas siarkowy(VI))<\/div>\n<div class=\"formula-lg\">SO₂ + H₂O ⇌ H₂SO₃ (alternatywnie, kwas siarkowy(IV))<\/div>\n<p><strong>Tlenki azotu:<\/strong><\/p>\n<div class=\"formula-lg\">N₂ + O₂ → 2 NO (wysoka temperatura — silniki)<\/div>\n<div class=\"formula-lg\">2 NO + O₂ → 2 NO₂ (brązowy gaz)<\/div>\n<div class=\"formula-lg\">3 NO₂ + H₂O → 2 HNO₃ + NO (kwas azotowy(V))<\/div>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Skutki kwaśnych deszczy<\/span>\n<ul>\n<li>Zakwaszenie gleb i wód (pH &lt; 5,6 — poniżej naturalnego).<\/li>\n<li>Uszkodzenie lasów (wymywanie składników odżywczych, obumieranie drzew).<\/li>\n<li>Korozja budynków (marmur, wapień: CaCO₃ + H₂SO₄ → CaSO₄ + H₂O + CO₂↑).<\/li>\n<li>Wymieranie organizmów wodnych (ryby, plankton nie tolerują pH &lt; 5).<\/li>\n<li>Zniszczenie zabytków (np. rzeźby z piaskowca, marmuru).<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Zapobieganie<\/span>\n<ul>\n<li><strong>Odsiarczanie paliw<\/strong> przed spalaniem.<\/li>\n<li><strong>Filtry przemysłowe<\/strong> — zatrzymywanie SO₂ i NO₂ ze spalin.<\/li>\n<li><strong>Katalizatory samochodowe<\/strong> — redukcja NOₓ do N₂.<\/li>\n<li><strong>Odnawialne źródła energii<\/strong> (wiatr, słońce, wodór).<\/li>\n<li><strong>Wapnowanie gleb<\/strong> — neutralizacja kwaśnych gleb wapnem (CaO, CaCO₃).<\/li>\n<\/ul>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"acid-rain-v01\"><button data-che-open-viz=\"acid-rain-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'acid-rain-v01',lessonId:'N03'},'*')\" type=\"button\"><b>Kwaśne deszcze – animacja obiegu<\/b><span>Wizualizacja z biblioteki · otwiera się w oknie<\/span><\/button><\/div>\n<\/section>\n<section id=\"zastosowania\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Zastosowania kwasów <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Kwas<\/th><th>Zastosowanie<\/th><th>Konkretny przykład<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>HCl<\/td><td>żołądek, czyszczenie<\/td><td>pH żołądka ~1,5–2 (trawienie białek); odkamienianie powierzchni<\/td><\/tr>\n<tr><td>H₂SO₄<\/td><td>akumulatory, nawozy<\/td><td>elektrolit w akumulatorze ołowiowym; produkcja nawozów fosforowych<\/td><\/tr>\n<tr><td>HNO₃<\/td><td>nawozy, materiały wybuchowe<\/td><td>saletra (NaNO₃, KNO₃); TNT (trinitrotoluen)<\/td><\/tr>\n<tr><td>H₃PO₄<\/td><td>nawozy, żywność<\/td><td>E338 (zakwaszacz w coli); nawozy fosforowe; środki czyszczące<\/td><\/tr>\n<tr><td>H₂CO₃<\/td><td>napoje gazowane<\/td><td>CO₂ + H₂O; orzeźwiający smak napojów<\/td><\/tr>\n<tr><td>CH₃COOH<\/td><td>spożywczy, konserwant<\/td><td>E260; 5–10% w occie; konserwowanie ogórków<\/td><\/tr>\n<tr><td>HF<\/td><td>trawienie szkła<\/td><td>grawerowanie szkła (SiO₂ + 4 HF → SiF₄ + 2 H₂O)<\/td><\/tr>\n<tr><td>H₂SiO₃<\/td><td>żel krzemionkowy (silikażel), krzemiany<\/td><td>saszetki pochłaniające wilgoć (silikażel z odwodnionego H₂SiO₃); <em>szkło wodne<\/em> to roztwór soli Na₂SiO₃ — kleje, uszczelniacze<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Kwasy w domu<\/span>\n<ul>\n<li><strong>Ocet<\/strong> — CH₃COOH (5–10%) — konserwowanie, gotowanie, czyszczenie.<\/li>\n<li><strong>Środek do czyszczenia WC<\/strong> — HCl (żrący!).<\/li>\n<li><strong>Środek odkamieniający<\/strong> — kwasek cytrynowy (C₆H₈O₇) lub ocet.<\/li>\n<li><strong>Napoje gazowane<\/strong> — H₂CO₃, H₃PO₄.<\/li>\n<li><strong>Akumulator samochodowy<\/strong> — H₂SO₄ (30–40%).<\/li>\n<\/ul>\n<\/div>\n<h3>11.1 Kwasy w organizmie <span class=\"bio-tag\">BIOL-CHEM<\/span> <span class=\"level-badge level-extra\">AMBITNE<\/span><\/h3>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Kwasy, które działają w Twoim ciele<\/span>\n<ul>\n<li><strong>HCl w żołądku<\/strong> (komórki okładzinowe, pH ≈ 1,5–2): denaturuje białka, aktywuje pepsynę (optimum pH ≈ 2), niszczy bakterie. Leki „na zgagę” to zasady i sole — <em>reakcje zobojętniania<\/em>: Mg(OH)₂ + 2 HCl → MgCl₂ + 2 H₂O; NaHCO₃ + HCl → NaCl + H₂O + CO₂↑ (stąd odbijanie).<\/li>\n<li><strong>Bufor wodorowęglanowy krwi<\/strong> utrzymuje pH krwi 7,35–7,45 — opis i liczby w <a href=\"#bufory\">§15<\/a>.<\/li>\n<li><strong>Kwas mlekowy<\/strong> CH₃CH(OH)COOH (pK<sub>a<\/sub> 3,86): powstaje w mięśniach przy niedoborze tlenu (glikoliza beztlenowa) i w fermentacji mlekowej (jogurt, kiszonki). W pH komórki występuje jako anion <strong>mleczan<\/strong>.<\/li>\n\n<li><strong>Aminokwasy<\/strong> mają grupę kwasową –COOH i zasadową –NH₂; w roztworze tworzą jon obojnaczy (np. glicyna H₃N⁺–CH₂–COO⁻) — są amfoteryczne.<\/li>\n<li><strong>Kwasy nukleinowe<\/strong> (DNA, RNA) zawdzięczają nazwę resztom kwasu fosforowego — w pH organizmu są zdysocjowane, dlatego DNA ma ładunek ujemny (to wykorzystuje elektroforeza).<\/li>\n<li><strong>Kwasy tłuszczowe<\/strong> (palmitynowy C₁₅H₃₁COOH, stearynowy C₁₇H₃₅COOH, oleinowy C₁₇H₃₃COOH) tworzą z glicerolem tłuszcze; <strong>kwas cytrynowy<\/strong> to związek centralny cyklu Krebsa; <strong>kwas askorbinowy<\/strong> to witamina C; nadmiar <strong>kwasu moczowego<\/strong> powoduje dnę moczanową.<\/li>\n<li><strong>Próchnica<\/strong>: bakterie w płytce nazębnej fermentują cukry do kwasów; poniżej pH ≈ 5,5 szkliwo (hydroksyapatyt Ca₁₀(PO₄)₆(OH)₂) zaczyna się rozpuszczać. Fluor tworzy odporniejszy fluoroapatyt.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"bhp\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Bezpieczeństwo (BHP) <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-dilution\"><button data-che-open-viz=\"gfx-scene-dilution\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-dilution',lessonId:'N03'},'*')\" type=\"button\"><b>Rozcieńczanie: „kwas do wody!” — poprawnie i błędnie<\/b><span>Doświadczenie w silniku GFX · otwiera się w oknie<\/span><\/button><\/div>\n<div class=\"card card-error\">\n<span class=\"card-label\">Żrące właściwości kwasów<\/span>\n<p>Stężone kwasy <strong>niszczą skórę, błony śluzowe i oczy<\/strong>. Kontakt może prowadzić do trwałych oparzeń chemicznych.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Zasady BHP pracy z kwasami<\/span>\n<ul>\n<li>✓ <strong>Zawsze kwas do wody<\/strong>, porcjami, mieszając (nie odwrotnie!) — wlewanie wody do stężonego kwasu może spowodować gwałtowne zagotowanie i rozprysk; <strong>nigdy nie wlewać wody do stężonego kwasu<\/strong>.<\/li>\n<li>✓ <strong>Okulary ochronne<\/strong> — obowiązkowo przy każdej pracy z kwasami.<\/li>\n<li>✓ <strong>Rękawice<\/strong> — przy pracy ze stężonymi kwasami.<\/li>\n<li>✓ <strong>Fartuch ochronny<\/strong> — przy stężonych kwasach.<\/li>\n<li>✓ <strong>Nie pipetować ustami<\/strong> — używać pipety automatycznej lub gruszki.<\/li>\n<li>✓ <strong>Nie wąchać bezpośrednio<\/strong> — wachlować ręką w kierunku nosa.<\/li>\n<li>✓ <strong>Mieszać i chłodzić<\/strong> przy rozcieńczaniu (reakcja egzotermiczna).<\/li>\n<li>✓ <strong>Płukać 15 min<\/strong> dużą ilością wody przy kontakcie ze skórą.<\/li>\n<li>✓ <strong>Płukać 15 min<\/strong> i natychmiast do lekarza przy kontakcie z oczami.<\/li>\n<li>✓ <strong>Pracować w dygestorium<\/strong> przy stężonych kwasach (opary drażniące).<\/li>\n<li>✗ <strong>Nie przechowywać kwasów w naczyniach metalowych<\/strong> (reakcja z metalem).<\/li>\n<li>✗ <strong>Nie dodawać stężonego kwasu do gorącej wody.<\/strong><\/li>\n<li>✗ <strong>Nie zobojętniaj kwasu na skórze ani w oku<\/strong> (sodą, zasadą) — reakcja wydziela ciepło i opóźnia płukanie; tylko długie płukanie wodą.<\/li>\n<li>✓ <strong>Rozlany kwas<\/strong> zgłoś nauczycielowi; zasypuje się go sorbentem lub wodorowęglanem sodu NaHCO₃ (piana CO₂ = zobojętnianie), potem zbiera i spłukuje dużą ilością wody. Nie zalewaj małą ilością wody stężonego H₂SO₄ (rozpryskuje się).<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Dlaczego „kwas do wody”?<\/span>\n<p>Rozcieńczanie stężonego kwasu (np. H₂SO₄) wydziela <strong>dużo ciepła<\/strong> (reakcja egzotermiczna).<\/p>\n<p>Gdy wlewasz <strong>wodę do kwasu<\/strong> — woda (mniejsza gęstość) zostaje na powierzchni, miejscowo gwałtownie się nagrzewa, może zagotować się i <strong>rozprysnąć kwas<\/strong>.<\/p>\n<p>Gdy wlewasz <strong>kwas do wody<\/strong> — kwas opada, miesza się z całą objętością wody, ciepło rozchodzi się, ryzyko rozprysku znacznie mniejsze.<\/p>\n<\/div>\n<\/section>\n<section id=\"organiczne\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Kwasy organiczne (karboksylowe) <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Kwasy organiczne (karboksylowe) — ogólnie<\/span>\n<p><strong>Kwasy karboksylowe<\/strong> to związki organiczne zawierające grupę karboksylową <strong>–COOH<\/strong>.<\/p>\n<p>Wzór ogólny: <strong>R–COOH<\/strong>, gdzie R = grupa węglowodorowa (lub wodór).<\/p>\n<p>Wszystkie są <strong>słabymi kwasami<\/strong> (dysocjują częściowo). Proton kwasowy pochodzi z grupy –COOH.<\/p>\n<\/div>\n<div class=\"table-wrap\">\n<table>\n<thead><tr><th>Wzór<\/th><th>Nazwa zwyczajowa<\/th><th>Nazwa systematyczna<\/th><th>Gdzie spotykasz<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>HCOOH<\/td><td>kwas mrówkowy<\/td><td>kwas metanowy<\/td><td>jad mrówek, pokrzywy<\/td><\/tr>\n<tr><td>CH₃COOH<\/td><td>kwas octowy<\/td><td>kwas etanowy<\/td><td>ocet 5–10%<\/td><\/tr>\n<tr><td>C₂H₅COOH<\/td><td>kwas propionowy<\/td><td>kwas propanowy<\/td><td>konserwant E280<\/td><\/tr>\n<tr><td>C₃H₇COOH<\/td><td>kwas masłowy<\/td><td>kwas butanowy<\/td><td>jełczenie masła<\/td><\/tr>\n<tr><td>C₆H₅COOH<\/td><td>kwas benzoesowy<\/td><td>kwas benzenokarboksylowy<\/td><td>konserwant E210<\/td><\/tr>\n<tr><td>HOOC–COOH<\/td><td>kwas szczawiowy<\/td><td>kwas etanodiowy<\/td><td>szczaw, rabarbar<\/td><\/tr>\n<tr><td>C₆H₈O₇<\/td><td>kwas cytrynowy<\/td><td>kwas 2-hydroksypropano-1,2,3-trikarboksylowy<\/td><td>cytryny, E330, cykl Krebsa<\/td><\/tr>\n<tr><td>C₃H₆O₃<\/td><td>kwas mlekowy<\/td><td>kwas 2-hydroksypropanowy<\/td><td>jogurt, kiszona kapusta, mięśnie<\/td><\/tr>\n<tr><td>C₁₅H₃₁COOH<\/td><td>kwas palmitynowy<\/td><td>kwas heksadekanowy<\/td><td>tłuszcze, mydła (palmityniany)<\/td><\/tr>\n<tr><td>C₁₇H₃₅COOH<\/td><td>kwas stearynowy<\/td><td>kwas oktadekanowy<\/td><td>tłuszcze stałe, świece, mydła<\/td><\/tr>\n<tr><td>C₁₇H₃₃COOH<\/td><td>kwas oleinowy<\/td><td>kwas (Z)-oktadec-9-enowy<\/td><td>oliwa — kwas nienasycony (odbarwia wodę bromową)<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n\n<p class=\"mini-note\">Uwaga: 3 atomy H w grupie CH₃ <strong>nie są protonami kwasowymi<\/strong> — tylko H z grupy –COOH. Dlatego CH₃COOH jest kwasem jednoprotonowym, mimo że ma 4 atomy H.<\/p>\n<\/div>\n\n<p class=\"mini-note\">Kwas octowy: dysocjacja CH₃COOH ⇌ H⁺ + CH₃COO⁻ — <a href=\"#dysocjacja\">§5<\/a>.2; dlaczego jest jednoprotonowy (tylko H z grupy –COOH) — <a href=\"#nazewnictwo\">§2<\/a>.3.<\/p>\n<\/section>\n<section id=\"miareczkowanie\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Miareczkowanie (titracja) <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Co to jest titracja?<\/span>\n<p><strong>Titracja<\/strong> (miareczkowanie) to metoda analizy ilościowej polegająca na <strong>stopniowym dodawaniu titranta<\/strong> (roztworu o znanym stężeniu) do analitu (roztworu badanego) aż do osiągnięcia punktu równoważnikowego.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Kluczowe pojęcia<\/span>\n<ul>\n<li><strong>Titrant<\/strong> — roztwór o znanym stężeniu (np. NaOH 0,1 M).<\/li>\n<li><strong>Analit<\/strong> — roztwór badany (np. HCl o nieznanym stężeniu).<\/li>\n<li><strong>Wskaźnik<\/strong> — substancja sygnalizująca zmianę pH (np. fenoloftaleina).<\/li>\n<li><strong>Punkt równoważnikowy<\/strong> — moment, w którym liczba moli titranta = liczba moli analitu (stechiometrycznie).<\/li>\n<li><strong>Punkt końcowy<\/strong> — moment, w którym wskaźnik zmienia barwę (obserwowany).<\/li>\n<\/ul>\n<p class=\"mini-note\">Punkt równoważnikowy wynika ze stechiometrii; punkt końcowy — z obserwacji wskaźnika. <strong>Nie zawsze pokrywają się dokładnie<\/strong> (błąd miareczkowania).<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Obliczenia w tit
