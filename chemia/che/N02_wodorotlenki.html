\"level-badge level-extra\">LO<\/span><\/div>\n<p>Nie używamy skrótu „amfoteryczny = reaguje ze wszystkim”.<\/p>\n<p class=\"mini-note\">Reakcje z mocnymi zasadami prowadzą do jonów kompleksowych; szczegółowy zapis należy do warstwy rozszerzonej.<\/p>\n<\/div>\n<p class=\"mini-note\">Doświadczenie z Al(OH)₃ w kwasie i w nadmiarze zasady: <a href=\"#doswiadczenia\">§15, doświadczenie H<\/a>. Tlenki amfoteryczne (Al₂O₃, ZnO): lekcja N01.<\/p>\n<\/section>\n<section class=\"section\" id=\"doswiadczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> Doświadczenia modelowe <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<p>Format egzaminacyjny: problem → hipoteza → sprzęt → przebieg → obserwacje → wniosek → równanie → BHP. Wykonuj tylko pod nadzorem nauczyciela. Każde doświadczenie obejrzysz w pracowni silnika (animacja, równania jonowe, warunki).<\/p>\n<p class=\"mini-note\">Zasady BHP dla NaOH/KOH i gaszenia wapna: <a href=\"#bhp\">§9.2<\/a>.<\/p>\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Obserwacja → wniosek — jak zapisać doświadczenie<\/h4>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Warstwa<\/th><th>Przykład dla CaO + H₂O<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Obserwacja<\/td><td>układ wyraźnie się nagrzewa<\/td><\/tr>\n<tr><td>Wniosek<\/td><td>zaszła reakcja z wydzieleniem ciepła; powstaje Ca(OH)₂<\/td><\/tr>\n<tr><td>Równanie<\/td><td><span class=\"formula\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/span><\/td><\/tr>\n<tr><td>Ograniczenie<\/td><td>obserwacja nie pokazuje mikroskopowego mechanizmu reakcji<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div><div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-doswiadczenia-v01\"><button data-che-open-viz=\"n02-doswiadczenia-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-doswiadczenia-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Pracownia: 26 doświadczeń z wodorotlenkami — zlewka, równania, obserwacje, BHP<\/b><span>GFX.rx · D.REACTIONS · CHE.IONIC<\/span><\/button><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie A — Otrzymywanie NaOH: sód + woda <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Co powstaje w reakcji sodu z wodą?<\/span><b>Hipoteza<\/b><span>Powstaje zasada i gaz.<\/span><b>Sprzęt i odczynniki<\/b><span>krystalizator z wodą i fenoloftaleiną, kawałek sodu wielkości ziarna grochu, szczypce, osłona<\/span><b>Przebieg<\/b><span>Nauczyciel wrzuca mały kawałek Na do wody z fenoloftaleiną.<\/span><b>Obserwacje<\/b><span>Sód topi się w kulkę i „biega” po powierzchni, słychać syczenie, wydziela się gaz; roztwór barwi się na malinowo.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"naH2o\">2Na + 2H₂O → 2NaOH + H₂↑<\/span><\/span><b>Wniosek<\/b><span>Metal aktywny + woda → wodorotlenek + wodór; roztwór ma odczyn zasadowy.<\/span><b>BHP<\/b><span>Wyłącznie pokaz nauczyciela: okulary, osłona, bardzo mała porcja sodu (wodór może się zapalić).<\/span><\/div><button class=\"che-prac-go\" data-k=\"naH2o\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie B — Gaszenie wapna: CaO + H₂O <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Co się dzieje, gdy do CaO dodamy wody?<\/span><b>Hipoteza<\/b><span>Powstanie wodorotlenek wapnia, wydzieli się ciepło.<\/span><b>Sprzęt i odczynniki<\/b><span>CaO, woda, parownica odporna na ciepło, fenoloftaleina, papierek uniwersalny<\/span><b>Przebieg<\/b><span>Do niewielkiej ilości CaO dodaje się wodę ostrożnie, małymi porcjami. Po ochłodzeniu bada się klarowny roztwór znad osadu.<\/span><b>Obserwacje<\/b><span>Silne rozgrzanie, często syk; powstaje biała papka (mleko wapienne); roztwór nad osadem: fenoloftaleina malinowa, papierek — barwa zasadowa.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/span><\/span><b>Wniosek<\/b><span>Tlenek zasadowy + woda → wodorotlenek. Część Ca(OH)₂ rozpuszcza się (woda wapienna), nadmiar zostaje jako zawiesina (mleko wapienne).<\/span><b>BHP<\/b><span>Wykonuje nauczyciel. Reakcja silnie egzotermiczna — nie dotykaj CaO mokrymi rękami, nie pochylaj się nad naczyniem (aerozol Ca(OH)₂ jest żrący). Nie badaj wskaźnikiem gorącej, gęstej zawiesiny.<\/span><\/div><button class=\"che-prac-go\" data-k=\"caoH2o\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie C — Strącanie Cu(OH)₂ <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy z soli miedzi(II) i zasady powstanie wodorotlenek?<\/span><b>Hipoteza<\/b><span>Powstanie osad wodorotlenku miedzi(II).<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór CuSO₄, roztwór NaOH, probówka, pipeta<\/span><b>Przebieg<\/b><span>Do roztworu CuSO₄ dodaje się kroplami roztwór NaOH.<\/span><b>Obserwacje<\/b><span>Niebieski, galaretowaty osad; roztwór nad osadem traci niebieską barwę.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"cuso4Naoh\">CuSO₄ + 2NaOH → Cu(OH)₂↓ + Na₂SO₄<\/span><\/span><b>Wniosek<\/b><span>Sól + zasada → wodorotlenek↓ + sól (metoda strąceniowa) — działa, bo Cu(OH)₂ jest praktycznie nierozpuszczalny.<\/span><b>BHP<\/b><span>NaOH żrący — okulary, rękawice.<\/span><\/div><button class=\"che-prac-go\" data-k=\"cuso4Naoh\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie D — Strącanie Fe(OH)₃ <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy z soli żelaza(III) i zasady powstaje wodorotlenek?<\/span><b>Hipoteza<\/b><span>Powstanie brunatny osad.<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór FeCl₃, roztwór NaOH, probówka<\/span><b>Przebieg<\/b><span>Do roztworu FeCl₃ dodaje się roztwór NaOH.<\/span><b>Obserwacje<\/b><span>Rdzawobrunatny osad.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"fecl3Naoh\">FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl<\/span><\/span><b>Wniosek<\/b><span>Powstał praktycznie nierozpuszczalny wodorotlenek żelaza(III); Fe³⁺ potrzebuje trzech OH⁻ — stąd współczynnik 3.<\/span><b>BHP<\/b><span>NaOH żrący — okulary, rękawice.<\/span><\/div><button class=\"che-prac-go\" data-k=\"fecl3Naoh\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie E — Odczyn roztworu NaOH — trzy wskaźniki <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Jaki odczyn ma roztwór NaOH?<\/span><b>Hipoteza<\/b><span>Zasadowy.<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór NaOH przygotowany przez nauczyciela, papierek uniwersalny, fenoloftaleina, oranż metylowy, 3 probówki<\/span><b>Przebieg<\/b><span>Do trzech porcji roztworu dodaje się kolejno wskaźniki.<\/span><b>Obserwacje<\/b><span>Papierek uniwersalny — niebieski / fioletowy (zależnie od pH i papierka), fenoloftaleina — malinowa, oranż metylowy — żółty.<\/span><b>Równanie<\/b><span><span class=\"formula\">NaOH → Na⁺ + OH⁻<\/span><\/span><b>Wniosek<\/b><span>Roztwór NaOH ma odczyn zasadowy (dla stężonego — silnie zasadowy): zawiera jony OH⁻.<\/span><b>BHP<\/b><span>NaOH żrący. Roztwór przygotowuje nauczyciel — rozpuszczanie stałego NaOH jest silnie egzotermiczne.<\/span><\/div><button class=\"che-prac-go\" data-k=\"\" data-prac=\"ph-indicators-v03\" type=\"button\">Zobacz w modelu wskaźników<\/button><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie F — Zobojętnianie NaOH kwasem solnym <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Co się dzieje, gdy do zasady dodajemy kwas?<\/span><b>Hipoteza<\/b><span>Powstaje sól i woda; odczyn się zmienia.<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór NaOH z fenoloftaleiną, rozcieńczony HCl, pipeta, zlewka<\/span><b>Przebieg<\/b><span>Do zasady z fenoloftaleiną dodaje się kroplami HCl, mieszając.<\/span><b>Obserwacje<\/b><span>Malinowa barwa stopniowo zanika — w punkcie zobojętnienia roztwór jest bezbarwny; zlewka lekko się ogrzewa.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"hclNaOH\">NaOH + HCl → NaCl + H₂O<\/span><\/span><b>Wniosek<\/b><span>Zaszło zobojętnianie: H⁺ + OH⁻ → H₂O. Zanik barwy fenoloftaleiny oznacza, że nie ma już nadmiaru OH⁻.<\/span><b>BHP<\/b><span>Roztwory żrące — okulary.<\/span><\/div><button class=\"che-prac-go\" data-k=\"hclNaOH+php\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie G — Woda wapienna i CO₂ <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy w wydychanym powietrzu jest CO₂?<\/span><b>Hipoteza<\/b><span>Woda wapienna zmętnieje.<\/span><b>Sprzęt i odczynniki<\/b><span>woda wapienna (klarowny roztwór nasycony), rurka, probówka<\/span><b>Przebieg<\/b><span>Przez rurkę wdmuchuje się powietrze do wody wapiennej.<\/span><b>Obserwacje<\/b><span>Roztwór mętnieje (biały osad); przy bardzo długim dmuchaniu znów się klaruje.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O<\/span><\/span><b>Wniosek<\/b><span>Wydychane powietrze zawiera CO₂ — woda wapienna służy do jego wykrywania. Klarowanie: CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂ (rozszerzenie).<\/span><b>BHP<\/b><span>Nie zasysaj roztworu przez rurkę.<\/span><\/div><button class=\"che-prac-go\" data-k=\"caoh2Co2\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie H — Amfoteryczność Al(OH)₃ <span class=\"level-badge level-extra\">AMB<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy Al(OH)₃ reaguje z kwasem i z zasadą?<\/span><b>Hipoteza<\/b><span>Reaguje z obydwoma.<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór AlCl₃, roztwór NaOH, rozcieńczony HCl, 2 probówki<\/span><b>Przebieg<\/b><span>Strąca się Al(OH)₃ (NaOH kroplami), osad dzieli na dwie probówki; do jednej dodaje się HCl, do drugiej nadmiar NaOH.<\/span><b>Obserwacje<\/b><span>Biały, galaretowaty osad; w obu probówkach osad znika.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"alcl3Naoh\">AlCl₃ + 3NaOH → Al(OH)₃↓ + 3NaCl<\/span><\/span><b>Wniosek<\/b><span>Al(OH)₃ jest amfoteryczny: Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O oraz Al(OH)₃ + NaOH → Na[Al(OH)₄] (zapis LO).<\/span><b>BHP<\/b><span>NaOH żrący — okulary, rękawice.<\/span><\/div><button class=\"che-prac-go\" data-k=\"aloh3Naoh\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button><\/div>\n<\/section>\n<section class=\"section\" id=\"klinika\">\n<div class=\"part-heading\"><span class=\"part-num\">16<\/span> Klinika błędów<\/div>\n<div class=\"table-wrap table-compact\">\n<table class=\"klinika-table\" id=\"klinikaTable\">\n<thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><th>Przykład z życia<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"error-row\"><td class=\"col-blad\">Ca<span class=\"hl-index\">OH₂<\/span> <span style=\"font-size:11px;color:var(--c-error)\">(indeks „przyklejony” tylko do H)<\/span><\/td><td class=\"col-ok\">Ca(<span class=\"hl-index\">OH<\/span>)₂ <span style=\"font-size:11px;color:var(--c-basic)\">(indeks przy całej grupie)<\/span><\/td><td>Nawias obejmuje całą grupę OH⁻, nie tylko H. Indeks 2 dotyczy dwóch całych grup OH⁻.<\/td><td>Uczeń zapomniał nawiasu — wzór sugeruje, że indeks 2 dotyczy tylko wodoru, a nie dwóch całych grup OH⁻.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">AlOH₃<\/td><td class=\"col-ok\">Al(OH)₃<\/td><td>Nawias — 3 grupy OH⁻. Indeks 3 dotyczy całych grup, nie tylko wodoru.<\/td><td>Jak wyżej: bez nawiasu indeks 3 dotyczyłby tylko wodoru.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">NaOH + HCl → NaCl<\/td><td class=\"col-ok\">NaOH + HCl → NaCl + H₂O<\/td><td>Zobojętnianie daje sól i wodę. Woda jest produktem reakcji i nie może być pominięta.<\/td><td>Zapomniano o wodzie — najczęstszy błąd przy przepisywaniu równania zobojętniania.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">CaO + H₂O → CaOH<\/td><td class=\"col-ok\">CaO + H₂O → Ca(OH)₂<\/td><td>Brak bilansu atomów wodoru (po lewej 2 H, po prawej 1 H) oraz brak nawiasu dla grupy OH⁻. Poprawny zapis wymaga dwóch grup OH⁻ przy wapniu.<\/td><td>Uczeń zapomina, że w reakcji tlenku z wodą powstaje wodorotlenek, a nie tlenek wodorotlenku. Dodatkowo myli zapis z nawiasem.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">Wszystkie wodorotlenki są silnie zasadowe<\/td><td class=\"col-ok\">Tylko dobrze rozpuszczalne dają silny odczyn<\/td><td>Rozpuszczalność decyduje o stężeniu OH⁻. Trudno rozpuszczalne wodorotlenki dają bardzo mało jonów OH⁻ w roztworze.<\/td><td>Ktoś miesza zawiesinę Fe(OH)₃ i spodziewa się odczynu jak po NaOH — a odczynu praktycznie nie ma.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">Fe(OH)₃ rozpuszcza się w wodzie<\/td><td class=\"col-ok\">Fe(OH)₃ jest praktycznie nierozpuszczalny<\/td><td>Większość wodorotlenków metali przejściowych jest nierozpuszczalna.<\/td><td>Po dodaniu NaOH do FeCl₃ powstaje brunatny osad, nie klarowny roztwór.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">MgO nie reaguje z wodą<\/td><td class=\"col-ok\">MgO reaguje bardzo wolno; powstaje trudno rozpuszczalny Mg(OH)₂<\/td><td>Mg(OH)₂ otrzymuje się wygodniej przez strącanie, ale reakcja zachodzi.<\/td><td>W praktyce szkolnej Mg(OH)₂ robi się z MgCl₂ + NaOH, bo reakcja MgO z wodą jest zbyt wolna.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">Każdy tlenek metalu reaguje z wodą<\/td><td class=\"col-ok\">Tylko niektóre tlenki zasadowe (metali aktywnych)<\/td><td>CuO, Fe₂O₃ i Al₂O₃ praktycznie nie reagują z wodą.<\/td><td>Wsypanie CuO do wody nie da niebieskiego roztworu — to nie zadziała.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">Zasada = wodorotlenek<\/td><td class=\"col-ok\">Wodorotlenek = substancja; zasada = jej wodny roztwór<\/td><td>Stały NaOH to wodorotlenek; jego wodny roztwór jest zasadą (ługiem sodowym).<\/td><td>Butelka z NaOH to wodorotlenek; zlewka z roztworem NaOH to zasada — wodny roztwór wodorotlenku.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie — popraw zdanie<\/span>\n<p><strong>Polecenie:<\/strong> Uczeń napisał w zeszycie: „Fe(OH)₃ rozpuszcza się w wodzie i daje odczyn zasadowy.\" Popraw to zdanie i wyjaśnij, dlaczego jest błędne.<\/p>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p><strong>Poprawnie:<\/strong> Fe(OH)₃ jest praktycznie nierozpuszczalny w wodzie. Nie tworzy roztworu o wyraźnym odczynie zasadowym, bo stężenie jonów OH⁻ w roztworze jest zbyt małe.<\/p>\n<p><strong>Wyjaśnienie:<\/strong> O odczynie roztworu decyduje stężenie wolnych jonów OH⁻. Jeśli wodorotlenek prawie nie przechodzi do roztworu (jak Fe(OH)₃), to do roztworu trafia znikoma liczba jonów OH⁻ — odczyn praktycznie obojętny.<\/p>\n<\/details>\n<\/div>\n<details class=\"answer\"><summary>Przełącznik błędu — ile grup OH⁻ jest w Ca(OH)₂? (1 / 2 / 3)<\/summary><p><strong>2.<\/strong> Indeks za nawiasem mnoży całą grupę OH: Ca(OH)₂ = 1 Ca, 2 O, 2 H. Zapis CaOH₂ oznaczałby 1 grupę OH i dodatkowy atom H.<\/p><\/details>\n<h3 class=\"merge-h\">Sprawdź się<\/h3><div class=\"rule-box\">\n<ol>\n<li>Popraw: <span class=\"formula\">CaOH₂<\/span> → ?<\/li>\n<li>Czy <span class=\"formula\">OH⁻<\/span> jest związkiem chemicznym czy jonem?<\/li>\n<li>Czy trudno rozpuszczalny wodorotlenek automatycznie oznacza „słabą zasadę”?<\/li>\n<li>Co różni wodę wapienną od mleka wapiennego?<\/li>\n<li>Dlaczego <span class=\"formula\">H–O–Ca–O–H<\/span> nie powinno być podpisane jako rzeczywista cząsteczka Ca(OH)₂?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li><span class=\"formula\">Ca(OH)₂<\/span>.<\/li>\n<li>Jest anionem wodorotlenkowym.<\/li>\n<li>Nie. Rozpuszczalność i moc elektrolitu to różne pojęcia.<\/li>\n<li>Woda wapienna jest klarownym nasyconym roztworem; mleko wapienne jest zawiesiną z fazą stałą.<\/li>\n<li>Stały Ca(OH)₂ opisujemy jako układ jonowy; rysunek jest tylko modelem poglądowym składu.<\/li>\n<\/ol>\n<\/details>\n<\/div><details class=\"answer\"><summary>Mini-klinika błędów<\/summary>\n<ol>\n<li><strong>„Ca(OH)₂ jest zasadą, bo ma OH w wzorze.”<\/strong> — Nie wystarczy sam wzór. Trzeba mówić o roztworze i obecności OH⁻.<\/li>\n<li><strong>„Amfoteryczny reaguje ze wszystkim.”<\/strong> — Nie. Wskazujemy konkretny reagent i środowisko.<\/li>\n<li><strong>„NH₄OH to zwykła cząsteczka w każdym roztworze amoniaku.”<\/strong> — To tradycyjny zapis szkolny; dokładniejszy model wodnego amoniaku używa NH₃(aq) ⇌ NH₄⁺ + OH⁻.<\/li>\n<\/ol>\n<\/details><\/section>\n<section class=\"section\" id=\"cwiczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">17<\/span> Ćwiczenia<\/div>\n<p class=\"mini-note\">Reguły potrzebne do zadań: wzory <a href=\"#budowa\">§5<\/a>, rozpuszczalność <a href=\"#rozpuszczalnosc-tabela\">§6.2<\/a>, otrzymywanie <a href=\"#otrzymywanie\">§7<\/a>, zobojętnianie <a href=\"#zobojetnianie\">§8.1<\/a>.<\/p>\n<h3>17.1 Mini-check<\/h3>\n<div class=\"card\">\n<ol>\n<li>Co to wodorotlenek?<\/li>\n<li>Jaki ładunek ma grupa OH⁻?<\/li>\n<li>Kiedy stosujemy nawias?<\/li>\n<li>Trzy typowe szkolne metody otrzymywania wodorotlenków?<\/li>\n<li>Co to zobojętnianie?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<p><strong>1.<\/strong> Związek z kationu metalu i anionu OH⁻.<\/p>\n<p><strong>2.<\/strong> −1.<\/p>\n<p><strong>3.<\/strong> Gdy grupa OH⁻ powtarza się więcej niż raz.<\/p>\n<p><strong>4.<\/strong> Tlenek metalu aktywnego + woda; metal aktywny + woda; sól + zasada.<\/p>\n<p><strong>5.<\/strong> Reakcja kwasu z zasadą → sól + woda.<\/p>\n<\/details>\n<\/div>\n<h3>17.2 Ćwiczenie prowadzone — Ca(OH)₂<\/h3>\n<div class=\"card\">\n<p><strong>Polecenie:<\/strong> Mając dany kation wapnia Ca²⁺, wykonaj kolejne polecenia:<\/p>\n<ol>\n<li>Zapisz wzór wodorotlenku.<\/li>\n<li>Podaj jego nazwę.<\/li>\n<li>Zapisz trzy metody otrzymywania tego wodorotlenku.<\/li>\n<li>Zapisz równanie zobojętniania tego wodorotlenku kwasem solnym HCl.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p><strong>1. Wzór:<\/strong> Ca(OH)₂ (wapń +2, więc 2 grupy OH⁻, nawias obowiązkowy).<\/p>\n<p><strong>2. Nazwa:<\/strong> wodorotlenek wapnia.<\/p>\n<p><strong>3. Trzy metody:<\/strong><\/p>\n<p>• tlenek + woda: CaO + H₂O → Ca(OH)₂<\/p>\n<p>• metal + woda: Ca + 2H₂O → Ca(OH)₂ + H₂↑ <span class=\"mini-note\">(przykład szkolny; przebieg zależy od warunków, np. temperatury i stanu powierzchni metalu)<\/span><\/p>\n<p>• sól + zasada: CaCl₂ + 2NaOH → Ca(OH)₂↓ + 2NaCl <span class=\"mini-note\">(tylko z roztworów stężonych — Ca(OH)₂ jest trudno, ale nie praktycznie nierozpuszczalny)<\/span><\/p>\n<p><strong>4. Zobojętnianie:<\/strong> Ca(OH)₂ + 2HCl → CaCl₂ + 2H₂O.<\/p>\n<\/details>\n<\/div>\n<h3>17.3 Ćwiczenia samodzielne<\/h3>\n<h4>A. Podstawa <span class=\"level-badge level-basic\">E8<\/span><\/h4>\n<div class=\"card\">\n<ol>\n<li>Wzory: wodorotlenek potasu, wodorotlenek wapnia, wodorotlenek glinu, wodorotlenek żelaza(III).<\/li>\n<li>Nazwy: NaOH, Mg(OH)₂, Fe(OH)₂, Cu(OH)₂.<\/li>\n<li>Dokończ: CaO + H₂O → … ; NaOH + HCl → …<\/li>\n<li>Popraw: CaOH₂; NaOH + H₂SO₄ → Na₂SO₄.<\/li>\n<li>Które wodorotlenki są dobrze rozpuszczalne?<\/li>\n<li>Jakie wskaźniki potwierdzają odczyn zasadowy?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>KOH, Ca(OH)₂, Al(OH)₃, Fe(OH)₃.<\/li>\n<li>wodorotlenek sodu, magnezu, żelaza(II), miedzi(II).<\/li>\n<li>Ca(OH)₂ ; NaCl + H₂O.<\/li>\n<li>Ca(OH)₂ ; 2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O.<\/li>\n<li>NaOH, KOH, LiOH, Ba(OH)₂ (dobrze); Ca(OH)₂ (trudno, ale tworzy wodę wapienną).<\/li>\n<li>fenoloftaleina (malinowa), oranż metylowy (żółty), papierek uniwersalny (niebieski).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h4>B. Trening / egzamin <span class=\"level-badge level-basic\">E8<\/span><\/h4>\n<div class=\"card\">\n<ol start=\"7\">\n<li>Zobojętnianie: KOH + HNO₃; Ca(OH)₂ + H₂SO₄; Al(OH)₃ + 3HCl.<\/li>\n<li>Skąd Ca(OH)₂, mając CaO?<\/li>\n<li>Dlaczego Ca(OH)₂, a nie CaOH₂?<\/li>\n<li>Otrzymywanie Mg(OH)₂ z MgCl₂ i NaOH.<\/li>\n<li>Uzupełnij: FeCl₃ + 3NaOH → ? ; CuSO₄ + 2NaOH → ?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"7\">\n<li>KNO₃ + H₂O ; CaSO₄ + 2H₂O ; AlCl₃ + 3H₂O.<\/li>\n<li>CaO + H₂O → Ca(OH)₂.<\/li>\n<li>Indeks 2 dotyczy całej grupy OH⁻.<\/li>\n<li>MgCl₂ + 2NaOH → Mg(OH)₂↓ + 2NaCl.<\/li>\n<li>Fe(OH)₃↓ + 3NaCl ; Cu(OH)₂↓ + Na₂SO₄.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h4>C. Ambitne <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h4>\n<div class=\"card\">\n<ol start=\"12\">\n<li>FeCl₃ + NaOH — równanie + obserwacja + wniosek.<\/li>\n<li>Które wodorotlenki dają silnie zasadowy roztwór?<\/li>\n<li>Dlaczego Al(OH)₃ reaguje z HCl i NaOH?<\/li>\n<li>Zaprojektuj doświadczenie: odczyn KOH.<\/li>\n<li>Trzy poziomy zapisu NaOH + HCl.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"12\">\n<li>Problem → Hipoteza → Sprzęt → Obserwacja (brunatny osad) → Wniosek → Równanie → BHP. Równanie: FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl. Obserwacja: powstaje rdzawobrunatny osad. Wniosek: z soli żelaza(III) i zasady powstaje praktycznie nierozpuszczalny Fe(OH)₃ (por. doświadczenie D).<\/li>\n<li>NaOH, KOH i Ba(OH)₂ są dobrze rozpuszczalne i tworzą roztwory wyraźnie zasadowe. Fe(OH)₃ jest praktycznie nierozpuszczalny, więc nie tworzy w wodzie takiego roztworu.<\/li>\n<li>Al(OH)₃ jest amfoteryczny. Z kwasem reaguje jak zasada (Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O), a z mocną zasadą tworzy rozpuszczalny związek kompleksowy (Al(OH)₃ + NaOH → Na[Al(OH)₄]).<\/li>\n<li>Problem → Hipoteza → Sprzęt → Obserwacja → Wniosek → Równanie → BHP. Np.: problem — jaki odczyn ma roztwór KOH? Hipoteza — zasadowy. Sprzęt — roztwór KOH, fenoloftaleina, papierek uniwersalny, probówki. Obserwacja — fenoloftaleina malinowa, papierek niebieski. Wniosek — odczyn zasadowy (jony OH⁻). Równanie: KOH → K⁺ + OH⁻. BHP — okulary, rękawice.<\/li>\n<li>Cząsteczkowe: NaOH + HCl → NaCl + H₂O. Jonowe pełne: Na⁺ + OH⁻ + H⁺ + Cl⁻ → Na⁺ + Cl⁻ + H₂O. Skrócone: H⁺ + OH⁻ → H₂O.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h4>D. Zaawansowane <span class=\"level-badge level-extra\">AMBITNE<\/span><\/h4>\n<div class=\"card\">\n<ol start=\"17\">\n<li>Dysocjacja: NaOH, Ca(OH)₂, Ba(OH)₂.<\/li>\n<li>Co to hydrat? Przykład.<\/li>\n<li>Dlaczego AgOH jest nietrwały?<\/li>\n<li>Różnica rozpuszczalny vs mocny.<\/li>\n<li>Dlaczego Ba(OH)₂ + H₂SO₄ daje wodę i osad?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"17\">\n<li>NaOH → Na⁺ + OH⁻ ; Ca(OH)₂ → Ca²⁺ + 2OH⁻ ; Ba(OH)₂ → Ba²⁺ + 2OH⁻.<\/li>\n<li>Związek z cząsteczkami wody w sieci, np. CuSO₄·5H₂O.<\/li>\n<li>2AgOH → Ag₂O + H₂O. Wodorotlenek srebra(I) szybko przekształca się w tlenek srebra(I).<\/li>\n<li>Rozpuszczalny = ile przechodzi do roztworu. Mocny = stopień dysocjacji cząstek w roztworze. Ca(OH)₂ jest słabiej rozpuszczalny niż NaOH, ale rozpuszczona część dysocjuje praktycznie całkowicie.<\/li>\n<li>Dwa procesy: H⁺ + OH⁻ → H₂O oraz Ba²⁺ + SO₄²⁻ → BaSO₄↓.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h4>E. Zadania z obserwacją (typ E8) <span class=\"level-badge level-basic\">E8<\/span><\/h4>\n<div class=\"card card-exam\">\n<p><strong>Zadanie 1.<\/strong> Fenoloftaleina w probówkach A, B, C. A — malinowa, B — bezbarwna. Do A dodawano HCl, aż barwa znikła.<\/p>\n<ol>\n<li>Odczyn A?<\/li>\n<li>Jony odpowiedzialne?<\/li>\n<li>Nazwa reakcji po dodaniu HCl?<\/li>\n<li>Równanie jonowe skrócone.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<p><strong>1.<\/strong> Zasadowy.<\/p>\n<p><strong>2.<\/strong> OH⁻.<\/p>\n<p><strong>3.<\/strong> Zobojętnianie.<\/p>\n<p><strong>4.<\/strong> H⁺ + OH⁻ → H₂O.<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<p><strong>Zadanie 2.<\/strong> Do roztworu soli Fe(III) dodano kilka kropli NaOH bez nadmiaru. Powstał brunatny osad.<\/p>\n<ol>\n<li>Równanie cząsteczkowe.<\/li>\n<li>Typ reakcji.<\/li>\n<li>Jeżeli NaOH dodano bez nadmiaru, dlaczego po wytrąceniu Fe(OH)₃ nie obserwuje się wyraźnie zasadowego odczynu?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<p><strong>1.<\/strong> FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl.<\/p>\n<p><strong>2.<\/strong> Reakcja strąceniowa.<\/p>\n<p><strong>3.<\/strong> Bez nadmiaru NaOH jony OH⁻ zostały praktycznie w całości zużyte na wytrącenie Fe(OH)₃. Sam osad jest praktycznie nierozpuszczalny, więc nie uwalnia jonów OH⁻ do roztworu — stężenie OH⁻ jest zbyt małe, aby odczyn był wyraźnie zasadowy.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"test\">\n<div class=\"part-heading\"><span class=\"part-num\">18<\/span> Test końcowy<\/div>\n<p>Kliknij odpowiedź — od razu zobaczysz, czy jest poprawna. Bez limitu czasu.<\/p>\n<div class=\"quiz-wrap\" id=\"quizWrap\"><\/div>\n<div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<div class=\"card card-understand\" style=\"margin-top:18px;\">\n<span class=\"card-label\">Ćwiczenie — współczynniki (bez limitu czasu)<\/span>\n<p>Uzupełnij i sprawdź w odpowiedzi poniżej.<\/p>\n<pre class=\"step-flow\">FeCl₃ + ___ NaOH → Fe(OH)₃↓ + ___ NaCl\nCuSO₄ + ___ NaOH → Cu(OH)₂↓ + ___ Na₂SO₄\nAlCl₃ + ___ NaOH → Al(OH)₃↓ + ___ NaCl<\/pre>\n<details class=\"answer\"><summary>Pokaż współczynniki<\/summary>\n<p><span class=\"formula\" data-rx=\"fecl3Naoh\">FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl<\/span><\/p>\n<p><span class=\"formula\" data-rx=\"cuso4Naoh\">CuSO₄ + 2NaOH → Cu(OH)₂↓ + Na₂SO₄<\/span><\/p>\n<p><span class=\"formula\" data-rx=\"alcl3Naoh\">AlCl₃ + 3NaOH → Al(OH)₃↓ + 3NaCl<\/span><\/p>\n<p class=\"mini-note\">Liczba OH⁻ = wartość bezwzględna ładunku kationu metalu. Potem domknij bilans atomów Cl / SO₄.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"karta\">\n<div class=\"part-heading\"><span class=\"part-num\">19<\/span> Karta szybkiego powtórzenia (do druku) <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Najważniejsze w 8 punktach<\/span>\n<ol>\n<li><strong>Wodorotlenek<\/strong> = kation metalu + n grup OH⁻; wzór M(OH)ₙ, n = wartość bezwzględna ładunku kationu (<a href=\"#budowa\">§5<\/a>).<\/li>\n<li><strong>Nawias<\/strong> tylko gdy OH⁻ &gt; 1: NaOH, Ca(OH)₂, Al(OH)₃; nazwa: wodorotlenek + metal (+ cyfra rzymska dla Fe, Cu…).<\/li>\n<li><strong>Rozpuszczalne<\/strong>: NaOH, KOH, LiOH, Ba(OH)₂; Ca(OH)₂ trudno; osady: Cu(OH)₂ (niebieski), Fe(OH)₃ (brunatny), Mg(OH)₂, Al(OH)₃, Zn(OH)₂ (białe) (<a href=\"#rozpuszczalnosc-tabela\">§6.2<\/a>).<\/li>\n<li><strong>Zasada<\/strong> = wodny roztwór wodorotlenku z jonami OH⁻; dysocjacja Ca(OH)₂ → Ca²⁺ + 2OH⁻ (<a href=\"#wodorotlenek-vs-zasada\">§6.3<\/a>).<\/li>\n<li><strong>Wskaźniki w zasadzie<\/strong>: fenoloftaleina malinowa, oranż metylowy żółty, papierek niebieski (<a href=\"#ph-wskazniki\">§6.4<\/a>).<\/li>\n<li><strong>Otrzymywanie<\/strong>: tlenek + woda; metal aktywny + woda (+ H₂↑); sól + zasada → osad (<a href=\"#otrzymywanie\">§7<\/a>).<\/li>\n<li><strong>Zobojętnianie<\/strong>: wodorotlenek + kwas → sól + woda; H⁺ + OH⁻ → H₂O (<a href=\"#zobojetnianie\">§8.1<\/a>).<\/li>\n<li><strong>Woda wapienna + CO₂<\/strong> → CaCO₃↓ (mętnienie); NaOH/KOH higroskopijne i żrące (<a href=\"#wapno\">§6.5<\/a>, <a href=\"#bhp\">§9.2<\/a>).<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Strategia na E8 — 4 kroki przy wzorze<\/span>\n<ol>\n<li><strong>Kation<\/strong> — jaki metal i jaki ładunek? (Na⁺ / Ca²⁺ / Al³⁺ / Fe³⁺…)<\/li>\n<li><strong>Liczba OH⁻<\/strong> = wartość bezwzględna ładunku kationu.<\/li>\n<li><strong>Nawias?<\/strong> tylko gdy OH⁻ więcej niż 1.<\/li>\n<li><strong>Kontrola<\/strong> — suma ładunków = 0; indeks za nawiasem mnoży całą grupę.<\/li>\n<\/ol>\n<p class=\"mini-note\">Na kartce egzaminacyjnej zapisz najpierw ładunek, potem dopiero wzór. To zmniejsza liczbę błędów typu CaOH₂.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Schemat W–K–S–K a wodorotlenki<\/span>\n<p>Wodorotlenek łączy się z <strong>kwasem<\/strong> (zobojętnianie) i powstaje z <strong>tlenku<\/strong> (lub metalu / soli). Na mapie przemian:<\/p>\n<p style=\"text-align:center;margin:12px 0;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.9;\">\n<strong>Tlenek zasadowy<\/strong> + H₂O → <strong>Wodorotlenek<\/strong><br/>\n<strong>Wodorotlenek<\/strong> + kwas → <strong>Sól<\/strong> + H₂O<br/>\n<strong>Sól<\/strong> + zasada → <strong>Wodorotlenek↓<\/strong> + sól\n      <\/p>\n<p>Zapamiętaj: wodorotlenek stoi między tlenkiem a solą w łańcuchu przemian.<\/p>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"fiszki\">\n<div class=\"part-heading\"><span class=\"part-num\">20<\/span> Fiszki<\/div>\n<div class=\"flashcard-grid\">\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Co to wodorotlenek?<\/span>\n<span class=\"back\"><strong>Związek z kationu metalu i anionu OH⁻.<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Wzór ogólny<\/span>\n<span class=\"back\"><strong>M(OH)ₙ, n = liczba grup OH⁻. W typowych wodorotlenkach kl. 8 równa wartości bezwzględnej ładunku kationu.<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Kiedy nawias?<\/span>\n<span class=\"back\"><strong>Gdy OH⁻ powtarza się więcej niż raz.<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Wiązania w modelu OH⁻<\/span>\n<span class=\"back\"><strong>O–H ciągłe (kowalencyjne spolaryzowane); M···O przerywane (oddziaływanie jonowe). Model szkolny, nie sieć kryształu.<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Dlaczego nie CaOH₂?<\/span>\n<span class=\"back\"><strong>Indeks 2 dotyczyłby tylko H. Poprawnie: Ca(OH)₂ — dwie całe grupy OH⁻ (= Ca₁O₂H₂).<\/strong><\/span>\n<span class=\"card-tag tag-error\">błąd E8<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Elektrolit a zasada<\/span>\n<span class=\"back\"><strong>Roztwór NaOH ma jony Na⁺ i OH⁻ → przewodzi prąd (elektrolit) i ma odczyn zasadowy.<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Higroskopijność<\/span>\n<span class=\"back\"><strong>NaOH i KOH pochłaniają wilgoć z powietrza i „rozpływają się”. Szczelne naczynia!<\/strong><\/span>\n<span class=\"card-tag tag-exam\">E8<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Woda wapienna vs mleko<\/span>\n<span class=\"back\"><strong>Woda wapienna = klarowny nasycony roztwór Ca(OH)₂. Mleko = mętna zawiesina.<\/strong><\/span>\n<span class=\"card-tag tag-exam\">E8<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Zobojętnianie — produkty<\/span>\n<span class=\"back\"><strong>sól + woda<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">NaOH + HCl → ?<\/span>\n<span class=\"back\"><strong>NaCl + H₂O<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Ca(OH)₂ + 2HCl → ?<\/span>\n<span class=\"back\"><strong>CaCl₂ + 2H₂O<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Fenoloftaleina w zasadzie<\/span>\n<span class=\"back\"><strong>Malinowa<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Dobrze rozpuszczalne wodorotlenki<\/span>\n<span class=\"back\"><strong>NaOH, KOH, LiOH, Ba(OH)₂; Ca(OH)₂ trudno, ale tworzy wodę wapienną<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Dysocjacja NaOH<\/span>\n<span class=\"back\"><strong>NaOH → Na⁺ + OH⁻<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Barwa Fe(OH)₃<\/span>\n<span class=\"back\"><strong>Brunatna (rdzawa)<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Amfoteryczne wodorotlenki<\/span>\n<span class=\"back\"><strong>Al(OH)₃, Zn(OH)₂<\/strong><\/span>\n<span class=\"card-tag tag-extra\">ambitny<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Wodorotlenek vs zasada<\/span>\n<span class=\"back\"><strong>Wodorotlenek = substancja. Zasada = wodny roztwór wodorotlenku dostarczający OH⁻.<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Równanie jonowe skrócone zobojętniania<\/span>\n<span class=\"back\"><strong>H⁺ + OH⁻ → H₂O<\/strong><\/span>\n<span class=\"card-tag tag-extra\">ambitny<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Woda wapienna + CO₂ → ?<\/span>\n<span class=\"back\"><strong>CaCO₃↓ + H₂O — roztwór mętnieje (wykrywanie CO₂)<\/strong><\/span>\n<span class=\"card-tag tag-exam\">E8<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Barwa Cu(OH)₂<\/span>\n<span class=\"back\"><strong>Niebieska (galaretowaty osad)<\/strong><\/span>\n<span class=\"card-tag tag-basic\">podstawa<\/span>\n<\/button>\n<button class=\"flashcard\" onclick=\"toggleFlashcard(this)\">\n<span class=\"front\">Wapno palone, gaszone<\/span>\n<span class=\"back\"><strong>Palone = CaO; gaszone = Ca(OH)₂<\/strong><\/span>\n<span class=\"card-tag tag-exam\">E8<\/span>\n<\/button>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"mapa\">\n<div class=\"part-heading\"><span class=\"part-num\">21<\/span> Mapa pojęć<\/div>\n<div class=\"card map-card\">\n<div class=\"mmx\"><div class=\"mmx-box\" style=\"--mm:#0d6868\"><b>WODOROTLENEK<\/b><ul><li>kation metalu + aniony OH⁻<\/li><li>substancja stała (kryształ, osad)<\/li><li>sieć jonowa, nie cząsteczka H–O–M–O–H<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#b06f1c\"><b>M(OH)ₙ — kation + n grup OH⁻<\/b><ul><li>n = liczba grup OH⁻ (w prostych wodorotlenkach = wartościowość kationu)<\/li><li>suma ładunków = 0<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#2e7d4f\"><b>WZORY I NAZWY<\/b><ul><li>NaOH, KOH, Ca(OH)₂<\/li><li>Al(OH)₃, Fe(OH)₃<\/li><li>Cu(OH)₂, Mg(OH)₂<\/li><li>nawias gdy OH &gt; 1<\/li><li>cyfra rzymska: Fe, Cu, Sn, Pb<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#b06f1c\"><b>ROZPUSZCZALNOŚĆ<\/b><ul><li>✓ NaOH, KOH, LiOH, Ba(OH)₂<\/li><li>~ Ca(OH)₂, Mg(OH)₂<\/li><li>× Fe(OH)₃, Cu(OH)₂, Al(OH)₃<\/li><li>Ca(OH)₂ = woda wapienna<\/li><li>mleko wapienne = zawiesina<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#2b5e9c\"><b>ZASADA I DYSOCJACJA<\/b><ul><li>zasada = wodny roztwór wodorotlenku<\/li><li>NaOH → Na⁺ + OH⁻<\/li><li>elektrolit — przewodzi prąd<\/li><li>rozpuszczalny ≠ mocny<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#6b3fa0\"><b>WŁAŚCIWOŚCI<\/b><ul><li>odczyn zasadowy<\/li><li>wskaźniki<\/li><li>zobojętnianie<\/li><li>tylko rozpuszczalne<\/li><li>NaOH, KOH: higroskopijne, żrące<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#2b5e9c\"><b>OTRZYMYWANIE<\/b><ul><li>1. tlenek + woda<\/li><li>2. metal aktywny + woda<\/li><li>3. sól + zasada<\/li><li>zależnie od wodorotlenku<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#b83a45\"><b>ZOBOJĘTNIANIE<\/b><ul><li>wodorotlenek + kwas<\/li><li>→ sól + woda<\/li><li>H⁺ + OH⁻ → H₂O<\/li><li>jony widzowe: Na⁺, Cl⁻<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#2e7d4f\"><b>INNE REAKCJE<\/b><ul><li>zasada + CO₂ → sól + woda<\/li><li>ogrzewanie → tlenek + woda<\/li><li>strącanie → osad o barwie kationu<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#6b3fa0\"><b>AMFOTERYCZNOŚĆ<\/b><ul><li>Al(OH)₃, Zn(OH)₂<\/li><li>+ kwasy, + zasady<\/li><li>poziom rozszerzony<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#b06f1c\"><b>Ca(OH)₂ — WAPNO<\/b><ul><li>palone CaO → gaszone Ca(OH)₂<\/li><li>mleko (zawiesina) → woda (roztwór)<\/li><li>wykrywanie CO₂, zaprawa<\/li><\/ul><\/div><div class=\"mmx-box\" style=\"--mm:#1a2332\"><b>MOSTY: tlenki · kwasy · sole<\/b><ul><li>N01: tlenek zasadowy + woda<\/li><li>N03: kwas + zasada<\/li><li>N04: sól + zasada, produkt zobojętniania<\/li><\/ul><\/div><\/div>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"slownik\">\n<div class=\"part-heading\"><span class=\"part-num\">22<\/span> Słownik<\/div>\n<div class=\"card\">\n<dl class=\"def-list\">\n<div class=\"def-item\"><dt>Higroskopijność<\/dt><dd>Zdolność substancji do pochłaniania wilgoci z powietrza (np. NaOH, KOH).<\/dd><\/div>\n<div class=\"def-item\"><dt>Elektrolit<\/dt><dd>Substancja, której roztwór wodny przewodzi prąd dzięki jonom.<\/dd><\/div>\n<div class=\"def-item\"><dt>Woda wapienna<\/dt><dd>Klarowny, nasycony roztwór Ca(OH)₂; mętnieje z CO₂.<\/dd><\/div>\n<div class=\"def-item\"><dt>Wodorotlenek<\/dt><dd>Związek zawierający kation metalu i anion OH⁻. W zapisie szkolnym spotyka się NH₄OH, ale roztwór amoniaku opisujemy dokładniej przez równowagę NH₃ + H₂O ⇌ NH₄⁺ + OH⁻.<\/dd><\/div>\n<div class=\"def-item\"><dt>Grupa wodorotlenkowa OH⁻<\/dt><dd>Anion o ładunku −1, składający się z tlenu i wodoru.<\/dd><\/div>\n<div class=\"def-item\"><dt>Zasada (szkolnie)<\/dt><dd>Wodny roztwór niektórych wodorotlenków, który zawiera jony OH⁻ i ma odczyn zasadowy. W szerszym ujęciu zasadą może być także substancja niezawierająca grup OH⁻, np. amoniak NH₃.<\/dd><\/div>\n<div class=\"def-item\"><dt>Zobojętnianie<\/dt><dd>Reakcja kwasu z zasadą → sól + woda.<\/dd><\/div>\n<div class=\"def-item\"><dt>Wskaźnik<\/dt><dd>Substancja zmieniająca barwę zależnie od pH.<\/dd><\/div>\n<div class=\"def-item\"><dt>Strącanie<\/dt><dd>Reakcja, w której powstaje trudno rozpuszczalny osad.<\/dd><\/div>\n<div class=\"def-item\"><dt>Mleko wapienne<\/dt><dd>Zawiesina nierozpuszczonego Ca(OH)₂ w wodzie.<\/dd><\/div>\n<div class=\"def-item\"><dt>Hydrat<\/dt><dd>Związek z cząsteczkami wody w sieci, np. CuSO₄·5H₂O.<\/dd><\/div>\n<div class=\"def-item\"><dt>Amfoteryczny<\/dt><dd>Reagujący i z kwasami, i z zasadami.<\/dd><\/div>\n<div class=\"def-item\"><dt>Dysocjacja elektrolityczna<\/dt><dd>Rozpad związku na jony w wodzie (Arrhenius).<\/dd><\/div>\n<div class=\"def-item\"><dt>Nieelektrolit<\/dt><dd>Substancja, której roztwór nie przewodzi prądu, bo nie zawiera swobodnych jonów (np. cukier).<\/dd><\/div>\n<div class=\"def-item\"><dt>Jony widzowe<\/dt><dd>Jony, które nie zmieniają się w reakcji (np. Na⁺ i Cl⁻ przy zobojętnianiu NaOH kwasem solnym); pomija się je w równaniu jonowym skróconym.<\/dd><\/div>\n<div class=\"def-item\"><dt>Odczyn zasadowy<\/dt><dd>Odczyn roztworu o pH &gt; 7 — nadmiar jonów OH⁻ względem czystej wody.<\/dd><\/div>\n<div class=\"def-item\"><dt>Wapno palone / gaszone<\/dt><dd>CaO / Ca(OH)₂.<\/dd><\/div>\n<div class=\"def-item\"><dt>Teoria Brønsteda<\/dt><dd>Kwas = donor protonu H⁺, zasada = akceptor H⁺.<\/dd><\/div>\n<\/dl>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"checklista\">\n<div class=\"part-heading\"><span class=\"part-num\">23<\/span> Checklista<\/div>\n<div class=\"checklist\">\n<h4>Sprawdź, czy umiesz:<\/h4>\n<ul>\n<li>Zapisać wzór wodorotlenku dla dowolnego kationu.<\/li>\n<li>Potrafię zapisać wzory: NaOH, KOH, Ca(OH)₂, Al(OH)₃, Cu(OH)₂ i podać nazwy<\/li>\n<li>Zastosować nawias, gdy grupa OH⁻ powtarza się więcej niż raz.<\/li>\n<li>Nazwać wodorotlenek (z cyfrą rzymską dla Fe, Cu, Sn, Pb).<\/li>\n<li>Potrafię narysować szkolny model poglądowy Ca(OH)₂ i Al(OH)₃ (O–H ciągła, M···O przerywana) i wiem, że to nie jest wzór strukturalny cząsteczki<\/li>\n<li>Rozróżnić wodorotlenki rozpuszczalne i nierozpuszczalne.<\/li>\n<li>Rozróżnić wodorotlenek (substancja) od zasady (roztwór); znam pojęcie elektrolitu.<\/li>\n<li>Zapisać dysocjację zasady.<\/li>\n<li>Opisać odczyn zasadowy i wskaźniki.<\/li>\n<li>Znam higroskopijność NaOH/KOH i BHP ługów<\/li>\n<li>Rozróżniam wapno palone, gaszone, mleko i wodę wapienną<\/li>\n<li>Zapisać reakcję niektórych tlenków zasadowych metali aktywnych z wodą, np. CaO + H₂O → Ca(OH)₂.<\/li>\n<li>Wyjaśnić, dlaczego nie każdy tlenek reaguje z wodą.<\/li>\n<li>Rozpoznać, że metal aktywny + woda → wodorotlenek + wodór.<\/li>\n<li>Zapisać reakcję strącania z soli i zasady. Podać barwę osadu Cu(OH)₂ i Fe(OH)₃.<\/li>\n<li>Zapisać reakcję zobojętniania.<\/li>\n<li>Zapisać reakcję wody wapiennej z CO₂.<\/li>\n<li>(ambitnie) Wyjaśnić amfoteryczność.<\/li>\n<li>(ambitnie) Zapisać równanie jonowe skrócone.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"wskazowki\">\n<div class=\"part-heading\"><span class=\"part-num\">24<\/span> Wskazówki do nauki<\/div>\n<div class=\"tips-box\">\n<h4>Jak uczyć się skuteczniej — nie plan, tylko porady<\/h4>\n<p style=\"margin-bottom:14px;font-size:13.5px;color:var(--text-soft);\">Każdy uczy się inaczej i w swoim tempie. Poniżej zbiór wskazówek, które możesz wykorzystać w dowolnej kolejności.<\/p>\n<div class=\"tips-list\">\n<div class=\"tip-card\">\n<b>Odtwarzaj, nie zapamiętuj<\/b>\n          Nie ucz się wzorów na pamięć. Zawsze zaczynaj od ładunku kationu i policz, ile grup OH⁻ potrzebujesz. Wzór sam się zbuduje.\n        <\/div>\n<div class=\"tip-card\">\n<b>Używaj modeli naprzemiennie<\/b> Po przeczytaniu teorii od razu otwórz model: wzór wodorotlenku (<a href=\"#wzor-ogolny\">§5.2<\/a>), przegląd (<a href=\"#rozpuszczalnosc-tabela\">§6.2<\/a>), strącanie (<a href=\"#ion-lab\">§12<\/a>). Wzrokowiec zapamiętuje szybciej, gdy widzi i robi.\n        <\/div>\n<div class=\"tip-card\">\n<b>Fiszki w krótkich sesjach<\/b>\n          Lepiej 5 minut dziennie niż 30 minut raz w tygodniu. Fiszki są do szybkiego przypominania — nie czytaj ich jak podręcznika.\n        <\/div>\n<div class=\"tip-card\">\n<b>Sprawdzaj się po każdej sekcji<\/b>\n          Po każdej sekcji teoretycznej otwórz ćwiczenia i spróbuj rozwiązać 2–3 zadania. To pokaże, czy naprawdę rozumiesz, czy tylko rozpoznajesz.\n        <\/div>\n<div class=\"tip-card\">\n<b>Rysuj wzory ręcznie<\/b>\n          Narysuj na kartce Ca(OH)₂ z kationem i dwiema grupami OH⁻. Ręczne rysowanie utrwala strukturę lepiej niż czytanie.\n        <\/div>\n<div class=\"tip-card\">\n<b>Łącz z życiem codziennym<\/b>\n          Zauważ, gdzie w domu spotykasz wodorotlenki (środki czystości, leki na zgagę, wapno budowlane). Konkret zapamiętuje się łatwiej niż abstrakcja.\n        <\/div>\n<div class=\"tip-card\">\n<b>Powtarzaj błędy, nie tylko sukcesy<\/b>\n          Wróć do „Kliniki błędów\" i zapisz sobie trzy najczęstsze pułapki. Świadomość błędów chroni przed ich powtarzaniem.\n        <\/div>\n<div class=\"tip-card\">\n<b>Wracaj do mapy pojęć<\/b>\n          Na końcu nauki otwórz mapę pojęć i spróbuj samodzielnie odtworzyć połączenia. To test globalnego zrozumienia.\n        <\/div>\n<\/div>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"historia\">\n<div class=\"part-heading\"><span class=\"part-num\">A<\/span> Dodatek A — Historia odkrycia <span class=\"level-badge level-extra\">NADPROGRAMOWE<\/span><\/div>\n<p>Skąd wiemy to, co wiemy? Poznanie wodorotlenków to ponad 200 lat obserwacji. Pięć momentów, które doprowadziły do dzisiejszej definicji.<\/p>\n<div class=\"hist-grid\"><figure class=\"hist-card\"><div class=\"hist-year\">1754<\/div><div class=\"hist-who\">Joseph Black<\/div><div class=\"hist-ill\"><div class=\"svgx\"><span>alkalia — substancje „mydlące”<\/span><span>wapno<\/span><span>potaż<\/span><span>soda<\/span><\/div><\/div><figcaption>Badał substancje alkaliczne (wapno, potaż, sodę). Pokazał, że „powietrze stałe” (CO₂) wiąże się z alkaliami — początek chemii zasad.<\/figcaption><\/figure><figure class=\"hist-card\"><div class=\"hist-year\">1807–08<\/div><div class=\"hist-who\">Humphry Davy<\/div><div class=\"hist-ill\"><div class=\"svgx\"><span>K / Na<\/span><span>O₂<\/span><span>+ −<\/span><span>elektroliza stopionych alkaliów<\/span><\/div><\/div><figcaption>Przez elektrolizę otrzymał potas i sód z alkaliów. Pokazał, że alkalia żrące — „potaż” i „soda” — są związkami nieznanych wcześniej metali: potasu i sodu. Metale litowców istnieją!<\/figcaption><\/figure><figure class=\"hist-card\"><div class=\"hist-year\">1810–20<\/div><div class=\"hist-who\">Gay-Lussac i Thenard<\/div><div class=\"hist-ill\"><div class=\"svgx\"><span>skład alkaliów = metal + tlen + wodór<\/span><span>Na<\/span><span>O<\/span><span>H<\/span><span>Na + O + H → NaOH<\/span><\/div><\/div><figcaption>Ustalili, że alkalia to połączenia metalu, tlenu i wodoru — droga do wzoru NaOH i pojęcia wodorotlenku.<\/figcaption><\/figure><figure class=\"hist-card\"><div class=\"hist-year\">1887<\/div><div class=\"hist-who\">Svante Arrhenius<\/div><div class=\"hist-ill\"><div class=\"svgx\"><span>dysocjacja w wodzie<\/span><span>Na⁺<\/span><span>OH⁻<\/span><span>H₂O<\/span><span>zasada → jony OH⁻ (definicja szkolna)<\/span><\/div><\/div><figcaption>Teoria dysocjacji elektrolitycznej: zasada to substancja, która w wodzie daje jony OH⁻. To definicja, której uczysz się na E8. Zob. <a href=\"#wodorotlenek-vs-zasada\">§6.3<\/a>.<\/figcaption><\/figure><figure class=\"hist-card\"><div class=\"hist-year\">1923<\/div><div class=\"hist-who\">Brønsted i Lowry<\/div><div class=\"hist-ill\"><div class=\"svgx\"><span>teoria protonowa (liceum)<\/span><span>H⁺<\/span><span>NH₃<\/span><span>donor<\/span><span>akceptor protonu<\/span><span>NH₃ + H₂O ⇌ NH₄⁺ + OH⁻<\/span><\/div><\/div><figcaption>Zasada = akceptor protonu H⁺. NH₃ jest zasadą mimo braku OH⁻ we wzorze — to poziom liceum, na E8 wystarczy Arrhenius. Zob. <a href=\"#ambitny\">Dodatek B<\/a>.<\/figcaption><\/figure><\/div>\n<\/section>\n<section class=\"section\" id=\"ambitny\">\n<div class=\"part-heading\"><span class=\"part-num\">B<\/span> Dodatek B — teorie kwasów i zasad, hydraty <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Teoria Brønsteda i Lowry'ego — kim byli?<\/span>\n<p><strong>Johannes Nicolaus Brønsted<\/strong> (1879–1947) — duński chemik fizyczny. <strong>Thomas Martin Lowry<\/strong> (1874–1936) — angielski chemik. W 1923 roku niezależnie od siebie zaproponowali nową definicję kwasów i zasad.<\/p>\n<p><strong>Ich definicja (teoria protonowa):<\/strong><\/p>\n<ul>\n<li><strong>Kwas<\/strong> = substancja, która oddaje proton H⁺ (donor protonu).<\/li>\n<li><strong>Zasada<\/strong> = substancja, która przyjmuje proton H⁺ (akceptor protonu).<\/li>\n<\/ul>\n<p><strong>Dlaczego to ważne?<\/strong> Teoria Arrheniusa (szkolna) mówi, że zasada to substancja dająca jony OH⁻ w wodzie. Ale w teorii Brønsteda <strong>amoniak NH₃<\/strong> jest zasadą, bo przyjmuje proton H⁺ od wody:<\/p>\n<div class=\"jb-eq\" style=\"background:var(--c-extra-bg);border:1px solid var(--c-extra-line);color:var(--c-extra);padding:10px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-weight:700;margin:10px 0;\">NH₃ + H₂O ⇌ NH₄⁺ + OH⁻<\/div>\n<p>NH₃ nie ma w cząsteczce grupy OH⁻ — a jednak jest zasadą, bo przyjmuje H⁺ od wody. To rozszerza pojęcie zasady na substancje bez grupy OH⁻. Na poziomie szkoły podstawowej (E8) wystarczy definicja Arrheniusa, ale warto wiedzieć, że w liceum zobaczysz definicję Brønsteda.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Teoria Lewisa — jeszcze szersza definicja <span class=\"adv-tag\">poziom akademicki<\/span><\/summary><div class=\"adv-body\"><p>Gilbert N. Lewis (1923): <strong>zasada<\/strong> to donor pary elektronowej, <strong>kwas<\/strong> — jej akceptor. Jon OH⁻ i cząsteczka NH₃ są zasadami Lewisa (mają wolną parę elektronową), a np. Al³⁺ czy BF₃ — kwasami Lewisa. Powstawanie jonu [Al(OH)₄]⁻ (<a href=\"#amfoterycznosc\">§14<\/a>) to reakcja kwasu Lewisa Al(OH)₃ z zasadą Lewisa OH⁻.<\/p><\/div><\/details>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Hydraty — poza E8<\/span>\n<p><strong>Hydraty<\/strong> to związki z cząsteczkami wody wbudowanymi w sieć krystaliczną. Jest to osobne zagadnienie, omawiane przede wszystkim przy solach, np. <span class=\"formula\">CuSO₄·5H₂O<\/span> (sam hydrat soli nie jest wodorotlenkiem). Na poziomie E8 nie jest wymagane tworzenie wzorów hydratów ani przypisywanie hydratu do konkretnego wodorotlenku. Niektóre wodorotlenki tworzą hydraty (np. <span class=\"formula\">Ba(OH)₂·8H₂O<\/span> — dlatego tablice podają jego rozpuszczalność dla hydratu), ale na E8 nie wymaga się ich wzorów.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Pozostałe zagadnienia ambitne — gdzie są w lekcji<\/span>\n<ul>\n<li><strong>Amfoteryczność<\/strong> Al(OH)₃ i Zn(OH)₂ — <a href=\"#amfoterycznosc\">§14<\/a>.<\/li>\n<li><strong>AgOH, CuOH<\/strong> — nietrwałe wodorotlenki, równania rozkładu — <a href=\"#nazwy\">§5.4<\/a>.<\/li>\n<li><strong>Moc a rozpuszczalność<\/strong>, iloczyn rozpuszczalności — <a href=\"#moc-rozpuszczalnosc\">§10.3<\/a>.<\/li>\n<li><strong>Równania jonowe<\/strong> — <a href=\"#rownania-jonowe\">§13<\/a>; <strong>hydroksokompleksy<\/strong> — <a href=\"#ion-lab\">§12<\/a>.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"modele-silnika\">\n<div class=\"part-heading\"><span class=\"part-num\">↻<\/span> Modele silnika w tej lekcji<\/div>\n<div class=\"table-wrap table-compact\"><table><thead><tr><th>Model<\/th><th>Co pokazuje<\/th><th>Gdzie<\/th><\/tr><\/thead><tbody>\n<tr><td><code>n02-wzory-v01<\/code><\/td><td>Wzór wodorotlenku: bilans ładunków, nawias, modele A/B/jony<\/td><td><a href=\"#wzor-ogolny\">§5.2<\/a><\/td><\/tr>\n<tr><td><code>tabela-rozpuszczalnosci-v01<\/code><\/td><td>Tabela rozpuszczalności (kolumna OH⁻)<\/td><td><a href=\"#rozpuszczalnosc-tabela\">§6.2<\/a><\/td><\/tr>\n<tr><td><code>n02-przeglad-v01<\/code><\/td><td>Kafelki wodorotlenków: rozpuszczalność, barwa, odczyn<\/td><td><a href=\"#rozpuszczalnosc-tabela\">§6.2<\/a><\/td><\/tr>\n<tr><td><code>n02-dysocjacja-v01<\/code><\/td><td>Rozpuszczanie, dysocjacja, efekt cieplny<\/td><td><a href=\"#wodorotlenek-vs-zasada\">§6.3<\/a><\/td><\/tr>\n<tr><td><code>ph-indicators-v03<\/code><\/td><td>Panel pH i barwy wskaźników (także doświadczenie E)<\/td><td><a href=\"#ph-wskazniki\">§6.4<\/a><\/td><\/tr>\n<tr><td><code>gfx-scene-indicatorRack<\/code><\/td><td>Wskaźnik w siedmiu roztworach<\/td><td><a href=\"#ph-wskazniki\">§6.4<\/a><\/td><\/tr>\n<tr><td><code>n02-otrzymywanie-v01<\/code><\/td><td>Trzy metody otrzymywania i mapa przemian<\/td><td><a href=\"#metody\">§7.1<\/a><\/td><\/tr>\n<tr><td><code>n02-zobojetnianie-v01<\/code><\/td><td>Zobojętnianie: licznik moli, pH, krzywa<\/td><td><a href=\"#zobojetnianie\">§8.1<\/a><\/td><\/tr>\n<tr><td><code>n02-reaktor-v01<\/code><\/td><td>Reaktor: wodorotlenek + odczynnik<\/td><td><a href=\"#mapa-przemian\">§8.3<\/a><\/td><\/tr>\n<tr><td><code>n02-stracanie-v01<\/code><\/td><td>Laboratorium jonowe — strącanie 13 wodorotlenków<\/td><td><a href=\"#ion-lab\">§12<\/a><\/td><\/tr>\n<tr><td><code>rownania-jonowe-v01<\/code><\/td><td>Równania jonowe — wszystkie reakcje (strącanie, zobojętnianie)<\/td><td><a href=\"#rownania-jonowe\">§13<\/a><\/td><\/tr>\n<tr><td><code>n02-doswiadczenia-v01<\/code><\/td><td>Pracownia: 26 doświadczeń z wodorotlenkami<\/td><td><a href=\"#doswiadczenia\">§15<\/a><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"mini-note\">Każdy model ma w lekcji jeden przycisk. Zobojętnianie w trzech poziomach zapisu pokazuje model „Równania jonowe” (reakcja HCl + NaOH).<\/p>\n<\/section>\n<section class=\"section\" id=\"audyt\">\n<div class=\"part-heading\"><span class=\"part-num\">✓<\/span> Audyt jakości<\/div><div class=\"card card-new\"><span class=\"card-label\">v9.0 (2026-10-07) — redakcja według standardu lekcji<\/span><ul><li>Nowy układ: start (1–4) → rdzeń E8 (5–9: definicja i budowa, właściwości, otrzymywanie, reakcje, zastosowania i BHP) → rozumienie / ambitne (10–14) → praktyka (15–18) → powtórka (19–24) → dodatki A–B → modele silnika.<\/li><li>Scalono powtórzenia: Ściąga (dawna §7), Model bez skrótów (§8) i Wyjaśnienie (§9) — każdy temat ma jedno pełne miejsce, w innych tylko odnośnik.<\/li><li>Uzupełnienia: tabela wskaźników i skala pH, dysocjacja zasad, reakcja z CO₂ i rozkład termiczny, strącanie Mg(OH)₂, Al(OH)₃, Fe(OH)₂, równania jonowe strąceń, struktura warstwowa Ca(OH)₂ (akademickie), teoria Lewisa, karta powtórzenia, tabela modeli silnika.<\/li><li>Poprawki: Ca(OH)₂ w rolnictwie (wapnowanie, nie „bielenie”), opis odkrycia Davy’ego, „dwa jony OH⁻”, poprawnie zamknięty blok o hydroksokompleksach, odnośniki §.<\/li><\/ul><\/div><div class=\"card card-new\"><span class=\"card-label\">v8.1 CHE (2026-10) — integracja z silnikiem<\/span><ul><li>Widgety wbudowane zastąpione modelami silnika: n02-wzory, n02-przeglad, n02-otrzymywanie, n02-stracanie, n02-zobojetnianie, n02-dysocjacja, n02-reaktor, n02-doswiadczenia (CHE.HYDROXIDES, GFX.rx, GFX.ions, CHE.sim.ParticleSim).<\/li><li>Rozpuszczalność czytana z tabeli rozpuszczalności silnika; tabela 5.9 i równania oznaczone (audyt LES-N02).<\/li><li>Poprawki: mnemotechnika OH⁻, hydraty (Ba(OH)₂·8H₂O), Mg(OH)₂ = praktycznie nierozpuszczalny (zgodnie z tabelą), warunek strącania Ca(OH)₂, model poglądowy w checkliście.<\/li><li>Doświadczenia: jedna lista A–H w formacie egzaminacyjnym (usunięte dublujące się karty 1–4). Korekty v8.03/v8.04 włączone jako §8.<\/li><li>Nowe treści: tabela ΔH rozpuszczania, iloczyn rozpuszczalności → pH nasyconego roztworu (poziom LO).<\/li><\/ul><\/div>\n<div class=\"audit-panel\">\n<h4>Audyt merytoryczny i funkcjonalny v7.5<\/h4>\n<div class=\"audit-grid\">\n<div class=\"audit-item\"><strong>v7.8 LAB — spójność z Konstruktor Uniwersalny:<\/strong> dodano bezpośrednie przejście do stanowiska LAB i odwrotny link z konstruktora; usunięto nieużywany zewnętrzny font ikon; doprecyzowano „wodorotlenek vs zasada”, opis roztworu NaOH i status zapisu NH₄OH; uporządkowano wzmiankę o hydratach, aby nie przedstawiać Ca(OH)₂·xH₂O jako typowego przykładu wymaganego na E8.<\/div>\n<div class=\"audit-item\"><strong>v7.7 SYNC N02↔Konstruktor (2026-09-26):<\/strong> mosty dwukierunkowe (nawias, rozpuszczalność OH⁻, strącanie, zobojętnianie); kanoniczna lista wodorotlenków E8; reguła OH⁻ ujednolicona; w konstruktorze: feedback nawiasu OH, dodatkowe równania jonowe (Fe/Al/Ca), poprawione linki do CHEMIA_N02_WODOROTLENKI.html. Bez usuwania treści lekcji.<\/div>\n<div class=\"audit-item\"><strong>v7.5 — poprawki na podstawie recenzji:<\/strong> poprawiono opis błędu CaO + H₂O → CaOH w Klinice błędów (dodano precyzyjne wyjaśnienie bilansu atomów wodoru i konieczności nawiasu); uzupełniono opis doświadczenia B o ostrzeżenie przed aerozolem Ca(OH)₂; dodano równania rozkładu AgOH i CuOH w sekcji ciekawostek; doprecyzowano definicję zasady w fiszkach (roztwór wodorotlenku); poprawiono wzmiankę o hydratach wodorotlenków w audycie (usunięto nieścisłość); ujednolicono terminologię w całym dokumencie.<\/div>\n<div class=\"audit-item\"><strong>v7.4 — poprawki na podstawie recenzji:<\/strong> doprecyzowano definicję n we wzorze M(OH)ₙ (dodano zastrzeżenie „na poziomie klasy 8”); ujednolicono klasyfikację Mg(OH)₂ na „trudno rozpuszczalny”; uporządkowano rozróżnienie wodorotlenków i hydratów; wzmocniono BHP NaOH/KOH o ostrzeżenie przed oparzeniami chemicznymi; dodano porównanie rozpuszczalności KOH vs NaOH; dopisano pH wody wapiennej (≈12,4) oraz równanie rozpuszczania osadu CaCO₃ w nadmiarze CO₂ do Ca(HCO₃)₂; dodano tabelę „mleko wapienne vs woda wapienna”; uzupełniono ostrzeżenie o toksyczności Ba²⁺ (nie stosować w doświadczeniach uczniowskich); uzupełniono zastosowanie Al(OH)₃ w lekach na zgagę; dodano w klinice błędów kolumnę „Przykład z życia”; uzupełniono równania zobojętniania o stany skupienia (aq)/(l); doprecyzowano w amfoteryczności, że równania z jonami kompleksowymi nie są wymagane na E8; poprawiono opis doświadczenia B (nie pochylać się nad naczyniem — para może zawierać drobne cząstki Ca(OH)₂).<\/div>\n<div class=\"audit-item\"><strong>v7.3 — poprawki merytoryczne:<\/strong> doprecyzowano definicję n we wzorze M(OH)ₙ; uściślono opis zasady i roztworów trudno rozpuszczalnych wodorotlenków; skorygowano klasyfikację Mg(OH)₂ i Ba(OH)₂; dodano równania rozkładu AgOH i CuOH; poprawiono opis modelu H–O–Ca–O–H jako modelu poglądowego; ujednolicono tabelę przeglądu wodorotlenków; wzmocniono BHP przy sodzie i CaO; doprecyzowano oznaczenie przykładowych wartości pH; poprawiono zakres działania oranżu metylowego (pH 3,1–4,4); zaktualizowano opis doświadczeń.<\/div>\n<div class=\"audit-item\"><strong>v7.1 / v7.2 — wcześniejsze rozszerzenia:<\/strong> Bogatsze SVG w historii odkryć (5 scen); interaktywny quiz klikany (12 pytań + wynik); ćwiczenie współczynników zachowane.<\/div>\n<div class=\"audit-item\"><strong>v6.9 / v7.0 — baza:<\/strong> Domknięta podstawa programowa (wzory, otrzymywanie, dysocjacja, wskaźniki, odczyn, zastosowania, elektrolit, higroskopijność, postacie wapna). Modele podręcznikowe (liniowy + rozgałęziony, legenda wiązań). Widgety: Wzórometr, Bilansator, Konstruktor, lab jonowe, Reaktor, pH, dysocjacja, zobojętnianie. Karty doświadczeń E8, fiszki, test + współczynniki, checklista. Responsywność mobile (pełna szerokość, karty kliniki/amfoteryczności).<\/div>\n<div class=\"audit-item\"><strong>Świadomie poza zakresem tej lekcji:<\/strong> pełny dział kwasów i soli (osobne lekcje); tryb limitu czasu; wersja do druku.<\/div>\n<\/div>\n<p style=\"margin-top:14px;\"><strong>Zachowana cała treść merytoryczna + wszystkie poprawki audytowe + rozbudowane wizualizacje interaktywne.<\/strong><\/p>\n<p><strong>Tryby nauki:<\/strong> Muszę umieć na E8 · Chcę zrozumieć · Idę dalej.<\/p>\n<p><strong>Wizualizacje:<\/strong> modele silnika CHE (lista w karcie v8.1 powyżej).<\/p>\n<p><strong>Numer:<\/strong> to jest <strong>N02<\/strong> (wodorotlenki).<\/p>\n<\/div>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA N02 v9.0<\/strong> · Wodorotlenki · 2026<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<script>\nfunction toggleFlashcard(card){card.classList.toggle('flipped');}\n\nfunction checkError(ans){\n  const el=document.getElementById('errFeedback');\n  el.style.display='block';\n  if(ans==='2'){\n    el.style.background='var(--c-basic-bg)';\n    el.style.color='var(--c-basic)';\n    el.style.borderLeft='4px solid var(--c-basic)';\n    el.innerHTML='<b>Dobrze.<\/b> Ca(OH)₂ zawiera 2 grupy OH⁻. Wapń ma ładunek +2, więc potrzebuje 2 anionów OH⁻.';\n  }else if(ans==='1'){\n    el.style.background='var(--c-error-bg)';\n    el.style.color='var(--c-error)';\n    el.style.borderLeft='4px solid var(--c-error)';\n    el.innerHTML='<b>Nie.<\/b> 1 grupa byłaby w NaOH. W Ca(OH)₂ są 2 grupy.';\n  }else{\n    el.style.background='var(--c-error-bg)';\n    el.style.color='var(--c-error)';\n    el.style.borderLeft='4px solid var(--c-error)';\n    el.innerHTML='<b>Nie.<\/b> 3 grupy byłyby w Al(OH)₃. W Ca(OH)₂ są 2.';\n  }\n}\n<\/script>\n<script>\ndocument.querySelectorAll('a[href^=\"#\"]').forEach(anchor=>{\n  anchor.addEventListener('click',function(e){\n    const targetId=this.getAttribute('href');\n    if(targetId==='#') return;\n    const target=document.querySelector(targetId);\n    if(target){\n      e.preventDefault();\n      const offset=80;\n      const elementPosition=target.getBoundingClientRect().top+window.pageYOffset;\n      window.scrollTo({top:elementPosition-offset,behavior:'smooth'});\n    }\n  });\n});\n<\/script>\n<script>\n(function(){\n  function setupTableHints(){\n    document.querySelectorAll('.table-wrap').forEach(wrap=>{\n      let hint=wrap.previousElementSibling;\n      if(!hint||!hint.classList.contains('table-scroll-hint')){\n        hint=document.createElement('div');\n        hint.className='table-scroll-hint';\n        hint.innerHTML='<span>Przesuń tabelę w bok, aby zobaczyć całość<\/span><span class=\"scroll-arrow\">← ↔ →<\/span>';\n        wrap.parentNode.insertBefore(hint,wrap);\n      }\n      const update=()=>wrap.classList.toggle('is-scrollable',wrap.scrollWidth>wrap.clientWidth+4);\n      update();\n      wrap.addEventListener('scroll',()=>{\n        if(wrap.scrollLeft>8) hint.style.opacity='.45';\n        else hint.style.opacity='1';\n      },{passive:true});\n      if(window.ResizeObserver) new ResizeObserver(update).observe(wrap);\n    });\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setupTableHints);\n  else setupTableHints();\n})();\n<\/script>\n<script>\n(function(){\n  const wrap=document.getElementById('quizWrap');\n  const scoreEl=document.getElementById('quizScore');\n  if(!wrap) return;\n  const questions=[\n    {tag:'P',q:'Co to wodorotlenek?',opts:['Związek z kationu metalu i anionu OH⁻','Każda substancja o odczynie zasadowym','Tlenek metalu rozpuszczony w wodzie','Jon OH⁻ w roztworze'],ok:0,fb:'Wodorotlenek = kation metalu + grupy OH⁻ (np. NaOH, Ca(OH)₂).'},\n    {tag:'P',q:'Kiedy w zapisie wodorotlenku stawiamy nawias?',opts:['Zawsze','Gdy grupa OH⁻ powtarza się więcej niż raz','Tylko dla metali 2. grupy','Nigdy — to błąd'],ok:1,fb:'NaOH bez nawiasu; Ca(OH)₂, Al(OH)₃ — nawias, bo OH⁻ × n.'},\n    {tag:'P',q:'Który zapis jest poprawny dla wodorotlenku wapnia?',opts:['CaOH₂','Ca(OH)₂','Ca₂OH','CaO₂H₂'],ok:1,fb:'CaOH₂ sugeruje, że 2 dotyczy tylko H. Poprawnie: Ca(OH)₂ (= Ca₁O₂H₂).'},\n    {tag:'P',q:'Roztwór NaOH jest elektrolitem, bo:',opts:['Jest żrący','Zawiera swobodne jony Na⁺ i OH⁻','Ma wysoką temperaturę wrzenia','Jest higroskopijny'],ok:1,fb:'Elektrolit = roztwór z jonami, które przewodzą prąd.'},\n    {tag:'T',q:'CaO + H₂O → ?',opts:['CaO₂ + H₂','Ca(OH)₂','Ca + H₂O₂','2CaOH'],ok:1,fb:'Tlenek metalu aktywnego + woda → wodorotlenek.'},\n    {tag:'T',q:'Uzupełnij: FeCl₃ + □ NaOH → Fe(OH)₃↓ + □ NaCl',opts:['1 i 1','2 i 2','3 i 3','6 i 3'],ok:2,fb:'Fe³⁺ wymaga 3× OH⁻ → współczynnik 3.'},\n    {tag:'T',q:'Co obserwujesz po dodaniu NaOH do CuSO₄?',opts:['Brunatny osad','Niebieski osad','Gaz H₂','Nic — reakcja nie zachodzi'],ok:1,fb:'Cu(OH)₂↓ — niebieski, galaretowaty osad.'},\n    {tag:'A',q:'Dlaczego Fe(OH)₃ nie daje wyraźnego odczynu zasadowego?',opts:['Nie zawiera OH⁻','Jest praktycznie nierozpuszczalny — mało OH⁻ w roztworze','Jest kwasem','Reaguje tylko z NaOH'],ok:1,fb:'Odczyn zależy od wolnych OH⁻ w roztworze. Nierozpuszczalny ≈ brak odczynu.'},\n    {tag:'A',q:'Czym różni się wodorotlenek od zasady (definicja szkolna)?',opts:['Niczym — to synonimy','Wodorotlenek = związek; zasada = jego wodny roztwór z OH⁻','Zasada to zawsze gaz','Wodorotlenek to tylko NaOH'],ok:1,fb:'NaOH(s) to wodorotlenek; NaOH(aq) to zasada sodowa.'},\n    {tag:'P',q:'Woda wapienna to:',opts:['Czysty CaO','Mętna zawiesina Ca(OH)₂','Klarowny, nasycony roztwór Ca(OH)₂','Roztwór NaOH z wapniem'],ok:2,fb:'Woda wapienna = klarowny nasycony roztwór; mleko wapienne = zawiesina.'},\n    {tag:'P',q:'Higroskopijność NaOH oznacza, że:',opts:['Reaguje z kwasami','Pochłania wilgoć z powietrza','Świeci w ciemności','Nie rozpuszcza się w wodzie'],ok:1,fb:'NaOH i KOH „rozpływają się” na powietrzu — trzymaj w szczelnym naczyniu.'},\n    {tag:'Z',q:'Równanie jonowe skrócone zobojętniania mocnego kwasu i mocnej zasady:',opts:['Na⁺ + Cl⁻ → NaCl','H⁺ + OH⁻ → H₂O','NaOH + HCl → NaCl + H₂O','2H₂ + O₂ → 2H₂O'],ok:1,fb:'Istota zobojętniania: proton z kwasu + OH⁻ z zasady → woda.'}\n  ];\n  let answered=0, correct=0;\n  function render(){\n    wrap.innerHTML='';\n    questions.forEach((item,qi)=>{\n      const div=document.createElement('div');\n      div.className='quiz-q';\n      div.dataset.qi=qi;\n      let optsHtml=item.opts.map((o,oi)=>\n        `<button type=\"button\" class=\"quiz-opt\" data-oi=\"${oi}\">${o}<\/button>`\n      ).join('');\n      div.innerHTML=`<span class=\"q-tag\">${item.tag}<\/span><h5>${qi+1}. ${item.q}<\/h5><div class=\"quiz-opts\">${optsHtml}<\/div><div class=\"quiz-fb\" id=\"qfb${qi}\"><\/div>`;\n      wrap.appendChild(div);\n      div.querySelectorAll('.quiz-opt').forEach(btn=>{\n        btn.addEventListener('click',()=>{\n          if(div.dataset.done) return;\n          div.dataset.done='1';\n          answered++;\n          const oi=+btn.dataset.oi;\n          const fb=document.getElementById('qfb'+qi);\n          div.querySelectorAll('.quiz-opt').forEach(b=>{\n            b.disabled=true;\n            if(+b.dataset.oi===item.ok) b.classList.add('correct');\n          });\n          if(oi===item.ok){\n            correct++;\n            btn.classList.add('correct');\n            fb.className='quiz-fb show ok';\n            fb.textContent='✓ '+item.fb;\n          }else{\n            btn.classList.add('wrong');\n            fb.className='quiz-fb show bad';\n            fb.textContent='✕ '+item.fb;\n          }\n          if(answered===questions.length){\n            scoreEl.className='quiz-score show';\n            const pct=Math.round(100*correct/questions.length);\n            scoreEl.textContent=`Wynik: ${correct} / ${questions.length} (${pct}%) — bez presji, możesz wrócić do sekcji i poprawić.`;\n          }\n        });\n      });\n    });\n  }\n  render();\n})();\n<\/script>\n<script>(function(){var b=document.getElementById(\"advToggle\");if(!b)return;var all=function(){return document.querySelectorAll(\"details.adv\")};var n=all().length;b.textContent=\"Pokaż treści akademickie (\"+n+\")\";b.addEventListener(\"click\",function(){var on=b.getAttribute(\"aria-pressed\")!==\"true\";all().forEach(function(d){d.open=on});b.setAttribute(\"aria-pressed\",on?\"true\":\"false\");b.textContent=(on?\"Ukryj\":\"Pokaż\")+\" treści akademickie (\"+n+\")\"});window.addEventListener(\"beforeprint\",function(){all().forEach(function(d){d.open=true})});})();<\/script>\n<\/body>\n<\/html>\n"</script>
