isplay:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.mmx-box{border:2px solid var(--mm);border-radius:10px;padding:8px 12px;background:#fff;font-family:Inter,system-ui,sans-serif;text-align:left}.mmx-box b{color:var(--mm);font-size:12.5px;letter-spacing:.04em}.mmx-box ul{margin:6px 0 0 16px;padding:0;font-size:13px}.mmx-loose{grid-column:1/-1;font-size:13px;color:#475569}.merge-h{margin:16px 0 6px}.che-prac-go{margin-top:8px;border:1px solid #0d6868;color:#0d6868;background:#fff;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}.che-prac-go:hover{background:#0d6868;color:#fff}.hist-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:10px 0}.hist-card{margin:0;border:1px solid var(--border,#e5e9ee);border-radius:12px;padding:10px;background:var(--surface,#fff)}.hist-year{font:800 18px/1.1 inherit;color:var(--accent,#0d6868)}.hist-who{font-weight:700;margin:2px 0 6px}.hist-ill svg{width:100%;height:auto;display:block;border-radius:8px}.hist-card figcaption{font-size:13.5px;margin-top:6px;color:var(--text-soft,#4a5568)}h3.sub-h{margin-top:18px}<\/style><\/head>\n<body>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">N02 · CHEMIA · MASTER LAB v9.0<\/div><h1>Wodorotlenki i zasady<\/h1><p class=\"lead\">Kation metalu + OH⁻ → wzór M(OH)ₙ, nawias i nazwy; rozpuszczalność, wodorotlenek a zasada, dysocjacja i odczyn; trzy metody otrzymywania, strącanie, zobojętnianie, wskaźniki, amfoteryczność. Modele, liczby i równania z silnika CHE.HYDROXIDES.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-extra\">AMBITNIE / LO<\/span><\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><\/section>\n<div class=\"minimum-card\" id=\"minimum\">\n<h3>Muszę umieć na E8 — 8 kluczowych faktów<\/h3>\n<ol>\n<li><strong>Wodorotlenek<\/strong> to związek zbudowany z kationu metalu i anionu wodorotlenkowego <span class=\"hl\">OH⁻<\/span>.<\/li>\n<li><strong>Wzór ogólny: <span class=\"formula\">M(OH)ₙ<\/span><\/strong>, gdzie <span class=\"hl\">n<\/span> oznacza liczbę grup wodorotlenkowych. W <strong>typowych wodorotlenkach metali na poziomie klasy 8<\/strong> liczba ta jest równa wartości bezwzględnej ładunku kationu, np. Ca²⁺ tworzy Ca(OH)₂. <strong>Nie utożsamiaj indeksu z samym ładunkiem zapisanym ze znakiem „+”<\/strong>.<\/li>\n<li><strong>Nawias<\/strong> stosujemy, gdy grupa OH⁻ występuje więcej niż raz: <span class=\"formula\">NaOH<\/span> vs <span class=\"formula\">Ca(OH)₂<\/span>.<\/li>\n<li><strong>Zobojętnianie:<\/strong> <span class=\"hl-warn\">wodorotlenek + kwas → sól + woda<\/span>.<\/li>\n<li><strong>Odczyn:<\/strong> roztwór dobrze rozpuszczalnego wodorotlenku ma <span class=\"hl\">odczyn zasadowy<\/span>. Wodorotlenki trudno rozpuszczalne dają bardzo mało jonów OH⁻.<\/li>\n<li><strong>Trzy typowe szkolne sposoby otrzymywania wybranych wodorotlenków:<\/strong> tlenek + woda, metal aktywny + woda, sól + zasada (strącanie).<\/li>\n<li><strong>NaOH/KOH<\/strong> są higroskopijne i żrące; roztwór to elektrolit o odczynie zasadowym.<\/li>\n<li><strong>Woda wapienna<\/strong> to nasycony roztwór Ca(OH)₂ — mętnieje po przepuszczeniu odpowiedniej ilości CO₂.<\/li>\n<\/ol>\n<\/div>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#wprowadzenie\">1. Wprowadzenie<\/a><a class=\"toc-link\" href=\"#cele\">2. Cele lekcji<\/a><a class=\"toc-link\" href=\"#kompas\">3. Kompas — co trzeba wiedzieć wcześniej<\/a><a class=\"toc-link\" href=\"#pytanie\">4. Pytanie przewodnie i problem startowy<\/a><a class=\"toc-link\" href=\"#budowa\">5. Definicja, budowa i nazewnictwo<\/a><a class=\"toc-link\" href=\"#wlasciwosci\">6. Właściwości: rozpuszczalność, zasada, dysocjacja i odczyn<\/a><a class=\"toc-link\" href=\"#otrzymywanie\">7. Otrzymywanie wodorotlenków<\/a><a class=\"toc-link\" href=\"#reakcje\">8. Reakcje wodorotlenków<\/a><a class=\"toc-link\" href=\"#zastosowania\">9. Zastosowania, BHP i życie codzienne<\/a><a class=\"toc-link\" href=\"#model\">10. Model bez skrótów — cztery pytania o wodorotlenek<\/a><a class=\"toc-link\" href=\"#modele-budowy\">11. Modele budowy — rysunek szkolny a sieć jonowa<\/a><a class=\"toc-link\" href=\"#ion-lab\">12. Strącanie od środka — laboratorium jonowe<\/a><a class=\"toc-link\" href=\"#rownania-jonowe\">13. Równania jonowe<\/a><a class=\"toc-link\" href=\"#amfoterycznosc\">14. Amfoteryczność<\/a><a class=\"toc-link\" href=\"#doswiadczenia\">15. Doświadczenia modelowe<\/a><a class=\"toc-link\" href=\"#klinika\">16. Klinika błędów<\/a><a class=\"toc-link\" href=\"#cwiczenia\">17. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#test\">18. Test końcowy<\/a><a class=\"toc-link\" href=\"#karta\">19. Karta szybkiego powtórzenia (do druku)<\/a><a class=\"toc-link\" href=\"#fiszki\">20. Fiszki<\/a><a class=\"toc-link\" href=\"#mapa\">21. Mapa pojęć<\/a><a class=\"toc-link\" href=\"#slownik\">22. Słownik<\/a><a class=\"toc-link\" href=\"#checklista\">23. Checklista<\/a><a class=\"toc-link\" href=\"#wskazowki\">24. Wskazówki do nauki<\/a><a class=\"toc-link\" href=\"#historia\">A. Dodatek A — Historia odkrycia<\/a><a class=\"toc-link\" href=\"#ambitny\">B. Dodatek B — teorie kwasów i zasad, hydraty<\/a><a class=\"toc-link\" href=\"#modele-silnika\">↻. Modele silnika w tej lekcji<\/a><a class=\"toc-link\" href=\"#audyt\">✓. Audyt jakości<\/a><\/nav><\/details>\n<div class=\"layer-legend\">\n<div class=\"layer-row\"><span class=\"dot e8\"><\/span><span><b>E8 — obowiązkowo:<\/b> grupa OH⁻, wzory, zobojętnianie, rozpuszczalność szkolna<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot understand\"><\/span><span><b>Rozumienie:<\/b> skąd nawias, wodorotlenek vs zasada, dlaczego nie każdy tlenek reaguje z wodą<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot extra\"><\/span><span><b>Nadprogramowo:<\/b> amfoteryczność, równania jonowe, hydraty<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot contest\"><\/span><span><b>Konkurs / liceum:<\/b> moc zasad, AgOH, CuOH, teorie kwasów i zasad<\/span><\/div>\n<\/div>\n<div class=\"core-path\" id=\"rdzen-lekcji\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to (ok. 30 min)<\/div>\n<ol>\n<li><strong><a href=\"#budowa\">§5<\/a><\/strong> — grupa OH⁻, wzór ogólny, nawias, nazwy.<\/li>\n<li><strong>Model „Wzór wodorotlenku”<\/strong> (<a href=\"#wzor-ogolny\">§5.2<\/a>) — zbuduj wzory dla Na, Ca, Al, Fe(III).<\/li>\n<li><strong>Rozpuszczalność, zasada i odczyn<\/strong> (<a href=\"#wlasciwosci\">§6<\/a>) — tabela rozpuszczalności, dysocjacja, wskaźniki.<\/li>\n<li><strong>Otrzymywanie + Laboratorium jonowe<\/strong> (<a href=\"#otrzymywanie\">§7<\/a>, <a href=\"#ion-lab\">§12<\/a>) — zobacz, jak powstaje osad.<\/li>\n<li><strong>Zobojętnianie<\/strong> (<a href=\"#zobojetnianie\">§8.1<\/a>) — animacja i licznik moli.<\/li>\n<li><strong>pH i wskaźniki + Lab<\/strong> (<a href=\"#ph-wskazniki\">§6.4<\/a>) — przewiduj odczyn.<\/li>\n<li><strong>Klinika błędów + Ćwiczenia + Test<\/strong> (<a href=\"#klinika\">§16<\/a>–<a href=\"#test\">§18<\/a>).<\/li>\n<\/ol>\n<\/div>\n<section class=\"section\" id=\"wprowadzenie\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Wprowadzenie<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">O co tu właściwie chodzi?<\/span>\n<p>W poprzedniej lekcji poznałeś <strong>tlenki<\/strong>. Wiesz już, że <span class=\"hl\">część tlenków zasadowych<\/span> — zwłaszcza tlenki metali aktywnych — reaguje z wodą, tworząc <strong>wodorotlenki<\/strong>. Ale co to właściwie jest? Jak wygląda wzór? Jak nazwać taki związek? I dlaczego jedne wodorotlenki rozpuszczają się w wodzie, a inne nie?<\/p>\n<p>Odpowiedzi prowadzą przez <span class=\"hl\">grupę wodorotlenkową OH⁻<\/span> — jeden mały klocek, który decyduje o właściwościach całej grupy związków.<\/p>\n<\/div>\n<p class=\"mini-note\">Trzy fakty na start — OH⁻ ma ładunek −1; liczba grup OH⁻ odpowiada wartości bezwzględnej ładunku kationu; nawias stawiamy tylko przy więcej niż jednej grupie — zebrano w karcie <a href=\"#minimum\">Minimum E8<\/a>, a pełne wyjaśnienie z przykładami jest w <a href=\"#budowa\">§5<\/a>.<\/p>\n<\/section>\n<section class=\"section\" id=\"cele\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Cele lekcji <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Po tej lekcji uczeń:<\/span>\n<ul>\n<li><strong>zapisuje<\/strong> wzór wodorotlenku na podstawie kationu metalu,<\/li>\n<li><strong>stosuje<\/strong> nawias, gdy grupa OH⁻ powtarza się więcej niż raz,<\/li>\n<li><strong>nazywa<\/strong> wodorotlenki (w tym z cyfrą rzymską dla Fe, Cu, Sn, Pb),<\/li>\n<li><strong>zapisuje<\/strong> otrzymywanie wodorotlenku trzema typowymi metodami szkolnymi,<\/li>\n<li><strong>zapisuje<\/strong> reakcję zobojętniania,<\/li>\n<li><strong>rozróżnia<\/strong> wodorotlenki rozpuszczalne i nierozpuszczalne,<\/li>\n<li><strong>rozróżnia<\/strong> substancję (wodorotlenek) od roztworu (zasada),<\/li>\n<li><strong>opisuje<\/strong> odczyn zasadowy i wskaźniki,<\/li>\n<li><strong>opisuje<\/strong> właściwości NaOH, KOH i Ca(OH)₂ (higroskopijność, BHP, wapno i woda wapienna),<\/li>\n<li>(ambitnie) <strong>wyjaśnia<\/strong> amfoteryczność i równania jonowe.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"kompas\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Kompas — co trzeba wiedzieć wcześniej<\/div>\n<div class=\"card card-understand\">\n<ul>\n<li><strong>Wcześniej:<\/strong> wartościowość, W–K–S–K, grupa OH⁻, ładunek jonu, nawias. Fundamenty F00–F09: jony, ładunek, zapis wzorów.<\/li>\n<li><strong>Tlenki (lekcja N01):<\/strong> tlenki zasadowe (<span class=\"formula\">Na₂O<\/span>, <span class=\"formula\">K₂O<\/span>, <span class=\"formula\">CaO<\/span>, <span class=\"formula\">BaO<\/span>) reagują z wodą → wodorotlenki. Tlenki amfoteryczne (<span class=\"formula\">Al₂O₃<\/span>, <span class=\"formula\">ZnO<\/span>) reagują z kwasami i zasadami.<\/li>\n<li><strong>Uwaga:<\/strong> określenie „tlenek zasadowy” nie oznacza automatycznie, że tlenek reaguje z wodą (CuO — nie, MgO — bardzo powoli); szczegóły i lista tlenków reagujących z wodą — <a href=\"#uwaga-tlenki\">§7.1<\/a>.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"pytanie\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Pytanie przewodnie i problem startowy<\/div>\n<div class=\"card card-core\">\n<p style=\"font-size:17px;font-weight:700;line-height:1.6;\">Jak zbudowany jest wodorotlenek i dlaczego jedne rozpuszczają się w wodzie, a inne nie?<\/p>\n<\/div>\n<div class=\"card card-warning\" id=\"problem\">\n<p><strong>Masz do dyspozycji:<\/strong> tlenek wapnia <span class=\"formula\">CaO<\/span>, tlenek sodu <span class=\"formula\">Na₂O<\/span>, metaliczny sód <span class=\"formula\">Na<\/span>, metaliczny magnez <span class=\"formula\">Mg<\/span>, wodorotlenek sodu <span class=\"formula\">NaOH<\/span>, chlorek żelaza(III) <span class=\"formula\">FeCl₃<\/span>.<\/p>\n<p><strong>Pytanie:<\/strong> Jak otrzymać <span class=\"formula\">Ca(OH)₂<\/span>? Jak otrzymać <span class=\"formula\">Fe(OH)₃<\/span>? Jak otrzymać <span class=\"formula\">NaOH<\/span>?<\/p>\n<details class=\"answer\"><summary>Pokaż rozwiązanie — trzy szkolne metody<\/summary>\n<p><strong>W szkolnych zadaniach spotkasz trzy typowe sposoby otrzymywania wybranych wodorotlenków:<\/strong><\/p>\n<ul>\n<li><strong>Tlenek metalu aktywnego + woda → wodorotlenek<\/strong> (<span class=\"formula\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/span>).<\/li>\n<li><strong>Metal aktywny + woda → wodorotlenek + wodór↑<\/strong> (<span class=\"formula\" data-rx=\"naH2o\">2Na + 2H₂O → 2NaOH + H₂↑<\/span>).<\/li>\n<li><strong>Sól metalu + zasada → wodorotlenek↓ + sól<\/strong> (<span class=\"formula\" data-rx=\"fecl3Naoh\">FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl<\/span>).<\/li>\n<\/ul>\n<p>Ca(OH)₂ — z CaO i wody (metoda 1); Fe(OH)₃ — z FeCl₃ i NaOH (metoda 3, strącanie); NaOH — z sodu i wody (metoda 2) albo z Na₂O i wody (metoda 1). Magnez reaguje z wodą dopiero na gorąco, dlatego Mg(OH)₂ wygodniej otrzymać przez strącanie (<a href=\"#stracanie\">§7.2<\/a>).<\/p>\n<p class=\"mini-note\" style=\"margin-top:10px;\">To nie są uniwersalne metody dla każdego wodorotlenku — dotyczą wybranych związków i warunków szkolnych.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"budowa\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Definicja, budowa i nazewnictwo <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"definicja\">5.1 Definicja i grupa wodorotlenkowa OH⁻<\/h3>\n<div class=\"card card-basic\">\n<p><strong>Wodorotlenki<\/strong> to związki chemiczne zbudowane z:<\/p>\n<ul>\n<li><strong>kationów metalu<\/strong> (lub jonu amonowego <span class=\"formula\">NH₄⁺<\/span>),<\/li>\n<li><strong>anionów wodorotlenkowych <span class=\"hl\">OH⁻<\/span><\/strong>.<\/li>\n<\/ul>\n<p style=\"margin-top:10px;\">Wzór ogólny: <span class=\"formula-lg\">M(OH)ₙ<\/span>, gdzie <strong>M<\/strong> = metal, <strong>OH⁻<\/strong> = grupa wodorotlenkowa o ładunku −1, <strong>n<\/strong> = liczba grup OH⁻. W <strong>typowych wodorotlenkach metali na poziomie klasy 8<\/strong> liczba grup OH⁻ jest równa wartości bezwzględnej ładunku kationu, np. Ca²⁺ tworzy Ca(OH)₂. W bardziej złożonych przypadkach (np. jony kompleksowe, hydraty) reguła ta nie obowiązuje.<\/p>\n<\/div>\n<div class=\"card card-core\" id=\"grupa-oh\">\n<dl class=\"def-list\">\n<div class=\"def-item\"><dt>Nazwa<\/dt><dd>Grupa wodorotlenkowa (anion wodorotlenkowy).<\/dd><\/div>\n<div class=\"def-item\"><dt>Wzór<\/dt><dd><span class=\"formula\">OH⁻<\/span><\/dd><\/div>\n<div class=\"def-item\"><dt>Ładunek<\/dt><dd><strong>−1<\/strong><\/dd><\/div>\n<div class=\"def-item\"><dt>Skład<\/dt><dd>1 atom tlenu + 1 atom wodoru, jako całość ma ładunek −1.<\/dd><\/div>\n<div class=\"def-item\"><dt>Traktowanie w zadaniach<\/dt><dd>Jeden klocek (całość), nie osobne O i H.<\/dd><\/div>\n<\/dl>\n<div class=\"rule-box\"><b>Zapamiętaj:<\/b> OH⁻ to <strong>jedna grupa<\/strong>. Nawet jeśli składa się z dwóch atomów, traktujemy ją jak jeden element.<\/div>\n<div class=\"rule-box\" style=\"background:var(--c-warn-bg);border-color:var(--c-warn-line);\"><b>Wodorotlenek ≠ alkohol:<\/b> w <span class=\"formula\">OH⁻<\/span> mamy jon wodorotlenkowy. W alkoholu występuje <strong>grupa hydroksylowa <span class=\"formula\">−OH<\/span> połączona kowalencyjnie z atomem węgla<\/strong>, ale <strong>nie jest ona osobnym jonem OH⁻<\/strong>. To zupełnie inna chemia (związek organiczny). Alkohol zapisujemy ogólnie jako R–OH, gdzie R to fragment węglowy; wodorotlenek to kation metalu (albo NH₄⁺) + OH⁻.<\/div>\n<\/div>\n<h3 id=\"wzor-ogolny\">5.2 Wzór ogólny M(OH)ₙ — jak go zbudować?<\/h3>\n<p class=\"lead\"><strong>Cel:<\/strong> uczeń ma nie tylko znać regułę, ale wiedzieć, co zrobić w następnym kroku i jak sprawdzić wynik.<\/p>\n<div class=\"core-path\">\n<div class=\"cp-title\">Nie zapamiętuj wzorów osobno — odtwórz je z ładunków.<\/div>\n<ol>\n<li>Kation metalu ma ładunek dodatni (np. <span class=\"formula\">Ca²⁺<\/span>).<\/li>\n<li>Grupa OH⁻ ma zawsze ładunek −1.<\/li>\n<li>Związek jako całość jest elektrycznie obojętny.<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-core\">\n<p><strong>Krok po kroku:<\/strong><\/p>\n<ol>\n<li>Zapisz kation metalu (np. <span class=\"formula\">Ca²⁺<\/span>).<\/li>\n<li>Odczytaj jego ładunek (np. <strong>+2<\/strong>).<\/li>\n<li>Zapisz <span class=\"formula\">OH⁻<\/span> jako jeden jon (−1). Dobierz liczbę grup OH⁻ tak, aby suma ładunków wynosiła 0. Tyle samo grup OH⁻ musisz przyłączyć.<\/li>\n<li>Zapisz wzór: <span class=\"formula\">Ca(OH)₂<\/span>.<\/li>\n<li><strong>Kontrola:<\/strong> suma ładunków = 0; nawias, gdy grup OH⁻ jest więcej niż jedna; indeks za nawiasem mnoży wszystkie atomy w środku. Sprawdź indeks: ma dotyczyć całej grupy, nie tylko H. Przykład: <span class=\"formula\">(+2) + 2·(−1) = 0<\/span>.<\/li>\n<\/ol>\n<p class=\"mini-note\" style=\"margin-bottom:8px;\">Liczba grup OH⁻ = wartość bezwzględna ładunku kationu (w prostych wodorotlenkach). W tabeli jest jedna kolumna <b>n<\/b> oznaczająca właśnie liczbę grup OH⁻.<\/p>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Kation<\/th><th>n (liczba OH⁻)<\/th><th>Wzór<\/th><th>Nazwa<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Na⁺<\/td><td>1<\/td><td><strong>NaOH<\/strong><\/td><td>wodorotlenek sodu<\/td><\/tr>\n<tr><td>K⁺<\/td><td>1<\/td><td><strong>KOH<\/strong><\/td><td>wodorotlenek potasu<\/td><\/tr>\n<tr><td>Ca²⁺<\/td><td>2<\/td><td><strong>Ca(OH)₂<\/strong><\/td><td>wodorotlenek wapnia<\/td><\/tr>\n<tr><td>Mg²⁺<\/td><td>2<\/td><td><strong>Mg(OH)₂<\/strong><\/td><td>wodorotlenek magnezu<\/td><\/tr>\n<tr><td>Ba²⁺<\/td><td>2<\/td><td><strong>Ba(OH)₂<\/strong><\/td><td>wodorotlenek baru<\/td><\/tr>\n<tr><td>Al³⁺<\/td><td>3<\/td><td><strong>Al(OH)₃<\/strong><\/td><td>wodorotlenek glinu<\/td><\/tr>\n<tr><td>Fe²⁺<\/td><td>2<\/td><td><strong>Fe(OH)₂<\/strong><\/td><td>wodorotlenek żelaza(II)<\/td><\/tr>\n<tr><td>Fe³⁺<\/td><td>3<\/td><td><strong>Fe(OH)₃<\/strong><\/td><td>wodorotlenek żelaza(III)<\/td><\/tr>\n<tr><td>Cu²⁺<\/td><td>2<\/td><td><strong>Cu(OH)₂<\/strong><\/td><td>wodorotlenek miedzi(II)<\/td><\/tr>\n<tr><td>Zn²⁺<\/td><td>2<\/td><td><strong>Zn(OH)₂<\/strong><\/td><td>wodorotlenek cynku<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"rule-box\">\n<b>Co naprawdę oznacza indeks n?<\/b> <strong>n oznacza liczbę całych grup OH⁻.<\/strong> W typowych prostych wodorotlenkach szkolnych jest ona równa wartości bezwzględnej ładunku kationu.\n<div class=\"equation-box\"><strong>Al³⁺ → 3 × OH⁻ → Al(OH)₃ → (+3) + 3·(−1) = 0<\/strong><\/div>\n<p style=\"margin-top:8px;\">Nie należy utożsamiać indeksu z samym ładunkiem zapisanym ze znakiem „+”. n to liczba grup OH⁻, a nie „ładunek kationu” jako taki.<\/p>\n<\/div>\n<div class=\"mnemonic\">\n<b>Mnemotechnika:<\/b> „<span class=\"hl\">OH⁻ to klocek o ładunku −1<\/span>. Kation metalu mówi, ile klocków potrzebuje.\" Na⁺ → 1 klocek. Ca²⁺ → 2 klocki. Al³⁺ → 3 klocki. Nie rozbijaj grupy na O i H w zadaniach.\n<\/div>\n<h4 class=\"merge-h\" id=\"wzorometr\">Model interaktywny — bilans ładunków i konstruktor wzorów<\/h4>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-wzory-v01\"><button data-che-open-viz=\"n02-wzory-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-wzory-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Wzór wodorotlenku: kation + OH⁻ — bilans ładunków, nawias, modele A/B/jony, sprawdzanie wzoru<\/b><span>Zastępuje Wzórometr, Bilansator, Konstruktor i animację nawiasu · CHE.HYDROXIDES.build / check<\/span><\/button><\/div>\n<p>Dodawaj grupy OH⁻, aż suma ładunków wyniesie zero. Wybierz kation i dodawaj grupy OH⁻, aż powstanie poprawny wzór.<\/p>\n<p class=\"mini-note\">Bilans ładunków jest częścią modelu z tej podsekcji: pasek „+” (kation) i „−” (grupy OH⁻), suma ładunków i przycisk „dobierz automatycznie”.<\/p>\n<p class=\"mini-note\">Konstruktor = ten sam model z tej podsekcji: pole „Sprawdź swój wzór” rozpoznaje brak nawiasu (CaOH₂), zbędny nawias (Na(OH)) i złą liczbę grup OH⁻.<\/p>\n<h3 id=\"nawias\">5.3 Nawias — kiedy i dlaczego?<\/h3>\n<div class=\"card card-warning\">\n<p><strong>Nawias stosujemy, gdy grupa OH⁻ występuje więcej niż raz.<\/strong><\/p>\n<p><strong>Przykłady:<\/strong><\/p>\n<ul>\n<li><span class=\"formula\">NaOH<\/span>, <span class=\"formula\">KOH<\/span> — bez nawiasu (1 grupa, n = 1).<\/li>\n<li><span class=\"formula\">Ca(OH)₂<\/span> — z nawiasem (2 grupy).<\/li>\n<li><span class=\"formula\">Al(OH)₃<\/span> — z nawiasem (3 grupy, n &gt; 1).<\/li>\n<\/ul>\n<div class=\"rule-box\">\n<b>Dlaczego to ważne?<\/b> <span class=\"hl-warn\">CaOH₂<\/span> sugeruje, że indeks 2 dotyczy tylko wodoru — to błąd. <span class=\"formula\">Ca(OH)₂<\/span> mówi jasno: dwie całe grupy OH⁻. <strong>Ca(OH)₂ = Ca₁O₂H₂<\/strong>.\n      <\/div>\n<p class=\"mini-note\">Cztery kroki „CaOH₂ → Ca(OH)₂” (błędny zapis → co jest nie tak → poprawa → co to znaczy) pokazuje model z <a href=\"#wzor-ogolny\">§5.2<\/a> w części „Dlaczego nawias?” dla każdego kationu.<\/p>\n<div class=\"mnemonic\">\n<b>Mnemotechnika:<\/b> „<span class=\"hl\">Nawias to pudełko na grupę<\/span>.\" Wszystko, co w pudełku, powtarza się tyle razy, ile mówi indeks za nawiasem.\n      <\/div>\n<\/div>\n<h3 id=\"nazwy\">5.4 Nazwy wodorotlenków<\/h3>\n<div class=\"card card-core\">\n<p><strong>Reguła:<\/strong> „wodorotlenek\" + nazwa metalu. Jeżeli metal może tworzyć kationy o różnych ładunkach, w nazwie podaje się stopień utlenienia cyfrą rzymską.<\/p>\n<dl class=\"def-list\">\n<div class=\"def-item\"><dt><span class=\"formula\">NaOH<\/span><\/dt><dd>wodorotlenek sodu<\/dd><\/div>\n<div class=\"def-item\"><dt><span class=\"formula\">Ca(OH)₂<\/span><\/dt><dd>wodorotlenek wapnia<\/dd><\/div>\n<div class=\"def-item\"><dt><span class=\"formula\">Al(OH)₃<\/span><\/dt><dd>wodorotlenek glinu<\/dd><\/div>\n<div class=\"def-item\"><dt><span class=\"formula\">Fe(OH)₂<\/span><\/dt><dd>wodorotlenek żelaza(II)<\/dd><\/div>\n<div class=\"def-item\"><dt><span class=\"formula\">Fe(OH)₃<\/span><\/dt><dd>wodorotlenek żelaza(III)<\/dd><\/div>\n<div class=\"def-item\"><dt><span class=\"formula\">Cu(OH)₂<\/span><\/dt><dd>wodorotlenek miedzi(II)<\/dd><\/div>\n<\/dl>\n<p>Metale ze zmiennym stopniem utlenienia (np. Fe, Cu, Sn, Pb, Mn, Cr) — wymagają cyfry rzymskiej.<\/p>\n<div class=\"card card-extra\">\n<span class=\"card-label\">CuOH i AgOH — tylko jako ciekawostka<\/span> <span class=\"level-badge level-extra\">AMBITNE<\/span>\n<p><span class=\"formula\">CuOH<\/span> (formalny wodorotlenek miedzi(I)) jest nietrwały — w typowych warunkach szkolnego doświadczenia przechodzi w tlenek miedzi(I):<\/p>\n<p style=\"margin-top:8px;\"><span class=\"formula-lg\">2CuOH → Cu₂O + H₂O<\/span><\/p>\n<p><span class=\"formula\">AgOH<\/span> (wodorotlenek srebra(I)) również jest nietrwały i rozpada się do tlenku srebra(I):<\/p>\n<p style=\"margin-top:8px;\"><span class=\"formula-lg\">2AgOH → Ag₂O + H₂O<\/span><\/p>\n<p>Dlatego w zadaniach szkolnych najczęściej stosuje się <strong>Cu(OH)₂<\/strong> oraz sole srebra(I) bezpośrednio w reakcjach strąceniowych.<\/p>\n<p><strong>AgOH — wyjaśnienie:<\/strong> W warunkach doświadczenia szybko przekształca się w Ag₂O, dlatego nie traktuje się go jako trwałego, izolowanego wodorotlenku. Nie używaj sformułowania „nie istnieje” — jest ono zbyt uproszczone.<\/p>\n<\/div>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"wlasciwosci\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Właściwości: rozpuszczalność, zasada, dysocjacja i odczyn <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"higroskopijnosc\">6.1 Stan skupienia, higroskopijność i właściwości NaOH / KOH<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Stan skupienia<\/span>\n<p>W temperaturze pokojowej <strong>wodorotlenki są ciałami stałymi<\/strong> (kryształy, proszki, osady). „Zasada sodowa w butelce” to już <em>wodny roztwór wodorotlenku sodu<\/em>, nazywany ługiem sodowym, a nie czysty wodorotlenek.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Higroskopijność<\/span>\n<p><strong>Higroskopijność<\/strong> — zdolność substancji do pochłaniania wilgoci z powietrza.<\/p>\n<p><span class=\"formula\">NaOH<\/span> i <span class=\"formula\">KOH<\/span> są substancjami silnie higroskopijnymi i żrącymi: pozostawione na powietrzu „rozpływają się”, bo wchłaniają wodę i tworzą stężony roztwór. Dlatego przechowuje się je w szczelnych naczyniach.<\/p>\n<p><strong>Przy rozpuszczaniu w wodzie<\/strong> wydziela się dużo ciepła (rozpuszczanie NaOH w wodzie przebiega z wydzieleniem ciepła) — naczynie może się mocno nagrzać. Zasady bezpiecznej pracy (ochrona, kolejność dodawania, pierwsza pomoc): <a href=\"#bhp\">§9.2<\/a>.<\/p>\n<p><strong>Porównanie:<\/strong> KOH jest jeszcze lepiej rozpuszczalny w wodzie niż NaOH, ale oba są silnie żrące i higroskopijne.<\/p>\n<\/div>\n<div class=\"hygro-box\" id=\"hygroBox\">\n<div aria-hidden=\"true\" class=\"hygro-crystal\"><span class=\"w\"><\/span><span class=\"w\"><\/span><span class=\"w\"><\/span><span class=\"w\"><\/span><\/div>\n<div style=\"flex:1;min-width:200px\">\n<strong>Higroskopijność NaOH / KOH<\/strong>\n<p style=\"margin:6px 0 0;font-size:13.5px;color:var(--text-soft)\">Stały NaOH „ciągnie” parę wodną z powietrza → powierzchnia robi się mokra / roztwór. Dlatego trzymamy w szczelnym naczyniu i nie zostawiamy otwartego na stole.<\/p>\n<\/div>\n<\/div>\n<h3 id=\"rozpuszczalnosc-tabela\">6.2 Rozpuszczalność wodorotlenków — tabela (odczyt jak na klasówce)<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Szybka reguła rozpuszczalności (E8)<\/span>\n<ul>\n<li><strong>Dobrze rozpuszczalne<\/strong> (dają zasadę): wodorotlenki metali 1. grupy (NaOH, KOH, LiOH) oraz Ba(OH)₂; Ca(OH)₂ — trudno, ale tworzy wodę wapienną.<\/li>\n<li><strong>Trudno rozpuszczalne / praktycznie nierozpuszczalne<\/strong> (osady): Fe(OH)₂, Fe(OH)₃, Cu(OH)₂, Al(OH)₃, Zn(OH)₂, Mg(OH)₂.<\/li>\n<li><strong>Odczyn zasadowy<\/strong> ma tylko roztwór, w którym jest wystarczająco dużo wolnych OH⁻ — więc głównie dobrze rozpuszczalne wodorotlenki.<\/li>\n<\/ul>\n<\/div>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Wodorotlenek<\/th><th>W wodzie<\/th><th>ok. g/100 mL (20 °C)<\/th><th>Odczyn<\/th><th>Uwagi E8<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"sol-good\" data-hy=\"NaOH\" data-hy-sol=\"R\"><td>NaOH<\/td><td><strong>dobrze<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol good\"><\/div><\/div><\/div><\/td><td>~109<\/td><td>silnie zasadowy<\/td><td>zasada; <strong>higroskopijny<\/strong><\/td><\/tr>\n<tr class=\"sol-good\" data-hy=\"KOH\" data-hy-sol=\"R\"><td>KOH<\/td><td><strong>dobrze<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol good\"><\/div><\/div><\/div><\/td><td>~112<\/td><td>silnie zasadowy<\/td><td>zasada; higroskopijny<\/td><\/tr>\n<tr class=\"sol-good\" data-hy=\"Ba(OH)2\" data-hy-sol=\"R\"><td>Ba(OH)₂<\/td><td><strong>rozpuszczalny<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol good\"><\/div><\/div><\/div><\/td><td>~3,9 (8H₂O)<\/td><td>zasadowy<\/td><td>Ba²⁺ toksyczny — nie w doświadczeniach uczniowskich<\/td><\/tr>\n<tr class=\"sol-mid\" data-hy=\"Ca(OH)2\" data-hy-sol=\"T\"><td>Ca(OH)₂<\/td><td><strong>trudno<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol mid\"><\/div><\/div><\/div><\/td><td>~0,17<\/td><td>zasadowy (woda wapienna)<\/td><td>nasycony roztwór do CO₂; mleko wapienne = zawiesina<\/td><\/tr>\n<tr class=\"sol-mid\" data-hy=\"Mg(OH)2\" data-hy-sol=\"N\"><td>Mg(OH)₂<\/td><td><strong>praktycznie nierozp.<\/strong> (szkolnie: „trudno”)<div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol mid\"><\/div><\/div><\/div><\/td><td>~0,001<\/td><td>słabo zasadowy<\/td><td>mleko magnezowe; mało OH⁻<\/td><\/tr>\n<tr class=\"sol-bad\" data-hy=\"Cu(OH)2\" data-hy-sol=\"N\"><td>Cu(OH)₂<\/td><td><strong>nierozp.<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol bad\"><\/div><\/div><\/div><\/td><td>~0<\/td><td>brak wyraźnego<\/td><td>niebieski osad ↓<\/td><\/tr>\n<tr class=\"sol-bad\" data-hy=\"Fe(OH)3\" data-hy-sol=\"N\"><td>Fe(OH)₃<\/td><td><strong>nierozp.<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol bad\"><\/div><\/div><\/div><\/td><td>~0<\/td><td>brak wyraźnego<\/td><td>brunatny osad ↓ · vs NaOH: prawie „neutralny” osad<\/td><\/tr>\n<tr class=\"sol-bad\" data-hy=\"Al(OH)3,Zn(OH)2\" data-hy-sol=\"N\"><td>Al(OH)₃, Zn(OH)₂<\/td><td><strong>nierozp.<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol bad\"><\/div><\/div><\/div><\/td><td>~0<\/td><td>brak wyraźnego<\/td><td>amfoteryczne (amb)<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\"><strong>Reguła E8:<\/strong> rozpuszczalność ↔ siła odczynu w roztworze. Dużo wolnych OH⁻ (NaOH) = mocno zasadowy; osad Cu(OH)₂/Fe(OH)₃ ≈ brak typowego odczynu zasadowego w wodzie. Wartości g/100 mL — orientacyjne (podręcznik / tablice).<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"tabela-rozpuszczalnosci-v01\"><button data-che-open-viz=\"tabela-rozpuszczalnosci-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'tabela-rozpuszczalnosci-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Tabela rozpuszczalności (20 °C) — kolumna OH⁻ i wszystkie sole<\/b><span>To samo źródło danych co ta lekcja · CHE.DATA.SOLUBILITY_TABLE<\/span><\/button><\/div>\n<p id=\"wodor-grid\">Jeden widok pokazuje pierwiastek, wartościowość, wzór wodorotlenku, rozpuszczalność i barwę osadu. Kliknij kafelek — szczegóły pojawią się na stałe pod spodem.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-przeglad-v01\"><button data-che-open-viz=\"n02-przeglad-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-przeglad-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Wodorotlenki — kafelki: rozpuszczalność, barwa osadu, odczyn, dysocjacja, metody otrzymywania<\/b><span>CHE.DATA.HYDROXIDES + D.SOLUBILITY_TABLE<\/span><\/button><\/div>\n<h3 id=\"wodorotlenek-vs-zasada\">6.3 Wodorotlenek a zasada; elektrolit i dysocjacja<\/h3>\n<div class=\"card card-basic\">\n<p><strong>Wodorotlenek<\/strong> to związek chemiczny zawierający kation metalu i aniony OH⁻. Może być substancją stałą (stały NaOH) lub osadem (Cu(OH)₂).<\/p>\n<p><strong>Zasadą<\/strong> w szkolnym ujęciu nazywamy <em>wodny roztwór niektórych wodorotlenków<\/em>, który zawiera jony OH⁻ i ma odczyn zasadowy. Dobrze rozpuszczalne wodorotlenki tworzą roztwory o wyraźnie zasadowym odczynie, natomiast trudno rozpuszczalne tworzą bardzo mało jonów OH⁻. To praktyczne uproszczenie szkolne; w szerszym ujęciu chemicznym zasadą może być także substancja niezawierająca grup OH⁻, np. amoniak NH₃.<\/p>\n<dl class=\"def-list\">\n<div class=\"def-item\"><dt>NaOH(s)<\/dt><dd>Wodorotlenek sodu — substancja stała. Odczyn: —<\/dd><\/div>\n<div class=\"def-item\"><dt>NaOH(aq)<\/dt><dd>Roztwór, czyli zasada sodowa. Odczyn: silnie zasadowy.<\/dd><\/div>\n<div class=\"def-item\"><dt>Ba(OH)₂(aq)<\/dt><dd>Roztwór wodorotlenku baru. Odczyn: zasadowy.<\/dd><\/div>\n<div class=\"def-item\"><dt>Ca(OH)₂(aq)<\/dt><dd>Woda wapienna — nasycony roztwór. Odczyn: zasadowy.<\/dd><\/div>\n<div class=\"def-item\"><dt>Cu(OH)₂(s)<\/dt><dd>Osad wodorotlenku miedzi(II). Jest praktycznie nierozpuszczalny, dlatego jego zawiesina nie daje wyraźnego zasadowego odczynu.<\/dd><\/div>\n<\/dl>\n<p class=\"mini-note\">Szkolne rozróżnienie wodorotlenek / zasada / jon OH⁻ i szersze definicje zasad (amoniak, Brønsted): <a href=\"#zasada-oh\">§10.2<\/a>.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Elektrolit i nieelektrolit (PP)<\/span>\n<p><strong>Elektrolit<\/strong> — substancja, której wodny roztwór (lub stop) przewodzi prąd elektryczny, bo zawiera swobodne jony.<\/p>\n<p><strong>Nieelektrolit<\/strong> — substancja, która w roztworze nie daje swobodnych jonów (np. cukier, alkohol) — roztwór nie przewodzi.<\/p>\n<p>Roztwór <span class=\"formula\">NaOH<\/span> jest <strong>elektrolitem<\/strong> (Na⁺ i OH⁻). Czysta woda destylowana praktycznie nie przewodzi; dodatek zasady silnie zwiększa przewodnictwo.<\/p>\n<div class=\"rule-box\" style=\"margin-top:10px;\"><b>Zapamiętaj:<\/b> zasada = wodny roztwór wodorotlenku → jony OH⁻ → odczyn zasadowy + przewodnictwo (elektrolit).<\/div>\n<div aria-label=\"Porównanie przewodnictwa\" class=\"cond-viz\" role=\"img\">\n<div class=\"cond-box ok\">\n<div class=\"cond-title\">Roztwór NaOH<\/div>\n<div class=\"cond-icons\"><\/div>\n<div class=\"cond-note\">Jony Na⁺ i OH⁻ → <strong>elektrolit<\/strong><br/>żarówka świeci / przewodnictwo wysokie<\/div>\n<\/div>\n<div class=\"cond-box bad\">\n<div class=\"cond-title\">Roztwór cukru (sacharoza)<\/div>\n<div class=\"cond-icons\">○ ○ ○<\/div>\n<div class=\"cond-note\">Cząsteczki, brak swobodnych jonów → <strong>nieelektrolit<\/strong><br/>żarówka nie świeci<\/div>\n<\/div>\n<\/div>\n<p class=\"mini-note\">Woda destylowana prawie nie przewodzi; po dodaniu NaOH przewodnictwo gwałtownie rośnie. To klasyczne doświadczenie z listy proponowanej w podstawie.<\/p>\n<\/div>\n<h4 class=\"merge-h\" id=\"diss-widget\">Dysocjacja elektrolityczna zasad<\/h4>\n<p><strong>Dysocjacja elektrolityczna<\/strong> to rozpad związku na jony pod wpływem wody. Rozpuszczona część wodorotlenku dysocjuje w szkolnym modelu praktycznie całkowicie, a liczba jonów OH⁻ w równaniu jest równa liczbie grup OH⁻ we wzorze (indeksowi za nawiasem):<\/p>\n<div class=\"equation-box\">NaOH → Na⁺ + OH⁻<\/div>\n<div class=\"equation-box\">KOH → K⁺ + OH⁻<\/div>\n<div class=\"equation-box\">Ca(OH)₂ → Ca²⁺ + 2OH⁻<\/div>\n<div class=\"equation-box\">Ba(OH)₂ → Ba²⁺ + 2OH⁻<\/div>\n<p class=\"mini-note\">Na E8 wystarczy zapis ze strzałką i jonami. Stany skupienia, równowaga dla trudno rozpuszczalnego Ca(OH)₂ i różnica rozpuszczalność / moc: <a href=\"#moc-rozpuszczalnosc\">§10.3<\/a>.<\/p>\n<p>Zobacz, jak kryształ NaOH rozpada się na jony, a jony otaczają się cząsteczkami wody.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-dysocjacja-v01\"><button data-che-open-viz=\"n02-dysocjacja-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-dysocjacja-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Rozpuszczanie i dysocjacja: NaOH, KOH, Ca(OH)₂, Mg(OH)₂, Cu(OH)₂, Fe(OH)₃ — jony, hydratacja, efekt cieplny<\/b><span>GFX.ions · CHE.HYDROXIDES.dissociation / heat<\/span><\/button><\/div>\n<h4 class=\"merge-h\">Energia rozpuszczania <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h4>\n<p>Nie każdy wodorotlenek rozpuszcza się tak samo. NaOH wydziela ciepło (egzo), NH₄NO₃ pochłania (endo).<\/p>\n<div class=\"table-wrap table-compact\"><table><thead><tr><th>Substancja<\/th><th>ΔH rozpuszczania (kJ/mol)<\/th><th>Efekt<\/th><\/tr><\/thead><tbody><tr data-hy-heat=\"NaOH\"><td>NaOH<\/td><td>−44,5<\/td><td>egzotermiczny — temperatura rośnie<\/td><\/tr><tr data-hy-heat=\"KOH\"><td>KOH<\/td><td>−57,6<\/td><td>egzotermiczny — temperatura rośnie<\/td><\/tr><tr data-hy-heat=\"LiOH\"><td>LiOH<\/td><td>−23,6<\/td><td>egzotermiczny — temperatura rośnie<\/td><\/tr><tr data-hy-heat=\"Ca(OH)2\"><td>Ca(OH)₂<\/td><td>−16,7<\/td><td>egzotermiczny — temperatura rośnie<\/td><\/tr><tr data-hy-heat=\"NH4NO3\"><td>NH₄NO₃<\/td><td>+25,7<\/td><td>endotermiczny — temperatura spada<\/td><\/tr><tr data-hy-heat=\"NaCl\"><td>NaCl<\/td><td>+3,9<\/td><td>endotermiczny — temperatura spada<\/td><\/tr><\/tbody><\/table><\/div><p class=\"mini-note\">Wartości z silnika (CHE.HYDROXIDES.SOLHEAT). Ile stopni? 4 g NaOH (0,1 mol) w 100 g wody → ok. +10 °C. Symulacja z termometrem: model z tej podsekcji, część „Efekt cieplny”.<\/p>\n<h3 id=\"ph-wskazniki\">6.4 Odczyn i wskaźniki<\/h3>\n<p><strong>Skala pH:<\/strong> pH &lt; 7 — odczyn kwasowy, pH = 7 — obojętny, pH &gt; 7 — zasadowy. Im więcej wolnych jonów OH⁻ w roztworze, tym wyższe pH. Odczyn badamy <strong>wskaźnikami<\/strong> — substancjami, które zmieniają barwę zależnie od pH.<\/p>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Wskaźnik<\/th><th>Kwasowy<\/th><th>Obojętny<\/th><th>Zasadowy<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Fenoloftaleina<\/td><td>bezbarwna<\/td><td>bezbarwna<\/td><td>malinowa (zmiana barwy przy pH ≈ 8,2–10)<\/td><\/tr>\n<tr><td>Oranż metylowy<\/td><td>czerwony (pomarańczowy przy pH ≈ 3,1–4,4)<\/td><td>żółty<\/td><td>żółty<\/td><\/tr>\n<tr><td>Papierek uniwersalny<\/td><td>czerwony / pomarańczowy<\/td><td>żółtozielony<\/td><td>niebieski / granatowy<\/td><\/tr>\n<tr><td>Wywar z czerwonej kapusty (domowy)<\/td><td>czerwony / różowy<\/td><td>fioletowy<\/td><td>niebieskozielony, w silnie zasadowym żółty<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p>Przy <strong>fenoloftaleinie<\/strong> zasada jest malinowa; po zobojętnieniu roztwór odbarwia się. <strong>Oranż metylowy<\/strong>: czerwony w środowisku silnie kwasowym, pomarańczowy w zakresie zmiany barwy (pH ≈ 3,1–4,4), żółty powyżej.<\/p>\n<p>Przesuwaj suwak lub klikaj wartości na skali. Zobaczysz jednocześnie kolor roztworu, barwy trzech wskaźników i przykłady substancji.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"ph-indicators-v03\"><button data-che-open-viz=\"ph-indicators-v03\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'ph-indicators-v03',lessonId:'N02'},'*')\" type=\"button\"><b>Panel pH — skala, barwy wskaźników, przykłady roztworów<\/b><span>Barwy z CHE.COLORS<\/span><\/button><\/div>\n<p class=\"mini-note\">Woda czysta ma w przybliżeniu pH 7. Woda destylowana przechowywana na powietrzu pochłania CO₂, dlatego jej pH bywa nieco niższe od 7. Zakres zmiany barwy oranżu metylowego: pH ≈ 3,1–4,4.<\/p>\n<h4 class=\"merge-h\">Laboratorium wskaźników — przewidź i sprawdź<\/h4>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-indicatorRack\"><button data-che-open-viz=\"gfx-scene-indicatorRack\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-indicatorRack',lessonId:'N02'},'*')\" type=\"button\"><b>Wskaźnik w siedmiu roztworach — przewidź barwę, potem sprawdź<\/b><span>Scena GFX · barwy wskaźników z CHE.COLORS<\/span><\/button><\/div>\n<p class=\"mini-note\"><strong>Uwaga:<\/strong> Cu(OH)₂ w wodzie to zawiesina, nie jednorodny roztwór. Znikoma rozpuszczona część może wpływać na odczyn, ale nie traktuj zawiesiny jak roztworu NaOH.<\/p>\n<h3 id=\"wapno\">6.5 Wodorotlenek wapnia — wapno palone, gaszone, mleko i woda wapienna<\/h3>\n<div class=\"card card-core\">\n<span class=\"card-label\">Schemat — nie myl nazw<\/span>\n<div class=\"lime-flow\">\n<div class=\"lime-box\"><strong>Wapno palone<\/strong>CaO<br/><span style=\"font-size:12px;color:var(--text-muted)\">tlenek wapnia<\/span><\/div>\n<div class=\"lime-arrow\">+ H₂O →<\/div>\n<div class=\"lime-box\"><strong>Wapno gaszone<\/strong>Ca(OH)₂(s)<br/><span style=\"font-size:12px;color:var(--text-muted)\">wodorotlenek stały<\/span><\/div>\n<div class=\"lime-arrow\">+ H₂O →<\/div>\n<div class=\"lime-box\"><strong>Mleko wapienne<\/strong><br/><span style=\"font-size:12px;color:var(--text-muted)\">zawiesina Ca(OH)₂<\/span><\/div>\n<div class=\"lime-arrow\">po odstaniu i zlaniu cieczy →<\/div>\n<div class=\"lime-box\"><strong>Woda wapienna<\/strong><br/><span style=\"font-size:12px;color:var(--text-muted)\">klarowny roztwór Ca(OH)₂<\/span><\/div>\n<\/div>\n<ul>\n<li><strong>Mleko wapienne<\/strong> — mętna zawiesina Ca(OH)₂ w wodzie (dużo nierozpuszczonego osadu).<\/li>\n<li><strong>Woda wapienna<\/strong> — klarowny, nasycony roztwór Ca(OH)₂ (po odstaniu i zlaniu znad osadu). Jej pH wynosi około <strong>12,4<\/strong>.<\/li>\n<li><strong>Wykrywanie CO₂ (E8):<\/strong> <span class=\"formula\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O<\/span>. Woda wapienna mętnieje po przepuszczeniu przez nią odpowiedniej ilości CO₂, ponieważ powstaje osad CaCO₃. <span class=\"level-badge level-extra\">ROZSZERZENIE<\/span> Przy dużym nadmiarze CO₂ osad może się ponownie rozpuszczać, tworząc rozpuszczalny wodorowęglan wapnia: <span class=\"formula\" data-rx=\"caco3Co2H2o\">CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂<\/span>.<\/li>\n<li><strong>Zaprawa wapienna:<\/strong> twardnieje na powietrzu: <span class=\"formula\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃ + H₂O<\/span>.<\/li>\n<\/ul>\n<div class=\"table-wrap table-compact\" style=\"margin-top:12px;\">\n<table>\n<thead><tr><th>Cecha<\/th><th>Mleko wapienne<\/th><th>Woda wapienna<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Stan<\/td><td>zawiesina (mętna)<\/td><td>roztwór (klarowny)<\/td><\/tr>\n<tr><td>Skład<\/td><td>dużo nierozpuszczonego Ca(OH)₂<\/td><td>nasycony roztwór Ca(OH)₂<\/td><\/tr>\n<tr><td>Zastosowanie<\/td><td>bielenie, zaprawa<\/td><td>wykrywanie CO₂<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<p class=\"mini-note\">Dlaczego woda wapienna i mleko wapienne to ta sama substancja w różnych układach (równowaga osad ⇌ jony) — <a href=\"#moc-rozpuszczalnosc\">§10.3<\/a>. Otrzymywanie CaO + H₂O krok po kroku — <a href=\"#metody\">§7.1<\/a>; BHP gaszenia wapna — <a href=\"#bhp\">§9.2<\/a>.<\/p>\n<\/section>\n<section class=\"section\" id=\"otrzymywanie\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Otrzymywanie wodorotlenków <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"metody\">7.1 Trzy szkolne metody i ich warunki<\/h3>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-otrzymywanie-v01\"><button data-che-open-viz=\"n02-otrzymywanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-otrzymywanie-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Otrzymywanie wodorotlenków — trzy metody, „Jak otrzymać…?” i mapa przemian<\/b><span>Zlewka GFX.rx · reguły CHE.HYDROXIDES.obtain (kiedy metoda działa, a kiedy nie)<\/span><\/button><\/div>\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Otrzymywanie — trzy modele, ale z warunkami<\/h4>\n<ol>\n<li><strong>Tlenek zasadowy + woda<\/strong> — np. Na₂O + H₂O → 2NaOH. Nie każdy tlenek metalu reaguje z wodą w ten sposób.<\/li>\n<li><strong>Aktywny metal + woda<\/strong> — np. 2Na + 2H₂O → 2NaOH + H₂↑. Reakcja zależy od metalu i warunków. Wapń reaguje z zimną wodą spokojniej niż sód (Ca + 2H₂O → Ca(OH)₂ + H₂↑), magnez — dopiero z gorącą wodą (Mg + 2H₂O → Mg(OH)₂ + H₂↑).<\/li>\n<li><strong>Sól + zasada<\/strong> — np. FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl, jeśli powstający wodorotlenek jest dostatecznie trudno rozpuszczalny. Ca(OH)₂ wytrąca się w ten sposób tylko z roztworów stężonych, bo jest trudno, ale nie praktycznie nierozpuszczalny.<\/li>\n<\/ol>\n<p class=\"mini-note\">Typowe substraty: Na₂O, K₂O, CaO, BaO (metoda 1); Na, K, Ca (metoda 2); sole Cu²⁺, Fe²⁺, Fe³⁺, Mg²⁺, Al³⁺, Zn²⁺ + NaOH lub KOH (metoda 3).<\/p>\n<\/div>\n<div class=\"card card-warning\" id=\"uwaga-tlenki\">\n<span class=\"card-label\">Ważne rozróżnienie<\/span>\n<p><strong>Określenie „tlenek zasadowy” nie oznacza automatycznie, że tlenek reaguje z wodą.<\/strong><\/p>\n<p>Przykładowo <span class=\"formula\">CuO<\/span> reaguje z kwasami, ale nie reaguje z wodą. <span class=\"formula\">MgO<\/span> reaguje z wodą bardzo powoli, dlatego w zadaniach należy korzystać z podanej tabeli lub znanych przykładów.<\/p>\n<p>W szkole najczęściej spotkasz reakcje z wodą dla tlenków metali aktywnych: <span class=\"formula\">Na₂O<\/span>, <span class=\"formula\">K₂O<\/span>, <span class=\"formula\">CaO<\/span>, <span class=\"formula\">BaO<\/span>.<\/p>\n<\/div>\n<h4 style=\"margin:14px 0 6px\">Równanie krok po kroku — CaO + H₂O<\/h4><div class=\"equation-box\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/div><p class=\"mini-note\">Bilans atomów: Ca 1 = 1 · O 1 + 1 = 2 · H 2 = 2 ✓. Most N01 → N02: tlenek zasadowy + woda = wodorotlenek (gdy tlenek z wodą reaguje).<\/p>\n<h3 id=\"stracanie\">7.2 Strącanie wodorotlenków — barwy osadów<\/h3>\n<p>Metoda 3 to <strong>reakcja strąceniowa<\/strong>: kation metalu z roztworu soli łączy się z jonami OH⁻ z zasady i powstaje trudno rozpuszczalny osad. Barwa osadu pomaga rozpoznać kation.<\/p>\n<div class=\"equation-box\" data-rx=\"cuso4Naoh\">CuSO₄ + 2NaOH → Cu(OH)₂↓ + Na₂SO₄<\/div><p class=\"mini-note\">niebieski, galaretowaty osad — praktycznie nierozpuszczalny<\/p>\n<div class=\"equation-box\" data-rx=\"fecl3Naoh\">FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl<\/div><p class=\"mini-note\">rdzawobrunatny osad — w roztworze nad osadem prawie nie ma OH⁻, więc odczyn nie jest „jak po NaOH”. Animacja cząsteczkowa: <a href=\"#ion-lab\">§12<\/a>; zapis jonowy: <a href=\"#rownania-jonowe\">§13<\/a>.<\/p>\n<div class=\"equation-box\" data-rx=\"alcl3Naoh\">AlCl₃ + 3NaOH → Al(OH)₃↓ + 3NaCl<\/div><p class=\"mini-note\">biały, galaretowaty osad; w nadmiarze NaOH roztwarza się (amfoteryczność, <a href=\"#amfoterycznosc\">§14<\/a>)<\/p>\n<div class=\"equation-box\">MgCl₂ + 2NaOH → Mg(OH)₂↓ + 2NaCl<\/div><p class=\"mini-note\">biały osad — tak w praktyce szkolnej otrzymuje się Mg(OH)₂<\/p>\n<div class=\"equation-box\">FeSO₄ + 2NaOH → Fe(OH)₂↓ + Na₂SO₄<\/div><p class=\"mini-note\">zielonkawy osad, który na powietrzu brunatnieje (niżej)<\/p>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Ciekawostka — Fe(OH)₂<\/span>\n<p><span class=\"formula\">Fe(OH)₂<\/span> jest zwykle opisywany jako osad zielonkawy, który w obecności tlenu z powietrza może utleniać się do brunatnego <span class=\"formula\">Fe(OH)₃<\/span>. Nie jest to wymagane na E8 — traktuj jako ciekawostkę.<\/p>\n<\/div>\n<\/section>\n<section class=\"section\" id=\"reakcje\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Reakcje wodorotlenków <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"zobojetnianie\">8.1 Zobojętnianie<\/h3>\n<p>Zobojętnianie: kwas + zasada → sól + woda. Jony H⁺ i OH⁻ łączą się w wodę.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-zobojetnianie-v01\"><button data-che-open-viz=\"n02-zobojetnianie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-zobojetnianie-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Zobojętnianie — licznik moli, pH, wskaźniki, jony H⁺ + OH⁻ → H₂O i krzywa pH<\/b><span>Zastępuje animację i symulator zobojętniania · CHE.HYDROXIDES.neutral (Kw), GFX.ions<\/span><\/button><\/div>\n<p>Postęp zobojętniania śledzimy wskaźnikiem: fenoloftaleina odbarwia się, gdy w roztworze znika nadmiar OH⁻ (barwy wskaźników — <a href=\"#ph-wskazniki\">§6.4<\/a>).<\/p>\n<div class=\"card card-core\"><span class=\"card-label\">Równania zobojętniania<\/span><div class=\"equation-box\" data-rx=\"hclNaOH\">NaOH(aq) + HCl(aq) → NaCl(aq) + H₂O(l)<\/div><div class=\"equation-box\" data-rx=\"kohHno3\">KOH(aq) + HNO₃(aq) → KNO₃(aq) + H₂O(l)<\/div><div class=\"equation-box\" data-rx=\"caoh2Hcl\">Ca(OH)₂(aq) + 2HCl(aq) → CaCl₂(aq) + 2H₂O(l)<\/div><div class=\"equation-box\" data-rx=\"h2so4Naoh\">2NaOH(aq) + H₂SO₄(aq) → Na₂SO₄(aq) + 2H₂O(l)<\/div><div class=\"equation-box\" data-rx=\"baoh2H2so4\">Ba(OH)₂(aq) + H₂SO₄(aq) → BaSO₄↓ + 2H₂O(l)<\/div><div class=\"equation-box\" data-rx=\"cuoh2H2so4\">Cu(OH)₂(s) + H₂SO₄(aq) → CuSO₄(aq) + 2H₂O(l)<\/div><div class=\"equation-box\" data-rx=\"aloh3Hcl\">Al(OH)₃(s) + 3HCl(aq) → AlCl₃(aq) + 3H₂O(l)<\/div><p class=\"mini-note\">Kontrola: liczba OH⁻ z zasady = liczba H⁺ z kwasu.<\/p>\n<\/div><div class=\"card card-warning\"><span class=\"card-label\">Uwaga o Ba(OH)₂ + H₂SO₄<\/span><p>Zachodzą <strong>dwa procesy naraz<\/strong>: H⁺ + OH⁻ → H₂O (zobojętnianie) oraz Ba²⁺ + SO₄²⁻ → BaSO₄↓ (strącanie). Dlatego roztwór mętnieje.<\/p><\/div>\n<h4 class=\"merge-h\">Licznik moli<\/h4>\n<p>Dolewaj kwas do zasady i obserwuj, kiedy nastąpi zobojętnienie. To stechiometria w praktyce.<\/p>\n<p class=\"mini-note\">Licznik moli jest w modelu z tej podsekcji: n(OH⁻) na początku, n(H⁺) dodane, nadmiar, pH i objętość w punkcie równoważnikowym. <b>Założenia:<\/b> mocny kwas + mocna zasada, pełna dysocjacja, pH z iloczynu jonowego wody K<sub>w<\/sub> = 10⁻¹⁴, bez aktywności jonów i zmian temperatury. Objętość nie zmienia bilansu moli — zmienia stężenia i pH.<\/p>\n<p class=\"mini-note\">Zapis jonowy zobojętniania (jony widzowe, równanie skrócone H⁺ + OH⁻ → H₂O): <a href=\"#rownania-jonowe\">§13<\/a>.<\/p>\n<h3 id=\"co2-rozklad\">8.2 Reakcja z CO₂ i rozkład termiczny<\/h3>\n<div class=\"card card-basic\">\n<p><strong>Zasady reagują z tlenkami kwasowymi<\/strong>, np. z CO₂ — powstaje sól i woda:<\/p>\n<div class=\"equation-box\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O<\/div>\n<div class=\"equation-box\">2NaOH + CO₂ → Na₂CO₃ + H₂O<\/div>\n<p>Pierwsza reakcja to wykrywanie CO₂ wodą wapienną i twardnienie zaprawy (<a href=\"#wapno\">§6.5<\/a>). Druga wyjaśnia, dlaczego NaOH przechowuje się szczelnie: oprócz wilgoci pochłania też CO₂ z powietrza.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Rozkład termiczny<\/span> <span class=\"level-badge level-understand\">ROZUMIENIE<\/span>\n<p>Trudno rozpuszczalne wodorotlenki podczas ogrzewania rozkładają się na tlenek i wodę, np. <span class=\"formula\">Cu(OH)₂ → CuO + H₂O<\/span> (niebieski osad czernieje), <span class=\"formula\">2Fe(OH)₃ → Fe₂O₃ + 3H₂O<\/span>, <span class=\"formula\">Mg(OH)₂ → MgO + H₂O<\/span>. Wodorotlenki litowców (NaOH, KOH) w zwykłych warunkach w ten sposób się nie rozkładają — topią się.<\/p>\n<\/div>\n<h3 id=\"mapa-przemian\">8.3 Mapa przemian i reaktor<\/h3>\n<div class=\"card card-core\"><span class=\"card-label\">Mapa przemian<\/span><ul><li><strong>tlenek zasadowy + woda<\/strong> → wodorotlenek (tylko tlenki metali aktywnych)<\/li><li><strong>metal aktywny + woda<\/strong> → wodorotlenek + H₂↑<\/li><li><strong>sól metalu + zasada<\/strong> → wodorotlenek↓ + sól (gdy wodorotlenek trudno rozpuszczalny)<\/li><li><strong>wodorotlenek rozpuszczalny + woda<\/strong> → zasada (roztwór, jony OH⁻)<\/li><li><strong>kwas + zasada<\/strong> → sól + woda<\/li><li><strong>ogrzewanie<\/strong> wodorotlenku (poza litowcami) → tlenek + woda (<a href=\"#co2-rozklad\">§8.2<\/a>)<\/li><\/ul><p class=\"mini-note\">Interaktywna mapa dla wybranego wodorotlenku (z równaniami z silnika): model z <a href=\"#metody\">§7.1<\/a>, zakładka „Mapa przemian”.<\/p>\n<\/div>\n<p id=\"reactor\"><strong>Reaktor:<\/strong> Wybierz dwa substraty — sprawdź, czy zachodzi reakcja i jaka.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-reaktor-v01\"><button data-che-open-viz=\"n02-reaktor-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-reaktor-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Reaktor: wodorotlenek + odczynnik — przewiduj, potem sprawdź<\/b><span>CHE.HYDROXIDES.predict · H₂O, HCl, HNO₃, H₂SO₄, NaOH, CO₂, ogrzewanie, powietrze<\/span><\/button><\/div>\n<\/section>\n<section class=\"section\" id=\"zastosowania\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Zastosowania, BHP i życie codzienne <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"zastosowania-lista\">9.1 Zastosowania<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Zastosowania (PP)<\/span>\n<ul>\n<li><strong>NaOH:<\/strong> produkcja mydła, udrażnianie rur, przemysł papierniczy i chemiczny, oczyszczanie spalin.<\/li>\n<li><strong>KOH:<\/strong> mydła potasowe (płynne), baterie alkaliczne, laboratoryjnie.<\/li>\n<li><strong>Ca(OH)₂:<\/strong> budownictwo (zaprawa), rolnictwo (odkwaszanie gleby — wapnowanie), bielenie pni drzew i ścian, uzdatnianie wody, wykrywanie CO₂ (woda wapienna).<\/li>\n<li><strong>Al(OH)₃:<\/strong> leki na zgagę — neutralizuje nadmiar kwasu solnego w żołądku (Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O).<\/li>\n<li><strong>Mg(OH)₂:<\/strong> zawiesina „mleko magnezowe” — środek zobojętniający kwas żołądkowy i przeczyszczający; dodatek ognioodporny do tworzyw.<\/li>\n<\/ul>\n<\/div>\n<h3 id=\"bhp\">9.2 BHP — NaOH, KOH, CaO i związki baru<\/h3>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Ochrona<\/span>\n<p><strong>Ochrona:<\/strong> okulary ochronne i odpowiednie rękawice; substancje są silnie żrące. <strong>NaOH i KOH powodują oparzenia chemiczne skóry i oczu<\/strong> — nie dotykaj ich gołymi rękami; przechowuj w szczelnych naczyniach.<\/p>\n<\/div>\n<div class=\"rule-box\" style=\"background:var(--c-warn-bg);border-color:var(--c-warn-line)\">\n<h4 class=\"merge-h\">Rozpuszczanie stałego NaOH / KOH<\/h4>\n<p><strong>Okulary ochronne:<\/strong> stały NaOH/KOH oraz ich stężone roztwory są żrące.<\/p>\n<ol>\n<li>Przygotuj wodę.<\/li>\n<li>Dodawaj stały NaOH/KOH <strong>małymi porcjami do wody<\/strong>.<\/li>\n<li>Mieszaj i kontroluj temperaturę.<\/li>\n<li>Nie dodawaj wody do dużej porcji stałego NaOH/KOH.<\/li>\n<li>Po kontakcie ze skórą lub oczami natychmiast płucz dużą ilością wody i zgłoś zdarzenie nauczycielowi/opiekunowi, zgodnie z procedurą pracowni.<\/li>\n<\/ol>\n<p class=\"mini-note\">Powód: rozpuszczanie jest silnie egzotermiczne i może powodować gwałtowne nagrzanie oraz rozprysk.<\/p>\n<\/div>\n<div class=\"rule-box\" style=\"background:var(--c-warn-bg);border-color:var(--c-warn-line)\">\n<h4 class=\"merge-h\">Gaszenie wapna: CaO + H₂O<\/h4>\n<p>Doświadczenie wykonuje nauczyciel lub osoba prowadząca doświadczenie zgodnie z procedurą pracowni. CaO dodaje się ostrożnie, małymi porcjami; reakcja jest silnie egzotermiczna. Nie pochylaj się nad naczyniem i nie dotykaj gorącego układu. Nie dotykaj CaO mokrymi rękami — drobne cząstki Ca(OH)₂ unoszące się z parą są żrące dla oczu.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Inne zagrożenia<\/span>\n<ul>\n<li><strong>Związki baru:<\/strong> jony Ba²⁺ są toksyczne — Ba(OH)₂ nie jest stosowany w doświadczeniach uczniowskich.<\/li>\n<li><strong>Sód i potas:<\/strong> reagują z wodą gwałtownie, wydziela się palny wodór — wyłącznie pokaz nauczyciela, bardzo mała porcja metalu, osłona.<\/li>\n<li><strong>Środki do udrażniania rur<\/strong> zawierają NaOH — używaj w rękawicach, nie mieszaj z innymi środkami czystości (zwłaszcza kwasowymi).<\/li>\n<\/ul>\n<\/div>\n<h3 id=\"zycie\">9.3 Z życia codziennego — pytania<\/h3>\n<div class=\"card\">\n<p><strong>1. Dlaczego NaOH jest w środkach do udrażniania rur?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p>NaOH jest silnie żrący i rozkłada tłuszcze oraz białka (zmydlanie). <strong>BHP:<\/strong> bardzo niebezpieczny.<\/p>\n<\/details>\n<\/div>\n<div class=\"card\">\n<p><strong>2. Dlaczego woda wapienna mętnieje przy dmuchaniu?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p><span class=\"formula\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O<\/span>. Trudno rozpuszczalny CaCO₃ tworzy osad. Przy dużym nadmiarze CO₂ osad może się ponownie rozpuszczać (powstaje Ca(HCO₃)₂).<\/p>\n<\/details>\n<\/div>\n<div class=\"card\">\n<p><strong>3. Dlaczego mydło ma odczyn lekko zasadowy?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p>Mydło to sól słabego kwasu i mocnej zasady. W wodzie ulega hydrolizie — powstają jony OH⁻.<\/p>\n<\/details>\n<\/div>\n<div class=\"card\">\n<p><strong>4. Dlaczego preparaty na zgagę zawierają Al(OH)₃ lub Mg(OH)₂?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p>Neutralizują HCl w żołądku: <span class=\"formula\" data-rx=\"aloh3Hcl\">Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O<\/span>. Nie są tak żrące jak NaOH.<\/p>\n<\/details>\n<\/div>\n<div class=\"card\">\n<p><strong>5. Dlaczego wapno palone gaśnie po zalaniu wodą?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p><span class=\"formula\">CaO + H₂O → Ca(OH)₂ + ciepło<\/span>. Reakcja egzotermiczna. <strong>BHP:<\/strong> nie dotykać mokrymi rękami.<\/p>\n<\/details>\n<\/div>\n<p class=\"mini-note\">Czy woda amoniakalna to wodorotlenek? — <a href=\"#zasada-oh\">§10.2<\/a>.<\/p>\n<\/section>\n<section class=\"section\" id=\"model\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Model bez skrótów — cztery pytania o wodorotlenek <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<p class=\"lead\"><strong>Cel korekty:<\/strong> oddzielić budowę substancji, jej rozpuszczalność, dysocjację i odczyn. Te cztery rzeczy są powiązane, ale nie są tym samym.<\/p>\n<h3 id=\"cztery-pytania\">10.1 Cztery pytania zamiast jednego hasła „zasada”<\/h3>\n<div class=\"rule-box\">\n<ol>\n<li><strong>Co to jest?<\/strong> Wodorotlenek metalu to związek zawierający kation metalu i aniony OH⁻; szkolny wzór zapisu składu ma postać M(OH)<sub>n<\/sub>.<\/li>\n<li><strong>Czy rozpuszcza się w wodzie?<\/strong> To pytanie o ilość substancji, która przechodzi do roztworu.<\/li>\n<li><strong>Co dzieje się z częścią rozpuszczoną?<\/strong> Dla typowych dobrze rozpuszczalnych wodorotlenków szkolny model zakłada praktycznie całkowitą dysocjację: NaOH → Na⁺ + OH⁻.<\/li>\n<li><strong>Jaki jest odczyn roztworu?<\/strong> Jeśli w roztworze jest zwiększone stężenie OH⁻, roztwór ma odczyn zasadowy.<\/li>\n<\/ol>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Pytanie<\/th><th>Co sprawdzamy?<\/th><th>Przykład<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Co to jest?<\/td><td>budowa związku<\/td><td>Ca(OH)₂<\/td><\/tr>\n<tr><td>Czy się rozpuszcza?<\/td><td>ile substancji przechodzi do roztworu<\/td><td>Ca(OH)₂ — ograniczenie rozpuszczalności<\/td><\/tr>\n<tr><td>Co jest w roztworze?<\/td><td>jony rozpuszczonej części<\/td><td>Ca²⁺ i OH⁻<\/td><\/tr>\n<tr><td>Jaki jest odczyn?<\/td><td>związany ze stężeniem jonów w roztworze<\/td><td>woda wapienna ma odczyn zasadowy<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p><strong>Wniosek:<\/strong> „trudno rozpuszczalny” nie znaczy „słaba zasada” w tym samym sensie co przy kwasach. Najpierw trzeba ustalić, ile substancji jest w roztworze, a dopiero potem rozpatrywać zachowanie rozpuszczonej części.<\/p>\n<\/div>\n<h3 id=\"zasada-oh\">10.2 Wodorotlenek ≠ zasada ≠ OH⁻; amoniak i NH₄OH<\/h3>\n<div class=\"rule-box\" style=\"background:var(--c-warn-bg);border-color:var(--c-warn-line)\">\n<ul>\n<li><strong>OH⁻<\/strong> jest konkretnym anionem wodorotlenkowym.<\/li>\n<li><strong>Wodorotlenek<\/strong> jest związkiem chemicznym, np. NaOH(s), Ca(OH)₂(s), Cu(OH)₂(s).<\/li>\n<li><strong>Roztwór zasadowy<\/strong> zawiera nadmiar jonów OH⁻ względem czystej wody.<\/li>\n<li>W szerszym ujęciu <strong>zasada nie musi być wodorotlenkiem<\/strong>: NH₃ jest zasadą Brønsteda, bo może przyjąć proton, tworząc NH₄⁺.<\/li>\n<\/ul>\n<p>Szkolny skrót „zasada = rozpuszczalny wodorotlenek” jest użyteczny na poziomie E8, ale nie jest pełną definicją chemiczną.<\/p>\n<\/div>\n<div class=\"rule-box\">\n<b>Uwaga o definicji szkolnej:<\/b> powyższe rozróżnienie to <strong>definicja szkolna<\/strong> (Arrheniusa). W szerszym ujęciu chemicznym (liceum, teoria Brønsteda) zasadami są także inne substancje zdolne do przyjmowania protonów (H⁺) — np. amoniak NH₃. Historia pojęcia i teoria Brønsteda: <a href=\"#ambitny\">Dodatek B<\/a>.\n      <\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Amoniak i zapis NH₄OH — pułapka E8<\/span>\n<p><strong>Amoniak NH₃<\/strong> i woda amoniakalna dają odczyn zasadowy, ale NH₃ <em>nie jest wodorotlenkiem<\/em> (brak metalu i grupy OH⁻ we wzorze substancji). To zasada w sensie Brønsteda / odczynu roztworu — szczegóły w <a href=\"#ambitny\">Dodatku B<\/a>.<\/p>\n<p><span class=\"formula\">NH₄OH<\/span> można spotkać jako tradycyjny skrót. Dokładniejszy model wodnego amoniaku:<\/p>\n<div class=\"equation-box\"><strong>NH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq)<\/strong><\/div>\n<p>Woda amoniakalna to roztwór <span class=\"formula\">NH₃<\/span> w wodzie. Część cząsteczek reaguje: <span class=\"formula\">NH₃ + H₂O ⇌ NH₄⁺ + OH⁻<\/span>. Powstają jony OH⁻, więc odczyn jest zasadowy, ale wzór „NH₄OH” to uproszczenie szkolne — w rzeczywistości nie ma stabilnej cząsteczki NH₄OH jak w NaOH. Na E8 wystarczy: roztwór amoniaku ma odczyn zasadowy i reaguje z kwasami.<\/p>\n<\/div>\n<h3 id=\"moc-rozpuszczalnosc\">10.3 Rozpuszczalność, dysocjacja i moc — przykład Ca(OH)₂<\/h3>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Rozpuszczalny ≠ mocny<\/span>\n<p><strong>Rozpuszczalność<\/strong> mówi, ile substancji przechodzi do wody. <strong>Moc zasady<\/strong> mówi, jak duża część rozpuszczonej substancji tworzy jony. To różne pojęcia.<\/p>\n<p>Na poziomie klasy 8 najważniejsze jest, że dobrze rozpuszczalne wodorotlenki dają roztwory zawierające dużo jonów OH⁻. Ca(OH)₂ jest słabo rozpuszczalny, ale jego rozpuszczona część dysocjuje praktycznie całkowicie — dlatego woda wapienna ma wyraźny odczyn zasadowy.<\/p>\n<\/div>\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Model rozpuszczania Ca(OH)₂ — nie myl osadu z roztworem<\/h4>\n<p>Ca(OH)₂ jest trudno rozpuszczalny. Ustala się równowaga między fazą stałą a jonami w roztworze:<\/p>\n<div class=\"equation-box\"><strong>Ca(OH)₂(s) ⇌ Ca²⁺(aq) + 2OH⁻(aq)<\/strong><\/div>\n<p><strong>Woda wapienna<\/strong> to klarowny, nasycony roztwór zawierający rozpuszczoną część Ca(OH)₂. <strong>Mleko wapienne<\/strong> to zawiesina, w której pozostaje dużo fazy stałej. Nie są to dwie różne substancje.<\/p>\n<\/div>\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Dysocjacja a zapis wzoru<\/h4>\n<p>Nawias w <strong>Ca(OH)₂<\/strong> oznacza, że jednostka składu zawiera dwa aniony OH⁻. Po rozpuszczeniu zapisujemy:<\/p>\n<div class=\"equation-box\"><strong>Ca(OH)₂(aq) → Ca²⁺(aq) + 2OH⁻(aq)<\/strong><\/div>\n<p>To nie oznacza, że w wodzie pływają „cząsteczki Ca(OH)₂” w takim samym sensie jak pojedyncze cząsteczki substancji kowalencyjnej. W szkolnym modelu dla rozpuszczonej soli/wodorotlenku śledzimy przede wszystkim jony.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Iloczyn rozpuszczalności — skąd pH 12,4 wody wapiennej? <span class=\"adv-tag\">poziom LO / akademicki<\/span><\/summary><div class=\"adv-body\"><p>Dla osadu M(OH)ₙ(s) ⇌ Mⁿ⁺ + n OH⁻: K<sub>sp<\/sub> = [Mⁿ⁺]·[OH⁻]ⁿ. Rozpuszczalność molowa s = (K<sub>sp<\/sub>/nⁿ)<sup>1/(n+1)<\/sup>, [OH⁻] = n·s, pH = 14 + log[OH⁻].<\/p><div class=\"table-wrap table-compact\"><table><thead><tr><th>Wodorotlenek<\/th><th>K<sub>sp<\/sub> (25 °C)<\/th><th>s (mol/dm³)<\/th><th>pH nasyconego<\/th><\/tr><\/thead><tbody><tr><td>Ca(OH)₂<\/td><td>5,5e-06<\/td><td>1,1e-02<\/td><td>12,3<\/td><\/tr><tr><td>Mg(OH)₂<\/td><td>5,6e-12<\/td><td>1,1e-04<\/td><td>10,3<\/td><\/tr><tr><td>Fe(OH)₂<\/td><td>4,9e-17<\/td><td>2,3e-06<\/td><td>8,7<\/td><\/tr><tr><td>Fe(OH)₃<\/td><td>2,8e-39<\/td><td>1,0e-10<\/td><td>7,0 (≈ obojętny)<\/td><\/tr><tr><td>Cu(OH)₂<\/td><td>2,2e-20<\/td><td>1,8e-07<\/td><td>7,5 (≈ obojętny)<\/td><\/tr><tr><td>Zn(OH)₂<\/td><td>3,0e-17<\/td><td>2,0e-06<\/td><td>8,6<\/td><\/tr><tr><td>Al(OH)₃<\/td><td>1,3e-33<\/td><td>2,6e-09<\/td><td>7,0 (≈ obojętny)<\/td><\/tr><tr><td>Ni(OH)₂<\/td><td>5,5e-16<\/td><td>5,2e-06<\/td><td>9,0<\/td><\/tr><tr><td>Mn(OH)₂<\/td><td>2,0e-13<\/td><td>3,7e-05<\/td><td>9,9<\/td><\/tr><\/tbody><\/table><\/div><p class=\"mini-note\">Ca(OH)₂: s ≈ 0,011 mol/dm³ → pH ≈ 12,35 (pomiar ≈ 12,4); Mg(OH)₂: pH ≈ 10,4 (mleko magnezowe). Dla Fe(OH)₃ czy Cu(OH)₂ jonów OH⁻ z osadu jest mniej niż w czystej wodzie — dlatego zawiesina nie zmienia odczynu. Wartości: CHE.HYDROXIDES.KSP / satpH.<\/p>\n<\/div><\/details>\n<\/section>\n<section class=\"section\" id=\"modele-budowy\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Modele budowy — rysunek szkolny a sieć jonowa <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<h3 id=\"model3d\">11.1 Dwa szkolne sposoby rysowania: NaOH, Ca(OH)₂, Al(OH)₃<\/h3>\n<p>W polskich podręcznikach kl. 8 wodorotlenki rysuje się jak poniżej: <strong>ciągła kreska<\/strong> = wiązanie kowalencyjne spolaryzowane O–H w grupie OH⁻, <strong>przerywana<\/strong> = oddziaływanie elektrostatyczne o charakterze jonowym między kationem metalu a jonami OH⁻. Rysunek jest modelem poglądowym, a nie dokładną geometrią struktury krystalicznej.<\/p>\n<div class=\"widget\">\n<h4>Porównanie struktury (styl podręcznikowy)<\/h4>\n<p class=\"widget-hint\">NaOH: jedna grupa OH⁻. Ca(OH)₂: dwie grupy OH⁻ — zapis składu związku, nie wzór strukturalny H–O–Ca–O–H.<\/p>\n<div style=\"display:grid;grid-template-columns:1fr;gap:14px;\">\n<div style=\"background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center;\">\n<div style=\"font-size:12px;font-weight:800;color:var(--text-muted);margin-bottom:8px;\">NaOH — wodorotlenek sodu<\/div>\n<div class=\"svgx\"><span>Na<\/span><span>O<\/span><span>H<\/span><span>Na⁺<\/span><span>OH⁻<\/span><span>- - - oddziaływanie jonowe —— kowalencyjne O–H<\/span><\/div><p class=\"mini-note\">Ten sam układ (kation, grupy OH⁻, nawias) pokazuje interaktywnie model „Wzór wodorotlenku” w <a href=\"#wzor-ogolny\">§5.2<\/a>: modele A, B i jony.<\/p>\n<\/div>\n<div style=\"background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center;\">\n<div style=\"font-size:12px;font-weight:800;color:var(--text-muted);margin-bottom:8px;\">Ca(OH)₂ — wodorotlenek wapnia (model poglądowy)<\/div>\n<div class=\"svgx\"><span>H<\/span><span>O<\/span><span>Ca<\/span><span>OH⁻<\/span><span>Ca²⁺<\/span><span>zapis poglądowy: H–O–Ca–O–H<\/span><\/div>\n<\/div>\n<div style=\"background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center;grid-column:1/-1;\">\n<div style=\"font-size:12px;font-weight:800;color:var(--text-muted);margin-bottom:8px;\">Widok poglądowy składu — Ca(OH)₂ i Al(OH)₃ (nie przedstawia rzeczywistej geometrii kryształu)<\/div>\n<div style=\"display:grid;grid-template-columns:1fr;gap:10px;\">\n<div id=\"modelBrCa\"><\/div>\n<div id=\"modelBrAl\"><\/div>\n<\/div>\n<p class=\"mini-note\" style=\"margin-top:8px;\">Ramiona M···O mogą iść pod kątem; <strong>grupa O–H zawsze w poziomie<\/strong> (jak w podręczniku). To <strong>model szkolny<\/strong> (ZPE / podręczniki kl. 8). W ciele stałym wodorotlenek to <strong>sieć jonów<\/strong>, a nie pojedyncza „cząsteczka” HO–M–OH.<\/p>\n<\/div>\n<\/div>\n<div class=\"bond-legend\">\n<span><i class=\"bl-solid\"><\/i> wiązanie kowalencyjne O–H wewnątrz grupy OH⁻<\/span>\n<span><i class=\"bl-dash\"><\/i> oddziaływanie elektrostatyczne (jonowe) kation···OH⁻<\/span>\n<\/div>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Model A — szkolny, po prawej<\/span>\n<p>Najczęściej spotykany w podręcznikach. Grupy <span class=\"formula\">OH⁻<\/span> rysuje się <strong>po jednej stronie<\/strong> kationu, zwykle po prawej. <strong>Linia od metalu do O<\/strong> jest przerywana, a <strong>linia od O do H<\/strong> jest ciągła.<\/p>\n<div class=\"formula-lg\">Al(OH)₃<\/div>\n<div class=\"svgx\"><span>O<\/span><span>H<\/span><span>Al<\/span><\/div>\n<p><strong>To jest model szkolny (A)<\/strong> — dobry do zrozumienia, ile jest grup OH⁻. Nie jest dokładną geometrią kryształu.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Model B — przestrzenny, bez udawania wzoru strukturalnego<\/span>\n<p>Jeżeli pokazujemy grupy <span class=\"formula\">OH⁻<\/span> po obu stronach metalu, <strong>nie zmieniamy ich orientacji w napis „HO”<\/strong>. Każda grupa pozostaje jednym blokiem <span class=\"formula\">OH⁻<\/span>. Schemat pokazuje relację przestrzenną, a nie rzeczywistą geometrię kryształu.<\/p>\n<div class=\"formula-lg\">Al(OH)₃<\/div>\n<div class=\"svgx\"><span>OH⁻<\/span><span>Al³⁺<\/span><span>centrum<\/span><\/div>\n<p><strong>Nie czytaj tego jako „Al–O–H” w jednej osi.<\/strong> Linie przerywane są tylko znakiem relacji/modelu. Nie są wiązaniami strukturalnymi. Najważniejsze: <span class=\"formula\">Al³⁺ + 3 OH⁻ → Al(OH)₃<\/span> oraz suma ładunków <span class=\"formula\">+3 + 3·(−1) = 0<\/span>.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dlaczego obie konwencje są poprawne?<\/span>\n<p>W obu wariantach widać to samo: atom metalu jest połączony z <strong>n grupami OH⁻<\/strong> i związek ma ten sam wzór sumaryczny <span class=\"formula\">M(OH)ₙ<\/span>.<\/p>\n<p>Różnica nie dotyczy <strong>składu chemicznego<\/strong>, tylko <strong>sposobu przedstawienia<\/strong>.<\/p>\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr><th>Poziom<\/th><th>Preferowana konwencja<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>Szkoła podstawowa<\/td><td>Wariant A — czytelność i prostota<\/td><\/tr>\n<tr><td>Liceum / rozszerzenie<\/td><td>Wariant B — większy realizm przestrzenny<\/td><\/tr>\n<tr><td>Olimpiada / chemia zaawansowana<\/td><td>Wariant B lub bardziej złożone zapisy polimeryczne<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Jak rysować — krok po kroku<\/span>\n<ol>\n<li>Zacznij od wzoru sumarycznego: np. <span class=\"formula\">Al(OH)₃<\/span>.<\/li>\n<li>Odczytaj ładunek kationu.<\/li>\n<li>Ustal (policz) liczbę grup <span class=\"formula\">OH⁻<\/span>.<\/li>\n<li>Rysuj każdą grupę <span class=\"formula\">OH⁻<\/span> jako jeden blok.<\/li>\n<li>Zapisz wzór sumaryczny: <span class=\"formula\">NaOH<\/span>, <span class=\"formula\">Ca(OH)₂<\/span>, <span class=\"formula\">Al(OH)₃<\/span>.<\/li>\n<li>W praktyce szkolnej wybierz <strong>czytelny model A<\/strong>, jeśli nie ma polecenia o geometrii przestrzennej.<\/li>\n<\/ol>\n<p>Ważne jest, żeby z rysunku było jasne: <strong>ile grup OH⁻ jest przyłączonych<\/strong>.<\/p>\n<\/div>\n<h3 id=\"siec-jonowa\">11.2 Model a rzeczywista struktura — sieć jonowa<\/h3>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Kluczowa poprawka<\/span>\n<p>Zapis <span class=\"formula\">Ca(OH)₂<\/span> jest zapisem <strong>składu związku<\/strong>, a nie wzorem strukturalnym pojedynczej cząsteczki. W uproszczonym modelu pokazujemy jon <span class=\"formula\">Ca²⁺<\/span> oraz dwa jony <span class=\"formula\">OH⁻<\/span>.<\/p>\n<p>W krysztale <span class=\"formula\">Ca(OH)₂<\/span> występuje uporządkowana <strong>sieć jonów<\/strong>, a nie pojedyncza cząsteczka <span class=\"formula\">H–O–Ca–O–H<\/span>. Rysunek <span class=\"formula\">H–O–Ca–O–H<\/span> jest tylko <strong>modelem poglądowym rozmieszczenia jonów<\/strong> — nie wzorem strukturalnym cząsteczki.<\/p>\n<p>Stały wodorotlenek wapnia nie jest pojedynczą cząsteczką typu <span class=\"formula\">H–O–Ca–O–H<\/span>. Taki rysunek może służyć wyłącznie jako model poglądowy liczby grup OH⁻.<\/p>\n<p>Najważniejsze jest, aby z rysunku było jasne: <strong>ile grup <span class=\"formula\">OH⁻<\/span> przyłącza się do kationu<\/strong> i że każda grupa <span class=\"formula\">OH<\/span> jest traktowana jako <strong>jedna całość<\/strong>.<\/p>\n<p>Żaden z tych rysunków nie odtwarza dokładnie budowy kryształu w stanie stałym. Dlatego oba wzory to <strong>modele poglądowe<\/strong> — przydatne w nauce, ale nie całkowicie dokładne.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Jak naprawdę wygląda kryształ Ca(OH)₂ i Mg(OH)₂? <span class=\"adv-tag\">poziom akademicki<\/span><\/summary><div class=\"adv-body\"><p>Ca(OH)₂ (portlandyt) i Mg(OH)₂ (brucyt) mają <strong>strukturę warstwową<\/strong>: płaskie warstwy kationów M²⁺ leżą między dwiema warstwami jonów OH⁻. Każdy kation otacza sześć jonów OH⁻ (koordynacja oktaedryczna), a każdy jon OH⁻ łączy trzy kationy. Wiązania O–H są ustawione prostopadle do warstw, a sąsiednie warstwy trzymają się słabymi oddziaływaniami — dlatego kryształy łatwo się łupią. To wyjaśnia, dlaczego „cząsteczka H–O–Ca–O–H” nie istnieje: każdy Ca²⁺ ma sześciu sąsiadów OH⁻, a nie dwóch.<\/p><\/div><\/details>\n<\/section>\n<section class=\"section\" id=\"ion-lab\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Strącanie od środka — laboratorium jonowe <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<p>Zobacz, jak swobodne jony poruszają się w roztworze, zbliżają się dzięki oddziaływaniom elektrostatycznym, a następnie mogą tworzyć skupiska i osad. To jest <strong>model strącania od środka<\/strong>, a nie film dosłownej trajektorii każdego jonu.<\/p>\n<div class=\"card card-understand\" id=\"n02-ion-model-rules\">\n<div class=\"card-label\">Co naprawdę pokazuje animacja?<\/div>\n<ol><li><strong>Co widzę?<\/strong> — swobodne jony poruszają się w roztworze.<\/li><li><strong>Co robię?<\/strong> — obserwuję zbliżanie się kationu i jonów <span class=\"formula\">OH⁻<\/span>.<\/li><li><strong>Dlaczego?<\/strong> — ładunki przeciwne przyciągają się elektrostatycznie; samo przyciąganie nie oznacza jednak, że każdy kontakt od razu tworzy trwały osad.<\/li><li><strong>Jak sprawdzam?<\/strong> — sprawdzam proporcję jonów, rozpuszczalność produktu i zapis równania jonowego.<\/li><\/ol>\n<p class=\"widget-hint\">Model dydaktyczny: wolne jony → zbliżanie i zderzenia → krótkotrwałe skupiska → zarodki → osad.<\/p>\n<p><strong>Ważne:<\/strong> w modelu animacji mogą pojawiać się krótkotrwałe, niepełne skupiska lub etapy pośrednie. Nie przedstawiamy ich jako „gotowych cząsteczek po kolei”, lecz jako uproszczony model zbliżania, reorganizacji i tworzenia zarodków osadu.<\/p>\n<p>Rzeczywisty proces jest bardziej złożony i może obejmować formy pośrednie oraz kompleksy. Animacja ma pokazać ideę powstawania fazy stałej, a nie pełną kinetykę procesu.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-stracanie-v01\"><button data-che-open-viz=\"n02-stracanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-stracanie-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Laboratorium jonowe — strącanie 13 wodorotlenków (model cząsteczkowy)<\/b><span>CHE.sim.ParticleSim · barwy osadów CHE.COLORS · równania jonowe CHE.IONIC<\/span><\/button><\/div>\n<details class=\"adv\"><summary>Etapy pośrednie strącania — hydroksokompleksy <span class=\"adv-tag\">poziom LO / akademicki<\/span><\/summary><div class=\"adv-body\">\n<p>Ta animacja przedstawia <strong>uproszczony moment pojawienia się osadu<\/strong>. W rzeczywistości proces przebiega stopniowo: najpierw powstają hydroksokompleksy, np. <span class=\"formula\">Fe(OH)²⁺<\/span> i <span class=\"formula\">Fe(OH)₂⁺<\/span>, a dopiero później tworzy się <span class=\"formula\">Fe(OH)₃↓<\/span>.<\/p>\n<p><strong>Uproszczony ciąg:<\/strong> <span class=\"formula\">Fe³⁺ → Fe(OH)²⁺ → Fe(OH)₂⁺ → Fe(OH)₃⁰ → Fe(OH)₃↓<\/span>.<\/p>\n<p>Dla miedzi wygląda podobnie: <span class=\"formula\">[Cu(H₂O)₆]²⁺ → [Cu(H₂O)₅(OH)]⁺ → [Cu(H₂O)₄(OH)₂]⁰ → Cu(OH)₂↓<\/span>. To jest <strong>dobry model dydaktyczny<\/strong>, ale nie pełny opis mechanizmu chemicznego w roztworze.<\/p>\n<\/div><\/details>\n<p class=\"mini-note\">Równania strąceń i barwy osadów: <a href=\"#stracanie\">§7.2<\/a>; zapis jonowy: <a href=\"#rownania-jonowe\">§13<\/a>.<\/p>\n<\/section>\n<section class=\"section\" id=\"rownania-jonowe\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Równania jonowe <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<p>Równanie jonowe pokazuje, które jony naprawdę biorą udział w reakcji. Zapis prowadzimy w trzech krokach: cząsteczkowe → jonowe pełne → jonowe skrócone (bez jonów widzów).<\/p>\n<h3 id=\"jonowe-zobojetnianie\">13.1 Zobojętnianie w zapisie jonowym<\/h3>\n<div class=\"jonowe-box\">\n<span class=\"jb-level\">Liceum / konkurs<\/span>\n<p>Reakcja <span class=\"formula\">NaOH + HCl<\/span> na trzech poziomach:<\/p>\n<div class=\"jb-label\">1. Równanie cząsteczkowe (szkolne)<\/div>\n<div class=\"jb-eq\">NaOH(aq) + HCl(aq) → NaCl(aq) + H₂O(l)<\/div>\n<div class=\"jb-label\">2. Równanie jonowe pełne<\/div>\n<div class=\"jb-eq\">Na⁺ + OH⁻ + H⁺ + Cl⁻ → Na⁺ + Cl⁻ + H₂O<\/div>\n<div class=\"jb-label\">3. Równanie jonowe skrócone (istota reakcji)<\/div>\n<div class=\"jb-eq\">H⁺ + OH⁻ → H₂O<\/div>\n<p style=\"margin-top:12px;font-size:13.5px;\">Jony Na⁺ i Cl⁻ nie zmieniają się — to <strong>jony widzowe<\/strong>.<\/p>\n<p style=\"margin-top:10px;font-size:13px;\"><strong>Ważne:<\/strong> równania jonowe dotyczą <strong>roztworów wodnych<\/strong>. Nie należy rozpisywać na jony substancji stałych ani czystych cieczy. HCl, NaOH i NaCl zapisuje się jako jony tylko wtedy, gdy są w roztworze wodnym.<\/p>\n<\/div>\n<h3 id=\"jonowe-stracanie\">13.2 Strącanie i reakcje osadów w zapisie jonowym<\/h3>\n<div class=\"jonowe-box\">\n<span class=\"jb-level\">Liceum / konkurs<\/span>\n<div class=\"jb-label\">CuSO₄ + 2NaOH — jonowe pełne<\/div>\n<div class=\"jb-eq\">Cu²⁺ + SO₄²⁻ + 2Na⁺ + 2OH⁻ → Cu(OH)₂↓ + 2Na⁺ + SO₄²⁻<\/div>\n<div class=\"jb-label\">Jonowe skrócone<\/div>\n<div class=\"jb-eq\">Cu²⁺ + 2OH⁻ → Cu(OH)₂↓<\/div>\n<div class=\"jb-eq\">Fe³⁺ + 3OH⁻ → Fe(OH)₃↓<\/div>\n<div class=\"jb-eq\">Al³⁺ + 3OH⁻ → Al(OH)₃↓<\/div>\n<div class=\"jb-label\">Osad jako substrat — nie rozpisujemy go na jony<\/div>\n<div class=\"jb-eq\">Cu(OH)₂(s) + 2H⁺ → Cu²⁺ + 2H₂O<\/div>\n<div class=\"jb-label\">Ba(OH)₂ + H₂SO₄ — nic się nie skraca<\/div>\n<div class=\"jb-eq\">Ba²⁺ + 2OH⁻ + 2H⁺ + SO₄²⁻ → BaSO₄↓ + 2H₂O<\/div>\n<p style=\"margin-top:10px;font-size:13px;\">W ostatniej reakcji wszystkie jony biorą udział w przemianie — powstaje osad i woda, dlatego nie ma jonów widzów.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"rownania-jonowe-v01\"><button data-che-open-viz=\"rownania-jonowe-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'rownania-jonowe-v01',lessonId:'N02'},'*')\" type=\"button\"><b>Równania jonowe — wszystkie reakcje z silnika (strącanie OH⁻, zobojętnianie)<\/b><span>Zapis cząsteczkowy, jonowy pełny i skrócony · CHE.IONIC<\/span><\/button><\/div>\n<p class=\"mini-note\">Zapis zobojętniania: cząsteczkowy, jonowy pełny i jonowy skrócony — w modelu „Równania jonowe” wyżej wybierz reakcję HCl + NaOH (jeden model dla wszystkich równań jonowych lekcji).<\/p>\n<\/section>\n<section class=\"section\" id=\"amfoterycznosc\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Amfoteryczność <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Rozumienie rozszerzone<\/span>\n<p><strong>Amfoteryczny<\/strong> = reaguje z kwasami i z mocnymi zasadami. Najważniejsze: <span class=\"formula\">Al(OH)₃<\/span> i <span class=\"formula\">Zn(OH)₂<\/span>.<\/p>\n<div class=\"table-wrap table-compact table-amph-desktop\">\n<table>\n<thead><tr><th>Wodorotlenek<\/th><th>Z kwasem<\/th><th>Z mocną zasadą<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Al(OH)₃<\/td><td>Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O<\/td><td>Al(OH)₃ + NaOH → Na[Al(OH)₄]<\/td><\/tr>\n<tr><td>Zn(OH)₂<\/td><td>Zn(OH)₂ + 2HCl → ZnCl₂ + 2H₂O<\/td><td>Zn(OH)₂ + 2NaOH → Na₂[Zn(OH)₄]<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div aria-label=\"Amfoteryczność — widok kart\" class=\"amph-cards\">\n<div class=\"amph-card\"><strong>Al(OH)₃<\/strong>\n<div>Z kwasem: <span class=\"formula\" data-rx=\"aloh3Hcl\">Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O<\/span><\/div>\n<div style=\"margin-top:6px;\">Z mocną zasadą: <span class=\"formula\">Al(OH)₃ + NaOH → Na[Al(OH)₄]<\/span><\/div>\n<\/div>\n<div class=\"amph-card\"><strong>Zn(OH)₂<\/strong>\n<div>Z kwasem: <span class=\"formula\" data-rx=\"znoh2Hcl\">Zn(OH)₂ + 2HCl → ZnCl₂ + 2H₂O<\/span><\/div>\n<div style=\"margin-top:6px;\">Z mocną zasadą: <span class=\"formula\">Zn(OH)₂ + 2NaOH → Na₂[Zn(OH)₄]<\/span><\/div>\n<\/div>\n<\/div>\n<p class=\"mini-note\">Na poziomie E8 wystarczy wiedzieć, że <strong>Al(OH)₃ i Zn(OH)₂ reagują i z kwasami, i z mocnymi zasadami<\/strong>. Równania z jonami kompleksowymi (<span class=\"formula\">Na[Al(OH)₄]<\/span>, <span class=\"formula\">Na₂[Zn(OH)₄]<\/span>) są rozszerzeniem i nie są wymagane na egzaminie ósmoklasisty.<\/p>\n<\/div>\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Amfoteryczność — zawsze pytaj „z czym?”<\/h4>\n<p>Al(OH)₃ i Zn(OH)₂ są klasycznymi przykładami wodorotlenków amfoterycznych. Reagują zarówno z kwasami, jak i z mocnymi zasadami, ale <strong>produkt i zapis zależą od środowiska<\/strong>.<\/p>\n<div class=\"equation-box\"><strong>Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O<\/strong><\/div>\n<div class=\"equation-box\"><strong>Al(OH)₃ + OH⁻ → [Al(OH)₄]⁻<\/strong> <span class=\"level-badge level-extra\">LO<\/span><\/div>\n<div class=\"equation-box\"><strong>Zn(OH)₂ + 2OH⁻ → [Zn(OH)₄]²⁻<\/strong> <span class=
