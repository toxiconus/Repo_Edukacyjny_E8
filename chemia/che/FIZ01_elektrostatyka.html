<script type="application/json" id="fiz-elektro-src">"<!DOCTYPE html>\n<html lang=\"pl\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width,initial-scale=1.0\" name=\"viewport\"/>\n<title>Fizyka FIZ-01 — Elektrostatyka (v1.4 MASTER LAB)<\/title>\n<style id=\"f01-chg\">.chg-t{display:inline-flex;width:18px;height:18px;border-radius:50%;color:#fff;font:800 13px/18px system-ui;justify-content:center;margin:1px}.chg-0{color:#64748b;font-weight:700}.bil{border:1px solid var(--border,#e5e9ee);border-radius:10px;padding:8px 12px;margin:6px 0;background:var(--surface-soft,#f6f8fa)}.bil>div{margin:3px 0}.bil-t{display:flex;flex-wrap:wrap;gap:14px}<\/style><style id=\"che-lesson-viz-ref-style\">.che-lesson-viz-ref{margin:14px 0}.che-lesson-viz-ref button{display:flex;flex-direction:column;gap:4px;width:100%;padding:12px 14px;text-align:left;border:1px solid #cfd8e3;border-radius:12px;background:#f7f9fc;color:#182231;cursor:pointer}.che-lesson-viz-ref button:hover{border-color:#6b86a5;box-shadow:0 3px 12px rgba(20,40,70,.08)}.che-lesson-viz-ref b{font-size:14px}.che-lesson-viz-ref span{font-size:12px;color:#5b6675}<\/style><style id=\"kw-v15-style\">details.adv{border:1px dashed var(--c-warn-line,#eed8a8);border-radius:10px;background:var(--surface-soft,#f6f8fa);margin:10px 0;padding:0 12px}details.adv>summary{cursor:pointer;font-weight:700;color:var(--c-warn,#b06f1c);padding:9px 0;list-style:none}details.adv>summary::-webkit-details-marker{display:none}details.adv>summary::before{content:\"▸ \"}details.adv[open]>summary::before{content:\"▾ \"}.adv-tag{font-weight:600;font-size:11px;opacity:.75;margin-left:6px}.adv-body{padding:0 0 10px;font-size:13.5px;line-height:1.6}.adv-body table{font-size:12.5px}.adv-toggle{margin-top:10px;border:1px solid var(--c-warn-line,#eed8a8);background:var(--c-warn-bg,#fcf4e6);color:var(--c-warn,#b06f1c);border-radius:999px;padding:6px 12px;font:700 12px Inter,system-ui,sans-serif;cursor:pointer}.bio-tag{display:inline-block;font:800 10px Inter,system-ui;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:rgba(46,125,79,.12);color:#2e7d4f;margin-left:6px;vertical-align:middle}.v15{display:inline-block;font:800 9.5px Inter,system-ui;padding:1px 6px;border-radius:99px;background:rgba(13,125,125,.12);color:#0d7d7d;margin-left:6px;vertical-align:middle}@media print{details.adv{display:block}details.adv>.adv-body{display:block}}<\/style><\/head>\n<body>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">FIZ-01 · FIZYKA · MASTER LAB v1.4<\/div><h1>Elektrostatyka<\/h1><p class=\"lead\">Ładunek i jego budowa atomowa, elektryzowanie (tarcie, dotyk, indukcja), oddziaływanie ładunków, przewodniki i izolatory, elektroskop, uziemienie i zastosowania; dla chętnych i LO: prawo Coulomba, pole elektryczne. Animacje i liczby z silnika CHE.FIZ.ELEKTRO.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-extra\">E8+ / LO<\/span><\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><\/section>\n<section class=\"minimum-card\" id=\"minimum\"><h3>Muszę umieć na E8 — 10 faktów<\/h3><ol>\n<li>Atom ma <strong>protony (+)<\/strong> w jądrze i <strong>elektrony (−)<\/strong> wokół jądra. Ciało <strong>obojętne<\/strong> ma ich tyle samo.<\/li>\n<li>Ciało <strong>naelektryzowane ujemnie<\/strong> ma <strong>nadmiar elektronów<\/strong>, dodatnio — <strong>niedobór elektronów<\/strong>. Przemieszczają się tylko elektrony.<\/li>\n<li>Ładunek jest wielokrotnością <strong>ładunku elementarnego<\/strong> e ≈ <span data-fiz=\"e\">1,6·10⁻¹⁹ C<\/span>; jednostka ładunku — <strong>kulomb (1 C)<\/strong>.<\/li>\n<li>Elektryzowanie: przez <strong>tarcie<\/strong>, przez <strong>dotyk<\/strong>, przez <strong>indukcję (wpływ)<\/strong>.<\/li>\n<li><strong>Zasada zachowania ładunku<\/strong>: w układzie izolowanym suma ładunków się nie zmienia — ładunek tylko się przemieszcza.<\/li>\n<li>Ładunki <strong>jednoimienne się odpychają<\/strong>, <strong>różnoimienne przyciągają<\/strong>; ciało naelektryzowane przyciąga też lekkie ciała obojętne.<\/li>\n<li>Siła oddziaływania rośnie z ładunkami, maleje z odległością (2× dalej → 4× słabiej).<\/li>\n<li><strong>Przewodniki<\/strong> (metale, grafit, roztwory jonów, ciało człowieka) mają swobodne nośniki ładunku; <strong>izolatory<\/strong> (szkło, guma, plastik, suche powietrze) — nie.<\/li>\n<li><strong>Elektroskop<\/strong>: listki naładowane jednoimiennie odpychają się — im większy ładunek, tym większe wychylenie. Nie pokazuje znaku ładunku.<\/li>\n<li><strong>Uziemienie<\/strong> odprowadza ładunek do ziemi; zastosowania: piorunochron, uziemienie cystern i stacji paliw, opaska antystatyczna.<\/li>\n<\/ol><\/section><details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#s0a\">0a. Diagnoza startowa<\/a><a class=\"toc-link\" href=\"#s0\">0. Wzory i mnemotechniki<\/a><a class=\"toc-link\" href=\"#s1\">1. Ładunek<\/a><a class=\"toc-link\" href=\"#s2\">2. Tarcie<\/a><a class=\"toc-link\" href=\"#s3\">3. Oddziaływanie<\/a><a class=\"toc-link\" href=\"#s4\">4. Przewodniki i izolatory<\/a><a class=\"toc-link\" href=\"#s5\">5. Dotyk, zachowanie ładunku<\/a><a class=\"toc-link\" href=\"#s5a\">5a. Wykład: bilans ładunku i uziemienie<\/a><a class=\"toc-link\" href=\"#s6\">6. Elektroskop<\/a><a class=\"toc-link\" href=\"#s7\">7. Indukcja i zastosowania<\/a><a class=\"toc-link\" href=\"#s8\">8. Prawo Coulomba (E8+)<\/a><a class=\"toc-link\" href=\"#s9\">9. Pole elektryczne (LO)<\/a><a class=\"toc-link\" href=\"#s10\">10. Doświadczenia<\/a><a class=\"toc-link\" href=\"#s11\">11. Klinika błędów<\/a><a class=\"toc-link\" href=\"#s11a\">11a. Przykłady prowadzone<\/a><a class=\"toc-link\" href=\"#s12\">12. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#s12a\">12a. Zadania E8<\/a><a class=\"toc-link\" href=\"#s13\">13. Fiszki<\/a><a class=\"toc-link\" href=\"#s14\">14. Test<\/a><a class=\"toc-link\" href=\"#s14a\">14a. Mapa, checklista, powtórki<\/a><a class=\"toc-link\" href=\"#s15\">15. Słownik i mosty<\/a><\/nav><\/details>\n<section id=\"s0a\">\n<div class=\"part-heading\"><span class=\"part-num\">0a<\/span> Diagnoza startowa — sprawdź się, zanim zaczniesz<\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">5 pytań (odpowiedzi ukryte)<\/span><ol><li>Z jakich cząstek zbudowany jest atom i jaki mają ładunek?<\/li><li>Co się dzieje z włosami po zdjęciu wełnianej czapki zimą — i dlaczego?<\/li><li>Czy metalowa łyżka przewodzi prąd? A plastikowa?<\/li><li>Dlaczego pracownik stacji paliw nie powinien chodzić w syntetycznym polarze?<\/li><li>Magnes przyciąga żelazo. Czy to oddziaływanie elektrostatyczne?<\/li><\/ol><details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary><ol><li>Protony (+) i neutrony (0) w jądrze, elektrony (−) wokół jądra.<\/li><li>Włosy elektryzują się przez tarcie jednoimiennie i odpychają — „stają dęba”.<\/li><li>Metalowa — tak (elektrony swobodne); plastikowa — nie (izolator).<\/li><li>Tarcie elektryzuje ubranie; iskra wyładowania może zapalić opary paliwa.<\/li><li>Nie — to magnetyzm (inna lekcja fizyki); żelazo nie musi być naelektryzowane.<\/li><\/ol><\/details><p class=\"mini-note\">Jeśli pomyliłeś 1 lub 3 — zacznij od rozdziałów 1 i 4. Pytanie 5 to częsta pułapka: magnetyzm ≠ elektrostatyka.<\/p><\/div>\n<\/section>\n\n<section id=\"s0\">\n<div class=\"part-heading\"><span class=\"part-num\">0<\/span> Wzory, definicje i mnemotechniki — ściąga <span class=\"level-badge level-basic\">E8<\/span> <span class=\"level-badge level-extra\">LO<\/span><\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Wzory (z jednostkami)<\/span><div class=\"table-wrap\"><table><thead><tr><th>Wielkość<\/th><th>Wzór<\/th><th>Jednostka<\/th><th>Kiedy używać<\/th><\/tr><\/thead><tbody><tr><td>ładunek ciała<\/td><td>q = n · e<\/td><td>C (kulomb)<\/td><td>n — liczba nadmiarowych (−) lub brakujących (+) elektronów<\/td><\/tr><tr><td>liczba elektronów<\/td><td>n = q / e<\/td><td>—<\/td><td>ile elektronów przeszło<\/td><\/tr><tr><td>dotyk 2 identycznych kul<\/td><td>q′ = (q₁ + q₂) / 2<\/td><td>C<\/td><td>zasada zachowania ładunku<\/td><\/tr><tr><td>prawo Coulomba (E8+)<\/td><td>F = k · |q₁ · q₂| / r²<\/td><td>N<\/td><td>siła między ładunkami punktowymi<\/td><\/tr><tr><td>w ośrodku (LO)<\/td><td>F = k · |q₁q₂| / (εr · r²)<\/td><td>N<\/td><td>woda: εr ≈ 80<\/td><\/tr><tr><td>natężenie pola (LO)<\/td><td>E = F / q ;  E = k · Q / r²<\/td><td>N/C = V/m<\/td><td>pole ładunku punktowego<\/td><\/tr><tr><td>napięcie (LO)<\/td><td>U = W / q<\/td><td>V = J/C<\/td><td>praca przy przenoszeniu ładunku<\/td><\/tr><tr><td>pojemność (LO)<\/td><td>C = Q / U<\/td><td>F (farad)<\/td><td>kondensator<\/td><\/tr><\/tbody><\/table><\/div><p class=\"mini-note\">Stałe z silnika: e = <span data-fiz=\"e\">1,602·10⁻¹⁹ C<\/span> · k = <span data-fiz=\"k\">8,99·10⁹ N·m²/C²<\/span> · 1 C ≈ 6,24·10¹⁸ e · przedrostki: 1 mC = 10⁻³ C, 1 µC = 10⁻⁶ C, 1 nC = 10⁻⁹ C.<\/p><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Definicje jednym zdaniem<\/span><dl><div class=\"def-item\"><dt>Ładunek elektryczny<\/dt><dd>właściwość cząstek (protonów +, elektronów −) odpowiedzialna za oddziaływania elektryczne; jednostka 1 C.<\/dd><\/div><div class=\"def-item\"><dt>Elektryzowanie<\/dt><dd>nadawanie ciału ładunku przez przemieszczenie elektronów (tarcie, dotyk, indukcja).<\/dd><\/div><div class=\"def-item\"><dt>Przewodnik<\/dt><dd>ciało, w którym ładunki mogą się swobodnie przemieszczać (elektrony swobodne lub jony).<\/dd><\/div><div class=\"def-item\"><dt>Izolator<\/dt><dd>ciało, w którym ładunki praktycznie nie mogą się przemieszczać.<\/dd><\/div><div class=\"def-item\"><dt>Zasada zachowania ładunku<\/dt><dd>w układzie izolowanym całkowity ładunek nie zmienia się.<\/dd><\/div><div class=\"def-item\"><dt>Indukcja elektrostatyczna<\/dt><dd>rozdzielenie ładunków w przewodniku pod wpływem zbliżonego (niedotykającego) ciała naelektryzowanego.<\/dd><\/div><div class=\"def-item\"><dt>Uziemienie<\/dt><dd>połączenie ciała z ziemią przewodnikiem — umożliwia odpływ lub dopływ elektronów.<\/dd><\/div><div class=\"def-item\"><dt>Pole elektryczne<\/dt><dd>przestrzeń wokół ładunku, w której na inne ładunki działa siła elektryczna.<\/dd><\/div><\/dl><\/div>\n<div class=\"card card-understand\"><span class=\"card-label\">Mnemotechniki<\/span><ul><li><b>„Plus to brak”<\/b> — ciało dodatnie <b>nie dostało protonów<\/b>, tylko <b>straciło elektrony<\/b>. Przemieszczają się tylko elektrony.<\/li><li><b>„Jednakowi się nie lubią”<\/b> — ładunki jednoimienne się odpychają, różnoimienne przyciągają.<\/li><li><b>„Szkło w jedwabiu — plus, ebonit w suknie — minus”<\/b>: szkło + jedwab → szkło (+); ebonit + sukno → ebonit (−).<\/li><li><b>„Dwa razy dalej — cztery razy słabiej”<\/b> (siła ∝ 1/r²): 3× dalej → 9× słabiej.<\/li><li><b>„Listki mówią ILE, nie JAKI”<\/b> — elektroskop pokazuje wielkość ładunku, nie znak.<\/li><li><b>Indukcja — 4 kroki „ZUZO”<\/b>: <b>Z<\/b>bliż pręt → <b>U<\/b>ziem → <b>Z<\/b>abierz palec → <b>O<\/b>ddal pręt ⇒ ładunek przeciwny do pręta.<\/li><li><b>„Ostrze zbiera”<\/b> — na ostrzach przewodnika gromadzi się najwięcej ładunku (piorunochron).<\/li><\/ul><\/div>\n<\/section>\n\n<section id=\"s1\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Ładunek elektryczny — skąd się bierze<\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Budowa atomu a ładunek<\/span><p>Każdy atom zawiera dodatnie <strong>protony<\/strong> (w jądrze) i ujemne <strong>elektrony<\/strong> (w chmurze elektronowej). Ich ładunki są równe co do wartości i przeciwne co do znaku. Atom ma tyle samo protonów i elektronów — jest <strong>obojętny<\/strong>.<\/p><p>Protony są w jądrze uwięzione, elektrony zewnętrzne łatwo się odrywają. Dlatego <strong>przy elektryzowaniu przemieszczają się wyłącznie elektrony<\/strong>.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Ciało<\/th><th>Elektrony vs protony<\/th><th>Ładunek<\/th><\/tr><\/thead><tbody><tr><td>obojętne<\/td><td>tyle samo<\/td><td>0<\/td><\/tr><tr><td>naelektryzowane ujemnie<\/td><td>nadmiar elektronów<\/td><td>−<\/td><\/tr><tr><td>naelektryzowane dodatnio<\/td><td>niedobór elektronów<\/td><td>+<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Ładunek elementarny i kulomb<\/span><p>Najmniejszy swobodny ładunek to <strong>ładunek elementarny<\/strong>: e = <span data-fiz=\"e\">1,602·10⁻¹⁹ C<\/span>. Elektron ma ładunek −e, proton +e. Każdy ładunek ciała jest jego wielokrotnością:<\/p><div class=\"formula-lg\">q = n · e<\/div><p>1 kulomb to ładunek ok. <strong>6,24·10¹⁸<\/strong> elektronów. To dużo — przy pocieraniu balonu przenosimy zwykle nanokulomby (10⁻⁹ C), czyli miliardy elektronów.<\/p><p class=\"mini-note\">Masa elektronu: m<sub>e<\/sub> = <span data-fiz=\"me\">9,11·10⁻³¹ kg<\/span> — ok. 1836 razy mniej niż protonu.<\/p><\/div>\n<div class=\"card card-new\"><span class=\"card-label\">Most do chemii<\/span><p><strong>Jon<\/strong> to atom (lub grupa atomów), który oddał lub przyjął elektrony: Na → Na⁺ + e⁻, Cl + e⁻ → Cl⁻. Ten sam mechanizm co przy elektryzowaniu — tylko na poziomie pojedynczych atomów. Atomy pierwiastków o dużej <strong>elektroujemności<\/strong> (Cl, O, F) chętnie przyjmują elektrony.<\/p><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-dysocjacja-v01\"><button type=\"button\" data-che-open-viz=\"kw-dysocjacja-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-dysocjacja-v01',lessonId:'FIZ-01'},'*')\"><b>Chemia: jony w roztworze — przeniesienie protonu H⁺<\/b><span>Lekcja Kwasy · ten sam silnik<\/span><\/button><\/div>\n<\/section>\n\n<section id=\"s2\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Elektryzowanie przez tarcie<\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Na czym polega<\/span><p>Przy pocieraniu dwóch ciał z różnych materiałów elektrony przechodzą z jednego na drugie. Ciało, które <strong>oddało<\/strong> elektrony, ładuje się <strong>dodatnio<\/strong>, ciało, które je <strong>przyjęło<\/strong> — <strong>ujemnie<\/strong>. Oba ładunki są równe co do wartości (zasada zachowania ładunku).<\/p><ul><li data-fiz-tribo=\"szklo&gt;jedwab\">szkło pocierane <strong>jedwabiem<\/strong> → szkło <strong>+<\/strong>, jedwab −<\/li><li data-fiz-tribo=\"welna&gt;ebonit\">ebonit (twarda guma) pocierany <strong>suknem<\/strong> → ebonit <strong>−<\/strong>, sukno +<\/li><li data-fiz-tribo=\"wlosy&gt;balon\">balon pocierany o <strong>włosy<\/strong> → balon <strong>−<\/strong>, włosy + (dlatego się „stawiają” — odpychają się jednoimiennie)<\/li><\/ul><\/div>\n<div class=\"card card-understand\"><span class=\"card-label\">Szereg tryboelektryczny (z silnika CHE.FIZ.ELEKTRO)<\/span><p>Materiał stojący <strong>wcześniej<\/strong> oddaje elektrony materiałowi stojącemu <strong>dalej<\/strong>:<\/p><p style=\"line-height:1.9\">(+) <span>skóra (sucha)<\/span> &gt; <span>futro / sierść<\/span> &gt; <span>szkło<\/span> &gt; <span>włosy<\/span> &gt; <span>nylon<\/span> &gt; <span>wełna (sukno)<\/span> &gt; <span>jedwab<\/span> &gt; <span style=\"color:#b45309;font-weight:700\">aluminium<\/span> &gt; <span>papier<\/span> &gt; <span>bawełna<\/span> &gt; <span style=\"color:#b45309;font-weight:700\">stal<\/span> &gt; <span>drewno (suche)<\/span> &gt; <span>bursztyn<\/span> &gt; <span>ebonit / twarda guma<\/span> &gt; <span style=\"color:#b45309;font-weight:700\">miedź<\/span> &gt; <span>poliester<\/span> &gt; <span>styropian<\/span> &gt; <span>folia PE (reklamówka)<\/span> &gt; <span>balon (lateks)<\/span> &gt; <span>PVC (rurka)<\/span> &gt; <span>teflon (PTFE)<\/span> (−)<\/p><p class=\"mini-note\">Kolejność orientacyjna — zależy od wilgotności i czystości powierzchni. Metale (pomarańczowe) trzymane w ręce od razu się rozładowują — trzeba je trzymać za izolującą rączkę.<\/p><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektryzowanie-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektryzowanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektryzowanie-v01',lessonId:'FIZ-01'},'*')\"><b>Pocieraj i sprawdź: kto oddaje elektrony + wahadełko elektrostatyczne<\/b><span>Szereg tryboelektryczny z silnika · animacja przepływu elektronów<\/span><\/button><\/div>\n<\/section>\n\n<section id=\"s3\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Oddziaływanie ładunków<\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Reguła<\/span><p>Ładunki <strong>jednoimienne<\/strong> (+ i +, − i −) się <strong>odpychają<\/strong>, <strong>różnoimienne<\/strong> się <strong>przyciągają<\/strong>. Siły działają na odległość, bez dotykania, i są wzajemne (III zasada dynamiki — obie siły mają tę samą wartość).<\/p><\/div>\n<div class=\"card card-understand\"><span class=\"card-label\">Dlaczego naelektryzowany grzebień przyciąga obojętne skrawki papieru?<\/span><p>Ładunek grzebienia przesuwa ładunki w skrawku (w izolatorze — w obrębie cząsteczek: <strong>polaryzacja<\/strong>; w przewodniku — elektrony swobodne: <strong>indukcja<\/strong>). Bliżej grzebienia gromadzi się ładunek przeciwnego znaku, dalej — tego samego. Przyciąganie bliższego ładunku jest silniejsze niż odpychanie dalszego, więc wypadkowo skrawek jest <strong>przyciągany<\/strong>.<\/p><p><strong>Wniosek do zadań:<\/strong> przyciąganie <em>nie dowodzi<\/em>, że oba ciała są naelektryzowane. <strong>Odpychanie<\/strong> — tak (oba mają ładunek tego samego znaku).<\/p><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Od czego zależy siła (jakościowo — E8)<\/span><ul><li>im <strong>większe ładunki<\/strong>, tym większa siła;<\/li><li>im <strong>większa odległość<\/strong>, tym siła mniejsza — 2× dalej → 4× słabiej, 3× dalej → 9× słabiej;<\/li><li>w wodzie i innych ośrodkach siła jest słabsza niż w powietrzu.<\/li><\/ul><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektryzowanie-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektryzowanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektryzowanie-v01',lessonId:'FIZ-01'},'*')\"><b>Wahadełko: przyciąganie obojętnej kulki, dotyk, odpychanie<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<\/section>\n\n<section id=\"s4\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Przewodniki i izolatory<\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Różnica<\/span><p><strong>Przewodnik<\/strong> zawiera swobodne nośniki ładunku: w metalach i graficie — <strong>elektrony swobodne<\/strong>, w roztworach i w ciele człowieka — <strong>jony<\/strong>. Ładunek rozpływa się po całym przewodniku.<\/p><p><strong>Izolator<\/strong> (dielektryk) nie ma swobodnych nośników — ładunek zostaje tam, gdzie go umieszczono (dlatego tarciem łatwo elektryzować izolatory).<\/p><p><strong>Półprzewodniki<\/strong> (krzem, german) przewodzą słabo, ale lepiej w wyższej temperaturze i po domieszkowaniu — podstawa elektroniki.<\/p><\/div>\n<div class=\"card card-understand\"><span class=\"card-label\">Opór właściwy ρ — dane z silnika<\/span><div class=\"table-wrap\"><table><thead><tr><th>Materiał<\/th><th>ρ [Ω·m] (20 °C)<\/th><th>Rodzaj<\/th><\/tr><\/thead><tbody><tr><td>srebro<\/td><td data-fiz-rho=\"srebro\">1,59·10⁻⁸<\/td><td>przewodnik<\/td><\/tr><tr><td>miedź<\/td><td data-fiz-rho=\"miedz\">1,68·10⁻⁸<\/td><td>przewodnik<\/td><\/tr><tr><td>aluminium<\/td><td data-fiz-rho=\"aluminium\">2,65·10⁻⁸<\/td><td>przewodnik<\/td><\/tr><tr><td>żelazo<\/td><td data-fiz-rho=\"zelazo\">9,7·10⁻⁸<\/td><td>przewodnik<\/td><\/tr><tr><td>grafit<\/td><td data-fiz-rho=\"grafit\">1·10⁻⁵<\/td><td>przewodnik<\/td><\/tr><tr><td>woda morska<\/td><td data-fiz-rho=\"morska\">0,2<\/td><td>elektrolit<\/td><\/tr><tr><td>woda z kranu<\/td><td data-fiz-rho=\"kran\">50<\/td><td>elektrolit<\/td><\/tr><tr><td>krzem (czysty)<\/td><td data-fiz-rho=\"krzem\">2300<\/td><td>półprzewodnik<\/td><\/tr><tr><td>woda destylowana<\/td><td data-fiz-rho=\"destylowana\">1,8·10⁵<\/td><td>słaby przewodnik<\/td><\/tr><tr><td>szkło<\/td><td data-fiz-rho=\"szklo\">1·10¹²<\/td><td>izolator<\/td><\/tr><tr><td>guma<\/td><td data-fiz-rho=\"guma\">1·10¹³<\/td><td>izolator<\/td><\/tr><tr><td>drewno suche<\/td><td data-fiz-rho=\"drewno\">1·10¹⁴<\/td><td>izolator<\/td><\/tr><tr><td>powietrze suche<\/td><td data-fiz-rho=\"powietrze\">2·10¹⁶<\/td><td>izolator<\/td><\/tr><tr><td>teflon<\/td><td data-fiz-rho=\"teflon\">1·10²³<\/td><td>izolator<\/td><\/tr><\/tbody><\/table><\/div><p class=\"mini-note\">Różnica między miedzią a teflonem to ok. 30 rzędów wielkości! Woda z kranu przewodzi dzięki rozpuszczonym jonom (chemia: dysocjacja soli).<\/p><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-przewodniki-v01\"><button type=\"button\" data-che-open-viz=\"fiz-przewodniki-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-przewodniki-v01',lessonId:'FIZ-01'},'*')\"><b>Przewodnik czy izolator? Rozpływ ładunku w pręcie<\/b><span>ρ z silnika · czas rozpływu ładunku<\/span><\/button><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-conductivity\"><button type=\"button\" data-che-open-viz=\"gfx-scene-conductivity\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-conductivity',lessonId:'FIZ-01'},'*')\"><b>Chemia: przewodzenie prądu przez roztwory (elektrolity)<\/b><span>Lekcja Kwasy · tester przewodnictwa<\/span><\/button><\/div>\n<\/section>\n\n<section id=\"s5\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Elektryzowanie przez dotyk. Zasada zachowania ładunku<\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Elektryzowanie przez dotyk<\/span><p>Gdy ciało naelektryzowane dotknie ciała obojętnego (najlepiej przewodnika), część elektronów przechodzi z jednego na drugie. Oba ciała mają potem ładunek <strong>tego samego znaku<\/strong>.<\/p><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Zasada zachowania ładunku<\/span><p>W układzie izolowanym (bez wymiany ładunku z otoczeniem) <strong>suma ładunków jest stała<\/strong>. Ładunku nie można stworzyć ani zniszczyć — można go tylko przemieścić.<\/p><div class=\"formula-lg\">q₁ + q₂ = q₁′ + q₂′<\/div><p><strong>Dwie identyczne kulki przewodzące<\/strong> po zetknięciu mają równe ładunki:<\/p><div class=\"formula-lg\">q′ = (q₁ + q₂) / 2<\/div><p>Przykład: +6 nC i −2 nC → po zetknięciu każda ma +2 nC (suma +4 nC przed i po).<\/p><div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-ladunek-v01\"><button type=\"button\" data-che-open-viz=\"fiz-ladunek-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-ladunek-v01',lessonId:'FIZ-01'},'*')\"><b>Kule: dotyk, uziemienie, zasada zachowania, liczba elektronów<\/b><span>CHE.PHYS.electro.share · n = q/e<\/span><\/button><\/div>\n<\/div>\n<div class=\"card card-extra\"><span class=\"card-label\">Uziemienie<\/span><p>Ziemia to ogromny przewodnik. Połączenie z nią (przewód, dotknięcie ręką) praktycznie <strong>rozładowuje<\/strong> ciało: nadmiar elektronów odpływa do ziemi albo brakujące z niej napływają.<\/p><\/div>\n<\/section>\n\n<section id=\"s5a\">\n<div class=\"part-heading\"><span class=\"part-num\">5a<\/span> Wykład: zasada zachowania ładunku, obliczenia w kulombach i uziemienie <span class=\"level-badge level-basic\">E8<\/span> <span class=\"level-badge level-extra\">LO<\/span><\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Najpierw nazwa: zasada zachowania ładunku<\/span><p>Prawo, które tu stosujemy, to <strong>zasada zachowania ładunku elektrycznego<\/strong>: w układzie izolowanym (bez wymiany ładunku z otoczeniem) <strong>suma ładunków jest stała<\/strong>. Ładunku nie tworzymy ani nie niszczymy — elektrony tylko przechodzą z ciała na ciało.<\/p><div class=\"formula-lg\">q₁ + q₂ + … = q₁′ + q₂′ + … = const<\/div><p class=\"mini-note\">„Zasady zachowania potencjału” nie ma. Z potencjałem wiąże się inna reguła: gdy zetkniesz przewodniki, elektrony płyną tak długo, aż <strong>potencjały się wyrównają<\/strong> (rozszerzenie LO poniżej). To ona wyjaśnia, dlaczego identyczne kule dzielą się ładunkiem po równo, a uziemienie rozładowuje ciało.<\/p><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Ładunek to liczba ze znakiem i jednostką<\/span><p>Ładunek zapisujemy jak liczbę względną: <strong>+<\/strong> = niedobór elektronów, <strong>−<\/strong> = nadmiar elektronów, <strong>0<\/strong> = ciało obojętne. Jednostka: <strong>kulomb (C)<\/strong>. Każdy ładunek jest wielokrotnością ładunku elementarnego e ≈ <span data-fiz=\"e\">1,6·10⁻¹⁹ C<\/span>.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Przedrostek<\/th><th>Zapis<\/th><th>W kulombach<\/th><th>Przykład<\/th><\/tr><\/thead><tbody><tr><td>mili<\/td><td>1 mC<\/td><td>10⁻³ C<\/td><td>3 mC = 0,003 C<\/td><\/tr><tr><td>mikro<\/td><td>1 µC<\/td><td>10⁻⁶ C<\/td><td>−4 µC = −0,000004 C<\/td><\/tr><tr><td>nano<\/td><td>1 nC<\/td><td>10⁻⁹ C<\/td><td>+6 nC = 6·10⁻⁹ C<\/td><\/tr><tr><td>piko<\/td><td>1 pC<\/td><td>10⁻¹² C<\/td><td>2 pC = 2·10⁻¹² C<\/td><\/tr><\/tbody><\/table><\/div><p>Wzory: <div class=\"formula-lg\">q = n · e<\/div><div class=\"formula-lg\">n = |q| / e<\/div><\/p><p class=\"mini-note\">1 C to bardzo dużo: ok. 6,24·10¹⁸ elektronów. W doświadczeniach szkolnych ładunki mają rząd nC–µC. W zadaniach rachunkowych często pojawiają się „okrągłe” wartości w C — metoda liczenia jest ta sama.<\/p><\/div>\n<div class=\"card card-understand\"><span class=\"card-label\">Dodawanie ładunków — zawsze ze znakiem i w nawiasie<\/span><p>Ładunki ujemne piszemy w nawiasie, żeby nie zgubić znaku:<\/p><div class=\"formula-lg\">0 C + (−4 C) = −4 C<\/div><div class=\"formula-lg\">(+6 nC) + (−2 nC) = +4 nC<\/div><div class=\"formula-lg\">(+3 µC) + (−3 µC) = 0<\/div><p><strong>Graficznie:<\/strong> każdy „+” znosi się z jednym „−” (para = 0). Zostają niesparowane znaki — to wynik.<\/p><div class=\"bil\"><div class=\"bil-t\"><span>+6: <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><\/span><span>−2: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><\/div><div>2 pary „+ −” znikają → zostaje <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span> = <b>+4<\/b><\/div><\/div><\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Dotyk identycznych kul przewodzących — przykłady krok po kroku<\/span><p>Procedura: 1) zapisz ładunki ze znakiem, 2) dodaj je (suma), 3) podziel sumę po równo między identyczne kule, 4) sprawdź, czy suma po = suma przed, 5) ustal, kto oddał, a kto przyjął elektrony.<\/p><h5>Przykład 1: A = 0 C, B = −4 C<\/h5><div class=\"bil\"><div><b>Przed:<\/b> q<sub>A<\/sub> + q<sub>B<\/sub> = 0 C + (−4 C) = <b>−4 C<\/b><\/div><div class=\"bil-t\"><span>A: <span class=\"chg-0\">0<\/span><\/span><span>B: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><\/div><div><b>Dotyk identycznych kul:<\/b> q′ = (q<sub>A<\/sub> + q<sub>B<\/sub>) / 2 = <span data-fiz-share=\"0,-4\" data-fiz-res=\"-2.0\">−4 C / 2 = −2 C<\/span><\/div><div class=\"bil-t\"><span>A′: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><span>B′: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><\/div><div><b>Kontrola:<\/b> (−2 C) + (−2 C) = −4 C ✓<\/div><\/div><p><b>Przepływ:<\/b> B zmieniła ładunek z −4 C na −2 C, czyli oddała ładunek −2 C — <strong>elektrony przeszły z B na A<\/strong>. Ich liczba: n = 2 C / 1,6·10⁻¹⁹ C ≈ <b>1,25·10¹⁹<\/b>. Protony się nie ruszają.<\/p><h5>Przykład 2: A = +6 nC, B = −2 nC<\/h5><div class=\"bil\"><div><b>Przed:<\/b> q<sub>A<\/sub> + q<sub>B<\/sub> = +6 nC + (−2 nC) = <b>+4 nC<\/b><\/div><div class=\"bil-t\"><span>A: <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><\/span><span>B: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><\/div><div><b>Dotyk identycznych kul:<\/b> q′ = (q<sub>A<\/sub> + q<sub>B<\/sub>) / 2 = <span data-fiz-share=\"6,-2\" data-fiz-res=\"2.0\">+4 nC / 2 = +2 nC<\/span><\/div><div class=\"bil-t\"><span>A′: <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><\/span><span>B′: <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><\/span><\/div><div><b>Kontrola:<\/b> +2 nC + +2 nC = +4 nC ✓<\/div><\/div><p><b>Przepływ:<\/b> A: +6 → +2 nC (ładunek zmalał o 4 nC, więc A <em>przyjęła<\/em> elektrony); B: −2 → +2 nC (B <em>oddała<\/em> elektrony). Elektrony płynęły z B do A: n = 4·10⁻⁹ C / e ≈ 2,5·10¹⁰.<\/p><h5>Przykład 3: trzy kule A = +8 µC, B = 0, C = 0<\/h5><div class=\"bil\"><div>A dotyka B: (+8 µC + 0) / 2 = <span data-fiz-share=\"8,0\" data-fiz-res=\"4\">+4 µC<\/span> → A = +4 µC, B = +4 µC<\/div><div>B dotyka C: (+4 µC + 0) / 2 = <span data-fiz-share=\"4,0\" data-fiz-res=\"2\">+2 µC<\/span> → B = +2 µC, C = +2 µC<\/div><div><b>Kontrola:<\/b> 4 + 2 + 2 = 8 µC = ładunek na początku ✓<\/div><div>Gdyby dotknąć wszystkie trzy naraz: q′ = (+8 µC) / 3 ≈ +2,67 µC każda — kolejność i sposób dotykania zmieniają wynik, ale nie sumę.<\/div><\/div><h5>Przykład 4: A = +3 µC, B = −3 µC<\/h5><div class=\"bil\"><div>(+3 µC) + (−3 µC) = 0 → po zetknięciu obie kule są <b>obojętne<\/b> (<span data-fiz-share=\"3,-3\" data-fiz-res=\"0\">0 µC<\/span>). Ładunki się zobojętniły, ale nie zniknęły: nadmiarowe elektrony B uzupełniły braki A.<\/div><\/div><div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-ladunek-v01\"><button type=\"button\" data-che-open-viz=\"fiz-ladunek-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-ladunek-v01',lessonId:'FIZ-01'},'*')\"><b>Bilans ładunku: dotyk, uziemienie, zapis „przed → po”, kafelki + i −, liczba elektronów<\/b><span>CHE.PHYS.electro.contact · ground · transfer · jednostki C, mC, µC, nC, e<\/span><\/button><\/div>\n<\/div>\n<div class=\"card card-extra\"><span class=\"card-label\">Uziemienie — gdzie znika ładunek?<\/span><p>Ziemia jest ogromnym przewodnikiem. Gdy połączysz z nią naelektryzowane ciało (przewód, dotknięcie ręką, metalowa rura), ładunek rozkłada się na układ <strong>ciało + Ziemia<\/strong>; na małym ciele zostaje praktycznie <strong>0<\/strong>. Ładunek nie znika — jest w Ziemi, więc zasada zachowania obowiązuje dla układu ciało + Ziemia.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Ładunek ciała przed<\/th><th>Po uziemieniu<\/th><th>Co płynie<\/th><th>Ile elektronów<\/th><\/tr><\/thead><tbody><tr><td>−5 nC<\/td><td>0<\/td><td>elektrony z ciała do ziemi<\/td><td>3,12·10¹⁰<\/td><\/tr><tr><td>+8 µC<\/td><td>0<\/td><td>elektrony z ziemi do ciała<\/td><td>4,99·10¹³<\/td><\/tr><tr><td>−4 C<\/td><td>0<\/td><td>elektrony z ciała do ziemi<\/td><td>2,5·10¹⁹<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>nic — ciało obojętne<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><p class=\"mini-note\">Uwaga na język: przy uziemieniu ciała dodatniego nie „odpływają protony” — to <strong>elektrony napływają z ziemi<\/strong> i uzupełniają niedobór.<\/p><h5>Uziemienie a indukcja — ładowanie elektroskopu „na odwrót”<\/h5><ol><li>Zbliżasz pręt naelektryzowany ujemnie (nie dotykasz). W elektroskopie elektrony uciekają w dół, na kulce przewagę ma „+”.<\/li><li>Dotykasz kulkę palcem (uziemienie): odpychane elektrony odpływają do ziemi.<\/li><li>Zabierasz palec, potem pręt. Elektroskop ma <strong>niedobór elektronów → ładunek dodatni<\/strong>, przeciwny do ładunku pręta.<\/li><\/ol><p>Zastosowania uziemienia: piorunochron, uziemienie obudów urządzeń i cystern z paliwem, opaska antystatyczna przy elektronice, łańcuch lub pasek przewodzący przy cysternach.<\/p><\/div>\n<details class=\"adv\"><summary>Wyrównanie potencjałów — kule różnej wielkości i dlaczego Ziemia „zabiera” ładunek <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>Potencjał naładowanej kuli o promieniu R: V = k·q / R. Po zetknięciu przewodników elektrony płyną, aż potencjały się zrównają: q₁/R₁ = q₂/R₂. Stąd przy zachowanej sumie Q:<\/p><div class=\"formula-lg\">q₁′ = Q · R₁ / (R₁ + R₂),   q₂′ = Q · R₂ / (R₁ + R₂)<\/div><p><b>Przykład:<\/b> kula 1 cm ma +6 nC, kula 2 cm jest obojętna. Po zetknięciu: q₁′ = 6 · 1/3 = <span data-fiz-sharer=\"6,0|1,2\" data-fiz-res=\"2,4\">+2 nC<\/span>, q₂′ = +4 nC. Większa kula bierze więcej ładunku, a potencjały są równe: V = k·(2 nC)/(0,01 m) ≈ 1798 V.<\/p><p>Ziemia ma promień ok. 6400 km, więc przy „zetknięciu” z małym ciałem prawie cały ładunek trafia do Ziemi — to właśnie uziemienie. Identyczne kule (R₁ = R₂) dzielą się po równo — szkolny wzór q′ = (q₁ + q₂)/2 jest szczególnym przypadkiem tej reguły.<\/p><\/div><\/details>\n<div class=\"card card-warning\"><span class=\"card-label\">Typowe błędy w zadaniach<\/span><ul><li>Dodawanie bez znaku: „0 C i −4 C → 2 C każda” — źle, wynik to −2 C.<\/li><li>Dzielenie po równo kul różnej wielkości (to tylko dla identycznych).<\/li><li>„Przepłynęły protony” — w metalach przemieszczają się wyłącznie elektrony.<\/li><li>Po uziemieniu „ładunek zniknął” — jest w Ziemi; suma w układzie ciało + Ziemia stała.<\/li><li>Zapominanie o przeliczeniu nC, µC na C przed liczeniem elektronów.<\/li><\/ul><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Sprawdź się (odpowiedzi ukryte)<\/span><ol><li>A = −6 nC, B = +2 nC, identyczne, zetknięte. Ładunek każdej po zetknięciu?<\/li><li>Ile elektronów przeszło w zadaniu 1 i w którą stronę?<\/li><li>Kula ma −3,2·10⁻¹⁸ C. Ile ma nadmiarowych elektronów?<\/li><li>Kulę +5 µC uziemiono. Co płynie i ile?<\/li><li>Trzy identyczne kule: +9 C, −3 C, 0 C dotknięte naraz. Wynik?<\/li><\/ol><details class=\"answer\"><summary>Odpowiedzi<\/summary><ol><li>(−6 + 2)/2 = <b>−2 nC<\/b> każda.<\/li><li>A: −6 → −2 nC (oddała elektrony), B: +2 → −2 nC (przyjęła). Z A do B przeszło 4 nC, czyli 2,5·10¹⁰ elektronów.<\/li><li>n = 3,2·10⁻¹⁸ / 1,6·10⁻¹⁹ = <b>20<\/b> elektronów.<\/li><li>Elektrony z ziemi do kuli: 5·10⁻⁶ / 1,6·10⁻¹⁹ ≈ 3,12·10¹³; kula po uziemieniu ma 0.<\/li><li>(9 − 3 + 0)/3 = <b>+2 C<\/b> każda.<\/li><\/ol><\/details><\/div>\n<\/section>\n\n<section id=\"s6\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Elektroskop<\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Budowa<\/span><ul><li>metalowy pręt zakończony u góry kulką lub płytką,<\/li><li>dwa lekkie metalowe listki (lub wskazówka) na dole pręta,<\/li><li>szklana obudowa z <strong>izolatorem<\/strong> (korek, guma), przez który przechodzi pręt.<\/li><\/ul><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Działanie<\/span><p>Ładunek rozpływa się po pręcie i listkach. Listki mają ładunek <strong>tego samego znaku<\/strong>, więc się <strong>odpychają<\/strong> i rozchylają. Większy ładunek → większy kąt.<\/p><p><strong>Elektroskop nie pokazuje znaku ładunku.<\/strong> Znak sprawdzamy, zbliżając ciało o znanym ładunku: jeśli listki rozchylają się bardziej — ładunek jednoimienny, jeśli opadają — różnoimienny.<\/p><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektroskop-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektroskop-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektroskop-v01',lessonId:'FIZ-01'},'*')\"><b>Elektroskop: dotyk, indukcja, uziemienie (scenariusz krok po kroku)<\/b><span>Model rozkładu ładunku z silnika<\/span><\/button><\/div>\n<\/section>\n\n<section id=\"s7\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Indukcja elektrostatyczna (elektryzowanie przez wpływ)<\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Zjawisko<\/span><p>Po <strong>zbliżeniu<\/strong> (bez dotykania) naładowanego ciała do przewodnika elektrony swobodne w przewodniku przesuwają się: ujemny pręt je odpycha, dodatni — przyciąga. Na bliższym końcu powstaje ładunek <strong>przeciwnego<\/strong> znaku, na dalszym — <strong>tego samego<\/strong>. Ładunek całkowity przewodnika się nie zmienia (= 0). Po oddaleniu pręta wszystko wraca do stanu początkowego.<\/p><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Trwałe naelektryzowanie przez indukcję — 4 kroki<\/span><ol><li>Zbliż naładowany pręt (np. ujemny) do kulki elektroskopu — listki się rozchylają.<\/li><li>Nie odsuwając pręta, dotknij kulki palcem (uziemienie) — elektrony uciekają do ziemi, listki opadają.<\/li><li>Zabierz palec (pręt nadal blisko).<\/li><li>Oddal pręt — elektroskop zostaje naładowany <strong>przeciwnie<\/strong> do pręta (tu: dodatnio), listki się rozchylają.<\/li><\/ol><\/div>\n<div class=\"card card-extra\"><span class=\"card-label\">Zastosowania i skutki<\/span><div class=\"table-wrap\"><table><thead><tr><th>Gdzie<\/th><th>Co się dzieje<\/th><\/tr><\/thead><tbody><tr><td>piorunochron<\/td><td>chmura indukuje ładunek w ostrzu; wyładowanie trafia w piorunochron i spływa przewodem do ziemi — budynek jest chroniony<\/td><\/tr><tr><td>burza<\/td><td>ładunki rozdzielają się w chmurze (zderzenia kryształków lodu); piorun przenosi kilka–kilkadziesiąt kulombów w ułamku sekundy<\/td><\/tr><tr><td>kserograf, drukarka laserowa<\/td><td>naelektryzowany bęben przyciąga toner tylko w miejscach obrazu<\/td><\/tr><tr><td>filtry elektrostatyczne<\/td><td>pył w kominie elektrowni zostaje naładowany i osiada na elektrodach<\/td><\/tr><tr><td>malowanie proszkowe / natryskowe<\/td><td>naładowane krople farby lecą do uziemionego elementu i pokrywają go równo, także od tyłu<\/td><\/tr><tr><td>stacja paliw, cysterna<\/td><td>iskra może zapalić opary — cysterny i dystrybutory się uziemia<\/td><\/tr><tr><td>elektronika<\/td><td>wyładowanie z ciała (kilka tysięcy woltów!) niszczy układy scalone — opaska antystatyczna, uziemione stanowisko<\/td><\/tr><tr><td>klatka Faradaya<\/td><td>wewnątrz zamkniętego przewodnika pole elektryczne jest zerowe — samochód chroni przed piorunem, mikrofalówka zatrzymuje fale<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektroskop-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektroskop-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektroskop-v01',lessonId:'FIZ-01'},'*')\"><b>Scenariusz: elektryzowanie przez indukcję w 5 krokach<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<\/section>\n\n<section id=\"s8\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Prawo Coulomba <span class=\"level-badge level-extra\">E8+ / LO<\/span><\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Wzór<\/span><div class=\"formula-lg\">F = k · |q₁ · q₂| / r²<\/div><p>k = <span data-fiz=\"k\">8,99·10⁹ N·m²/C²<\/span> (w próżni i — praktycznie — w powietrzu). F w niutonach, q w kulombach, r w metrach.<\/p><ul><li>siła jest wprost proporcjonalna do iloczynu ładunków,<\/li><li>odwrotnie proporcjonalna do <strong>kwadratu<\/strong> odległości,<\/li><li>działa wzdłuż prostej łączącej ładunki (siły wzajemne, równe co do wartości).<\/li><\/ul><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Przykład<\/span><p>Dwa ładunki po 2 µC i 3 µC w odległości 30 cm (powietrze):<\/p><div class=\"formula-lg\">F = 8,99·10⁹ · 2·10⁻⁶ · 3·10⁻⁶ / 0,3² ≈ 0,6 N<\/div><p>Ładunki jednoimienne → odpychanie. To tyle, ile waży ciało o masie ok. 60 g.<\/p><\/div>\n<div class=\"card card-new\"><span class=\"card-label\">Ośrodek — most do chemii<\/span><p>W ośrodku o przenikalności względnej ε<sub>r<\/sub> siła maleje ε<sub>r<\/sub> razy: F = k·|q₁q₂| / (ε<sub>r<\/sub>·r²). Dla wody ε<sub>r<\/sub> ≈ <span data-fiz=\"epsr-woda\">80<\/span> — dlatego woda tak skutecznie <strong>rozdziela jony<\/strong> kryształu soli (dysocjacja, lekcja Sole).<\/p><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-coulomb-v01\"><button type=\"button\" data-che-open-viz=\"fiz-coulomb-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-coulomb-v01',lessonId:'FIZ-01'},'*')\"><b>Prawo Coulomba: siły, linie pola, ośrodek, wykres F(r)<\/b><span>k i εr z silnika<\/span><\/button><\/div>\n<details class=\"adv\"><summary>Elektryczność kontra grawitacja <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>Dla protonu i elektronu stosunek siły elektrycznej do grawitacyjnej F<sub>e<\/sub>/F<sub>g<\/sub> = k·e² / (G·m<sub>e<\/sub>·m<sub>p<\/sub>) ≈ 2,3·10³⁹ — niezależnie od odległości (obie siły ∝ 1/r²). W atomie wodoru (r ≈ 5,3·10⁻¹¹ m) F<sub>e<\/sub> ≈ 8,2·10⁻⁸ N. Grawitacja dominuje w kosmosie tylko dlatego, że ciała są prawie idealnie obojętne.<\/p><\/div><\/details>\n<details class=\"adv\"><summary>Wektorowo i zasada superpozycji <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p>F⃗₁₂ = k·q₁q₂/r² · r̂₁₂. Siła od kilku ładunków jest <strong>sumą wektorową<\/strong> sił od każdego z osobna. Przykład: ładunek w połowie odległości między dwoma identycznymi ładunkami — siła wypadkowa 0.<\/p><\/div><\/details>\n<\/section>\n\n<section id=\"s9\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Pole elektryczne <span class=\"level-badge level-extra\">LO<\/span><\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Natężenie pola<\/span><p>Ładunek wytwarza wokół siebie <strong>pole elektryczne<\/strong> — każdy inny ładunek odczuwa w nim siłę. <strong>Natężenie pola<\/strong> to siła działająca na jednostkowy, dodatni ładunek próbny:<\/p><div class=\"formula-lg\">E = F / q   [N/C = V/m]<\/div><p>Dla ładunku punktowego: E = k·Q / r². <strong>Linie pola<\/strong> zaczynają się na ładunkach dodatnich i kończą na ujemnych; gęstsze linie — silniejsze pole.<\/p><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Rodzaje pól<\/span><ul><li><strong>centralne<\/strong> — wokół ładunku punktowego (linie radialne),<\/li><li><strong>jednorodne<\/strong> — między dwiema równoległymi płytami o przeciwnych ładunkach (linie równoległe, E = U/d),<\/li><li>wewnątrz przewodnika w równowadze E = 0 (klatka Faradaya); ładunek siedzi na powierzchni, najgęściej na <strong>ostrzach<\/strong>.<\/li><\/ul><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-coulomb-v01\"><button type=\"button\" data-che-open-viz=\"fiz-coulomb-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-coulomb-v01',lessonId:'FIZ-01'},'*')\"><b>Linie pola dwóch ładunków (włącz/wyłącz)<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<details class=\"adv\"><summary>Potencjał, napięcie, kondensator, elektronowolt <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\"><p><strong>Potencjał<\/strong> V = k·Q/r [V = J/C]; <strong>napięcie<\/strong> U = V<sub>A<\/sub> − V<sub>B<\/sub> = W/q. <strong>Kondensator<\/strong>: C = Q/U [F]; płaski: C = ε₀ε<sub>r<\/sub>S/d, energia W = ½CU². <strong>Elektronowolt<\/strong>: 1 eV = 1,602·10⁻¹⁹ J — energia elektronu przyspieszonego napięciem 1 V. Prawo Gaussa: strumień E przez powierzchnię zamkniętą = Q<sub>wewn<\/sub>/ε₀.<\/p><\/div><\/details>\n<\/section>\n\n<section id=\"s10\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Doświadczenia<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektryzowanie-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektryzowanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektryzowanie-v01',lessonId:'FIZ-01'},'*')\"><b>Pracownia: tarcie i wahadełko<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektroskop-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektroskop-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektroskop-v01',lessonId:'FIZ-01'},'*')\"><b>Pracownia: elektroskop<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 1 — Balon i skrawki papieru<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy naelektryzowany balon przyciąga lekkie ciała?<\/span><b>Sprzęt<\/b><span>balon, wełniany sweter lub suche włosy, skrawki papieru<\/span><b>Przebieg<\/b><span>Pocieraj balon o włosy, zbliż do skrawków.<\/span><b>Obserwacja<\/b><span>Skrawki podskakują i przyklejają się do balonu, po chwili część odpada.<\/span><b>Wniosek<\/b><span>Balon naelektryzował się (−); skrawki są przyciągane przez polaryzację. Po dotyku przejmują ładunek i odpadają (odpychanie).<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 2 — Grzebień i strumień wody<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy ładunek działa na ciecz?<\/span><b>Przebieg<\/b><span>Naelektryzowany grzebień zbliż do cienkiego strumienia wody z kranu.<\/span><b>Obserwacja<\/b><span>Strumień wyraźnie się wygina w stronę grzebienia.<\/span><b>Wniosek<\/b><span>Ładunek grzebienia przesuwa ładunki w wodzie (cząsteczki H₂O są polarne, woda z kranu zawiera jony) — strumień jest przyciągany.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 3 — Elektroskop ze słoika<\/h5><div class=\"exp-grid\"><b>Sprzęt<\/b><span>słoik, plastikowa pokrywka (izolator), drut miedziany, folia aluminiowa<\/span><b>Wykonanie<\/b><span>Drut przebij przez pokrywkę, u góry kulka z folii, na dole zagięty haczyk z dwoma paskami cienkiej folii.<\/span><b>Test<\/b><span>Zbliż naelektryzowany balon — paski się rozchylają (indukcja); dotknij — zostają rozchylone (dotyk).<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 4 — Wahadełko elektrostatyczne<\/h5><div class=\"exp-grid\"><b>Sprzęt<\/b><span>kulka z folii aluminiowej na nitce, naelektryzowany pręt (ebonit, PVC, balon)<\/span><b>Obserwacja<\/b><span>Kulka najpierw jest przyciągana, po dotknięciu — gwałtownie odpychana.<\/span><b>Wniosek<\/b><span>Przyciąganie obojętnej kulki → indukcja; po dotyku kulka ma ładunek tego samego znaku → odpychanie.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 5 — Puszka toczona balonem<\/h5><div class=\"exp-grid\"><b>Przebieg<\/b><span>Pustą puszkę aluminiową połóż na stole, zbliż naelektryzowany balon (bez dotykania).<\/span><b>Obserwacja<\/b><span>Puszka toczy się za balonem.<\/span><b>Wniosek<\/b><span>Indukcja w metalu: bliższa strona puszki ma ładunek przeciwny do balonu.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 6 — Przewodnik czy izolator?<\/h5><div class=\"exp-grid\"><b>Przebieg<\/b><span>Naładuj elektroskop, a następnie dotykaj kulki: drutem trzymanym w ręce, plastikową linijką, ołówkiem (grafit), suchym i wilgotnym sznurkiem.<\/span><b>Obserwacja<\/b><span>Drut, grafit i wilgotny sznurek rozładowują elektroskop (listki opadają), linijka i suchy sznurek — nie.<\/span><b>Wniosek<\/b><span>Przewodniki odprowadzają ładunek do ziemi przez nasze ciało; woda w sznurku przewodzi dzięki jonom.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 7 — Elektryzowanie elektroskopu przez indukcję<\/h5><div class=\"exp-grid\"><b>Przebieg<\/b><span>4 kroki z rozdziału 7.<\/span><b>Obserwacja<\/b><span>Na końcu listki rozchylone, mimo że pręt nigdy nie dotknął elektroskopu.<\/span><b>Sprawdzenie znaku<\/b><span>Zbliż ponownie ten sam pręt — listki opadają, więc ładunek elektroskopu jest przeciwny do ładunku pręta.<\/span><\/div><\/div>\n<div class=\"card card-extra\"><span class=\"card-label\">BHP i praktyka<\/span><ul><li>Doświadczenia elektrostatyczne wychodzą w <strong>suchym<\/strong> powietrzu (zimą) — wilgoć rozładowuje ciała.<\/li><li>Nie wykonuj doświadczeń przy otwartych oparach paliw i rozpuszczalników.<\/li><li>Maszyna elektrostatyczna i generator Van de Graaffa — tylko pod okiem nauczyciela (wyładowania są bezpieczne dla zdrowej osoby, ale bolesne; niebezpieczne dla osób z rozrusznikiem).<\/li><li>Podczas burzy: nie stój pod samotnym drzewem, nie kąp się, w samochodzie jesteś bezpieczny (klatka Faradaya).<\/li><\/ul><\/div>\n<\/section>\n\n<section id=\"s11\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Klinika błędów<\/div>\n<div class=\"table-wrap\"><table class=\"klinika-table\"><thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><\/tr><\/thead><tbody><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Przy pocieraniu przechodzą protony.<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Przechodzą tylko elektrony.<\/td><td data-label=\"Dlaczego\">Protony są uwięzione w jądrach atomów.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Ciało dodatnie ma nadmiar protonów, które dostało.<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Ciało dodatnie ma niedobór elektronów.<\/td><td data-label=\"Dlaczego\">Liczba protonów się nie zmienia — ciało oddało elektrony.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Tarcie wytwarza ładunek.<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Tarcie rozdziela ładunek.<\/td><td data-label=\"Dlaczego\">Zasada zachowania ładunku: ile jedno ciało ma +, tyle drugie −.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Skoro ciała się przyciągają, oba są naelektryzowane.<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Przyciąganie może zachodzić między ciałem naładowanym i obojętnym.<\/td><td data-label=\"Dlaczego\">Polaryzacja / indukcja. Pewnym dowodem jest tylko odpychanie.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Elektroskop pokazuje, czy ładunek jest + czy −.<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Elektroskop pokazuje tylko, czy (i ile) ładunku jest.<\/td><td data-label=\"Dlaczego\">Znak ustala się ciałem o znanym ładunku.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">2× większa odległość → siła 2× mniejsza.<\/td><td class=\"col-ok\" data-label=\"Poprawa\">2× większa odległość → siła 4× mniejsza.<\/td><td data-label=\"Dlaczego\">F ∝ 1/r² (prawo Coulomba).<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Metalu nie da się naelektryzować przez tarcie.<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Da się, jeśli jest odizolowany (trzymany za izolującą rączkę).<\/td><td data-label=\"Dlaczego\">W ręce ładunek natychmiast spływa przez ciało do ziemi.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Piorunochron przyciąga pioruny, więc jest niebezpieczny.<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Piorunochron chroni budynek.<\/td><td data-label=\"Dlaczego\">Bezpiecznie odprowadza ładunek wyładowania przewodem do ziemi.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Przy indukcji przewodnik zyskuje ładunek.<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Przy indukcji ładunek tylko się rozsuwa (suma = 0).<\/td><td data-label=\"Dlaczego\">Trwały ładunek pojawia się dopiero po uziemieniu i jego odłączeniu.<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n\n<section id=\"s11a\">\n<div class=\"part-heading\"><span class=\"part-num\">11a<\/span> Przykłady prowadzone krok po kroku<\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Jak rozwiązywać zadania — schemat<\/span><ol><li><b>Wypisz dane<\/b> z jednostkami; zamień nC, µC na C, cm na m.<\/li><li><b>Nazwij zjawisko<\/b>: tarcie / dotyk / indukcja / Coulomb.<\/li><li><b>Wybierz wzór<\/b> z ściągi (sekcja 0).<\/li><li><b>Podstaw i policz<\/b> — potęgi dziesiątki osobno: 10⁻⁶ · 10⁻⁶ = 10⁻¹².<\/li><li><b>Sprawdź sens<\/b>: znak ładunku, czy siła rośnie/maleje zgodnie z intuicją, czy suma ładunków się zgadza.<\/li><\/ol><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Przykład 1 (E8) — ile elektronów?<\/span><ol><li>Dane: q = −4,8·10⁻¹⁹ C; szukane: n.<\/li><li>Wzór: n = |q| / e.<\/li><li>n = 4,8·10⁻¹⁹ / 1,6·10⁻¹⁹ = 3.<\/li><li>Odpowiedź: 3 nadmiarowe elektrony (ładunek ujemny = nadmiar).<\/li><\/ol><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Przykład 2 (E8) — dotyk trzech kul<\/span><ol><li>Kule identyczne: A = +9 nC, B = −3 nC. Dotykamy A z B.<\/li><li>Suma: +9 + (−3) = +6 nC → po zetknięciu po +3 nC.<\/li><li>Kontrola: przed 6 nC, po 3 + 3 = 6 nC ✓ (zasada zachowania).<\/li><\/ol><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Przykład 3 (E8+) — prawo Coulomba<\/span><ol><li>Dane: q₁ = 3 µC = 3·10⁻⁶ C, q₂ = −2 µC, r = 20 cm = 0,2 m.<\/li><li>F = k·|q₁q₂|/r² = 8,99·10⁹ · 6·10⁻¹² / 0,04.<\/li><li>F = 8,99·10⁹ · 1,5·10⁻¹⁰ ≈ 1,35 N.<\/li><li>Znaki różne → przyciąganie.<\/li><\/ol><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Przykład 4 (E8+) — co, jeśli…<\/span><ol><li>Odległość zmalała 2 razy: F rośnie 2² = 4 razy.<\/li><li>Jeden ładunek wzrósł 3 razy, odległość wzrosła 3 razy: F · 3 / 9 = F/3.<\/li><li>Wskazówka: najpierw zapisz F ∝ q₁q₂/r², potem podstaw zmiany.<\/li><\/ol><\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Przykład 5 (LO) — natężenie pola<\/span><ol><li>Q = 2 nC, r = 30 cm: E = k·Q/r² = 8,99·10⁹ · 2·10⁻⁹ / 0,09 ≈ 200 N/C.<\/li><li>Siła na elektron w tym miejscu: F = eE ≈ 1,6·10⁻¹⁹ · 200 = 3,2·10⁻¹⁷ N.<\/li><\/ol><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-ladunek-v01\"><button type=\"button\" data-che-open-viz=\"fiz-ladunek-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-ladunek-v01',lessonId:'FIZ-01'},'*')\"><b>Sprawdź przykład 2 na modelu kul<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-coulomb-v01\"><button type=\"button\" data-che-open-viz=\"fiz-coulomb-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-coulomb-v01',lessonId:'FIZ-01'},'*')\"><b>Sprawdź przykłady 3–5 w modelu Coulomba<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<\/section>\n\n<section id=\"s12\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Ćwiczenia<\/div>\n<h3>Poziom A — podstawa (E8)<\/h3><div class=\"card\"><ol start=\"1\"><li>Kulka ma ładunek −3,2·10⁻¹⁹ C. Ile ma nadmiarowych elektronów?<\/li><li>Ciało ma 5·10⁹ nadmiarowych elektronów. Oblicz jego ładunek.<\/li><li>Szklaną pałeczkę potarto jedwabiem. Jaki znak ładunku ma każde z ciał i dlaczego?<\/li><li>Dwie identyczne metalowe kulki: +6 nC i −2 nC. Jaki ładunek ma każda po zetknięciu?<\/li><li>Wymień trzy przewodniki i trzy izolatory.<\/li><\/ol><details class=\"answer\"><summary>Pokaż podpowiedzi<\/summary><ol start=\"1\"><li>n = |q|/e<\/li><li>q = n·e, znak: nadmiar e → minus<\/li><li>kto stoi wcześniej w szeregu tryboelektrycznym, oddaje elektrony<\/li><li>zsumuj i podziel na 2<\/li><li>czy są swobodne nośniki ładunku?<\/li><\/ol><\/details><details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary><ol start=\"1\"><li>n = q/e = 3,2·10⁻¹⁹ / 1,6·10⁻¹⁹ = 2 elektrony.<\/li><li>q = n·e = 5·10⁹ · 1,6·10⁻¹⁹ C = 8·10⁻¹⁰ C, znak ujemny: q = −8·10⁻¹⁰ C (−0,8 nC).<\/li><li>Szkło +, jedwab −: szkło oddało elektrony jedwabiowi (stoi wcześniej w szeregu tryboelektrycznym).<\/li><li>(+6 − 2)/2 = +2 nC każda.<\/li><li>Przewodniki: miedź, aluminium, grafit, woda z solą, ciało człowieka. Izolatory: szkło, guma, plastik, suche drewno, suche powietrze.<\/li><\/ol><\/details><\/div>\n<h3>Poziom B — trening (E8)<\/h3><div class=\"card\"><ol start=\"6\"><li>Do kulki naładowanego elektroskopu zbliżono pręt naładowany ujemnie — listki rozchyliły się bardziej. Jaki znak ma ładunek elektroskopu?<\/li><li>Dlaczego naelektryzowany balon przykleja się do ściany?<\/li><li>Jak zmieni się siła oddziaływania dwóch ładunków, gdy odległość wzrośnie 3 razy? A gdy oba ładunki wzrosną 2 razy?<\/li><li>Opisz, jak naelektryzować elektroskop dodatnio, mając tylko pręt naładowany ujemnie.<\/li><\/ol><details class=\"answer\"><summary>Pokaż podpowiedzi<\/summary><ol start=\"6\"><li>zbliżenie jednoimiennego ładunku spycha elektrony do listków<\/li><li>polaryzacja / indukcja w ścianie<\/li><li>F ∝ q₁q₂/r²<\/li><li>ZUZO: zbliż, uziem, zabierz palec, oddal<\/li><\/ol><\/details><details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary><ol start=\"6\"><li>Ujemny — zbliżenie ładunku jednoimiennego spycha więcej elektronów do listków.<\/li><li>Balon (−) indukuje w ścianie ładunek dodatni na powierzchni (polaryzacja) — przyciąganie.<\/li><li>9 razy mniejsza; 4 razy większa.<\/li><li>Indukcja: zbliż pręt, uziem kulkę palcem, zabierz palec, oddal pręt — elektroskop ma ładunek dodatni.<\/li><\/ol><\/details><\/div>\n<h3>Poziom C — ambitny<\/h3><div class=\"card\"><ol start=\"10\"><li>Balon ma ładunek −0,5 µC. Ile elektronów przeszło na niego z włosów?<\/li><li>Oblicz siłę między ładunkami 2 µC i 3 µC odległymi o 30 cm. Czy to przyciąganie, czy odpychanie?<\/li><li>Trzy identyczne kulki: A = +8 nC, B = 0, C = 0. Dotykamy A do B, potem B do C. Jakie są ładunki końcowe?<\/li><\/ol><details class=\"answer\"><summary>Pokaż podpowiedzi<\/summary><ol start=\"10\"><li>0,5 µC = 5·10⁻⁷ C; n = q/e<\/li><li>zamień µC na C i cm na m<\/li><li>dotykaj po kolei; suma się nie zmienia<\/li><\/ol><\/details><details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary><ol start=\"10\"><li>n = 0,5·10⁻⁶ / 1,602·10⁻¹⁹ ≈ 3,1·10¹² elektronów.<\/li><li>F = 8,99·10⁹ · 6·10⁻¹² / 0,09 ≈ 0,6 N — odpychanie (ładunki jednoimienne).<\/li><li>A–B: po +4 nC. B–C: po +2 nC. Wynik: A = +4 nC, B = +2 nC, C = +2 nC (suma 8 nC — zachowana).<\/li><\/ol><\/details><\/div>\n<h3>Poziom D — LO rozszerzone<\/h3><div class=\"card\"><ol start=\"13\"><li>Oblicz natężenie pola ładunku 1 nC w odległości 10 cm oraz przyspieszenie elektronu w tym miejscu.<\/li><li>Dwa ładunki +q w odległości 2a. Ile wynosi natężenie pola w połowie odległości? Uzasadnij.<\/li><li>Dlaczego w wodzie (εr ≈ 80) kryształ NaCl rozpada się na jony, a w benzynie (εr ≈ 2) — nie?<\/li><\/ol><details class=\"answer\"><summary>Pokaż podpowiedzi<\/summary><ol start=\"13\"><li>E = kQ/r², a = eE/mₑ<\/li><li>wektory od obu ładunków znoszą się<\/li><li>siła maleje εr razy<\/li><\/ol><\/details><details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary><ol start=\"13\"><li>E = k·Q/r² = 8,99·10⁹ · 10⁻⁹ / 0,01 ≈ 900 N/C; F = eE ≈ 1,44·10⁻¹⁶ N; a = F/m<sub>e<\/sub> ≈ 1,6·10¹⁴ m/s².<\/li><li>E = 0 — wektory natężeń od obu ładunków mają równe wartości i przeciwne zwroty (superpozycja).<\/li><li>Siła przyciągania Na⁺ i Cl⁻ maleje εr razy; w wodzie ~80× — energia cieplna i hydratacja wystarczają, by rozdzielić jony; w benzynie siła prawie się nie zmienia.<\/li><\/ol><\/details><\/div>\n<\/section>\n\n<section id=\"s12a\">\n<div class=\"part-heading\"><span class=\"part-num\">12a<\/span> Zadania egzaminacyjne E8 — typy i wzorcowe odpowiedzi<\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Typowe zadania E8 — jak je rozpoznać<\/span><div class=\"table-wrap\"><table><thead><tr><th>Typ zadania<\/th><th>Co sprawdza<\/th><th>Klucz do odpowiedzi<\/th><\/tr><\/thead><tbody><tr><td>„Wyjaśnij, dlaczego balon przyczepił się do ściany”<\/td><td>indukcja / polaryzacja<\/td><td>balon naelektryzowany → w ścianie przesunięcie ładunków → bliżej ładunek przeciwny → przyciąganie<\/td><\/tr><tr><td>„Jaki ładunek uzyska pałeczka…” (szereg podany w zadaniu)<\/td><td>tarcie<\/td><td>oddaje elektrony materiał stojący wcześniej → +; przyjmuje → −<\/td><\/tr><tr><td>„Kulki zetknięto — jaki mają ładunek?”<\/td><td>zasada zachowania ładunku<\/td><td>q′ = (q₁ + q₂)/2 dla identycznych kul<\/td><\/tr><tr><td>„Uzupełnij zdania: listki elektroskopu…”<\/td><td>budowa i działanie elektroskopu<\/td><td>listki mają ładunek jednoimienny → odpychają się<\/td><\/tr><tr><td>„Wybierz przewodniki / izolatory”<\/td><td>klasyfikacja materiałów<\/td><td>metale, grafit, woda z solą — przewodniki; szkło, guma, plastik, suche drewno — izolatory<\/td><\/tr><tr><td>„Zaplanuj doświadczenie…”<\/td><td>metoda naukowa<\/td><td>problem → hipoteza → zestaw → przebieg → obserwacja → wniosek; zmieniaj jedną zmienną<\/td><\/tr><tr><td>„Oblicz, ile elektronów…” (E8+)<\/td><td>q = n·e<\/td><td>n = q/e; uważaj na przedrostki nC, µC<\/td><\/tr><tr><td>„Jak zmieni się siła…” (E8+)<\/td><td>F ∝ q₁q₂/r²<\/td><td>2× dalej → ¼; 2× większy ładunek → 2×<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<div class=\"card card-extra\"><span class=\"card-label\">Zadanie egzaminacyjne z rozwiązaniem (otwarte)<\/span><p><b>Treść:<\/b> Ania potarła plastikową linijkę o włosy i zbliżyła ją do strumienia wody z kranu. Strumień się wygiął. Wyjaśnij zjawisko i podaj, jak zmieni się efekt, gdy linijkę odsunie dalej.<\/p><details class=\"answer\"><summary>Wzorcowa odpowiedź<\/summary><p>Linijka naelektryzowała się przez tarcie (przejęła elektrony z włosów — ładunek ujemny). Jej ładunek przesuwa ładunki w wodzie (polaryzacja cząsteczek H₂O, jony w wodzie z kranu) — bliżej linijki gromadzi się ładunek przeciwnego znaku, więc woda jest przyciągana i strumień się wygina. Po odsunięciu linijki siła maleje (szybko, bo zależy od odległości), więc strumień wygina się słabiej.<\/p><p class=\"mini-note\">Punktowane elementy: elektryzowanie przez tarcie · przesunięcie ładunków w wodzie · przyciąganie · zależność od odległości.<\/p><\/details><\/div>\n<\/section>\n\n<section id=\"s14a\">\n<div class=\"part-heading\"><span class=\"part-num\">14a<\/span> Mapa myśli, checklista i plan powtórek<\/div>\n<div class=\"card card-basic\"><span class=\"card-label\">Mapa myśli<\/span><pre style=\"font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;background:var(--surface-soft,#f6f8fa);padding:12px;border-radius:10px\">ELEKTROSTATYKA\n├── ŁADUNEK: proton +e, elektron −e · q = n·e · 1 C\n├── ELEKTRYZOWANIE\n│   ├── tarcie → szereg tryboelektryczny (ładunki przeciwne)\n│   ├── dotyk → ładunek tego samego znaku · (q₁+q₂)/2\n│   └── indukcja → ZUZO → ładunek przeciwny\n├── ODDZIAŁYWANIE: jednoimienne ↔ odpychanie, różnoimienne ↔ przyciąganie\n│   └── F = k·|q₁q₂|/r² (E8+) · 2× dalej → ¼\n├── MATERIAŁY: przewodniki (e⁻ swobodne, jony) · izolatory · półprzewodniki\n├── PRZYRZĄDY: elektroskop (ILE, nie JAKI) · uziemienie\n├── ZASTOSOWANIA: piorunochron · ksero · filtry · malowanie · klatka Faradaya\n└── LO: pole E = F/q · linie pola · potencjał · napięcie · kondensator<\/pre><\/div>\n<div class=\"card card-core\"><span class=\"card-label\">Checklista — umiem…<\/span><ul style=\"list-style:none;padding:0\"><li>☐ wyjaśniam, skąd ciało ma ładunek (nadmiar / niedobór elektronów)<\/li><li>☐ liczę q = n·e i n = q/e<\/li><li>☐ przewiduję znaki ładunków po tarciu (szereg)<\/li><li>☐ stosuję zasadę zachowania ładunku przy dotyku<\/li><li>☐ opisuję budowę i działanie elektroskopu<\/li><li>☐ wyjaśniam przyciąganie ciała obojętnego (polaryzacja/indukcja)<\/li><li>☐ opisuję 4 kroki elektryzowania przez indukcję<\/li><li>☐ podaję 3 przewodniki i 3 izolatory oraz przykłady zastosowań i zagrożeń<\/li><li>☐ (E8+) obliczam siłę z prawa Coulomba i jej zmianę<\/li><li>☐ (LO) obliczam natężenie pola ładunku punktowego<\/li><\/ul><\/div>\n<div class=\"card card-understand\"><span class=\"card-label\">Plan powtórek (krzywa zapominania)<\/span><div class=\"table-wrap\"><table><thead><tr><th>Kiedy<\/th><th>Co<\/th><th>Ile<\/th><\/tr><\/thead><tbody><tr><td>dziś<\/td><td>sekcja 0 + mnemotechniki<\/td><td>10 min<\/td><\/tr><tr><td>jutro<\/td><td>fiszki + diagnoza startowa<\/td><td>5 min<\/td><\/tr><tr><td>za 3 dni<\/td><td>przykłady prowadzone (bez patrzenia)<\/td><td>15 min<\/td><\/tr><tr><td>za tydzień<\/td><td>ćwiczenia A–B + test<\/td><td>20 min<\/td><\/tr><tr><td>za 3 tygodnie<\/td><td>zadania egzaminacyjne 12a<\/td><td>20 min<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<\/section>\n\n<section id=\"s13\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Fiszki<\/div>\n<div class=\"flashcard-grid\" id=\"flashcards\"><\/div><\/section>\n\n<section id=\"s14\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Test<\/div>\n<div id=\"quizWrap\"><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div><\/section>\n\n<section id=\"s15\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> Słownik i mosty<\/div>\n<div class=\"card\"><dl><div class=\"def-item\"><dt>Ładunek elektryczny q<\/dt><dd>wielkość opisująca oddziaływania elektryczne; jednostka 1 C<\/dd><\/div><div class=\"def-item\"><dt>Ładunek elementarny e<\/dt><dd>najmniejszy swobodny ładunek, ≈ 1,6·10⁻¹⁹ C<\/dd><\/div><div class=\"def-item\"><dt>Indukcja elektrostatyczna<\/dt><dd>przesunięcie ładunków w przewodniku pod wpływem zewnętrznego ładunku<\/dd><\/div><div class=\"def-item\"><dt>Polaryzacja<\/dt><dd>przesunięcie ładunków w cząsteczkach izolatora<\/dd><\/div><div class=\"def-item\"><dt>Uziemienie<\/dt><dd>połączenie ciała z ziemią przewodnikiem<\/dd><\/div><div class=\"def-item\"><dt>Elektroskop<\/dt><dd>przyrząd do wykrywania ładunku<\/dd><\/div><div class=\"def-item\"><dt>Szereg tryboelektryczny<\/dt><dd>kolejność materiałów wg skłonności do oddawania elektronów<\/dd><\/div><\/dl><\/div><div class=\"card card-new\"><span class=\"card-label\">Mosty<\/span><ul><li><strong>Chemia N03 Kwasy<\/strong> — jony, dysocjacja, przewodzenie prądu przez roztwory, elektroliza.<\/li><li><strong>Chemia N04 Sole<\/strong> — kryształy jonowe, rola wody (ε<sub>r<\/sub> ≈ 80).<\/li><li><strong>Fizyka — dalej<\/strong>: prąd elektryczny (ruch ładunków), napięcie, prawo Ohma (opór właściwy ρ z tej lekcji), magnetyzm.<\/li><\/ul><\/div>\n<\/section>\n\n<\/main>\n<script>(function(){var cards=[[\"Ładunek elementarny\", \"e ≈ 1,6·10⁻¹⁹ C\"], [\"1 C to ile elektronów?\", \"ok. 6,24·10¹⁸\"], [\"Ciało naelektryzowane ujemnie\", \"nadmiar elektronów\"], [\"Ciało naelektryzowane dodatnio\", \"niedobór elektronów\"], [\"Co się przemieszcza przy elektryzowaniu?\", \"tylko elektrony\"], [\"3 sposoby elektryzowania\", \"tarcie, dotyk, indukcja (wpływ)\"], [\"Zasada zachowania ładunku\", \"w układzie izolowanym suma ładunków jest stała\"], [\"Szkło + jedwab\", \"szkło +, jedwab −\"], [\"Ebonit + sukno\", \"ebonit −, sukno +\"], [\"Przewodnik\", \"ma swobodne nośniki ładunku (elektrony lub jony)\"], [\"Izolator\", \"brak swobodnych nośników; ładunek zostaje w miejscu\"], [\"Elektroskop\", \"wykrywa ładunek; listki odpychają się jednoimiennie; nie pokazuje znaku\"], [\"Uziemienie\", \"połączenie z ziemią — rozładowuje ciało\"], [\"Prawo Coulomba\", \"F = k·|q₁q₂| / r², k ≈ 9·10⁹ N·m²/C²\"], [\"2× większa odległość\", \"siła 4× mniejsza\"], [\"Natężenie pola\", \"E = F/q [N/C]\"], [\"Klatka Faradaya\", \"wewnątrz przewodnika pole = 0\"]];var g=document.getElementById(\"flashcards\");if(g){g.innerHTML=cards.map(function(c){return '<button class=\"flashcard\" type=\"button\"><span class=\"front\">'+c[0]+'<\/span><span class=\"back\">'+c[1]+'<\/span><\/button>'}).join(\"\");g.querySelectorAll(\".flashcard\").forEach(function(b){b.addEventListener(\"click\",function(){b.classList.toggle(\"flipped\")})})}var qs=[[\"Co przemieszcza się przy elektryzowaniu przez tarcie?\", [\"protony\", \"elektrony\", \"neutrony\"], 1], [\"Ciało naelektryzowane dodatnio ma…\", [\"nadmiar protonów\", \"niedobór elektronów\", \"nadmiar elektronów\"], 1], [\"Ebonit pocierany suknem ładuje się…\", [\"dodatnio\", \"ujemnie\", \"nie elektryzuje się\"], 1], [\"Który materiał jest przewodnikiem?\", [\"guma\", \"grafit\", \"szkło\"], 1], [\"Dwie identyczne kulki: +4 nC i 0. Po zetknięciu każda ma…\", [\"+4 nC\", \"+2 nC\", \"0\"], 1], [\"Listki elektroskopu się rozchylają, bo…\", [\"mają ładunki różnoimienne\", \"mają ładunki jednoimienne\", \"są obojętne\"], 1], [\"Odległość między ładunkami wzrosła 2 razy. Siła…\", [\"zmalała 2 razy\", \"zmalała 4 razy\", \"wzrosła 4 razy\"], 1], [\"Naelektryzowany grzebień przyciąga skrawki papieru, bo…\", [\"papier jest naelektryzowany ujemnie\", \"w papierze następuje polaryzacja ładunków\", \"działa grawitacja\"], 1], [\"Ładunek 1 C to ok.…\", [\"6,24·10¹⁸ elektronów\", \"1,6·10⁻¹⁹ elektronów\", \"1000 elektronów\"], 0], [\"Piorunochron…\", [\"przyciąga burzę\", \"odprowadza ładunek wyładowania do ziemi\", \"izoluje dach\"], 1]];var w=document.getElementById(\"quizWrap\"),sc=document.getElementById(\"quizScore\"),ok=0,n=0;if(w){qs.forEach(function(q,i){var d=document.createElement(\"div\");d.className=\"quiz-q\";d.innerHTML=\"<h5>\"+(i+1)+\". \"+q[0]+\"<\/h5><div class=\\\"quiz-opts\\\">\"+q[1].map(function(o,j){return '<button type=\"button\" class=\"quiz-opt\" data-a=\"'+j+'\">'+o+\"<\/button>\"}).join(\"\")+\"<\/div>\";w.appendChild(d);d.querySelectorAll(\".quiz-opt\").forEach(function(b){b.onclick=function(){if(d.dataset.done)return;d.dataset.done=1;n++;var a=+b.dataset.a;if(a===q[2])ok++;d.querySelectorAll(\".quiz-opt\").forEach(function(x){x.disabled=true;if(+x.dataset.a===q[2])x.classList.add(\"correct\");else if(x===b)x.classList.add(\"wrong\")});sc.textContent=\"Wynik: \"+ok+\" / \"+n}})})}var b=document.getElementById(\"advToggle\");if(b){var all=function(){return document.querySelectorAll(\"details.adv\")};var k=all().length;b.textContent=\"Pokaż treści akademickie (\"+k+\")\";b.onclick=function(){var on=b.getAttribute(\"aria-pressed\")!==\"true\";all().forEach(function(d){d.open=on});b.setAttribute(\"aria-pressed\",on?\"true\":\"false\");b.textContent=(on?\"Ukryj\":\"Pokaż\")+\" treści akademickie (\"+k+\")\"}}})();<\/script>\n<\/body>\n<\/html>\n"</script>
