larowną wodę wapienną powoduje zmętnienie — powstaje biały osad węglanu wapnia. To test na CO₂.'},\n f01Mg:{n:'Spalanie magnezu (pokaz)',rxKey:'mgO2',vessel:'crucible',level:.02,solid:{col:[196,200,206],col2:[250,250,248],eq:3,end:.15,t:'chips',shape:'chips'},ppt:'ppt-caco3',habit:'crystal',out:['osad'],heat:1.6,T:800,teacher:1,eq:'2 Mg + O₂ → 2 MgO',why:'Wstążka spala się oślepiająco jasnym, białym płomieniem; zostaje biały, kruchy proszek bez metalicznego połysku — tlenek magnezu.'},\n f01FeS:{n:'Fe + S (ogrzewanie, pokaz)',vessel:'testTube',solid:{col:[150,146,96],col2:[38,36,34],eq:4,end:.9,t:'powder',shape:'powder'},level:.02,out:['nic'],heat:1.4,T:600,teacher:1,eq:'Fe + S → FeS',why:'Szarożółta mieszanina rozżarza się (także po odsunięciu palnika) i zmienia się w czarną, kruchą masę. Magnes nie przyciąga produktu — powstał siarczek żelaza(II).'}\n};\nvar RDF1={\n f01SodaOcet:[R([[1,'NaHCO3'],[1,'CH3COOH']],[[1,'CH3COONa'],[1,'H2O'],[1,'CO2']]),{type:'wymiana (wodorowęglan + kwas)',conditions:'temperatura pokojowa',observation:'pienienie, wydzielanie bezbarwnego gazu (CO₂)',safety:['ocet drażni oczy']}],\n f01FeS:[R([[1,'Fe'],[1,'S']],[[1,'FeS']]),{type:'synteza',conditions:'ogrzewanie mieszaniny w probówce',observation:'mieszanina rozżarza się, powstaje czarna krucha substancja niemagnetyczna',safety:['pokaz nauczyciela pod wyciągiem; możliwy SO₂']}]};\nvar SBF1={NaHCO3:['wodorowęglan sodu (soda oczyszczona)','s',84.007,'wodorosól',[],['proszek do pieczenia','gaśnice']],\n CH3COONa:['octan sodu','aq',82.034,'sól',[],['przemysł spożywczy','ogrzewacze chemiczne']],\n FeS:['siarczek żelaza(II)','s',87.91,'sól (czarna)',[],['otrzymywanie H₂S w laboratorium']]};\nObject.keys(SBF1).forEach(function(f){if(D.SUBSTANCES[f]||byF[f])return;var a=SBF1[f];D.SUBSTANCES[f]={formula:f,name:a[0],state:a[1],molarMass:a[2],role:a[3],safety:a[4],uses:a[5],src:'rozszerzenia.js'}});\nObject.keys(RDF1).forEach(function(k){if(D.REACTIONS[k])return;D.REACTIONS[k]=RDF1[k][0];D.REACTION FX dla F03 (mieszaniny do rozdzielania) — pracownia łączy je z zlewkami F01 ---------- */\nvar RXF3={\n f03PiasekWoda:{n:'Piasek + woda (zawiesina)',solid:{col:[214,190,140],eq:4,end:1,t:'powder',shape:'powder'},turb:.25,out:['nic'],qualitative:1,eq:'piasek(s) + H₂O(c) — brak reakcji',why:'Piasek nie rozpuszcza się: po zamieszaniu woda mętnieje, po chwili ziarna opadają na dno (sedymentacja), a nad osadem zostaje prawie klarowna woda. Dwie fazy — mieszanina niejednorodna.'},\n f03KredaWoda:{n:'Kreda + woda (zawiesina)',solid:{col:[246,246,242],eq:4,end:1,t:'powder',shape:'powder'},turb:.7,out:['nic'],qualitative:1,eq:'CaCO₃(s) + H₂O(c) — brak reakcji',why:'Drobna kreda tworzy mleczną zawiesinę, która opada wolno. Sączek zatrzymuje cząstki kredy, a przesącz jest klarowny.'}\n};\nif(rx)Object.keys(RXF3).forEach(function(k){if(!rx.get(k))rx.register(k,RXF3[k])});\n\npracownia('f03-rozdzielanie-v01','Pracownia: rozdzielanie mieszanin','Najpierw nazwij różnicę właściwości, potem wybierz metodę: zawiesiny (sedymentacja, dekantacja, sączenie), roztwór (odparowanie, krystalizacja).',\n [['Zawiesiny — ciało stałe nierozpuszczalne',['f03PiasekWoda','f03KredaWoda']],['Roztwór — substancja rozpuszczona',['f01SolWoda','f01Odparowanie']]],\n {f03PiasekWoda:{war:'piasek w zlewce z wodą, zamieszanie bagietką, odstawienie',wn:'Różnica: piasek nie rozpuszcza się i ma większą gęstość niż woda → sedymentacja, potem dekantacja albo sączenie.',bhp:'Szkło — ostrożnie; okulary.'},\n  f03KredaWoda:{war:'sproszkowana kreda w wodzie, mieszanie',wn:'Drobne cząstki opadają wolno — szybciej rozdzieli je sączenie przez bibułę; przesącz jest klarowny.',bhp:'Okulary; sączek nie może być przedziurawiony bagietką.'},\n  f01SolWoda:{war:'sól kuchenna w wodzie, mieszanie',wn:'Sól rozpuszcza się — przechodzi przez sączek razem z wodą. Sączenie nie zadziała; trzeba wykorzystać lotność wody (odparowanie, krystalizacja lub destylacja).',bhp:'Nie smakujemy substancji w pracowni.'},\n  f01Odparowanie:{war:'roztwór soli w parownicy, ogrzewanie',wn:'Woda odparowuje, sól krystalizuje na dnie — odzyskujemy substancję rozpuszczoną (wodę tracimy; chcąc ją odzyskać — destylacja).',bhp:'Gorąca parownica — szczypce; okulary (pryskanie pod koniec).'}},\n 'GFX.rx · rozszerzenia.js (F03)');\n\n/* ---------- 8. F05 — konstruktor: izotop / jon / inny pierwiastek + masa atomowa jako średnia ważona ----------\n   Model wielokrotnego użytku (F04, F05, F06, A01…): `f05-izotopy-v01`. Dane izotopów z silnika (CHE.DATA.ISOTOPES). */\n/* dane z silnika (bez lokalnej kopii): CHE.DATA.ELEMENTS_54 (symbol, nazwa) + CHE.DATA.ISOTOPES (A, masa, udział) */\nfunction izo(z){var E=(D.ELEMENTS_54||[]).filter(function(e){return e.z===z})[0];if(!E)return null;\n var L=(D.ISOTOPES||{})[E.s]||[];return [E.s,String(E.n||E.s).toLowerCase(),L.map(function(x){return [x.A,x.atomicMass,(x.abundance||0)*100]}).sort(function(a,b){return b[2]-a[2]||a[0]-b[0]})]}\nfunction supN(n){return String(n).replace(/[0-9]/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]})}\nfunction subN(n){return String(n).replace(/[0-9]/g,function(d){return '₀₁₂₃₄₅₆₇₈₉'[d]})}\nfunction chg(q){return q===0?'':(Math.abs(q)>1?supN(Math.abs(q)):'')+(q>0?'⁺':'⁻')}\nfunction pl(x,d){return x.toFixed(d).replace('.',',')}\n/* atomSVG — komponent wielokrotnego użytku (F05, F07, A01…): model atomu jako SVG, kolory jak w atlasie (_anon_004 bohr: elektrony wewnętrzne #2f8a55, walencyjne #b85f00).\n   o = {p, n, e, powloki:false|true, W:260}. powloki:false → elektrony na jednym okręgu (F05; powłoki to pojęcie F07);\n   powloki:true → powłoki K, L, M, N wg modelu szkolnego 2, 8, 8, … (do Z = 20; dalej uproszczenie — do weryfikacji). Zwraca otwarty <svg…> (zamknąć '<\/svg>'). */\nfunction atomSVG(o){var W=o.W||260,C=W/2,p=o.p|0,n=o.n|0,e=o.e|0,svg='<svg viewBox=\"0 0 '+W+' '+W+'\" width=\"100%\" style=\"max-width:'+W+'px;display:block;margin:auto\" role=\"img\" aria-label=\"Model atomu: '+p+' p, '+n+' n, '+e+' e\">';\n var N=p+n,sk=W/260;\n for(var i=0;i<N;i++){va orEach(function(w){var sc=w.nextElementSibling,ok=0,n=0;\n w.querySelectorAll('.quiz-q').forEach(function(d){var good=+d.dataset.ok;d.querySelectorAll('.quiz-opt').forEach(function(b){b.onclick=function(){if(d.dataset.done)return;d.dataset.done=1;n++;if(+b.dataset.a===good)ok++;\n  d.querySelectorAll('.quiz-opt').forEach(function(x){x.disabled=true;if(+x.dataset.a===good)x.classList.add('correct');else if(x===b)x.classList.add('wrong')});\n  if(d.dataset.fb){var f=document.createElement('div');f.className='quiz-fb';f.innerHTML=d.dataset.fb;d.appendChild(f)}\n  if(sc&&sc.classList.contains('quiz-score'))sc.textContent='Wynik: '+ok+' / '+n}})})});\nvar b=root.querySelector('#advToggle');if(b&&!b.dataset.cheAdv){b.dataset.cheAdv=1;var all=function(){return root.querySelectorAll('details.adv')},k=all().length;\n b.textContent='Pokaż treści akademickie ('+k+')';\n b.onclick=function(){var on=b.getAttribute('aria-pressed')!=='true';all().forEach(function(d){d.open=on});b.setAttribute('aria-pressed',on?'true':'false');b.textContent=(on?'Ukryj':'Pokaż')+' treści akademickie ('+k+')'}}\n})();\n\n<\/script>\n<a class=\"skip-link\" href=\"#main\">Przejdź do treści<\/a>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">LKO-Z36 · SUPLEMENT KONKURSOWY · SZKIC<\/div><h1>Konfiguracje elektronowe do Z = 36 i jony<\/h1><p class=\"lead\">Po lekcji F07 i F08 umiesz zapisać konfigurację atomów do Z = 20. Konkurs kuratoryjny (etap I) wymaga tego samego do Z = 36 dla grup 1, 2 i 13–18, a także konfiguracji jonów i wzoru związku wyprowadzonego z konfiguracji. Ta lekcja domyka tę lukę bez wchodzenia w podpowłoki s, p, d.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-extra\">OLIMP (LKO)<\/span><\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><\/section>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#lustro\">0.4. Lustro i most<\/a><a class=\"toc-link\" href=\"#wyklad1\">1. Wykład — cztery wzorce: cały zakres w jednej tabeli<\/a><a class=\"toc-link\" href=\"#wyjatki\">Dodatek — wyjątki do Z = 36 i tabela Z = 1–36<\/a><a class=\"toc-link\" href=\"#wyklad2\">2. Wykład — jony: reguła najbliższego gazu szlachetnego<\/a><a class=\"toc-link\" href=\"#wyklad3\">3. Wykład — od konfiguracji do wzoru związku<\/a><a class=\"toc-link\" href=\"#kompendium\">4. Kompendium — ściąga-wynik<\/a><a class=\"toc-link\" href=\"#klinika\">5. Klinika błędów<\/a><a class=\"toc-link\" href=\"#cwiczenia\">6. Ćwiczenia — formy konkursu LKO (etap I)<\/a><a class=\"toc-link\" href=\"#mity\">7. Mity<\/a><a class=\"toc-link\" href=\"#mini\">8. Mini-wykład: po co to wszystko<\/a><a class=\"toc-link\" href=\"#dosw\">9. Doświadczenie modelowe — dlaczego jony wyglądają jak gazy<\/a><a class=\"toc-link\" href=\"#granice\">10. Granice uproszczenia (dla nauczyciela i ucznia)<\/a><a class=\"toc-link\" href=\"#test\">Test — sprawdź się<\/a><a class=\"toc-link\" href=\"#fiszki\">11. Fiszki<\/a><a class=\"toc-link\" href=\"#slownik\">12. Słownik<\/a><a class=\"toc-link\" href=\"#mapa\">13. Mapa pojęć<\/a><a class=\"toc-link\" href=\"#checklista\">14. Checklista — umiem…<\/a><a class=\"toc-link\" href=\"#mosty\">15. Mosty do innych lekcji<\/a><a class=\"toc-link\" href=\"#ciekawostki\">16. Ciekawostki<\/a><a class=\"toc-link\" href=\"#zrodla\">17. Zadanie transferowe i źródła<\/a><\/nav><\/details>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Zasady tego zestawu — co jest autorskie<\/span>\n<p>Oznaczenie „podstawa” odnosi się w tym materiale do szkolnych podstaw chemii, a nie do osobnego egzaminu ósmoklasisty z chemii. Zadania i punktacja są autorskie, chyba że jednoznacznie wskazano autentyczny arkusz. Wymagania konkretnego konkursu lub olimpiady należy sprawdzić w jego aktualnym programie.\nPodane czasy, punktacja i progi interpretacji wyniku są zasadami tego autorskiego zestawu. Nie stanowią potwierdzenia zasad rzeczywistego konkursu. Informacje o terminach, wyposażeniu i zakresie etapów wymagają sprawdzenia w dokumentach organizatora.<\/p>\n<\/div>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć na konkursie LKO, etap I — 10 punktów<\/h3>\n<ol>\n<li><strong>Kamienie milowe gazów szlachetnych:<\/strong> He 2 · Ne 10 · Ar 18 · Kr 36 elektronów. Pierwiastek o Z od 19 do 36 leży w 4. okresie.<\/li>\n<li><strong>Cztery szkielety konfiguracji<\/strong> dla grup 1, 2 i 13–18 do Z = 36: [2,x] · [2,8,x] · [2,8,8,x] (tylko grupy 1–2) · [2,8,18,x] (grupy 13–18). Ostatnia liczba x to liczba elektronów walencyjnych.<\/li>\n<li><strong>Elektrony walencyjne:<\/strong> grupy 1 i 2 — numer grupy (1 lub 2); grupy 13–18 — numer grupy minus 10 (Al: 3, S: 6, Br: 7).<\/li>\n<li><strong>Liczba powłok = numer okresu.<\/strong> Powłoka M mieści do 18 elektronów w tym zakresie, a nie do 8.<\/li>\n<li><strong>Jon jednoatomowy<\/strong> grup 1, 2, 13, 15, 16, 17 zwykle osiąga konfigurację najbliższego gazu szlachetnego (reguła dubletu i oktetu pomaga przewidywać wiele prostych jonów, ale nie obejmuje wszystkich — jeśli ładunek podano w zadaniu, oblicz liczbę elektronów z ładunku): grupa 1 → 1+, grupa 2 → 2+, grupa 13 → 3+, grupa 15 → 3−, grupa 16 → 2−, grupa 17 → 1−.<\/li>\n<li>Grupy 14 i 18 nie tworzą prostych jonów w zakresie szkolnym (14: wiązania kowalencyjne; 18: powłoki pełne).<\/li>\n<li><strong>Izoelektronowość:<\/strong> jony i atomy o tej samej liczbie elektronów mają tę samą konfigurację. Trzy rodziny do zapamiętania: Ne (2,8), Ar (2,8,8), Kr (2,8,18,8).<\/li>\n<li><strong>Ga³⁺ = 2,8,18<\/strong> — jedyny jon w zakresie, którego konfiguracja nie jest konfiguracją gazu szlachetnego.<\/li>\n<li><strong>Wzór związku z konfiguracji:<\/strong> liczba oddanych elektronów kationu = liczba przyjętych przez anion, a ładunki muszą się zbilansować (K₂S, GaCl₃).<\/li>\n<li><strong>Kontrola:<\/strong> suma elektronów w konfiguracji atomu = Z; w jonie = Z ∓ ładunek.<\/li>\n<\/ol>\n<\/section>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Pytanie przewodnie<\/span>\n<p>Jak z liczby Z i położenia w układzie okresowym odtworzyć konfigurację, jon i wzór związku — bez tabeli, w kilka kroków, z kontrolą sumy elektronów?<\/p>\n<\/div>\n<section>\n<div class=\"part-heading\">Pojęcia i oznaczenia<\/div>\n<p>Pojęcia z F04–F08 są znane. Tu pojawiają się nowe skróty i nazwy, które trzeba rozwinąć od zera:<\/p>\n<ul>\n<li><strong>Z<\/strong> — liczba atomowa, czyli liczba protonów w jądrze. Dla obojętnego atomu równa liczbie elektronów.<\/li>\n<li><strong>Okres<\/strong> — poziomy wiersz układu okresowego. Numer okresu = liczba zapełnianych powłok (K, L, M, N…).<\/li>\n<li><strong>Grupa<\/strong> — pionowa kolumna układu okresowego. Pierwiastki jednej grupy mają podobną liczbę elektronów walencyjnych.<\/li>\n<li><strong>Elektrony walencyjne<\/strong> — elektrony na zewnętrznej powłoce, które biorą udział w tworzeniu wiązań i jonów. Oznaczamy je tu literą x w szkielecie.<\/li>\n<li><strong>Szkielet<\/strong> — zapis konfiguracji w postaci liczb na powłokach, w którym ostatnią liczbę zastępujemy literą x, bo zależy od grupy. Np. [2,8,x] to szkielet trzeciego okresu.<\/li>\n<li><strong>Kation<\/strong> — jon dodatni, powstały przez oddanie elektronów (np. Na⁺, Ca²⁺, Ga³⁺). Oznaczenie <strong>⁺<\/strong> lub <strong>²⁺<\/strong> itd. mówi, ile elektronów oddano.<\/li>\n<li><strong>Anion<\/strong> — jon ujemny, powstały przez przyjęcie elektronów (np. Cl⁻, S²⁻, As³⁻). Ładunek ⁻ mówi, ile elektronów przyjęto.<\/li>\n<li><strong>Jon jednoatomowy<\/strong> — pojedynczy atom mający ładunek (np. Cl⁻, Ga³⁺). Jon wieloatomowy zawiera więcej niż jeden atom (np. SO₄²⁻), niezależnie od tego, ilu pierwiastków są to atomy; w tym zakresie nie występuje.<\/li>\n<li><strong>Gaz szlachetny<\/strong> — pierwiastek 18. grupy (He, Ne, Ar, Kr…), którego powłoka zewnętrzna jest pełna. Jony dążą do jego konfiguracji.<\/li>\n<li><strong>Izoelektronowy<\/strong> — o tej samej liczbie elektronów (i tej samej konfiguracji). Np. Ne, F⁻, Na⁺ — wszystkie mają po 10 elektronów.<\/li>\n<li><strong>Zapis skrócony<\/strong> — konfiguracja z gazem szlachetnym w nawiasie, np. [Ar] 4s¹ dla K. Zapis pełny: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹.<\/li>\n<li><strong>Model powłokowy<\/strong> — uproszczony opis atomu, w którym elektrony są rozmieszczone w powłokach K, L, M, N. Jest modelem, nie dokładnym obrazem; zakres konkursu wyraźnie na nim się opiera.<\/li>\n<\/ul>\n<\/section>\n<section>\n<div class=\"part-heading\">Przypomnienie z F07 i F08<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dwa pytania przed startem<\/span>\n<ol>\n<li>Ile elektronów mieści się na powłoce M (n = 3) według wzoru 2n²? Dlaczego w tym zakresie mówimy o 18, a nie o 8?<\/li>\n<li>Atom ma 2 powłoki i 7 elektronów walencyjnych. Jaki to pierwiastek i jak zapisać jego konfigurację?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Klucz do przypomnienia<\/summary>\n<ol>\n<li>2·3² = 18. Do Ca (Z = 20) powłoka M ma 8 elektronów, ale dalej, przy pierwiastkach grup 13–18 w 4. okresie, zapełnia się do 18. Stąd „8\" z klasy 7 obowiązuje tylko do Z = 20.<\/li>\n<li>Liczba powłok 2 → 2. okres; 7 elektronów walencyjnych → grupa 17 → fluorowiec <strong>F<\/strong> (Z = 9): 2,7 (1s² 2s² 2p⁵). Dla zapisu: F = 1s² 2s² 2p⁵.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"lustro\">\n<div class=\"part-heading\"><span class=\"part-num\">0.4<\/span> Lustro i most<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Co się zmienia względem F07 i F08<\/span>\n<div class=\"table-wrap\"><table>\n<thead><tr><th><\/th><th><\/th><\/tr><\/thead>\n<tbody>\n<tr><td><strong>Było (F07/F08)<\/strong><\/td><td>rozmieszczenie elektronów na K, L, M do Z = 20; „na M maksymalnie 8\"; konfiguracja ↔ położenie w układzie<\/td><\/tr>\n<tr><td><strong>Teraz (LKO)<\/strong><\/td><td>rozszerzenie do Z = 36; powłoka M mieści do 18; cztery szkielety; jony pierwiastków grup 1, 2, 13–18, w tym Br⁻, Ga³⁺, Se²⁻, As³⁻; wzór związku z konfiguracji<\/td><\/tr>\n<tr><td><strong>Będzie (LO)<\/strong><\/td><td>podpowłoki s, p, d; reguła Hunda i zakaz Pauliego w pełnej formie; wtedy zobaczysz, skąd bierze się liczba 18 i wyjątki Cr i Cu<\/td><\/tr>\n<tr><td><strong>Olimpijsko<\/strong><\/td><td>izoelektronowość jako narzędzie szybkiego rozpoznania jonu; konfiguracja jako klucz do wartościowości i wzorów<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/div>\n<p><strong>Cel ucznia.<\/strong> Po tej lekcji umiesz:\n1. wypisać konfigurację powłokową dowolnego pierwiastka grup 1, 2, 13–18 o Z ≤ 36 w kilka sekund, korzystając z czterech szkieletów;\n2. wypisać konfigurację jonu jednoatomowego tych grup;\n3. rozpoznać jony izoelektronowe;\n4. na podstawie konfiguracji ustalić ładunek jonu, grupę, okres i wzór związku;\n5. wskazać granice uproszczenia modelu powłokowego.<\/p>\n<p>---<\/p>\n<\/section>\n<section id=\"wyklad1\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Wykład — cztery wzorce: cały zakres w jednej tabeli<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład — skąd bierze się jeden zapis dla wielu pierwiastków<\/span>\n<p>Konfiguracja elektronowa jest „adresem\" elektronów. Pierwszy krok to ustalenie, na którym piętrze (okresie) znajduje się pierwiastek. Drugi krok to ustalenie, który wzorzec obowiązuje, a trzeci — wpisanie liczby walencyjnej na końcu.<\/p>\n<p>Dla pierwiastków z zakresu wystarczą cztery wzorce, bo wszystkie zapełnione powłoki poprzedzające ostatnią są znane z dotychczasowych lekcji: K (2), L (8), M (8 lub 18 po dopełnieniu bloku d, który tu nie jest rozpatrywany wprost). Dlatego ich liczba jest stała w obrębie grupy i okresu.<\/p>\n<p>Najważniejsza wiadomość: jeśli znasz cztery gazy szlachetne z zakresu — He (2), Ne (10), Ar (18), Kr (36) — to każdy pierwiastek z Z ≤ 36 leży między nimi. Pierwiastek o Z od 19 do 36 leży w czwartym okresie, a od 11 do 18 w trzecim. To pierwsza informacja, którą wyciągasz z Z.<\/p>\n<\/div>\n<h3>1.1 Kamienie milowe<\/h3>\n<p>Zapamiętaj cztery liczby:<\/p>\n<p><strong>He 2 · Ne 10 · Ar 18 · Kr 36<\/strong><\/p>\n<p>Każda z nich to koniec okresu. Z liczby Z odczytujesz okres: Z ≤ 2 — okres 1; 3–10 — okres 2; 11–18 — okres 3; 19–36 — okres 4.<\/p>\n<h3>1.2 Cztery szkielety<\/h3>\n<p>Każdy pierwiastek z zakresu (grupy 1, 2 i 13–18) ma konfigurację z jednego z czterech wzorców. Szkielet daje okres, a ostatnia liczba — elektrony walencyjne:<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Okres<\/th><th>Szkielet<\/th><th>Grupy<\/th><th>Pełne przykłady<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>K<\/td><td>1, 18<\/td><td>H: <strong>1<\/strong> · He: <strong>2<\/strong> (wyjątek: pełna powłoka K)<\/td><\/tr>\n<tr><td>2<\/td><td>2, x<\/td><td>1, 2, 13–18<\/td><td>Li 2,<strong>1<\/strong> · Be 2,<strong>2<\/strong> · B 2,<strong>3<\/strong> · C 2,<strong>4<\/strong> · N 2,<strong>5<\/strong> · O 2,<strong>6<\/strong> · F 2,<strong>7<\/strong> · Ne 2,<strong>8<\/strong><\/td><\/tr>\n<tr><td>3<\/td><td>2, 8, x<\/td><td>1, 2, 13–18<\/td><td>Na 2,8,<strong>1<\/strong> · Mg 2,8,<strong>2<\/strong> · Al 2,8,<strong>3<\/strong> · Si 2,8,<strong>4<\/strong> · P 2,8,<strong>5<\/strong> · S 2,8,<strong>6<\/strong> · Cl 2,8,<strong>7<\/strong> · Ar 2,8,<strong>8<\/strong><\/td><\/tr>\n<tr><td>4<\/td><td>2, 8, 8, x<\/td><td><strong>tylko grupy 1–2<\/strong><\/td><td>K 2,8,8,<strong>1<\/strong> · Ca 2,8,8,<strong>2<\/strong><\/td><\/tr>\n<tr><td>4<\/td><td>2, 8, 18, x<\/td><td><strong>grupy 13–18<\/strong><\/td><td>Ga 2,8,18,<strong>3<\/strong> · Ge 2,8,18,<strong>4<\/strong> · As 2,8,18,<strong>5<\/strong> · Se 2,8,18,<strong>6<\/strong> · Br 2,8,18,<strong>7<\/strong> · Kr 2,8,18,<strong>8<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Końcówka x to elektrony walencyjne, a nie numer grupy.<\/strong> Dla grup 1 i 2 x = numer grupy. Dla grup 13–18 x = numer grupy − 10:<\/p>\n<ul>\n<li>grupa 13 (Al, Ga) → x = 3,<\/li>\n<li>grupa 14 (Si, Ge) → x = 4,<\/li>\n<li>grupa 16 (S, Se) → x = 6,<\/li>\n<li>grupa 17 (Cl, Br) → x = 7,<\/li>\n<li>grupa 18 (Ar, Kr) → x = 8 (He jest wyjątkiem z 2 elektronami na jedynej powłoce).<\/li>\n<\/ul>\n<p>Pierwsza wersja tej lekcji (LKO, szkic z 2026-10-13) zapisywała „x = numer grupy\" dla całego zakresu. To błąd dla grup 13–18 i został tu poprawiony (patrz LOG ZMIAN).<\/p>\n<h3>1.3 Skąd „18\" na M — i czemu to nie łamie klasy 7<\/h3>\n<p>W klasie 7 mówiliśmy: „na powłoce M maksymalnie 8\". To było prawdziwe <strong>dla zakresu do Z = 20<\/strong>, bo wtedy M nigdy nie przekracza 8 elektronów.<\/p>\n<p>Co dzieje się dalej: po wapniu (Z = 20) elektrony nie od razu idą na powłokę N. Najpierw wypełniają się podpowłoki 3d, a te należą do powłoki M. Między Ca (Z = 20) a Ga (Z = 31) leży dziesięć metali przejściowych (Sc–Zn, Z = 21–30). Ich konfiguracje nie są w zakresie konkursu, ale to one dopełniają powłokę M z 8 do 18, zanim Ga zacznie zapełniać N. Stąd skok:<\/p>\n<p>Ca 2,8,8,2 → (Z = 21–30, poza zakresem) → Ga 2,8,<strong>18<\/strong>,3<\/p>\n<p>Dla omawianych grup reguła jest więc czysta, bez wyjątków. Wyjątki konfiguracyjne istnieją w bloku d (Cr, Cu), ale to pierwiastki grup 6 i 11: poza zakresem i poza tym suplementem.<\/p>\n<p><strong>Dlaczego 4s przed 3d?<\/strong> W szkolnej kolejności budowania konfiguracji neutralnych K i Ca obsadza się 4s przed 3d. Kolejność energetyczna zależy jednak od pierwiastka i stanu jonizacji; nie przenoś jej automatycznie na wszystkie jony. To nie „przypadek\" — zjawisko ekranowania: elektrony wewnętrzne osłaniają jądro, a orbital s ma część bliżej jądra. Przy Ga tę samą powłokę M zapełniają już dziesięć elektronów 3d, a 4s i 4p zapełniają się na zewnątrz.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — co zrobić, gdy pada pytanie „dlaczego 18?\"<\/span>\n<p>Odpowiedz w dwóch zdaniach: „Bo po wapniu zapełnia się podpowłoka 3d, która też należy do powłoki M. Powłoka N jest już obsadzona u K i Ca, bo 4s należy do N; po Ca przybywa elektronów 3d należących do M, a u Ga zaczyna się obsadzanie 4p, również należącego do N.\" Nie trzeba wchodzić w podpowłoki, żeby to było poprawne.<\/p>\n<\/div>\n<h3>1.4 Procedura 30-sekundowa<\/h3>\n<p>Dane: Z lub nazwa pierwiastka.<\/p>\n<ol>\n<li><strong>Zlokalizuj Z względem kamieni milowych<\/strong> (2 / 10 / 18 / 36) → okres.<\/li>\n<li>Jeśli okres 4: rozstrzygnij szkielet po <strong>grupie<\/strong>. Grupy 1–2 → 2,8,8,x. Grupy 13–18 → 2,8,18,x.<\/li>\n<li><strong>Ustal x:<\/strong> grupy 1–2 — numer grupy; grupy 13–18 — numer grupy minus 10.<\/li>\n<li><strong>Kontrola:<\/strong> suma elektronów = Z.<\/li>\n<\/ol>\n<p>Odwrotnie (z konfiguracji do pierwiastka): liczba powłok = okres; liczba elektronów walencyjnych = x; grupa = x (dla 1–2) albo x + 10 (dla 13–18); suma = Z.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Ćwiczenie w pamięci — dwie konfiguracje<\/span>\n<ol>\n<li>Podaj konfigurację Se (Z = 34): okres 4, grupa 16 (x = 6) → 2,8,18,6.<\/li>\n<li>Z konfiguracji 2,8,8,1 wskaż Z i grupę: 4 powłoki → okres 4; x = 1 → grupa 1 → K, Z = 19.<\/li>\n<\/ol>\n<\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"wyjatki\">\n<div class=\"part-heading\"><span class=\"part-num\">1b<\/span> Dodatek — wyjątki do Z = 36 i tabela Z = 1–36<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład — dwie kolejności, które łatwo pomylić<\/span>\n<p>W konfiguracji są dwie różne kolejności i warto je rozdzielić.<\/p>\n<p>Pierwsza to <strong>kolejność zapełniania<\/strong> (energetyczna): elektrony wchodzą najpierw na podpowłoki o najniższej energii, czyli 1s, 2s, 2p, 3s, 3p, <strong>4s<\/strong>, <strong>3d<\/strong>, 4p. Dlatego po argonie pojawia się 4s, a dopiero potem 3d.<\/p>\n<p>Druga to <strong>kolejność zapisu<\/strong> w konfiguracji: podpowłoki grupujemy według numeru powłoki, więc piszemy 1s 2s 2p 3s 3p <strong>3d<\/strong> 4s 4p. Stąd Fe: 1s² 2s² 2p⁶ 3s² 3p⁶ <strong>3d⁶ 4s²<\/strong> — to ta sama konfiguracja co [Ar] 4s² 3d⁶, zapisana w kolejności numerów powłok. Nie zmienia to zawartości elektronowej.<\/p>\n<p>Liczba powłoki (K, L, M, N) zależy od <strong>numeru n<\/strong>, a nie od kolejności zapisu. Dlatego 3d należy do powłoki M, mimo że zapełnia się po 4s, a 4s należy do N. Jeśli liczysz powłoki, sumujesz elektrony według pierwszej cyfry w symbolu: 3s, 3p, 3d → M; 4s, 4p → N.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład — wyjątki: dlaczego Cr i Cu, a nie inne<\/span>\n<p>Model „od dołu do góry\" przewiduje dla chromu [Ar] 4s² 3d⁴, a dla miedzi [Ar] 4s² 3d⁹. Tymczasem w stanie podstawowym obserwuje się [Ar] 4s¹ 3d⁵ dla Cr i [Ar] 4s¹ 3d¹⁰ dla Cu. W obu przypadkach jeden elektron z 4s przechodzi do 3d.<\/p>\n<p>Szkolne wyjaśnienie: najkorzystniej energetycznie są podpowłoki d <strong>zapełnione w połowie<\/strong> (d⁵) i <strong>całkowicie<\/strong> (d¹⁰). Dla Cr zysk z d⁵ jest większy niż koszt zmiany 4s². Dla Cu zysk z d¹⁰ przewyższa koszt. Wikipedia (data page, pobrane 2026-10-13) podaje, że różnice energii między konfiguracjami są małe i wiele konfiguracji leży w bliskim sąsiedztwie, a jako wyraźny wyjątek omawia właśnie chrom.<\/p>\n<p>Wniosek dla ucznia: w zakresie do Z = 36 <strong>wyjątkami szkolnymi są Cr i Cu<\/strong>. Pozostałe pierwiastki 3d (Sc–Zn) podlegają regule prostej, z jednym przypadkiem wymagającym uwagi — niklem.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Subtelność, nie wyjątek — nikiel (Ni, Z = 28)<\/span>\n<p>Nikiel w pobranym źródle (Wikipedia, data page) ma konfigurację <strong>[Ar] 4s² 3d⁸<\/strong>. Ta sama strona nie wymienia niklu jako wyjątku. W niektórych zapisach pojawia się konfiguracja [Ar] 4s¹ 3d⁹, bo energie 3d⁸4s² i 3d⁹4s¹ leżą bardzo blisko siebie. Ten wariant nie został potwierdzony w pobranym źródle, więc zapisuję go tylko jako uwagę.<\/p>\n<p>Praktyczna zasada dla konkursu: zapisuj <strong>4s² 3d⁸<\/strong>, chyba że treść zadania lub klucz podaje inaczej. Nikiel jest tu subtelnością — pokazuje, że reguła prosta bywa przybliżona — ale nie należy go traktować jako trzeciego obowiązkowego wyjątku.<\/p>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Tabela Z = 1–36 — rozkład na powłoki i podpowłoki<\/span>\n<p>Kolumny K, L, M, N to liczba elektronów na powłokach 1, 2, 3, 4 (zapis 1234 to te same liczby). Zapis podpowłokowy podano w skróconej formie [gaz szlachetny]. Pierwiastki grup 3–12 (Sc–Zn) są pokazane dla kontekstu wyjątków; w zakresie konkursu obowiązują grupy 1, 2 i 13–18.<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Z<\/th><th>Pierwiastek<\/th><th>K<\/th><th>L<\/th><th>M<\/th><th>N<\/th><th>Konfiguracja<\/th><th>Uwaga<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>H<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1s¹<\/td><td><\/td><\/tr>\n<tr><td>2<\/td><td>He<\/td><td>2<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1s²<\/td><td><\/td><\/tr>\n<tr><td>3<\/td><td>Li<\/td><td>2<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>1s² 2s¹<\/td><td><\/td><\/tr>\n<tr><td>4<\/td><td>Be<\/td><td>2<\/td><td>2<\/td><td>0<\/td><td>0<\/td><td>1s² 2s²<\/td><td><\/td><\/tr>\n<tr><td>5<\/td><td>B<\/td><td>2<\/td><td>3<\/td><td>0<\/td><td>0<\/td><td>1s² 2s² 2p¹<\/td><td><\/td><\/tr>\n<tr><td>6<\/td><td>C<\/td><td>2<\/td><td>4<\/td><td>0<\/td><td>0<\/td><td>1s² 2s² 2p²<\/td><td><\/td><\/tr>\n<tr><td>7<\/td><td>N<\/td><td>2<\/td><td>5<\/td><td>0<\/td><td>0<\/td><td>1s² 2s² 2p³<\/td><td><\/td><\/tr>\n<tr><td>8<\/td><td>O<\/td><td>2<\/td><td>6<\/td><td>0<\/td><td>0<\/td><td>1s² 2s² 2p⁴<\/td><td><\/td><\/tr>\n<tr><td>9<\/td><td>F<\/td><td>2<\/td><td>7<\/td><td>0<\/td><td>0<\/td><td>1s² 2s² 2p⁵<\/td><td><\/td><\/tr>\n<tr><td>10<\/td><td>Ne<\/td><td>2<\/td><td>8<\/td><td>0<\/td><td>0<\/td><td>1s² 2s² 2p⁶<\/td><td><\/td><\/tr>\n<tr><td>11<\/td><td>Na<\/td><td>2<\/td><td>8<\/td><td>1<\/td><td>0<\/td><td>[Ne] 3s¹<\/td><td><\/td><\/tr>\n<tr><td>12<\/td><td>Mg<\/td><td>2<\/td><td>8<\/td><td>2<\/td><td>0<\/td><td>[Ne] 3s²<\/td><td><\/td><\/tr>\n<tr><td>13<\/td><td>Al<\/td><td>2<\/td><td>8<\/td><td>3<\/td><td>0<\/td><td>[Ne] 3s² 3p¹<\/td><td><\/td><\/tr>\n<tr><td>14<\/td><td>Si<\/td><td>2<\/td><td>8<\/td><td>4<\/td><td>0<\/td><td>[Ne] 3s² 3p²<\/td><td><\/td><\/tr>\n<tr><td>15<\/td><td>P<\/td><td>2<\/td><td>8<\/td><td>5<\/td><td>0<\/td><td>[Ne] 3s² 3p³<\/td><td><\/td><\/tr>\n<tr><td>16<\/td><td>S<\/td><td>2<\/td><td>8<\/td><td>6<\/td><td>0<\/td><td>[Ne] 3s² 3p⁴<\/td><td><\/td><\/tr>\n<tr><td>17<\/td><td>Cl<\/td><td>2<\/td><td>8<\/td><td>7<\/td><td>0<\/td><td>[Ne] 3s² 3p⁵<\/td><td><\/td><\/tr>\n<tr><td>18<\/td><td>Ar<\/td><td>2<\/td><td>8<\/td><td>8<\/td><td>0<\/td><td>[Ne] 3s² 3p⁶<\/td><td><\/td><\/tr>\n<tr><td>19<\/td><td>K<\/td><td>2<\/td><td>8<\/td><td>8<\/td><td>1<\/td><td>[Ar] 4s¹<\/td><td><\/td><\/tr>\n<tr><td>20<\/td><td>Ca<\/td><td>2<\/td><td>8<\/td><td>8<\/td><td>2<\/td><td>[Ar] 4s²<\/td><td>M dopiero zaczyna się zapełniać 3d<\/td><\/tr>\n<tr><td>21<\/td><td>Sc<\/td><td>2<\/td><td>8<\/td><td>9<\/td><td>2<\/td><td>[Ar] 4s² 3d¹<\/td><td>grupa 3, poza zakresem<\/td><\/tr>\n<tr><td>22<\/td><td>Ti<\/td><td>2<\/td><td>8<\/td><td>10<\/td><td>2<\/td><td>[Ar] 4s² 3d²<\/td><td>poza zakresem<\/td><\/tr>\n<tr><td>23<\/td><td>V<\/td><td>2<\/td><td>8<\/td><td>11<\/td><td>2<\/td><td>[Ar] 4s² 3d³<\/td><td>poza zakresem<\/td><\/tr>\n<tr><td>24<\/td><td>Cr<\/td><td>2<\/td><td>8<\/td><td>13<\/td><td>1<\/td><td>[Ar] 4s¹ 3d⁵<\/td><td><strong>wyjątek szkolny<\/strong><\/td><\/tr>\n<tr><td>25<\/td><td>Mn<\/td><td>2<\/td><td>8<\/td><td>13<\/td><td>2<\/td><td>[Ar] 4s² 3d⁵<\/td><td>poza zakresem<\/td><\/tr>\n<tr><td>26<\/td><td>Fe<\/td><td>2<\/td><td>8<\/td><td>14<\/td><td>2<\/td><td>[Ar] 4s² 3d⁶<\/td><td>poza zakresem<\/td><\/tr>\n<tr><td>27<\/td><td>Co<\/td><td>2<\/td><td>8<\/td><td>15<\/td><td>2<\/td><td>[Ar] 4s² 3d⁷<\/td><td>poza zakresem<\/td><\/tr>\n<tr><td>28<\/td><td>Ni<\/td><td>2<\/td><td>8<\/td><td>16<\/td><td>2<\/td><td>[Ar] 4s² 3d⁸<\/td><td><strong>subtelność<\/strong> (patrz wyżej)<\/td><\/tr>\n<tr><td>29<\/td><td>Cu<\/td><td>2<\/td><td>8<\/td><td>18<\/td><td>1<\/td><td>[Ar] 4s¹ 3d¹⁰<\/td><td><strong>wyjątek szkolny<\/strong><\/td><\/tr>\n<tr><td>30<\/td><td>Zn<\/td><td>2<\/td><td>8<\/td><td>18<\/td><td>2<\/td><td>[Ar] 4s² 3d¹⁰<\/td><td>poza zakresem<\/td><\/tr>\n<tr><td>31<\/td><td>Ga<\/td><td>2<\/td><td>8<\/td><td>18<\/td><td>3<\/td><td>[Ar] 4s² 3d¹⁰ 4p¹<\/td><td>zakres (grupa 13)<\/td><\/tr>\n<tr><td>32<\/td><td>Ge<\/td><td>2<\/td><td>8<\/td><td>18<\/td><td>4<\/td><td>[Ar] 4s² 3d¹⁰ 4p²<\/td><td>zakres (grupa 14)<\/td><\/tr>\n<tr><td>33<\/td><td>As<\/td><td>2<\/td><td>8<\/td><td>18<\/td><td>5<\/td><td>[Ar] 4s² 3d¹⁰ 4p³<\/td><td>zakres (grupa 15)<\/td><\/tr>\n<tr><td>34<\/td><td>Se<\/td><td>2<\/td><td>8<\/td><td>18<\/td><td>6<\/td><td>[Ar] 4s² 3d¹⁰ 4p⁴<\/td><td>zakres (grupa 16)<\/td><\/tr>\n<tr><td>35<\/td><td>Br<\/td><td>2<\/td><td>8<\/td><td>18<\/td><td>7<\/td><td>[Ar] 4s² 3d¹⁰ 4p⁵<\/td><td>zakres (grupa 17)<\/td><\/tr>\n<tr><td>36<\/td><td>Kr<\/td><td>2<\/td><td>8<\/td><td>18<\/td><td>8<\/td><td>[Ar] 4s² 3d¹⁰ 4p⁶<\/td><td>zakres (grupa 18)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Dlaczego Cr ma M = 13?<\/strong> Powłoka M zawiera 3s², 3p⁶ i 3d⁵: 2 + 6 + 5 = 13. Podpowłoka 4s¹ należy do N, więc N = 1. Stąd rozkład 2,8,13,1.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — jak czytać wiersz tabeli<\/span>\n<p>Sprawdź sumę K + L + M + N = Z. Dla Cr: 2 + 8 + 13 + 1 = 24. Dla Cu: 2 + 8 + 18 + 1 = 29. Jeśli suma się zgadza, a konfiguracja pokazuje 4s¹ przy d⁵ lub d¹⁰, masz wyjątek szkolny.<\/p>\n<\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"wyklad2\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Wykład — jony: reguła najbliższego gazu szlachetnego<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład — dlaczego atomy tworzą jony<\/span>\n<p>Atom obojętny ma tyle elektronów, ile protonów. Gdy traci lub przyjmuje elektrony, staje się jonem. Dlaczego to robi? Najprościej: układ dąży do stanu o niższej energii, a najbardziej stabilna jest konfiguracja gazu szlachetnego — pełna zewnętrzna powłoka (oktet, a dla helu dublet). Pierwiastki, które mają w zewnętrznej powłoce mało elektronów, oddają je i stają się kationami. Pierwiastki, którym brakuje kilku elektronów do zapełnienia, przyjmują je i stają się anionami.<\/p>\n<p>W praktyce: metale grup 1, 2 i 13 oddają elektrony (kationy o ładunku równym numerowi grupy, a dla grupy 13 — 3+); niemetale grup 15, 16 i 17 przyjmują elektrony (aniony o ładunku równym 18 minus numer grupy, czyli 3−, 2−, 1−). Grupa 14 nie tworzy prostych jonów w tym zakresie: C i Si łączą się wiązaniami kowalencyjnymi. Grupa 18 nie tworzy jonów, bo jej powłoki są już pełne.<\/p>\n<\/div>\n<h3>2.1 Mechanizm<\/h3>\n<p>Atom buduje jon, by osiągnąć konfigurację <strong>najbliższego gazu szlachetnego<\/strong>: duet dla helu, oktet dla pozostałych w zakresie. Kation to atom, który oddał elektrony (liczba elektronów maleje, ładunek dodatni). Anion to atom, który przyjął elektrony (liczba elektronów rośnie, ładunek ujemny).<\/p>\n<h3>2.2 Tabela jonów zakresu<\/h3>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Grupa<\/th><th>Ładunek<\/th><th>Okres 2<\/th><th>Okres 3<\/th><th>Okres 4<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>1+<\/td><td>Li⁺ <strong>2<\/strong><\/td><td>Na⁺ <strong>2,8<\/strong><\/td><td>K⁺ <strong>2,8,8<\/strong><\/td><\/tr>\n<tr><td>2<\/td><td>2+<\/td><td>Be²⁺ <strong>2<\/strong><\/td><td>Mg²⁺ <strong>2,8<\/strong><\/td><td>Ca²⁺ <strong>2,8,8<\/strong><\/td><\/tr>\n<tr><td>13<\/td><td>3+<\/td><td>(bor nie tworzy prostego kationu w tym zakresie)<\/td><td>Al³⁺ <strong>2,8<\/strong><\/td><td>Ga³⁺ <strong>2,8,18<\/strong> ⚠<\/td><\/tr>\n<tr><td>14<\/td><td>—<\/td><td>C, Si: wiązania kowalencyjne, prostych jonów szkolnych brak<\/td><td>←<\/td><td>←<\/td><\/tr>\n<tr><td>15<\/td><td>3−<\/td><td>N³⁻ <strong>2,8<\/strong><\/td><td>P³⁻ <strong>2,8,8<\/strong><\/td><td>As³⁻ <strong>2,8,18,8<\/strong><\/td><\/tr>\n<tr><td>16<\/td><td>2−<\/td><td>O²⁻ <strong>2,8<\/strong><\/td><td>S²⁻ <strong>2,8,8<\/strong><\/td><td>Se²⁻ <strong>2,8,18,8<\/strong><\/td><\/tr>\n<tr><td>17<\/td><td>1−<\/td><td>F⁻ <strong>2,8<\/strong><\/td><td>Cl⁻ <strong>2,8,8<\/strong><\/td><td>Br⁻ <strong>2,8,18,8<\/strong><\/td><\/tr>\n<tr><td>18<\/td><td>—<\/td><td>jony nie powstają — powłoki pełne<\/td><td>←<\/td><td>←<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>⚠ Jedyny nie-gazowy jon w tabeli: Ga³⁺ (2,8,18).<\/strong> Gal ma 3 elektrony walencyjne i oddaje je wszystkie, ale nowa pełna powłoka M (18 elektronów) nie jest konfiguracją żadnego gazu szlachetnego w zakresie: Ar ma na powłoce M tylko 8 elektronów, a Kr zawiera 18 elektronów na M tylko razem z 4s i 4p na N. Zapisujemy 2,8,18 i zapamiętujemy jako jedyny wyjątek w zakresie.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — dlaczego Ga³⁺ nie „idzie do oktetu\"<\/span>\n<p>Ga³⁺ ma 28 elektronów. Konfiguracja 2,8,18 jest pełna na M, ale gaz szlachetny o 28 elektronach nie istnieje. Dlatego w zadaniach nie zapisuj „2,8\" dla Ga³⁺ ani nie szukaj do niego izoelektronowego gazu.<\/p>\n<\/div>\n<h3>2.3 Izoelektronowość — potężne skrócenie<\/h3>\n<p>Jony (i atomy) o <strong>identycznej konfiguracji<\/strong> nazywamy izoelektronowymi. Trzy rodziny do zapamiętania na pamięć:<\/p>\n<ul>\n<li>rodzina Ne (10 e⁻, „2,8\"): <strong>N³⁻, O²⁻, F⁻, Na⁺, Mg²⁺, Al³⁺<\/strong>;<\/li>\n<li>rodzina Ar (18 e⁻, „2,8,8\"): <strong>P³⁻, S²⁻, Cl⁻, K⁺, Ca²⁺<\/strong>;<\/li>\n<li>rodzina Kr (36 e⁻, „2,8,18,8\"): <strong>As³⁻, Se²⁻, Br⁻<\/strong> (i sam Kr).<\/li>\n<\/ul>\n<p>Zadanie konkursowe „jon X ma 18 elektronów, wskaż pierwiastek\" rozwiązujesz wstecz: liczba elektronów jonu = Z ∓ ładunek. Dla X⁻ z 18 elektronami: Z = 17 (Cl). Dla Y²⁻ z 18: Z = 16 (S).<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — izoelektronowość działa w obie strony<\/span>\n<p>Rodzina Ar to jednocześnie kationy (K⁺, Ca²⁺) i aniony (Cl⁻, S²⁻, P³⁻). Sama konfiguracja 2,8,8 nie mówi, czy to kation czy anion — mówi tylko, do której rodziny należy jon. Ładunek ustalasz z grupy.<\/p>\n<\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"wyklad3\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Wykład — od konfiguracji do wzoru związku<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład — wzór jako bilans elektronów<\/span>\n<p>Wzór związku jonowego to najprostszy zapis proporcji, w jakiej kationy i aniony się łączą tak, by ładunek całkowity był zero. Ładunki dodatnie muszą się zrównoważyć ujemnymi. Konfiguracja pozwala to sprawdzić elektronicznie: liczba elektronów oddanych przez kationy musi być równa liczbie elektronów przyjętych przez aniony.<\/p>\n<p>Metoda krzyżowania ładunków: ładunek kationu (liczba bez znaku) staje się indeksem anionu, a ładunek anionu staje się indeksem kationu. Potem wzór upraszcza się, jeśli indeksy mają wspólny dzielnik. Na przykład Al³⁺ i O²⁻ dają Al₂O₃, a nie AlO₃²⁻. Ta reguła działa dla związków jonowych w zakresie.<\/p>\n<\/div>\n<h3>3.1 Procedura<\/h3>\n<ol>\n<li>Zapisz konfigurację atomu każdego pierwiastka.<\/li>\n<li>Wyznacz ładunek jonu (grupa; reguła gazu szlachetnego).<\/li>\n<li>Zbuduj wzór: ładunki muszą się zbilansować (krzyżowanie ładunków, upraszczanie).<\/li>\n<li>Kontrola elektroniczna: liczba oddanych elektronów = liczba przyjętych.<\/li>\n<\/ol>\n<h3>3.2 Przykład wzorcowy: siarczek potasu<\/h3>\n<ul>\n<li>K: 2,8,8,<strong>1<\/strong> → oddaje 1 e⁻ → <strong>K⁺<\/strong> (2,8,8).<\/li>\n<li>S: 2,8,<strong>6<\/strong> → przyjmuje 2 e⁻ → <strong>S²⁻<\/strong> (2,8,8).<\/li>\n<li>Na 1 atom S przypadają 2 atomy K (2 × 1⁺ = 1 × 2⁻) → wzór <strong>K₂S<\/strong>.<\/li>\n<li>Kontrola: oddano 2 e⁻ (2 × 1), przyjęto 2 e⁻ (1 × 2). Bilans domknięty.<\/li>\n<\/ul>\n<h3>3.3 Drugi przykład: chlorek galu<\/h3>\n<ul>\n<li>Ga: 2,8,18,<strong>3<\/strong> → <strong>Ga³⁺<\/strong> (2,8,18).<\/li>\n<li>Cl: 2,8,<strong>7<\/strong> → <strong>Cl⁻<\/strong> (2,8,8).<\/li>\n<li>Bilans: 1 × Ga³⁺ potrzebuje 3 × Cl⁻ → <strong>GaCl₃<\/strong>. Równanie reakcji: 2Ga + 3Cl₂ → 2GaCl₃.<\/li>\n<\/ul>\n<h3>3.4 Typowe zadanie LKO „z brzegiem\"<\/h3>\n<p><em>Kation X⁺ ma 18 elektronów, anion Y²⁻ ma 18 elektronów. Podaj wzór i nazwę związku.<\/em><\/p>\n<ul>\n<li>X⁺: Z − 1 = 18 → Z = 19 → K → <strong>K⁺<\/strong>.<\/li>\n<li>Y²⁻: Z + 2 = 18 → Z = 16 → S → <strong>S²⁻<\/strong>.<\/li>\n<li>Wzór: <strong>K₂S<\/strong>, siarczek potasu.<\/li>\n<\/ul>\n<p>Ta sama maszyna działa w obie strony: konfiguracja → ładunek → wzór; albo jon → Z → pierwiastek.<\/p>\n<p>---<\/p>\n<\/section>\n<section id=\"kompendium\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Kompendium — ściąga-wynik<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Na jednej stronie<\/span>\n<p><strong>Kamienie milowe:<\/strong> He 2 · Ne 10 · Ar 18 · Kr 36.\n<strong>Cztery szkielety:<\/strong> [2,x] · [2,8,x] · [2,8,8,x] (tylko K, Ca) · [2,8,18,x] (Ga…Kr).\n<strong>Elektrony walencyjne:<\/strong> grupy 1–2 → numer grupy; grupy 13–18 → numer grupy − 10. Liczba powłok = numer okresu.\n<strong>Jony:<\/strong> grupa 1 → 1+, 2 → 2+, 13 → 3+, 15 → 3−, 16 → 2−, 17 → 1−; grupy 14 i 18 — bez prostych jonów.\n<strong>Rodziny izoelektronowe:<\/strong> Ne: N³⁻ / O²⁻ / F⁻ / Na⁺ / Mg²⁺ / Al³⁺ (2,8) · Ar: P³⁻ / S²⁻ / Cl⁻ / K⁺ / Ca²⁺ (2,8,8) · Kr: As³⁻ / Se²⁻ / Br⁻ (2,8,18,8).\n<strong>Jedyny wyjątek w zakresie:<\/strong> Ga³⁺ = 2,8,18 (nie jest konfiguracją gazu szlachetnego).\n<strong>Wzór z bilansu:<\/strong> ładunki się znoszą; K₂S, GaCl₃.<\/p>\n<\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"klinika\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Klinika błędów<\/div>\n<table class=\"klinika-table\"><thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><\/tr><\/thead><tbody><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„M to zawsze 8 elektronów.\"<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Po Ca powłoka M zapełnia się do 18 (blok d).<\/td><td data-label=\"Dlaczego\">Zakres do Z = 20 tylko tak wygląda; kontrola: suma = Z.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Br⁻ = 2,8,8,8.\"<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Br⁻ = 2,8,18,8.<\/td><td data-label=\"Dlaczego\">Szkielet 4. okresu grup 13–18 to 2,8,18,x.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Ga ma x = 13, bo jest w grupie 13.\"<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Ga ma x = 3 (13 − 10).<\/td><td data-label=\"Dlaczego\">Elektrony walencyjne grup 13–18 to numer grupy minus 10.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Fe to 2,8,8,8 — tak jak kryptonu.\"<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Fe = 2,8,14,2 (poza zakresem).<\/td><td data-label=\"Dlaczego\">Metale przejściowe nie pasują do czterech szkieletów; nie zgaduj ich wzorcami.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Ca²⁺ = 2,8,8,0.\"<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Ca²⁺ = 2,8,8.<\/td><td data-label=\"Dlaczego\">Powłokę bez elektronów pomijamy; trzy powłoki, jak w Ar.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„C⁴⁻ i Si⁴⁻ to proste jony szkolne.\"<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Grupa 14 nie tworzy prostych jonów w zakresie.<\/td><td data-label=\"Dlaczego\">Węgiel i krzem łączą się wiązaniami kowalencyjnymi.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Izoelektronowość: K⁺ i Cl⁻ to ten sam rodzaj jonu.\"<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Oba mają 18 e⁻ i konfigurację 2,8,8, ale K⁺ jest kationem, Cl⁻ anionem.<\/td><td data-label=\"Dlaczego\">Konfiguracja wskazuje rodzinę, nie znak ładunku.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Ga³⁺ ma oktet jak gaz szlachetny.\"<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Ga³⁺ = 2,8,18; to jedyny jon w zakresie bez konfiguracji gazu szlachetnego.<\/td><td data-label=\"Dlaczego\">Pełna powłoka M nie oznacza gazu o 28 elektronach.<\/td><\/tr><\/tbody><\/table>\n<p>---<\/p>\n<\/section>\n<section id=\"cwiczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Ćwiczenia — formy konkursu LKO (etap I)<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">A. Zamknięte — jedna odpowiedź (5 pkt)<\/span>\n<p>A1. Konfiguracja atomu bromu (Z = 35):\na) 2,8,8,17   b) 2,8,18,7   c) 2,8,15,12   d) 2,8,8,8<\/p>\n<p>A2. Liczba elektronów w kationie K⁺ wynosi:\na) 19   b) 20   c) 18   d) 8<\/p>\n<p>A3. Anion X⁻ ma 36 elektronów. X to:\na) Br   b) Se   c) Kr   d) As<\/p>\n<p>A4. Pierwiastek X ma 3 powłoki i 4 elektrony walencyjne. X to:\na) C   b) Ge   c) Si   d) Sn<\/p>\n<p>A5. Którym gazem szlachetnym jest izoelektronowy jon S²⁻?\na) Ne   b) Ar   c) Kr   d) Xe<\/p>\n<details class=\"answer\"><summary>Klucz — A<\/summary>\n<p>A1: <strong>b<\/strong> (okres 4, grupa 17 → 2,8,18,7). A2: <strong>c<\/strong> (19 − 1 = 18). A3: <strong>a<\/strong> (Z + 1 = 36 → Z = 35; Se to 2−, As to 3−, Kr nie jest anionem). A4: <strong>c<\/strong> (szkielet 2,8,x → Si; Ge ma 4 powłoki). A5: <strong>b<\/strong> (16 + 2 = 18 e⁻ = Ar).<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">B. Prawda–fałsz (7 pkt)<\/span>\n<p>B1. W atomie wapnia powłoka M ma 8 elektronów.\nB2. W atomie galu powłoka M ma 18 elektronów.\nB3. Jon Mg²⁺ ma 12 elektronów.\nB4. Atom fluoru i jon F⁻ mają tę samą liczbę powłok.\nB5. Potas i siarka mogą tworzyć jony o identycznej konfiguracji.\nB6. Powłoka K atomu wodoru jest zapełniona całkowicie.\nB7. Krypton ma 8 elektronów walencyjnych.<\/p>\n<details class=\"answer\"><summary>Klucz — B<\/summary>\n<p>B1: <strong>T<\/strong> (2,8,8,2). B2: <strong>T<\/strong> (2,8,18,3). B3: <strong>F<\/strong> (12 − 2 = 10 → 2,8). B4: <strong>T<\/strong> (obie mają 2 powłoki; F 2,7 → F⁻ 2,8). B5: <strong>T<\/strong> (K⁺ i S²⁻: oba 2,8,8). B6: <strong>F<\/strong> (1 z 2 elektronów; pełna dopiero w He). B7: <strong>T<\/strong> (2,8,18,8).<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">C. Luki (4 pkt)<\/span>\n<p>C1. Wapń: 2, 8, ___, ___.\nC2. Jon Br⁻: 2, 8, ___, ___.\nC3. Al: 2, 8, ___; Al³⁺: 2, ___.\nC4. Elektrony walencyjne w grupie 16: ___; przykładowy anion tej grupy: ___.<\/p>\n<details class=\"answer\"><summary>Klucz — C<\/summary>\n<p>C1: 8, 2. C2: 18, 8. C3: 3; 8. C4: 6; O²⁻ (lub S²⁻, Se²⁻).<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">D. Dobieranie (5 pkt)<\/span>\n<p>D1. Dobierz pierwiastek lub jon do konfiguracji — po jednej parze dla każdego wiersza:\nKr · Ca · Br (atom) · Ga³⁺ · Na⁺ oraz konfiguracje: 2,8 · 2,8,8,2 · 2,8,18,7 · 2,8,18 · 2,8,18,8<\/p>\n<details class=\"answer\"><summary>Klucz — D<\/summary>\n<p>Kr → 2,8,18,8 · Ca → 2,8,8,2 · Br (atom) → 2,8,18,7 · Ga³⁺ → 2,8,18 · Na⁺ → 2,8.\nUwaga: w pierwszej wersji tego zadania stało „Br⁻\" zamiast „Br (atom)\" — Br⁻ ma 2,8,18,8, więc pasowałby też do Kr i zadanie miałoby dwie poprawne odpowiedzi. Poprawiono.<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">E. Otwarte krótkie (6 pkt)<\/span>\n<p>E1. Podaj konfigurację atomu arsenu (Z = 33) oraz jonu As³⁻.\nE2. Obojętny atom X należy do 3. okresu i ma konfigurację walencyjną 3s²3p⁶. Podaj nazwę i Z.\nE3. Kation jednowartościowy X⁺ ma konfigurację 2,8,8. Podaj Z i nazwę pierwiastka oraz konfigurację jego atomu.\nE4. Anion dwuujemny Y²⁻ ma 18 elektronów. Podaj Z, symbol jonu i jego nazwę.\nE5. Ułóż wzór związku utworzonego przez jony z E3 i E4 oraz podaj jego nazwę.\nE6. Wykorzystując konfigurację neonu, wyjaśnij, dlaczego neon nie tworzy jonów.<\/p>\n<details class=\"answer\"><summary>Klucz — E<\/summary>\n<p>E1: As 2,8,18,5; As³⁻ 2,8,18,8 (izoelektronowy z Kr). E2: Z = 18, argon, 2,8,8 (oktet walencyjny 3s²3p⁶ — nie maksymalne obsadzenie całej M, która ma pojemność 18). E3: Z = 19, potas; atom 2,8,8,1. E4: Z = 16, jon S²⁻, anion siarczkowy (siarczek). E5: K₂S, siarczek potasu. E6: Ne ma 2,8 — powłoki pełne. Oddanie lub przyjęcie elektronu nie daje stabilniejszej konfiguracji, bo neon już spełnia regułę oktetu (2s² 2p⁶).<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">F. Otwarte rozszerzone (3 pkt)<\/span>\n<p>F1. Atomy potasu (Z = 19) i siarki (Z = 16) utworzyły związek. Zapisz konfiguracje obu atomów, wyznacz jony, wykaż elektronicznie, że wzór to K₂S, i sprawdź bilans elektronów.\nF2. Gal (Z = 31) spalono w chlorze. Zapisz konfiguracje Ga, Cl oraz powstających jonów, ułóż wzór chlorku galu i zapisz równanie reakcji.\nF3. Rozstrzygnij i uzasadnij: „Ga³⁺ ma konfigurację gazu szlachetnego\" — prawda czy fałsz? Podaj jego konfigurację i porównaj z Ar oraz Kr.<\/p>\n<details class=\"answer\"><summary>Klucz — F<\/summary>\n<p>F1: K 2,8,8,1 → K⁺ 2,8,8 (oddaje 1 e⁻); S 2,8,6 → S²⁻ 2,8,8 (przyjmuje 2 e⁻); dwa K oddają razem 2 e⁻, jeden S przyjmuje 2 e⁻ → K₂S. Bilans: 2 oddane = 2 przyjęte.\nF2: Ga 2,8,18,3 → Ga³⁺ 2,8,18; Cl 2,8,7 → Cl⁻ 2,8,8; wzór GaCl₃; 2Ga + 3Cl₂ → 2GaCl₃.\nF3 (zadanie transferowe): <strong>fałsz.<\/strong> Ga³⁺ ma 2,8,18 (28 e⁻). Ar ma 18 e⁻ (2,8,8), Kr ma 36 e⁻ (2,8,18,8) — żadna z tych konfiguracji nie odpowiada 2,8,18. Ga³⁺ ma pełną powłokę M, ale to nie konfiguracja gazu szlachetnego. Na poziomie szkolnym wystarcza stwierdzenie, że pełna M nie oznacza gazu szlachetnego w zakresie.<\/p>\n<\/details>\n<\/div>\n<details class=\"adv\"><summary>G. Ambitne — Fe²⁺ i Mn²⁺ (4 pkt) <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Podaj konfigurację elektronową jonów Fe²⁺ (Z = 26) i Mn²⁺ (Z = 25) jako wolnych jonów. Ile elektronów niesparowanych ma każdy z nich (reguła Hunda)? Który jon ma więcej?<\/p>\n<\/div><\/details>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>Fe²⁺: 24 elektrony, konfiguracja [Ar]3d⁶ (1 pkt). Mn²⁺: 23 elektrony, konfiguracja [Ar]3d⁵ (1 pkt). Liczba niesparowanych: Fe²⁺ — 4, Mn²⁺ — 5 (1 pkt). Więcej niesparowanych elektronów ma Mn²⁺ (1 pkt). Kontrola: 18 + 6 = 24 i 18 + 5 = 23 ✔.<\/p>\n<\/details>\n<details class=\"adv\"><summary>H. Ambitne — pierwiastek z konfiguracji (4 pkt) <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Pierwiastek X ma konfigurację elektronową [Ar]3d¹⁰4s²4p³. Ustal Z, symbol, okres i grupę oraz wzór jego tlenku, w którym X ma najwyższy stopień utlenienia.<\/p>\n<\/div><\/details>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>Z = 18 + 10 + 2 + 3 = 33 — arsen, As (1 pkt). Okres 4 (najwyższa powłoka 4), grupa: 3 + 2 = 5 elektronów walencyjnych → grupa 15 (1 pkt). Najwyższy stopień utlenienia As = V (równy liczbie elektronów walencyjnych) — tlenek As₂O₅ (1 pkt). Kontrola: 2·V = 10 = 5·II ✔ (1 pkt).<\/p>\n<\/details>\n<p>---<\/p>\n<\/section>\n<section id=\"mity\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Mity<\/div>\n<mity>\n<p>„Konfiguracja Cl⁻ to 2,8,7 — jon ma tyle samo elektronów walencyjnych co atom.\" || Anion przyjmuje elektron: Cl⁻ ma 2,8,8, czyli 18 elektronów.\n„Ga³⁺ jest izoelektronowy z argonem, bo oba mają pełne powłoki.\" || Ar ma 18 elektronów, Ga³⁺ ma 28. Izoelektronowość wymaga tej samej liczby elektronów, nie tylko „pełności\".\n„Liczba elektronów walencyjnych zawsze równa się numerowi grupy.\" || Tylko dla grup 1 i 2. Dla grup 13–18 odejmujemy 10.\n„Do Z = 36 wyjątków jest dużo, trzeba znać wszystkie.” || Szkolne wyjątki to Cr i Cu. Nikiel to subtelność (4s²3d⁸ w zapisie szkolnym), a reszta 3d leży w regule prostej.<\/p>\n<\/mity>\n<p>---<\/p>\n<\/section>\n<section id=\"mini\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Mini-wykład: po co to wszystko<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — konfiguracja jest adresem elektronów<\/span>\n<p>Gdy znasz konfigurację, znasz powłokę walencyjną, a z niej wynika grupa i okres (F08), tworzenie jonów (F09) i wiązań (F10–F11). Konfiguracja to most między budową atomu a resztą chemii, a na konkursie to najczęstszy punkt wyjścia zadań.<\/p>\n<\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"dosw\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Doświadczenie modelowe — dlaczego jony wyglądają jak gazy<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Doświadczenie modelowe (bez odczynników)<\/span>\n<p><strong>Cel:<\/strong> sprawdzić, że jon i gaz mają tę samą konfigurację, gdy mają tyle samo elektronów.\n<strong>Sprzęt:<\/strong> karta z tabelą Z, przyrząd do zliczania (liczenie na kartce).\n<strong>Przebieg:<\/strong> zapisz konfigurację Cl⁻, a potem Ar. Porównaj liczby na każdej powłoce.\n<strong>Obserwacja:<\/strong> 2,8,8 i 2,8,8 — identyczne.\n<strong>Wniosek:<\/strong> jon Cl⁻ naśladuje konfigurację argonu, bo ma tyle samo elektronów (18) i tę samą liczbę na każdej powłoce.<\/p>\n<\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"granice\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Granice uproszczenia (dla nauczyciela i ucznia)<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Czego świadomie nie robimy<\/span>\n<p>Model powłokowy jest <strong>modelem<\/strong>, nie dokładnym obrazem atomu (por. F01: model ≠ rzeczywistość). Nie wprowadzamy tu podpowłok s, p, d w pełnym zapisie orbitalnym, wyjątków Cr i Cu, jonów wieloatomowych ani potencjałów jonizacyjnych. Jeśli uczeń zapyta „skąd 18\", odpowiedź z 1.3 jest w pełni poprawna w ramach zakresu konkursu. Pełny obraz (podpowłoki i reguła Hunda w zapisie orbitali) pojawi się na LO.<\/p>\n<\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"test\">\n<div class=\"part-heading\"><span class=\"part-num\">10a<\/span> Test — sprawdź się<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Br ma 35 elektronów; jon z ładunkiem 1− ma o jeden więcej: 36.\"><h5>1. Ile elektronów ma jon Br⁻ (Z = 35)?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">34<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">35<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">36<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">37<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Okres 4, grupa 15 → x = 15 − 10 = 5; szkielet 2,8,18,x.\"><h5>2. Konfiguracja atomu arsenu (Z = 33) to:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">2,8,18,3<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">2,8,8,5<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">2,8,18,5<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">2,8,18,8<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Mg²⁺ ma 10 elektronów (konfiguracja neonu); K⁺, S²⁻ i Cl⁻ mają po 18.\"><h5>3. Który jon NIE jest izoelektronowy z argonem?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">Mg²⁺<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">K⁺<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">S²⁻<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">Cl⁻<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Ga ma Z = 31; po oddaniu trzech elektronów zostaje 28 (2,8,18).\"><h5>4. Ile elektronów ma jon Ga³⁺?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">31<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">18<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">28<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">25<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"K⁺ i S²⁻: bilans 2 × (1+) = 1 × (2−) daje K₂S.\"><h5>5. Jaki wzór ma związek potasu z siarką?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">KS<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">KS₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">K₂S<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">K₃S<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section id=\"fiszki\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Fiszki<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Pojemność, obsadzenie, oktet — trzy różne pojęcia<\/span>\n<ul>\n<li>pojemność — ile elektronów maksymalnie może pomieścić powłoka;<\/li>\n<li>obsadzenie — ile elektronów rzeczywiście znajduje się na niej w danym atomie lub jonie;<\/li>\n<li>oktet — osiem elektronów w konfiguracji walencyjnej typu ns²np⁶.\nDla Ar powłoka M ma 8 elektronów, choć jej pojemność wynosi 18. Nie ma tu sprzeczności.\nJon Cl⁻ naśladuje konfigurację argonu, bo ma tyle samo elektronów (18) i tę samą liczbę na każdej powłoce. Ga³⁺ nie jest izoelektronowy z argonem tylko dlatego, że ma pełną powłokę M — izoelektronowość wymaga tej samej liczby elektronów.\nZadania z Fe²⁺ i Mn²⁺ dotyczą wolnych jonów, zgodnie z regułą Hunda, a nie dowolnych kompleksów metali.<\/li>\n<\/ul>\n<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Ile elektronów ma powłoka M w tym zakresie?<\/span><span class=\"back\">18 (po dopełnieniu bloku d)<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Cztery gazy szlachetne kamieni milowych do Z = 36?<\/span><span class=\"back\">He 2 · Ne 10 · Ar 18 · Kr 36<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jaka konfiguracja szkieletu obowiązuje grupy 13–18 w 4. okresie?<\/span><span class=\"back\">2,8,18,x<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Ile elektronów walencyjnych ma atom z grupy 16?<\/span><span class=\"back\">6<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Ile elektronów walencyjnych ma atom z grupy 13?<\/span><span class=\"back\">3 (numer grupy − 10)<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Konfiguracja Ga?<\/span><span class=\"back\">2,8,18,3 · pełna: [Ar] 3d¹⁰ 4s² 4p¹<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Konfiguracja Br⁻?<\/span><span class=\"back\">2,8,18,8 (= Kr)<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jon Ca²⁺ — ile elektronów i jaka konfiguracja?<\/span><span class=\"back\">18 e⁻ · 2,8,8<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Ładunek jonu z grupy 15?<\/span><span class=\"back\">3− (przyjmuje trzy elektrony do oktetu)<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Dlaczego grupa 14 nie tworzy prostych jonów w zakresie?<\/span><span class=\"back\">C i Si łączą się wiązaniami kowalencyjnymi<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wzór związku z Al³⁺ i O²⁻?<\/span><span class=\"back\">Al₂O₃<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Rodzina izoelektronowa Ne (10 e⁻)?<\/span><span class=\"back\">N³⁻, O²⁻, F⁻, Na⁺, Mg²⁺, Al³⁺<\/span><span class=\"card-tag tag-extra\">olimpijskie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jedyny jon w zakresie bez konfiguracji gazu szlachetnego?<\/span><span class=\"back\">Ga³⁺ = 2,8,18<\/span><span class=\"card-tag tag-extra\">olimpijskie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Dlaczego po K i Ca elektrony wchodzą na 4s, a potem na 3d?<\/span><span class=\"back\">4s ma niższą energię niż 3d (ekranowanie)<\/span><span class=\"card-tag tag-extra\">olimpijskie<\/span><\/button><\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"slownik\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Słownik<\/div>\n<dl><div class=\"def-item\"><dt>Konfiguracja powłokowa<\/dt><dd>rozmieszczenie elektronów na powłokach K, L, M, N; w zakresie LKO do Z = 36<\/dd><\/div><div class=\"def-item\"><dt>Szkielet konfiguracji<\/dt><dd>zapis liczb na powłokach z x na ostatnim miejscu; cztery szkielety dla grup 1, 2, 13–18<\/dd><\/div><div class=\"def-item\"><dt>Elektrony walencyjne<\/dt><dd>elektrony na zewnętrznej powłoce; grupy 1–2 — numer grupy, grupy 13–18 — numer grupy − 10<\/dd><\/div><div class=\"def-item\"><dt>Kation<\/dt><dd>jon dodatni powstały przez oddanie elektronów<\/dd><\/div><div class=\"def-item\"><dt>Anion<\/dt><dd>jon ujemny powstały przez przyjęcie elektronów<\/dd><\/div><div class=\"def-item\"><dt>Jon jednoatomowy<\/dt><dd>jon zbudowany z jednego pierwiastka (np. Cl⁻, Ga³⁺)<\/dd><\/div><div class=\"def-item\"><dt>Izoelektronowość<\/dt><dd>zjawisko, w którym jony lub atomy mają tyle samo elektronów i tę samą konfigurację<\/dd><\/div><div class=\"def-item\"><dt>Gaz szlachetny<\/dt><dd>pierwiastek 18. grupy z pełną zewnętrzną powłoką; wzorzec dla jonów<\/dd><\/div><div class=\"def-item\"><dt>Zapis skrócony<\/dt><dd>konfiguracja z gazem szlachetnym w nawiasie kwadratowym<\/dd><\/div><div class=\"def-item\"><dt>Model powłokowy<\/dt><dd>uproszczony opis atomu z elektronami na powłokach; przybliżenie, nie dokładny obraz<\/dd><\/div><div class=\"def-item\"><dt>Wyjątek konfiguracyjny<\/dt><dd>odstępstwo od prostego zapisu według kolejności energetycznej; w zakresie do Z = 36 — Cr i Cu<\/dd><\/div><div class=\"def-item\"><dt>Subtelność konfiguracyjna<\/dt><dd>dwie konfiguracje o bardzo zbliżonej energii (Ni: 4s²3d⁸ w zapisie szkolnym); nie jest wyjątkiem szkolnym<\/dd><\/div><\/dl>\n<p>---<\/p>\n<\/section>\n<section id=\"mapa\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Mapa pojęć<\/div>\n<drzewo>\n<p>KONFIGURACJA DO Z = 36\nZAKRES: grupy 1, 2, 13–18 · Z ≤ 36\nKAMIENIE MILOWE: He 2 · Ne 10 · Ar 18 · Kr 36\nSZKIELETY: [2,x] · [2,8,x] · [2,8,8,x] · [2,8,18,x]\nx = numer grupy (1–2) lub numer grupy − 10 (13–18)\nJONY\ngrupa 1 → 1+ · 2 → 2+ · 13 → 3+ · 15 → 3− · 16 → 2− · 17 → 1−\nIZOELEKTRONOWOŚĆ: Ne · Ar · Kr\nWYJĄTEK: Ga³⁺ = 2,8,18\nWZÓR ZWIĄZKU\nbilans elektronów · krzyżowanie ładunków · K₂S · GaCl₃<\/p>\n<\/drzewo>\n<p>---<\/p>\n<\/section>\n<section id=\"checklista\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Checklista — umiem…<\/div>\n<checklista>\n<ul>\n<li>[ ] podać konfigurację powłokową pierwiastka grup 1, 2, 13–18 o Z ≤ 36 ze szkieletu;<\/li>\n<li>[ ] obliczyć x (grupy 1–2: numer grupy; grupy 13–18: numer grupy − 10);<\/li>\n<li>[ ] wskazać ładunek jonu z grupy i zapisać konfigurację jonu;<\/li>\n<li>[ ] rozpoznać rodzinę izoelektronową (Ne, Ar, Kr);<\/li>\n<li>[ ] wyjaśnić, dlaczego Ga³⁺ nie jest konfiguracją gazu szlachetnego;<\/li>\n<li>[ ] zbilansować ładunki i ułożyć wzór (K₂S, GaCl₃);<\/li>\n<li>[ ] podać granice modelu powłokowego.<\/li>\n<\/ul>\n<\/checklista>\n<p>---<\/p>\n<\/section>\n<section id=\"mosty\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> Mosty do innych lekcji<\/div>\n<ul>\n<li><strong>F07 (konfiguracja)<\/strong> — ta lekcja rozszerza zakres do Z = 36 i wprowadza cztery szkielety.<\/li>\n<li><strong>F08 (układ okresowy)<\/strong> — szkielet daje okres, x daje grupę; tu ta zależność zostaje użyta w praktyce.<\/li>\n<li><strong>F09 (jony)<\/strong> — rozszerzenie tabeli jonów o grupy 13–17 i o jon Ga³⁺.<\/li>\n<li><strong>F12 (wzory chemiczne)<\/strong> — wzór z bilansu elektronów (3.2–3.4) to ten sam mechanizm, który w F12 stosuje się do wartościowości.<\/li>\n<li><strong>F11 (wiązania)<\/strong> — grupa 14 i wiązania kowalencyjne (klinika, mity).<\/li>\n<li><strong>P03 (LO, podpowłoki)<\/strong> — pełny opis podpowłok, reguła Hunda w zapisie orbitali, skąd bierze się liczba 18.<\/li>\n<\/ul>\n<p>---<\/p>\n<\/section>\n<section id=\"ciekawostki\">\n<div class=\"part-heading\"><span class=\"part-num\">16<\/span> Ciekawostki<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Gal topi się w dłoni (orientacyjnie)<\/span>\n<p>Gal ma niską temperaturę topnienia (ok. 30 °C — wartość orientacyjna, do sprawdzenia w tablicach). Dlatego w zadaniach z galem ważne jest zapamiętanie konfiguracji, a nie wyglądu metalu — z samej konfiguracji nie widać temperatury topnienia.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Dlaczego chrom i miedź „psują” regułę<\/span>\n<p>Szczegóły i tabela Z = 1–36 są w sekcji 1b. Tu jedna myśl: model szkolny jest przybliżeniem, a dwa wyjątki w zakresie wynikają z tego, że d⁵ i d¹⁰ są energetycznie korzystne. Źródło: Wikipedia, „Electron configurations of the elements (data page)” (pobrane 2026-10-13).<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Dlaczego grupa 14 nie tworzy jonów<\/span>\n<p>Węgiel i krzem mają po cztery elektrony walencyjne. Oddanie czterech kosztowałoby zbyt wiele energii, a przyjęcie czterech — też. Dlatego tworzą wiązania kowalencyjne (wspólne pary elektronów). To jeden z powodów, dla których grupa 14 jest w tabelach jonów pusta.<\/p>\n<\/div>\n<p>---<\/p>\n<\/section>\n<section id=\"zrodla\">\n<div class=\"part-heading\"><span class=\"part-num\">17<\/span> Zadanie transferowe i źródła<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Źródła<\/span>\n<ol>\n<li><strong>Oficjalny zakres konkursu LKO 2026/27<\/strong> (lokalny plik <code>olimpiada/plany/LKO_2026_27/chemia_zakres_2026_2027.md<\/code>, sekcja 8.2, etap I, rozszerzenie 1 i 3): „konfiguracje elektronowe atomów pierwiastków grupy 1, 2 oraz 13–18 do Z = 36 i ich jonów o podanym ładunku\" oraz „ustalanie … wzorów związków chemicznych\".<\/li>\n<li><strong>Wikipedia (EN), „Electron configurations of the elements (data page)\"<\/strong> — pobrana strona. Potwierdzone konfiguracje: Ca [Ar] 4s²; Ga [Ar] 3d¹⁰ 4s² 4p¹; As [Ar] 3d¹⁰ 4s² 4p³; Se [Ar] 3d¹⁰ 4s² 4p⁴; Br [Ar] 3d¹⁰ 4s² 4p⁵; Kr [Ar] 3d¹⁰ 4s² 4p⁶; K [Ar] 4s¹; S [Ne] 3s² 3p⁴; Cl [Ne] 3s² 3p⁵; Al [Ne] 3s² 3p¹; Fe [Ar] 3d⁶ 4s²; Cu [Ar] 3d¹⁰ 4s¹; Cr [Ar] 3d⁵ 4s¹. Strona podaje konfiguracje atomów obojętnych w stanie podstawowym; nie podaje konfiguracji jonów ani reguły 4s przed 3d wprost.<\/li>\n<li><strong>Wikipedia (EN), „Electron configurations of the elements\"<\/strong> — wynik wyszukiwania, <strong>nie pobrano<\/strong> (pełny tekst nieprzejrzany).<\/li>\n<li><strong>Wikipedia (EN), data page — ponowne pobranie 2026-10-13<\/strong> dla Sc–Zn: Sc [Ar] 3d¹ 4s²; Ti 3d² 4s²; V 3d³ 4s²; Cr 3d⁵ 4s¹; Mn 3d⁵ 4s²; Fe 3d⁶ 4s²; Co 3d⁷ 4s²; Ni 3d⁸ 4s²; Cu 3d¹⁰ 4s¹; Zn 3d¹⁰ 4s².<\/li>\n<li><strong>Odpowiedź zewnętrzna (AI, sekcja 1b)<\/strong> — zestawienie wyjątków i tabela Z = 1–36 zgodne z danymi z pkt 4; cytowane materiały ZPE i portale szkolne (np. zpe.gov.pl) to <strong>wynik wyszukiwania, nie pobrano<\/strong>.<\/li>\n<\/ol>\n<p>Ogólna wiedza o jonach i izoelektronowości (sekcje 2 i 2.3) pochodzi z przyjętego w szkole modelu oktetu; nie została potwierdzona osobnym źródłem w tej sesji.<\/p>\n<\/div>\n<p><strong>Zadanie transferowe:<\/strong> patrz F3 w sekcji 6 (Ga³⁺ — prawda czy fałsz z uzasadnieniem).<\/p>\n<p>---<\/p>\n<log>\n<summary>LOG ZMIAN — 2026-10-13<\/summary>\n<p><strong>Źródło:<\/strong> odpowiedź zapisana w <code>olimpiada/plany/LKO_2026_27/CHE_suplement_Z36_odpowiedz_ORYG.md<\/code> (surowa, bez zmian). Ta lekcja jest jej przebudową do formatu repo.<\/p>\n<p><strong>Zachowano (wszystkie tematy z odpowiedzi):<\/strong> lustro i most; kamienie milowe; cztery szkielety; skąd 18; procedura 30-sekundowa; mechanizm jonów; tabela jonów; izoelektronowość (3 rodziny); wzór z konfiguracji (procedura, K₂S, GaCl₃, typowe zadanie LKO); kompendium; klinika (7 pozycji); ćwiczenia A–F (26 zadań z kluczem); granice uproszczenia; mity; mini-wykład; fiszki; słownik; mapa pojęć; checklista; źródła.<\/p>\n<p><strong>Dodano (wymagane przez zasady lekcji):<\/strong> front matter (kod, uid, opis, wymaga); lead i cele; pojęcia i oznaczenia; przypomnienie z F07/F08; minimum; test (pytania <code>?<\/code>, sekcja 18); doświadczenie modelowe; ciekawostki sprawdzone; źródła z pobraną stroną; mosty; mapa pojęć.<\/p>\n<p><strong>Poprawiono błędy z odpowiedzi:<\/strong>\n1. Elektrony walencyjne: „x = numer grupy\" dla całego zakresu → dla grup 13–18 x = numer grupy − 10 (w wykładzie 1.2, procedurze 1.4, kompendium, minimum, mapie pojęć, klinice).\n2. Zadanie D1: „Br⁻ → 2,8,18,7\" (dwie poprawne odpowiedzi) → „Br (atom) → 2,8,18,7\".\n3. Data stanu: „W1 — 2026-10-22\" (przyszłość, sugerowany audyt) → „szkic — 2026-10-13\". W1 nie był wykonany.\n4. Zapis „Ca²⁺ 2,8,8,0\" i niezrozumiałe zdanie o Ga³⁺ w wykładzie 2.2 — przeredagowane.<\/p>\n<p><strong>Liczby:<\/strong> sekcje <code>##<\/code> ~17; fiszki 13; zadania (karty exam) 26 w 6 zestawach (A–F), ponad 3–8 orientacyjne — zostawiono, bo użytkownik wymaga pełnego zakresu; do decyzji (podział na dwie karty albo osobny plik zadań). Test: 5 pytań. Słownik w lekcji: 10 haseł.<\/p>\n<p><strong>Do weryfikacji:<\/strong> temperatura topnienia galu (orientacyjnie, nie pobrana strona); wyjaśnienie wyjątków Cr i Cu w ciekawostce (zgodne z danymi strony, reszta z ogólnej wiedzy); słownik osobny lekcji i wpis w SLOWNIK_CHE.md — w kolejnym kroku.<\/p>\n<p><strong>Aktualizacja 2026-10-13 (wyjątki i nikiel):<\/strong> dodano sekcję 1b (dwie kolejności, wykład o Cr i Cu, nikiel jako subtelność, tabela Z = 1–36 z KLMN, 1234 i konfiguracją). Ciekawostkę o Cr/Cu skrócono do odsyłacza, bez powielania. Dodano hasła słownika (wyjątek, subtelność), mit i dwa źródła. Konfiguracje Sc–Zn sprawdzone pobraną stroną; nikiel 4s¹3d⁹ nie potwierdzony w źródle, zapisany jako uwaga.<\/p>\n<p><strong>Nieprzyjęte z odpowiedzi:<\/strong> nic — wszystkie tematy zachowano. Propozycja „gen_f00: wiersz LKO-Z36 w sekcji Uzupełnienia\" i „POWIAZANIA_CHE: F07 → LKO-Z36 (EXPAND), LKO-Z36 → F09/F12 (APPLY)\" zapisana jako zadania poza tą lekcją.<\/p>\n<\/log>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1/W2 — zewnętrzny, blok status LKO (2026-10-14)<\/div>\n<p>Nieprzyjęte: konfiguracje Br, Ga, S²⁻/Ar, K₂S i GaCl₃ są w lekcji i poprawne; ostrzeżenie przed regułą „powłoka M — 8 elektronów” jest w lekcji (pkt 4); metale przejściowe Fe i Mn są już w zadaniu „G. Ambitne” oznaczonym poziomem ambitnym, a nie w rdzeniu.<\/p>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA LKO-Z36 · szkic 2026-10-13 · suplement do sesji 2 Sprintu A<\/strong><\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n"</script>
