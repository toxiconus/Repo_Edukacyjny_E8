(function (g) {\n  var reg = {};\n  /* JEDEN zegar animacji dla wszystkich klocków: jedna pętla rAF, funkcje fn(now, dt); pętla stoi, gdy nikt nie gra. */\n  var zegar = (function () {\n    var fns = [], id = 0, ost = 0;\n    function petla(now) {\n      var dt = Math.min(0.05, (now - ost) / 1000); ost = now;\n      fns.slice().forEach(function (f) { try { f(now, dt); } catch (e) { } });\n      id = fns.length ? requestAnimationFrame(petla) : 0;\n    }\n    return {\n      dodaj: function (f) { if (fns.indexOf(f) < 0) fns.push(f); if (!id) { ost = performance.now(); id = requestAnimationFrame(petla); } },\n      usun: function (f) { var i = fns.indexOf(f); if (i >= 0) fns.splice(i, 1); },\n      liczba: function () { return fns.length; }\n    };\n  })();\n  var RM_ = !!(g.matchMedia && g.matchMedia('(prefers-reduced-motion: reduce)').matches);   // użytkownik prosi o brak animacji: bez autostartu\n  function def(nazwa, k) { reg[nazwa] = k; }\n  function montuj(host, nazwa, opc) {\n    var k = reg[nazwa];\n    if (!k) { host.textContent = 'Brak klocka: ' + nazwa; return null; }\n    opc = Object.assign({}, k.domyslne || {}, opc || {});\n    if (k.html) { host.innerHTML = ''; k.html(host, opc); return null; }\n    var c = document.createElement('canvas');\n    c.width = opc.szer || 480; c.height = opc.wys || 300;\n    c.style.width = '100%'; c.style.maxWidth = c.width + 'px'; c.style.height = 'auto';\n    c.setAttribute('role', 'img');\n    c.setAttribute('aria-label', (opc.opis || k.opis || nazwa));\n    host.innerHTML = ''; host.appendChild(c);\n    var stan = Object.assign({}, k.stan0 ? k.stan0(opc) : {}, {opc: opc});\n    var ctx = c.getContext('2d'), t0 = performance.now(), grane = false;   // start() dodaje klocek do wspólnego zegara (IO albo od razu)\n    function klatka(now) {\n      try { k.rysuj(ctx, c.width, c.height, stan, (now - t0) / 1000, opc); } catch (e) { }\n    }\n    function start() { if (!grane) { grane = true; t0 = performance.now() - (stan._t || 0) * 1000; zegar.dodaj(klatka); } }\n    function stop() { if (grane) { stan._t = (performance.now() - t0) / 1000; } grane = false; zegar.usun(klatka); }\n    c.addEventListener('click', function () { grane ? stop() : start(); });\n    if ('IntersectionObserver' in g && !RM_) {\n      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { e.isIntersecting ? start() : stop(); }); });\n      io.observe(c);\n    } else if (!RM_) { start(); }\n    k.rysuj(ctx, c.width, c.height, stan, 0, opc);\n    return {stop: stop, start: start, stan: stan, canvas: c};\n  }\n  g.KLOCKI = {def: def, montuj: montuj, zegar: zegar, nazwy: function () { return Object.keys(reg); }};\n})(window);\n\n/* KLOCKI — wspólne narzędzia (kolejność: pierwsze w manifeście). Wyciągnięte z animacji P01. */\n/* ---------------------------- narzędzia ---------------------------- */\nvar RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);\nfunction el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }\nfunction clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }\nfunction sm(v) { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }\nfunction cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }\nfunction hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }\nfunction rgba(h, a) { var c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }\nfunction mixHex(a, b, k) {\n  var A = hex2rgb(a), B = hex2rgb(b);\n  return '#' + [0, 1, 2].map(function (i) { return ('0' + Math.round(A[i] + (B[i] - A[i]) * k).toString(16)).slice(-2); }).join('');\n}\nfunction rr(x, a, b, w, h, r) {\n  x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);\n  x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();\n}\n\n\n/* ---------------------------- pętla animacji ---------------------------- */\n// jeden zegar: KLOCKI.zegar (klocki.js); uchwyt h ma metodę krok(dt)\nfunction wlacz(h) { if (!h._z) h._z = function (now, dt) { h.krok(dt); }; KLOCKI.zegar.dodaj(h._z); }\nfunction wylacz(h) { if (h._z) KLOCKI.zegar.usun(h._z); }\nfunction podepnij(canvas, h) {\n  h.rysuj();\n  if ('IntersectionObserver' in window && !RM) {\n    new IntersectionObserver(function (es) { es.forEach(function (e) { e.isIntersecting ? wlacz(h) : wylacz(h); }); }, {threshold: .05}).observe(canvas);\n  } else if (!RM) wlacz(h);\n}\n\n\nfunction parsujListe(txt, dozwolone, domyslne) {\n  var l = String(txt || '').split(',').map(function (s) { return s.trim(); }).filter(function (s) { return dozwolone[s]; });\n  return (l.length ? l : domyslne).slice(0, 3);\n}\n\n\n/* Wybór pierwiastka: tylko symbole, a znacznik ▸ pokazuje, że lista się rozwija (bez pełnych nazw obok). */\nfunction wyborSymbole(grupy, start, onChange, etykieta) {\n  var box = el('details', 'wyb-sym'), sum = el('summary', null), cur = el('span', 'wyb-cur', start);\n  sum.appendChild(cur); sum.appendChild(el('span', 'wyb-tri', '▸')); box.appendChild(sum);\n  var lst = el('div', 'wyb-lista'), btns = [];\n  lst.setAttribute('role', 'listbox'); lst.setAttribute('aria-label', etykieta || 'Wybór pierwiastka');\n  var NAG = {1: 'Litowce', 2: 'Berylowce', 3: 'Tlenki berylowców'};\n  Object.keys(grupy).forEach(function (g) {\n    var w = el('div', 'wyb-grupa'); w.appendChild(el('span', 'wyb-g', NAG[g] || ('grupa ' + g)));\n    grupy[g].forEach(function (s) {\n      var b = el('button', 'wyb-sy', s); b.type = 'button'; b.setAttribute('data-sym', s);\n      b.setAttribute('title', cap(NAZ[SYM.indexOf(s)] || s));\n      b.addEventListener('click', function () { ustaw(s); box.open = false; onChange(s); });\n      w.appendChild(b); btns.push(b);\n    });\n    lst.appendChild(w);\n  });\n  box.appendChild(lst);\n  function ustaw(s) { cur.textContent = s; btns.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-sym') === s ? 'true' : 'false'); }); }\n  ustaw(start);\n  return {el: box, ustaw: ustaw};\n}\n\n/* NACZYNIA — wspólna geometria i wygląd szkła dla klocków (jedna probówka dla probowki, probowki-odczyn i kolejnych).\n   Zgodna z gfx/chemia/naczynia/testTube.js: proste ścianki, półokrągłe dno, szerokość do 70 px (tu dowolna).\n   KLOCKI.naczynia.probowkaPath(x, cx, top, dnoY, tw) — ścieżka korpusu (otwarta u góry); dnoY = środek łuku dna.\n   KLOCKI.naczynia.szklo(x, cx, top, dnoY, tw)         — obrys, połysk i brzeg (rysować po cieczy). */\n(function (g) {\n  var N = g.KLOCKI.naczynia = g.KLOCKI.naczynia || {};\n  N.probowkaPath = function (x, cx, top, dnoY, tw) {\n    var l = cx - tw / 2, r = cx + tw / 2;\n    x.beginPath(); x.moveTo(l, top); x.lineTo(l, dnoY); x.arc(cx, dnoY, tw / 2, Math.PI, 0, true); x.lineTo(r, top);\n  };\n  N.szklo = function (x, cx, top, dnoY, tw) {\n    var l = cx - tw / 2, r = cx + tw / 2, kol = '#64748b';\n    try { kol = getComputedStyle(x.canvas).getPropertyValue('--text-soft').trim() || kol; } catch (e) { }\n    x.save();\n    N.probowkaPath(x, cx, top, dnoY, tw);\n    x.strokeStyle = kol; x.lineWidth = 2; x.lineJoin = 'round'; x.stroke();\n    // połysk po lewej stronie ścianki\n    x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 2; x.lineCap = 'round';\n    x.beginPath(); x.moveTo(l + 5, top + 14); x.lineTo(l + 5, dnoY - 4); x.stroke();\n    // brzeg\n    x.strokeStyle = kol; x.lineWidth = 2.5;\n    x.beginPath(); x.moveTo(l - 3, top); x.lineTo(r + 3, top); x.stroke();\n    x.restore();\n  };\n})(window);\n\n/* Dane pierwiastków I i II grupy do klocków (wspólne dla palników, probówek i tablicy).\n   Barwy płomieni i zachowanie w wodzie to wartości poglądowe — patrz klocki/EFEKTY.md (do sprawdzenia w W1). */\n/* ---------------------------- dane ---------------------------- */\nvar SYM = 'H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');\nvar NAZ = 'wodór,hel,lit,beryl,bor,węgiel,azot,tlen,fluor,neon,sód,magnez,glin,krzem,fosfor,siarka,chlor,argon,potas,wapń,skand,tytan,wanad,chrom,mangan,żelazo,kobalt,nikiel,miedź,cynk,gal,german,arsen,selen,brom,krypton,rubid,stront,itr,cyrkon,niob,molibden,technet,ruten,rod,pallad,srebro,kadm,ind,cyna,antymon,tellur,jod,ksenon,cez,bar,lantan,cer,prazeodym,neodym,promet,samar,europ,gadolin,terb,dysproz,holm,erb,tul,iterb,lutet,hafn,tantal,wolfram,ren,osm,iryd,platyna,złoto,rtęć,tal,ołów,bizmut,polon,astat,radon,frans,rad,aktyn,tor,protaktyn,uran,neptun,pluton,ameryk,kiur,berkel,kaliforn,einstein,ferm,mendelew,nobel,lorens,rutherford,dubn,seaborg,bohr,has,meitner,darmstadt,roentgen,kopernik,nihon,flerow,moskow,liwermor,tennes,oganeson'.split(',');\nvar G1 = ['Li', 'Na', 'K', 'Rb', 'Cs', 'Fr'], G2 = ['Be', 'Mg', 'Ca', 'Sr', 'Ba', 'Ra'];\nfunction grupaEl(s) { return G1.indexOf(s) >= 0 ? 1 : G2.indexOf(s) >= 0 ? 2 : 0; }\n\nfunction poz(z) {\n  if (z === 1) return {r: 1, c: 1};\n  if (z === 2) return {r: 1, c: 18};\n  if (z <= 4) return {r: 2, c: z - 2};\n  if (z <= 10) return {r: 2, c: z + 8};\n  if (z <= 12) return {r: 3, c: z - 10};\n  if (z <= 18) return {r: 3, c: z};\n  if (z <= 36) return {r: 4, c: z - 18};\n  if (z <= 54) return {r: 5, c: z - 36};\n  if (z <= 56) return {r: 6, c: z - 54};\n  if (z <= 71) return {r: 6, f: 1, c: z - 57 + 3};\n  if (z <= 86) return {r: 6, c: z - 68};\n  if (z <= 88) return {r: 7, c: z - 86};\n  if (z <= 103) return {r: 7, f: 2, c: z - 89 + 3};\n  return {r: 7, c: z - 100};\n}\n\n/* opisy i dane liczbowe litowców i berylowców (rho — g/cm³, mp — °C, re — reaktywność wobec zimnej wody 0–6, skala poglądowa) */\nvar DANE = {\n  H:  {opis: 'Leży w grupie 1, ale nie jest litowcem: to niemetal czy.', rown: '2Na + 2H₂O → 2NaOH + H₂↑'},\n  K:  {kol: '#eceff5', r: 10, plywa: 1, tempo: 60, ruch: 62, zyje: 15, rozow: .5, plomien: '#b794ff', uw: 'pływa, zapala się',\n       obs: 'Reaguje gwałtownie: wodór zapala się, a płomień barwią atomy potasu na fioletowo.', rown: '2K + 2H₂O → 2KOH + H₂↑'},\n  Rb: {kol: '#e4dccf', r: 9, tempo: 90, wstrzas: 2, zyje: 8, rozow: .8, ostrz: 1, uw: 'tonie, gwałtownie',\n       obs: 'Jest gęstszy od wody, więc tonie, lecz reaguje bardzo gwałtownie — naczynie może pęknąć.', rown: '2Rb + 2H₂O → 2RbOH + H₂↑'},\n  Cs: {kol: '#e9d48f', r: 9, tempo: 120, wstrzas: 3.2, zyje: 5, rozow: 1, ostrz: 1, uw: 'tonie, wybuchowo',\n       obs: 'Tonie i reaguje wybuchowo.', rown: '2Cs + 2H₂O → 2CsOH + H₂↑'},\n  Be: {kol: '#9aa6b0', r: 7, tempo: 0, rozow: 0, zyje: 0, uw: 'brak reakcji',\n       obs: 'Nie reaguje z wodą: chroni go cienka warstwa tlenku BeO. Pył i związki berylu są toksyczne.', rown: 'Be + H₂O → brak reakcji'},\n  Mg: {kol: '#d0d6dc', r: 7, tempo: 1.2, rozow: .011, rozMax: .28, zyje: 0, uw: 'bardzo wolno',\n       obs: 'Z zimną wodą reaguje bardzo wolno: pojedyncze pęcherzyki i blade różowienie. Szybciej reaguje z wrzątkiem lub parą wodną.', rown: 'Mg + 2H₂O → Mg(OH)₂ + H₂↑'},\n  Ca: {kol: '#c9ccd0', r: 8, tempo: 16, rozow: .07, mut: .85, kurcz: .004, uw: 'tonie, mętnieje',\n       obs: 'Tonie i stale wydziela H₂. Roztwór mętnieje, bo Ca(OH)₂ rozpuszcza się słabo.', rown: 'Ca + 2H₂O → Ca(OH)₂ + H₂↑'},\n  Sr: {kol: '#d8d6c2', r: 8, tempo: 28, rozow: .12, mut: .35, kurcz: .006, uw: 'tonie, żywo',\n       obs: 'Tonie i reaguje żywiej niż wapń; roztwór lekko mętnieje.', rown: 'Sr + 2H₂O → Sr(OH)₂ + H₂↑'},\n  Ra: {kol: '#e6e2d6', r: 8, tempo: 58, rozow: .3, kurcz: .014, rad: 1, uw: 'tonie, tylko animacja',\n       obs: 'Cięższy od wody, tonie; reaguje energiczniej niż bar. Pokazujemy tylko animację — w szkole nie wykonuje się tego doświadczenia.', rown: 'Ra + 2H₂O → Ra(OH)₂ + H₂↑'},\n  Ba: {kol: '#c6cab8', r: 8, tempo: 42, rozow: .2, mut: .08, kurcz: .009, uw: 'tonie, energicznie',\n       obs: 'Tonie i reaguje energicznie. Ba(OH)₂ dobrze się rozpuszcza, więc roztwór zostaje klarowny.', rown: 'Ba + 2H₂O → Ba(OH)₂ + H₂↑'},\n  Fr: {kol: '#8f8f8f', r: 8, tempo: 0, zyje: 0, rozow: 0, rad: 1, uw: 'brak danych',\n       obs: 'Frans jest wyjątkowo rzadki i silnie promieniotwórczy; nie ma wiarygodnych danych o reakcji z wodą. Animacji nie pokazujemy.', rown: 'brak wiarygodnych danych'},\n  CaO: {kol: '#e6e1d0', r: 9, tempo: 0, zyje: 0, rozow: .1, mut: .85, uw: 'opada, ogrzewa wodę, mętnieje',\n       obs: 'Biały proszek opada na dno i ogrzewa wodę (reakcja egzotermiczna). Powstaje Ca(OH)₂: roztwór mętnieje, a po fenoloftaleinie różowieje.', rown: 'CaO + H₂O → Ca(OH)₂'}\n};\nvar LISTA_PR = {1: ['Li', 'Na', 'K', 'Rb', 'Cs', 'Fr'], 2: ['Be', 'Mg', 'Ca', 'Sr', 'Ba', 'Ra'], 3: ['CaO']};\n\n/* płomienie: barwa i opis */\nvar PL = {\n  Li: {c: '#ff3b6b', nz: 'karminowy', op: 'Czerwień z różowym odcieniem; łatwo pomylić ze strontem.'},\n  Na: {c: '#ffd21f', nz: 'żółty', op: 'Bardzo intensywny: ślady sodu są wszędzie i potrafią zagłuszyć inne barwy.'},\n  K:  {c: '#b794ff', nz: 'fioletowy (liliowy)', op: 'Blady. Ogląda się go przez niebieskie szkło kobaltowe, które pochłania żółć sodu.'},\n  Rb: {c: '#d2428f', nz: 'czerwonofioletowy', op: 'Podobny do potasu, ale z wyraźną czerwienią.'},\n  Cs: {c: '#5aa4ff', nz: 'niebieskofioletowy', op: 'Jasny błękit; nazwa cezu pochodzi od łacińskiego słowa oznaczającego błękit nieba.'},\n  Be: {tryb: 'brak', nz: 'brak barwy', op: 'Beryl nie barwi płomienia, a jego pył jest toksyczny, więc nie robi się z nim prób.'},\n  Mg: {tryb: 'mg', nz: 'oślepiająco biały błysk', op: 'Magnez nie barwi płomienia, tylko pali się własnym: 2Mg + O₂ → 2MgO. Nie patrz prosto w błysk.'},\n  Ca: {c: '#ff6a1f', nz: 'ceglastoczerwony', op: 'Pomarańczowoczerwony, cieplejszy niż stront.'},\n  Sr: {c: '#ff2430', nz: 'jaskrawoczerwony', op: 'Jaskrawa czerwień z fajerwerków i rac.'},\n  Ba: {c: '#9be34d', nz: 'zielony', op: 'Żółtozielony. Sole baru są trujące.'},\n  Ra: {c: '#d6123d', nz: 'karminowy', rad: 1, op: 'Sole radu barwią płomień karminowo. To tylko animacja — z radem nie pracuje się w szkole.'},\n  Fr: {tryb: 'brak', nz: 'brak danych', rad: 1, op: 'Frans jest wyjątkowo rzadki i silnie promieniotwórczy; nie ma wiarygodnych danych o barwie płomienia. Pokazujemy go tylko jako model.'}\n};\n\n\n/* związek berylowca (tlenek) dla probówek */\nDANE.CaO = {kon: 'związek CaO', rho: '3,34 g/cm³', rhoN: 3.34, mp: '2572 °C', re: 2,\n  opis: 'Tlenek wapnia (wapno palone). Z wodą tworzy Ca(OH)₂ z wydzieleniem ciepła.'};\n\n/* Klocek-znaki: promieniowanie (trójlistek ISO 361) i zakaz w szkole. Używane przez każdy klocek z pierwiastkiem promieniotwórczym. */\n/* znaki: trójlistek promieniowania (ISO 361) i zakaz (kolba w czerwonym kole) */\nfunction tref(sz) {\n  function sek(a) {\n    var r1 = 14, r2 = 40, a1 = (a - 30) * Math.PI / 180, a2 = (a + 30) * Math.PI / 180;\n    function P(r, t) { return (r * Math.cos(t)).toFixed(1) + ' ' + (-r * Math.sin(t)).toFixed(1); }\n    return '<path fill=\"#111\" d=\"M' + P(r1, a1) + ' L' + P(r2, a1) + ' A' + r2 + ' ' + r2 + ' 0 0 0 ' + P(r2, a2) + ' L' + P(r1, a2) + ' A' + r1 + ' ' + r1 + ' 0 0 1 ' + P(r1, a1) + 'Z\"/>';\n  }\n  return '<svg width=\"' + sz + '\" height=\"' + sz + '\" viewBox=\"-50 -50 100 100\" role=\"img\" aria-label=\"Znak promieniowania jonizującego\"><circle r=\"48\" fill=\"#f6c300\" stroke=\"#111\" stroke-width=\"3\"/>' + sek(90) + sek(210) + sek(330) + '<circle r=\"8\" fill=\"#111\"/><\/svg>';\n}\nfunction zabron(sz) {\n  return '<svg width=\"' + sz + '\" height=\"' + sz + '\" viewBox=\"-50 -50 100 100\" role=\"img\" aria-label=\"Zakaz wykonywania w szkole\"><path d=\"M-14 -26h28M-8 -26v18l-20 34a7 7 0 0 0 6 10h44a7 7 0 0 0 6-10l-20-34v-18\" fill=\"none\" stroke=\"#222\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle r=\"43\" fill=\"none\" stroke=\"#e5383b\" stroke-width=\"9\"/><path d=\"M-30 -30L30 30\" stroke=\"#e5383b\" stroke-width=\"9\" stroke-linecap=\"round\"/><\/svg>';\n}\nfunction zakaz(txt) {\n  return '<div class=\"zak\"><span class=\"zak-ik\">' + tref(28) + zabron(28) + '<\/span><span><b>Promieniotwórczy.<\/b> ' + txt + '<\/span><\/div>';\n}\n\nKLOCKI.znak = {tref: tref, zabron: zabron, zakaz: zakaz};\n\n/* KLOCEK: probówki (Li, Na, K, Rb, Cs, Be, Mg, Ca, Sr, Ba, Ra). Trzy i więcej probówek obok siebie w statywie. */\n/* ====================================================================\n   KLOCEK: probówki\n   ==================================================================== */\nfunction Rurka(x, ox, sym, wsk) {\n  var P = {cx: 75, tw: 76, top: 54, wl: 152, bot: 326};\n  var S = {wsk: wsk};\n  var api = {krok: krok, rysuj: rysuj, reset: reset, ustaw: ustaw, wskaznik: function (v) { S.wsk = v; }};\n\n  function reset() {\n    S.t = 0; S.b = []; S.dr = []; S.foam = 0; S.acc = 0; S.dacc = 0; S.spl = false;\n    S.mx0 = (Math.random() - .5) * 20; S.rel = S.mx0; S.tx = 0; S.tc = 0; S.my = 0; S.mx = P.cx + S.mx0;\n    S.zywe = false; S.sc = 1; S.fcap = Math.min(1, S.d.tempo / 50);\n  }\n  function ustaw(s) { S.sym = s; S.d = PR[s]; reset(); }\n\n  function krok(dt) {\n    var d = S.d, t = S.t += dt, t1 = t - .6, fin = d.zyje > 0;\n    var sc = 1;\n    if (fin) sc = Math.max(0, 1 - t1 / d.zyje); else if (d.kurcz) sc = Math.max(.5, 1 - d.kurcz * Math.max(0, t1));\n    S.sc = sc;\n    var zywe = t1 >= 0 && (!fin || sc > .06); S.zywe = zywe;\n    var R = d.r * (.3 + .7 * sc); S.R = R;\n    var surf = P.wl, dno = P.bot + P.tw / 2 - 2;\n\n    if (t < .6) { var u = t / .6, y0 = P.top - 26; S.my = y0 + (surf - y0) * u * u; S.mx = P.cx + S.mx0; }\n    else if (d.plywa) {\n      S.tc -= dt;\n      if (S.tc <= 0) { S.tx = (Math.random() * 2 - 1) * (P.tw / 2 - R - 6); S.tc = .35 + Math.random() * .9 * (1 - Math.min(.8, d.ruch / 80)); }\n      S.rel += (S.tx - S.rel) * Math.min(1, dt * d.ruch / 9);\n      S.mx = P.cx + S.rel; S.my = surf + 1 + Math.sin(t * 4) * .8;\n    } else {\n      var u2 = sm(t1 / 1.1); S.my = surf + (dno - R - surf) * u2; S.mx = P.cx + S.mx0 * (1 - u2 * .7);\n    }\n    if (!S.spl && t >= .6) {\n      S.spl = true;\n      for (var q = 0; q < 10; q++) S.dr.push({x: S.mx, y: surf, vx: (Math.random() - .5) * 70, vy: -(50 + Math.random() * 110), r: 1 + Math.random() * 1.5});\n    }\n    if (zywe && d.tempo > 0) {\n      S.acc += d.tempo * (fin ? (.35 + .65 * sc) : 1) * dt;\n      var n = 0;\n      while (S.acc >= 1 && n < 8) {\n        S.acc -= 1; n++;\n        S.b.push({x: S.mx + (Math.random() - .5) * R * 1.6, y: d.plywa ? S.my + R * .7 : S.my - R * .3, r: 1.1 + Math.random() * 2.3,\n          vy: d.plywa ? -(8 + Math.random() * 30) : (10 + Math.random() * 30), ph: Math.random() * 6.3, w: 3 + Math.random() * 4});\n      }\n    }\n    var l = P.cx - P.tw / 2 + 4, r = P.cx + P.tw / 2 - 4;\n    for (var i = S.b.length - 1; i >= 0; i--) {\n      var b = S.b[i];\n      b.vy = Math.min(75, b.vy + 70 * dt); b.y -= b.vy * dt; b.x = clamp(b.x + Math.sin(b.ph + t * 7) * b.w * dt * 3, l + b.r, r - b.r);\n      if (b.y <= surf + b.r) { S.b.splice(i, 1); S.foam = Math.min(S.fcap, S.foam + .02); }\n    }\n    if (S.b.length > 260) S.b.splice(0, S.b.length - 260);\n    S.foam = Math.max(0, S.foam - dt * .35);\n    var dr = d.plywa ? (d.plomien ? 9 : 0) : (d.wstrzas ? d.wstrzas * 18 : 0);\n    if (zywe && dr > 0) {\n      S.dacc += dr * dt;\n      while (S.dacc >= 1) { S.dacc -= 1; S.dr.push({x: d.plywa ? S.mx : P.cx + (Math.random() - .5) * P.tw * .6, y: surf, vx: (Math.random() - .5) * 60, vy: -(90 + Math.random() * 160), r: 1 + Math.random() * 1.6}); }\n    }\n    for (var k = S.dr.length - 1; k >= 0; k--) {\n      var c = S.dr[k]; c.vy += 420 * dt; c.y += c.vy * dt; c.x += c.vx * dt;\n      if (c.y > P.top && (c.x < l - 1 || c.x > r + 1)) { c.vx *= -.6; c.x = clamp(c.x, l, r); }\n      if (c.vy > 0 && c.y >= surf) S.dr.splice(k, 1);\n    }\n  }\n\n  function tubePath() {\n    KLOCKI.naczynia.probow h.abs(q)):'')+(q>0?'⁺':'⁻')}\nfunction pl(x,d){return x.toFixed(d).replace('.',',')}\n/* atomSVG — komponent wielokrotnego użytku (F05, F07, A01…): model atomu jako SVG, kolory jak w atlasie (_anon_004 bohr: elektrony wewnętrzne #2f8a55, walencyjne #b85f00).\n   o = {p, n, e, powloki:false|true, W:260}. powloki:false → elektrony na jednym okręgu (F05; powłoki to pojęcie F07);\n   powloki:true → powłoki K, L, M, N wg modelu szkolnego 2, 8, 8, … (do Z = 20; dalej uproszczenie — do weryfikacji). Zwraca otwarty <svg…> (zamknąć '<\/svg>'). */\nfunction atomSVG(o){var W=o.W||260,C=W/2,p=o.p|0,n=o.n|0,e=o.e|0,svg='<svg viewBox=\"0 0 '+W+' '+W+'\" width=\"100%\" style=\"max-width:'+W+'px;display:block;margin:auto\" role=\"img\" aria-label=\"Model atomu: '+p+' p, '+n+' n, '+e+' e\">';\n var N=p+n,sk=W/260;\n for(var i=0;i<N;i++){var a=i*2.39996,r=4.2*sk*Math.sqrt(i+.5);svg+='<circle cx=\"'+(C+r*Math.cos(a)).toFixed(1)+'\" cy=\"'+(C+r*Math.sin(a)).toFixed(1)+'\" r=\"'+(4.6*sk).toFixed(1)+'\" fill=\"'+(Math.floor((i+1)*p/N)>Math.floor(i*p/N)?'#d9534f':'#7f8da0')+'\" stroke=\"#fff\" stroke-width=\".8\"/>'}\n var sh=[];if(o.powloki){var cap=[2,8,8],left=e;for(var q=0;left>0;q++){var c=q<3?Math.min(cap[q],left):left;sh.push(c);left-=c}}else if(e)sh=[e];\n var R0=o.powloki?Math.max(40*sk,6*sk*Math.sqrt(N)+18*sk):104*sk,st=sh.length>1?(104*sk-R0)/(sh.length-1):0;\n sh.forEach(function(cnt,q){var R=sh.length>1?R0+q*st:(o.powloki?R0:104*sk),wal=o.powloki&&q===sh.length-1;\n  svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+R.toFixed(1)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n  if(o.powloki)svg+='<text x=\"'+(C+R*0.71+4).toFixed(1)+'\" y=\"'+(C-R*0.71-4).toFixed(1)+'\" font-size=\"'+(11*sk).toFixed(0)+'\" fill=\"#5b6773\">'+'KLMN'[q]+'<\/text>';\n  for(var k=0;k<cnt;k++){var b=k/cnt*2*Math.PI-Math.PI/2;svg+='<circle cx=\"'+(C+R*Math.cos(b)).toFixed(1)+'\" cy=\"'+(C+R*Math.sin(b)).toFixed(1)+'\" r=\"'+(5*sk).toFixed(1)+'\" fill=\"'+(o.powloki?(wal?'#b85f00':'#2e7d4f'):'#2f7bd8')+'\"/>'}});\n if(!e)svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+(104*sk)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n return svg}\ntry{C.LAB=C.LAB||{};C.LAB.atomSVG=atomSVG}catch(_){}\n/* atomBohr, orbitalCloud → engine/src/dodatki/atlas-gfx.js (wspólne dla labu i lekcji, CHE.LAB.*) */\n\nV.define('f05-izotopy-v01',{title:'Izotop, jon czy inny pierwiastek? Konstruktor atomu i masa atomowa',tag:'MODEL',\n hint:'Dodawaj i zabieraj protony, neutrony i elektrony. Model mówi, co się zmieniło: pierwiastek (Z), izotop (n) czy ładunek (e). Niżej: skąd się bierze masa atomowa z układu okresowego.',\n foot:'rozszerzenia.js §8 · dane: CHE.DATA.ISOTOPES, ELEMENTS_54',\n build:function(host){host.innerHTML='';host.classList.add('x5');\n  var s={p:17,n:18,e:17},start={p:17,n:18,e:17};\n  var pick=el('div','bar','<b>Start:<\/b>');host.appendChild(pick);\n  [1,6,8,11,12,17,20].forEach(function(z){var d=izo(z);if(!d||!d[2].length)return;var b=el('button','o',d[0]);b.type='button';b.onclick=function(){s={p:z,n:d[2][0][0]-z,e:z};start={p:s.p,n:s.n,e:s.e};draw()};pick.appendChild(b)});\n  var ctl=el('div','bar');host.appendChild(ctl);\n  [['p','proton'],['n','neutron'],['e','elektron']].forEach(function(c){\n   var m=el('button','o','− '+c[1]),p=el('button','o','+ '+c[1]);m.type=p.type='button';\n   m.onclick=function(){if(s[c[0]]>(c[0]==='p'?1:0)){s[c[0]]--;draw()}};p.onclick=function(){if(s[c[0]]<(c[0]==='p'?20:c[0]==='n'?30:22)){s[c[0]]++;draw()}};ctl.append(m,p)});\n  var g=el('div','two'),pic=el('div'),txt=el('div');g.append(pic,txt);host.appendChild(g);\n  var avg=el('div');host.appendChild(avg);\n  function sym(z){var d=izo(z);return d?d[0]:('Z='+z)}\n  function draw(){var A=s.p+s.n,q=s.p-s.e,X=sym(s.p),d=izo(s.p);\n   /* rysunek: jądro (p czerwone, n szare) + elektrony na jednym okręgu (rozmieszczenie na powłokach — F07) */\n   var svg=atomSVG({p:s.p,n:s.n,e:s.e});\n   pic.innerHTML=svg+'<\/svg><div class=\"nt\" style=\"text-align:cente reści<\/a>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">N02 · CHEMIA · MASTER LAB v9.0<\/div><h1>Wodorotlenki i zasady<\/h1><p class=\"lead\">Kation metalu + OH⁻ → wzór M(OH)ₙ, nawias i nazwy; rozpuszczalność, wodorotlenek a zasada, dysocjacja i odczyn; trzy metody otrzymywania, strącanie, zobojętnianie, wskaźniki, amfoteryczność. Modele, liczby i równania z silnika CHE.HYDROXIDES.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-extra\">AMBITNIE / LO<\/span><\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><p class=\"mini-note\">Zakres LKO 2026/27: wodorotlenki, kwasy i sole są na etapie rejonowym (pkt I–VIII podstawy), a nie szkolnym (pkt I–V). Treść lekcji zostaje w całości; uczeń na etapie szkolnym może ją pominąć, ale nie jest błędem, że ją zna.<\/p><\/section>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#wprowadzenie\">1. Wprowadzenie<\/a><a class=\"toc-link\" href=\"#cele\">2. Cele lekcji<\/a><a class=\"toc-link\" href=\"#kompas\">3. Kompas — co trzeba wiedzieć wcześniej<\/a><a class=\"toc-link\" href=\"#pytanie\">4. Pytanie przewodnie i problem startowy<\/a><a class=\"toc-link\" href=\"#budowa\">5. Definicja, budowa i nazewnictwo<\/a><a class=\"toc-link\" href=\"#wlasciwosci\">6. Właściwości: rozpuszczalność, zasada, dysocjacja i odczyn<\/a><a class=\"toc-link\" href=\"#otrzymywanie\">7. Otrzymywanie wodorotlenków<\/a><a class=\"toc-link\" href=\"#reakcje\">8. Reakcje wodorotlenków<\/a><a class=\"toc-link\" href=\"#zastosowania\">9. Zastosowania, BHP i życie codzienne<\/a><a class=\"toc-link\" href=\"#model\">10. Model bez skrótów — cztery pytania o wodorotlenek<\/a><a class=\"toc-link\" href=\"#modele-budowy\">11. Modele budowy — rysunek szkolny a sieć jonowa<\/a><a class=\"toc-link\" href=\"#ion-lab\">12. Strącanie od środka — laboratorium jonowe<\/a><a class=\"toc-link\" href=\"#rownania-jonowe\">13. Równania jonowe<\/a><a class=\"toc-link\" href=\"#amfoterycznosc\">14. Amfoteryczność<\/a><a class=\"toc-link\" href=\"#doswiadczenia\">15. Doświadczenia modelowe<\/a><a class=\"toc-link\" href=\"#klinika\">16. Klinika błędów<\/a><a class=\"toc-link\" href=\"#cwiczenia\">17. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#test\">18. Test końcowy<\/a><a class=\"toc-link\" href=\"#karta\">19. Karta szybkiego powtórzenia (do druku)<\/a><a class=\"toc-link\" href=\"#fiszki\">20. Fiszki<\/a><a class=\"toc-link\" href=\"#test\">Sprawdź się: test<\/a><a class=\"toc-link\" href=\"#mapa\">21. Mapa pojęć<\/a><a class=\"toc-link\" href=\"#slownik\">22. Słownik<\/a><a class=\"toc-link\" href=\"#checklista\">23. Checklista<\/a><a class=\"toc-link\" href=\"#wskazowki\">24. Wskazówki do nauki<\/a><a class=\"toc-link\" href=\"#historia\">A. Dodatek A — Historia odkrycia<\/a><a class=\"toc-link\" href=\"#ambitny\">B. Dodatek B — teorie kwasów i zasad, hydraty<\/a><a class=\"toc-link\" href=\"#modele-silnika\">Modele silnika w tej lekcji<\/a><a class=\"toc-link\" href=\"#audyt\">Audyt jakości<\/a><\/nav><\/details>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć na E8 — 8 kluczowych faktów<\/h3>\n<ol>\n<li><strong>Wodorotlenek<\/strong> to związek zbudowany z kationu metalu i anionu wodorotlenkowego <span class=\"hl\">OH⁻<\/span>.<\/li>\n<li><strong>Wzór ogólny: <span class=\"formula\">M(OH)ₙ<\/span><\/strong>, gdzie <span class=\"hl\">n<\/span> oznacza liczbę grup wodorotlenkowych. W <strong>typowych wodorotlenkach metali na poziomie klasy 8<\/strong> liczba ta jest równa wartości bezwzględnej ładunku kationu, np. Ca²⁺ tworzy Ca(OH)₂. <strong>Nie utożsamiaj indeksu z samym ładunkiem zapisanym ze znakiem „+”<\/strong>.<\/li>\n<li><strong>Nawias<\/strong> stosujemy, gdy grupa OH⁻ występuje więcej niż raz: <span class=\"formula\">NaOH<\/span> vs <span class=\"formula\">Ca(OH)₂<\/span>.<\/li>\n<li><strong>Zobojętnianie:<\/strong> <span class=\"hl-warn\">wodorotlenek + kwas → sól + woda<\/span>.<\/li>\n<li><strong>Odczyn:<\/strong> roztwór dobrze rozpuszczalnego wodorotlenku ma <span class=\"hl\">odczyn zasadowy<\/span>. Wodorotlenki trudno rozpuszczalne dają bardzo mało jonów OH⁻.<\/li>\n<li><strong>Trzy typowe szkolne sposoby otrzymywania wybranych wodorotlenków:<\/strong> tlenek + woda, metal aktywny + woda, sól + zasada (strącanie).<\/li>\n<li><strong>NaOH/KOH<\/strong> są higroskopijne i żrące; roztwór to elektrolit o odczynie zasadowym.<\/li>\n<li><strong>Woda wapienna<\/strong> to nasycony roztwór Ca(OH)₂ — mętnieje po przepuszczeniu odpowiedniej ilości CO₂.<\/li>\n<\/ol>\n<\/section>\n<div class=\"layer-legend\">\n<div class=\"layer-row\"><span class=\"dot e8\"><\/span><span><b>E8 — obowiązkowo:<\/b> grupa OH⁻, wzory, zobojętnianie, rozpuszczalność szkolna<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot understand\"><\/span><span><b>Rozumienie:<\/b> skąd nawias, wodorotlenek vs zasada, dlaczego nie każdy tlenek reaguje z wodą<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot extra\"><\/span><span><b>Nadprogramowo:<\/b> amfoteryczność, równania jonowe, hydraty<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot contest\"><\/span><span><b>Konkurs / liceum:<\/b> moc zasad, AgOH, CuOH, teorie kwasów i zasad<\/span><\/div>\n<\/div>\n<div id=\"rdzen-lekcji\" class=\"core-path\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to (ok. 30 min)<\/div>\n<ol>\n<li><strong><a href=\"#budowa\">§5<\/a><\/strong> — grupa OH⁻, wzór ogólny, nawias, nazwy.<\/li>\n<li><strong>Model „Wzór wodorotlenku”<\/strong> (<a href=\"#wzor-ogolny\">§5.2<\/a>) — zbuduj wzory dla Na, Ca, Al, Fe(III).<\/li>\n<li><strong>Rozpuszczalność, zasada i odczyn<\/strong> (<a href=\"#wlasciwosci\">§6<\/a>) — tabela rozpuszczalności, dysocjacja, wskaźniki.<\/li>\n<li><strong>Otrzymywanie + Laboratorium jonowe<\/strong> (<a href=\"#otrzymywanie\">§7<\/a>, <a href=\"#ion-lab\">§12<\/a>) — zobacz, jak powstaje osad.<\/li>\n<li><strong>Zobojętnianie<\/strong> (<a href=\"#zobojetnianie\">§8.1<\/a>) — animacja i licznik moli.<\/li>\n<li><strong>pH i wskaźniki + Lab<\/strong> (<a href=\"#ph-wskazniki\">§6.4<\/a>) — przewiduj odczyn.<\/li>\n<li><strong>Klinika błędów + Ćwiczenia + Test<\/strong> (<a href=\"#klinika\">§16<\/a>–<a href=\"#test\">§18<\/a>).<\/li>\n<\/ol>\n<\/div>\n<section id=\"wprowadzenie\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Wprowadzenie<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">O co tu właściwie chodzi?<\/span>\n<p>W poprzedniej lekcji poznałeś <strong>tlenki<\/strong>. Wiesz już, że <span class=\"hl\">część tlenków zasadowych<\/span> — zwłaszcza tlenki metali aktywnych — reaguje z wodą, tworząc <strong>wodorotlenki<\/strong>. Ale co to właściwie jest? Jak wygląda wzór? Jak nazwać taki związek? I dlaczego jedne wodorotlenki rozpuszczają się w wodzie, a inne nie?<\/p>\n<p>Odpowiedzi prowadzą przez <span class=\"hl\">grupę wodorotlenkową OH⁻<\/span> — jeden mały klocek, który decyduje o właściwościach całej grupy związków.<\/p>\n<\/div>\n<p class=\"mini-note\">Trzy fakty na start — OH⁻ ma ładunek −1; liczba grup OH⁻ odpowiada wartości bezwzględnej ładunku kationu; nawias stawiamy tylko przy więcej niż jednej grupie — zebrano w karcie <a href=\"#minimum\">Minimum E8<\/a>, a pełne wyjaśnienie z przykładami jest w <a href=\"#budowa\">§5<\/a>.<\/p>\n<\/section>\n<section id=\"cele\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Cele lekcji <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Po tej lekcji uczeń:<\/span>\n<ul>\n<li><strong>zapisuje<\/strong> wzór wodorotlenku na podstawie kationu metalu,<\/li>\n<li><strong>stosuje<\/strong> nawias, gdy grupa OH⁻ powtarza się więcej niż raz,<\/li>\n<li><strong>nazywa<\/strong> wodorotlenki (w tym z cyfrą rzymską dla Fe, Cu, Sn, Pb),<\/li>\n<li><strong>zapisuje<\/strong> otrzymywanie wodorotlenku trzema typowymi metodami szkolnymi,<\/li>\n<li><strong>zapisuje<\/strong> reakcję zobojętniania,<\/li>\n<li><strong>rozróżnia<\/strong> wodorotlenki rozpuszczalne i nierozpuszczalne,<\/li>\n<li><strong>rozróżnia<\/strong> substancję (wodorotlenek) od roztworu (zasada),<\/li>\n<li><strong>opisuje<\/strong> odczyn zasadowy i wskaźniki,<\/li>\n<li><strong>opisuje<\/strong> właściwości NaOH, KOH i Ca(OH)₂ (higroskopijność, BHP, wapno i woda wapienna),<\/li>\n<li>(ambitnie) <strong>wyjaśnia<\/strong> amfoteryczność i równania jonowe.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"kompas\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Kompas — co trzeba wiedzieć wcześniej<\/div>\n<div class=\"card card-understand\">\n<ul>\n<li><strong>Wcześniej:<\/strong> wartościowość, W–K–S–K, grupa OH⁻, ładunek jonu, nawias. Fundamenty F00–F09: jony, ładunek, zapis wzorów.<\/li>\n<li><strong>Tlenki (lekcja N01):<\/strong> tlenki zasadowe (<span class=\"formula\">Na₂O<\/span>, <span class=\"formula\">K₂O<\/span>, <span class=\"formula\">CaO<\/span>, <span class=\"formula\">BaO<\/span>) reagują z wodą → wodorotlenki. Tlenki amfoteryczne (<span class=\"formula\">Al₂O₃<\/span>, <span class=\"formula\">ZnO<\/span>) reagują z kwasami i zasadami.<\/li>\n<li><strong>Uwaga:<\/strong> określenie „tlenek zasadowy” nie oznacza automatycznie, że tlenek reaguje z wodą (CuO — nie, MgO — bardzo powoli); szczegóły i lista tlenków reagujących z wodą — <a href=\"#uwaga-tlenki\">§7.1<\/a>.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"pytanie\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Pytanie przewodnie i problem startowy<\/div>\n<div class=\"card card-core\">\n<p style=\"font-size:17px;font-weight:700;line-height:1.6;\">Jak zbudowany jest wodorotlenek i dlaczego jedne rozpuszczają się w wodzie, a inne nie?<\/p>\n<\/div>\n<div id=\"problem\" class=\"card card-warning\">\n<p><strong>Masz do dyspozycji:<\/strong> tlenek wapnia <span class=\"formula\">CaO<\/span>, tlenek sodu <span class=\"formula\">Na₂O<\/span>, metaliczny sód <span class=\"formula\">Na<\/span>, metaliczny magnez <span class=\"formula\">Mg<\/span>, wodorotlenek sodu <span class=\"formula\">NaOH<\/span>, chlorek żelaza(III) <span class=\"formula\">FeCl₃<\/span>.<\/p>\n<p><strong>Pytanie:<\/strong> Jak otrzymać <span class=\"formula\">Ca(OH)₂<\/span>? Jak otrzymać <span class=\"formula\">Fe(OH)₃<\/span>? Jak otrzymać <span class=\"formula\">NaOH<\/span>?<\/p>\n<details class=\"answer\"><summary>Pokaż rozwiązanie — trzy szkolne metody<\/summary>\n<p><strong>W szkolnych zadaniach spotkasz trzy typowe sposoby otrzymywania wybranych wodorotlenków:<\/strong><\/p>\n<ul>\n<li><strong>Tlenek metalu aktywnego + woda → wodorotlenek<\/strong> (<span class=\"formula\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/span>).<\/li>\n<li><strong>Metal aktywny + woda → wodorotlenek + wodór↑<\/strong> (<span class=\"formula\" data-rx=\"naH2o\">2Na + 2H₂O → 2NaOH + H₂↑<\/span>).<\/li>\n<li><strong>Sól metalu + zasada → wodorotlenek↓ + sól<\/strong> (<span class=\"formula\" data-rx=\"fecl3Naoh\">FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl<\/span>).<\/li>\n<\/ul>\n<p>Ca(OH)₂ — z CaO i wody (metoda 1); Fe(OH)₃ — z FeCl₃ i NaOH (metoda 3, strącanie); NaOH — z sodu i wody (metoda 2) albo z Na₂O i wody (metoda 1). Magnez reaguje z wodą dopiero na gorąco, dlatego Mg(OH)₂ wygodniej otrzymać przez strącanie (<a href=\"#stracanie\">§7.2<\/a>).<\/p>\n<p class=\"mini-note\" style=\"margin-top:10px;\">To nie są uniwersalne metody dla każdego wodorotlenku — dotyczą wybranych związków i warunków szkolnych.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"budowa\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Definicja, budowa i nazewnictwo <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"definicja\">5.1 Definicja i grupa wodorotlenkowa OH⁻<\/h3>\n<div class=\"card card-basic\">\n<p><strong>Wodorotlenki<\/strong> to związki chemiczne zbudowane z:<\/p>\n<ul>\n<li><strong>kationów metalu<\/strong> (lub jonu amonowego <span class=\"formula\">NH₄⁺<\/span>),<\/li>\n<li><strong>anionów wodorotlenkowych <span class=\"hl\">OH⁻<\/span><\/strong>.<\/li>\n<\/ul>\n<p style=\"margin-top:10px;\">Wzór ogólny: <span class=\"formula-lg\">M(OH)ₙ<\/span>, gdzie <strong>M<\/strong> = metal, <strong>OH⁻<\/strong> = grupa wodorotlenkowa o ładunku −1, <strong>n<\/strong> = liczba grup OH⁻. W <strong>typowych wodorotlenkach metali na poziomie klasy 8<\/strong> liczba grup OH⁻ jest równa wartości bezwzględnej ładunku kationu, np. Ca²⁺ tworzy Ca(OH)₂. W bardziej złożonych przypadkach (np. jony kompleksowe, hydraty) reguła ta nie obowiązuje.<\/p>\n<\/div>\n<div id=\"grupa-oh\" class=\"card card-core\">\n<dl class=\"def-list\"><div class=\"def-item\"><dt>Nazwa<\/dt><dd>Grupa wodorotlenkowa (anion wodorotlenkowy).<\/dd><\/div><div class=\"def-item\"><dt>Wzór<\/dt><dd><span class=\"formula\">OH⁻<\/span><\/dd><\/div><div class=\"def-item\"><dt>Ładunek<\/dt><dd><strong>−1<\/strong><\/dd><\/div><div class=\"def-item\"><dt>Skład<\/dt><dd>1 atom tlenu + 1 atom wodoru, jako całość ma ładunek −1.<\/dd><\/div><div class=\"def-item\"><dt>Traktowanie w zadaniach<\/dt><dd>Jeden klocek (całość), nie osobne O i H.<\/dd><\/div><\/dl>\n<div class=\"rule-box\"><b>Zapamiętaj:<\/b> OH⁻ to <strong>jedna grupa<\/strong>. Nawet jeśli składa się z dwóch atomów, traktujemy ją jak jeden element.<\/div>\n<div class=\"rule-box\" style=\"background:var(--c-warn-bg);border-color:var(--c-warn-line);\"><b>Wodorotlenek ≠ alkohol:<\/b> w <span class=\"formula\">OH⁻<\/span> mamy jon wodorotlenkowy. W alkoholu występuje <strong>grupa hydroksylowa <span class=\"formula\">−OH<\/span> połączona kowalencyjnie z atomem węgla<\/strong>, ale <strong>nie jest ona osobnym jonem OH⁻<\/strong>. To zupełnie inna chemia (związek organiczny). Alkohol zapisujemy ogólnie jako R–OH, gdzie R to fragment węglowy; wodorotlenek to kation metalu (albo NH₄⁺) + OH⁻.<\/div>\n<\/div>\n<h3 id=\"wzor-ogolny\">5.2 Wzór ogólny M(OH)ₙ — jak go zbudować?<\/h3>\n<p class=\"lead\"><strong>Cel:<\/strong> uczeń ma nie tylko znać regułę, ale wiedzieć, co zrobić w następnym kroku i jak sprawdzić wynik.<\/p>\n<div class=\"core-path\">\n<div class=\"cp-title\">Nie zapamiętuj wzorów osobno — odtwórz je z ładunków.<\/div>\n<ol>\n<li>Kation metalu ma ładunek dodatni (np. <span class=\"formula\">Ca²⁺<\/span>).<\/li>\n<li>Grupa OH⁻ ma zawsze ładunek −1.<\/li>\n<li>Związek jako całość jest elektrycznie obojętny.<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-core\">\n<p><strong>Krok po kroku:<\/strong><\/p>\n<ol>\n<li>Zapisz kation metalu (np. <span class=\"formula\">Ca²⁺<\/span>).<\/li>\n<li>Odczytaj jego ładunek (np. <strong>+2<\/strong>).<\/li>\n<li>Zapisz <span class=\"formula\">OH⁻<\/span> jako jeden jon (−1). Dobierz liczbę grup OH⁻ tak, aby suma ładunków wynosiła 0. Tyle samo grup OH⁻ musisz przyłączyć.<\/li>\n<li>Zapisz wzór: <span class=\"formula\">Ca(OH)₂<\/span>.<\/li>\n<li><strong>Kontrola:<\/strong> suma ładunków = 0; nawias, gdy grup OH⁻ jest więcej niż jedna; indeks za nawiasem mnoży wszystkie atomy w środku. Sprawdź indeks: ma dotyczyć całej grupy, nie tylko H. Przykład: <span class=\"formula\">(+2) + 2·(−1) = 0<\/span>.<\/li>\n<\/ol>\n<p class=\"mini-note\" style=\"margin-bottom:8px;\">Liczba grup OH⁻ = wartość bezwzględna ładunku kationu (w prostych wodorotlenkach). W tabeli jest jedna kolumna <b>n<\/b> oznaczająca właśnie liczbę grup OH⁻.<\/p>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Kation<\/th><th>n (liczba OH⁻)<\/th><th>Wzór<\/th><th>Nazwa<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Na⁺<\/td><td>1<\/td><td><strong>NaOH<\/strong><\/td><td>wodorotlenek sodu<\/td><\/tr>\n<tr><td>K⁺<\/td><td>1<\/td><td><strong>KOH<\/strong><\/td><td>wodorotlenek potasu<\/td><\/tr>\n<tr><td>Ca²⁺<\/td><td>2<\/td><td><strong>Ca(OH)₂<\/strong><\/td><td>wodorotlenek wapnia<\/td><\/tr>\n<tr><td>Mg²⁺<\/td><td>2<\/td><td><strong>Mg(OH)₂<\/strong><\/td><td>wodorotlenek magnezu<\/td><\/tr>\n<tr><td>Ba²⁺<\/td><td>2<\/td><td><strong>Ba(OH)₂<\/strong><\/td><td>wodorotlenek baru<\/td><\/tr>\n<tr><td>Al³⁺<\/td><td>3<\/td><td><strong>Al(OH)₃<\/strong><\/td><td>wodorotlenek glinu<\/td><\/tr>\n<tr><td>Fe²⁺<\/td><td>2<\/td><td><strong>Fe(OH)₂<\/strong><\/td><td>wodorotlenek żelaza(II)<\/td><\/tr>\n<tr><td>Fe³⁺<\/td><td>3<\/td><td><strong>Fe(OH)₃<\/strong><\/td><td>wodorotlenek żelaza(III)<\/td><\/tr>\n<tr><td>Cu²⁺<\/td><td>2<\/td><td><strong>Cu(OH)₂<\/strong><\/td><td>wodorotlenek miedzi(II)<\/td><\/tr>\n<tr><td>Zn²⁺<\/td><td>2<\/td><td><strong>Zn(OH)₂<\/strong><\/td><td>wodorotlenek cynku<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"rule-box\">\n<b>Co naprawdę oznacza indeks n?<\/b> <strong>n oznacza liczbę całych grup OH⁻.<\/strong> W typowych prostych wodorotlenkach szkolnych jest ona równa wartości bezwzględnej ładunku kationu.\n<div class=\"equation-box\"><strong>Al³⁺ → 3 × OH⁻ → Al(OH)₃ → (+3) + 3·(−1) = 0<\/strong><\/div>\n<p style=\"margin-top:8px;\">Nie należy utożsamiać indeksu z samym ładunkiem zapisanym ze znakiem „+”. n to liczba grup OH⁻, a nie „ładunek kationu” jako taki.<\/p>\n<\/div>\n<div class=\"mnemonic\">\n<b>Mnemotechnika:<\/b> „<span class=\"hl\">OH⁻ to klocek o ładunku −1<\/span>. Kation metalu mówi, ile klocków potrzebuje.\" Na⁺ → 1 klocek. Ca²⁺ → 2 klocki. Al³⁺ → 3 klocki. Nie rozbijaj grupy na O i H w zadaniach.\n<\/div>\n<h4 id=\"wzorometr\" class=\"merge-h\">Model interaktywny — bilans ładunków i konstruktor wzorów<\/h4>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-wzory-v01\"><button type=\"button\" data-che-open-viz=\"n02-wzory-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-wzory-v01',lessonId:'N03'},'*')\"><b>Wzór wodorotlenku: kation + OH⁻ — bilans ładunków, nawias, modele A/B/jony, sprawdzanie wzoru<\/b><span>Zastępuje Wzórometr, Bilansator, Konstruktor i animację nawiasu · CHE.HYDROXIDES.build / check<\/span><\/button><\/div>\n<!-- OPIS: Konstruktor wzoru wodorotlenku: kation metalu łączy się z odpowiednią liczbą anionów OH⁻, aż ładunki się zrównoważą; model pokazuje zapis z nawiasem (np. Ca(OH)₂, Al(OH)₃) w trzech ujęciach — wzór, model kulkowy i jony — i sprawdza wpisany wzór. Wniosek: liczba grup OH⁻ równa się ładunkowi (wartościowości) metalu, a nawias obejmuje całą grupę. -->\n<p>Dodawaj grupy OH⁻, aż suma ładunków wyniesie zero. Wybierz kation i dodawaj grupy OH⁻, aż powstanie poprawny wzór.<\/p>\n<p class=\"mini-note\">Bilans ładunków jest częścią modelu z tej podsekcji: pasek „+” (kation) i „−” (grupy OH⁻), suma ładunków i przycisk „dobierz automatycznie”.<\/p>\n<p class=\"mini-note\">Konstruktor = ten sam model z tej podsekcji: pole „Sprawdź swój wzór” rozpoznaje brak nawiasu (CaOH₂), zbędny nawias (Na(OH)) i złą liczbę grup OH⁻.<\/p>\n<h3 id=\"nawias\">5.3 Nawias — kiedy i dlaczego?<\/h3>\n<div class=\"card card-warning\">\n<p><strong>Nawias stosujemy, gdy grupa OH⁻ występuje więcej niż raz.<\/strong><\/p>\n<p><strong>Przykłady:<\/strong><\/p>\n<ul>\n<li><span class=\"formula\">NaOH<\/span>, <span class=\"formula\">KOH<\/span> — bez nawiasu (1 grupa, n = 1).<\/li>\n<li><span class=\"formula\">Ca(OH)₂<\/span> — z nawiasem (2 grupy).<\/li>\n<li><span class=\"formula\">Al(OH)₃<\/span> — z nawiasem (3 grupy, n > 1).<\/li>\n<\/ul>\n<div class=\"rule-box\">\n<b>Dlaczego to ważne?<\/b> <span class=\"hl-warn\">CaOH₂<\/span> sugeruje, że indeks 2 dotyczy tylko wodoru — to błąd. <span class=\"formula\">Ca(OH)₂<\/span> mówi jasno: dwie całe grupy OH⁻. <strong>Ca(OH)₂ = Ca₁O₂H₂<\/strong>.\n      <\/div>\n<p class=\"mini-note\">Cztery kroki „CaOH₂ → Ca(OH)₂” (błędny zapis → co jest nie tak → poprawa → co to znaczy) pokazuje model z <a href=\"#wzor-ogolny\">§5.2<\/a> w części „Dlaczego nawias?” dla każdego kationu.<\/p>\n<div class=\"mnemonic\">\n<b>Mnemotechnika:<\/b> „<span class=\"hl\">Nawias to pudełko na grupę<\/span>.\" Wszystko, co w pudełku, powtarza się tyle razy, ile mówi indeks za nawiasem.\n      <\/div>\n<\/div>\n<h3 id=\"nazwy\">5.4 Nazwy wodorotlenków<\/h3>\n<div class=\"card card-core\">\n<p><strong>Reguła:<\/strong> „wodorotlenek\" + nazwa metalu. Jeżeli metal może tworzyć kationy o różnych ładunkach, w nazwie podaje się stopień utlenienia cyfrą rzymską.<\/p>\n<dl class=\"def-list\"><div class=\"def-item\"><dt><span class=\"formula\">NaOH<\/span><\/dt><dd>wodorotlenek sodu<\/dd><\/div><div class=\"def-item\"><dt><span class=\"formula\">Ca(OH)₂<\/span><\/dt><dd>wodorotlenek wapnia<\/dd><\/div><div class=\"def-item\"><dt><span class=\"formula\">Al(OH)₃<\/span><\/dt><dd>wodorotlenek glinu<\/dd><\/div><div class=\"def-item\"><dt><span class=\"formula\">Fe(OH)₂<\/span><\/dt><dd>wodorotlenek żelaza(II)<\/dd><\/div><div class=\"def-item\"><dt><span class=\"formula\">Fe(OH)₃<\/span><\/dt><dd>wodorotlenek żelaza(III)<\/dd><\/div><div class=\"def-item\"><dt><span class=\"formula\">Cu(OH)₂<\/span><\/dt><dd>wodorotlenek miedzi(II)<\/dd><\/div><\/dl>\n<p>Metale ze zmiennym stopniem utlenienia (np. Fe, Cu, Sn, Pb, Mn, Cr) — wymagają cyfry rzymskiej.<\/p>\n<div class=\"card card-extra\">\n<span class=\"card-label\">CuOH i AgOH — tylko jako ciekawostka<\/span>\n<span class=\"level-badge level-extra\">AMBITNE<\/span>\n<p><span class=\"formula\">CuOH<\/span> (formalny wodorotlenek miedzi(I)) jest nietrwały — w typowych warunkach szkolnego doświadczenia przechodzi w tlenek miedzi(I):<\/p>\n<p style=\"margin-top:8px;\"><span class=\"formula-lg\">2CuOH → Cu₂O + H₂O<\/span><\/p>\n<p><span class=\"formula\">AgOH<\/span> (wodorotlenek srebra(I)) również jest nietrwały i rozpada się do tlenku srebra(I):<\/p>\n<p style=\"margin-top:8px;\"><span class=\"formula-lg\">2AgOH → Ag₂O + H₂O<\/span><\/p>\n<p>Dlatego w zadaniach szkolnych najczęściej stosuje się <strong>Cu(OH)₂<\/strong> oraz sole srebra(I) bezpośrednio w reakcjach strąceniowych.<\/p>\n<p><strong>AgOH — wyjaśnienie:<\/strong> W warunkach doświadczenia szybko przekształca się w Ag₂O, dlatego nie traktuje się go jako trwałego, izolowanego wodorotlenku. Nie używaj sformułowania „nie istnieje” — jest ono zbyt uproszczone.<\/p>\n<\/div>\n<\/div>\n<\/section>\n<section id=\"wlasciwosci\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Właściwości: rozpuszczalność, zasada, dysocjacja i odczyn <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"higroskopijnosc\">6.1 Stan skupienia, higroskopijność i właściwości NaOH / KOH<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Stan skupienia<\/span>\n<p>W temperaturze pokojowej <strong>wodorotlenki są ciałami stałymi<\/strong> (kryształy, proszki, osady). „Zasada sodowa w butelce” to już <em>wodny roztwór wodorotlenku sodu<\/em>, nazywany ługiem sodowym, a nie czysty wodorotlenek.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Higroskopijność<\/span>\n<p><strong>Higroskopijność<\/strong> — zdolność substancji do pochłaniania wilgoci z powietrza.<\/p>\n<p><span class=\"formula\">NaOH<\/span> i <span class=\"formula\">KOH<\/span> są substancjami silnie higroskopijnymi i żrącymi: pozostawione na powietrzu „rozpływają się”, bo wchłaniają wodę i tworzą stężony roztwór. Dlatego przechowuje się je w szczelnych naczyniach.<\/p>\n<p><strong>Przy rozpuszczaniu w wodzie<\/strong> wydziela się dużo ciepła (rozpuszczanie NaOH w wodzie przebiega z wydzieleniem ciepła) — naczynie może się mocno nagrzać. Zasady bezpiecznej pracy (ochrona, kolejność dodawania, pierwsza pomoc): <a href=\"#bhp\">§9.2<\/a>.<\/p>\n<p><strong>Porównanie:<\/strong> KOH jest jeszcze lepiej rozpuszczalny w wodzie niż NaOH, ale oba są silnie żrące i higroskopijne.<\/p>\n<\/div>\n<div class=\"hygro-box\" id=\"hygroBox\">\n<div aria-hidden=\"true\" class=\"hygro-crystal\"><span class=\"w\"><\/span><span class=\"w\"><\/span><span class=\"w\"><\/span><span class=\"w\"><\/span><\/div>\n<div style=\"flex:1;min-width:200px\">\n<strong>Higroskopijność NaOH / KOH<\/strong>\n<p style=\"margin:6px 0 0;font-size:13.5px;color:var(--text-soft)\">Stały NaOH „ciągnie” parę wodną z powietrza → powierzchnia robi się mokra / roztwór. Dlatego trzymamy w szczelnym naczyniu i nie zostawiamy otwartego na stole.<\/p>\n<\/div>\n<\/div>\n<h3 id=\"rozpuszczalnosc-tabela\">6.2 Rozpuszczalność wodorotlenków — tabela (odczyt jak na klasówce)<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Szybka reguła rozpuszczalności (E8)<\/span>\n<ul>\n<li><strong>Dobrze rozpuszczalne<\/strong> (dają zasadę): wodorotlenki metali 1. grupy (NaOH, KOH, LiOH) oraz Ba(OH)₂; Ca(OH)₂ — trudno, ale tworzy wodę wapienną.<\/li>\n<li><strong>Trudno rozpuszczalne / praktycznie nierozpuszczalne<\/strong> (osady): Fe(OH)₂, Fe(OH)₃, Cu(OH)₂, Al(OH)₃, Zn(OH)₂, Mg(OH)₂.<\/li>\n<li><strong>Odczyn zasadowy<\/strong> ma tylko roztwór, w którym jest wystarczająco dużo wolnych OH⁻ — więc głównie dobrze rozpuszczalne wodorotlenki.<\/li>\n<\/ul>\n<\/div>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Wodorotlenek<\/th><th>W wodzie<\/th><th>ok. g/100 mL (20 °C)<\/th><th>Odczyn<\/th><th>Uwagi E8<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"sol-good\" data-hy=\"NaOH\" data-hy-sol=\"R\"><td>NaOH<\/td><td><strong>dobrze<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol good\"><\/div><\/div><\/div><\/td><td>~109<\/td><td>silnie zasadowy<\/td><td>zasada; <strong>higroskopijny<\/strong><\/td><\/tr>\n<tr class=\"sol-good\" data-hy=\"KOH\" data-hy-sol=\"R\"><td>KOH<\/td><td><strong>dobrze<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol good\"><\/div><\/div><\/div><\/td><td>~112<\/td><td>silnie zasadowy<\/td><td>zasada; higroskopijny<\/td><\/tr>\n<tr class=\"sol-good\" data-hy=\"Ba(OH)2\" data-hy-sol=\"R\"><td>Ba(OH)₂<\/td><td><strong>rozpuszczalny<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol good\"><\/div><\/div><\/div><\/td><td>~3,9 (8H₂O)<\/td><td>zasadowy<\/td><td>Ba²⁺ toksyczny — nie w doświadczeniach uczniowskich<\/td><\/tr>\n<tr class=\"sol-mid\" data-hy=\"Ca(OH)2\" data-hy-sol=\"T\"><td>Ca(OH)₂<\/td><td><strong>trudno<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol mid\"><\/div><\/div><\/div><\/td><td>~0,17<\/td><td>zasadowy (woda wapienna)<\/td><td>nasycony roztwór do CO₂; mleko wapienne = zawiesina<\/td><\/tr>\n<tr class=\"sol-mid\" data-hy=\"Mg(OH)2\" data-hy-sol=\"N\"><td>Mg(OH)₂<\/td><td><strong>praktycznie nierozp.<\/strong> (szkolnie: „trudno”)<div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol mid\"><\/div><\/div><\/div><\/td><td>~0,001<\/td><td>słabo zasadowy<\/td><td>mleko magnezowe; mało OH⁻<\/td><\/tr>\n<tr class=\"sol-bad\" data-hy=\"Cu(OH)2\" data-hy-sol=\"N\"><td>Cu(OH)₂<\/td><td><strong>nierozp.<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol bad\"><\/div><\/div><\/div><\/td><td>~0<\/td><td>brak wyraźnego<\/td><td>niebieski osad ↓<\/td><\/tr>\n<tr class=\"sol-bad\" data-hy=\"Fe(OH)3\" data-hy-sol=\"N\"><td>Fe(OH)₃<\/td><td><strong>nierozp.<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol bad\"><\/div><\/div><\/div><\/td><td>~0<\/td><td>brak wyraźnego<\/td><td>brunatny osad ↓ · vs NaOH: prawie „neutralny” osad<\/td><\/tr>\n<tr class=\"sol-bad\" data-hy=\"Al(OH)3,Zn(OH)2\" data-hy-sol=\"N\"><td>Al(OH)₃, Zn(OH)₂<\/td><td><strong>nierozp.<\/strong><div class=\"sol-bar\"><div class=\"track\"><div class=\"fill-sol bad\"><\/div><\/div><\/div><\/td><td>~0<\/td><td>brak wyraźnego<\/td><td>amfoteryczne (amb)<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"mini-note\"><strong>Reguła E8:<\/strong> rozpuszczalność ↔ siła odczynu w roztworze. Dużo wolnych OH⁻ (NaOH) = mocno zasadowy; osad Cu(OH)₂/Fe(OH)₃ ≈ brak typowego odczynu zasadowego w wodzie. Wartości g/100 mL — orientacyjne (podręcznik / tablice).<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"tabela-rozpuszczalnosci-v01\"><button type=\"button\" data-che-open-viz=\"tabela-rozpuszczalnosci-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'tabela-rozpuszczalnosci-v01',lessonId:'N03'},'*')\"><b>Tabela rozpuszczalności (20 °C) — kolumna OH⁻ i wszystkie sole<\/b><span>To samo źródło danych co ta lekcja · CHE.DATA.SOLUBILITY_TABLE<\/span><\/button><\/div>\n<!-- OPIS: Tabela rozpuszczalności w temperaturze 20 °C: wiersze kationów, kolumny anionów (w tym OH⁻), komórki oznaczone jako substancja rozpuszczalna, trudno rozpuszczalna lub praktycznie nierozpuszczalna. Wniosek: z tabeli odczytuje się, który wodorotlenek lub sól wytrąci się jako osad. -->\n<p id=\"wodor-grid\">Jeden widok pokazuje pierwiastek, wartościowość, wzór wodorotlenku, rozpuszczalność i barwę osadu. Kliknij kafelek — szczegóły pojawią się na stałe pod spodem.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-przeglad-v01\"><button type=\"button\" data-che-open-viz=\"n02-przeglad-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-przeglad-v01',lessonId:'N03'},'*')\"><b>Wodorotlenki — kafelki: rozpuszczalność, barwa osadu, odczyn, dysocjacja, metody otrzymywania<\/b><span>CHE.DATA.HYDROXIDES + D.SOLUBILITY_TABLE<\/span><\/button><\/div>\n<!-- OPIS: Kafelki wodorotlenków: dla każdego podany jest wzór, rozpuszczalność, barwa osadu (np. Cu(OH)₂ niebieski, Fe(OH)₃ brunatnoczerwony), odczyn roztworu, równanie dysocjacji i metody otrzymywania. Wniosek: tylko wodorotlenki rozpuszczalne tworzą zasady; nierozpuszczalne poznaje się po barwie osadu. -->\n<h3 id=\"wodorotlenek-vs-zasada\">6.3 Wodorotlenek a zasada; elektrolit i dysocjacja<\/h3>\n<div class=\"card card-basic\">\n<p><strong>Wodorotlenek<\/strong> to związek chemiczny zawierający kation metalu i aniony OH⁻. Może być substancją stałą (stały NaOH) lub osadem (Cu(OH)₂).<\/p>\n<p><strong>Zasadą<\/strong> w szkolnym ujęciu nazywamy <em>wodny roztwór niektórych wodorotlenków<\/em>, który zawiera jony OH⁻ i ma odczyn zasadowy. Dobrze rozpuszczalne wodorotlenki tworzą roztwory o wyraźnie zasadowym odczynie, natomiast trudno rozpuszczalne tworzą bardzo mało jonów OH⁻. To praktyczne uproszczenie szkolne; w szerszym ujęciu chemicznym zasadą może być także substancja niezawierająca grup OH⁻, np. amoniak NH₃.<\/p>\n<dl class=\"def-list\"><div class=\"def-item\"><dt>NaOH(s)<\/dt><dd>Wodorotlenek sodu — substancja stała. Odczyn: —<\/dd><\/div><div class=\"def-item\"><dt>NaOH(aq)<\/dt><dd>Roztwór, czyli zasada sodowa. Odczyn: silnie zasadowy.<\/dd><\/div><div class=\"def-item\"><dt>Ba(OH)₂(aq)<\/dt><dd>Roztwór wodorotlenku baru. Odczyn: zasadowy.<\/dd><\/div><div class=\"def-item\"><dt>Ca(OH)₂(aq)<\/dt><dd>Woda wapienna — nasycony roztwór. Odczyn: zasadowy.<\/dd><\/div><div class=\"def-item\"><dt>Cu(OH)₂(s)<\/dt><dd>Osad wodorotlenku miedzi(II). Jest praktycznie nierozpuszczalny, dlatego jego zawiesina nie daje wyraźnego zasadowego odczynu.<\/dd><\/div><\/dl>\n<p class=\"mini-note\">Szkolne rozróżnienie wodorotlenek / zasada / jon OH⁻ i szersze definicje zasad (amoniak, Brønsted): <a href=\"#zasada-oh\">§10.2<\/a>.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Elektrolit i nieelektrolit (PP)<\/span>\n<p><strong>Elektrolit<\/strong> — substancja, której wodny roztwór (lub stop) przewodzi prąd elektryczny, bo zawiera swobodne jony.<\/p>\n<p><strong>Nieelektrolit<\/strong> — substancja, która w roztworze nie daje swobodnych jonów (np. cukier, alkohol) — roztwór nie przewodzi.<\/p>\n<p>Roztwór <span class=\"formula\">NaOH<\/span> jest <strong>elektrolitem<\/strong> (Na⁺ i OH⁻). Czysta woda destylowana praktycznie nie przewodzi; dodatek zasady silnie zwiększa przewodnictwo.<\/p>\n<div class=\"rule-box\" style=\"margin-top:10px;\"><b>Zapamiętaj:<\/b> zasada = wodny roztwór wodorotlenku → jony OH⁻ → odczyn zasadowy + przewodnictwo (elektrolit).<\/div>\n<div class=\"cond-viz\" aria-label=\"Porównanie przewodnictwa\" role=\"img\">\n<div class=\"cond-box ok\">\n<div class=\"cond-title\">Roztwór NaOH<\/div>\n<div class=\"cond-icons\"><\/div>\n<div class=\"cond-note\">Jony Na⁺ i OH⁻ → <strong>elektrolit<\/strong><br/>żarówka świeci / przewodnictwo wysokie<\/div>\n<\/div>\n<div class=\"cond-box bad\">\n<div class=\"cond-title\">Roztwór cukru (sacharoza)<\/div>\n<div class=\"cond-icons\">○ ○ ○<\/div>\n<div class=\"cond-note\">Cząsteczki, brak swobodnych jonów → <strong>nieelektrolit<\/strong><br/>żarówka nie świeci<\/div>\n<\/div>\n<\/div>\n<p class=\"mini-note\">Woda destylowana prawie nie przewodzi; po dodaniu NaOH przewodnictwo gwałtownie rośnie. To klasyczne doświadczenie z listy proponowanej w podstawie.<\/p>\n<\/div>\n<h4 id=\"diss-widget\" class=\"merge-h\">Dysocjacja elektrolityczna zasad<\/h4>\n<p><strong>Dysocjacja elektrolityczna<\/strong> to rozpad związku na jony pod wpływem wody. Rozpuszczona część wodorotlenku dysocjuje w szkolnym modelu praktycznie całkowicie, a liczba jonów OH⁻ w równaniu jest równa liczbie grup OH⁻ we wzorze (indeksowi za nawiasem):<\/p>\n<div class=\"equation-box\">NaOH → Na⁺ + OH⁻<\/div>\n<div class=\"equation-box\">KOH → K⁺ + OH⁻<\/div>\n<div class=\"equation-box\">Ca(OH)₂ → Ca²⁺ + 2OH⁻<\/div>\n<div class=\"equation-box\">Ba(OH)₂ → Ba²⁺ + 2OH⁻<\/div>\n<p class=\"mini-note\">Na E8 wystarczy zapis ze strzałką i jonami. Stany skupienia, równowaga dla trudno rozpuszczalnego Ca(OH)₂ i różnica rozpuszczalność / moc: <a href=\"#moc-rozpuszczalnosc\">§10.3<\/a>.<\/p>\n<p>Zobacz, jak kryształ NaOH rozpada się na jony, a jony otaczają się cząsteczkami wody.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-dysocjacja-v01\"><button type=\"button\" data-che-open-viz=\"n02-dysocjacja-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-dysocjacja-v01',lessonId:'N03'},'*')\"><b>Rozpuszczanie i dysocjacja: NaOH, KOH, Ca(OH)₂, Mg(OH)₂, Cu(OH)₂, Fe(OH)₃ — jony, hydratacja, efekt cieplny<\/b><span>GFX.ions · CHE.HYDROXIDES.dissociation / heat<\/span><\/button><\/div>\n<!-- OPIS: Animacja rozpuszczania i dysocjacji wodorotlenków (NaOH, KOH, Ca(OH)₂, Mg(OH)₂, Cu(OH)₂, Fe(OH)₃): kryształ rozpada się na jony otoczone cząsteczkami wody, widać efekt cieplny (rozpuszczanie NaOH silnie ogrzewa roztwór), a wodorotlenki trudno rozpuszczalne pozostają głównie osadem. Wniosek: zasada to roztwór z jonami OH⁻ powstałymi w dysocjacji. -->\n<h4 class=\"merge-h\">Energia rozpuszczania <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h4>\n<p>Nie każdy wodorotlenek rozpuszcza się tak samo. NaOH wydziela ciepło (egzo), NH₄NO₃ pochłania (endo).<\/p>\n<div class=\"table-wrap table-compact\">\n<table><thead><tr><th>Substancja<\/th><th>ΔH rozpuszczania (kJ/mol)<\/th><th>Efekt<\/th><\/tr><\/thead><tbody><tr data-hy-heat=\"NaOH\"><td>NaOH<\/td><td>−44,5<\/td><td>egzotermiczny — temperatura rośnie<\/td><\/tr><tr data-hy-heat=\"KOH\"><td>KOH<\/td><td>−57,6<\/td><td>egzotermiczny — temperatura rośnie<\/td><\/tr><tr data-hy-heat=\"LiOH\"><td>LiOH<\/td><td>−23,6<\/td><td>egzotermiczny — temperatura rośnie<\/td><\/tr><tr data-hy-heat=\"Ca(OH)2\"><td>Ca(OH)₂<\/td><td>−16,7<\/td><td>egzotermiczny — temperatura rośnie<\/td><\/tr><tr data-hy-heat=\"NH4NO3\"><td>NH₄NO₃<\/td><td>+25,7<\/td><td>endotermiczny — temperatura spada<\/td><\/tr><tr data-hy-heat=\"NaCl\"><td>NaCl<\/td><td>+3,9<\/td><td>endotermiczny — temperatura spada<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">Wartości z silnika (CHE.HYDROXIDES.SOLHEAT). Ile stopni? 4 g NaOH (0,1 mol) w 100 g wody → ok. +10 °C. Symulacja z termometrem: model z tej podsekcji, część „Efekt cieplny”.<\/p>\n<h3 id=\"ph-wskazniki\">6.4 Odczyn i wskaźniki<\/h3>\n<p><strong>Skala pH:<\/strong> pH &lt; 7 — odczyn kwasowy, pH = 7 — obojętny, pH > 7 — zasadowy. Im więcej wolnych jonów OH⁻ w roztworze, tym wyższe pH. Odczyn badamy <strong>wskaźnikami<\/strong> — substancjami, które zmieniają barwę zależnie od pH.<\/p>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Wskaźnik<\/th><th>Kwasowy<\/th><th>Obojętny<\/th><th>Zasadowy<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Fenoloftaleina<\/td><td>bezbarwna<\/td><td>bezbarwna<\/td><td>malinowa (zmiana barwy przy pH ≈ 8,2–10)<\/td><\/tr>\n<tr><td>Oranż metylowy<\/td><td>czerwony (pomarańczowy przy pH ≈ 3,1–4,4)<\/td><td>żółty<\/td><td>żółty<\/td><\/tr>\n<tr><td>Papierek uniwersalny<\/td><td>czerwony / pomarańczowy<\/td><td>żółtozielony<\/td><td>niebieski / granatowy<\/td><\/tr>\n<tr><td>Wywar z czerwonej kapusty (domowy)<\/td><td>czerwony / różowy<\/td><td>fioletowy<\/td><td>niebieskozielony, w silnie zasadowym żółty<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p>Przy <strong>fenoloftaleinie<\/strong> zasada jest malinowa; po zobojętnieniu roztwór odbarwia się. <strong>Oranż metylowy<\/strong>: czerwony w środowisku silnie kwasowym, pomarańczowy w zakresie zmiany barwy (pH ≈ 3,1–4,4), żółty powyżej.<\/p>\n<p>Przesuwaj suwak lub klikaj wartości na skali. Zobaczysz jednocześnie kolor roztworu, barwy trzech wskaźników i przykłady substancji.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"ph-indicators-v03\"><button type=\"button\" data-che-open-viz=\"ph-indicators-v03\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'ph-indicators-v03',lessonId:'N03'},'*')\"><b>Panel pH — skala, barwy wskaźników, przykłady roztworów<\/b><span>Barwy z CHE.COLORS<\/span><\/button><\/div>\n<!-- OPIS: Panel pH: skala od 0 do 14 z zaznaczonym odczynem kwasowym, obojętnym i zasadowym, barwy wskaźników (uniwersalny, fenoloftaleina, oranż metylowy, wywar z czerwonej kapusty) przy różnych pH oraz przykłady codziennych roztworów. Wniosek: odczyn rozpoznaje się wskaźnikiem — fenoloftaleina barwi się na malinowo tylko w odczynie zasadowym. -->\n<p class=\"mini-note\">Woda czysta ma w przybliżeniu pH 7. Woda destylowana przechowywana na powietrzu pochłania CO₂, dlatego jej pH bywa nieco niższe od 7. Zakres zmiany barwy oranżu metylowego: pH ≈ 3,1–4,4.<\/p>\n<h4 class=\"merge-h\">Laboratorium wskaźników — przewidź i sprawdź<\/h4>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-indicatorRack\"><button type=\"button\" data-che-open-viz=\"gfx-scene-indicatorRack\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-indicatorRack',lessonId:'N03'},'*')\"><b>Wskaźnik w siedmiu roztworach — przewidź barwę, potem sprawdź<\/b><span>Scena GFX · barwy wskaźników z CHE.COLORS<\/span><\/button><\/div>\n<!-- OPIS: Siedem probówek z różnymi roztworami i wskaźnikiem: najpierw przewidujesz barwę, potem animacja pokazuje rzeczywiste barwy zależne od odczynu każdego roztworu. Wniosek: barwa wskaźnika zależy od odczynu roztworu, nie od jego wyglądu. -->\n<p class=\"mini-note\"><strong>Uwaga:<\/strong> Cu(OH)₂ w wodzie to zawiesina, nie jednorodny roztwór. Znikoma rozpuszczona część może wpływać na odczyn, ale nie traktuj zawiesiny jak roztworu NaOH.<\/p>\n<h3 id=\"wapno\">6.5 Wodorotlenek wapnia — wapno palone, gaszone, mleko i woda wapienna<\/h3>\n<div class=\"card card-core\">\n<span class=\"card-label\">Schemat — nie myl nazw<\/span>\n<div class=\"lime-flow\">\n<div class=\"lime-box\"><strong>Wapno palone<\/strong>CaO<br/><span style=\"font-size:12px;color:var(--text-muted)\">tlenek wapnia<\/span><\/div>\n<div class=\"lime-arrow\">+ H₂O →<\/div>\n<div class=\"lime-box\"><strong>Wapno gaszone<\/strong>Ca(OH)₂(s)<br/><span style=\"font-size:12px;color:var(--text-muted)\">wodorotlenek stały<\/span><\/div>\n<div class=\"lime-arrow\">+ H₂O →<\/div>\n<div class=\"lime-box\"><strong>Mleko wapienne<\/strong><br/><span style=\"font-size:12px;color:var(--text-muted)\">zawiesina Ca(OH)₂<\/span><\/div>\n<div class=\"lime-arrow\">po odstaniu i zlaniu cieczy →<\/div>\n<div class=\"lime-box\"><strong>Woda wapienna<\/strong><br/><span style=\"font-size:12px;color:var(--text-muted)\">klarowny roztwór Ca(OH)₂<\/span><\/div>\n<\/div>\n<ul>\n<li><strong>Mleko wapienne<\/strong> — mętna zawiesina Ca(OH)₂ w wodzie (dużo nierozpuszczonego osadu).<\/li>\n<li><strong>Woda wapienna<\/strong> — klarowny, nasycony roztwór Ca(OH)₂ (po odstaniu i zlaniu znad osadu). Jej pH wynosi około <strong>12,4<\/strong>.<\/li>\n<li><strong>Wykrywanie CO₂ (E8):<\/strong> <span class=\"formula\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O<\/span>. Woda wapienna mętnieje po przepuszczeniu przez nią odpowiedniej ilości CO₂, ponieważ powstaje osad CaCO₃. <span class=\"level-badge level-extra\">ROZSZERZENIE<\/span> Przy dużym nadmiarze CO₂ osad może się ponownie rozpuszczać, tworząc rozpuszczalny wodorowęglan wapnia: <span class=\"formula\" data-rx=\"caco3Co2H2o\">CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂<\/span>.<\/li>\n<li><strong>Zaprawa wapienna:<\/strong> twardnieje na powietrzu: <span class=\"formula\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃ + H₂O<\/span>.<\/li>\n<\/ul>\n<div class=\"table-wrap table-compact\" style=\"margin-top:12px;\">\n<table>\n<thead><tr><th>Cecha<\/th><th>Mleko wapienne<\/th><th>Woda wapienna<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Stan<\/td><td>zawiesina (mętna)<\/td><td>roztwór (klarowny)<\/td><\/tr>\n<tr><td>Skład<\/td><td>dużo nierozpuszczonego Ca(OH)₂<\/td><td>nasycony roztwór Ca(OH)₂<\/td><\/tr>\n<tr><td>Zastosowanie<\/td><td>bielenie, zaprawa<\/td><td>wykrywanie CO₂<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<p class=\"mini-note\">Dlaczego woda wapienna i mleko wapienne to ta sama substancja w różnych układach (równowaga osad ⇌ jony) — <a href=\"#moc-rozpuszczalnosc\">§10.3<\/a>. Otrzymywanie CaO + H₂O krok po kroku — <a href=\"#metody\">§7.1<\/a>; BHP gaszenia wapna — <a href=\"#bhp\">§9.2<\/a>.<\/p>\n<\/section>\n<section id=\"otrzymywanie\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Otrzymywanie wodorotlenków <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"metody\">7.1 Trzy szkolne metody i ich warunki<\/h3>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-otrzymywanie-v01\"><button type=\"button\" data-che-open-viz=\"n02-otrzymywanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-otrzymywanie-v01',lessonId:'N03'},'*')\"><b>Otrzymywanie wodorotlenków — trzy metody, „Jak otrzymać…?” i mapa przemian<\/b><span>Zlewka GFX.rx · reguły CHE.HYDROXIDES.obtain (kiedy metoda działa, a kiedy nie)<\/span><\/button><\/div>\n<!-- OPIS: Otrzymywanie wodorotlenków trzema metodami w zlewce: metal aktywny z wodą, tlenek metalu z wodą, strącanie z soli roztworem zasady; model mówi, kiedy dana metoda działa, a kiedy nie (np. CuO nie reaguje z wodą), i pokazuje mapę przemian. Wniosek: metodę dobiera się do aktywności metalu i rozpuszczalności produktu. -->\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Otrzymywanie — trzy modele, ale z warunkami<\/h4>\n<ol>\n<li><strong>Tlenek zasadowy + woda<\/strong> — np. Na₂O + H₂O → 2NaOH. Nie każdy tlenek metalu reaguje z wodą w ten sposób.<\/li>\n<li><strong>Aktywny metal + woda<\/strong> — np. 2Na + 2H₂O → 2NaOH + H₂↑. Reakcja zależy od metalu i warunków. Wapń reaguje z zimną wodą spokojniej niż sód (Ca + 2H₂O → Ca(OH)₂ + H₂↑), magnez — dopiero z gorącą wodą (Mg + 2H₂O → Mg(OH)₂ + H₂↑).<\/li>\n<li><strong>Sól + zasada<\/strong> — np. FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl, jeśli powstający wodorotlenek jest dostatecznie trudno rozpuszczalny. Ca(OH)₂ wytrąca się w ten sposób tylko z roztworów stężonych, bo jest trudno, ale nie praktycznie nierozpuszczalny.<\/li>\n<\/ol>\n<p class=\"mini-note\">Typowe substraty: Na₂O, K₂O, CaO, BaO (metoda 1); Na, K, Ca (metoda 2); sole Cu²⁺, Fe²⁺, Fe³⁺, Mg²⁺, Al³⁺, Zn²⁺ + NaOH lub KOH (metoda 3).<\/p>\n<\/div>\n<div id=\"uwaga-tlenki\" class=\"card card-warning\">\n<span class=\"card-label\">Ważne rozróżnienie<\/span>\n<p><strong>Określenie „tlenek zasadowy” nie oznacza automatycznie, że tlenek reaguje z wodą.<\/strong><\/p>\n<p>Przykładowo <span class=\"formula\">CuO<\/span> reaguje z kwasami, ale nie reaguje z wodą. <span class=\"formula\">MgO<\/span> reaguje z wodą bardzo powoli, dlatego w zadaniach należy korzystać z podanej tabeli lub znanych przykładów.<\/p>\n<p>W szkole najczęściej spotkasz reakcje z wodą dla tlenków metali aktywnych: <span class=\"formula\">Na₂O<\/span>, <span class=\"formula\">K₂O<\/span>, <span class=\"formula\">CaO<\/span>, <span class=\"formula\">BaO<\/span>.<\/p>\n<\/div>\n<h4 style=\"margin:14px 0 6px\">Równanie krok po kroku — CaO + H₂O<\/h4>\n<div class=\"equation-box\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/div>\n<p class=\"mini-note\">Bilans atomów: Ca 1 = 1 · O 1 + 1 = 2 · H 2 = 2 ✓. Most N01 → N02: tlenek zasadowy + woda = wodorotlenek (gdy tlenek z wodą reaguje).<\/p>\n<h3 id=\"stracanie\">7.2 Strącanie wodorotlenków — barwy osadów<\/h3>\n<p>Metoda 3 to <strong>reakcja strąceniowa<\/strong>: kation metalu z roztworu soli łączy się z jonami OH⁻ z zasady i powstaje trudno rozpuszczalny osad. Barwa osadu pomaga rozpoznać kation.<\/p>\n<div class=\"equation-box\" data-rx=\"cuso4Naoh\">CuSO₄ + 2NaOH → Cu(OH)₂↓ + Na₂SO₄<\/div>\n<p class=\"mini-note\">niebieski, galaretowaty osad — praktycznie nierozpuszczalny<\/p>\n<div class=\"equation-box\" data-rx=\"fecl3Naoh\">FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl<\/div>\n<p class=\"mini-note\">rdzawobrunatny osad — w roztworze nad osadem prawie nie ma OH⁻, więc odczyn nie jest „jak po NaOH”. Animacja cząsteczkowa: <a href=\"#ion-lab\">§12<\/a>; zapis jonowy: <a href=\"#rownania-jonowe\">§13<\/a>.<\/p>\n<div class=\"equation-box\" data-rx=\"alcl3Naoh\">AlCl₃ + 3NaOH → Al(OH)₃↓ + 3NaCl<\/div>\n<p class=\"mini-note\">biały, galaretowaty osad; w nadmiarze NaOH roztwarza się (amfoteryczność, <a href=\"#amfoterycznosc\">§14<\/a>)<\/p>\n<div class=\"equation-box\">MgCl₂ + 2NaOH → Mg(OH)₂↓ + 2NaCl<\/div>\n<p class=\"mini-note\">biały osad — tak w praktyce szkolnej otrzymuje się Mg(OH)₂<\/p>\n<div class=\"equation-box\">FeSO₄ + 2NaOH → Fe(OH)₂↓ + Na₂SO₄<\/div>\n<p class=\"mini-note\">zielonkawy osad, który na powietrzu brunatnieje (niżej)<\/p>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Ciekawostka — Fe(OH)₂<\/span>\n<p><span class=\"formula\">Fe(OH)₂<\/span> jest zwykle opisywany jako osad zielonkawy, który w obecności tlenu z powietrza może utleniać się do brunatnego <span class=\"formula\">Fe(OH)₃<\/span>. Nie jest to wymagane na E8 — traktuj jako ciekawostkę.<\/p>\n<\/div>\n<\/section>\n<section id=\"reakcje\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Reakcje wodorotlenków <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"zobojetnianie\">8.1 Zobojętnianie<\/h3>\n<p>Zobojętnianie: kwas + zasada → sól + woda. Jony H⁺ i OH⁻ łączą się w wodę.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-zobojetnianie-v01\"><button type=\"button\" data-che-open-viz=\"n02-zobojetnianie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-zobojetnianie-v01',lessonId:'N03'},'*')\"><b>Zobojętnianie — licznik moli, pH, wskaźniki, jony H⁺ + OH⁻ → H₂O i krzywa pH<\/b><span>Zastępuje animację i symulator zobojętniania · CHE.HYDROXIDES.neutral (Kw), GFX.ions<\/span><\/button><\/div>\n<!-- OPIS: Zobojętnianie: do zasady dodaje się porcjami kwas; licznik moli pokazuje ubywanie jonów OH⁻ i przybywanie H₂O, zmienia się pH i barwa wskaźnika, a krzywa pH opada gwałtownie w punkcie zobojętnienia. Wniosek: H⁺ + OH⁻ → H₂O — w punkcie zobojętnienia ilości kwasu i zasady są równoważne. -->\n<p>Postęp zobojętniania śledzimy wskaźnikiem: fenoloftaleina odbarwia się, gdy w roztworze znika nadmiar OH⁻ (barwy wskaźników — <a href=\"#ph-wskazniki\">§6.4<\/a>).<\/p>\n<div class=\"card card-core\">\n<span class=\"card-label\">Równania zobojętniania<\/span>\n<div class=\"equation-box\" data-rx=\"hclNaOH\">NaOH(aq) + HCl(aq) → NaCl(aq) + H₂O(l)<\/div>\n<div class=\"equation-box\" data-rx=\"kohHno3\">KOH(aq) + HNO₃(aq) → KNO₃(aq) + H₂O(l)<\/div>\n<div class=\"equation-box\" data-rx=\"caoh2Hcl\">Ca(OH)₂(aq) + 2HCl(aq) → CaCl₂(aq) + 2H₂O(l)<\/div>\n<div class=\"equation-box\" data-rx=\"h2so4Naoh\">2NaOH(aq) + H₂SO₄(aq) → Na₂SO₄(aq) + 2H₂O(l)<\/div>\n<div class=\"equation-box\" data-rx=\"baoh2H2so4\">Ba(OH)₂(aq) + H₂SO₄(aq) → BaSO₄↓ + 2H₂O(l)<\/div>\n<div class=\"equation-box\" data-rx=\"cuoh2H2so4\">Cu(OH)₂(s) + H₂SO₄(aq) → CuSO₄(aq) + 2H₂O(l)<\/div>\n<div class=\"equation-box\" data-rx=\"aloh3Hcl\">Al(OH)₃(s) + 3HCl(aq) → AlCl₃(aq) + 3H₂O(l)<\/div>\n<p class=\"mini-note\">Kontrola: liczba OH⁻ z zasady = liczba H⁺ z kwasu.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Uwaga o Ba(OH)₂ + H₂SO₄<\/span>\n<p>Zachodzą <strong>dwa procesy naraz<\/strong>: H⁺ + OH⁻ → H₂O (zobojętnianie) oraz Ba²⁺ + SO₄²⁻ → BaSO₄↓ (strącanie). Dlatego roztwór mętnieje.<\/p>\n<\/div>\n<h4 class=\"merge-h\">Licznik moli<\/h4>\n<p>Dolewaj kwas do zasady i obserwuj, kiedy nastąpi zobojętnienie. To stechiometria w praktyce.<\/p>\n<p class=\"mini-note\">Licznik moli jest w modelu z tej podsekcji: n(OH⁻) na początku, n(H⁺) dodane, nadmiar, pH i objętość w punkcie równoważnikowym. <b>Założenia:<\/b> mocny kwas + mocna zasada, pełna dysocjacja, pH z iloczynu jonowego wody K<sub>w<\/sub> = 10⁻¹⁴, bez aktywności jonów i zmian temperatury. Objętość nie zmienia bilansu moli — zmienia stężenia i pH.<\/p>\n<p class=\"mini-note\">Zapis jonowy zobojętniania (jony widzowe, równanie skrócone H⁺ + OH⁻ → H₂O): <a href=\"#rownania-jonowe\">§13<\/a>.<\/p>\n<h3 id=\"co2-rozklad\">8.2 Reakcja z CO₂ i rozkład termiczny<\/h3>\n<div class=\"card card-basic\">\n<p><strong>Zasady reagują z tlenkami kwasowymi<\/strong>, np. z CO₂ — powstaje sól i woda:<\/p>\n<div class=\"equation-box\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O<\/div>\n<div class=\"equation-box\">2NaOH + CO₂ → Na₂CO₃ + H₂O<\/div>\n<p>Pierwsza reakcja to wykrywanie CO₂ wodą wapienną i twardnienie zaprawy (<a href=\"#wapno\">§6.5<\/a>). Druga wyjaśnia, dlaczego NaOH przechowuje się szczelnie: oprócz wilgoci pochłania też CO₂ z powietrza.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Rozkład termiczny<\/span>\n<span class=\"level-badge level-understand\">ROZUMIENIE<\/span>\n<p>Trudno rozpuszczalne wodorotlenki podczas ogrzewania rozkładają się na tlenek i wodę, np. <span class=\"formula\">Cu(OH)₂ → CuO + H₂O<\/span> (niebieski osad czernieje), <span class=\"formula\">2Fe(OH)₃ → Fe₂O₃ + 3H₂O<\/span>, <span class=\"formula\">Mg(OH)₂ → MgO + H₂O<\/span>. Wodorotlenki litowców (NaOH, KOH) w zwykłych warunkach w ten sposób się nie rozkładają — topią się.<\/p>\n<\/div>\n<h3 id=\"mapa-przemian\">8.3 Mapa przemian i reaktor<\/h3>\n<div class=\"card card-core\">\n<span class=\"card-label\">Mapa przemian<\/span>\n<ul>\n<li><strong>tlenek zasadowy + woda<\/strong> → wodorotlenek (tylko tlenki metali aktywnych)<\/li>\n<li><strong>metal aktywny + woda<\/strong> → wodorotlenek + H₂↑<\/li>\n<li><strong>sól metalu + zasada<\/strong> → wodorotlenek↓ + sól (gdy wodorotlenek trudno rozpuszczalny)<\/li>\n<li><strong>wodorotlenek rozpuszczalny + woda<\/strong> → zasada (roztwór, jony OH⁻)<\/li>\n<li><strong>kwas + zasada<\/strong> → sól + woda<\/li>\n<li><strong>ogrzewanie<\/strong> wodorotlenku (poza litowcami) → tlenek + woda (<a href=\"#co2-rozklad\">§8.2<\/a>)<\/li>\n<\/ul>\n<p class=\"mini-note\">Interaktywna mapa dla wybranego wodorotlenku (z równaniami z silnika): model z <a href=\"#metody\">§7.1<\/a>, zakładka „Mapa przemian”.<\/p>\n<\/div>\n<p id=\"reactor\"><strong>Reaktor:<\/strong> Wybierz dwa substraty — sprawdź, czy zachodzi reakcja i jaka.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-reaktor-v01\"><button type=\"button\" data-che-open-viz=\"n02-reaktor-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-reaktor-v01',lessonId:'N03'},'*')\"><b>Reaktor: wodorotlenek + odczynnik — przewiduj, potem sprawdź<\/b><span>CHE.HYDROXIDES.predict · H₂O, HCl, HNO₃, H₂SO₄, NaOH, CO₂, ogrzewanie, powietrze<\/span><\/button><\/div>\n<!-- OPIS: Reaktor przewidywania: wybierasz wodorotlenek i odczynnik (woda, HCl, HNO₃, H₂SO₄, NaOH, CO₂, ogrzewanie, powietrze), zapisujesz przewidywanie, potem model pokazuje wynik, produkty i równanie. Wniosek: reakcje wodorotlenków da się przewidzieć z ich rozpuszczalności i charakteru. -->\n<\/section>\n<section id=\"zastosowania\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Zastosowania, BHP i życie codzienne <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<h3 id=\"zastosowania-lista\">9.1 Zastosowania<\/h3>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Zastosowania (PP)<\/span>\n<ul>\n<li><strong>NaOH:<\/strong> produkcja mydła, udrażnianie rur, przemysł papierniczy i chemiczny, oczyszczanie spalin.<\/li>\n<li><strong>KOH:<\/strong> mydła potasowe (płynne), baterie alkaliczne, laboratoryjnie.<\/li>\n<li><strong>Ca(OH)₂:<\/strong> budownictwo (zaprawa), rolnictwo (odkwaszanie gleby — wapnowanie), bielenie pni drzew i ścian, uzdatnianie wody, wykrywanie CO₂ (woda wapienna).<\/li>\n<li><strong>Al(OH)₃:<\/strong> leki na zgagę — neutralizuje nadmiar kwasu solnego w żołądku (Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O).<\/li>\n<li><strong>Mg(OH)₂:<\/strong> zawiesina „mleko magnezowe” — środek zobojętniający kwas żołądkowy i przeczyszczający; dodatek ognioodporny do tworzyw.<\/li>\n<\/ul>\n<\/div>\n<h3 id=\"bhp\">9.2 BHP — NaOH, KOH, CaO i związki baru<\/h3>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Ochrona<\/span>\n<p><strong>Ochrona:<\/strong> okulary ochronne i odpowiednie rękawice; substancje są silnie żrące. <strong>NaOH i KOH powodują oparzenia chemiczne skóry i oczu<\/strong> — nie dotykaj ich gołymi rękami; przechowuj w szczelnych naczyniach.<\/p>\n<\/div>\n<div class=\"rule-box\" style=\"background:var(--c-warn-bg);border-color:var(--c-warn-line)\">\n<h4 class=\"merge-h\">Rozpuszczanie stałego NaOH / KOH<\/h4>\n<p><strong>Okulary ochronne:<\/strong> stały NaOH/KOH oraz ich stężone roztwory są żrące.<\/p>\n<ol>\n<li>Przygotuj wodę.<\/li>\n<li>Dodawaj stały NaOH/KOH <strong>małymi porcjami do wody<\/strong>.<\/li>\n<li>Mieszaj i kontroluj temperaturę.<\/li>\n<li>Nie dodawaj wody do dużej porcji stałego NaOH/KOH.<\/li>\n<li>Po kontakcie ze skórą lub oczami natychmiast płucz dużą ilością wody i zgłoś zdarzenie nauczycielowi/opiekunowi, zgodnie z procedurą pracowni.<\/li>\n<\/ol>\n<p class=\"mini-note\">Powód: rozpuszczanie jest silnie egzotermiczne i może powodować gwałtowne nagrzanie oraz rozprysk.<\/p>\n<\/div>\n<div class=\"rule-box\" style=\"background:var(--c-warn-bg);border-color:var(--c-warn-line)\">\n<h4 class=\"merge-h\">Gaszenie wapna: CaO + H₂O<\/h4>\n<p>Doświadczenie wykonuje nauczyciel lub osoba prowadząca doświadczenie zgodnie z procedurą pracowni. CaO dodaje się ostrożnie, małymi porcjami; reakcja jest silnie egzotermiczna. Nie pochylaj się nad naczyniem i nie dotykaj gorącego układu. Nie dotykaj CaO mokrymi rękami — drobne cząstki Ca(OH)₂ unoszące się z parą są żrące dla oczu.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Inne zagrożenia<\/span>\n<ul>\n<li><strong>Związki baru:<\/strong> jony Ba²⁺ są toksyczne — Ba(OH)₂ nie jest stosowany w doświadczeniach uczniowskich.<\/li>\n<li><strong>Sód i potas:<\/strong> reagują z wodą gwałtownie, wydziela się palny wodór — wyłącznie pokaz nauczyciela, bardzo mała porcja metalu, osłona.<\/li>\n<li><strong>Środki do udrażniania rur<\/strong> zawierają NaOH — używaj w rękawicach, nie mieszaj z innymi środkami czystości (zwłaszcza kwasowymi).<\/li>\n<\/ul>\n<\/div>\n<h3 id=\"zycie\">9.3 Z życia codziennego — pytania<\/h3>\n<div class=\"card\">\n<p><strong>1. Dlaczego NaOH jest w środkach do udrażniania rur?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p>NaOH jest silnie
