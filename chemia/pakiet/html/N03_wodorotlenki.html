żrący i rozkłada tłuszcze oraz białka (zmydlanie). <strong>BHP:<\/strong> bardzo niebezpieczny.<\/p>\n<\/details>\n<\/div>\n<div class=\"card\">\n<p><strong>2. Dlaczego woda wapienna mętnieje przy dmuchaniu?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p><span class=\"formula\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O<\/span>. Trudno rozpuszczalny CaCO₃ tworzy osad. Przy dużym nadmiarze CO₂ osad może się ponownie rozpuszczać (powstaje Ca(HCO₃)₂).<\/p>\n<\/details>\n<\/div>\n<div class=\"card\">\n<p><strong>3. Dlaczego mydło ma odczyn lekko zasadowy?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p>Mydło to sól słabego kwasu i mocnej zasady. W wodzie ulega hydrolizie — powstają jony OH⁻.<\/p>\n<\/details>\n<\/div>\n<div class=\"card\">\n<p><strong>4. Dlaczego preparaty na zgagę zawierają Al(OH)₃ lub Mg(OH)₂?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p>Neutralizują HCl w żołądku: <span class=\"formula\" data-rx=\"aloh3Hcl\">Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O<\/span>. Nie są tak żrące jak NaOH.<\/p>\n<\/details>\n<\/div>\n<div class=\"card\">\n<p><strong>5. Dlaczego wapno palone gaśnie po zalaniu wodą?<\/strong><\/p>\n<details class=\"answer\"><summary>Model odpowiedzi<\/summary>\n<p><span class=\"formula\">CaO + H₂O → Ca(OH)₂ + ciepło<\/span>. Reakcja egzotermiczna. <strong>BHP:<\/strong> nie dotykać mokrymi rękami.<\/p>\n<\/details>\n<\/div>\n<p class=\"mini-note\">Czy woda amoniakalna to wodorotlenek? — <a href=\"#zasada-oh\">§10.2<\/a>.<\/p>\n<\/section>\n<section id=\"model\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Model bez skrótów — cztery pytania o wodorotlenek <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<p class=\"lead\"><strong>Cel korekty:<\/strong> oddzielić budowę substancji, jej rozpuszczalność, dysocjację i odczyn. Te cztery rzeczy są powiązane, ale nie są tym samym.<\/p>\n<h3 id=\"cztery-pytania\">10.1 Cztery pytania zamiast jednego hasła „zasada”<\/h3>\n<div class=\"rule-box\">\n<ol>\n<li><strong>Co to jest?<\/strong> Wodorotlenek metalu to związek zawierający kation metalu i aniony OH⁻; szkolny wzór zapisu składu ma postać M(OH)<sub>n<\/sub>.<\/li>\n<li><strong>Czy rozpuszcza się w wodzie?<\/strong> To pytanie o ilość substancji, która przechodzi do roztworu.<\/li>\n<li><strong>Co dzieje się z częścią rozpuszczoną?<\/strong> Dla typowych dobrze rozpuszczalnych wodorotlenków szkolny model zakłada praktycznie całkowitą dysocjację: NaOH → Na⁺ + OH⁻.<\/li>\n<li><strong>Jaki jest odczyn roztworu?<\/strong> Jeśli w roztworze jest zwiększone stężenie OH⁻, roztwór ma odczyn zasadowy.<\/li>\n<\/ol>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Pytanie<\/th><th>Co sprawdzamy?<\/th><th>Przykład<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Co to jest?<\/td><td>budowa związku<\/td><td>Ca(OH)₂<\/td><\/tr>\n<tr><td>Czy się rozpuszcza?<\/td><td>ile substancji przechodzi do roztworu<\/td><td>Ca(OH)₂ — ograniczenie rozpuszczalności<\/td><\/tr>\n<tr><td>Co jest w roztworze?<\/td><td>jony rozpuszczonej części<\/td><td>Ca²⁺ i OH⁻<\/td><\/tr>\n<tr><td>Jaki jest odczyn?<\/td><td>związany ze stężeniem jonów w roztworze<\/td><td>woda wapienna ma odczyn zasadowy<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p><strong>Wniosek:<\/strong> „trudno rozpuszczalny” nie znaczy „słaba zasada” w tym samym sensie co przy kwasach. Najpierw trzeba ustalić, ile substancji jest w roztworze, a dopiero potem rozpatrywać zachowanie rozpuszczonej części.<\/p>\n<\/div>\n<h3 id=\"zasada-oh\">10.2 Wodorotlenek ≠ zasada ≠ OH⁻; amoniak i NH₄OH<\/h3>\n<div class=\"rule-box\" style=\"background:var(--c-warn-bg);border-color:var(--c-warn-line)\">\n<ul>\n<li><strong>OH⁻<\/strong> jest konkretnym anionem wodorotlenkowym.<\/li>\n<li><strong>Wodorotlenek<\/strong> jest związkiem chemicznym, np. NaOH(s), Ca(OH)₂(s), Cu(OH)₂(s).<\/li>\n<li><strong>Roztwór zasadowy<\/strong> zawiera nadmiar jonów OH⁻ względem czystej wody.<\/li>\n<li>W szerszym ujęciu <strong>zasada nie musi być wodorotlenkiem<\/strong>: NH₃ jest zasadą Brønsteda, bo może przyjąć proton, tworząc NH₄⁺.<\/li>\n<\/ul>\n<p>Szkolny skrót „zasada = rozpuszczalny wodorotlenek” jest użyteczny na poziomie E8, ale nie jest pełną definicją chemiczną.<\/p>\n<\/div>\n<div class=\"rule-box\">\n<b>Uwaga o definicji szkolnej:<\/b> powyższe rozróżnienie to <strong>definicja szkolna<\/strong> (Arrheniusa). W szerszym ujęciu chemicznym (liceum, teoria Brønsteda) zasadami są także inne substancje zdolne do przyjmowania protonów (H⁺) — np. amoniak NH₃. Historia pojęcia i teoria Brønsteda: <a href=\"#ambitny\">Dodatek B<\/a>.\n      <\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Amoniak i zapis NH₄OH — pułapka E8<\/span>\n<p><strong>Amoniak NH₃<\/strong> i woda amoniakalna dają odczyn zasadowy, ale NH₃ <em>nie jest wodorotlenkiem<\/em> (brak metalu i grupy OH⁻ we wzorze substancji). To zasada w sensie Brønsteda / odczynu roztworu — szczegóły w <a href=\"#ambitny\">Dodatku B<\/a>.<\/p>\n<p><span class=\"formula\">NH₄OH<\/span> można spotkać jako tradycyjny skrót. Dokładniejszy model wodnego amoniaku:<\/p>\n<div class=\"equation-box\"><strong>NH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq)<\/strong><\/div>\n<p>Woda amoniakalna to roztwór <span class=\"formula\">NH₃<\/span> w wodzie. Część cząsteczek reaguje: <span class=\"formula\">NH₃ + H₂O ⇌ NH₄⁺ + OH⁻<\/span>. Powstają jony OH⁻, więc odczyn jest zasadowy, ale wzór „NH₄OH” to uproszczenie szkolne — w rzeczywistości nie ma stabilnej cząsteczki NH₄OH jak w NaOH. Na E8 wystarczy: roztwór amoniaku ma odczyn zasadowy i reaguje z kwasami.<\/p>\n<\/div>\n<h3 id=\"moc-rozpuszczalnosc\">10.3 Rozpuszczalność, dysocjacja i moc — przykład Ca(OH)₂<\/h3>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Rozpuszczalny ≠ mocny<\/span>\n<p><strong>Rozpuszczalność<\/strong> mówi, ile substancji przechodzi do wody. <strong>Moc zasady<\/strong> mówi, jak duża część rozpuszczonej substancji tworzy jony. To różne pojęcia.<\/p>\n<p>Na poziomie klasy 8 najważniejsze jest, że dobrze rozpuszczalne wodorotlenki dają roztwory zawierające dużo jonów OH⁻. Ca(OH)₂ jest słabo rozpuszczalny, ale jego rozpuszczona część dysocjuje praktycznie całkowicie — dlatego woda wapienna ma wyraźny odczyn zasadowy.<\/p>\n<\/div>\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Model rozpuszczania Ca(OH)₂ — nie myl osadu z roztworem<\/h4>\n<p>Ca(OH)₂ jest trudno rozpuszczalny. Ustala się równowaga między fazą stałą a jonami w roztworze:<\/p>\n<div class=\"equation-box\"><strong>Ca(OH)₂(s) ⇌ Ca²⁺(aq) + 2OH⁻(aq)<\/strong><\/div>\n<p><strong>Woda wapienna<\/strong> to klarowny, nasycony roztwór zawierający rozpuszczoną część Ca(OH)₂. <strong>Mleko wapienne<\/strong> to zawiesina, w której pozostaje dużo fazy stałej. Nie są to dwie różne substancje.<\/p>\n<\/div>\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Dysocjacja a zapis wzoru<\/h4>\n<p>Nawias w <strong>Ca(OH)₂<\/strong> oznacza, że jednostka składu zawiera dwa aniony OH⁻. Po rozpuszczeniu zapisujemy:<\/p>\n<div class=\"equation-box\"><strong>Ca(OH)₂(aq) → Ca²⁺(aq) + 2OH⁻(aq)<\/strong><\/div>\n<p>To nie oznacza, że w wodzie pływają „cząsteczki Ca(OH)₂” w takim samym sensie jak pojedyncze cząsteczki substancji kowalencyjnej. W szkolnym modelu dla rozpuszczonej soli/wodorotlenku śledzimy przede wszystkim jony.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Iloczyn rozpuszczalności — skąd pH 12,4 wody wapiennej? <span class=\"adv-tag\">poziom LO / akademicki<\/span><\/summary><div class=\"adv-body\">\n<p>Dla osadu M(OH)ₙ(s) ⇌ Mⁿ⁺ + n OH⁻: K<sub>sp<\/sub> = [Mⁿ⁺]·[OH⁻]ⁿ. Rozpuszczalność molowa s = (K<sub>sp<\/sub>/nⁿ)<sup>1/(n+1)<\/sup>, [OH⁻] = n·s, pH = 14 + log[OH⁻].<\/p>\n<div class=\"table-wrap table-compact\">\n<table><thead><tr><th>Wodorotlenek<\/th><th>K<sub>sp<\/sub> (25 °C)<\/th><th>s (mol/dm³)<\/th><th>pH nasyconego<\/th><\/tr><\/thead><tbody><tr><td>Ca(OH)₂<\/td><td>5,5e-06<\/td><td>1,1e-02<\/td><td>12,3<\/td><\/tr><tr><td>Mg(OH)₂<\/td><td>5,6e-12<\/td><td>1,1e-04<\/td><td>10,3<\/td><\/tr><tr><td>Fe(OH)₂<\/td><td>4,9e-17<\/td><td>2,3e-06<\/td><td>8,7<\/td><\/tr><tr><td>Fe(OH)₃<\/td><td>2,8e-39<\/td><td>1,0e-10<\/td><td>7,0 (≈ obojętny)<\/td><\/tr><tr><td>Cu(OH)₂<\/td><td>2,2e-20<\/td><td>1,8e-07<\/td><td>7,5 (≈ obojętny)<\/td><\/tr><tr><td>Zn(OH)₂<\/td><td>3,0e-17<\/td><td>2,0e-06<\/td><td>8,6<\/td><\/tr><tr><td>Al(OH)₃<\/td><td>1,3e-33<\/td><td>2,6e-09<\/td><td>7,0 (≈ obojętny)<\/td><\/tr><tr><td>Ni(OH)₂<\/td><td>5,5e-16<\/td><td>5,2e-06<\/td><td>9,0<\/td><\/tr><tr><td>Mn(OH)₂<\/td><td>2,0e-13<\/td><td>3,7e-05<\/td><td>9,9<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">Ca(OH)₂: s ≈ 0,011 mol/dm³ → pH ≈ 12,35 (pomiar ≈ 12,4); Mg(OH)₂: pH ≈ 10,4 (mleko magnezowe). Dla Fe(OH)₃ czy Cu(OH)₂ jonów OH⁻ z osadu jest mniej niż w czystej wodzie — dlatego zawiesina nie zmienia odczynu. Wartości: CHE.HYDROXIDES.KSP / satpH.<\/p>\n<\/div><\/details>\n<\/section>\n<section id=\"modele-budowy\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Modele budowy — rysunek szkolny a sieć jonowa <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<h3 id=\"model3d\">11.1 Dwa szkolne sposoby rysowania: NaOH, Ca(OH)₂, Al(OH)₃<\/h3>\n<p>W polskich podręcznikach kl. 8 wodorotlenki rysuje się jak poniżej: <strong>ciągła kreska<\/strong> = wiązanie kowalencyjne spolaryzowane O–H w grupie OH⁻, <strong>przerywana<\/strong> = oddziaływanie elektrostatyczne o charakterze jonowym między kationem metalu a jonami OH⁻. Rysunek jest modelem poglądowym, a nie dokładną geometrią struktury krystalicznej.<\/p>\n<div class=\"widget\">\n<h4>Porównanie struktury (styl podręcznikowy)<\/h4>\n<p class=\"widget-hint\">NaOH: jedna grupa OH⁻. Ca(OH)₂: dwie grupy OH⁻ — zapis składu związku, nie wzór strukturalny H–O–Ca–O–H.<\/p>\n<div style=\"display:grid;grid-template-columns:1fr;gap:14px;\">\n<div style=\"background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center;\">\n<div style=\"font-size:12px;font-weight:800;color:var(--text-muted);margin-bottom:8px;\">NaOH — wodorotlenek sodu<\/div>\n<div class=\"svgx\"><span>Na<\/span><span>O<\/span><span>H<\/span><span>Na⁺<\/span><span>OH⁻<\/span><span>- - - oddziaływanie jonowe —— kowalencyjne O–H<\/span><\/div>\n<p class=\"mini-note\">Ten sam układ (kation, grupy OH⁻, nawias) pokazuje interaktywnie model „Wzór wodorotlenku” w <a href=\"#wzor-ogolny\">§5.2<\/a>: modele A, B i jony.<\/p>\n<\/div>\n<div style=\"background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center;\">\n<div style=\"font-size:12px;font-weight:800;color:var(--text-muted);margin-bottom:8px;\">Ca(OH)₂ — wodorotlenek wapnia (model poglądowy)<\/div>\n<div class=\"svgx\"><span>H<\/span><span>O<\/span><span>Ca<\/span><span>OH⁻<\/span><span>Ca²⁺<\/span><span>zapis poglądowy: H–O–Ca–O–H<\/span><\/div>\n<\/div>\n<div style=\"background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center;grid-column:1/-1;\">\n<div style=\"font-size:12px;font-weight:800;color:var(--text-muted);margin-bottom:8px;\">Widok poglądowy składu — Ca(OH)₂ i Al(OH)₃ (nie przedstawia rzeczywistej geometrii kryształu)<\/div>\n<div style=\"display:grid;grid-template-columns:1fr;gap:10px;\">\n<div id=\"modelBrCa\"><\/div>\n<div id=\"modelBrAl\"><\/div>\n<\/div>\n<p class=\"mini-note\" style=\"margin-top:8px;\">Ramiona M···O mogą iść pod kątem; <strong>grupa O–H zawsze w poziomie<\/strong> (jak w podręczniku). To <strong>model szkolny<\/strong> (ZPE / podręczniki kl. 8). W ciele stałym wodorotlenek to <strong>sieć jonów<\/strong>, a nie pojedyncza „cząsteczka” HO–M–OH.<\/p>\n<\/div>\n<\/div>\n<div class=\"bond-legend\">\n<span><i class=\"bl-solid\"><\/i> wiązanie kowalencyjne O–H wewnątrz grupy OH⁻<\/span>\n<span><i class=\"bl-dash\"><\/i> oddziaływanie elektrostatyczne (jonowe) kation···OH⁻<\/span>\n<\/div>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Model A — szkolny, po prawej<\/span>\n<p>Najczęściej spotykany w podręcznikach. Grupy <span class=\"formula\">OH⁻<\/span> rysuje się <strong>po jednej stronie<\/strong> kationu, zwykle po prawej. <strong>Linia od metalu do O<\/strong> jest przerywana, a <strong>linia od O do H<\/strong> jest ciągła.<\/p>\n<div class=\"formula-lg\">Al(OH)₃<\/div>\n<div class=\"svgx\"><span>O<\/span><span>H<\/span><span>Al<\/span><\/div>\n<p><strong>To jest model szkolny (A)<\/strong> — dobry do zrozumienia, ile jest grup OH⁻. Nie jest dokładną geometrią kryształu.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Model B — przestrzenny, bez udawania wzoru strukturalnego<\/span>\n<p>Jeżeli pokazujemy grupy <span class=\"formula\">OH⁻<\/span> po obu stronach metalu, <strong>nie zmieniamy ich orientacji w napis „HO”<\/strong>. Każda grupa pozostaje jednym blokiem <span class=\"formula\">OH⁻<\/span>. Schemat pokazuje relację przestrzenną, a nie rzeczywistą geometrię kryształu.<\/p>\n<div class=\"formula-lg\">Al(OH)₃<\/div>\n<div class=\"svgx\"><span>OH⁻<\/span><span>Al³⁺<\/span><span>centrum<\/span><\/div>\n<p><strong>Nie czytaj tego jako „Al–O–H” w jednej osi.<\/strong> Linie przerywane są tylko znakiem relacji/modelu. Nie są wiązaniami strukturalnymi. Najważniejsze: <span class=\"formula\">Al³⁺ + 3 OH⁻ → Al(OH)₃<\/span> oraz suma ładunków <span class=\"formula\">+3 + 3·(−1) = 0<\/span>.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dlaczego obie konwencje są poprawne?<\/span>\n<p>W obu wariantach widać to samo: atom metalu jest połączony z <strong>n grupami OH⁻<\/strong> i związek ma ten sam wzór sumaryczny <span class=\"formula\">M(OH)ₙ<\/span>.<\/p>\n<p>Różnica nie dotyczy <strong>składu chemicznego<\/strong>, tylko <strong>sposobu przedstawienia<\/strong>.<\/p>\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr><th>Poziom<\/th><th>Preferowana konwencja<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>Szkoła podstawowa<\/td><td>Wariant A — czytelność i prostota<\/td><\/tr>\n<tr><td>Liceum / rozszerzenie<\/td><td>Wariant B — większy realizm przestrzenny<\/td><\/tr>\n<tr><td>Olimpiada / chemia zaawansowana<\/td><td>Wariant B lub bardziej złożone zapisy polimeryczne<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Jak rysować — krok po kroku<\/span>\n<ol>\n<li>Zacznij od wzoru sumarycznego: np. <span class=\"formula\">Al(OH)₃<\/span>.<\/li>\n<li>Odczytaj ładunek kationu.<\/li>\n<li>Ustal (policz) liczbę grup <span class=\"formula\">OH⁻<\/span>.<\/li>\n<li>Rysuj każdą grupę <span class=\"formula\">OH⁻<\/span> jako jeden blok.<\/li>\n<li>Zapisz wzór sumaryczny: <span class=\"formula\">NaOH<\/span>, <span class=\"formula\">Ca(OH)₂<\/span>, <span class=\"formula\">Al(OH)₃<\/span>.<\/li>\n<li>W praktyce szkolnej wybierz <strong>czytelny model A<\/strong>, jeśli nie ma polecenia o geometrii przestrzennej.<\/li>\n<\/ol>\n<p>Ważne jest, żeby z rysunku było jasne: <strong>ile grup OH⁻ jest przyłączonych<\/strong>.<\/p>\n<\/div>\n<h3 id=\"siec-jonowa\">11.2 Model a rzeczywista struktura — sieć jonowa<\/h3>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Kluczowa poprawka<\/span>\n<p>Zapis <span class=\"formula\">Ca(OH)₂<\/span> jest zapisem <strong>składu związku<\/strong>, a nie wzorem strukturalnym pojedynczej cząsteczki. W uproszczonym modelu pokazujemy jon <span class=\"formula\">Ca²⁺<\/span> oraz dwa jony <span class=\"formula\">OH⁻<\/span>.<\/p>\n<p>W krysztale <span class=\"formula\">Ca(OH)₂<\/span> występuje uporządkowana <strong>sieć jonów<\/strong>, a nie pojedyncza cząsteczka <span class=\"formula\">H–O–Ca–O–H<\/span>. Rysunek <span class=\"formula\">H–O–Ca–O–H<\/span> jest tylko <strong>modelem poglądowym rozmieszczenia jonów<\/strong> — nie wzorem strukturalnym cząsteczki.<\/p>\n<p>Stały wodorotlenek wapnia nie jest pojedynczą cząsteczką typu <span class=\"formula\">H–O–Ca–O–H<\/span>. Taki rysunek może służyć wyłącznie jako model poglądowy liczby grup OH⁻.<\/p>\n<p>Najważniejsze jest, aby z rysunku było jasne: <strong>ile grup <span class=\"formula\">OH⁻<\/span> przyłącza się do kationu<\/strong> i że każda grupa <span class=\"formula\">OH<\/span> jest traktowana jako <strong>jedna całość<\/strong>.<\/p>\n<p>Żaden z tych rysunków nie odtwarza dokładnie budowy kryształu w stanie stałym. Dlatego oba wzory to <strong>modele poglądowe<\/strong> — przydatne w nauce, ale nie całkowicie dokładne.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Jak naprawdę wygląda kryształ Ca(OH)₂ i Mg(OH)₂? <span class=\"adv-tag\">poziom akademicki<\/span><\/summary><div class=\"adv-body\">\n<p>Ca(OH)₂ (portlandyt) i Mg(OH)₂ (brucyt) mają <strong>strukturę warstwową<\/strong>: płaskie warstwy kationów M²⁺ leżą między dwiema warstwami jonów OH⁻. Każdy kation otacza sześć jonów OH⁻ (koordynacja oktaedryczna), a każdy jon OH⁻ łączy trzy kationy. Wiązania O–H są ustawione prostopadle do warstw, a sąsiednie warstwy trzymają się słabymi oddziaływaniami — dlatego kryształy łatwo się łupią. To wyjaśnia, dlaczego „cząsteczka H–O–Ca–O–H” nie istnieje: każdy Ca²⁺ ma sześciu sąsiadów OH⁻, a nie dwóch.<\/p>\n<\/div><\/details>\n<\/section>\n<section id=\"ion-lab\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Strącanie od środka — laboratorium jonowe <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<p>Zobacz, jak swobodne jony poruszają się w roztworze, zbliżają się dzięki oddziaływaniom elektrostatycznym, a następnie mogą tworzyć skupiska i osad. To jest <strong>model strącania od środka<\/strong>, a nie film dosłownej trajektorii każdego jonu.<\/p>\n<div id=\"n02-ion-model-rules\" class=\"card card-understand\">\n<div class=\"card-label\">Co naprawdę pokazuje animacja?<\/div>\n<ol>\n<li><strong>Co widzę?<\/strong> — swobodne jony poruszają się w roztworze.<\/li>\n<li><strong>Co robię?<\/strong> — obserwuję zbliżanie się kationu i jonów <span class=\"formula\">OH⁻<\/span>.<\/li>\n<li><strong>Dlaczego?<\/strong> — ładunki przeciwne przyciągają się elektrostatycznie; samo przyciąganie nie oznacza jednak, że każdy kontakt od razu tworzy trwały osad.<\/li>\n<li><strong>Jak sprawdzam?<\/strong> — sprawdzam proporcję jonów, rozpuszczalność produktu i zapis równania jonowego.<\/li>\n<\/ol>\n<p class=\"widget-hint\">Model dydaktyczny: wolne jony → zbliżanie i zderzenia → krótkotrwałe skupiska → zarodki → osad.<\/p>\n<p><strong>Ważne:<\/strong> w modelu animacji mogą pojawiać się krótkotrwałe, niepełne skupiska lub etapy pośrednie. Nie przedstawiamy ich jako „gotowych cząsteczek po kolei”, lecz jako uproszczony model zbliżania, reorganizacji i tworzenia zarodków osadu.<\/p>\n<p>Rzeczywisty proces jest bardziej złożony i może obejmować formy pośrednie oraz kompleksy. Animacja ma pokazać ideę powstawania fazy stałej, a nie pełną kinetykę procesu.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-stracanie-v01\"><button type=\"button\" data-che-open-viz=\"n02-stracanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-stracanie-v01',lessonId:'N03'},'*')\"><b>Laboratorium jonowe — strącanie 13 wodorotlenków (model cząsteczkowy)<\/b><span>CHE.sim.ParticleSim · barwy osadów CHE.COLORS · równania jonowe CHE.IONIC<\/span><\/button><\/div>\n<!-- OPIS: Laboratorium jonowe: model cząsteczkowy strącania 13 wodorotlenków — jony metalu i jony OH⁻ łączą się w osad o charakterystycznej barwie, a jony obce pozostają w roztworze; obok równanie jonowe skrócone. Wniosek: osad powstaje, gdy kation tworzy z OH⁻ substancję trudno rozpuszczalną. -->\n<details class=\"adv\"><summary>Etapy pośrednie strącania — hydroksokompleksy <span class=\"adv-tag\">poziom LO / akademicki<\/span><\/summary><div class=\"adv-body\">\n<p>Ta animacja przedstawia <strong>uproszczony moment pojawienia się osadu<\/strong>. W rzeczywistości proces przebiega stopniowo: najpierw powstają hydroksokompleksy, np. <span class=\"formula\">Fe(OH)²⁺<\/span> i <span class=\"formula\">Fe(OH)₂⁺<\/span>, a dopiero później tworzy się <span class=\"formula\">Fe(OH)₃↓<\/span>.<\/p>\n<p><strong>Uproszczony ciąg:<\/strong> <span class=\"formula\">Fe³⁺ → Fe(OH)²⁺ → Fe(OH)₂⁺ → Fe(OH)₃⁰ → Fe(OH)₃↓<\/span>.<\/p>\n<p>Dla miedzi wygląda podobnie: <span class=\"formula\">[Cu(H₂O)₆]²⁺ → [Cu(H₂O)₅(OH)]⁺ → [Cu(H₂O)₄(OH)₂]⁰ → Cu(OH)₂↓<\/span>. To jest <strong>dobry model dydaktyczny<\/strong>, ale nie pełny opis mechanizmu chemicznego w roztworze.<\/p>\n<\/div><\/details>\n<p class=\"mini-note\">Równania strąceń i barwy osadów: <a href=\"#stracanie\">§7.2<\/a>; zapis jonowy: <a href=\"#rownania-jonowe\">§13<\/a>.<\/p>\n<\/section>\n<section id=\"rownania-jonowe\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Równania jonowe <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<p>Równanie jonowe pokazuje, które jony naprawdę biorą udział w reakcji. Zapis prowadzimy w trzech krokach: cząsteczkowe → jonowe pełne → jonowe skrócone (bez jonów widzów).<\/p>\n<h3 id=\"jonowe-zobojetnianie\">13.1 Zobojętnianie w zapisie jonowym<\/h3>\n<div class=\"jonowe-box\">\n<span class=\"jb-level\">Liceum / konkurs<\/span>\n<p>Reakcja <span class=\"formula\">NaOH + HCl<\/span> na trzech poziomach:<\/p>\n<div class=\"jb-label\">1. Równanie cząsteczkowe (szkolne)<\/div>\n<div class=\"jb-eq\">NaOH(aq) + HCl(aq) → NaCl(aq) + H₂O(l)<\/div>\n<div class=\"jb-label\">2. Równanie jonowe pełne<\/div>\n<div class=\"jb-eq\">Na⁺ + OH⁻ + H⁺ + Cl⁻ → Na⁺ + Cl⁻ + H₂O<\/div>\n<div class=\"jb-label\">3. Równanie jonowe skrócone (istota reakcji)<\/div>\n<div class=\"jb-eq\">H⁺ + OH⁻ → H₂O<\/div>\n<p style=\"margin-top:12px;font-size:13.5px;\">Jony Na⁺ i Cl⁻ nie zmieniają się — to <strong>jony widzowe<\/strong>.<\/p>\n<p style=\"margin-top:10px;font-size:13px;\"><strong>Ważne:<\/strong> równania jonowe dotyczą <strong>roztworów wodnych<\/strong>. Nie należy rozpisywać na jony substancji stałych ani czystych cieczy. HCl, NaOH i NaCl zapisuje się jako jony tylko wtedy, gdy są w roztworze wodnym.<\/p>\n<\/div>\n<h3 id=\"jonowe-stracanie\">13.2 Strącanie i reakcje osadów w zapisie jonowym<\/h3>\n<div class=\"jonowe-box\">\n<span class=\"jb-level\">Liceum / konkurs<\/span>\n<div class=\"jb-label\">CuSO₄ + 2NaOH — jonowe pełne<\/div>\n<div class=\"jb-eq\">Cu²⁺ + SO₄²⁻ + 2Na⁺ + 2OH⁻ → Cu(OH)₂↓ + 2Na⁺ + SO₄²⁻<\/div>\n<div class=\"jb-label\">Jonowe skrócone<\/div>\n<div class=\"jb-eq\">Cu²⁺ + 2OH⁻ → Cu(OH)₂↓<\/div>\n<div class=\"jb-eq\">Fe³⁺ + 3OH⁻ → Fe(OH)₃↓<\/div>\n<div class=\"jb-eq\">Al³⁺ + 3OH⁻ → Al(OH)₃↓<\/div>\n<div class=\"jb-label\">Osad jako substrat — nie rozpisujemy go na jony<\/div>\n<div class=\"jb-eq\">Cu(OH)₂(s) + 2H⁺ → Cu²⁺ + 2H₂O<\/div>\n<div class=\"jb-label\">Ba(OH)₂ + H₂SO₄ — nic się nie skraca<\/div>\n<div class=\"jb-eq\">Ba²⁺ + 2OH⁻ + 2H⁺ + SO₄²⁻ → BaSO₄↓ + 2H₂O<\/div>\n<p style=\"margin-top:10px;font-size:13px;\">W ostatniej reakcji wszystkie jony biorą udział w przemianie — powstaje osad i woda, dlatego nie ma jonów widzów.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"rownania-jonowe-v01\"><button type=\"button\" data-che-open-viz=\"rownania-jonowe-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'rownania-jonowe-v01',lessonId:'N03'},'*')\"><b>Równania jonowe — wszystkie reakcje z silnika (strącanie OH⁻, zobojętnianie)<\/b><span>Zapis cząsteczkowy, jonowy pełny i skrócony · CHE.IONIC<\/span><\/button><\/div>\n<!-- OPIS: Zestaw równań reakcji strącania wodorotlenków i zobojętniania w trzech zapisach: cząsteczkowym, jonowym pełnym i jonowym skróconym, z wyróżnieniem jonów, które nie biorą udziału w reakcji. Wniosek: zapis jonowy skrócony pokazuje tylko jony, które naprawdę reagują. -->\n<p class=\"mini-note\">Zapis zobojętniania: cząsteczkowy, jonowy pełny i jonowy skrócony — w modelu „Równania jonowe” wyżej wybierz reakcję HCl + NaOH (jeden model dla wszystkich równań jonowych lekcji).<\/p>\n<\/section>\n<section id=\"amfoterycznosc\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Amfoteryczność <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Rozumienie rozszerzone<\/span>\n<p><strong>Amfoteryczny<\/strong> = reaguje z kwasami i z mocnymi zasadami. Najważniejsze: <span class=\"formula\">Al(OH)₃<\/span> i <span class=\"formula\">Zn(OH)₂<\/span>.<\/p>\n<div class=\"table-wrap table-compact table-amph-desktop\">\n<table>\n<thead><tr><th>Wodorotlenek<\/th><th>Z kwasem<\/th><th>Z mocną zasadą<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Al(OH)₃<\/td><td>Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O<\/td><td>Al(OH)₃ + NaOH → Na[Al(OH)₄]<\/td><\/tr>\n<tr><td>Zn(OH)₂<\/td><td>Zn(OH)₂ + 2HCl → ZnCl₂ + 2H₂O<\/td><td>Zn(OH)₂ + 2NaOH → Na₂[Zn(OH)₄]<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"amph-cards\" aria-label=\"Amfoteryczność — widok kart\">\n<div class=\"amph-card\"><strong>Al(OH)₃<\/strong>\n<div>Z kwasem: <span class=\"formula\" data-rx=\"aloh3Hcl\">Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O<\/span><\/div>\n<div style=\"margin-top:6px;\">Z mocną zasadą: <span class=\"formula\">Al(OH)₃ + NaOH → Na[Al(OH)₄]<\/span><\/div>\n<\/div>\n<div class=\"amph-card\"><strong>Zn(OH)₂<\/strong>\n<div>Z kwasem: <span class=\"formula\" data-rx=\"znoh2Hcl\">Zn(OH)₂ + 2HCl → ZnCl₂ + 2H₂O<\/span><\/div>\n<div style=\"margin-top:6px;\">Z mocną zasadą: <span class=\"formula\">Zn(OH)₂ + 2NaOH → Na₂[Zn(OH)₄]<\/span><\/div>\n<\/div>\n<\/div>\n<p class=\"mini-note\">Na poziomie E8 wystarczy wiedzieć, że <strong>Al(OH)₃ i Zn(OH)₂ reagują i z kwasami, i z mocnymi zasadami<\/strong>. Równania z jonami kompleksowymi (<span class=\"formula\">Na[Al(OH)₄]<\/span>, <span class=\"formula\">Na₂[Zn(OH)₄]<\/span>) są rozszerzeniem i nie są wymagane na egzaminie ósmoklasisty.<\/p>\n<\/div>\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Amfoteryczność — zawsze pytaj „z czym?”<\/h4>\n<p>Al(OH)₃ i Zn(OH)₂ są klasycznymi przykładami wodorotlenków amfoterycznych. Reagują zarówno z kwasami, jak i z mocnymi zasadami, ale <strong>produkt i zapis zależą od środowiska<\/strong>.<\/p>\n<div class=\"equation-box\"><strong>Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O<\/strong><\/div>\n<div class=\"equation-box\"><strong>Al(OH)₃ + OH⁻ → [Al(OH)₄]⁻<\/strong> <span class=\"level-badge level-extra\">LO<\/span><\/div>\n<div class=\"equation-box\"><strong>Zn(OH)₂ + 2OH⁻ → [Zn(OH)₄]²⁻<\/strong> <span class=\"level-badge level-extra\">LO<\/span><\/div>\n<p>Nie używamy skrótu „amfoteryczny = reaguje ze wszystkim”.<\/p>\n<p class=\"mini-note\">Reakcje z mocnymi zasadami prowadzą do jonów kompleksowych; szczegółowy zapis należy do warstwy rozszerzonej.<\/p>\n<\/div>\n<p class=\"mini-note\">Doświadczenie z Al(OH)₃ w kwasie i w nadmiarze zasady: <a href=\"#doswiadczenia\">§15, doświadczenie H<\/a>. Tlenki amfoteryczne (Al₂O₃, ZnO): lekcja N01.<\/p>\n<figure class=\"lk-fig\" data-klocek=\"karta-bhp\" data-opt=\"{}\"><div class=\"lk-fig-body\"><\/div><figcaption>Zasady pracy i pierwsza pomoc<\/figcaption><\/figure>\n<!-- OPIS: Cztery rozwijane karty: przed doświadczeniem (okulary, fartuch, czytanie opisu), kwasy i zasady (kwas do wody, płukanie 15 minut), ogrzewanie (probówka ukośnie, otworem od siebie) oraz oparzenie i zranienie; przy poważnym urazie wołamy nauczyciela. -->\n<\/section>\n<section id=\"doswiadczenia\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> Doświadczenia modelowe <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<p>Format egzaminacyjny: problem → hipoteza → sprzęt → przebieg → obserwacje → wniosek → równanie → BHP. Wykonuj tylko pod nadzorem nauczyciela. Każde doświadczenie obejrzysz w pracowni silnika (animacja, równania jonowe, warunki).<\/p>\n<p class=\"mini-note\">Zasady BHP dla NaOH/KOH i gaszenia wapna: <a href=\"#bhp\">§9.2<\/a>.<\/p>\n<div class=\"rule-box\">\n<h4 class=\"merge-h\">Obserwacja → wniosek — jak zapisać doświadczenie<\/h4>\n<div class=\"table-wrap table-compact\">\n<table>\n<thead><tr><th>Warstwa<\/th><th>Przykład dla CaO + H₂O<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Obserwacja<\/td><td>układ wyraźnie się nagrzewa<\/td><\/tr>\n<tr><td>Wniosek<\/td><td>zaszła reakcja z wydzieleniem ciepła; powstaje Ca(OH)₂<\/td><\/tr>\n<tr><td>Równanie<\/td><td><span class=\"formula\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/span><\/td><\/tr>\n<tr><td>Ograniczenie<\/td><td>obserwacja nie pokazuje mikroskopowego mechanizmu reakcji<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n02-doswiadczenia-v01\"><button type=\"button\" data-che-open-viz=\"n02-doswiadczenia-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n02-doswiadczenia-v01',lessonId:'N03'},'*')\"><b>Pracownia: 26 doświadczeń z wodorotlenkami — zlewka, równania, obserwacje, BHP<\/b><span>GFX.rx · D.REACTIONS · CHE.IONIC<\/span><\/button><\/div>\n<!-- OPIS: Pracownia 26 doświadczeń z wodorotlenkami: zlewki w animacji z obserwacjami, równaniami i zasadami BHP — m.in. sód z wodą, CaO z wodą, strącanie Cu(OH)₂ i Fe(OH)₃, zobojętnianie z fenoloftaleiną, Al(OH)₃ z nadmiarem NaOH. Wniosek: właściwości wodorotlenków potwierdza się doświadczeniem. -->\n<div class=\"exp-card\"><h5>Doświadczenie A — Otrzymywanie NaOH: sód + woda <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Co powstaje w reakcji sodu z wodą?<\/span><b>Hipoteza<\/b><span>Powstaje zasada i gaz.<\/span><b>Sprzęt i odczynniki<\/b><span>krystalizator z wodą i fenoloftaleiną, kawałek sodu wielkości ziarna grochu, szczypce, osłona<\/span><b>Przebieg<\/b><span>Nauczyciel wrzuca mały kawałek Na do wody z fenoloftaleiną.<\/span><b>Obserwacje<\/b><span>Sód topi się w kulkę i „biega” po powierzchni, słychać syczenie, wydziela się gaz; roztwór barwi się na malinowo.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"naH2o\">2Na + 2H₂O → 2NaOH + H₂↑<\/span><\/span><b>Wniosek<\/b><span>Metal aktywny + woda → wodorotlenek + wodór; roztwór ma odczyn zasadowy.<\/span><b>BHP<\/b><span>Wyłącznie pokaz nauczyciela: okulary, osłona, bardzo mała porcja sodu (wodór może się zapalić).<\/span><\/div><button class=\"che-prac-go\" data-k=\"naH2o\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Kawałek sodu w wodzie z dodatkiem wskaźnika: sód topi się w srebrzystą kulkę, porusza się po powierzchni i wydziela gaz, a roztwór zmienia barwę na charakterystyczną dla odczynu zasadowego. Wniosek: 2 Na + 2 H₂O → 2 NaOH + H₂↑ — metal aktywny z wodą daje zasadę i wodór. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie B — Gaszenie wapna: CaO + H₂O <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Co się dzieje, gdy do CaO dodamy wody?<\/span><b>Hipoteza<\/b><span>Powstanie wodorotlenek wapnia, wydzieli się ciepło.<\/span><b>Sprzęt i odczynniki<\/b><span>CaO, woda, parownica odporna na ciepło, fenoloftaleina, papierek uniwersalny<\/span><b>Przebieg<\/b><span>Do niewielkiej ilości CaO dodaje się wodę ostrożnie, małymi porcjami. Po ochłodzeniu bada się klarowny roztwór znad osadu.<\/span><b>Obserwacje<\/b><span>Silne rozgrzanie, często syk; powstaje biała papka (mleko wapienne); roztwór nad osadem: fenoloftaleina malinowa, papierek — barwa zasadowa.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/span><\/span><b>Wniosek<\/b><span>Tlenek zasadowy + woda → wodorotlenek. Część Ca(OH)₂ rozpuszcza się (woda wapienna), nadmiar zostaje jako zawiesina (mleko wapienne).<\/span><b>BHP<\/b><span>Wykonuje nauczyciel. Reakcja silnie egzotermiczna — nie dotykaj CaO mokrymi rękami, nie pochylaj się nad naczyniem (aerozol Ca(OH)₂ jest żrący). Nie badaj wskaźnikiem gorącej, gęstej zawiesiny.<\/span><\/div><button class=\"che-prac-go\" data-k=\"caoH2o\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Tlenek wapnia (wapno palone) zalany wodą: mieszanina silnie się ogrzewa, powstaje białe „mleko wapienne”, a wskaźnik wskazuje odczyn zasadowy. Wniosek: CaO + H₂O → Ca(OH)₂ — tlenek metalu aktywnego tworzy z wodą wodorotlenek. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie C — Strącanie Cu(OH)₂ <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy z soli miedzi(II) i zasady powstanie wodorotlenek?<\/span><b>Hipoteza<\/b><span>Powstanie osad wodorotlenku miedzi(II).<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór CuSO₄, roztwór NaOH, probówka, pipeta<\/span><b>Przebieg<\/b><span>Do roztworu CuSO₄ dodaje się kroplami roztwór NaOH.<\/span><b>Obserwacje<\/b><span>Niebieski, galaretowaty osad; roztwór nad osadem traci niebieską barwę.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"cuso4Naoh\">CuSO₄ + 2NaOH → Cu(OH)₂↓ + Na₂SO₄<\/span><\/span><b>Wniosek<\/b><span>Sól + zasada → wodorotlenek↓ + sól (metoda strąceniowa) — działa, bo Cu(OH)₂ jest praktycznie nierozpuszczalny.<\/span><b>BHP<\/b><span>NaOH żrący — okulary, rękawice.<\/span><\/div><button class=\"che-prac-go\" data-k=\"cuso4Naoh\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Do niebieskiego roztworu siarczanu(VI) miedzi(II) dodano roztwór NaOH: wytrąca się niebieski, galaretowaty osad. Wniosek: CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄ — wodorotlenek trudno rozpuszczalny otrzymuje się strącaniem. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie D — Strącanie Fe(OH)₃ <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy z soli żelaza(III) i zasady powstaje wodorotlenek?<\/span><b>Hipoteza<\/b><span>Powstanie brunatny osad.<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór FeCl₃, roztwór NaOH, probówka<\/span><b>Przebieg<\/b><span>Do roztworu FeCl₃ dodaje się roztwór NaOH.<\/span><b>Obserwacje<\/b><span>Rdzawobrunatny osad.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"fecl3Naoh\">FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl<\/span><\/span><b>Wniosek<\/b><span>Powstał praktycznie nierozpuszczalny wodorotlenek żelaza(III); Fe³⁺ potrzebuje trzech OH⁻ — stąd współczynnik 3.<\/span><b>BHP<\/b><span>NaOH żrący — okulary, rękawice.<\/span><\/div><button class=\"che-prac-go\" data-k=\"fecl3Naoh\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Do żółtobrunatnego roztworu chlorku żelaza(III) dodano roztwór NaOH: wytrąca się brunatnoczerwony, galaretowaty osad. Wniosek: FeCl₃ + 3 NaOH → Fe(OH)₃↓ + 3 NaCl — barwa osadu pozwala rozpoznać jon Fe³⁺. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie E — Odczyn roztworu NaOH — trzy wskaźniki <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Jaki odczyn ma roztwór NaOH?<\/span><b>Hipoteza<\/b><span>Zasadowy.<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór NaOH przygotowany przez nauczyciela, papierek uniwersalny, fenoloftaleina, oranż metylowy, 3 probówki<\/span><b>Przebieg<\/b><span>Do trzech porcji roztworu dodaje się kolejno wskaźniki.<\/span><b>Obserwacje<\/b><span>Papierek uniwersalny — niebieski / fioletowy (zależnie od pH i papierka), fenoloftaleina — malinowa, oranż metylowy — żółty.<\/span><b>Równanie<\/b><span><span class=\"formula\">NaOH → Na⁺ + OH⁻<\/span><\/span><b>Wniosek<\/b><span>Roztwór NaOH ma odczyn zasadowy (dla stężonego — silnie zasadowy): zawiera jony OH⁻.<\/span><b>BHP<\/b><span>NaOH żrący. Roztwór przygotowuje nauczyciel — rozpuszczanie stałego NaOH jest silnie egzotermiczne.<\/span><\/div><button class=\"che-prac-go\" data-k=\"\" data-prac=\"ph-indicators-v03\" type=\"button\">Zobacz w modelu wskaźników<\/button>\n<!-- OPIS: Model wskaźników: skala pH z barwami wskaźnika uniwersalnego, fenoloftaleiny i oranżu metylowego w roztworach kwasowych, obojętnych i zasadowych. Wniosek: barwa wskaźnika pokazuje odczyn roztworu. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie F — Zobojętnianie NaOH kwasem solnym <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Co się dzieje, gdy do zasady dodajemy kwas?<\/span><b>Hipoteza<\/b><span>Powstaje sól i woda; odczyn się zmienia.<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór NaOH z fenoloftaleiną, rozcieńczony HCl, pipeta, zlewka<\/span><b>Przebieg<\/b><span>Do zasady z fenoloftaleiną dodaje się kroplami HCl, mieszając.<\/span><b>Obserwacje<\/b><span>Malinowa barwa stopniowo zanika — w punkcie zobojętnienia roztwór jest bezbarwny; zlewka lekko się ogrzewa.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"hclNaOH\">NaOH + HCl → NaCl + H₂O<\/span><\/span><b>Wniosek<\/b><span>Zaszło zobojętnianie: H⁺ + OH⁻ → H₂O. Zanik barwy fenoloftaleiny oznacza, że nie ma już nadmiaru OH⁻.<\/span><b>BHP<\/b><span>Roztwory żrące — okulary.<\/span><\/div><button class=\"che-prac-go\" data-k=\"hclNaOH+php\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Do malinowego roztworu NaOH z fenoloftaleiną dodaje się porcjami kwas solny: barwa słabnie i w punkcie zobojętnienia roztwór staje się bezbarwny. Wniosek: HCl + NaOH → NaCl + H₂O (H⁺ + OH⁻ → H₂O) — kwas i zasada się zobojętniają. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie G — Woda wapienna i CO₂ <span class=\"level-badge level-basic\">E8<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy w wydychanym powietrzu jest CO₂?<\/span><b>Hipoteza<\/b><span>Woda wapienna zmętnieje.<\/span><b>Sprzęt i odczynniki<\/b><span>woda wapienna (klarowny roztwór nasycony), rurka, probówka<\/span><b>Przebieg<\/b><span>Przez rurkę wdmuchuje się powietrze do wody wapiennej.<\/span><b>Obserwacje<\/b><span>Roztwór mętnieje (biały osad); przy bardzo długim dmuchaniu znów się klaruje.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O<\/span><\/span><b>Wniosek<\/b><span>Wydychane powietrze zawiera CO₂ — woda wapienna służy do jego wykrywania. Klarowanie: CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂ (rozszerzenie).<\/span><b>BHP<\/b><span>Nie zasysaj roztworu przez rurkę.<\/span><\/div><button class=\"che-prac-go\" data-k=\"caoh2Co2\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Tlenek węgla(IV) wprowadzany do klarownej wody wapiennej: woda mętnieje, pojawia się biała zawiesina. Wniosek: Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O — test wykrywający CO₂ i dowód kwasowego charakteru tego tlenku. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie H — Amfoteryczność Al(OH)₃ <span class=\"level-badge level-extra\">AMB<\/span><\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy Al(OH)₃ reaguje z kwasem i z zasadą?<\/span><b>Hipoteza<\/b><span>Reaguje z obydwoma.<\/span><b>Sprzęt i odczynniki<\/b><span>roztwór AlCl₃, roztwór NaOH, rozcieńczony HCl, 2 probówki<\/span><b>Przebieg<\/b><span>Strąca się Al(OH)₃ (NaOH kroplami), osad dzieli na dwie probówki; do jednej dodaje się HCl, do drugiej nadmiar NaOH.<\/span><b>Obserwacje<\/b><span>Biały, galaretowaty osad; w obu probówkach osad znika.<\/span><b>Równanie<\/b><span><span class=\"formula\" data-rx=\"alcl3Naoh\">AlCl₃ + 3NaOH → Al(OH)₃↓ + 3NaCl<\/span><\/span><b>Wniosek<\/b><span>Al(OH)₃ jest amfoteryczny: Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O oraz Al(OH)₃ + NaOH → Na[Al(OH)₄] (zapis LO).<\/span><b>BHP<\/b><span>NaOH żrący — okulary, rękawice.<\/span><\/div><button class=\"che-prac-go\" data-k=\"aloh3Naoh\" data-prac=\"n02-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Do roztworu soli glinu dodaje się roztwór NaOH: najpierw wytrąca się biały galaretowaty osad Al(OH)₃, który w nadmiarze NaOH roztwarza się i roztwór znów jest klarowny. Wniosek: wodorotlenek glinu jest amfoteryczny — reaguje także z mocną zasadą. --><\/div>\n<\/section>\n<section id=\"klinika\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">16<\/span> Klinika błędów<\/div>\n<div class=\"table-wrap table-compact\">\n<table class=\"klinika-table\" id=\"klinikaTable\">\n<thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><th>Przykład z życia<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"error-row\"><td class=\"col-blad\">Ca<span class=\"hl-index\">OH₂<\/span> <span style=\"font-size:11px;color:var(--c-error)\">(indeks „przyklejony” tylko do H)<\/span><\/td><td class=\"col-ok\">Ca(<span class=\"hl-index\">OH<\/span>)₂ <span style=\"font-size:11px;color:var(--c-basic)\">(indeks przy całej grupie)<\/span><\/td><td>Nawias obejmuje całą grupę OH⁻, nie tylko H. Indeks 2 dotyczy dwóch całych grup OH⁻.<\/td><td>Uczeń zapomniał nawiasu — wzór sugeruje, że indeks 2 dotyczy tylko wodoru, a nie dwóch całych grup OH⁻.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">AlOH₃<\/td><td class=\"col-ok\">Al(OH)₃<\/td><td>Nawias — 3 grupy OH⁻. Indeks 3 dotyczy całych grup, nie tylko wodoru.<\/td><td>Jak wyżej: bez nawiasu indeks 3 dotyczyłby tylko wodoru.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">NaOH + HCl → NaCl<\/td><td class=\"col-ok\">NaOH + HCl → NaCl + H₂O<\/td><td>Zobojętnianie daje sól i wodę. Woda jest produktem reakcji i nie może być pominięta.<\/td><td>Zapomniano o wodzie — najczęstszy błąd przy przepisywaniu równania zobojętniania.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">CaO + H₂O → CaOH<\/td><td class=\"col-ok\">CaO + H₂O → Ca(OH)₂<\/td><td>Brak bilansu atomów wodoru (po lewej 2 H, po prawej 1 H) oraz brak nawiasu dla grupy OH⁻. Poprawny zapis wymaga dwóch grup OH⁻ przy wapniu.<\/td><td>Uczeń zapomina, że w reakcji tlenku z wodą powstaje wodorotlenek, a nie tlenek wodorotlenku. Dodatkowo myli zapis z nawiasem.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">Wszystkie wodorotlenki są silnie zasadowe<\/td><td class=\"col-ok\">Tylko dobrze rozpuszczalne dają silny odczyn<\/td><td>Rozpuszczalność decyduje o stężeniu OH⁻. Trudno rozpuszczalne wodorotlenki dają bardzo mało jonów OH⁻ w roztworze.<\/td><td>Ktoś miesza zawiesinę Fe(OH)₃ i spodziewa się odczynu jak po NaOH — a odczynu praktycznie nie ma.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">Fe(OH)₃ rozpuszcza się w wodzie<\/td><td class=\"col-ok\">Fe(OH)₃ jest praktycznie nierozpuszczalny<\/td><td>Większość wodorotlenków metali przejściowych jest nierozpuszczalna.<\/td><td>Po dodaniu NaOH do FeCl₃ powstaje brunatny osad, nie klarowny roztwór.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">MgO nie reaguje z wodą<\/td><td class=\"col-ok\">MgO reaguje bardzo wolno; powstaje trudno rozpuszczalny Mg(OH)₂<\/td><td>Mg(OH)₂ otrzymuje się wygodniej przez strącanie, ale reakcja zachodzi.<\/td><td>W praktyce szkolnej Mg(OH)₂ robi się z MgCl₂ + NaOH, bo reakcja MgO z wodą jest zbyt wolna.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">Każdy tlenek metalu reaguje z wodą<\/td><td class=\"col-ok\">Tylko niektóre tlenki zasadowe (metali aktywnych)<\/td><td>CuO, Fe₂O₃ i Al₂O₃ praktycznie nie reagują z wodą.<\/td><td>Wsypanie CuO do wody nie da niebieskiego roztworu — to nie zadziała.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\">Zasada = wodorotlenek<\/td><td class=\"col-ok\">Wodorotlenek = substancja; zasada = jej wodny roztwór<\/td><td>Stały NaOH to wodorotlenek; jego wodny roztwór jest zasadą (ługiem sodowym).<\/td><td>Butelka z NaOH to wodorotlenek; zlewka z roztworem NaOH to zasada — wodny roztwór wodorotlenku.<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Sprawdzę zasadowość na języku albo palcem.”<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">Odczyn bada się **wskaźnikiem** (fenoloftaleina, uniwersalny papierek); odczynników nie dotykamy i nie smakujemy.<\/td><td data-label=\"Dlaczego\">BHP — zasady są żrące dla skóry i oczu.<\/td><td>—<\/td><td>—<\/td><\/tr>\n<tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Odczyn zasadowy = żrący.”<\/td><td class=\"col-ok\" data-label=\"Poprawnie\">Roztwór może mieć odczyn zasadowy i nie być żrący (np. woda z mydłem, rozcieńczony roztwór amoniaku); żrące są stężone roztwory mocnych zasad.<\/td><td data-label=\"Dlaczego\">Zasadowość i żrącość to różne cechy.<\/td><td>—<\/td><td>—<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie — popraw zdanie<\/span>\n<p><strong>Polecenie:<\/strong> Uczeń napisał w zeszycie: „Fe(OH)₃ rozpuszcza się w wodzie i daje odczyn zasadowy.\" Popraw to zdanie i wyjaśnij, dlaczego jest błędne.<\/p>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p><strong>Poprawnie:<\/strong> Fe(OH)₃ jest praktycznie nierozpuszczalny w wodzie. Nie tworzy roztworu o wyraźnym odczynie zasadowym, bo stężenie jonów OH⁻ w roztworze jest zbyt małe.<\/p>\n<p><strong>Wyjaśnienie:<\/strong> O odczynie roztworu decyduje stężenie wolnych jonów OH⁻. Jeśli wodorotlenek prawie nie przechodzi do roztworu (jak Fe(OH)₃), to do roztworu trafia znikoma liczba jonów OH⁻ — odczyn praktycznie obojętny.<\/p>\n<\/details>\n<\/div>\n<details class=\"answer\"><summary>Przełącznik błędu — ile grup OH⁻ jest w Ca(OH)₂? (1 / 2 / 3)<\/summary>\n<p><strong>2.<\/strong> Indeks za nawiasem mnoży całą grupę OH: Ca(OH)₂ = 1 Ca, 2 O, 2 H. Zapis CaOH₂ oznaczałby 1 grupę OH i dodatkowy atom H.<\/p>\n<\/details>\n<h3 class=\"merge-h\">Sprawdź się<\/h3>\n<div class=\"rule-box\">\n<ol>\n<li>Popraw: <span class=\"formula\">CaOH₂<\/span> → ?<\/li>\n<li>Czy <span class=\"formula\">OH⁻<\/span> jest związkiem chemicznym czy jonem?<\/li>\n<li>Czy trudno rozpuszczalny wodorotlenek automatycznie oznacza „słabą zasadę”?<\/li>\n<li>Co różni wodę wapienną od mleka wapiennego?<\/li>\n<li>Dlaczego <span class=\"formula\">H–O–Ca–O–H<\/span> nie powinno być podpisane jako rzeczywista cząsteczka Ca(OH)₂?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li><span class=\"formula\">Ca(OH)₂<\/span>.<\/li>\n<li>Jest anionem wodorotlenkowym.<\/li>\n<li>Nie. Rozpuszczalność i moc elektrolitu to różne pojęcia.<\/li>\n<li>Woda wapienna jest klarownym nasyconym roztworem; mleko wapienne jest zawiesiną z fazą stałą.<\/li>\n<li>Stały Ca(OH)₂ opisujemy jako układ jonowy; rysunek jest tylko modelem poglądowym składu.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<details class=\"answer\"><summary>Mini-klinika błędów<\/summary>\n<ol>\n<li><strong>„Ca(OH)₂ jest zasadą, bo ma OH w wzorze.”<\/strong> — Nie wystarczy sam wzór. Trzeba mówić o roztworze i obecności OH⁻.<\/li>\n<li><strong>„Amfoteryczny reaguje ze wszystkim.”<\/strong> — Nie. Wskazujemy konkretny reagent i środowisko.<\/li>\n<li><strong>„NH₄OH to zwykła cząsteczka w każdym roztworze amoniaku.”<\/strong> — To tradycyjny zapis szkolny; dokładniejszy model wodnego amoniaku używa NH₃(aq) ⇌ NH₄⁺ + OH⁻.<\/li>\n<\/ol>\n<\/details>\n<\/section>\n<section id=\"cwiczenia\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">17<\/span> Ćwiczenia<\/div>\n<p class=\"mini-note\">Reguły potrzebne do zadań: wzory <a href=\"#budowa\">§5<\/a>, rozpuszczalność <a href=\"#rozpuszczalnosc-tabela\">§6.2<\/a>, otrzymywanie <a href=\"#otrzymywanie\">§7<\/a>, zobojętnianie <a href=\"#zobojetnianie\">§8.1<\/a>.<\/p>\n<h3>17.1 Mini-check<\/h3>\n<div class=\"card\">\n<ol>\n<li>Co to wodorotlenek?<\/li>\n<li>Jaki ładunek ma grupa OH⁻?<\/li>\n<li>Kiedy stosujemy nawias?<\/li>\n<li>Trzy typowe szkolne metody otrzymywania wodorotlenków?<\/li>\n<li>Co to zobojętnianie?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<p><strong>1.<\/strong> Związek z kationu metalu i anionu OH⁻.<\/p>\n<p><strong>2.<\/strong> −1.<\/p>\n<p><strong>3.<\/strong> Gdy grupa OH⁻ powtarza się więcej niż raz.<\/p>\n<p><strong>4.<\/strong> Tlenek metalu aktywnego + woda; metal aktywny + woda; sól + zasada.<\/p>\n<p><strong>5.<\/strong> Reakcja kwasu z zasadą → sól + woda.<\/p>\n<\/details>\n<\/div>\n<h3>17.2 Ćwiczenie prowadzone — Ca(OH)₂<\/h3>\n<div class=\"card\">\n<p><strong>Polecenie:<\/strong> Mając dany kation wapnia Ca²⁺, wykonaj kolejne polecenia:<\/p>\n<ol>\n<li>Zapisz wzór wodorotlenku.<\/li>\n<li>Podaj jego nazwę.<\/li>\n<li>Zapisz trzy metody otrzymywania tego wodorotlenku.<\/li>\n<li>Zapisz równanie zobojętniania tego wodorotlenku kwasem solnym HCl.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p><strong>1. Wzór:<\/strong> Ca(OH)₂ (wapń +2, więc 2 grupy OH⁻, nawias obowiązkowy).<\/p>\n<p><strong>2. Nazwa:<\/strong> wodorotlenek wapnia.<\/p>\n<p><strong>3. Trzy metody:<\/strong><\/p>\n<p>• tlenek + woda: CaO + H₂O → Ca(OH)₂<\/p>\n<p>• metal + woda: Ca + 2H₂O → Ca(OH)₂ + H₂↑ <span class=\"mini-note\">(przykład szkolny; przebieg zależy od warunków, np. temperatury i stanu powierzchni metalu)<\/span><\/p>\n<p>• sól + zasada: CaCl₂ + 2NaOH → Ca(OH)₂↓ + 2NaCl <span class=\"mini-note\">(tylko z roztworów stężonych — Ca(OH)₂ jest trudno, ale nie praktycznie nierozpuszczalny)<\/span><\/p>\n<p><strong>4. Zobojętnianie:<\/strong> Ca(OH)₂ + 2HCl → CaCl₂ + 2H₂O.<\/p>\n<\/details>\n<\/div>\n<h3>17.3 Ćwiczenia samodzielne<\/h3>\n<h4>A. Podstawa <span class=\"level-badge level-basic\">E8<\/span><\/h4>\n<div class=\"card\">\n<ol>\n<li>Wzory: wodorotlenek potasu, wodorotlenek wapnia, wodorotlenek glinu, wodorotlenek żelaza(III).<\/li>\n<li>Nazwy: NaOH, Mg(OH)₂, Fe(OH)₂, Cu(OH)₂.<\/li>\n<li>Dokończ: CaO + H₂O → … ; NaOH + HCl → …<\/li>\n<li>Popraw: CaOH₂; NaOH + H₂SO₄ → Na₂SO₄.<\/li>\n<li>Które wodorotlenki są dobrze rozpuszczalne?<\/li>\n<li>Jakie wskaźniki potwierdzają odczyn zasadowy?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>KOH, Ca(OH)₂, Al(OH)₃, Fe(OH)₃.<\/li>\n<li>wodorotlenek sodu, magnezu, żelaza(II), miedzi(II).<\/li>\n<li>Ca(OH)₂ ; NaCl + H₂O.<\/li>\n<li>Ca(OH)₂ ; 2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O.<\/li>\n<li>NaOH, KOH, LiOH, Ba(OH)₂ (dobrze); Ca(OH)₂ (trudno, ale tworzy wodę wapienną).<\/li>\n<li>fenoloftaleina (malinowa), oranż metylowy (żółty), papierek uniwersalny (niebieski).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h4>B. Trening / egzamin <span class=\"level-badge level-basic\">E8<\/span><\/h4>\n<div class=\"card\">\n<ol start=\"7\">\n<li>Zobojętnianie: KOH + HNO₃; Ca(OH)₂ + H₂SO₄; Al(OH)₃ + 3HCl.<\/li>\n<li>Skąd Ca(OH)₂, mając CaO?<\/li>\n<li>Dlaczego Ca(OH)₂, a nie CaOH₂?<\/li>\n<li>Otrzymywanie Mg(OH)₂ z MgCl₂ i NaOH.<\/li>\n<li>Uzupełnij: FeCl₃ + 3NaOH → ? ; CuSO₄ + 2NaOH → ?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"7\">\n<li>KNO₃ + H₂O ; CaSO₄ + 2H₂O ; AlCl₃ + 3H₂O.<\/li>\n<li>CaO + H₂O → Ca(OH)₂.<\/li>\n<li>Indeks 2 dotyczy całej grupy OH⁻.<\/li>\n<li>MgCl₂ + 2NaOH → Mg(OH)₂↓ + 2NaCl.<\/li>\n<li>Fe(OH)₃↓ + 3NaCl ; Cu(OH)₂↓ + Na₂SO₄.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h4>C. Ambitne <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/h4>\n<div class=\"card\">\n<ol start=\"12\">\n<li>FeCl₃ + NaOH — równanie + obserwacja + wniosek.<\/li>\n<li>Które wodorotlenki dają silnie zasadowy roztwór?<\/li>\n<li>Dlaczego Al(OH)₃ reaguje z HCl i NaOH?<\/li>\n<li>Zaprojektuj doświadczenie: odczyn KOH.<\/li>\n<li>Trzy poziomy zapisu NaOH + HCl.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"12\">\n<li>Problem → Hipoteza → Sprzęt → Obserwacja (brunatny osad) → Wniosek → Równanie → BHP. Równanie: FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl. Obserwacja: powstaje rdzawobrunatny osad. Wniosek: z soli żelaza(III) i zasady powstaje praktycznie nierozpuszczalny Fe(OH)₃ (por. doświadczenie D).<\/li>\n<li>NaOH, KOH i Ba(OH)₂ są dobrze rozpuszczalne i tworzą roztwory wyraźnie zasadowe. Fe(OH)₃ jest praktycznie nierozpuszczalny, więc nie tworzy w wodzie takiego roztworu.<\/li>\n<li>Al(OH)₃ jest amfoteryczny. Z kwasem reaguje jak zasada (Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O), a z mocną zasadą tworzy rozpuszczalny związek kompleksowy (Al(OH)₃ + NaOH → Na[Al(OH)₄]).<\/li>\n<li>Problem → Hipoteza → Sprzęt → Obserwacja → Wniosek → Równanie → BHP. Np.: problem — jaki odczyn ma roztwór KOH? Hipoteza — zasadowy. Sprzęt — roztwór KOH, fenoloftaleina, papierek uniwersalny, probówki. Obserwacja — fenoloftaleina malinowa, papierek niebieski. Wniosek — odczyn zasadowy (jony OH⁻). Równanie: KOH → K⁺ + OH⁻. BHP — okulary, rękawice.<\/li>\n<li>Cząsteczkowe: NaOH + HCl → NaCl + H₂O. Jonowe pełne: Na⁺ + OH⁻ + H⁺ + Cl⁻ → Na⁺ + Cl⁻ + H₂O. Skrócone: H⁺ + OH⁻ → H₂O.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h4>D. Zaawansowane <span class=\"level-badge level-extra\">AMBITNE<\/span><\/h4>\n<div class=\"card\">\n<ol start=\"17\">\n<li>Dysocjacja: NaOH, Ca(OH)₂, Ba(OH)₂.<\/li>\n<li>Co to hydrat? Przykład.<\/li>\n<li>Dlaczego AgOH jest nietrwały?<\/li>\n<li>Różnica rozpuszczalny vs mocny.<\/li>\n<li>Dlaczego Ba(OH)₂ + H₂SO₄ daje wodę i osad?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"17\">\n<li>NaOH → Na⁺ + OH⁻ ; Ca(OH)₂ → Ca²⁺ + 2OH⁻ ; Ba(OH)₂ → Ba²⁺ + 2OH⁻.<\/li>\n<li>Związek z cząsteczkami wody w sieci, np. CuSO₄·5H₂O.<\/li>\n<li>2AgOH → Ag₂O + H₂O. Wodorotlenek srebra(I) szybko przekształca się w tlenek srebra(I).<\/li>\n<li>Rozpuszczalny = ile przechodzi do roztworu. Mocny = stopień dysocjacji cząstek w roztworze. Ca(OH)₂ jest słabiej rozpuszczalny niż NaOH, ale rozpuszczona część dysocjuje praktycznie całkowicie.<\/li>\n<li>Dwa procesy: H⁺ + OH⁻ → H₂O oraz Ba²⁺ + SO₄²⁻ → BaSO₄↓.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h4>E. Zadania z obserwacją (typ E8) <span class=\"level-badge level-basic\">E8<\/span><\/h4>\n<div class=\"card card-exam\">\n<p><strong>Zadanie 1.<\/strong> Fenoloftaleina w probówkach A, B, C. A — malinowa, B — bezbarwna. Do A dodawano HCl, aż barwa znikła.<\/p>\n<ol>\n<li>Odczyn A?<\/li>\n<li>Jony odpowiedzialne?<\/li>\n<li>Nazwa reakcji po dodaniu HCl?<\/li>\n<li>Równanie jonowe skrócone.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<p><strong>1.<\/strong> Zasadowy.<\/p>\n<p><strong>2.<\/strong> OH⁻.<\/p>\n<p><strong>3.<\/strong> Zobojętnianie.<\/p>\n<p><strong>4.<\/strong> H⁺ + OH⁻ → H₂O.<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<p><strong>Zadanie 2.<\/strong> Do roztworu soli Fe(III) dodano kilka kropli NaOH bez nadmiaru. Powstał brunatny osad.<\/p>\n<ol>\n<li>Równanie cząsteczkowe.<\/li>\n<li>Typ reakcji.<\/li>\n<li>Jeżeli NaOH dodano bez nadmiaru, dlaczego po wytrąceniu Fe(OH)₃ nie obserwuje się wyraźnie zasadowego odczynu?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<p><strong>1.<\/strong> FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl.<\/p>\n<p><strong>2.<\/strong> Reakcja strąceniowa.<\/p>\n<p><strong>3.<\/strong> Bez nadmiaru NaOH jony OH⁻ zostały praktycznie w całości zużyte na wytrącenie Fe(OH)₃. Sam osad jest praktycznie nierozpuszczalny, więc nie uwalnia jonów OH⁻ do roztworu — stężenie OH⁻ jest zbyt małe, aby odczyn był wyraźnie zasadowy.<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Utrwalenie — wodorotlenki i zasady (W1)<\/span>\n<ol>\n<li>Czym różni się wodorotlenek od zasady?<\/li>\n<li>Zapisz wzór wodorotlenku żelaza(III).<\/li>\n<li>Zapisz reakcję KOH z HNO₃.<\/li>\n<li>Zapisz dysocjację Ba(OH)₂.<\/li>\n<li>Dlaczego Al(OH)₃ nie zalicza się do zasad?<\/li>\n<li>Zapisz otrzymywanie Cu(OH)₂ z CuSO₄ i NaOH.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>Wodorotlenek to związek z kationem metalu i anionami OH⁻; zasada to wodny roztwór wodorotlenku rozpuszczalnego (lub substancja dająca w wodzie jony OH⁻, np. NH₃).<\/li>\n<li>Fe(OH)₃.<\/li>\n<li>KOH + HNO₃ → KNO₃ + H₂O.<\/li>\n<li>Ba(OH)₂ → Ba²⁺ + 2 OH⁻.<\/li>\n<li>Jest praktycznie nierozpuszczalny w wodzie, więc nie daje roztworu zasadowego (jest amfoteryczny).<\/li>\n<li>CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄ (niebieski galaretowaty osad).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"test\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">18<\/span> Test końcowy<\/div>\n<p>Kliknij odpowiedź — od razu zobaczysz, czy jest poprawna. Bez limitu czasu.<\/p>\n<div class=\"quiz-wrap\" id=\"quizWrap\"><\/div>\n<div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<div style=\"margin-top:18px;\" class=\"card card-understand\">\n<span class=\"card-label\">Ćwiczenie — współczynniki (bez limitu czasu)<\/span>\n<p>Uzupełnij i sprawdź w odpowiedzi poniżej.<\/p>\n<pre class=\"step-flow\">FeCl₃ + ___ NaOH → Fe(OH)₃↓ + ___ NaCl\nCuSO₄ + ___ NaOH → Cu(OH)₂↓ + ___ Na₂SO₄\nAlCl₃ + ___ NaOH → Al(OH)₃↓ + ___ NaCl<\/pre>\n<details class=\"answer\"><summary>Pokaż współczynniki<\/summary>\n<p><span class=\"formula\" data-rx=\"fecl3Naoh\">FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl<\/span><\/p>\n<p><span class=\"formula\" data-rx=\"cuso4Naoh\">CuSO₄ + 2NaOH → Cu(OH)₂↓ + Na₂SO₄<\/span><\/p>\n<p><span class=\"formula\" data-rx=\"alcl3Naoh\">AlCl₃ + 3NaOH → Al(OH)₃↓ + 3NaCl<\/span><\/p>\n<p class=\"mini-note\">Liczba OH⁻ = wartość bezwzględna ładunku kationu metalu. Potem domknij bilans atomów Cl / SO₄.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"karta\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">19<\/span> Karta szybkiego powtórzenia (do druku) <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Najważniejsze w 8 punktach<\/span>\n<ol>\n<li><strong>Wodorotlenek<\/strong> = kation metalu + n grup OH⁻; wzór M(OH)ₙ, n = wartość bezwzględna ładunku kationu (<a href=\"#budowa\">§5<\/a>).<\/li>\n<li><strong>Nawias<\/strong> tylko gdy OH⁻ > 1: NaOH, Ca(OH)₂, Al(OH)₃; nazwa: wodorotlenek + metal (+ cyfra rzymska dla Fe, Cu…).<\/li>\n<li><strong>Rozpuszczalne<\/strong>: NaOH, KOH, LiOH, Ba(OH)₂; Ca(OH)₂ trudno; osady: Cu(OH)₂ (niebieski), Fe(OH)₃ (brunatny), Mg(OH)₂, Al(OH)₃, Zn(OH)₂ (białe) (<a href=\"#rozpuszczalnosc-tabela\">§6.2<\/a>).<\/li>\n<li><strong>Zasada<\/strong> = wodny roztwór wodorotlenku z jonami OH⁻; dysocjacja Ca(OH)₂ → Ca²⁺ + 2OH⁻ (<a href=\"#wodorotlenek-vs-zasada\">§6.3<\/a>).<\/li>\n<li><strong>Wskaźniki w zasadzie<\/strong>: fenoloftaleina malinowa, oranż metylowy żółty, papierek niebieski (<a href=\"#ph-wskazniki\">§6.4<\/a>).<\/li>\n<li><strong>Otrzymywanie<\/strong>: tlenek + woda; metal aktywny + woda (+ H₂↑); sól + zasada → osad (<a href=\"#otrzymywanie\">§7<\/a>).<\/li>\n<li><strong>Zobojętnianie<\/strong>: wodorotlenek + kwas → sól + woda; H⁺ + OH⁻ → H₂O (<a href=\"#zobojetnianie\">§8.1<\/a>).<\/li>\n<li><strong>Woda wapienna + CO₂<\/strong> → CaCO₃↓ (mętnienie); NaOH/KOH higroskopijne i żrące (<a href=\"#wapno\">§6.5<\/a>, <a href=\"#bhp\">§9.2<\/a>).<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Strategia na E8 — 4 kroki przy wzorze<\/span>\n<ol>\n<li><strong>Kation<\/strong> — jaki metal i jaki ładunek? (Na⁺ / Ca²⁺ / Al³⁺ / Fe³⁺…)<\/li>\n<li><strong>Liczba OH⁻<\/strong> = wartość bezwzględna ładunku kationu.<\/li>\n<li><strong>Nawias?<\/strong> tylko gdy OH⁻ więcej niż 1.<\/li>\n<li><strong>Kontrola<\/strong> — suma ładunków = 0; indeks za nawiasem mnoży całą grupę.<\/li>\n<\/ol>\n<p class=\"mini-note\">Na kartce egzaminacyjnej zapisz najpierw ładunek, potem dopiero wzór. To zmniejsza liczbę błędów typu CaOH₂.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Schemat W–K–S–K a wodorotlenki<\/span>\n<p>Wodorotlenek łączy się z <strong>kwasem<\/strong> (zobojętnianie) i powstaje z <strong>tlenku<\/strong> (lub metalu / soli). Na mapie przemian:<\/p>\n<p style=\"text-align:center;margin:12px 0;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.9;\">\n<strong>Tlenek zasadowy<\/strong> + H₂O → <strong>Wodorotlenek<\/strong><br/>\n<strong>Wodorotlenek<\/strong> + kwas → <strong>Sól<\/strong> + H₂O<br/>\n<strong>Sól<\/strong> + zasada → <strong>Wodorotlenek↓<\/strong> + sól\n      <\/p>\n<p>Zapamiętaj: wodorotlenek stoi między tlenkiem a solą w łańcuchu przemian.<\/p>\n<\/div>\n<\/section>\n<section id=\"fiszki\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">20<\/span> Fiszki<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Co to wodorotlenek?<\/span><span class=\"back\"><strong>Związek z kationu metalu i anionu OH⁻.<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wzór ogólny<\/span><span class=\"back\"><strong>M(OH)ₙ, n = liczba grup OH⁻. W typowych wodorotlenkach kl. 8 równa wartości bezwzględnej ładunku kationu.<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Kiedy nawias?<\/span><span class=\"back\"><strong>Gdy OH⁻ powtarza się więcej niż raz.<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wiązania w modelu OH⁻<\/span><span class=\"back\"><strong>O–H ciągłe (kowalencyjne spolaryzowane); M···O przerywane (oddziaływanie jonowe). Model szkolny, nie sieć kryształu.<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Dlaczego nie CaOH₂?<\/span><span class=\"back\"><strong>Indeks 2 dotyczyłby tylko H. Poprawnie: Ca(OH)₂ — dwie całe grupy OH⁻ (= Ca₁O₂H₂).<\/strong><\/span><span class=\"card-tag tag-error\">błąd E8<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Elektrolit a zasada<\/span><span class=\"back\"><strong>Roztwór NaOH ma jony Na⁺ i OH⁻ → przewodzi prąd (elektrolit) i ma odczyn zasadowy.<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Higroskopijność<\/span><span class=\"back\"><strong>NaOH i KOH pochłaniają wilgoć z powietrza i „rozpływają się”. Szczelne naczynia!<\/strong><\/span><span class=\"card-tag tag-exam\">E8<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Woda wapienna vs mleko<\/span><span class=\"back\"><strong>Woda wapienna = klarowny nasycony roztwór Ca(OH)₂. Mleko = mętna zawiesina.<\/strong><\/span><span class=\"card-tag tag-exam\">E8<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Zobojętnianie — produkty<\/span><span class=\"back\"><strong>sól + woda<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">NaOH + HCl → ?<\/span><span class=\"back\"><strong>NaCl + H₂O<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Ca(OH)₂ + 2HCl → ?<\/span><span class=\"back\"><strong>CaCl₂ + 2H₂O<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Fenoloftaleina w zasadzie<\/span><span class=\"back\"><strong>Malinowa<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Dobrze rozpuszczalne wodorotlenki<\/span><span class=\"back\"><strong>NaOH, KOH, LiOH, Ba(OH)₂; Ca(OH)₂ trudno, ale tworzy wodę wapienną<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Dysocjacja NaOH<\/span><span class=\"back\"><strong>NaOH → Na⁺ + OH⁻<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Barwa Fe(OH)₃<\/span><span class=\"back\"><strong>Brunatna (rdzawa)<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Amfoteryczne wodorotlenki<\/span><span class=\"back\"><strong>Al(OH)₃, Zn(OH)₂<\/strong><\/span><span class=\"card-tag tag-extra\">ambitny<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wodorotlenek vs zasada<\/span><span class=\"back\"><strong>Wodorotlenek = substancja. Zasada = wodny roztwór wodorotlenku dostarczający OH⁻.<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Równanie jonowe skrócone zobojętniania<\/span><span class=\"back\"><strong>H⁺ + OH⁻ → H₂O<\/strong><\/span><span class=\"card-tag tag-extra\">ambitny<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Woda wapienna + CO₂ → ?<\/span><span class=\"back\"><strong>CaCO₃↓ + H₂O — roztwór mętnieje (wykrywanie CO₂)<\/strong><\/span><span class=\"card-tag tag-exam\">E8<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Barwa Cu(OH)₂<\/span><span class=\"back\"><strong>Niebieska (galaretowaty osad)<\/strong><\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wapno palone, gaszone<\/span><span class=\"back\"><strong>Palone = CaO; gaszone = Ca(OH)₂<\/strong><\/span><span class=\"card-tag tag-exam\">E8<\/span><\/button><\/div>\n<\/section>\n<section id=\"test\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">20a<\/span> Sprawdź się: test<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"0\"><h5>1. Wzór wodorotlenku potasu to…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">KOH<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">K(OH)₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">KH₂O<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">K₂OH<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>2. Który wodorotlenek dobrze rozpuszcza się w wodzie?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">NaOH<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Cu(OH)₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">Fe(OH)₃<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">Al(OH)₃<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>3. Fenoloftaleina w roztworze NaOH przyjmuje barwę…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">malinową<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">niebieską<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">bezbarwną<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">żółtą<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>4. Dysocjacja elektrolityczna NaOH przebiega zgodnie z równaniem…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">NaOH → Na⁺ + OH⁻<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">NaOH → Na⁺ + O²⁻ + H⁺<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">NaOH → Na⁺OH⁻⁻<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">NaOH → Na + OH<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>5. W wyniku reakcji tlenku wapnia z wodą powstaje…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">wodorotlenek wapnia (wapno gaszone)<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">węglan wapnia<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">metaliczny wapń i wodór<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">kwas węglowy<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>6. Sód reaguje z wodą, dając…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">NaOH i H₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">NaOH i O₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">Na₂O i H₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">NaH i H₂O₂<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section id=\"mapa\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">21<\/span> Mapa pojęć<\/div>\n<div class=\"card map-card\">\n<div class=\"mmx\">\n<div class=\"mmx-box\" style=\"--mm:#0d6868\"><b>WODOROTLENEK<\/b><ul><li>kation metalu + aniony OH⁻<\/li><li>substancja stała (kryształ, osad)<\/li><li>sieć jonowa, nie cząsteczka H–O–M–O–H<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#b06f1c\"><b>M(OH)ₙ — kation + n grup OH⁻<\/b><ul><li>n = liczba grup OH⁻ (w prostych wodorotlenkach = wartościowość kationu)<\/li><li>suma ładunków = 0<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#2e7d4f\"><b>WZORY I NAZWY<\/b><ul><li>NaOH, KOH, Ca(OH)₂<\/li><li>Al(OH)₃, Fe(OH)₃<\/li><li>Cu(OH)₂, Mg(OH)₂<\/li><li>nawias gdy OH &gt; 1<\/li><li>cyfra rzymska: Fe, Cu, Sn, Pb<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#b06f1c\"><b>ROZPUSZCZALNOŚĆ<\/b><ul><li>✓ NaOH, KOH, LiOH, Ba(OH)₂<\/li><li>~ Ca(OH)₂, Mg(OH)₂<\/li><li>× Fe(OH)₃, Cu(OH)₂, Al(OH)₃<\/li><li>Ca(OH)₂ = woda wapienna<\/li><li>mleko wapienne = zawiesina<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#2b5e9c\"><b>ZASADA I DYSOCJACJA<\/b><ul><li>zasada = wodny roztwór wodorotlenku<\/li><li>NaOH → Na⁺ + OH⁻<\/li><li>elektrolit — przewodzi prąd<\/li><li>rozpuszczalny ≠ mocny<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#6b3fa0\"><b>WŁAŚCIWOŚCI<\/b><ul><li>odczyn zasadowy<\/li><li>wskaźniki<\/li><li>zobojętnianie<\/li><li>tylko rozpuszczalne<\/li><li>NaOH, KOH: higroskopijne, żrące<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#2b5e9c\"><b>OTRZYMYWANIE<\/b><ul><li>1. tlenek + woda<\/li><li>2. metal aktywny + woda<\/li><li>3. sól + zasada<\/li><li>zależnie od wodorotlenku<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#b83a45\"><b>ZOBOJĘTNIANIE<\/b><ul><li>wodorotlenek + kwas<\/li><li>→ sól + woda<\/li><li>H⁺ + OH⁻ → H₂O<\/li><li>jony widzowe: Na⁺, Cl⁻<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#2e7d4f\"><b>INNE REAKCJE<\/b><ul><li>zasada + CO₂ → sól + woda<\/li><li>ogrzewanie → tlenek + woda<\/li><li>strącanie → osad o barwie kationu<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#6b3fa0\"><b>AMFOTERYCZNOŚĆ<\/b><ul><li>Al(OH)₃, Zn(OH)₂<\/li><li>+ kwasy, + zasady<\/li><li>poziom rozszerzony<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#b06f1c\"><b>Ca(OH)₂ — WAPNO<\/b><ul><li>palone CaO → gaszone Ca(OH)₂<\/li><li>mleko (zawiesina) → woda (roztwór)<\/li><li>wykrywanie CO₂, zaprawa<\/li><\/ul><\/div>\n<div class=\"mmx-box\" style=\"--mm:#1a2332\"><b>MOSTY: tlenki · kwasy · sole<\/b><ul><li>N01: tlenek zasadowy + woda<\/li><li>N03: kwas + zasada<\/li><li>N04: sól + zasada, produkt zobojętniania<\/li><\/ul><\/div>\n<\/div>\n<\/div>\n<\/section>\n<section id=\"slownik\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">22<\/span> Słownik<\/div>\n<div class=\"card\">\n<dl class=\"def-list\"><div class=\"def-item\"><dt>Higroskopijność<\/dt><dd>Zdolność substancji do pochłaniania wilgoci z powietrza (np. NaOH, KOH).<\/dd><\/div><div class=\"def-item\"><dt>Elektrolit<\/dt><dd>Substancja, której roztwór wodny przewodzi prąd dzięki jonom.<\/dd><\/div><div class=\"def-item\"><dt>Woda wapienna<\/dt><dd>Klarowny, nasycony roztwór Ca(OH)₂; mętnieje z CO₂.<\/dd><\/div><div class=\"def-item\"><dt>Wodorotlenek<\/dt><dd>Związek zawierający kation metalu i anion OH⁻. W zapisie szkolnym spotyka się NH₄OH, ale roztwór amoniaku opisujemy dokładniej przez równowagę NH₃ + H₂O ⇌ NH₄⁺ + OH⁻.<\/dd><\/div><div class=\"def-item\"><dt>Grupa wodorotlenkowa OH⁻<\/dt><dd>Anion o ładunku −1, składający się z tlenu i wodoru.<\/dd><\/div><div class=\"def-item\"><dt>Zasada (szkolnie)<\/dt><dd>Wodny roztwór niektórych wodorotlenków, który zawiera jony OH⁻ i ma odczyn zasadowy. W szerszym ujęciu zasadą może być także substancja niezawierająca grup OH⁻, np. amoniak NH₃.<\/dd><\/div><div class=\"def-item\"><dt>Zobojętnianie<\/dt><dd>Reakcja kwasu z zasadą → sól + woda.<\/dd><\/div><div class=\"def-item\"><dt>Wskaźnik<\/dt><dd>Substancja zmieniająca barwę zależnie od pH.<\/dd><\/div><div class=\"def-item\"><dt>Strącanie<\/dt><dd>Reakcja, w której powstaje trudno rozpuszczalny osad.<\/dd><\/div><div class=\"def-item\"><dt>Mleko wapienne<\/dt><dd>Zawiesina nierozpuszczonego Ca(OH)₂ w wodzie.<\/dd><\/div><div class=\"def-item\"><dt>Hydrat<\/dt><dd>Związek z cząsteczkami wody w sieci, np. CuSO₄·5H₂O.<\/dd><\/div><div class=\"def-item\"><dt>Amfoteryczny<\/dt><dd>Reagujący i z kwasami, i z zasadami.<\/dd><\/div><div class=\"def-item\"><dt>Dysocjacja elektrolityczna<\/dt><dd>Rozpad związku na jony w wodzie (Arrhenius).<\/dd><\/div><div class=\"def-item\"><dt>Nieelektrolit<\/dt><dd>Substancja, której roztwór nie przewodzi prądu, bo nie zawiera swobodnych jonów (np. cukier).<\/dd><\/div><div class=\"def-item\"><dt>Jony widzowe<\/dt><dd>Jony, które nie zmieniają się w reakcji (np. Na⁺ i Cl⁻ przy zobojętnianiu NaOH kwasem solnym); pomija się je w równaniu jonowym skróconym.<\/dd><\/div><div class=\"def-item\"><dt>Odczyn zasadowy<\/dt><dd>Odczyn roztworu o pH > 7 — nadmiar jonów OH⁻ względem czystej wody.<\/dd><\/div><div class=\"def-item\"><dt>Wapno palone / gaszone<\/dt><dd>CaO / Ca(OH)₂.<\/dd><\/div><div class=\"def-item\"><dt>Teoria Brønsteda<\/dt><dd>Kwas = donor protonu H⁺, zasada = akceptor H⁺.<\/dd><\/div><\/dl>\n<\/div>\n<\/section>\n<section id=\"checklista\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">23<\/span> Checklista<\/div>\n<div class=\"checklist\">\n<h4>Sprawdź, czy umiesz:<\/h4>\n<ul>\n<li>Zapisać wzór wodorotlenku dla dowolnego kationu.<\/li>\n<li>Potrafię zapisać wzory: NaOH, KOH, Ca(OH)₂, Al(OH)₃, Cu(OH)₂ i podać nazwy<\/li>\n<li>Zastosować nawias, gdy grupa OH⁻ powtarza się więcej niż raz.<\/li>\n<li>Nazwać wodorotlenek (z cyfrą rzymską dla Fe, Cu, Sn, Pb).<\/li>\n<li>Potrafię narysować szkolny model poglądowy Ca(OH)₂ i Al(OH)₃ (O–H ciągła, M···O przerywana) i wiem, że to nie jest wzór strukturalny cząsteczki<\/li>\n<li>Rozróżnić wodorotlenki rozpuszczalne i nierozpuszczalne.<\/li>\n<li>Rozróżnić wodorotlenek (substancja) od zasady (roztwór); znam pojęcie elektrolitu.<\/li>\n<li>Zapisać dysocjację zasady.<\/li>\n<li>Opisać odczyn zasadowy i wskaźniki.<\/li>\n<li>Znam higroskopijność NaOH/KOH i BHP ługów<\/li>\n<li>Rozróżniam wapno palone, gaszone, mleko i wodę wapienną<\/li>\n<li>Zapisać reakcję niektórych tlenków zasadowych metali aktywnych z wodą, np. CaO + H₂O → Ca(OH)₂.<\/li>\n<li>Wyjaśnić, dlaczego nie każdy tlenek reaguje z wodą.<\/li>\n<li>Rozpoznać, że metal aktywny + woda → wodorotlenek + wodór.<\/li>\n<li>Zapisać reakcję strącania z soli i zasady. Podać barwę osadu Cu(OH)₂ i Fe(OH)₃.<\/li>\n<li>Zapisać reakcję zobojętniania.<\/li>\n<li>Zapisać reakcję wody wapiennej z CO₂.<\/li>\n<li>(ambitnie) Wyjaśnić amfoteryczność.<\/li>\n<li>(ambitnie) Zapisać równanie jonowe skrócone.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"wskazowki\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">24<\/span> Wskazówki do nauki<\/div>\n<div class=\"tips-box\">\n<h4>Jak uczyć się skuteczniej — nie plan, tylko porady<\/h4>\n<p style=\"margin-bottom:14px;font-size:13.5px;color:var(--text-soft);\">Każdy uczy się inaczej i w swoim tempie. Poniżej zbiór wskazówek, które możesz wykorzystać w dowolnej kolejności.<\/p>\n<div class=\"tips-list\">\n<div class=\"tip-card\">\n<b>Odtwarzaj, nie zapamiętuj<\/b>\n          Nie ucz się wzorów na pamięć. Zawsze zaczynaj od ładunku kationu i policz, ile grup OH⁻ potrzebujesz. Wzór sam się zbuduje.\n        <\/div>\n<div class=\"tip-card\">\n<b>Używaj modeli naprzemiennie<\/b> Po przeczytaniu teorii od razu otwórz model: wzór wodorotlenku (<a href=\"#wzor-ogolny\">§5.2<\/a>), przegląd (<a href=\"#rozpuszczalnosc-tabela\">§6.2<\/a>), strącanie (<a href=\"#ion-lab\">§12<\/a>). Wzrokowiec zapamiętuje szybciej, gdy widzi i robi.\n        <\/div>\n<div class=\"tip-card\">\n<b>Fiszki w krótkich sesjach<\/b>\n          Lepiej 5 minut dziennie niż 30 minut raz w tygodniu. Fiszki są do szybkiego przypominania — nie czytaj ich jak podręcznika.\n        <\/div>\n<div class=\"tip-card\">\n<b>Sprawdzaj się po każdej sekcji<\/b>\n          Po każdej sekcji teoretycznej otwórz ćwiczenia i spróbuj rozwiązać 2–3 zadania. To pokaże, czy naprawdę rozumiesz, czy tylko rozpoznajesz.\n        <\/div>\n<div class=\"tip-card\">\n<b>Rysuj wzory ręcznie<\/b>\n          Narysuj na kartce Ca(OH)₂ z kationem i dwiema grupami OH⁻. Ręczne rysowanie utrwala strukturę lepiej niż czytanie.\n        <\/div>\n<div class=\"tip-card\">\n<b>Łącz z życiem codziennym<\/b>\n          Zauważ, gdzie w domu spotykasz wodorotlenki (środki czystości, leki na zgagę, wapno budowlane). Konkret zapamiętuje się łatwiej niż abstrakcja.\n        <\/div>\n<div class=\"tip-card\">\n<b>Powtarzaj błędy, nie tylko sukcesy<\/b>\n          Wróć do „Kliniki błędów\" i zapisz sobie trzy najczęstsze pułapki. Świadomość błędów chroni przed ich powtarzaniem.\n        <\/div>\n<div class=\"tip-card\">\n<b>Wracaj do mapy pojęć<\/b>\n          Na końcu nauki otwórz mapę pojęć i spróbuj samodzielnie odtworzyć połączenia. To test globalnego zrozumienia.\n        <\/div>\n<\/div>\n<\/div>\n<\/section>\n<section id=\"historia\" class=\"section\">\n<div class=\"part-heading\"><span class=\"part-num\">A<\/span> Dodatek A — Historia odkrycia <span class=\"level-badge level-extra\">NADPROGRAMOWE<\/span><\/div>\n<p>Skąd wiemy to, co wiemy? Poznanie wodorotlenków to ponad 200 lat obserwacji. Pięć momentów, które doprowadziły do dzisiejszej definicji.<\/p>\n<div class=\"hist-grid\">\n<figure class=\"hist-card\">\n<div class=\"hist-year\">1754<\/div>\n<div class=\"hist-who\">Joseph Black<\/div>\n<div class=\"hist-ill\">\n<div class=\"svgx\"><span>alkalia — substancje „mydlące”<\/span><span>wapno<\/span><span>potaż<\/span><span>soda<\/span><\/div>\n<\/div>\n<figcaption>Badał substancje alkaliczne (wapno, potaż, sodę). Pokazał, że „powietrze stałe” (CO₂) wiąże się z alkaliami — początek chemii zasad.<\/figcaption>\n<\/figure>\n<figure class=\"hist-card\">\n<div class=\"hist-year\">1807–08<\/div>\n<div class=\"hist-who\">Humphry Davy<\/div>\n<div class=\"hist-ill\">\n<div class=\"svgx\"><span>K / Na<\/span><span>O₂<\/span><span>+ −<\/span><span>elektroliza stopionych alkaliów<\/span><\/div>\n<\/div>\n<figcaption>Przez elektrolizę otrzymał potas i sód z alkaliów. Pokazał, że alkalia żrące — „potaż” i „soda” — są związkami nieznanych wcześniej metali: potasu i sodu. Metale litowców istnieją!<\/figcaption>\n<\/figure>\n<figure class=\"hist-card\">\n<div class=\"hist-year\">1810–20<\/div>\n<div class=\"hist-who\">Gay-Lussac i Thenard<\/div>\n<div class=\"hist-ill\">\n<div class=\"svgx\"><span>skład alkaliów = metal + tlen + wodór<\/span><span>Na<\/span><span>O<\/span><span>H<\/span><span>Na + O + H → NaOH<\/span><\/div>\n<\/div>\n<figcaption>Ustalili, że alkalia to połączenia metalu, tlenu i wodoru — droga do wzoru NaOH i pojęcia wodorotlenku.<\/figcaption>\n<\/figure>\n<figure class=\"hist-card\">\n<div class=\"hist-year\">1887<\/div>\n<div class=\"hist-who\">Svante Arrhenius<\/div>\n<div class=\"hist-ill\">\n<div class=\"svgx\"><span>dysocjacja w wodzie<\/span><span>Na⁺<\/span><span>OH⁻<\/span><span>H₂O<\/span><span>zasada → jony OH⁻ (definicja szkolna)<\/span><\/div>\n<\/div>\n<figcaption>Teoria dysocjacji elektrolitycznej: zasada to substancja, która w wodzie daje jony OH⁻. To definicja, której uczysz się na E8. Zob. <
