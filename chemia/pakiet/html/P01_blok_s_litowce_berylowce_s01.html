der);border-radius:var(--r-md);background:var(--surface-soft)}.lk-fig-body{display:flex;justify-content:center;overflow-x:auto}.lk-fig figcaption{margin-top:6px;font-size:13px;color:var(--text-soft);text-align:center}\n/* Styl klocków laboratoryjnych (palniki, probówki, układ okresowy) — dobrany do motywu che:\n   jasna karta lekcji (--surface), akcent --accent, tekst --text. Scena z płótnem zostaje ciemna\n   (płomienie i poświaty wyglądają na ciemnym tle), reszta jak w sekcjach lekcji. */\n:root{--lab:#0e2326;--lab-tekst:var(--text,#1a2332);--lab-cisza:var(--text-muted,#8892a0);--lab-linia:var(--border,#e5e9ee)}\n.lab{background:var(--surface,#fff);color:var(--text,#1a2332);border:1px solid var(--border,#e5e9ee);border-radius:var(--r-lg,14px);padding:16px;box-shadow:var(--sh-sm,none);font-family:var(--tekst,Inter,system-ui,sans-serif)}\n.lab-pasek{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}\n.lab-pasek .btn{background:var(--accent,#0d6868);border-color:var(--accent,#0d6868);color:#fff}\n.lab-cisza{color:var(--text-muted,#8892a0);font-size:14px}\n.btn{appearance:none;cursor:pointer;border:1px solid var(--accent,#0d6868);background:var(--accent,#0d6868);color:#fff;border-radius:var(--r-md,10px);padding:8px 14px;font:600 13px var(--tekst,Inter,sans-serif)}\n.btn.jasny{background:var(--surface,#fff);color:var(--accent,#0d6868)}\n.btn:hover{filter:brightness(1.08)}\n.btn:focus-visible{outline:2px solid var(--accent,#0d6868);outline-offset:2px}\n.btn[disabled]{opacity:.4;cursor:not-allowed}\n.stacje{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}\n.st{display:flex;flex-direction:column;background:none;border:none;padding:0;min-width:0}\n.st-opis{margin-top:auto;display:flex;flex-direction:column;justify-content:flex-end}\n.st canvas,.rack canvas{display:block;width:100%;height:auto;cursor:pointer;background:var(--lab,#0e2326);border-radius:var(--r-md,10px);margin:6px 0 4px t = (performance.now() - t0) / 1000; } grane = false; zegar.usun(klatka); }\n    c.addEventListener('click', function () { grane ? stop() : start(); });\n    if ('IntersectionObserver' in g && !RM_) {\n      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { e.isIntersecting ? start() : stop(); }); });\n      io.observe(c);\n    } else if (!RM_) { start(); }\n    k.rysuj(ctx, c.width, c.height, stan, 0, opc);\n    return {stop: stop, start: start, stan: stan, canvas: c};\n  }\n  g.KLOCKI = {def: def, montuj: montuj, zegar: zegar, nazwy: function () { return Object.keys(reg); }};\n})(window);\n\n/* KLOCKI — wspólne narzędzia (kolejność: pierwsze w manifeście). Wyciągnięte z animacji P01. */\n/* ---------------------------- narzędzia ---------------------------- */\nvar RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);\nfunction el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }\nfunction clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }\nfunction sm(v) { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }\nfunction cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }\nfunction hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }\nfunction rgba(h, a) { var c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }\nfunction mixHex(a, b, k) {\n  var A = hex2rgb(a), B = hex2rgb(b);\n  return '#' + [0, 1, 2].map(function (i) { return ('0' + Math.round(A[i] + (B[i] - A[i]) * k).toString(16)).slice(-2); }).join('');\n}\nfunction rr(x, a, b, w, h, r) {\n  x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);\n  x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();\n}\n\n\n/* ---------------------------- pętla animacji ---------------------------- */\n// jeden zegar: KLOCKI.zegar (klocki.j redaWoda']],['Roztwór — substancja rozpuszczona',['f01SolWoda','f01Odparowanie']]],\n {f03PiasekWoda:{war:'piasek w zlewce z wodą, zamieszanie bagietką, odstawienie',wn:'Różnica: piasek nie rozpuszcza się i ma większą gęstość niż woda → sedymentacja, potem dekantacja albo sączenie.',bhp:'Szkło — ostrożnie; okulary.'},\n  f03KredaWoda:{war:'sproszkowana kreda w wodzie, mieszanie',wn:'Drobne cząstki opadają wolno — szybciej rozdzieli je sączenie przez bibułę; przesącz jest klarowny.',bhp:'Okulary; sączek nie może być przedziurawiony bagietką.'},\n  f01SolWoda:{war:'sól kuchenna w wodzie, mieszanie',wn:'Sól rozpuszcza się — przechodzi przez sączek razem z wodą. Sączenie nie zadziała; trzeba wykorzystać lotność wody (odparowanie, krystalizacja lub destylacja).',bhp:'Nie smakujemy substancji w pracowni.'},\n  f01Odparowanie:{war:'roztwór soli w parownicy, ogrzewanie',wn:'Woda odparowuje, sól krystalizuje na dnie — odzyskujemy substancję rozpuszczoną (wodę tracimy; chcąc ją odzyskać — destylacja).',bhp:'Gorąca parownica — szczypce; okulary (pryskanie pod koniec).'}},\n 'GFX.rx · rozszerzenia.js (F03)');\n\n/* ---------- 8. F05 — konstruktor: izotop / jon / inny pierwiastek + masa atomowa jako średnia ważona ----------\n   Model wielokrotnego użytku (F04, F05, F06, A01…): `f05-izotopy-v01`. Dane izotopów z silnika (CHE.DATA.ISOTOPES). */\n/* dane z silnika (bez lokalnej kopii): CHE.DATA.ELEMENTS_54 (symbol, nazwa) + CHE.DATA.ISOTOPES (A, masa, udział) */\nfunction izo(z){var E=(D.ELEMENTS_54||[]).filter(function(e){return e.z===z})[0];if(!E)return null;\n var L=(D.ISOTOPES||{})[E.s]||[];return [E.s,String(E.n||E.s).toLowerCase(),L.map(function(x){return [x.A,x.atomicMass,(x.abundance||0)*100]}).sort(function(a,b){return b[2]-a[2]||a[0]-b[0]})]}\nfunction supN(n){return String(n).replace(/[0-9]/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]})}\nfunction subN(n){return String(n).replace(/[0-9]/g,function(d){return '₀₁₂₃₄₅₆₇₈₉'[d]})}\nfunction chg(q){return q===0?'':(Math.abs(q)>1?supN(Math.abs(q)):'')+(q>0?'⁺':'⁻')}\nfunction pl(x,d){return x.toFixed(d).replace('.',',')}\n/* atomSVG — komponent wielokrotnego użytku (F05, F07, A01…): model atomu jako SVG, kolory jak w atlasie (_anon_004 bohr: elektrony wewnętrzne #2f8a55, walencyjne #b85f00).\n   o = {p, n, e, powloki:false|true, W:260}. powloki:false → elektrony na jednym okręgu (F05; powłoki to pojęcie F07);\n   powloki:true → powłoki K, L, M, N wg modelu szkolnego 2, 8, 8, … (do Z = 20; dalej uproszczenie — do weryfikacji). Zwraca otwarty <svg…> (zamknąć '<\/svg>'). */\nfunction atomSVG(o){var W=o.W||260,C=W/2,p=o.p|0,n=o.n|0,e=o.e|0,svg='<svg viewBox=\"0 0 '+W+' '+W+'\" width=\"100%\" style=\"max-width:'+W+'px;display:block;margin:auto\" role=\"img\" aria-label=\"Model atomu: '+p+' p, '+n+' n, '+e+' e\">';\n var N=p+n,sk=W/260;\n for(var i=0;i<N;i++){var a=i*2.39996,r=4.2*sk*Math.sqrt(i+.5);svg+='<circle cx=\"'+(C+r*Math.cos(a)).toFixed(1)+'\" cy=\"'+(C+r*Math.sin(a)).toFixed(1)+'\" r=\"'+(4.6*sk).toFixed(1)+'\" fill=\"'+(Math.floor((i+1)*p/N)>Math.floor(i*p/N)?'#d9534f':'#7f8da0')+'\" stroke=\"#fff\" stroke-width=\".8\"/>'}\n var sh=[];if(o.powloki){var cap=[2,8,8],left=e;for(var q=0;left>0;q++){var c=q<3?Math.min(cap[q],left):left;sh.push(c);left-=c}}else if(e)sh=[e];\n var R0=o.powloki?Math.max(40*sk,6*sk*Math.sqrt(N)+18*sk):104*sk,st=sh.length>1?(104*sk-R0)/(sh.length-1):0;\n sh.forEach(function(cnt,q){var R=sh.length>1?R0+q*st:(o.powloki?R0:104*sk),wal=o.powloki&&q===sh.length-1;\n  svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+R.toFixed(1)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n  if(o.powloki)svg+='<text x=\"'+(C+R*0.71+4).toFixed(1)+'\" y=\"'+(C-R*0.71-4).toFixed(1)+'\" font-size=\"'+(11*sk).toFixed(0)+'\" fill=\"#5b6773\">'+'KLMN'[q]+'<\/text>';\n  for(var k=0;k<cnt;k++){var b=k/cnt*2*Math.PI-Math.PI/2;svg+='<circle cx=\"'+(C+R*Math.cos(b)).toFixed(1)+'\" cy=\"'+(C+R*Math.sin(b)).toFixed(1)+'\" r=\"'+(5*sk).toFixed(1)+'\" fill=\"'+(o.powloki?(wal?'#b85f00': do treści<\/a>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">P01 · BLOK s · GRUPY 1–2<\/div><h1>Blok s — litowce i berylowce<\/h1><p class=\"lead\">Metale grup 1 i 2 należą do najbardziej reaktywnych metali w układzie okresowym. Ta lekcja pokazuje, skąd bierze się ta reaktywność i jak zmienia się w grupie.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-exam\">TRENING<\/span><span class=\"level-badge level-lo\">ROZSZERZENIE<\/span><span class=\"level-badge level-olim\">DLA AMBITNYCH<\/span><span class=\"level-badge level-uni\">ZAAWANSOWANE<\/span><\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><p class=\"mini-note\">Lekcja z szkieletu kanonu P01 (wymaga: F06, F11, N03), przepisana od zera. Legenda warstw: basic = podstawa E8; lo = rozszerzenie; olim = dla ambitnych; uni = zaawansowane. Treści ponad podstawę są oznaczone i nie są wymagane na egzaminie. Liczby orientacyjne oznaczono do W1.<\/p><\/section>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#sciaga\">0. Ściąga — cała lekcja na jednej stronie<\/a><a class=\"toc-link\" href=\"#polozenie\">1. Wykład — położenie w układzie i dlaczego te dwie grupy<\/a><a class=\"toc-link\" href=\"#wlasciwosci\">2. Właściwości fizyczne i trend w grupie<\/a><a class=\"toc-link\" href=\"#reakcje\">3. Reakcje z wodą i tlenem<\/a><a class=\"toc-link\" href=\"#wodorotlenki\">4. Wodorotlenki i tlenki — zasadowy charakter<\/a><a class=\"toc-link\" href=\"#plomienie\">5. Płomienie i spalanie — trzy sekwencje palników<\/a><a class=\"toc-link\" href=\"#zastosowania\">6. Zastosowania<\/a><a class=\"toc-link\" href=\"#klinika\">7. Klinika błędów<\/a><a class=\"toc-link\" href=\"#cwiczenia\">8. Ćwiczenia z kluczem<\/a><a class=\"toc-link\" href=\"#warstwy-karty\">9. Sekcje warstwowe (ponad podstawę)<\/a><a class=\"toc-link\" href=\"#fiszki\">10. Fiszki<\/a><a class=\"toc-link\" href=\"#slownik\">11. Słownik<\/a><a class=\"toc-link\" href=\"#test\">12. Test końcowy<\/a><a class=\"toc-link\" href=\"#ciekawostki\">13. Ciekawostki<\/a><a class=\"toc-link\" href=\"#mnemotechniki\">14. Sposoby zapamiętania<\/a><a class=\"toc-link\" href=\"#odpowiedz\">15. Odpowiedź na pytanie przewodnie<\/a><a class=\"toc-link\" href=\"#dalej\">16. Co dalej?<\/a><a class=\"toc-link\" href=\"#checklista\">17. Checklista — umiem…<\/a><a class=\"toc-link\" href=\"#zrodla\">Pochodzenie i sprawdzenie treści<\/a><\/nav><\/details>\n<p>Metale grup 1 i 2 (litowce i berylowce) tworzą blok s, bo ich ostatni elektron leży na podpowłoce s. Są bardzo reaktywne: oddają elektrony łatwo i chętnie tworzą jony dodatnie. Zrozumienie tej jednej cechy wyjaśnia prawie wszystko, co dzieje się z nimi w doświadczeniach i w przyrodzie.<\/p>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć — 6 punktów<\/h3>\n<ol>\n<li><strong>Grupa 1 (litowce)<\/strong> — Li, Na, K, Rb, Cs, Fr. Mają jeden elektron walencyjny, więc wartościowość I.<\/li>\n<li><strong>Grupa 2 (berylowce)<\/strong> — Be, Mg, Ca, Sr, Ba, Ra. Mają dwa elektrony walencyjne, więc wartościowość II.<\/li>\n<li><strong>Reaktywność w grupie<\/strong> rośnie w dół: im większy atom, tym łatwiej oddaje elektrony. (Be jest wyjątkiem w zachowaniu wobec wody — patrz warstwa lo.)<\/li>\n<li><strong>Reakcja z wodą<\/strong> daje wodorotlenek i wodór, np. 2 Na + 2 H₂O → 2 NaOH + H₂.<\/li>\n<li><strong>Tlenki<\/strong> litowców są zasadowe, tlenki berylowców są zasadowe z wyjątkiem amfoterycznego BeO. Wodorotlenki LiOH, NaOH, KOH, Ca(OH)₂ i Ba(OH)₂ mają właściwości zasadowe; Be(OH)₂ jest amfoteryczny.<\/li>\n<li><strong>Płomienie:<\/strong> lit daje czerwony, sód żółty, potas fioletowy (przez filtr kobaltowy), wapń ceglastoczerwony, bar zielony. Barwy pozwalają wykryć metal bez wzorów.<\/li>\n<\/ol>\n<\/section>\n<div class=\"layer-legend\">\n<div class=\"layer-row\"><span class=\"dot basic\"><\/span><span><b>Podstawa (E8):<\/b> położenie w układzie; wartościowość I i II; reakcje z wodą i tlenem; wodorotlenki; zastosowania<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot lo\"><\/span><span><b>Rozszerzenie:<\/b> dlaczego reaktywność rośnie w dół (promień, energia jonizacji); dlaczego beryl nie reaguje z wodą; nadtlenki<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot olim\"><\/span><span><b>Dla ambitnych:<\/b> wodorotlenek berylu jako amfoteryczny; porównanie szybkości reakcji i uzasadnienie kinetyką<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot uni\"><\/span><span><b>Zaawansowane:<\/b> granica modelu „metal oddaje elektrony”: wiązanie metaliczne i energia jonizacji<\/span><\/div>\n<\/div>\n<div id=\"rdzen\" class=\"core-path\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to<\/div>\n<ol>\n<li><strong><a href=\"#polozenie\">§1<\/a><\/strong> — gdzie są litowce i berylowce i co je łączy.<\/li>\n<li><strong><a href=\"#reakcje\">§3<\/a><\/strong> — reakcje z wodą i tlenem. To sedno lekcji.<\/li>\n<li><strong><a href=\"#wodorotlenki\">§4<\/a><\/strong> — wodorotlenki i ich moc.<\/li>\n<li><strong><a href=\"#cwiczenia\">§8<\/a><\/strong> — ćwiczenia z kluczem.<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Pytanie przewodnie<\/span>\n<p>Dlaczego sód trzymamy w nafcie, a magnezową taśmę można po rozgrzaniu spalić w powietrzu? Odpowiedź znajdziesz w §15.<\/p>\n<\/div>\n<section id=\"sciaga\">\n<div class=\"part-heading\"><span class=\"part-num\">0<\/span> Ściąga — cała lekcja na jednej stronie<\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Grupa<\/th><th>Metale<\/th><th>Wartościowość<\/th><th>Reakcja z wodą (zimna)<\/th><th>Wodorotlenek<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>Li, Na, K<\/td><td>I<\/td><td>gwałtowna (Li wolniej, K najgwałtowniej); Na i K ostrzeżenia<\/td><td>LiOH, NaOH, KOH — zasady mocne<\/td><\/tr>\n<tr><td>2<\/td><td>Be, Mg, Ca, Sr, Ba, Ra<\/td><td>II<\/td><td>Be — praktycznie nie; Mg — bardzo wolno; Ca — wyraźnie; Sr, Ba — energicznie (Ra: tylko model)<\/td><td>Ca(OH)₂, Ba(OH)₂ — związki o właściwościach zasadowych; Be(OH)₂ — amfoteryczny<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Reguły:<\/strong> elektrony walencyjne = numer grupy (grupa 1 → 1, grupa 2 → 2). Reaktywność w grupie rośnie w dół. Płomienie: Li karmazynowy, Na żółty, K fioletowy, Ca ceglastoczerwony, Ba zielony.<\/p>\n<\/section>\n<section id=\"polozenie\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Wykład — położenie w układzie i dlaczego te dwie grupy<\/div>\n<figure class=\"lk-fig\" data-klocek=\"uklad-okresowy\" data-opt=\"{&quot;wybrany&quot;: &quot;Na&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Układ okresowy: kafelki litowców i berylowców<\/figcaption><\/figure>\n<!-- OPIS: Tablica okresowa z dwoma rzędami kafelków: grupa 1 (Li, Na, K, Rb, Cs, Fr) i grupa 2 (Be, Mg, Ca, Sr, Ba, Ra). Po kliknięciu kafelka pod spodem pojawia się opis pierwiastka i przyciski prób w probówce i w płomieniu. Ra i Fr mają znak promieniowania. Wniosek: położenie w grupie mówi, ile elektronów walencyjnych ma atom i jak reaguje. -->\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład od zera<\/span>\n<p>Układ okresowy porządkuje pierwiastki według liczby atomowej. Pierwiastki z tą samą liczbą elektronów walencyjnych trafiają do tej samej kolumny (grupy). W pierwszej kolumnie (grupa 1) stoją pierwiastki z jednym elektronem na zewnętrznej powłoce. W drugiej (grupa 2) — z dwoma.<\/p>\n<p>Elektrony walencyjne są najdalej od jądra i najsłabiej w nim trzymane. Dlatego atom łatwo je oddaje, zamieniając się w jon dodatni: Na → Na⁺ + e⁻. Stąd nazwa bloku s — ostatni elektron jest na podpowłoce s.<\/p>\n<p>Metale tych grup mają wspólne cechy: błyszczą świeżym przekrojem, który szybko matowieje w powietrzu. Litowce są miękkie (lit, sód i potas kroi się nożem), a lit, sód i potas pływają na wodzie, choć reagują z nią. Berylowce są twardsze i gęstsze — wszystkie cięższe od wody.<\/p>\n<p><strong>Gdzie analogia się psuje:<\/strong> „oddawanie elektronu” to model. Elektrony w metalu nie są przypisane do pojedynczego atomu — tworzą wspólną chmurę (wiązanie metaliczne, warstwa uni).<\/p>\n<\/div>\n<h3 id=\"bhp\">1.1 Mini-wykład: po co chemik trzyma sód w nafcie<\/h3>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie: BHP przy metalach s<\/span>\n<p>Sód i potas reagują z wilgocią z powietrza i z wodą. Przechowuje się je pod warstwą nafty, która odcina dostęp powietrza i wody. Nie dotykamy ich ręką i nie wrzucamy do wody bez nadzoru. Reakcje litowców z wodą to zawsze pokaz nauczyciela, nie zadanie ucznia.<\/p>\n<\/div>\n<\/section>\n<section id=\"wlasciwosci\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Właściwości fizyczne i trend w grupie<\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Cecha<\/th><th>Grupa 1 (litowce)<\/th><th>Grupa 2 (berylowce)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Elektrony na ostatniej powłoce<\/td><td>1<\/td><td>2<\/td><\/tr>\n<tr><td>Konfiguracja walencyjna<\/td><td>ns¹<\/td><td>ns²<\/td><\/tr>\n<tr><td>Twardość<\/td><td>miękkie (Li, Na, K)<\/td><td>twardsze (Mg, Ca)<\/td><\/tr>\n<tr><td>Gęstość<\/td><td>małe (Li, Na, K &lt; 1 g/cm³)<\/td><td>większe (Mg, Ca ok. 1,5–1,8 g/cm³ — orientacyjnie)<\/td><\/tr>\n<tr><td>Reaktywność<\/td><td>rośnie w dół<\/td><td>rośnie w dół (Be słabo)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Przykład prowadzony: jaki metal jest najbardziej reaktywny spośród Li, Na i K?<\/span>\n<p><strong>Dane:<\/strong> Li, Na, K — wszystkie w grupie 1.\n<strong>Krok 1:<\/strong> w grupie 1 atomy od góry w dół mają coraz więcej powłok (Li 2, Na 3, K 4).\n<strong>Krok 2:<\/strong> im więcej powłok, tym dalej elektron walencyjny od jądra i tym słabiej jest przyciągany.\n<strong>Krok 3:<\/strong> słabiej przyciągany elektron jest łatwiej oddawany.\n<strong>Wniosek:<\/strong> potas jest najbardziej reaktywny z tej trójki.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Sprawdź się<\/span>\n<p>Który metal z grupy 2 ma najbardziej „miękki” elektron walencyjny: Mg czy Ba? (Odpowiedź: Ba — ma więcej powłok, więc elektrony są słabiej trzymane.)<\/p>\n<\/div>\n<\/section>\n<section id=\"reakcje\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Reakcje z wodą i tlenem<\/div>\n<figure class=\"lk-fig\" data-klocek=\"probowki\" data-opt=\"{&quot;metale&quot;: &quot;Mg,Ca,Na&quot;, &quot;wskaznik&quot;: &quot;1&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Trzy probówki z wodą: magnez, wapń i sód. Trzy różne efekty.<\/figcaption><\/figure>\n<!-- OPIS: Trzy probówki stoją obok siebie. Magnez: prawie nic nie widać, po fenoloftaleinie tylko blade różowienie. Wapń: stały strumień pęcherzyków H₂, roztwór mętnieje. Sód: szybka reakcja, pokazana jako animacja, nie jako doświadczenie uczniowskie. Pod probówkami wybierzesz dowolny metal litowców i berylowców albo tlenek wapnia CaO. Wniosek: reakcja zależy od metalu; barwa fenoloftaleiny pokazuje powstanie zasady. -->\n<div class=\"card card-warning\">\n<span class=\"card-label\">Status: wizualizacja komputerowa — sód z wodą<\/span>\n<p>Reakcję sodu z wodą przedstawiono komputerowo, a nie jako instrukcję doświadczenia. Wodór może się zapalić, a roztwór NaOH jest żrący.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Strategia → rozwiązanie → sprawdzenie: bilans reakcji sodu z wodą<\/span>\n<p><strong>Strategia:<\/strong> zapisuję substraty i produkty. Produkty to wodorotlenek i wodór, bo metal wypiera wodór z wody.\n<strong>Rozwiązanie:<\/strong> Na + H₂O → NaOH + H₂. Bilans: sód 1 = 1, ale wodór po lewej 2, po prawej 2 + 1 = 3. Daję 2 przed Na, H₂O i NaOH: 2 Na + 2 H₂O → 2 NaOH + H₂.\n<strong>Sprawdzenie:<\/strong> Na 2 = 2; H: po lewej 2·2 = 4 (2 H₂O); po prawej 2·1 (NaOH) + 2 (H₂) = 4; O 2 = 2. ✔<\/p>\n<\/div>\n<p><strong>Zasada:<\/strong> aktywne metale grupy 1 oraz wybrane metale grupy 2 reagują z wodą, dając wodorotlenek i wodór. Szybkość zależy od metalu, temperatury, powierzchni metalu i warstwy tlenkowej. W grupie 1 reaktywność na ogół rośnie w dół; wynika to z większego promienia atomowego i mniejszej energii jonizacji:<\/p>\n<ul>\n<li><strong>Li<\/strong> — reaguje, ale wolniej niż Na.<\/li>\n<li><strong>Na<\/strong> — reaguje gwałtownie, wodór może się zapalić.<\/li>\n<li><strong>K<\/strong> — reaguje najgwałtowniej z trójki; ciepło topi go w trakcie.<\/li>\n<li><strong>Ca<\/strong> — reaguje wyraźnie już w temperaturze pokojowej: wydziela się H₂, a roztwór mętnieje od słabo rozpuszczalnego Ca(OH)₂.<\/li>\n<li><strong>Mg<\/strong> — z zimną wodą reaguje bardzo wolno; z gorącą wodą wyraźniej, a z parą wodną daje MgO i H₂: Mg + H₂O(g) → MgO + H₂.<\/li>\n<li><strong>Be<\/strong> — praktycznie nie reaguje z wodą: chroni go szczelna warstwa BeO, a także niska rozpuszczalność produktów. Patrz §9, karta „Dlaczego beryl jest wyjątkiem”.<\/li>\n<\/ul>\n<p><strong>Reakcje z tlenem.<\/strong> Litowce reagują z tlenem, ale główny produkt zależy od metalu i warunków: lit daje głównie <strong>Li₂O<\/strong> (4Li + O₂ → 2Li₂O), sód w nadmiarze tlenu daje <strong>Na₂O₂<\/strong> (2Na + O₂ → Na₂O₂); przy ograniczonym dostępie tlenu powstaje <strong>Na₂O<\/strong> (4Na + O₂ → 2Na₂O), a Na₂O w nadmiarze tlenu dalej tworzy nadtlenek (2Na₂O + O₂ → 2Na₂O₂). Potas i cięższe litowce mogą tworzyć ponadtlenki, np. <strong>KO₂<\/strong>. Bar i stront tworzą też nadtlenki: bar przy ogrzewaniu daje głównie <strong>BaO₂<\/strong> (Ba + O₂ → BaO₂), często z domieszką BaO. Be, Mg i Ca na ogół nie tworzą nadtlenków; spalają się do tlenków, np. 2Mg + O₂ → 2MgO; magnez — zob. pułapkę w §3.<\/p>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Status: opis reakcji bez wykonania — potas z wodą<\/span>\n<p>Potas reaguje z wodą bardzo gwałtownie: może się stopić, zapalić, a rozprysk żrącego KOH jest groźny. Pokazujemy go w animacji lub na filmie; nie jest to doświadczenie do wykonania.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Pułapka: „metal + woda = zawsze gwałtownie”<\/span>\n<p>Nie. Tempo zależy od metalu i od warunków. Mg nie reaguje gwałtownie z zimną wodą, a Be prawie wcale. Zawsze określ, o który metal i o jaką wodę chodzi.<\/p>\n<\/div>\n<\/section>\n<section id=\"wodorotlenki\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Wodorotlenki i tlenki — zasadowy charakter<\/div>\n<ul>\n<li><strong>LiOH, NaOH, KOH<\/strong> — zasady mocne; dobrze rozpuszczalne w wodzie.<\/li>\n<li><strong>Ca(OH)₂<\/strong> — wapno gaszone: związek o właściwościach zasadowych, słabo rozpuszczalny w wodzie; stosowany w budownictwie.<\/li>\n<li><strong>Ba(OH)₂<\/strong> — silnie zasadowy, dobrze rozpuszczalny; sole baru są trujące.<\/li>\n<li><strong>Be(OH)₂<\/strong> — amfoteryczny: reaguje z kwasem jak zasada i z zasadą jak kwas.<\/li>\n<li><strong>Tlenki<\/strong> litowców są zasadowe: Na₂O + H₂O → 2 NaOH. Tlenki berylowców są zasadowe z wyjątkiem amfoterycznego BeO; np. CaO + H₂O → Ca(OH)₂.<\/li>\n<\/ul>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mini-wykład: dlaczego zasadowe, a nie kwaśne<\/span>\n<p>Tlenki litowców, CaO, SrO i BaO reagują z wodą, dając wodorotlenki i jony OH⁻. MgO reaguje z wodą prawie wcale, a BeO wcale; zasadowość MgO widać w reakcji z kwasem: MgO + 2 HCl → MgCl₂ + H₂O. Roztwór z jonami OH⁻ ma odczyn zasadowy. Tlenki niemetali robią to odwrotnie (np. CO₂ + H₂O → H₂CO₃, odczyn kwaśny). To jest szkielet, na którym opiera się cała klasyfikacja tlenków (lekcja N02).<\/p>\n<\/div>\n<\/section>\n<section id=\"plomienie\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Płomienie i spalanie — trzy sekwencje palników<\/div>\n<p>Palniki pokazują <strong>cztery sekwencje po trzy palniki<\/strong>; przełącznik nad palnikami wybiera jedną. Pod każdym palnikiem wybierzesz dowolny pierwiastek litowców lub berylowców. Naraz widać zawsze trzy palniki. Każda sekwencja odpowiada na inne pytanie:<\/p>\n<ul>\n<li><strong>Próba płomieniowa<\/strong> — jaka barwa oznacza jaki metal?<\/li>\n<li><strong>Spalanie i utlenianie<\/strong> — jaki związek powstaje z tlenem?<\/li>\n<li><strong>Nadtlenki<\/strong> — które metale tworzą nadtlenki zamiast zwykłych tlenków (Na, Sr, Ba)?<\/li>\n<li><strong>Model teoretyczny<\/strong> — co z pierwiastkami, których nie wykonuje się w szkole?<\/li>\n<\/ul>\n<figure class=\"lk-fig\" data-klocek=\"palniki\" data-opt=\"{&quot;seria&quot;: &quot;plomien&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Palniki: cztery sekwencje do wyboru (po trzy palniki naraz)<\/figcaption><\/figure>\n<!-- OPIS: Trzy palniki stoją w jednym rzędzie, nad nimi przełącznik sekwencji. Sekwencja „Próba płomieniowa”: sód żółty, potas fioletowy, wapń ceglastoczerwony. „Spalanie i utlenianie”: lit, magnez i wapń, pod każdym podany produkt (Li₂O, MgO, CaO). „Nadtlenki”: sód, stront i bar, pod każdym podany produkt (Na₂O₂, SrO z domieszką SrO₂, BaO₂). „Model teoretyczny”: rubid, cez i rad. Wniosek: barwa płomienia wskazuje metal, a produkt spalania zależy od metalu i warunków. -->\n<div class=\"card card-warning\">\n<span class=\"card-label\">Status: wizualizacja komputerowa — próba płomieniowa<\/span>\n<p>Barwę pokazano komputerowo. Płomień sodu jest bardzo intensywny; w prawdziwej pracowni ślady sodu zagłuszają inne barwy. Próbę wykonuje się tylko pod nadzorem nauczyciela.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Status: wizualizacja komputerowa — bar<\/span>\n<p>Bar barwi płomień na zielono, ale jego sole są trujące. Próbę płomieniową baru pokazujemy tylko jako wizualizację; nie wykonuje się jej z solami baru w szkole.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Status: wizualizacja komputerowa — spalanie i utlenianie<\/span>\n<p>Spalanie litowców i magnezu jest gwałtowne, a magnez daje oślepiająco biały błysk. Tu zobaczysz produkt, a nie instrukcję. Nie patrz prosto w błysk. Spalanie magnezu nie jest próbą płomieniową — w tej sekwencji nie porównujemy barw.<\/p>\n<p><strong>Wapń:<\/strong> spala się do tlenku, 2Ca + O₂ → 2CaO. Sam CaO nie pali się, bo jest już produktem utlenienia metalu.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Status: wizualizacja komputerowa — spalanie baru (nadtlenek)<\/span>\n<p>Bar tworzy przy ogrzewaniu nadtlenek BaO₂ (Ba + O₂ → BaO₂), często z domieszką BaO. Sole baru są trujące, a metal reaguje gwałtownie z tlenem i wilgocią. W szkole nie wykonuje się tej reakcji; pokazujemy ją tylko jako wizualizację.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Status: model teoretyczny — rad (UWAGA: rzeczywista reakcja niebezpieczna)<\/span>\n<p><strong>Model teoretyczny.<\/strong> Rad jest promieniotwórczy i nie jest używany w szkolnych doświadczeniach. Rubid i cez to reakcje niemożliwe do wykonania w szkole. Tu pokazujemy jedynie ich miejsce w grupie i przewidywane analogie. Znak promieniowania i zakaz przy radzie obowiązują także w wizualizacji.<\/p>\n<p><strong>Frans (Fr):<\/strong> brak wiarygodnych danych o barwie płomienia i o reakcjach. Przewidywana reakcja z wodą 2Fr + 2H₂O → 2FrOH + H₂ jest wyłącznie teoretyczna; nie pokazujemy jej animacją, a tlenek franu nie jest pewnie znany.<\/p>\n<\/div>\n<\/section>\n<section id=\"zastosowania\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Zastosowania<\/div>\n<ul>\n<li><strong>Li<\/strong> — baterie litowe, stopy lekkie.<\/li>\n<li><strong>Na<\/strong> — sól kuchenna NaCl; sód w lampach wysokoprężnych (żółte światło).<\/li>\n<li><strong>K<\/strong> — nawozy potasowe (zwykle chlorek KCl lub azotan(V)).<\/li>\n<li><strong>Mg<\/strong> — stopy lekkie, np. w przemyśle lotniczym; składnik chlorofilu.<\/li>\n<li><strong>Ca<\/strong> — wapno w budownictwie i rolnictwie; kości i zęby zawierają fosforany wapnia.<\/li>\n<li><strong>Ba<\/strong> — siarczan(VI) baru BaSO₄ w diagnostyce (praktycznie nierozpuszczalny; silnie pochłania promienie X, dlatego widać go na zdjęciach).<\/li>\n<\/ul>\n<\/section>\n<section id=\"klinika\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Klinika błędów<\/div>\n<table class=\"klinika-table\"><thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><\/tr><\/thead><tbody><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Wszystkie metale grupy 2 reagują z wodą tak samo”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Tempo zależy od metalu; Be prawie nie reaguje<\/td><td data-label=\"Dlaczego\">Różna reaktywność w grupie i wyjątek berylu<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Sód w nafcie, bo nafta jest zapalna”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Nafta odcina powietrze i wilgoć<\/td><td data-label=\"Dlaczego\">Metal chroni się przed reakcją, a nie przed płomieniem<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Tlenek metalu daje kwas”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Tlenek metalu w wodzie daje zasadę (OH⁻)<\/td><td data-label=\"Dlaczego\">Kwasy dają tlenki niemetali<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Litowce mają dwa elektrony walencyjne”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Litowce: jeden (grupa 1); berylowce: dwa<\/td><td data-label=\"Dlaczego\">Numer grupy = liczba elektronów walencyjnych w grupach 1–2<\/td><\/tr><\/tbody><\/table>\n<\/section>\n<section id=\"cwiczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Ćwiczenia z kluczem<\/div>\n<p><strong>Poziom A — podstawowy<\/strong><\/p>\n<div class=\"card card-exam\">\n<span class=\"card-label\">A1 (2 pkt) — rozpoznanie<\/span>\n<p>Podaj liczbę elektronów walencyjnych i wartościowość: a) Na, b) Mg.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<ul>\n<li>Podpowiedź 1: w grupie 1 jest jeden elektron walencyjny.<\/li>\n<li>Podpowiedź 2: w grupie 2 są dwa.<\/li>\n<li>Rozwiązanie: a) Na — 1 elektron, wartościowość I; b) Mg — 2 elektrony, wartościowość II. (1 pkt za a, 1 pkt za b.)<\/li>\n<\/ul>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">A2 (2 pkt) — zastosowanie<\/span>\n<p>Napisz wzory wodorotlenków: litu, wapnia, baru.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>LiOH; Ca(OH)₂; Ba(OH)₂. (1 pkt za dwa poprawne, 1 pkt za trzeci.)<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">A3 (2 pkt) — rozpoznanie<\/span>\n<p>Próbka barwi płomień na żółto. Jaki metal jest obecny? Uzasadnij.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>Sód (Na) — żółty płomień to charakterystyczna cecha sodu. (1 pkt za sód, 1 pkt za uzasadnienie płomieniem.)<\/p>\n<\/details>\n<\/div>\n<p><strong>Poziom B — egzaminacyjny<\/strong><\/p>\n<div class=\"card card-exam\">\n<span class=\"card-label\">B1 (3 pkt) — transformacja<\/span>\n<p>Zbilansuj: K + H₂O → KOH + H₂.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<ul>\n<li>Podpowiedź 1: po prawej są dwa atomy H w H₂ i jeden w KOH.<\/li>\n<li>Podpowiedź 2: potas i wodór: po prawej łącznie 3 H, po lewej 2 H w wodzie.<\/li>\n<li>Rozwiązanie: 2 K + 2 H₂O → 2 KOH + H₂. (1 pkt za współczynnik 2 przed K, 1 pkt za 2 przed H₂O i KOH, 1 pkt za sprawdzenie.)<\/li>\n<\/ul>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">B2 (3 pkt) — uzasadnienie<\/span>\n<p>Wyjaśnij, dlaczego potas reaguje z wodą gwałtowniej niż lit.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<ul>\n<li>Podpowiedź 1: co się dzieje z promieniem atomu i z elektronem walencyjnym w dół grupy?<\/li>\n<li>Podpowiedź 2: który elektron jest łatwiej oddać?<\/li>\n<li>Rozwiązanie: K ma więcej powłok niż Li, więc elektron walencyjny jest dalej od jądra i słabiej przyciągany. Łatwiej go oddaje, więc reakcja z wodą zachodzi gwałtowniej. (1 pkt za promień, 1 pkt za przyciąganie, 1 pkt za wniosek.)<\/li>\n<\/ul>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">B3 (3 pkt) — analiza (kontekst: lampy i bezpieczeństwo)<\/span>\n<p>Lampa sodowa świeci dzięki parom sodu zamkniętym w szczelnej rurze. Podaj dwa powody, dla których sód nie może mieć kontaktu z powietrzem i wodą, i zaznacz, który wynika z reaktywności.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<ul>\n<li>Podpowiedź 1: co się dzieje z sodem w kontakcie z wilgocią?<\/li>\n<li>Podpowiedź 2: jaki jest stan skupienia sodu w normalnej temperaturze?<\/li>\n<li>Rozwiązanie: metaliczny sód reaguje z wodą i wilgocią z powietrza (reaktywność), a jest też trudny w obsłudze i wymaga zabezpieczenia. Lampa sodowa wykorzystuje pary sodu zamknięte w szczelnej rurze wyładowczej, dlatego metal nie ma kontaktu z wodą ani wilgocią. (1 pkt za reaktywność, 1 pkt za obsługę, 1 pkt za wskazanie, że reaktywność jest powodem.)<\/li>\n<\/ul>\n<\/details>\n<\/div>\n<p><strong>Poziom C — ambitny<\/strong><\/p>\n<div class=\"card card-exam\">\n<span class=\"card-label\">C1 (4 pkt) — kontrprzykład [[lo]]<\/span>\n<p>Reakcja berylu z wodą praktycznie nie zachodzi, mimo że beryl jest metalem grupy 2. Wyjaśnij, dlaczego, i podaj, co dzieje się z magnezem i wapniem.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<ul>\n<li>Podpowiedź 1: co pokrywa powierzchnię berylu w powietrzu?<\/li>\n<li>Podpowiedź 2: czy warstwa tlenku przepuszcza wodę do metalu?<\/li>\n<li>Rozwiązanie: beryl pokrywa się szczelną warstwą tlenku BeO, która chroni metal przed wodą. Mg reaguje powoli, lepiej z gorącą wodą; Ca reaguje umiarkowanie w temperaturze pokojowej. Reaktywność nie zawsze rośnie tak samo; sama pozycja w grupie nie wystarcza do przewidzenia tempa. (1 pkt za warstwę tlenku, 1 pkt za mechanizm, 1 pkt za Mg i Ca, 1 pkt za wniosek o ograniczeniu modelu.)<\/li>\n<\/ul>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">C2 (4 pkt) — analiza [[olim]]<\/span>\n<p>Wodorotlenek berylu Be(OH)₂ reaguje zarówno z kwasem, jak i z zasadą. Wyjaśnij, dlaczego nie jest to zasada w tym samym sensie co Ca(OH)₂, i zapisz jedno równanie z kwasem.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<ul>\n<li>Podpowiedź 1: co oznacza zasada, a co kwas w ujęciu reakcji z H⁺ i OH⁻?<\/li>\n<li>Podpowiedź 2: Be(OH)₂ + 2 HCl → BeCl₂ + 2 H₂O.<\/li>\n<li>Rozwiązanie: Be(OH)₂ jest amfoteryczny: z kwasem zachowuje się jak zasada, z zasadą jak kwas (z zasadą: Be(OH)₂ + 2OH⁻ → [Be(OH)₄]²⁻, jon tetrahydroksoberylanowy). Ca(OH)₂ ma właściwości zasadowe i nie jest amfoteryczny. Równanie: Be(OH)₂ + 2 HCl → BeCl₂ + 2 H₂O. (1 pkt za pojęcie amfoteryczności, 1 pkt za porównanie z Ca(OH)₂, 2 pkt za równanie.)<\/li>\n<\/ul>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">C3 (4 pkt) — problem otwarty [[olim]]<\/span>\n<p>Mamy trzy białe proszki: NaCl, CaO i MgO. Zaproponuj prosty test, który je odróżni, opisz obserwacje i uzasadnij na podstawie reaktywności z wodą.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<ul>\n<li>Podpowiedź 1: który z nich reaguje z wodą i daje zasadę?<\/li>\n<li>Podpowiedź 2: wprowadź wodę i zbadaj odczyn (np. uniwersalny wskaźnik).<\/li>\n<li>Rozwiązanie: NaCl rozpuszcza się w wodzie bez zmiany odczynu; CaO reaguje z wodą z wydzieleniem ciepła i daje odczyn zasadowy; MgO reaguje z wodą bardzo słabo. (1 pkt za wodę jako odczynnik, 1 pkt za obserwacje dla NaCl, 1 pkt za CaO, 1 pkt za MgO i wniosek.) Problem otwarty: co zmieniłby test, gdyby MgO był zanieczyszczony Mg(OH)₂? Napisz w 2–3 zdaniach.<\/li>\n<\/ul>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"warstwy-karty\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Sekcje warstwowe (ponad podstawę)<\/div>\n<div class=\"card card-lo\">\n<span class=\"card-label\">[[lo]] Pomost do LO — dlaczego reaktywność rośnie w dół<\/span>\n<p>Im większy atom, tym więcej powłok elektronowych ekranuje ładunek jądra. Elektron walencyjny jest dalej od jądra i słabiej przyciągany, więc energia jonizacji maleje. Energia jonizacji to energia potrzebna do oderwania elektronu od atomu w fazie gazowej. Mniejsza energia jonizacji = łatwiejsze oddawanie elektronu = większa reaktywność. Ten mechanizm wróci w klasie 1 LO przy opisie właściwości okresowych.<\/p>\n<\/div>\n<div class=\"card card-lo\">\n<span class=\"card-label\">[[lo]] Dlaczego beryl jest wyjątkiem<\/span>\n<p>Jon Be²⁺ jest bardzo mały i ma ładunek 2+, więc ma dużą gęstość ładunku i silnie polaryzuje sąsiednie jony; wiązania berylu są w dużej mierze kowalencyjne. Jego tlenek i wodorotlenek są słabo rozpuszczalne, a na powierzchni metalu tworzy się szczelna warstwa BeO. To ogranicza reakcję z wodą. Stąd wniosek: pozycja w grupie to dobre przybliżenie, ale nie prawo bez wyjątków.<\/p>\n<\/div>\n<div class=\"card card-olim\">\n<span class=\"card-label\">[[olim]] Dla ambitnych — amfoteryczność berylu<\/span>\n<p>Beryl i glin (wykład w J05) tworzą wodorotlenki, które reagują zarówno z kwasami, jak i z zasadami. Dla berylu zapis z zasadą to Be(OH)₂ + 2 OH⁻ → [Be(OH)₄]²⁻. Dla klasy 8 wystarczy wiedzieć, że Be(OH)₂ jest amfoteryczny; mechanizm wróci w równowagach kwasowo-zasadowych (J06).<\/p>\n<\/div>\n<div class=\"card card-uni\">\n<span class=\"card-label\">[[uni]] Zaawansowane — granica modelu „metal oddaje elektrony”<\/span>\n<p>W metalu elektrony walencyjne tworzą wspólną „chmurę” wokół dodatnich rdzeni atomowych. To wiązanie metaliczne. Model „Na → Na⁺ + e⁻” jest użyteczny do przewidywania jonów i wzorów, ale nie opisuje, jak elektrony przemieszczają się w krysztale. Pytanie „gdzie model się kończy?” wraca w każdym bloku.<\/p>\n<\/div>\n<\/section>\n<section id=\"fiszki\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Fiszki<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Grupa 1<\/span><span class=\"back\">litowce: Li, Na, K, Rb, Cs, Fr<\/span><span class=\"card-tag tag-basic\">grupy<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Grupa 2<\/span><span class=\"back\">berylowce: Be, Mg, Ca, Sr, Ba, Ra<\/span><span class=\"card-tag tag-basic\">grupy<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wartościowość litowców<\/span><span class=\"back\">I<\/span><span class=\"card-tag tag-basic\">wartosciowosc<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wartościowość berylowców<\/span><span class=\"back\">II<\/span><span class=\"card-tag tag-basic\">wartosciowosc<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Reakcja sodu z wodą<\/span><span class=\"back\">2 Na + 2 H₂O → 2 NaOH + H₂<\/span><span class=\"card-tag tag-basic\">reakcje<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Płomień sodu<\/span><span class=\"back\">żółty<\/span><span class=\"card-tag tag-basic\">plomienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Płomień potasu<\/span><span class=\"back\">fioletowy (przez filtr kobaltowy)<\/span><span class=\"card-tag tag-basic\">plomienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Płomień wapnia<\/span><span class=\"back\">ceglastoczerwony<\/span><span class=\"card-tag tag-basic\">plomienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wodorotlenek wapnia<\/span><span class=\"back\">Ca(OH)₂ — zasada (wapno gaszone)<\/span><span class=\"card-tag tag-basic\">wodorotlenki<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Tlenek litowca w wodzie<\/span><span class=\"back\">daje zasadę<\/span><span class=\"card-tag tag-basic\">wodorotlenki<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Reaktywność w grupie 1<\/span><span class=\"back\">rośnie w dół<\/span><span class=\"card-tag tag-basic\">trend<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Be z wodą<\/span><span class=\"back\">praktycznie nie reaguje (warstwa tlenku)<\/span><span class=\"card-tag tag-lo\">beryl<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Energia jonizacji w dół grupy<\/span><span class=\"back\">maleje<\/span><span class=\"card-tag tag-lo\">trend<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Be(OH)₂<\/span><span class=\"back\">amfoteryczny<\/span><span class=\"card-tag tag-olim\">amfoteryczność<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wiązanie metaliczne<\/span><span class=\"back\">wspólna chmura elektronów walencyjnych<\/span><span class=\"card-tag tag-uni\">model<\/span><\/button><\/div>\n<\/section>\n<section id=\"slownik\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Słownik<\/div>\n<dl><div class=\"def-item\"><dt>Litowce<\/dt><dd>pierwiastki grupy 1 (oprócz wodoru)<\/dd><\/div><div class=\"def-item\"><dt>Berylowce<\/dt><dd>pierwiastki grupy 2<\/dd><\/div><div class=\"def-item\"><dt>Blok s<\/dt><dd>pierwiastki, których ostatni elektron jest na podpowłoce s<\/dd><\/div><div class=\"def-item\"><dt>Elektrony walencyjne<\/dt><dd>elektrony na zewnętrznej powłoce atomu<\/dd><\/div><div class=\"def-item\"><dt>Wodorotlenek<\/dt><dd>związek metalu z grupą wodorotlenową –OH, wzór ogólny M(OH)ₙ<\/dd><\/div><div class=\"def-item\"><dt>Zasada<\/dt><dd>wodorotlenek, który w wodzie dysocjuje na kation metalu i jony OH⁻ (wg Arrheniusa); rozpuszczalność to osobna cecha<\/dd><\/div><div class=\"def-item\"><dt>Nafta<\/dt><dd>ciecz używana do przechowywania metali reaktywnych, odcina dostęp powietrza<\/dd><\/div><div class=\"def-item\"><dt>Nadtlenek<\/dt><dd>związek zawierający jon O₂²⁻, np. Na₂O₂<\/dd><\/div><div class=\"def-item\"><dt>Ponadtlenek<\/dt><dd>związek zawierający jon O₂⁻, np. KO₂<\/dd><\/div><div class=\"def-item\"><dt>Amfoteryczność<\/dt><dd>zdolność związku do reagowania zarówno z kwasami, jak i z zasadami<\/dd><\/div><div class=\"def-item\"><dt>Energia jonizacji<\/dt><dd>energia potrzebna do oderwania elektronu od atomu w fazie gazowej (lo)<\/dd><\/div><\/dl>\n<\/section>\n<section id=\"test\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Test końcowy<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Mg leży w grupie 2, więc ma dwa elektrony walencyjne.\"><h5>1. Ile elektronów walencyjnych ma magnez?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">1<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">2<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">8<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">12<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Reaktywność rośnie w dół grupy 1; potas jest najbardziej reaktywny spośród Li, Na i K.\"><h5>2. Który z metali Li, Na, K reaguje z wodą najgwałtowniej?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">Li<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Na<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">K<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">Mg<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Metal wypiera wodór z wody i tworzy wodorotlenek.\"><h5>3. Produkty reakcji sodu z wodą to:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">NaOH i H₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">NaCl i O₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">Na₂O i H₂O<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">NaH i O₂<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Wapń — ceglastoczerwony; żółty to sód, zielony bar, fioletowy potas.\"><h5>4. Płomień wapnia ma barwę:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">żółtą<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">ceglastoczerwoną<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">zieloną<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">fioletową<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Beryl jest wyjątkiem w zachowaniu wobec wody.\"><h5>5. Które zdanie o berylu jest poprawne?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">reaguje z zimną wodą gwałtownie<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">praktycznie nie reaguje z wodą, bo pokrywa się warstwą tlenku<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">ma trzy elektrony walencyjne<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">tworzy wyłącznie kwasy<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Tlenki metali dają w wodzie jony OH⁻.\"><h5>6. Tlenek litowca reaguje z wodą, dając:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">kwas<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">zasadę<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">sól obojętną<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">tlen<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Wapń ma wartościowość II, więc potrzeba dwóch grup OH.\"><h5>7. Wzór wodorotlenku wapnia to:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">CaO<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Ca(OH)₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">CaOH<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">Ca₂OH<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section id=\"ciekawostki\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Ciekawostki<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Dlaczego fajerwerki mają kolory<\/span>\n<p>Kolory płomienia pochodzą od elektronów wzbudzanych w atomach metali. Gdy wracają do niższych poziomów, emitują światło o określonej długości fali. Stąd czerwień litu, żółć sodu, zieleń baru.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Lit w telefonie<\/span>\n<p>Baterie litowo-jonowe stosuje się w telefonach i samochodach elektrycznych. Lit jest najlżejszym metalem, więc ma dużą gęstość energii na masę (uproszczenie szkolne).<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Wapno: dlaczego zaprawa twardnieje<\/span>\n<p>Wapno gaszone Ca(OH)₂ reaguje z dwutlenkiem węgla z powietrza i z czasem twardnieje: Ca(OH)₂ + CO₂ → CaCO₃ + H₂O. Ten proces wykorzystuje się w zaprawie wapiennej (uproszczenie szkolne).<\/p>\n<\/div>\n<\/section>\n<section id=\"mnemotechniki\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Sposoby zapamiętania<\/div>\n<ul>\n<li><strong>Grupa = elektrony walencyjne<\/strong> — grupa 1 ma jeden, grupa 2 ma dwa.<\/li>\n<li><strong>W dół grupy 1 — coraz bardziej gwałtownie<\/strong> — „im dalej od jądra, tym łatwiej oddać”.<\/li>\n<li><strong>Płomienie: Na Żółty, Ba Zielony, K Fioletowy, Ca Ceglasty<\/strong> — skrót „NaŻółty, BaZielony, KFioletowy”.<\/li>\n<\/ul>\n<\/section>\n<section id=\"odpowiedz\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> Odpowiedź na pytanie przewodnie<\/div>\n<p>Sód reaguje z wodą i wilgocią z powietrza, więc trzymamy go w nafcie, która odcina dostęp do tych substancji. Magnez nie reaguje tak gwałtownie z wilgocią, a jego wiór spala się w powietrzu jasnym płomieniem (magnezową taśmę trzeba najpierw rozgrzać). Reaktywność zależy od metalu, nie tylko od grupy.<\/p>\n<\/section>\n<section id=\"dalej\">\n<div class=\"part-heading\"><span class=\"part-num\">16<\/span> Co dalej?<\/div>\n<p><strong>Wcześniej:<\/strong> F06 (układ okresowy), F11 (wiązania), N03 (wodorotlenki).\n<strong>Dalej:<\/strong> P02 — blok p; J05 — amfoteryczność (wróci przy berylu i glinie); J06 — równowagi kwasowo-zasadowe.\n<strong>Spirala:<\/strong> energia jonizacji i reaktywność wrócą w klasie 1 LO.<\/p>\n<\/section>\n<section id=\"checklista\">\n<div class=\"part-heading\"><span class=\"part-num\">17<\/span> Checklista — umiem…<\/div>\n<checklista>\n<ul>\n<li>[ ] podaję grupę i liczbę elektronów walencyjnych litowców i berylowców<\/li>\n<li>[ ] piszę reakcję metalu grupy 1 lub 2 z wodą i bilansuję ją<\/li>\n<li>[ ] wyjaśniam, dlaczego reaktywność rośnie w dół grupy 1<\/li>\n<li>[ ] rozpoznaję płomienie Na, K, Ca, Ba<\/li>\n<li>[ ] [[lo]] wiem, dlaczego beryl jest wyjątkiem<\/li>\n<li>[ ] [[olim]] rozumiem amfoteryczność Be(OH)₂<\/li>\n<li>[ ] [[uni]] wiem, że model „metal oddaje elektrony” ma granice<\/li>\n<li>[ ] Zapisz własnymi słowami, dlaczego sód trzymamy w nafcie — to będzie twoja fiszka.<\/li>\n<\/ul>\n<\/checklista>\n<\/section>\n<section id=\"zrodla\">\n<div class=\"part-heading\">Pochodzenie i sprawdzenie treści<\/div>\n<ul>\n<li><strong>Skala i typ:<\/strong> skala M (4 kluczowe umiejętności w minimum; minimum ma 6 punktów), typ temat.<\/li>\n<li><strong>Źródło:<\/strong> szkielet kanonu <code>CHE.01.P01.blok_s<\/code> (wymaga: F06, F11, N03; zakres: litowce i berylowce, związki) — szkielet nie miał treści, lekcja napisana od zera.<\/li>\n<li><strong>Co zmieniło się względem szkieletu:<\/strong> szkielet miał 1 KB i sekcje „do uzupełnienia”. Teraz: wykład, mini-wykłady, przykłady prowadzone, klinika, 9 ćwiczeń z drabinką podpowiedzi, fiszki, słownik, test 7 pytań, ciekawostki, warstwy lo/olim/uni.<\/li>\n<li><strong>Benchmark (tryb B, z pamięci, do potwierdzenia w W1):<\/strong> Khan Academy — mikro-sprawdzenie („Sprawdź się”) i drabinka podpowiedzi w §8; OpenStax — Strategia / Rozwiązanie / Sprawdzenie w §3; PhET — predict–observe–explain nie użyte (trzy klocki-symulacje: probówki, palniki i tablica okresowa).<\/li>\n<li><strong>Do W1:<\/strong> gęstości Mg i Ca (orientacyjnie), rola BaSO₄ w diagnostyce, zapis Be(OH)₂ + OH⁻ → [Be(OH)₄]²⁻, tempo reakcji Mg i Ca z wodą, ciekawostki o bateriach i gipsie (uproszczenia).<\/li>\n<li><strong>Pominięcia:<\/strong> brak; wymagany zakres szkieletu pokryty.<\/li>\n<\/ul>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA P01 v0.1<\/strong> · Blok s · 2026<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n"</script>
