o reakcją.',bhp:'Gorąca parownica — chwytać szczypcami; okulary (pryskanie przy końcu odparowania).'},\n  f01SodaOcet:{war:'łyżeczka sody oczyszczonej, dolewamy ocet',wn:'Reakcja chemiczna: powstaje nowa substancja (gaz CO₂). Nazwa gazu to wniosek — potwierdza go woda wapienna.',bhp:'Okulary; ocet nie do oczu.'},\n  f01Mg:{war:'wstążka magnezu w szczypcach, w płomieniu palnika (pokaz)',wn:'Reakcja chemiczna: biały, kruchy MgO ma inne właściwości niż metaliczny magnez.',bhp:'Nie patrzeć w płomień; płonącego magnezu nie gasić wodą.'},\n  f01FeS:{war:'mieszanina opiłek żelaza i siarki w probówce, ogrzewanie (pokaz)',wn:'Przed ogrzaniem — mieszanina (magnes wyciąga żelazo); po — związek FeS (magnes nie przyciąga). Rozstrzyga test właściwości.',bhp:'Pokaz pod wyciągiem; możliwy trujący SO₂; gorąca probówka może pęknąć.'},\n  f01WodaWapienna:{war:'gaz przepuszczony przez wodę wapienną',wn:'Zmętnienie wody wapiennej to dowód, że gazem był CO₂.',bhp:'Woda wapienna drażni oczy i skórę; okulary.'}},\n 'GFX.rx · rozszerzenia.js (F01)');\n\n/* ---------- 7. Zlewki GFX dla F03 (mieszaniny do rozdzielania) — pracownia łączy je z zlewkami F01 ---------- */\nvar RXF3={\n f03PiasekWoda:{n:'Piasek + woda (zawiesina)',solid:{col:[214,190,140],eq:4,end:1,t:'powder',shape:'powder'},turb:.25,out:['nic'],qualitative:1,eq:'piasek(s) + H₂O(c) — brak reakcji',why:'Piasek nie rozpuszcza się: po zamieszaniu woda mętnieje, po chwili ziarna opadają na dno (sedymentacja), a nad osadem zostaje prawie klarowna woda. Dwie fazy — mieszanina niejednorodna.'},\n f03KredaWoda:{n:'Kreda + woda (zawiesina)',solid:{col:[246,246,242],eq:4,end:1,t:'powder',shape:'powder'},turb:.7,out:['nic'],qualitative:1,eq:'CaCO₃(s) + H₂O(c) — brak reakcji',why:'Drobna kreda tworzy mleczną zawiesinę, która opada wolno. Sączek zatrzymuje cząstki kredy, a przesącz jest klarowny.'}\n};\nif(rx)Object.keys(RXF3).forEach(function(k){if(!rx.get(k))rx.register(k,RXF3[k])});\n\npracownia('f03-rozdzielanie-v01','Pracownia: rozdzielanie mieszanin','Najpierw nazwij różnicę właściwości, potem wybierz metodę: zawiesiny (sedymentacja, dekantacja, sączenie), roztwór (odparowanie, krystalizacja).',\n [['Zawiesiny — ciało stałe nierozpuszczalne',['f03PiasekWoda','f03KredaWoda']],['Roztwór — substancja rozpuszczona',['f01SolWoda','f01Odparowanie']]],\n {f03PiasekWoda:{war:'piasek w zlewce z wodą, zamieszanie bagietką, odstawienie',wn:'Różnica: piasek nie rozpuszcza się i ma większą gęstość niż woda → sedymentacja, potem dekantacja albo sączenie.',bhp:'Szkło — ostrożnie; okulary.'},\n  f03KredaWoda:{war:'sproszkowana kreda w wodzie, mieszanie',wn:'Drobne cząstki opadają wolno — szybciej rozdzieli je sączenie przez bibułę; przesącz jest klarowny.',bhp:'Okulary; sączek nie może być przedziurawiony bagietką.'},\n  f01SolWoda:{war:'sól kuchenna w wodzie, mieszanie',wn:'Sól rozpuszcza się — przechodzi przez sączek razem z wodą. Sączenie nie zadziała; trzeba wykorzystać lotność wody (odparowanie, krystalizacja lub destylacja).',bhp:'Nie smakujemy substancji w pracowni.'},\n  f01Odparowanie:{war:'roztwór soli w parownicy, ogrzewanie',wn:'Woda odparowuje, sól krystalizuje na dnie — odzyskujemy substancję rozpuszczoną (wodę tracimy; chcąc ją odzyskać — destylacja).',bhp:'Gorąca parownica — szczypce; okulary (pryskanie pod koniec).'}},\n 'GFX.rx · rozszerzenia.js (F03)');\n\n/* ---------- 8. F05 — konstruktor: izotop / jon / inny pierwiastek + masa atomowa jako średnia ważona ----------\n   Model wielokrotnego użytku (F04, F05, F06, A01…): `f05-izotopy-v01`. Dane izotopów z silnika (CHE.DATA.ISOTOPES). */\n/* dane z silnika (bez lokalnej kopii): CHE.DATA.ELEMENTS_54 (symbol, nazwa) + CHE.DATA.ISOTOPES (A, masa, udział) */\nfunction izo(z){var E=(D.ELEMENTS_54||[]).filter(function(e){return e.z===z})[0];if(!E)return null;\n var L=(D.ISOTOPES||{})[E.s]||[];return [E.s,String(E.n||E.s).toLowerCase(),L.map(function(x){return [x.A,x.atomicMass,(x.abundance||0)*100]}).sort(function(a,b){return b[2]-a[2]||a[0]-b[0]})]}\nfunction supN(n){return String(n).replace(/[0-9]/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]})}\nfunction subN(n){return String(n).replace(/[0-9]/g,function(d){return '₀₁₂₃₄₅₆₇₈₉'[d]})}\nfunction chg(q){return q===0?'':(Math.abs(q)>1?supN(Math.abs(q)):'')+(q>0?'⁺':'⁻')}\nfunction pl(x,d){return x.toFixed(d).replace('.',',')}\n/* atomSVG — komponent wielokrotnego użytku (F05, F07, A01…): model atomu jako SVG, kolory jak w atlasie (_anon_004 bohr: elektrony wewnętrzne #2f8a55, walencyjne #b85f00).\n   o = {p, n, e, powloki:false|true, W:260}. powloki:false → elektrony na jednym okręgu (F05; powłoki to pojęcie F07);\n   powloki:true → powłoki K, L, M, N wg modelu szkolnego 2, 8, 8, … (do Z = 20; dalej uproszczenie — do weryfikacji). Zwraca otwarty <svg…> (zamknąć '<\/svg>'). */\nfunction atomSVG(o){var W=o.W||260,C=W/2,p=o.p|0,n=o.n|0,e=o.e|0,svg='<svg viewBox=\"0 0 '+W+' '+W+'\" width=\"100%\" style=\"max-width:'+W+'px;display:block;margin:auto\" role=\"img\" aria-label=\"Model atomu: '+p+' p, '+n+' n, '+e+' e\">';\n var N=p+n,sk=W/260;\n for(var i=0;i<N;i++){var a=i*2.39996,r=4.2*sk*Math.sqrt(i+.5);svg+='<circle cx=\"'+(C+r*Math.cos(a)).toFixed(1)+'\" cy=\"'+(C+r*Math.sin(a)).toFixed(1)+'\" r=\"'+(4.6*sk).toFixed(1)+'\" fill=\"'+(Math.floor((i+1)*p/N)>Math.floor(i*p/N)?'#d9534f':'#7f8da0')+'\" stroke=\"#fff\" stroke-width=\".8\"/>'}\n var sh=[];if(o.powloki){var cap=[2,8,8],left=e;for(var q=0;left>0;q++){var c=q<3?Math.min(cap[q],left):left;sh.push(c);left-=c}}else if(e)sh=[e];\n var R0=o.powloki?Math.max(40*sk,6*sk*Math.sqrt(N)+18*sk):104*sk,st=sh.length>1?(104*sk-R0)/(sh.length-1):0;\n sh.forEach(function(cnt,q){var R=sh.length>1?R0+q*st:(o.powloki?R0:104*sk),wal=o.powloki&&q===sh.length-1;\n  svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+R.toFixed(1)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n  if(o.powloki)svg+='<text x=\"'+(C+R*0.71+4).toFixed(1)+'\" y=\"'+(C-R*0.71-4).toFixed(1)+'\" font-size=\"'+(11*sk).toFixed(0)+'\" fill=\"#5b6773\">'+'KLMN'[q]+'<\/text>';\n  for(var k=0;k<cnt;k++){var b=k/cnt*2*Math.PI-Math.PI/2;svg+='<circle cx=\"'+(C+R*Math.cos(b)).toFixed(1)+'\" cy=\"'+(C+R*Math.sin(b)).toFixed(1)+'\" r=\"'+(5*sk).toFixed(1)+'\" fill=\"'+(o.powloki?(wal?'#b85f00':'#2e7d4f'):'#2f7bd8')+'\"/>'}});\n if(!e)svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+(104*sk)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n return svg}\ntry{C.LAB=C.LAB||{};C.LAB.atomSVG=atomSVG}catch(_){}\n/* atomBohr, orbitalCloud → engine/src/dodatki/atlas-gfx.js (wspólne dla labu i lekcji, CHE.LAB.*) */\n\nV.define('f05-izotopy-v01',{title:'Izotop, jon czy inny pierwiastek? Konstruktor atomu i masa atomowa',tag:'MODEL',\n hint:'Dodawaj i zabieraj protony, neutrony i elektrony. Model mówi, co się zmieniło: pierwiastek (Z), izotop (n) czy ładunek (e). Niżej: skąd się bierze masa atomowa z układu okresowego.',\n foot:'rozszerzenia.js §8 · dane: CHE.DATA.ISOTOPES, ELEMENTS_54',\n build:function(host){host.innerHTML='';host.classList.add('x5');\n  var s={p:17,n:18,e:17},start={p:17,n:18,e:17};\n  var pick=el('div','bar','<b>Start:<\/b>');host.appendChild(pick);\n  [1,6,8,11,12,17,20].forEach(function(z){var d=izo(z);if(!d||!d[2].length)return;var b=el('button','o',d[0]);b.type='button';b.onclick=function(){s={p:z,n:d[2][0][0]-z,e:z};start={p:s.p,n:s.n,e:s.e};draw()};pick.appendChild(b)});\n  var ctl=el('div','bar');host.appendChild(ctl);\n  [['p','proton'],['n','neutron'],['e','elektron']].forEach(function(c){\n   var m=el('button','o','− '+c[1]),p=el('button','o','+ '+c[1]);m.type=p.type='button';\n   m.onclick=function(){if(s[c[0]]>(c[0]==='p'?1:0)){s[c[0]]--;draw()}};p.onclick=function(){if(s[c[0]]<(c[0]==='p'?20:c[0]==='n'?30:22)){s[c[0]]++;draw()}};ctl.append(m,p)});\n  var g=el('div','two'),pic=el('div'),txt=el('div');g.append(pic,txt);host.appendChild(g);\n  var avg=el('div');host.appendChild(avg);\n  function sym(z){var d=izo(z);return d?d[0]:('Z='+z)}\n  function draw(){var A=s.p+s.n,q=s.p-s.e,X=sym(s.p),d=  gazów Vₘ = 22,4 dm³/mol w warunkach normalnych (0 °C, p ≈ 1013 hPa) i stosować ją do gazów.<\/li>\n<li>Stosować prawo Avogadra i wniosek: w reakcjach gaz–gaz stosunki objętościowe = stosunki współczynników (bez liczenia moli!).<\/li>\n<li>Obliczać gęstość względną gazów: d = M/M(wzorca); względem powietrza M ≈ 29, względem wodoru M = 2.<\/li>\n<li>Ustalać wzór rzeczywisty gazów z gęstości względnej (M = d · M(wzorca)).<\/li>\n<li>Rozróżniać wzór elementarny (najprostszy stosunek atomów) i rzeczywisty (rzeczywista liczba atomów); związek: M = k · M(elementarnego).<\/li>\n<li>Przeprowadzać pełną procedurę: % masowe → liczby moli atomów → stosunek elementarny → (z M) wzór rzeczywisty.<\/li>\n<li>Wskazywać pułapki: wzory elementarne wspólne dla wielu związków (CH₂O → C₂H₄O₂ i C₆H₁₂O₆); objętości — tylko dla gazów.<\/li>\n<li>Liczyć zadania łańcuchowe łączące objętości, masy i wydajność (R09) — na związkach z całej serii organiki.<\/li>\n<\/ol>\n<\/section>\n<div class=\"layer-legend\">\n\n<\/div>\n<div class=\"core-path\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to<\/div>\n<ol>\n<li><a href=\"#trojkat\">Trójkąt konwersji m–n–N–V<\/a> — cztery wzory i ich kierunki.<\/li>\n<li><a href=\"#objestosc\">Objętość molowa i stosunki objętościowe<\/a> — prawo Avogadra, gaz–gaz bez moli.<\/li>\n<li><a href=\"#gestosc\">Gęstość względna<\/a> — d = M/M(wzorca), odczytywanie M gazów.<\/li>\n<li><a href=\"#wzory\">Wzory elementarne i rzeczywiste<\/a> — pełna procedura procentów.<\/li>\n<li><a href=\"#zadania\">Zadania exam<\/a> i <a href=\"#zadania-adv\">zadania adv<\/a>.<\/li>\n<\/ol>\n<\/div>\n<section id=\"jak-pracowac\">\n<div class=\"part-heading\"><span class=\"part-num\">0.1<\/span> Jak pracować z lekcją<\/div>\n<p>To lekcja-rachmistrz serii: bez jej narzędzi zadania wojewódzkie z ORG01–ORG07 zatrzymują się w połowie. Fundament masz z R04 (mol, masa molowa) — tu dochodzą dwie nowości: <strong>objętość molowa gazów<\/strong> i <strong>wzory elementarne<\/strong>. Każdą procedurę przećwicz na przykładach z lekcji, a potem na zadanach; kontroluj zawsze jednostki (g, mol, dm³) i rząd wielkości. Karty <code>odp<\/code> otwieraj po własnym zapisie — rachunku nie da się zrozumieć czytając klucz.<\/p>\n<\/section>\n<section id=\"diagnoza\">\n<div class=\"part-heading\"><span class=\"part-num\">0.2<\/span> Diagnoza<\/div>\n<ol>\n<li>Ile moli stanowi 88 g CO₂ (M = 44 g/mol)?<\/li>\n<li>Ile dm³ zajmuje ten gaz w warunkach normalnych?<\/li>\n<li>Względem czego porównujemy gęstość gazów i jaki wzór stosujemy dla powietrza (M ≈ 29)?<\/li>\n<li>Czym różni się wzór elementarny od rzeczywistego? Podaj przykład pary związków o wspólnym wzorze elementarnym.<\/li>\n<li>Związek zawiera 40% C, 6,7% H, 53,3% O (masowe). Podaj wzór elementarny.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Klucz diagnozy<\/summary>\n<ol>\n<li>n = 88/44 = <strong>2 mol<\/strong> (1 pkt).<\/li>\n<li>V = 2 · 22,4 = <strong>44,8 dm³<\/strong> (1 pkt).<\/li>\n<li>Względem wzorca (powietrze M ≈ 29, wodór M = 2); d = M(gazu)/M(powietrza) (1 pkt).<\/li>\n<li>Elementarny — najprostszy stosunek atomów; rzeczywisty — rzeczywista liczba atomów w cząsteczce; przykład: CH₂O wspólne dla kwasu octowego C₂H₄O₂ i glukozy C₆H₁₂O₆ (1 pkt).<\/li>\n<li>CH₂O (1 pkt; procedura w sekcji 4).<\/li>\n<\/ol>\n<p><strong>Rozliczenie:<\/strong> 5 pkt — prosto do zadań exam; 3–4 pkt — pełna praca przez rdzeń; 0–2 pkt — najpierw R04 i R09, potem lekcja od początku.<\/p>\n<\/details>\n<\/section>\n<section id=\"trojkat\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Wykład — trójkąt konwersji: m–n–N–V<\/div>\n<p>R04 dało ci trzy wierzchołki: masa <strong>m<\/strong> (g), liczba moli <strong>n<\/strong> (mol), liczba cząstek <strong>N<\/strong>. Etap III dokłada czwarty: objętość gazu <strong>V<\/strong> (dm³). Cztery wzory łączą wszystkie pary przez mol:<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Z<\/th><th>Do<\/th><th>Wzór<\/th><th>Uwagi<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>m (g)<\/td><td>n (mol)<\/td><td><strong>n = m/M<\/strong><\/td><td>M w g/mol, z masy atomowej i wzoru<\/td><\/tr>\n<tr><td>n (mol)<\/td><td>m (g)<\/td><td><strong>m = n·M<\/strong><\/td><td>odwrotność<\/td><\/tr>\n<tr><td>n (mol)<\/td><td>N (cząstki)<\/td><td><strong>N = n·N_A<\/strong><\/td><td>N_A = 6,02·10²³ mol⁻¹<\/td><\/tr>\n<tr><td>N (cząstki)<\/td><td>n (mol)<\/td><td><strong>n = N/N_A<\/strong><\/td><td>odwrotność<\/td><\/tr>\n<tr><td>n (mol)<\/td><td>V (dm³)<\/td><td><strong>V = n·Vₘ<\/strong><\/td><td><strong>tylko gazy<\/strong>; Vₘ = 22,4 dm³/mol<\/td><\/tr>\n<tr><td>V (dm³)<\/td><td>n (mol)<\/td><td><strong>n = V/Vₘ<\/strong><\/td><td>tylko gazy, warunki normalne<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Drogi „na przełaj\" — m → N i m → V — zawsze przez mol (dwa kroki). Objętość nie działa dla cieczy i ciał stałych (tam jest własnością indywidualną, nie stałą porcji — porównaj 1 mol wody: 18 g, ale tylko ok. 18 cm³!).<\/p>\n<p><strong>Warunki normalne<\/strong> to umowny punkt odniesienia: temperatura 0 °C i ciśnienie ≈ 1013 hPa (1 atm). Przy tych warunkach <strong>każdy gaz<\/strong> zajmuje Vₘ = 22,4 dm³ na mol — niezależnie, czy to metan, CO₂ czy mieszanina. Przy temperaturze pokojowej objętość molowa jest większa (ok. 24 dm³/mol — wartość orientacyjna; w zadaniach konkursowych domyślnie 22,4).<\/p>\n<p><strong>Liczba Avogadro:<\/strong> N_A = 6,02·10²³ mol⁻¹ w rachunkach szkolnych; od reformy SI 2019 r. wartość dokładna: <strong>6,02214076·10²³ mol⁻¹<\/strong> (mol zdefiniowano właśnie przez tę liczbę — bez uzależnienia od masy wzorca).<\/p>\n<h3>Najczęstsze pułapki<\/h3>\n<ul>\n<li>Masa molowa to nie masa próbki: M w g/mol, m w gramach — najpierw n = m/M, dopiero potem reszta.<\/li>\n<li>22,4 dm³/mol tylko dla gazów w warunkach normalnych (0 °C, ok. 1013 hPa); nie stosuj go do cieczy ani do innych warunków.<\/li>\n<li>Pomijanie współczynników z równania: liczby moli i objętości gazów przeliczamy przez współczynniki.<\/li>\n<li>Objętość przed liczbą moli: najpierw n z danych, potem V = n·Vₘ.<\/li>\n<li>Wydajność stosujemy do właściwego etapu i właściwego produktu teoretycznego.<\/li>\n<li>Brak sprawdzenia reagenta ograniczającego: przed liczeniem produktu porównaj liczby moli substratów z równania (ten, którego mniej w stosunku do współczynników, ogranicza reakcję).<\/li>\n<\/ul>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — mapa konwersji w jednej karcie<\/span>\n<p>Gramy → mole: dziel przez M. Mole → gramy: mnoż przez M. Mole → cząstki: mnoż przez 6,02·10²³. Cząstki → mole: dziel przez 6,02·10²³. Mole → dm³ (gaz!): mnoż przez 22,4. dm³ → mole: dziel przez 22,4. Każde „dalekie\" przejście = dwa kroki przez mol. Kontrola błędów: jednostki na każdym kroku i rząd wielkości (mol gazu to zawsze dziesiątki dm³, masa mola — dziesiątki–setki gramów).<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Sześcian molowy — 22,4 dm³ w rękach<\/span>\n<p>22,4 dm³ to sześcian o boku ok. 28,2 cm (∛22400 ≈ 28,2) — klasyczna kostka do gry. W takiej przestrzeni, w warunkach normalnych, mieści się dokładnie 6,02·10²³ cząsteczek <strong>dowolnego<\/strong> gazu. W 1 cm³ tego samego gazu „upchnięto\"by ok. 2,7·10¹⁹ cząsteczek (6,02·10²³/22400 ≈ 2,69·10¹⁹ — tzw. liczba Loschmidta; wartość zaokrąglona, do weryfikacji): to rząd wielkości 10¹⁹ cząsteczek.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Cząsteczki w kropli — rachunek, który robi wrażenie<\/span>\n<p>1 cm³ wody = 1 g = 1/18 mol = 0,0556 mol → N = 0,0556 · 6,02·10²³ ≈ <strong>3,3·10²² cząsteczek<\/strong>. Kropla (ok. 0,05 cm³ — zależnie od pipety; do weryfikacji) zawiera więc rzędu 10²¹ cząsteczek. Liczby atomowe w chemii są ogromne dlatego, że cząsteczki są mikroskopijne — mol to porcja skalowana pod odważanie, nie pod wyobraźnię.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Skąd wzięła się nazwa „mol”<\/span>\n<p>Słowo „mol” wprowadził niemiecki chemik fizyczny Wilhelm Ostwald (ok. 1893 r.), od łac. <em>moles<\/em> — „masa, ilość”. Amedeo Avogadro sformułował swoją hipotezę o równych liczbach cząsteczek w równych objętościach gazów już w 1811 r., ale uznanie jej przyszło dopiero po Kongresie w Karlsruhe (1860), gdy Stanislao Cannizzaro przekonał środowisko do spójnych mas atomowych i cząsteczkowych. Dziś to zwykła praca laboratorium: jedna wielka liczba, nazwana na cześć człowieka, który na nią nie zdążył. (Daty do weryfikacji.)<\/p>\n<\/div>\n<figure class=\"lk-fig\" data-klocek=\"kalkulator-mola\" data-opt=\"{&quot;subst&quot;: &quot;1&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Kalkulator mola: m, n, N, V gazu<\/figcaption><\/figure>\n<!-- OPIS: Pola masy molowej, masy, liczby moli i objętości gazu dla wybranej substancji (H₂O, CO₂, O₂, CH₄, NaCl): zmiana jednej wartości przelicza pozostałe, a pod polami stoją wzory n = m/M, N = n·N_A i V = n·22,4 dm³/mol; objętość dotyczy gazów w warunkach normalnych (0 °C, 1013 hPa). -->\n<figure class=\"lk-fig\" data-klocek=\"trojkat-przeliczen\" data-opt=\"{&quot;wzor&quot;: &quot;mol&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Trójkąt: m, n, M<\/figcaption><\/figure>\n<!-- OPIS: Trójkąt z trzema polami: masa m u góry, liczba moli n i masa molowa M na dole; zasłonięcie jednej wielkości pokazuje wzór na jej obliczenie. -->\n<\/section>\n<section id=\"objestosc\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Wykład — objętość molowa i stosunki objętościowe<\/div>\n<p><strong>Prawo Avogadro:<\/strong> w równych objętościach różnych gazów (te same T i p) jest <strong>ta sama liczba cząsteczek<\/strong>. Skąd to wiadomo? Z tysięcy pomiarów reakcji gazowych — i właśnie to prawo wyjaśnia najpraktyczniejszy wniosek olimpijski:<\/p>\n<p><strong>W reakcji, w której substraty i produkty są gazami, stosunek objętości = stosunek współczynników równania.<\/strong><\/p>\n<p>Nie trzeba liczyć moli, mas ani objętości molowych — objętości zachowują się jak współczynniki:<\/p>\n<ul>\n<li>spalanie propanu: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O(ł) → na <strong>1 dm³<\/strong> propanu: <strong>5 dm³<\/strong> O₂ i <strong>3 dm³<\/strong> CO₂ (para wodna po ochłodzeniu — ciecz, jej objętości nie liczymy w gazach spalin);<\/li>\n<li>synteza amoniaku: N₂ + 3H₂ → 2NH₃ → z 10 dm³ N₂ i 30 dm³ H₂: <strong>20 dm³<\/strong> NH₃ (spadek objętości 40 → 20 dm³ — typowe pytanie o zmianę objętości);<\/li>\n<li>addycja HCl do propenu (ORG02): 1 : 1 — z 5,6 dm³ propenu przy 5,6 dm³ HCl: 5,6 dm³ chloropropanu (1 cząsteczka → 1 cząsteczka).<\/li>\n<\/ul>\n<p>Kontrola sensu: objętości się <strong>nie zmieniają w stosunku mas<\/strong> — masa gazu w 22,4 dm³ zależy od M (metan 16 g, CO₂ 44 g); objętość mówi tylko o liczbie cząstek.<\/p>\n<p><strong>Gęstość względna<\/strong> — sposób na M nieznanego gazu:<\/p>\n<p><strong>d = M(gazu) / M(wzorca)<\/strong> — „ile razy gaz cięższy od wzorca\".<\/p>\n<p>Wzorce i ich M: <strong>powietrze ≈ 29 g/mol<\/strong> (średnia mieszaniny 78% N₂ — 28, 21% O₂ — 32; wartość przybliżona standardowa), <strong>wodór = 2 g/mol<\/strong>. Przykłady:<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Gaz<\/th><th>M<\/th><th>d wzgl. powietrza (÷29)<\/th><th>d wzgl. wodoru (÷2)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>metan CH₄<\/td><td>16<\/td><td>0,55 (lżejszy)<\/td><td>8<\/td><\/tr>\n<tr><td>eten C₂H₄<\/td><td>28<\/td><td>0,97 (na granicy)<\/td><td>14<\/td><\/tr>\n<tr><td>propan C₃H₈<\/td><td>44<\/td><td>1,52 (cięższy)<\/td><td>22<\/td><\/tr>\n<tr><td>CO₂<\/td><td>44<\/td><td>1,52<\/td><td>22<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Odczyt odwrotny: <strong>M = d · M(wzorca)<\/strong> — gaz o d = 1,52 względem powietrza ma M = 1,52 · 29 ≈ 44. To brama do wzorów rzeczywistych (sekcja 4).<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — gaz–gaz w trzech krokach bez moli<\/span>\n<p>(1) Zbilansuj równanie. (2) Objętości gazów przepisz proporcjonalnie do współczynników (dm³ jak mole). (3) Para wodna po ochłodzeniu — ciecz: wyłącz ją z bilansu objętości. Przykład: 10 dm³ butanu (2C₄H₁₀ + 13O₂ → 8CO₂ + 10H₂O): O₂ = 10·13/2 = 65 dm³; CO₂ = 10·8/2 = 40 dm³; H₂O — pomijamy w objętościach.<\/p>\n<\/div>\n<div class=\"card card-error\">\n<span class=\"card-label\">Objętość molowa dla cieczy — klasyczny fałszywy krok<\/span>\n<p>„1 mol wody ma 22,4 dm³\" — błąd. Vₘ = 22,4 dm³/mol działa <strong>wyłącznie dla gazów<\/strong>. 1 mol wody to 18 g i ok. 18 cm³ (gęstość 1 g/cm³); 1 mol glukozy — ok. 120 cm³ (M = 180, gęstość ~1,5 g/cm³ — orientacyjnie). Objętość cieczy/ciała stałego zależy od upakowania cząsteczek; objętość gazu — tylko od ich liczby. W zadaniach: V = n·22,4 piszemy tylko przy symbolu gazu (CO₂(g), H₂(g), NH₃(g)).<\/p>\n<\/div>\n<figure class=\"lk-fig\" data-klocek=\"trojkat-przeliczen\" data-opt=\"{&quot;wzor&quot;: &quot;gaz&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Trójkąt: V, n, Vm<\/figcaption><\/figure>\n<!-- OPIS: Trójkąt dla gazu w warunkach normalnych (0 °C, 1013 hPa): objętość V u góry, liczba moli n i objętość molowa 22,4 dm³/mol na dole; V = n · 22,4 i n = V / 22,4. -->\n<\/section>\n<section id=\"wzory\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Wykład — wzory elementarne i rzeczywiste: procedura procentów<\/div>\n<p><strong>Wzór elementarny<\/strong> to najprostszy całkowity stosunek atomów w związku. <strong>Wzór rzeczywisty (sumaryczny)<\/strong> — rzeczywista liczba atomów w cząsteczce. Zawsze:<\/p>\n<p><strong>M(rzeczywisty) = k · M(elementarnego)<\/strong>, gdzie k = 1, 2, 3, ...<\/p>\n<p>Procedura z procentów masowych (klasyka wojewódzka — krok po kroku):<\/p>\n<ol>\n<li>Przyjmij <strong>100 g<\/strong> związku → procenty stają się gramami.<\/li>\n<li>Przelicz masy pierwiastków na <strong>mole atomów<\/strong>: n = m/A (A — masa atomowa).<\/li>\n<li>Podziel wszystkie wyniki przez <strong>najmniejszy<\/strong> → stosunek elementarny (zaokrąglaj do bliskich liczb całkowitych; 0,5 lub 0,33/0,67 podpowiedzi mnożenie ×2/×3).<\/li>\n<li>Zapisz <strong>wzór elementarny<\/strong> i policz M(elementarnego).<\/li>\n<li>Jeśli masz <strong>M rzeczywiste<\/strong> (z gęstości względnej albo danych) → k = M/M(el.) → <strong>wzór rzeczywisty<\/strong>.<\/li>\n<\/ol>\n<p><strong>Przykład 1 — domknięcie ORG05.<\/strong> Związek: 40,0% C, 6,7% H, 53,3% O; M = 60 g/mol.<\/p>\n<ol>\n<li>100 g → m(C) = 40 g; m(H) = 6,7 g; m(O) = 53,3 g.<\/li>\n<li>n(C) = 40/12 = 3,33 mol; n(H) = 6,7/1 = 6,7 mol; n(O) = 53,3/16 = 3,33 mol.<\/li>\n<li>Dziel przez 3,33: C — 1; H — 2,01 → 2; O — 1,00.<\/li>\n<li>Wzór elementarny: <strong>CH₂O<\/strong>; M(el.) = 12 + 2 + 16 = 30 g/mol.<\/li>\n<li>k = 60/30 = 2 → wzór rzeczywisty: <strong>C₂H₄O₂<\/strong> — kwas octowy (albo mrówczan metylu HCOOCH₃ — izomery funkcjonalne, ORG06).<\/li>\n<\/ol>\n<p><strong>Przykład 2 — domknięcie ORG07.<\/strong> Te same procenty (40,0/6,7/53,3), ale M = 180 g/mol:<\/p>\n<p>k = 180/30 = 6 → <strong>C₆H₁₂O₆<\/strong> — glukoza!<\/p>\n<p>Ten sam wzór elementarny, dwa różne rzeczywiste — CH₂O to wspólny „przodek\" kwasu octowego i glukozy; sam w sobie jest tylko proporcją, nie substancją.<\/p>\n<p><strong>Przykład 3 — domknięcie ORG02.<\/strong> Węglowodór: 85,7% C, 14,3% H; gęstość względem powietrza d ≈ 1,93.<\/p>\n<p>1–3. n(C) = 85,7/12 = 7,14; n(H) = 14,3/1 = 14,3 → dziel przez 7,14: C 1; H 2 → <strong>CH₂<\/strong>; M(el.) = 14.\n4. M = 1,93 · 29 ≈ 56 g/mol.\n5. k = 56/14 = 4 → <strong>C₄H₈<\/strong> — buten (alken; CₙH₂ₙ ✔).<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — wzór elementarny vs rzeczywisty w trzech liniach<\/span>\n<p>Elementarny = proporcja (CH₂O); rzeczywisty = substancja (C₂H₄O₂). Bez M rzeczywistego nie ma wzoru rzeczywistego — procenty dają tylko proporcję. Jeden elementarny, wiele rzeczywistych: CH₂O → C₂H₄O₂ (k = 2, np. kwas octowy) albo C₆H₁₂O₆ (k = 6, glukoza); każde k daje inną substancję. Na konkursie: policz elementarny, sprawdź, czy M się zgadza z k = 1 — jeśli nie, dopiero wtedy mnoż.<\/p>\n<\/div>\n<div class=\"card card-error\">\n<span class=\"card-label\">Odczytywanie M z gęstości — dwa typowe błędy<\/span>\n<p>(1) Pomnożenie przez złego wzorca: d względem <strong>wodoru<\/strong> wymaga M = d · 2, względem <strong>powietrza<\/strong> — M = d · 29; w zadaniu zawsze jest napisane „względem czego\". (2) Trzymanie się d jako „gęstości w g/dm³\": gęstość względna jest <strong>liczbą bez jednostki<\/strong> (porównanie dwóch gęstości); gęstość absolutna gazu w warunkach normalnych to M/22,4 g/dm³ — to inna wielkość. Przykład: CO₂ — d(powietrze) = 1,52, ale ρ = 44/22,4 ≈ 1,96 g/dm³.<\/p>\n<\/div>\n<\/section>\n<section id=\"dosw\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Doświadczenie<\/div>\n<figure class=\"lk-fig\" data-klocek=\"karta-bhp\" data-opt=\"{}\"><div class=\"lk-fig-body\"><\/div><figcaption>Zasady pracy i pierwsza pomoc<\/figcaption><\/figure>\n<!-- OPIS: Cztery rozwijane karty: przed doświadczeniem (okulary, fartuch, czytanie opisu), kwasy i zasady (kwas do wody, płukanie 15 minut), ogrzewanie (probówka ukośnie, otworem od siebie), pierwsza pomoc (oparzenie, skaleczenie, wdychanie gazu). Wniosek: zasady są takie same przy każdym doświadczeniu i trzeba je znać przed rozpoczęciem pracy. -->\n<figure class=\"lk-fig\" data-klocek=\"zbieranie-gazu\" data-opt=\"{&quot;gaz&quot;: &quot;H2&quot;, &quot;metoda&quot;: &quot;woda&quot;, &quot;gazy&quot;: &quot;H2,O2,CO2&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Zbieranie wodoru nad wodą (i porównanie z innymi metodami)<\/figcaption><\/figure>\n<!-- OPIS: Scena zbierania gazu: po lewej kolba z reakcją (pęcherzyki w cieczy, nad nią korek), z niej rurka odprowadzająca prowadzi do naczynia po prawej. Gaz jest bezbarwny, więc zaznaczono go ciemnozielonymi kropkami, a powietrze — szarymi. Chipy wybierają gaz i sposób zbierania: naczynie wylotem do góry (gaz cięższy od powietrza opada na dno i wypycha powietrze), wylotem do dołu (gaz lżejszy zbiera się pod dnem) albo nad wodą (gaz wypiera wodę z odwróconego naczynia). Poprawny wybór napełnia naczynie i pokazuje zielony werdykt; zły — gaz ucieka z naczynia albo rozpuszcza się w wodzie, a werdykt jest czerwony. Wniosek: o sposobie zbierania decyduje gęstość względna d = M/29 (cięższy czy lżejszy od powietrza) i rozpuszczalność w wodzie. -->\n<div class=\"exp-card\"><h5>Doświadczenie 1 — Wytworzenie i pomiar wodoru: kontrola objętości molowej (demonstracja)<\/h5><div class=\"exp-grid\"><\/div><p><strong>Problem:<\/strong> Czy z odważonej porcji cynku można przewidzieć objętość wodoru — i czy pomiar potwierdzi Vₘ = 22,4 dm³/mol?<\/p>\n<p><strong>Hipoteza:<\/strong> Zn + 2HCl → ZnCl₂ + H₂↑; z 3,25 g cynku (0,05 mol) powstanie 0,05 mol H₂, czyli teoretycznie 0,05 · 22,4 = 1,12 dm³ — pomiar odwróconym cylindrem nad wanienką powinien dać wartość bliską (poprawki: temperatura pokojowa zwiększy objętość, rozpuszczalność H₂ w wodzie minimalnie zmniejszy; porównujemy rzędy wielkości).<\/p>\n<p><strong>Sprzęt:<\/strong> kolba z korkiem i rurką odprowadzającą, odwrócony cylinder miarowy (lub butelka z podziałką) nad wanienką wodną, cynk granulowany (3,25 g — odważone), rozcieńczony kwas solny, okulary i rękawice — <strong>demonstracja nauczycielska<\/strong>.<\/p>\n<p><strong>Przebieg:<\/strong>\n1. Wypełnij cylinder wodą, odwróć nad wanienką (koniec nie może się wynurzyć).\n2. Do kolby wsyp cynk, wlej kwas, zamknij korkiem z rurką prowadzącą pod cylinder.\n3. Gazy zbieraj nad wodą; po ustaniu reakcji odczytaj objętość H₂ przy wyrównaniu poziomów wody.\n4. Porównaj z przewidywaniem (1,12 dm³ — warunki normalne; przy ~20 °C oczekuj ok. 7% więcej (293/273) — jakościowo).<\/p>\n<p><strong>Obserwacje:<\/strong> na cynku intensywne bąbelki; cylinder wypełnia się gazem; objętość końcowa rzędu ~1,1–1,2 dm³ (zależnie od warunków pomiaru).<\/p>\n<p><strong>Wniosek:<\/strong> 3,25 g Zn = 0,05 mol → 0,05 mol H₂ → teoretycznie 1,12 dm³ (Vₘ = 22,4 dm³/mol). Pomiar potwierdza rząd wielkości i ideę: masa substratu → mole → objętość gazu. Różnice rzędu kilku % to temperatura pomiaru, ciśnienie pary wodnej nad wodą i rozpuszczalność H₂ — dokładna analiza poprawek poza zakresem.<\/p>\n<p><strong>Bezpieczeństwo:<\/strong> H₂ — palny (próba zapłonu dopiero po zdjęciu cylindra, mała probówka, strona od twarzy); kwas — rękawice i okulary; sprawdzić szczelność przed startem; nie prowadzić przy otwartym ogniu.<\/p><\/div>\n<\/section>\n<section id=\"zadania\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Zadania<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 1 (4 pkt) — Trójkąt konwersji na CO₂<\/span>\n<p>Dla <strong>88 g CO₂<\/strong> (M = 44 g/mol) oblicz: (a) liczbę moli; (b) liczbę cząsteczek; (c) objętość w warunkach normalnych; (d) gęstość względną względem powietrza (M ≈ 29) i wniosek o zbieraniu gazu.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) n = 88/44 = <strong>2 mol<\/strong> (1 pkt). (b) N = 2 · 6,02·10²³ = <strong>1,204·10²⁴ cząsteczek<\/strong> (1 pkt). (c) V = 2 · 22,4 = <strong>44,8 dm³<\/strong> (1 pkt). (d) d = 44/29 ≈ <strong>1,52<\/strong> — CO₂ cięższy od powietrza (można zbierać wypieraniem powietrza do zlewki „dnem w dół\" — gaz opada) (1 pkt).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 2 (5 pkt) — Stosunki objętościowe: spalanie propanu<\/span>\n<p>Spalano <strong>5 dm³ propanu<\/strong> (C₃H₈ + 5O₂ → 3CO₂ + 4H₂O). Oblicz: (a) objętość O₂ potrzebną do spalania; (b) objętość CO₂ powstającą; (c) objętość powietrza (21% O₂ — N01); (d) dlaczego pary wodnej nie uwzględnia się w objętościach spalin; (e) ile moli propanu odpowiada 5 dm³ (warunki normalne) i jaką masę ma ta porcja?<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) Stosunek 1 : 5 → <strong>25 dm³<\/strong> (1 pkt). (b) 1 : 3 → <strong>15 dm³<\/strong> (1 pkt). (c) 25/0,21 ≈ <strong>119 dm³<\/strong> (1 pkt; dokładnie 119,05). (d) Po ochłodzeniu H₂O jest cieczą — z bilansu gazów wypada (1 pkt). (e) n = 5/22,4 ≈ 0,223 mol; m ≈ 0,223 · 44 ≈ <strong>9,8 g<\/strong> (1 pkt).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 3 (5 pkt) — Wzór elementarny z procentów<\/span>\n<p>Związek zawiera 85,7% C i 14,3% H (masowo); jego gęstość względem powietrza wynosi d ≈ 1,45 (M ≈ 42 g/mol). (a) Przeprowadź procedurę: masy → mole atomów → stosunek elementarny. (b) Podaj wzór elementarny i jego M. (c) Oblicz k i wzór rzeczywisty. (d) Do jakiej grupy węglowodorów należy ten związek (wzór ogólny)? (e) Podaj dwie możliwe tożsamości (nazwy) związku.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) 100 g: n(C) = 85,7/12 = 7,14; n(H) = 14,3/1 = 14,3 → dziel przez 7,14: C 1,00; H 2,00 → stosunek C : H = 1 : 2 (1,5 pkt). (b) Wzór elementarny <strong>CH₂<\/strong>; M(el.) = 14 g/mol (0,5 pkt). (c) k = 42/14 = 3 → <strong>C₃H₆<\/strong> (2 pkt: 1 k, 1 wzór). (d) CₙH₂ₙ — alkeny (0,5 pkt). (e) Propen (propylen); ewentualnie cyklopropan (izomer C₃H₆ bez wiązania podwójnego — nazwa nieobowiązkowa) (0,5 pkt).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 4 (4 pkt) — Gęstość względna w obie strony<\/span>\n<p>(a) Oblicz d metanu (CH₄) względem powietrza (M ≈ 29) i wniosek o zbieraniu nad cieczą/powietrzem. (b) Gaz ma d = 2,22 względem powietrza — oblicz jego M i zaproponuj tożsamość (z serii organiki; M ∈ {58, 64,5}). (c) Ile waży 1 dm³ tego gazu w warunkach normalnych (gęstość absolutna)? (d) Dlaczego d jest liczbą bez jednostki?<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) d = 16/29 ≈ <strong>0,55<\/strong> — metan lżejszy od powietrza (można zbierać naczyniem dnem do góry lub nad cieczą) (1 pkt). (b) M = 2,22 · 29 ≈ <strong>64,5 g/mol<\/strong> → chloroetan C₂H₅Cl (24 + 5 + 35,5 = 64,5) (1,5 pkt). (c) ρ = M/Vₘ = 64,5/22,4 ≈ <strong>2,88 g/dm³<\/strong> (1 pkt). (d) To iloraz dwóch gęstości w tych samych jednostkach — jednostki się skracają (0,5 pkt).<\/p>\n<\/details>\n<\/section>\n<section id=\"zadania-adv\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Zadania konkursowe<\/div>\n<details class=\"adv\"><summary>Zadanie 5 (6 pkt) — Wzór rzeczywisty z gęstości: pełny łańcuch <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Związek organiczny zawiera 40,0% C, 6,7% H i 53,3% O (masowo); jego gęstość względem powietrza wynosi d ≈ 2,07.\n(a) Ustal wzór elementarny (pełna procedura).\n(b) Oblicz M rzeczywiste z gęstości względnej (M powietrza ≈ 29).\n(c) Ustal wzór rzeczywisty.\n(d) Podaj <strong>dwie<\/strong> możliwe tożsamości związku (z serii organiki) i rozstrzygnij, jaką jedną próbą je rozróżnisz.\n(e) Uczeń stwierdził: „wzór elementarny CH₂O to formaldehyd\". Oceń — co jest nie tak?<\/p>\n<\/div><\/details>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) 100 g → 40/12 = 3,33; 6,7/1 = 6,7; 53,3/16 = 3,33 → 1 : 2 : 1 → <strong>CH₂O<\/strong> (M(el.) = 30) (2 pkt).\n(b) M = 2,07 · 29 ≈ <strong>60 g/mol<\/strong> (1 pkt).\n(c) k = 60/30 = 2 → <strong>C₂H₄O₂<\/strong> (1 pkt).\n(d) Dwie tożsamości C₂H₄O₂: <strong>kwas octowy<\/strong> CH₃COOH i <strong>mrówczan metylu<\/strong> HCOOCH₃ (izomery funkcjonalne: kwas i ester, ORG06). Rozróżnienie: lakmus — kwas octowy czerwieni lakmus, mrówczan metylu jest obojętny (1,5 pkt: 0,5 × 2 tożsamości, 0,5 próba).\n(e) Formaldehyd to CH₂O rzeczywisty (M = 30) — wzór elementarny równy rzeczywistemu tylko, gdy k = 1; nasz związek ma M = 60, więc CH₂O jest tylko proporcją (1 pkt).<\/p>\n<\/details>\n<details class=\"adv\"><summary>Zadanie 6 (7 pkt) — Eten przez trzy reaktory: objętości, wydajność, gęstość <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Do instalacji wchodzi <strong>11,2 dm³ etenu<\/strong> (warunki normalne; Vₘ = 22,4 dm³/mol). Etap 1 — addycja HCl (wydajność 90%): CH₂=CH₂ + HCl → CH₃CH₂Cl. Etap 2 — reszta etenu (nieprzekształcona) przechodzi addycję Br₂ (1 : 1; M(Br₂) = 160 g/mol — wartość podręcznikowa). M(C₂H₅Cl) = 64,5 g/mol.\n(a) Oblicz liczbę moli etenu na wejściu.\n(b) Oblicz liczbę moli i masę chloroetanu z etapu 1.\n(c) Oblicz gęstość względną chloroetanu względem powietrza (M ≈ 29) i porównaj z CO₂ — który jest cięższy?\n(d) Oblicz masę Br₂ zużytą w etapie 2.\n(e) Oblicz łączną objętość H₂ (warunki normalne), jaka wystarczyłaby, by uwodornić do etanu <strong>cały<\/strong> eten wejściowy (kontrola bilansu materiałowego instalacji).\n(f) Uczeń podsumował: „z 11,2 dm³ etenu wyszło łącznie ok. 45 g produktów organicznych\". Sprawdź rachunek (chloroetan + dibromoetan).<\/p>\n<\/div><\/details>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) n(C₂H₄) = 11,2/22,4 = <strong>0,5 mol<\/strong> (1 pkt).\n(b) n(C₂H₅Cl) = 0,9 · 0,5 = <strong>0,45 mol<\/strong>; m = 0,45 · 64,5 = <strong>29,025 g ≈ 29,0 g<\/strong> (2 pkt: 1 wydajność, 1 masa).\n(c) d = 64,5/29 ≈ <strong>2,22<\/strong>; CO₂: 44/29 ≈ 1,52 — chloroetan <strong>cięższy<\/strong> (1 pkt).\n(d) Eten na etap 2: 0,5 − 0,45 = 0,05 mol → n(Br₂) = 0,05 mol → m = 0,05 · 160 = <strong>8 g<\/strong> (1,5 pkt).\n(e) Uwodornienie 1 : 1 na całość: 0,5 mol H₂ → V = 0,5 · 22,4 = <strong>11,2 dm³<\/strong> (0,5 pkt).\n(f) Dibromoetan: 0,05 mol · 188 = 9,4 g; razem produkty: 29,0 + 9,4 = <strong>38,4 g<\/strong>. Wynik ucznia (ok. 45 g) jest zawyżony — błąd w rachunku masy (1 pkt).<\/p>\n<\/details>\n<\/section>\n<section>\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Fiszki<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Definicja mola?<\/span><span class=\"back\">porcja 6,02·10²³ cząstek (atomów, cząsteczek, jonów)<\/span><span class=\"card-tag tag-definicje\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Liczba Avogadra (szkolna i dokładna)?<\/span><span class=\"back\">6,02·10²³ mol⁻¹; dokładnie 6,02214076·10²³ (SI 2019)<\/span><span class=\"card-tag tag-definicje\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wzory konwersji m–n?<\/span><span class=\"back\">n = m/M; m = n·M<\/span><span class=\"card-tag tag-rachunek\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wzory konwersji n–N?<\/span><span class=\"back\">N = n·N_A; n = N/N_A<\/span><span class=\"card-tag tag-rachunek\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wzory konwersji n–V (gazy)?<\/span><span class=\"back\">V = n·22,4; n = V/22,4 — tylko gazy!<\/span><span class=\"card-tag tag-rachunek\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Vₘ i warunki normalne?<\/span><span class=\"back\">22,4 dm³/mol przy 0 °C i ≈1013 hPa<\/span><span class=\"card-tag tag-gazy\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Stosunki objętościowe gaz–gaz?<\/span><span class=\"back\">równe stosunkom współczynników równania (prawo Avogadro) — bez liczenia moli<\/span><span class=\"card-tag tag-gazy\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Gęstość względna — wzory?<\/span><span class=\"back\">d = M/M(wzorca); M = d·29 (powietrze) lub d·2 (wodór)<\/span><span class=\"card-tag tag-gazy\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">M powietrza (średnia)?<\/span><span class=\"back\">ok. 29 g/mol (78% N₂ + 21% O₂)<\/span><span class=\"card-tag tag-gazy\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wzór elementarny?<\/span><span class=\"back\">najprostszy całkowity stosunek atomów (CH₂O)<\/span><span class=\"card-tag tag-wzory\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wzór rzeczywisty?<\/span><span class=\"back\">rzeczywista liczba atomów; M = k · M(elementarnego)<\/span><span class=\"card-tag tag-wzory\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Procedura procentów — krok 2?<\/span><span class=\"back\">przelicz masy na mole atomów: n = m/A, potem dziel przez najmniejsze<\/span><span class=\"card-tag tag-wzory\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">CH₂O — o którym związku mówi?<\/span><span class=\"back\">o proporcji; rzeczywiście: C₂H₄O₂ (kwas octowy, M = 60) i C₆H₁₂O₆ (glukoza, M = 180)<\/span><span class=\"card-tag tag-wzory\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">1 mol wody — ile g i ile cm³?<\/span><span class=\"back\">18 g; ok. 18 cm³ (Vₘ = 22,4 tylko dla gazów!)<\/span><span class=\"card-tag tag-pułapki\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Para wodna w spalinach — objętość?<\/span><span class=\"back\">nie liczy się (po ochłodzeniu ciecz)<\/span><span class=\"card-tag tag-pułapki\"><\/span><\/button><\/div>\n<\/section>\n<section>\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Test kontrolny<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"0\"><h5>1. Objętość molowa gazu w warunkach normalnych wynosi:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">22,4 dm³/mol<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">22,4 cm³/mol<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">24 mol/dm³<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>2. Z 10 dm³ propanu po spalaniu powstanie (C₃H₈ + 5O₂ → 3CO₂ + 4H₂O):<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">30 dm³ CO₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">15 dm³ CO₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">50 dm³ CO₂<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>3. Gaz o gęstości względnej d = 0,55 względem powietrza jest:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">lżejszy od powietrza (możliwy metan)<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">cięższy od powietrza (możliwy propan)<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">niemożliwy do ustalenia bez próby<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>4. Wzór elementarny CH₂O odpowiada rzeczywistemu:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">C₂H₄O₂ (kwas octowy) przy M = 60 g/mol<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">wyłącznie formaldehydowi, zawsze<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">C₃H₆O₃ przy M = 60 g/mol<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>5. Do ustalenia wzoru rzeczywistego oprócz procentów masowych potrzebne jest:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">masa molowa (np. z gęstości względnej)<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">objętość próbki<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">temperatura topnienia<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section>\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Słownik<\/div>\n<dl><div class=\"def-item\"><dt>mol<\/dt><dd>jednostka liczności: porcja 6,02214076·10²³ cząstek (skrótowo 6,02·10²³).<\/dd><\/div><div class=\"def-item\"><dt>liczba Avogadra (N_A)<\/dt><dd>liczba cząstek w molu; 6,02·10²³ mol⁻¹ (dokładna od reformy SI 2019 r.).<\/dd><\/div><div class=\"def-item\"><dt>masa molowa (M)<\/dt><dd>masa jednego mola w g/mol; liczbowo równa masie cząsteczkowej/atomowej.<\/dd><\/div><div class=\"def-item\"><dt>objętość molowa (Vₘ)<\/dt><dd>objętość jednego mola gazu: 22,4 dm³/mol w warunkach normalnych — tylko dla gazów.<\/dd><\/div><div class=\"def-item\"><dt>warunki normalne<\/dt><dd>0 °C i ciśnienie ≈ 1013 hPa; punkt odniesienia Vₘ = 22,4 dm³/mol.<\/dd><\/div><div class=\"def-item\"><dt>prawo Avogadro<\/dt><dd>w równych objętościach gazów (te T, p) jest ta sama liczba cząsteczek; stąd stosunki objętościowe = stosunki molowe.<\/dd><\/div><div class=\"def-item\"><dt>stosunek objętościowy<\/dt><dd>proporcja objętości gazów w reakcji, równa proporcji współczynników równania.<\/dd><\/div><div class=\"def-item\"><dt>gęstość względna (d)<\/dt><dd>stosunek gęstości gazu do gęstości wzorca (powietrze M ≈ 29, wodór M = 2); d = M/M(wzorca), liczba bez jednostki.<\/dd><\/div><div class=\"def-item\"><dt>wzór elementarny<\/dt><dd>najprostszy całkowity stosunek atomów w związku (CH₂O); niekoniecznie wzór cząsteczki.<\/dd><\/div><div class=\"def-item\"><dt>wzór rzeczywisty (sumaryczny)<\/dt><dd>rzeczywista liczba atomów w cząsteczce (C₂H₄O₂); M = k · M(elementarnego).<\/dd><\/div><div class=\"def-item\"><dt>stosunek molowy<\/dt><dd>proporcja moli substratów/produktów wynikająca ze współczynników równania.<\/dd><\/div><div class=\"def-item\"><dt>liczba Loschmidta<\/dt><dd>liczba cząsteczek gazu w 1 cm³ w warunkach normalnych (ok. 2,7·10¹⁹ — zaokrąglona).<\/dd><\/div><div class=\"def-item\"><dt>gęstość absolutna<\/dt><dd>masa jednostki objętości gazu: ρ = M/22,4 g/dm³ (warunki normalne) — odróżniać od d.<\/dd><\/div><\/dl>\n<\/section>\n<section>\n<div class=\"part-heading\">Do weryfikacji<\/div>\n<ul>\n<li><strong>ORG08:<\/strong> Vₘ = 22,4 dm³/mol i warunki normalne (0 °C, 1013,25 hPa) — wartości standardowe podręcznikowe; objętość molowa przy ~20 °C „ok. 24 dm³/mol\" — orientacyjne, oznaczone.<\/li>\n<li><strong>ORG08:<\/strong> M powietrza ≈ 29 g/mol — średnia standardowa (dokładniej 28,96); d metanu 0,55 (16/29 = 0,5517), propanu 1,52 (44/29 = 1,517), chloroetanu 2,22 (64,5/29 = 2,224) — zaokrąglenia spójne.<\/li>\n<li><strong>ORG08:<\/strong> liczba Loschmidta 2,69·10¹⁹/cm³ — zaokrąglona, oznaczona (dokładna 2,6868·10¹⁹ przy 22,414 dm³/mol).<\/li>\n<li><strong>ORG08:<\/strong> kropla wody „ok. 0,05 cm³\" — zależnie od pipety, oznaczone; 1 cm³ wody → 3,34·10²² cząsteczek (1/18 · 6,02·10²³ = 3,344·10²²) ✔.<\/li>\n<li><strong>ORG08:<\/strong> exam 3 — dane poprawiono względem wersji roboczej (92,3% C / 7,7% H dawało stosunek 1 : 1 i M = 42, niepodzielne przez 13); teraz 85,7% C / 14,3% H → CH₂, k = 3, C₃H₆ — rachunek dokładny.<\/li>\n<li><strong>ORG08:<\/strong> adv 5d — tożsamości C₂H₄O₂: kwas octowy i mrówczan metylu (ester, izomer funkcjonalny); wcześniejsza notka o glikolaldehydzie usunięta.<\/li>\n<li><strong>ORG08:<\/strong> adv 6f — poprawna suma 38,4 g (29,025 + 9,4); „ok. 45 g\" ucznia pozostawione jako celowy błąd do wykrycia (bez wskazania źródła błędu — klucz dopuszcza interpretację); rachunki: 0,45·64,5 = 29,025 ✔; 0,05·188 = 9,4 ✔; 29,025 + 9,4 = 38,425 ≈ 38,4 ✔.<\/li>\n<li><strong>ORG08:<\/strong> M(Br₂) = 160 g/mol — wartość podręcznikowa spoza listy B1 (Br = 80), oznaczona (jak w ORG02).<\/li>\n<li><strong>SERIA ORG01–ORG08:<\/strong> wszystkie odwołania do Vₘ = 22,4 dm³/mol domknięte wykładem ORG08; w ORG01–07 przy scalaniu można dodać odnośniki do sekcji 1–2 ORG08.<\/li>\n<\/ul>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1/W2 — zewnętrzny, blok organiczny (2026-10-14)<\/div>\n<p>Zastosowano: dodano sekcję „Najczęstsze pułapki” z pięcioma punktami (masa molowa a masa próbki, Vₘ tylko dla gazów w warunkach normalnych, współczynniki, kolejność n → V, wydajność na właściwym etapie).<\/p>\n<p>Nieprzyjęte: wzory n = m/M, N = n·N_A, V = n·Vₘ, Vₘ = 22,4 dm³/mol w warunkach normalnych są w lekcji; pułapka wzorów elementarnych i pary wodnej jest już w ćwiczeniach.<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1/W2 — kolejny przebieg zewnętrzny (2026-10-14)<\/div>\n<p>Zastosowano: dodano pułapkę „brak sprawdzenia reagenta ograniczającego” do listy pułapek.<\/p>\n<p>Nieprzyjęte (sprawdzone w pliku): procedura zadania (zbilansuj, przelicz na mole, użyj współczynników, przelicz na jednostkę, sprawdź fazę) jest w lekcji jako kroki przy zadaniu z gazami; zasada, że woda w warunkach normalnych jest cieczą, jest w lekcji; wzory n = m/M, N = n·N_A, V = n·Vₘ są poprawne.<\/p>\n<p>Do osobnego zadania (nie w tej lekcji): test przekrojowy ORG01–ORG08 i zestaw mieszany — poza zakresem tego audytu.<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1/W2 — wynik zewnętrzny, kolejny przebieg (2026-10-14)<\/div>\n<p>Zastosowano: brak zmian treści.<\/p>\n<p>Nieprzyjęte: oznaczenie „W1 FULL” nie zostało wprowadzone — pełny przegląd linia po linii nie był wykonany, stan lekcji pozostaje „bez audytu W1”. Sprawdzone w pliku: zależności n = m/M, N = nN_A, V = nVₘ; Vₘ = 22,4 dm³/mol tylko dla gazów w warunkach normalnych; gęstości względne (CH₄ ≈ 0,55; C₂H₅Cl ≈ 2,22); wzór elementarny CH₂O i rzeczywisty C₂H₄O₂ (k = 2); stosunki objętościowe propanu; zadanie łańcuchowe z etenem (0,5 mol, 0,45 mol chloroetanu, 29,0 g; Br₂ 8,0 g; produkty ok. 38,4 g) jest w lekcji z kontrolą uczniowskiego błędu „45 g”. Zapis „CH₄?” nie występuje w pliku.<\/p>\n<\/section>\n<footer class=\"footer\">\n<p>\"LKO-ORG08 · pełna struktura\"<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n"</script>
