;\n\n/* ---------- 8. F05 — konstruktor: izotop / jon / inny pierwiastek + masa atomowa jako średnia ważona ----------\n   Model wielokrotnego użytku (F04, F05, F06, A01…): `f05-izotopy-v01`. Dane izotopów z silnika (CHE.DATA.ISOTOPES). */\n/* dane z silnika (bez lokalnej kopii): CHE.DATA.ELEMENTS_54 (symbol, nazwa) + CHE.DATA.ISOTOPES (A, masa, udział) */\nfunction izo(z){var E=(D.ELEMENTS_54||[]).filter(function(e){return e.z===z})[0];if(!E)return null;\n var L=(D.ISOTOPES||{})[E.s]||[];return [E.s,String(E.n||E.s).toLowerCase(),L.map(function(x){return [x.A,x.atomicMass,(x.abundance||0)*100]}).sort(function(a,b){return b[2]-a[2]||a[0]-b[0]})]}\nfunction supN(n){return String(n).replace(/[0-9]/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]})}\nfunction subN(n){return String(n).replace(/[0-9]/g,function(d){return '₀₁₂₃₄₅₆₇₈₉'[d]})}\nfunction chg(q){return q===0?'':(Math.abs(q)>1?supN(Math.abs(q)):'')+(q>0?'⁺':'⁻')}\nfunction pl(x,d){return x.toFixed(d).replace('.',',')}\n/* atomSVG usunięty 2026-10-09 — model atomu w lekcjach rysuje wspólny komponent CHE.LAB.atomBohr (engine/src/komponenty/atlas-gfx.js), ten sam co atlas (powłoki K, L, M — model szkolny 2, 8, 8). */\n/* atomBohr, orbitalCloud → engine/src/dodatki/atlas-gfx.js (wspólne dla labu i lekcji, CHE.LAB.*) */\n\nV.define('f05-izotopy-v01',{title:'Izotop, jon czy inny pierwiastek? Konstruktor atomu i masa atomowa',tag:'MODEL',\n hint:'Dodawaj i zabieraj protony, neutrony i elektrony. Model mówi, co się zmieniło: pierwiastek (Z), izotop (n) czy ładunek (e). Niżej: skąd się bierze masa atomowa z układu okresowego.',\n foot:'rozszerzenia.js §8 · dane: CHE.DATA.ISOTOPES, ELEMENTS_54',\n build:function(host){host.innerHTML='';host.classList.add('x5');\n  var s={p:17,n:18,e:17},start={p:17,n:18,e:17};\n  var pick=el('div','bar','<b>Start:<\/b>');host.appendChild(pick);\n  [1,6,8,11,12,17,20].forEach(function(z){var d=izo(z);if(!d||!d[2].length)return;var b=el('button','o',d[0]);b.type='button';b.onclick=function(){s={p:z,n: "><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#jak-pracowac\">0.1. Jak pracować z lekcją<\/a><a class=\"toc-link\" href=\"#cele\">0.2. Cele lekcji i pytanie przewodnie<\/a><a class=\"toc-link\" href=\"#kompas\">0.3. Kompas — co trzeba wiedzieć wcześniej<\/a><a class=\"toc-link\" href=\"#wyklad\">0.4. Wykład — sól od zera<\/a><a class=\"toc-link\" href=\"#definicja\">1. Budowa i definicja soli<\/a><a class=\"toc-link\" href=\"#wzory\">2. Wzory soli — bilans ładunku<\/a><a class=\"toc-link\" href=\"#nazewnictwo\">3. Nazwy soli<\/a><a class=\"toc-link\" href=\"#dysocjacja\">4. Dysocjacja soli<\/a><a class=\"toc-link\" href=\"#rozpuszczalnosc\">5. Tabela rozpuszczalności<\/a><a class=\"toc-link\" href=\"#otrzymywanie\">6. Otrzymywanie soli — 10 metod<\/a><a class=\"toc-link\" href=\"#stracanie\">7. Reakcje strąceniowe, zapis jonowy i wykrywanie jonów<\/a><a class=\"toc-link\" href=\"#wypieranie\">8. Wypieranie metali — szereg aktywności<\/a><a class=\"toc-link\" href=\"#hydraty\">9. Hydraty<\/a><a class=\"toc-link\" href=\"#zastosowania\">10. Ważne sole — właściwości i zastosowania<\/a><a class=\"toc-link\" href=\"#bhp\">11. Bezpieczeństwo (BHP) przy pracy z solami<\/a><a class=\"toc-link\" href=\"#rodzaje\">12. Rodzaje soli — obojętne, wodorosole, hydroksosole<\/a><a class=\"toc-link\" href=\"#hydroliza\">13. Odczyn roztworów soli — hydroliza<\/a><a class=\"toc-link\" href=\"#iloczyn\">14. Iloczyn rozpuszczalności<\/a><a class=\"toc-link\" href=\"#przyroda\">15. Sole w przyrodzie i w organizmie  BIOL-CHEM<\/a><a class=\"toc-link\" href=\"#doswiadczenia\">16. Doświadczenia<\/a><a class=\"toc-link\" href=\"#klinika\">17. Klinika błędów<\/a><a class=\"toc-link\" href=\"#przekroj-n04\">17.5. Zadanie z przekroju materiałów — parafraza (poziom O)<\/a><a class=\"toc-link\" href=\"#cwiczenia\">18. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#typologia\">19. Typologia zadań E8<\/a><a class=\"toc-link\" href=\"#test\">20. Test<\/a><a class=\"toc-link\" href=\"#powtorka\">21. Karta szybkiego powtórzenia i mapa myśli<\/a><a class=\"toc-link\" href=\"#fiszki\">22. Fiszki<\/a><a class=\"toc-link\" href=\"#slownik\">23. Słownik<\/a><a class=\"toc-link\" href=\"#checklista\">24. Checklista<\/a><a class=\"toc-link\" href=\"#mosty\">A. Dodatek A — mosty i co dalej<\/a><a class=\"toc-link\" href=\"#modele\">Modele silnika w tej lekcji<\/a><a class=\"toc-link\" href=\"#audit\">Audyt jakości<\/a><\/nav><\/details>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć na E8 — 10 faktów<\/h3>\n<ol>\n<li><strong>Sól<\/strong> to związek zbudowany z kationów metalu (lub NH₄⁺) i anionów reszty kwasowej; wzór ogólny M<sub>n<\/sub>R<sub>m<\/sub>. W stanie stałym — <strong>kryształ jonowy<\/strong>.<\/li>\n<li><strong>Wzór<\/strong>: suma ładunków = 0 (Al³⁺ + SO₄²⁻ → Al₂(SO₄)₃). <strong>Nazwa<\/strong>: reszta kwasowa + metal (+ wartościowość, gdy zmienna): siarczan(VI) żelaza(III).<\/li>\n<li><strong>Dysocjacja<\/strong> soli rozpuszczalnych: Al₂(SO₄)₃ → 2 Al³⁺ + 3 SO₄²⁻.<\/li>\n<li><strong>Tabela rozpuszczalności<\/strong>: R — rozpuszczalna, T — trudno, N — nierozpuszczalna (wytrąca się jako osad).<\/li>\n<li><strong>Otrzymywanie<\/strong>: metal + kwas · tlenek metalu + kwas · wodorotlenek + kwas · metal + niemetal · tlenek metalu + tlenek niemetalu · wodorotlenek + tlenek niemetalu · sól + kwas · sól + zasada · sól + sól · metal + sól.<\/li>\n<li><strong>Reakcja strąceniowa<\/strong> zachodzi, gdy jeden z produktów jest nierozpuszczalny: Ag⁺ + Cl⁻ → AgCl↓.<\/li>\n<li><strong>Wypieranie metali<\/strong>: metal aktywniejszy wypiera mniej aktywny z roztworu soli: Zn + CuSO₄ → ZnSO₄ + Cu.<\/li>\n<li><strong>Zapis jonowy<\/strong>: cząsteczkowy → jonowy pełny → jonowy skrócony (bez jonów obserwatorów).<\/li>\n<li><strong>Ważne sole<\/strong>: NaCl, CaCO₃ (wapień, marmur, kreda), CaSO₄·2H₂O (gips), Na₂CO₃, NaHCO₃, saletry (KNO₃, NaNO₃), fosforany (nawozy, kości).<\/li>\n<li><strong>BHP<\/strong>: AgNO₃ plami i parzy skórę, sole baru i ołowiu są trujące, CaO i Ca(OH)₂ — żrące (okulary).<\/li>\n<\/ol>\n<\/section>\n<div class=\"layer-legend\">\n<div class=\"layer-row\"><span class=\"dot e8\"><\/span><span><b>E8:<\/b> definicja, wzory i nazwy, dysocjacja, tabela rozpuszczalności, otrzymywanie, strącanie i zapis jonowy, wypieranie metali, ważne sole, BHP<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot understand\"><\/span><span><b>Rozumienie:<\/b> hydraty, indeks a współczynnik, czynnik napędzający reakcji wymiany, cykl wapienny, twardość wody<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot extra\"><\/span><span><b>Ambitne (LO):<\/b> wodorosole i hydroksosole, hydroliza, iloczyn rozpuszczalności, sole w przyrodzie i w organizmie<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot contest\"><\/span><span><b>Ponad LO:<\/b> rozwijane bloki „poziom akademicki” — przycisk w nagłówku lekcji<\/span><\/div>\n<\/div>\n<div id=\"rdzen\" class=\"core-path\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to<\/div>\n<ol>\n<li><strong><a href=\"#definicja\">§1<\/a>–<a href=\"#nazewnictwo\">§3<\/a><\/strong> — czym jest sól, jak z ładunków jonów ułożyć wzór i jak go nazwać.<\/li>\n<li><strong><a href=\"#dysocjacja\">§4<\/a>–<a href=\"#rozpuszczalnosc\">§5<\/a><\/strong> — dysocjacja i tabela rozpuszczalności (R / T / N).<\/li>\n<li><strong><a href=\"#otrzymywanie\">§6<\/a><\/strong> — 10 metod otrzymywania soli.<\/li>\n<li><strong><a href=\"#stracanie\">§7<\/a>–<a href=\"#wypieranie\">§8<\/a><\/strong> — strącanie osadów, zapis jonowy, wykrywanie jonów, wypieranie metali.<\/li>\n<li><strong><a href=\"#zastosowania\">§10<\/a>–<a href=\"#bhp\">§11<\/a><\/strong> — ważne sole i bezpieczeństwo.<\/li>\n<\/ol>\n<\/div>\n<section id=\"jak-pracowac\">\n<div class=\"part-heading\"><span class=\"part-num\">0.1<\/span> Jak pracować z lekcją<\/div>\n<div class=\"card card-understand\">\n<ol>\n<li><strong>Nie czytaj biernie.<\/strong> Po każdym akapicie: „Co ja z tego zapamiętam?”.<\/li>\n<li><strong>Najpierw próbuj, potem patrz na odpowiedź.<\/strong><\/li>\n<li><strong>Powtarzaj w odstępach:<\/strong> wracaj do materiału kilka razy, z przerwami, we własnym tempie.<\/li>\n<li><strong>Mów na głos.<\/strong> Czytaj wzory: „Ca-CO-trzy”.<\/li>\n<li><strong>Rysuj.<\/strong> Krzyżowanie ładunków, strącanie, tabela rozpuszczalności.<\/li>\n<li><strong>Łap moment „aha!”.<\/strong><\/li>\n<\/ol>\n<p class=\"mini-note\"><strong>Zasada 80/20:<\/strong> wzory soli · nazewnictwo (reszta + metal) · reakcje strąceniowe · tabela rozpuszczalności.<\/p>\n<p class=\"mini-note\"><strong>Kolejność pracy w każdym zadaniu:<\/strong> diagnoza → wyjaśnienie → przykład prowadzony → samodzielna próba → sprawdzenie. Trudność rośnie: rozpoznanie → zastosowanie → przekształcenie → uzasadnienie → analiza → kontrprzykład → problem otwarty.<\/p>\n<\/div>\n<details class=\"answer\"><summary>10 zasad skutecznej nauki<\/summary>\n<ol>\n<li><strong>Najpierw próbuj, potem czytaj.<\/strong> Błąd to najlepszy nauczyciel.<\/li>\n<li><strong>Mów na głos.<\/strong> Chemia wchodzi przez usta.<\/li>\n<li><strong>Rysuj.<\/strong> Nawet brzydko.<\/li>\n<li><strong>Powtarzaj w odstępach.<\/strong> Wracaj do materiału kilka razy, z przerwami.<\/li>\n<li><strong>Mieszaj tematy.<\/strong> Przeplatanie uczy mózg wybierać strategię.<\/li>\n<li><strong>Testuj się.<\/strong> Fiszki, pytania, testy — to nie strata czasu, to nauka.<\/li>\n<li><strong>Tłumacz komuś.<\/strong> Jeśli nie umiesz wytłumaczyć, nie rozumiesz.<\/li>\n<li><strong>Łap moment „aha!”.<\/strong> To sygnał trwałego zapisu.<\/li>\n<li><strong>Śpij.<\/strong> Mózg utrwala wiedzę we śnie.<\/li>\n<li><strong>Bądź ciekawy.<\/strong> „Dlaczego?” to najlepsze pytanie w chemii.<\/li>\n<\/ol>\n<\/details>\n<\/section>\n<section id=\"cele\">\n<div class=\"part-heading\"><span class=\"part-num\">0.2<\/span> Cele lekcji i pytanie przewodnie <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Po tej lekcji potrafisz<\/span>\n<ul>\n<li>zdefiniować sól (kation metalu lub NH₄⁺ + anion reszty kwasowej) (<a href=\"#definicja\">§1<\/a>),<\/li>\n<li>ułożyć wzór soli z ładunków jonów i sprawdzić bilans ładunku (<a href=\"#wzory\">§2<\/a>),<\/li>\n<li>przejść od nazwy do wzoru i od wzoru do nazwy (<a href=\"#nazewnictwo\">§3<\/a>),<\/li>\n<li>zapisać dysocjację soli i odczytać rozpuszczalność z tabeli (<a href=\"#dysocjacja\">§4<\/a>, <a href=\"#rozpuszczalnosc\">§5<\/a>),<\/li>\n<li>zapisać otrzymywanie soli różnymi metodami (<a href=\"#otrzymywanie\">§6<\/a>),<\/li>\n<li>przewidzieć reakcję strąceniową, zapisać ją jonowo i rozpoznać osad (<a href=\"#stracanie\">§7<\/a>),<\/li>\n<li>przewidzieć wypieranie metali z szeregu aktywności (<a href=\"#wypieranie\">§8<\/a>),<\/li>\n<li>opisać hydraty, ważne sole i zasady BHP (<a href=\"#hydraty\">§9<\/a>–<a href=\"#bhp\">§11<\/a>),<\/li>\n<li>(ambitnie) rozróżnić sole obojętne, wodorosole, hydroksosole i hydraty; przewidzieć odczyn roztworu soli (<a href=\"#rodzaje\">§12<\/a>, <a href=\"#hydroliza\">§13<\/a>).<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Pytanie przewodnie<\/span>\n<p>W trzech nieopisanych probówkach są bezbarwne roztwory NaCl, Na₂SO₄ i Na₂CO₃. Masz kwas solny, roztwór BaCl₂ i roztwór AgNO₃. Jak w trzech krokach ustalić, co jest w której probówce — i dlaczego kolejność prób ma znaczenie?<\/p>\n<p class=\"mini-note\">Odpowiedź budujesz w <a href=\"#rozpuszczalnosc\">§5<\/a> (które sole są nierozpuszczalne) i <a href=\"#stracanie\">§7<\/a> (strącanie i wykrywanie jonów); sprawdzasz ją w doświadczeniu 8 (<a href=\"#doswiadczenia\">§16<\/a>) i w ćwiczeniu 8 (<a href=\"#cwiczenia\">§18<\/a>).<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Model całej lekcji<\/span>\n<p><strong>kation + anion → bilans ładunku → wzór → nazwa → rozpuszczalność → dysocjacja → możliwa reakcja → osad.<\/strong> Sól jest elektrycznie obojętnym związkiem jonowym; jej wzór wynika z bilansu ładunków jonów, a to, czy jest rozpuszczalna, trzeba sprawdzić osobno — nie wynika ono z samego wzoru ani nazwy.<\/p>\n<\/div>\n<\/section>\n<section id=\"kompas\">\n<div class=\"part-heading\"><span class=\"part-num\">0.3<\/span> Kompas — co trzeba wiedzieć wcześniej<\/div>\n<div class=\"card card-understand\">\n<ul>\n<li>wartościowości (ładunki jonów): Na I, K I, Ca II, Mg II, Al III, Fe II/III, Cu I/II, Zn II, Ag I,<\/li>\n<li><strong>W–K–S–K<\/strong> (wartościowość → krzyżuj → skróć → kontrola),<\/li>\n<li>grupy atomów: OH⁻, NO₃⁻, SO₄²⁻, CO₃²⁻, PO₄³⁻, Cl⁻, Br⁻, I⁻, S²⁻, F⁻,<\/li>\n<li>tlenki kwasowe i zasadowe; tlenek kwasowy + woda → kwas; tlenek kwasowy + zasada → sól + woda (N01),<\/li>\n<li>zobojętnianie: kwas + wodorotlenek → sól + woda; wzory i rozpuszczalność wodorotlenków (N02),<\/li>\n<li>kwasy: wzory, reszty kwasowe, dysocjacja; reakcje kwasów z metalami, tlenkami, wodorotlenkami i solami (N03).<\/li>\n<\/ul>\n<p class=\"mini-note\">Jon, wartościowość, W–K–S–K i bilans — fundamenty F02, F05–F09; tlenki — N01; wodorotlenki — N02; kwasy i szereg aktywności — N03. Jon z F02 wraca tutaj jako rzeczywisty składnik sieci jonowej i roztworu.<\/p>\n<\/div>\n<\/section>\n<section id=\"wyklad\">\n<div class=\"part-heading\"><span class=\"part-num\">0.4<\/span> Wykład — sól od zera<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład — co to właściwie jest sól?<\/span>\n<p>Weź kuchenną sól, czyli chlorek sodu. Wygląda jak białe ziarenka, ale nie ma w niej „cząsteczek soli” przypominających kulki. Tworzy ją regularna sieć, w której na przemian ułożone są jony: dodatnie jony sodu Na⁺ i ujemne jony chlorkowe Cl⁻. Każdy jon przyciąga sąsiednie jony o przeciwnym ładunku — i właśnie dlatego sól jest kryształem.<\/p>\n<p>Skąd bierze się sól? Najprostsza droga to zobojętnianie: kwas solny HCl i wodorotlenek sodu NaOH reagują, a z ich połączenia powstają sól i woda. Kwas dostarcza reszty kwasowej Cl⁻, zasada dostarcza metalu Na⁺, a woda powstaje z połączenia H⁺ i OH⁻. Podobnie działają inne drogi: metal z kwasem, tlenek metalu z kwasem, a nawet sól z inną solą.<\/p>\n<p>Jak zapisać wzór? Wystarczy bilans ładunków. Jon Ca²⁺ (ładunek +2) potrzebuje dwóch jonów Cl⁻ (−1 każdy), więc powstaje CaCl₂. Jon Al³⁺ i jon SO₄²⁻ dają po krzyżowaniu Al₂(SO₄)₃. Suma ładunków w całym wzorze zawsze wynosi zero.<\/p>\n<p>Jak nazwać? Najpierw reszta kwasowa, potem metal: chlorek wapnia, siarczan(VI) glinu. Cyfra rzymska w nawiasie pojawia się tylko przy metalu o zmiennej wartościowości.<\/p>\n<p>Czy sól się rozpuści? Tego nie widać we wzorze. Trzeba sprawdzić tabelę rozpuszczalności: azotany oraz sole sodu, potasu i amonu zwykle się rozpuszczają, a CaCO₃ (wapień) — nie. Ta wiedza jest kluczowa, bo to rozpuszczalność decyduje, czy w reakcji powstanie osad.<\/p>\n<p>Najczęstsza pułapka: nie każda sól jest „obojętna”. Roztwór sody (Na₂CO₃) jest zasadowy, bo jon węglanowy reaguje z wodą — to hydroliza, którą zobaczysz w §13.<\/p>\n<p>Pamiętaj: sól to nie mieszanina kwasu i zasady, tylko nowy związek z własną siecią jonów. Znając ładunki, zbudujesz wzór; znając tabelę, przewidzisz osad.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — trzy pytania przy każdej soli<\/span>\n<ol>\n<li>Jakie jony tworzą sól (kation metalu lub amonu, anion reszty kwasowej)?<\/li>\n<li>Czy sól jest rozpuszczalna — zajrzyj do tabeli rozpuszczalności?<\/li>\n<li>Czy w reakcji wytrąca się osad? Jeśli tak, zapisz równanie jonowe i wykreśl jony widzów.<\/li>\n<\/ol>\n<\/div>\n<\/section>\n<section id=\"definicja\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Budowa i definicja soli <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Definicja<\/span>\n<p><strong>Sól<\/strong> — związek chemiczny zbudowany z <strong>kationów metalu<\/strong> (lub kationu amonu NH₄⁺) i <strong>anionów reszty kwasowej<\/strong>.<\/p>\n<div class=\"formula-lg\">M<sub>n<\/sub>R<sub>m<\/sub>  (n · ładunek kationu = m · |ładunek anionu|)<\/div>\n<p>W stanie stałym sól tworzy <strong>kryształ jonowy<\/strong>: jony ułożone regularnie, przyciągane siłami elektrostatycznymi. Stąd wysokie temperatury topnienia (NaCl — 801 °C), kruchość i przewodzenie prądu w stopie i w roztworze.<\/p>\n<p class=\"mini-note\">Przykłady: NaCl (Na⁺ i Cl⁻), Na₂SO₄ (Na⁺ i SO₄²⁻), NH₄NO₃ (NH₄⁺ i NO₃⁻). Sól jako całość jest elektrycznie obojętna.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Skąd biorą się sole?<\/span>\n<p>Sól powstaje, gdy H z kwasu zostaje „zastąpiony” metalem: HCl → NaCl, H₂SO₄ → Na₂SO₄ (sól obojętna) lub NaHSO₄ (sól <strong>wodorowa<\/strong> — zastąpiono tylko część H). Z drugiej strony grupy OH z wodorotlenku zastępuje reszta kwasowa.<\/p>\n<p>Szkolny łańcuch: <strong>kwas → reszta kwasowa → sól<\/strong>, np. H₂SO₄ → SO₄²⁻ → Na₂SO₄. Rzeczywiste sposoby otrzymywania soli są jednak szersze — nie każda sól powstaje przez prostą neutralizację (<a href=\"#otrzymywanie\">§6<\/a>). N04 zbiera zależności z N01–N03, ale jest osobną lekcją: sole to produkt reakcji kwasów z wodorotlenkami, metalami i tlenkami — domknięcie chemii nieorganicznej szkoły podstawowej.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"ion-map-v02\"><button type=\"button\" data-che-open-viz=\"ion-map-v02\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'ion-map-v02',lessonId:'N05'},'*')\"><b>Mapa jonów — ładunki, pochodzenie, wykrywanie; z czym każdy jon tworzy osad<\/b><span>Dane: tabela rozpuszczalności i kwasy z silnika<\/span><\/button><\/div>\n<!-- OPIS: Mapa jonów: dla każdego jonu podany jest ładunek, pochodzenie (z jakiego kwasu lub wodorotlenku), sposób wykrywania oraz jony, z którymi tworzy osad (np. Ag⁺ z Cl⁻, Ba²⁺ z SO₄²⁻, Ca²⁺ z CO₃²⁻). Wniosek: wiedząc, które pary jonów dają osad, można przewidzieć reakcje strąceniowe i wykrywać jony. -->\n<\/section>\n<section id=\"wzory\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Wzory soli — bilans ładunku <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Reguła wzoru — krzyżowanie ładunków<\/span>\n<ol>\n<li>Zapisz jony z ładunkami: Fe³⁺ i SO₄²⁻.<\/li>\n<li>„Skrzyżuj” wartości ładunków jako indeksy: Fe₂(SO₄)₃.<\/li>\n<li>Skróć, jeśli się da (Ca²⁺ + CO₃²⁻ → CaCO₃, nie Ca₂(CO₃)₂).<\/li>\n<li>Sprawdź: 2·(+3) + 3·(−2) = 0 ✓. Jon wieloatomowy w nawiasie, gdy jest go więcej niż jeden.<\/li>\n<\/ol>\n<p class=\"mini-note\">To ta sama procedura W–K–S–K co w F-ach: wartościowości/ładunki → krzyżowanie → skracanie → kontrola. Resztę kwasową traktuj jak <strong>klocek<\/strong> (NO₃⁻, SO₄²⁻) — nie rozbijaj jej.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Przykłady prowadzone<\/span>\n<ol>\n<li><strong>chlorek wapnia<\/strong>: Ca(II), Cl(I) → CaCl₂; kontrola: 1·II = 2·I ✓.<\/li>\n<li><strong>siarczan(VI) glinu<\/strong>: Al(III), SO₄(II) → Al₂(SO₄)₃; kontrola: 2·III = 6, 3·II = 6 ✓; nawias, bo grupa SO₄ powtarza się 3 razy.<\/li>\n<li><strong>fosforan(V) wapnia<\/strong>: Ca(II), PO₄(III) → Ca₃(PO₄)₂; kontrola: 3·II = 6, 2·III = 6 ✓.<\/li>\n<li><strong>azotan(V) ołowiu(II)<\/strong>: Pb(II), NO₃(I) → Pb(NO₃)₂; nawias, bo grupa NO₃ powtarza się 2 razy.<\/li>\n<\/ol>\n<p><strong>Nawias<\/strong> stawiamy tylko przy jonie wieloatomowym, który występuje więcej niż raz: NaCl i CaCl₂ — bez nawiasu (Cl to pojedynczy atom, nie grupa); Ca(NO₃)₂, Al₂(SO₄)₃, Al(OH)₃ — z nawiasem. Ca²⁺ + CO₃²⁻ → CaCO₃ i Na⁺ + NO₃⁻ → NaNO₃ — jeden jon wieloatomowy, więc bez nawiasu.<\/p>\n<\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Kation<\/th><th>Anion<\/th><th>Wzór<\/th><th>Nazwa<\/th><th>Tabela<\/th><\/tr><\/thead><tbody>\n<tr data-cmp=\"Na,Cl\"><td>Na⁺<\/td><td>Cl⁻<\/td><td>NaCl<\/td><td>chlorek sodu<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"Ca,Cl\"><td>Ca²⁺<\/td><td>Cl⁻<\/td><td>CaCl₂<\/td><td>chlorek wapnia<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"Al,Cl\"><td>Al³⁺<\/td><td>Cl⁻<\/td><td>AlCl₃<\/td><td>chlorek glinu<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"Na,SO4\"><td>Na⁺<\/td><td>SO₄²⁻<\/td><td>Na₂SO₄<\/td><td>siarczan(VI) sodu<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"Al,SO4\"><td>Al³⁺<\/td><td>SO₄²⁻<\/td><td>Al₂(SO₄)₃<\/td><td>siarczan(VI) glinu<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"Ca,NO3\"><td>Ca²⁺<\/td><td>NO₃⁻<\/td><td>Ca(NO₃)₂<\/td><td>azotan(V) wapnia<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"K,PO4\"><td>K⁺<\/td><td>PO₄³⁻<\/td><td>K₃PO₄<\/td><td>fosforan(V) potasu<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"Ca,PO4\"><td>Ca²⁺<\/td><td>PO₄³⁻<\/td><td>Ca₃(PO₄)₂<\/td><td>fosforan(V) wapnia<\/td><td>N<\/td><\/tr>\n<tr data-cmp=\"Fe2,Cl\"><td>Fe²⁺<\/td><td>Cl⁻<\/td><td>FeCl₂<\/td><td>chlorek żelaza(II)<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"Fe3,Cl\"><td>Fe³⁺<\/td><td>Cl⁻<\/td><td>FeCl₃<\/td><td>chlorek żelaza(III)<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"Fe3,SO4\"><td>Fe³⁺<\/td><td>SO₄²⁻<\/td><td>Fe₂(SO₄)₃<\/td><td>siarczan(VI) żelaza(III)<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"Cu,SO4\"><td>Cu²⁺<\/td><td>SO₄²⁻<\/td><td>CuSO₄<\/td><td>siarczan(VI) miedzi(II)<\/td><td>R<\/td><\/tr>\n<tr data-cmp=\"NH4,SO4\"><td>NH₄⁺<\/td><td>SO₄²⁻<\/td><td>(NH₄)₂SO₄<\/td><td>siarczan(VI) amonu<\/td><td>R<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">Wzory, nazwy i litery z tabeli rozpuszczalności generuje silnik (CHE.IONIC.compound) — audyt spójności porównuje je z lekcją.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Indeks nie jest współczynnikiem <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/span>\n<p>CaCl₂ oznacza jedną jednostkę wzoru z jednym Ca i dwoma Cl; 2 CaCl₂ — dwie jednostki wzoru. <strong>Zmiana indeksu zmienia substancję, zmiana współczynnika — ilość.<\/strong> Przy bilansowaniu równań nigdy nie poprawiamy indeksów „na czuja” — najpierw wartościowości, potem współczynniki. To jedna z najważniejszych kontroli w całym kursie.<\/p>\n<\/div>\n<\/section>\n<section id=\"nazewnictwo\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Nazwy soli <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Reguła<\/span>\n<p>Nazwa soli = <strong>nazwa reszty kwasowej<\/strong> + <strong>nazwa metalu<\/strong> (z wartościowością, gdy metal ma zmienną). W nazwie reszta kwasowa jest <strong>pierwsza<\/strong>, metal <strong>drugi<\/strong>: Na₂SO₄ — siarczan(VI) sodu (reszta kwasu H₂SO₄).<\/p>\n<\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Reszta (kwas)<\/th><th>Anion<\/th><th>Nazwa soli<\/th><th>Przykład<\/th><\/tr><\/thead><tbody><tr><td>HCl<\/td><td>Cl⁻<\/td><td>chlorek<\/td><td>NaCl — chlorek sodu<\/td><\/tr><tr><td>HBr<\/td><td>Br⁻<\/td><td>bromek<\/td><td>KBr — bromek potasu<\/td><\/tr><tr><td>HI<\/td><td>I⁻<\/td><td>jodek<\/td><td>KI — jodek potasu<\/td><\/tr><tr><td>HF<\/td><td>F⁻<\/td><td>fluorek<\/td><td>CaF₂ — fluorek wapnia<\/td><\/tr><tr><td>H₂S<\/td><td>S²⁻<\/td><td>siarczek<\/td><td>FeS — siarczek żelaza(II)<\/td><\/tr><tr><td>HNO₃<\/td><td>NO₃⁻<\/td><td>azotan(V)<\/td><td>KNO₃ — azotan(V) potasu<\/td><\/tr><tr><td>HNO₂<\/td><td>NO₂⁻<\/td><td>azotan(III)<\/td><td>NaNO₂ — azotan(III) sodu<\/td><\/tr><tr><td>H₂SO₃<\/td><td>SO₃²⁻<\/td><td>siarczan(IV)<\/td><td>Na₂SO₃ — siarczan(IV) sodu<\/td><\/tr><tr><td>H₂SO₄<\/td><td>SO₄²⁻<\/td><td>siarczan(VI)<\/td><td>CuSO₄ — siarczan(VI) miedzi(II)<\/td><\/tr><tr><td>H₂CO₃<\/td><td>CO₃²⁻<\/td><td>węglan<\/td><td>CaCO₃ — węglan wapnia<\/td><\/tr><tr><td>H₃PO₄<\/td><td>PO₄³⁻<\/td><td>fosforan(V)<\/td><td>Ca₃(PO₄)₂ — fosforan(V) wapnia<\/td><\/tr><tr><td>H₂SiO₃<\/td><td>SiO₃²⁻<\/td><td>krzemian<\/td><td>Na₂SiO₃ — krzemian sodu<\/td><\/tr><tr><td>CH₃COOH<\/td><td>CH₃COO⁻<\/td><td>octan<\/td><td>CH₃COONa — octan sodu<\/td><\/tr><tr><td>HClO<\/td><td>ClO⁻<\/td><td>chloran(I)<\/td><td>KClO — chloran(I) potasu<\/td><\/tr><tr><td>HClO₄<\/td><td>ClO₄⁻<\/td><td>chloran(VII)<\/td><td>KClO₄ — chloran(VII) potasu<\/td><\/tr><tr><td>HMnO₄<\/td><td>MnO₄⁻<\/td><td>manganian(VII)<\/td><td>KMnO₄ — manganian(VII) potasu<\/td><\/tr><tr><td>H₂CrO₄<\/td><td>CrO₄²⁻<\/td><td>chromian(VI)<\/td><td>K₂CrO₄ — chromian(VI) potasu<\/td><\/tr><tr><td>H₂Cr₂O₇<\/td><td>Cr₂O₇²⁻<\/td><td>dichromian(VI)<\/td><td>K₂Cr₂O₇ — dichromian(VI) potasu<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wartościowość metalu w nazwie<\/span>\n<p>Dla metali o zmiennej wartościowości podajemy ją cyfrą rzymską: FeCl₂ — chlorek żelaza(II), FeCl₃ — chlorek żelaza(III), CuSO₄ — siarczan(VI) miedzi(II). Dla Na, K, Mg, Ca, Ba, Al, Zn, Ag — nie podajemy.<\/p>\n<p class=\"mini-note\">Dalsze przykłady: CuCl — chlorek miedzi(I), CuCl₂ — chlorek miedzi(II), SnCl₂ — chlorek cyny(II), SnCl₄ — chlorek cyny(IV), Pb(NO₃)₂ — azotan(V) ołowiu(II), MnSO₄ — siarczan(VI) manganu(II). Ta sama zasada działa w tlenkach: Cu₂O — tlenek miedzi(I), CuO — tlenek miedzi(II). W KMnO₄ i K₂Cr₂O₇ cyfra rzymska należy do reszty kwasowej (Mn VII, Cr VI), a potasu nie opisujemy.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-reszty-v01\"><button type=\"button\" data-che-open-viz=\"kw-reszty-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-reszty-v01',lessonId:'N05'},'*')\"><b>Kwas → reszta kwasowa → sole: wzory i nazwy dla 13 metali<\/b><span>Silnik CHE · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Model kwas → reszta kwasowa → sól: kwas dysocjuje, model pokazuje ładunek reszty kwasowej (np. SO₄²⁻, NO₃⁻, PO₄³⁻), a dla 13 metali tworzy wzory i nazwy soli z informacją o rozpuszczalności. Wniosek: ładunek reszty kwasowej równa się liczbie atomów wodoru oddanych przez kwas i wyznacza wzór soli. -->\n<\/section>\n<section id=\"dysocjacja\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Dysocjacja soli <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Dysocjacja (sole rozpuszczalne)<\/span>\n<div class=\"formula-lg\">NaCl → Na⁺ + Cl⁻<\/div>\n<div class=\"formula-lg\">K₂SO₄ → 2 K⁺ + SO₄²⁻<\/div>\n<div class=\"formula-lg\">Al₂(SO₄)₃ → 2 Al³⁺ + 3 SO₄²⁻<\/div>\n<div class=\"formula-lg\">Ca(NO₃)₂ → Ca²⁺ + 2 NO₃⁻<\/div>\n<div class=\"formula-lg\">Al(NO₃)₃ → Al³⁺ + 3 NO₃⁻<\/div>\n<div class=\"formula-lg\">K₃PO₄ → 3 K⁺ + PO₄³⁻<\/div>\n<p class=\"mini-note\">Sole są mocnymi elektrolitami: to, co się rozpuściło, jest całkowicie zdysocjowane. Sól nierozpuszczalna (np. CaCO₃) praktycznie nie daje jonów w roztworze.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dlaczego roztwory soli przewodzą prąd?<\/span>\n<p>Jony istnieją już w krysztale, ale są unieruchomione w sieci. W wodzie (lub w stopie) stają się ruchliwe — dlatego roztwór i stop soli przewodzą prąd, a suchy kryształ nie. Liczba jonów w zapisie dysocjacji wynika z indeksów wzoru: 1 Al₂(SO₄)₃ daje 5 jonów.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Czy każda sól jest mocnym elektrolitem? <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\">\n<p>Szkolna reguła „sole są mocnymi elektrolitami” ma wyjątki: niektóre sole metali ciężkich istnieją w roztworze częściowo jako cząsteczki lub kompleksy, np. HgCl₂, który w roztworze występuje głównie w postaci cząsteczek.<\/p>\n<\/div><\/details>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-conductivity\"><button type=\"button\" data-che-open-viz=\"gfx-scene-conductivity\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-conductivity',lessonId:'N05'},'*')\"><b>Przewodzenie prądu: elektrolity i dysocjacja<\/b><span>Scena GFX · tester przewodnictwa<\/span><\/button><\/div>\n<!-- OPIS: Tester przewodnictwa z żarówką zanurzany w różnych cieczach: w roztworach kwasów, zasad i soli żarówka świeci (jasność zależy od liczby jonów), w wodzie destylowanej i roztworze cukru nie świeci; obok model ruchomych jonów. Wniosek: prąd w roztworze przewodzą jony powstałe w dysocjacji. -->\n<\/section>\n<section id=\"rozpuszczalnosc\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Tabela rozpuszczalności <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Jak czytać tabelę rozpuszczalności<\/span>\n<ul>\n<li><strong>R<\/strong> — rozpuszczalny (> 1 g w 100 g wody) · <strong>T<\/strong> — trudno rozpuszczalny (0,1–1 g) · <strong>N<\/strong> — nierozpuszczalny (&lt; 0,1 g) · <strong>—<\/strong> — nie istnieje w wodzie / rozkłada się.<\/li>\n<li>Zawsze rozpuszczalne: sole sodu, potasu, amonu i <strong>wszystkie azotany(V)<\/strong>.<\/li>\n<li>Chlorki — rozpuszczalne poza AgCl (N) i PbCl₂ (T). Siarczany(VI) — poza BaSO₄, PbSO₄ (N) oraz CaSO₄, Ag₂SO₄ (T).<\/li>\n<li>Węglany, fosforany(V), siarczki — w większości nierozpuszczalne (poza Na, K, NH₄).<\/li>\n<\/ul>\n<\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Grupa soli<\/th><th>Reguła szkolna<\/th><th>Wyjątki (z tabeli)<\/th><\/tr><\/thead><tbody>\n<tr><td>azotany(V) NO₃⁻<\/td><td>rozpuszczalne<\/td><td>brak<\/td><\/tr>\n<tr><td>sole Li⁺, Na⁺, K⁺ (metali alkalicznych) i NH₄⁺<\/td><td>rozpuszczalne<\/td><td>brak (w zakresie szkolnym)<\/td><\/tr>\n<tr><td>chlorki Cl⁻<\/td><td>rozpuszczalne<\/td><td><span data-sol=\"AgCl\">N<\/span> AgCl, <span data-sol=\"PbCl2\">T<\/span> PbCl₂ (oraz Hg₂Cl₂)<\/td><\/tr>\n<tr><td>bromki Br⁻, jodki I⁻<\/td><td>rozpuszczalne<\/td><td><span data-sol=\"AgBr\">N<\/span> AgBr, <span data-sol=\"AgI\">N<\/span> AgI, <span data-sol=\"PbBr2\">T<\/span> PbBr₂, <span data-sol=\"PbI2\">N<\/span> PbI₂<\/td><\/tr>\n<tr><td>siarczany(VI) SO₄²⁻<\/td><td>rozpuszczalne<\/td><td><span data-sol=\"BaSO4\">N<\/span> BaSO₄, <span data-sol=\"PbSO4\">N<\/span> PbSO₄, <span data-sol=\"CaSO4\">T<\/span> CaSO₄, <span data-sol=\"Ag2SO4\">T<\/span> Ag₂SO₄<\/td><\/tr>\n<tr><td>węglany CO₃²⁻, fosforany(V) PO₄³⁻, siarczki S²⁻<\/td><td>nierozpuszczalne<\/td><td>rozpuszczalne tylko sole metali alkalicznych i NH₄⁺: <span data-sol=\"Na2CO3\">R<\/span> Na₂CO₃, <span data-sol=\"Na3PO4\">R<\/span> Na₃PO₄, <span data-sol=\"Na2S\">R<\/span> Na₂S<\/td><\/tr>\n<tr><td>wodorotlenki OH⁻<\/td><td>nierozpuszczalne<\/td><td>NaOH, KOH, <span data-sol=\"Ba(OH)2\">R<\/span> Ba(OH)₂; <span data-sol=\"Ca(OH)2\">T<\/span> Ca(OH)₂ (słabo)<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mnemonik i ograniczenie modelu<\/span>\n<p>„Azotany i sole metali alkalicznych — zawsze się rozpuszczają.” Potem zapamiętaj wyjątki dla chlorków (Ag, Pb), siarczanów (Ba, Pb, Ca) i węglanów (rozpuszczalne tylko sole metali alkalicznych).<\/p>\n<p class=\"mini-note\"><strong>Rozpuszczalność nie wynika z nazwy ani wzoru soli<\/strong> — potrzebna jest reguła lub tabela, a zależy ona od konkretnej pary kation–anion. Tabela to model szkolny z wyjątkami (20 °C), a nie uniwersalna predykcja zachowania każdego roztworu. Litery R/T/N w tej sekcji audyt porównuje z tabelą silnika.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"tabela-rozpuszczalnosci-v01\"><button type=\"button\" data-che-open-viz=\"tabela-rozpuszczalnosci-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'tabela-rozpuszczalnosci-v01',lessonId:'N05'},'*')\"><b>Interaktywna tabela rozpuszczalności (20 °C) — każda komórka podaje wzór i nazwę soli<\/b><span>CHE.DATA.SOLUBILITY_TABLE · kliknij komórkę<\/span><\/button><\/div>\n<!-- OPIS: Tabela rozpuszczalności w temperaturze 20 °C: wiersze kationów, kolumny anionów (w tym OH⁻), komórki oznaczone jako substancja rozpuszczalna, trudno rozpuszczalna lub praktycznie nierozpuszczalna. Wniosek: z tabeli odczytuje się, który wodorotlenek lub sól wytrąci się jako osad. -->\n<\/section>\n<section id=\"otrzymywanie\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Otrzymywanie soli — 10 metod <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Mnemonik: 10 dróg do soli<\/span>\n<p>Zapamiętaj pary substratów: <strong>M+K · TM+K · W+K · M+N · TM+TN · W+TN · S+K · S+Z · S+S · M+S<\/strong> (M — metal, K — kwas, TM / TN — tlenek metalu / niemetalu, W — wodorotlenek, N — niemetal, S — sól, Z — zasada).<\/p>\n<p class=\"mini-note\">Pięć metod podstawowych (z kwasem: wodorotlenek, metal, tlenek metalu, sól; oraz sól + zasada) to minimum E8; pozostałe utrwalają rozumienie. Nie każda kombinacja reagentów daje reakcję — przy każdej metodzie podany jest warunek.<\/p>\n<\/div>\n<h3>1. Metal + kwas → sól + wodór<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"znHcl\">Zn + 2 HCl → ZnCl₂ + H₂↑<\/div>\n<div class=\"formula-lg\" data-rx=\"mgH2so4\">Mg + H₂SO₄ → MgSO₄ + H₂↑<\/div>\n<div class=\"formula-lg\" data-rx=\"alHcl\">2 Al + 6 HCl → 2 AlCl₃ + 3 H₂↑<\/div>\n<p class=\"mini-note\">Tylko metale przed wodorem w szeregu aktywności.<\/p>\n<\/div>\n<h3>2. Tlenek metalu + kwas → sól + woda<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"cuoH2so4\">CuO + H₂SO₄ → CuSO₄ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"caoHcl\">CaO + 2 HCl → CaCl₂ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"fe2o3Hcl\">Fe₂O₃ + 6 HCl → 2 FeCl₃ + 3 H₂O<\/div>\n<\/div>\n<h3>3. Wodorotlenek + kwas → sól + woda (zobojętnianie)<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"hclNaOH\">HCl + NaOH → NaCl + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"h2so4Koh\">H₂SO₄ + 2 KOH → K₂SO₄ + 2 H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"caoh2Hno3\">Ca(OH)₂ + 2 HNO₃ → Ca(NO₃)₂ + 2 H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"aloh3Hcl\">Al(OH)₃ + 3 HCl → AlCl₃ + 3 H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"h3po4Caoh2\">2 H₃PO₄ + 3 Ca(OH)₂ → Ca₃(PO₄)₂ + 6 H₂O<\/div>\n<p class=\"mini-note\">Przykład prowadzący: H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O — najpierw rozpoznajemy kation (Na⁺) i anion (SO₄²⁻) soli, potem uzgadniamy ich stosunek (2 : 1), a na końcu bilansujemy wodę. Liczba grup OH⁻ = liczba H⁺ kwasu.<\/p>\n<\/div>\n<h3>4. Metal + niemetal → sól kwasu beztlenowego<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"na2Cl2\">2 Na + Cl₂ → 2 NaCl<\/div>\n<div class=\"formula-lg\" data-rx=\"feS\">Fe + S → FeS<\/div>\n<div class=\"formula-lg\">2 Fe + 3 Cl₂ → 2 FeCl₃ (ogrzewanie)<\/div>\n<div class=\"formula-lg\">Cu + Cl₂ → CuCl₂ (ogrzewanie)<\/div>\n<p class=\"mini-note\">Silny utleniacz (Cl₂) daje żelazo(III) — FeCl₃, słabszy (S) — żelazo(II): FeS. Siarczki i chlorki to sole kwasów beztlenowych (H₂S, HCl).<\/p>\n<\/div>\n<h3>5. Tlenek metalu + tlenek niemetalu → sól kwasu tlenowego<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"caoCo2\">CaO + CO₂ → CaCO₃<\/div>\n<\/div>\n<h3>6. Wodorotlenek + tlenek niemetalu → sól + woda<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"naohCo2\">2 NaOH + CO₂ → Na₂CO₃ + H₂O<\/div>\n<div class=\"formula-lg\" data-rx=\"caoh2Co2\">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O<\/div>\n<p class=\"mini-note\">Druga reakcja to wykrywanie CO₂ wodą wapienną.<\/p>\n<\/div>\n<h3>7. Sól + kwas → nowa sól + nowy kwas<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"caco3Hcl\">CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑<\/div>\n<div class=\"formula-lg\" data-rx=\"agno3Hcl\">AgNO₃ + HCl → AgCl↓ + HNO₃<\/div>\n<div class=\"formula-lg\" data-rx=\"bacl2H2so4\">BaCl₂ + H₂SO₄ → BaSO₄↓ + 2 HCl<\/div>\n<div class=\"formula-lg\" data-rx=\"na2sHcl\">Na₂S + 2 HCl → 2 NaCl + H₂S↑<\/div>\n<p class=\"mini-note\">Zachodzi, gdy powstaje gaz, osad lub słabszy kwas.<\/p>\n<\/div>\n<h3>8. Sól + zasada → nowa sól + nowy wodorotlenek<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"cuso4Naoh\">CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄<\/div>\n<div class=\"formula-lg\" data-rx=\"fecl3Naoh\">FeCl₃ + 3 NaOH → Fe(OH)₃↓ + 3 NaCl<\/div>\n<div class=\"formula-lg\" data-rx=\"alcl3Naoh\">AlCl₃ + 3 NaOH → Al(OH)₃↓ + 3 NaCl<\/div>\n<p class=\"mini-note\">Zachodzi, gdy powstaje osad wodorotlenku.<\/p>\n<\/div>\n<h3>9. Sól + sól → dwie nowe sole<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"agno3Nacl\">AgNO₃ + NaCl → AgCl↓ + NaNO₃<\/div>\n<div class=\"formula-lg\" data-rx=\"bacl2Na2so4\">BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2 NaCl<\/div>\n<div class=\"formula-lg\" data-rx=\"pbno32Ki\">Pb(NO₃)₂ + 2 KI → PbI₂↓ + 2 KNO₃<\/div>\n<div class=\"formula-lg\" data-rx=\"cacl2Na2co3\">CaCl₂ + Na₂CO₃ → CaCO₃↓ + 2 NaCl<\/div>\n<p class=\"mini-note\">Obie sole muszą być rozpuszczalne, a jeden produkt — nie.<\/p>\n<\/div>\n<h3>10. Metal + sól → nowa sól + nowy metal (wypieranie)<\/h3>\n<div class=\"card card-basic\">\n<div class=\"formula-lg\" data-rx=\"znCuso4\">Zn + CuSO₄ → ZnSO₄ + Cu<\/div>\n<div class=\"formula-lg\" data-rx=\"feCuso4\">Fe + CuSO₄ → FeSO₄ + Cu<\/div>\n<div class=\"formula-lg\" data-rx=\"cuAgno3\">Cu + 2 AgNO₃ → Cu(NO₃)₂ + 2 Ag<\/div>\n<p class=\"mini-note\">Metal aktywniejszy (wcześniej w szeregu) wypiera mniej aktywny. Cu + ZnSO₄ — brak reakcji. Szczegóły w <a href=\"#wypieranie\">§8<\/a>.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"chain-scn\"><button type=\"button\" data-che-open-viz=\"chain-scn\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'chain-scn',lessonId:'N05'},'*')\"><b>Łańcuch przemian: pierwiastek → tlenek → kwas → sól<\/b><span>Silnik CHE · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Łańcuchy przemian przedstawione jako kolejne ogniwa: Na → Na₂O → NaOH → NaCl, S → SO₃ → H₂SO₄ → Na₂SO₄, C → CO₂ → H₂CO₃ i podobne, z równaniem każdego kroku. Wniosek: od pierwiastka przez tlenek do wodorotlenku lub kwasu i dalej do soli prowadzi ciąg typowych reakcji. -->\n<\/section>\n<section id=\"stracanie\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Reakcje strąceniowe, zapis jonowy i wykrywanie jonów <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Reguła<\/span>\n<p>Mieszamy dwa roztwory soli (lub sól i zasadę/kwas). Jeśli z jonów obecnych w roztworze może powstać związek oznaczony w tabeli jako <strong>N<\/strong> (lub T) — wytrąca się <strong>osad<\/strong>. Jony, które się nie zmieniają, to <strong>jony obserwatory<\/strong>.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Procedura reakcji wymiany — czy reakcja zajdzie? <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/span>\n<ol>\n<li>Rozpisz jony elektrolitów rozpuszczalnych.<\/li>\n<li>Zamień partnerów.<\/li>\n<li>Zbuduj potencjalne produkty z poprawnych ładunków.<\/li>\n<li>Sprawdź rozpuszczalność (tabela).<\/li>\n<li>Sprawdź, czy powstaje osad, gaz lub słaby elektrolit (np. woda).<\/li>\n<li>Jeśli nie ma czynnika napędzającego, rozważ brak reakcji netto.<\/li>\n<li>Zbilansuj.<\/li>\n<\/ol>\n<p class=\"mini-note\">Formalna możliwość wymiany jonów nie oznacza automatycznie reakcji: potrzebny jest <strong>czynnik napędzający<\/strong> — osad, gaz albo słaby elektrolit / woda. Najpierw przewidujemy produkty, potem korzystamy z tabeli rozpuszczalności, a dopiero na końcu zapisujemy pełne równanie.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Trzy poziomy zapisu — AgNO₃ + NaCl<\/span>\n<div class=\"formula-lg\" data-rx=\"agno3Nacl\">AgNO₃ + NaCl → AgCl↓ + NaNO₃<\/div>\n<div class=\"formula-lg\">Ag⁺ + NO₃⁻ + Na⁺ + Cl⁻ → AgCl↓ + Na⁺ + NO₃⁻<\/div>\n<div class=\"formula-lg\">Ag⁺ + Cl⁻ → AgCl↓<\/div>\n<p class=\"mini-note\">Na⁺ i NO₃⁻ — jony obserwatory.<\/p>\n<p class=\"mini-note\">Z oznaczeniem stanów: AgNO₃(aq) + NaCl(aq) → AgCl(s)↓ + NaNO₃(aq); rdzeń jonowy Ag⁺(aq) + Cl⁻(aq) → AgCl(s). Powstanie trudno rozpuszczalnego osadu jest czynnikiem napędzającym.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Więcej przykładów zapisu skróconego<\/span>\n<div class=\"formula-lg\">BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2 NaCl  |  Ba²⁺ + SO₄²⁻ → BaSO₄↓<\/div>\n<div class=\"formula-lg\">Pb(NO₃)₂ + 2 KI → PbI₂↓ + 2 KNO₃  |  Pb²⁺ + 2 I⁻ → PbI₂↓<\/div>\n<div class=\"formula-lg\">CaCl₂ + Na₂CO₃ → CaCO₃↓ + 2 NaCl  |  Ca²⁺ + CO₃²⁻ → CaCO₃↓<\/div>\n<div class=\"formula-lg\">FeCl₂ + 2 NaOH → Fe(OH)₂↓ + 2 NaCl  |  Fe²⁺ + 2 OH⁻ → Fe(OH)₂↓<\/div>\n<p class=\"mini-note\">Jony obserwatory (widzowie) w tych reakcjach: Na⁺, K⁺, Cl⁻, NO₃⁻.<\/p>\n<\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Wykrywany jon<\/th><th>Odczynnik<\/th><th>Obserwacja<\/th><th>Równanie skrócone<\/th><\/tr><\/thead><tbody><tr><td>Cl⁻<\/td><td>AgNO₃<\/td><td>biały, serowaty osad (ciemnieje na świetle)<\/td><td>Ag⁺ + Cl⁻ → AgCl↓<\/td><\/tr><tr><td>SO₄²⁻<\/td><td>BaCl₂<\/td><td>biały osad, nie roztwarza się w kwasach<\/td><td>Ba²⁺ + SO₄²⁻ → BaSO₄↓<\/td><\/tr><tr><td>CO₃²⁻<\/td><td>HCl<\/td><td>musowanie, gaz mętni wodę wapienną<\/td><td>CO₃²⁻ + 2 H⁺ → H₂O + CO₂↑<\/td><\/tr><tr><td>Cu²⁺<\/td><td>NaOH<\/td><td>niebieski galaretowaty osad<\/td><td>Cu²⁺ + 2 OH⁻ → Cu(OH)₂↓<\/td><\/tr><tr><td>Fe³⁺<\/td><td>NaOH<\/td><td>rdzawobrunatny osad<\/td><td>Fe³⁺ + 3 OH⁻ → Fe(OH)₃↓<\/td><\/tr><tr><td>I⁻<\/td><td>Pb(NO₃)₂<\/td><td>żółty osad PbI₂<\/td><td>Pb²⁺ + 2 I⁻ → PbI₂↓<\/td><\/tr><tr><td>Ca²⁺<\/td><td>Na₂CO₃<\/td><td>biały osad, musuje z kwasem<\/td><td>Ca²⁺ + CO₃²⁻ → CaCO₃↓<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Ograniczenie: osad to jeszcze nie dowód<\/span>\n<p>Samo powstanie osadu nie zawsze jednoznacznie identyfikuje jon — potrzebny jest zestaw rozróżniających prób. Przykład: z BaCl₂ biały osad dają i SO₄²⁻ (BaSO₄), i CO₃²⁻ (BaCO₃). Rozstrzyga kwas: BaCO₃ roztwarza się z musowaniem, BaSO₄ — nie. Dlatego przy wykrywaniu ważna jest kolejność prób (pytanie przewodnie, doświadczenie 8).<\/p>\n<\/div>\n<h3>Barwy osadów (do zapamiętania)<\/h3>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Osad<\/th><th>Barwa / wygląd (silnik CHE.COLORS)<\/th><\/tr><\/thead><tbody>\n<tr data-ppt=\"ppt-agcl\"><td>AgCl<\/td><td>biały, serowaty<\/td><\/tr>\n<tr data-ppt=\"ppt-agbr\"><td>AgBr<\/td><td>kremowy<\/td><\/tr>\n<tr data-ppt=\"ppt-agi\"><td>AgI<\/td><td>żółty<\/td><\/tr>\n<tr data-ppt=\"ppt-baso4\"><td>BaSO₄<\/td><td>biały<\/td><\/tr>\n<tr data-ppt=\"ppt-caco3\"><td>CaCO₃<\/td><td>biały<\/td><\/tr>\n<tr data-ppt=\"ppt-pbcl2\"><td>PbCl₂<\/td><td>biały, krystaliczny<\/td><\/tr>\n<tr data-ppt=\"ppt-pbi2\"><td>PbI₂<\/td><td>żółty<\/td><\/tr>\n<tr data-ppt=\"ppt-cu-oh-2\"><td>Cu(OH)₂<\/td><td>galaretowaty, niebieski<\/td><\/tr>\n<tr data-ppt=\"ppt-fe-oh-3\"><td>Fe(OH)₃<\/td><td>rdzawobrunatny<\/td><\/tr>\n<tr data-ppt=\"ppt-fe-oh-2\"><td>Fe(OH)₂<\/td><td>zielonkawy, szybko brunatnieje<\/td><\/tr>\n<tr data-ppt=\"ppt-al-oh-3\"><td>Al(OH)₃<\/td><td>biały, galaretowaty<\/td><\/tr>\n<tr data-ppt=\"ppt-mg-oh-2\"><td>Mg(OH)₂<\/td><td>biały<\/td><\/tr>\n<tr data-ppt=\"ppt-zns\"><td>ZnS<\/td><td>biały<\/td><\/tr>\n<tr data-ppt=\"ppt-cus\"><td>CuS<\/td><td>czarny<\/td><\/tr>\n<tr data-ppt=\"ppt-pbs\"><td>PbS<\/td><td>czarny<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"rownania-jonowe-v01\"><button type=\"button\" data-che-open-viz=\"rownania-jonowe-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'rownania-jonowe-v01',lessonId:'N05'},'*')\"><b>Równania jonowe dla tych reakcji (generowane przez silnik) — strącanie, wypieranie, zobojętnianie<\/b><span>cząsteczkowe → jonowe pełne → skrócone<\/span><\/button><\/div>\n<!-- OPIS: Zestaw równań reakcji strącania wodorotlenków i zobojętniania w trzech zapisach: cząsteczkowym, jonowym pełnym i jonowym skróconym, z wyróżnieniem jonów, które nie biorą udziału w reakcji. Wniosek: zapis jonowy skrócony pokazuje tylko jony, które naprawdę reagują. -->\n<\/section>\n<section id=\"wypieranie\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Wypieranie metali — szereg aktywności <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Reguła<\/span>\n<p>Metal stojący w szeregu aktywności <strong>wcześniej<\/strong> (aktywniejszy) wypiera z roztworu soli metal stojący <strong>dalej<\/strong>:<\/p>\n<p>K > Ca > Na > Mg > Al > Zn > Fe > Sn > Pb > (H) > Cu > Ag > Au<\/p>\n<div class=\"formula-lg\" data-rx=\"feCuso4\">Fe + CuSO₄ → FeSO₄ + Cu<\/div>\n<div class=\"formula-lg\">jonowo: Fe + Cu²⁺ → Fe²⁺ + Cu<\/div>\n<p>To reakcja <strong>redoks<\/strong>: Fe oddaje elektrony (utlenia się), Cu²⁺ je przyjmuje (redukuje się).<\/p>\n<p class=\"mini-note\">Cu + FeSO₄ — brak reakcji (Cu stoi za Fe). Metale K, Ca, Na reagują najpierw z wodą — do wypierania się nie nadają.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-szereg-metali-v01\"><button type=\"button\" data-che-open-viz=\"kw-szereg-metali-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-szereg-metali-v01',lessonId:'N05'},'*')\"><b>Szereg aktywności: metale w kwasie solnym<\/b><span>Silnik CHE · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Cztery probówki z kwasem solnym i metalami Mg, Zn, Fe, Cu obok siebie: magnez reaguje najgwałtowniej, cynk wyraźnie, żelazo powoli, miedź wcale (brak pęcherzyków). Wniosek: z kwasów wodór wypierają tylko metale aktywniejsze od wodoru — szereg aktywności Mg > Zn > Fe > (H) > Cu. -->\n<\/section>\n<section id=\"hydraty\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Hydraty <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Woda w krysztale<\/span>\n<p><strong>Hydraty<\/strong> — sole zawierające cząsteczki wody w sieci krystalicznej (woda krystalizacyjna) w stałym stosunku. Zapis CuSO₄·5H₂O oznacza 5 cząsteczek wody na jedną jednostkę CuSO₄. <strong>Kropka nie jest znakiem mnożenia<\/strong> dwóch niezależnych substancji w roztworze — opisuje skład jednego kryształu.<\/p>\n<div class=\"formula-lg\" data-rx=\"cuso4Hydrate\">CuSO₄ + 5 H₂O → CuSO₄·5H₂O<\/div>\n<p class=\"mini-note\">Nazwy: CuSO₄·5H₂O — pentahydrat siarczanu(VI) miedzi(II) (nazwa z liczbą cząsteczek wody).<\/p>\n<\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Wzór<\/th><th>Nazwa<\/th><th>Barwa<\/th><th>Zastosowanie<\/th><\/tr><\/thead><tbody>\n<tr><td>CuSO₄·5H₂O<\/td><td>pentahydrat siarczanu(VI) miedzi(II) — siny kamień<\/td><td>niebieski<\/td><td>środek grzybobójczy<\/td><\/tr>\n<tr><td>CuSO₄<\/td><td>siarczan(VI) miedzi(II) bezwodny<\/td><td>biały (prawie)<\/td><td>wykrywanie wody (białe → niebieskie)<\/td><\/tr>\n<tr><td>Na₂CO₃·10H₂O<\/td><td>dekahydrat węglanu sodu (soda krystaliczna)<\/td><td>biały<\/td><td>pranie, zmiękczanie wody<\/td><\/tr>\n<tr><td>CaSO₄·2H₂O<\/td><td>dihydrat siarczanu(VI) wapnia — gips<\/td><td>biały<\/td><td>budownictwo, opatrunki gipsowe<\/td><\/tr>\n<tr><td>MgSO₄·7H₂O<\/td><td>heptahydrat siarczanu(VI) magnezu — sól gorzka<\/td><td>biały<\/td><td>kąpiele lecznicze, medycyna<\/td><\/tr>\n<tr><td>FeSO₄·7H₂O<\/td><td>heptahydrat siarczanu(VI) żelaza(II)<\/td><td>zielony<\/td><td>nawóz, preparaty żelaza<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">Dlaczego barwa się zmienia? W CuSO₄·5H₂O cząsteczki wody otaczają jon Cu²⁺ i to one nadają mu niebieską barwę; bezwodny CuSO₄ jest prawie biały. Gips: hydrat, który twardnieje, ponownie wiążąc wodę.<\/p>\n<\/section>\n<section id=\"zastosowania\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Ważne sole — właściwości i zastosowania <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Sól<\/th><th>Nazwy zwyczajowe<\/th><th>Zastosowanie / występowanie<\/th><\/tr><\/thead><tbody><tr><td>NaCl<\/td><td>sól kamienna, halit<\/td><td>przyprawa, konserwowanie, sól drogowa, produkcja Cl₂ i NaOH, sól fizjologiczna 0,9%<\/td><\/tr><tr><td>CaCO₃<\/td><td>wapień, marmur, kreda<\/td><td>budownictwo, produkcja wapna, nawozy, pasta do zębów<\/td><\/tr><tr><td>CaSO₄·2H₂O<\/td><td>gips<\/td><td>budownictwo, opatrunki gipsowe, sztukateria<\/td><\/tr><tr><td>Na₂CO₃<\/td><td>soda<\/td><td>szkło, mydło, zmiękczanie wody<\/td><\/tr><tr><td>NaHCO₃<\/td><td>soda oczyszczona<\/td><td>proszek do pieczenia, leki zobojętniające<\/td><\/tr><tr><td>KNO₃, NaNO₃<\/td><td>saletra indyjska, chilijska<\/td><td>nawozy azotowe, proch czarny, konserwant<\/td><\/tr><tr><td>NH₄NO₃<\/td><td>saletra amonowa<\/td><td>nawóz azotowy<\/td><\/tr><tr><td>Ca(H₂PO₄)₂ + CaSO₄<\/td><td>superfosfat<\/td><td>nawóz fosforowy<\/td><\/tr><tr><td>Ca₃(PO₄)₂<\/td><td>fosforyt (składnik kości)<\/td><td>nawozy fosforowe; kości i zęby (hydroksyapatyt)<\/td><\/tr><tr><td>CuSO₄·5H₂O<\/td><td>siny kamień<\/td><td>środek grzybobójczy; bezwodny — wykrywa wodę<\/td><\/tr><tr><td>AgNO₃<\/td><td>lapis<\/td><td>przyżeganie brodawek, analiza chlorków<\/td><\/tr><tr><td>BaSO₄<\/td><td>baryt<\/td><td>kontrast w badaniach RTG przewodu pokarmowego<\/td><\/tr><tr><td>MgSO₄·7H₂O<\/td><td>sól gorzka<\/td><td>kąpiele lecznicze, medycyna<\/td><\/tr><tr><td>FeSO₄<\/td><td>—<\/td><td>nawóz, preparaty żelaza przy niedokrwistości<\/td><\/tr><tr><td>KMnO₄<\/td><td>nadmanganian potasu<\/td><td>dezynfekcja, utleniacz w laboratorium<\/td><\/tr><tr><td>Na₂SO₄<\/td><td>sól glauberska (hydrat)<\/td><td>produkcja szkła i detergentów<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">AgNO₃ był dawniej podstawą fotografii — służył do otrzymywania światłoczułego AgBr. Sól kuchenna to NaCl, soda oczyszczona — NaHCO₃ (także na zgagę), soda kalcynowana — Na₂CO₃ (pranie, szkło), kreda — CaCO₃ (pisanie, budownictwo), gips — CaSO₄·2H₂O (budownictwo, unieruchamianie złamań).<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Cykl wapienny (budownictwo)<\/span>\n<div class=\"formula-lg\" data-rx=\"caco3Decomp\">CaCO₃ → CaO + CO₂<\/div>\n<p class=\"mini-note\">prażenie wapienia → wapno palone<\/p>\n<div class=\"formula-lg\" data-rx=\"caoH2o\">CaO + H₂O → Ca(OH)₂<\/div>\n<p class=\"mini-note\">gaszenie wapna — silnie egzotermiczne<\/p>\n<div class=\"formula-lg\" data-rx=\"caoh2Co2Mortar\">Ca(OH)₂ + CO₂ → CaCO₃ + H₂O<\/div>\n<p class=\"mini-note\">twardnienie zaprawy wapiennej na powietrzu<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Twardość wody i kras<\/span>\n<div class=\"formula-lg\" data-rx=\"caco3Co2H2o\">CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂<\/div>\n<p class=\"mini-note\">woda z CO₂ rozpuszcza wapień — jaskinie<\/p>\n<div class=\"formula-lg\" data-rx=\"cahco32Decomp\">Ca(HCO₃)₂ → CaCO₃ + H₂O + CO₂<\/div>\n<p class=\"mini-note\">gotowanie wody twardej → kamień kotłowy; w jaskiniach stalaktyty i stalagmity<\/p>\n<p class=\"mini-note\">Twardość <strong>przemijająca<\/strong> (Ca(HCO₃)₂, Mg(HCO₃)₂) — usuwa ją gotowanie. <strong>Trwała<\/strong> (CaSO₄, MgCl₂) — zmiękcza się sodą: Ca²⁺ + CO₃²⁻ → CaCO₃↓.<\/p>\n<\/div>\n<div class=\"card card-new\">\n<span class=\"card-label\">Ciekawostki<\/span>\n<ul>\n<li>Sól konserwuje żywność — przez osmozę odwadnia komórki drobnoustrojów.<\/li>\n<li>Sól na drogach obniża temperaturę krzepnięcia wody; skutecznie działa do ok. −10 °C, nie w dowolny mróz.<\/li>\n<li>Srebro ciemnieje, bo na powierzchni tworzy się czarny Ag₂S (z H₂S w powietrzu).<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"bhp\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Bezpieczeństwo (BHP) przy pracy z solami <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Zasady<\/span>\n<ul>\n<li><strong>AgNO₃<\/strong> — żrący, plami skórę na czarno (wydziela się srebro); okulary i rękawice.<\/li>\n<li><strong>Rozpuszczalne sole baru i ołowiu<\/strong> (BaCl₂, Pb(NO₃)₂) — trujące; nie wylewać do zlewu, zbierać do pojemnika na odpady. BaSO₄ jest bezpieczny w RTG właśnie dlatego, że jest nierozpuszczalny.<\/li>\n<li><strong>CuSO₄<\/strong> — szkodliwy po połknięciu, drażniący; <strong>KMnO₄<\/strong> i saletry — utleniacze (z dala od substancji palnych).<\/li>\n<li><strong>CaO i Ca(OH)₂<\/strong> — żrące; gaszenie wapna to silnie egzotermiczna reakcja — tylko jako pokaz.<\/li>\n<li><strong>NaOH<\/strong> (odczynnik do strącania wodorotlenków) — żrący: okulary, rękawice.<\/li>\n<li>Przy odparowywaniu roztworu (krystalizacja) — okulary; nie dopuszczać do pryskania.<\/li>\n<li>Niczego nie próbujemy smakiem, pipetujemy gruszką, nigdy ustami.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"rodzaje\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Rodzaje soli — obojętne, wodorosole, hydroksosole <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">LO — sole wodorowe, hydroksosole, hydraty<\/span>\n<ul>\n<li><strong>Wodorosole<\/strong>: NaHCO₃ — wodorowęglan sodu, NaHSO₄ — wodorosiarczan(VI) sodu, NaH₂PO₄ — diwodorofosforan(V) sodu.<\/li>\n<li><strong>Hydroksosole<\/strong>: Mg(OH)Cl — chlorek wodorotlenek magnezu.<\/li>\n<li><strong>Hydraty<\/strong>: CuSO₄·5H₂O — pentahydrat siarczanu(VI) miedzi(II), CaSO₄·2H₂O — gips.<\/li>\n<\/ul>\n<\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Rodzaj<\/th><th>Budowa<\/th><th>Przykłady<\/th><\/tr><\/thead><tbody>\n<tr><td>obojętne (normalne)<\/td><td>kation metalu + anion reszty kwasowej<\/td><td>NaCl, K₂SO₄, Ca(NO₃)₂<\/td><\/tr>\n<tr><td>wodorosole (kwaśne)<\/td><td>anion zachowuje kwasowy wodór<\/td><td>NaHCO₃, NaHSO₄, NaH₂PO₄<\/td><\/tr>\n<tr><td>hydroksosole (zasadowe)<\/td><td>zawierają dodatkowo grupy OH⁻<\/td><td>Mg(OH)Cl, Ca(OH)Cl — chlorek wodorotlenek wapnia<\/td><\/tr>\n<tr><td>uwodnione (hydraty)<\/td><td>woda krystalizacyjna w sieci (<a href=\"#hydraty\">§9<\/a>)<\/td><td>CuSO₄·5H₂O, Na₂CO₃·10H₂O, CaSO₄·2H₂O<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\"><strong>Uwaga na nazwy:<\/strong> „sól kwaśna” mówi o budowie (kwasowy wodór w anionie), a nie o odczynie. Roztwór NaHCO₃ ma odczyn słabo zasadowy (pH ok. 8,3), a NaHSO₄ — kwasowy. Odczyn wynika z rzeczywistej równowagi kwasowo-zasadowej (<a href=\"#hydroliza\">§13<\/a>). Systematyka soli zasadowych jest złożona i zależy od kontekstu.<\/p>\n<\/section>\n<section id=\"hydroliza\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Odczyn roztworów soli — hydroliza <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Kiedy roztwór soli nie jest obojętny?<\/span>\n<p>Jon pochodzący od <strong>słabego<\/strong> kwasu lub <strong>słabej<\/strong> zasady reaguje z wodą (<strong>hydroliza<\/strong>):<\/p>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Sól<\/th><th>Pochodzi od<\/th><th>Odczyn<\/th><th>Równanie hydrolizy<\/th><\/tr><\/thead><tbody><tr data-salt=\"NaCl\"><td>NaCl, K₂SO₄<\/td><td>mocny kwas + mocna zasada<\/td><td>obojętny<\/td><td>brak hydrolizy<\/td><\/tr><tr data-salt=\"Na2CO3\"><td>Na₂CO₃<\/td><td>słaby kwas + mocna zasada<\/td><td>zasadowy<\/td><td>CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻<\/td><\/tr><tr data-salt=\"CH3COONa\"><td>CH₃COONa<\/td><td>słaby kwas + mocna zasada<\/td><td>zasadowy<\/td><td>CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻<\/td><\/tr><tr data-salt=\"NH4Cl\"><td>NH₄Cl<\/td><td>mocny kwas + słaba zasada<\/td><td>kwasowy<\/td><td>NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺<\/td><\/tr><tr data-salt=\"CuSO4\"><td>CuSO₄<\/td><td>mocny kwas + słaba zasada<\/td><td>kwasowy<\/td><td>Cu²⁺ + 2 H₂O ⇌ CuOH⁺ + H₃O⁺<\/td><\/tr><tr data-salt=\"CH3COONH4\"><td>CH₃COONH₄<\/td><td>słaby kwas + słaba zasada<\/td><td>zależy od mocy kwasu i zasady<\/td><td>hydrolizują oba jony<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">Dlatego roztwór sody barwi fenoloftaleinę na malinowo, a roztwór CuSO₄ czerwieni papierek uniwersalny.<\/p>\n<p class=\"mini-note\">Hydroliza obustronna: w CH₃COONH₄ moc kwasu octowego i amoniaku jest podobna, więc pH ≈ 7. Odczyn i równania w tabeli audyt porównuje z silnikiem (CHE.IONIC.saltReaction).<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Sól nie oznacza automatycznie odczynu obojętnego<\/span>\n<p>Nie należy używać reguły „sól → obojętna”. Dla tej samej grupy soli (np. węglanów) odczyn jest zasadowy, dla soli amonowych — kwasowy. Szczegółowy model hydrolizy, stałe K<sub>a<\/sub> i K<sub>b<\/sub> oraz pH roztworów soli rozwija lekcja J07 (hydroliza soli).<\/p>\n<p class=\"mini-note\">W starszych podręcznikach spotkasz zapis NH₄⁺ + H₂O ⇌ NH₃·H₂O + H⁺ (lub z „NH₄OH”) — sens jest ten sam: powstają jony oksoniowe. W lekcji używamy zapisu z H₃O⁺, bo „NH₄OH” nie istnieje jako wyodrębniona substancja.<\/p>\n<\/div>\n<button class=\"che-prac-go\" data-k=\"hyd-na2co3\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce: odczyn roztworów soli (pracownia GFX)<\/button>\n<!-- OPIS: Roztwór węglanu sodu z wskaźnikiem: wskaźnik pokazuje odczyn zasadowy (fenoloftaleina barwi się na malinowo). Wniosek: roztwory niektórych soli nie mają odczynu obojętnego — sól mocnej zasady i słabego kwasu daje odczyn zasadowy. -->\n<details class=\"adv\"><summary>Hydroliza ilościowo <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\">\n<p>Dla anionu słabego kwasu: K<sub>b<\/sub> = K<sub>w<\/sub>/K<sub>a<\/sub>. Np. CH₃COO⁻: K<sub>b<\/sub> = 10⁻¹⁴ / 1,75·10⁻⁵ ≈ 5,7·10⁻¹⁰; dla 0,1 mol/dm³ CH₃COONa [OH⁻] ≈ √(K<sub>b<\/sub>·c) ≈ 7,6·10⁻⁶ → pOH ≈ 5,1, pH ≈ 8,9. Dla CO₃²⁻ (K<sub>a2<\/sub> H₂CO₃ = 4,68·10⁻¹¹) K<sub>b<\/sub> ≈ 2,1·10⁻⁴ → 0,1 M Na₂CO₃ ma pH ≈ 11,7. Kationy metali hydrolizują jako akwakompleksy: [Fe(H₂O)₆]³⁺ ⇌ [Fe(OH)(H₂O)₅]²⁺ + H⁺ (pK<sub>a<\/sub> ≈ 2,2).<\/p>\n<\/div><\/details>\n<\/section>\n<section id=\"iloczyn\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Iloczyn rozpuszczalności <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">K<sub>sp<\/sub> — liczba zamiast litery z tabeli<\/span>\n<p><strong>Iloczyn rozpuszczalności K<sub>sp<\/sub><\/strong> — iloczyn stężeń jonów w roztworze nasyconym (w danej temperaturze, z potęgami równymi współczynnikom). Dla AgCl: K<sub>sp<\/sub> = [Ag⁺][Cl⁻] ≈ 1,8·10⁻¹⁰. Osad wytrąca się, gdy iloczyn stężeń jonów po zmieszaniu roztworów przekroczy K<sub>sp<\/sub>.<\/p>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Osad<\/th><th>K<sub>sp<\/sub> (25 °C)<\/th><\/tr><\/thead><tbody><tr><td>AgCl<\/td><td>1,8·10⁻¹⁰<\/td><\/tr><tr><td>BaSO₄<\/td><td>1,1·10⁻¹⁰<\/td><\/tr><tr><td>CaCO₃ (kalcyt)<\/td><td>3,4·10⁻⁹ (w starszych tablicach 4,8·10⁻⁹)<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">„Im mniejsze K<sub>sp<\/sub>, tym trudniej rozpuszczalny związek” — to porównanie jest poprawne tylko dla soli tego samego typu (np. AB z AB). Dla soli o innej stechiometrii (AB₂, A₃B₂) trzeba obliczyć rozpuszczalność molową. Szerzej: lekcje działu J (równowagi jonowe).<\/p>\n<\/div>\n<details class=\"adv\"><summary>Iloczyn rozpuszczalności i efekt wspólnego jonu <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\">\n<p>Dla osadu MₐXᵦ: K<sub>sp<\/sub> = [M]ᵃ[X]ᵇ (np. AgCl: K<sub>sp<\/sub> = 1,77·10⁻¹⁰ → rozpuszczalność s = √K<sub>sp<\/sub> ≈ 1,33·10⁻⁵ mol/dm³). Osad wytrąca się, gdy iloczyn stężeń jonów przekroczy K<sub>sp<\/sub>. Dodatek wspólnego jonu (np. NaCl do roztworu nad AgCl) zmniejsza rozpuszczalność; z kolei tworzenie kompleksów zwiększa ją (AgCl rozpuszcza się w NH₃: AgCl + 2 NH₃ → [Ag(NH₃)₂]⁺ + Cl⁻).<\/p>\n<\/div><\/details>\n<\/section>\n<section id=\"przyroda\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> Sole w przyrodzie i w organizmie <span class=\"level-badge level-extra\">AMBITNE<\/span> <span class=\"bio-tag\">BIOL-CHEM<\/span><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Biologia i medycyna<\/span>\n<ul>\n<li><strong>Na⁺ i K⁺<\/strong> — potencjał spoczynkowy błony komórkowej (pompa sodowo-potasowa); nadmiar NaCl w diecie podnosi ciśnienie krwi.<\/li>\n<li><strong>Ca²⁺ i fosforany<\/strong> — kości i zęby (hydroksyapatyt Ca₁₀(PO₄)₆(OH)₂), krzepnięcie krwi, skurcz mięśni.<\/li>\n<li><strong>Kamienie nerkowe<\/strong> — najczęściej szczawian wapnia CaC₂O₄ (N).<\/li>\n<li><strong>Sól fizjologiczna<\/strong> — 0,9% NaCl, izotoniczna z osoczem.<\/li>\n<li><strong>BaSO₄<\/strong> jest kontrastem RTG, bo jest nierozpuszczalny — rozpuszczalne sole baru są trujące.<\/li>\n<li><strong>Fosforany<\/strong> w ATP i DNA; nadmiar fosforanów i azotanów z nawozów → eutrofizacja wód.<\/li>\n<li><strong>NaCl i KCl<\/strong> — elektrolity płynów ustrojowych (NaCl głównie w osoczu i płynie międzykomórkowym, K⁺ wewnątrz komórek).<\/li>\n<li><strong>CaCO₃<\/strong> — muszle, skorupy jaj, pancerzyki; w kościach dominuje hydroksyapatyt.<\/li>\n<li><strong>Żelazo<\/strong> (Fe²⁺, np. z FeSO₄ w preparatach) — składnik hemoglobiny; <strong>Mg²⁺<\/strong> — kofaktor wielu enzymów.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Sole w przyrodzie (minerały)<\/span>\n<ul>\n<li><strong>halit<\/strong> (sól kamienna) NaCl — złoża ewaporatów (Wieliczka, Kłodawa),<\/li>\n<li><strong>kalcyt<\/strong> CaCO₃ — wapień, marmur, kreda,<\/li>\n<li><strong>gips<\/strong> CaSO₄·2H₂O — skały gipsowe (Niecka Nidziańska),<\/li>\n<li><strong>dolomit<\/strong> CaMg(CO₃)₂ (zapisywany też CaCO₃·MgCO₃),<\/li>\n<li><strong>malachit<\/strong> Cu₂(OH)₂CO₃ — zielona ruda miedzi,<\/li>\n<li><strong>epsomit<\/strong> MgSO₄·7H₂O — sól gorzka jako minerał.<\/li>\n<\/ul>\n<p class=\"mini-note\">Dziedziny powiązane: geologia (skały osadowe, kras), rolnictwo (nawozy), fizjologia (elektrolity).<\/p>\n<\/div>\n<\/section>\n<section id=\"doswiadczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">16<\/span> Doświadczenia<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"sole-doswiadczenia-v01\"><button type=\"button\" data-che-open-viz=\"sole-doswiadczenia-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'sole-doswiadczenia-v01',lessonId:'N05'},'*')\"><b>Pracownia: doświadczenia z solami (GFX) — otrzymywanie soli, strącanie, wypieranie metali, cykl wapienny, hydrat, odczyn<\/b><span>Zlewki i probówki w silniku GFX · równania z CHE.REACTION i CHE.IONIC<\/span><\/button><\/div>\n<!-- OPIS: Pracownia doświadczeń z solami: otrzymywanie soli różnymi metodami, strącanie osadów, wypieranie metali z roztworów soli, cykl wapienny, odwadnianie hydratu i badanie odczynu roztworów soli — zlewki i probówki w animacji z obserwacjami i równaniami. Wniosek: sole otrzymuje się wieloma sposobami, a ich reakcje przewiduje się z rozpuszczalności i aktywności metali. -->\n<div class=\"card card-understand\">\n<span class=\"card-label\">Format doświadczenia i „obserwacja ≠ wniosek”<\/span>\n<p>Problem → hipoteza → sprzęt → przebieg → obserwacje → wniosek → równanie → BHP. Obserwacja to to, co widać: „biały osad”. Wniosek to interpretacja: „powstaje AgCl (trudno rozpuszczalny)”. Błąd: „Obserwacja: powstał AgCl” — to już wniosek.<\/p>\n<\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 1 — Otrzymywanie soli przez zobojętnianie i krystalizację<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Jak otrzymać NaCl z kwasu i zasady?<\/span><b>Hipoteza<\/b><span>Po zobojętnieniu i odparowaniu wody zostaną kryształy soli.<\/span><b>Sprzęt<\/b><span>NaOH(aq), HCl(aq), fenoloftaleina, biureta lub kroplomierz, parownica, palnik.<\/span><b>Przebieg<\/b><span>Do NaOH z fenoloftaleiną dodajemy kroplami HCl do odbarwienia; roztwór odparowujemy.<\/span><b>Obserwacja<\/b><span>Malinowa barwa znika; po odparowaniu — białe, sześcienne kryształy.<\/span><b>Wniosek<\/b><span>W reakcji zobojętniania powstała sól.<\/span><b>Równanie<\/b><span class=\"formula\">HCl + NaOH → NaCl + H₂O<\/span><b>BHP<\/b><span>Okulary; nie dopuścić do pryskania przy odparowywaniu; pipetować gruszką.<\/span><\/div><button class=\"che-prac-go\" data-k=\"hclNaOH+php\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Do malinowego roztworu NaOH z fenoloftaleiną dodaje się porcjami kwas solny: barwa słabnie i w punkcie zobojętnienia roztwór staje się bezbarwny. Wniosek: HCl + NaOH → NaCl + H₂O (H⁺ + OH⁻ → H₂O) — kwas i zasada się zobojętniają. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 2 — Strącanie wodorotlenku miedzi(II)<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy CuSO₄ reaguje z NaOH?<\/span><b>Hipoteza<\/b><span>Powstanie niebieski osad Cu(OH)₂ (N w tabeli).<\/span><b>Sprzęt<\/b><span>Probówka, CuSO₄(aq), NaOH(aq).<\/span><b>Przebieg<\/b><span>Do roztworu CuSO₄ dodajemy roztwór NaOH.<\/span><b>Obserwacja<\/b><span>Niebieski, galaretowaty osad; roztwór nad osadem odbarwia się.<\/span><b>Wniosek<\/b><span>Zaszła reakcja strąceniowa: Cu²⁺ + 2 OH⁻ → Cu(OH)₂↓.<\/span><b>Równanie<\/b><span class=\"formula\">CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄<\/span><b>BHP<\/b><span>NaOH żrący — okulary, rękawice.<\/span><\/div><button class=\"che-prac-go\" data-k=\"rx-cu-naoh\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Do niebieskiego roztworu soli miedzi(II) dodano roztwór NaOH: wytrąca się niebieski, galaretowaty osad wodorotlenku miedzi(II). Wniosek: Cu²⁺ + 2 OH⁻ → Cu(OH)₂↓ — reakcja soli z zasadą zachodzi, gdy powstaje osad. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 3 — Wykrywanie jonów chlorkowych<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy woda z kranu zawiera jony Cl⁻?<\/span><b>Hipoteza<\/b><span>Po dodaniu AgNO₃ pojawi się białe zmętnienie.<\/span><b>Sprzęt<\/b><span>Probówki, woda z kranu, woda destylowana, roztwór AgNO₃ (kilka kropel HNO₃).<\/span><b>Przebieg<\/b><span>Do obu próbek dodajemy po kilka kropel AgNO₃.<\/span><b>Obserwacja<\/b><span>Woda z kranu — białe zmętnienie; destylowana — brak zmian.<\/span><b>Wniosek<\/b><span>Woda z kranu zawiera jony chlorkowe.<\/span><b>Równanie<\/b><span class=\"formula\">Ag⁺ + Cl⁻ → AgCl↓<\/span><b>BHP<\/b><span>AgNO₃ plami skórę na czarno.<\/span><\/div><p class=\"mini-note\">Wersja klasyczna: roztwory AgNO₃ i NaCl w probówce dają biały, serowaty osad (AgNO₃ + NaCl → AgCl↓ + NaNO₃).<\/p>\n<button class=\"che-prac-go\" data-k=\"rx-ag-cl\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Do roztworu chlorku dodano roztwór azotanu(V) srebra: wytrąca się biały, serowaty osad. Wniosek: Ag⁺ + Cl⁻ → AgCl↓ — reakcja strąceniowa służy do wykrywania jonów chlorkowych. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 4 — Gwóźdź w roztworze CuSO₄<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy żelazo wypiera miedź z roztworu jej soli?<\/span><b>Hipoteza<\/b><span>Tak — Fe stoi w szeregu aktywności przed Cu.<\/span><b>Sprzęt<\/b><span>Zlewka, roztwór CuSO₄, oczyszczony gwóźdź.<\/span><b>Przebieg<\/b><span>Zanurzamy gwóźdź na kilka minut.<\/span><b>Obserwacja<\/b><span>Gwóźdź pokrywa się czerwonobrunatnym nalotem, roztwór blednie i zielenieje.<\/span><b>Wniosek<\/b><span>Fe wypiera Cu z roztworu soli (redoks).<\/span><b>Równanie<\/b><span class=\"formula\">Fe + CuSO₄ → FeSO₄ + Cu<\/span><b>BHP<\/b><span>Okulary.<\/span><\/div><button class=\"che-prac-go\" data-k=\"rx-fe-cuso4\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Żelazny gwóźdź w niebieskim roztworze siarczanu(VI) miedzi(II): na żelazie osadza się rudy nalot miedzi, a roztwór stopniowo traci niebieską barwę. Wniosek: Fe + CuSO₄ → FeSO₄ + Cu — metal aktywniejszy wypiera mniej aktywny z roztworu jego soli. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 5 — Wapno palone i gaszone (pokaz)<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Co powstaje z wapienia po prażeniu i dodaniu wody?<\/span><b>Hipoteza<\/b><span>CaO, a z wodą — zasadowy Ca(OH)₂.<\/span><b>Sprzęt<\/b><span>Kawałek wapienia, palnik, parownica, woda, fenoloftaleina.<\/span><b>Przebieg<\/b><span>Prażymy wapień, ostudzony wrzucamy do wody z fenoloftaleiną.<\/span><b>Obserwacja<\/b><span>Woda się ogrzewa, roztwór barwi się na malinowo.<\/span><b>Wniosek<\/b><span>Powstał CaO, który z wodą daje zasadę Ca(OH)₂.<\/span><b>Równanie<\/b><span class=\"formula\">CaCO₃ → CaO + CO₂;  CaO + H₂O → Ca(OH)₂<\/span><b>BHP<\/b><span>CaO żrący, wysoka temperatura — tylko pokaz.<\/span><\/div><button class=\"che-prac-go\" data-k=\"caoH2o\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Tlenek wapnia (wapno palone) zalany wodą: mieszanina silnie się ogrzewa, powstaje białe „mleko wapienne”, a wskaźnik wskazuje odczyn zasadowy. Wniosek: CaO + H₂O → Ca(OH)₂ — tlenek metalu aktywnego tworzy z wodą wodorotlenek. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 6 — Odczyn roztworów soli (LO)<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy roztwory soli są zawsze obojętne?<\/span><b>Hipoteza<\/b><span>Nie — zależy, od jakiego kwasu i zasady pochodzi sól.<\/span><b>Sprzęt<\/b><span>Papierek uniwersalny, roztwory: NaCl, Na₂CO₃, NH₄Cl, CuSO₄.<\/span><b>Przebieg<\/b><span>Badamy odczyn każdego roztworu.<\/span><b>Obserwacja<\/b><span>NaCl — zielony (obojętny), Na₂CO₃ — niebieski, NH₄Cl i CuSO₄ — czerwonawy.<\/span><b>Wniosek<\/b><span>Sole słabych kwasów — odczyn zasadowy, sole słabych zasad — kwasowy (hydroliza).<\/span><b>Równanie<\/b><span class=\"formula\">CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻;  NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺<\/span><b>BHP<\/b><span>Okulary.<\/span><\/div><button class=\"che-prac-go\" data-k=\"hyd-nh4cl\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Roztwór chlorku amonu z wskaźnikiem: wskaźnik uniwersalny pokazuje odczyn lekko kwasowy. Wniosek: sól słabej zasady i mocnego kwasu daje w roztworze odczyn kwasowy. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 7 — Otrzymywanie CuSO₄ z tlenku miedzi(II)<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy CuO reaguje z H₂SO₄?<\/span><b>Hipoteza<\/b><span>Powstanie niebieski roztwór CuSO₄.<\/span><b>Sprzęt<\/b><span>CuO (czarny proszek), rozcieńczony H₂SO₄, probówka, palnik.<\/span><b>Przebieg<\/b><span>Do probówki z odrobiną CuO dodajemy rozcieńczony H₂SO₄ i lekko ogrzewamy.<\/span><b>Obserwacja<\/b><span>Czarny proszek znika, roztwór barwi się na niebiesko; gaz się nie wydziela.<\/span><b>Wniosek<\/b><span>Tlenek metalu reaguje z kwasem — powstaje sól (jony Cu²⁺ nadają barwę) i woda.<\/span><b>Równanie<\/b><span class=\"formula\">CuO + H₂SO₄ → CuSO₄ + H₂O<\/span><b>BHP<\/b><span>H₂SO₄ żrący — okulary, rękawice; ogrzewać ostrożnie, wylotem probówki od siebie.<\/span><\/div><button class=\"che-prac-go\" data-k=\"cuoH2so4\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Czarny tlenek miedzi(II) w roztworze kwasu siarkowego(VI), lekko ogrzewanym: proszek znika, a roztwór barwi się na niebiesko. Wniosek: CuO + H₂SO₄ → CuSO₄ + H₂O — tlenek zasadowy reaguje z kwasem, tworząc sól i wodę. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 8 — Rozróżnianie NaCl, Na₂SO₄ i Na₂CO₃ (pytanie przewodnie)<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Która probówka zawiera NaCl, która Na₂SO₄, a która Na₂CO₃?<\/span><b>Hipoteza<\/b><span>Węglan zdradzi gaz z kwasem, siarczan — osad z BaCl₂, chlorek — osad z AgNO₃.<\/span><b>Sprzęt<\/b><span>Trzy probówki z próbkami każdego roztworu, HCl(aq), BaCl₂(aq), AgNO₃(aq), woda wapienna.<\/span><b>Przebieg<\/b><span>1) Do próbek dodajemy HCl; 2) do dwóch pozostałych — BaCl₂; 3) do ostatniej — AgNO₃.<\/span><b>Obserwacja<\/b><span>1) Musuje jedna próbka (gaz mętni wodę wapienną); 2) biały osad w jednej z dwóch pozostałych; 3) biały, serowaty osad w ostatniej.<\/span><b>Wniosek<\/b><span>Musuje Na₂CO₃; osad z BaCl₂ — Na₂SO₄; osad z AgNO₃ — NaCl. Węglan rozpoznajemy pierwszy, bo z BaCl₂ i AgNO₃ też daje osady (BaCO₃, Ag₂CO₃), które mylą wynik.<\/span><b>Równanie<\/b><span class=\"formula\">Na₂CO₃ + 2 HCl → 2 NaCl + H₂O + CO₂↑;  Ba²⁺ + SO₄²⁻ → BaSO₄↓;  Ag⁺ + Cl⁻ → AgCl↓<\/span><b>BHP<\/b><span>Sole baru trujące — odpady do pojemnika; AgNO₃ plami skórę.<\/span><\/div><button class=\"che-prac-go\" data-k=\"na2co3Hcl\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce: krok 1 (pracownia GFX)<\/button>\n<!-- OPIS: Do roztworu węglanu sodu dodano kwas solny: wydzielają się pęcherzyki bezbarwnego gazu. Wniosek: Na₂CO₃ + 2 HCl → 2 NaCl + H₂O + CO₂↑ — sól z kwasem reaguje, gdy powstaje gaz. -->\n<button class=\"che-prac-go\" data-k=\"bacl2Na2so4\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">krok 2<\/button>\n<!-- OPIS: Do roztworu siarczanu(VI) sodu dodano roztwór chlorku baru: wytrąca się biały, drobnokrystaliczny osad. Wniosek: Ba²⁺ + SO₄²⁻ → BaSO₄↓ — reakcja dwóch soli zachodzi, gdy powstaje osad. -->\n<button class=\"che-prac-go\" data-k=\"rx-ag-cl\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">krok 3<\/button>\n<!-- OPIS: Do roztworu chlorku dodano roztwór azotanu(V) srebra: wytrąca się biały, serowaty osad. Wniosek: Ag⁺ + Cl⁻ → AgCl↓ — reakcja strąceniowa służy do wykrywania jonów chlorkowych. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 9 — Hydrat CuSO₄: wykrywanie wody<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Jak wykryć wodę w substancji?<\/span><b>Hipoteza<\/b><span>Bezwodny CuSO₄ po kontakcie z wodą zmieni barwę na niebieską.<\/span><b>Sprzęt<\/b><span>Niebieski CuSO₄·5H₂O, parownica, palnik, kroplomierz z wodą.<\/span><b>Przebieg<\/b><span>Ogrzewamy niebieskie kryształy, aż zbieleją; po ostudzeniu dodajemy kroplę wody.<\/span><b>Obserwacja<\/b><span>Przy ogrzewaniu kryształy bieleją, wydziela się para wodna; po dodaniu wody proszek znów niebieszczeje i lekko się ogrzewa.<\/span><b>Wniosek<\/b><span>Woda krystalizacyjna jest częścią kryształu; bezwodny CuSO₄ wiąże wodę z powrotem — wskaźnik wody.<\/span><b>Równanie<\/b><span class=\"formula\">CuSO₄·5H₂O → CuSO₄ + 5 H₂O (ogrzewanie);  CuSO₄ + 5 H₂O → CuSO₄·5H₂O<\/span><b>BHP<\/b><span>Okulary; CuSO₄ szkodliwy — nie dotykać gołą ręką; gorąca parownica.<\/span><\/div><button class=\"che-prac-go\" data-k=\"cuso4Hydrate\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Niebieskie kryształy uwodnionego siarczanu(VI) miedzi(II) ogrzewane w probówce: tracą wodę (para skrapla się u wylotu) i stają się białym proszkiem; po dodaniu kropli wody znów błękitnieją. Wniosek: CuSO₄·5H₂O ⇌ CuSO₄ + 5 H₂O — hydrat zawiera wodę krystalizacyjną, a bezwodny CuSO₄ wykrywa wodę. --><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 10 — Zmiękczanie wody sodą<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Jak usunąć z wody jony Ca²⁺ (twardość trwała)?<\/span><b>Hipoteza<\/b><span>Soda strąci jony wapnia jako nierozpuszczalny CaCO₃.<\/span><b>Sprzęt<\/b><span>Roztwór CaCl₂ (model wody twardej), roztwór Na₂CO₃, probówka, lejek z sączkiem.<\/span><b>Przebieg<\/b><span>Do roztworu CaCl₂ dodajemy roztwór sody, osad odsączamy.<\/span><b>Obserwacja<\/b><span>Biały osad; przesącz jest klarowny.<\/span><b>Wniosek<\/b><span>Jony Ca²⁺ zostały usunięte jako CaCO₃ — woda zmiękczona.<\/span><b>Równanie<\/b><span class=\"formula\">CaCl₂ + Na₂CO₃ → CaCO₃↓ + 2 NaCl;  Ca²⁺ + CO₃²⁻ → CaCO₃↓<\/span><b>BHP<\/b><span>Okulary; soda drażni oczy.<\/span><\/div><button class=\"che-prac-go\" data-k=\"cacl2Na2co3\" data-prac=\"sole-doswiadczenia-v01\" type=\"button\">Zobacz w zlewce (pracownia GFX)<\/button>\n<!-- OPIS: Do roztworu chlorku wapnia dodano roztwór węglanu sodu: wytrąca się biały osad. Wniosek: Ca²⁺ + CO₃²⁻ → CaCO₃↓ — węglan wapnia jest trudno rozpuszczalny. --><\/div>\n<\/section>\n<section id=\"klinika\">\n<div class=\"part-heading\"><span class=\"part-num\">17<\/span> Klinika błędów<\/div>\n<div class=\"table-wrap\">\n<table class=\"klinika-table\"><thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><\/tr><\/thead><tbody><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">CaCl<\/td><td class=\"col-ok\" data-label=\"Poprawa\">CaCl₂<\/td><td data-label=\"Dlaczego\">Ca²⁺ i dwa Cl⁻ — suma ładunków musi wynosić 0.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Al₃(SO₄)₂<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Al₂(SO₄)₃<\/td><td data-label=\"Dlaczego\">Krzyżujemy ładunki: Al³⁺ → indeks 3 przy SO₄, SO₄²⁻ → indeks 2 przy Al.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">AlSO₄<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Al₂(SO₄)₃<\/td><td data-label=\"Dlaczego\">Al(III), SO₄(II) → 2 Al i 3 SO₄; nawias, bo 3 grupy SO₄.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">CaNO₃<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Ca(NO₃)₂<\/td><td data-label=\"Dlaczego\">Ca(II), NO₃(I); nawias, bo 2 grupy NO₃.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„chlorek sodu” = NaCl₂<\/td><td class=\"col-ok\" data-label=\"Poprawa\">NaCl<\/td><td data-label=\"Dlaczego\">Na(I), Cl(I) → stosunek 1 : 1.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„siarczan sodu” dla Na₂SO₃<\/td><td class=\"col-ok\" data-label=\"Poprawa\">siarczan(IV) sodu<\/td><td data-label=\"Dlaczego\">Na₂SO₃ to siarczan(IV) — bez podania wartościowości siarki nazwa jest niejednoznaczna.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„azotan sodu” dla NaNO₃<\/td><td class=\"col-ok\" data-label=\"Poprawa\">azotan(V) sodu<\/td><td data-label=\"Dlaczego\">Azot tworzy azotany(V) i azotany(III) — nazwa z wartościowością.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">chlorek żelaza dla FeCl₃<\/td><td class=\"col-ok\" data-label=\"Poprawa\">chlorek żelaza(III)<\/td><td data-label=\"Dlaczego\">Żelazo ma zmienną wartościowość — podajemy ją.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">FeCl₂ = chlorek żelaza(III)<\/td><td class=\"col-ok\" data-label=\"Poprawa\">chlorek żelaza(II)<\/td><td data-label=\"Dlaczego\">Dwa Cl⁻ zrównoważą tylko Fe²⁺.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">Cu + ZnSO₄ → CuSO₄ + Zn<\/td><td class=\"col-ok\" data-label=\"Poprawa\">brak reakcji<\/td><td data-label=\"Dlaczego\">Cu stoi w szeregu aktywności za Zn — nie wypiera go.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">NaCl + KNO₃ → NaNO₃ + KCl (zachodzi)<\/td><td class=\"col-ok\" data-label=\"Poprawa\">nie zachodzi — wszystkie produkty rozpuszczalne<\/td><td data-label=\"Dlaczego\">Bez osadu, gazu lub słabego elektrolitu jony tylko się mieszają.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">CuSO₄ + NaOH → CuOH + NaSO₄<\/td><td class=\"col-ok\" data-label=\"Poprawa\">CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄<\/td><td data-label=\"Dlaczego\">Wzory z wartościowości: Cu(II) → Cu(OH)₂, Na(I) → Na₂SO₄.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">AgCl → Ag⁺ + Cl⁻ (dysocjacja w wodzie)<\/td><td class=\"col-ok\" data-label=\"Poprawa\">AgCl praktycznie nie dysocjuje<\/td><td data-label=\"Dlaczego\">AgCl jest nierozpuszczalny (N) — zostaje osadem.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">jonowo: Ag⁺ + NO₃⁻ → AgNO₃<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Ag⁺ + Cl⁻ → AgCl↓<\/td><td data-label=\"Dlaczego\">Azotany są rozpuszczalne — NO₃⁻ to jon obserwator.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„wszystkie sole są rozpuszczalne”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">nie — węglany, fosforany, siarczki (poza Na, K, NH₄) są nierozpuszczalne<\/
