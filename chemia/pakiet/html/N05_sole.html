td><td data-label=\"Dlaczego\">Rozpuszczalność zależy od pary kation–anion — tabela.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„BaSO₄ rozpuszczalny, bo siarczany są rozpuszczalne”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">BaSO₄ — N<\/td><td data-label=\"Dlaczego\">Wyjątek od reguły (także PbSO₄; CaSO₄ — T).<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„roztwory soli zawsze mają pH 7”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">zależy od soli (hydroliza)<\/td><td data-label=\"Dlaczego\">Na₂CO₃ — zasadowy, NH₄Cl — kwasowy.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">wapno palone = Ca(OH)₂<\/td><td class=\"col-ok\" data-label=\"Poprawa\">wapno palone = CaO, gaszone = Ca(OH)₂<\/td><td data-label=\"Dlaczego\">CaO + H₂O → Ca(OH)₂ (gaszenie).<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">CuSO₄·5H₂O = „CuSO₄ razy 5 H₂O”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">hydrat: 5 cząsteczek wody w krysztale na jedną jednostkę CuSO₄<\/td><td data-label=\"Dlaczego\">Kropka oznacza wodę krystalizacyjną, nie mnożenie.<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<h3>Klinika 2.0 — pełne rozbiory<\/h3>\n<p class=\"mini-note\">Format: błąd → znajdź → popraw → reguła → dlaczego → zadanie podobne → zadanie z pułapką.<\/p>\n<details class=\"answer\"><summary>Przykład 1 — „CaCl”<\/summary>\n<ul>\n<li><strong>Znajdź:<\/strong> zły wzór chlorku wapnia.<\/li>\n<li><strong>Popraw:<\/strong> CaCl₂.<\/li>\n<li><strong>Reguła:<\/strong> W–K–S–K: Ca(II), Cl(I) → CaCl₂.<\/li>\n<li><strong>Dlaczego:<\/strong> Ca(II) wymaga dwóch Cl(I) dla zrównoważenia ładunków.<\/li>\n<li><strong>Zadanie podobne:<\/strong> zapisz wzór chlorku magnezu. (MgCl₂)<\/li>\n<li><strong>Z pułapką:<\/strong> zapisz wzór chlorku glinu. (AlCl₃)<\/li>\n<\/ul>\n<\/details>\n<details class=\"answer\"><summary>Przykład 2 — „AlSO₄”<\/summary>\n<ul>\n<li><strong>Znajdź:<\/strong> zły wzór siarczanu(VI) glinu.<\/li>\n<li><strong>Popraw:<\/strong> Al₂(SO₄)₃.<\/li>\n<li><strong>Reguła:<\/strong> W–K–S–K + nawias, gdy grupa powtarza się więcej niż raz.<\/li>\n<li><strong>Dlaczego:<\/strong> Al(III), SO₄(II) → 2 Al i 3 SO₄.<\/li>\n<li><strong>Zadanie podobne:<\/strong> wzór siarczanu(VI) wapnia. (CaSO₄)<\/li>\n<li><strong>Z pułapką:<\/strong> wzór azotanu(V) glinu. (Al(NO₃)₃)<\/li>\n<\/ul>\n<\/details>\n<details class=\"answer\"><summary>Przykład 3 — „Wszystkie sole są rozpuszczalne w wodzie”<\/summary>\n<ul>\n<li><strong>Znajdź:<\/strong> nieuprawnione uogólnienie.<\/li>\n<li><strong>Popraw:<\/strong> wiele soli jest nierozpuszczalnych: węglany (poza metalami alkalicznymi), fosforany, siarczki, większość wodorotlenków.<\/li>\n<li><strong>Reguła:<\/strong> tabela rozpuszczalności.<\/li>\n<li><strong>Dlaczego:<\/strong> rozpuszczalność zależy od kationu i anionu.<\/li>\n<li><strong>Zadanie podobne:<\/strong> które sole są zawsze rozpuszczalne? (azotany(V), sole Na⁺, K⁺, NH₄⁺)<\/li>\n<li><strong>Z pułapką:<\/strong> czy CaCO₃ jest rozpuszczalny? (nie — N)<\/li>\n<\/ul>\n<\/details>\n<details class=\"answer\"><summary>Przykład 4 — „CuSO₄ + NaOH → CuOH + NaSO₄”<\/summary>\n<ul>\n<li><strong>Znajdź:<\/strong> złe wzory produktów.<\/li>\n<li><strong>Popraw:<\/strong> CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄.<\/li>\n<li><strong>Reguła:<\/strong> wzory z wartościowości (Cu(II) → Cu(OH)₂; Na(I) → Na₂SO₄).<\/li>\n<li><strong>Dlaczego:<\/strong> z jonów Cu²⁺ powstaje Cu(OH)₂; CuOH (miedź(I)) w tej reakcji nie powstaje.<\/li>\n<li><strong>Zadanie podobne:<\/strong> FeCl₃ + 3 NaOH → ? (Fe(OH)₃↓ + 3 NaCl)<\/li>\n<li><strong>Z pułapką:<\/strong> AlCl₃ + 3 NaOH → ? (Al(OH)₃↓ + 3 NaCl)<\/li>\n<\/ul>\n<\/details>\n<details class=\"answer\"><summary>Przykład 5 — „BaSO₄ jest rozpuszczalny, bo siarczany są rozpuszczalne”<\/summary>\n<ul>\n<li><strong>Znajdź:<\/strong> pominięty wyjątek.<\/li>\n<li><strong>Popraw:<\/strong> BaSO₄ jest nierozpuszczalny (wyjątek od reguły).<\/li>\n<li><strong>Reguła:<\/strong> siarczany(VI) są rozpuszczalne, ale wyjątki: BaSO₄, PbSO₄, CaSO₄ (słabo).<\/li>\n<li><strong>Dlaczego:<\/strong> Ba²⁺ tworzy z SO₄²⁻ bardzo trudno rozpuszczalny związek.<\/li>\n<li><strong>Zadanie podobne:<\/strong> które siarczany są nierozpuszczalne? (BaSO₄, PbSO₄)<\/li>\n<li><strong>Z pułapką:<\/strong> czy MgSO₄ jest rozpuszczalny? (tak — R)<\/li>\n<\/ul>\n<\/details>\n<\/section>\n<section id=\"przekroj-n04\">\n<div class=\"part-heading\"><span class=\"part-num\">17.5<\/span> Zadanie z przekroju materiałów — parafraza (poziom O)<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zobojętnianie — zapis równania i produkty<\/span>\n<small>▲ podobne do: plik „Przekrój materiałów: E8 i olimpiady” (sekcja 10, przykładowe pytania z chemii dla klasy 8). Rok: nieznany. Etap: nieokreślony (konkurs kuratoryjny / Olimpus — adres niepotwierdzony). Zad. 2. Druczek: plik przekroju (wgrany 2026-10-12, poza repo). Status źródła: niepotwierdzony.<\/small>\n<p><strong>Parafraza (własne sformułowanie):<\/strong> zapisz produkty reakcji wodorotlenku sodu z kwasem solnym i uzupełnij równanie.<\/p>\n<details class=\"answer\"><summary>Pokaż rozwiązanie<\/summary>\n<p>NaOH + HCl → NaCl + H₂O. Produkty: chlorek sodu (sól) i woda. Reakcja zobojętniania.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"cwiczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">18<\/span> Ćwiczenia<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mini-check (rozgrzewka)<\/span>\n<ol>\n<li>Co to sól?<\/li>\n<li>Jak nazywamy sól NaCl?<\/li>\n<li>Co powstaje z kwasu i wodorotlenku?<\/li>\n<li>Co to reakcja strąceniowa?<\/li>\n<li>Które sole są zawsze rozpuszczalne?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>Związek z kationów metalu (lub NH₄⁺) i anionów reszty kwasowej.<\/li>\n<li>Chlorek sodu.<\/li>\n<li>Sól i woda.<\/li>\n<li>Reakcja, w której powstaje osad.<\/li>\n<li>Azotany(V) i sole metali alkalicznych (oraz NH₄⁺).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Ćwiczenie prowadzone — siarczan(VI) miedzi(II)<\/span>\n<ol>\n<li>Kation: Cu²⁺; anion: SO₄²⁻.<\/li>\n<li>Wzór: CuSO₄ (stosunek 1 : 1).<\/li>\n<li>Nazwa: siarczan(VI) miedzi(II).<\/li>\n<li>Otrzymywanie: CuO + H₂SO₄ → CuSO₄ + H₂O.<\/li>\n<li>Reakcja strąceniowa: CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄.<\/li>\n<\/ol>\n<p><strong>Spróbuj sam:<\/strong> chlorek żelaza(III).<\/p>\n<details class=\"answer\"><summary>Pokaż rozwiązanie<\/summary>\n<p>Fe³⁺ i Cl⁻ → FeCl₃; chlorek żelaza(III); Fe₂O₃ + 6 HCl → 2 FeCl₃ + 3 H₂O (lub 2 Fe + 3 Cl₂ → 2 FeCl₃); FeCl₃ + 3 NaOH → Fe(OH)₃↓ + 3 NaCl (rdzawobrunatny osad).<\/p>\n<\/details>\n<\/div>\n<h3>Poziom A — podstawa<\/h3>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Poziom A — podstawa (6 pkt)<\/span>\n<ol start=\"1\">\n<li>Napisz wzory: chlorek magnezu, siarczan(VI) glinu, azotan(V) wapnia, fosforan(V) sodu.<\/li>\n<li>Nazwij: K₂CO₃, FeCl₂, Fe₂(SO₄)₃, CuS.<\/li>\n<li>Zapisz dysocjację: Na₂SO₄, Al(NO₃)₃, K₃PO₄.<\/li>\n<li>Odczytaj z tabeli: czy rozpuszczalne są AgCl, Na₂CO₃, BaSO₄, CaCO₃?<\/li>\n<li>Jakie jony tworzą: NaCl, CaCl₂, Al₂(SO₄)₃?<\/li>\n<li>Co powstaje z: HCl + NaOH? H₂SO₄ + CuO?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"1\">\n<li>MgCl₂, Al₂(SO₄)₃, Ca(NO₃)₂, Na₃PO₄.<\/li>\n<li>węglan potasu, chlorek żelaza(II), siarczan(VI) żelaza(III), siarczek miedzi(II).<\/li>\n<li>Na₂SO₄ → 2 Na⁺ + SO₄²⁻; Al(NO₃)₃ → Al³⁺ + 3 NO₃⁻; K₃PO₄ → 3 K⁺ + PO₄³⁻.<\/li>\n<li>AgCl — <span data-sol=\"AgCl\">N<\/span>, Na₂CO₃ — <span data-sol=\"Na2CO3\">R<\/span>, BaSO₄ — <span data-sol=\"BaSO4\">N<\/span>, CaCO₃ — <span data-sol=\"CaCO3\">N<\/span>.<\/li>\n<li>Na⁺ + Cl⁻; Ca²⁺ + 2 Cl⁻; 2 Al³⁺ + 3 SO₄²⁻.<\/li>\n<li>NaCl + H₂O; CuSO₄ + H₂O.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom B — trening<\/h3>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Poziom B — trening (6 pkt)<\/span>\n<ol start=\"7\">\n<li>Zaproponuj 3 sposoby otrzymania MgCl₂ — zapisz równania.<\/li>\n<li>Uzupełnij: Zn + CuSO₄ → ? ; Cu + AgNO₃ → ? ; Cu + FeSO₄ → ?<\/li>\n<li>Zapisz cząsteczkowo i jonowo (skrócono): BaCl₂ + K₂SO₄.<\/li>\n<li>Które pary roztworów dadzą osad: (a) NaCl + AgNO₃, (b) KNO₃ + NaCl, (c) CuCl₂ + NaOH?<\/li>\n<li>Zapisz reakcje: HCl + Zn; H₂SO₄ + CaO; HNO₃ + KOH; HCl + CaCO₃.<\/li>\n<li>Nazwij: FeCl₃, CuSO₄, KMnO₄. Który osad jest niebieski, a który rdzawobrunatny?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"7\">\n<li>Mg + 2 HCl → MgCl₂ + H₂↑; MgO + 2 HCl → MgCl₂ + H₂O; Mg(OH)₂ + 2 HCl → MgCl₂ + 2 H₂O (lub Mg + Cl₂ → MgCl₂).<\/li>\n<li>ZnSO₄ + Cu; Cu(NO₃)₂ + 2 Ag; brak reakcji.<\/li>\n<li>BaCl₂ + K₂SO₄ → BaSO₄↓ + 2 KCl; Ba²⁺ + SO₄²⁻ → BaSO₄↓.<\/li>\n<li>(a) tak — AgCl; (b) nie; (c) tak — Cu(OH)₂.<\/li>\n<li>Zn + 2 HCl → ZnCl₂ + H₂↑; CaO + H₂SO₄ → CaSO₄ + H₂O (CaSO₄ — <span data-sol=\"CaSO4\">T<\/span>, może się częściowo wytrącać); HNO₃ + KOH → KNO₃ + H₂O; CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑.<\/li>\n<li>chlorek żelaza(III), siarczan(VI) miedzi(II), manganian(VII) potasu; Cu(OH)₂ — niebieski, Fe(OH)₃ — rdzawobrunatny.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom C — ambitny<\/h3>\n<details class=\"adv\"><summary>Poziom C — ambitny <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<ol start=\"13\">\n<li>Jak rozróżnić roztwory NaCl, Na₂SO₄ i Na₂CO₃, mając HCl, BaCl₂ i AgNO₃? Zaplanuj kolejność.<\/li>\n<li>Oblicz masę osadu AgCl, który powstanie z 5,85 g NaCl (nadmiar AgNO₃).<\/li>\n<li>Wyjaśnij, dlaczego woda twarda daje kamień kotłowy. Zapisz równanie.<\/li>\n<li>Podaj 3 metody otrzymywania NaCl.<\/li>\n<li>Zaprojektuj doświadczenie: strącanie Cu(OH)₂ (pełny format doświadczenia).<\/li>\n<li>Dlaczego CaCO₃ jest nierozpuszczalny, a Na₂CO₃ — rozpuszczalny?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"13\">\n<li>HCl: musuje tylko Na₂CO₃. Do pozostałych BaCl₂: biały osad — Na₂SO₄. Ostatni z AgNO₃ — biały osad AgCl — NaCl.<\/li>\n<li>n(NaCl) = 5,85 / 58,44 ≈ 0,1 mol → n(AgCl) = 0,1 mol → m = 0,1 · 143,32 ≈ 14,3 g.<\/li>\n<li>Ca(HCO₃)₂ → CaCO₃ + H₂O + CO₂ — przy ogrzewaniu wytrąca się nierozpuszczalny CaCO₃.<\/li>\n<li>HCl + NaOH → NaCl + H₂O; 2 Na + Cl₂ → 2 NaCl; Na₂CO₃ + 2 HCl → 2 NaCl + H₂O + CO₂↑.<\/li>\n<li>Jak doświadczenie 2 w <a href=\"#doswiadczenia\">§16<\/a>: problem, hipoteza (niebieski osad), sprzęt, przebieg, obserwacja, wniosek, równanie CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄, BHP (NaOH żrący).<\/li>\n<li>O rozpuszczalności decyduje bilans energii: rozpad sieci krystalicznej kosztuje energię, hydratacja jonów ją oddaje. Jony Ca²⁺ i CO₃²⁻ są dwuładunkowe — sieć jest bardzo trwała i hydratacja tego nie równoważy. W Na₂CO₃ kation jest jednododatni, sieć słabsza — sól się rozpuszcza. To model jakościowy; w praktyce korzystamy z tabeli.<\/li>\n<\/ol>\n<\/details>\n<\/div><\/details>\n<h3>Poziom D — LO rozszerzone<\/h3>\n<details class=\"adv\"><summary>Poziom D — LO rozszerzone <span class=\"adv-tag\">poziom LO<\/span><\/summary><div class=\"adv-body\">\n<ol start=\"19\">\n<li>Przewidź odczyn: K₂CO₃, NH₄NO₃, KCl, CH₃COOK. Zapisz równania hydrolizy.<\/li>\n<li>Dlaczego w zapisie jonowym reakcji CaCO₃ + 2 HCl węglan wapnia nie jest rozpisany na jony?<\/li>\n<li>Co to sole kwaśne i zasadowe? Podaj przykłady. Czy roztwór soli kwaśnej musi mieć pH &lt; 7?<\/li>\n<li>Zapisz wzór hydratu siarczanu(VI) miedzi(II) i wyjaśnij, co oznacza „·5H₂O”.<\/li>\n<li>Porównaj rozpuszczalność: NaCl, AgCl, BaSO₄, CaCO₃. Dlaczego AgCl jest nierozpuszczalny?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"19\">\n<li>K₂CO₃ — zasadowy (CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻); NH₄NO₃ — kwasowy (NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺); KCl — obojętny; CH₃COOK — zasadowy.<\/li>\n<li>CaCO₃ jest nierozpuszczalny (N) — w roztworze nie występuje jako jony: CaCO₃ + 2 H⁺ → Ca²⁺ + H₂O + CO₂↑.<\/li>\n<li>Kwaśne (wodorosole): NaHCO₃, NaHSO₄; zasadowe (hydroksosole): Ca(OH)Cl, Mg(OH)Cl. Nie — roztwór NaHCO₃ jest słabo zasadowy (<a href=\"#rodzaje\">§12<\/a>).<\/li>\n<li>CuSO₄·5H₂O — 5 cząsteczek wody w sieci krystalicznej na 1 jednostkę CuSO₄.<\/li>\n<li>NaCl — rozpuszczalny; AgCl, BaSO₄, CaCO₃ — nierozpuszczalne. AgCl ma bardzo mały iloczyn rozpuszczalności (K<sub>sp<\/sub> ≈ 1,8·10⁻¹⁰) — sieć krystaliczna jest bardzo trwała.<\/li>\n<\/ol>\n<\/details>\n<\/div><\/details>\n<h3>Przeplatanie (powtórka z N01–N03)<\/h3>\n<div class=\"card\">\n<ol start=\"24\">\n<li>Jaki charakter ma SO₃? (N01)<\/li>\n<li>Zapisz wzór kwasu siarkowego(VI). (N03)<\/li>\n<li>Zapisz wzór wodorotlenku miedzi(II). (N02)<\/li>\n<li>Zbilansuj: Al + O₂ → Al₂O₃. (F + N01)<\/li>\n<li>CuSO₄ + 2 NaOH → ?<\/li>\n<li>Ile elektronów ma jon Cu²⁺? (F02)<\/li>\n<li>SO₃ + H₂O → ? (N01 + N03)<\/li>\n<li>Fe(OH)₃ + 3 HNO₃ → ? (N02 + N03 + N04)<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"24\">\n<li>kwasowy.<\/li>\n<li>H₂SO₄.<\/li>\n<li>Cu(OH)₂.<\/li>\n<li>4 Al + 3 O₂ → 2 Al₂O₃.<\/li>\n<li>Cu(OH)₂↓ + Na₂SO₄.<\/li>\n<li>Cu ma 29 elektronów, więc Cu²⁺ — 27.<\/li>\n<li>H₂SO₄.<\/li>\n<li>Fe(NO₃)₃ + 3 H₂O.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<details class=\"answer\"><summary>Zadania extra (egzaminacyjne)<\/summary>\n<ol>\n<li>Nazwij Na₂SO₄ i napisz, z jakiego kwasu pochodzi reszta.<\/li>\n<li>NaOH + HNO₃ → ?<\/li>\n<li>AgNO₃ + NaCl → ? (osad?)<\/li>\n<li>Wzór chlorku wapnia.<\/li>\n<li>Czy KNO₃ strąca się jako osad w wodzie (model szkolny)?<\/li>\n<li>Jednym zdaniem: po co tabela rozpuszczalności?<\/li>\n<\/ol>\n<p class=\"mini-note\">Odpowiedzi: 1 siarczan(VI) sodu; H₂SO₄. 2 NaNO₃ + H₂O. 3 AgCl↓ + NaNO₃. 4 CaCl₂. 5 nie — dobrze rozpuszczalny. 6 by przewidzieć, czy powstanie osad.<\/p>\n<\/details>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Utrwalenie — sole (W1)<\/span>\n<ol>\n<li>Zapisz wzór azotanu(V) wapnia.<\/li>\n<li>Zapisz wzór węglanu sodu.<\/li>\n<li>Zapisz wzór fosforanu(V) glinu.<\/li>\n<li>Zapisz reakcję strącania chlorku srebra.<\/li>\n<li>Zapisz reakcję siarczanu(VI) miedzi(II) z wodorotlenkiem sodu.<\/li>\n<li>Dlaczego nie każda reakcja dwóch soli zachodzi?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>Ca(NO₃)₂.<\/li>\n<li>Na₂CO₃.<\/li>\n<li>AlPO₄ (Al³⁺ i PO₄³⁻ — ładunki równe, stosunek 1 : 1).<\/li>\n<li>AgNO₃ + NaCl → AgCl↓ + NaNO₃ (biały osad).<\/li>\n<li>CuSO₄ + 2 NaOH → Cu(OH)₂↓ + Na₂SO₄.<\/li>\n<li>Wymiana jonów zachodzi, gdy powstaje osad, gaz lub słaby elektrolit (np. woda); jeśli wszystkie produkty zostają rozpuszczone w roztworze, jony tylko się mieszają.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"typologia\">\n<div class=\"part-heading\"><span class=\"part-num\">19<\/span> Typologia zadań E8 <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Typ zadania<\/th><th>Jak rozpoznać<\/th><th>Strategia<\/th><th>Gdzie w lekcji<\/th><\/tr><\/thead><tbody>\n<tr><td>nazwa → wzór<\/td><td>„Napisz wzór siarczanu(VI) glinu”<\/td><td>jony z ładunkami → W–K–S–K → nawias → kontrola<\/td><td><a href=\"#wzory\">§2<\/a><\/td><\/tr>\n<tr><td>wzór → nazwa<\/td><td>„Nazwij Fe₂(SO₄)₃”<\/td><td>rozpoznaj resztę → oblicz wartościowość metalu z bilansu<\/td><td><a href=\"#nazewnictwo\">§3<\/a><\/td><\/tr>\n<tr><td>otrzymywanie<\/td><td>„Podaj 3 sposoby otrzymania MgCl₂”<\/td><td>dobierz pary substratów z mnemonika 10 dróg; sprawdź warunek<\/td><td><a href=\"#otrzymywanie\">§6<\/a><\/td><\/tr>\n<tr><td>czy reakcja zajdzie?<\/td><td>„Czy zajdzie reakcja Cu + ZnSO₄ / NaCl + KNO₃?”<\/td><td>szereg aktywności albo tabela rozpuszczalności; szukaj czynnika napędzającego<\/td><td><a href=\"#stracanie\">§7<\/a>, <a href=\"#wypieranie\">§8<\/a><\/td><\/tr>\n<tr><td>zapis jonowy<\/td><td>„Zapisz jonowo w formie skróconej”<\/td><td>rozpisz tylko rozpuszczalne elektrolity; skreśl obserwatory<\/td><td><a href=\"#stracanie\">§7<\/a><\/td><\/tr>\n<tr><td>projekt doświadczenia<\/td><td>„Zaprojektuj doświadczenie, które pozwoli rozróżnić…”<\/td><td>format: problem → hipoteza → sprzęt → przebieg → obserwacje → wniosek; kolejność prób<\/td><td><a href=\"#doswiadczenia\">§16<\/a><\/td><\/tr>\n<tr><td>obliczenia<\/td><td>„Oblicz masę osadu…”<\/td><td>masa → mole → stosunek z równania → masa produktu<\/td><td>ćw. 14 w <a href=\"#cwiczenia\">§18<\/a><\/td><\/tr>\n<tr><td>łańcuch przemian<\/td><td>„Ca → CaO → Ca(OH)₂ → CaCO₃ → CaCl₂”<\/td><td>każda strzałka = jedna metoda z §6<\/td><td><a href=\"#otrzymywanie\">§6<\/a><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Drabinka trudności<\/span>\n<ul>\n<li><strong>Odtwórz:<\/strong> co to sól?<\/li>\n<li><strong>Zastosuj:<\/strong> zapisz wzór chlorku wapnia.<\/li>\n<li><strong>Wyjaśnij:<\/strong> dlaczego Ca(NO₃)₂ ma nawias?<\/li>\n<li><strong>Odkryj:<\/strong> jaki osad powstaje z AgNO₃ + NaCl?<\/li>\n<li><strong>Połącz:<\/strong> kwas + wodorotlenek → sól (N02 + N03).<\/li>\n<li><strong>Zakwestionuj:<\/strong> czy wszystkie sole są rozpuszczalne?<\/li>\n<\/ul>\n<p class=\"mini-note\">Reguła informacji zwrotnej: najpierw wskaż etap rozwiązania, na którym wystąpił błąd; dopiero potem pokaż pełne rozwiązanie. W zadaniach obliczeniowych podawaj jednostki i etapy pośrednie.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"stech-kalkulator-v01\"><button type=\"button\" data-che-open-viz=\"stech-kalkulator-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'stech-kalkulator-v01',lessonId:'N05'},'*')\"><b>Kalkulator stechiometryczny — masa osadu, mole, odczynnik limitujący<\/b><span>Silnik CHE · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Kalkulator stechiometryczny: dla wybranej reakcji (np. spalanie, rozkład CaCO₃, CuO z H₂SO₄) wpisujesz masę lub objętość jednego reagenta, a model przelicza mole, masy i objętości gazów pozostałych substancji i wskazuje odczynnik w niedomiarze. Wniosek: ilości substancji w reakcji wynikają ze współczynników równania. -->\n<\/section>\n<section id=\"test\">\n<div class=\"part-heading\"><span class=\"part-num\">20<\/span> Test<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"1\"><h5>1. Który wzór jest poprawny?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">Al₃(SO₄)₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Al₂(SO₄)₃<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">AlSO₄<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>2. Który związek jest nierozpuszczalny?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">NaNO₃<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">BaSO₄<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">K₂CO₃<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>3. Co zajdzie po zmieszaniu NaCl i KNO₃?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">wytrąci się osad<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">nic — wszystkie sole rozpuszczalne<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">wydzieli się gaz<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>4. Który metal wyprze miedź z CuSO₄?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">Ag<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Fe<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">Au<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>5. Skrócony zapis AgNO₃ + NaCl:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">Ag⁺ + Cl⁻ → AgCl↓<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Na⁺ + NO₃⁻ → NaNO₃<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">AgNO₃ → Ag⁺ + NO₃⁻<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>6. Wapno gaszone to…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">CaO<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Ca(OH)₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">CaCO₃<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>7. Barwa osadu Fe(OH)₃:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">niebieska<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">rdzawobrunatna<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">biała<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\"><h5>8. Odczyn roztworu Na₂CO₃:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">kwasowy<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">obojętny<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">zasadowy<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>9. Jak usunąć twardość przemijającą?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">gotowaniem<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">dodając NaCl<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">filtrując<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>10. Nazwa NaHCO₃:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">węglan sodu<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">wodorowęglan sodu<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">wodorotlenek sodu<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>11. Poprawna nazwa FeCl₂:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">chlorek żelaza(III)<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">chlorek żelaza(II)<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">chlorek żelaza<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>12. Który osad jest żółty?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">AgCl<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">PbI₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">BaSO₄<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>13. Co oznacza „·5H₂O” w CuSO₄·5H₂O?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">5 cząsteczek wody krystalizacyjnej na jednostkę CuSO₄<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">mnożenie CuSO₄ przez 5 H₂O<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">roztwór 5-procentowy<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>14. Odczyn roztworu NaHCO₃ (sól kwaśna):<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">kwasowy<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">słabo zasadowy<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">zawsze obojętny<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>15. Którym odczynnikiem odróżnisz Na₂CO₃ od Na₂SO₄ najprościej?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">kwasem solnym<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">wodą<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">NaCl<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>16. Wzór azotanu(V) wapnia:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">CaNO₃<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Ca(NO₃)₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">Ca₂NO₃<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<div style=\"margin-top:18px;\" class=\"card card-understand\">\n<span class=\"card-label\">Sprawdzenie diagnostyczne (zadania otwarte)<\/span>\n<ol>\n<li>Wzory: chlorek sodu, azotan(V) potasu, siarczan(VI) wapnia, węglan sodu.<\/li>\n<li>Nazwy: NaCl, K₂SO₄, CaCO₃, Al(NO₃)₃.<\/li>\n<li>Otrzymywanie NaCl (3 metody).<\/li>\n<li>Reakcje strąceniowe: AgNO₃ + NaCl; BaCl₂ + Na₂SO₄; Pb(NO₃)₂ + KI.<\/li>\n<li>Popraw: CaCl; AlSO₄; „wszystkie sole rozpuszczalne”.<\/li>\n<li>Które sole są rozpuszczalne: NaCl, CaCO₃, BaSO₄, KNO₃?<\/li>\n<li>Jaką barwę ma osad Cu(OH)₂, a jaką Fe(OH)₃?<\/li>\n<li>(extra) Zapisz jonowo AgNO₃ + NaCl.<\/li>\n<li>(extra) Co to hydrat? Podaj przykład.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>NaCl, KNO₃, CaSO₄, Na₂CO₃.<\/li>\n<li>chlorek sodu, siarczan(VI) potasu, węglan wapnia, azotan(V) glinu.<\/li>\n<li>HCl + NaOH; 2 Na + Cl₂; Na₂CO₃ + 2 HCl.<\/li>\n<li>AgCl↓ + NaNO₃; BaSO₄↓ + 2 NaCl; PbI₂↓ + 2 KNO₃.<\/li>\n<li>CaCl₂; Al₂(SO₄)₃; nie — węglany, fosforany, siarczki są nierozpuszczalne.<\/li>\n<li>NaCl, KNO₃ — rozpuszczalne; CaCO₃, BaSO₄ — nierozpuszczalne.<\/li>\n<li>Cu(OH)₂ — niebieski; Fe(OH)₃ — rdzawobrunatny.<\/li>\n<li>Ag⁺ + Cl⁻ → AgCl↓.<\/li>\n<li>Sól z wodą krystalizacyjną, np. CuSO₄·5H₂O, CaSO₄·2H₂O.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"powtorka\">\n<div class=\"part-heading\"><span class=\"part-num\">21<\/span> Karta szybkiego powtórzenia i mapa myśli<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Karta szybkiego powtórzenia (do druku)<\/span>\n<p class=\"mini-note\">Zasada 80/20: wzory soli · nazwy (reszta + metal) · strącanie · tabela rozpuszczalności.<\/p>\n<div class=\"mnemonic\"><b>Mnemotechniki rdzeniowe<\/b><ol>\n<li>Sól = kation metalu (lub NH₄⁺) + anion reszty kwasowej.<\/li>\n<li>Nazwa: [reszta kwasowa] + [metal z wartościowością].<\/li>\n<li>Kwas + wodorotlenek → sól + woda (zobojętnianie).<\/li>\n<li>Kwas + metal → sól + H₂.<\/li>\n<li>Kwas + tlenek metalu → sól + woda.<\/li>\n<li>Sól + sól → dwie nowe sole (jeśli powstaje osad).<\/li>\n<li>Azotany i sole metali alkalicznych — zawsze rozpuszczalne.<\/li>\n<\/ol><\/div>\n<p><strong>Wzory:<\/strong> NaCl, CaCl₂, AlCl₃, K₂SO₄, Ca(NO₃)₂, Al₂(SO₄)₃, Ca₃(PO₄)₂, FeCl₂, FeCl₃, CuSO₄, KMnO₄.<\/p>\n<p><strong>Strącanie:<\/strong> AgCl↓ biały · BaSO₄↓ biały · CaCO₃↓ biały · PbI₂↓ żółty · Cu(OH)₂↓ niebieski · Fe(OH)₃↓ rdzawobrunatny.<\/p>\n<p><strong>Rozpuszczalność:<\/strong> zawsze azotany(V) i sole Li, Na, K, NH₄ · chlorki bez AgCl, PbCl₂ · siarczany bez BaSO₄, PbSO₄, CaSO₄ · węglany, fosforany, siarczki — tylko Na, K, NH₄ · wodorotlenki — NaOH, KOH, Ba(OH)₂, Ca(OH)₂ (słabo).<\/p>\n<p><strong>Hydraty:<\/strong> CuSO₄·5H₂O niebieski · CaSO₄·2H₂O gips.<\/p>\n<p><strong>Pułapki:<\/strong> CaCl → CaCl₂ · AlSO₄ → Al₂(SO₄)₃ · CaNO₃ → Ca(NO₃)₂ · „wszystkie sole rozpuszczalne” — fałsz · BaSO₄, AgCl, CaCO₃ — nierozpuszczalne · indeks ≠ współczynnik.<\/p>\n<p class=\"mini-note\">Kolejność w każdym zadaniu: rozpoznaj typ → wybierz model/regułę → wykonaj równanie lub obliczenie → sprawdź ładunek, atomy, jednostki i sens wyniku.<\/p>\n<\/div>\n<div class=\"mnemonic\"><b>Mapa myśli w pigułce<\/b><ol>\n<li><strong>SÓL<\/strong> — definicja: kation metalu (NH₄⁺) + anion reszty kwasowej; kryształ jonowy.<\/li>\n<li><strong>WZÓR<\/strong> — W–K–S–K + nawias; <strong>NAZWA<\/strong> — reszta + metal (cyfra rzymska, gdy trzeba).<\/li>\n<li><strong>OTRZYMYWANIE<\/strong> — kwas + wodorotlenek / metal / tlenek metalu / sól; sól + zasada; sól + sól; metal + niemetal; tlenki; wypieranie.<\/li>\n<li><strong>STRĄCANIE<\/strong> — tabela → osad → zapis jonowy; wykrywanie Cl⁻, SO₄²⁻, CO₃²⁻.<\/li>\n<li><strong>ROZPUSZCZALNOŚĆ<\/strong> — azotany i metale alkaliczne zawsze; wyjątki chlorków i siarczanów.<\/li>\n<li><strong>RODZAJE<\/strong> — obojętne, wodorosole, hydroksosole, hydraty; <strong>ODCZYN<\/strong> — hydroliza (LO).<\/li>\n<li><strong>ZASTOSOWANIA<\/strong> — sól kuchenna, soda, gips, wapno, nawozy; most do N05 i J.<\/li>\n<\/ol><\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Co<\/th><th>Jak powtarzać<\/th><\/tr><\/thead><tbody><tr><td>cała lekcja<\/td><td>raz na początku, potem wracaj do niej przy kolejnych podejściach do działu<\/td><\/tr><tr><td>fiszki i karta powtórzenia<\/td><td>częste, krótkie sesje<\/td><\/tr><tr><td>ćwiczenia A + B<\/td><td>po przeczytaniu wykładu i rdzenia<\/td><\/tr><tr><td>test i mapa myśli<\/td><td>gdy czujesz, że materiał siedzi<\/td><\/tr><tr><td>pułapki z kliniki<\/td><td>przed testem<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">Po każdej powtórce odpowiedz na 3 pytania: Co już umiem? Co jeszcze mylę? Co mnie zaskoczyło?<\/p>\n<\/section>\n<section id=\"fiszki\">\n<div class=\"part-heading\"><span class=\"part-num\">22<\/span> Fiszki<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Sól — budowa<\/span><span class=\"back\">kationy metalu (lub NH₄⁺) + aniony reszty kwasowej<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wzór siarczanu(VI) glinu<\/span><span class=\"back\">Al₂(SO₄)₃<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Fe₂(SO₄)₃ — nazwa<\/span><span class=\"back\">siarczan(VI) żelaza(III)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Zawsze rozpuszczalne<\/span><span class=\"back\">sole Na⁺, K⁺, NH₄⁺ i wszystkie azotany(V)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wykrywanie Cl⁻<\/span><span class=\"back\">AgNO₃ → biały osad AgCl<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wykrywanie SO₄²⁻<\/span><span class=\"back\">BaCl₂ → biały osad BaSO₄<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wykrywanie CO₃²⁻<\/span><span class=\"back\">kwas → CO₂ mętni wodę wapienną<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Cu²⁺ + 2 OH⁻<\/span><span class=\"back\">niebieski osad Cu(OH)₂<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Fe + CuSO₄<\/span><span class=\"back\">FeSO₄ + Cu (wypieranie)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Cu + ZnSO₄<\/span><span class=\"back\">brak reakcji<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wapno palone / gaszone<\/span><span class=\"back\">CaO / Ca(OH)₂<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Gips<\/span><span class=\"back\">CaSO₄·2H₂O<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Kamień kotłowy<\/span><span class=\"back\">CaCO₃ z rozkładu Ca(HCO₃)₂<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Odczyn Na₂CO₃<\/span><span class=\"back\">zasadowy (hydroliza CO₃²⁻)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Odczyn NH₄Cl<\/span><span class=\"back\">kwasowy (hydroliza NH₄⁺)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jon obserwator<\/span><span class=\"back\">nie zmienia się w reakcji<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">K₂SO₄ — nazwa<\/span><span class=\"back\">siarczan(VI) potasu<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Al(NO₃)₃ — nazwa<\/span><span class=\"back\">azotan(V) glinu<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">FeCl₂ / FeCl₃ — nazwy<\/span><span class=\"back\">chlorek żelaza(II) / chlorek żelaza(III)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">CuSO₄ — nazwa<\/span><span class=\"back\">siarczan(VI) miedzi(II)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">KMnO₄ — nazwa<\/span><span class=\"back\">manganian(VII) potasu<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">5 metod podstawowych otrzymywania soli<\/span><span class=\"back\">kwas + wodorotlenek; kwas + metal; kwas + tlenek metalu; kwas + sól; sól + zasada<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Reakcja strąceniowa<\/span><span class=\"back\">reakcja, w której powstaje osad<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">AgCl / BaSO₄ — barwa osadu<\/span><span class=\"back\">biały / biały<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">PbI₂ — barwa osadu<\/span><span class=\"back\">żółty<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Fe(OH)₃ — barwa osadu<\/span><span class=\"back\">rdzawobrunatny<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Chlorki — wyjątki<\/span><span class=\"back\">AgCl (N), PbCl₂ (T)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Siarczany(VI) — wyjątki<\/span><span class=\"back\">BaSO₄, PbSO₄ (N); CaSO₄ (T)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Węglany — które rozpuszczalne?<\/span><span class=\"back\">tylko sole metali alkalicznych i NH₄⁺<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Hydrat siarczanu(VI) miedzi(II)<\/span><span class=\"back\">CuSO₄·5H₂O — niebieski; bezwodny prawie biały<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">NaHCO₃ — zastosowanie<\/span><span class=\"back\">proszek do pieczenia, środek na zgagę<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Indeks a współczynnik<\/span><span class=\"back\">indeks zmienia substancję, współczynnik — ilość<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Czynnik napędzający reakcji wymiany<\/span><span class=\"back\">osad, gaz albo słaby elektrolit (woda)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Kropka w CuSO₄·5H₂O<\/span><span class=\"back\">woda krystalizacyjna w krysztale, nie mnożenie<\/span><\/button><\/div>\n<\/section>\n<section id=\"slownik\">\n<div class=\"part-heading\"><span class=\"part-num\">23<\/span> Słownik<\/div>\n<div class=\"card\">\n<dl><div class=\"def-item\"><dt>Sól<\/dt><dd>związek z kationów metalu (lub NH₄⁺) i anionów reszty kwasowej<\/dd><\/div><div class=\"def-item\"><dt>Kryształ jonowy<\/dt><dd>regularna sieć kationów i anionów przyciąganych elektrostatycznie<\/dd><\/div><div class=\"def-item\"><dt>Reakcja strąceniowa<\/dt><dd>reakcja, w której powstaje nierozpuszczalny osad<\/dd><\/div><div class=\"def-item\"><dt>Osad<\/dt><dd>trudno rozpuszczalna substancja stała wydzielająca się z roztworu (↓)<\/dd><\/div><div class=\"def-item\"><dt>Tabela rozpuszczalności<\/dt><dd>zestawienie rozpuszczalności soli i wodorotlenków w wodzie (R / T / N)<\/dd><\/div><div class=\"def-item\"><dt>Jon obserwator<\/dt><dd>jon, który nie zmienia się w reakcji — pomijamy go w zapisie skróconym<\/dd><\/div><div class=\"def-item\"><dt>Czynnik napędzający<\/dt><dd>osad, gaz lub słaby elektrolit — warunek zajścia reakcji wymiany w roztworze<\/dd><\/div><div class=\"def-item\"><dt>Hydroliza soli<\/dt><dd>reakcja jonów słabego kwasu lub słabej zasady z wodą, zmieniająca odczyn<\/dd><\/div><div class=\"def-item\"><dt>Hydrat<\/dt><dd>sól zawierająca cząsteczki wody w krysztale, np. CuSO₄·5H₂O<\/dd><\/div><div class=\"def-item\"><dt>Wodorosól (sól kwaśna)<\/dt><dd>sól, której anion zawiera kwasowy wodór, np. NaHCO₃<\/dd><\/div><div class=\"def-item\"><dt>Hydroksosól (sól zasadowa)<\/dt><dd>sól zawierająca dodatkowo grupy OH⁻, np. Ca(OH)Cl<\/dd><\/div><div class=\"def-item\"><dt>Iloczyn rozpuszczalności<\/dt><dd>iloczyn stężeń jonów w roztworze nasyconym trudno rozpuszczalnej soli (K<sub>sp<\/sub>)<\/dd><\/div><div class=\"def-item\"><dt>Twardość wody<\/dt><dd>zawartość jonów Ca²⁺ i Mg²⁺ w wodzie<\/dd><\/div><\/dl>\n<\/div>\n<\/section>\n<section id=\"checklista\">\n<div class=\"part-heading\"><span class=\"part-num\">24<\/span> Checklista<\/div>\n<div class=\"checklist\">\n<h4>Sprawdź, czy umiesz:<\/h4>\n<ul>\n<li>Zdefiniować sól (kation metalu lub NH₄⁺ + anion reszty kwasowej).<\/li>\n<li>Ułożyć wzór z ładunków (W–K–S–K + nawias) i sprawdzić bilans ładunku.<\/li>\n<li>Odróżnić indeks od współczynnika.<\/li>\n<li>Nazwać sól (reszta + metal, cyfra rzymska, gdy trzeba) i przejść od nazwy do wzoru.<\/li>\n<li>Zapisać dysocjację soli rozpuszczalnej.<\/li>\n<li>Odczytać rozpuszczalność z tabeli i znać wyjątki (AgCl, BaSO₄, PbSO₄, CaSO₄, węglany).<\/li>\n<li>Zapisać 5 metod podstawowych otrzymywania soli (i znać pozostałe z 10).<\/li>\n<li>Przewidzieć reakcję strąceniową i zapisać ją jonowo (z jonami obserwatorami).<\/li>\n<li>Rozpoznać barwy osadów: AgCl, BaSO₄, PbI₂, Cu(OH)₂, Fe(OH)₃.<\/li>\n<li>Przewidzieć wypieranie metali z szeregu aktywności.<\/li>\n<li>Opisać hydraty (CuSO₄·5H₂O, CaSO₄·2H₂O) i zastosowania ważnych soli.<\/li>\n<li>Stosować BHP przy pracy z solami.<\/li>\n<li>(ambitnie) Rozróżnić sole obojętne, wodorosole, hydroksosole i hydraty.<\/li>\n<li>(ambitnie) Przewidzieć odczyn roztworu soli (hydroliza) jako most do działu J.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"mosty\">\n<div class=\"part-heading\"><span class=\"part-num\">A<\/span> Dodatek A — mosty i co dalej<\/div>\n<div class=\"card card-new\">\n<span class=\"card-label\">Mosty<\/span>\n<ul>\n<li><strong>N03 Kwasy<\/strong> — reakcje kwasów prowadzą do soli; szereg aktywności; zapis jonowy.<\/li>\n<li><strong>N02 Wodorotlenki<\/strong> — zobojętnianie, osady wodorotlenków.<\/li>\n<li><strong>N01 Tlenki<\/strong> — tlenki kwasowe i zasadowe jako substraty soli.<\/li>\n<li><strong>Atlas<\/strong> — każdy metal pokazuje rozpuszczalność swoich związków i reakcje z silnika.<\/li>\n<li><strong>N05 Wodorki<\/strong> — następna lekcja.<\/li>\n<li><strong>J — chemia jonowa<\/strong> — Ag⁺ + Cl⁻ → AgCl(s) prowadzi do analizy jakościowej i równań jonowych; hydroliza soli — J07.<\/li>\n<li><strong>R — roztwory i stechiometria<\/strong> — masa osadu, stężenia, iloczyn rozpuszczalności.<\/li>\n<li><strong>E — elektrochemia<\/strong> — wypieranie metali jako reakcja redoks, ogniwa.<\/li>\n<\/ul>\n<p class=\"mini-note\">Powrót do: F02 (jony), F05–F09 (wzory, bilans), R02, J01–J04, E04. Zadanie transferowe: zapisz wzór Al₂(SO₄)₃ i reakcję strącania BaSO₄ w zapisie cząsteczkowym oraz jonowym.<\/p>\n<\/div>\n<\/section>\n<section id=\"modele\">\n<div class=\"part-heading\"><span class=\"part-num\">↻<\/span> Modele silnika w tej lekcji<\/div>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Sekcja<\/th><th>Model<\/th><th>Co pokazuje<\/th><\/tr><\/thead><tbody>\n<tr><td><a href=\"#definicja\">§1<\/a><\/td><td><code>ion-map-v02<\/code><\/td><td>mapa jonów: ładunek, pochodzenie, wykrywanie, sole<\/td><\/tr>\n<tr><td><a href=\"#nazewnictwo\">§3<\/a><\/td><td><code>kw-reszty-v01<\/code><\/td><td>kwas → reszta → wzory i nazwy soli<\/td><\/tr>\n<tr><td><a href=\"#dysocjacja\">§4<\/a><\/td><td><code>gfx-scene-conductivity<\/code><\/td><td>tester przewodnictwa<\/td><\/tr>\n<tr><td><a href=\"#rozpuszczalnosc\">§5<\/a><\/td><td><code>tabela-rozpuszczalnosci-v01<\/code><\/td><td>tabela rozpuszczalności (20 °C)<\/td><\/tr>\n<tr><td><a href=\"#otrzymywanie\">§6<\/a><\/td><td><code>chain-scn<\/code><\/td><td>łańcuch przemian pierwiastek → tlenek → kwas → sól<\/td><\/tr>\n<tr><td><a href=\"#stracanie\">§7<\/a><\/td><td><code>rownania-jonowe-v01<\/code><\/td><td>równania jonowe pełne i skrócone<\/td><\/tr>\n<tr><td><a href=\"#wypieranie\">§8<\/a><\/td><td><code>kw-szereg-metali-v01<\/code><\/td><td>szereg aktywności metali<\/td><\/tr>\n<tr><td><a href=\"#doswiadczenia\">§16<\/a><\/td><td><code>sole-doswiadczenia-v01<\/code><\/td><td>pracownia: zlewki do doświadczeń 1–10 (§16) i do odczynu soli (§13)<\/td><\/tr>\n<tr><td><a href=\"#typologia\">§19<\/a><\/td><td><code>stech-kalkulator-v01<\/code><\/td><td>obliczenia: masa osadu, mole<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<\/section>\n<section id=\"audit\">\n<div class=\"part-heading\"><span class=\"part-num\">✓<\/span> Audyt jakości <span class=\"level-badge level-exam\">KONTROLA<\/span><\/div>\n<div class=\"audit-panel\">\n<h4>Redakcja v1.1 (2026-10-07)<\/h4>\n<div class=\"audit-grid\">\n<div class=\"audit-item\"><strong>Układ:<\/strong> wg STANDARD_LEKCJI — start (minimum, spis, cele, pytanie przewodnie, kompas) → rdzeń E8 §1–11 → ambitne §12–15 → praktyka §16–20 → powtórka §21–24 → dodatek A.<\/div>\n<div class=\"audit-item\"><strong>Jeden model = jedno miejsce:<\/strong> 9 przycisków, 9 różnych modeli (w v1.0 cztery modele były dwa razy).<\/div>\n<div class=\"audit-item\"><strong>Dane z silnika:<\/strong> równania data-rx (CHE.REACTION), wzory i nazwy (CHE.IONIC.compound), litery R/T/N (tabela rozpuszczalności), odczyn soli (CHE.IONIC.saltReaction), barwy osadów (CHE.COLORS).<\/div>\n<div class=\"audit-item\"><strong>Poprawki merytoryczne względem kanonu md:<\/strong> NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺ (zamiast „NH₄OH”); hydroliza soli — J07; kości to głównie hydroksyapatyt, CaCO₃ — muszle i skorupy; Mg²⁺ jako kofaktor enzymów; AgNO₃ dawniej w fotografii przez AgBr; K<sub>sp<\/sub> porównujemy tylko dla soli tego samego typu; rozpuszczalność CaCO₃ i Na₂CO₃ — bilans energii sieci i hydratacji.<\/div>\n<\/div>\n<\/div>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA N04 v1.1 MASTER LAB<\/strong> · Sole · 2026<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n"</script>
