opy-v01`. Dane izotopów z silnika (CHE.DATA.ISOTOPES). */\n/* dane z silnika (bez lokalnej kopii): CHE.DATA.ELEMENTS_54 (symbol, nazwa) + CHE.DATA.ISOTOPES (A, masa, udział) */\nfunction izo(z){var E=(D.ELEMENTS_54||[]).filter(function(e){return e.z===z})[0];if(!E)return null;\n var L=(D.ISOTOPES||{})[E.s]||[];return [E.s,String(E.n||E.s).toLowerCase(),L.map(function(x){return [x.A,x.atomicMass,(x.abundance||0)*100]}).sort(function(a,b){return b[2]-a[2]||a[0]-b[0]})]}\nfunction supN(n){return String(n).replace(/[0-9]/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]})}\nfunction subN(n){return String(n).replace(/[0-9]/g,function(d){return '₀₁₂₃₄₅₆₇₈₉'[d]})}\nfunction chg(q){return q===0?'':(Math.abs(q)>1?supN(Math.abs(q)):'')+(q>0?'⁺':'⁻')}\nfunction pl(x,d){return x.toFixed(d).replace('.',',')}\n/* atomSVG — komponent wielokrotnego użytku (F05, F07, A01…): model atomu jako SVG, kolory jak w atlasie (_anon_004 bohr: elektrony wewnętrzne #2f8a55, walencyjne #b85f00).\n   o = {p, n, e, powloki:false|true, W:260}. powloki:false → elektrony na jednym okręgu (F05; powłoki to pojęcie F07);\n   powloki:true → powłoki K, L, M, N wg modelu szkolnego 2, 8, 8, … (do Z = 20; dalej uproszczenie — do weryfikacji). Zwraca otwarty <svg…> (zamknąć '<\/svg>'). */\nfunction atomSVG(o){var W=o.W||260,C=W/2,p=o.p|0,n=o.n|0,e=o.e|0,svg='<svg viewBox=\"0 0 '+W+' '+W+'\" width=\"100%\" style=\"max-width:'+W+'px;display:block;margin:auto\" role=\"img\" aria-label=\"Model atomu: '+p+' p, '+n+' n, '+e+' e\">';\n var N=p+n,sk=W/260;\n for(var i=0;i<N;i++){var a=i*2.39996,r=4.2*sk*Math.sqrt(i+.5);svg+='<circle cx=\"'+(C+r*Math.cos(a)).toFixed(1)+'\" cy=\"'+(C+r*Math.sin(a)).toFixed(1)+'\" r=\"'+(4.6*sk).toFixed(1)+'\" fill=\"'+(Math.floor((i+1)*p/N)>Math.floor(i*p/N)?'#d9534f':'#7f8da0')+'\" stroke=\"#fff\" stroke-width=\".8\"/>'}\n var sh=[];if(o.powloki){var cap=[2,8,8],left=e;for(var q=0;left>0;q++){var c=q<3?Math.min(cap[q],left):left;sh.push(c);left-=c}}else if(e)sh=[e];\n var R0=o.powloki?Math.max(40*sk,6*sk*Math.sqrt(N)+18*sk):104*sk,st=sh.length>1?(104*sk-R0)/(sh.length-1):0;\n sh.forEach(function(cnt,q){var R=sh.length>1?R0+q*st:(o.powloki?R0:104*sk),wal=o.powloki&&q===sh.length-1;\n  svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+R.toFixed(1)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n  if(o.powloki)svg+='<text x=\"'+(C+R*0.71+4).toFixed(1)+'\" y=\"'+(C-R*0.71-4).toFixed(1)+'\" font-size=\"'+(11*sk).toFixed(0)+'\" fill=\"#5b6773\">'+'KLMN'[q]+'<\/text>';\n  for(var k=0;k<cnt;k++){var b=k/cnt*2*Math.PI-Math.PI/2;svg+='<circle cx=\"'+(C+R*Math.cos(b)).toFixed(1)+'\" cy=\"'+(C+R*Math.sin(b)).toFixed(1)+'\" r=\"'+(5*sk).toFixed(1)+'\" fill=\"'+(o.powloki?(wal?'#b85f00':'#2e7d4f'):'#2f7bd8')+'\"/>'}});\n if(!e)svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+(104*sk)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n return svg}\ntry{C.LAB=C.LAB||{};C.LAB.atomSVG=atomSVG}catch(_){}\n/* atomBohr, orbitalCloud → engine/src/dodatki/atlas-gfx.js (wspólne dla labu i lekcji, CHE.LAB.*) */\n\nV.define('f05-izotopy-v01',{title:'Izotop, jon czy inny pierwiastek? Konstruktor atomu i masa atomowa',tag:'MODEL',\n hint:'Dodawaj i zabieraj protony, neutrony i elektrony. Model mówi, co się zmieniło: pierwiastek (Z), izotop (n) czy ładunek (e). Niżej: skąd się bierze masa atomowa z układu okresowego.',\n foot:'rozszerzenia.js §8 · dane: CHE.DATA.ISOTOPES, ELEMENTS_54',\n build:function(host){host.innerHTML='';host.classList.add('x5');\n  var s={p:17,n:18,e:17},start={p:17,n:18,e:17};\n  var pick=el('div','bar','<b>Start:<\/b>');host.appendChild(pick);\n  [1,6,8,11,12,17,20].forEach(function(z){var d=izo(z);if(!d||!d[2].length)return;var b=el('button','o',d[0]);b.type='button';b.onclick=function(){s={p:z,n:d[2][0][0]-z,e:z};start={p:s.p,n:s.n,e:s.e};draw()};pick.appendChild(b)});\n  var ctl=el('div','bar');host.appendChild(ctl);\n  [['p','proton'],['n','neutron'],['e','elektron']].forEach(function(c){\n   var m=el('button','o','− '+c[1]),p=el( t.fb){var f=document.createElement('div');f.className='quiz-fb';f.innerHTML=d.dataset.fb;d.appendChild(f)}\n  if(sc&&sc.classList.contains('quiz-score'))sc.textContent='Wynik: '+ok+' / '+n}})})});\nvar b=root.querySelector('#advToggle');if(b&&!b.dataset.cheAdv){b.dataset.cheAdv=1;var all=function(){return root.querySelectorAll('details.adv')},k=all().length;\n b.textContent='Pokaż treści akademickie ('+k+')';\n b.onclick=function(){var on=b.getAttribute('aria-pressed')!=='true';all().forEach(function(d){d.open=on});b.setAttribute('aria-pressed',on?'true':'false');b.textContent=(on?'Ukryj':'Pokaż')+' treści akademickie ('+k+')'}}\n})();\n\n<\/script>\n<a class=\"skip-link\" href=\"#main\">Przejdź do treści<\/a>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">F04 · FUNDAMENTY · MASTER v1.0<\/div><h1>Atom<\/h1><p class=\"lead\">Pierwsza lekcja fazy B — „z czego to wynika?”. Schodzimy z poziomu substancji do atomu: z jakich cząstek się składa,<\/p><p class=\"lead\">która liczba definiuje pierwiastek i jak z zapisu nuklidu bez zgadywania policzyć protony, neutrony i elektrony — w atomie i w jonie.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-extra\">AMBITNE (LO)<\/span><\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><\/section>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#jak-pracowac\">0.1. Jak pracować z lekcją<\/a><a class=\"toc-link\" href=\"#cele\">0.2. Cele lekcji i pytanie przewodnie<\/a><a class=\"toc-link\" href=\"#kompas\">0.3. Kompas — co trzeba wiedzieć wcześniej<\/a><a class=\"toc-link\" href=\"#diagnoza\">0.4. Diagnoza startowa<\/a><a class=\"toc-link\" href=\"#wyklad\">0.5. Wykład — atom od zera<\/a><a class=\"toc-link\" href=\"#czastki\">1. Cząstki atomu<\/a><a class=\"toc-link\" href=\"#liczby\">2. Liczba atomowa Z i liczba masowa A<\/a><a class=\"toc-link\" href=\"#nuklid\">3. Zapis nuklidu<\/a><a class=\"toc-link\" href=\"#jony\">4. Atom obojętny i jon<\/a><a class=\"toc-link\" href=\"#co-zmienia\">5. Co zmienia Z, liczba neutronów i liczba elektronów?<\/a><a class=\"toc-link\" href=\"#modele-atomu\">6. Jak powstał model atomu<\/a><a class=\"toc-link\" href=\"#doswiadczenia\">7. Doświadczenia modelowe<\/a><a class=\"toc-link\" href=\"#klinika\">8. Klinika błędów<\/a><a class=\"toc-link\" href=\"#cwiczenia\">9. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#ciekawostki\">9.5. Ciekawostki<\/a><a class=\"toc-link\" href=\"#olimpijska\">9.6. Warstwa olimpijska — Dla olimpijczyka<\/a><a class=\"toc-link\" href=\"#test\">10. Test<\/a><a class=\"toc-link\" href=\"#powtorka\">11. Karta szybkiego powtórzenia i mapa myśli<\/a><a class=\"toc-link\" href=\"#fiszki\">12. Fiszki<\/a><a class=\"toc-link\" href=\"#slownik\">13. Słownik<\/a><a class=\"toc-link\" href=\"#checklista\">14. Checklista<\/a><a class=\"toc-link\" href=\"#powtorki\">15. System powtórek<\/a><a class=\"toc-link\" href=\"#mosty\">A. Dodatek A — mosty i co dalej<\/a><a class=\"toc-link\" href=\"#modele\">Modele silnika w tej lekcji<\/a><\/nav><\/details>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć na E8 — 12 punktów<\/h3>\n<ol>\n<li>Atom składa się z <strong>jądra<\/strong> (protony i neutrony) i <strong>elektronów<\/strong> wokół jądra.<\/li>\n<li><strong>Proton<\/strong> p⁺: ładunek +1, masa ok. 1 u; <strong>neutron<\/strong> n⁰: ładunek 0, masa ok. 1 u; <strong>elektron<\/strong> e⁻: ładunek −1, masa ≈ 1/1836 masy protonu (≈ 0,00055 u).<\/li>\n<li><strong>Liczba atomowa Z<\/strong> = liczba protonów. <strong>Z definiuje pierwiastek<\/strong>: inne Z — inny pierwiastek.<\/li>\n<li><strong>Liczba masowa A<\/strong> = liczba protonów + liczba neutronów.<\/li>\n<li><strong>Liczba neutronów<\/strong> n = A − Z.<\/li>\n<li><strong>Atom obojętny<\/strong> ma tyle elektronów, ile protonów: e = Z.<\/li>\n<li>Zapis nuklidu: u góry A, u dołu Z, obok symbol — np. ²³₁₁Na: 11 p⁺, 12 n⁰, 11 e⁻.<\/li>\n<li><strong>Jon<\/strong> powstaje przez <strong>oddanie lub przyjęcie elektronów<\/strong> — liczba protonów się nie zmienia.<\/li>\n<li><strong>Kation<\/strong> (+) oddał elektrony: Na⁺ ma 10 e⁻. <strong>Anion<\/strong> (−) przyjął elektrony: Cl⁻ ma 18 e⁻.<\/li>\n<li>Ładunek jonu q = p − e, stąd <strong>e = Z − q<\/strong>: Al³⁺ → 13 − 3 = 10 e⁻; O²⁻ → 8 − (−2) = 10 e⁻.<\/li>\n<li>Prawie cała masa atomu jest w jądrze, a jądro jest rzędu 10⁴–10⁵ razy mniejsze od atomu (atom ≈ 10⁻¹⁰ m, jądro ≈ 10⁻¹⁵ m) — atom to głównie pusta przestrzeń.<\/li>\n<li><strong>A ≠ masa atomowa<\/strong> z układu okresowego: A jest liczbą całkowitą dla jednego nuklidu, masa atomowa — średnią (szczegóły: F05).<\/li>\n<\/ol>\n<\/section>\n<div class=\"layer-legend\">\n<div class=\"layer-row\"><span class=\"dot e8\"><\/span><span><b>E8:<\/b> budowa atomu; p⁺, n⁰, e⁻; Z i A; zapis nuklidu; liczenie p, n, e w atomie i jonie; kation i anion<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot understand\"><\/span><span><b>Rozumienie:<\/b> co zmienia Z, n, e (pierwiastek, izotop, jon); skala atomu; dlaczego reakcje chemiczne nie zmieniają jądra<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot extra\"><\/span><span><b>Ambitne (LO):<\/b> historia modeli atomu i doświadczenie Rutherforda; jednostka u; nuklid i izobary; ograniczenia modelu planetarnego<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot contest\"><\/span><span><b>Ponad LO:<\/b> rozwijane bloki „poziom akademicki” — przycisk w nagłówku lekcji<\/span><\/div>\n<\/div>\n<div id=\"rdzen\" class=\"core-path\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to (ok. 30 min)<\/div>\n<ol>\n<li><strong><a href=\"#diagnoza\">§0.4<\/a><\/strong> — diagnoza: odpowiedz, zanim zaczniesz czytać.<\/li>\n<li><strong><a href=\"#czastki\">§1<\/a>–<a href=\"#nuklid\">§3<\/a><\/strong> — cząstki atomu, liczby Z i A, zapis nuklidu.<\/li>\n<li><strong><a href=\"#jony\">§4<\/a><\/strong> — atom obojętny i jon: procedura liczenia elektronów.<\/li>\n<li><strong><a href=\"#klinika\">§8<\/a><\/strong> — klinika błędów, potem <strong><a href=\"#cwiczenia\">§9<\/a><\/strong> ćwiczenia A i B.<\/li>\n<\/ol>\n<\/div>\n<section id=\"jak-pracowac\">\n<div class=\"part-heading\"><span class=\"part-num\">0.1<\/span> Jak pracować z lekcją<\/div>\n<div class=\"card card-understand\">\n<ul>\n<li><strong>Mów na głos:<\/strong> „Z to liczba protonów”, „neutrony to A minus Z”, „kation oddał, anion przyjął”.<\/li>\n<li><strong>Zawsze sprawdzaj znak:<\/strong> jeśli liczba elektronów nie pasuje do znaku ładunku, wróć do wzoru e = Z − q — nie poprawiaj „na oko”.<\/li>\n<li><strong>Rysuj<\/strong> jądro i elektrony, nawet schematycznie.<\/li>\n<li><strong>Zasada 80/20:<\/strong> Z, A, n = A − Z, e = Z − q, kation/anion.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"cele\">\n<div class=\"part-heading\"><span class=\"part-num\">0.2<\/span> Cele lekcji i pytanie przewodnie <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Po tej lekcji potrafisz<\/span>\n<ul>\n<li>opisać budowę atomu i właściwości protonu, neutronu i elektronu,<\/li>\n<li>odczytać z zapisu nuklidu liczbę protonów, neutronów i elektronów,<\/li>\n<li>obliczyć liczbę elektronów w kationie i anionie,<\/li>\n<li>wyjaśnić, dlaczego to liczba protonów, a nie neutronów czy elektronów, definiuje pierwiastek,<\/li>\n<li>(rozumienie) powiedzieć, co zmienia zmiana Z, liczby neutronów i liczby elektronów,<\/li>\n<li>(ambitnie) opisać, jak zmieniały się modele atomu i co pokazało doświadczenie Rutherforda.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Pytanie przewodnie<\/span>\n<p><strong>Co decyduje o tym, że atom jest atomem konkretnego pierwiastka?<\/strong> Podpowiedź: nie liczba neutronów i nie liczba elektronów.<\/p>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Model całej lekcji<\/span>\n<p><strong>Zapis → Z → protony → A − Z → neutrony → ładunek → elektrony → kontrola sumy ładunków.<\/strong><\/p>\n<\/div>\n<\/section>\n<section id=\"kompas\">\n<div class=\"part-heading\"><span class=\"part-num\">0.3<\/span> Kompas — co trzeba wiedzieć wcześniej<\/div>\n<ul>\n<li><strong>F02 Materia i substancje:<\/strong> pierwiastek to rodzaj atomów; symbol pierwiastka.<\/li>\n<li><strong>Elektrostatyka z fizyki<\/strong> (pomocniczo): ładunki dodatnie i ujemne przyciągają się, jednoimienne odpychają.<\/li>\n<li>Matematyka: dodawanie i odejmowanie liczb całkowitych (także ujemnych).<\/li>\n<\/ul>\n<div class=\"card card-core\">\n<span class=\"card-label\">Gdzie jesteś<\/span>\n<p>Faza A (F01–F03) opisała substancje. <strong>Faza B — Z czego to wynika?<\/strong> <strong>F04 atom<\/strong> → F05 izotopy i jony → F06 układ okresowy → F07–F08 konfiguracja → F09 wartościowość i stopień utlenienia.<\/p>\n<\/div>\n<\/section>\n<section id=\"diagnoza\">\n<div class=\"part-heading\"><span class=\"part-num\">0.4<\/span> Diagnoza startowa<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Odpowiedz najpierw sam<\/span>\n<ol>\n<li>Co oznacza Z?<\/li>\n<li>Co oznacza A?<\/li>\n<li>Ile neutronów ma ³⁵₁₇Cl?<\/li>\n<li>Ile elektronów ma atom obojętny tlenu (Z = 8)?<\/li>\n<li>Ile elektronów ma jon Na⁺ (Z = 11)?<\/li>\n<li>Czy zmiana liczby neutronów zmienia pierwiastek?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż klucz i interpretację<\/summary>\n<ol>\n<li>Liczbę protonów. 2. Sumę protonów i neutronów. 3. 35 − 17 = 18. 4. 8. 5. 10. 6. Nie — powstaje inny izotop tego samego pierwiastka.<\/li>\n<\/ol>\n<p><strong>Interpretacja:<\/strong> 0–2/6 — rdzeń krok po kroku; 3–4/6 — rdzeń, szczególnie punkty z błędami; 5–6/6 — przejdź do <a href=\"#co-zmienia\">§5<\/a> i zadań transferowych.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"wyklad\">\n<div class=\"part-heading\"><span class=\"part-num\">0.5<\/span> Wykład — atom od zera<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład — z czego zbudowane jest wszystko<\/span>\n<p>Weź kawałek miedzianego drutu i zacznij go w myślach dzielić na coraz mniejsze części. W końcu dojdziesz do najmniejszej porcji, która nadal jest miedzią — do <strong>atomu<\/strong>. Starożytni Grecy nazwali go <em>átomos<\/em>, czyli „niepodzielny”. Dziś wiemy, że ta nazwa jest myląca: atom ma wnętrze, a jego budowa tłumaczy niemal całą chemię.<\/p>\n<p>W środku atomu znajduje się <strong>jądro<\/strong> — maleńkie, ale bardzo ciężkie. Tworzą je <strong>protony<\/strong> (ładunek +1) i <strong>neutrony<\/strong> (bez ładunku); obie cząstki mają masę około 1 u. Wokół jądra poruszają się <strong>elektrony<\/strong> (ładunek −1), prawie 2000 razy lżejsze od protonu. Dodatnie jądro przyciąga ujemne elektrony — to ta sama siła, która przyciąga naelektryzowany balon do włosów. Jądro jest rzędu 10⁴–10⁵ razy mniejsze od całego atomu (atom ≈ 10⁻¹⁰ m, jądro ≈ 10⁻¹⁵ m), a skupia ponad 99,9% jego masy: atom to głównie pusta przestrzeń.<\/p>\n<p>Najważniejsza liczba w chemii to <strong>liczba atomowa Z<\/strong> — liczba protonów. Ona decyduje, jaki to pierwiastek: każdy atom z 6 protonami jest węglem, z 8 — tlenem, z 11 — sodem. <strong>Liczba masowa A<\/strong> mówi, ile jest w jądrze protonów i neutronów razem; stąd liczba neutronów n = A − Z. Wszystko to zapisujemy skrótem: u góry A, u dołu Z, obok symbol — np. ²³₁₁Na oznacza sód z 11 protonami i 12 neutronami.<\/p>\n<p>W atomie obojętnym elektronów jest tyle co protonów, więc ładunki się znoszą. Gdy atom <strong>odda<\/strong> elektrony, staje się <strong>kationem<\/strong> (ładunek dodatni, np. Na⁺), gdy <strong>przyjmie<\/strong> — <strong>anionem<\/strong> (ładunek ujemny, np. Cl⁻). Liczba protonów się przy tym nie zmienia — dlatego Na⁺ to nadal sód. To kluczowe zdanie lekcji: <strong>reakcje chemiczne przestawiają elektrony, ale nie ruszają jąder<\/strong>. Zmiana liczby protonów to już przemiana jądrowa i powstaje inny pierwiastek.<\/p>\n<p>Z tej lekcji wyniesiesz jedną procedurę, która wraca przez cały kurs: z zapisu odczytaj Z (protony), policz neutrony (A − Z), a elektrony wyznacz z ładunku (e = Z − q) — i zawsze sprawdź, czy p − e daje podany ładunek.<\/p>\n<\/div>\n<\/section>\n<section id=\"czastki\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Cząstki atomu <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Cząstka<\/th><th>Symbol<\/th><th>Ładunek<\/th><th>Masa (ok.)<\/th><th>Miejsce<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>proton<\/td><td>p⁺<\/td><td>+1<\/td><td>1 u<\/td><td>jądro<\/td><\/tr>\n<tr><td>neutron<\/td><td>n⁰<\/td><td>0<\/td><td>1 u<\/td><td>jądro<\/td><\/tr>\n<tr><td>elektron<\/td><td>e⁻<\/td><td>−1<\/td><td>≈ 1/1836 masy protonu (≈ 0,00055 u)<\/td><td>wokół jądra<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Jądro<\/strong> zawiera protony i neutrony — ma ładunek dodatni i prawie całą masę atomu. <strong>Elektrony<\/strong> zajmują obszar wokół jądra; przyciąga je dodatnie jądro. <strong>Jednostka masy atomowej u<\/strong> to 1/12 masy atomu węgla ¹²C; 1 u ≈ 1,66 · 10⁻²⁴ g.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Skala atomu <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/span>\n<p>Gdyby atom powiększyć do rozmiaru stadionu, jądro byłoby ziarnkiem grochu na środku boiska (to przybliżenie rzędu 10⁴ — ziarnko jest już nieco za duże). Jądro jest rzędu 10⁴–10⁵ razy mniejsze od atomu, a skupia ponad 99,9% jego masy. Rysunki atomu w podręcznikach celowo nie zachowują skali.<\/p>\n<\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Wielkość<\/th><th>Wartość (przybliżona)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>średnica atomu<\/td><td>ok. 10⁻¹⁰ m (0,1 nm)<\/td><\/tr>\n<tr><td>średnica jądra<\/td><td>ok. 10⁻¹⁵ m<\/td><\/tr>\n<tr><td>masa atomu ¹H<\/td><td>ok. 1,67 · 10⁻²⁴ g<\/td><\/tr>\n<tr><td>masa elektronu<\/td><td>ok. 9,1 · 10⁻²⁸ g<\/td><\/tr>\n<tr><td>ładunek elementarny e<\/td><td>1,6 · 10⁻¹⁹ C<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/section>\n<section id=\"liczby\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Liczba atomowa Z i liczba masowa A <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"formula-lg\">Z = liczba protonów · A = protony + neutrony · n = A − Z · atom obojętny: e = Z<\/div>\n<ul>\n<li><strong>Z<\/strong> jest „dowodem osobistym” pierwiastka: Z = 1 — wodór, Z = 6 — węgiel, Z = 11 — sód, Z = 17 — chlor. Z odczytasz z układu okresowego (to numer pierwiastka).<\/li>\n<li><strong>A<\/strong> dotyczy konkretnego <strong>nuklidu<\/strong> (rodzaju atomu o określonym składzie jądra) i zawsze jest liczbą całkowitą.<\/li>\n<\/ul>\n<div class=\"card card-core\">\n<span class=\"card-label\">Zmiana protonów to zmiana pierwiastka<\/span>\n<p>Atom z 6 protonami jest zawsze węglem. Gdyby miał 7 protonów, byłby azotem — nie „innym węglem”. W zwykłych reakcjach chemicznych jądra się nie zmieniają; przestawiają się tylko elektrony. Zmiana jądra to przemiana jądrowa (blok A).<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Z dla pierwszych 20 pierwiastków<\/span>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Z<\/th><th>symbol<\/th><th>nazwa<\/th><th>Z<\/th><th>symbol<\/th><th>nazwa<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>H<\/td><td>wodór<\/td><td>11<\/td><td>Na<\/td><td>sód<\/td><\/tr>\n<tr><td>2<\/td><td>He<\/td><td>hel<\/td><td>12<\/td><td>Mg<\/td><td>magnez<\/td><\/tr>\n<tr><td>3<\/td><td>Li<\/td><td>lit<\/td><td>13<\/td><td>Al<\/td><td>glin<\/td><\/tr>\n<tr><td>4<\/td><td>Be<\/td><td>beryl<\/td><td>14<\/td><td>Si<\/td><td>krzem<\/td><\/tr>\n<tr><td>5<\/td><td>B<\/td><td>bor<\/td><td>15<\/td><td>P<\/td><td>fosfor<\/td><\/tr>\n<tr><td>6<\/td><td>C<\/td><td>węgiel<\/td><td>16<\/td><td>S<\/td><td>siarka<\/td><\/tr>\n<tr><td>7<\/td><td>N<\/td><td>azot<\/td><td>17<\/td><td>Cl<\/td><td>chlor<\/td><\/tr>\n<tr><td>8<\/td><td>O<\/td><td>tlen<\/td><td>18<\/td><td>Ar<\/td><td>argon<\/td><\/tr>\n<tr><td>9<\/td><td>F<\/td><td>fluor<\/td><td>19<\/td><td>K<\/td><td>potas<\/td><\/tr>\n<tr><td>10<\/td><td>Ne<\/td><td>neon<\/td><td>20<\/td><td>Ca<\/td><td>wapń<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Zadanie: ile protonów mają ²⁷Al, ¹⁹F i ³⁹K? Z odczytujesz z tabeli, nie z podanego zapisu (13, 9, 19).<\/p>\n<\/div>\n<\/section>\n<section id=\"nuklid\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Zapis nuklidu <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<p>Zapis: u góry liczba masowa A, u dołu liczba atomowa Z, obok symbol pierwiastka X. Często pomija się Z (wynika z symbolu): ³⁵Cl, ¹²C.<\/p>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Procedura odczytu<\/span>\n<ol>\n<li><strong>Symbol<\/strong> X → jaki pierwiastek.<\/li>\n<li><strong>Z<\/strong> → liczba protonów.<\/li>\n<li><strong>A − Z<\/strong> → liczba neutronów.<\/li>\n<li><strong>Ładunek<\/strong> (jeśli podany) → liczba elektronów: e = Z − q; brak ładunku → e = Z.<\/li>\n<li><strong>Kontrola:<\/strong> p − e musi dać podany ładunek.<\/li>\n<\/ol>\n<\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Zapis<\/th><th>p⁺<\/th><th>n⁰<\/th><th>e⁻<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>¹²₆C<\/td><td>6<\/td><td>6<\/td><td>6<\/td><\/tr>\n<tr><td>¹⁶₈O<\/td><td>8<\/td><td>8<\/td><td>8<\/td><\/tr>\n<tr><td>²³₁₁Na<\/td><td>11<\/td><td>12<\/td><td>11<\/td><\/tr>\n<tr><td>³⁵₁₇Cl<\/td><td>17<\/td><td>18<\/td><td>17<\/td><\/tr>\n<tr><td>³⁷₁₇Cl<\/td><td>17<\/td><td>20<\/td><td>17<\/td><\/tr>\n<tr><td>⁴⁰₂₀Ca<\/td><td>20<\/td><td>20<\/td><td>20<\/td><\/tr>\n<tr><td>²⁷₁₃Al<\/td><td>13<\/td><td>14<\/td><td>13<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"mini-note\">Elektronów <strong>nie<\/strong> odczytujesz z A — A mówi tylko o jądrze.<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"f04-nuklid-v01\"><button type=\"button\" data-che-open-viz=\"f04-nuklid-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'f04-nuklid-v01',lessonId:'F04'},'*')\"><b>Trening: odczytaj zapis nuklidu i policz p, n, e<\/b><span><\/span><\/button><\/div>\n<!-- OPIS: Duży zapis nuklidu (np. ³⁵₁₇Cl⁻): u góry liczba masowa A, u dołu liczba atomowa Z, w prawym górnym rogu ładunek jonu. Uczeń wpisuje liczbę protonów, neutronów i elektronów; po „Sprawdź” pola zmieniają kolor (zielony — dobrze, czerwony — źle), pojawia się rachunek p = Z, n = A − Z, e = Z − ładunek oraz model atomu (protony czerwone, neutrony szare, elektrony na powłokach). Licznik pokazuje wynik. Wniosek: liczbę elektronów wyznacza Z i ładunek, a nie liczba masowa; kation ma mniej elektronów niż protonów, anion — więcej. -->\n<p>Z odczytasz z układu okresowego: numer pierwiastka to liczba protonów (szczegóły w F06).<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"periodic-54\"><button type=\"button\" data-che-open-viz=\"periodic-54\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'periodic-54',lessonId:'F04'},'*')\"><b>Układ okresowy z modelami atomów (pierwiastki 1–54)<\/b><span>wybierz pierwiastek: Z, liczba elektronów, schemat atomu<\/span><\/button><\/div>\n<!-- OPIS: Interaktywny układ okresowy pierwiastków od 1 do 54; po wybraniu pierwiastka widać jego liczbę atomową Z, liczbę elektronów i schemat atomu z elektronami rozmieszczonymi na powłokach. Wniosek: miejsce pierwiastka w tablicy wynika z liczby protonów i budowy powłok elektronowych. -->\n<\/section>\n<section id=\"jony\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Atom obojętny i jon <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<p>Atom jest <strong>obojętny<\/strong>, gdy ma tyle samo protonów (+) co elektronów (−). <strong>Jon<\/strong> powstaje, gdy atom <strong>odda lub przyjmie elektrony<\/strong> — liczba protonów (i neutronów) się nie zmienia.<\/p>\n<div class=\"formula-lg\">q = p − e → e = Z − q<\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Jon<\/th><th>Z<\/th><th>ładunek q<\/th><th>p⁺<\/th><th>e⁻<\/th><th>jak powstał<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Na⁺<\/td><td>11<\/td><td>+1<\/td><td>11<\/td><td>10<\/td><td>oddał 1 e⁻<\/td><\/tr>\n<tr><td>Mg²⁺<\/td><td>12<\/td><td>+2<\/td><td>12<\/td><td>10<\/td><td>oddał 2 e⁻<\/td><\/tr>\n<tr><td>Al³⁺<\/td><td>13<\/td><td>+3<\/td><td>13<\/td><td>10<\/td><td>oddał 3 e⁻<\/td><\/tr>\n<tr><td>Cl⁻<\/td><td>17<\/td><td>−1<\/td><td>17<\/td><td>18<\/td><td>przyjął 1 e⁻<\/td><\/tr>\n<tr><td>O²⁻<\/td><td>8<\/td><td>−2<\/td><td>8<\/td><td>10<\/td><td>przyjął 2 e⁻<\/td><\/tr>\n<tr><td>S²⁻<\/td><td>16<\/td><td>−2<\/td><td>16<\/td><td>18<\/td><td>przyjął 2 e⁻<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"formula-lg\">Na → Na⁺ + e⁻ · Cl + e⁻ → Cl⁻<\/div>\n<figure class=\"lk-fig\" data-klocek=\"diagram-bohra\" data-opt=\"{&quot;z&quot;: &quot;11&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Atom i jon w modelu Bohra: oddaj lub przyjmij elektron<\/figcaption><\/figure>\n<!-- OPIS: Model Bohra: pośrodku czerwone jądro z napisem „Zp” (liczba protonów), wokół niego przerywane okręgi powłok K, L, M (i N) z kropkami-elektronami; kropki powłoki zewnętrznej (walencyjnej) są w kolorze akcentu, wewnętrzne szare. Suwak Z zmienia pierwiastek, przyciski dodają lub odbierają elektron: kation oddaje elektron z powłoki zewnętrznej (kropka odlatuje), anion przyjmuje elektron (kropka dolatuje). Obok liczby protonów, elektronów, ładunek i liczba elektronów na powłokach. Wniosek: Na ma 2, 8, 1 elektronów, po oddaniu jednego ma 2, 8 (jak Ne); Cl ma 2, 8, 7, po przyjęciu jednego 2, 8, 8 (jak Ar); liczba protonów się nie zmienia. -->\n<div class=\"card card-core\">\n<span class=\"card-label\">Reguła: kation oddał, anion przyjął<\/span>\n<p><strong>Kation<\/strong> (ładunek dodatni) — elektronów <strong>mniej<\/strong> niż protonów. <strong>Anion<\/strong> (ładunek ujemny) — elektronów <strong>więcej<\/strong> niż protonów. Uwaga na znak: dla O²⁻ e = 8 − (−2) = 10, a nie 6.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Najczęstszy błąd<\/span>\n<p>„Al³⁺ ma 13 − 3 = 10 <strong>protonów<\/strong>” — nie! Ładunek powstał przez utratę elektronów. Al³⁺ ma nadal <strong>13 protonów<\/strong> i <strong>10 elektronów<\/strong>. Gdyby zmieniła się liczba protonów, nie byłby to już glin.<\/p>\n<\/div>\n<p>Dlaczego atomy tworzą jony i które jony są typowe — F05 i F10. Jak elektrony rozmieszczają się wokół jądra (powłoki K, L, M) — F07.<\/p>\n<p class=\"mini-note\"><strong>Jony złożone<\/strong> (NH₄⁺, SO₄²⁻, OH⁻) mają wiele atomów o łącznym ładunku; ich zapisem zajmą się F09 i F12. Zasada e = Z − q działa także dla zespołu atomów: dla SO₄²⁻ sumujesz Z wszystkich atomów (16 + 4 · 8 = 48) i dostajesz e = 48 − (−2) = 50.<\/p>\n<\/section>\n<section id=\"co-zmienia\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Co zmienia Z, liczba neutronów i liczba elektronów? <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Trzy operacje, których nie wolno mylić<\/span>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Zmieniam<\/th><th>Co powstaje<\/th><th>Przykład<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>liczbę <strong>protonów<\/strong> (Z)<\/td><td><strong>inny pierwiastek<\/strong><\/td><td>¹⁴₆C → ¹⁴₇N<\/td><\/tr>\n<tr><td>liczbę <strong>neutronów<\/strong><\/td><td><strong>inny izotop<\/strong> tego samego pierwiastka<\/td><td>³⁵Cl i ³⁷Cl<\/td><\/tr>\n<tr><td>liczbę <strong>elektronów<\/strong><\/td><td><strong>jon<\/strong> tego samego pierwiastka<\/td><td>Na i Na⁺<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/div>\n<p class=\"mini-note\">Przykład ¹⁴₆C → ¹⁴₇N to rozpad β⁻ (przemiana jądrowa): neutron zamienia się w proton i elektron, A zostaje 14. Zmiana Z zawsze oznacza zmianę pierwiastka, ale nie każdą zmianę Z robi się w reakcji chemicznej.<\/p>\n<p>To jedna z najważniejszych osi całego bloku F. Kto pomyli te trzy operacje, potem pomyli izotopy z jonami, masę atomową z liczbą masową i stopień utlenienia z ładunkiem jądra. Izotopy i masę atomową rozwija <strong>F05<\/strong>.<\/p>\n<p>Zapis ²⁷₁₃Al³⁺ łączy wszystkie informacje naraz: pierwiastek (Z = 13, glin), nuklid (A = 27, czyli 14 neutronów) i stan elektronowy (ładunek 3+, czyli 10 elektronów).<\/p>\n<\/section>\n<section id=\"modele-atomu\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Jak powstał model atomu <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Rok<\/th><th>Model<\/th><th>Co wniósł<\/th><th>Ograniczenie<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>ok. 400 p.n.e.<\/td><td><strong>Demokryt<\/strong> — „átomos”<\/td><td>idea najmniejszych, niepodzielnych cząstek<\/td><td>brak podstaw doświadczalnych<\/td><\/tr>\n<tr><td>ok. 1808<\/td><td><strong>Dalton<\/strong> — niepodzielne kulki<\/td><td>każdy pierwiastek ma swój rodzaj atomów<\/td><td>atom jest podzielny<\/td><\/tr>\n<tr><td>1897–1904<\/td><td><strong>Thomson<\/strong> — „ciasto z rodzynkami”<\/td><td>odkrycie elektronu; atom ma ładunki<\/td><td>brak jądra<\/td><\/tr>\n<tr><td>1911<\/td><td><strong>Rutherford<\/strong> — jądro<\/td><td>mała, dodatnia, ciężka centralna część<\/td><td>nie tłumaczy trwałości elektronów<\/td><\/tr>\n<tr><td>1913<\/td><td><strong>Bohr<\/strong> — powłoki<\/td><td>elektrony na określonych poziomach energii<\/td><td>działa dobrze tylko dla wodoru<\/td><\/tr>\n<tr><td>1917–1919<\/td><td><strong>Rutherford — proton<\/strong><\/td><td>ładunek dodatni jądra jako osobna cząstka<\/td><td>nie tłumaczy masy jądra<\/td><\/tr>\n<tr><td>1932<\/td><td><strong>Chadwick — neutron<\/strong><\/td><td>cząstka bez ładunku o masie ok. 1 u<\/td><td>wcześniej model jądra był niepełny<\/td><\/tr>\n<tr><td>od 1926<\/td><td><strong>kwantowo-mechaniczny<\/strong> — orbitale<\/td><td>obszary prawdopodobnego położenia elektronu<\/td><td>wymaga matematyki ponad szkołę<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie historyczne — folia złota (analiza wyników)<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy ładunek dodatni i masa są w atomie rozłożone równomiernie?<\/span><b>Hipoteza (model Thomsona)<\/b><span>cząstki α przelecą przez cienką złotą folię prawie bez odchyleń.<\/span><b>Sprzęt<\/b><span>źródło cząstek α (dodatnich), bardzo cienka folia złota, ekran fluorescencyjny wokół folii.<\/span><b>Przebieg (eksperyment Geigera i Marsdena, 1909; interpretacja Rutherforda, 1911)<\/b><span>strumień cząstek α kierujemy na folię i liczymy błyski na ekranie pod różnymi kątami.<\/span><b>Obserwacja<\/b><span>Prawie wszystkie cząstki przechodzą bez odchylenia; nieliczne odchylają się mocno, a bardzo nieliczne odbijają się niemal do tyłu. Model Thomsona przewidywał tylko małe odchylenia, więc odbicia „do tyłu” były zaskoczeniem — Rutherford porównał je do ciężkiego pocisku, który odbija się od bibułki.<\/span><b>Wniosek<\/b><span>Atom to głównie pusta przestrzeń, a ładunek dodatni i prawie cała masa skupione są w maleńkim jądrze. Model Thomsona trzeba odrzucić.<\/span><b>BHP<\/b><span>doświadczenie historyczne — źródła promieniowania α wymagają specjalistycznego laboratorium; tu analizujemy wyniki.<\/span><\/div><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Model jako narzędzie<\/span>\n<p>Model powłokowy wystarcza, by liczyć p, n, e i rysować schematy. Nie wolno jednak mówić, że elektron to kulka krążąca po dokładnej orbicie jak planeta — to uproszczenie. Każdy model ma zakres stosowalności (F01 §7).<\/p>\n<\/div>\n<details class=\"adv\"><summary>Co trzyma jądro razem? <span class=\"adv-tag\">poziom akademicki<\/span><\/summary><div class=\"adv-body\">\n<p>Protony w jądrze odpychają się elektrostatycznie, a mimo to jądro jest trwałe. Utrzymują je <strong>oddziaływania silne (jądrowe)<\/strong> — znacznie silniejsze od odpychania, ale działające tylko na odległościach rzędu rozmiaru jądra (ok. 10⁻¹⁵ m). Neutrony „rozcieńczają” odpychanie protonów, dlatego cięższe jądra mają więcej neutronów niż protonów. Rozwinięcie: A01 Jądro atomowe (chemia jądrowa, blok A).<\/p>\n<\/div><\/details>\n<h3>Nuklid, izotop, izobar <span class=\"level-badge level-extra\">AMBITNE<\/span><\/h3>\n<ul>\n<li><strong>Nuklid<\/strong> — rodzaj atomu o określonym Z i A (²³Na, ³⁵Cl).<\/li>\n<li><strong>Izotopy<\/strong> — nuklidy o tym samym Z, różnym A (³⁵Cl i ³⁷Cl) — rozwinięcie w F05.<\/li>\n<li><strong>Izobary<\/strong> — nuklidy o tym samym A, różnym Z (⁴⁰Ar i ⁴⁰Ca) — to różne pierwiastki.<\/li>\n<\/ul>\n<\/section>\n<section id=\"doswiadczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Doświadczenia modelowe<\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 1 — Model atomu z plasteliny<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Jak przedstawić budowę atomu węgla ¹²C?<\/span><b>Hipoteza<\/b><span>Model pokaże małe, ciężkie jądro i elektrony wokół niego.<\/span><b>Sprzęt<\/b><span>plastelina w trzech kolorach (protony, neutrony, elektrony), wykałaczki, kartka z narysowanymi okręgami powłok.<\/span><b>Przebieg<\/b><span>Ulep 6 kulek „protonów” i 6 „neutronów”, sklej je w jądro na środku kartki. Na okręgach rozmieść 6 małych kulek „elektronów” (2 na pierwszym, 4 na drugim).<\/span><b>Obserwacja<\/b><span>Kulki „jądra” są ściśnięte w jeden punkt, kulki „elektronów” leżą na okręgach daleko od środka. Na kartce nie da się zachować skali — gdyby jądro miało wielkość ziarnka grochu, elektrony byłyby oddalone o kilkadziesiąt metrów.<\/span><b>Wniosek<\/b><span>Atom węgla: 6 p⁺ i 6 n⁰ w jądrze, 6 e⁻ wokół. Model nie zachowuje skali — w rzeczywistości jądro byłoby niewidocznie małe.<\/span><b>BHP<\/b><span>brak szczególnych zagrożeń.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 2 — Od atomu do jonu<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Co się zmienia, gdy atom sodu staje się kationem Na⁺, a chlor anionem Cl⁻?<\/span><b>Hipoteza<\/b><span>Zmienia się tylko liczba elektronów; jądra zostają takie same.<\/span><b>Sprzęt<\/b><span>model atomu Na (11 p⁺, 12 n⁰, 11 e⁻) i Cl (17 p⁺, 18 n⁰, 17 e⁻) z kulek lub na kartce.<\/span><b>Przebieg<\/b><span>Zabierz jeden elektron z modelu Na i dołóż go do modelu Cl. Policz p, n, e w obu.<\/span><b>Obserwacja<\/b><span>Na: 11 p⁺, 12 n⁰, 10 e⁻ (ładunek +1); Cl: 17 p⁺, 18 n⁰, 18 e⁻ (ładunek −1).<\/span><b>Wniosek<\/b><span>Jon powstaje przez przeniesienie elektronów; liczba protonów, a więc pierwiastek, się nie zmienia. Suma ładunków obu jonów wynosi zero.<\/span><b>Równanie<\/b><span class=\"formula\">Na → Na⁺ + e⁻ ; Cl + e⁻ → Cl⁻ (zapis modelowy dla pojedynczych atomów; reakcję całości — 2 Na + Cl₂ → 2 NaCl — poznasz w F11 i F17)<\/span><b>BHP<\/b><span>brak — doświadczenie modelowe.<\/span><\/div><\/div>\n<\/section>\n<section id=\"klinika\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Klinika błędów<\/div>\n<table class=\"klinika-table\"><thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><\/tr><\/thead><tbody><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Na⁺ ma 11 elektronów.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Na⁺ ma 10 elektronów.<\/td><td data-label=\"Dlaczego\">Kation oddał elektron: e = 11 − 1.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Al³⁺ ma 10 protonów.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Al³⁺ ma 13 protonów i 10 elektronów.<\/td><td data-label=\"Dlaczego\">Ładunek zmienia elektrony, nie protony.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„O²⁻ ma 6 elektronów.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">O²⁻ ma 10 elektronów.<\/td><td data-label=\"Dlaczego\">Anion przyjął: e = 8 − (−2) = 10.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„A to liczba neutronów.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">A = protony + neutrony; neutrony = A − Z.<\/td><td data-label=\"Dlaczego\">A dotyczy całego jądra.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Elektron krąży po orbicie jak planeta.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Model powłokowy to uproszczenie.<\/td><td data-label=\"Dlaczego\">Elektron opisuje się obszarem prawdopodobieństwa (F07).<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Atom ma zawsze tyle samo neutronów co protonów.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Liczba neutronów zależy od nuklidu.<\/td><td data-label=\"Dlaczego\">²³Na: 11 p⁺, 12 n⁰; ³⁵Cl: 17 p⁺, 18 n⁰.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Zmiana liczby elektronów zmienia pierwiastek.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Powstaje jon tego samego pierwiastka.<\/td><td data-label=\"Dlaczego\">Pierwiastek definiuje Z.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Neutrony decydują o ładunku.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Ładunek decydują protony i elektrony; neutrony są obojętne.<\/td><td data-label=\"Dlaczego\">Neutron ma ładunek 0.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„A − Z to liczba elektronów.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">A − Z to liczba neutronów.<\/td><td data-label=\"Dlaczego\">Elektrony liczy się z Z i ładunku.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„W jonie zmieniają się neutrony.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">W jonie zmienia się liczba elektronów; neutrony zostają.<\/td><td data-label=\"Dlaczego\">Jon to zmiana elektronów.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Kation jest większy od atomu.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Kation jest zwykle mniejszy — ma mniej elektronów (promienie w F06).<\/td><td data-label=\"Dlaczego\">Mniej elektronów, mniejsze odpychanie.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Atom to kulka.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Kulka to model; rzeczywisty atom nie ma ostrej granicy (F07).<\/td><td data-label=\"Dlaczego\">Model uczy, ale ma zakres stosowania.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Zamieniam elektron na proton, żeby zrobić jon.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Jon powstaje przez zmianę liczby elektronów; zmiana protonu zmienia pierwiastek.<\/td><td data-label=\"Dlaczego\">Proton jest w jądrze i nie zmienia się w reakcji chemicznej.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Atom jest niepodzielny.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Atom składa się z jądra (protony, neutrony) i elektronów; w reakcjach chemicznych się nie dzieli, ale nie jest niepodzielny.<\/td><td data-label=\"Dlaczego\">„átomos” to nazwa historyczna (Demokryt, Dalton).<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Liczba masowa to masa atomowa.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">A to liczba protonów i neutronów jednego nuklidu (liczba całkowita); masa atomowa to średnia ważona mas izotopów.<\/td><td data-label=\"Dlaczego\">Cl: A = 35 lub 37, a masa atomowa ≈ 35,5 u.<\/td><\/tr><\/tbody><\/table>\n<\/section>\n<section id=\"cwiczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Ćwiczenia<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">A. Podstawa (4 pkt)<\/span>\n<ol>\n<li>Podaj liczbę p⁺, n⁰, e⁻ dla: ¹⁶O, ²⁴Mg, ⁴⁰Ar (Z: O 8, Mg 12, Ar 18).<\/li>\n<li>Ile elektronów mają jony: Na⁺, Cl⁻, Mg²⁺, O²⁻?<\/li>\n<li>Uzupełnij: atom obojętny ma tyle elektronów co …; kation … elektrony; anion … elektrony.<\/li>\n<li>Co definiuje pierwiastek?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>¹⁶O: 8, 8, 8; ²⁴Mg: 12, 12, 12; ⁴⁰Ar: 18, 22, 18.<\/li>\n<li>Na⁺ 10; Cl⁻ 18; Mg²⁺ 10; O²⁻ 10.<\/li>\n<li>protonów; oddał; przyjął.<\/li>\n<li>Liczba protonów (Z).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">B. Trening (4 pkt)<\/span>\n<ol>\n<li>Atom ma Z = 17 i A = 35. Podaj p⁺, n⁰, e⁻. Ile elektronów ma jego anion z ładunkiem −1?<\/li>\n<li>Jon ma 12 protonów i 10 elektronów. Jaki ma ładunek i jaki to pierwiastek?<\/li>\n<li>Dla ²⁷₁₃Al³⁺ wyznacz p, n, e.<\/li>\n<li>Popraw: „Na⁺ ma 11 elektronów”; „Al³⁺ ma 10 protonów”.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>17, 18, 17; anion Cl⁻ ma 18 e⁻.<\/li>\n<li>q = 12 − 10 = +2; Z = 12 → magnez, Mg²⁺.<\/li>\n<li>p = 13, n = 14, e = 10.<\/li>\n<li>Na⁺ ma 10 elektronów; Al³⁺ ma 13 protonów i 10 elektronów.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">C. Ambitne <span class=\"level-badge level-extra\">AMBITNE<\/span><\/span>\n<ol>\n<li>Atom X ma 20 elektronów i A = 40. Jaki to pierwiastek i ile ma neutronów?<\/li>\n<li>Czy ²⁷₁₃Al i ²⁷₁₄Si są izotopami? Uzasadnij.<\/li>\n<li>Jakie wnioski wyciągnął Rutherford z obserwacji, że nieliczne cząstki α odbijały się do tyłu?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>Atom obojętny → Z = 20 → wapń; n = 40 − 20 = 20.<\/li>\n<li>Nie — mają różne Z, więc to różne pierwiastki (to izobary).<\/li>\n<li>Że w atomie jest małe, dodatnie i bardzo ciężkie jądro — odbicie wymaga zderzenia z czymś masywnym i silnie dodatnim.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">D. Zaawansowane <span class=\"level-badge level-extra\">AMBITNE<\/span><\/span>\n<ol>\n<li>Ile neutronów ma ¹⁴C (Z = 6)? Ile elektronów ma jon C⁴⁺?<\/li>\n<li>Dlaczego atom jako całość jest elektrycznie obojętny, choć zbudowany z naładowanych cząstek?<\/li>\n<li>Oszacuj: ile razy masa protonu jest większa od masy elektronu? Dlaczego masę elektronów zwykle pomijamy przy liczeniu masy atomu?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>14 − 6 = 8 neutronów; C⁴⁺: 6 − 4 = 2 elektrony.<\/li>\n<li>Ładunki protonów (+) i elektronów (−) mają tę samą wartość, a ich liczby są równe — sumują się do zera.<\/li>\n<li>Ok. 1836 razy; elektrony stanowią poniżej 0,1% masy atomu.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">E. Transfer — myślenie chemika<\/span>\n<p>Uczeń twierdzi: „W reakcji sodu z chlorem sód zamienił się w inny pierwiastek, bo zmienił ładunek”. Oceń to twierdzenie schematem twierdzenie → dowód → wyjaśnienie.<\/p>\n<details class=\"answer\"><summary>Przykładowy kierunek<\/summary>\n<p>Twierdzenie jest fałszywe. Dowód: Na⁺ ma nadal 11 protonów (Z = 11). Wyjaśnienie: ładunek powstał przez oddanie elektronu; o tożsamości pierwiastka decyduje Z, a zwykła reakcja chemiczna nie zmienia jąder.<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">F. Utrwalenie — p, n, e (4 pkt)<\/span>\n<ol>\n<li>Oblicz liczbę protonów, neutronów i elektronów w ³⁵₁₇Cl.<\/li>\n<li>Ile elektronów ma jon O²⁻?<\/li>\n<li>Zapisz symbol nuklidu, który ma 13 protonów i 14 neutronów.<\/li>\n<li>Wyjaśnij, dlaczego ¹²C i ¹⁴C są izotopami.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>p = 17, n = 35 − 17 = 18, e = 17.<\/li>\n<li>Tlen: Z = 8; jon O²⁻ przyjął 2 elektrony → 10 elektronów.<\/li>\n<li>²⁷₁₃Al (Z = 13 → glin; A = 13 + 14 = 27).<\/li>\n<li>Oba mają 6 protonów (to ten sam pierwiastek — węgiel), ale różną liczbę neutronów: 6 i 8.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">G. Z bez podanego Z i jony (4 pkt)<\/span>\n<ol>\n<li>Ile protonów mają ²⁷Al, ¹⁹F, ³⁹K? (Z odczytaj z tabeli z §2.)<\/li>\n<li>Jon X³⁻ ma 18 elektronów. Jaki to pierwiastek?<\/li>\n<li>Cząstka X ma 9 p⁺, 10 n⁰, 10 e⁻. Jaki to jon i jaki nuklid?<\/li>\n<li>Zapisz nuklid, który ma 16 protonów, 16 neutronów i ładunek 2−.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>13, 9, 19. 2. Z = 18 − 3 = 15 → fosfor (P³⁻). 3. Z = 9 → fluor; ładunek 9 − 10 = −1 → ¹⁹F⁻ (A = 9 + 10 = 19). 4. Z = 16 → siarka; A = 32 → ³²₁₆S²⁻.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"ciekawostki\">\n<div class=\"part-heading\"><span class=\"part-num\">9.5<\/span> Ciekawostki<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Neutron odkryty dopiero w 1932 roku<\/span>\n<p>Elektron znano od 1897 r. (J.J. Thomson), jądro od 1911 r. (Rutherford), ale neutron — jako cząstka bez ładunku — długo się ukrywał. Odkrył go James Chadwick w 1932 r. i dostał za to Nagrodę Nobla.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Jesteśmy z gwiazd<\/span>\n<p>Wodór i większość helu powstały tuż po Wielkim Wybuchu, ale węgiel, tlen czy żelazo w twoim ciele „wykuły się” w jądrach gwiazd — w reakcjach jądrowych, które zmieniają liczbę protonów. Cięższe pierwiastki rozsiały wybuchy gwiazd. Najcięższe pierwiastki powstają m.in. przy zderzeniach gwiazd neutronowych.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Jony w twoich nerwach<\/span>\n<p>Każdy impuls nerwowy to przepływ jonów — głównie Na⁺ i K⁺ — przez błonę komórki nerwowej. Kiedy czytasz to zdanie, miliardy kationów sodu i potasu przemieszczają się w twoim mózgu. Most do biologii: układ nerwowy (lekcja BIO.07.U08).<\/p>\n<\/div>\n<\/section>\n<section id=\"olimpijska\">\n<div class=\"part-heading\"><span class=\"part-num\">9.6<\/span> Warstwa olimpijska — Dla olimpijczyka<\/div>\n<p><em>(Warstwa ponad E8 — zadania w stylu konkursów chemicznych.)<\/em><\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dla olimpijczyka — gdzie zapis nuklidu zastawia pułapki<\/span>\n<p><strong>Jony izoelektronowe<\/strong> — różne jony o tej samej liczbie elektronów: O²⁻, F⁻, Ne, Na⁺, Mg²⁺, Al³⁺ mają po 10 e⁻. Im większe Z przy tej samej liczbie elektronów, tym silniej jądro je przyciąga — dlatego Al³⁺ jest mniejszy od O²⁻. <strong>Izotony<\/strong> — nuklidy o tej samej liczbie neutronów (np. ¹⁴C i ¹⁶O: po 8 neutronów). <strong>Zadania odwrotne<\/strong> — z liczby elektronów i ładunku wyznacz Z, a potem symbol: X²⁻ z 18 e⁻ → Z = 18 + (−2) = 16 → siarka. <strong>Wodór bez neutronu<\/strong> — ¹H ma 0 neutronów, a jon H⁺ to „goły” proton, bez żadnego elektronu.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Zadanie O1 (4 pkt) — jony izoelektronowe <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Spośród: Na⁺, K⁺, Cl⁻, F⁻, Mg²⁺, S²⁻, Ar, Ne wybierz dwie grupy cząstek izoelektronowych i podaj liczbę elektronów w każdej grupie.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>10 e⁻: Na⁺, F⁻, Mg²⁺, Ne (2 pkt); 18 e⁻: K⁺, Cl⁻, S²⁻, Ar (2 pkt).<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O2 (4 pkt) — zadanie odwrotne <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<ol>\n<li>Jon X³⁺ ma 10 elektronów i 14 neutronów. Podaj symbol pierwiastka i zapis nuklidu.<\/li>\n<li>Jon Y²⁻ ma 18 elektronów i 16 neutronów. Podaj symbol i zapis nuklidu.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<ol>\n<li>Z = 10 + 3 = 13 → Al; A = 13 + 14 = 27 → ²⁷₁₃Al³⁺ (2 pkt). 2. Z = 18 − 2 = 16 → S; A = 16 + 16 = 32 → ³²₁₆S²⁻ (2 pkt).<\/li>\n<\/ol>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O3 (3 pkt) — izotopy, izobary, izotony <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Sklasyfikuj pary: (a) ¹⁴C i ¹⁴N, (b) ¹²C i ¹³C, (c) ¹³C i ¹⁴N.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) izobary — A = 14, różne Z; (b) izotopy — Z = 6; (c) izotony — po 7 neutronów (13 − 6 = 7, 14 − 7 = 7). Po 1 pkt.<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O4 (3 pkt) — który jon jest mniejszy? <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Uszereguj jony O²⁻, Na⁺, Mg²⁺, F⁻ od największego do najmniejszego i uzasadnij.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>O²⁻ > F⁻ > Na⁺ > Mg²⁺ (2 pkt) — wszystkie mają 10 e⁻; im więcej protonów, tym silniej jądro przyciąga tę samą liczbę elektronów i tym mniejszy jon (1 pkt).<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O5 (2 pkt) — ładunek jonu <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Ładunek jonu o liczbie atomowej Z = 8 wynosi −3,2 · 10⁻¹⁹ C (ładunek elementarny e = 1,6 · 10⁻¹⁹ C). Ile elektronów ma ten jon?<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>q = −3,2 · 10⁻¹⁹ : 1,6 · 10⁻¹⁹ = −2 (1 pkt); e = Z − q = 8 + 2 = 10 — jon O²⁻ (1 pkt).<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O6 (2 pkt) — masa atomu i liczba atomów <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Oszacuj masę jednego atomu ¹²C w gramach (1 u ≈ 1,66 · 10⁻²⁴ g). Ile atomów ¹²C jest w 12 g tego izotopu?<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>m ≈ 12 · 1,66 · 10⁻²⁴ g ≈ 2,0 · 10⁻²³ g (1 pkt); liczba atomów 12 g : 1,99 · 10⁻²³ g ≈ 6,0 · 10²³ (1 pkt).<\/p>\n<\/details>\n<\/div><\/details>\n<\/section>\n<section id=\"test\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Test<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Z to liczba protonów — ona definiuje pierwiastek.\"><h5>1. Liczba atomowa Z to liczba:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">protonów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">neutronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">protonów i neutronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">elektronów w jonie<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"n = A − Z = 23 − 11.\"><h5>2. Ile neutronów ma ²³₁₁Na?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">11<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">12<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">23<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">34<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Anion przyjął 1 elektron.\"><h5>3. Ile elektronów ma jon Cl⁻ (Z = 17)?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">16<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">17<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">18<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"e = Z − q = 13 − 3 = 10.\"><h5>4. Ile elektronów ma jon Al³⁺ (Z = 13)?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">10<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">13<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">16<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Kation oddał elektrony; protony zostają.\"><h5>5. Kation to atom, który:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">oddał elektrony<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">przyjął elektrony<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">stracił protony<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">zyskał neutrony<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Pierwiastek definiuje Z.\"><h5>6. Co definiuje pierwiastek?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">liczba neutronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">liczba protonów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">liczba elektronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">liczba masowa<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Jądro ma prawie całą masę atomu.\"><h5>7. Gdzie skupiona jest prawie cała masa atomu?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">w jądrze<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">w elektronach<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">równo w całym atomie<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Z = 8 → tlen; ładunek 8 − 10 = −2.\"><h5>8. Jon ma 8 protonów i 10 elektronów. To:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">Ne<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">O²⁻<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">O²⁺<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Rutherford: małe, dodatnie, ciężkie jądro.\"><h5>9. Doświadczenie Rutherforda pokazało, że:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">atom jest niepodzielną kulką<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">w atomie jest małe, dodatnie jądro<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">elektrony krążą po orbitach<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"17 protonów; n = 37 − 17 = 20.\"><h5>10. Zapis ³⁷₁₇Cl oznacza atom z:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">37 protonami<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">17 protonami i 20 neutronami<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">17 neutronami i 20 protonami<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"e = Z − q = 16 − (−2) = 18.\"><h5>11. Ile elektronów ma jon S²⁻ (Z = 16)?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">14<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">16<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">18<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"q = p − e = 15 − 18 = −3 (to jon fosforu P³⁻).\"><h5>12. Jon ma 15 protonów i 18 elektronów. Jego ładunek to:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">+3<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">−3<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">0<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Atom ≈ 10⁻¹⁰ m, jądro ≈ 10⁻¹⁵ m.\"><h5>13. Jak ma się wielkość jądra do atomu?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">jądro jest większe od atomu<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">jądro jest rzędu 10⁴–10⁵ razy mniejsze od atomu<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">jądro i atom mają tę samą wielkość<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Z to liczba protonów (dolny indeks), A — górny.\"><h5>14. Zapis ¹⁴₆C oznacza:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">Z = 6, A = 14<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Z = 14, A = 6<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">Z = 8, A = 6<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Zwykły wodór nie ma neutronów.\"><h5>15. Ile protonów i neutronów ma zwykły atom ¹H?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">1 proton i 0 neutronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">1 proton i 1 neutron<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">0 protonów i 1 neutron<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Zmienia się liczba elektronów; protony i pierwiastek zostają.\"><h5>16. Co zmienia się, gdy atom sodu staje się jonem Na⁺?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">liczba protonów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">liczba elektronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">pierwiastek<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Rutherford w 1911 r. na podstawie doświadczenia z folią złotą.\"><h5>17. Który model atomu wprowadził jądro?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">Rutherford<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Dalton<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">Bohr<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Z = 9 → fluor; ładunek 9 − 10 = −1.\"><h5>18. Cząstka X ma 9 p⁺, 10 n⁰ i 10 e⁻. To jon:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">F⁻<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Ne<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">O²⁻<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section id=\"powtorka\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Karta szybkiego powtórzenia i mapa myśli<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Na jednej stronie<\/span>\n<ul>\n<li><strong>Atom<\/strong> = jądro (p⁺ + n⁰) + elektrony. p⁺: +1, ok. 1 u; n⁰: 0, ok. 1 u; e⁻: −1, ≈ 0,00055 u.<\/li>\n<li><strong>Z<\/strong> = protony = tożsamość pierwiastka. <strong>A<\/strong> = p + n. <strong>n = A − Z.<\/strong> Atom obojętny: <strong>e = Z<\/strong>.<\/li>\n<li><strong>Jon:<\/strong> e = Z − q. Kation oddał (Na⁺: 10 e⁻), anion przyjął (Cl⁻: 18 e⁻). Protony bez zmian.<\/li>\n<li><strong>Zmień Z<\/strong> → inny pierwiastek · <strong>zmień n<\/strong> → izotop · <strong>zmień e<\/strong> → jon.<\/li>\n<li><strong>Modele:<\/strong> Dalton → Thomson → Rutherford (jądro) → Bohr (powłoki) → kwantowy (orbitale).<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mapa myśli<\/span>\n<p><strong>ATOM<\/strong> → <em>jądro<\/em> (protony: Z · neutrony: A − Z) · <em>elektrony<\/em> (atom obojętny: e = Z · jon: e = Z − q)\n→ <em>zapis nuklidu<\/em> (A u góry, Z u dołu) → <em>izotopy<\/em> (F05) → <em>powłoki i konfiguracja<\/em> (F07) → <em>jony w związkach<\/em> (F09–F11)<\/p>\n<\/div>\n<\/section>\n<section id=\"fiszki\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Fiszki<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Liczba atomowa Z<\/span><span class=\"back\">liczba protonów; określa pierwiastek<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Liczba masowa A<\/span><span class=\"back\">protony + neutrony<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Liczba neutronów<\/span><span class=\"back\">n = A − Z<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Elektrony w atomie obojętnym<\/span><span class=\"back\">e = Z<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Elektrony w jonie<\/span><span class=\"back\">e = Z − q<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Kation<\/span><span class=\"back\">jon dodatni — oddał elektrony<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Anion<\/span><span class=\"back\">jon ujemny — przyjął elektrony<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Na⁺<\/span><span class=\"back\">11 p⁺, 12 n⁰, 10 e⁻<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Cl⁻ (³⁵Cl)<\/span><span class=\"back\">17 p⁺, 18 n⁰, 18 e⁻<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Gdzie jest masa atomu?<\/span><span class=\"back\">prawie cała w jądrze<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Dlaczego e = Z − q?<\/span><span class=\"back\">q = p − e, więc e = Z − q; dla anionu q &lt; 0, elektronów przybywa<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Z kontra A<\/span><span class=\"back\">Z — protony, A — protony + neutrony; ¹⁴C: Z = 6, A = 14<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Nuklid<\/span><span class=\"back\">rodzaj atomu o określonych Z i A<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Pułapka znaku<\/span><span class=\"back\">O²⁻: e = 8 − (−2) = 10, nie 6<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Zapis nuklidu<\/span><span class=\"back\">u góry A, u dołu Z, np. ²³₁₁Na<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Co zmienia zmiana n?<\/span><span class=\"back\">inny izotop tego samego pierwiastka<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Zmiana Z / n / e<\/span><span class=\"back\">inny pierwiastek / izotop / jon<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jednostka u<\/span><span class=\"back\">1/12 masy atomu ¹²C ≈ 1,66 · 10⁻²⁴ g<\/span><span class=\"card-tag tag-extra\">ambitne<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Izobary<\/span><span class=\"back\">ten sam A, różne Z (⁴⁰Ar, ⁴⁰Ca)<\/span><span class=\"card-tag tag-extra\">ambitne<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Doświadczenie Rutherforda<\/span><span class=\"back\">odkrycie małego, dodatniego jądra<\/span><span class=\"card-tag tag-extra\">ambitne<\/span><\/button><\/div>\n<\/section>\n<section id=\"slownik\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Słownik<\/div>\n<dl><div class=\"def-item\"><dt>Atom<\/dt><dd>najmniejsza cząstka pierwiastka, zbudowana z jądra i elektronów, elektrycznie obojętna<\/dd><\/div><div class=\"def-item\"><dt>Jądro atomowe<\/dt><dd>centralna część atomu zawierająca protony i neutrony<\/dd><\/div><div class=\"def-item\"><dt>Proton<\/dt><dd>cząstka jądra o ładunku +1 i masie ok. 1 u<\/dd><\/div><div class=\"def-item\"><dt>Neutron<\/dt><dd>cząstka jądra bez ładunku, o masie ok. 1 u<\/dd><\/div><div class=\"def-item\"><dt>Elektron<\/dt><dd>cząstka o ładunku −1 i masie ≈ 1/1836 masy protonu (≈ 0,00055 u), znajdująca się wokół jądra<\/dd><\/div><div class=\"def-item\"><dt>Liczba atomowa Z<\/dt><dd>liczba protonów w jądrze<\/dd><\/div><div class=\"def-item\"><dt>Liczba masowa A<\/dt><dd>suma liczby protonów i neutronów w jądrze<\/dd><\/div><div class=\"def-item\"><dt>Nuklid<\/dt><dd>rodzaj atomu o określonej liczbie protonów i neutronów<\/dd><\/div><div class=\"def-item\"><dt>Jon<\/dt><dd>atom lub grupa atomów z ładunkiem elektrycznym<\/dd><\/div><div class=\"def-item\"><dt>Kation<\/dt><dd>jon dodatni<\/dd><\/div><div class=\"def-item\"><dt>Anion<\/dt><dd>jon ujemny<\/dd><\/div><div class=\"def-item\"><dt>Jednostka masy atomowej u<\/dt><dd>1/12 masy atomu węgla ¹²C<\/dd><\/div><div class=\"def-item\"><dt>Izotop<\/dt><dd>nuklidy o tym samym Z i różnym A (rozwinięcie w F05)<\/dd><\/div><div class=\"def-item\"><dt>Izobar<\/dt><dd>nuklidy o tym samym A i różnym Z (różne pierwiastki)<\/dd><\/div><div class=\"def-item\"><dt>Izoton<\/dt><dd>nuklidy o tej samej liczbie neutronów<\/dd><\/div><div class=\"def-item\"><dt>Ładunek elementarny<\/dt><dd>ładunek jednego protonu (+) lub elektronu (−), ok. 1,6 · 10⁻¹⁹ C<\/dd><\/div><div class=\"def-item\"><dt>Powłoka elektronowa<\/dt><dd>poziom energetyczny elektronów wokół jądra (K, L, M…)<\/dd><\/div><div class=\"def-item\"><dt>Orbital<\/dt><dd>obszar prawdopodobnego położenia elektronu (model kwantowy)<\/dd><\/div><div class=\"def-item\"><dt>Nukleon<\/dt><dd>wspólna nazwa protonu i neutronu<\/dd><\/div><div class=\"def-item\"><dt>Model atomu<\/dt><dd>uproszczony obraz budowy atomu, np. Rutherforda lub Bohra<\/dd><\/div><\/dl>\n<\/section>\n<section id=\"checklista\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Checklista<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Umiem…<\/span>\n<ul>\n<li>☐ opisać budowę atomu i podać ładunek oraz masę p⁺, n⁰, e⁻,<\/li>\n<li>☐ odczytać Z i A z zapisu nuklidu i policzyć p, n, e,<\/li>\n<li>☐ policzyć elektrony w kationie i anionie, pilnując znaku,<\/li>\n<li>☐ wyjaśnić, dlaczego Z definiuje pierwiastek,<\/li>\n<li>☐ powiedzieć, co zmienia zmiana Z, liczby neutronów i liczby elektronów,<\/li>\n<li>☐ (ambitnie) opisać doświadczenie Rutherforda i kolejne modele atomu.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"powtorki\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> System powtórek<\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Kiedy<\/th><th>Ile<\/th><th>Co<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>po lekcji<\/td><td>20 min<\/td><td>karta z <a href=\"#powtorka\">§11<\/a> i ćwiczenia A<\/td><\/tr>\n<tr><td>po 1 dniu<\/td><td>10 min<\/td><td>fiszki<\/td><\/tr>\n<tr><td>po 3 dniach<\/td><td>15 min<\/td><td>ćwiczenia B<\/td><\/tr>\n<tr><td>po tygodniu<\/td><td>20 min<\/td><td>test z <a href=\"#test\">§10<\/a><\/td><\/tr>\n<tr><td>po F05<\/td><td>25 min<\/td><td>F02 + F03 + F04 + F05 razem — zestaw przekrojowy z F21<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/section>\n<section id=\"mosty\">\n<div class=\"part-heading\"><span class=\"part-num\">A<\/span> Dodatek A — mosty i co dalej<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Powiązania<\/span>\n<ul>\n<li><strong>F02 Materia i substancje<\/strong> — pierwiastek jako rodzaj atomów; tu: co ten „rodzaj” znaczy (Z).<\/li>\n<li><strong>F05 Izotopy, jony i masa atomowa<\/strong> — następna lekcja: izotopy, typowe jony, masa atomowa jako średnia ważona.<\/li>\n<li><strong>F06 Układ okresowy<\/strong> — Z jako numer pierwiastka; położenie a elektrony walencyjne.<\/li>\n<li><strong>F07 Konfiguracja elektronowa<\/strong> — jak elektrony rozmieszczają się na powłokach K, L, M, N.<\/li>\n<li><strong>F09–F11<\/strong> — ładunek jonu w wzorach i wiązaniu jonowym.<\/li>\n<li><strong>A01–A03 Chemia jądrowa<\/strong> — przemiany, w których zmienia się jądro.<\/li>\n<li><strong>Elektrostatyka z fizyki<\/strong> — przyciąganie i odpychanie ładunków (lekcja spoza tej serii).<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"modele\">\n<div class=\"part-heading\"><span class=\"part-num\">↻<\/span> Modele silnika w tej lekcji<\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Sekcja<\/th><th>Model<\/th><th>Co pokazuje<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><a href=\"#nuklid\">§3<\/a><\/td><td><code>f04-nuklid-v01<\/code><\/td><td>trening: zapis nuklidu i liczenie p, n, e<\/td><\/tr>\n<tr><td><a href=\"#nuklid\">§3<\/a><\/td><td><code>periodic-54<\/code><\/td><td>układ okresowy 1–54 z modelami atomów — Z i liczba elektronów<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1 — audyt 04 (2026-10-13)<\/div>\n<p>Wprowadzono:\n- A1: masa elektronu ≈ 1/1836 masy protonu (≈ 0,00055 u) — we wszystkich miejscach.\n- A2: jedna skala (rzędu 10⁴–10⁵, z wymiarami); analogia ze stadionem zaznaczona jako przybliżenie.\n- A3: etykieta „Doświadczenie historyczne” + Geiger i Marsden 1909, Rutherford 1911.\n- A4: zdublowany wiersz kliniki usunięty (zostaje pełniejszy).\n- A5: zapis modelowy półreakcji (Na → Na⁺ + e⁻; Cl + e⁻ → Cl⁻) z odsyłaczem do F11/F17.\n- A6: obserwacja w doświadczeniu z plasteliny zastąpiona obserwacją skali.\n- A7: notka o rozpadzie β⁻ przy przykładzie ¹⁴C → ¹⁴N.\n- A8: uwaga o jonach złożonych (NH₄⁺, SO₄²⁻, OH⁻) z przykładem liczenia e.\n- A9: zapis nuklidu bez „_” (Minimum #7, §3, wykład, mapa).\n- B1: Demokryt, proton (Rutherford 1917–1919), neutron (Chadwick 1932) w tabeli historii; odchylenia Thomsona i zdanie Rutherforda opisane własnymi słowami.\n- B2: tabela Z 1–20 i zadanie bez podanego Z.\n- B3: tabela skali i liczb.\n- B4: sekcja G (Z bez podanego Z, jony, nuklid z ładunkiem).\n- B5: test — <code>!<\/code> przy każdym pytaniu, +6 pytań (S²⁻, ładunek z p i e, skala, ¹H, Na → Na⁺, Rutherford).\n- B6: fiszki (+7) i słownik (+8: izotop, izobar, izoton, ładunek elementarny, powłoka, orbital, nukleon, model atomu).\n- B7: klinika (+7 wierszy).\n- B8: olimpijska O5 (ładunek jonu) i O6 (masa atomu i liczba atomów); nagłówek bez „do zweryfikowania”.\n- B9: lekcje odwołane istnieją (F05–F07, F10, F11, F17, A01–A03, BIO.07.U08); FIZ-01 nie ma lekcji w repo — zamieniono na opis w tekście.\n- C: stan i stopka v1.1, tabela modeli (+<code>f04-nuklid-v01<\/code>), zdanie o odczycie Z z układu przed <code>periodic-54<\/code>, ciekawostka bez notki roboczej, changelog i notka GFX usunięte (notka w <code>chemia/plany/audyty/GFX_TODO_F04.md<\/code>).<\/p>\n<p>Nieprzyjęte:\n- C — <code>$$<\/code> w jednej linii (3×): zostaje; to konwencja silnika, jak w F01–F03.\n- C — kicker <code>MASTER v1.1<\/code>: zostaje; stopka ujednolicona do v1.1.\n- Odsyłacze <code>#mosty<\/code> do F05/F07/F10 zamieniono na nazwy lekcji (kotwica prowadziła do Dodatku A tej samej lekcji, a nie do wskazanej lekcji).<\/p>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA F04 v1.1 MASTER<\/strong> · Atom · 2026<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n"</script>
