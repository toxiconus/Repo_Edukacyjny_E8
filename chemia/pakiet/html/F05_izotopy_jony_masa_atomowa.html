ick=function(){s={p:z,n:d[2][0][0]-z,e:z};start={p:s.p,n:s.n,e:s.e};draw()};pick.appendChild(b)});\n  var ctl=el('div','bar');host.appendChild(ctl);\n  [['p','proton'],['n','neutron'],['e','elektron']].forEach(function(c){\n   var m=el('button','o','− '+c[1]),p=el('button','o','+ '+c[1]);m.type=p.type='button';\n   m.onclick=function(){if(s[c[0]]>(c[0]==='p'?1:0)){s[c[0]]--;draw()}};p.onclick=function(){if(s[c[0]]<(c[0]==='p'?20:c[0]==='n'?30:22)){s[c[0]]++;draw()}};ctl.append(m,p)});\n  var g=el('div','two'),pic=el('div'),txt=el('div');g.append(pic,txt);host.appendChild(g);\n  var avg=el('div');host.appendChild(avg);\n  var stopAnim=null;\n  function sym(z){var d=izo(z);return d?d[0]:('Z='+z)}\n  function draw(){var A=s.p+s.n,q=s.p-s.e,X=sym(s.p),d=izo(s.p);\n   /* rysunek: jądro (p czerwone, n szare) + elektrony na jednym okręgu (rozmieszczenie na powłokach — F07) */\n   var n0=d&&d[2].length?d[2][0][0]-s.p:s.n;   /* obręcz na neutronach ponad najczęstszy izotop — jak w atlasie */\n   pic.innerHTML='<canvas width=\"520\" height=\"520\" style=\"width:100%;max-width:320px;display:block;margin:auto;border-radius:12px\" role=\"img\" aria-label=\"Model atomu: '+s.p+' p, '+s.n+' n, '+s.e+' e\"><\/canvas><div class=\"nt\" style=\"text-align:center\"><span style=\"color:#d6452b\">●<\/span> proton &nbsp; <span style=\"color:#6f7882\">●<\/span> neutron &nbsp; <span style=\"color:#2f8a55\">●<\/span> elektron wewnętrzny &nbsp; <span style=\"color:#b85f00\">●<\/span> elektron walencyjny <small>(powłoki K, L, M, N jak w atlasie — model szkolny 2, 8, 8; obwódka = neutron ponad najczęstszy izotop)<\/small><\/div>';\n   if(stopAnim)stopAnim();var AB=C.LAB&&C.LAB.atomBohr;stopAnim=AB?AB.anim(pic.firstChild,{p:s.p,n:s.n,e:s.e,n0:n0,lupa:true,zoom:1.4}):null;\n   var iso=d&&d[2].filter(function(x){return x[0]===A})[0];\n   var zm=[];if(s.p!==start.p)zm.push('<b>zmieniła się liczba protonów<\/b> → to już <b>inny pierwiastek<\/b> ('+sym(start.p)+' → '+X+')');\n   else{if(s.n!==start.n)zm.push('zmieniła się liczba neutronów → <b>inny izotop<\/b> tego samego pierwiastka');if(s.e!==start.e)zm.push('zmieniła się liczba elektronów → <b>jon<\/b>, pierwiastek ten sam')}\n   txt.innerHTML='<div class=\"eq\" style=\"font-size:22px\">'+supN(A)+subN(s.p)+X+chg(q)+'<\/div>'+\n    '<div class=\"nt\"><b>'+(d?d[1]:X)+'<\/b> · Z = '+s.p+' · A = '+A+'<br>p⁺ = '+s.p+' · n⁰ = A − Z = '+s.n+' · e⁻ = '+s.e+\n    '<br><b>Ładunek<\/b> q = p − e = '+(q>0?'+':'')+q+' → '+(q===0?'atom obojętny':q>0?'<b>kation<\/b> (oddał '+q+' e⁻)':'<b>anion<\/b> (przyjął '+(-q)+' e⁻)')+\n    '<br><b>Izotop:<\/b> '+(!d||!d[2].length?'— (brak danych w modelu)':iso?(iso[2]>0?'naturalny, udział '+pl(iso[2],iso[2]<1?3:2)+'%':'występuje śladowo / promieniotwórczy'):'nieznany w przyrodzie — jądro nietrwałe lub nie istnieje')+'<\/div>'+\n    '<div class=\"nt\"><b>Co się zmieniło względem startu:<\/b><br>'+(zm.length?zm.join('<br>'):'nic — stan startowy (atom obojętny, najczęstszy izotop)')+'<\/div>';\n   /* średnia ważona */\n   if(!d||!d[2].length){avg.innerHTML='';return}\n   var rows=d[2].filter(function(x){return x[2]>0}),M=0,t='';rows.forEach(function(x){var w=x[1]*x[2]/100;M+=w;\n    t+='<tr><td>'+supN(x[0])+d[0]+'<\/td><td>'+pl(x[1],3)+' u<\/td><td>'+pl(x[2],x[2]<1?3:2)+'%<\/td><td>'+pl(w,3)+' u<\/td><td><div style=\"height:10px;width:'+Math.max(1,x[2]).toFixed(0)+'%;background:#2f7bd8;border-radius:3px\"><\/div><\/td><\/tr>'});\n   avg.innerHTML='<div class=\"nt\" style=\"margin-top:10px\"><b>Masa atomowa '+d[0]+' = średnia ważona mas izotopów<\/b> (masa × udział, potem suma):<\/div>'+\n    '<div class=\"table-wrap\"><table><thead><tr><th>izotop<\/th><th>masa<\/th><th>udział<\/th><th>wkład<\/th><th><\/th><\/tr><\/thead><tbody>'+t+'<\/tbody><\/table><\/div>'+\n    '<div class=\"eq\">Ar('+d[0]+') ≈ '+pl(M,M<100?2:1)+' u'+(rows.length>1?' — wynik leży między masami izotopów, bliżej najczęstszego':' — jeden trwały izotop, więc masa atomowa ≈ jego masa')+'<\/div>'}\n  draw()}});\n\n/* ---------- 9. F06 — rozbudowa istniejącego `periodic-54` (bez nowej tablicy) ----------\n   Dokłada tryby: okres i grupa zaznaczonego, blok s/p/d, elektrony walencyjne, promień kowalencyjny, I energia jonizacji,\n   oraz kartę „adres → elektrony → przewidywanie”. Dane: CHE.DATA.ELEMENTS_54, ATOM_META (powłoki), ATOMIC_PROPS\n   (promień kowalencyjny), FIRST_IONIZATION_ENERGY (NIST). Braki promieni uzupełnia D.COVALENT_RADIUS_EXT (do weryfikacji). */\nif(!D.COVALENT_RADIUS_EXT)D.COVALENT_RADIUS_EXT={unit:'pm',source:'Cordero i in., Dalton Trans. 2008 (promienie kowalencyjne; Mn, Fe, Co — niskospinowe) — do weryfikacji',\n values:{Li:128,Be:96,B:84,Ne:58,Ar:106,Sc:170,Ti:160,V:153,Cr:139,Mn:139,Co:126,Ni:124,Ga:122,Ge:120,As:119,Se:120,Br:120,Kr:116,Rb:220,Sr:195,Y:190,Zr:175,Nb:164,Mo:154,Tc:147,Ru:146,Rh:142,Pd:139,Cd:144,In:142,Sn:139,Sb:139,Te:138,Xe:140}};\n(function(){\n var P54=V.views&&V.views.get&&V.views.get('periodic-54');if(!P54||P54._f06)return;\n var ROM=['','I','II','III','IV','V','VI','VII','VIII'],SH='KLMNOP';\n var FAM={1:'litowce (metale alkaliczne)',2:'berylowce',13:'borowce',14:'węglowce',15:'azotowce',16:'tlenowce',17:'fluorowce (halogeny)',18:'helowce (gazy szlachetne)'};\n function rad(s){var p=(D.ATOMIC_PROPS||{})[s];if(p&&p.covalentRadius)return p.covalentRadius;return (D.COVALENT_RADIUS_EXT.values||{})[s]||null}\n function ie(s){var x=(D.FIRST_IONIZATION_ENERGY||{})[s];return x&&x.value?x.value*96.485:null}/* eV → kJ/mol */\n function main(e){return e.g<=2||e.g>=13}\n function val(e){if(e.s==='He')return 2;if(!main(e))return null;return e.g<=2?e.g:e.g-10}\n function blk(e){return e.block||(e.s==='He'||e.g<=2?'s':e.g>=13?'p':'d')}\n function shells(e){var m=(D.ATOM_META||{})[e.s];return m&&m.shells?m.shells:null}\n function ion(e){var v=val(e);\n  if(e.s==='H')return 'H⁺ (w kwasach) albo H⁻ (w wodorkach metali, N05) — wyjątek';\n  if(e.t==='noble')return 'nie tworzy jonów — zewnętrzna powłoka zapełniona ('+(e.s==='He'?'dublet':'oktet')+')';\n  if(!m  /^\\s*▶\\s*krok/i.test(b.textContent)})[0],\n       rep=bs.filter(function(b){return /▶\\s*(powtórz|odtwórz|wykonaj|start)/i.test(b.textContent)});\n   if(!krok&&!rep.length)return;el._cheAuto=1;el.setAttribute('data-che-auto-ok','');\n   if(krok)C.AUTO(el,function(){var k=[].slice.call(el.querySelectorAll('button')).filter(function(b){return /^\\s*▶\\s*krok/i.test(b.textContent)&&vis(b)})[0];if(!k)return;\n     if(k.disabled){var r=[].slice.call(el.querySelectorAll('button')).filter(function(b){return /od nowa|od początku|reset|↺/i.test(b.textContent)&&vis(b)})[0];if(r)r.click()}else k.click()},2200);\n   else{var ri=-1;C.AUTO(el,function(){var r=[].slice.call(el.querySelectorAll('button')).filter(function(b){return /▶\\s*(powtórz|odtwórz|wykonaj|start)/i.test(b.textContent)&&vis(b)});if(!r.length)return;ri=(ri+1)%r.length;r[ri].click()},rep.length>1?4500:8000)}})}\n function start(){skan();setInterval(skan,2500)}\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();\n\n<\/script>\n<a class=\"skip-link\" href=\"#main\">Przejdź do treści<\/a>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">F05 · FUNDAMENTY · MASTER v1.1<\/div><h1>Izotopy, jony i masa atomowa<\/h1><p class=\"lead\">Druga lekcja fazy B. W F04 nauczyłeś się liczyć protony, neutrony i elektrony. Teraz porządkujemy trzy różne „odmiany” atomu —<\/p><p class=\"lead\">izotop, jon i atom innego pierwiastka — i wyjaśniamy, dlaczego masa atomowa chloru w układzie okresowym to 35,45, a nie 35 albo 37.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-extra\">AMBITNE (LO)<\/span><\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><\/section>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#jak-pracowac\">0.1. Jak pracować z lekcją<\/a><a class=\"toc-link\" href=\"#cele\">0.2. Cele lekcji i pytanie przewodnie<\/a><a class=\"toc-link\" href=\"#kompas\">0.3. Kompas — co trzeba wiedzieć wcześniej<\/a><a class=\"toc-link\" href=\"#diagnoza\">0.4. Diagnoza startowa<\/a><a class=\"toc-link\" href=\"#wyklad\">0.5. Wykład — izotopy, jony i masa atomowa od zera<\/a><a class=\"toc-link\" href=\"#izotopy\">1. Nuklid i izotopy<\/a><a class=\"toc-link\" href=\"#jony\">2. Jony proste i wieloatomowe<\/a><a class=\"toc-link\" href=\"#trzy-zmiany\">3. Izotop, jon czy inny pierwiastek? Trzy różne zmiany<\/a><a class=\"toc-link\" href=\"#masa-atomowa\">4. Masa atomowa — średnia ważona izotopów<\/a><a class=\"toc-link\" href=\"#masy\">5. Liczba masowa, masa izotopu, masa atomowa, masa cząsteczkowa<\/a><a class=\"toc-link\" href=\"#ambitne\">6. Izobary, izotopy promieniotwórcze, zadanie odwrotne<\/a><a class=\"toc-link\" href=\"#doswiadczenia\">6.5. Doświadczenia modelowe<\/a><a class=\"toc-link\" href=\"#klinika\">7. Klinika błędów<\/a><a class=\"toc-link\" href=\"#nie-myl\">7.5. Nie myl!<\/a><a class=\"toc-link\" href=\"#cwiczenia\">8. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#ciekawostki\">8.5. Ciekawostki<\/a><a class=\"toc-link\" href=\"#olimpijska\">8.6. Warstwa olimpijska — Dla olimpijczyka<\/a><a class=\"toc-link\" href=\"#test\">9. Test<\/a><a class=\"toc-link\" href=\"#powtorka\">10. Karta szybkiego powtórzenia i mapa myśli<\/a><a class=\"toc-link\" href=\"#fiszki\">11. Fiszki<\/a><a class=\"toc-link\" href=\"#slownik\">12. Słownik<\/a><a class=\"toc-link\" href=\"#checklista\">13. Checklista<\/a><a class=\"toc-link\" href=\"#powtorki\">14. System powtórek<\/a><a class=\"toc-link\" href=\"#mosty\">A. Dodatek A — mosty i co dalej<\/a><\/nav><\/details>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć na E8 — 10 punktów<\/h3>\n<ol>\n<li><strong>Izotopy<\/strong> to atomy tego samego pierwiastka: <strong>to samo Z<\/strong> (te same protony), <strong>różna liczba neutronów<\/strong>, więc różne A. Przykład: ³⁵Cl i ³⁷Cl.<\/li>\n<li><strong>Nuklid<\/strong> to konkretny rodzaj jądra opisany przez Z i A, np. ³⁷₁₇Cl.<\/li>\n<li><strong>Jon<\/strong> powstaje przez <strong>zmianę liczby elektronów<\/strong> — liczba protonów się nie zmienia, pierwiastek zostaje ten sam.<\/li>\n<li><strong>Kation<\/strong> (+) ma <strong>mniej<\/strong> elektronów niż protonów, <strong>anion<\/strong> (−) — <strong>więcej<\/strong>. Elektrony w jonie: <strong>e = Z − q<\/strong>.<\/li>\n<li>Cl⁻ ma 17 protonów i <strong>18 elektronów<\/strong>; Mg²⁺ ma 12 protonów i <strong>10 elektronów<\/strong>.<\/li>\n<li>Jon może być <strong>wieloatomowy<\/strong>: SO₄²⁻, NO₃⁻, NH₄⁺ — ładunek należy do całej grupy.<\/li>\n<li><strong>Zmiana Z<\/strong> → inny pierwiastek · <strong>zmiana n<\/strong> → inny izotop · <strong>zmiana e<\/strong> → jon. To trzy różne zmiany.<\/li>\n<li><strong>Masa atomowa<\/strong> pierwiastka (z układu okresowego) to <strong>średnia ważona<\/strong> mas jego izotopów — dlatego zwykle nie jest liczbą całkowitą.<\/li>\n<li><strong>A ≠ masa atomowa<\/strong>: A jest liczbą całkowitą dla jednego nuklidu; masa atomowa dotyczy naturalnej mieszaniny izotopów (chlor: 35,45 u).<\/li>\n<li>Średnia ważona leży <strong>między<\/strong> masami izotopów i <strong>bliżej najczęstszego<\/strong> izotopu.<\/li>\n<\/ol>\n<\/section>\n<div class=\"layer-legend\">\n<div class=\"layer-row\"><span class=\"dot e8\"><\/span><span><b>E8:<\/b> izotopy i nuklid; liczenie p, n, e w izotopach i jonach; jony proste i wieloatomowe; masa atomowa jako średnia; A ≠ masa atomowa<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot understand\"><\/span><span><b>Rozumienie:<\/b> izotop, jon i inny pierwiastek jako trzy różne zmiany; dlaczego izotopy mają podobne właściwości chemiczne; obliczanie średniej ważonej<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot extra\"><\/span><span><b>Ambitne (LO):<\/b> izobary; izotopy promieniotwórcze i ich zastosowania; zadanie odwrotne — udział izotopu z masy atomowej<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot contest\"><\/span><span><b>Ponad LO:<\/b> rozwijane bloki „poziom akademicki” — przycisk w nagłówku lekcji<\/span><\/div>\n<\/div>\n<div id=\"rdzen\" class=\"core-path\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to<\/div>\n<ol>\n<li><strong><a href=\"#diagnoza\">§0.4<\/a><\/strong> — diagnoza: odpowiedz, zanim zaczniesz czytać.<\/li>\n<li><strong><a href=\"#izotopy\">§1<\/a>–<a href=\"#jony\">§2<\/a><\/strong> — izotopy i jony: liczenie p, n, e.<\/li>\n<li><strong><a href=\"#trzy-zmiany\">§3<\/a><\/strong> — izotop, jon czy inny pierwiastek? Sprawdź w modelu.<\/li>\n<li><strong><a href=\"#masa-atomowa\">§4<\/a><\/strong> — masa atomowa jako średnia ważona, potem <strong><a href=\"#klinika\">§7<\/a><\/strong> i <strong><a href=\"#cwiczenia\">§8<\/a><\/strong> A i B.<\/li>\n<\/ol>\n<\/div>\n<section id=\"jak-pracowac\">\n<div class=\"part-heading\"><span class=\"part-num\">0.1<\/span> Jak pracować z lekcją<\/div>\n<div class=\"card card-understand\">\n<ul>\n<li><strong>Najpierw pytaj „co się zmieniło?”<\/strong> — protony, neutrony czy elektrony. Ta jedna decyzja rozstrzyga, czy to inny pierwiastek, izotop, czy jon.<\/li>\n<li><strong>Licz zawsze w tej samej kolejności:<\/strong> Z → p; A − Z → n; Z − q → e.<\/li>\n<li><strong>Sprawdzaj średnią:<\/strong> wynik musi leżeć między masami izotopów. Jeśli nie — błąd w procentach albo w działaniach.<\/li>\n<li><strong>Zasada 80/20:<\/strong> izotop = te same protony, inne neutrony · jon = te same protony, inne elektrony · masa atomowa = średnia ważona.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"cele\">\n<div class=\"part-heading\"><span class=\"part-num\">0.2<\/span> Cele lekcji i pytanie przewodnie <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Po tej lekcji potrafisz<\/span>\n<ul>\n<li>zdefiniować izotop i nuklid oraz rozpoznać izotopy w zapisie (<a href=\"#izotopy\">§1<\/a>),<\/li>\n<li>policzyć protony, neutrony i elektrony w izotopach i jonach, także wieloatomowych (<a href=\"#izotopy\">§1<\/a>, <a href=\"#jony\">§2<\/a>),<\/li>\n<li>odróżnić trzy zmiany: inny pierwiastek, inny izotop, jon (<a href=\"#trzy-zmiany\">§3<\/a>),<\/li>\n<li>wyjaśnić, dlaczego masa atomowa nie jest liczbą całkowitą, i obliczyć ją jako średnią ważoną (<a href=\"#masa-atomowa\">§4<\/a>),<\/li>\n<li>nie mylić liczby masowej, masy izotopu, masy atomowej i masy cząsteczkowej (<a href=\"#masy\">§5<\/a>),<\/li>\n<li>(ambitnie) rozpoznać izobary i obliczyć udział izotopu z masy atomowej (<a href=\"#ambitne\">§6<\/a>).<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Pytanie przewodnie<\/span>\n<p>Co może się zmienić w atomie, a co <strong>definiuje<\/strong> pierwiastek? I skoro każdy atom chloru ma liczbę masową 35 albo 37 — skąd w układzie okresowym bierze się 35,45?<\/p>\n<p class=\"mini-note\">Odpowiedź budujesz w <a href=\"#trzy-zmiany\">§3<\/a> (trzy zmiany) i <a href=\"#masa-atomowa\">§4<\/a> (średnia ważona); sprawdzasz ją w modelu i w doświadczeniu z <a href=\"#doswiadczenia\">§6.5<\/a>.<\/p>\n<\/div>\n<\/section>\n<section id=\"kompas\">\n<div class=\"part-heading\"><span class=\"part-num\">0.3<\/span> Kompas — co trzeba wiedzieć wcześniej<\/div>\n<ul>\n<li>budowa atomu, liczby <strong>Z<\/strong> i <strong>A<\/strong>, zapis nuklidu (A u góry, Z na dole), liczenie p, n, e w atomie i jonie — F04 Atom,<\/li>\n<li>procenty i ułamki dziesiętne: 75% = 0,75 (matematyka, klasa 6–7).<\/li>\n<\/ul>\n<p class=\"mini-note\">Jeżeli liczenie elektronów w jonie (e = Z − q) jest jeszcze niepewne — wróć do F04 §4 przed §2.<\/p>\n<\/section>\n<section id=\"diagnoza\">\n<div class=\"part-heading\"><span class=\"part-num\">0.4<\/span> Diagnoza startowa<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Odpowiedz najpierw sam<\/span>\n<ol>\n<li>Co to są izotopy?<\/li>\n<li>Co zmienia się przy tworzeniu jonu?<\/li>\n<li>Ile elektronów ma Cl⁻ (Z = 17)?<\/li>\n<li>Czy ³⁵Cl i ³⁷Cl mają to samo Z?<\/li>\n<li>Co oznacza liczba 35,45 przy chlorze w układzie okresowym?<\/li>\n<li>Czy jon Mg²⁺ ma mniej protonów niż atom Mg?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż klucz i interpretację<\/summary>\n<ol>\n<li>Atomy tego samego pierwiastka (to samo Z) o różnej liczbie neutronów. 2. Liczba elektronów. 3. 18. 4. Tak, Z = 17. 5. Masę atomową — średnią ważoną mas izotopów chloru. 6. Nie — ma tyle samo protonów (12), mniej elektronów (10).<\/li>\n<\/ol>\n<p><strong>Interpretacja:<\/strong> 0–2/6 — rdzeń krok po kroku; 3–4/6 — rdzeń, szczególnie punkty z błędami; 5–6/6 — przejdź do <a href=\"#trzy-zmiany\">§3<\/a>, <a href=\"#ambitne\">§6<\/a> i zadań transferowych.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"wyklad\">\n<div class=\"part-heading\"><span class=\"part-num\">0.5<\/span> Wykład — izotopy, jony i masa atomowa od zera<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład — trzy sposoby, by atom „zmienił się”, i jedna średnia<\/span>\n<p>W F04 poznałeś trzy cegiełki atomu: protony, neutrony i elektrony. Teraz zadajmy pytanie: co się stanie, jeśli zmienimy liczbę jednej z nich? Odpowiedź porządkuje pół chemii. <strong>Zmiana protonów<\/strong> to zmiana tożsamości — atom staje się innym pierwiastkiem (chlor z 18 protonami to już argon). <strong>Zmiana neutronów<\/strong> daje <strong>izotop<\/strong> — ten sam pierwiastek, tylko o innej masie jądra (³⁵Cl i ³⁷Cl). <strong>Zmiana elektronów<\/strong> daje <strong>jon<\/strong> — ten sam pierwiastek z ładunkiem (Cl⁻). Te trzy zmiany są niezależne: ³⁷Cl⁻ jest jednocześnie izotopem i jonem.<\/p>\n<p>Dlaczego izotopy jednego pierwiastka reagują prawie tak samo? Bo reakcje chemiczne to sprawa <strong>elektronów<\/strong>, a izotopy mają ich tyle samo. Różnią się masą — dlatego ciężka woda D₂O wrze w nieco wyższej temperaturze niż zwykła, ale chemicznie wciąż jest wodą.<\/p>\n<p>Skoro chlor w przyrodzie to mieszanina atomów o masie ok. 35 u i ok. 37 u, to jaką masę wpisać do układu okresowego? <strong>Średnią — ale ważoną.<\/strong> Atomów ³⁵Cl jest mniej więcej trzy razy więcej niż ³⁷Cl, więc średnia „ciągnie” w stronę 35: wychodzi 35,45 u. Działa to jak średnia ocen, w której sprawdzian liczy się bardziej niż kartkówka: każdą masę mnożymy przez jej udział (w ułamku) i sumujemy. Wynik zawsze leży <strong>między<\/strong> masami izotopów i <strong>bliżej<\/strong> częstszego. Ważne: żaden pojedynczy atom chloru nie ma masy 35,45 u — to właściwość ogromnej liczby atomów, a nie jednego.<\/p>\n<p>Stąd najważniejsze rozróżnienie lekcji: <strong>liczba masowa A<\/strong> to liczba całkowita opisująca jedno jądro (³⁵Cl → 35), a <strong>masa atomowa<\/strong> to średnia dla pierwiastka (Cl → 35,45 u). Na E8 w zadaniach z izotopami zwykle przybliżamy masy izotopów liczbami masowymi i liczymy średnią ważoną; w zadaniach z jonami — elektrony ze wzoru e = Z − q. Obie umiejętności wrócą w obliczeniach masy cząsteczkowej i w stechiometrii.<\/p>\n<\/div>\n<\/section>\n<section id=\"izotopy\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Nuklid i izotopy <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<p><strong>Nuklid<\/strong> to konkretny rodzaj jądra — opisują go liczba protonów Z i liczba masowa A, np. ¹²₆C albo ³⁷₁₇Cl. <strong>Izotopy<\/strong> to nuklidy <strong>tego samego pierwiastka<\/strong>: mają to samo Z, a różnią się liczbą neutronów, więc i liczbą masową.<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Nuklid<\/th><th>Z (p⁺)<\/th><th>A<\/th><th>n⁰ = A − Z<\/th><th>e⁻ w atomie<\/th><th>uwaga<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>¹H (prot)<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>najczęstszy wodór<\/td><\/tr>\n<tr><td>²H (deuter, D)<\/td><td>1<\/td><td>2<\/td><td>1<\/td><td>1<\/td><td>„ciężki wodór”, ciężka woda D₂O<\/td><\/tr>\n<tr><td>³H (tryt, T)<\/td><td>1<\/td><td>3<\/td><td>2<\/td><td>1<\/td><td>promieniotwórczy, śladowy<\/td><\/tr>\n<tr><td>¹²C<\/td><td>6<\/td><td>12<\/td><td>6<\/td><td>6<\/td><td>wzorzec jednostki u<\/td><\/tr>\n<tr><td>¹⁴C<\/td><td>6<\/td><td>14<\/td><td>8<\/td><td>6<\/td><td>promieniotwórczy, datowanie<\/td><\/tr>\n<tr><td>³⁵Cl<\/td><td>17<\/td><td>35<\/td><td>18<\/td><td>17<\/td><td>ok. 76% chloru<\/td><\/tr>\n<tr><td>³⁷Cl<\/td><td>17<\/td><td>37<\/td><td>20<\/td><td>17<\/td><td>ok. 24% chloru<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Reguła: izotopy — te same protony, inne neutrony<\/span>\n<p>Izotopy <strong>jednego pierwiastka<\/strong> mają tyle samo protonów, a jako atomy obojętne — także tyle samo elektronów. Różnią się <strong>tylko neutronami<\/strong> (i masą). Dlatego w zapisie izotopów zmienia się górna liczba (A), a dolna (Z) i symbol zostają.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dlaczego izotopy reagują prawie tak samo?<\/span>\n<p>O zachowaniu chemicznym decydują <strong>elektrony<\/strong> (zwłaszcza zewnętrzne — F07), a izotopy mają ich tyle samo. ³⁵Cl i ³⁷Cl tworzą ten sam chlorek sodu. Różnica mas zmienia jednak część właściwości <strong>fizycznych<\/strong>: ciężka woda D₂O wrze w ok. 101,4 °C (zwykła woda — 100 °C), a reakcje z deuterem bywają wolniejsze. Efekt izotopowy jest największy przy wodorze, bo D ma dwa razy większą masę niż H; przy ciężkich pierwiastkach różnica masy względnej jest znikoma.<\/p>\n<\/div>\n<\/section>\n<section id=\"jony\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Jony proste i wieloatomowe <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<p><strong>Jon<\/strong> to atom lub grupa atomów z ładunkiem elektrycznym. Powstaje, gdy liczba elektronów przestaje być równa liczbie protonów. Procedurę liczenia znasz z F04 — tu ją utrwalamy.<\/p>\n<div class=\"formula-lg\">e = Z − q    (q — ładunek ze znakiem)<\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Jon<\/th><th>Z<\/th><th>q<\/th><th>p⁺<\/th><th>e⁻<\/th><th>jak powstał<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Na⁺<\/td><td>11<\/td><td>+1<\/td><td>11<\/td><td>10<\/td><td>oddał 1 e⁻<\/td><\/tr>\n<tr><td>Mg²⁺<\/td><td>12<\/td><td>+2<\/td><td>12<\/td><td>10<\/td><td>oddał 2 e⁻<\/td><\/tr>\n<tr><td>Al³⁺<\/td><td>13<\/td><td>+3<\/td><td>13<\/td><td>10<\/td><td>oddał 3 e⁻<\/td><\/tr>\n<tr><td>Cl⁻<\/td><td>17<\/td><td>−1<\/td><td>17<\/td><td>18<\/td><td>przyjął 1 e⁻<\/td><\/tr>\n<tr><td>S²⁻<\/td><td>16<\/td><td>−2<\/td><td>16<\/td><td>18<\/td><td>przyjął 2 e⁻<\/td><\/tr>\n<tr><td>Ca²⁺ (⁴⁰Ca)<\/td><td>20<\/td><td>+2<\/td><td>20<\/td><td>18<\/td><td>oddał 2 e⁻; neutronów 20<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"formula-lg\">Mg → Mg²⁺ + 2 e⁻    ·    S + 2 e⁻ → S²⁻<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Najczęstszy błąd<\/span>\n<p>„Mg → Mg²⁺ oznacza utratę dwóch protonów” — <strong>nie<\/strong>. Magnez traci dwa <strong>elektrony<\/strong>. Gdyby stracił protony, stałby się neonem (Z = 10), a nie jonem magnezu.<\/p>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Kontrola ładunku<\/span>\n<p><strong>ładunek = p⁺ − e⁻<\/strong> · Na⁺: 11 − 10 = +1 · Cl⁻: 17 − 18 = −1 · S²⁻: 16 − 18 = −2. Jeśli wynik nie zgadza się ze znakiem jonu, policz jeszcze raz.<\/p>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Reguła skrócona<\/span>\n<p><strong>kation Xⁿ⁺:<\/strong> e⁻ = Z − n · <strong>anion Xⁿ⁻:<\/strong> e⁻ = Z + n · liczba protonów się <strong>nie zmienia<\/strong> (to nadal ten sam pierwiastek).\nAl³⁺: 13 − 3 = 10 e⁻ · S²⁻: 16 + 2 = 18 e⁻<\/p>\n<\/div>\n<p><strong>Jony wieloatomowe.<\/strong> Ładunek może należeć do całej grupy atomów: SO₄²⁻ (siarczanowy(VI)), NO₃⁻ (azotanowy(V)), CO₃²⁻ (węglanowy), OH⁻ (wodorotlenkowy), NH₄⁺ (amonowy). Grupa zachowuje się w związkach jak jedna całość — dlatego w Ca(OH)₂ piszemy nawias. Nazwy i wzory jonów utrwalasz w F09 i F12, a jon w roztworze — w lekcjach N.<\/p>\n<div class=\"card card-core\">\n<span class=\"card-label\">Jony wieloatomowe — liczymy p i e<\/span>\n<p>Dla całej grupy sumujesz protony wszystkich atomów. Potem z ładunku grupy liczysz elektrony: e = p − q.<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Jon<\/th><th>p⁺ (suma Z)<\/th><th>e⁻ = p − q<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>NH₄⁺<\/td><td>7 + 4 · 1 = 11<\/td><td>11 − 1 = 10<\/td><\/tr>\n<tr><td>OH⁻<\/td><td>8 + 1 = 9<\/td><td>9 + 1 = 10<\/td><\/tr>\n<tr><td>NO₃⁻<\/td><td>7 + 3 · 8 = 31<\/td><td>31 + 1 = 32<\/td><\/tr>\n<tr><td>CO₃²⁻<\/td><td>6 + 3 · 8 = 30<\/td><td>30 + 2 = 32<\/td><\/tr>\n<tr><td>SO₄²⁻<\/td><td>16 + 4 · 8 = 48<\/td><td>48 + 2 = 50<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Jony o <strong>zmiennym ładunku<\/strong> to ten sam pierwiastek z różną liczbą elektronów: Fe²⁺ — 24 e⁻, Fe³⁺ — 23 e⁻, Cu⁺ — 28 e⁻, Cu²⁺ — 27 e⁻. Więcej o nich w F09.<\/p>\n<\/div>\n<\/section>\n<section id=\"trzy-zmiany\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Izotop, jon czy inny pierwiastek? Trzy różne zmiany <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<p>Izotop, jon i atom innego pierwiastka odpowiadają na <strong>różne pytania<\/strong>. Nie wolno ich mieszać tylko dlatego, że wszystkie dotyczą atomów.<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Co zmieniamy<\/th><th>Przykład<\/th><th>Wynik<\/th><th>Pierwiastek<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>liczbę <strong>protonów<\/strong> (Z)<\/td><td>³⁵Cl (17 p⁺) → 18 p⁺<\/td><td><strong>inny pierwiastek<\/strong> (argon)<\/td><td>zmienia się<\/td><\/tr>\n<tr><td>liczbę <strong>neutronów<\/strong><\/td><td>³⁵Cl → ³⁷Cl<\/td><td><strong>inny izotop<\/strong><\/td><td>ten sam<\/td><\/tr>\n<tr><td>liczbę <strong>elektronów<\/strong><\/td><td>Cl → Cl⁻<\/td><td><strong>jon<\/strong><\/td><td>ten sam<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Izotop i jon jednocześnie<\/span>\n<p>³⁵Cl⁻ jest <strong>jednocześnie<\/strong> konkretnym nuklidem chloru, izotopem chloru (względem ³⁷Cl) i anionem. „Izotop” mówi o <strong>jądrze<\/strong> (neutrony), „jon” — o <strong>bilansie elektronów<\/strong>. To dwie niezależne cechy: ³⁷Cl⁻ ma 17 p⁺, 20 n⁰ i 18 e⁻.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"f05-izotopy-v01\"><button type=\"button\" data-che-open-viz=\"f05-izotopy-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'f05-izotopy-v01',lessonId:'F05'},'*')\"><b>Izotop, jon czy inny pierwiastek? Konstruktor atomu i masa atomowa<\/b><span>dodawaj i zabieraj p, n, e — model nazywa zmianę; niżej średnia ważona izotopów<\/span><\/button><\/div>\n<!-- OPIS: Konstruktor atomu (ten sam rysunek co w atlasie): w środku jądro z czerwonych protonów i szarych neutronów — neutron ponad najczęstszy izotop ma pomarańczową obwódkę; wokół powłoki K, L, M (model szkolny 2, 8, 8) z podpisami „K · 2/2” itd. — elektrony wewnętrzne zielone, walencyjne pomarańczowe; w rogu lupa z powiększonym jądrem; przyciski + i − przy protonach, neutronach i elektronach. Gdy dodajesz lub zabierasz cząstki, model nazywa zmianę: inna liczba neutronów — izotop, inna liczba elektronów — jon, inna liczba protonów — inny pierwiastek. Niżej obliczenie masy atomowej jako średniej ważonej mas izotopów. Wniosek: o tym, jaki to pierwiastek, decyduje wyłącznie liczba protonów. -->\n<p class=\"mini-note\">W modelu zmień najpierw tylko neutrony, potem tylko elektrony, na końcu protony. Za każdym razem przeczytaj: co się zmieniło, a co zostało?<\/p>\n<\/section>\n<section id=\"masa-atomowa\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Masa atomowa — średnia ważona izotopów <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<p>W przyrodzie pierwiastek jest zwykle <strong>mieszaniną izotopów<\/strong> w stałych proporcjach. Masa atomowa w układzie okresowym to <strong>średnia ważona<\/strong> mas tych izotopów — „ważona”, bo częstszy izotop liczy się bardziej. W tej lekcji oznaczamy ją <strong>m_at<\/strong> (w tablicach często Ar). To liczba bez jednostki, liczbowo równa masie atomowej w u. Nie myl jej z symbolem argonu Ar.<\/p>\n<div class=\"card card-core\">\n<span class=\"card-label\">Procedura obliczania średniej izotopowej<\/span>\n<ol>\n<li>Wypisz masy izotopów (w zadaniach szkolnych często przybliżone przez A).<\/li>\n<li>Zamień udziały procentowe na ułamki: 75,76% → 0,7576.<\/li>\n<li>Pomnóż każdą masę przez jej udział.<\/li>\n<li>Dodaj wkłady.<\/li>\n<li><strong>Sprawdź:<\/strong> wynik musi leżeć między masami izotopów, bliżej najczęstszego.<\/li>\n<li><strong>Sprawdź udziały:<\/strong> suma udziałów musi wynosić 100% (lub 1). Brakujący udział to 100% minus suma pozostałych.<\/li>\n<\/ol>\n<\/div>\n<p><strong>Przykład — chlor:<\/strong> ³⁵Cl — masa 34,969 u, udział 75,76%; ³⁷Cl — masa 36,966 u, udział 24,24%.<\/p>\n<div class=\"formula-lg\">m_at(Cl) = 0,7576 · 34,969 + 0,2424 · 36,966 ≈ 26,492 + 8,961 ≈ 35,45 u<\/div>\n<p>Wynik 35,45 leży między 35 a 37 i bliżej 35 — bo ³⁵Cl jest trzy razy częstszy. To <strong>nie jest<\/strong> „atom chloru o masie 35,45”: taki atom nie istnieje. To średnia dla ogromnej liczby atomów.<\/p>\n<p><strong>Skąd znamy udziały?<\/strong> Spektrometr mas rozdziela jony według stosunku masy do ładunku i mierzy, ile atomów każdego izotopu przypada na daną masę. Tak wyznaczono udziały podane w tablicach; w bardzo dokładnych pomiarach mogą się nieco różnić zależnie od pochodzenia próbki.<\/p>\n<p><strong>Przykład szkolny (masy przybliżone liczbami masowymi):<\/strong> pierwiastek ma dwa izotopy o masach 10 u (20%) i 11 u (80%).<\/p>\n<div class=\"formula-lg\">m_at = 0,20 · 10 + 0,80 · 11 = 2 + 8,8 = 10,8 u<\/div>\n<p>Tak właśnie jest zbudowany bor (m_at ≈ 10,81).<\/p>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Pułapka: „m_at(C) = 12”<\/span>\n<p>Masę 12 u ma dokładnie <strong>nuklid ¹²C<\/strong> (z definicji jednostki u). <strong>Węgiel naturalny<\/strong> to mieszanina ¹²C i ¹³C, dlatego jego masa atomowa wynosi ok. 12,011 u. Gdy mówisz o konkretnym izotopie — podaj jego zapis.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Pierwiastki z jednym trwałym izotopem<\/span>\n<p>Sód (²³Na), glin (²⁷Al) czy fluor (¹⁹F) mają w przyrodzie praktycznie jeden izotop. Ich masy atomowe (22,99; 26,98; 19,00 u) są więc bardzo bliskie liczbom całkowitym. Duże odchylenie od liczby całkowitej (Cl 35,45; Cu 63,55) zdradza mieszaninę izotopów o porównywalnych udziałach.<\/p>\n<\/div>\n<\/section>\n<section id=\"masy\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Liczba masowa, masa izotopu, masa atomowa, masa cząsteczkowa <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<p>Cztery pojęcia brzmią podobnie, ale opisują różne rzeczy:<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Pojęcie<\/th><th>Co to jest<\/th><th>Jednostka<\/th><th>Przykład<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><strong>Liczba masowa A<\/strong><\/td><td>liczba protonów + neutronów w <strong>jednym nuklidzie<\/strong><\/td><td>brak (liczba całkowita)<\/td><td>³⁵Cl → A = 35<\/td><\/tr>\n<tr><td><strong>Masa izotopu<\/strong><\/td><td>masa jednego atomu danego nuklidu<\/td><td>u<\/td><td>³⁵Cl → 34,969 u<\/td><\/tr>\n<tr><td><strong>Masa atomowa (m_at)<\/strong><\/td><td>średnia ważona mas izotopów pierwiastka<\/td><td>u<\/td><td>Cl → 35,45 u<\/td><\/tr>\n<tr><td><strong>Masa cząsteczkowa<\/strong><\/td><td>suma mas atomowych w cząsteczce (dla związków jonowych: masa jednostki wzoru)<\/td><td>u<\/td><td>H₂O → 18 u; NaCl → 58,5 u<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"mini-note\">Masę cząsteczkową liczysz dokładnie w lekcjach o wzorach i stechiometrii (F12, R) — tu ważne jest tylko, by jej nie mylić z masą atomową.<\/p>\n<\/section>\n<section id=\"ambitne\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Izobary, izotopy promieniotwórcze, zadanie odwrotne <span class=\"level-badge level-extra\">AMBITNE<\/span><\/div>\n<p><strong>Izobary<\/strong> — nuklidy o <strong>tej samej liczbie masowej A<\/strong>, ale różnych Z: ⁴⁰Ar (18 p⁺, 22 n⁰), ⁴⁰K (19 p⁺, 21 n⁰), ⁴⁰Ca (20 p⁺, 20 n⁰). To <strong>różne pierwiastki<\/strong> — izobary nie są izotopami.<\/p>\n<p><strong>Izotopy promieniotwórcze<\/strong> mają nietrwałe jądra i z czasem się rozpadają: ¹⁴C (datowanie szczątków organicznych), ³H (tryt — znaczniki), ¹³¹I (medycyna). Jak i dlaczego jądra się rozpadają — A01–A03 Chemia jądrowa. Izotopy trwałe też bywają cenne: D₂O (ciężka woda) w reaktorach, ¹⁸O jako znacznik w badaniach.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Zastosowania izotopów — co i dlaczego<\/span>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Izotop<\/th><th>Zastosowanie<\/th><th>Dlaczego ten izotop<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>¹⁴C<\/td><td>datowanie szczątków organicznych<\/td><td>okres połowicznego rozpadu ok. 5730 lat — pasuje do wieku zabytków<\/td><\/tr>\n<tr><td>¹³¹I<\/td><td>diagnostyka i leczenie tarczycy<\/td><td>szybko się rozpada, łatwo wykrywalny<\/td><\/tr>\n<tr><td>⁶⁰Co<\/td><td>źródło promieniowania γ (radioterapia, sterylizacja)<\/td><td>silne promieniowanie przenikliwe<\/td><\/tr>\n<tr><td>²H (D)<\/td><td>znaczniki, moderator w reaktorach (D₂O)<\/td><td>różnica masy zmienia szybkość reakcji<\/td><\/tr>\n<tr><td>²³⁵U<\/td><td>paliwo jądrowe<\/td><td>rozszczepia się pod wpływem neutronów<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Pytanie: dlaczego do datowania nadaje się ¹⁴C, a nie ³⁵Cl? (Odpowiedź: ³⁵Cl jest trwały, więc nie zmierzysz upływu czasu.)<\/p>\n<p>Promieniowanie izotopów promieniotwórczych jest groźne. Stosuje się je tylko w wyspecjalizowanych warunkach — zasady i zagrożenia opisuje A01–A03.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Masy izotopów wybranych pierwiastków (zaokrąglone)<\/span>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>izotop<\/th><th>masa (u)<\/th><th>udział w przyrodzie<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>³⁵Cl<\/td><td>34,969<\/td><td>75,76%<\/td><\/tr>\n<tr><td>³⁷Cl<\/td><td>36,966<\/td><td>24,24%<\/td><\/tr>\n<tr><td>⁷⁹Br<\/td><td>78,918<\/td><td>50,69%<\/td><\/tr>\n<tr><td>⁸¹Br<\/td><td>80,916<\/td><td>49,31%<\/td><\/tr>\n<tr><td>⁶⁹Ga<\/td><td>68,926<\/td><td>60,11%<\/td><\/tr>\n<tr><td>⁷¹Ga<\/td><td>70,925<\/td><td>39,89%<\/td><\/tr>\n<tr><td>⁶³Cu<\/td><td>62,930<\/td><td>69,15%<\/td><\/tr>\n<tr><td>⁶⁵Cu<\/td><td>64,928<\/td><td>30,85%<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Zadanie odwrotne: udział izotopu z masy atomowej<\/span>\n<p>Chlor ma izotopy ³⁵Cl i ³⁷Cl (przybliżamy masy przez A), a jego masa atomowa wynosi 35,45 u. Jaki jest udział ³⁵Cl?<\/p>\n<p>Niech x — udział ³⁵Cl, wtedy (1 − x) — udział ³⁷Cl:<\/p>\n<div class=\"formula-lg\">35x + 37(1 − x) = 35,45 → 37 − 2x = 35,45 → x = 0,775<\/div>\n<p>Odpowiedź: ok. 77,5% ³⁵Cl (dokładne masy dają 75,76% — różnica wynika z przybliżenia mas liczbami całkowitymi).<\/p>\n<\/div>\n<details class=\"adv\"><summary>Dlaczego masy izotopów nie są liczbami całkowitymi? <span class=\"adv-tag\">poziom akademicki<\/span><\/summary><div class=\"adv-body\">\n<p>Masa ³⁵Cl to 34,969 u, a nie 35 u, choć jądro ma 35 nukleonów. Proton (1,00728 u) i neutron (1,00866 u) mają masy nieco większe od 1 u, a przy łączeniu nukleonów w jądro część masy „znika” jako energia wiązania jądra (<strong>defekt masy<\/strong>, E = mc²). Z definicji tylko ¹²C ma masę dokładnie 12 u. Dokładne wartości znajdziesz w tablicach chemicznych.<\/p>\n<\/div><\/details>\n<\/section>\n<section id=\"doswiadczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">6.5<\/span> Doświadczenia modelowe<\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 1 — Izotop, jon czy inny pierwiastek? (model komputerowy)<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Która zmiana w atomie zmienia pierwiastek, a która nie?<\/span><b>Hipoteza<\/b><span>Zmiana liczby neutronów daje izotop, zmiana liczby elektronów — jon; pierwiastek zmienia się tylko przy zmianie liczby protonów.<\/span><b>Sprzęt<\/b><span>model „Konstruktor atomu” w <a href=\"#trzy-zmiany\">§3<\/a>.<\/span><b>Przebieg<\/b><span>Wybierz chlor. Dodaj 2 neutrony i zapisz wynik. Wróć do startu, dodaj 1 elektron i zapisz wynik. Wróć do startu, dodaj 1 proton i zapisz wynik.<\/span><b>Obserwacja<\/b><span>³⁷Cl — ten sam pierwiastek, inny izotop; ³⁵Cl⁻ — anion chloru; po dodaniu protonu model pokazuje argon (Z = 18), w dodatku jako jon, bo elektronów jest teraz o jeden mniej niż protonów.<\/span><b>Wniosek<\/b><span>Tożsamość pierwiastka zależy wyłącznie od liczby protonów; neutrony zmieniają izotop, elektrony — ładunek.<\/span><b>BHP<\/b><span>model komputerowy — bez zagrożeń, bez źródeł promieniowania.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 2 — Średnia ważona w torebce<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Dlaczego średnia masa „atomu” w mieszaninie nie jest równa masie żadnego z nich?<\/span><b>Hipoteza<\/b><span>Średnia leży między masami składników i jest bliżej tego, którego jest więcej.<\/span><b>Sprzęt<\/b><span>30 jednakowych kulek lub fasolek „lekkich” i 10 „ciężkich” (np. sklejonych parami), waga kuchenna, kalkulator.<\/span><b>Przebieg<\/b><span>Zważ jedną kulkę lekką i jedną ciężką. Zważ całą torebkę (40 sztuk) i podziel przez 40. Oblicz też średnią ważoną: 0,75 · masa lekkiej + 0,25 · masa ciężkiej.<\/span><b>Obserwacja<\/b><span>Średnia z wagi i średnia ważona dają (w granicach dokładności wagi) ten sam wynik, leżący bliżej masy kulki lekkiej.<\/span><\/div><p>Przykładowe wyniki (lekka kulka 1,00 g, ciężka 1,50 g; w torebce 30 lekkich i 10 ciężkich):<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Sposób<\/th><th>Wynik<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>waga: 45,0 g : 40 sztuk<\/td><td>1,125 g<\/td><\/tr>\n<tr><td>średnia ważona: 0,75 · 1,00 + 0,25 · 1,50<\/td><td>1,125 g<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Pytanie: dlaczego w praktyce wyniki różnią się w ostatniej cyfrze? (niepewność wagi, zaokrąglenia)\nWniosek: Tak powstaje masa atomowa pierwiastka: torebka = próbka pierwiastka, kulki = izotopy, udziały = procenty izotopów.\nBHP: brak szczególnych zagrożeń; drobne elementy trzymać z dala od małych dzieci.<\/p><\/div>\n<\/section>\n<section id=\"klinika\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Klinika błędów<\/div>\n<table class=\"klinika-table\"><thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><\/tr><\/thead><tbody><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Izotop to atom z ładunkiem.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Izotop różni się liczbą neutronów.<\/td><td data-label=\"Dlaczego\">Ładunek dotyczy jonu, nie izotopu.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Izotopy mają różne Z.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Izotopy mają to samo Z.<\/td><td data-label=\"Dlaczego\">Inne Z = inny pierwiastek.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Jon dodatni ma mniej protonów.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Kation ma mniej elektronów niż protonów.<\/td><td data-label=\"Dlaczego\">Jon powstaje przez zmianę liczby elektronów.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Cl⁻ ma 16 elektronów.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Cl⁻ ma 18 elektronów.<\/td><td data-label=\"Dlaczego\">Anion przyjął: e = 17 − (−1) = 18.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Masa atomowa = A.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">A — liczba całkowita jednego nuklidu; masa atomowa — średnia izotopów.<\/td><td data-label=\"Dlaczego\">³⁵Cl: A = 35; chlor: 35,45 u.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Każdy atom chloru ma masę 35,45 u.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Atomy chloru mają masę ok. 35 u albo ok. 37 u.<\/td><td data-label=\"Dlaczego\">35,45 to średnia dla mieszaniny.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Średnia: (35 + 37) : 2 = 36.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Średnia <strong>ważona<\/strong>: 0,76 · 35 + 0,24 · 37 ≈ 35,5.<\/td><td data-label=\"Dlaczego\">Izotopy nie występują po równo.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„⁴⁰Ar i ⁴⁰Ca to izotopy.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">To izobary — różne pierwiastki o tym samym A.<\/td><td data-label=\"Dlaczego\">Izotopy mają to samo Z, nie to samo A.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Każdy izotop jest promieniotwórczy.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Wiele <strong>nuklidów<\/strong> jest trwałych (¹²C, ¹³C, ³⁵Cl, ³⁷Cl); promieniotwórcze są tylko niektóre (¹⁴C, ³H).<\/td><td data-label=\"Dlaczego\">Izotop = ta sama liczba protonów, inna liczba neutronów — o trwałości to nie mówi.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Masa atomowa musi być liczbą całkowitą.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">To średnia ważona mas izotopów, np. Cl ≈ 35,5 u, Cu ≈ 63,5 u.<\/td><td data-label=\"Dlaczego\">Liczbą całkowitą jest liczba masowa A pojedynczego nuklidu.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Masa cząsteczkowa NaCl wynosi 58,5 u.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">NaCl nie tworzy cząsteczek; 58,5 u to masa jednostki wzoru (masa formalna).<\/td><td data-label=\"Dlaczego\">Dla związków jonowych mówimy o jednostce wzoru.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„D i H to różne pierwiastki.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">To ten sam pierwiastek (wodór) — różne izotopy: ¹H i ²H (D).<\/td><td data-label=\"Dlaczego\">Z jest takie samo: 1.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Izotopy różnią się liczbą elektronów.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Różnią się liczbą neutronów; elektronów w atomie obojętnym jest tyle samo.<\/td><td data-label=\"Dlaczego\">Elektrony zmieniają jon, nie izotop.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Masa atomowa to masa najcięższego izotopu.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Masa atomowa to średnia ważona mas izotopów.<\/td><td data-label=\"Dlaczego\">Cl: 35,45 u, nie 37 u.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Średnia 36,8 u przy przewadze ³⁵Cl jest w porządku.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Wynik musi być bliżej 35 u. 36,8 u oznacza zamienione udziały.<\/td><td data-label=\"Dlaczego\">Sprawdź zakres i kierunek średniej.<\/td><\/tr><\/tbody><\/table>\n<\/section>\n<section id=\"nie-myl\">\n<div class=\"part-heading\"><span class=\"part-num\">7.5<\/span> Nie myl!<\/div>\n<nie-myl>\n<summary>Pojęcia, które łatwo pomylić<\/summary>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Para<\/th><th>Dlaczego łatwo pomylić<\/th><th>Jak rozstrzygnąć<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>izotop / jon<\/td><td>oba „ten sam pierwiastek, coś inne”<\/td><td>izotop — inna liczba neutronów; jon — inna liczba elektronów<\/td><\/tr>\n<tr><td>izotopy / izobary<\/td><td>podobne nazwy<\/td><td>izotopy — to samo Z; izobary — to samo A (różne pierwiastki)<\/td><\/tr>\n<tr><td>liczba masowa / masa atomowa<\/td><td>obie „o masie”<\/td><td>A — całkowita, jeden nuklid; masa atomowa — średnia ważona pierwiastka<\/td><\/tr>\n<tr><td>średnia zwykła / ważona<\/td><td>oba „średnia”<\/td><td>ważona uwzględnia udziały: 0,76 · 35 + 0,24 · 37, a nie (35 + 37) : 2<\/td><\/tr>\n<tr><td>¹²C / węgiel<\/td><td>ten sam symbol<\/td><td>¹²C ma dokładnie 12 u; węgiel naturalny — ok. 12,011 u<\/td><\/tr>\n<tr><td>masa cząsteczkowa / masa jednostki wzoru<\/td><td>obie sumują masy atomowe<\/td><td>cząsteczkowa — dla cząsteczek (H₂O); jednostki wzoru — dla związków jonowych (NaCl)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/nie-myl>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — średnia ważona bez wzoru<\/span>\n<p>Wyobraź sobie torebkę kulek: 3/4 z nich waży po 35 g, a 1/4 — po 37 g. Średnia masa kulki nie wyniesie 36 g, bo lżejszych jest trzy razy więcej. Wynik spadnie bliżej 35 — dokładnie na 35,5 g. Tak samo liczysz masę atomową: <strong>wartość × udział<\/strong>, dodaj wszystkie wkłady. Kontrola zawsze jest prosta: wynik musi wylądować między skrajnymi masami, po stronie częstszego izotopu. Jeśli wyszło 36,8 przy przewadze ³⁵Cl — zamieniłeś udziały.<\/p>\n<\/div>\n<\/section>\n<section id=\"cwiczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Ćwiczenia<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">A. Podstawa (4 pkt)<\/span>\n<ol>\n<li>Podaj liczbę p⁺, n⁰, e⁻ dla: ¹²C, ¹⁴C, ³⁷Cl (Z: C 6, Cl 17).<\/li>\n<li>Które z nuklidów są izotopami tego samego pierwiastka: ³⁹₁₉K, ⁴⁰₁₈Ar, ⁴¹₁₉K, ⁴⁰₂₀Ca?<\/li>\n<li>Ile elektronów mają jony: K⁺ (Z = 19), Ca²⁺ (Z = 20), S²⁻ (Z = 16), Al³⁺ (Z = 13)?<\/li>\n<li>Uzupełnij: zmiana liczby protonów → …; zmiana liczby neutronów → …; zmiana liczby elektronów → … .<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>¹²C: 6, 6, 6; ¹⁴C: 6, 8, 6; ³⁷Cl: 17, 20, 17.<\/li>\n<li>³⁹K i ⁴¹K (Z = 19). ⁴⁰Ar i ⁴⁰Ca to inne pierwiastki.<\/li>\n<li>K⁺ 18; Ca²⁺ 18; S²⁻ 18; Al³⁺ 10.<\/li>\n<li>inny pierwiastek; inny izotop; jon.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">B. Trening (4 pkt)<\/span>\n<ol>\n<li>Podaj p⁺, n⁰, e⁻ dla jonu ⁴⁰₂₀Ca²⁺.<\/li>\n<li>Magnez ma izotopy ²⁴Mg (79%), ²⁵Mg (10%), ²⁶Mg (11%). Oblicz masę atomową, przybliżając masy liczbami masowymi.<\/li>\n<li>Pierwiastek X ma dwa izotopy: ⁶³X (69%) i ⁶⁵X (31%). Oblicz masę atomową (masy ≈ A) i odszukaj pierwiastek w układzie okresowym.<\/li>\n<li>Dlaczego masa atomowa chloru nie wynosi ani 35, ani 37?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>p = 20, n = 20, e = 18.<\/li>\n<li>0,79 · 24 + 0,10 · 25 + 0,11 · 26 = 18,96 + 2,5 + 2,86 = 24,32 u (tablice: 24,31 u).<\/li>\n<li>0,69 · 63 + 0,31 · 65 = 43,47 + 20,15 = 63,62 u → miedź (Cu, 63,55 u).<\/li>\n<li>Naturalny chlor to mieszanina ³⁵Cl i ³⁷Cl; masa atomowa jest średnią ważoną ich mas.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">C. Ambitne<\/span>\n<ol>\n<li>Atom ma 20 elektronów i A = 40. Jaki to pierwiastek? Podaj liczbę protonów i neutronów. A jeśli drobina z 18 elektronami i A = 40 jest jonem o ładunku 2+?<\/li>\n<li>Brom ma dwa izotopy: ⁷⁹Br i ⁸¹Br, a jego masa atomowa wynosi 79,90 u. Oblicz udział ⁷⁹Br (masy ≈ A).<\/li>\n<li>Podaj przykład trzech izobar o A = 40 i wyjaśnij, czym różnią się od izotopów.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>Atom obojętny: e = Z = 20 → wapń ⁴⁰Ca, 20 p⁺, 20 n⁰. Jon 2+ z 18 e⁻: Z = e + q = 18 + 2 = 20 → to też wapń (⁴⁰Ca²⁺), 20 n⁰. Zawsze zaczynaj od pytania „atom czy jon?” — liczba elektronów sama nie mówi, jaki to pierwiastek.<\/li>\n<li>79x + 81(1 − x) = 79,90 → 81 − 2x = 79,90 → x = 0,55 → ok. 55% ⁷⁹Br (tablice: 50,69% — masy izotopów są nieco mniejsze niż A: ⁷⁹Br ma 78,918 u, więc przybliżenie przesuwa wynik).<\/li>\n<li>⁴⁰Ar, ⁴⁰K, ⁴⁰Ca — to samo A, różne Z, więc różne pierwiastki; izotopy mają to samo Z.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">F. Utrwalenie — jony i masa atomowa (5 pkt)<\/span>\n<ol>\n<li>Oblicz liczbę elektronów w jonach: Mg²⁺, F⁻, Ca²⁺, N³⁻.<\/li>\n<li>Podaj liczbę protonów, neutronów i elektronów dla ⁴⁰₂₀Ca²⁺.<\/li>\n<li>Czym różnią się ³⁵Cl i ³⁷Cl?<\/li>\n<li>Pierwiastek ma dwa izotopy o masach 24 u (75%) i 26 u (25%). Oblicz masę atomową.<\/li>\n<li>Pierwiastek ma izotopy 10 u (20%) i 11 u (80%). Oblicz masę atomową i rozpoznaj pierwiastek w układzie okresowym.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>Mg²⁺: 12 − 2 = 10 · F⁻: 9 + 1 = 10 · Ca²⁺: 20 − 2 = 18 · N³⁻: 7 + 3 = 10.<\/li>\n<li>p = 20, n = 40 − 20 = 20, e = 20 − 2 = 18.<\/li>\n<li>Ta sama liczba protonów (17), ³⁷Cl ma o dwa neutrony więcej (20 zamiast 18).<\/li>\n<li>24 · 0,75 + 26 · 0,25 = 18 + 6,5 = 24,5 u (model zadania — rzeczywisty magnez ma trzy izotopy, Aᵣ ≈ 24,3).<\/li>\n<li>10 · 0,20 + 11 · 0,80 = 2 + 8,8 = 10,8 u → bor (B).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">G. Jony wieloatomowe, udziały, tablica mas (6 pkt)<\/span>\n<ol>\n<li>Policz p⁺ i e⁻ dla NH₄⁺ i OH⁻ (Z: N 7, O 8, H 1). (2 pkt)<\/li>\n<li>Pierwiastek ma izotopy 10 u (udział 20%), 11 u (udział 50%) i 12 u (pozostały udział). Ile wynosi udział trzeciego izotopu? (1 pkt)<\/li>\n<li>Oblicz masę atomową miedzi z tabeli: ⁶³Cu (62,930 u, 69,15%) i ⁶⁵Cu (64,928 u, 30,85%). (2 pkt)<\/li>\n<li>Pierwiastek ma masę atomową 10,81 u i dwa izotopy ¹⁰B i ¹¹B. Który pierwiastek to może być? Uzasadnij. (1 pkt)<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>NH₄⁺: p = 11, e = 10; OH⁻: p = 9, e = 10. 2. 100 − 20 − 50 = 30%. 3. 0,6915 · 62,930 + 0,3085 · 64,928 ≈ 43,52 + 20,03 ≈ 63,55 u. 4. Bor (B) — masa 10,81 u leży między 10 a 11 i bliżej 11, bo ¹¹B ma większy udział (80%).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"ciekawostki\">\n<div class=\"part-heading\"><span class=\"part-num\">8.5<\/span> Ciekawostki<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">„To samo miejsce”<\/span>\n<p>Słowo <strong>izotop<\/strong> wymyślił w 1913 r. Frederick Soddy (z pomocą lekarki Margaret Todd): po grecku <em>isos topos<\/em> znaczy „to samo miejsce”. Chodzi o to samo miejsce w układzie okresowym — izotopy jednego pierwiastka zajmują jedno pole.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Zegar z węgla-14<\/span>\n<p>Promieniotwórczy ¹⁴C rozpada się powoli: po ok. 5730 latach zostaje połowa jego atomów. Żywe organizmy stale go pobierają, a po śmierci jego ilość maleje. Mierząc, ile ¹⁴C zostało, naukowcy określają wiek kości, drewna czy tkanin — metodę opracował Willard Libby (Nobel 1960).<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Ciężka woda i wojna<\/span>\n<p>Ciężka woda D₂O była potrzebna w badaniach nad energią jądrową. W czasie II wojny światowej alianci kilkakrotnie atakowali zakład w norweskim Vemork, który ją produkował, by nie trafiła do nazistowskich Niemiec.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Masa atomowa „od–do”<\/span>\n<p>Skład izotopowy niektórych pierwiastków (np. wodoru, węgla, tlenu) trochę zależy od miejsca pochodzenia próbki. Dlatego IUPAC podaje dla nich masę atomową jako <strong>przedział<\/strong>, a w szkolnych tablicach — wartość umowną.<\/p>\n<\/div>\n<\/section>\n<section id=\"olimpijska\">\n<div class=\"part-heading\"><span class=\"part-num\">8.6<\/span> Warstwa olimpijska — Dla olimpijczyka<\/div>\n<p><em>(Warstwa ponad E8 — zadania w stylu konkursów chemicznych.)<\/em><\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dla olimpijczyka — izotopy w rachunkach i w cząsteczkach<\/span>\n<p><strong>Trzy izotopy<\/strong> — średnia ważona działa tak samo: Mg (²⁴, ²⁵, ²⁶) → suma trzech wkładów. <strong>Zadanie odwrotne z dwiema niewiadomymi<\/strong> — gdy znasz masę atomową i masy dwóch izotopów: x · m₁ + (1 − x) · m₂ = Ar. <strong>Izotopy w cząsteczce<\/strong> — cząsteczka Cl₂ może mieć masę 70, 72 lub 74 u (³⁵Cl–³⁵Cl, ³⁵Cl–³⁷Cl, ³⁷Cl–³⁵Cl i ³⁷Cl–³⁷Cl); prawdopodobieństwa liczymy z udziałów: 0,76² ≈ 0,58; 2 · 0,76 · 0,24 ≈ 0,36; 0,24² ≈ 0,06 — stosunek ok. 10 : 6 : 1 (przy udziałach 3 : 1 wyszłoby 9 : 6 : 1). Tak wygląda widmo masowe chloru. <strong>Masa jonu<\/strong> — elektron ma masę ok. 0,00055 u (≈ 1/1836 masy protonu), więc masa Na⁺ i Na różni się tylko na trzecim–czwartym miejscu po przecinku; w zadaniach szkolnych ją pomijamy.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Zadanie O1 (4 pkt) — cząsteczki Cl₂ <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Chlor to ok. 76% ³⁵Cl i 24% ³⁷Cl. Podaj możliwe masy cząsteczek Cl₂ (masy ≈ A) i oszacuj, która jest najczęstsza.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>70 u (³⁵Cl₂), 72 u (³⁵Cl³⁷Cl), 74 u (³⁷Cl₂) — 2 pkt; najczęstsza 70 u (ok. 58%), potem 72 u (ok. 36%), najrzadsza 74 u (ok. 6%) — 2 pkt.<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O2 (4 pkt) — zadanie odwrotne <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Gal ma dwa trwałe izotopy: ⁶⁹Ga i ⁷¹Ga; masa atomowa galu wynosi 69,72 u. Oblicz udziały izotopów (masy ≈ A).<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>69x + 71(1 − x) = 69,72 → 71 − 2x = 69,72 → x = 0,64 → ok. 64% ⁶⁹Ga i 36% ⁷¹Ga (2 pkt za równanie, 2 pkt za wynik). (tablice: 60,11% i 39,89%; ⁶⁹Ga ma 68,926 u, nie 69 u — przybliżenie przesuwa wynik)<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O3 (3 pkt) — atom czy jon? <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Drobina ma 16 protonów, 18 neutronów i 18 elektronów. Podaj zapis nuklidu z ładunkiem i nazwij drobinę.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>Z = 16 → siarka; A = 16 + 18 = 34; ładunek 16 − 18 = −2 → ³⁴₁₆S²⁻, anion siarczkowy (izotop ³⁴S). Po 1 pkt za pierwiastek, A i ładunek.<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O4 (3 pkt) — która masa atomowa „zdradza” mieszaninę? <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Masy atomowe: F 19,00; Cl 35,45; Na 22,99; Cu 63,55. Które pierwiastki mają w przyrodzie praktycznie jeden izotop, a które — mieszaninę o porównywalnych udziałach? Uzasadnij.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>F i Na — praktycznie jeden izotop (masa bliska liczbie całkowitej) (1 pkt); Cl i Cu — mieszaniny (wartości daleko od całkowitych) (1 pkt); uzasadnienie: średnia ważona daje wynik całkowity tylko, gdy dominuje jeden izotop (1 pkt).<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O5 (3 pkt) — cząsteczki HCl z izotopami <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Cząsteczka HCl może zawierać ¹H lub ²H oraz ³⁵Cl lub ³⁷Cl (masy ≈ A). Podaj wszystkie możliwe masy cząsteczek i wskaż najczęstszą (ok. 76% ³⁵Cl, ¹H ok. 99,98%).<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>¹H³⁵Cl 36 u, ²H³⁵Cl 37 u, ¹H³⁷Cl 38 u, ²H³⁷Cl 39 u (2 pkt); najczęstsza 36 u (ok. 76%) (1 pkt).<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O6 (3 pkt) — woda z izotopami <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Wodór ma izotopy ¹H i ²H (D), tlen — ¹⁶O (masy ≈ A). Podaj masy cząsteczek H₂O, HDO i D₂O oraz uszereguj je od najczęstszej do najrzadszej.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>H₂O: 18 u; HDO: 19 u; D₂O: 20 u (2 pkt); najczęstsza H₂O (ponad 99% cząsteczek), potem HDO, najrzadsza D₂O (1 pkt).<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie O7 (3 pkt) — trzy izotopy z jedną zależnością <span class=\"adv-tag\">poziom ambitny (konkurs)<\/span><\/summary><div class=\"adv-body\">\n<p>Pierwiastek X ma izotopy o masach 20 u (udział x), 21 u (udział y) i 22 u (udział 10%). Masa atomowa wynosi 21,0 u. Oblicz x i y.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>x + y = 0,90; 20x + 21y + 2,2 = 21,0 → x = 0,10, y = 0,80 (2 pkt za równania, 1 pkt za wynik): 10% (20 u), 80% (21 u), 10% (22 u).<\/p>\n<\/details>\n<\/div><\/details>\n<\/section>\n<section id=\"test\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Test<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Izotopy mają to samo Z; inna liczba neutronów daje inne A.\"><h5>1. Izotopy jednego pierwiastka różnią się liczbą:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">protonów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">neutronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">elektronów w atomie obojętnym<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">liczbą atomową Z<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"n = A − Z = 37 − 17.\"><h5>2. Ile neutronów ma ³⁷Cl (Z = 17)?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">17<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">20<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">37<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">54<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"e = Z − q = 20 − 2.\"><h5>3. Ile elektronów ma jon Ca²⁺ (Z = 20)?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">20<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">22<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">18<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">2<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Jon powstaje przez oddanie lub przyjęcie elektronów.\"><h5>4. Co się zmienia, gdy atom tworzy jon?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">liczba protonów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">liczba neutronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">liczba elektronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">liczba atomowa<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Atomy chloru mają masy ok. 35 u lub 37 u; 35,45 to średnia dla mieszaniny.\"><h5>5. Masa atomowa chloru w układzie okresowym (35,45 u) to:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">liczba masowa najczęstszego izotopu<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">masa jednego atomu chloru<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">średnia ważona mas izotopów chloru<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">suma protonów i neutronów<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"0,2 · 10 + 0,8 · 11 = 10,8.\"><h5>6. Pierwiastek ma izotopy o masach 10 u (20%) i 11 u (80%). Jego masa atomowa wynosi ok.:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">10,2 u<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">10,5 u<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">10,8 u<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">11,0 u<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Anion ma ładunek ujemny (przyjął elektrony).\"><h5>7. Który zapis przedstawia anion?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">Na⁺<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">¹⁴C<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">S²⁻<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">²H<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Mają to samo A, ale różne Z (18 i 20).\"><h5>8. ⁴⁰Ar i ⁴⁰Ca to:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">izotopy<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">izobary — różne pierwiastki<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">jony tego samego pierwiastka<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">ten sam nuklid<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"p = 16 + 4 · 8 = 48; e = p − q = 48 − (−2) = 50.\"><h5>9. Ile elektronów ma jon SO₄²⁻ (Z: S = 16, O = 8)?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">46<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">48<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">50<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">52<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Izotop (n = 20) i jon (e = 18) naraz.\"><h5>10. Jon ³⁷Cl⁻ ma:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">17 p⁺, 20 n⁰, 18 e⁻<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">17 p⁺, 18 n⁰, 17 e⁻<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">18 p⁺, 20 n⁰, 18 e⁻<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"0,2 · 10 + 0,5 · 11 + 0,3 · 12 = 2 + 5,5 + 3,6 = 11,1 u.\"><h5>11. Pierwiastek ma trzy izotopy: 10 u (20%), 11 u (50%), 12 u (30%). Jego masa atomowa:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">10,5 u<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">11,0 u<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">11,1 u<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">12,0 u<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"Sprawdzasz zakres i kierunek średniej.\"><h5>12. Średnia ważona mas izotopów leży:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">między masami izotopów, bliżej częstszego<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">zawsze w połowie między nimi<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">zawsze bliżej cięższego<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Masa atomowa musi leżeć między 35 a 37 u.\"><h5>13. Która masa atomowa jest niemożliwa dla chloru (izotopy ok. 35 u i 37 u)?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">35,45 u<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">36,9 u<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">38,2 u<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\" data-fb=\"A jest liczbą całkowitą dla jednego nuklidu.\"><h5>14. Liczba masowa A jednego nuklidu to:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">liczba całkowita<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">średnia ważona<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">masa atomowa pierwiastka<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">liczba dziesiętna<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section id=\"powtorka\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Karta szybkiego powtórzenia i mapa myśli<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Na jednej stronie<\/span>\n<ul>\n<li><strong>Nuklid<\/strong> = konkretne jądro (Z, A). <strong>Izotopy<\/strong> = to samo Z, różne n i A (³⁵Cl, ³⁷Cl).<\/li>\n<li><strong>Jon:<\/strong> e = Z − q. Kation oddał (Mg²⁺: 10 e⁻), anion przyjął (Cl⁻: 18 e⁻). Protony bez zmian. Jony wieloatomowe: SO₄²⁻, NO₃⁻, NH₄⁺.<\/li>\n<li><strong>Zmień Z<\/strong> → inny pierwiastek · <strong>zmień n<\/strong> → izotop · <strong>zmień e<\/strong> → jon. ³⁵Cl⁻ = izotop i jon naraz.<\/li>\n<li><strong>Masa atomowa<\/strong> = średnia ważona mas izotopów: m_at(Cl) = 0,7576 · 34,969 + 0,2424 · 36,966 ≈ 35,45 u. Wynik między masami izotopów, bliżej najczęstszego.<\/li>\n<li><strong>A ≠ masa izotopu ≠ masa atomowa ≠ masa cząsteczkowa.<\/strong><\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mapa myśli<\/span>\n<p><strong>ATOM (F04)<\/strong> → <em>zmiana n<\/em> → <strong>izotopy<\/strong> → <em>naturalna mieszanina<\/em> → <strong>masa atomowa (średnia ważona)<\/strong> → masa cząsteczkowa (F12, R)\n→ <em>zmiana e<\/em> → <strong>jony<\/strong> (proste, wieloatomowe) → wzory związków jonowych (F09–F12)\n→ <em>zmiana Z<\/em> → <strong>inny pierwiastek<\/strong> → układ okresowy (F06) · <em>nietrwałe jądra<\/em> → chemia jądrowa (A01–A03)<\/p>\n<\/div>\n<\/section>\n<section id=\"fiszki\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Fiszki<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Izotopy<\/span><span class=\"back\">atomy jednego pierwiastka: to samo Z, różna liczba neutronów<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Nuklid<\/span><span class=\"back\">konkretny rodzaj jądra o określonym Z i A<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">³⁵Cl i ³⁷Cl<\/span><span class=\"back\">izotopy chloru: 17 p⁺, odpowiednio 18 i 20 n⁰<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jon<\/span><span class=\"back\">atom lub grupa atomów z ładunkiem<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Elektrony w jonie<\/span><span class=\"back\">e = Z − q<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Cl⁻<\/span><span class=\"back\">17 p⁺, 18 e⁻<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Mg²⁺<\/span><span class=\"back\">12 p⁺, 10 e⁻<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Masa atomowa<\/span><span class=\"back\">średnia ważona mas izotopów pierwiastka<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">A a masa atomowa<\/span><span class=\"back\">A — liczba całkowita jednego nuklidu; masa atomowa — średnia (dziesiętna)<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Zmiana Z / n / e<\/span><span class=\"back\">inny pierwiastek / izotop / jon<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Dlaczego izotopy reagują tak samo?<\/span><span class=\"back\">mają tyle samo elektronów<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jak sprawdzić średnią?<\/span><span class=\"back\">wynik między masami izotopów, bliżej najczęstszego<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Izobary<\/span><span class=\"back\">ten sam A, różne Z (⁴⁰Ar, ⁴⁰Ca)<\/span><span class=\"card-tag tag-extra\">ambitne<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Deuter<\/span><span class=\"back\">²H: 1 p⁺, 1 n⁰<\/span><span class=\"card-tag tag-extra\">ambitne<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">¹⁴C<\/span><span class=\"back\">promieniotwórczy izotop węgla — datowanie<\/span><span class=\"card-tag tag-extra\">ambitne<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Masy cząsteczek Cl₂<\/span><span class=\"back\">70, 72, 74 u — w stosunku ok. 9 : 6 : 1<\/span><span class=\"card-tag tag-olimpijski\">izotopy<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Skąd nazwa „izotop”?<\/span><span class=\"back\">gr. isos topos — „to samo miejsce” w układzie okresowym (Soddy, 1913)<\/span><span class=\"card-tag tag-olimpijski\">izotopy<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Okres połowicznego rozpadu ¹⁴C<\/span><span class=\"back\">ok. 5730 lat<\/span><span class=\"card-tag tag-olimpijski\">izotopy<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Masa atomowa jako przedział<\/span><span class=\"back\">IUPAC — dla pierwiastków o zmiennym składzie izotopowym (H, C, O)<\/span><span class=\"card-tag tag-olimpijski\">izotopy<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Masa Na⁺ a masa Na<\/span><span class=\"back\">różnica = masa elektronu, w zadaniach pomijana<\/span><span class=\"card-tag tag-olimpijski\">izotopy<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Masa elektronu<\/span><span class=\"back\">ok. 0,00055 u (≈ 1/1836 masy protonu)<\/span><span class=\"card-tag tag-olimpijski\">izotopy<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jon wieloatomowy SO₄²⁻<\/span><span class=\"back\">p⁺ = 48, e⁻ = 50<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Średnia izotopowa<\/span><span class=\"back\">m_at = suma (masa × udział)<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Brakujący udział<\/span><span class=\"back\">100% minus suma pozostałych<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Fe²⁺<\/span><span class=\"back\">26 p⁺, 24 e⁻<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Efekt izotopowy<\/span><span class=\"back\">ten sam pierwiastek, inna masa → inna szybkość reakcji (H vs D)<\/span><span class=\"card-tag tag-extra\">ambitne<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Masy cząsteczek HCl z izotopami<\/span><span class=\"back\">36, 37, 38, 39 u<\/span><span class=\"card-tag tag-olimpijski\">izotopy<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Cząsteczki wody<\/span><span class=\"back\">H₂O 18 u, HDO 19 u, D₂O 20 u<\/span><span class=\"card-tag tag-olimpijski\">izotopy<\/span><\/button><\/div>\n<\/section>\n<section id=\"slownik\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Słownik<\/div>\n<dl><div class=\"def-item\"><dt>Nuklid<\/dt><dd>rodzaj atomu o określonej liczbie protonów i neutronów (określonym Z i A)<\/dd><\/div><div class=\"def-item\"><dt>Izotopy<\/dt><dd>nuklidy tego samego pierwiastka — to samo Z, różna liczba neutronów<\/dd><\/div><div class=\"def-item\"><dt>Izobary<\/dt><dd>nuklidy różnych pierwiastków o tej samej liczbie masowej A<\/dd><\/div><div class=\"def-item\"><dt>Jon<\/dt><dd>atom lub grupa atomów z ładunkiem elektrycznym<\/dd><\/div><div class=\"def-item\"><dt>Kation<\/dt><dd>jon dodatni — ma mniej elektronów niż protonów<\/dd><\/div><div class=\"def-item\"><dt>Anion<\/dt><dd>jon ujemny — ma więcej elektronów niż protonów<\/dd><\/div><div class=\"def-item\"><dt>Jon wieloatomowy<\/dt><dd>grupa atomów z jednym wspólnym ładunkiem, np. SO₄²⁻, NH₄⁺<\/dd><\/div><div class=\"def-item\"><dt>Masa atomowa (m_at)<\/dt><dd>średnia ważona mas izotopów pierwiastka w naturalnej mieszaninie, w jednostkach u<\/dd><\/div><div class=\"def-item\"><dt>Średnia ważona<\/dt><dd>suma iloczynów wartości i ich udziałów<\/dd><\/div><div class=\"def-item\"><dt>Izotop promieniotwórczy<\/dt><dd>izotop o nietrwałym jądrze, które samorzutnie się rozpada<\/dd><\/div><div class=\"def-item\"><dt>Nukleon<\/dt><dd>wspólna nazwa protonu i neutronu<\/dd><\/div><div class=\"def-item\"><dt>Deuter<\/dt><dd>izotop wodoru ²H (D) — 1 proton i 1 neutron<\/dd><\/div><div class=\"def-item\"><dt>Tryt<\/dt><dd>izotop wodoru ³H (T) — promieniotwórczy<\/dd><\/div><div class=\"def-item\"><dt>Masa izotopu<\/dt><dd>masa jednego atomu danego nuklidu, w u<\/dd><\/div><div class=\"def-item\"><dt>Masa cząsteczkowa<\/dt><dd>suma mas atomowych atomów w cząsteczce, w u<\/dd><\/div><div class=\"def-item\"><dt>Jednostka wzoru<\/dt><dd>suma mas atomowych w najprostszym wzorze związku jonowego (NaCl: 58,5 u)<\/dd><\/div><div class=\"def-item\"><dt>Spektrometr mas<\/dt><dd>przyrząd rozdzielający jony według stosunku masy do ładunku; mierzy udziały izotopów<\/dd><\/div><div class=\"def-item\"><dt>Okres półtrwania<\/dt><dd>czas, po którym rozpadnie się połowa atomów danego izotopu promieniotwórczego<\/dd><\/div><div class=\"def-item\"><dt>Znacznik izotopowy<\/dt><dd>izotop, zwykle promieniotwórczy, używany do śledzenia drogi substancji<\/dd><\/div><\/dl>\n<\/section>\n<section id=\"checklista\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Checklista<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Umiem…<\/span>\n<ul>\n<li>☐ zdefiniować izotop i nuklid i rozpoznać izotopy w zapisie,<\/li>\n<li>☐ policzyć p, n, e w izotopach i jonach (także ⁴⁰Ca²⁺),<\/li>\n<li>☐ nie mylić izotopu z jonem i z innym pierwiastkiem,<\/li>\n<li>☐ obliczyć masę atomową jako średnią ważoną i sprawdzić wynik,<\/li>\n<li>☐ odróżnić A, masę izotopu, masę atomową i masę cząsteczkową,<\/li>\n<li>☐ (ambitnie) rozpoznać izobary i obliczyć udział izotopu z masy atomowej.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"powtorki\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> System powtórek<\/div>\n<p>Kolejność powtórki (we własnym tempie):<\/p>\n<ol>\n<li>karta z <a href=\"#powtorka\">§10<\/a> i ćwiczenia A,<\/li>\n<li>fiszki,<\/li>\n<li>ćwiczenia B (średnia ważona),<\/li>\n<li>test z <a href=\"#test\">§9<\/a>,<\/li>\n<li>po F06 — F04 + F05 + F06 razem: krótki zestaw przekrojowy.<\/li>\n<\/ol>\n<\/section>\n<section id=\"mosty\">\n<div class=\"part-heading\"><span class=\"part-num\">A<\/span> Dodatek A — mosty i co dalej<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Powiązania<\/span>\n<ul>\n<li><strong>F04 Atom<\/strong> — Z, A, zapis nuklidu, liczenie p, n, e; tu: izotopy i masa atomowa.<\/li>\n<li><strong>F06 Układ okresowy<\/strong> — skoro Z definiuje pierwiastek, porządkujemy pierwiastki według Z; masa atomowa w każdym polu.<\/li>\n<li><strong>F07 Konfiguracja elektronowa<\/strong> — dlaczego izotopy reagują tak samo (te same elektrony) i które jony są typowe.<\/li>\n<li><strong>F09–F12<\/strong> — ładunek jonu w wzorach, jony wieloatomowe, masa cząsteczkowa.<\/li>\n<li><strong>R04 Mol<\/strong> — masa atomowa w obliczeniach: mol, masa molowa.<\/li>\n<li><strong>A01–A03 Chemia jądrowa<\/strong> — izotopy promieniotwórcze, rozpady, datowanie ¹⁴C.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1 — audyt 05 (2026-10-13)<\/div>\n<p>Wprowadzono:\n- A1: masa atomowa oznaczona <strong>m_at<\/strong> (w tablicach często Ar), z uwagą o symbolu argonu Ar; zamienione wszystkie „Ar(Cl)”, „Ar =”, „Ar(C)”, „Aᵣ”.\n- A2: masa elektronu ≈ 0,00055 u (≈ 1/1836 masy protonu).\n- A3: stosunek dla Cl₂ ≈ 10 : 6 : 1 (z notką, że 9 : 6 : 1 dotyczy udziałów 3 : 1).\n- A4: wiersz „promieniotwórczy” poprawiony na nuklidy (dodano ³H).\n- A5: wiersz „Masa cząsteczkowa NaCl” zamieniony na poprawne zdanie (58,5 u to jednostka wzoru).\n- A6: uwagi robocze („dana do weryfikacji”, „Wartości do weryfikacji”) zastąpione wartością D₂O 101,4 °C i odesłaniem do tablic.\n- A7: uzasadnienie przybliżenia w zadaniach odwrotnych (⁷⁹Br 78,918 u, ⁶⁹Ga 68,926 u) + tabela mas izotopów.\n- A8: §2 zostaje jako krótka powtórka; dodano jony wieloatomowe z liczeniem p i e, jony o zmiennym ładunku (Fe²⁺/Fe³⁺, Cu⁺/Cu²⁺).\n- A9: efekt izotopowy (H vs D, D₂O 101,4 °C) w karcie „Dlaczego izotopy reagują prawie tak samo?”.\n- A10: wewnętrzna sekcja „Modele silnika” i uwagi o <code>CHE.DATA.ISOTOPES<\/code> usunięte z lekcji (przeniesione do <code>chemia/plany/audyty/GFX_TODO_F05.md<\/code>).\n- B1: jony wieloatomowe — tabela p i e (NH₄⁺, OH⁻, NO₃⁻, CO₃²⁻, SO₄²⁻) + zadania G.\n- B2: krok 6 w procedurze (suma udziałów 100%) + zadanie z brakującym udziałem.\n- B3: zadania z tablicy mas (⁶³Cu/⁶⁵Cu, ¹⁰B/¹¹B) w sekcji G.\n- B4: tabela zastosowań izotopów (¹⁴C, ¹³¹I, ⁶⁰Co, ²H, ²³⁵U) z pytaniem i zdaniem o bezpieczeństwie (odesłanie do A01–A03).\n- B5: akapit „Skąd znamy udziały?” (spektrometr mas). Wykres słupkowy Cl (35/37) — do zbudowania; zob. GFX_TODO_F05.md.\n- B6: test +6 pytań (SO₄²⁻, ³⁷Cl⁻, trzy izotopy, zakres średniej, niemożliwa masa atomowa, A jako liczba całkowita); wszystkie pytania mają <code>!<\/code>.\n- B7: słownik +10 (nukleon, deuter, tryt, masa izotopu, masa cząsteczkowa, jednostka wzoru, spektrometr mas, okres półtrwania, znacznik izotopowy), fiszki +10 (w tym obliczeniowe).\n- B8: olimpijska O5 (HCl z izotopami), O6 (H₂O/HDO/D₂O), O7 (trzy izotopy z jedną zależnością); nagłówek bez „do zweryfikowania”.\n- B9: klinika +4 wiersze (D i H, izotopy a elektrony, masa atomowa a najcięższy izotop, średnia 36,8 u).\n- B10: tabela pomiarów w doświadczeniu 2 (przykładowe wyniki 1,125 g) + pytanie o niepewność wagi.\n- C: stan i stopka v1.1; changelog usunięty; „(orientacyjnie)” usunięte; odnośniki <code>#mosty<\/code> zamienione na nazwy lekcji; „R (stechiometria)” → R04 Mol (istnieje w spisie); odwołanie do F21 usunięte (lekcja nie potwierdzona w spisie).<\/p>\n<p>Nieprzyjęte / sprawdzone:\n- B6 — w audycie wskazano pytania 1, 6, 7 bez <code>!<\/code>; w wersji przed audytem wszystkie miały <code>!<\/code> — zostaje.\n- C — <code>$$<\/code> w jednej linii: zostaje (konwencja silnika, jak w F01–F04).\n- A1 — wariant z ramką zamiast zmiany symbolu nie został użyty: oznaczenie m_at jest krótsze i jednoznaczne.<\/p>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA F05 v1.1 MASTER<\/strong> · Izotopy, jony i masa atomowa · 2026<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n"</script>
