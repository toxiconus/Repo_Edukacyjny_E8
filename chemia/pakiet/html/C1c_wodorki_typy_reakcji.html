an._t = (performance.now() - t0) / 1000; } grane = false; zegar.usun(klatka); }\n    c.addEventListener('click', function () { grane ? stop() : start(); });\n    if ('IntersectionObserver' in g && !RM_) {\n      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { e.isIntersecting ? start() : stop(); }); });\n      io.observe(c);\n    } else if (!RM_) { start(); }\n    k.rysuj(ctx, c.width, c.height, stan, 0, opc);\n    return {stop: stop, start: start, stan: stan, canvas: c};\n  }\n  g.KLOCKI = {def: def, montuj: montuj, zegar: zegar, nazwy: function () { return Object.keys(reg); }};\n})(window);\n\n/* KLOCKI — wspólne narzędzia (kolejność: pierwsze w manifeście). Wyciągnięte z animacji P01. */\n/* ---------------------------- narzędzia ---------------------------- */\nvar RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);\nfunction el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }\nfunction clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }\nfunction sm(v) { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }\nfunction cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }\nfunction hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }\nfunction rgba(h, a) { var c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }\nfunction mixHex(a, b, k) {\n  var A = hex2rgb(a), B = hex2rgb(b);\n  return '#' + [0, 1, 2].map(function (i) { return ('0' + Math.round(A[i] + (B[i] - A[i]) * k).toString(16)).slice(-2); }).join('');\n}\nfunction rr(x, a, b, w, h, r) {\n  x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);\n  x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();\n}\n\n\n/* ---------------------------- pętla animacji ---------------------------- */\n// jeden zegar: KLOCKI.zegar (kloc wapiennej to dowód, że gazem był CO₂.',bhp:'Woda wapienna drażni oczy i skórę; okulary.'}},\n 'GFX.rx · rozszerzenia.js (F01)');\n\n/* ---------- 7. Zlewki GFX dla F03 (mieszaniny do rozdzielania) — pracownia łączy je z zlewkami F01 ---------- */\nvar RXF3={\n f03PiasekWoda:{n:'Piasek + woda (zawiesina)',solid:{col:[214,190,140],eq:4,end:1,t:'powder',shape:'powder'},turb:.25,out:['nic'],qualitative:1,eq:'piasek(s) + H₂O(c) — brak reakcji',why:'Piasek nie rozpuszcza się: po zamieszaniu woda mętnieje, po chwili ziarna opadają na dno (sedymentacja), a nad osadem zostaje prawie klarowna woda. Dwie fazy — mieszanina niejednorodna.'},\n f03KredaWoda:{n:'Kreda + woda (zawiesina)',solid:{col:[246,246,242],eq:4,end:1,t:'powder',shape:'powder'},turb:.7,out:['nic'],qualitative:1,eq:'CaCO₃(s) + H₂O(c) — brak reakcji',why:'Drobna kreda tworzy mleczną zawiesinę, która opada wolno. Sączek zatrzymuje cząstki kredy, a przesącz jest klarowny.'}\n};\nif(rx)Object.keys(RXF3).forEach(function(k){if(!rx.get(k))rx.register(k,RXF3[k])});\n\npracownia('f03-rozdzielanie-v01','Pracownia: rozdzielanie mieszanin','Najpierw nazwij różnicę właściwości, potem wybierz metodę: zawiesiny (sedymentacja, dekantacja, sączenie), roztwór (odparowanie, krystalizacja).',\n [['Zawiesiny — ciało stałe nierozpuszczalne',['f03PiasekWoda','f03KredaWoda']],['Roztwór — substancja rozpuszczona',['f01SolWoda','f01Odparowanie']]],\n {f03PiasekWoda:{war:'piasek w zlewce z wodą, zamieszanie bagietką, odstawienie',wn:'Różnica: piasek nie rozpuszcza się i ma większą gęstość niż woda → sedymentacja, potem dekantacja albo sączenie.',bhp:'Szkło — ostrożnie; okulary.'},\n  f03KredaWoda:{war:'sproszkowana kreda w wodzie, mieszanie',wn:'Drobne cząstki opadają wolno — szybciej rozdzieli je sączenie przez bibułę; przesącz jest klarowny.',bhp:'Okulary; sączek nie może być przedziurawiony bagietką.'},\n  f01SolWoda:{war:'sól kuchenna w wodzie, mieszanie',wn:'Sól rozpuszcza się — przechodzi przez sączek razem z wodą. Sączenie nie z dth:'+W+'px;display:block;margin:auto\" role=\"img\" aria-label=\"Model atomu: '+p+' p, '+n+' n, '+e+' e\">';\n var N=p+n,sk=W/260;\n for(var i=0;i<N;i++){var a=i*2.39996,r=4.2*sk*Math.sqrt(i+.5);svg+='<circle cx=\"'+(C+r*Math.cos(a)).toFixed(1)+'\" cy=\"'+(C+r*Math.sin(a)).toFixed(1)+'\" r=\"'+(4.6*sk).toFixed(1)+'\" fill=\"'+(Math.floor((i+1)*p/N)>Math.floor(i*p/N)?'#d9534f':'#7f8da0')+'\" stroke=\"#fff\" stroke-width=\".8\"/>'}\n var sh=[];if(o.powloki){var cap=[2,8,8],left=e;for(var q=0;left>0;q++){var c=q<3?Math.min(cap[q],left):left;sh.push(c);left-=c}}else if(e)sh=[e];\n var R0=o.powloki?Math.max(40*sk,6*sk*Math.sqrt(N)+18*sk):104*sk,st=sh.length>1?(104*sk-R0)/(sh.length-1):0;\n sh.forEach(function(cnt,q){var R=sh.length>1?R0+q*st:(o.powloki?R0:104*sk),wal=o.powloki&&q===sh.length-1;\n  svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+R.toFixed(1)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n  if(o.powloki)svg+='<text x=\"'+(C+R*0.71+4).toFixed(1)+'\" y=\"'+(C-R*0.71-4).toFixed(1)+'\" font-size=\"'+(11*sk).toFixed(0)+'\" fill=\"#5b6773\">'+'KLMN'[q]+'<\/text>';\n  for(var k=0;k<cnt;k++){var b=k/cnt*2*Math.PI-Math.PI/2;svg+='<circle cx=\"'+(C+R*Math.cos(b)).toFixed(1)+'\" cy=\"'+(C+R*Math.sin(b)).toFixed(1)+'\" r=\"'+(5*sk).toFixed(1)+'\" fill=\"'+(o.powloki?(wal?'#b85f00':'#2e7d4f'):'#2f7bd8')+'\"/>'}});\n if(!e)svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+(104*sk)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n return svg}\ntry{C.LAB=C.LAB||{};C.LAB.atomSVG=atomSVG}catch(_){}\n/* atomBohr, orbitalCloud → engine/src/dodatki/atlas-gfx.js (wspólne dla labu i lekcji, CHE.LAB.*) */\n\nV.define('f05-izotopy-v01',{title:'Izotop, jon czy inny pierwiastek? Konstruktor atomu i masa atomowa',tag:'MODEL',\n hint:'Dodawaj i zabieraj protony, neutrony i elektrony. Model mówi, co się zmieniło: pierwiastek (Z), izotop (n) czy ładunek (e). Niżej: skąd się bierze masa atomowa z układu okresowego.',\n foot:'rozszerzenia.js §8 · dane: CHE ype=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><\/section>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><\/nav><\/details>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć na etap rejonowy — 10 punktów<\/h3>\n<ol>\n<li>Zdefiniować <strong>wodorek<\/strong> i podać wodorki niemetali: H₂O, HCl, H₂S, NH₃, CH₄.<\/li>\n<li>Podać nazwy systematyczne i zwyczajowe: chlorowodór (kwas solny), siarkowodór, amoniak, metan.<\/li>\n<li>Podać odczyn roztworów wodnych: HCl i H₂S kwaśny, NH₃ zasadowy, H₂O obojętny, CH₄ brak dysocjacji (obojętny).<\/li>\n<li>Zapisać reakcję syntezy chlorowodoru: H₂ + Cl₂ → 2 HCl.<\/li>\n<li>Zapisać synteza NH₃ z pierwiastków (N₂ + 3 H₂ ⇌ 2 NH₃) i wiedzieć, że jest odwracalna.<\/li>\n<li>Zapisać reakcję wykrywania amoniaku: NH₄Cl + NaOH → NaCl + NH₃↑ + H₂O.<\/li>\n<li>Rozpoznać i nazwać <strong>pięć typów reakcji<\/strong>: synteza, analiza, wymiana pojedyncza, wymiana podwójna, zobojętnianie.<\/li>\n<li>Wskazać, że zobojętnianie jest szczególnym przypadkiem wymiany podwójnej.<\/li>\n<li>Uzasadnić wybór typu reakcji, licząc substraty i produkty oraz wolne pierwiastki.<\/li>\n<li>Zapisać przykład każdego typu reakcji.<\/li>\n<\/ol>\n<\/section>\n<p>---<\/p>\n<section>\n<div class=\"part-heading\">Cel lekcji<\/div>\n<p>W tej lekcji poznasz <strong>wodorki niemetali<\/strong>, ich odczyn w wodzie i sposoby otrzymywania. Nauczysz się też rozpoznawać <strong>pięć typów reakcji chemicznych<\/strong> po samym równaniu. Po lekcji odpowiesz, czy równanie Mg + 2 HCl → MgCl₂ + H₂↑ to synteza, analiza czy wymiana, i uzasadnisz odpowiedź.<\/p>\n<p>---<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">Wyjaśnienie krok po kroku<\/div>\n<h3>1. Czym są wodorki?<\/h3>\n<p><strong>Wodorek<\/strong> to związek wodoru z innym pierwiastkiem. Dzielimy je na:\n- <strong>wodorki niemetali<\/strong> — wodór z niemetalem (HCl, H₂S, NH₃, CH₄, H₂O); to główny temat tej lekcji,\n- <strong>wodorki metali<\/strong> — wodór z metalem (np. NaH, CaH₂); tylko wzmianka.<\/p>\n<p>Wodorki niemetali zachowują się w wodzie różnie:\n- część tworzy <strong>kwasy<\/strong> (HCl, H₂S), bo uwalnia jony H⁺ lub H₃O⁺,\n- część tworzy <strong>zasady<\/strong> (NH₃), bo przyjmuje H⁺ z wody i uwalnia OH⁻,\n- część jest <strong>obojętna<\/strong> (H₂O, CH₄).<\/p>\n<h3>2. Tabela wodorków niemetali<\/h3>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Wzór<\/th><th>Nazwa systematyczna<\/th><th>Nazwa roztworu<\/th><th>Odczyn<\/th><th>Uwagi<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>H₂O<\/td><td>tlenek wodoru<\/td><td>woda<\/td><td>obojętny (pH ≈ 7)<\/td><td>rozpuszczalnik<\/td><\/tr>\n<tr><td>HCl<\/td><td>chlorowodór (chlorek wodoru)<\/td><td>kwas solny<\/td><td>kwaśny, mocny kwas<\/td><td>gaz bardzo dobrze rozpuszczalny w wodzie<\/td><\/tr>\n<tr><td>H₂S<\/td><td>siarkowodór (siarczek wodoru)<\/td><td>kwas siarkowodorowy<\/td><td>kwaśny, słaby kwas<\/td><td>gaz o zapachu zgniłych jaj<\/td><\/tr>\n<tr><td>NH₃<\/td><td>azan (azotek wodoru)<\/td><td>amoniak (roztwór wodny)<\/td><td>zasadowy<\/td><td>roztwór zawiera jony NH₄⁺ i OH⁻<\/td><\/tr>\n<tr><td>CH₄<\/td><td>metan (węglik wodoru)<\/td><td>—<\/td><td>obojętny<\/td><td>słabo rozpuszczalny w wodzie, nie tworzy jonów<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Dlaczego tak?<\/strong> Odczyn zależy od tego, czy wodorek w wodzie tworzy jony:\n- HCl + H₂O → H₃O⁺ + Cl⁻ (kwas)\n- H₂S ⇌ H⁺ + HS⁻ (słaby kwas, dysocjacja częściowa)\n- NH₃ + H₂O ⇌ NH₄⁺ + OH⁻ (zasada)\n- CH₄ w wodzie nie tworzy jonów<\/p>\n<mnemonik>\n<p><strong>Kwasy: HCl i H₂S. Zasada: NH₃. Obojętne: H₂O i CH₄.<\/strong> Amoniak to jedyny ważny wodorek niemetalu, który w wodzie daje odczyn zasadowy — zapamiętaj go jako wyjątek.<\/p>\n<\/mnemonik>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n05-wodorki-v01\"><button type=\"button\" data-che-open-viz=\"n05-wodorki-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n05-wodorki-v01',lessonId:'C1c'},'*')\"><b>Mapa wodorków: kliknij pierwiastek<\/b><span>Silnik CHE · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Fragment układu okresowego (grupy 1, 2, 13–17 oraz kolumna d), w którym każdy pierwiastek jest przyciskiem z wzorem wodorku; kolor oznacza typ wiązania (jonowy, pośredni, kowalencyjny, metaliczny). Kliknięcie pokazuje nazwę, stopień utlenienia wodoru, elektroujemność, stan, temperaturę wrzenia i zachowanie w wodzie: HCl i HBr są mocnymi kwasami, H₂S słabym, NH₃ ma odczyn zasadowy, CH₄ nie reaguje z wodą. Kolumna d (wodorki metaliczne) jest poza zakresem LKO 2026/27. Wniosek: typ wodorku zależy od położenia pierwiastka, a nie każdy wodorek niemetalu jest kwasem. -->\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"n05-trendy-v01\"><button type=\"button\" data-che-open-viz=\"n05-trendy-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'n05-trendy-v01',lessonId:'C1c'},'*')\"><b>Temperatury wrzenia wodorków grup 14–17<\/b><span>wiązania wodorowe: H₂O, HF i NH₃ wrą „za wysoko”<\/span><\/button><\/div>\n<!-- OPIS: Wykres temperatur wrzenia wodorków grup 14–17 w okresach 2–5 (pod ciśnieniem 1013 hPa), z możliwością włączania grup. W każdej grupie temperatura wrzenia rośnie z masą cząsteczki, z wyjątkiem NH₃, H₂O i HF, które leżą wyraźnie wyżej. Wniosek: wiązania wodorowe między cząsteczkami podnoszą temperaturę wrzenia. -->\n<figure class=\"lk-fig\" data-klocek=\"wzor-2d\" data-opt=\"{&quot;smiles&quot;: &quot;O&quot;, &quot;grupa&quot;: &quot;none&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>H₂O<\/figcaption><\/figure>\n<!-- OPIS: Wzór strukturalny wody: atom tlenu z dwoma atomami wodoru, cząsteczka kątowa. -->\n<figure class=\"lk-fig\" data-klocek=\"wzor-2d\" data-opt=\"{&quot;smiles&quot;: &quot;N&quot;, &quot;grupa&quot;: &quot;none&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>NH₃<\/figcaption><\/figure>\n<!-- OPIS: Wzór strukturalny amoniaku: atom azotu z trzema atomami wodoru i wolną parą elektronową. -->\n<figure class=\"lk-fig\" data-klocek=\"wzor-2d\" data-opt=\"{&quot;smiles&quot;: &quot;C&quot;, &quot;grupa&quot;: &quot;none&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>CH₄<\/figcaption><\/figure>\n<!-- OPIS: Wzór strukturalny metanu: atom węgla z czterema atomami wodoru. -->\n<h3>3. Otrzymywanie wodorków<\/h3>\n<h4>a) Chlorowodór HCl<\/h4>\n<p><strong>Synteza z pierwiastków:<\/strong>\n$$\\text{H}_2 + \\text{Cl}_2 \\rightarrow 2\\,\\text{HCl}$$<\/p>\n<p>Gaz HCl dobrze rozpuszcza się w wodzie, dając kwas solny.<\/p>\n<p><strong>Wypieranie z soli mocnym kwasem (metoda laboratoryjna):<\/strong>\n$$\\text{NaCl}_{(s)} + \\text{H}_2\\text{SO}_{4(stęż.)} \\rightarrow \\text{NaHSO}_4 + \\text{HCl}\\uparrow$$<\/p>\n<p>Wymaga ogrzewania i stężonego kwasu siarkowego. Chlorowodór ulatnia się jako gaz. <em>(Czy etap rejonowy wymaga tej metody — patrz pytanie w sekcji „Do potwierdzenia”.)<\/em><\/p>\n<h4>b) Amoniak NH₃<\/h4>\n<p><strong>Synteza z pierwiastków (proces Habera-Boscha):<\/strong>\n$$\\text{N}_2 + 3\\,\\text{H}_2 \\rightleftharpoons 2\\,\\text{NH}_3$$<\/p>\n<p>Orientacyjne warunki przemysłowe: temperatura około 400–500 °C, wysokie ciśnienie (kilkaset atmosfer), katalizator żelazowy. Reakcja jest <strong>odwracalna<\/strong>. Wysokie ciśnienie przesuwa równowagę w stronę NH₃, bo po stronie substratów są 4 cząsteczki gazów, a po stronie produktów tylko 2.<\/p>\n<p><strong>Wykrywanie w laboratorium — z soli amonowej i zasady:<\/strong>\n$$\\text{NH}_4\\text{Cl} + \\text{NaOH} \\rightarrow \\text{NaCl} + \\text{NH}_3\\uparrow + \\text{H}_2\\text{O}$$<\/p>\n<h4>c) Siarkowodór H₂S<\/h4>\n<p><strong>Z siarczku żelaza(II) i mocnego kwasu:<\/strong>\n$$\\text{FeS} + 2\\,\\text{HCl} \\rightarrow \\text{FeCl}_2 + \\text{H}_2\\text{S}\\uparrow$$<\/p>\n<h4>d) Woda H₂O<\/h4>\n<p><strong>Synteza z pierwiastków:<\/strong>\n$$2\\,\\text{H}_2 + \\text{O}_2 \\rightarrow 2\\,\\text{H}_2\\text{O}$$<\/p>\n<p>Reakcja jest egzotermiczna. Mieszanina wodoru i tlenu w stosunku objętościowym 2 : 1 (mieszanina piorunująca) wybucha.<\/p>\n<h4>e) Metan CH₄<\/h4>\n<p>Metan powstaje w przyrodzie przy rozkładzie beztlenowym materii organicznej. Jest głównym składnikiem gazu ziemnego (zwykle ok. 70–95 %). Na etapie rejonowym wystarczy znać wzór, nazwę i fakt, że metan jest obojętny.<\/p>\n<h3>4. Wykrywanie amoniaku<\/h3>\n<p><strong>Reakcja:<\/strong> NH₄Cl + NaOH → NaCl + NH₃↑ + H₂O<\/p>\n<p><strong>Obserwacje:<\/strong>\n- wydziela się ostry, duszący zapach,\n- wilgotny czerwony papierek lakmusowy, trzymany przy wylocie probówki, niebieje (odczyn zasadowy).<\/p>\n<p><strong>Wniosek:<\/strong> w probówce powstał amoniak.<\/p>\n<h3>5. Pięć typów reakcji chemicznych<\/h3>\n<h4>a) Synteza (łączenie)<\/h4>\n<p>Dwa lub więcej substratów tworzy <strong>jeden<\/strong> produkt. Schemat: A + B → AB.\n- 2 H₂ + O₂ → 2 H₂O\n- H₂ + Cl₂ → 2 HCl\n- N₂ + 3 H₂ ⇌ 2 NH₃\n- 2 Mg + O₂ → 2 MgO<\/p>\n<h4>b) Analiza (rozkład)<\/h4>\n<p>Jeden substrat rozkłada się na <strong>dwa lub więcej<\/strong> produktów. Schemat: AB → A + B.\n- 2 H₂O → 2 H₂ + O₂ (elektroliza wody)\n- CaCO₃ → CaO + CO₂↑ (ogrzewanie)\n- 2 HgO → 2 Hg + O₂↑ (ogrzewanie)<\/p>\n<h4>c) Wymiana pojedyncza<\/h4>\n<p>Wolny pierwiastek wypiera inny pierwiastek ze związku. Substrat i produkt zawierają po jednym wolnym pierwiastku. Schemat: A + BC → AC + B.\n- Zn + 2 HCl → ZnCl₂ + H₂↑\n- Zn + CuSO₄ → ZnSO₄ + Cu↓\n- 2 Na + 2 H₂O → 2 NaOH + H₂↑\n- Cl₂ + 2 NaBr → 2 NaCl + Br₂<\/p>\n<h4>d) Wymiana podwójna<\/h4>\n<p>Dwa związki wymieniają się jonami. Substraty i produkty to same związki. Schemat: AB + CD → AD + CB.\n- AgNO₃ + NaCl → AgCl↓ + NaNO₃\n- BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2 NaCl\n- Na₂CO₃ + 2 HCl → 2 NaCl + H₂O + CO₂↑<\/p>\n<h4>e) Zobojętnianie<\/h4>\n<p>Kwas reaguje z zasadą, tworząc sól i wodę. Jest to <strong>szczególny przypadek wymiany podwójnej<\/strong>. Schemat: HA + BOH → BA + H₂O.\n- HCl + NaOH → NaCl + H₂O\n- H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O\n- 2 HCl + Ca(OH)₂ → CaCl₂ + 2 H₂O<\/p>\n<h3>6. Przegląd typów reakcji<\/h3>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Typ<\/th><th>Schemat<\/th><th>Substraty → produkty<\/th><th>Przykład<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Synteza<\/td><td>A + B → AB<\/td><td>2 → 1<\/td><td>H₂ + Cl₂ → 2 HCl<\/td><\/tr>\n<tr><td>Analiza<\/td><td>AB → A + B<\/td><td>1 → 2 lub więcej<\/td><td>CaCO₃ → CaO + CO₂↑<\/td><\/tr>\n<tr><td>Wymiana pojedyncza<\/td><td>A + BC → AC + B<\/td><td>pierwiastek + związek → związek + pierwiastek<\/td><td>Zn + 2 HCl → ZnCl₂ + H₂↑<\/td><\/tr>\n<tr><td>Wymiana podwójna<\/td><td>AB + CD → AD + CB<\/td><td>związek + związek → związek + związek<\/td><td>AgNO₃ + NaCl → AgCl↓ + NaNO₃<\/td><\/tr>\n<tr><td>Zobojętnianie<\/td><td>HA + BOH → BA + H₂O<\/td><td>kwas + zasada → sól + woda<\/td><td>HCl + NaOH → NaCl + H₂O<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<mnemonik>\n<p><strong>Kolejność sprawdzania: najpierw liczba substratów i produktów, potem wolne pierwiastki.<\/strong> Jeden produkt z dwóch substratów to synteza. Dwa produkty z jednego substratu to analiza. Wolny pierwiastek po obu stronach to wymiana pojedyncza.<\/p>\n<\/mnemonik>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"energy-profile\"><button type=\"button\" data-che-open-viz=\"energy-profile\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'energy-profile',lessonId:'C1c'},'*')\"><b>Profil energii: reakcja egzo- i endotermiczna<\/b><span>Silnik CHE · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Wykres profilu energii reakcji: oś pionowa to energia, a oś pozioma postęp reakcji. Krzywa zaczyna się na poziomie substratów i przechodzi przez szczyt energii aktywacji Eₐ do produktów. Gdy produkty leżą niżej niż substraty, widać różnicę ΔH < 0 (reakcja egzotermiczna, np. spalanie wodoru); gdy wyżej, ΔH > 0 (endotermiczna). Wniosek: egzo oddaje energię do otoczenia, endo ją pobiera. -->\n<h3>7. Algorytm rozpoznawania typu z równania<\/h3>\n<ol>\n<li>Policz substraty (po lewej) i produkty (po prawej).<\/li>\n<li>Sprawdź, czy są wolne pierwiastki (np. H₂, O₂, Mg, Zn, Br₂).<\/li>\n<li>Zastosuj tabelę:\n- 2 substraty → 1 produkt: <strong>synteza<\/strong>;\n- 1 substrat → 2 lub więcej produktów: <strong>analiza<\/strong>;\n- pierwiastek + związek → związek + pierwiastek: <strong>wymiana pojedyncza<\/strong>;\n- związek + związek → związek + związek: <strong>wymiana podwójna<\/strong>, a jeśli produktami są sól i woda z kwasu i zasady, to <strong>zobojętnianie<\/strong>.<\/li>\n<\/ol>\n<p><strong>Przykłady:<\/strong>\n- 2 Mg + O₂ → 2 MgO: 2 substraty, 1 produkt → <strong>synteza<\/strong>.\n- 2 H₂O → 2 H₂ + O₂: 1 substrat, 2 produkty → <strong>analiza<\/strong>.\n- Zn + 2 HCl → ZnCl₂ + H₂↑: pierwiastek + związek → związek + pierwiastek → <strong>wymiana pojedyncza<\/strong>.\n- AgNO₃ + NaCl → AgCl↓ + NaNO₃: związek + związek → związek + związek → <strong>wymiana podwójna<\/strong>.\n- HCl + NaOH → NaCl + H₂O: kwas + zasada → sól + woda → <strong>zobojętnianie<\/strong>.<\/p>\n<h3>8. Schemat otrzymywania HCl i NH₃<\/h3>\n<p><strong>Opis schematu syntezy HCl:<\/strong> po lewej cząsteczka H₂ (dwie połączone kule) i cząsteczka Cl₂ (dwie połączone kule), między nimi znak „+”. Strzałka reakcji. Po prawej dwie cząsteczki HCl, każda z jednej kuli wodoru i jednej chloru. Wniosek: z 1 cząsteczki H₂ i 1 cząsteczki Cl₂ powstają 2 cząsteczki HCl. Współczynnik 2 jest konieczny do zbilansowania.<\/p>\n<p><strong>Opis schematu syntezy NH₃:<\/strong> po lewej jedna cząsteczka N₂ i trzy cząsteczki H₂, po prawej dwie cząsteczki NH₃. Każda cząsteczka NH₃ ma jeden atom azotu i trzy atomy wodoru. Wniosek: współczynniki 1, 3 i 2 zapewniają po obu stronach 2 atomy azotu i 6 atomów wodoru.<\/p>\n<figure class=\"lk-fig\" data-klocek=\"bilans-rownania\" data-opt=\"{&quot;rownanie&quot;: &quot;H2 + Cl2 -&gt; 2 HCl&quot;, &quot;przyklady&quot;: &quot;H2 + Cl2 -&gt; 2 HCl; N2 + 3 H2 -&gt; 2 NH3&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Bilans atomów przy syntezie HCl i NH₃<\/figcaption><\/figure>\n<!-- OPIS: Tabela liczby atomów H, Cl i N po obu stronach równań syntezy. Po lewej H₂ + Cl₂ (2 atomy H i 2 atomy Cl), po prawej 2 HCl (2 atomy H i 2 atomy Cl); druga reakcja N₂ + 3 H₂ → 2 NH₃ daje 2 atomy N i 6 atomów H po obu stronach. Wniosek: współczynniki dobrano tak, by liczba atomów każdego pierwiastka była taka sama po obu stronach. -->\n<p>---<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">Ciekawostki i mnemotechniki<\/div>\n<ciekawostka>\n<p><strong>Proces Habera-Boscha<\/strong> został opracowany na początku XX w. przez Fritza Habera i rozwinięty przez Carla Boscha. Fritz Haber otrzymał Nagrodę Nobla z chemii za syntezę amoniaku (przyznaną w 1919 r. za rok 1918). Dzięki tej metodzie produkcja nawozów azotowych stała się przemysłowa.<\/p>\n<\/ciekawostka>\n<ciekawostka>\n<p><strong>Amoniak<\/strong> działa drażniąco na błony śluzowe, bo w wilgotnych tkankach tworzy zasadowy roztwór. Dlatego ostry zapach amoniaku ostrzega przed kontaktem z nim.<\/p>\n<\/ciekawostka>\n<ciekawostka>\n<p><strong>Metan<\/strong> jest głównym składnikiem gazu ziemnego. Spala się czysto: CH₄ + 2 O₂ → CO₂ + 2 H₂O. Jest też silnym gazem cieplarnianym, a jego wpływ na klimat w krótkim okresie jest wielokrotnie większy niż CO₂ (wg IPCC AR6 dla metanu kopalnego: ok. 82 razy silniejszy niż CO₂ w ciągu 20 lat, ok. 30 razy w ciągu 100 lat).<\/p>\n<\/ciekawostka>\n<mnemonik>\n<p><strong>Pięć typów reakcji: S-A-W-W-Z<\/strong> — Synteza, Analiza, Wymiana pojedyncza, Wymiana podwójna, Zobojętnianie.<\/p>\n<\/mnemonik>\n<p>---<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">Ćwiczenia z kluczem i punktacją<\/div>\n<h3>Ćwiczenie 1 (5 pkt) — wodorki niemetali<\/h3>\n<p>Wymień 5 wodorków niemetali z etapu rejonowego: wzór, nazwę systematyczną i odczyn roztworu wodnego.<\/p>\n<p><strong>Rozwiązanie:<\/strong> po 1 pkt za każdy wodorek:\n1. H₂O — tlenek wodoru — obojętny.\n2. HCl — chlorowodór — kwaśny.\n3. H₂S — siarkowodór — kwaśny (słaby).\n4. NH₃ — azan (azotek wodoru) — zasadowy.\n5. CH₄ — metan — obojętny.<\/p>\n<h3>Ćwiczenie 2 (4 pkt) — synteza HCl<\/h3>\n<p>Napisz równanie syntezy HCl z pierwiastków i rozpoznaj typ reakcji.<\/p>\n<p><strong>Rozwiązanie:<\/strong> $\\text{H}_2 + \\text{Cl}_2 \\rightarrow 2\\,\\text{HCl}$ (2 pkt: 1 za wzory, 1 za współczynnik 2). Typ: <strong>synteza<\/strong> — 2 substraty, 1 produkt (2 pkt).<\/p>\n<h3>Ćwiczenie 3 (5 pkt) — wykrywanie amoniaku<\/h3>\n<p>Napisz reakcję wykrywania amoniaku z NH₄Cl i NaOH. Opisz obserwacje i wniosek.<\/p>\n<p><strong>Rozwiązanie:<\/strong>\n- równanie: NH₄Cl + NaOH → NaCl + NH₃↑ + H₂O (2 pkt),\n- obserwacje: ostry, duszący zapach; wilgotny czerwony papierek lakmusowy niebieje (2 pkt),\n- wniosek: w probówce powstaje amoniak (1 pkt).<\/p>\n<h3>Ćwiczenie 4 (4 pkt) — rozpoznawanie typów<\/h3>\n<p>Rozpoznaj typ każdej reakcji:\na) 2 Mg + O₂ → 2 MgO\nb) 2 H₂O → 2 H₂ + O₂\nc) Zn + CuSO₄ → ZnSO₄ + Cu\nd) AgNO₃ + NaCl → AgCl↓ + NaNO₃<\/p>\n<p><strong>Rozwiązanie:<\/strong> a) synteza; b) analiza; c) wymiana pojedyncza; d) wymiana podwójna (po 1 pkt).<\/p>\n<h3>Ćwiczenie 5 (4 pkt) — zobojętnianie<\/h3>\n<p>Napisz równanie zobojętniania H₂SO₄ przez NaOH i rozpoznaj typ reakcji.<\/p>\n<p><strong>Rozwiązanie:<\/strong> H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O (3 pkt: 1 za wzory, 1 za współczynnik 2, 1 za bilans). Typ: <strong>zobojętnianie<\/strong>, czyli szczególny przypadek wymiany podwójnej (1 pkt).<\/p>\n<h3>Ćwiczenie 6 (4 pkt) — synteza amoniaku<\/h3>\n<p>Napisz równanie syntezy NH₃ z N₂ i H₂. Rozpoznaj typ.<\/p>\n<p><strong>Rozwiązanie:<\/strong> N₂ + 3 H₂ → 2 NH₃ (3 pkt: 1 za wzory, 1 za współczynnik 3, 1 za współczynnik 2). Typ: <strong>synteza<\/strong> (1 pkt).<\/p>\n<h3>Ćwiczenie 7 (5 pkt) — wymiana pojedyncza i podwójna<\/h3>\n<p>Rozpoznaj typ i uzasadnij:\na) Cl₂ + 2 NaBr → 2 NaCl + Br₂\nb) BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2 NaCl<\/p>\n<p><strong>Rozwiązanie:<\/strong>\na) <strong>Wymiana pojedyncza<\/strong> — wolny chlor wypiera brom z soli; produkt Br₂ też jest wolnym pierwiastkiem (2,5 pkt).\nb) <strong>Wymiana podwójna<\/strong> — dwa związki wymieniają się jonami; powstaje osad BaSO₄ (2,5 pkt).<\/p>\n<h3>Ćwiczenie 8 (4 pkt) — synteza czy analiza?<\/h3>\n<p>Czy reakcja 2 HgO → 2 Hg + O₂↑ to synteza, czy analiza? Uzasadnij.<\/p>\n<p><strong>Rozwiązanie:<\/strong> <strong>analiza<\/strong> (2 pkt). Jeden związek (HgO) rozkłada się na dwa produkty — wolną rtęć i tlen (2 pkt).<\/p>\n<p>---<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">Pułapki i typowe błędy<\/div>\n<p><strong>Pułapka 1. Liczenie produktów zamiast substratów.<\/strong> Uczeń uważa, że H₂ + Cl₂ → 2 HCl to analiza, bo jest „dwa produkty”. Liczymy <strong>substraty<\/strong> i <strong>produkty<\/strong> po obu stronach z uwzględnieniem współczynników: tu 2 substraty i 1 produkt związkowy — to synteza.<\/p>\n<p><strong>Pułapka 2. Wymiana pojedyncza z wymianą podwójną.<\/strong> Wymiana pojedyncza ma wolny pierwiastek po obu stronach. Wymiana podwójna ma same związki.<\/p>\n<p><strong>Pułapka 3. Zobojętnianie jako trzeci rodzaj wymiany.<\/strong> Zobojętnianie to podtyp wymiany podwójnej. Na zawodach można podać oba określenia, ale nie „synteza” ani „analiza”.<\/p>\n<p><strong>Pułapka 4. Wszystkie wodorki niemetali to kwasy.<\/strong> NH₃ tworzy roztwór zasadowy, a CH₄ jest obojętny. Nie myl NH₃ z kwasem.<\/p>\n<p><strong>Pułapka 5. HCl i H₂S mają tę samą moc.<\/strong> HCl jest mocnym kwasem, całkowicie dysocjuje. H₂S jest słabym kwasem, dysocjuje częściowo.<\/p>\n<p><strong>Pułapka 6. CH₄ jako kwas metanowy.<\/strong> Metan to węglowodór. Kwas metanowy to HCOOH — inny związek.<\/p>\n<p><strong>Pułapka 7. Brak współczynników.<\/strong> Zapis H₂ + Cl₂ → HCl jest niezbilansowany. Poprawnie: H₂ + Cl₂ → 2 HCl.<\/p>\n<p><strong>Pułapka 8. Brak strzałki przy gazie.<\/strong> Przy produktach gazowych (NH₃↑, HCl↑, H₂S↑) zaznacz strzałkę ↑.<\/p>\n<p><strong>Pułapka 9. Chlorek amonu to nie amoniak.<\/strong> NH₄Cl jest solą amonową. Amoniak to NH₃.<\/p>\n<p><strong>Pułapka 10. Współczynniki przy zobojętnianiu.<\/strong> Ca(OH)₂ daje 2 jony OH⁻, więc potrzebuje 2 cząsteczek HCl: 2 HCl + Ca(OH)₂ → CaCl₂ + 2 H₂O. Zapis HCl + Ca(OH)₂ → CaCl₂ + H₂O jest niezbilansowany.<\/p>\n<p>---<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">Mini-test (8 pytań)<\/div>\n<p><strong>1. HCl w roztworze wodnym ma odczyn:<\/strong> a) obojętny; b) kwaśny; c) zasadowy; d) zależy od stężenia.\nOdpowiedź: <strong>b)<\/strong>.<\/p>\n<p><strong>2. NH₃ w roztworze wodnym ma odczyn:<\/strong> a) obojętny; b) kwaśny; c) zasadowy; d) nie rozpuszcza się.\nOdpowiedź: <strong>c)<\/strong>.<\/p>\n<p><strong>3. Reakcja H₂ + Cl₂ → 2 HCl to:<\/strong> a) synteza; b) analiza; c) wymiana pojedyncza; d) wymiana podwójna.\nOdpowiedź: <strong>a)<\/strong>.<\/p>\n<p><strong>4. Reakcja Zn + 2 HCl → ZnCl₂ + H₂↑ to:<\/strong> a) synteza; b) analiza; c) wymiana pojedyncza; d) wymiana podwójna.\nOdpowiedź: <strong>c)<\/strong>.<\/p>\n<p><strong>5. Reakcja AgNO₃ + NaCl → AgCl↓ + NaNO₃ to:<\/strong> a) synteza; b) analiza; c) wymiana pojedyncza; d) wymiana podwójna.\nOdpowiedź: <strong>d)<\/strong>.<\/p>\n<p><strong>6. Reakcja HCl + NaOH → NaCl + H₂O to:<\/strong> a) synteza; b) analiza; c) wymiana pojedyncza; d) zobojętnianie.\nOdpowiedź: <strong>d)<\/strong> (szczególny przypadek wymiany podwójnej).<\/p>\n<p><strong>7. Amoniak wykrywa się po:<\/strong> a) charakterystycznym zapachu i zasadowym odczynie; b) kwaśnym odczynie; c) braku zapachu; d) białym osadzie z AgNO₃.\nOdpowiedź: <strong>a)<\/strong>.<\/p>\n<p><strong>8. Synteza NH₃ z pierwiastków to:<\/strong> a) N₂ + H₂ → NH₃; b) N₂ + 2 H₂ → 2 NH₃; c) N₂ + 3 H₂ → 2 NH₃; d) 2 N₂ + 3 H₂ → 2 NH₃.\nOdpowiedź: <strong>c)<\/strong> (2 atomy N i 6 atomów H po obu stronach).<\/p>\n<p>---<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">Podsumowanie<\/div>\n<p>Przed zawodami sprawdź, czy umiesz:<\/p>\n<ul>\n<li>[ ] wymienić wodorki niemetali i podać odczyn ich roztworów,<\/li>\n<li>[ ] zapisać syntezę HCl i NH₃ oraz reakcję wykrywania amoniaku,<\/li>\n<li>[ ] rozpoznać pięć typów reakcji po liczbie i rodzaju substratów i produktów,<\/li>\n<li>[ ] uzasadnić wybór typu reakcji,<\/li>\n<li>[ ] wskazać, że zobojętnianie jest wymianą podwójną.<\/li>\n<\/ul>\n<p>---<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">Do potwierdzenia przed publikacją<\/div>\n<ol>\n<li>Czy etap rejonowy wymaga warunków syntezy Habera-Boscha (temperatura, ciśnienie, katalizator), czy tylko samego równania? Lekcja podaje wartości orientacyjne.<\/li>\n<li>Czy metoda z NaCl i stężonym H₂SO₄ (otrzymywanie HCl) jest wymagana na etapie rejonowym?<\/li>\n<li>Czy reakcje wymiany pojedynczej z niemetalami (np. Cl₂ + 2 NaBr) są wymagane, czy wystarczy wymiana z metalem?<\/li>\n<li>Czy metan ma być omawiany wyłącznie jako wodorek (wzór, nazwa, odczyn), czy także przez spalanie?<\/li>\n<li>Czy uzasadnienie typu reakcji jest wymagane w punktacji, czy wystarczy podanie typu?<\/li>\n<li>Wartość wpływu metanu na klimat (w lekcji tylko jakościowo) — do uzupełnienia, jeśli konwencja wymaga liczby.<\/li>\n<\/ol>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA C1c · Wodorki niemetali i typy reakcji · wersja robocza po audycie W1 (2026-10-18)<\/strong><\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n"</script>
