ny przez klarowną wodę wapienną powoduje zmętnienie — powstaje biały osad węglanu wapnia. To test na CO₂.'},\n f01Mg:{n:'Spalanie magnezu (pokaz)',rxKey:'mgO2',vessel:'crucible',level:.02,solid:{col:[196,200,206],col2:[250,250,248],eq:3,end:.15,t:'chips',shape:'chips'},ppt:'ppt-caco3',habit:'crystal',out:['osad'],heat:1.6,T:800,teacher:1,eq:'2 Mg + O₂ → 2 MgO',why:'Wstążka spala się oślepiająco jasnym, białym płomieniem; zostaje biały, kruchy proszek bez metalicznego połysku — tlenek magnezu.'},\n f01FeS:{n:'Fe + S (ogrzewanie, pokaz)',vessel:'testTube',solid:{col:[150,146,96],col2:[38,36,34],eq:4,end:.9,t:'powder',shape:'powder'},level:.02,out:['nic'],heat:1.4,T:600,teacher:1,eq:'Fe + S → FeS',why:'Szarożółta mieszanina rozżarza się (także po odsunięciu palnika) i zmienia się w czarną, kruchą masę. Magnes nie przyciąga produktu — powstał siarczek żelaza(II).'}\n};\nvar RDF1={\n f01SodaOcet:[R([[1,'NaHCO3'],[1,'CH3COOH']],[[1,'CH3COONa'],[1,'H2O'],[1,'CO2']]),{type:'wymiana (wodorowęglan + kwas)',conditions:'temperatura pokojowa',observation:'pienienie, wydzielanie bezbarwnego gazu (CO₂)',safety:['ocet drażni oczy']}],\n f01FeS:[R([[1,'Fe'],[1,'S']],[[1,'FeS']]),{type:'synteza',conditions:'ogrzewanie mieszaniny w probówce',observation:'mieszanina rozżarza się, powstaje czarna krucha substancja niemagnetyczna',safety:['pokaz nauczyciela pod wyciągiem; możliwy SO₂']}]};\nvar SBF1={NaHCO3:['wodorowęglan sodu (soda oczyszczona)','s',84.007,'wodorosól',[],['proszek do pieczenia','gaśnice']],\n CH3COONa:['octan sodu','aq',82.034,'sól',[],['przemysł spożywczy','ogrzewacze chemiczne']],\n FeS:['siarczek żelaza(II)','s',87.91,'sól (czarna)',[],['otrzymywanie H₂S w laboratorium']]};\nObject.keys(SBF1).forEach(function(f){if(D.SUBSTANCES[f]||byF[f])return;var a=SBF1[f];D.SUBSTANCES[f]={formula:f,name:a[0],state:a[1],molarMass:a[2],role:a[3],safety:a[4],uses:a[5],src:'rozszerzenia.js'}});\nObject.keys(RDF1).forEach(function(k){if(D.REACTIONS[k])return;D.REACTIONS[k]=RDF1[k][0];D.REACTION_DATA[k]=Object.assign({products:RDF1[k][0].products.map(function(x){return x.formula})},RDF1[k][1])});\nif(rx)Object.keys(RXF1).forEach(function(k){if(!rx.get(k))rx.register(k,RXF1[k])});\n\npracownia('f01-doswiadczenia-v01','Pracownia: co naprawdę się zmieniło?','Zjawisko fizyczne czy reakcja chemiczna? Topnienie, rozpuszczanie i odparowanie kontra reakcje z nową substancją — zlewka, obserwacja, wniosek i BHP.',\n [['Zjawiska fizyczne',['f01SolWoda','f01Odparowanie']],['Reakcje chemiczne',['f01SodaOcet','f01Mg','f01FeS']],['Dowód produktu',['f01WodaWapienna']]],\n {f01SolWoda:{war:'łyżeczka soli kuchennej w wodzie, mieszanie bagietką',wn:'Zjawisko fizyczne (rozpuszczanie). Dowód: po odparowaniu wody sól wraca.',bhp:'Nie smakujemy substancji w pracowni.'},\n  f01Odparowanie:{war:'część roztworu soli w parownicy, ogrzewanie palnikiem lub płytą',wn:'Odzyskanie substancji wyjściowej potwierdza, że rozpuszczanie nie było reakcją.',bhp:'Gorąca parownica — chwytać szczypcami; okulary (pryskanie przy końcu odparowania).'},\n  f01SodaOcet:{war:'łyżeczka sody oczyszczonej, dolewamy ocet',wn:'Reakcja chemiczna: powstaje nowa substancja (gaz CO₂). Nazwa gazu to wniosek — potwierdza go woda wapienna.',bhp:'Okulary; ocet nie do oczu.'},\n  f01Mg:{war:'wstążka magnezu w szczypcach, w płomieniu palnika (pokaz)',wn:'Reakcja chemiczna: biały, kruchy MgO ma inne właściwości niż metaliczny magnez.',bhp:'Nie patrzeć w płomień; płonącego magnezu nie gasić wodą.'},\n  f01FeS:{war:'mieszanina opiłek żelaza i siarki w probówce, ogrzewanie (pokaz)',wn:'Przed ogrzaniem — mieszanina (magnes wyciąga żelazo); po — związek FeS (magnes nie przyciąga). Rozstrzyga test właściwości.',bhp:'Pokaz pod wyciągiem; możliwy trujący SO₂; gorąca probówka może pęknąć.'},\n  f01WodaWapienna:{war:'gaz przepuszczony przez wodę wapienną',wn:'Zmętnienie wody wapiennej to dowód, że gazem był CO₂.',bhp:'Woda wapienna drażni oczy i skórę; okulary.'}},\n 'GFX.rx · rozszerzenia.js (F01)');\n\n/* ---------- 7. Zlewki GFX dla F03 (mieszaniny do rozdzielania) — pracownia łączy je z zlewkami F01 ---------- */\nvar RXF3={\n f03PiasekWoda:{n:'Piasek + woda (zawiesina)',solid:{col:[214,190,140],eq:4,end:1,t:'powder',shape:'powder'},turb:.25,out:['nic'],qualitative:1,eq:'piasek(s) + H₂O(c) — brak reakcji',why:'Piasek nie rozpuszcza się: po zamieszaniu woda mętnieje, po chwili ziarna opadają na dno (sedymentacja), a nad osadem zostaje prawie klarowna woda. Dwie fazy — mieszanina niejednorodna.'},\n f03KredaWoda:{n:'Kreda + woda (zawiesina)',solid:{col:[246,246,242],eq:4,end:1,t:'powder',shape:'powder'},turb:.7,out:['nic'],qualitative:1,eq:'CaCO₃(s) + H₂O(c) — brak reakcji',why:'Drobna kreda tworzy mleczną zawiesinę, która opada wolno. Sączek zatrzymuje cząstki kredy, a przesącz jest klarowny.'}\n};\nif(rx)Object.keys(RXF3).forEach(function(k){if(!rx.get(k))rx.register(k,RXF3[k])});\n\npracownia('f03-rozdzielanie-v01','Pracownia: rozdzielanie mieszanin','Najpierw nazwij różnicę właściwości, potem wybierz metodę: zawiesiny (sedymentacja, dekantacja, sączenie), roztwór (odparowanie, krystalizacja).',\n [['Zawiesiny — ciało stałe nierozpuszczalne',['f03PiasekWoda','f03KredaWoda']],['Roztwór — substancja rozpuszczona',['f01SolWoda','f01Odparowanie']]],\n {f03PiasekWoda:{war:'piasek w zlewce z wodą, zamieszanie bagietką, odstawienie',wn:'Różnica: piasek nie rozpuszcza się i ma większą gęstość niż woda → sedymentacja, potem dekantacja albo sączenie.',bhp:'Szkło — ostrożnie; okulary.'},\n  f03KredaWoda:{war:'sproszkowana kreda w wodzie, mieszanie',wn:'Drobne cząstki opadają wolno — szybciej rozdzieli je sączenie przez bibułę; przesącz jest klarowny.',bhp:'Okulary; sączek nie może być przedziurawiony bagietką.'},\n  f01SolWoda:{war:'sól kuchenna w wodzie, mieszanie',wn:'Sól rozpuszcza się — przechodzi przez sączek razem z wodą. Sączenie nie zadziała; trzeba wykorzystać lotność wody (odparowanie, krystalizacja lub destylacja).',bhp:'Nie smakujemy substancji w pracowni.'},\n  f01Odparowanie:{war:'roztwór soli w parownicy, ogrzewanie',wn:'Woda odparowuje, sól krystalizuje na dnie — odzyskujemy substancję rozpuszczoną (wodę tracimy; chcąc ją odzyskać — destylacja).',bhp:'Gorąca parownica — szczypce; okulary (pryskanie pod koniec).'}},\n 'GFX.rx · rozszerzenia.js (F03)');\n\n/* ---------- 8. F05 — konstruktor: izotop / jon / inny pierwiastek + masa atomowa jako średnia ważona ----------\n   Model wielokrotnego użytku (F04, F05, F06, A01…): `f05-izotopy-v01`. Dane izotopów z silnika (CHE.DATA.ISOTOPES). */\n/* dane z silnika (bez lokalnej kopii): CHE.DATA.ELEMENTS_54 (symbol, nazwa) + CHE.DATA.ISOTOPES (A, masa, udział) */\nfunction izo(z){var E=(D.ELEMENTS_54||[]).filter(function(e){return e.z===z})[0];if(!E)return null;\n var L=(D.ISOTOPES||{})[E.s]||[];return [E.s,String(E.n||E.s).toLowerCase(),L.map(function(x){return [x.A,x.atomicMass,(x.abundance||0)*100]}).sort(function(a,b){return b[2]-a[2]||a[0]-b[0]})]}\nfunction supN(n){return String(n).replace(/[0-9]/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]})}\nfunction subN(n){return String(n).replace(/[0-9]/g,function(d){return '₀₁₂₃₄₅₆₇₈₉'[d]})}\nfunction chg(q){return q===0?'':(Math.abs(q)>1?supN(Math.abs(q)):'')+(q>0?'⁺':'⁻')}\nfunction pl(x,d){return x.toFixed(d).replace('.',',')}\n/* atomSVG — komponent wielokrotnego użytku (F05, F07, A01…): model atomu jako SVG, kolory jak w atlasie (_anon_004 bohr: elektrony wewnętrzne #2f8a55, walencyjne #b85f00).\n   o = {p, n, e, powloki:false|true, W:260}. powloki:false → elektrony na jednym okręgu (F05; powłoki to pojęcie F07);\n   powloki:true → powłoki K, L, M, N wg modelu szkolnego 2, 8, 8, … (do Z = 20; dalej uproszczenie — do weryfikacji). Zwraca otwarty <svg…> (zamknąć '<\/svg>'). */\nfunction atomSVG(o){var W=o.W||260,C=W/2,p=o.p|0,n=o.n|0,e=o.e|0,svg='<svg viewBox=\"0 0 '+W+' '+W+'\" width=\"100%\" style=\"max-width:'+W+'px;display:block;margin:auto\" role=\"img\" aria-label=\"Model atomu: '+p+' p, '+n+' n, '+e+' e\">';\n var N=p+n,sk=W/260;\n for(var i=0;i e-quiz').forEach(function(w){var sc=w.nextElementSibling,ok=0,n=0;\n w.querySelectorAll('.quiz-q').forEach(function(d){var good=+d.dataset.ok;d.querySelectorAll('.quiz-opt').forEach(function(b){b.onclick=function(){if(d.dataset.done)return;d.dataset.done=1;n++;if(+b.dataset.a===good)ok++;\n  d.querySelectorAll('.quiz-opt').forEach(function(x){x.disabled=true;if(+x.dataset.a===good)x.classList.add('correct');else if(x===b)x.classList.add('wrong')});\n  if(d.dataset.fb){var f=document.createElement('div');f.className='quiz-fb';f.innerHTML=d.dataset.fb;d.appendChild(f)}\n  if(sc&&sc.classList.contains('quiz-score'))sc.textContent='Wynik: '+ok+' / '+n}})})});\nvar b=root.querySelector('#advToggle');if(b&&!b.dataset.cheAdv){b.dataset.cheAdv=1;var all=function(){return root.querySelectorAll('details.adv')},k=all().length;\n b.textContent='Pokaż treści akademickie ('+k+')';\n b.onclick=function(){var on=b.getAttribute('aria-pressed')!=='true';all().forEach(function(d){d.open=on});b.setAttribute('aria-pressed',on?'true':'false');b.textContent=(on?'Ukryj':'Pokaż')+' treści akademickie ('+k+')'}}\n})();\n\n<\/script>\n<a class=\"skip-link\" href=\"#main\">Przejdź do treści<\/a>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">F15 · FUNDAMENTY · NOWA WERSJA<\/div><h1>Polarność cząsteczek i oddziaływania międzycząsteczkowe<\/h1><p class=\"lead\">Dlaczego woda wrze w 100 °C, a siarkowodór w −60 °C, choć oba mają podobny wzór? Dlaczego sól rozpuszcza się w wodzie, a tłuszcz nie? Odpowiedź leży w tym, jak cząsteczki są spolaryzowane i jak się do siebie przyciągają.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-extra\">AMBITNE (LO)<\/span><\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><\/section>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#jak-pracowac\">0.1. Jak pracować z tą lekcją<\/a><a class=\"toc-link\" href=\"#cele\">0.2. Cele i pytanie przewodnie<\/a><a class=\"toc-link\" href=\"#kompas\">0.3. Kompas — co trzeba wiedzieć wcześniej<\/a><a class=\"toc-link\" href=\"#diagnoza\">0.4. Diagnoza startowa<\/a><a class=\"toc-link\" href=\"#polarnosc\">1. Polarność wiązania i cząsteczki<\/a><a class=\"toc-link\" href=\"#oddzialywania\">2. Oddziaływania międzycząsteczkowe<\/a><a class=\"toc-link\" href=\"#wrzenie\">3. Temperatura wrzenia — porównanie<\/a><a class=\"toc-link\" href=\"#rozpuszczalnosc\">4. Rozpuszczalność — podobne w podobnym<\/a><a class=\"toc-link\" href=\"#wykład\">5. Wykład — dlaczego siły między cząsteczkami mają znaczenie<\/a><a class=\"toc-link\" href=\"#dosw\">6. Doświadczenie modelowe — rozpuszczanie różnych substancji<\/a><a class=\"toc-link\" href=\"#klinika\">7. Klinika błędów<\/a><a class=\"toc-link\" href=\"#cwiczenia\">8. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#fiszki\">9. Fiszki<\/a><a class=\"toc-link\" href=\"#slownik\">10. Słownik<\/a><a class=\"toc-link\" href=\"#test\">11. Test<\/a><a class=\"toc-link\" href=\"#ciekawostki\">12. Ciekawostki<\/a><a class=\"toc-link\" href=\"#checklista\">13. Checklista — umiem…<\/a><\/nav><\/details>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć na E8 — 10 punktów<\/h3>\n<ol>\n<li><strong>Wiązanie polarne<\/strong> to wiązanie kowalencyjne spolaryzowane (F11): para wiążąca przesunięta w stronę bardziej elektroujemnego atomu.<\/li>\n<li><strong>Cząsteczka polarna<\/strong> ma wiązania polarne i nie jest symetryczna, tak że dipole nie znoszą się. H₂O, NH₃, HCl — polarne.<\/li>\n<li><strong>Cząsteczka niepolarna<\/strong>, jeśli ma tylko wiązania niespolaryzowane (H₂, Cl₂) albo jeśli polarne wiązania są ułożone symetrycznie i dipole się znoszą (CO₂, CH₄, BF₃).<\/li>\n<li><strong>Siły van der Waalsa<\/strong> (dyspersyjne) działają między wszystkimi cząsteczkami; rosną z masą i powierzchnią cząsteczki.<\/li>\n<li><strong>Oddziaływania dipol–dipol<\/strong> działają między cząsteczkami polarnymi.<\/li>\n<li><strong>Wiązanie wodorowe<\/strong> to szczególnie silne oddziaływanie: atom H związany z F, O lub N przyciąga wolną parę sąsiedniej cząsteczki.<\/li>\n<li>Wiązanie wodorowe tłumaczy wysoką temperaturę wrzenia wody (100 °C) w porównaniu z H₂S (−60 °C).<\/li>\n<li>Temperatura wrzenia zależy od sił <strong>między<\/strong> cząsteczkami, nie od wiązań wewnątrz cząsteczki.<\/li>\n<li><strong>Zasada „podobne rozpuszcza się w podobnym”:<\/strong> substancje polarne rozpuszczają się w polarnych (sól, cukier w wodzie), niepolarne w niepolarnych (tłuszcz w benzynie, jod w heksanie).<\/li>\n<li>Jony rozpuszcza woda, bo cząsteczki wody (polarne) otaczają je i oddziałują z ładunkami.<\/li>\n<\/ol>\n<\/section>\n<div class=\"layer-legend\">\n<div class=\"layer-row\"><span class=\"dot e8\"><\/span><span><b>E8:<\/b> polarność wiązania i cząsteczki; symetria i dipole; van der Waals, dipol–dipol, wiązanie wodorowe; temperatura wrzenia; rozpuszczalność polarna/niepolarna<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot understand\"><\/span><span><b>Rozumienie:<\/b> dlaczego dipole CO₂ się znoszą; mechanizm wiązania wodorowego; dlaczego rozpuszczalność zależy od przyciągania między cząsteczkami<\/span><\/div>\n<div class=\"layer-row\"><span class=\"dot extra\"><\/span><span><b>LO / ambitne:<\/b> moment dipolowy; wpływ kształtu na siły dyspersyjne; wiązania wodorowe w DNA i białkach (zarys); emulgatory jako cząsteczki o dwóch biegunach<\/span><\/div>\n<\/div>\n<div id=\"rdzen\" class=\"core-path\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to<\/div>\n<p>Polarność to <strong>kierunek ładunku<\/strong>: w cząsteczce polarnej jedna strona jest lekko dodatnia, a druga lekko ujemna. Cząsteczki polarne przyciągają się wzajemnie i przyciągają jony. Cząsteczki niepolarne przyciągają się słabo, a z polarnymi prawie się nie mieszają.<\/p>\n<\/div>\n<section id=\"jak-pracowac\">\n<div class=\"part-heading\"><span class=\"part-num\">0.1<\/span> Jak pracować z tą lekcją<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Kolejność pracy<\/span>\n<p>Przeczytaj minimum i wykład z sekcji 5. Dla każdej cząsteczki z tabeli w sekcji 1 zasłoń ostatnią kolumnę i sam oceń polarność wiązań i symetrię kształtu. Dopiero potem odsłoń odpowiedź.<\/p>\n<\/div>\n<\/section>\n<section id=\"cele\">\n<div class=\"part-heading\"><span class=\"part-num\">0.2<\/span> Cele i pytanie przewodnie <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Po tej lekcji potrafisz<\/span>\n<ul>\n<li>ocenić polarność wiązania (z Δχ) i cząsteczki (z kształtu i symetrii);<\/li>\n<li>wskazać rodzaj oddziaływań międzycząsteczkowych w substancji;<\/li>\n<li>wyjaśnić różnicę temperatur wrzenia H₂O i H₂S;<\/li>\n<li>przewidzieć rozpuszczalność na podstawie polarności.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Pytanie przewodnie<\/span>\n<p>Woda i siarkowodór mają kształt kątowy i polarne (lub słabo polarne) wiązania z wodorem. Dlaczego woda wrze w 100 °C, a H₂S w −60 °C? Co należy do „wiązania”, a co do „oddziaływania między cząsteczkami”?<\/p>\n<\/div>\n<\/section>\n<section id=\"kompas\">\n<div class=\"part-heading\"><span class=\"part-num\">0.3<\/span> Kompas — co trzeba wiedzieć wcześniej<\/div>\n<ul>\n<li>Δχ i wiązania spolaryzowane (F10, F11);<\/li>\n<li>kształt cząsteczki i wolne pary (F14);<\/li>\n<li>wzór Lewisa (F13);<\/li>\n<li>elektroujemność χ (skala Paulinga; wartości z tablicy w F11) — różnica χ daje Δχ.<\/li>\n<\/ul>\n<\/section>\n<section id=\"diagnoza\">\n<div class=\"part-heading\"><span class=\"part-num\">0.4<\/span> Diagnoza startowa<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Odpowiedz najpierw sam<\/span>\n<ol>\n<li>Czy wiązanie H–Cl jest polarne? (χ(Cl) ≈ 3,2, χ(H) ≈ 2,2)<\/li>\n<li>Czy cząsteczka CO₂ jest polarna, jeśli wiązania C=O są polarne?<\/li>\n<li>Jakie oddziaływanie działa między cząsteczkami H₂?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż klucz i interpretację<\/summary>\n<ol>\n<li>Tak — Δχ ≈ 1,0 (przedział polarnych wiązań).<\/li>\n<li>Nie — kształt liniowy i symetryczny: dwa dipole C=O znoszą się.<\/li>\n<li>Tylko siły van der Waalsa (dyspersyjne); H₂ jest niepolarny.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"polarnosc\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Polarność wiązania i cząsteczki <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dipol jako strzałka<\/span>\n<p>Dipol możesz narysować jako strzałkę skierowaną od δ⁺ do δ⁻. Cząsteczka z kilkoma wiązaniami to kilka strzałek. Jeśli strzałki o równej długości wskazują w przeciwne strony (CO₂), znoszą się, jak dwie osoby ciągnące linę z tą samą siłą. Jeśli ciągną pod kątem (H₂O), wypadkowa nie jest zerowa.<\/p>\n<\/div>\n<regula>\n<p><strong>Wiązanie polarne:<\/strong> różnica elektroujemności Δχ mieści się mniej więcej między 0,4 a 1,7. Poniżej 0,4 wiązanie jest praktycznie niespolaryzowane, powyżej 1,7 — jonowe. Progi są orientacyjne i różnią się między podręcznikami: np. wiązanie B–F (Δχ ≈ 1,9) w BF₃ traktujemy jako kowalencyjne spolaryzowane, bo BF₃ to cząsteczka, a nie kryształ jonowy. Biegun oznaczamy δ⁺ i δ⁻.<\/p>\n<p><strong>Cząsteczka polarna:<\/strong> wiązania polarne <strong>i<\/strong> kształt niesymetryczny — suma wektorów dipoli nie wynosi zero.<\/p>\n<p><strong>Cząsteczka niepolarna:<\/strong> brak polarnych wiązań <strong>lub<\/strong> symetria, w której dipole się znoszą.<\/p>\n<\/regula>\n<div class=\"card card-core\">\n<span class=\"card-label\">Trzy kroki oceny polarności<\/span>\n<ol>\n<li>Oceń każde wiązanie: polarne czy niespolaryzowane (Δχ).<\/li>\n<li>Narysuj kierunki dipoli (od δ⁺ do δ⁻).<\/li>\n<li>Sprawdź symetrię: jeśli dipole się znoszą (symetryczny kształt), cząsteczka jest niepolarna; jeśli nie, — polarna.<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mini-wykład — po co patrzeć na symetrię?<\/span>\n<p>Polarność cząsteczki to suma strzałek-dipoli, a nie liczba polarnych wiązań. Dlatego CO₂, BF₃ i CH₄ są niepolarne mimo wiązań o różnym stopniu polarności. Jak to sprawdzić: cienki strumień wody z kranu odchyla się ku naelektryzowanej linijce, bo H₂O jest polarna; strumień oleju prawie wcale. Jeśli cząsteczka jest symetryczna, takiego odchylenia nie ma.<\/p>\n<\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Cząsteczka<\/th><th>Wiązania<\/th><th>Kształt<\/th><th>Polarność cząsteczki<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>H₂<\/td><td>niespolaryzowane<\/td><td>liniowy<\/td><td>niepolarna<\/td><\/tr>\n<tr><td>HCl<\/td><td>polarne<\/td><td>liniowy<\/td><td>polarna<\/td><\/tr>\n<tr><td>CO₂<\/td><td>polarne (C=O)<\/td><td>liniowy, symetryczny<\/td><td>niepolarna<\/td><\/tr>\n<tr><td>CH₄<\/td><td>praktycznie niespolaryzowane (C–H, Δχ ≈ 0,35)<\/td><td>tetraedryczny, symetryczny<\/td><td>niepolarna<\/td><\/tr>\n<tr><td>NH₃<\/td><td>polarne (N–H)<\/td><td>piramidalny<\/td><td>polarna<\/td><\/tr>\n<tr><td>H₂O<\/td><td>polarne (O–H)<\/td><td>kątowy<\/td><td>polarna<\/td><\/tr>\n<tr><td>BF₃<\/td><td>polarne (B–F)<\/td><td>trygonalny płaski, symetryczny<\/td><td>niepolarna<\/td><\/tr>\n<tr><td>H₂S<\/td><td>słabo polarne (S–H, Δχ ≈ 0,4)<\/td><td>kątowy<\/td><td>słabo polarna<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Pułapka: polarne wiązania nie oznaczają polarnej cząsteczki<\/span>\n<p>CO₂ ma dwa wiązania silnie polarne, ale suma dipoli wynosi zero. Uczeń, który patrzy tylko na wiązania, pomyli się w CO₂ i BF₃.<\/p>\n<\/div>\n<\/section>\n<section id=\"oddzialywania\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Oddziaływania międzycząsteczkowe <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<p>Między cząsteczkami działają przyciągania słabsze niż wiązania chemiczne, ale odpowiedzialne za stan skupienia i temperatury przemian.<\/p>\n<regula>\n<p><strong>Siły van der Waalsa (dyspersyjne):<\/strong> między wszystkimi cząsteczkami; powstają z chwilowych przesunięć elektronów. Rosną z masą i liczbą elektronów cząsteczki.<\/p>\n<p><strong>Dipol–dipol:<\/strong> między cząsteczkami polarnymi; cząsteczki ustawiają się przeciwnymi końcami.<\/p>\n<p><strong>Wiązanie wodorowe:<\/strong> atom H związany z F, O lub N w jednej cząsteczce przyciąga wolną parę atomu F, O lub N w innej cząsteczce.<\/p>\n<\/regula>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wymagania a poszerzenie<\/span>\n<p>Na E8 wymagane są: polarność wiązania i cząsteczki z kształtu, trzy rodzaje oddziaływań, wiązanie wodorowe przy F, O i N oraz rozpuszczalność „podobne w podobnym”. Siły dyspersyjne ilościowo, moment dipolowy i wiązania wodorowe w DNA to poszerzenie (ambitne).<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Uwaga o nazwach<\/span>\n<p>W lekcji „siłami van der Waalsa” nazywamy siły dyspersyjne (Londona), działające między wszystkimi cząsteczkami. W wielu podręcznikach nazwa „siły van der Waalsa” obejmuje też oddziaływania dipol–dipol. Gdy widzisz tę nazwę w zadaniu, sprawdź, o którym znaczeniu mowa.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dlaczego wiązanie wodorowe jest silniejsze<\/span>\n<p>Atomy F, O i N są małe i bardzo elektroujemne, więc wodór związany z którymś z nich ma wyraźny ładunek δ⁺ i jest niemal „odsłoniętym” jądrem. Wolna para sąsiedniej cząsteczki jest bogata w elektrony, więc przyciąganie jest silne. Wciąż jest jednak słabsze niż wiązanie kowalencyjne wewnątrz cząsteczki.<\/p>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Warunek wiązania wodorowego<\/span>\n<p>Wodór musi być połączony z F, O lub N, a w sąsiedniej cząsteczce musi być wolna para elektronowa na F, O lub N. Dlatego wiązanie wodorowe tworzy woda, amoniak i fluorowodór, a np. CH₄ nie.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mini-wykład — dlaczego tylko F, O, N?<\/span>\n<p>Po co to wiedzieć? Żeby nie nazywać wiązaniem wodorowym każdego H w cząsteczce. Atomy F, O i N są małe i bardzo elektroujemne, więc H przy nich jest silnie dodatni, a ich wolne pary są „gęste”. Jak to sprawdzić: porównaj temperatury wrzenia hydrków grupy 17: HF ok. +20 °C, a HCl ok. −85 °C. Skok widać tylko przy F, bo tylko HF ma wiązania wodorowe.<\/p>\n<\/div>\n<\/section>\n<section id=\"wrzenie\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Temperatura wrzenia — porównanie <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Substancja<\/th><th>Wzór<\/th><th>Najsilniejsze oddziaływanie<\/th><th>Temperatura wrzenia (orientacyjnie)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Woda<\/td><td>H₂O<\/td><td>wiązanie wodorowe<\/td><td>100 °C<\/td><\/tr>\n<tr><td>Siarkowodór<\/td><td>H₂S<\/td><td>dipol–dipol + van der Waals<\/td><td>−60 °C<\/td><\/tr>\n<tr><td>Metan<\/td><td>CH₄<\/td><td>van der Waals<\/td><td>−162 °C<\/td><\/tr>\n<tr><td>Jod<\/td><td>I₂<\/td><td>van der Waals (duża masa)<\/td><td>ok. 184 °C<\/td><\/tr>\n<tr><td>Chlor<\/td><td>Cl₂<\/td><td>van der Waals (mała masa)<\/td><td>ok. −34 °C<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Jak to odczytać<\/span>\n<ul>\n<li>Porównując H₂O i H₂S: oba są kątowe, ale tylko woda tworzy wiązania wodorowe. Dlatego woda wrze o 160 stopni wyżej.<\/li>\n<li>Porównując I₂ i Cl₂: obie są niepolarne, ale I₂ ma więcej elektronów i większą powierzchnię, więc siły dyspersyjne są silniejsze.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykres temperatur wrzenia — opis zamiast grafiki<\/span>\n<p>Wykres liniowy temperatur wrzenia hydrków grupy 16 (H₂O, H₂S, H₂Se, H₂Te) względem okresu. Od H₂S do H₂Te temperatura rośnie płynnie (rosnąca masa), a punkt dla H₂O wyraźnie odstaje w górę. Wniosek: wzrost odpowiada rosnącej masie, a anomalia wody — wiązaniom wodorowym.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mini-wykład — wrzenie to nie rozrywanie wiązań<\/span>\n<p>Podczas wrzenia wody cząsteczki H₂O oddalają się od siebie, ale każda pozostaje cząsteczką H₂O. Po co to wiedzieć? Bo to najczęstszy błąd w wyjaśnieniach. Jak to sprawdzić: ochłodź parę wodną, a skropli się w wodę. Gdyby wiązania O–H pękły, powstałyby gazy H₂ i O₂, które się nie skroplą.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Pułapka: „silne wiązanie = wysoka temperatura wrzenia”<\/span>\n<p>Cl₂ ma silne wiązanie kowalencyjne, a wrze w −34 °C. Temperatura wrzenia mówi o siłach między cząsteczkami, nie o wiązaniu wewnątrz nich.<\/p>\n<\/div>\n<\/section>\n<section id=\"rozpuszczalnosc\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Rozpuszczalność — podobne w podobnym <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<regula>\n<p><strong>Zasada:<\/strong> substancja rozpuszcza się w rozpuszczalniku o podobnej polarności, bo powstające oddziaływania rekompensują energię potrzebną do rozdzielenia cząsteczek.<\/p>\n<ul>\n<li>polarne w polarnych: sól (NaCl), cukier (sacharoza), alkohol w wodzie;<\/li>\n<li>niepolarne w niepolarnych: tłuszcz w benzynie, jod w heksanie lub tetrachlorometanie;<\/li>\n<li>polarne w niepolarnych i odwrotnie — słabo lub wcale.<\/li>\n<\/ul>\n<\/regula>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dlaczego woda rozpuszcza sól<\/span>\n<p>Cząsteczki wody są polarne: strona tlenowa jest δ⁻, wodorowa δ⁺. Jony Na⁺ przyciągają ujemne końce wody, a jony Cl⁻ dodatnie. Jony są otoczone przez cząsteczki wody (hydratacja) i przechodzą do roztworu. Cząsteczki tłuszczu są niepolarne, nie mają biegunów δ⁺ i δ⁻, więc nie oddziałują z wodą na tyle silnie, by zastąpić wiązania wodorowe między cząsteczkami wody.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Pułapka: nie każdy związek jonowy rozpuszcza się w wodzie<\/span>\n<p>Zasada „podobne rozpuszcza podobne” to reguła orientacyjna. AgCl i CaCO₃ są związkami jonowymi, a w wodzie praktycznie się nie rozpuszczają: przyciąganie jonów w krysztale jest tam silniejsze niż zysk z hydratacji. O rozpuszczalności soli rozstrzyga tabela rozpuszczalności.<\/p>\n<\/div>\n<details class=\"adv\"><summary>E. Ambitne — etanol a heksan wobec wody (4 pkt) <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Wyjaśnij, dlaczego etanol (C₂H₅OH) miesza się z wodą w każdej proporcji, a heksan (C₆H₁₄) nie miesza się z nią.<\/p>\n<\/div><\/details>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>Etanol: grupa –OH tworzy wiązania wodorowe z wodą, więc cząsteczki się wiążą (2 pkt). Heksan: niepolarny, oddziaływania van der Waals są za słabe, by przezwyciężyć wiązania wodorowe wody — zasada „podobne rozpuszcza podobne” (2 pkt).<\/p>\n<\/details>\n<\/section>\n<section id=\"wykład\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Wykład — dlaczego siły między cząsteczkami mają znaczenie <span class=\"level-badge level-understand\">ROZUMIENIE<\/span><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Wykład — od zera: ta sama substancja, różne stany<\/span>\n<p>Zacznij od magnesów. Cząsteczka polarna jest trochę jak mały magnes: jeden jej koniec jest lekko dodatni (δ⁺), drugi lekko ujemny (δ⁻). Magnesy przyciągają się przeciwnymi końcami, więc cząsteczki polarne trzymają się razem mocniej niż niepolarne.<\/p>\n<p>Skąd bierze się biegun? Z różnicy elektroujemności. W HCl chlor przyciąga wspólną parę elektronów mocniej niż wodór (Δχ ≈ 1,0), więc przy Cl jest δ⁻, a przy H jest δ⁺. Wiązanie ma „strzałkę” (dipol) skierowaną w stronę Cl.<\/p>\n<p>Teraz cząsteczki z wieloma wiązaniami. Tu liczy się kształt, bo dipole działają jak liny w przeciąganiu liny. W CO₂ dwie liny ciągną z tą samą siłą w przeciwne strony (cząsteczka jest liniowa), więc nikt nie wygrywa: cząsteczka jest niepolarna, choć każde wiązanie C=O jest polarne. W H₂O dwie liny ciągną pod kątem, więc wypadkowa nie jest zerowa i cząsteczka jest polarna. Dlatego kształt z F14 jest ci tu niezbędny.<\/p>\n<p>Siły między cząsteczkami ułóż jak drabinę. Na dole są siły van der Waalsa (dyspersyjne): działają zawsze, bo elektrony chwilowo przesuwają się i tworzą krótkotrwałe dipole; rosną z liczbą elektronów. Wyżej jest dipol–dipol: działa między cząsteczkami polarnymi. Na szczycie jest wiązanie wodorowe: powstaje, gdy H jest przyłączony do F, O lub N. Te atomy są małe i bardzo elektroujemne, więc H jest prawie „odsłoniętym” jądrem i przyciąga wolną parę sąsiada szczególnie mocno. To wciąż oddziaływanie między cząsteczkami, słabsze od wiązania kowalencyjnego. Drabina sprawdza się dla cząsteczek o podobnej masie.<\/p>\n<p>Po co ta drabina? Temperatura wrzenia mówi, ile energii trzeba, by oderwać cząsteczki od siebie. Gdy woda wrze, rozrywasz oddziaływania między cząsteczkami, nie wiązania O–H: para wodna to nadal H₂O. Dlatego woda wrze w 100 °C, a H₂S w −60 °C. Dla substancji niepolarnych decyduje masa i liczba elektronów: I₂ jest ciałem stałym, a Cl₂ gazem.<\/p>\n<p>Rozpuszczanie to ten sam pomysł. Żeby substancja się rozpuściła, nowe przyciąganie między nią a rozpuszczalnikiem musi „opłacić” zerwanie starych. Woda otacza jony Na⁺ i Cl⁻ (hydratacja), więc sól się rozpuszcza. Olej mógłby oddziaływać z wodą tylko słabo, a musiałby rozerwać silne wiązania wodorowe wody, więc się nie rozpuszcza.<\/p>\n<p>Najczęstsza pułapka: patrzenie na wiązania wewnątrz cząsteczki zamiast na przyciąganie między cząsteczkami i pomijanie symetrii. Przy każdej substancji zadaj trzy pytania: czy wiązania są polarne, czy symetria je znosi, czy H jest przy F, O lub N.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — trzy pytania do każdej cząsteczki<\/span>\n<ol>\n<li>Czy wiązania są polarne? (Δχ)<\/li>\n<li>Czy kształt jest symetryczny? (czy dipole się znoszą)<\/li>\n<li>Czy jest wiązanie wodorowe? (H–F/O/N i wolna para w sąsiedniej cząsteczce)<\/li>\n<\/ol>\n<\/div>\n<\/section>\n<section id=\"dosw\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Doświadczenie modelowe — rozpuszczanie różnych substancji <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"exp-card\"><h5>Czy substancja rozpuszcza się w wodzie?<\/h5><div class=\"exp-grid\"><\/div><p><strong>Hipoteza:<\/strong> substancje polarne (sól, cukier) rozpuszczą się w wodzie, niepolarne (olej) nie. Środek, który ma polarną i niepolarną część (płyn do mycia naczyń), pomoże połączyć olej z wodą.\n<strong>Sprzęt:<\/strong> pięć probówek, woda, sól kuchenna, cukier, olej roślinny, płyn do mycia naczyń, patyczek do mieszania.\n<strong>Próba kontrolna:<\/strong> probówka z samą wodą (do porównania wyglądu).\n<strong>Przebieg:<\/strong> do czterech probówek wlej po ok. 5 cm³ wody. Do pierwszej dodaj małą szczyptę soli, do drugiej małą szczyptę cukru, do trzeciej ok. 1 cm³ oleju. Do czwartej dodaj ok. 1 cm³ oleju, następnie 2 krople płynu do mycia i wstrząśnij. Zawartość pierwszych dwóch wymieszaj patyczkiem. Odczekaj, aż mieszaniny się uspokoją, i porównaj z probówką kontrolną.\n<strong>Obserwacja (opis oczekiwany):<\/strong> sól i cukier tworzą przezroczysty roztwór; olej tworzy warstwę na wierzchu; po dodaniu płynu i wstrząśnięciu powstaje mętna mieszanina (emulsja), która rozwarstwia się wolniej niż w probówce bez płynu.\n<strong>Wniosek:<\/strong> substancje polarne rozpuszczają się w wodzie, niepolarne nie. Płyn do mycia ma w cząsteczkach część polarną i niepolarną, więc łączy olej z wodą.\n<strong>BHP:<\/strong> nie próbować substancji; płyn nie może dostać się do oczu; założyć okulary ochronne.<\/p><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Obserwacja ≠ wniosek<\/span>\n<p>„Olej tworzy warstwę na wierzchu” to obserwacja. „Olej jest niepolarny i nie tworzy oddziaływań z wodą” to wniosek. Zapisz najpierw obserwację, potem wniosek.<\/p>\n<\/div>\n<\/section>\n<section id=\"klinika\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Klinika błędów<\/div>\n<table class=\"klinika-table\"><thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><\/tr><\/thead><tbody><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„CO₂ jest polarna, bo ma polarne wiązania.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">CO₂ jest niepolarna — dipole się znoszą.<\/td><td data-label=\"Dlaczego\">Liczy się także symetria.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Wiązanie wodorowe to wiązanie kowalencyjne.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">To oddziaływanie międzycząsteczkowe, słabsze niż wiązanie kowalencyjne.<\/td><td data-label=\"Dlaczego\">Inna skala energii.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Woda wrze w 100 °C, bo ma silne wiązania O–H.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Wrze w 100 °C dzięki wiązaniom wodorowym między cząsteczkami.<\/td><td data-label=\"Dlaczego\">Siły między cząsteczkami.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Metan rozpuszcza się w wodzie, bo ma wiązania C–H.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Metan jest niepolarny i słabo rozpuszcza się w wodzie.<\/td><td data-label=\"Dlaczego\">Wiązania wewnątrz nie decydują o rozpuszczalności.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Cl₂ wrze wysoko, bo wiązanie jest silne.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Cl₂ wrze w ok. −34 °C.<\/td><td data-label=\"Dlaczego\">Wysokie wrzenie wymaga silnych sił między cząsteczkami.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Cząsteczka polarna jest naładowana.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Cząsteczka polarna ma część δ⁺ i δ⁻, ale ładunek całkowity wynosi zero.<\/td><td data-label=\"Dlaczego\">Polarność to rozkład ładunku, nie ładunek.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Para wodna to wodór i tlen.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Para wodna to nadal H₂O. Podczas wrzenia rozrywane są oddziaływania, nie wiązania.<\/td><td data-label=\"Dlaczego\">Wiązania O–H zostają w cząsteczce.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Wszystkie związki jonowe rozpuszczają się w wodzie.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">AgCl i CaCO₃ praktycznie się nie rozpuszczają.<\/td><td data-label=\"Dlaczego\">O rozpuszczalności decyduje tabela rozpuszczalności.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Niepolarne gazy się nie rozpuszczają.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">CO₂ rozpuszcza się w wodzie częściowo (tworzy kwas węglowy).<\/td><td data-label=\"Dlaczego\">Rozpuszczalność to skala, nie zero-jedynka.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Wiązanie wodorowe to wiązanie H–O wewnątrz cząsteczki wody.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">To oddziaływanie między cząsteczkami; wiązanie wewnątrz to kowalencyjne O–H.<\/td><td data-label=\"Dlaczego\">Dwie różne skale energii.<\/td><\/tr><\/tbody><\/table>\n<div class=\"card card-error\">\n<span class=\"card-label\">Klinika — przykład: „HF ma wiązanie wodorowe, więc HCl też”<\/span>\n<p>Uczeń wnioskuje, że skoro HCl ma wodór i chlor, to tworzy wiązania wodorowe.<\/p>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p>Wiązanie wodorowe tworzy wodór związany z F, O lub N, a sąsiednia cząsteczka musi mieć wolną parę na F, O lub N. Atom Cl jest dużo większy niż F, więc jego wolne pary są „rozlane” i przyciąganie jest zbyt słabe. Między cząsteczkami HCl działają dipol–dipol i siły van der Waalsa. Temperatura wrzenia HCl (ok. −85 °C) jest dużo niższa niż HF (ok. +20 °C), choć HCl ma większą masę.<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"cwiczenia\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Ćwiczenia<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">A. Podstawa — polarność (2 pkt)<\/span>\n<p>Oceń polarność cząsteczek: (a) H₂O (b) CO₂ (c) CH₄ (d) NH₃.<\/p>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<p>(a) polarna (kątowa); (b) niepolarna (liniowa, symetryczna); (c) niepolarna (tetraedryczna, symetryczna); (d) polarna (piramidalna).<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">B. Trening — oddziaływania (3 pkt)<\/span>\n<ol>\n<li>Jakie oddziaływania działają między cząsteczkami H₂O?<\/li>\n<li>Jakie oddziaływania działają między cząsteczkami CO₂?<\/li>\n<li>Dlaczego H₂S wrze niżej niż H₂O?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>Wiązania wodorowe (i van der Waalsa).<\/li>\n<li>Tylko van der Waalsa (dyspersyjne), bo CO₂ jest niepolarna.<\/li>\n<li>H₂S nie tworzy wiązań wodorowych, bo wodór jest związany z S, a nie z F, O lub N. Między jego cząsteczkami działają tylko słabsze oddziaływania dipol–dipol i van der Waalsa.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<details class=\"adv\"><summary>C. Ambitne — wzór sumaryczny, różne właściwości <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Etanol (C₂H₅OH) wrze w ok. 78 °C, a eter dimetylowy (CH₃OCH₃) w ok. −25 °C, choć oba mają wzór sumaryczny C₂H₆O. Wyjaśnij różnicę.<\/p>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p>W etanolu wodór jest związany z tlenem (grupa –OH), więc cząsteczki tworzą ze sobą wiązania wodorowe (1 pkt). W eterze dimetylowym wodory są związane z węglem, nie z tlenem, więc wiązania wodorowe między jego cząsteczkami nie powstają; działają dipol–dipol i van der Waalsa (1 pkt). Silniejsze oddziaływania w etanolu dają wyższą temperaturę wrzenia (1 pkt).<\/p>\n<\/details>\n<\/div><\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">D. Zaawansowane — porównanie<\/span>\n<p>Uszereguj od najniższej do najwyższej temperatury wrzenia: CH₄, H₂S, H₂O. Uzasadnij w jednym zdaniu.<\/p>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p>Kolejność rosnąca: CH₄ (−162 °C) &lt; H₂S (−60 °C) &lt; H₂O (100 °C). CH₄ ma tylko słabe siły van der Waalsa, H₂S dodatkowo oddziaływania dipol–dipol, a H₂O wiązania wodorowe.<\/p>\n<\/details>\n<\/div>\n<details class=\"adv\"><summary>D2. Ambitne — pułapka kolejności <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Cl₂ (niepolarny) wrze w ok. −34 °C, a H₂S (polarny) w ok. −60 °C. Dlaczego niepolarna cząsteczka wrze wyżej niż polarna?<\/p>\n<details class=\"answer\"><summary>Pokaż odpowiedź<\/summary>\n<p>Cl₂ ma znacznie większą masę (71 u wobec 34 u) i więcej elektronów, więc jego siły dyspersyjne są silniejsze. Przy dużej różnicy mas oddziaływania dyspersyjne mogą przewyższyć dipol–dipol.<\/p>\n<\/details>\n<\/div><\/details>\n<p><strong>F. [E8] CCl₄ i CHCl₃.<\/strong> Oba związki mają wiązania C–Cl. Oceń polarność każdej cząsteczki i wskaż, który lepiej rozpuści jod.\nKlucz: CCl₄ — tetraedryczny, symetryczny → dipole się znoszą → niepolarna. CHCl₃ — tetraedryczny, ale niesymetryczny (jeden atom H zamiast Cl) → polarna. Jod (niepolarny) rozpuści się lepiej w CCl₄ (podobne rozpuszcza podobne).<\/p>\n<p><strong>G. [E8] HF i HCl.<\/strong> HCl ma większą masę niż HF, a wrze niżej (−85 °C wobec +20 °C). Wyjaśnij.\nKlucz: HF tworzy wiązania wodorowe (H związany z F), HCl nie. Wiązania wodorowe mają większy wpływ na temperaturę wrzenia niż różnica mas.<\/p>\n<p><strong>H. [ambitny] Znajdź błąd — AgCl.<\/strong> Uczeń: „AgCl jest związkiem jonowym, a woda jest polarna, więc AgCl dobrze się rozpuszcza.” Popraw.\nKlucz: reguła „podobne rozpuszcza podobne” jest orientacyjna. AgCl praktycznie się w wodzie nie rozpuszcza, bo przyciąganie jonów w krysztale jest silniejsze niż zysk z hydratacji. O rozpuszczalności soli rozstrzyga tabela rozpuszczalności.<\/p>\n<p><strong>I. [ambitny] Wykres hydrków grupy 16.<\/strong> Temperatury wrzenia: H₂O 100 °C, H₂S −60 °C, H₂Se −41 °C, H₂Te −2 °C. Wyjaśnij (a) dlaczego temperatura rośnie od H₂S do H₂Te, (b) dlaczego H₂O „odbiega”.\nKlucz: (a) rośnie masa i liczba elektronów, więc siły dyspersyjne są coraz silniejsze (1 pkt). (b) Woda tworzy wiązania wodorowe (H przy O), a pozostałe nie (1 pkt); gdyby nie one, woda wrzałaby w okolicach −80 °C (ekstrapolacja trendu) — wniosek ambitny.<\/p>\n<p><strong>J. [konkursowy] Alkohole.<\/strong> Metanol (CH₃OH) i heksanol (C₆H₁₃OH) mają grupę –OH. Który lepiej miesza się z wodą i dlaczego?\nKlucz: metanol. Obie cząsteczki tworzą wiązania wodorowe przez –OH, ale w heksanolu długi łańcuch niepolarny (6 atomów C) ogranicza oddziaływania z wodą i przeważa nad wpływem grupy –OH. Im dłuższy łańcuch węglowy, tym słabsza rozpuszczalność alkoholu w wodzie.<\/p>\n<p><strong>K. [E8] Czy olej zmiesza się z benzyną?<\/strong> Oceń na podstawie polarności.\nKlucz: tak — obie substancje są niepolarne (podobne rozpuszcza podobne), więc tworzą jednorodną mieszaninę.<\/p>\n<p><strong>L. [E8] Hydratacja jonów.<\/strong> Przy jonie Na⁺ w wodzie który atom wody jest zwrócony ku jonowi, a który przy Cl⁻? Uzasadnij.\nKlucz: przy Na⁺ — atom tlenu (δ⁻) jest zwrócony ku jonowi; przy Cl⁻ — atomy wodoru (δ⁺). Jon przyciąga cząsteczkę o przeciwnym ładunku.<\/p>\n<p><strong>M. [E8] Które oddziaływania?<\/strong> Wskaż w tabeli, jakie oddziaływania występują w H₂O, CH₃OH, CH₄ i NaCl(aq).\nKlucz: H₂O — wiązania wodorowe, dipol–dipol, dyspersyjne; CH₃OH — wiązania wodorowe (przez –OH), dipol–dipol, dyspersyjne; CH₄ — tylko dyspersyjne; NaCl(aq) — jon–dipol między jonami a wodą oraz oddziaływania między cząsteczkami wody.<\/p>\n<\/section>\n<section id=\"fiszki\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Fiszki<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Kiedy cząsteczka jest polarna?<\/span><span class=\"back\">gdy ma polarne wiązania i niesymetryczny kształt<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Czy CO₂ jest polarna?<\/span><span class=\"back\">nie — dipole się znoszą<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Co to wiązanie wodorowe?<\/span><span class=\"back\">przyciąganie H związanego z F, O lub N do wolnej pary sąsiedniej cząsteczki<\/span><span class=\"card-tag tag-basic\">podstawa<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Dlaczego woda wrze w 100 °C?<\/span><span class=\"back\">wiązania wodorowe między cząsteczkami<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Zasada rozpuszczalności?<\/span><span class=\"back\">podobne rozpuszcza się w podobnym<\/span><span class=\"card-tag tag-understand\">rozumienie<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jakie siły działają między cząsteczkami I₂?<\/span><span class=\"back\">van der Waalsa (dyspersyjne)<\/span><span class=\"card-tag tag-extra\">ambitne<\/span><\/button><\/div>\n<\/section>\n<section id=\"slownik\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Słownik<\/div>\n<dl><div class=\"def-item\"><dt>Cząsteczka polarna<\/dt><dd>cząsteczka z polarnymi wiązaniami i niesymetrycznym kształtem; dipole nie znoszą się<\/dd><\/div><div class=\"def-item\"><dt>Dipol<\/dt><dd>układ dwóch równych, przeciwnych ładunków (δ⁺ i δ⁻), oddzielonych odległością<\/dd><\/div><div class=\"def-item\"><dt>Siły van der Waalsa<\/dt><dd>słabe przyciąganie między wszystkimi cząsteczkami, wynikające z chwilowych przesunięć elektronów<\/dd><\/div><div class=\"def-item\"><dt>Wiązanie wodorowe<\/dt><dd>silne oddziaływanie międzycząsteczkowe: H związany z F, O lub N przyciąga wolną parę innej cząsteczki<\/dd><\/div><div class=\"def-item\"><dt>Hydratacja<\/dt><dd>otaczanie jonów lub polarnych cząsteczek przez cząsteczki wody<\/dd><\/div><div class=\"def-item\"><dt>Oddziaływanie jon–dipol<\/dt><dd>przyciąganie jonu przez cząsteczkę polarną, np. Na⁺ i tlen cząsteczki wody<\/dd><\/div><\/dl>\n<\/section>\n<section id=\"test\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Test<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"H₂O ma polarne wiązania i kątowy kształt.\"><h5>1. Która cząsteczka jest polarna?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">CO₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">CH₄<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">H₂O<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">BF₃<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Wiązania wodorowe między cząsteczkami wody.\"><h5>2. Które oddziaływanie tłumaczy wysoką temperaturę wrzenia wody?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">wiązanie jonowe<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">wiązanie wodorowe<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">wiązanie metaliczne<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">wiązanie kowalencyjne niespolaryzowane<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Cukier jest polarny.\"><h5>3. Która substancja rozpuści się w wodzie najlepiej?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">olej<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">jod (w małej ilości)<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">cukier<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">tłuszcz<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Symetria liniowa — suma dipoli wynosi zero.\"><h5>4. Dlaczego CO₂ jest niepolarna?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">bo wiązania są niespolaryzowane<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">bo dipole C=O znoszą się (symetria liniowa)<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">bo jest gazem<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">bo ma wiązania podwójne<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Siły van der Waalsa są uniwersalne.\"><h5>5. Które oddziaływanie działa między wszystkimi cząsteczkami?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">wiązanie wodorowe<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">dipol–dipol<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">siły van der Waalsa<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">wiązanie jonowe<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Wodór związany z O (lub F, N) przyciąga wolną parę O w sąsiedniej cząsteczce.\"><h5>6. Który układ opisuje wiązanie wodorowe między cząsteczkami?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">C–H···O<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">H–Cl···H–Cl<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">O–H···O<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">Na⁺···Cl⁻<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Przy wrzeniu rozrywamy oddziaływania między cząsteczkami, nie wiązania kowalencyjne.\"><h5>7. Dlaczego Cl₂ wrze w −34 °C, mimo że wiązanie Cl–Cl jest silne?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">bo Cl₂ jest polarny<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">bo wrzenie zależy od oddziaływań między cząsteczkami, a nie od wiązań wewnątrz nich<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">bo Cl₂ tworzy wiązania wodorowe<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"3\">bo Cl₂ jest jonowy<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section id=\"ciekawostki\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Ciekawostki<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Dlaczego olej nie miesza się z wodą<\/span>\n<p>Cząsteczki wody są polarne i tworzą między sobą silne wiązania wodorowe. Cząsteczki oleju są niepolarne i oddziałują z wodą tylko bardzo słabo. Żeby się wmieszać, olej musiałby rozerwać wiązania wodorowe wody, a to się nie opłaca. Woda zostaje więc „przy swoim”, a olej tworzy osobną warstwę.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Dlaczego lód pływa?<\/span>\n<p>Woda w stanie stałym tworzy regularną sieć wiązań wodorowych, w której cząsteczki są oddalone bardziej niż w cieczy. Dlatego lód ma mniejszą gęstość niż woda i unosi się na jej powierzchni. To rzadki przypadek, który ma ogromne znaczenie dla życia w jeziorach zimą.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Mydło i tłuszcz<\/span>\n<p>Mydło ma część polarną (głowa) i niepolarną (ogon). Ogon rozpuszcza się w tłuszczu, głowa w wodzie, dzięki czemu tłuszcz można spłukać wodą. To przykład cząsteczki, która „łączy” świat polarny i niepolarny (zarys ambitny, poziom LO).<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Gekon na suficie<\/span>\n<p>Palce gekona pokrywają miliony drobnych włosków, a przyczepność wynika głównie z sił van der Waalsa. Każda z nich jest słaba, ale razem utrzymują zwierzę.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Johannes van der Waals<\/span>\n<p>Holenderski fizyk, w 1910 r. otrzymał Nagrodę Nobla za badania nad stanami skupienia gazów i cieczy, w których uwzględnił przyciąganie między cząsteczkami.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Nartnik chodzi po wodzie<\/span>\n<p>Owad utrzymuje się na powierzchni dzięki napięciu powierzchniowemu, które wynika z wiązań wodorowych między cząsteczkami wody.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">DNA trzyma się wiązaniami wodorowymi (ambitne)<\/span>\n<p>Między zasadami A i T są 2 wiązania wodorowe, a między G i C — 3; dlatego odcinki bogate w G i C topią się w wyższej temperaturze.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mosty, zastosowania i ambitne<\/span>\n<ul>\n<li><strong>Biologia:<\/strong> błona komórkowa jest zbudowana z fosfolipidów (głowa polarna, ogony niepolarne); wiązania wodorowe trzymają DNA i białka.<\/li>\n<li><strong>Fizyka:<\/strong> napięcie powierzchniowe i kapilarność wynikają z wiązań wodorowych.<\/li>\n<li><strong>Geografia:<\/strong> jeziora zamarzają od góry, bo lód jest rzadszy niż woda; ciepło właściwe wody wpływa na klimat.<\/li>\n<li><strong>Życie:<\/strong> mydło i płyn do naczyń, plamy z tłuszczu (usuwamy rozpuszczalnikiem niepolarnym), mikrofalówka podgrzewa polarne cząsteczki wody, sól na zimę na drogach.<\/li>\n<li><strong>Ambitne:<\/strong> moment dipolowy (jednostka debaj, D) — H₂O ok. 1,85 D, CO₂ 0 D; zależność temperatury wrzenia od masy w szeregu hydrków; wpływ długości łańcucha alkoholu na rozpuszczalność w wodzie.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mnemotechniki<\/span>\n<ul>\n<li>„FON”: H musi być przy F, O lub N, żeby powstało wiązanie wodorowe.<\/li>\n<li>Przeciąganie liny: dipole to liny; symetria sprawia, że nikt nie wygrywa (CO₂), a kąt sprawia, że ktoś wygrywa (H₂O).<\/li>\n<li>„Podobne rozpuszcza podobne” — ale dopowiedz: „a sól tylko wtedy, gdy tabela rozpuszczalności się zgadza”.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"checklista\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Checklista — umiem…<\/div>\n<checklista>\n<ul>\n<li>[ ] ocenić polarność wiązania z Δχ;<\/li>\n<li>[ ] ocenić polarność cząsteczki z kształtu i symetrii;<\/li>\n<li>[ ] rozpoznać wiązanie wodorowe (H–F/O/N);<\/li>\n<li>[ ] wyjaśnić temperatury wrzenia H₂O, H₂S i Cl₂;<\/li>\n<li>[ ] przewidzieć rozpuszczalność (podobne w podobnym).<\/li>\n<\/ul>\n<\/checklista>\n<div class=\"card card-core\">\n<span class=\"card-label\">Na jednej stronie<\/span>\n<p>Polarne wiązanie: Δχ 0,4–1,7 · cząsteczka polarna: polarne wiązania + niesymetria · CO₂, CH₄, BF₃ — niepolarne (symetria) · siły: van der Waalsa (wszędzie) &lt; dipol–dipol &lt; wiązanie wodorowe (H–F/O/N) — przy podobnej masie cząsteczek · wrzenie zależy od sił między cząsteczkami · podobne rozpuszcza się w podobnym.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Karta samokontroli<\/span>\n<ol>\n<li>Czy umiem wyjaśnić, dlaczego CO₂ jest niepolarna, choć wiązania C=O są polarne?<\/li>\n<li>Czy odróżniam wiązanie (wewnątrz cząsteczki) od oddziaływania (między cząsteczkami) w każdym wyjaśnieniu temperatury wrzenia?<\/li>\n<li>Czy sprawdzam, czy H jest przy F, O lub N, zanim napiszę „wiązanie wodorowe”?<\/li>\n<\/ol>\n<\/div>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1 — audyt 15 (2026-10-13)<\/div>\n<p>Wprowadzono:\n- błędy 1, 7: klucz HF/HCl — Cl duży, rozlane wolne pary, przyciąganie za słabe; zastrzeżenie „przy podobnej masie cząsteczek” przy porządku sił.\n- błąd 2: klucz D — porównanie CH₄, H₂S, H₂O; zadanie D2 (Cl₂ wrze wyżej niż H₂S) z wyjaśnieniem dyspersji.\n- błędy 3, 4: reguła polarności przepisana (Δχ 0,4–1,7 orientacyjnie, progi, BF₃ z Δχ ≈ 1,9); tabela — CH₄ niespolaryzowane (Δχ ≈ 0,35), dodany H₂S.\n- błąd 5: „wzór kątowy” → „kształt kątowy”.\n- błąd 6: minimum pkt 3 bez tautologii.\n- błąd 8: klucz B3 — H₂S nie tworzy wiązań wodorowych.\n- błąd 9: ćwiczenie C (ambitne) zamienione na etanol i eter dimetylowy (zadanie dublujące E usunięte z C).\n- błąd 10: karta „Dlaczego woda rozpuszcza sól” — tłuszcz niepolarny, bez biegunów; powód energetyczny.\n- błąd 11: doświadczenie — ilości (5 cm³ wody, szczypta), próba kontrolna, płyn do mycia zamiast jodu.\n- błąd 12: ciekawostka o oleju przepisana (wiązania wodorowe wody, nie „brak z czym się przyciągać”).\n- błędy 13, 14: słownik i karta „Uwaga o nazwach” dla siły van der Waalsa; oddziaływanie jon–dipol w słowniku.\n- błąd 15: „Dla każdej cząsteczki z punktu 2” → odsyłacz do tabeli sekcji 1 (P1b).\n- błąd 16: warstwy/extra — DNA i moment dipolowy dodane do ciekawostek i ambitnych.\n- Braki 1–5: wymagania a poszerzenie (karta), jon–dipol i sole trudno rozpuszczalne (pułapka), napięcie powierzchniowe (nartnik), CCl₄/CHCl₃ (F), hydrki grupy 16 (I), elektroujemność i dipol jako strzałka.\n- Typy zadań: wykres hydrków (opis + I), mieszanie cieczy (K), hydratacja jonów (L), tabela oddziaływań (M).\n- Typowe błędy: 5 wierszy w klinice (ładunek cząsteczki, para wodna, związki jonowe, gazy, wiązanie H–O wewnątrz cząsteczki).\n- Poszerzenie: mosty, Życie, ambitne (moment dipolowy, DNA), mnemotechniki, 4 ciekawostki (gekon, van der Waals — Nobel 1910, nartnik, DNA).\n- P1–P14, P16–P18: wprowadzone jak w odpowiedzi (kolejność pracy, regula, tabela, pytanie przewodnie, karta wodorowe, doświadczenie, klinika HF/HCl, ćwiczenia C–D, test +2, samokontrola, karta dipol jako strzałka).<\/p>\n<p>Poprawione względem propozycji:\n- ciekawostka „Jeziora zamarzają od góry” przeniesiona do sekcji mostów (geografia) zamiast nowej ciekawostki — powtarzała „Dlaczego lód pływa?” z tej lekcji.<\/p>\n<p>Nieprzyjęte:\n- P15 (kotwica <code>{#wyklad}<\/code>) — polskie znaki w kotwicach są dopuszczalne w HTML5; ta sama forma jest w F13 i F14, bez błędu nie zmieniano.\n- propozycja grafiki (wykres temperatur wrzenia) — wymaga komponentu w silniku; zamiast niej dodano opis słowny (karta „Wykres temperatur wrzenia — opis zamiast grafiki”).<\/p>\n<p>Do potwierdzenia:\n- zakres E8 dla wiązania wodorowego i sił van der Waalsa — audytor sugeruje poziom LO; tagi <code>basic:E8<\/code> nie zmieniano, do sprawdzenia w aktualnej podstawie programowej.<\/p>\n<\/section>\n<footer class=\"footer\">\n<p><strong>CHEMIA F15 v1.1<\/strong> · Polarność i oddziaływania · 2026<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n"</script>
