<\/li>\n<li>n = 4,8·10⁻¹⁹ / 1,6·10⁻¹⁹ = 3.<\/li>\n<li>Odpowiedź: 3 nadmiarowe elektrony (ładunek ujemny = nadmiar).<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Przykład 2 (E8) — dotyk trzech kul<\/span>\n<ol>\n<li>Kule identyczne: A = +9 nC, B = −3 nC. Dotykamy A z B.<\/li>\n<li>Suma: +9 + (−3) = +6 nC → po zetknięciu po +3 nC.<\/li>\n<li>Kontrola: przed 6 nC, po 3 + 3 = 6 nC ✓ (zasada zachowania).<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Przykład 3 (E8+) — prawo Coulomba<\/span>\n<ol>\n<li>Dane: q₁ = 3 µC = 3·10⁻⁶ C, q₂ = −2 µC, r = 20 cm = 0,2 m.<\/li>\n<li>F = k·|q₁q₂|/r² = 8,99·10⁹ · 6·10⁻¹² / 0,04.<\/li>\n<li>F = 8,99·10⁹ · 1,5·10⁻¹⁰ ≈ 1,35 N.<\/li>\n<li>Znaki różne → przyciąganie.<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Przykład 4 (E8+) — co, jeśli…<\/span>\n<ol>\n<li>Odległość zmalała 2 razy: F rośnie 2² = 4 razy.<\/li>\n<li>Jeden ładunek wzrósł 3 razy, odległość wzrosła 3 razy: F · 3 / 9 = F/3.<\/li>\n<li>Wskazówka: najpierw zapisz F ∝ q₁q₂/r², potem podstaw zmiany.<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Przykład 5 (LO) — natężenie pola<\/span>\n<ol>\n<li>Q = 2 nC, r = 30 cm: E = k·Q/r² = 8,99·10⁹ · 2·10⁻⁹ / 0,09 ≈ 200 N/C.<\/li>\n<li>Siła na elektron w tym miejscu: F = eE ≈ 1,6·10⁻¹⁹ · 200 = 3,2·10⁻¹⁷ N.<\/li>\n<\/ol>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-ladunek-v01\"><button type=\"button\" data-che-open-viz=\"fiz-ladunek-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-ladunek-v01',lessonId:'FIZ-01'},'*')\"><b>Sprawdź przykład 2 na modelu kul<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Model kul dla przykładu 2: uczeń ustawia kule, dotyka ich i porównuje ładunki przed i po. Wniosek: w każdym kroku ładunek całkowity jest zachowany. -->\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-coulomb-v01\"><button type=\"button\" data-che-open-viz=\"fiz-coulomb-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-coulomb-v01',lessonId:'FIZ-01'},'*')\"><b>Sprawdź przykłady 3–5 w modelu Coulomba<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Model Coulomba do przykładów 3–5: ustawiając ładunki i odległość z treści, odczytuje się siłę i sprawdza wpływ zmiany r i ośrodka na wykresie F(r). Wniosek: rachunek z prawa Coulomba i odczyt z modelu mają dać ten sam wynik. -->\n<\/section>\n<section id=\"s11b\">\n<div class=\"part-heading\"><span class=\"part-num\">11b<\/span> Pary do odróżniania <span class=\"level-badge level-exam\">KONKURS<\/span><\/div>\n<nie-myl>\n<summary>Pojęcia z poziomu E8<\/summary>\n<ul>\n<li>Ciało obojętne ≠ ciało bez ładunków — obojętne ma ładunki, ale ich suma wynosi 0; test rozstrzygający: policz protony i elektrony (jest ich tyle samo) albo zsumuj ładunki ze znakami.<\/li>\n<li>Elektryzowanie przez dotyk ≠ elektryzowanie przez indukcję — przy dotyku ciała się stykają i końcowy znak jest taki sam jak znak ciała naładowanego, przy indukcji nie ma styku, a po uziemieniu znak jest przeciwny; test rozstrzygający: czy ciała się dotykały i jaki jest znak końcowy względem pręta?<\/li>\n<li>Przewodnik ≠ izolator — przewodnik ma swobodne nośniki, więc ładunek rozpływa się po przewodniku i w równowadze gromadzi się na jego powierzchni, a izolator trzyma ładunek w miejscu; test rozstrzygający: czy elektroskop rozładuje się po dotknięciu go tym przedmiotem trzymanym w ręce?<\/li>\n<li>Polaryzacja ≠ indukcja — polaryzacja to przesunięcie ładunków wewnątrz cząsteczek izolatora, indukcja to ruch swobodnych elektronów po przewodniku; test rozstrzygający: czy materiał ma swobodne nośniki ładunku?<\/li>\n<li>Dowód odpychaniem ≠ dowód przyciąganiem — odpychanie dowodzi ładunków tego samego znaku, a przyciąganie zachodzi też z ciałem obojętnym; test rozstrzygający: czy ciała odpychają się po zetknięciu lub przy zbliżeniu drugim ciałem o znanym znaku?<\/li>\n<li>Uziemienie ≠ odizolowanie — uziemienie to połączenie przewodzące z ziemią, które pozwala ładunkowi odpłynąć lub napłynąć; test rozstrzygający: czy istnieje ścieżka przewodząca do ziemi?<\/li>\n<li>Elektroskop ≠ przyrząd do ustalania znaku — pokazuje, ile ładunku jest na nim, nie jaki ma znak; test rozstrzygający: czy na podstawie samego kąta listków da się odróżnić + od −? (Nie.)<\/li>\n<\/ul>\n<\/nie-myl>\n<nie-myl>\n<summary>Pojęcia z poziomu olimpijskiego<\/summary>\n<ul>\n<li>Ładunek elementarny e ≠ ładunek elektronu — e jest dodatnie (≈ 1,6·10⁻¹⁹ C), elektron ma −e; test rozstrzygający: sprawdź znak.<\/li>\n<li>Natężenie pola E ≠ siła F — E = F/q nie zależy od ładunku próbnego, F tak; test rozstrzygający: jednostka (N/C a N) i zmiana wyniku po zastąpieniu q przez 2q (F podwaja się, E nie zmienia się).<\/li>\n<li>Potencjał V ≠ napięcie U ≠ natężenie E — V opisuje jeden punkt (J/C), U to różnica potencjałów dwóch punktów, E to zmiana potencjału na odległość (V/m); test rozstrzygający: czy mowa o jednym punkcie, o dwóch punktach, czy o zmianie na metr?<\/li>\n<li>Zasada zachowania ładunku ≠ kwantyzacja ładunku — pierwsza mówi, że suma jest stała, druga, że swobodny ładunek jest wielokrotnością e; test rozstrzygający: czy zdanie dotyczy sumy przed i po, czy dozwolonych wartości ładunku?<\/li>\n<li>Siła Coulomba ≠ siła grawitacji — obie maleją jak 1/r², ale elektryczna może odpychać i dla pary proton–elektron jest ok. 10³⁹ razy większa; test rozstrzygający: czy siła może być odpychająca?<\/li>\n<li>Kontakt przewodnika z przewodnikiem ≠ kontakt przewodnika z naładowanym izolatorem — przewodniki wyrównują potencjały i dzielą ładunek, izolator oddaje tylko ładunek z miejsca styku; test rozstrzygający: czy ładunek może swobodnie przepływać po obu ciałach?<\/li>\n<li>Klatka Faradaya ≠ osłona od każdego pola — osłania od pól elektrycznych i od fal elektromagnetycznych, ale nie od stałego pola magnetycznego; test rozstrzygający: czy pole zmienia się w czasie albo jest elektryczne?<\/li>\n<\/ul>\n<\/nie-myl>\n<\/section>\n<section id=\"s12\">\n<div class=\"part-heading\"><span class=\"part-num\">12<\/span> Ćwiczenia<\/div>\n<h3>Poziom A — podstawa (E8)<\/h3>\n<div class=\"card\">\n<ol start=\"1\">\n<li>Kulka ma ładunek −3,2·10⁻¹⁹ C. Ile ma nadmiarowych elektronów?<\/li>\n<li>Ciało ma 5·10⁹ nadmiarowych elektronów. Oblicz jego ładunek.<\/li>\n<li>Szklaną pałeczkę potarto jedwabiem. Jaki znak ładunku ma każde z ciał i dlaczego?<\/li>\n<li>Dwie identyczne metalowe kulki: +6 nC i −2 nC. Jaki ładunek ma każda po zetknięciu?<\/li>\n<li>Wymień trzy przewodniki i trzy izolatory.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż podpowiedzi<\/summary>\n<ol start=\"1\">\n<li>n = |q|/e<\/li>\n<li>q = n·e, znak: nadmiar e → minus<\/li>\n<li>kto stoi wcześniej w szeregu tryboelektrycznym, oddaje elektrony<\/li>\n<li>zsumuj i podziel na 2<\/li>\n<li>czy są swobodne nośniki ładunku?<\/li>\n<\/ol>\n<\/details>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"1\">\n<li>n = q/e = 3,2·10⁻¹⁹ / 1,6·10⁻¹⁹ = 2 elektrony.<\/li>\n<li>q = n·e = 5·10⁹ · 1,6·10⁻¹⁹ C = 8·10⁻¹⁰ C, znak ujemny: q = −8·10⁻¹⁰ C (−0,8 nC).<\/li>\n<li>Szkło +, jedwab −: szkło oddało elektrony jedwabiowi (stoi wcześniej w szeregu tryboelektrycznym).<\/li>\n<li>(+6 − 2)/2 = +2 nC każda.<\/li>\n<li>Przewodniki: miedź, aluminium, grafit, woda z solą, ciało człowieka. Izolatory: szkło, guma, plastik, suche drewno, suche powietrze.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom B — trening (E8)<\/h3>\n<div class=\"card\">\n<ol start=\"6\">\n<li>Do kulki naładowanego elektroskopu zbliżono pręt naładowany ujemnie — listki rozchyliły się bardziej. Jaki znak ma ładunek elektroskopu?<\/li>\n<li>Dlaczego naelektryzowany balon przykleja się do ściany?<\/li>\n<li>Jak zmieni się siła oddziaływania dwóch ładunków, gdy odległość wzrośnie 3 razy? A gdy oba ładunki wzrosną 2 razy?<\/li>\n<li>Opisz, jak naelektryzować elektroskop dodatnio, mając tylko pręt naładowany ujemnie.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż podpowiedzi<\/summary>\n<ol start=\"6\">\n<li>zbliżenie jednoimiennego ładunku spycha elektrony do listków<\/li>\n<li>polaryzacja / indukcja w ścianie<\/li>\n<li>F ∝ q₁q₂/r²<\/li>\n<li>ZUZO: zbliż, uziem, zabierz palec, oddal<\/li>\n<\/ol>\n<\/details>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"6\">\n<li>Ujemny — zbliżenie ładunku jednoimiennego spycha więcej elektronów do listków.<\/li>\n<li>Balon (−) indukuje w ścianie ładunek dodatni na powierzchni (polaryzacja) — przyciąganie.<\/li>\n<li>9 razy mniejsza; 4 razy większa.<\/li>\n<li>Indukcja: zbliż pręt, uziem kulkę palcem, zabierz palec, oddal pręt — elektroskop ma ładunek dodatni.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom C — ambitny<\/h3>\n<div class=\"card\">\n<ol start=\"10\">\n<li>Balon ma ładunek −0,5 µC. Ile elektronów przeszło na niego z włosów?<\/li>\n<li>Oblicz siłę między ładunkami 2 µC i 3 µC odległymi o 30 cm. Czy to przyciąganie, czy odpychanie?<\/li>\n<li>Trzy identyczne kulki: A = +8 nC, B = 0, C = 0. Dotykamy A do B, potem B do C. Jakie są ładunki końcowe?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż podpowiedzi<\/summary>\n<ol start=\"10\">\n<li>0,5 µC = 5·10⁻⁷ C; n = q/e<\/li>\n<li>zamień µC na C i cm na m<\/li>\n<li>dotykaj po kolei; suma się nie zmienia<\/li>\n<\/ol>\n<\/details>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"10\">\n<li>n = 0,5·10⁻⁶ / 1,602·10⁻¹⁹ ≈ 3,1·10¹² elektronów.<\/li>\n<li>F = 8,99·10⁹ · 6·10⁻¹² / 0,09 ≈ 0,6 N — odpychanie (ładunki jednoimienne).<\/li>\n<li>A–B: po +4 nC. B–C: po +2 nC. Wynik: A = +4 nC, B = +2 nC, C = +2 nC (suma 8 nC — zachowana).<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Poziom D — LO rozszerzone<\/h3>\n<div class=\"card\">\n<ol start=\"13\">\n<li>Oblicz natężenie pola ładunku 1 nC w odległości 10 cm oraz przyspieszenie elektronu w tym miejscu.<\/li>\n<li>Dwa ładunki +q w odległości 2a. Ile wynosi natężenie pola w połowie odległości? Uzasadnij.<\/li>\n<li>Dlaczego w wodzie (εr ≈ 80) kryształ NaCl rozpada się na jony, a w benzynie (εr ≈ 2) — nie?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż podpowiedzi<\/summary>\n<ol start=\"13\">\n<li>E = kQ/r², a = eE/mₑ<\/li>\n<li>wektory od obu ładunków znoszą się<\/li>\n<li>siła maleje εr razy<\/li>\n<\/ol>\n<\/details>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol start=\"13\">\n<li>E = k·Q/r² = 8,99·10⁹ · 10⁻⁹ / 0,01 ≈ 900 N/C; F = eE ≈ 1,44·10⁻¹⁶ N; a = F/m<sub>e<\/sub> ≈ 1,6·10¹⁴ m/s².<\/li>\n<li>E = 0 — wektory natężeń od obu ładunków mają równe wartości i przeciwne zwroty (superpozycja).<\/li>\n<li>Siła przyciągania Na⁺ i Cl⁻ maleje εr razy; w wodzie ~80× — energia cieplna i hydratacja wystarczają, by rozdzielić jony; w benzynie (εr ≈ 2) siła spada tylko ok. 2 razy, a cząsteczki benzyny nie są polarne i nie otaczają jonów, więc sól się nie rozpuszcza.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<h3>Dodatkowe zadania — trzy ładunki, przyciąganie, jednostki (W1, 2026-10-14)<\/h3>\n<ol>\n<li>Ładunki leżą na prostej: q₁ = +2 µC w punkcie 0, q₂ = +2 µC w punkcie 0,3 m, q₃ = −2 µC w punkcie 0,6 m. Oblicz siłę wypadkową na ładunek q₂. <strong>Klucz:<\/strong> od q₁ odpychanie w prawo, F₁₂ = 8,99·10⁹·(2·10⁻⁶)²/0,3² ≈ 0,40 N; od q₃ przyciąganie w prawo, też ≈ 0,40 N. Wypadkowa ≈ 0,80 N, w prawo.<\/li>\n<li>Naelektryzowana pałeczka przyciąga kawałek papieru. Czy papier jest naelektryzowany? <strong>Klucz:<\/strong> nie wiadomo. Przyciąganie wystarcza, by wykryć obcy ładunek lub polaryzację obojętnego ciała, ale nie dowodzi naelektryzowania papieru.<\/li>\n<li>Zamień na kulomby: 3 µC, 250 nC, 4 pC. <strong>Klucz:<\/strong> 3·10⁻⁶ C; 2,5·10⁻⁷ C; 4·10⁻¹² C.<\/li>\n<\/ol>\n<p>---<\/p>\n<\/section>\n<section id=\"s12a\">\n<div class=\"part-heading\"><span class=\"part-num\">12a<\/span> Zadania egzaminacyjne E8 — typy i wzorcowe odpowiedzi<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Typowe zadania E8 — jak je rozpoznać<\/span>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Typ zadania<\/th><th>Co sprawdza<\/th><th>Klucz do odpowiedzi<\/th><\/tr><\/thead><tbody><tr><td>„Wyjaśnij, dlaczego balon przyczepił się do ściany”<\/td><td>indukcja / polaryzacja<\/td><td>balon naelektryzowany → w ścianie przesunięcie ładunków → bliżej ładunek przeciwny → przyciąganie<\/td><\/tr><tr><td>„Jaki ładunek uzyska pałeczka…” (szereg podany w zadaniu)<\/td><td>tarcie<\/td><td>oddaje elektrony materiał stojący wcześniej → +; przyjmuje → −<\/td><\/tr><tr><td>„Kulki zetknięto — jaki mają ładunek?”<\/td><td>zasada zachowania ładunku<\/td><td>q′ = (q₁ + q₂)/2 dla identycznych kul<\/td><\/tr><tr><td>„Uzupełnij zdania: listki elektroskopu…”<\/td><td>budowa i działanie elektroskopu<\/td><td>listki mają ładunek jednoimienny → odpychają się<\/td><\/tr><tr><td>„Wybierz przewodniki / izolatory”<\/td><td>klasyfikacja materiałów<\/td><td>metale, grafit, woda z solą — przewodniki; szkło, guma, plastik, suche drewno — izolatory<\/td><\/tr><tr><td>„Zaplanuj doświadczenie…”<\/td><td>metoda naukowa<\/td><td>problem → hipoteza → zestaw → przebieg → obserwacja → wniosek; zmieniaj jedną zmienną<\/td><\/tr><tr><td>„Oblicz, ile elektronów…” (E8+)<\/td><td>q = n·e<\/td><td>n = q/e; uważaj na przedrostki nC, µC<\/td><\/tr><tr><td>„Jak zmieni się siła…” (E8+)<\/td><td>F ∝ q₁q₂/r²<\/td><td>2× dalej → ¼; 2× większy ładunek → 2×<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Zadanie egzaminacyjne z rozwiązaniem (otwarte)<\/span>\n<p><b>Treść:<\/b> Ania potarła plastikową linijkę o włosy i zbliżyła ją do strumienia wody z kranu. Strumień się wygiął. Wyjaśnij zjawisko i podaj, jak zmieni się efekt, gdy linijkę odsunie dalej.<\/p>\n<details class=\"answer\"><summary>Wzorcowa odpowiedź<\/summary>\n<p>Linijka naelektryzowała się przez tarcie (przejęła elektrony z włosów — ładunek ujemny). Jej ładunek przesuwa ładunki w wodzie (polaryzacja cząsteczek H₂O, jony w wodzie z kranu) — bliżej linijki gromadzi się ładunek przeciwnego znaku, więc woda jest przyciągana i strumień się wygina. Po odsunięciu linijki siła maleje (szybko, bo zależy od odległości), więc strumień wygina się słabiej.<\/p>\n<p class=\"mini-note\">Punktowane elementy: elektryzowanie przez tarcie · przesunięcie ładunków w wodzie · przyciąganie · zależność od odległości.<\/p>\n<\/details>\n<\/div>\n<p><strong>Zadania z kluczem i punktacją<\/strong><\/p>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 1 (3 pkt) — Szkło, jedwab, ebonit<\/span>\n<p>Fragment szeregu tryboelektrycznego (od materiału, który najłatwiej oddaje elektrony): szkło — wełna — jedwab — bawełna — ebonit — PVC. Szklaną pałeczkę potarto jedwabiem, a ebonitową — wełną.<\/p>\n<p>a) Podaj znak ładunku szkła i jedwabiu po potarciu. (1 pkt)\nb) Wskaż, który materiał przyjął elektrony: wełna czy ebonit. (1 pkt)\nc) Uzasadnij, że po potarciu suma ładunków szkła i jedwabiu jest równa zero. (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) Szkło +, jedwab − (1 pkt) — szkło stoi wcześniej w szeregu, więc oddaje elektrony.\nb) Ebonit (1 pkt) — stoi dalej w szeregu niż wełna, więc przyjmuje elektrony, a wełna je oddaje.\nc) Elektrony tylko przeszły ze szkła na jedwab: tyle ładunku ujemnego, ile przybyło jedwabiowi, tyle ubyło szkłu; ładunki są równe co do wartości i przeciwne co do znaku, więc suma wynosi 0 (zasada zachowania ładunku). (1 pkt)<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 2 (3 pkt) — Dotyk dwóch kul<\/span>\n<p>Dwie identyczne metalowe kule mają ładunki: A = +10 µC, B = −4 µC. Zetknięto je i rozsunięto.<\/p>\n<p>a) Oblicz ładunek każdej kuli po zetknięciu. (1 pkt)\nb) Podaj, która kula przyjęła, a która oddała elektrony. (1 pkt)\nc) Oblicz, ile elektronów przeszło (e = 1,6·10⁻¹⁹ C). (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) q′ = (10 + (−4))/2 = +3 µC każda (1 pkt).\nb) A: +10 → +3 µC, ładunek dodatni zmalał, więc A przyjęła elektrony; B: −4 → +3 µC, ładunek ujemny zniknął i został dodatni, więc B oddała elektrony (1 pkt).\nc) Przeszedł ładunek 7 µC: n = 7·10⁻⁶ / 1,6·10⁻¹⁹ ≈ 4,4·10¹³ elektronów (1 pkt).<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 3 (4 pkt) — Elektroskop i dwa pręty<\/span>\n<p>Elektroskop jest naładowany dodatnio — listki są rozchylone. Do jego kulki (bez dotykania) powoli zbliżono pręt naładowany ujemnie.<\/p>\n<p>a) Opisz, co dzieje się z listkami. (1 pkt)\nb) Wyjaśnij to, wskazując, które cząstki i w którą stronę się przesunęły. (1 pkt)\nc) Co by się stało, gdyby zbliżono pręt naładowany dodatnio? (1 pkt)\nd) Do tego samego elektroskopu zbliżono pręt o nieznanym znaku ładunku i listki rozchyliły się bardziej. Podaj znak ładunku pręta i uzasadnij. (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) Listki opadają (kąt maleje) (1 pkt).\nb) Ujemny pręt odpycha elektrony swobodne w elektroskopie: przesuwają się z kulki w dół, na listki, i zobojętniają część ich ładunku dodatniego, więc listki się odpychają słabiej (1 pkt).\nc) Listki rozchylają się bardziej (1 pkt) — dodatni pręt przyciąga elektrony w górę, na kulkę, więc na listkach przybywa ładunku dodatniego.\nd) Dodatni (1 pkt) — rozchylenie rośnie tylko przy ładunku jednoimiennym z ładunkiem elektroskopu.<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 4 (4 pkt) — Prawda czy fałsz?<\/span>\n<p>Oceń zdania: napisz P (prawda) albo F (fałsz).<\/p>\n<ol>\n<li>Podczas pocierania szklanej pałeczki jedwabiem elektrony przechodzą ze szkła na jedwab. (1 pkt)<\/li>\n<li>Ciało naelektryzowane dodatnio przyjęło dodatkowe protony. (1 pkt)<\/li>\n<li>Samo rozchylenie listków elektroskopu pokazuje znak ładunku ciała. (1 pkt)<\/li>\n<li>Gdy odległość między dwoma ładunkami wzrośnie 2 razy, siła ich oddziaływania zmaleje 4 razy. (1 pkt)<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<ol>\n<li>P (1 pkt) — szkło stoi wcześniej w szeregu i oddaje elektrony.<\/li>\n<li>F (1 pkt) — przemieszczają się tylko elektrony; ciało dodatnie ma niedobór elektronów.<\/li>\n<li>F (1 pkt) — listki pokazują tylko, ile ładunku jest na elektroskopie, nie jaki ma znak.<\/li>\n<li>P (1 pkt) — F ∝ 1/r², więc 2× dalej → 4× mniejsza siła.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 5 (3 pkt) — Siła Coulomba<\/span>\n<p>Dwa małe ładunki: q₁ = 4 µC i q₂ = 5 µC znajdują się w powietrzu w odległości 60 cm (k = 8,99·10⁹ N·m²/C²).<\/p>\n<p>a) Oblicz wartość siły oddziaływania i podaj, czy to odpychanie, czy przyciąganie. (2 pkt)\nb) O ile razy zmieni się siła, gdy odległość zmaleje 3 razy? (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) F = k·q₁·q₂/r² = 8,99·10⁹ · 4·10⁻⁶ · 5·10⁻⁶ / 0,6² = 8,99·10⁹ · 2·10⁻¹¹ / 0,36 ≈ 0,5 N (1 pkt za wzór i podstawienie w jednostkach SI, 1 pkt za wynik wraz z określeniem: odpychanie, bo ładunki są jednoimienne).\nb) Siła wzrośnie 9 razy (1 pkt), bo F ∝ 1/r², a (1/3)⁻² = 9.<\/p>\n<\/details>\n<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 6 (4 pkt) — Zaplanuj doświadczenie<\/span>\n<p>Uczeń chce sprawdzić, czy rodzaj materiału, którym pociera się balon, wpływa na to, ile skrawków papieru balon przyciągnie.<\/p>\n<p>a) Sformułuj problem badawczy. (1 pkt)\nb) Wskaż zmienną niezależną i zmienną zależną. (1 pkt)\nc) Podaj dwa warunki, które należy utrzymać stałe. (1 pkt)\nd) Opisz próbę kontrolną. (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) Np.: „Czy rodzaj materiału użytego do pocierania balonu wpływa na liczbę przyciągniętych skrawków papieru?” (1 pkt).\nb) Niezależna: rodzaj materiału (włosy, wełna, bawełna); zależna: liczba przyciągniętych skrawków (1 pkt).\nc) Np. ten sam balon, taka sama liczba i siła potarć, taka sama odległość balonu od skrawków, takie same skrawki papieru, podobna wilgotność powietrza — dowolne dwa (1 pkt).\nd) Zbliżenie do skrawków balonu nienaelektryzowanego (przed potarciem): jeśli skrawki leżą nieruchomo, efekt wynika z naelektryzowania (1 pkt).<\/p>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"s12b\">\n<div class=\"part-heading\"><span class=\"part-num\">12b<\/span> Dla olimpijczyka — wykład pogłębiony i trudne przypadki <span class=\"level-badge level-exam\">KONKURS<\/span><\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dla olimpijczyka — kwantyzacja i zachowanie ładunku<\/span>\n<p>Swobodne cząstki mają ładunek będący całkowitą wielokrotnością e. Kwarki mają ładunki ±⅓e i ±⅔e, ale nie występują swobodnie — łączą się w cząstki o ładunku całkowitym: proton (dwa kwarki górne i jeden dolny: ⅔ + ⅔ − ⅓ = +1) i neutron (jeden górny i dwa dolne: ⅔ − ⅓ − ⅓ = 0). Zasada zachowania ładunku dotyczy <strong>sumy<\/strong>: w zderzeniach cząstek mogą powstawać pary cząstka–antycząstka (np. elektron i pozyton o ładunkach −e i +e), ale suma ładunków pozostaje taka, jak przed zderzeniem. Ładunek jest też niezmienniczy — nie zależy od prędkości ciała, w przeciwieństwie do pędu czy energii. (Poziom ponadpodręcznikowy; do weryfikacji w razie cytowania w pracy.)<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dla olimpijczyka — siła na ciało obojętne<\/span>\n<p>W polu <strong>jednorodnym<\/strong> ciało obojętne, które się spolaryzuje, dostaje dwa równe ładunki przeciwnych znaków i siły na nie się znoszą (pozostaje tylko moment obrotowy). Siła przyciągająca pojawia się dopiero w polu <strong>niejednorodnym<\/strong>, silniejszym bliżej źródła. Dla ciała o polaryzowalności α indukowany moment dipolowy wynosi p = α·E, a siła F = p·dE/dx = α·E·dE/dx — zawsze skierowana w stronę silniejszego pola, niezależnie od znaku ładunku źródła. Dlatego naelektryzowany grzebień przyciąga papier niezależnie od tego, czy jego ładunek jest dodatni, czy ujemny.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dla olimpijczyka — kule, powierzchnia i ostrza<\/span>\n<p>Pole na zewnątrz równomiernie naładowanej kuli lub cienkiej powłoki jest takie samo jak pole ładunku punktowego w jej środku, a wewnątrz naładowanej powłoki pole jest zerowe. Dla dwóch połączonych kul ładunki dzielą się tak, że q ∝ R (wyrównanie potencjałów, sekcja 5a). Gęstość powierzchniowa σ = q/(4πR²) jest więc proporcjonalna do 1/R: na mniejszej kuli (a tym bardziej na ostrzu) jest większa, a pole przy powierzchni E = σ/ε₀ — silniejsze. Stąd wyładowania „uciekają” z ostrzy i stąd działa piorunochron.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dla olimpijczyka — konwencje i zapisy<\/span>\n<p><strong>Konwencja szkolna (SI):<\/strong> e > 0, elektron ma ładunek −e, a stała k = 1/(4π·ε₀) ≈ 8,99·10⁹ N·m²/C². W wielu zadaniach przyjmuje się k ≈ 9·10⁹ N·m²/C² — różnica jest mniejsza niż 0,2%, więc wynik na dwie cyfry znaczące jest ten sam; sprawdź polecenie. <strong>Konwencja alternatywna (CGS):<\/strong> prawo Coulomba ma postać F = q₁·q₂/r² bez stałej k, a jednostką ładunku jest statkulomb (1 C ≈ 3·10⁹ statkulomba). <strong>Kierunek prądu:<\/strong> umowny kierunek prądu przyjmuje od „+” do „−”, choć w metalach płyną elektrony w przeciwną stronę — ta umowa pochodzi od Franklina, który nie wiedział, że nośnikami są elektrony.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dla olimpijczyka — skąd się bierze elektryzowanie przez tarcie<\/span>\n<p>Mechanizm tryboelektryzacji nie jest do końca wyjaśniony: zależnie od materiałów przenoszone mogą być elektrony, jony, a nawet drobiny materiału. Szereg tryboelektryczny jest regułą doświadczalną, nie prawem fizyki — kolejność zależy od wilgotności, czystości powierzchni, siły nacisku i rodzaju kontaktu. Dlatego różne tabele podają różną kolejność, a w zadaniach należy trzymać się szeregu podanego w poleceniu. (Do weryfikacji: aktualny stan badań.)<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Trudny przypadek 1 — elektroskop i pręt o dużym ładunku<\/span>\n<p>Elektroskop ma ładunek dodatni; zbliżasz pręt o dużym ładunku ujemnym. Najpierw listki opadają, ale gdy pręt jest bardzo blisko, ujemny ładunek pręta spycha do listków więcej elektronów, niż trzeba do zobojętnienia, i listki rozchylają się znowu — tym razem z ładunkiem ujemnym, choć <strong>całkowity ładunek elektroskopu się nie zmienił, zmienił się tylko jego rozkład<\/strong>. Jak rozstrzygnąć krok po kroku: 1) zbliżaj pręt powoli z daleka; 2) o znaku decyduje to, co dzieje się na początku zbliżania: opadanie → ładunek różnoimienny, rozchylanie → jednoimienny; 3) nie wyciągaj wniosków z pozycji listków przy pręcie bardzo bliskim kulce.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Trudny przypadek 2 — dotyk przewodnika z naładowanym izolatorem<\/span>\n<p>Ebonitowa pałeczka z ładunkiem −Q dotyka kulki elektroskopu. Czy ładunek podzieli się po równo? Nie. Izolator nie ma swobodnych nośników, więc oddaje tylko ładunek z niewielkiego miejsca styku, a reszta zostaje na pałeczce; wzór (q₁ + q₂)/2 dotyczy wyłącznie identycznych <strong>przewodników<\/strong>. Rozstrzygnięcie: zapytaj, czy ładunek może swobodnie przepływać po obu ciałach; jeśli nie — wzoru na połowę nie stosuj.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Trudny przypadek 3 — ten sam algorytm, dwa kierunki przepływu<\/span>\n<p>Indukcja z uziemieniem (ZUZO) działa dla pręta ujemnego i dodatniego, ale elektrony płyną w przeciwne strony. Pręt (−): elektrony <strong>odpływają<\/strong> do ziemi, elektroskop zostaje (+). Pręt (+): elektrony <strong>napływają<\/strong> z ziemi, elektroskop zostaje (−). Rozstrzygnięcie: 1) zapisz znak pręta; 2) w przewodniku bliższy koniec ma ładunek przeciwny do pręta, a dalszy — taki sam jak pręt; 3) uziemienie usuwa ten dalszy ładunek: dla pręta (−) elektrony odpływają, dla pręta (+) elektrony napływają i uzupełniają niedobór; 4) po zabraniu uziemienia i oddaleniu pręta zostaje ładunek przeciwny do pręta.<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Trudny przypadek 4 — wniosek z przyciągania i odpychania<\/span>\n<p>Kulka A odpycha naelektryzowany pręt (−), a kulka B go przyciąga. Wniosek pewny: A ma ładunek ujemny (odpychanie dowodzi ładunku jednoimiennego). O B wiadomo tylko tyle, że jest dodatnia albo obojętna. Rozstrzygnięcie: zbliż do B pręt dodatni — jeśli B odpycha, jest dodatnia; jeśli przyciąga, jest obojętna (ujemną wykluczyło już pierwsze zbliżenie).<\/p>\n<\/div>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Trudny przypadek 5 — ile naprawdę wynosi k?<\/span>\n<p>W jednym zadaniu klucz może używać k = 9·10⁹, w innym 8,99·10⁹, w jeszcze innym 1/(4πε₀). To ta sama stała; różnica liczbowa jest mniejsza niż 0,2%. Rozstrzygnięcie: licz z wartością podaną w poleceniu i podawaj wynik z liczbą cyfr znaczących zgodną z danymi (zwykle 2–3).<\/p>\n<\/div>\n<\/section>\n<section id=\"s12c\">\n<div class=\"part-heading\"><span class=\"part-num\">12c<\/span> Zadania konkursowe <span class=\"level-badge level-exam\">KONKURS<\/span><\/div>\n<details class=\"adv\"><summary>Zadanie 7 (5 pkt) — Dotyk zmienia siłę <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Dwie identyczne metalowe kulki o ładunkach +Q i −3Q umieszczono w odległości r = 10 cm; przyciągają się siłą F₀ = 0,27 N. Zetknięto je i ponownie rozsunięto na tę samą odległość r (k = 8,99·10⁹ N·m²/C²).<\/p>\n<p>a) Zapisz F₀ jako funkcję Q, r i k. (1 pkt)\nb) Podaj ładunki kulek po zetknięciu i charakter oddziaływania. (1 pkt)\nc) Oblicz stosunek F/F₀ i wartość siły F po zetknięciu. (1 pkt)\nd) Wyznacz Q (wzór i wartość). (2 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) F₀ = k·|Q·3Q|/r² = 3kQ²/r² (1 pkt).\nb) Suma ładunków: Q + (−3Q) = −2Q, po równo: −Q na każdej kulce; kulki odpychają się, bo ładunki są jednoimienne (1 pkt).\nc) F = kQ²/r², więc F/F₀ = 1/3 i F = 0,27/3 = 0,09 N (1 pkt).\nd) Z a): Q² = F₀·r²/(3k), czyli Q = r·√(F₀/(3k)) (1 pkt); Q = 0,1 · √(0,27/(3 · 8,99·10⁹)) = 0,1 · √(1,0·10⁻¹¹) ≈ 0,1 · 3,16·10⁻⁶ ≈ 3,2·10⁻⁷ C (1 pkt).\nUzasadnienie: po zetknięciu suma ładunków się zachowuje, a dla identycznych kul dzieli się po równo; iloczyn ładunków spada z 3Q² do Q², więc siła maleje 3 razy, a przyciąganie zmienia się w odpychanie.<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie 8 (4 pkt) — Uzasadnij: zawsze przyciąganie <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Uzasadnij, że naelektryzowane ciało przyciąga obojętną kulkę przewodzącą niezależnie od znaku swojego ładunku. Uwzględnij: rozdzielenie ładunków w kulce, wartości obu ładunków, zależność siły od odległości i rolę znaku ładunku.<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>Po 1 pkt za każdy element:\n1. Pod wpływem ładunku ciała swobodne elektrony w kulce się przesuwają (indukcja): po bliższej stronie kulki powstaje ładunek przeciwnego znaku niż ładunek ciała, po dalszej — tego samego znaku.\n2. Kulka pozostaje obojętna jako całość, więc ładunki po obu stronach mają równe wartości.\n3. Siła maleje z kwadratem odległości, więc na bliższy ładunek (przeciwnoimienny) działa siła przyciągania większa niż siła odpychania na dalszy.\n4. Wypadkowa jest przyciągająca; zmiana znaku ładunku ciała odwraca znaki obu ładunków w kulce, więc obie siły zmieniają zwrot, a wypadkowa nadal jest przyciągająca.\nUzasadnienie: wniosek nie zależy od znaku ładunku ciała, bo znak wpływa jednocześnie na obie siły.<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie 9 (3 pkt) — Znajdź błąd <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Uczeń rozwiązał zadanie: „Kula A o promieniu 1 cm ma ładunek +6 nC, kula B o promieniu 3 cm jest obojętna. Kule połączono cienkim przewodem. Ładunki po połączeniu: q′ = (6 + 0)/2 = +3 nC każda.”<\/p>\n<p>a) Wskaż błąd w rozumowaniu ucznia. (1 pkt)\nb) Podaj poprawny warunek, który decyduje o podziale ładunku. (1 pkt)\nc) Oblicz poprawne ładunki obu kul. (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) Wzór (q₁ + q₂)/2 wolno stosować tylko do identycznych kul; tu promienie są różne (1 pkt).\nb) Po połączeniu potencjały kul są równe: q_A/R_A = q_B/R_B, a suma ładunków jest zachowana: q_A + q_B = 6 nC (1 pkt).\nc) q_A = 6 · 1/(1 + 3) = +1,5 nC, q_B = 6 · 3/(1 + 3) = +4,5 nC (1 pkt).\nUzasadnienie: potencjał kuli to V = k·q/R, więc równe potencjały oznaczają ładunki proporcjonalne do promieni; większa kula bierze więcej ładunku.<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie 10 (4 pkt) — Analiza tekstu: malowanie proszkowe <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Tekst: „W lakierni felgę zawieszono na uziemionym haku. Pistolet natryskowy nadaje drobinom farby ładunek ujemny. Naładowane drobiny lecą ku felgi i osiadają na niej, a po podgrzaniu topią się i tworzą gładką powłokę. Farba pokrywa także tylną stronę felgi, choć pistolet jest po drugiej stronie.”<\/p>\n<p>a) Wyjaśnij, dlaczego drobiny farby rozpraszają się w chmurę, zamiast lecieć jednym wąskim strumieniem. (1 pkt)\nb) Wyjaśnij, po co felga jest uziemiona. (1 pkt)\nc) Wyjaśnij, dlaczego farba osiada także z tyłu felgi. (1 pkt)\nd) Co stałoby się z powłoką, gdyby felga była odizolowana i naładowana ujemnie? (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) Drobiny mają ładunki jednoimienne, więc odpychają się nawzajem i rozchodzą się na boki (1 pkt).\nb) Uziemienie odprowadza ładunek osiadających drobin, więc felga nie gromadzi ładunku ujemnego, który odpychałby kolejne drobiny; ponadto w uziemionym metalu pod wpływem drobin indukuje się ładunek dodatni, który je przyciąga (1 pkt).\nc) Linie pola prowadzą od naładowanych drobin do całej powierzchni uziemionego metalu, także do tyłu; drobiny, odpychając się nawzajem, nie lecą tylko prosto i część omija felgę wzdłuż linii pola (1 pkt).\nd) Drobiny byłyby odpychane przez ujemną felgę, więc powłoka byłaby cienka lub nie powstałaby wcale (1 pkt).\nUzasadnienie: wszystko wynika z odpychania ładunków jednoimiennych i przyciągania do przewodnika uziemionego.<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie 11 (4 pkt) — Zadanie z pułapką: który ładunek „silniejszy”? <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Dwa małe ładunki: q₁ = +2 µC i q₂ = +8 µC znajdują się w odległości 30 cm (k = 8,99·10⁹ N·m²/C²).<\/p>\n<p>a) Oblicz wartość siły, jaką q₂ działa na q₁. (1 pkt)\nb) Uczeń twierdzi: „Większy ładunek działa większą siłą”. Oceń to zdanie. (1 pkt)\nc) Ładunki umieszczono na identycznych metalowych kulkach, zetknięto i znów rozsunięto na 30 cm. Podaj ładunki kulek. (1 pkt)\nd) Oblicz nową siłę i wyjaśnij, dlaczego jest większa, mimo że suma ładunków się nie zmieniła. (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) F = 8,99·10⁹ · 2·10⁻⁶ · 8·10⁻⁶ / 0,09 ≈ 1,6 N (1 pkt).\nb) Zdanie jest fałszywe: siły są równe co do wartości (III zasada dynamiki), zawsze po 1,6 N (1 pkt).\nc) Suma +10 µC, po równo: +5 µC na każdej kulce (1 pkt).\nd) F′ = 8,99·10⁹ · 5·10⁻⁶ · 5·10⁻⁶ / 0,09 ≈ 2,5 N (siła wzrosła); przy stałej sumie ładunków iloczyn q₁·q₂ jest największy, gdy ładunki są równe: 16 µC² → 25 µC² (1 pkt).\nUzasadnienie: siła zależy od iloczynu ładunków, nie od ich sumy; wyrównanie ładunków zwiększa iloczyn.<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie 12 (4 pkt) — Gdzie pole jest zerowe? <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Ładunek +4Q umieszczono w punkcie x = 0, a ładunek +Q w punkcie x = 3a (na jednej prostej). Szukamy punktu, w którym natężenie pola wypadkowego wynosi zero.<\/p>\n<p>a) Zapisz natężenia pól obu ładunków w punkcie leżącym w odległości x od pierwszego ładunku, między ładunkami. (1 pkt)\nb) Zapisz warunek zerowego pola wypadkowego. (1 pkt)\nc) Wyznacz x. (1 pkt)\nd) Uzasadnij, dlaczego takiego punktu nie ma na zewnątrz odcinka łączącego ładunki. (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) E₁ = k·4Q/x² (zwrot w prawo), E₂ = k·Q/(3a − x)² (zwrot w lewo) (1 pkt).\nb) Pola mają przeciwne zwroty, więc zerowanie wymaga równych wartości: 4Q/x² = Q/(3a − x)² (1 pkt).\nc) 2/x = 1/(3a − x) → 6a − 2x = x → x = 2a (od ładunku +4Q) (1 pkt).\nd) Poza odcinkiem oba pola mają ten sam zwrot (oba ładunki są dodatnie, więc odpychają ładunek próbny „na zewnątrz”), więc nie mogą się znieść (1 pkt).\nUzasadnienie: wynik x = 2a jest bliższy mniejszemu ładunkowi, zgodnie z oczekiwaniem — punkt zerowy leży bliżej słabszego źródła.<\/p>\n<\/details>\n<\/div><\/details>\n<details class=\"adv\"><summary>Zadanie 13 (4 pkt) — Kropla w stylu Millikana <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Naładowana kropla oleju o masie m = 4,8·10⁻¹⁵ kg „wisi” w jednorodnym polu elektrycznym o natężeniu E = 1,5·10⁵ N/C skierowanym pionowo w dół (przyjmij g = 10 m/s², e = 1,6·10⁻¹⁹ C).<\/p>\n<p>a) Zapisz warunek równowagi. (1 pkt)\nb) Oblicz ładunek kropli. (2 pkt)\nc) Ile elektronów nadmiarowych lub brakujących ma kropla? (1 pkt)<\/p>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>a) Siła elektryczna równoważy ciężar: |q|·E = m·g (1 pkt).\nb) |q| = m·g/E (1 pkt) = 4,8·10⁻¹⁵ · 10 / 1,5·10⁵ = 3,2·10⁻¹⁹ C (1 pkt).\nc) n = |q|/e = 2 (1 pkt); ponieważ pole skierowane jest w dół, a siła elektryczna działa w górę, ładunek kropli jest ujemny — kropla ma 2 nadmiarowe elektrony.\nUzasadnienie: wynik jest całkowitą wielokrotnością e, co potwierdza kwantyzację ładunku.<\/p>\n<\/details>\n<\/div><\/details>\n<\/section>\n<section id=\"s14a\">\n<div class=\"part-heading\"><span class=\"part-num\">14a<\/span> Mapa myśli, checklista i kolejność powtórek<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Mapa myśli<\/span>\n<pre style=\"font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;background:var(--surface-soft,#f6f8fa);padding:12px;border-radius:10px\">ELEKTROSTATYKA\n├── ŁADUNEK: proton +e, elektron −e · q = n·e · 1 C\n├── ELEKTRYZOWANIE\n│   ├── tarcie → szereg tryboelektryczny (ładunki przeciwne)\n│   ├── dotyk → ładunek tego samego znaku · (q₁+q₂)/2\n│   └── indukcja → ZUZO → ładunek przeciwny\n├── ODDZIAŁYWANIE: jednoimienne ↔ odpychanie, różnoimienne ↔ przyciąganie\n│   └── F = k·|q₁q₂|/r² (E8+) · 2× dalej → ¼\n├── MATERIAŁY: przewodniki (e⁻ swobodne, jony) · izolatory · półprzewodniki\n├── PRZYRZĄDY: elektroskop (ILE, nie JAKI) · uziemienie\n├── ZASTOSOWANIA: piorunochron · ksero · filtry · malowanie · klatka Faradaya\n└── LO: pole E = F/q · linie pola · potencjał · napięcie · kondensator<\/pre>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Checklista — umiem…<\/span>\n<ul style=\"list-style:none;padding:0\">\n<li>☐ wyjaśniam, skąd ciało ma ładunek (nadmiar / niedobór elektronów)<\/li>\n<li>☐ liczę q = n·e i n = q/e<\/li>\n<li>☐ przewiduję znaki ładunków po tarciu (szereg)<\/li>\n<li>☐ stosuję zasadę zachowania ładunku przy dotyku<\/li>\n<li>☐ opisuję budowę i działanie elektroskopu<\/li>\n<li>☐ wyjaśniam przyciąganie ciała obojętnego (polaryzacja/indukcja)<\/li>\n<li>☐ opisuję 4 kroki elektryzowania przez indukcję<\/li>\n<li>☐ podaję 3 przewodniki i 3 izolatory oraz przykłady zastosowań i zagrożeń<\/li>\n<li>☐ (E8+) obliczam siłę z prawa Coulomba i jej zmianę<\/li>\n<li>☐ (LO) obliczam natężenie pola ładunku punktowego<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Plan powtórek (krzywa zapominania)<\/span>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Kiedy<\/th><th>Co<\/th><th>Ile<\/th><\/tr><\/thead><tbody><tr><td>dziś<\/td><td>sekcja 0 + mnemotechniki<\/td><td>10 min<\/td><\/tr><tr><td>jutro<\/td><td>fiszki + diagnoza startowa<\/td><td>5 min<\/td><\/tr><tr><td>za 3 dni<\/td><td>przykłady prowadzone (bez patrzenia)<\/td><td>15 min<\/td><\/tr><tr><td>za tydzień<\/td><td>ćwiczenia A–B + test<\/td><td>20 min<\/td><\/tr><tr><td>za 3 tygodnie<\/td><td>zadania egzaminacyjne 12a<\/td><td>20 min<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<\/div>\n<\/section>\n<section id=\"s13\">\n<div class=\"part-heading\"><span class=\"part-num\">13<\/span> Fiszki<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Ładunek elementarny<\/span><span class=\"back\">e ≈ 1,6·10⁻¹⁹ C<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">1 C to ile elektronów?<\/span><span class=\"back\">ok. 6,24·10¹⁸<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Ciało naelektryzowane ujemnie<\/span><span class=\"back\">nadmiar elektronów<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Ciało naelektryzowane dodatnio<\/span><span class=\"back\">niedobór elektronów<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Co się przemieszcza przy elektryzowaniu?<\/span><span class=\"back\">tylko elektrony<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">3 sposoby elektryzowania<\/span><span class=\"back\">tarcie, dotyk, indukcja (wpływ)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Zasada zachowania ładunku<\/span><span class=\"back\">w układzie izolowanym suma ładunków jest stała<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Szkło + jedwab<\/span><span class=\"back\">szkło +, jedwab −<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Ebonit + sukno<\/span><span class=\"back\">ebonit −, sukno +<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Przewodnik<\/span><span class=\"back\">ma swobodne nośniki ładunku (elektrony lub jony)<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Izolator<\/span><span class=\"back\">brak swobodnych nośników; ładunek zostaje w miejscu<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Elektroskop<\/span><span class=\"back\">wykrywa ładunek; listki odpychają się jednoimiennie; nie pokazuje znaku<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Uziemienie<\/span><span class=\"back\">połączenie z ziemią — rozładowuje ciało<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Prawo Coulomba<\/span><span class=\"back\">F = k·|q₁q₂| / r², k ≈ 9·10⁹ N·m²/C²<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">2× większa odległość<\/span><span class=\"back\">siła 4× mniejsza<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Natężenie pola<\/span><span class=\"back\">E = F/q [N/C]<\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Klatka Faradaya<\/span><span class=\"back\">wewnątrz przewodnika pole = 0<\/span><\/button><\/div>\n<\/section>\n<section id=\"s14\">\n<div class=\"part-heading\"><span class=\"part-num\">14<\/span> Test<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"1\"><h5>1. Co przemieszcza się przy elektryzowaniu przez tarcie?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">protony<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">elektrony<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">neutrony<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>2. Ciało naelektryzowane dodatnio ma…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">nadmiar protonów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">niedobór elektronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">nadmiar elektronów<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>3. Ebonit pocierany suknem ładuje się…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">dodatnio<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">ujemnie<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">nie elektryzuje się<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>4. Który materiał jest przewodnikiem?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">guma<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">grafit<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">szkło<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>5. Dwie identyczne kulki: +4 nC i 0. Po zetknięciu każda ma…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">+4 nC<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">+2 nC<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">0<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>6. Listki elektroskopu się rozchylają, bo…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">mają ładunki różnoimienne<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">mają ładunki jednoimienne<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">są obojętne<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>7. Odległość między ładunkami wzrosła 2 razy. Siła…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">zmalała 2 razy<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">zmalała 4 razy<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">wzrosła 4 razy<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>8. Naelektryzowany grzebień przyciąga skrawki papieru, bo…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">papier jest naelektryzowany ujemnie<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">w papierze następuje polaryzacja ładunków<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">działa grawitacja<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"0\"><h5>9. Ładunek 1 C to ok.…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">6,24·10¹⁸ elektronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">1,6·10⁻¹⁹ elektronów<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">1000 elektronów<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>10. Piorunochron…<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">przyciąga burzę<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">odprowadza ładunek wyładowania do ziemi<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">izoluje dach<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section id=\"s15\">\n<div class=\"part-heading\"><span class=\"part-num\">15<\/span> Słownik i mosty<\/div>\n<div class=\"card\">\n<dl><div class=\"def-item\"><dt>Ładunek elektryczny q<\/dt><dd>wielkość opisująca oddziaływania elektryczne; jednostka 1 C<\/dd><\/div><div class=\"def-item\"><dt>Ładunek elementarny e<\/dt><dd>wartość bezwzględna ładunku elektronu, ≈ 1,6·10⁻¹⁹ C; ładunki swobodnych cząstek są jej całkowitymi wielokrotnościami<\/dd><\/div><div class=\"def-item\"><dt>Indukcja elektrostatyczna<\/dt><dd>przesunięcie ładunków w przewodniku pod wpływem zewnętrznego ładunku<\/dd><\/div><div class=\"def-item\"><dt>Polaryzacja<\/dt><dd>przesunięcie ładunków w cząsteczkach izolatora<\/dd><\/div><div class=\"def-item\"><dt>Uziemienie<\/dt><dd>połączenie ciała z ziemią przewodnikiem<\/dd><\/div><div class=\"def-item\"><dt>Elektroskop<\/dt><dd>przyrząd do wykrywania ładunku<\/dd><\/div><div class=\"def-item\"><dt>Szereg tryboelektryczny<\/dt><dd>kolejność materiałów wg skłonności do oddawania elektronów<\/dd><\/div><\/dl>\n<\/div>\n<div class=\"card card-new\">\n<span class=\"card-label\">Mosty<\/span>\n<ul>\n<li><strong>Chemia N03 Kwasy<\/strong> — jony, dysocjacja, przewodzenie prądu przez roztwory, elektroliza.<\/li>\n<li><strong>Chemia N04 Sole<\/strong> — kryształy jonowe, rola wody (ε<sub>r<\/sub> ≈ 80).<\/li>\n<li><strong>Fizyka — dalej<\/strong>: prąd elektryczny (ruch ładunków), napięcie, prawo Ohma (opór właściwy ρ z tej lekcji), magnetyzm.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mosty do innych przedmiotów i przykłady z życia<\/span>\n<ul>\n<li><strong>Matematyka:<\/strong> notacja naukowa i potęgi o ujemnym wykładniku (10⁻⁹), proporcjonalność prosta (F ∝ q) i odwrotna do kwadratu (F ∝ 1/r²).<\/li>\n<li><strong>Chemia:<\/strong> jony, wiązanie jonowe, elektroujemność, dysocjacja soli w wodzie (εr ≈ 80).<\/li>\n<li><strong>Biologia:<\/strong> impulsy nerwowe wiążą się z przepływem jonów przez błony komórek.<\/li>\n<li><strong>Geografia:<\/strong> burze i wyładowania atmosferyczne; piorunochron i bezpieczne zachowanie podczas burzy.<\/li>\n<li><strong>Technika:<\/strong> drukarka laserowa i kserokopiarka, filtry elektrostatyczne w kominach, malowanie proszkowe, ekrany pojemnościowe w telefonach, opaski antystatyczne.<\/li>\n<li><strong>Życie codzienne:<\/strong> iskra z klamki zimą, „trzaskający” sweter po zdjęciu, folia spożywcza przyklejona do miski, kurz osiadający na ekranie.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Historia odkryć w skrócie<\/span>\n<ul>\n<li><strong>ok. VI w. p.n.e.<\/strong> — według tradycji Tales z Miletu opisuje przyciąganie lekkich ciał przez potarty bursztyn.<\/li>\n<li><strong>1600<\/strong> — William Gilbert upowszechnia termin „elektryczność”.<\/li>\n<li><strong>ok. 1729<\/strong> — Stephen Gray odkrywa, że ładunek można przesyłać przez niektóre materiały (początek podziału na przewodniki i izolatory).<\/li>\n<li><strong>ok. 1733<\/strong> — Charles du Fay opisuje dwa rodzaje ładunku.<\/li>\n<li><strong>połowa XVIII w.<\/strong> — Benjamin Franklin ustala znaki „+” i „−” i opisuje piorunochron.<\/li>\n<li><strong>1785<\/strong> — Charles Coulomb mierzy siłę między ładunkami wagą skręceń.<\/li>\n<li><strong>1836<\/strong> — Michael Faraday pokazuje, że wnętrze zamkniętej przewodzącej klatki jest osłonięte od pola (klatka Faradaya).<\/li>\n<li><strong>1897<\/strong> — J. J. Thomson odkrywa elektron.<\/li>\n<li><strong>1909<\/strong> — Robert Millikan mierzy ładunek elementarny doświadczeniem z kroplami oleju.\n(Daty z „ok.” są orientacyjne; w literaturze bywają podawane z różnicą kilku lat.)<\/li>\n<\/ul>\n<\/div>\n<h3 id=\"audyt-ulepsz\">AUDYT — Claude Sonnet 5.5, 2026-10-12<\/h3>\n<p><strong>Poprawione:<\/strong>\n- §11a (Przykład 2): „dotyk trzech kul” → „dotyk dwóch kul” — w przykładzie dotykają się dwie kule (A i B).\n- §14 (test, pyt. 2): błędna opcja „nadmiar protonów” → „dodatkowe protony, które otrzymało przy elektryzowaniu” — dawne sformułowanie było dwuznaczne, bo ciało dodatnie ma więcej protonów niż elektronów.\n- §13 (fiszka „Prawo Coulomba”): „F = k·|q₁q₂| / r²” → „F = k·q₁·q₂ / r² (moduły ładunków)” — znak | jest separatorem pól fiszki.\n- §7: „(= 0)” → „(= 0, jeśli przewodnik był obojętny)”; liczby dla pioruna i wyładowania z ciała oznaczone „orientacyjnie”.\n- §10 BHP: „tylko pod okiem nauczyciela” → „tylko w pracowni lub pod opieką osoby dorosłej” — kurs jest do samodzielnej nauki.\n- §14a: „Plan powtórek (krzywa zapominania)” z dniami i minutami → „Co powtórzyć i w jakiej kolejności” (bez dni i czasu); tytuł sekcji „…i plan powtórek” → „…i kolejność powtórek”.\n- §14a: mapa myśli (<code><pre><\/code>) i checklista (<code><li><\/code> z ☐) przepisane na składnię <code>::: drzewo<\/code> i <code>::: checklista<\/code>; cała treść zachowana i rozszerzona.\n- §0 Mnemotechniki: lista ujęta w <code>::: wskazowki<\/code>, dopisano 4 pozycje.\n- §10 doświadczenia 1–7: ujednolicono pola (Problem, Hipoteza, Sprzęt, Przebieg z próbą kontrolną, Obserwacja, Wniosek, BHP); dawne pola „Wykonanie”, „Test”, „Sprawdzenie znaku” włączono do Przebiegu i Obserwacji.\n- §11 klinika: pierwsza kolumna ujęta w polskie cudzysłowy.\n- §13 fiszki: do każdej dopisano poziom i temat; §14 test: do każdego z 10 pytań dopisano trzecią błędną odpowiedź i wyjaśnienie.\n- Frontmatter: uzupełniono <code>opis<\/code>, <code>uid<\/code>, <code>stopka<\/code>; dodano linię <code>stan<\/code>; dodano plakietkę <code>[[exam:KONKURS]]<\/code>.<\/p>\n<p><strong>Dodane:<\/strong>\n- §0b: wykład „od zera” w 5 częściach i karta „Jak pracować z lekcją”.\n- §1, §2, §4, §6, §7, §8, §9: siedem mini-wykładów „W skrócie”.\n- §1, §7, §8, §9: cztery ciekawostki (bursztyn, dwaj wynalazcy piorunochronu, waga skręceń Coulomba, kropla oleju Millikana).\n- §0 ściąga: ε₀ i k = 1/(4π·ε₀); 4 mnemotechniki.\n- §10: próba kontrolna i hipoteza w każdym doświadczeniu.\n- §11: 8 nowych wierszy kliniki (łącznie 17) i blok mitów (6).\n- §11b: pary do odróżniania — 7 z poziomu E8, 7 z poziomu olimpijskiego.\n- §12a: zadania egzaminacyjne E8 z kluczem i punktacją (Zadania 1–6).\n- §12b: 5 mini-wykładów „Dla olimpijczyka” i 5 trudnych przypadków z rozstrzygnięciem krok po kroku.\n- §12c: 7 zadań ambitnych (Zadania 7–13) z kluczem i uzasadnieniem: przekształcanie, uzasadnianie, znajdź błąd, analiza tekstu, zadanie z pułapką, superpozycja, ładunek elementarny.\n- §13: 20 nowych fiszek, w tym 8 olimpijskich; §14: 10 nowych pytań, w tym 5 olimpijskich.\n- §14a: rozszerzona mapa pojęć i checklista (14 pozycji).\n- §15: 14 nowych haseł słownika, karta mostów do innych przedmiotów, historia odkryć.<\/p>\n<p><strong>Niepewne / do weryfikacji:<\/strong>\n- <code>uid: CHE.FIZ.01.elektrostatyka<\/code> — format wzorowany na kodach innych lekcji; sprawdź zgodność z repozytorium.\n- Typ karty <code>karta new<\/code> (§1, §8, §15) i <code>karta -<\/code> (§12, §15) występują w oryginale, ale nie ma ich na liście typów w poleceniu — zostawione bez zmian.\n- Wiersze wzorów z prefiksem podwójnego znaku dolara (oryginał) zostawione bez zmian; nowe wzory zapisane zwykłym tekstem w Unicode.\n- Daty historyczne (Tales, Gilbert, Gray, du Fay, Franklin, Diviš) są tradycyjne i orientacyjne.\n- Ładunek pioruna („kilka–kilkadziesiąt kulombów”) i napięcie wyładowania z ciała — orientacyjne.\n- Szereg tryboelektryczny jest orientacyjny; mechanizm tryboelektryzacji nie jest do końca wyjaśniony (§12b).\n- Wartości εr i ρ materiałów (§4, §8) przepisane z oryginału; ρ grafitu i wody z kranu zależą od odmiany i składu.\n- Wniosek „klatka Faradaya nie osłania od stałego pola magnetycznego” (§11b) — do sprawdzenia z podręcznikiem LO.<\/p>\n<p><strong>Proponuję usunąć:<\/strong>\n- Duplikaty haseł słownika: „Ładunek elektryczny”, „Indukcja elektrostatyczna” i „Uziemienie” występują w §0 i w §15 — wystarczy jeden zestaw.\n- Krótka karta „Uziemienie” w §5 pokrywa się z kartą „Uziemienie — gdzie znika ładunek?” w §5a.\n- Zdanie „Zasady zachowania potencjału nie ma” w §5a — odpowiada na pytanie, którego w lekcji nie ma.<\/p>\n<p><strong>Źródła:<\/strong>\n- Podstawa programowa fizyki w szkole podstawowej; informatory i arkusze CKE (egzamin ósmoklasisty).\n- Halliday, Resnick, Walker — „Podstawy fizyki”; OpenStax University Physics (elektrostatyka).\n- NIST (stałe fizyczne: e, k, ε₀).\n- Khan Academy, BBC Bitesize — przegląd zakresu i typowych błędów.<\/p>\n<p><strong>Grafiki do zrobienia:<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Gdzie<\/th><th>Rodzaj<\/th><th>Co pokazuje<\/th><th>Wniosek<\/th><th>@opis<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>§0b, po części 1<\/td><td>schemat z podpisami do klikania<\/td><td>atom z jądrem (protony, neutrony) i elektronami w trzech stanach: obojętnym, z niedoborem elektronu i z nadmiarem elektronu<\/td><td>O znaku ładunku decyduje różnica liczby elektronów i protonów.<\/td><td>Schemat atomu z podpisami do klikania: jądro z protonami i neutronami, wokół elektrony; trzy wersje — obojętna, z jednym elektronem mniej (ładunek dodatni), z jednym elektronem więcej (ładunek ujemny). Wniosek: ładunek ciała wynika z bilansu elektronów i protonów.<\/td><\/tr>\n<tr><td>§3, po karcie o przyciąganiu skrawków papieru<\/td><td>animacja „tam i z powrotem”<\/td><td>cząsteczki izolatora ustawiające się w polu naelektryzowanego pręta: przy zbliżeniu rozsuwają ładunki, przy oddaleniu wracają<\/td><td>Polaryzacja jest odwracalna i prowadzi do przyciągania ciała obojętnego.<\/td><td>Pręt zbliżany do izolatora: ładunki w cząsteczkach przesuwają się tak, że bliższa strona ma znak przeciwny do pręta; po oddaleniu pręta wracają na miejsce. Wniosek: przyciąganie ciała obojętnego wynika z przesunięcia ładunków.<\/td><\/tr>\n<tr><td>§4, po tabeli oporu właściwego<\/td><td>wykres słupkowy<\/td><td>opór właściwy wybranych materiałów od srebra do teflonu w skali logarytmicznej<\/td><td>Przewodniki i izolatory dzieli ok. 30 rzędów wielkości.<\/td><td>Wykres słupkowy w skali logarytmicznej z opornościami właściwymi materiałów, od srebra po teflon. Wniosek: różnice między przewodnikami a izolatorami są ogromne i nie da się ich zobaczyć w skali liniowej.<\/td><\/tr>\n<tr><td>§5a, adv „Wyrównanie potencjałów”<\/td><td>model interaktywny z suwakiem<\/td><td>dwie połączone kule; suwaki promieni i ładunku całkowitego; wartości ładunków i potencjałów<\/td><td>Większa kula bierze proporcjonalnie więcej ładunku, a potencjały są równe.<\/td><td>Dwie kule połączone przewodem z suwakami promieni i ładunku; wyświetlane są ładunki na kulach i potencjały. Wniosek: ładunki dzielą się proporcjonalnie do promieni, a potencjały się wyrównują.<\/td><\/tr>\n<tr><td>§12b, trudny przypadek 1<\/td><td>animacja „do przodu i od początku”<\/td><td>naładowany elektroskop i powoli zbliżany pręt o dużym ładunku jednoimiennym przeciwnym; zmiana rozkładu ładunków i kąta listków<\/td><td>Najpierw listki opadają, potem rozchylają się ponownie, choć całkowity ładunek się nie zmienia.<\/td><td>Pręt ujemny zbliżany do elektroskopu naładowanego dodatnio: listki opadają, a potem znowu się rozchylają, przy czym znaki ładunków na listkach się zmieniają. Wniosek: o znaku pręta wnioskujemy z początku zbliżania, nie z końca.<\/td><\/tr>\n<tr><td>§9 lub §12b<\/td><td>schemat z podpisami do klikania<\/td><td>przewodząca powłoka w polu zewnętrznym: ładunki indukowane na powierzchni, wnętrze bez pola<\/td><td>Wewnątrz przewodnika w równowadze pole jest zerowe.<\/td><td>Zamknięta metalowa powłoka w jednorodnym polu: linie pola kończą się na ładunkach indukowanych na powierzchni, a wnętrze jest bez linii. Wniosek: klatka Faradaya osłania wnętrze od pola elektrycznego.<\/td><\/tr>\n<tr><td>§15, historia odkryć<\/td><td>oś czasu<\/td><td>daty i postacie od Talesa do Millikana<\/td><td>Kolejne odkrycia budowały obraz ładunku jako wielkości o dwóch znakach i najmniejszej porcji.<\/td><td>Oś czasu z wydarzeniami: bursztyn Talesa, Gilbert, Gray, du Fay, Franklin, Coulomb, Faraday, Thomson, Millikan. Wniosek: elektrostatyka rozwijała się od jakościowych obserwacji do pomiarów ładunku.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>AUDYT W1 — zewnętrzny, weryfikacja 2026-10-14 (Claude Haiku 5.5)<\/h3>\n<p>Surowa odpowiedź i tabela weryfikacji: <code>chemia/plany/audyty/FIZ01_audyt_W1_2026-10-14.md<\/code>.<\/p>\n<p><strong>Wprowadzono:<\/strong> ładunek elementarny (zdanie o „najmniejszym swobodnym ładunku”); rozmieszczenie ładunku w przewodniku na powierzchni (dwa miejsca); zwrot i wartość natężenia pola; piorunochron (bez gwarancji); usunięto zdanie polemiczne „Zasady zachowania potencjału nie ma”; blok BHP ogólny; dodatkowe zadania z kluczem (trzy ładunki, przyciąganie, jednostki).<\/p>\n<p><strong>Nieprzyjęte:<\/strong> cytaty „Jon to atom…”, „Czas rozpływu…”, „Im większy ładunek…”, „Ziemia przejmuje…”, „Wewnątrz zamkniętego przewodnika…”, „Samochód chroni…”, „Wyładowanie trafia…” nie występują w tym pliku (audyt dotyczył innej wersji); definicja jonu już poprawna; dysocjacja kwasu już podaje H₃O⁺; <code>$$<\/code> i <code>:::<\/code> są poprawną składnią silnika; tabela oporu już podaje 20 °C.<\/p>\n<p><strong>Odłożone:<\/strong> zadanie „elektroskop z ciałem wzorcowym” i „listki opadają i rozchylają się” — w lekcji są przykłady (§10, §6), wymagają osobnej weryfikacji; sekcja „obserwacja ≠ wniosek” — do dopisania w następnej turze.<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">Luki, poszerzenie i własne przykłady (W1 FULL, 2026-10-14)<\/div>\n<p><strong>Obserwacja ≠ wniosek (brak w lekcji, dodano):<\/strong> listki elektroskopu się rozchyliły. Obserwacja to fakt: listki się odsunęły. Wniosek, który wymaga sprawdzenia: ciało jest naelektryzowane. Rozchylenie nie mówi jeszcze, jakim ładunkiem — do tego potrzebny jest ładunek wzorcowy (sekcja 6).<\/p>\n<p><strong>Typowe błędy uczniów (poza lekcją):<\/strong> utożsamienie „nadmiaru ładunku” z „nadmiarem protonów” (w elektryzowaniu przemieszczają się wyłącznie elektrony); przyjęcie, że przyciąganie = naelektryzowanie (patrz przykład W1-3); mnożenie ładunku przez odległość zamiast kwadratu odległości w prawie Coulomba.<\/p>\n<p><strong>Horyzont — mosty międzyprzedmiotowe:<\/strong>\n- biologia: impulsy nerwowe to ruch jonów przez błonę komórkową — to elektryczność w organizmie (bez tego nerw nie przewodziłby sygnału);\n- chemia: roztwory elektrolitów przewodzą prąd, bo zawierają jony (dysocjacja — lekcja o kwasach);\n- technika i bezpieczeństwo: uziemienie instalacji i opaska antystatyczna przy elektronice (ten sam mechanizm, który poznałeś w sekcji 5).<\/p>\n<p><strong>Dla ambitnych:<\/strong> prawo Coulomba w zadaniach — iloczyn ładunków w liczniku, kwadrat odległości w mianowniku; zawsze licz wartość bezwzględną, a zwrot siły określaj jakościowo (jednoimienne odpychają, różnoimienne przyciągają).<\/p>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Przykład W1-1 (E8) — zetknięcie dwóch identycznych kul<\/span>\n<p>Kula A ma ładunek +6 µC, kula B ma −2 µC. Kule zetknięto, a potem rozdzielono. Oblicz ładunek każdej kuli po rozdzieleniu.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>Całkowity ładunek układu: (+6 µC) + (−2 µC) = +4 µC (zasada zachowania ładunku). Kule identyczne, więc dzielą ładunek po równo: q′ = +4 µC / 2 = <strong>+2 µC<\/strong> każda (3 pkt: suma, zachowanie, podział).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Przykład W1-2 (ambitny) — ile elektronów w ciele<\/span>\n<p>Ciało ma nadmiarowy ładunek −3,2 nC. Ile nadmiarowych elektronów ma to ciało? (e = 1,6·10⁻¹⁹ C)<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>n = q / e = 3,2·10⁻⁹ C / 1,6·10⁻¹⁹ C = <strong>2,0·10¹⁰ elektronów<\/strong> (2 pkt: wzór n = q/e, wynik z jednostką). Zauważ: wynik jest całkowity, co potwierdza kwantowanie ładunku.<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Przykład W1-3 (pułapka) — przyciąganie a naelektryzowanie<\/span>\n<p>Naelektryzowana pałeczka przyciąga kawałek papieru. Czy można stąd wnioskować, że papier jest naelektryzowany? Uzasadnij.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>Nie. Obojętne ciało przyciąga się do naelektryzowanego przez indukcję lub polaryzację: bliższy koniec dostaje ładunek przeciwny, więc przyciąganie jest silniejsze niż odpychanie dalszego końca. Naelektryzowanie papieru wymagałoby sprawdzenia ładunkiem wzorcowym (2 pkt).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Przykład W1-4 (ambitny) — siła między dwiema kulami<\/span>\n<p>Dwie małe kule o ładunkach +4 µC i −4 µC znajdują się w odległości 0,20 m. Oblicz wartość siły oddziaływania i określ, czy kule się przyciągają, czy odpychają. (k = 8,99·10⁹ N·m²/C²)<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>F = k·|q₁q₂|/r² = 8,99·10⁹ · (4·10⁻⁶)² / (0,20)² = 8,99·10⁹ · 1,6·10⁻¹¹ / 0,04 ≈ <strong>3,6 N<\/strong>. Ładunki różnoimienne, więc kule się <strong>przyciągają<\/strong> (3 pkt: wzór, wynik, zwrot).<\/p>\n<\/details>\n<p><strong>Bez uwag:<\/strong> pozostałe rachunki (0,60 N w przykładzie Coulomba, 6,24·10¹⁸ elektronów w 1 C) sprawdzone — poprawne.<\/p>\n<h3>AUDYT W1 FULL — Claude Haiku 5.5, 2026-10-14<\/h3>\n<p><strong>Błędy poprawione:<\/strong> konwencja znaków przypisana Franklinowi (poprawiono: Franklin nazwał ładunki, przypisanie do protonu i elektronu jest późniejsze); E = k·Q/r² bez modułu (poprawiono na |E| = k·|Q|/r²); uziemienie jako „przejmuje ładunek” (doprecyzowano: Ziemia jako zbiornik ładunku, ciało ma potencjał Ziemi).<\/p>\n<p><strong>Luki:<\/strong> obserwacja ≠ wniosek (dodano), typowe błędy uczniów (opisane), wiedza wstępna — polaryzacja i prawo Coulomba z zadań, uzupełniono w 0b.<\/p>\n<p><strong>Poszerzenie:<\/strong> mosty do biologii (impulsy nerwowe), chemii (elektrolity, dysocjacja) i techniki (uziemienie); wykład 0b i 5a, 9 mini-wykładów „W skrócie” i 4 ciekawostki — zostawione.<\/p>\n<p><strong>Własne przykłady:<\/strong> 4 nowe (zetknięcie kul, elektrony w ciele, przyciąganie a naelektryzowanie, siła Coulomba) z kluczem.<\/p>\n<p><strong>Bez uwag:<\/strong> pozostałe fragmenty przeglądano sekcjami (0b, 1–5 ćwiczenia, 9–12 klucze, ZUZO) — brak dodatkowych błędów merytorycznych. Pełny przegląd linia po linii wykonano 2026-10-14 (§0–§15 i „Luki”). Poprawki: „ebonit z suknem” (ściąga), „potrze balon” → „pociera się balon” (zadanie 6), benzyna (εr ≈ 2: siła spada ok. 2×, sól się nie rozpuszcza), definicja ładunku elementarnego w słowniku. Sprawdzone bez zmian: rachunki w §5a, §8–§12c, klucze, test, fiszki, mosty, historia. Zapisy „$$ wzór” w jednej linii są poprawnym formatem md2html (nie wymagają zamknięcia).<\/p>\n<h3>AUDYT W2 — zewnętrzny, weryfikacja 2026-10-14 (Claude Haiku 5.5)<\/h3>\n<p>Surowa odpowiedź: <code>chemia/plany/audyty/FIZ01_audyt_W2_2026-10-14.md<\/code>.<\/p>\n<p><strong>Wprowadzono:<\/strong> zdanie o ładunku wielokrotności e bez „pół elektronu” (uczciwiej dla szkoły); „pokazuje ile, nie jaki” z porównaniem do ciała o znanym ładunku; przewodnik — ładunek na powierzchni w równowadze zamiast „po całym ciele”; karta „Gdzie gromadzi się ładunek?” (ostrza, zastrzeżenie o kształcie); karta „Jak czytać wzór Coulomba?” (moduły, znak iloczynu); trzy pozycje do kliniki (pole wewnątrz w równowadze, uziemienie a kierunek, ujemna wartość siły).<\/p>\n<p><strong>Już w lekcji (zarzut nieaktualny):<\/strong> „najmniejszy swobodny ładunek”, „Ziemia przejmuje ładunek” (jest „zbiornik ładunku”), równe dzielenie kul (klinika i zadanie 9), zmiana odległości ×3 (test i zadanie 5b).<\/p>\n<p><strong>Nieprzyjęte jako dubel:<\/strong> karta „Klatka Faradaya” z przykładami — treść i ograniczenie do pola magnetycznego są już w §11b i w słowniku; karta „Nie myl pojęć: indukcja/polaryzacja” — jest w §11b.<\/p>\n<\/section>\n\n<\/main>\n<\/body>\n<\/html>\n"</script>
