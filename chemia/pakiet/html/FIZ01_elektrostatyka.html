je zmętnienie — powstaje biały osad węglanu wapnia. To test na CO₂.'},\n f01Mg:{n:'Spalanie magnezu (pokaz)',rxKey:'mgO2',vessel:'crucible',level:.02,solid:{col:[196,200,206],col2:[250,250,248],eq:3,end:.15,t:'chips',shape:'chips'},ppt:'ppt-caco3',habit:'crystal',out:['osad'],heat:1.6,T:800,teacher:1,eq:'2 Mg + O₂ → 2 MgO',why:'Wstążka spala się oślepiająco jasnym, białym płomieniem; zostaje biały, kruchy proszek bez metalicznego połysku — tlenek magnezu.'},\n f01FeS:{n:'Fe + S (ogrzewanie, pokaz)',vessel:'testTube',solid:{col:[150,146,96],col2:[38,36,34],eq:4,end:.9,t:'powder',shape:'powder'},level:.02,out:['nic'],heat:1.4,T:600,teacher:1,eq:'Fe + S → FeS',why:'Szarożółta mieszanina rozżarza się (także po odsunięciu palnika) i zmienia się w czarną, kruchą masę. Magnes nie przyciąga produktu — powstał siarczek żelaza(II).'}\n};\nvar RDF1={\n f01SodaOcet:[R([[1,'NaHCO3'],[1,'CH3COOH']],[[1,'CH3COONa'],[1,'H2O'],[1,'CO2']]),{type:'wymiana (wodorowęglan + kwas)',conditions:'temperatura pokojowa',observation:'pienienie, wydzielanie bezbarwnego gazu (CO₂)',safety:['ocet drażni oczy']}],\n f01FeS:[R([[1,'Fe'],[1,'S']],[[1,'FeS']]),{type:'synteza',conditions:'ogrzewanie mieszaniny w probówce',observation:'mieszanina rozżarza się, powstaje czarna krucha substancja niemagnetyczna',safety:['pokaz nauczyciela pod wyciągiem; możliwy SO₂']}]};\nvar SBF1={NaHCO3:['wodorowęglan sodu (soda oczyszczona)','s',84.007,'wodorosól',[],['proszek do pieczenia','gaśnice']],\n CH3COONa:['octan sodu','aq',82.034,'sól',[],['przemysł spożywczy','ogrzewacze chemiczne']],\n FeS:['siarczek żelaza(II)','s',87.91,'sól (czarna)',[],['otrzymywanie H₂S w laboratorium']]};\nObject.keys(SBF1).forEach(function(f){if(D.SUBSTANCES[f]||byF[f])return;var a=SBF1[f];D.SUBSTANCES[f]={formula:f,name:a[0],state:a[1],molarMass:a[2],role:a[3],safety:a[4],uses:a[5],src:'rozszerzenia.js'}});\nObject.keys(RDF1).forEach(function(k){if(D.REACTIONS[k])return;D.REACTIONS[k]=RDF1[k][0];D.REACTION_DATA[k]=Object.assign({products:RDF1[k][0].products.map(function(x){return x.formula})},RDF1[k][1])});\nif(rx)Object.keys(RXF1).forEach(function(k){if(!rx.get(k))rx.register(k,RXF1[k])});\n\npracownia('f01-doswiadczenia-v01','Pracownia: co naprawdę się zmieniło?','Zjawisko fizyczne czy reakcja chemiczna? Topnienie, rozpuszczanie i odparowanie kontra reakcje z nową substancją — zlewka, obserwacja, wniosek i BHP.',\n [['Zjawiska fizyczne',['f01SolWoda','f01Odparowanie']],['Reakcje chemiczne',['f01SodaOcet','f01Mg','f01FeS']],['Dowód produktu',['f01WodaWapienna']]],\n {f01SolWoda:{war:'łyżeczka soli kuchennej w wodzie, mieszanie bagietką',wn:'Zjawisko fizyczne (rozpuszczanie). Dowód: po odparowaniu wody sól wraca.',bhp:'Nie smakujemy substancji w pracowni.'},\n  f01Odparowanie:{war:'część roztworu soli w parownicy, ogrzewanie palnikiem lub płytą',wn:'Odzyskanie substancji wyjściowej potwierdza, że rozpuszczanie nie było reakcją.',bhp:'Gorąca parownica — chwytać szczypcami; okulary (pryskanie przy końcu odparowania).'},\n  f01SodaOcet:{war:'łyżeczka sody oczyszczonej, dolewamy ocet',wn:'Reakcja chemiczna: powstaje nowa substancja (gaz CO₂). Nazwa gazu to wniosek — potwierdza go woda wapienna.',bhp:'Okulary; ocet nie do oczu.'},\n  f01Mg:{war:'wstążka magnezu w szczypcach, w płomieniu palnika (pokaz)',wn:'Reakcja chemiczna: biały, kruchy MgO ma inne właściwości niż metaliczny magnez.',bhp:'Nie patrzeć w płomień; płonącego magnezu nie gasić wodą.'},\n  f01FeS:{war:'mieszanina opiłek żelaza i siarki w probówce, ogrzewanie (pokaz)',wn:'Przed ogrzaniem — mieszanina (magnes wyciąga żelazo); po — związek FeS (magnes nie przyciąga). Rozstrzyga test właściwości.',bhp:'Pokaz pod wyciągiem; możliwy trujący SO₂; gorąca probówka może pęknąć.'},\n  f01WodaWapienna:{war:'gaz przepuszczony przez wodę wapienną',wn:'Zmętnienie wody wapiennej to dowód, że gazem był CO₂.',bhp:'Woda wapienna drażni oczy i skórę; okulary.'}},\n 'GFX.rx · rozszerzenia.js (F01)');\n\n/* ---------- 7. Zlewki GFX dla F03 (mieszaniny do rozdzielania) — pracownia łączy je z zlewkami F01 ---------- */\nvar RXF3={\n f03PiasekWoda:{n:'Piasek + woda (zawiesina)',solid:{col:[214,190,140],eq:4,end:1,t:'powder',shape:'powder'},turb:.25,out:['nic'],qualitative:1,eq:'piasek(s) + H₂O(c) — brak reakcji',why:'Piasek nie rozpuszcza się: po zamieszaniu woda mętnieje, po chwili ziarna opadają na dno (sedymentacja), a nad osadem zostaje prawie klarowna woda. Dwie fazy — mieszanina niejednorodna.'},\n f03KredaWoda:{n:'Kreda + woda (zawiesina)',solid:{col:[246,246,242],eq:4,end:1,t:'powder',shape:'powder'},turb:.7,out:['nic'],qualitative:1,eq:'CaCO₃(s) + H₂O(c) — brak reakcji',why:'Drobna kreda tworzy mleczną zawiesinę, która opada wolno. Sączek zatrzymuje cząstki kredy, a przesącz jest klarowny.'}\n};\nif(rx)Object.keys(RXF3).forEach(function(k){if(!rx.get(k))rx.register(k,RXF3[k])});\n\npracownia('f03-rozdzielanie-v01','Pracownia: rozdzielanie mieszanin','Najpierw nazwij różnicę właściwości, potem wybierz metodę: zawiesiny (sedymentacja, dekantacja, sączenie), roztwór (odparowanie, krystalizacja).',\n [['Zawiesiny — ciało stałe nierozpuszczalne',['f03PiasekWoda','f03KredaWoda']],['Roztwór — substancja rozpuszczona',['f01SolWoda','f01Odparowanie']]],\n {f03PiasekWoda:{war:'piasek w zlewce z wodą, zamieszanie bagietką, odstawienie',wn:'Różnica: piasek nie rozpuszcza się i ma większą gęstość niż woda → sedymentacja, potem dekantacja albo sączenie.',bhp:'Szkło — ostrożnie; okulary.'},\n  f03KredaWoda:{war:'sproszkowana kreda w wodzie, mieszanie',wn:'Drobne cząstki opadają wolno — szybciej rozdzieli je sączenie przez bibułę; przesącz jest klarowny.',bhp:'Okulary; sączek nie może być przedziurawiony bagietką.'},\n  f01SolWoda:{war:'sól kuchenna w wodzie, mieszanie',wn:'Sól rozpuszcza się — przechodzi przez sączek razem z wodą. Sączenie nie zadziała; trzeba wykorzystać lotność wody (odparowanie, krystalizacja lub destylacja).',bhp:'Nie smakujemy substancji w pracowni.'},\n  f01Odparowanie:{war:'roztwór soli w parownicy, ogrzewanie',wn:'Woda odparowuje, sól krystalizuje na dnie — odzyskujemy substancję rozpuszczoną (wodę tracimy; chcąc ją odzyskać — destylacja).',bhp:'Gorąca parownica — szczypce; okulary (pryskanie pod koniec).'}},\n 'GFX.rx · rozszerzenia.js (F03)');\n\n/* ---------- 8. F05 — konstruktor: izotop / jon / inny pierwiastek + masa atomowa jako średnia ważona ----------\n   Model wielokrotnego użytku (F04, F05, F06, A01…): `f05-izotopy-v01`. Dane izotopów z silnika (CHE.DATA.ISOTOPES). */\n/* dane z silnika (bez lokalnej kopii): CHE.DATA.ELEMENTS_54 (symbol, nazwa) + CHE.DATA.ISOTOPES (A, masa, udział) */\nfunction izo(z){var E=(D.ELEMENTS_54||[]).filter(function(e){return e.z===z})[0];if(!E)return null;\n var L=(D.ISOTOPES||{})[E.s]||[];return [E.s,String(E.n||E.s).toLowerCase(),L.map(function(x){return [x.A,x.atomicMass,(x.abundance||0)*100]}).sort(function(a,b){return b[2]-a[2]||a[0]-b[0]})]}\nfunction supN(n){return String(n).replace(/[0-9]/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]})}\nfunction subN(n){return String(n).replace(/[0-9]/g,function(d){return '₀₁₂₃₄₅₆₇₈₉'[d]})}\nfunction chg(q){return q===0?'':(Math.abs(q)>1?supN(Math.abs(q)):'')+(q>0?'⁺':'⁻')}\nfunction pl(x,d){return x.toFixed(d).replace('.',',')}\n/* atomSVG — komponent wielokrotnego użytku (F05, F07, A01…): model atomu jako SVG, kolory jak w atlasie (_anon_004 bohr: elektrony wewnętrzne #2f8a55, walencyjne #b85f00).\n   o = {p, n, e, powloki:false|true, W:260}. powloki:false → elektrony na jednym okręgu (F05; powłoki to pojęcie F07);\n   powloki:true → powłoki K, L, M, N wg modelu szkolnego 2, 8, 8, … (do Z = 20; dalej uproszczenie — do weryfikacji). Zwraca otwarty <svg…> (zamknąć '<\/svg>'). */\nfunction atomSVG(o){var W=o.W||260,C=W/2,p=o.p|0,n=o.n|0,e=o.e|0,svg='<svg viewBox=\"0 0 '+W+' '+W+'\" width=\"100%\" style=\"max-width:'+W+'px;display:block;margin:auto\" role=\"img\" aria-label=\"Model atomu: '+p+' p, '+n+' n, '+e+' e\">';\n var N=p+n,sk=W/260;\n for(var i=0;i<N;i++){var a=i*2.39996,r=4.2*sk*Math. nextElementSibling,ok=0,n=0;\n w.querySelectorAll('.quiz-q').forEach(function(d){var good=+d.dataset.ok;d.querySelectorAll('.quiz-opt').forEach(function(b){b.onclick=function(){if(d.dataset.done)return;d.dataset.done=1;n++;if(+b.dataset.a===good)ok++;\n  d.querySelectorAll('.quiz-opt').forEach(function(x){x.disabled=true;if(+x.dataset.a===good)x.classList.add('correct');else if(x===b)x.classList.add('wrong')});\n  if(d.dataset.fb){var f=document.createElement('div');f.className='quiz-fb';f.innerHTML=d.dataset.fb;d.appendChild(f)}\n  if(sc&&sc.classList.contains('quiz-score'))sc.textContent='Wynik: '+ok+' / '+n}})})});\nvar b=root.querySelector('#advToggle');if(b&&!b.dataset.cheAdv){b.dataset.cheAdv=1;var all=function(){return root.querySelectorAll('details.adv')},k=all().length;\n b.textContent='Pokaż treści akademickie ('+k+')';\n b.onclick=function(){var on=b.getAttribute('aria-pressed')!=='true';all().forEach(function(d){d.open=on});b.setAttribute('aria-pressed',on?'true':'false');b.textContent=(on?'Ukryj':'Pokaż')+' treści akademickie ('+k+')'}}\n})();\n\n<\/script>\n<a class=\"skip-link\" href=\"#main\">Przejdź do treści<\/a>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">FIZ-01 · FIZYKA · MASTER LAB v1.4<\/div><h1>Elektrostatyka<\/h1><p class=\"lead\">Ładunek i jego budowa atomowa, elektryzowanie (tarcie, dotyk, indukcja), oddziaływanie ładunków, przewodniki i izolatory, elektroskop, uziemienie i zastosowania; dla chętnych i LO: prawo Coulomba, pole elektryczne. Animacje i liczby z silnika CHE.FIZ.ELEKTRO.<\/p><div class=\"tag-row\"><span class=\"level-badge level-basic\">E8<\/span><span class=\"level-badge level-understand\">ROZUMIENIE<\/span><span class=\"level-badge level-extra\">E8+ / LO<\/span><\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><\/section>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#s0a\">Diagnoza startowa — sprawdź się, zanim zaczniesz<\/a><a class=\"toc-link\" href=\"#s0\">0. Wzory, definicje i mnemotechniki — ściąga<\/a><a class=\"toc-link\" href=\"#s0b\">Wykład — elektrostatyka od zera<\/a><a class=\"toc-link\" href=\"#s1\">1. Ładunek elektryczny — skąd się bierze<\/a><a class=\"toc-link\" href=\"#s2\">2. Elektryzowanie przez tarcie<\/a><a class=\"toc-link\" href=\"#s3\">3. Oddziaływanie ładunków<\/a><a class=\"toc-link\" href=\"#s4\">4. Przewodniki i izolatory<\/a><a class=\"toc-link\" href=\"#s5\">5. Elektryzowanie przez dotyk. Zasada zachowania ładunku<\/a><a class=\"toc-link\" href=\"#s5a\">Wykład: zasada zachowania ładunku, obliczenia w kulombach i uziemienie<\/a><a class=\"toc-link\" href=\"#s6\">6. Elektroskop<\/a><a class=\"toc-link\" href=\"#s7\">7. Indukcja elektrostatyczna (elektryzowanie przez wpływ)<\/a><a class=\"toc-link\" href=\"#s8\">8. Prawo Coulomba<\/a><a class=\"toc-link\" href=\"#s9\">9. Pole elektryczne<\/a><a class=\"toc-link\" href=\"#s10\">10. Doświadczenia<\/a><a class=\"toc-link\" href=\"#s11\">11. Klinika błędów<\/a><a class=\"toc-link\" href=\"#s11a\">Przykłady prowadzone krok po kroku<\/a><a class=\"toc-link\" href=\"#s11b\">Pary do odróżniania<\/a><a class=\"toc-link\" href=\"#s12\">12. Ćwiczenia<\/a><a class=\"toc-link\" href=\"#s12a\">Zadania egzaminacyjne E8 — typy i wzorcowe odpowiedzi<\/a><a class=\"toc-link\" href=\"#s12b\">Dla olimpijczyka — wykład pogłębiony i trudne przypadki<\/a><a class=\"toc-link\" href=\"#s12c\">Zadania konkursowe<\/a><a class=\"toc-link\" href=\"#s14a\">Mapa myśli, checklista i kolejność powtórek<\/a><a class=\"toc-link\" href=\"#s13\">13. Fiszki<\/a><a class=\"toc-link\" href=\"#s14\">14. Test<\/a><a class=\"toc-link\" href=\"#s15\">15. Słownik i mosty<\/a><\/nav><\/details>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć na E8 — 10 faktów<\/h3>\n<ol>\n<li>Atom ma <strong>protony (+)<\/strong> w jądrze i <strong>elektrony (−)<\/strong> wokół jądra. Ciało <strong>obojętne<\/strong> ma ich tyle samo.<\/li>\n<li>Ciało <strong>naelektryzowane ujemnie<\/strong> ma <strong>nadmiar elektronów<\/strong>, dodatnio — <strong>niedobór elektronów<\/strong>. Przemieszczają się tylko elektrony.<\/li>\n<li>Ładunek jest wielokrotnością <strong>ładunku elementarnego<\/strong> e ≈ <span data-fiz=\"e\">1,6·10⁻¹⁹ C<\/span>; jednostka ładunku — <strong>kulomb (1 C)<\/strong>.<\/li>\n<li>Elektryzowanie: przez <strong>tarcie<\/strong>, przez <strong>dotyk<\/strong>, przez <strong>indukcję (wpływ)<\/strong>.<\/li>\n<li><strong>Zasada zachowania ładunku<\/strong>: w układzie izolowanym suma ładunków się nie zmienia — ładunek tylko się przemieszcza.<\/li>\n<li>Ładunki <strong>jednoimienne się odpychają<\/strong>, <strong>różnoimienne przyciągają<\/strong>; ciało naelektryzowane przyciąga też lekkie ciała obojętne.<\/li>\n<li>Siła oddziaływania rośnie z ładunkami, maleje z odległością (2× dalej → 4× słabiej).<\/li>\n<li><strong>Przewodniki<\/strong> (metale, grafit, roztwory jonów, ciało człowieka) mają swobodne nośniki ładunku; <strong>izolatory<\/strong> (szkło, guma, plastik, suche powietrze) — nie.<\/li>\n<li><strong>Elektroskop<\/strong>: listki naładowane jednoimiennie odpychają się — im większy ładunek, tym większe wychylenie. Nie pokazuje znaku ładunku.<\/li>\n<li><strong>Uziemienie<\/strong> odprowadza ładunek do ziemi; zastosowania: piorunochron, uziemienie cystern i stacji paliw, opaska antystatyczna.<\/li>\n<\/ol>\n<\/section>\n<section id=\"s0a\">\n<div class=\"part-heading\"><span class=\"part-num\">0a<\/span> Diagnoza startowa — sprawdź się, zanim zaczniesz<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">5 pytań (odpowiedzi ukryte)<\/span>\n<ol>\n<li>Z jakich cząstek zbudowany jest atom i jaki mają ładunek?<\/li>\n<li>Co się dzieje z włosami po zdjęciu wełnianej czapki zimą — i dlaczego?<\/li>\n<li>Czy metalowa łyżka przewodzi prąd? A plastikowa?<\/li>\n<li>Dlaczego pracownik stacji paliw nie powinien chodzić w syntetycznym polarze?<\/li>\n<li>Magnes przyciąga żelazo. Czy to oddziaływanie elektrostatyczne?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Pokaż odpowiedzi<\/summary>\n<ol>\n<li>Protony (+) i neutrony (0) w jądrze, elektrony (−) wokół jądra.<\/li>\n<li>Włosy elektryzują się przez tarcie jednoimiennie i odpychają — „stają dęba”.<\/li>\n<li>Metalowa — tak (elektrony swobodne); plastikowa — nie (izolator).<\/li>\n<li>Tarcie elektryzuje ubranie; iskra wyładowania może zapalić opary paliwa.<\/li>\n<li>Nie — to magnetyzm (inna lekcja fizyki); żelazo nie musi być naelektryzowane.<\/li>\n<\/ol>\n<\/details>\n<p class=\"mini-note\">Jeśli pomyliłeś 1 lub 3 — zacznij od rozdziałów 1 i 4. Pytanie 5 to częsta pułapka: magnetyzm ≠ elektrostatyka.<\/p>\n<\/div>\n<\/section>\n<section id=\"s0\">\n<div class=\"part-heading\"><span class=\"part-num\">0<\/span> Wzory, definicje i mnemotechniki — ściąga <span class=\"level-badge level-basic\">E8<\/span> <span class=\"level-badge level-extra\">LO<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Wzory (z jednostkami)<\/span>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Wielkość<\/th><th>Wzór<\/th><th>Jednostka<\/th><th>Kiedy używać<\/th><\/tr><\/thead><tbody><tr><td>ładunek ciała<\/td><td>q = n · e<\/td><td>C (kulomb)<\/td><td>n — liczba nadmiarowych (−) lub brakujących (+) elektronów<\/td><\/tr><tr><td>liczba elektronów<\/td><td>n = q / e<\/td><td>—<\/td><td>ile elektronów przeszło<\/td><\/tr><tr><td>dotyk 2 identycznych kul<\/td><td>q′ = (q₁ + q₂) / 2<\/td><td>C<\/td><td>zasada zachowania ładunku<\/td><\/tr><tr><td>prawo Coulomba (E8+)<\/td><td>F = k · |q₁ · q₂| / r²<\/td><td>N<\/td><td>siła między ładunkami punktowymi<\/td><\/tr><tr><td>w ośrodku (LO)<\/td><td>F = k · |q₁q₂| / (εr · r²)<\/td><td>N<\/td><td>woda: εr ≈ 80<\/td><\/tr><tr><td>natężenie pola (LO)<\/td><td>E = F / q ;  E = k · Q / r²<\/td><td>N/C = V/m<\/td><td>pole ładunku punktowego<\/td><\/tr><tr><td>napięcie (LO)<\/td><td>U = W / q<\/td><td>V = J/C<\/td><td>praca przy przenoszeniu ładunku<\/td><\/tr><tr><td>pojemność (LO)<\/td><td>C = Q / U<\/td><td>F (farad)<\/td><td>kondensator<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">Stałe z silnika: e = <span data-fiz=\"e\">1,602·10⁻¹⁹ C<\/span> · k = <span data-fiz=\"k\">8,99·10⁹ N·m²/C²<\/span> · 1 C ≈ 6,24·10¹⁸ e · przedrostki: 1 mC = 10⁻³ C, 1 µC = 10⁻⁶ C, 1 nC = 10⁻⁹ C.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Definicje jednym zdaniem<\/span>\n<dl><div class=\"def-item\"><dt>Ładunek elektryczny<\/dt><dd>właściwość cząstek (protonów +, elektronów −) odpowiedzialna za oddziaływania elektryczne; jednostka 1 C.<\/dd><\/div><div class=\"def-item\"><dt>Elektryzowanie<\/dt><dd>nadawanie ciału ładunku przez przemieszczenie elektronów (tarcie, dotyk, indukcja).<\/dd><\/div><div class=\"def-item\"><dt>Przewodnik<\/dt><dd>ciało, w którym ładunki mogą się swobodnie przemieszczać (elektrony swobodne lub jony).<\/dd><\/div><div class=\"def-item\"><dt>Izolator<\/dt><dd>ciało, w którym ładunki praktycznie nie mogą się przemieszczać.<\/dd><\/div><div class=\"def-item\"><dt>Zasada zachowania ładunku<\/dt><dd>w układzie izolowanym całkowity ładunek nie zmienia się.<\/dd><\/div><div class=\"def-item\"><dt>Indukcja elektrostatyczna<\/dt><dd>rozdzielenie ładunków w przewodniku pod wpływem zbliżonego (niedotykającego) ciała naelektryzowanego.<\/dd><\/div><div class=\"def-item\"><dt>Uziemienie<\/dt><dd>połączenie ciała z ziemią przewodnikiem — umożliwia odpływ lub dopływ elektronów.<\/dd><\/div><div class=\"def-item\"><dt>Pole elektryczne<\/dt><dd>przestrzeń wokół ładunku, w której na inne ładunki działa siła elektryczna.<\/dd><\/div><\/dl>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mnemotechniki<\/span>\n<ul>\n<li><b>„Plus to brak”<\/b> — ciało dodatnie <b>nie dostało protonów<\/b>, tylko <b>straciło elektrony<\/b>. Przemieszczają się tylko elektrony.<\/li>\n<li><b>„Jednakowi się nie lubią”<\/b> — ładunki jednoimienne się odpychają, różnoimienne przyciągają.<\/li>\n<li><b>„Szkło w jedwabiu — plus, ebonit z suknem — minus”<\/b>: szkło + jedwab → szkło (+); ebonit + sukno → ebonit (−).<\/li>\n<li><b>„Dwa razy dalej — cztery razy słabiej”<\/b> (siła ∝ 1/r²): 3× dalej → 9× słabiej.<\/li>\n<li><b>„Listki mówią ILE, nie JAKI”<\/b> — elektroskop pokazuje wielkość ładunku, nie znak.<\/li>\n<li><b>Indukcja — 4 kroki „ZUZO”<\/b>: <b>Z<\/b>bliż pręt → <b>U<\/b>ziem → <b>Z<\/b>abierz palec → <b>O<\/b>ddal pręt ⇒ ładunek przeciwny do pręta.<\/li>\n<li><b>„Ostrze zbiera”<\/b> — na ostrzach przewodnika gromadzi się najwięcej ładunku (piorunochron).<\/li>\n<li><b>„Kto stoi wcześniej, ten oddaje”<\/b> — w szeregu tryboelektrycznym materiał bliżej „+” oddaje elektrony i sam zostaje dodatni.<\/li>\n<li><b>„Dotyk dzieli, indukcja rozsuwa”<\/b> — przy dotyku ładunek przechodzi na drugie ciało (ten sam znak); przy indukcji tylko się rozsuwa, a trwały ładunek przeciwny daje dopiero uziemienie.<\/li>\n<li><b>„Przed = po”<\/b> — przy każdym zadaniu z kulami sprawdź na końcu: suma ładunków przed zetknięciem równa się sumie po zetknięciu.<\/li>\n<li><b>„Mikro to milionowa, nano to miliardowa”<\/b> — 1 µC = 10⁻⁶ C, 1 nC = 10⁻⁹ C; zamień na kulomby, zanim policzysz elektrony.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"s0b\">\n<div class=\"part-heading\"><span class=\"part-num\">0b<\/span> Wykład — elektrostatyka od zera <span class=\"level-badge level-basic\">E8<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Część 1 — czym jest ładunek elektryczny<\/span>\n<p>Wszystko wokół ciebie — powietrze, szkło, plastik, twoje ciało — składa się z atomów. W środku atomu jest maleńkie <strong>jądro<\/strong> z <strong>protonami<\/strong> i <strong>neutronami<\/strong>, a dookoła jądra poruszają się <strong>elektrony<\/strong>. Proton i elektron mają cechę, której nie ma neutron: <strong>ładunek elektryczny<\/strong>. Ładunek to właściwość cząstki, przez którą cząstka oddziałuje z innymi naładowanymi cząstkami — odpycha je albo przyciąga, nawet jeśli się nie dotykają.<\/p>\n<p>Są dwa rodzaje ładunku. Benjamin Franklin w XVIII wieku nazwał jeden rodzaj ładunku dodatnim, a drugi ujemnym (chodziło o naelektryzowane szkło i żywicę). Dopiero później, gdy odkryto cząstki, przypisano tę konwencję: proton ma ładunek <strong>dodatni (+)<\/strong>, a elektron <strong>ujemny (−)<\/strong>. Wartości są równe: proton ma +e, elektron −e, gdzie e ≈ 1,6·10⁻¹⁹ C to <strong>ładunek elementarny<\/strong>. Neutron ma ładunek 0. Zwykły atom ma tyle samo protonów co elektronów, więc ładunki się znoszą i atom jest <strong>obojętny<\/strong>.<\/p>\n<p>Ciało obojętne <strong>nie jest ciałem bez ładunków<\/strong> — ma ich ogromnie dużo, ale dodatnie i ujemne dokładnie się równoważą, jak wpłaty i wypłaty, które dają saldo zero. „Naelektryzować ciało” znaczy zaburzyć tę równowagę, czyli zmienić saldo.<\/p>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Część 2 — co się przemieszcza i skąd bierze się „plus”<\/span>\n<p>Protony siedzą głęboko w jądrach i trzymają je siły jądrowe — zwykłe doświadczenia ich nie ruszą. Elektrony na zewnątrz atomu trzymają się słabiej i mogą przejść z jednego ciała na drugie. Dlatego <strong>przy elektryzowaniu przemieszczają się wyłącznie elektrony<\/strong>.<\/p>\n<ul>\n<li>Ciało, które <strong>przyjęło<\/strong> elektrony, ma ich więcej niż protonów → ładunek <strong>ujemny<\/strong>.<\/li>\n<li>Ciało, które <strong>oddało<\/strong> elektrony, ma więcej protonów niż elektronów → ładunek <strong>dodatni<\/strong>, choć nie dostało żadnego protonu.<\/li>\n<\/ul>\n<p>Wielkość ładunku wynika z liczby nadmiarowych albo brakujących elektronów: q = n · e. W szkolnym opisie ciało zyskuje lub traci całkowitą liczbę elektronów, dlatego jego ładunek jest całkowitą wielokrotnością e. Jednostką jest <strong>kulomb (1 C)<\/strong> — to ładunek ok. 6,24·10¹⁸ elektronów, więc w doświadczeniach szkolnych mamy do czynienia z nanokulombami (10⁻⁹ C) i mikrokulombami (10⁻⁶ C).<\/p>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Część 3 — trzy sposoby elektryzowania i jedna ważna zasada<\/span>\n<p><strong>Tarcie.<\/strong> Gdy pocierasz o siebie dwa różne materiały, część elektronów przechodzi z materiału, który trzyma je słabiej, na ten, który trzyma je mocniej. Powstają dwa ładunki o <strong>przeciwnych znakach i równych wartościach<\/strong>: jedno ciało ma „plus”, drugie „minus”. Który materiał oddaje elektrony, mówi <strong>szereg tryboelektryczny<\/strong> (sekcja 2).<\/p>\n<p><strong>Dotyk.<\/strong> Gdy naelektryzowany przewodnik dotknie obojętnego przewodnika, elektrony przechodzą z jednego na drugi i oba mają potem ładunek <strong>tego samego znaku<\/strong>. Dwie identyczne kule dzielą ładunek po równo.<\/p>\n<p><strong>Indukcja (wpływ).<\/strong> Naelektryzowane ciało można tylko <strong>zbliżyć<\/strong>, nie dotykając. W przewodniku swobodne elektrony przesuwają się: ładunek na bliższym końcu jest przeciwny do ładunku zbliżonego ciała, na dalszym — taki sam. Po oddaleniu ciała wszystko wraca. Trwałe naelektryzowanie otrzymujemy dopiero, gdy na chwilę połączymy przewodnik z ziemią (uziemienie) — metoda „ZUZO” z sekcji 7.<\/p>\n<p>We wszystkich trzech sposobach działa <strong>zasada zachowania ładunku<\/strong>: w układzie izolowanym suma ładunków (ze znakami!) nie zmienia się. Ładunek nie powstaje z niczego i nie znika — tylko przechodzi z ciała na ciało. Dlatego zadania o ładunkach rozwiązujesz zawsze tak samo: zapisz ładunki ze znakami, dodaj, sprawdź, czy suma po jest równa sumie przed.<\/p>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Część 4 — jak ładunki na siebie działają<\/span>\n<p>Ładunki <strong>jednoimienne<\/strong> się odpychają, <strong>różnoimienne<\/strong> przyciągają, i dzieje się to na odległość. Siła jest tym większa, im większe są ładunki, a maleje z <strong>kwadratem odległości<\/strong>: dwa razy dalej — cztery razy słabiej. Siły są wzajemne i równe co do wartości (III zasada dynamiki).<\/p>\n<p>Naelektryzowane ciało przyciąga też ciała <strong>obojętne<\/strong> (skrawki papieru, strumień wody). Jego ładunek przesuwa ładunki w obojętnym ciele — w przewodniku swobodne elektrony (indukcja), w izolatorze ładunki wewnątrz cząsteczek (polaryzacja). Bliższy koniec dostaje ładunek przeciwny, więc przyciąganie (bliżej, więc silniej) wygrywa z odpychaniem (dalej, więc słabiej).<\/p>\n<p>To, jak łatwo ładunek się przemieszcza, zależy od materiału. W <strong>przewodniku<\/strong> (metale, grafit, roztwory soli, ciało człowieka) są swobodne nośniki ładunku i w stanie równowagi nadmiarowy ładunek rozmieszcza się na powierzchni przewodnika. W <strong>izolatorze<\/strong> (szkło, guma, plastik, suche powietrze) nośników swobodnych nie ma i ładunek zostaje tam, gdzie powstał — dlatego izolatory elektryzuje się łatwo przez tarcie.<\/p>\n<p><strong>Elektroskop<\/strong> to przyrząd, w którym dwa metalowe listki dostają ładunek tego samego znaku i odpychają się — im większy ładunek, tym większe rozchylenie. Pokazuje <em>ile<\/em>, ale nie <em>jaki<\/em> znak; znak ustala się przez porównanie z ciałem o znanym ładunku. <strong>Uziemienie<\/strong> to połączenie z ziemią: Ziemia jest tak wielkim zbiornikiem ładunku, że może oddać ciału elektrony albo je przyjąć, a ciało po uziemieniu zostaje praktycznie rozładowane (ma potencjał Ziemi).<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Część 5 — dla chętnych: pole elektryczne<\/span>\n<p>Skoro ładunki działają na siebie na odległość, fizycy mówią, że każdy ładunek wytwarza wokół siebie <strong>pole elektryczne<\/strong>: w każdym punkcie przestrzeni można ustalić, jaka siła działałaby na jednostkowy dodatni ładunek próbny. Ta siła na jednostkę ładunku to <strong>natężenie pola<\/strong> E = F/q (jednostka N/C). Dla ładunku punktowego |E| = k·|Q|/r². Prawo Coulomba i natężenie pola opisują to samo zjawisko: pierwsze mówi, co dzieje się między dwoma ładunkami, drugie — co każdy z nich robi z przestrzenią wokół siebie.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Jak pracować z lekcją<\/span>\n<ol>\n<li>Zrób diagnozę startową (sekcja 0a) i przeczytaj ten wykład.<\/li>\n<li>Przejdź sekcje 1–7 po kolei — każda ma krótkie „W skrócie”.<\/li>\n<li>Po każdej sekcji rozwiąż odpowiednie ćwiczenia (sekcja 12) i zajrzyj do kliniki błędów (sekcja 11).<\/li>\n<li>Sekcje 8–9 są dla E8+ i LO. Warstwa konkursowa to sekcje 11b, 12b i 12c.<\/li>\n<\/ol>\n<\/div>\n<\/section>\n<section id=\"s1\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Ładunek elektryczny — skąd się bierze<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Budowa atomu a ładunek<\/span>\n<p>Każdy atom zawiera dodatnie <strong>protony<\/strong> (w jądrze) i ujemne <strong>elektrony<\/strong> (w chmurze elektronowej). Ich ładunki są równe co do wartości i przeciwne co do znaku. Atom ma tyle samo protonów i elektronów — jest <strong>obojętny<\/strong>.<\/p>\n<p>Protony są w jądrze uwięzione, elektrony zewnętrzne łatwo się odrywają. Dlatego <strong>przy elektryzowaniu przemieszczają się wyłącznie elektrony<\/strong>.<\/p>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Ciało<\/th><th>Elektrony vs protony<\/th><th>Ładunek<\/th><\/tr><\/thead><tbody><tr><td>obojętne<\/td><td>tyle samo<\/td><td>0<\/td><\/tr><tr><td>naelektryzowane ujemnie<\/td><td>nadmiar elektronów<\/td><td>−<\/td><\/tr><tr><td>naelektryzowane dodatnio<\/td><td>niedobór elektronów<\/td><td>+<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Ładunek elementarny i kulomb<\/span>\n<p><strong>Ładunek elementarny<\/strong> jest podstawową jednostką kwantowania ładunku: ładunki swobodnych cząstek są całkowitymi wielokrotnościami e, a nie „najmniejszym swobodnym ładunkiem” w każdym kontekście: e = <span data-fiz=\"e\">1,602·10⁻¹⁹ C<\/span>. Elektron ma ładunek −e, proton +e. Każdy ładunek ciała jest jego wielokrotnością:<\/p>\n<div class=\"formula-lg\">q = n · e<\/div>\n<p>1 kulomb to ładunek ok. <strong>6,24·10¹⁸<\/strong> elektronów. To dużo — przy pocieraniu balonu przenosimy zwykle nanokulomby (10⁻⁹ C), czyli miliardy elektronów.<\/p>\n<p class=\"mini-note\">Masa elektronu: m<sub>e<\/sub> = <span data-fiz=\"me\">9,11·10⁻³¹ kg<\/span> — ok. 1836 razy mniej niż protonu.<\/p>\n<\/div>\n<div class=\"card card-new\">\n<span class=\"card-label\">Most do chemii<\/span>\n<p><strong>Jon<\/strong> to atom (lub grupa atomów), który oddał lub przyjął elektrony: Na → Na⁺ + e⁻, Cl + e⁻ → Cl⁻. Ten sam mechanizm co przy elektryzowaniu — tylko na poziomie pojedynczych atomów. Atomy pierwiastków o dużej <strong>elektroujemności<\/strong> (Cl, O, F) chętnie przyjmują elektrony.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"kw-dysocjacja-v01\"><button type=\"button\" data-che-open-viz=\"kw-dysocjacja-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'kw-dysocjacja-v01',lessonId:'FIZ-01'},'*')\"><b>Chemia: jony w roztworze — przeniesienie protonu H⁺<\/b><span>Lekcja Kwasy · ten sam silnik<\/span><\/button><\/div>\n<!-- OPIS: Schemat cząsteczki kwasu w wodzie: po kliknięciu widać, jak jon H⁺ (proton) przeskakuje z cząsteczki kwasu na cząsteczkę wody, tworząc jon H₃O⁺ i jon reszty kwasowej. Wniosek: kwas oddaje proton, a woda go przyjmuje; to ten sam ruch ładunku dodatniego, który w elektrostatyce nie jest przenoszeniem elektronów. -->\n<\/section>\n<section id=\"s2\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Elektryzowanie przez tarcie<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Na czym polega<\/span>\n<p>Przy pocieraniu dwóch ciał z różnych materiałów elektrony przechodzą z jednego na drugie. Ciało, które <strong>oddało<\/strong> elektrony, ładuje się <strong>dodatnio<\/strong>, ciało, które je <strong>przyjęło<\/strong> — <strong>ujemnie<\/strong>. Oba ładunki są równe co do wartości (zasada zachowania ładunku).<\/p>\n<ul>\n<li data-fiz-tribo=\"szklo&gt;jedwab\">szkło pocierane <strong>jedwabiem<\/strong> → szkło <strong>+<\/strong>, jedwab −<\/li>\n<li data-fiz-tribo=\"welna&gt;ebonit\">ebonit (twarda guma) pocierany <strong>suknem<\/strong> → ebonit <strong>−<\/strong>, sukno +<\/li>\n<li data-fiz-tribo=\"wlosy&gt;balon\">balon pocierany o <strong>włosy<\/strong> → balon <strong>−<\/strong>, włosy + (dlatego się „stawiają” — odpychają się jednoimiennie)<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Szereg tryboelektryczny (z silnika CHE.FIZ.ELEKTRO)<\/span>\n<p>Materiał stojący <strong>wcześniej<\/strong> oddaje elektrony materiałowi stojącemu <strong>dalej<\/strong>:<\/p>\n<p style=\"line-height:1.9\">(+) <span>skóra (sucha)<\/span> &gt; <span>futro / sierść<\/span> &gt; <span>szkło<\/span> &gt; <span>włosy<\/span> &gt; <span>nylon<\/span> &gt; <span>wełna (sukno)<\/span> &gt; <span>jedwab<\/span> &gt; <span style=\"color:#b45309;font-weight:700\">aluminium<\/span> &gt; <span>papier<\/span> &gt; <span>bawełna<\/span> &gt; <span style=\"color:#b45309;font-weight:700\">stal<\/span> &gt; <span>drewno (suche)<\/span> &gt; <span>bursztyn<\/span> &gt; <span>ebonit / twarda guma<\/span> &gt; <span style=\"color:#b45309;font-weight:700\">miedź<\/span> &gt; <span>poliester<\/span> &gt; <span>styropian<\/span> &gt; <span>folia PE (reklamówka)<\/span> &gt; <span>balon (lateks)<\/span> &gt; <span>PVC (rurka)<\/span> &gt; <span>teflon (PTFE)<\/span> (−)<\/p>\n<p class=\"mini-note\">Kolejność orientacyjna — zależy od wilgotności i czystości powierzchni. Metale (pomarańczowe) trzymane w ręce od razu się rozładowują — trzeba je trzymać za izolującą rączkę.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektryzowanie-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektryzowanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektryzowanie-v01',lessonId:'FIZ-01'},'*')\"><b>Pocieraj i sprawdź: kto oddaje elektrony + wahadełko elektrostatyczne<\/b><span>Szereg tryboelektryczny z silnika · animacja przepływu elektronów<\/span><\/button><\/div>\n<!-- OPIS: Dwa ciała pocierane o siebie: strzałki pokazują, które ciało oddaje elektrony, a które je przyjmuje, oraz przy wahadełku widać, jak naładowany przedmiot przyciąga lekką kulkę. Wniosek: tarcie przenosi elektrony, a ciało, które je traci, staje się dodatnie. -->\n<\/section>\n<section id=\"s3\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Oddziaływanie ładunków<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Reguła<\/span>\n<p>Ładunki <strong>jednoimienne<\/strong> (+ i +, − i −) się <strong>odpychają<\/strong>, <strong>różnoimienne<\/strong> się <strong>przyciągają<\/strong>. Siły działają na odległość, bez dotykania, i są wzajemne (III zasada dynamiki — obie siły mają tę samą wartość).<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dlaczego naelektryzowany grzebień przyciąga obojętne skrawki papieru?<\/span>\n<p>Ładunek grzebienia przesuwa ładunki w skrawku (w izolatorze — w obrębie cząsteczek: <strong>polaryzacja<\/strong>; w przewodniku — elektrony swobodne: <strong>indukcja<\/strong>). Bliżej grzebienia gromadzi się ładunek przeciwnego znaku, dalej — tego samego. Przyciąganie bliższego ładunku jest silniejsze niż odpychanie dalszego, więc wypadkowo skrawek jest <strong>przyciągany<\/strong>.<\/p>\n<p><strong>Wniosek do zadań:<\/strong> przyciąganie <em>nie dowodzi<\/em>, że oba ciała są naelektryzowane. <strong>Odpychanie<\/strong> — tak (oba mają ładunek tego samego znaku).<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Od czego zależy siła (jakościowo — E8)<\/span>\n<ul>\n<li>im <strong>większe ładunki<\/strong>, tym większa siła;<\/li>\n<li>im <strong>większa odległość<\/strong>, tym siła mniejsza — 2× dalej → 4× słabiej, 3× dalej → 9× słabiej;<\/li>\n<li>w wodzie i innych ośrodkach siła jest słabsza niż w powietrzu.<\/li>\n<\/ul>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektryzowanie-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektryzowanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektryzowanie-v01',lessonId:'FIZ-01'},'*')\"><b>Wahadełko: przyciąganie obojętnej kulki, dotyk, odpychanie<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Wahadełko elektrostatyczne: naładowany pręt przyciąga obojętną kulkę, po dotknięciu kulka odchyla się od pręta (odpycha się). Wniosek: po zetknięciu kulka ma ładunek tego samego znaku co pręt, a odpychanie dowodzi jednakowego znaku ładunków. -->\n<\/section>\n<section id=\"s4\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Przewodniki i izolatory<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Różnica<\/span>\n<p><strong>Przewodnik<\/strong> zawiera swobodne nośniki ładunku: w metalach i graficie — <strong>elektrony swobodne<\/strong>, w roztworach i w ciele człowieka — <strong>jony<\/strong>. W stanie równowagi nadmiarowy ładunek przewodnika znajduje się na jego powierzchni; największa gęstość jest przy ostrzach.<\/p>\n<p><strong>Izolator<\/strong> (dielektryk) nie ma swobodnych nośników — ładunek zostaje tam, gdzie go umieszczono (dlatego tarciem łatwo elektryzować izolatory).<\/p>\n<p><strong>Półprzewodniki<\/strong> (krzem, german) przewodzą słabo, ale lepiej w wyższej temperaturze i po domieszkowaniu — podstawa elektroniki.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Opór właściwy ρ — dane z silnika<\/span>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Materiał<\/th><th>ρ [Ω·m] (20 °C)<\/th><th>Rodzaj<\/th><\/tr><\/thead><tbody><tr><td>srebro<\/td><td data-fiz-rho=\"srebro\">1,59·10⁻⁸<\/td><td>przewodnik<\/td><\/tr><tr><td>miedź<\/td><td data-fiz-rho=\"miedz\">1,68·10⁻⁸<\/td><td>przewodnik<\/td><\/tr><tr><td>aluminium<\/td><td data-fiz-rho=\"aluminium\">2,65·10⁻⁸<\/td><td>przewodnik<\/td><\/tr><tr><td>żelazo<\/td><td data-fiz-rho=\"zelazo\">9,7·10⁻⁸<\/td><td>przewodnik<\/td><\/tr><tr><td>grafit<\/td><td data-fiz-rho=\"grafit\">1·10⁻⁵<\/td><td>przewodnik<\/td><\/tr><tr><td>woda morska<\/td><td data-fiz-rho=\"morska\">0,2<\/td><td>elektrolit<\/td><\/tr><tr><td>woda z kranu<\/td><td data-fiz-rho=\"kran\">50<\/td><td>elektrolit<\/td><\/tr><tr><td>krzem (czysty)<\/td><td data-fiz-rho=\"krzem\">2300<\/td><td>półprzewodnik<\/td><\/tr><tr><td>woda destylowana<\/td><td data-fiz-rho=\"destylowana\">1,8·10⁵<\/td><td>słaby przewodnik<\/td><\/tr><tr><td>szkło<\/td><td data-fiz-rho=\"szklo\">1·10¹²<\/td><td>izolator<\/td><\/tr><tr><td>guma<\/td><td data-fiz-rho=\"guma\">1·10¹³<\/td><td>izolator<\/td><\/tr><tr><td>drewno suche<\/td><td data-fiz-rho=\"drewno\">1·10¹⁴<\/td><td>izolator<\/td><\/tr><tr><td>powietrze suche<\/td><td data-fiz-rho=\"powietrze\">2·10¹⁶<\/td><td>izolator<\/td><\/tr><tr><td>teflon<\/td><td data-fiz-rho=\"teflon\">1·10²³<\/td><td>izolator<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">Różnica między miedzią a teflonem to ok. 30 rzędów wielkości! Woda z kranu przewodzi dzięki rozpuszczonym jonom (chemia: dysocjacja soli).<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-przewodniki-v01\"><button type=\"button\" data-che-open-viz=\"fiz-przewodniki-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-przewodniki-v01',lessonId:'FIZ-01'},'*')\"><b>Przewodnik czy izolator? Rozpływ ładunku w pręcie<\/b><span>ρ z silnika · czas rozpływu ładunku<\/span><\/button><\/div>\n<!-- OPIS: Pręt przewodnika i pręt izolatora z naładowanym końcem: na przewodniku ładunek szybko rozpływa się po całej długości, na izolatorze pozostaje w miejscu dotyku. Wykres pokazuje czas rozpływu. Wniosek: przewodnik szybko przewodzi ładunek, izolator go nie przewodzi. -->\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"gfx-scene-conductivity\"><button type=\"button\" data-che-open-viz=\"gfx-scene-conductivity\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'gfx-scene-conductivity',lessonId:'FIZ-01'},'*')\"><b>Chemia: przewodzenie prądu przez roztwory (elektrolity)<\/b><span>Lekcja Kwasy · tester przewodnictwa<\/span><\/button><\/div>\n<!-- OPIS: Model z lekcji o kwasach: tester przewodnictwa (bateria, żarówka, dwie elektrody) zanurzany w różnych roztworach — żarówka świeci w roztworach elektrolitów, a w wodzie destylowanej czy roztworze cukru nie. Wniosek: w roztworach ładunek przenoszą jony, więc przewodzą tylko roztwory, w których są jony. -->\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — przewodnik czy izolator?<\/span>\n<p>Pytanie rozstrzygające: <strong>czy w materiale są swobodne nośniki ładunku?<\/strong> Tak (elektrony swobodne w metalach i graficie, jony w roztworach i w ciele człowieka) — to przewodnik, a nadmiarowy ładunek rozmieszcza się na powierzchni ciała. Nie — to izolator i ładunek zostaje w miejscu. Różnica jest ogromna: opór właściwy miedzi i teflonu dzieli ok. 30 rzędów wielkości. Półprzewodniki (krzem) są pośrodku, a ich przewodnictwo można kształtować domieszkami.<\/p>\n<\/div>\n<\/section>\n<section id=\"s5\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Elektryzowanie przez dotyk. Zasada zachowania ładunku<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Elektryzowanie przez dotyk<\/span>\n<p>Gdy ciało naelektryzowane dotknie ciała obojętnego (najlepiej przewodnika), część elektronów przechodzi z jednego na drugie. Oba ciała mają potem ładunek <strong>tego samego znaku<\/strong>.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Zasada zachowania ładunku<\/span>\n<p>W układzie izolowanym (bez wymiany ładunku z otoczeniem) <strong>suma ładunków jest stała<\/strong>. Ładunku nie można stworzyć ani zniszczyć — można go tylko przemieścić.<\/p>\n<div class=\"formula-lg\">q₁ + q₂ = q₁′ + q₂′<\/div>\n<p><strong>Dwie identyczne kulki przewodzące<\/strong> po zetknięciu mają równe ładunki:<\/p>\n<div class=\"formula-lg\">q′ = (q₁ + q₂) / 2<\/div>\n<p>Przykład: +6 nC i −2 nC → po zetknięciu każda ma +2 nC (suma +4 nC przed i po).<\/p>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-ladunek-v01\"><button type=\"button\" data-che-open-viz=\"fiz-ladunek-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-ladunek-v01',lessonId:'FIZ-01'},'*')\"><b>Kule: dotyk, uziemienie, zasada zachowania, liczba elektronów<\/b><span>CHE.PHYS.electro.share · n = q/e<\/span><\/button><\/div>\n<!-- OPIS: Dwie kule z ładunkami: po dotknięciu ładunek dzieli się między nimi. Przy identycznych kulach dzieli się po równo; przy różnych proporcjonalnie do promienia. Pokazano też uziemienie i liczbę elektronów (n = q / e). Wniosek: w każdym zdarzeniu ładunek jest zachowany, zmienia się tylko jego rozkład. -->\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Uziemienie<\/span>\n<p>Ziemia to ogromny przewodnik. Połączenie z nią (przewód, dotknięcie ręką) praktycznie <strong>rozładowuje<\/strong> ciało: nadmiar elektronów odpływa do ziemi albo brakujące z niej napływają.<\/p>\n<\/div>\n<\/section>\n<section id=\"s5a\">\n<div class=\"part-heading\"><span class=\"part-num\">5a<\/span> Wykład: zasada zachowania ładunku, obliczenia w kulombach i uziemienie <span class=\"level-badge level-basic\">E8<\/span> <span class=\"level-badge level-extra\">LO<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Najpierw nazwa: zasada zachowania ładunku<\/span>\n<p>Prawo, które tu stosujemy, to <strong>zasada zachowania ładunku elektrycznego<\/strong>: w układzie izolowanym (bez wymiany ładunku z otoczeniem) <strong>suma ładunków jest stała<\/strong>. Ładunku nie tworzymy ani nie niszczymy — elektrony tylko przechodzą z ciała na ciało.<\/p>\n<div class=\"formula-lg\">q₁ + q₂ + … = q₁′ + q₂′ + … = const<\/div>\n<p class=\"mini-note\">Przy zetknięciu przewodników elektrony płyną tak długo, aż <strong>potencjały się wyrównają<\/strong> (rozszerzenie LO poniżej). To ona wyjaśnia, dlaczego identyczne kule dzielą się ładunkiem po równo, a uziemienie rozładowuje ciało.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Ładunek to liczba ze znakiem i jednostką<\/span>\n<p>Ładunek zapisujemy jak liczbę względną: <strong>+<\/strong> = niedobór elektronów, <strong>−<\/strong> = nadmiar elektronów, <strong>0<\/strong> = ciało obojętne. Jednostka: <strong>kulomb (C)<\/strong>. Każdy ładunek jest wielokrotnością ładunku elementarnego e ≈ <span data-fiz=\"e\">1,6·10⁻¹⁹ C<\/span>.<\/p>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Przedrostek<\/th><th>Zapis<\/th><th>W kulombach<\/th><th>Przykład<\/th><\/tr><\/thead><tbody><tr><td>mili<\/td><td>1 mC<\/td><td>10⁻³ C<\/td><td>3 mC = 0,003 C<\/td><\/tr><tr><td>mikro<\/td><td>1 µC<\/td><td>10⁻⁶ C<\/td><td>−4 µC = −0,000004 C<\/td><\/tr><tr><td>nano<\/td><td>1 nC<\/td><td>10⁻⁹ C<\/td><td>+6 nC = 6·10⁻⁹ C<\/td><\/tr><tr><td>piko<\/td><td>1 pC<\/td><td>10⁻¹² C<\/td><td>2 pC = 2·10⁻¹² C<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p>Wzory: <div class=\"formula-lg\">q = n · e<\/div><div class=\"formula-lg\">n = |q| / e<\/div><\/p>\n<p class=\"mini-note\">1 C to bardzo dużo: ok. 6,24·10¹⁸ elektronów. W doświadczeniach szkolnych ładunki mają rząd nC–µC. W zadaniach rachunkowych często pojawiają się „okrągłe” wartości w C — metoda liczenia jest ta sama.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Dodawanie ładunków — zawsze ze znakiem i w nawiasie<\/span>\n<p>Ładunki ujemne piszemy w nawiasie, żeby nie zgubić znaku:<\/p>\n<div class=\"formula-lg\">0 C + (−4 C) = −4 C<\/div>\n<div class=\"formula-lg\">(+6 nC) + (−2 nC) = +4 nC<\/div>\n<div class=\"formula-lg\">(+3 µC) + (−3 µC) = 0<\/div>\n<p><strong>Graficznie:<\/strong> każdy „+” znosi się z jednym „−” (para = 0). Zostają niesparowane znaki — to wynik.<\/p>\n<div class=\"bil\">\n<div class=\"bil-t\"><span>+6: <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><\/span><span>−2: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><\/div>\n<div>2 pary „+ −” znikają → zostaje <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span> = <b>+4<\/b><\/div>\n<\/div>\n<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Dotyk identycznych kul przewodzących — przykłady krok po kroku<\/span>\n<p>Procedura: 1) zapisz ładunki ze znakiem, 2) dodaj je (suma), 3) podziel sumę po równo między identyczne kule, 4) sprawdź, czy suma po = suma przed, 5) ustal, kto oddał, a kto przyjął elektrony.<\/p>\n<h5>Przykład 1: A = 0 C, B = −4 C<\/h5>\n<div class=\"bil\">\n<div><b>Przed:<\/b> q<sub>A<\/sub> + q<sub>B<\/sub> = 0 C + (−4 C) = <b>−4 C<\/b><\/div>\n<div class=\"bil-t\"><span>A: <span class=\"chg-0\">0<\/span><\/span><span>B: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><\/div>\n<div><b>Dotyk identycznych kul:<\/b> q′ = (q<sub>A<\/sub> + q<sub>B<\/sub>) / 2 = <span data-fiz-res=\"-2.0\" data-fiz-share=\"0,-4\">−4 C / 2 = −2 C<\/span><\/div>\n<div class=\"bil-t\"><span>A′: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><span>B′: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><\/div>\n<div><b>Kontrola:<\/b> (−2 C) + (−2 C) = −4 C ✓<\/div>\n<\/div>\n<p><b>Przepływ:<\/b> B zmieniła ładunek z −4 C na −2 C, czyli oddała ładunek −2 C — <strong>elektrony przeszły z B na A<\/strong>. Ich liczba: n = 2 C / 1,6·10⁻¹⁹ C ≈ <b>1,25·10¹⁹<\/b>. Protony się nie ruszają.<\/p>\n<h5>Przykład 2: A = +6 nC, B = −2 nC<\/h5>\n<div class=\"bil\">\n<div><b>Przed:<\/b> q<sub>A<\/sub> + q<sub>B<\/sub> = +6 nC + (−2 nC) = <b>+4 nC<\/b><\/div>\n<div class=\"bil-t\"><span>A: <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><\/span><span>B: <span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><span class=\"chg-t\" style=\"background:#2563eb\">−<\/span><\/span><\/div>\n<div><b>Dotyk identycznych kul:<\/b> q′ = (q<sub>A<\/sub> + q<sub>B<\/sub>) / 2 = <span data-fiz-res=\"2.0\" data-fiz-share=\"6,-2\">+4 nC / 2 = +2 nC<\/span><\/div>\n<div class=\"bil-t\"><span>A′: <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><\/span><span>B′: <span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><span class=\"chg-t\" style=\"background:#dc2626\">+<\/span><\/span><\/div>\n<div><b>Kontrola:<\/b> +2 nC + +2 nC = +4 nC ✓<\/div>\n<\/div>\n<p><b>Przepływ:<\/b> A: +6 → +2 nC (ładunek zmalał o 4 nC, więc A <em>przyjęła<\/em> elektrony); B: −2 → +2 nC (B <em>oddała<\/em> elektrony). Elektrony płynęły z B do A: n = 4·10⁻⁹ C / e ≈ 2,5·10¹⁰.<\/p>\n<h5>Przykład 3: trzy kule A = +8 µC, B = 0, C = 0<\/h5>\n<div class=\"bil\">\n<div>A dotyka B: (+8 µC + 0) / 2 = <span data-fiz-res=\"4\" data-fiz-share=\"8,0\">+4 µC<\/span> → A = +4 µC, B = +4 µC<\/div>\n<div>B dotyka C: (+4 µC + 0) / 2 = <span data-fiz-res=\"2\" data-fiz-share=\"4,0\">+2 µC<\/span> → B = +2 µC, C = +2 µC<\/div>\n<div><b>Kontrola:<\/b> 4 + 2 + 2 = 8 µC = ładunek na początku ✓<\/div>\n<div>Gdyby dotknąć wszystkie trzy naraz: q′ = (+8 µC) / 3 ≈ +2,67 µC każda — kolejność i sposób dotykania zmieniają wynik, ale nie sumę.<\/div>\n<\/div>\n<h5>Przykład 4: A = +3 µC, B = −3 µC<\/h5>\n<div class=\"bil\">\n<div>(+3 µC) + (−3 µC) = 0 → po zetknięciu obie kule są <b>obojętne<\/b> (<span data-fiz-res=\"0\" data-fiz-share=\"3,-3\">0 µC<\/span>). Ładunki się zobojętniły, ale nie zniknęły: nadmiarowe elektrony B uzupełniły braki A.<\/div>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-ladunek-v01\"><button type=\"button\" data-che-open-viz=\"fiz-ladunek-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-ladunek-v01',lessonId:'FIZ-01'},'*')\"><b>Bilans ładunku: dotyk, uziemienie, zapis „przed → po”, kafelki + i −, liczba elektronów<\/b><span>CHE.PHYS.electro.contact · ground · transfer · jednostki C, mC, µC, nC, e<\/span><\/button><\/div>\n<!-- OPIS: Bilans ładunku dla dwóch kul: stan „przed” i „po” pokazany kafelkami + i − oraz liczbą elektronów, która przeszła z jednej kuli na drugą (dotyk, uziemienie). Wniosek: suma ładunków przed i po jest taka sama, a zmienia się tylko ich rozmieszczenie. -->\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Uziemienie — gdzie znika ładunek?<\/span>\n<p>Ziemia jest ogromnym przewodnikiem. Gdy połączysz z nią naelektryzowane ciało (przewód, dotknięcie ręką, metalowa rura), ładunek rozkłada się na układ <strong>ciało + Ziemia<\/strong>; na małym ciele zostaje praktycznie <strong>0<\/strong>. Ładunek nie znika — jest w Ziemi, więc zasada zachowania obowiązuje dla układu ciało + Ziemia.<\/p>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Ładunek ciała przed<\/th><th>Po uziemieniu<\/th><th>Co płynie<\/th><th>Ile elektronów<\/th><\/tr><\/thead><tbody><tr><td>−5 nC<\/td><td>0<\/td><td>elektrony z ciała do ziemi<\/td><td>3,12·10¹⁰<\/td><\/tr><tr><td>+8 µC<\/td><td>0<\/td><td>elektrony z ziemi do ciała<\/td><td>4,99·10¹³<\/td><\/tr><tr><td>−4 C<\/td><td>0<\/td><td>elektrony z ciała do ziemi<\/td><td>2,5·10¹⁹<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>nic — ciało obojętne<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<p class=\"mini-note\">Uwaga na język: przy uziemieniu ciała dodatniego nie „odpływają protony” — to <strong>elektrony napływają z ziemi<\/strong> i uzupełniają niedobór.<\/p>\n<h5>Uziemienie a indukcja — ładowanie elektroskopu „na odwrót”<\/h5>\n<ol>\n<li>Zbliżasz pręt naelektryzowany ujemnie (nie dotykasz). W elektroskopie elektrony uciekają w dół, na kulce przewagę ma „+”.<\/li>\n<li>Dotykasz kulkę palcem (uziemienie): odpychane elektrony odpływają do ziemi.<\/li>\n<li>Zabierasz palec, potem pręt. Elektroskop ma <strong>niedobór elektronów → ładunek dodatni<\/strong>, przeciwny do ładunku pręta.<\/li>\n<\/ol>\n<p>Zastosowania uziemienia: piorunochron, uziemienie obudów urządzeń i cystern z paliwem, opaska antystatyczna przy elektronice, łańcuch lub pasek przewodzący przy cysternach.<\/p>\n<\/div>\n<details class=\"adv\"><summary>Wyrównanie potencjałów — kule różnej wielkości i dlaczego Ziemia „zabiera” ładunek <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\">\n<p>Potencjał naładowanej kuli o promieniu R: V = k·q / R. Po zetknięciu przewodników elektrony płyną, aż potencjały się zrównają: q₁/R₁ = q₂/R₂. Stąd przy zachowanej sumie Q:<\/p>\n<div class=\"formula-lg\">q₁′ = Q · R₁ / (R₁ + R₂),   q₂′ = Q · R₂ / (R₁ + R₂)<\/div>\n<p><b>Przykład:<\/b> kula 1 cm ma +6 nC, kula 2 cm jest obojętna. Po zetknięciu: q₁′ = 6 · 1/3 = <span data-fiz-res=\"2,4\" data-fiz-sharer=\"6,0|1,2\">+2 nC<\/span>, q₂′ = +4 nC. Większa kula bierze więcej ładunku, a potencjały są równe: V = k·(2 nC)/(0,01 m) ≈ 1798 V.<\/p>\n<p>Ziemia ma promień ok. 6400 km, więc przy „zetknięciu” z małym ciałem prawie cały ładunek trafia do Ziemi — to właśnie uziemienie. Identyczne kule (R₁ = R₂) dzielą się po równo — szkolny wzór q′ = (q₁ + q₂)/2 jest szczególnym przypadkiem tej reguły.<\/p>\n<\/div><\/details>\n<div class=\"card card-warning\">\n<span class=\"card-label\">Typowe błędy w zadaniach<\/span>\n<ul>\n<li>Dodawanie bez znaku: „0 C i −4 C → 2 C każda” — źle, wynik to −2 C.<\/li>\n<li>Dzielenie po równo kul różnej wielkości (to tylko dla identycznych).<\/li>\n<li>„Przepłynęły protony” — w metalach przemieszczają się wyłącznie elektrony.<\/li>\n<li>Po uziemieniu „ładunek zniknął” — jest w Ziemi; suma w układzie ciało + Ziemia stała.<\/li>\n<li>Zapominanie o przeliczeniu nC, µC na C przed liczeniem elektronów.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Sprawdź się (odpowiedzi ukryte)<\/span>\n<ol>\n<li>A = −6 nC, B = +2 nC, identyczne, zetknięte. Ładunek każdej po zetknięciu?<\/li>\n<li>Ile elektronów przeszło w zadaniu 1 i w którą stronę?<\/li>\n<li>Kula ma −3,2·10⁻¹⁸ C. Ile ma nadmiarowych elektronów?<\/li>\n<li>Kulę +5 µC uziemiono. Co płynie i ile?<\/li>\n<li>Trzy identyczne kule: +9 C, −3 C, 0 C dotknięte naraz. Wynik?<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Odpowiedzi<\/summary>\n<ol>\n<li>(−6 + 2)/2 = <b>−2 nC<\/b> każda.<\/li>\n<li>A: −6 → −2 nC (oddała elektrony), B: +2 → −2 nC (przyjęła). Z A do B przeszło 4 nC, czyli 2,5·10¹⁰ elektronów.<\/li>\n<li>n = 3,2·10⁻¹⁸ / 1,6·10⁻¹⁹ = <b>20<\/b> elektronów.<\/li>\n<li>Elektrony z ziemi do kuli: 5·10⁻⁶ / 1,6·10⁻¹⁹ ≈ 3,12·10¹³; kula po uziemieniu ma 0.<\/li>\n<li>(9 − 3 + 0)/3 = <b>+2 C<\/b> każda.<\/li>\n<\/ol>\n<\/details>\n<\/div>\n<\/section>\n<section id=\"s6\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Elektroskop<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Budowa<\/span>\n<ul>\n<li>metalowy pręt zakończony u góry kulką lub płytką,<\/li>\n<li>dwa lekkie metalowe listki (lub wskazówka) na dole pręta,<\/li>\n<li>szklana obudowa z <strong>izolatorem<\/strong> (korek, guma), przez który przechodzi pręt.<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Działanie<\/span>\n<p>Ładunek rozpływa się po pręcie i listkach. Listki mają ładunek <strong>tego samego znaku<\/strong>, więc się <strong>odpychają<\/strong> i rozchylają. Większy ładunek → większy kąt.<\/p>\n<p><strong>Elektroskop nie pokazuje znaku ładunku.<\/strong> Znak sprawdzamy, zbliżając ciało o znanym ładunku: jeśli listki rozchylają się bardziej — ładunek jednoimienny, jeśli opadają — różnoimienny.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektroskop-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektroskop-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektroskop-v01',lessonId:'FIZ-01'},'*')\"><b>Elektroskop: dotyk, indukcja, uziemienie (scenariusz krok po kroku)<\/b><span>Model rozkładu ładunku z silnika<\/span><\/button><\/div>\n<!-- OPIS: Elektroskop z listkami: po naładowaniu listki odchylają się od siebie, a przy dotknięciu uziemionego przewodnika opadają. Wykres i wskazania pokazują rozkład ładunku. Wniosek: odchylenie listków świadczy o obecności ładunku, ale nie pokazuje jego znaku. -->\n<\/section>\n<section id=\"s7\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Indukcja elektrostatyczna (elektryzowanie przez wpływ)<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Zjawisko<\/span>\n<p>Po <strong>zbliżeniu<\/strong> (bez dotykania) naładowanego ciała do przewodnika elektrony swobodne w przewodniku przesuwają się: ujemny pręt je odpycha, dodatni — przyciąga. Na bliższym końcu powstaje ładunek <strong>przeciwnego<\/strong> znaku, na dalszym — <strong>tego samego<\/strong>. Ładunek całkowity przewodnika się nie zmienia (= 0). Po oddaleniu pręta wszystko wraca do stanu początkowego.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Trwałe naelektryzowanie przez indukcję — 4 kroki<\/span>\n<ol>\n<li>Zbliż naładowany pręt (np. ujemny) do kulki elektroskopu — listki się rozchylają.<\/li>\n<li>Nie odsuwając pręta, dotknij kulki palcem (uziemienie) — elektrony uciekają do ziemi, listki opadają.<\/li>\n<li>Zabierz palec (pręt nadal blisko).<\/li>\n<li>Oddal pręt — elektroskop zostaje naładowany <strong>przeciwnie<\/strong> do pręta (tu: dodatnio), listki się rozchylają.<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Zastosowania i skutki<\/span>\n<div class=\"table-wrap\">\n<table><thead><tr><th>Gdzie<\/th><th>Co się dzieje<\/th><\/tr><\/thead><tbody><tr><td>piorunochron<\/td><td>chmura indukuje ładunek w ostrzu; wyładowanie trafia w piorunochron i spływa przewodem do ziemi — to kontrolowana droga prądu; piorunochron nie gwarantuje trafienia w każde wyładowanie, a instalację projektuje się zgodnie z normami<\/td><\/tr><tr><td>burza<\/td><td>ładunki rozdzielają się w chmurze (zderzenia kryształków lodu); piorun przenosi zwykle kilka–kilkadziesiąt kulombów (orientacyjnie) w ułamku sekundy<\/td><\/tr><tr><td>kserograf, drukarka laserowa<\/td><td>naelektryzowany bęben przyciąga toner tylko w miejscach obrazu<\/td><\/tr><tr><td>filtry elektrostatyczne<\/td><td>pył w kominie elektrowni zostaje naładowany i osiada na elektrodach<\/td><\/tr><tr><td>malowanie proszkowe / natryskowe<\/td><td>naładowane krople farby lecą do uziemionego elementu i pokrywają go równo, także od tyłu<\/td><\/tr><tr><td>stacja paliw, cysterna<\/td><td>iskra może zapalić opary — cysterny i dystrybutory się uziemia<\/td><\/tr><tr><td>elektronika<\/td><td>wyładowanie z ciała (kilka tysięcy woltów — orientacyjnie!) niszczy układy scalone — opaska antystatyczna, uziemione stanowisko<\/td><\/tr><tr><td>klatka Faradaya<\/td><td>wewnątrz zamkniętego przewodnika pole elektryczne jest zerowe — samochód chroni przed piorunem, mikrofalówka zatrzymuje fale<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektroskop-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektroskop-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektroskop-v01',lessonId:'FIZ-01'},'*')\"><b>Scenariusz: elektryzowanie przez indukcję w 5 krokach<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Pięć kroków elektryzowania przez indukcję: naładowany pręt zbliża się do elektroskopu, uziemienie odprowadza ładunek jednego znaku, uziemienie zostaje usunięte i pręt oddalony. Na końcu elektroskop ma ładunek przeciwnego znaku niż pręt. Wniosek: indukcja pozwala naładować ciało bez dotyku, a elektrony przechodzą tylko przez uziemienie. -->\n<\/section>\n<section id=\"s8\">\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Prawo Coulomba <span class=\"level-badge level-extra\">E8+ / LO<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Wzór<\/span>\n<div class=\"formula-lg\">F = k · |q₁ · q₂| / r²<\/div>\n<p>k = <span data-fiz=\"k\">8,99·10⁹ N·m²/C²<\/span> (w próżni i — praktycznie — w powietrzu). F w niutonach, q w kulombach, r w metrach.<\/p>\n<ul>\n<li>siła jest wprost proporcjonalna do iloczynu ładunków,<\/li>\n<li>odwrotnie proporcjonalna do <strong>kwadratu<\/strong> odległości,<\/li>\n<li>działa wzdłuż prostej łączącej ładunki (siły wzajemne, równe co do wartości).<\/li>\n<\/ul>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Przykład<\/span>\n<p>Dwa ładunki po 2 µC i 3 µC w odległości 30 cm (powietrze):<\/p>\n<div class=\"formula-lg\">F = 8,99·10⁹ · 2·10⁻⁶ · 3·10⁻⁶ / 0,3² ≈ 0,6 N<\/div>\n<p>Ładunki jednoimienne → odpychanie. To tyle, ile waży ciało o masie ok. 60 g.<\/p>\n<\/div>\n<div class=\"card card-new\">\n<span class=\"card-label\">Ośrodek — most do chemii<\/span>\n<p>W ośrodku o przenikalności względnej ε<sub>r<\/sub> siła maleje ε<sub>r<\/sub> razy: F = k·|q₁q₂| / (ε<sub>r<\/sub>·r²). Dla wody ε<sub>r<\/sub> ≈ <span data-fiz=\"epsr-woda\">80<\/span> — dlatego woda tak skutecznie <strong>rozdziela jony<\/strong> kryształu soli (dysocjacja, lekcja Sole).<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Jak czytać wzór Coulomba?<\/span>\n<p>Wzór F = k·|q₁·q₂|/r² podaje wartość siły. Moduły ładunków są w wartości bezwzględnej, więc wynik F jest zawsze dodatni. Rodzaj oddziaływania określa znak iloczynu q₁·q₂: dodatni — odpychanie, ujemny — przyciąganie. Nie wpisuj ujemnej wartości siły tylko dlatego, że ładunki się przyciągają.<\/p>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-coulomb-v01\"><button type=\"button\" data-che-open-viz=\"fiz-coulomb-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-coulomb-v01',lessonId:'FIZ-01'},'*')\"><b>Prawo Coulomba: siły, linie pola, ośrodek, wykres F(r)<\/b><span>k i εr z silnika<\/span><\/button><\/div>\n<!-- OPIS: Wykres siły Coulomba F(r) dla dwóch ładunków: siła maleje z kwadratem odległości, a zmiana ośrodka (εr) osłabia oddziaływanie. Suwaki zmieniają wartości ładunków i odległość. Wniosek: F = k·q₁·q₂ / (εr·r²) i siła rośnie, gdy ładunki rosną, a maleje, gdy odległość rośnie. -->\n<details class=\"adv\"><summary>Elektryczność kontra grawitacja <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\">\n<p>Dla protonu i elektronu stosunek siły elektrycznej do grawitacyjnej F<sub>e<\/sub>/F<sub>g<\/sub> = k·e² / (G·m<sub>e<\/sub>·m<sub>p<\/sub>) ≈ 2,3·10³⁹ — niezależnie od odległości (obie siły ∝ 1/r²). W atomie wodoru (r ≈ 5,3·10⁻¹¹ m) F<sub>e<\/sub> ≈ 8,2·10⁻⁸ N. Grawitacja dominuje w kosmosie tylko dlatego, że ciała są prawie idealnie obojętne.<\/p>\n<\/div><\/details>\n<details class=\"adv\"><summary>Wektorowo i zasada superpozycji <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\">\n<p>F⃗₁₂ = k·q₁q₂/r² · r̂₁₂. Siła od kilku ładunków jest <strong>sumą wektorową<\/strong> sił od każdego z osobna. Przykład: ładunek w połowie odległości między dwoma identycznymi ładunkami — siła wypadkowa 0.<\/p>\n<\/div><\/details>\n<\/section>\n<section id=\"s9\">\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Pole elektryczne <span class=\"level-badge level-extra\">LO<\/span><\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Natężenie pola<\/span>\n<p>Ładunek wytwarza wokół siebie <strong>pole elektryczne<\/strong> — każdy inny ładunek odczuwa w nim siłę. <strong>Natężenie pola<\/strong> to siła działająca na jednostkowy, dodatni ładunek próbny:<\/p>\n<div class=\"formula-lg\">E = F / q   [N/C = V/m]<\/div>\n<p>Dla ładunku punktowego |E| = k·|Q| / r²; zwrot pola: od ładunku dodatniego, ku ujemnemu. <strong>Linie pola<\/strong> zaczynają się na ładunkach dodatnich i kończą na ujemnych; gęstsze linie — silniejsze pole.<\/p>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Rodzaje pól<\/span>\n<ul>\n<li><strong>centralne<\/strong> — wokół ładunku punktowego (linie radialne),<\/li>\n<li><strong>jednorodne<\/strong> — między dwiema równoległymi płytami o przeciwnych ładunkach (linie równoległe, E = U/d),<\/li>\n<li>wewnątrz przewodnika w równowadze E = 0 (klatka Faradaya); ładunek siedzi na powierzchni, najgęściej na <strong>ostrzach<\/strong>.<\/li>\n<\/ul>\n<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-coulomb-v01\"><button type=\"button\" data-che-open-viz=\"fiz-coulomb-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-coulomb-v01',lessonId:'FIZ-01'},'*')\"><b>Linie pola dwóch ładunków (włącz/wyłącz)<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Linie pola dwóch ładunków, które można włączać i wyłączać: linie wychodzą z ładunku dodatniego i wchodzą do ujemnego, a ich gęstość pokazuje siłę pola. Wniosek: linie pola pokazują kierunek i względną wartość siły działającej na ładunek próbny. -->\n<details class=\"adv\"><summary>Potencjał, napięcie, kondensator, elektronowolt <span class=\"adv-tag\">poziom akademicki · poza maturą rozszerzoną<\/span><\/summary><div class=\"adv-body\">\n<p><strong>Potencjał<\/strong> V = k·Q/r [V = J/C]; <strong>napięcie<\/strong> U = V<sub>A<\/sub> − V<sub>B<\/sub> = W/q. <strong>Kondensator<\/strong>: C = Q/U [F]; płaski: C = ε₀ε<sub>r<\/sub>S/d, energia W = ½CU². <strong>Elektronowolt<\/strong>: 1 eV = 1,602·10⁻¹⁹ J — energia elektronu przyspieszonego napięciem 1 V. Prawo Gaussa: strumień E przez powierzchnię zamkniętą = Q<sub>wewn<\/sub>/ε₀.<\/p>\n<\/div><\/details>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — pole elektryczne<\/span>\n<p>Pole to sposób opisu: zamiast pytać, jak ładunek A działa na B, pytamy, jakie pole wytwarza A i co to pole zrobi z dowolnym ładunkiem. Natężenie pola E = F/q mówi, jaka siła działa na 1 C ładunku próbnego (N/C). Linie pola wychodzą z „+”, wchodzą w „−”; im gęstsze, tym silniejsze pole. Siła na ładunek q w polu E wynosi F = q·E (zwrot zgodny z E dla q > 0, przeciwny dla q &lt; 0).<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Ciekawostka — kropla oleju i ładunek elementarny<\/span>\n<p>W 1909 roku Robert Millikan obserwował naładowane kropelki oleju w polu elektrycznym: dobierał takie natężenie pola, przy którym kropla wisiała w miejscu (siła elektryczna równoważyła ciężar). Ładunki kropel okazywały się <strong>całkowitymi wielokrotnościami<\/strong> tej samej, najmniejszej wartości — ładunku elementarnego e. Za badania nad ładunkiem elementarnym dostał Nagrodę Nobla w 1923 roku.<\/p>\n<\/div>\n<p class=\"mini-note\"><strong>BHP ogólne:<\/strong> nie wykonuj doświadczeń z wysokim napięciem, iskrami, paliwami i rozpuszczalnikami bez nadzoru dorosłego i odpowiedniego wyposażenia. Nie zbliżaj naładowanych przedmiotów do instalacji elektrycznej, urządzeń medycznych ani łatwopalnych oparów.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Gdzie gromadzi się ładunek?<\/span>\n<p>W stanie równowagi elektrostatycznej nadmiar ładunku przewodnika leży na jego powierzchni, a wewnątrz pole jest zerowe. Na ostrzach i w miejscach o małym promieniu krzywizny gęstość ładunku jest większa niż na płaskich powierzchniach, dlatego ostre końcówki łatwo jonizują powietrze.<\/p>\n<p>Nie oznacza to, że cały ładunek zawsze skupia się na samym ostrzu. Rozkład zależy od kształtu przewodnika i od obecności innych ładunków.<\/p>\n<\/div>\n<\/section>\n<section id=\"s10\">\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Doświadczenia<\/div>\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektryzowanie-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektryzowanie-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektryzowanie-v01',lessonId:'FIZ-01'},'*')\"><b>Pracownia: tarcie i wahadełko<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Pracownia tarcia i wahadełka: wybierz materiały, pocieraj je i sprawdzaj, które ciało się naładowało i jak zachowuje się wahadełko. Wniosek: znak ładunku zależy od pary materiałów, a przenoszą się elektrony. -->\n<div class=\"che-lesson-viz-ref\" data-che-lesson-viz=\"fiz-elektroskop-v01\"><button type=\"button\" data-che-open-viz=\"fiz-elektroskop-v01\" onclick=\"parent.postMessage({type:'CHE_LESSON_OPEN_VISUAL',visualId:'fiz-elektroskop-v01',lessonId:'FIZ-01'},'*')\"><b>Pracownia: elektroskop<\/b><span>Silnik CHE · fizyka · otwiera się w oknie<\/span><\/button><\/div>\n<!-- OPIS: Pracownia elektroskopu: można naładować elektroskop dotykiem lub indukcją, uziemić go i obserwować odchylenie listków. Wniosek: odchylenie listków zależy od ilości i rozmieszczenia ładunku, a nie od jego znaku. -->\n<div class=\"exp-card\"><h5>Doświadczenie 1 — Balon i skrawki papieru<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy naelektryzowany balon przyciąga lekkie ciała?<\/span><b>Sprzęt<\/b><span>balon, wełniany sweter lub suche włosy, skrawki papieru<\/span><b>Przebieg<\/b><span>Pocieraj balon o włosy, zbliż do skrawków.<\/span><b>Obserwacja<\/b><span>Skrawki podskakują i przyklejają się do balonu, po chwili część odpada.<\/span><b>Wniosek<\/b><span>Balon naelektryzował się (−); skrawki są przyciągane przez polaryzację. Po dotyku przejmują ładunek i odpadają (odpychanie).<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 2 — Grzebień i strumień wody<\/h5><div class=\"exp-grid\"><b>Problem<\/b><span>Czy ładunek działa na ciecz?<\/span><b>Przebieg<\/b><span>Naelektryzowany grzebień zbliż do cienkiego strumienia wody z kranu.<\/span><b>Obserwacja<\/b><span>Strumień wyraźnie się wygina w stronę grzebienia.<\/span><b>Wniosek<\/b><span>Ładunek grzebienia przesuwa ładunki w wodzie (cząsteczki H₂O są polarne, woda z kranu zawiera jony) — strumień jest przyciągany.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 3 — Elektroskop ze słoika<\/h5><div class=\"exp-grid\"><b>Sprzęt<\/b><span>słoik, plastikowa pokrywka (izolator), drut miedziany, folia aluminiowa<\/span><b>Wykonanie<\/b><span>Drut przebij przez pokrywkę, u góry kulka z folii, na dole zagięty haczyk z dwoma paskami cienkiej folii.<\/span><b>Test<\/b><span>Zbliż naelektryzowany balon — paski się rozchylają (indukcja); dotknij — zostają rozchylone (dotyk).<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 4 — Wahadełko elektrostatyczne<\/h5><div class=\"exp-grid\"><b>Sprzęt<\/b><span>kulka z folii aluminiowej na nitce, naelektryzowany pręt (ebonit, PVC, balon)<\/span><b>Obserwacja<\/b><span>Kulka najpierw jest przyciągana, po dotknięciu — gwałtownie odpychana.<\/span><b>Wniosek<\/b><span>Przyciąganie obojętnej kulki → indukcja; po dotyku kulka ma ładunek tego samego znaku → odpychanie.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 5 — Puszka toczona balonem<\/h5><div class=\"exp-grid\"><b>Przebieg<\/b><span>Pustą puszkę aluminiową połóż na stole, zbliż naelektryzowany balon (bez dotykania).<\/span><b>Obserwacja<\/b><span>Puszka toczy się za balonem.<\/span><b>Wniosek<\/b><span>Indukcja w metalu: bliższa strona puszki ma ładunek przeciwny do balonu.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 6 — Przewodnik czy izolator?<\/h5><div class=\"exp-grid\"><b>Przebieg<\/b><span>Naładuj elektroskop, a następnie dotykaj kulki: drutem trzymanym w ręce, plastikową linijką, ołówkiem (grafit), suchym i wilgotnym sznurkiem.<\/span><b>Obserwacja<\/b><span>Drut, grafit i wilgotny sznurek rozładowują elektroskop (listki opadają), linijka i suchy sznurek — nie.<\/span><b>Wniosek<\/b><span>Przewodniki odprowadzają ładunek do ziemi przez nasze ciało; woda w sznurku przewodzi dzięki jonom.<\/span><\/div><\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 7 — Elektryzowanie elektroskopu przez indukcję<\/h5><div class=\"exp-grid\"><b>Przebieg<\/b><span>4 kroki z rozdziału 7.<\/span><b>Obserwacja<\/b><span>Na końcu listki rozchylone, mimo że pręt nigdy nie dotknął elektroskopu.<\/span><b>Sprawdzenie znaku<\/b><span>Zbliż ponownie ten sam pręt — listki opadają, więc ładunek elektroskopu jest przeciwny do ładunku pręta.<\/span><\/div><\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">BHP i praktyka<\/span>\n<ul>\n<li>Doświadczenia elektrostatyczne wychodzą w <strong>suchym<\/strong> powietrzu (zimą) — wilgoć rozładowuje ciała.<\/li>\n<li>Nie wykonuj doświadczeń przy otwartych oparach paliw i rozpuszczalników.<\/li>\n<li>Maszyna elektrostatyczna i generator Van de Graaffa — tylko pod okiem nauczyciela (wyładowania są bezpieczne dla zdrowej osoby, ale bolesne; niebezpieczne dla osób z rozrusznikiem).<\/li>\n<li>Podczas burzy: nie stój pod samotnym drzewem, nie kąp się, w samochodzie jesteś bezpieczny (klatka Faradaya).<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section id=\"s11\">\n<div class=\"part-heading\"><span class=\"part-num\">11<\/span> Klinika błędów<\/div>\n<div class=\"table-wrap\">\n<table class=\"klinika-table\"><thead><tr><th>Błąd<\/th><th>Poprawnie<\/th><th>Dlaczego?<\/th><\/tr><\/thead><tbody><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Przy pocieraniu przechodzą protony.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Przechodzą tylko elektrony.<\/td><td data-label=\"Dlaczego\">Protony są uwięzione w jądrach atomów.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Ciało dodatnie ma nadmiar protonów, które dostało.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Ciało dodatnie ma niedobór elektronów.<\/td><td data-label=\"Dlaczego\">Liczba protonów się nie zmienia — ciało oddało elektrony.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Tarcie wytwarza ładunek.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Tarcie rozdziela ładunek.<\/td><td data-label=\"Dlaczego\">Zasada zachowania ładunku: ile jedno ciało ma +, tyle drugie −.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Skoro ciała się przyciągają, oba są naelektryzowane.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Przyciąganie może zachodzić między ciałem naładowanym i obojętnym.<\/td><td data-label=\"Dlaczego\">Polaryzacja / indukcja. Pewnym dowodem jest tylko odpychanie.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Elektroskop pokazuje, czy ładunek jest + czy −.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Elektroskop pokazuje tylko, czy (i ile) ładunku jest.<\/td><td data-label=\"Dlaczego\">Znak ustala się ciałem o znanym ładunku.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„2× większa odległość → siła 2× mniejsza.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">2× większa odległość → siła 4× mniejsza.<\/td><td data-label=\"Dlaczego\">F ∝ 1/r² (prawo Coulomba).<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Metalu nie da się naelektryzować przez tarcie.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Da się, jeśli jest odizolowany (trzymany za izolującą rączkę).<\/td><td data-label=\"Dlaczego\">W ręce ładunek natychmiast spływa przez ciało do ziemi.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Piorunochron przyciąga pioruny, więc jest niebezpieczny.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Piorunochron chroni budynek.<\/td><td data-label=\"Dlaczego\">Bezpiecznie odprowadza ładunek wyładowania przewodem do ziemi.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Przy indukcji przewodnik zyskuje ładunek.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Przy indukcji ładunek tylko się rozsuwa (suma = 0).<\/td><td data-label=\"Dlaczego\">Trwały ładunek pojawia się dopiero po uziemieniu i jego odłączeniu.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Ciało obojętne nie ma żadnych ładunków.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Ma tyle samo ładunku dodatniego i ujemnego, a ich suma wynosi 0.<\/td><td data-label=\"Dlaczego\">Atomy zawierają cząstki naładowane; obojętność to bilans, nie brak ładunków.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Przy dotyku dwóch kul ładunek zawsze dzieli się po równo.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Po równo — tylko dla kul identycznych (ta sama wielkość i materiał).<\/td><td data-label=\"Dlaczego\">Podział zależy od rozmiarów przewodników: większa kula bierze więcej ładunku (sekcja 5a).<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Izolatora nie da się naelektryzować.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Izolatory elektryzują się najłatwiej, tyle że ładunek nie rozpływa się po nich.<\/td><td data-label=\"Dlaczego\">Brak swobodnych nośników zatrzymuje ładunek tam, gdzie powstał.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Większy ładunek działa na mniejszy większą siłą.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Obie siły mają tę samą wartość.<\/td><td data-label=\"Dlaczego\">III zasada dynamiki; we wzorze Coulomba występuje iloczyn q₁·q₂, symetryczny względem obu ładunków.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Ładunek elementarny e jest ujemny, bo to ładunek elektronu.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">e ≈ 1,6·10⁻¹⁹ C jest dodatnie; ładunek elektronu to −e.<\/td><td data-label=\"Dlaczego\">e to wartość najmniejszego ładunku, a znak dopisujemy osobno.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„1 nC = 10⁻⁶ C.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">1 nC = 10⁻⁹ C, a 10⁻⁶ C to 1 µC.<\/td><td data-label=\"Dlaczego\">Nano to miliardowa część, mikro — milionowa; zamień na kulomby przed liczeniem elektronów.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„W przewodniku ładunek zbiera się w środku.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">W równowadze ładunek siedzi na powierzchni, najgęściej na ostrzach.<\/td><td data-label=\"Dlaczego\">Ładunki jednoimienne się odpychają i oddalają się od siebie tak daleko, jak się da.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Wewnątrz każdego przewodnika zawsze nie ma pola.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">W przewodniku w stanie równowagi elektrostatycznej pole wewnątrz jest zerowe, ale tylko w równowadze.<\/td><td data-label=\"Dlaczego\">Swobodne ładunki przesuwają się, aż zrównoważą pole wewnątrz.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Uziemienie zawsze zabiera elektrony.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Elektrony mogą odpływać do Ziemi albo napływać z Ziemi.<\/td><td data-label=\"Dlaczego\">Kierunek zależy od znaku ciała (metoda ZUZO).<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Ujemna wartość siły oznacza przyciąganie.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Wartość siły jest dodatnia; rodzaj oddziaływania wynika ze znaku iloczynu q₁·q₂.<\/td><td data-label=\"Dlaczego\">Wzór Coulomba podaje moduł siły.<\/td><\/tr><tr class=\"error-row\"><td class=\"col-blad\" data-label=\"Błąd\">„Listki opadły po zbliżeniu pręta, więc pręt jest ujemny.”<\/td><td class=\"col-ok\" data-label=\"Poprawa\">Opadnięcie listków oznacza ładunek różnoimienny względem elektroskopu — o znaku pręta decyduje znak ładunku elektroskopu.<\/td><td data-label=\"Dlaczego\">Znak pręta trzeba wywnioskować ze znaku ładunku elektroskopu i z zachowania listków.<\/td><\/tr><\/tbody><\/table>\n<\/div>\n<\/section>\n<section id=\"s11a\">\n<div class=\"part-heading\"><span class=\"part-num\">11a<\/span> Przykłady prowadzone krok po kroku<\/div>\n<div class=\"card card-core\">\n<span class=\"card-label\">Jak rozwiązywać zadania — schemat<\/span>\n<ol>\n<li><b>Wypisz dane<\/b> z jednostkami; zamień nC, µC na C, cm na m.<\/li>\n<li><b>Nazwij zjawisko<\/b>: tarcie / dotyk / indukcja / Coulomb.<\/li>\n<li><b>Wybierz wzór<\/b> z ściągi (sekcja 0).<\/li>\n<li><b>Podstaw i policz<\/b> — potęgi dziesiątki osobno: 10⁻⁶ · 10⁻⁶ = 10⁻¹².<\/li>\n<li><b>Sprawdź sens<\/b>: znak ładunku, czy siła rośnie/maleje zgodnie z intuicją, czy suma ładunków się zgadza.<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-basic\">\n<span class=\"card-label\">Przykład 1 (E8) — ile elektronów?<\/span>\n<ol>\n<li>Dane: q = −4,8·10⁻¹⁹ C; szukane: n.<\/li>\n<li>Wzór: n = |q| / e.
