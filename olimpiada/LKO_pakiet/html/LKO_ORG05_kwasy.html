zegar animacji dla wszystkich klocków: jedna pętla rAF, funkcje fn(now, dt); pętla stoi, gdy nikt nie gra. */\n  var zegar = (function () {\n    var fns = [], id = 0, ost = 0;\n    function petla(now) {\n      var dt = Math.min(0.05, (now - ost) / 1000); ost = now;\n      fns.slice().forEach(function (f) { try { f(now, dt); } catch (e) { } });\n      id = fns.length ? requestAnimationFrame(petla) : 0;\n    }\n    return {\n      dodaj: function (f) { if (fns.indexOf(f) < 0) fns.push(f); if (!id) { ost = performance.now(); id = requestAnimationFrame(petla); } },\n      usun: function (f) { var i = fns.indexOf(f); if (i >= 0) fns.splice(i, 1); },\n      liczba: function () { return fns.length; }\n    };\n  })();\n  var RM_ = !!(g.matchMedia && g.matchMedia('(prefers-reduced-motion: reduce)').matches);   // użytkownik prosi o brak animacji: bez autostartu\n  function def(nazwa, k) { reg[nazwa] = k; }\n  function montuj(host, nazwa, opc) {\n    var k = reg[nazwa];\n    if (!k) { host.textContent = 'Brak klocka: ' + nazwa; return null; }\n    opc = Object.assign({}, k.domyslne || {}, opc || {});\n    if (k.html) { host.innerHTML = ''; k.html(host, opc); return null; }\n    var c = document.createElement('canvas');\n    c.width = opc.szer || 480; c.height = opc.wys || 300;\n    c.style.width = '100%'; c.style.maxWidth = c.width + 'px'; c.style.height = 'auto';\n    c.setAttribute('role', 'img');\n    c.setAttribute('aria-label', (opc.opis || k.opis || nazwa));\n    host.innerHTML = ''; host.appendChild(c);\n    var stan = Object.assign({}, k.stan0 ? k.stan0(opc) : {}, {opc: opc});\n    var ctx = c.getContext('2d'), t0 = performance.now(), grane = false;   // start() dodaje klocek do wspólnego zegara (IO albo od razu)\n    function klatka(now) {\n      try { k.rysuj(ctx, c.width, c.height, stan, (now - t0) / 1000, opc); } catch (e) { }\n    }\n    function start() { if (!grane) { grane = true; t0 = performance.now() - (stan._t || 0) * 1000; zegar.dodaj(klatka); } }\n    fu  gazu (CO₂)',safety:['ocet drażni oczy']}],\n f01FeS:[R([[1,'Fe'],[1,'S']],[[1,'FeS']]),{type:'synteza',conditions:'ogrzewanie mieszaniny w probówce',observation:'mieszanina rozżarza się, powstaje czarna krucha substancja niemagnetyczna',safety:['pokaz nauczyciela pod wyciągiem; możliwy SO₂']}]};\nvar SBF1={NaHCO3:['wodorowęglan sodu (soda oczyszczona)','s',84.007,'wodorosól',[],['proszek do pieczenia','gaśnice']],\n CH3COONa:['octan sodu','aq',82.034,'sól',[],['przemysł spożywczy','ogrzewacze chemiczne']],\n FeS:['siarczek żelaza(II)','s',87.91,'sól (czarna)',[],['otrzymywanie H₂S w laboratorium']]};\nObject.keys(SBF1).forEach(function(f){if(D.SUBSTANCES[f]||byF[f])return;var a=SBF1[f];D.SUBSTANCES[f]={formula:f,name:a[0],state:a[1],molarMass:a[2],role:a[3],safety:a[4],uses:a[5],src:'rozszerzenia.js'}});\nObject.keys(RDF1).forEach(function(k){if(D.REACTIONS[k])return;D.REACTIONS[k]=RDF1[k][0];D.REACTION_DATA[k]=Object.assign({products:RDF1[k][0].products.map(function(x){return x.formula})},RDF1[k][1])});\nif(rx)Object.keys(RXF1).forEach(function(k){if(!rx.get(k))rx.register(k,RXF1[k])});\n\npracownia('f01-doswiadczenia-v01','Pracownia: co naprawdę się zmieniło?','Zjawisko fizyczne czy reakcja chemiczna? Topnienie, rozpuszczanie i odparowanie kontra reakcje z nową substancją — zlewka, obserwacja, wniosek i BHP.',\n [['Zjawiska fizyczne',['f01SolWoda','f01Odparowanie']],['Reakcje chemiczne',['f01SodaOcet','f01Mg','f01FeS']],['Dowód produktu',['f01WodaWapienna']]],\n {f01SolWoda:{war:'łyżeczka soli kuchennej w wodzie, mieszanie bagietką',wn:'Zjawisko fizyczne (rozpuszczanie). Dowód: po odparowaniu wody sól wraca.',bhp:'Nie smakujemy substancji w pracowni.'},\n  f01Odparowanie:{war:'część roztworu soli w parownicy, ogrzewanie palnikiem lub płytą',wn:'Odzyskanie substancji wyjściowej potwierdza, że rozpuszczanie nie było reakcją.',bhp:'Gorąca parownica — chwytać szczypcami; okulary (pryskanie przy końcu odparowania).'},\n  f01SodaOcet:{war:'łyżeczka sody oczyszczonej, dolewamy ocet',wn:'Reakcja chemiczna: powstaje nowa substancja (gaz CO₂). Nazwa gazu to wniosek — potwierdza go woda wapienna.',bhp:'Okulary; ocet nie do oczu.'},\n  f01Mg:{war:'wstążka magnezu w szczypcach, w płomieniu palnika (pokaz)',wn:'Reakcja chemiczna: biały, kruchy MgO ma inne właściwości niż metaliczny magnez.',bhp:'Nie patrzeć w płomień; płonącego magnezu nie gasić wodą.'},\n  f01FeS:{war:'mieszanina opiłek żelaza i siarki w probówce, ogrzewanie (pokaz)',wn:'Przed ogrzaniem — mieszanina (magnes wyciąga żelazo); po — związek FeS (magnes nie przyciąga). Rozstrzyga test właściwości.',bhp:'Pokaz pod wyciągiem; możliwy trujący SO₂; gorąca probówka może pęknąć.'},\n  f01WodaWapienna:{war:'gaz przepuszczony przez wodę wapienną',wn:'Zmętnienie wody wapiennej to dowód, że gazem był CO₂.',bhp:'Woda wapienna drażni oczy i skórę; okulary.'}},\n 'GFX.rx · rozszerzenia.js (F01)');\n\n/* ---------- 7. Zlewki GFX dla F03 (mieszaniny do rozdzielania) — pracownia łączy je z zlewkami F01 ---------- */\nvar RXF3={\n f03PiasekWoda:{n:'Piasek + woda (zawiesina)',solid:{col:[214,190,140],eq:4,end:1,t:'powder',shape:'powder'},turb:.25,out:['nic'],qualitative:1,eq:'piasek(s) + H₂O(c) — brak reakcji',why:'Piasek nie rozpuszcza się: po zamieszaniu woda mętnieje, po chwili ziarna opadają na dno (sedymentacja), a nad osadem zostaje prawie klarowna woda. Dwie fazy — mieszanina niejednorodna.'},\n f03KredaWoda:{n:'Kreda + woda (zawiesina)',solid:{col:[246,246,242],eq:4,end:1,t:'powder',shape:'powder'},turb:.7,out:['nic'],qualitative:1,eq:'CaCO₃(s) + H₂O(c) — brak reakcji',why:'Drobna kreda tworzy mleczną zawiesinę, która opada wolno. Sączek zatrzymuje cząstki kredy, a przesącz jest klarowny.'}\n};\nif(rx)Object.keys(RXF3).forEach(function(k){if(!rx.get(k))rx.register(k,RXF3[k])});\n\npracownia('f03-rozdzielanie-v01','Pracownia: rozdzielanie mieszanin','Najpierw nazwij różnicę właściwości, potem wybierz metodę: zawiesiny (sedymentacja, dekantacja, sączenie), roztwór (odparowanie, krystalizacja).',\n [['Zawiesiny — ciało stałe nierozpuszczalne',['f03PiasekWoda','f03KredaWoda']],['Roztwór — substancja rozpuszczona',['f01SolWoda','f01Odparowanie']]],\n {f03PiasekWoda:{war:'piasek w zlewce z wodą, zamieszanie bagietką, odstawienie',wn:'Różnica: piasek nie rozpuszcza się i ma większą gęstość niż woda → sedymentacja, potem dekantacja albo sączenie.',bhp:'Szkło — ostrożnie; okulary.'},\n  f03KredaWoda:{war:'sproszkowana kreda w wodzie, mieszanie',wn:'Drobne cząstki opadają wolno — szybciej rozdzieli je sączenie przez bibułę; przesącz jest klarowny.',bhp:'Okulary; sączek nie może być przedziurawiony bagietką.'},\n  f01SolWoda:{war:'sól kuchenna w wodzie, mieszanie',wn:'Sól rozpuszcza się — przechodzi przez sączek razem z wodą. Sączenie nie zadziała; trzeba wykorzystać lotność wody (odparowanie, krystalizacja lub destylacja).',bhp:'Nie smakujemy substancji w pracowni.'},\n  f01Odparowanie:{war:'roztwór soli w parownicy, ogrzewanie',wn:'Woda odparowuje, sól krystalizuje na dnie — odzyskujemy substancję rozpuszczoną (wodę tracimy; chcąc ją odzyskać — destylacja).',bhp:'Gorąca parownica — szczypce; okulary (pryskanie pod koniec).'}},\n 'GFX.rx · rozszerzenia.js (F03)');\n\n/* ---------- 8. F05 — konstruktor: izotop / jon / inny pierwiastek + masa atomowa jako średnia ważona ----------\n   Model wielokrotnego użytku (F04, F05, F06, A01…): `f05-izotopy-v01`. Dane izotopów z silnika (CHE.DATA.ISOTOPES). */\n/* dane z silnika (bez lokalnej kopii): CHE.DATA.ELEMENTS_54 (symbol, nazwa) + CHE.DATA.ISOTOPES (A, masa, udział) */\nfunction izo(z){var E=(D.ELEMENTS_54||[]).filter(function(e){return e.z===z})[0];if(!E)return null;\n var L=(D.ISOTOPES||{})[E.s]||[];return [E.s,String(E.n||E.s).toLowerCase(),L.map(function(x){return [x.A,x.atomicMass,(x.abundance||0)*100]}).sort(function(a,b){return b[2]-a[2]||a[0]-b[0]})]}\nfunction supN(n){return String(n).replace(/[0-9]/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]})}\nfunction subN(n){return String(n).replace(/[0-9]/g,function(d){return '₀₁₂₃₄₅₆₇₈₉'[d]})}\nfunction chg(q){return q===0?'':(Math.abs(q)>1?supN(Math.abs(q)):'')+(q>0?'⁺':'⁻')}\nfunction pl(x,d){return x.toFixed(d).replace('.',',')}\n/* atomSVG — komponent wielokrotnego użytku (F05, F07, A01…): model atomu jako SVG, kolory jak w atlasie (_anon_004 bohr: elektrony wewnętrzne #2f8a55, walencyjne #b85f00).\n   o = {p, n, e, powloki:false|true, W:260}. powloki:false → elektrony na jednym okręgu (F05; powłoki to pojęcie F07);\n   powloki:true → powłoki K, L, M, N wg modelu szkolnego 2, 8, 8, … (do Z = 20; dalej uproszczenie — do weryfikacji). Zwraca otwarty <svg…> (zamknąć '<\/svg>'). */\nfunction atomSVG(o){var W=o.W||260,C=W/2,p=o.p|0,n=o.n|0,e=o.e|0,svg='<svg viewBox=\"0 0 '+W+' '+W+'\" width=\"100%\" style=\"max-width:'+W+'px;display:block;margin:auto\" role=\"img\" aria-label=\"Model atomu: '+p+' p, '+n+' n, '+e+' e\">';\n var N=p+n,sk=W/260;\n for(var i=0;i<N;i++){var a=i*2.39996,r=4.2*sk*Math.sqrt(i+.5);svg+='<circle cx=\"'+(C+r*Math.cos(a)).toFixed(1)+'\" cy=\"'+(C+r*Math.sin(a)).toFixed(1)+'\" r=\"'+(4.6*sk).toFixed(1)+'\" fill=\"'+(Math.floor((i+1)*p/N)>Math.floor(i*p/N)?'#d9534f':'#7f8da0')+'\" stroke=\"#fff\" stroke-width=\".8\"/>'}\n var sh=[];if(o.powloki){var cap=[2,8,8],left=e;for(var q=0;left>0;q++){var c=q<3?Math.min(cap[q],left):left;sh.push(c);left-=c}}else if(e)sh=[e];\n var R0=o.powloki?Math.max(40*sk,6*sk*Math.sqrt(N)+18*sk):104*sk,st=sh.length>1?(104*sk-R0)/(sh.length-1):0;\n sh.forEach(function(cnt,q){var R=sh.length>1?R0+q*st:(o.powloki?R0:104*sk),wal=o.powloki&&q===sh.length-1;\n  svg+='<circle cx=\"'+C+'\" cy=\"'+C+'\" r=\"'+R.toFixed(1)+'\" fill=\"none\" stroke=\"#9aa6b6\" stroke-dasharray=\"4 4\"/>';\n  if(o.powloki)svg+='<text x=\"'+(C+R*0.71+4).toFixed(1)+'\" y=\"'+(C-R*0.71-4).toFixed(1)+'\" font-size=\"'+(11*sk).toFixed(0)+'\" fill=\"#5b6773\">'+'KLMN'[q]+'<\/text>';\n  for(var k=0;k<cnt;k++){var b=k/cnt*2*Math.PI-Math.PI/2;svg+='<circle cx=\"'+(C+R*Math.cos(b)).toFixed(1)+'\" cy=\"'+(C+R*Math.sin(b)) ('+k+')'}}\n})();\n\n<\/script>\n<a class=\"skip-link\" href=\"#main\">Przejdź do treści<\/a>\n<main class=\"page\" id=\"main\">\n<section class=\"hero card\"><div class=\"hero-kicker\">\"ORG05 · kwasy karboksylowe\"<\/div><h1>\"Kwasy karboksylowe C1–C3 — kwas octowy i jego reakcje\"<\/h1><p class=\"lead\">\"Grupa –COOH łączy wiązanie C=O i grupę –OH na jednym węglu. Kwas octowy reaguje z metalami, tlenkami, zasadami i węglanami — ale nie z miedzią. Sprawdź dlaczego.\"<\/p><div class=\"tag-row\">[\"kwasy karboksylowe\", \"kwas octowy\"]<\/div><button type=\"button\" class=\"adv-toggle\" id=\"advToggle\" aria-pressed=\"false\">Pokaż treści akademickie<\/button><\/section>\n<details class=\"toc-item\" open><summary class=\"toc-summary\">Spis treści<\/summary><nav class=\"toc-links\"><a class=\"toc-link\" href=\"#minimum\">Minimum E8<\/a><a class=\"toc-link\" href=\"#jak-pracowac\">0.1. Jak pracować z lekcją<\/a><a class=\"toc-link\" href=\"#diagnoza\">0.2. Diagnoza<\/a><a class=\"toc-link\" href=\"#definicja\">1. Wykład — kwasy karboksylowe: grupa –COOH i szereg C1–C3<\/a><a class=\"toc-link\" href=\"#odczyn\">2. Wykład — słaby kwas, kwaśny odczyn<\/a><a class=\"toc-link\" href=\"#reakcje\">3. Wykład — cztery drogi reakcji kwasu octowego<\/a><a class=\"toc-link\" href=\"#spalanie\">4. Wykład — spalanie i otrzymywanie kwasu octowego<\/a><a class=\"toc-link\" href=\"#dosw\">5. Doświadczenie<\/a><a class=\"toc-link\" href=\"#zadania\">6. Zadania<\/a><a class=\"toc-link\" href=\"#zadania-adv\">7. Zadania konkursowe<\/a><\/nav><\/details>\n<p># LKO-ORG05 — Kwasy karboksylowe C1–C3 — kwas octowy i jego reakcje<\/p>\n<section id=\"minimum\" class=\"minimum-card\"><h3>Muszę umieć — 10 punktów<\/h3>\n<ol>\n<li>Zdefiniować kwas karboksylowy (grupa –COOH przy węglu) i podać wzór ogólny CₙH₂ₙ₊₁COOH.<\/li>\n<li>Zapisywać wzory, nazwy (zwyczajne i systematyczne) i masy molowe kwasów: metanowego 46, etanowego 60, propanowego 74 g/mol.<\/li>\n<li>Zapisywać równanie dysocjacji kwasu octowego i wyjaśniać, czym jest kwas słaby (dysocjacja częściowa, odwracalna).<\/li>\n<li>Podawać wynik testu wskaźnikami (lakmus czerwony, fenoloftaleina bezbarwna).<\/li>\n<li>Zapisywać reakcję kwasu octowego z metalami aktywnymi (Mg, Zn → sól + H₂) i uzasadniać, dlaczego miedź nie reaguje.<\/li>\n<li>Zapisywać reakcje z tlenkami metali (CuO → sól + H₂O) i z zasadami (neutralizacja → octan + H₂O).<\/li>\n<li>Zapisywać reakcję z węglanami (→ CO₂ + woda + octan) i wiązać ją z próbą na CO₂ (N01, LKO-pułapki).<\/li>\n<li>Nazwać sole kwasu octowego (octany) i zapisać octan sodu, octan miedzi(II), octan wapnia.<\/li>\n<li>Podawać dwie drogi otrzymywania kwasu octowego: utlenianie etanolu biologiczne (fermentacja octowa, bakterie octowe) i chemiczne (utleniaczem).<\/li>\n<li>Policzyć stechiometrię reakcji kwasu octowego w molach, gramach i objętościach (22,4 dm³/mol — LKO-ORG08).<\/li>\n<\/ol>\n<\/section>\n<div class=\"layer-legend\">\n\n<\/div>\n<div class=\"core-path\">\n<div class=\"cp-title\">Rdzeń lekcji — najpierw to<\/div>\n<ol>\n<li><a href=\"#definicja\">Grupa –COOH i szereg C1–C3<\/a> — wzory, nazwy, masy molowe.<\/li>\n<li><a href=\"#odczyn\">Słaby kwas, kwaśny odczyn<\/a> — dysocjacja częściowa i wskaźniki.<\/li>\n<li><a href=\"#reakcje\">Cztery drogi reakcji<\/a> — metale, tlenki, zasady, węglany.<\/li>\n<li><a href=\"#spalanie\">Spalanie i otrzymywanie<\/a> — fermentacja octowa i bilanse.<\/li>\n<li><a href=\"#zadania\">Zadania exam<\/a> i <a href=\"#zadania-adv\">zadania adv<\/a>.<\/li>\n<\/ol>\n<\/div>\n<section id=\"jak-pracowac\">\n<div class=\"part-heading\"><span class=\"part-num\">0.1<\/span> Jak pracować z lekcją<\/div>\n<p>Ta lekcja odpowiada na pytanie, które brzmi paradoksalnie: <strong>czym różni się kwas octowy od etanolu, skoro oba mają grupę –OH?<\/strong> Odpowiedź (grupa karboksylowa) otwiera cztery standardowe drogi reakcji — przepisz każdą z równań i sprawdź bilans samodzielnie, bo zadania konkursowe najczęściej sprawdzają właśnie poprawność wzorów soli (octany!) i dobór substratów. Zanim zaczniesz, odśwież: LKO-ORG03 (reakcja z sodem — kontrast z alkoholem), szereg aktywności metali (etap II) i N01 (próba na CO₂). Zadania adv wymagają sekwencji R09.<\/p>\n<\/section>\n<section id=\"diagnoza\">\n<div class=\"part-heading\"><span class=\"part-num\">0.2<\/span> Diagnoza<\/div>\n<ol>\n<li>Zapisz wzór grupy karboksylowej i wzór kwasu octowego.<\/li>\n<li>Zapisz równanie dysocjacji kwasu octowego i wyjaśnij znaczenie strzałki dwustronnej.<\/li>\n<li>Jaka barwa lakmusu i fenoloftaleiny w roztworze kwasu octowego?<\/li>\n<li>Czy miedź reaguje z kwasem octowym wydzielając wodór? Uzasadnij.<\/li>\n<li>Zbilansuj: Na₂CO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂.<\/li>\n<\/ol>\n<details class=\"answer\"><summary>Klucz diagnozy<\/summary>\n<ol>\n<li>–COOH; CH₃COOH (1 pkt).<\/li>\n<li>CH₃COOH ⇌ CH₃COO⁻ + H⁺; strzałka dwustronna = dysocjacja odwracalna, częściowa — kwas słaby (1 pkt).<\/li>\n<li>Lakmus czerwony, fenoloftaleina bezbarwna — odczyn kwaśny (1 pkt).<\/li>\n<li>Nie — miedź jest mniej aktywna od wodoru (szereg aktywności metali), nie wypiera H z kwasu (1 pkt).<\/li>\n<li>Na₂CO₃ + 2CH₃COOH → 2CH₃COONa + H₂O + CO₂↑ (1 pkt; bez dwójek — 0 pkt).<\/li>\n<\/ol>\n<p><strong>Rozliczenie:<\/strong> 5 pkt — przez rdzeń prosto do zadań exam; 3–4 pkt — pełna praca, nacisk na cztery drogi reakcji; 0–2 pkt — najpierw LKO-ORG03 (kontrast z alkoholami) i szereg aktywności metali, potem lekcja od początku.<\/p>\n<\/details>\n<\/section>\n<section id=\"definicja\">\n<div class=\"part-heading\"><span class=\"part-num\">1<\/span> Wykład — kwasy karboksylowe: grupa –COOH i szereg C1–C3<\/div>\n<p><strong>Kwas karboksylowy<\/strong> powstaje, gdy w węglowodorze atom wodoru zostaje zastąpiony grupą <strong>karboksylową –COOH<\/strong> — połączoną kowalencyjnie z atomem węgla. Nazwa grupy to zbitka dwóch części: <strong>karbonylowej (C=O)<\/strong> i <strong>hydroksylowej (–OH)<\/strong> — obie siedzą na tym samym atomie węgla.<\/p>\n<p>Zapis strukturalny grupy: <strong>R–C(=O)–OH<\/strong> — atom węgla grupy –COOH łączy podwójne wiązanie z tlenem (grupa <strong>karbonylowa<\/strong> C=O), pojedyncze wiązanie z grupą <strong>hydroksylową<\/strong> –OH i wiązanie z resztą R. Kwas octowy w zapisie strukturalnym: CH₃–C(=O)–OH. Grupa –COOH jest kwaśna, bo sąsiedztwo C=O osłabia wiązanie O–H.<\/p>\n<p>Wzór ogólny kwasów monokarboksylowych nasyconych: <strong>CₙH₂ₙ₊₁COOH<\/strong>, gdzie n to liczba atomów węgla w reszcie węglowodorowej (dla kwasu metanowego n = 0, dla octowego n = 1). Jeśli policzysz <strong>wszystkie<\/strong> atomy węgla, wzór to CₙH₂ₙO₂ (np. kwas octowy: C₂H₄O₂).<\/p>\n<p>Pierwsi członkowie szeregu:<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>n<\/th><th>Nazwa systematyczna<\/th><th>Nazwa zwyczajowa<\/th><th>Wzór<\/th><th>M<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>0<\/td><td>kwas metanowy<\/td><td>mrówkowy<\/td><td>HCOOH<\/td><td>2·1 + 12 + 2·16 = <strong>46 g/mol<\/strong><\/td><\/tr>\n<tr><td>1<\/td><td>kwas etanowy<\/td><td>octowy<\/td><td>CH₃COOH<\/td><td>2·12 + 4·1 + 2·16 = <strong>60 g/mol<\/strong><\/td><\/tr>\n<tr><td>2<\/td><td>kwas propanowy<\/td><td>propionowy<\/td><td>C₂H₅COOH<\/td><td>3·12 + 6·1 + 2·16 = <strong>74 g/mol<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Kwasy metanowy, octowy i propanowy to bezbarwne ciecze o ostrym, drażniącym zapachu, mieszające się z wodą w każdej proporcji. Temperatury wrzenia rosną z długością łańcucha: metanowy ≈ 101 °C, octowy ≈ 118 °C, propanowy ≈ 141 °C. Stężone kwasy (zwłaszcza metanowy i „lodowaty” octowy) są <strong>żrące<\/strong> — rozcieńczony ocet w kuchni to roztwór kilku–kilkunastu procent.<\/p>\n<p>Szereg homologiczny ze stałym krokiem CH₂ — jak u alkanów, alkenów i alkoholi (ORG01–ORG03). Kwas metanowy to przypadek graniczny: przy jego węglu nie ma reszty R, tylko sam H — jest najprostszym kwasem karboksylowym.<\/p>\n<p>Nazwy soli: <strong>octany<\/strong> (od kwasu octowego), <strong>mrówczany<\/strong> (od mrówkowego), <strong>propioniany<\/strong> (od propionowego). Octan sodu CH₃COONa; octan miedzi(II) (CH₃COO)₂Cu; octan wapnia (CH₃COO)₂Ca.<\/p>\n<p>Pułapka na równość mas: <strong>kwas metanowy i etanol mają tę samą masę molową (46 g/mol)<\/strong> — ale to nie są izomery! Ich wzory sumaryczne są różne (CH₂O₂ vs C₂H₆O); zgadzają się tylko masy. W zadaniu „czy to izomery?\" zawsze porównuj pełne wzory sumaryczne, nie masy molowe.<\/p>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Mrówki, pokrzywy i kwas metanowy<\/span>\n<p>Kwas metanowy (mrówkowy) zawdzięcza nazwę historii: po raz pierwszy wyodrębniono go z destylacji mrówek — użądlenie mrówki i parzący kontakt z włoskami pokrzywy wiąże się m.in. z działaniem tego kwasu na skórę. To przykład, jak nazwy zwyczajowe chemii organicznej zapisują dawne obserwacje naturalistów: mrówkowy, octowy (z octu!), masłowy (zapach zjełczałego masła) — każda nazwa to zapis miejsca znalezienia kwasu.<\/p>\n<\/div>\n<figure class=\"lk-fig\" data-klocek=\"wzor-2d\" data-opt=\"{&quot;smiles&quot;: &quot;CC(=O)O&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Kwas octowy: wzór strukturalny z grupą –COOH<\/figcaption><\/figure>\n<!-- OPIS: Wzór strukturalny kwasu octowego: grupa metylowa połączona z grupą karboksylową –COOH, w której atom węgla ma wiązanie podwójne z tlenem i grupę –OH. -->\n<\/section>\n<section id=\"odczyn\">\n<div class=\"part-heading\"><span class=\"part-num\">2<\/span> Wykład — słaby kwas, kwaśny odczyn<\/div>\n<p>Roztwory kwasów karboksylowych mają <strong>odczyn kwaśny<\/strong>: lakmus czerwienieje, fenoloftaleina pozostaje bezbarwna, wskaźnik uniwersalny przechodzi w żółto-pomarańczowo-czerwone odcienie. Za kwasowość odpowiada atom wodoru z grupy –COOH — w wodzie może odłączać się jako <strong>kation H⁺<\/strong>:<\/p>\n<p><strong>CH₃COOH ⇌ CH₃COO⁻ + H⁺<\/strong><\/p>\n<p>W roztworze wodnym proton przyłącza się do cząsteczki wody i powstaje jon hydroniowy H₃O⁺: CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺. Zapis z H⁺ jest uproszczeniem stosowanym w zadaniach; oba zapisy oznaczają to samo.<\/p>\n<p>Dwie kluczowe cechy tej dysocjacji:<\/p>\n<ol>\n<li><strong>Jest odwracalna (strzałka ⇌)<\/strong> — tylko <strong>część<\/strong> cząsteczek oddaje H⁺; reszta pozostaje w postaci niezdysocjowanej. Dlatego kwas octowy nazywamy <strong>kwasem słabym<\/strong> i <strong>słabym elektrolitem<\/strong>: roztwór przewodzi prąd, ale słabo (mało jonów) — w przeciwieństwie do HCl, który dysocjuje niemal całkowicie (kwas mocny).<\/li>\n<li><strong>Odłącza się tylko H z grupy –COOH<\/strong> — wodory grupy CH₃ pozostają przywiązane do węgla (organika: C–H nie dysocjuje w wodzie).<\/li>\n<\/ol>\n<p>To odpowiada na pytanie z początku lekcji: w etanolu –OH jest „cicha\" (nie oddaje H⁺ — ORG03), a w kwasie octowym –COOH jest kwaśna, bo sąsiedztwo wiązania C=O osłabia wiązanie O–H i ułatwia oddanie protonu. Te same litery OH, inna otoczka — inna chemia.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — dlaczego „słaby kwas\" wciąż jest kwasem<\/span>\n<p>Słabość kwasu dotyczy <strong>stopnia dysocjacji<\/strong>, nie siły działania. Kwas octowy dysocjuje częściowo (⇌), więc roztwór ma mało jonów H⁺ — ale te jony działają: czerwienieją lakmus, reagują z metalami i węglanami. Zdanie „kwas octowy nie przewodzi prądu, bo jest słaby\" jest błędne — przewodzi, tylko słabo (mało jonów, nie ich brak).<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Lód octowy — kwas, który krzepnie w chłodzie<\/span>\n<p>Czysty (bezwodny) kwas octowy krzepnie już w temperaturze ok. 17 °C (dokładnie ok. 16,6 °C) — w nieogrzewanym laboratorium zimą butelka zamienia się w blok przypominający lód, stąd historyczna nazwa <strong>kwas octowy lodowaty<\/strong> (glacjalny). To wygodna puenta własności fizycznych: nie każda „kwaśna\" ciecz jest taka sama — ocet stołowy (roztwór kilku–kilkunastu procent) zamarza dopiero w zamrażarce, bo woda obniża temperaturę krzepnięcia (przypomnij wykresy R02 — analogia dla roztworów).<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — kwas słaby, mocny i etanol<\/span>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Substancja<\/th><th>Czy oddaje H⁺?<\/th><th>Odczyn<\/th><th>Przewodnictwo<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Kwas octowy<\/td><td>częściowo<\/td><td>kwasowy<\/td><td>słabe<\/td><\/tr>\n<tr><td>Kwas solny (HCl)<\/td><td>prawie całkowicie<\/td><td>kwasowy<\/td><td>dobre<\/td><\/tr>\n<tr><td>Etanol<\/td><td>praktycznie nie<\/td><td>obojętny<\/td><td>bardzo słabe<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/div>\n<\/section>\n<section id=\"reakcje\">\n<div class=\"part-heading\"><span class=\"part-num\">3<\/span> Wykład — cztery drogi reakcji kwasu octowego<\/div>\n<p>Kwas octowy reaguje jak typowy kwas — z czterema klasami partnerów. Każda droga to osobne równanie do pamięci:<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Przypomnienie — wartościowość kationu<\/span>\n<p>Liczba reszt octanowych zrównuje ładunek kationu: Na⁺ → CH₃COONa; Mg²⁺, Ca²⁺ i Cu²⁺ (dwuwartościowe) potrzebują dwóch reszt → (CH₃COO)₂Mg, (CH₃COO)₂Ca, (CH₃COO)₂Cu. Wzór soli musi być obojętny elektrycznie.<\/p>\n<\/div>\n<p><strong>Droga 1: metale aktywne → octan + wodór.<\/strong><\/p>\n<p>Mg + 2CH₃COOH → (CH₃COO)₂Mg + H₂↑\nZn + 2CH₃COOH → (CH₃COO)₂Zn + H₂↑<\/p>\n<figure class=\"lk-fig\" data-klocek=\"bilans-rownania\" data-opt=\"{&quot;rownanie&quot;: &quot;Mg + CH3COOH -&gt; Mg(CH3COO)2 + H2&quot;, &quot;przyklady&quot;: &quot;Zn + CH3COOH -&gt; Zn(CH3COO)2 + H2; Na + CH3COOH -&gt; CH3COONa + H2&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Bilans atomów: magnez i kwas octowy<\/figcaption><\/figure>\n<!-- OPIS: Tabela bilansu atomów reakcji Mg + CH₃COOH → Mg(CH₃COO)₂ + H₂: liczba atomów Mg, C, H i O po obu stronach. Magnez oddaje kationy, reszta octanowa dwukrotnie — współczynnik 2 przy kwasie uzgadnia bilans. Wniosek: reszta octanowa bierze udział w reakcji, a wodór wychodzi jako cząsteczkowy H₂. -->\n<p>Reagują tylko metale <strong>aktywniejsze od wodoru<\/strong> (szereg aktywności: K, Na, Ca, Mg, Al, Zn, Fe...). <strong>Miedź, srebro i złoto nie reagują<\/strong> — są mniej aktywne od wodoru i nie wypierają go z kwasu. Cu nie wypiera wodoru z kwasu, więc równanie Cu + 2CH₃COOH → (CH₃COO)₂Cu + H₂↑ jest fałszywe — to najczęstszy fałszywy zapis w zadaniach. (Powolne zazielenienie miedzi w occie na powietrzu to inna reakcja — z udziałem tlenu, nie wypieranie wodoru.)<\/p>\n<p>Z sodem kwas octowy reaguje tak jak etanol — 2CH₃COOH + 2Na → 2CH₃COONa + H₂↑ — ale <strong>znacznie gwałtowniej<\/strong>, bo atom H w –COOH jest dużo bardziej ruchliwy niż w –OH alkoholu. Odczyn roztworu rozstrzyga: roztwór kwasu czerwieni lakmus, roztwór etanolu — nie.<\/p>\n<p><strong>Droga 2: tlenki metali → octan + woda.<\/strong><\/p>\n<p>CuO + 2CH₃COOH → (CH₃COO)₂Cu + H₂O<\/p>\n<p>Czarny tlenek miedzi(II) rozpuszcza się w gorącym kwasie, dając niebieskawy roztwór octanu miedzi(II). Tlenki reagują z kwasem nawet wtedy, gdy sam metal nie reaguje — bo tlenek zasadowy reaguje z kwasem, tworząc sól i wodę; to nie zależy od aktywności metalu.<\/p>\n<p><strong>Droga 3: zasady → neutralizacja → octan + woda.<\/strong><\/p>\n<p>NaOH + CH₃COOH → CH₃COONa + H₂O<\/p>\n<p>Klasyczna neutralizacja: kation zasady łapie resztę octanową, H⁺ i OH⁻ tworzą wodę.<\/p>\n<p><strong>Droga 4: węglany → octan + woda + dwutlenek węgla.<\/strong><\/p>\n<p>Na₂CO₃ + 2CH₃COOH → 2CH₃COONa + H₂O + CO₂↑\nCaCO₃ + 2CH₃COOH → (CH₃COO)₂Ca + H₂O + CO₂↑<\/p>\n<p>Domowy przykład: soda oczyszczona z octem — <strong>NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂↑<\/strong> (współczynniki po 1). Ta sama reakcja usuwa kamień kotłowy: CaCO₃ + 2CH₃COOH → (CH₃COO)₂Ca + H₂O + CO₂↑. <strong>Uwaga:<\/strong> nie mieszaj octu z płynami wybielającymi — wydziela się toksyczny chlor.<\/p>\n<p>Wydzielony CO₂ wykrywa próba z wodą wapienną (mętnienie — N01, LKO-pułapki). To najbardziej „pokazowa\" z dróg — i najczęściej liczona w zadaniach objętościowych.<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — cztery drogi w jednej tabeli<\/span>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Partner<\/th><th>Produkty<\/th><th>Przykład<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>metal aktywny (Mg, Zn)<\/td><td>octan + H₂↑<\/td><td>Mg + 2CH₃COOH → (CH₃COO)₂Mg + H₂↑<\/td><\/tr>\n<tr><td>tlenek metalu (CuO)<\/td><td>octan + H₂O<\/td><td>CuO + 2CH₃COOH → (CH₃COO)₂Cu + H₂O<\/td><\/tr>\n<tr><td>zasada (NaOH)<\/td><td>octan + H₂O<\/td><td>NaOH + CH₃COOH → CH₃COONa + H₂O<\/td><\/tr>\n<tr><td>węglan (CaCO₃, Na₂CO₃)<\/td><td>octan + H₂O + CO₂↑<\/td><td>CaCO₃ + 2CH₃COOH → (CH₃COO)₂Ca + H₂O + CO₂↑<\/td><\/tr>\n<tr><td>Wspólny produkt: <strong>octan<\/strong> — reszta CH₃COO⁻ z kationem partnera. Przed napisaniem równania sprawdź: wartościowość metalu (octan jest jednowartościowy!) i aktywność metalu.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/div>\n<div class=\"card card-error\">\n<span class=\"card-label\">Trzy fałszywe zapisy, które kosztują punkty<\/span>\n<p>(1) „Cu + 2CH₃COOH → (CH₃COO)₂Cu + H₂\" — miedź nie wypiera wodoru (mniej aktywna); reakcja nie biegnie. (2) „CaCO₃ + CH₃COOH → CaCH₃COO + ...\" — zła sól: przy wapniu(II) potrzebne <strong>dwie<\/strong> reszty octanowe, (CH₃COO)₂Ca, i podwojony kwas. (3) „CH₃COOH → CH₃COO⁻ + H⁺\" ze strzałką jednostronną — dla kwasu słabego obowiązuje strzałka odwracalna ⇌. Każdy z tych błędów to pytanie konkursowe w czystej postaci.<\/p>\n<\/div>\n<div class=\"card card-error\">\n<span class=\"card-label\">Typowe błędy uczniów — jeszcze cztery pułapki<\/span>\n<ul>\n<li>NaCl + CH₃COOH → reakcja <strong>nie zachodzi<\/strong> — NaCl to sól kwasu mocnego, a kwas octowy nie wyprze HCl z soli.<\/li>\n<li>„Słaby kwas daje mniej H₂” — błędne; liczy się liczba moli kwasu, a nie stopień dysocjacji (zadanie C).<\/li>\n<li>Zapis dysocjacji kwasu słabego bez strzałki odwracalnej ⇌.<\/li>\n<li>Mylenie octanów (soli) z estrami octanowymi (ORG06) — octan sodu to sól, octan etylu to ester.<\/li>\n<\/ul>\n<\/div>\n<figure class=\"lk-fig\" data-klocek=\"karta-bhp\" data-opt=\"{}\"><div class=\"lk-fig-body\"><\/div><figcaption>Zasady pracy i pierwsza pomoc<\/figcaption><\/figure>\n<!-- OPIS: Cztery rozwijane karty: przed doświadczeniem (okulary, fartuch, czytanie opisu), kwasy i zasady (kwas do wody, płukanie 15 minut), ogrzewanie (probówka ukośnie, otworem od siebie) oraz oparzenie i zranienie; przy poważnym urazie wołamy nauczyciela. -->\n<figure class=\"lk-fig\" data-klocek=\"probowki-odczyn\" data-opt=\"{&quot;tuby&quot;: &quot;CH3COOH + Mg:bezbarwny:bezbarwny:gaz,CH3COOH + Na2CO3:bezbarwny:bezbarwny:gaz,CH3COOH + oranż metylowy:zolty:czerwony:brak&quot;}\"><div class=\"lk-fig-body\"><\/div><figcaption>Reakcje kwasu octowego: metal, węglan, wskaźnik<\/figcaption><\/figure>\n<!-- OPIS: Trzy probówki z kwasem octowym: z magnezem wydziela się wodór, z węglanem sodu — dwutlenek węgla (pęcherzyki gazu), a oranż metylowy zmienia barwę z żółtej na czerwoną, co świadczy o odczynie kwasowym. -->\n<\/section>\n<section id=\"spalanie\">\n<div class=\"part-heading\"><span class=\"part-num\">4<\/span> Wykład — spalanie i otrzymywanie kwasu octowego<\/div>\n<p><strong>Spalanie.<\/strong> Kwasy karboksylowe — jak wszystkie związki organiczne — spalają się do CO₂ i H₂O:<\/p>\n<ul>\n<li><strong>CH₃COOH + 2O₂ → 2CO₂ + 2H₂O<\/strong> (O: 2 + 4 = 6 = 4 + 2 ✔)<\/li>\n<li><strong>2C₂H₅COOH + 7O₂ → 6CO₂ + 6H₂O<\/strong> (H: 12 = 12 ✔; O: 4 + 14 = 18 = 12 + 6 ✔)<\/li>\n<\/ul>\n<p><strong>Otrzymywanie — fermentacja octowa.<\/strong> Ocet powstał w kuchni na długo przed definicją kwasu: wino (etanol) na powietrzu kwaśnieje. Robią to <strong>bakterie octowe<\/strong>, które utleniają etanol tlenem z powietrza. To <strong>utlenianie tlenowe<\/strong> — tlen jest potrzebny, a w odróżnieniu od fermentacji alkoholowej (bez tlenu) nazwa „fermentacja” bywa tu myląca:<\/p>\n<p><strong>C₂H₅OH + O₂ →(bakterie octowe) CH₃COOH + H₂O<\/strong><\/p>\n<p>Sprawdź bilans: C 2 = 2 ✔; H 6 = 4 + 2 ✔; O 3 = 2 + 1 ✔. Ta reakcja zamyka łańcuch organiczny: glukoza →(fermentacja alkoholowa, ORG07) etanol →(fermentacja octowa) kwas octowy →(estryfikacja, ORG06) ester. Trzy kroki, trzy różne drogi przemiany — łańcuchy takie wracają w zadaniach wojewódzkich co roku.<\/p>\n<p><strong>Utlenianie bez bakterii<\/strong> (chemiczne) — etanol można utlenić do kwasu octowego utleniaczami laboratoryjnymi; na poziomie konkursu wystarczy zapamiętać schemat: <strong>etanol → etanal (aldehyd octowy, CH₃CHO) → kwas octowy<\/strong> (dwa stopnie utlenienia grupy –CH₂OH przez –CHO do –COOH).<\/p>\n<div class=\"card card-understand\">\n<span class=\"card-label\">W skrócie — łańcuch trzech fermentacji/utlenień<\/span>\n<p>Glukoza: C₆H₁₂O₆ →(drożdże) 2C₂H₅OH + 2CO₂.\nEtanol: C₂H₅OH + O₂ →(bakterie octowe) CH₃COOH + H₂O.\nKwas octowy: CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O (ORG06).\nKażdy krok ma własny stosunek molowy — w zadaniach łańcuchowych licz mole etapami, bez skrótów.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Kwasy tłuszczowe — dalsi członkowie rodziny<\/span>\n<p>Szereg kwasów karboksylowych nie kończy się na C3. Kwas stearynowy (C₁₇H₃₅COOH, M = 284 g/mol — wartość podręcznikowa) i palmitynowy (C₁₅H₃₁COOH) to <strong>dalsze homologi<\/strong> obecne w tłuszczach: każda cząsteczka tłuszczu to glicerol połączone trzema resztami kwasów tłuszczowych (pełny obraz — ORG06). Te same grupy –COOH, te same reakcje z zasadami — tylko na twardym, tłustym materiale. Chemia z tej lekcji działa w kostce masła tak samo jak w probówce z octem.<\/p>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Sprawdź się sam — bez zaglądania<\/span>\n<ol>\n<li>Którą część grupy –COOH nazywamy karbonylową, a którą hydroksylową?<\/li>\n<li>Dlaczego kwas octowy jest kwasem słabym, a mimo to czerwieni lakmus?<\/li>\n<li>Z którymi partnerami (Cu, Mg, CuO, NaCl, CaCO₃, NaOH) kwas octowy zareaguje?<\/li>\n<li>Zapisz równanie reakcji kwasu octowego z KOH i podaj nazwę soli.<\/li>\n<li>Czy 0,1 mol HCl i 0,1 mol CH₃COOH dadzą z nadmiarem Mg tyle samo wodoru? Uzasadnij.<\/li>\n<\/ol>\n<\/div>\n<div class=\"card card-understand\">\n<span class=\"card-label\">Mnemotechniki<\/span>\n<p>„Kwas = H⁺ do oddania”. „Metal – tlenek – zasada – węglan”: z każdym partnerem kwas tworzy octan; metal daje H₂, tlenek i zasada dają wodę, węglan daje wodę i CO₂. „Octan zawsze ma CH₃COO⁻ + kation.”<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Kolbe i „siła życiowa” (1845)<\/span>\n<p>W 1845 r. Hermann Kolbe otrzymał kwas octowy z substancji nieorganicznych. Obalił przez to przekonanie, że związki organiczne mogą powstawać tylko w organizmach żywych. Ocet był znany w kuchniach od wieków — chemia zrobiła z niego przedmiot badań dopiero w XIX w.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Ocet w kuchni — konserwant i bezpieczeństwo<\/span>\n<p>Kwas octowy (E260) hamuje rozwój bakterii, dlatego ocet konserwuje marynaty i ogórki. Przy odkamienianiu czajnika CaCO₃ z kamienia reaguje z octem, tworząc rozpuszczalny octan wapnia. Nie mieszaj octu z wybielaczem zawierającym podchloryn — wydziela się toksyczny chlor. Stężony kwas octowy jest żrący; w kuchni używa się roztworów kilku–kilkunastu procent.<\/p>\n<\/div>\n<div class=\"card card-extra\">\n<span class=\"card-label\">Kwas octowy w organizmie — acetylo-CoA (wzmianka)<\/span>\n<p>W metabolizmie komórkowym kwas octowy występuje jako pochodna połączona z koenzymem A (acetylo-CoA) — kluczowy związek przemian węglowodanów, tłuszczów i białek. Na poziomie E8 wystarczy wiedzieć, że reszta CH₃CO jest jednym z podstawowych „klocków” życia.<\/p>\n<\/div>\n<div class=\"card card-adv\">\n<span class=\"card-label\">Dimery — dlaczego kwas octowy wrze tak wysoko<\/span>\n<p>Dwie cząsteczki kwasu octowego łączą się dwoma wiązaniami wodorowymi, tworząc dimer. Dlatego kwas octowy (118 °C) i etanol (78 °C), mimo tej samej liczby atomów węgla, różnią się temperaturą wrzenia o 40 stopni.<\/p>\n<\/div>\n<\/section>\n<section id=\"dosw\">\n<div class=\"part-heading\"><span class=\"part-num\">5<\/span> Doświadczenie<\/div>\n<div class=\"exp-card\"><h5>Doświadczenie 1 — Stacja kwasu octowego: próby i probówki porównawcze<\/h5><div class=\"exp-grid\"><\/div><p><strong>Problem:<\/strong> Jak jednym zestawem prób wykazać, że kwas octowy zachowuje się jak kwas (wskaźniki, metal, węglan), ale też jest kwasem słabym?<\/p>\n<p><strong>Hipoteza:<\/strong> Roztwór kwasu octowego czerwieni lakmus, reaguje z magnezem wydzielając H₂ i z węglanem sodu wydzielając CO₂; reakcje biegną, choć kwas jest słabym elektrolitem.<\/p>\n<p><strong>Sprzęt:<\/strong> 6 probówek ze stojakiem, roztwór kwasu octowego (np. ocet rozcieńczony), roztwór HCl o tym samym stężeniu (porównawczo), wskaźnik uniwersalny, lakmus, fenoloftaleina, pasek magnezu, węglan sodu, woda wapienna, rurka doprowadzająca, okulary i rękawice.<\/p>\n<p><strong>Przebieg:<\/strong>\n1. Do probówki 1: kwas + pasek wskaźnika uniwersalnego <strong>albo<\/strong> lakmusu (jeden wskaźnik w jednej probówce) — obserwuj barwę. Do osobnej probówki 1a: kwas + kropla fenoloftaleiny — obserwuj.\n2. Do probówki 2: kwas + pasek magnezu — obserwuj bąbelki; po chwili zbierz gaz do probówki i podpal (próba na H₂).\n3. Do probówki 3: kwas + szczypta węglanu sodu — obserwuj bąbelki; gaz kieruj do wody wapiennej.\n4. Probówka kontrolna: kwas + pasek miedzi — obserwuj brak zmian.\n5. Probówka porównawcza A: HCl o tym samym stężeniu co kwas octowy + pasek magnezu (tej samej wielkości).\n6. Probówka porównawcza B: kwas octowy + pasek magnezu (z punktu 2) — porównaj tempo wydzielania gazu.<\/p>\n<p><strong>Obserwacje:<\/strong> (1) wskaźnik uniwersalny czerwono-pomarańczowy, lakmus czerwony — odczyn kwaśny; (1a) fenoloftaleina bezbarwna; (2) na magnezie bąbelki gazu, który zapala się z krótkim »szczeknięciem« — H₂; (3) intensywne bąbelki, woda wapienna mętnieje — CO₂; (4) miedź bez zmian — brak reakcji; (5) z HCl gaz wydziela się intensywnie od początku; (6) z kwasem octowym — wyraźnie wolniej.<\/p>\n<p><strong>Wniosek:<\/strong> Kwas octowy ma odczyn kwaśny i reaguje jak kwas: metal aktywny → H₂ (Mg + 2CH₃COOH → (CH₃COO)₂Mg + H₂↑), węglan → CO₂ (Na₂CO₃ + 2CH₃COOH → 2CH₃COONa + H₂O + CO₂↑). Miedź nie reaguje (mniej aktywna od wodoru). Porównanie z HCl o tym samym stężeniu pokazuje, że w roztworze kwasu octowego jest mniej jonów H⁺ (kwas słaby) — gaz wydziela się wolniej. Końcowa ilość wodoru z takiej samej liczby moli obu kwasów (przy nadmiarze magnezu) jest jednak taka sama.<\/p>\n<p><strong>Bezpieczeństwo:<\/strong> kwas — unikać kontaktu z oczami, po kontakcie przemyć wodą; zapłon wodoru tylko w małej probówce, stroną od twarzy; mętną wodę wapienną i roztwory po reakcjach zutylizować zgodnie z instrukcją szkolną.<\/p><\/div>\n<\/section>\n<section id=\"zadania\">\n<div class=\"part-heading\"><span class=\"part-num\">6<\/span> Zadania<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 1 (4 pkt) — Szereg kwasów C1–C3<\/span>\n<p>(a) Podaj wzór ogólny kwasów monocarboksylowych nasyconych. (b) Zapisz wzory, nazwy systematyczne i zwyczajowe kwasów C1–C3 z masami molowymi. (c) Uzasadnij jednym zdaniem, że tworzą szereg homologiczny. (d) Który z nich ma tę samą masę molową co etanol — i dlaczego to wciąż nie są izomery?<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) CₙH₂ₙ₊₁COOH (1 pkt). (b) HCOOH — kwas metanowy (mrówkowy), CH₃COOH — kwas etanowy (octowy), C₂H₅COOH — kwas propanowy (propionowy) (1 pkt: wzory i nazwy); M = 46, 60, 74 g/mol (1 pkt). (c) i (d) razem 1 pkt: sąsiednie wzory różnią się o stały krok CH₂, budowa i własności są podobne; kwas metanowy i etanol mają oba M = 46 g/mol, ale nie są izomerami — różne wzory sumaryczne (CH₂O₂ vs C₂H₆O); zgodność mas nie wystarcza.<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 2 (5 pkt) — Cztery równania kwasu octowego<\/span>\n<p>Zapisz zbilansowane równania reakcji kwasu octowego z: (a) magnezem, (b) tlenkiem miedzi(II), (c) wodorotlenkiem potasu, (d) węglanem wapnia. (e) Nazwij produkty organiczne każdej reakcji.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) Mg + 2CH₃COOH → (CH₃COO)₂Mg + H₂↑ (1 pkt). (b) CuO + 2CH₃COOH → (CH₃COO)₂Cu + H₂O (1 pkt). (c) KOH + CH₃COOH → CH₃COOK + H₂O (1 pkt). (d) CaCO₃ + 2CH₃COOH → (CH₃COO)₂Ca + H₂O + CO₂↑ (1 pkt). (e) Produkty organiczne to <strong>octany<\/strong>: octan magnezu, octan miedzi(II), octan potasu, octan wapnia (1 pkt; akceptowane też wzory soli).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 3 (4 pkt) — Słaby kwas: dysocjacja i przewodnictwo<\/span>\n<p>(a) Zapisz równanie dysocjacji kwasu octowego, podkreślając jej odwracalność. (b) Wyjaśnij, co znaczy „kwas słaby\" — porównaj z HCl. (c) Uczeń stwierdził: „kwas octowy nie przewodzi prądu, bo jest słabym kwasem\" — popraw to zdanie. (d) Podaj wynik testu dwóch wskaźników (lakmus, fenoloftaleina) dla roztworu kwasu octowego.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) CH₃COOH ⇌ CH₃COO⁻ + H⁺ (1 pkt; przy strzałce jednostronnej — 0 pkt). (b) Dysocjuje częściowo i odwracalnie — tylko część cząsteczek oddaje H⁺; HCl dysocjuje niemal całkowicie (kwas mocny) (1 pkt). (c) Poprawnie: roztwór kwasu octowego <strong>przewodzi prąd słabo<\/strong> — jest słabym elektrolitem, bo zawiera mało jonów (nie zero) (1 pkt). (d) Lakmus czerwony, fenoloftaleina bezbarwna — odczyn kwaśny (1 pkt).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie 4 (5 pkt) — Magnez i kwas octowy: trzy jednostki<\/span>\n<p>Reakcja: Mg + 2CH₃COOH → (CH₃COO)₂Mg + H₂↑. Do <strong>12 g magnezu<\/strong> dodano <strong>nadmiar<\/strong> kwasu octowego. Oblicz: (a) liczbę moli magnezu; (b) masę kwasu octowego zużytego w reakcji; (c) masę wydzielonego wodoru; (d) objętość wodoru w warunkach normalnych; (e) dlaczego w zadaniu założono nadmiar kwasu — co gwarantuje?<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) n(Mg) = 12 g / 24 g/mol = <strong>0,5 mol<\/strong> (1 pkt). (b) Stosunek 1 : 2 → n(kwasu) = 1 mol → m = 1 · 60 = <strong>60 g<\/strong> (1 pkt). (c) n(H₂) = 0,5 mol → m = 0,5 · 2 = <strong>1 g<\/strong> (1 pkt). (d) V = 0,5 · 22,4 = <strong>11,2 dm³<\/strong> (1 pkt). (e) Nadmiar kwasu gwarantuje, że <strong>cały<\/strong> magnez zareaguje — wyniki (b)–(d) można liczyć wprost z moli magnezu (R08) (1 pkt).<\/p>\n<\/details>\n<\/section>\n<section id=\"zadania-adv\">\n<div class=\"part-heading\"><span class=\"part-num\">7<\/span> Zadania konkursowe<\/div>\n<details class=\"adv\"><summary>Zadanie 5 (5 pkt) — Dwa fałszywe zapisy ucznia <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Uczeń zapisał: (1) „Cu + 2CH₃COOH → (CH₃COO)₂Cu + H₂↑ — miedź rozpuszcza się w occie, bo każdy metal reaguje z kwasem\"; (2) „CaCO₃ + CH₃COOH → CaCH₃COO + H₂O + CO₂↑\".\n(a) Oceń zapis (1): sprawdź poprawność chemiczną (szereg aktywności) i napisz, co zaobserwowano by w rzeczywistości po zanurzeniu miedzi w occie.\n(b) Oceń zapis (2): wskaż oba błędy (wzór soli i bilans) i zapisz poprawne równanie.\n(c) Uczeń bronił się: „octan wapnia ma wzór CaCH₃COO, bo wapń jest jednowartościowy\". Popraw to zdanie.\n(d) Podaj wspólną cechę czterech poprawnych dróg reakcji kwasu octowego — co zawsze powstaje?<\/p>\n<\/div><\/details>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) Zapis fałszywy: miedź jest <strong>mniej aktywna od wodoru<\/strong>, nie wypiera H z kwasu (1 pkt). Obserwacja: brak zmian — pasek miedzi pozostaje nietknięty, bąbelków brak (1 pkt). (b) Błędy: zła sól (Ca jest dwuwartościowy → potrzeba dwóch reszt octanowych) i niezbilansowany kwas (1 pkt). Poprawnie: CaCO₃ + 2CH₃COOH → (CH₃COO)₂Ca + H₂O + CO₂↑ (1 pkt). (c) i (d) razem 1 pkt. (c) Wapń w związkach jest <strong>dwuwartościowy<\/strong> (Ca²⁺), a reszta octanowa CH₃COO⁻ jest jednowartościowa — stąd dwie reszty na jeden kation: (CH₃COO)₂Ca. (d) W każdej z czterech dróg powstaje <strong>sól kwasu octowego — octan<\/strong> (reszta CH₃COO⁻ z kationem partnera).<\/p>\n<\/details>\n<details class=\"adv\"><summary>Zadanie 6 (7 pkt) — Łańcuch: etanol → kwas octowy → CO₂ <span class=\"adv-tag\">poziom ambitny<\/span><\/summary><div class=\"adv-body\">\n<p>Przeprowadzono fermentację octową <strong>9,2 g etanolu<\/strong> (C₂H₅OH + O₂ →(bakterie octowe) CH₃COOH + H₂O) z wydajnością <strong>80%<\/strong>. Otrzymany kwas octowy poddano reakcji z <strong>nadmiarem węglanu wapnia<\/strong> (CaCO₃ + 2CH₃COOH → (CH₃COO)₂Ca + H₂O + CO₂↑). Masy molowe: M(C₂H₅OH) = 46, M(CH₃COOH) = 60, M(CO₂) = 44, M(CaCO₃) = 100, M((CH₃COO)₂Ca) = 158, M(H₂O) = 18 g/mol.\n(a) Oblicz liczbę moli etanolu.\n(b) Oblicz liczbę moli i masę rzeczywistą otrzymanego kwasu octowego.\n(c) Oblicz objętość CO₂ (warunki normalne) wydzielonego w reakcji z CaCO₃.\n(d) Oblicz masę CO₂ z punktu (c) i sprawdź ją z bilansu masy reakcji z węglanem (porównaj sumę mas substratów z sumą mas produktów dla liczby moli z (b)).\n(e) Uczeń założył, że na 1 mol etanolu przypada 1 mol CO₂ — bez liczenia. Oceń to założenie.<\/p>\n<\/div><\/details>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) n(C₂H₅OH) = 9,2/46 = <strong>0,2 mol<\/strong> (1 pkt).\n(b) teoretycznie 0,2 mol kwasu; rzeczywiście 0,2 · 0,8 = <strong>0,16 mol<\/strong>; m = 0,16 · 60 = <strong>9,6 g<\/strong> (2 pkt: 1 wydajność, 1 masa).\n(c) Stosunek 2 : 1 → n(CO₂) = 0,16/2 = 0,08 mol → V = 0,08 · 22,4 = <strong>1,792 dm³ ≈ 1,79 dm³<\/strong> (2 pkt: 1 stosunek, 1 objętość).\n(d) m(CO₂) = 0,08 · 44 = <strong>3,52 g<\/strong>. Bilans masy dla ilości stechiometrycznych: 0,16 mol kwasu (9,6 g) + 0,08 mol CaCO₃ (8 g) = 17,6 g; produkty: 0,08 mol octanu wapnia (0,08 · 158 = 12,64 g) + 0,08 mol H₂O (1,44 g) + 0,08 mol CO₂ (3,52 g) = 17,6 g ✔ (1 pkt).\n(e) Założenie błędne z dwóch powodów: z równania 2CH₃COOH : 1CO₂ na 1 mol kwasu przypada <strong>0,5 mol<\/strong> CO₂ (uczeń pominął współczynnik 2), a wydajność 80% zmniejsza ilość kwasu — z 1 mol etanolu otrzymuje się 0,8 mol kwasu, a z niego <strong>0,4 mol<\/strong> CO₂ (1 pkt).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie A (E8, 4 pkt) — Soda i ocet<\/span>\n<p>Do octu dodano 8,4 g sody oczyszczonej (NaHCO₃; M = 84 g/mol). (a) Zapisz równanie reakcji. (b) Oblicz objętość CO₂ w warunkach normalnych. (c) Oblicz masę czystego kwasu octowego potrzebną do pełnej reakcji.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂↑ (1 pkt). (b) n = 8,4/84 = 0,1 mol; n(CO₂) = 0,1 mol; V = 2,24 dm³ (2 pkt). (c) n(kwasu) = 0,1 mol; m = 0,1 · 60 = 6 g (1 pkt).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Zadanie B (E8/ambitny, 4 pkt) — Odkamienianie<\/span>\n<p>W czajniku osiadł kamień (przyjmij: czysty CaCO₃) w ilości 5 g. Do jego usunięcia użyto octu o stężeniu 10% (masowe). (a) Zapisz równanie. (b) Oblicz masę czystego kwasu octowego potrzebną do reakcji z całym osadem. (c) Oblicz masę octu 10%. (d) Oblicz objętość CO₂ (warunki normalne). M(CaCO₃) = 100 g/mol.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) CaCO₃ + 2CH₃COOH → (CH₃COO)₂Ca + H₂O + CO₂↑ (1 pkt). (b) n(CaCO₃) = 0,05 mol → n(kwasu) = 0,1 mol → m = 6 g (1 pkt). (c) m(octu) = 6/0,10 = 60 g (1 pkt). (d) n(CO₂) = 0,05 mol → V = 1,12 dm³ (1 pkt).<\/p>\n<\/details>\n<div class=\"card card-adv\">\n<span class=\"card-label\">Zadanie C (ambitny, 4 pkt) — Mocny czy słaby, a ile wodoru?<\/span>\n<p>Do dwóch probówek z nadmiarem magnezu dodano: do pierwszej 100 cm³ roztworu HCl o stężeniu 1 mol/dm³, do drugiej 100 cm³ roztworu CH₃COOH o stężeniu 1 mol/dm³. (a) Która reakcja będzie szybsza na początku? (b) Oblicz objętości H₂ (warunki normalne) po zakończeniu obu reakcji. (c) Wyjaśnij, dlaczego uczeń, który twierdzi „słaby kwas da mniej wodoru”, się myli.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) Z HCl (kwas mocny — więcej jonów H⁺ od razu) (1 pkt). (b) n(kwasu) = 0,1 mol w każdej probówce; Mg + 2HCl → MgCl₂ + H₂, Mg + 2CH₃COOH → (CH₃COO)₂Mg + H₂; n(H₂) = 0,05 mol; V = 1,12 dm³ w obu (2 pkt). (c) Słabość kwasu wpływa na tempo (liczbę jonów H⁺ w danej chwili), a nie na całkowitą ilość atomów H do oddania; w miarę zużywania H⁺ równowaga dysocjacji kwasu octowego się przesuwa, aż cały kwas zareaguje (1 pkt).<\/p>\n<\/details>\n<div class=\"card card-adv\">\n<span class=\"card-label\">Zadanie D (ambitny, 4 pkt) — Znajdź błąd i policz<\/span>\n<p>Uczeń zapisał: „Kwas octowy ma 4 atomy wodoru, więc to kwas czterozasadowy i na 1 mol potrzeba 4 mol NaOH”. (a) Wskaż błąd i uzasadnij. (b) Zapisz równanie neutralizacji z NaOH. (c) Ile gramów NaOH (M = 40 g/mol) zobojętni 20 g octu o stężeniu 6% (masowych)?<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) Kwas octowy jest jednozasadowy — tylko H z grupy –COOH odszczepia się jako H⁺ (wodory grupy CH₃ są związane z węglem) (1 pkt). (b) NaOH + CH₃COOH → CH₃COONa + H₂O (1 pkt). (c) m(kwasu) = 0,06 · 20 = 1,2 g; n = 1,2/60 = 0,02 mol; n(NaOH) = 0,02 mol; m = 0,8 g (2 pkt).<\/p>\n<\/details>\n<div class=\"card card-adv\">\n<span class=\"card-label\">Zadanie E (konkursowy, 5 pkt) — Mieszanina kwasów<\/span>\n<p>0,2 mol mieszaniny kwasów: metanowego i etanowego spalono całkowicie, otrzymując 0,3 mol CO₂. (a) Zapisz równania spalania obu kwasów (przyjmij całkowite współczynniki). (b) Oblicz skład mieszaniny w molach. (c) Oblicz masę mieszaniny. (d) Oblicz objętość zużytego tlenu (warunki normalne).<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>(a) 2HCOOH + O₂ → 2CO₂ + 2H₂O; CH₃COOH + 2O₂ → 2CO₂ + 2H₂O (1 pkt). (b) x mol HCOOH, (0,2 − x) mol CH₃COOH: x + 2(0,2 − x) = 0,4 − x = 0,3 → x = 0,1; po 0,1 mol każdego (2 pkt). (c) m = 0,1 · 46 + 0,1 · 60 = 4,6 + 6,0 = 10,6 g (1 pkt). (d) n(O₂) = 0,1 · 0,5 + 0,1 · 2 = 0,25 mol; V = 5,6 dm³ (1 pkt).<\/p>\n<\/details>\n<\/section>\n<section>\n<div class=\"part-heading\"><span class=\"part-num\">8<\/span> Fiszki<\/div>\n<div id=\"flashcards\" class=\"flashcard-grid\"><button class=\"flashcard\" type=\"button\"><span class=\"front\">Grupa charakterystyczna kwasów karboksylowych?<\/span><span class=\"back\">–COOH (karboksylowa: C=O + –OH na tym samym węglu)<\/span><span class=\"card-tag tag-definicje\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Wzory i nazwy kwasów C1–C3?<\/span><span class=\"back\">HCOOH metanowy (mrówkowy); CH₃COOH etanowy (octowy); C₂H₅COOH propanowy<\/span><span class=\"card-tag tag-szereg\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">M kwasu octowego?<\/span><span class=\"back\">60 g/mol (2·12 + 4·1 + 2·16)<\/span><span class=\"card-tag tag-obliczenia\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Równanie dysocjacji kwasu octowego?<\/span><span class=\"back\">CH₃COOH ⇌ CH₃COO⁻ + H⁺ — odwracalna, częściowa (kwas słaby)<\/span><span class=\"card-tag tag-dysocjacja\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Barwy wskaźników w kwasie octowym?<\/span><span class=\"back\">lakmus czerwony, fenoloftaleina bezbarwna<\/span><span class=\"card-tag tag-odczyn\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Równanie kwas octowy + Mg?<\/span><span class=\"back\">Mg + 2CH₃COOH → (CH₃COO)₂Mg + H₂↑<\/span><span class=\"card-tag tag-reakcje\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Równanie kwas octowy + CuO?<\/span><span class=\"back\">CuO + 2CH₃COOH → (CH₃COO)₂Cu + H₂O<\/span><span class=\"card-tag tag-reakcje\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Równanie neutralizacji z NaOH?<\/span><span class=\"back\">NaOH + CH₃COOH → CH₃COONa + H₂O<\/span><span class=\"card-tag tag-reakcje\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Równanie kwas octowy + CaCO₃?<\/span><span class=\"back\">CaCO₃ + 2CH₃COOH → (CH₃COO)₂Ca + H₂O + CO₂↑<\/span><span class=\"card-tag tag-reakcje\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Dlaczego Cu nie reaguje z kwasem octowym?<\/span><span class=\"back\">miedź mniej aktywna od wodoru — nie wypiera H z kwasu<\/span><span class=\"card-tag tag-reakcje\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Jak nazywamy sole kwasu octowego?<\/span><span class=\"back\">octany (CH₃COONa — octan sodu)<\/span><span class=\"card-tag tag-nazwy\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Skąd ocet?<\/span><span class=\"back\">fermentacja octowa: C₂H₅OH + O₂ →(bakterie octowe) CH₃COOH + H₂O<\/span><span class=\"card-tag tag-otrzymywanie\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Równanie spalania kwasu octowego?<\/span><span class=\"back\">CH₃COOH + 2O₂ → 2CO₂ + 2H₂O<\/span><span class=\"card-tag tag-spalanie\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Kwas metanowy vs etanol — 46 g/mol?<\/span><span class=\"back\">ta sama masa molowa, ale różne wzory — NIE izomery<\/span><span class=\"card-tag tag-pułapka\"><\/span><\/button><button class=\"flashcard\" type=\"button\"><span class=\"front\">Co to kwas octowy lodowaty?<\/span><span class=\"back\">czysty (bezwodny) kwas octowy krzepnący ok. 17 °C<\/span><span class=\"card-tag tag-ciekawostka\"><\/span><\/button><\/div>\n<\/section>\n<section>\n<div class=\"part-heading\"><span class=\"part-num\">9<\/span> Test kontrolny<\/div>\n<div class=\"che-quiz\" id=\"quizWrap\"><div class=\"quiz-q\" data-ok=\"1\"><h5>1. Grupa karboksylowa to:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">–OH przy łańcuchu węglowym<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">–COOH — wiązanie C=O i grupa –OH na tym samym węglu<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">C=C z grupą –OH<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\"><h5>2. Roztwór kwasu octowego wobec wskaźników:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">barwi fenoloftaleinę na malinowo<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">nie zmienia barwy lakmusu<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">czerwieni lakmus i nie barwi fenoloftaleiny<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\"><h5>3. Po dodaniu kwasu octowego do węglanu wapnia:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">wydziela się H₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">nic się nie dzieje<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">wydziela się CO₂ (mętnieje woda wapienna)<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\"><h5>4. Kwas octowy jest kwasem słabym, ponieważ:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">nie przewodzi prądu wcale<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">nie reaguje z metalami<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">dysocjuje tylko częściowo i odwracalnie<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\"><h5>5. Miedź zanurzona w kwasie octowym:<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">rozpuszcza się z wydzieleniem H₂<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">nie reaguje — miedź jest mniej aktywna od wodoru<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">rozpuszcza się z wydzieleniem CO₂<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"1\" data-fb=\"Kwas karboksylowy ma grupę –COOH; CH₃CH₂OH to etanol, CH₃CHO — etanal.\"><h5>6. Który wzór należy do kwasu karboksylowego?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">CH₃CH₂OH<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">CH₃COOH<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">CH₃CHO<\/button><\/div><\/div><div class=\"quiz-q\" data-ok=\"2\" data-fb=\"Miedź jest mniej aktywna od wodoru i nie wypiera go z kwasu; z CaCO₃ powstaje CO₂, z Mg — H₂.\"><h5>7. Z którym związkiem kwas octowy NIE zareaguje?<\/h5><div class=\"quiz-opts\"><button type=\"button\" class=\"quiz-opt\" data-a=\"0\">CaCO₃<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"1\">Mg<\/button><button type=\"button\" class=\"quiz-opt\" data-a=\"2\">Cu<\/button><\/div><\/div><\/div><div class=\"quiz-score\" id=\"quizScore\"><\/div>\n<\/section>\n<section>\n<div class=\"part-heading\"><span class=\"part-num\">10<\/span> Słownik<\/div>\n<dl><div class=\"def-item\"><dt>kwas karboksylowy<\/dt><dd>związek organiczny z grupą –COOH przyłączoną do węgla; kwaśny odczyn, słaba (częściowa) dysocjacja.<\/dd><\/div><div class=\"def-item\"><dt>grupa karboksylowa (–COOH)<\/dt><dd>układ C=O i –OH na tym samym atomie węgla; źródło kwasowości związków organicznych.<\/dd><\/div><div class=\"def-item\"><dt>kwas metanowy (mrówkowy)<\/dt><dd>HCOOH — najprostszy kwas karboksylowy, M = 46 g/mol; występuje m.in. w wydzielinie mrówek i włoskach pokrzywy.<\/dd><\/div><div class=\"def-item\"><dt>kwas etanowy (octowy)<\/dt><dd>CH₃COOH — M = 60 g/mol; składnik octu; kwas słaby.<\/dd><\/div><div class=\"def-item\"><dt>kwas propanowy (propionowy)<\/dt><dd>C₂H₅COOH — M = 74 g/mol; trzeci człon szeregu.<\/dd><\/div><div class=\"def-item\"><dt>octany<\/dt><dd>sole kwasu octowego (reszta CH₃COO⁻ + kation); np. octan sodu CH₃COONa, octan wapnia (CH₃COO)₂Ca.<\/dd><\/div><div class=\"def-item\"><dt>kwas słaby<\/dt><dd>kwas dysocjujący częściowo i odwracalnie (⇌); roztwór przewodzi prąd słabo (mało jonów).<\/dd><\/div><div class=\"def-item\"><dt>fermentacja octowa<\/dt><dd>utlenianie etanolu tlenem z powietrza przez bakterie octowe: C₂H₅OH + O₂ → CH₃COOH + H₂O.<\/dd><\/div><div class=\"def-item\"><dt>kwas octowy lodowaty<\/dt><dd>bezwodny kwas octowy krzepnący w ok. 17 °C — stąd nazwa „lodowaty\".<\/dd><\/div><div class=\"def-item\"><dt>neutralizacja<\/dt><dd>reakcja kwasu z zasadą dająca sól i wodę (tu: octan + H₂O).<\/dd><\/div><div class=\"def-item\"><dt>szereg aktywności metali<\/dt><dd>uporządkowanie metali według aktywności; tylko metale aktywne od wodoru wypierają go z kwasów (Cu, Ag, Au — nie).<\/dd><\/div><div class=\"def-item\"><dt>kwasy tłuszczowe<\/dt><dd>dalsze homologi kwasów karboksylowych (np. stearynowy C₁₇H₃₅COOH) — składniki tłuszczów (ORG06).<\/dd><\/div><\/dl>\n<\/section>\n<section>\n<div class=\"part-heading\">Do weryfikacji<\/div>\n<ul>\n<li><strong>ORG05:<\/strong> temperatura krzepnięcia czystego kwasu octowego ok. 17 °C (dokładnie ok. 16,6 °C) oraz temperatury wrzenia kwasów (101 / 118 / 141 °C) i etanolu (78 °C) — wartości podręcznikowe, do potwierdzenia przy scalaniu.<\/li>\n<li><strong>ORG05:<\/strong> odwołania „(N01, LKO-pułapki)” i „R08/R09/R02” w punkcie 0.1 i minimum — nie da się ich sprawdzić z poziomu pliku; do sprawdzenia przy scalaniu.<\/li>\n<li><strong>ORG05:<\/strong> kwas metanowy u mrówek i pokrzywy — uproszczenie szkolne (pokrzywa zawiera też inne substancje).<\/li>\n<li><strong>ORG05:<\/strong> M(C₁₇H₃₅COOH) = 18·12 + 36·1 + 2·16 = 284 g/mol ✔ (karta extra).<\/li>\n<li><strong>ORG05:<\/strong> rachunki sprawdzone: exam 4 — 0,5 mol Mg → 60 g kwasu, 1 g H₂, 11,2 dm³; adv 6 — 0,16 mol kwasu → 0,08 mol CO₂ (1,79 dm³, 3,52 g), bilans 17,6 g ✔; zadanie E — 0,1 mol HCOOH + 0,1 mol CH₃COOH → 10,6 g, 5,6 dm³ O₂ ✔; zadanie D — 1,2 g kwasu → 0,8 g NaOH ✔.<\/li>\n<li><strong>ORG05:<\/strong> utlenianie chemiczne etanolu — tylko schemat (etanol → etanal → kwas), bez nazw utleniaczy (poza zakresem); do decyzji autora, czy dodać.<\/li>\n<li><strong>ORG05:<\/strong> dwie reakcje z NaHCO₃ (soda + ocet) i kamień — przykłady domowe, bilanse sprawdzone.<\/li>\n<li><strong>ORG05:<\/strong> rysunek grupy –COOH zamieniony na zapis strukturalny w tekście (bez grafiki); ewentualną grafikę z opisem @viz — do decyzji autora przy scalaniu.<\/li>\n<li><strong>ORG05:<\/strong> zakładana pozycja kart <code>odp<\/code> jako siostrzanych po kartach zadań (konwencja N01/REV01) — przy scalaniu dostosować.<\/li>\n<\/ul>\n<\/section>\n<section>\n<div class=\"part-heading\">Własne przykłady (W1, 2026-10-14)<\/div>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Przykład W1-1 (E8) — kwas octowy i wodorotlenek sodu: ile octanu?<\/span>\n<p>Do 12 g kwasu octowego dodano nadmiar wodorotlenku sodu. Oblicz masę powstałego octanu sodu. Zapisz równanie i wszystkie kroki.<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>CH₃COOH + NaOH → CH₃COONa + H₂O. M(CH₃COOH) = 60 g/mol → n = 12 / 60 = 0,2 mol. Stosunek kwasu do octanu 1 : 1, więc n(CH₃COONa) = 0,2 mol. M(CH₃COONa) = 82 g/mol → m = 0,2 · 82 = <strong>16,4 g<\/strong> (3 pkt: n kwasu, stosunek 1 : 1, masa octanu).<\/p>\n<\/details>\n<div class=\"card card-exam\">\n<span class=\"card-label\">Przykład W1-2 (ambitny) — dwa sposoby na ten sam wynik<\/span>\n<p>Ten sam kwas octowy (12 g) reaguje z nadmiarem węglanu sodu. Ile dm³ CO₂ (warunki normalne) wydzieli się? Porównaj z wynikiem z przykładu W1-1: dlaczego ilości różnią się?<\/p>\n<\/div>\n<details class=\"answer\"><summary>Pokaż klucz<\/summary>\n<p>2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂. n(CH₃COOH) = 0,2 mol → n(CO₂) = 0,1 mol (stosunek 2 : 1) → V = 0,1 · 22,4 = <strong>2,24 dm³<\/strong> (3 pkt). Różnica: w przykładzie W1-1 kwas reaguje z zasadą bez wydzielania gazu, tu z węglanem gaz się wydziela, a stosunek reagentów jest inny (2 : 1, nie 1 : 1).<\/p>\n<\/details>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1 — audyt 05 (2026-10-13)<\/div>\n<p>Zastosowano uwagi z audytu Perplexity:\n- <strong>Błędy:<\/strong> wzór ogólny poprawiony na CₙH₂ₙ₊₁COOH z wyjaśnieniem n i wzorem CₙH₂ₙO₂ (1); masa HCOOH 2·1 + 12 + 2·16 = 46 (2); „karbonylowy” zamiast „tlenkowy” (3); „monokarboksylowych” (4); „równość mas” (5); droga 1 uzupełniona o zazielenienie miedzi w occie na powietrzu (6); droga 2 — uzasadnienie przez tlenek zasadowy (7); fermentacja octowa jako utlenianie tlenowe i etanal CH₃CHO (8); karta extra „glicerol połączony z trzema resztami” (9); doświadczenie — dodana próba porównawcza z HCl i probówka z kwasem octowym, wniosek o słabości kwasu opatrzony danymi (10); lakmus albo uniwersalny w jednej probówce, fenoloftaleina osobno (11); „zapala się z krótkim szczeknięciem” (12); dane mas molowych w zadaniu 6 (13); klucz 6(e) z wydajnością 80% (14); „produkty organiczne” (15); minimum 9 i 10 (16–17); „mrówkowy” (18); lód octowy — usunięte „do weryfikacji” z tekstu ucznia, ocet „kilka–kilkanaście procent” (19); klucze bez połówek punktów (zadania 1, 3, 5, 6) (20); test — poprawna odpowiedź przestawiona w pięciu pytaniach, dodane dwa pytania U9 (21).\n- <strong>Braki:<\/strong> właściwości fizyczne i temperatury wrzenia (U3); NaHCO₃ i kamień (U5); reakcja z sodem jako kontrast z ORG03 (U6); porównanie kwasu słabego i mocnego (U4 i zadanie C); jednozasadowość (zadanie D i karta samokontroli); zastosowania i bezpieczeństwo (karta extra „Ocet w kuchni”); wzór strukturalny (sekcja 1); propioniany (sekcja 1); typy zadań — zapis dysocjacji, wybór partnerów (test i karta samokontroli), masa kwasu w occie 10% i CO₂ z NaHCO₃ (zadania A–B); typowe błędy (nowa karta error); wartościowość kationu (karta przypomnienia).\n- <strong>Poszerzenie horyzontu:<\/strong> Kolbe 1845, acetylo-CoA (wzmianka), dimery i wysoka temperatura wrzenia (karta ambitna), mnemotechniki, ocet w kuchni.\n- <strong>Własne przykłady:<\/strong> zadania A–E z audytu (soda i ocet, odkamienianie, Mg z HCl i z CH₃COOH, neutralizacja octu 6%, mieszanina kwasów) dopisane w sekcji 7 z punktacją bez połówek.\n- <strong>Ulepszenia U1–U9:<\/strong> wprowadzone (U1 wzór, U2 masa, U3 właściwości, U4 probówki HCl, U5 NaHCO₃, U6 sód, U7 dane do zadania 6, U8 karta samokontroli, U9 test).<\/p>\n<p><strong>Nieprzyjęte / zmodyfikowane:<\/strong>\n- Propozycja zmiany warstwy „Mg, NaHCO₃” na „Mg, Na₂CO₃” — nieprzyjęta: zamiast tego NaHCO₃ wprowadzono w treści (U5), więc warstwa zgodna z lekcją.\n- Rysunek ASCII — zamieniony na zapis strukturalny w tekście, nie na grafikę z @viz (decyzja do podjęcia przy scalaniu; w pliku nie ma już bloku kodu).\n- Uwaga „0,5 pkt niezgodne z CKE” — przyjęta w wersji całkowitej punktacji; przy zadaniu 5 (c) i (d) połączono w jeden punkt.<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1 — uzupełnienie, weryfikacja drugiego audytu (Claude Haiku 5.5, 2026-10-14)<\/div>\n<ul>\n<li>Sprawdzono równania, masy molowe i rachunki z drugiego audytu: poprawne (bilans spalania CH₃COOH + 2O₂ → 2CO₂ + 2H₂O, fermentacja octowa, 16,4 g octanu sodu, Zadanie 2 z Mg i kwasem solnym/octowym).<\/li>\n<li>Dodano: przykłady W1-1 (12 g kwasu → 16,4 g octanu sodu) i W1-2 (wydzielanie CO₂ z węglanem sodu, 2,24 dm³).<\/li>\n<li>Już obecne w lekcji (nie dodawano): wzór CₙH₂ₙO₂, pułapka mas molowych kwasu metanowego i etanolu, karta obserwacja–wniosek, typowe błędy.<\/li>\n<li>Nieprzyjęte: pełny mechanizm dysocjacji kwasów karboksylowych i fermentacji octowej — poza rdzeniem lekcji.<\/li>\n<li>Nic nie usunięto.<\/li>\n<\/ul>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1/W2 — zewnętrzny, LKO-ORG05 (2026-10-14)<\/div>\n<p>Zastosowano: dopisano zapis dysocjacji z jonem hydroniowym H₃O⁺ (z zastrzeżeniem, że zapis z H⁺ jest uproszczeniem); dodano kartę „W skrócie” z tabelą kwas octowy – kwas solny – etanol (oddawanie H⁺, odczyn, przewodnictwo).<\/p>\n<p>Nieprzyjęte (sprawdzone w pliku): wzór ogólny CₙH₂ₙ₊₁COOH jest już w lekcji (wraz z wyjaśnieniem n); uwaga o miedzi i zazielenieniu (powolne utlenianie z udziałem tlenu, nie wypieranie wodoru) jest już w sekcji o metalach; octan miedzi (CH₃COO)₂Cu i równania Mg i Zn są poprawne; równanie Cu + CH₃COOH nie jest zapisane jako reakcja, tylko jako zapis fałszywy.<\/p>\n<\/section>\n<section>\n<div class=\"part-heading\">AUDYT W1/W2 — zewnętrzny, blok organiczny (2026-10-14)<\/div>\n<p>Zastosowano: brak zmian treści.<\/p>\n<p>Nieprzyjęte (sprawdzone w pliku): Cztery schematy reakcji kwasu (z metalem, wodorotlenkiem, tlenkiem, węglanem) i uwaga o nazwach systematycznych (etanowy = octowy, butanowy = masłowy) są w lekcji. Nic do zmiany.<\/p>\n<\/section>\n<footer class=\"footer\">\n<p>\"LKO-ORG05 · v1.1\"<\/p>\n<p style=\"opacity:0.7;\">Ucz się świadomie, nie na pamięć.<\/p>\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n"</script>
