<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIZ — podgląd grafiki</title>
<style>
:root{--accent:#1d6b4f;--accent-soft:#e7f3ec;--surface:#fff;--surface-soft:#f3f7f4;--text:#1a2332;--text-soft:#5d6b7a;--border:#d5dee6;--border-strong:#b8c4cf;
--viz-ink:#1a2332;--viz-mut:#5d6b7a;--viz-line:#d5dee6;--viz-bg:#fff;--viz-bg2:#f6f8f7;
--c-basic:#2e7d32;--c-basic-bg:#e8f5e9;--c-error:#c62828;--c-error-bg:#fdecea;--c-warn:#b26a00;--c-warn-bg:#fff4e0;
--k1:#1f6fb2;--k1-bg:#e3effa;--k2:#178a6c;--k2-bg:#e0f3ec;--k3:#e09400;--k3-bg:#fff3d6;--k4:#c0392b;--k4-bg:#fdecea;--k5:#7a3fbf;--k5-bg:#f3ecfb;--k6:#5c8a3a;--k6-bg:#eef6e6;
--blood-o2:#d32f2f;--blood-o2-bg:#fde8e8;--blood-co2:#3949ab;--blood-co2-bg:#e8eaf8;--nerve:#f2a900;--bone:#efe6d2;--muscle:#c0574b;--skin:#f1c9a5;--fat:#f7e3a6}
body{font:15px/1.5 Inter,system-ui,sans-serif;color:var(--text);background:#f8faf8;margin:0;padding:16px;max-width:900px}
figure{margin:0 0 24px;background:var(--viz-bg);border:1px solid var(--border);border-radius:12px;padding:12px}
figcaption{font-weight:700;margin-bottom:8px} svg{width:100%;height:auto;display:block}
.vz-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.vz-btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 11px;font:700 12.5px Inter,system-ui,sans-serif;cursor:pointer;min-height:34px}
.vz-btn:hover{border-color:var(--accent);color:var(--accent)} .vz-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vz-info{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-soft);border-radius:8px;font-size:13.5px;min-height:44px}
.vz-info b{display:block;margin-bottom:2px} .vz-info.ok{border-left-color:var(--c-basic);background:var(--c-basic-bg)} .vz-info.bad{border-left-color:var(--c-error);background:var(--c-error-bg)}
.vz-hit{cursor:pointer} .vz-hit:hover,.vz-hit:focus{filter:brightness(.93);outline:none} .vz-hit.sel{filter:drop-shadow(0 0 3px var(--accent))}
input[type=range]{width:100%;accent-color:var(--accent)}
</style></head><body>
<script>
/* ===== VIZ — mała biblioteka (taka sama jak w kursie). NIE ZMIENIAJ tego bloku. ===== */
(function(){var VIZ=window.VIZ={},REG={},NS='http://www.w3.org/2000/svg';
VIZ.define=function(id,d){REG[id]=d};
function set(e,at){for(var k in at){var v=at[k];if(v==null)continue;if((k==='fill'||k==='stroke'||k==='stop-color')&&String(v).indexOf('var(')>=0)e.style.setProperty(k,v);else e.setAttribute(k,v)}}
function add(e,kids){(kids||[]).forEach(function(c){if(c==null||c===false)return;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c)});return e}
VIZ.S=function(tag,at,kids){var e=document.createElementNS(NS,tag);set(e,at||{});return add(e,kids)};
VIZ.H=function(tag,cls,html,kids){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return add(e,kids)};
VIZ.svg=function(w,h,label,kids){return VIZ.S('svg',{viewBox:'0 0 '+w+' '+h,role:'img','aria-label':label||'',preserveAspectRatio:'xMidYMid meet'},kids)};
VIZ.T=function(x,y,t,o){o=o||{};return VIZ.S('text',{x:x,y:y,'text-anchor':o.a||'middle','dominant-baseline':o.b||'middle','font-size':o.s||12,'font-weight':o.w||600,fill:o.f||'var(--viz-ink)'},[t])};
VIZ.btn=function(label,on){var b=VIZ.H('button','vz-btn');b.type='button';b.textContent=label;if(on)b.onclick=on;return b};
var fx=VIZ.fx={};
/* elementy z atrybutem data-k → kliknięcie / Enter pokazuje map[k] = ['Tytuł','opis'] w polu box */
fx.info=function(root,box,map,first){function show(k,el){var d=map[k];if(!d)return;root.querySelectorAll('.vz-hit.sel').forEach(function(x){x.classList.remove('sel')});if(el)el.classList.add('sel');box.className='vz-info';box.innerHTML='<b>'+d[0]+'</b>'+d[1]}
 root.querySelectorAll('[data-k]').forEach(function(el){el.classList.add('vz-hit');el.setAttribute('tabindex','0');el.setAttribute('role','button');el.addEventListener('click',function(){show(el.getAttribute('data-k'),el)});el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();show(el.getAttribute('data-k'),el)}})});
 if(first)show(first,root.querySelector('[data-k="'+first+'"]'));return show};
fx.infoBox=function(t){return VIZ.H('div','vz-info',t||'Kliknij element grafiki, aby zobaczyć wyjaśnienie.')};
/* autoodtwarzanie: step() co ms, tylko gdy grafika widoczna; klik w grafikę zatrzymuje, przycisk wznawia */
fx.auto=function(el,step,ms,o){o=o||{};var on=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches),vis=false,tm=null,bar=VIZ.H('div','vz-tools'),b=VIZ.H('button','vz-btn');b.type='button';
 function lab(){b.textContent=on?'⏸ zatrzymaj animację':'▶ odtwarzaj automatycznie';b.classList.toggle('on',on)}function halt(){if(tm){clearInterval(tm);tm=null}}
 function run(){if(tm||!on||!vis||document.hidden)return;if(o.now)step();tm=setInterval(function(){if(document.hidden||!vis){halt();return}step()},ms)}
 b.onclick=function(){on=!on;lab();if(on)run();else halt()};bar.appendChild(b);el.insertBefore(bar,el.firstChild);lab();
 el.addEventListener('pointerdown',function(e){if(bar.contains(e.target)||!on)return;on=false;halt();lab()},true);
 if('IntersectionObserver' in window)new IntersectionObserver(function(es){es.forEach(function(e){vis=e.isIntersecting;if(vis)run();else halt()})},{threshold:.35}).observe(el);else{vis=true;run()}
 return{stop:function(){on=false;halt();lab()}}};
fx.toggle=function(btns,i){btns.forEach(function(b,j){b.classList.toggle('on',j===i)})};
VIZ.mountAll=function(){document.querySelectorAll('[data-viz]').forEach(function(f){var d=REG[f.dataset.viz],body=f.querySelector('.viz-body');var opt={};try{opt=JSON.parse(f.dataset.opt||'{}')}catch(e){}
 if(!d){body.textContent='Brak grafiki '+f.dataset.viz;return}d.mount(body,opt,f)})};
})();
</script>

<script>
/* >>> VIZ synapsa */
VIZ.define('synapsa',{opis:'Animacja przekazania impulsu na synapsie chemicznej w pięciu krokach: impuls, uwolnienie neuroprzekaźnika, szczelina, receptory, nowy impuls.',
mount:function(el,opt){
  var S=VIZ.S,T=VIZ.T,cur=Math.max(0,Math.min(4,parseInt(opt&&opt.krok,10)||0));
  var START='Animacja pokazuje 5 kroków przekazania impulsu. Użyj przycisków „◀ krok” i „krok ▶” albo kliknij element schematu.';
  var TT=['Impuls dochodzi do zakończenia aksonu','Pęcherzyki uwalniają neuroprzekaźnik','Neuroprzekaźnik w szczelinie synaptycznej','Łączenie z receptorami','Nowy impuls w następnej komórce'];
  var TX=['Impuls nerwowy biegnie wzdłuż aksonu i dociera do jego zakończenia.',
    'Impuls sprawia, że pęcherzyki synaptyczne łączą się z błoną zakończenia aksonu i wylewają neuroprzekaźnik do szczeliny synaptycznej.',
    'Cząsteczki neuroprzekaźnika przemieszczają się przez wąską szczelinę. Zajmuje to chwilę, dlatego przekazanie na synapsie jest wolniejsze niż bieg impulsu w aksonie.',
    'Neuroprzekaźnik łączy się z receptorami w błonie następnej komórki, jak klucz z zamkiem. Pasuje tylko do swoich receptorów.',
    'Po pobudzeniu receptorów w następnej komórce powstaje nowy impuls. Przekazanie jest jednokierunkowe: pęcherzyki są tylko w zakończeniu aksonu, a receptory po drugiej stronie szczeliny.'];
  var INFO={
    akson:['Zakończenie aksonu','Tu kończy się akson komórki nadającej sygnał. W środku są pęcherzyki z neuroprzekaźnikiem.'],
    pecherzyki:['Pęcherzyki synaptyczne','Małe pęcherzyki wypełnione neuroprzekaźnikiem – substancją chemiczną, która przenosi sygnał.'],
    szczelina:['Szczelina synaptyczna','Wąska przestrzeń między komórkami. Impuls elektryczny nie przeskakuje przez nią – sygnał przenosi neuroprzekaźnik.'],
    receptory:['Receptory','Białka w błonie następnej komórki. Pasują do określonego neuroprzekaźnika i po jego związaniu pobudzają komórkę.'],
    nastepna:['Następna komórka','Komórka odbierająca sygnał (np. kolejny neuron lub komórka mięśniowa). Powstaje w niej nowy impuls.']};
  TT.forEach(function(t,i){INFO['s'+i]=[(i+1)+'. '+t,TX[i]]});
  function lab(k,x,y,t){var ls=t.split('|');return ls.map(function(q,i){var e=T(x,y+(i-(ls.length-1)/2)*15,q,{s:13,w:700});e.setAttribute('data-k',k);e.setAttribute('data-lab','1');return e})}
  function C(x,y,r,f,s,w){return S('circle',{cx:x,cy:y,r:r,fill:f,stroke:s,'stroke-width':w})}
  function ln(x1,y1,x2,y2){return S('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:'var(--viz-mut)','stroke-width':1.2,'pointer-events':'none'})}
  var RY=[130,175,220,265],kids=[];
  kids.push(T(350,22,'kierunek przekazywania impulsu',{s:13,w:700}),S('line',{x1:60,y1:44,x2:632,y2:44,stroke:'var(--viz-ink)','stroke-width':3}),S('polygon',{points:'650,44 630,36 630,52',fill:'var(--viz-ink)'}));
  kids.push(S('rect',{x:345,y:105,width:50,height:190,fill:'var(--viz-bg2)','data-k':'szczelina'}));
  kids.push(S('path',{d:'M20 170 L220 170 Q232 120 270 105 L330 105 Q345 105 345 120 L345 280 Q345 295 330 295 L270 295 Q232 280 220 230 L20 230 Z',fill:'var(--k1-bg)',stroke:'var(--k1)','stroke-width':3,'data-k':'akson'}));
  kids.push(S('path',{d:'M395 105 L670 105 Q690 105 690 125 L690 275 Q690 295 670 295 L395 295 Z',fill:'var(--k2-bg)',stroke:'var(--k2)','stroke-width':3,'data-k':'nastepna'}));
  var rec=RY.map(function(y){return S('rect',{x:395,y:y-12,width:14,height:24,rx:3,fill:'var(--k5-bg)',stroke:'var(--k5)','stroke-width':2,'data-k':'receptory'})});
  kids=kids.concat(rec);
  /* pęcherzyki: spoczynek / połączone z błoną */
  var V=[[270,150,0],[312,135,332],[318,190,332],[272,245,0],[314,240,332],[318,272,332]];
  var ves=V.map(function(v){var d=S('g',{},[C(-4,-3,2.5,'var(--k3)','var(--k3)',1),C(4,-3,2.5,'var(--k3)','var(--k3)',1),C(0,4,2.5,'var(--k3)','var(--k3)',1)]);
    var c=C(0,0,13,'var(--k3-bg)','var(--k3)',2.5);return{g:S('g',{'data-k':'pecherzyki'},[c,d]),c:c,d:d,v:v}});
  ves.forEach(function(o){kids.push(o.g)});
  /* cząsteczki */
  var M=[[],[[354,130],[358,141],[354,185],[358,196],[354,235],[358,246],[354,267],[358,278]],
    [[368,125],[378,150],[366,175],[380,200],[370,225],[378,250],[366,270],[376,285]],
    [[391,130],[391,175],[391,220],[391,265],[374,152],[372,198],[374,246],[372,282]],
    [[391,130],[391,175],[391,220],[391,265]]];
  var mol=[0,1,2,3,4,5,6,7].map(function(){var c=C(0,0,4.5,'var(--k3)','var(--viz-ink)',1);c.setAttribute('pointer-events','none');kids.push(c);return c});
  /* błysk impulsu */
  var bt=T(0,24,'impuls',{s:12,w:700}),bolt=S('g',{'pointer-events':'none'},[S('path',{d:'M0 -13 L-7 2 L0 2 L-4 13 L8 -4 L1 -4 Z',fill:'var(--nerve)',stroke:'var(--viz-ink)','stroke-width':1.2}),bt]);
  kids.push(bolt);
  /* podpisy */
  kids=kids.concat(lab('pecherzyki',285,78,'pęcherzyki z|neuroprzekaźnikiem'),lab('receptory',455,82,'receptory'),
    lab('akson',270,345,'zakończenie|aksonu'),lab('szczelina',370,345,'szczelina|synaptyczna'),lab('nastepna',540,345,'następna|komórka'));
  kids.push(ln(280,95,272,136),ln(442,92,404,118),ln(270,326,270,298),ln(370,326,370,298),ln(540,326,540,298));
  var cap=T(350,398,'',{s:15,w:700});kids.push(cap);
  var sv=VIZ.svg(700,415,'Synapsa chemiczna: przekazanie impulsu od zakończenia aksonu do następnej komórki',kids),box=VIZ.fx.infoBox(START);
  function go(i,say){
    cur=i;
    ves.forEach(function(o){var f=i>=1&&o.v[2]>0,x=f?o.v[2]:o.v[0];o.g.setAttribute('transform','translate('+x+','+o.v[1]+')');o.c.setAttribute('stroke-dasharray',f?'4 3':'none');o.d.setAttribute('display',f?'none':'inline')});
    mol.forEach(function(c,j){var p=M[i][j];if(p){c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('display','inline')}else c.setAttribute('display','none')});
    rec.forEach(function(r){var on=i>=3;r.style.setProperty('fill',on?'var(--k5)':'var(--k5-bg)');r.setAttribute('stroke-width',on?3.5:2)});
    var bp=i===0?[190,200]:(i===1?[285,195]:(i===4?[560,200]:null));
    if(bp){bolt.setAttribute('transform','translate('+bp[0]+','+bp[1]+')');bolt.setAttribute('display','inline');bt.textContent=i===4?'nowy impuls':'impuls'}else bolt.setAttribute('display','none');
    cap.textContent='Krok '+(i+1)+'/5: '+TT[i];
    if(say){box.className='vz-info';box.innerHTML='<b>'+INFO['s'+i][0]+'</b>'+INFO['s'+i][1]}}
  var bP=VIZ.btn('◀ krok',function(){go((cur+4)%5,true)}),bN=VIZ.btn('krok ▶',function(){go((cur+1)%5,true)});
  el.appendChild(VIZ.H('div','vz-tools',null,[bP,bN]));el.appendChild(sv);el.appendChild(box);
  VIZ.fx.info(el,box,INFO);
  el.querySelectorAll('[data-lab]').forEach(function(x){x.setAttribute('tabindex','-1')});
  go(cur,false);
  VIZ.fx.auto(el,function(){go((cur+1)%5,true)},2600);
}});
/* <<< VIZ */
</script>
