<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Oś podwzgórze–przysadka–tarczyca</title>
<desc id="d">Podwzgórze wydziela TRH, przysadka TSH, tarczyca tyroksynę i T3. Tyroksyna hamuje przysadkę i podwzgórze (sprzężenie zwrotne ujemne). Przeciwne strony TSH i T4 oznaczają awarię w tarczycy, ta sama strona — w przysadce lub podwzgórzu.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c53030"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1a202c}.bx{fill:#ebf4ff;stroke:#2b6cb0;stroke-width:2}.s{font-size:12px;fill:#4a5568}</style>
<rect width="560" height="420" fill="#fff"/>
<rect class="bx" x="160" y="20" width="170" height="60" rx="8"/><text x="245" y="46" text-anchor="middle" font-weight="bold">Podwzgórze</text><text x="245" y="66" text-anchor="middle" class="s">wydziela TRH</text>
<rect class="bx" x="160" y="150" width="170" height="60" rx="8"/><text x="245" y="176" text-anchor="middle" font-weight="bold">Przysadka</text><text x="245" y="196" text-anchor="middle" class="s">wydziela TSH</text>
<rect class="bx" x="160" y="280" width="170" height="60" rx="8"/><text x="245" y="306" text-anchor="middle" font-weight="bold">Tarczyca</text><text x="245" y="326" text-anchor="middle" class="s">tyroksyna (T4) i T3, potrzebny jod</text>
<line x1="245" y1="80" x2="245" y2="148" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#a)"/><text x="255" y="120" class="s">pobudza (+)</text>
<line x1="245" y1="210" x2="245" y2="278" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#a)"/><text x="255" y="250" class="s">pobudza (+)</text>
<path d="M330 310 H430 V180 H332" fill="none" stroke="#c53030" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#b)"/>
<path d="M430 180 V50 H332" fill="none" stroke="#c53030" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#b)"/>
<text x="440" y="120" class="s" fill="#c53030">hamuje (−)</text><text x="440" y="136" class="s">sprzężenie zwrotne</text><text x="440" y="152" class="s">ujemne</text>
<rect x="30" y="360" width="500" height="50" rx="6" fill="#f7fafc" stroke="#a0aec0"/>
<text x="40" y="381" class="s">TSH i T4 w przeciwne strony → awaria w tarczycy.</text>
<text x="40" y="399" class="s">TSH i T4 w tę samą stronę (obie niskie) → awaria w przysadce lub podwzgórzu.</text>
</svg>
