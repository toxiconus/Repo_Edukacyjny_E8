<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Glukoza, insulina i glukagon po wypiciu glukozy (dane poglądowe)</title>
<desc id="d">Glukoza rośnie od 85 do ok. 135 mg/dl w 30 minucie i wraca do ok. 90. Insulina ma szczyt między 30. a 60. minutą. Glukagon maleje po posiłku i od ok. 90. minuty rośnie. Wykres poglądowy, bez skali dla insuliny i glukagonu.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#1a202c}.s{font-size:12px;fill:#4a5568}</style>
<rect width="560" height="380" fill="#fff"/>
<line x1="70" y1="300" x2="520" y2="300" stroke="#4a5568"/><line x1="70" y1="40" x2="70" y2="300" stroke="#4a5568"/><line x1="70" y1="300" x2="70" y2="305" stroke="#4a5568"/><text x="70" y="320" text-anchor="middle" class="s">0</text><line x1="182" y1="300" x2="182" y2="305" stroke="#4a5568"/><text x="182" y="320" text-anchor="middle" class="s">30</text><line x1="295" y1="300" x2="295" y2="305" stroke="#4a5568"/><text x="295" y="320" text-anchor="middle" class="s">60</text><line x1="408" y1="300" x2="408" y2="305" stroke="#4a5568"/><text x="408" y="320" text-anchor="middle" class="s">90</text><line x1="520" y1="300" x2="520" y2="305" stroke="#4a5568"/><text x="520" y="320" text-anchor="middle" class="s">120</text><text x="295" y="340" text-anchor="middle">czas od wypicia glukozy (min)</text><text x="20" y="170" transform="rotate(-90 20 170)" text-anchor="middle">poziom względny (poglądowo)</text><polyline points="70,228 126,141 182,83 295,141 408,199 520,213" fill="none" stroke="#2b6cb0" stroke-width="3"/><polyline points="70,276 126,205 182,99 239,64 295,111 408,205 520,253" fill="none" stroke="#2f855a" stroke-width="3"/><polyline points="70,77 126,151 182,207 295,226 408,170 520,96" fill="none" stroke="#c05621" stroke-width="3" stroke-dasharray="7 4"/><text x="190" y="75" class="s">glukoza: szczyt ok. 135 mg/dl (30 min)</text><g transform="translate(80,360)"><rect width="14" height="4" y="-4" fill="#2b6cb0"/><text x="20" y="0">glukoza</text><rect x="110" width="14" height="4" y="-4" fill="#2f855a"/><text x="130" y="0">insulina</text><rect x="215" width="14" height="4" y="-4" fill="#c05621"/><text x="235" y="0">glukagon (linia przerywana)</text></g></svg>