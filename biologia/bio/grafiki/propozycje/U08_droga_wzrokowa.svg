<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Droga wzrokowa i miejsca uszkodzeń A, B, C</title>
<desc id="d">Włókna z nosowych połówek siatkówek krzyżują się w skrzyżowaniu wzrokowym. Prawe pasmo wzrokowe i prawa kora potyliczna odbierają lewe pole widzenia obu oczu. A: uszkodzenie nerwu wzrokowego — ślepota jednego oka. B: uszkodzenie pasma lub kory — brak połowy pola widzenia w obu oczach. C: uszkodzenie skrzyżowania — brak obu zewnętrznych połówek pól widzenia. Pod skrzyżowaniem leży przysadka.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#1a202c}.s{font-size:12px;fill:#4a5568}.h{font-size:15px;font-weight:bold;fill:#c53030}</style>
<rect width="560" height="400" fill="#fff"/>
<circle cx="200" cy="50" r="26" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/><circle cx="360" cy="50" r="26" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="200" y="20" text-anchor="middle" class="s">oko lewe</text><text x="360" y="20" text-anchor="middle" class="s">oko prawe</text>
<path d="M200 76 L200 130 L280 160" fill="none" stroke="#2b6cb0" stroke-width="3"/>
<path d="M360 76 L360 130 L280 160" fill="none" stroke="#2b6cb0" stroke-width="3"/>
<path d="M280 160 L220 230 L220 330" fill="none" stroke="#2b6cb0" stroke-width="3"/>
<path d="M280 160 L340 230 L340 330" fill="none" stroke="#2b6cb0" stroke-width="3"/>
<path d="M215 135 L280 160" stroke="#2f855a" stroke-width="3" fill="none"/><path d="M345 135 L280 160" stroke="#2f855a" stroke-width="3" fill="none"/>
<rect x="150" y="330" width="140" height="40" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/><text x="220" y="355" text-anchor="middle">lewa kora potyliczna</text>
<rect x="270" y="330" width="140" height="40" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/><text x="340" y="355" text-anchor="middle">prawa kora potyliczna</text>
<text x="170" y="115" class="h">A</text><text x="385" y="115" class="h">A</text>
<text x="282" y="150" text-anchor="middle" class="h">C</text>
<text x="196" y="280" class="h">B</text><text x="355" y="280" class="h">B</text>
<ellipse cx="280" cy="195" rx="28" ry="12" fill="#fffaf0" stroke="#c05621"/><text x="280" y="199" text-anchor="middle" class="s">przysadka</text>
<text x="20" y="390" class="s">A — nerw wzrokowy: ślepota jednego oka · B — pasmo lub kora: brak połowy pola w obu oczach · C — skrzyżowanie: widzenie „tunelowe”</text>
<text x="20" y="150" class="s">nerw</text><text x="20" y="260" class="s">pasmo</text>
</svg>
